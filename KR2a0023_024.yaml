body:
  text: 隋書卷二十四志第十九食貨王者量地以制邑度地以居人總土地所生料山澤之利式遵行令敬授人時農商趣向各本事業書稱懋遷有無言穀貨流通咸得其所者也周官太府掌九貢九賦之法王之經用各有等差所謂取之以道用之有節故能養百官之政勗戰士之功救天災服方外活國安人之大經也爰自軒頊至于堯舜皆因其所利而勸之因其所欲而化之不奪其時不窮其力輕其征薄其賦此五帝三皇不易之教也古語曰善為人者愛其力而成其財若使之不以道斂之如不及財盡則怨力盡則叛昔禹制九等而康歌興周人十一而頌聲作於是東周遷洛諸侯不軌魯宣初稅畝鄭産為丘賦先王之制靡有孑遺秦氏起自西戎力正天下驅之以刑罰棄之以仁恩以太半之收長城絶於地脈以頭會之斂屯戍窮於嶺外漢高祖承秦凋敝十五稅一中元繼武府釰彌殷世宗得之用成雄侈開邊擊胡蕭然咸罄宮宇捫於天漢巡遊跨於海表旱歲除道凶年嘗秣戶口以之減半盜賊以之公行於是譎詭賦稅異端俱起賦及童算至船車光武中興聿遵前事成賦單薄足稱經遠靈帝開鴻都之榜通賣官之路公卿州郡各有等差漢之常科土貢方物帝又遣先輸中署名為導行天下賄成人受其敝自魏晉二十一帝宋齊十有五主雖用度有衆寡租賦有重輕大抵不能傾人産業道關政亂隋文帝既平江表天下大同躬先儉約以事府帑開皇十七年戶口滋盛中外倉庫無不盈積所有賚給不踰經費京司帑屋既充積於廊廡之下高祖遂停此年正賦以賜黎元煬皇嗣守鴻基國家殷富雅愛宏玩肆情方騁初造東都窮諸巨麗帝昔居藩翰親平江左兼以梁陳曲折以就規摹曾雉踰芒浮橋跨洛金門象闕咸竦飛觀頽巖塞川構成雲綺移嶺樹以為林藪包芒山以為苑囿長城御河不計於人力運驢武馬指期於百姓天下死於役而家傷於財既而一討渾庭三駕遼澤天子親伐師兵大舉飛糧挽秣水陸交至疆埸之所傾敗勞敝之所殂殞雖復太半不歸而每年興發比屋良家之子多赴於邊陲分離哭泣之聲連響於州縣老弱耕稼不足以救飢餒婦工紡績不足以贍資裝九區之內鸞和歲動從行宮掖常十萬人所有供須皆仰州縣租賦之外一切徵斂趣以周備不顧元元吏因割剝盜其太半遐方珍膳必登庖翔禽毛羽用為玩飾買以供官千倍其價人愁不堪離棄室宇長吏叩扉而達曙猛犬迎吠而終夕自燕趙跨於齊韓江淮入於襄鄧東周洛邑之地西秦隴山之右僭偽交侵盜賊充斥宮觀鞠為茂草鄉亭絶其煙火人相啖食十而四五關中癘疫炎旱傷稼代王開永豐之粟以振飢人去倉數百里老幼雲集吏在貪殘官無攸次咸資鏹貨動移旬月頓臥墟野欲返不能死人如積不可勝計雖復皇王撫運天祿有終而隋氏之亡亦由於此馬遷為平準書班固述食貨志上下數千載損益粗舉自此史官曾無概見夫厥初生人食貨為本聖王割廬井以業之通貨財以富之富而教之仁義以之興貧而為盜刑罰不能止故為食貨志用編前書之末云晉自中原喪亂元帝寓居江左百姓之自拔南奔者並謂之僑人皆取舊壤之名僑立郡縣往往散居無有土著而江南之俗火耕水耨土地卑濕無有蓄積之資諸蠻陬俚洞霑沐王化者各隨輕重收其賧物以裨國用又嶺外酋帥因生口翡翠明珠犀象之饒雄於鄉曲者朝廷多因而署之以收其利歷宋齊梁陳皆因而不改其軍國所須雜物隨土所出臨時折課市取乃無法定令列州郡縣制其任土所出以為徵賦其無貫之人不樂州縣編戶者謂之浮浪人樂輸亦無定數任量準所輸終優於正課焉都下人多為諸王公貴人左右佃客典計衣食客之類皆無課役官品第一第二佃客無過四十戶第三品三十五戶第四品三十戶第五品二十五戶第六品二十戶第七品十五戶第八品十戶第九品五戶其佃穀皆與大家量分其典計官品第一第二置三人第三第四置二人第五第六及公府參軍殿中監監軍長史司馬部曲督關外侯材官議郎已上一人皆通在佃客數中官品第六已上並得衣食客三人第七第八二人第九品及輿輦迹禽前驅由基強弩司馬羽林郎殿中冗從武賁殿中武賁持椎斧武騎武賁持鈒冗從武賁命中武賁武騎一人客皆注家籍其課丁男調布絹各二丈絲三兩綿八兩祿絹八尺祿綿三兩二分租米五石祿米二石丁女並半之男女年十六已上至六十為丁男年十六亦半課年十八正課六十六免課女以嫁者為丁若在室者年二十乃為丁其男丁每歲役不過二十日又率十八人出一運丁役之其田畝稅米二斗蓋大率如此其度量斗則三斗當今一斗稱則三兩當今一兩尺則一尺二寸當今一尺其倉京都有龍首倉即石頭津倉也臺城內倉南塘倉常平倉東西太倉東宮倉所貯總不過五十餘萬在外有豫章倉釣磯倉錢塘倉並是大貯備之處自餘諸州郡臺傳亦各有倉大抵自侯景之亂國用常褊京官文武月別唯得釰食多遙帶一郡縣官而取其祿秩焉揚徐等大州比令僕班寧桂等小州比參軍班丹陽吳郡會稽等郡同太子詹事尚書班高涼晉康等小郡三班而已大縣六班小縣兩轉方至一班品第既殊不可委載州郡縣祿米絹布絲綿當處輸臺傳倉庫若給刺史守令等先準其所部文武人物多少由敕而裁凡如此祿秩既通所部兵士給之其家所得蓋少諸王諸主出閣就第婚冠所須及衣裳服飾并酒米魚鮭香油紙燭等並官給之王及主壻外祿者不給解任還京仍亦公給云魏自永安之後政道陵夷寇亂實繁農商失業官有征伐皆權調於人猶不足以相資奉乃令所在迭相糾發百姓愁怨無復聊生尋而六鎮擾亂相率內徙寓食於齊晉之郊齊神武因之以成大業魏武西遷連年戰爭河洛之間又並空竭天平元年遷都於鄴出粟一百三十萬石以振貧人是時六坊之衆從武帝而西者不能萬人餘皆北徙並給常釰春秋二時賜帛以供衣服之費常調之外逐豐稔之處折絹糴粟以充國儲於諸州緣河津濟皆官倉貯積以擬漕運於滄瀛幽青四州之境傍海置鹽官以煮鹽每歲收錢軍國之資得以周贍自是之後倉釰充實雖有水旱凶飢之處皆仰開倉以振之元象興和之中頻歲大穰穀斛至九錢是時法網寬弛百姓多離舊居闕於徭賦神武乃命孫騰高隆之分括無籍之戶得六十餘萬於是僑居者各勒還本屬是後租調之入有加焉及文襄嗣業侯景背叛河南之地困於兵革尋而侯景亂梁乃命行臺辛術略有淮南之地其新附州郡羈縻輕稅而已及文宣受禪多所創革六坊之內徙者更加簡練每一人必當百人任其臨陳必死然後取之謂之百保鮮卑又簡華人之勇力絶倫者謂之勇士以備邊要始立九等之戶富者稅其錢貧者役其力北興長城之役南有金陵之戰其後南征諸將頻歲陷沒士馬死者以數十萬計重以修創臺殿所役甚廣而帝刑罰酷濫吏道因而成姦豪黨兼並戶口益多隱漏舊制未娶者輸半牀租調陽翟一郡戶至數萬籍多無妻有司劾之帝以為生事由是姦欺尤甚戶口租調十亡六七是時用度轉廣賜與無節府藏之積不足以供乃減百官之祿撤軍人常釰併省州郡縣鎮戍之職又制刺史守宰行兼者並不給幹以節國之費用焉天保八年議徙冀定瀛無田之人謂之樂遷於幽州范陽寬鄉以處之百姓驚擾屬以頻歲不熟米糴踊貴矣廢帝乾明中尚書左丞蘇珍芝議修石鱉等屯歲收數萬石自是淮南軍防糧釰充足孝昭皇建中平州刺史嵇曄建議開幽州督亢舊陂長城左右營屯歲收稻粟數十萬石北境得以周贍又於河內置懷義等屯以給河南之費自是稍止轉輸之勞至河清三年定令乃命人居十家為比鄰五十家為閭里百家為族黨男子十八以上六十五已下為丁十六已上十七已下為中六十六已上為老十五已下為小率以十八受田輸租調二十充兵六十免力役六十六退田免租調京城四面諸坊之外三十里內為公田受公田者三縣代遷戶執事官一品已下逮于羽林武賁各有差其外畿郡華人官第一品已下羽林武賁已上各有差職事及百姓請墾田者名為永業田奴婢受田者親王止三百人嗣王止二百人第二品嗣王已下及庶姓王止一百五十人正三品已上及皇宗止一百人七品已上限止八十人八品已下至庶人限止六十人奴婢限外不給田者皆不輸其方百里外及州人一夫受露田八十畝婦四十畝奴婢依良人限數與在京百官同丁牛一頭受田六十畝限止四牛又每丁給永業二十畝為桑田其中種桑五十根榆三根棗五根不在還受之限非此田者悉入還受之分土不宜桑者給麻田如桑田法率人一牀調絹一匹綿八兩凡十斤綿中折一斤作絲墾租二石義租五斗奴婢各準良人之半牛調二尺墾租一斗義租五升墾租送臺義租納郡以備水旱墾租皆依貧富為三梟其賦稅常調則少者直出上戶中者及中戶多者及下戶上梟輸遠處中梟輸次遠下梟輸當州倉三年一校焉租入臺者五百里內輸粟五百里外輸米入州鎮者輸粟人欲輸錢者準上絹收錢諸州郡皆別置富人倉初立之日準所領中下戶口數得支一年之糧逐當州穀價賤時斟量割當年義租充入穀貴下價糶之賤則還用所糶之物依價糴貯每歲春月各依鄉土早晚課人農桑自春及秋男十五已上皆布田畝桑蠶之月婦女十五已上皆營蠶桑孟冬刺史聽審邦教之優劣定殿最之科品人有人力無牛或有牛無力者須令相便皆得納種使地無遺利人無遊手焉緣邊城守之地堪墾食者皆營屯田置都使子使以統之一子使當田五十頃歲終考其所入以論褒貶是時頻歲大水州郡多遇沉溺穀價騰踊朝廷遣使開倉從貴價以糶之而百姓無益飢饉尤甚重以疾疫相乘死者十四五焉至天統中又毀東宮造修文偃武隆基嬪嬙諸院起玳瑁樓又於遊豫園穿池周以列館中起三山構臺以象滄海並大修佛寺勞役巨萬計財用不給乃減朝士之祿斷諸曹糧膳及九州軍人常賜以供之武平之後權幸並進賜與無限加之旱蝗國用轉屈乃料境內六等富人調令出錢而給事黃門侍郎顏之推奏請立關市邸店之稅開府鄧長顒贊成之後主大悅於是以其所入以供御府聲色之費軍國之用不豫焉未幾而亡後周太祖作相創制六官載師掌任土之法辨夫家田里之數會六畜車乘之稽審賦役斂弛之節制畿疆修廣之域頒施惠之要審牧産之政司均掌田里之政令凡人口十已上宅五畝口九已上宅四畝口五已下宅三畝有室者田百四十畝丁者田百畝司賦掌功賦之政令凡人自十八以至六十有四與輕癃者皆賦之其賦之法有室者歲不過絹一匹綿八兩粟五斛丁者半之其非桑土有室者布一匹麻十斤丁者又半之豐年則全賦中年半之下年一之皆以時徵焉若艱凶札則不徵其賦司役掌力役之政令凡人自十八以至五十有九皆任於役豐年不過三旬中年則二旬下年則一旬凡起徒役無過家一人其人有年八十者一子不從役百年者家不從役廢疾非人不養者一人不從役若凶札又無力征掌鹽掌四鹽之政令一曰散鹽海以成之二曰盬鹽引池以化之三曰形鹽物地以出之四曰飴鹽於戎以取之凡盬鹽形鹽每地為之禁百姓取之皆稅焉司倉掌辨九穀之物以量國用國用足即蓄其餘以待凶荒不足則止餘用足則以粟貸人春頒之秋斂之閔帝元年初除市門稅及宣帝即位復興入市之稅武帝保定元年改八丁兵為十二丁兵率歲一月役建德二年改軍士為侍官募百姓充之除其縣籍是後夏人半為兵矣宣帝時發山東諸州增一月功為四十五日役以起洛陽宮並移相州六府於洛陽稱東京六府武帝保定二年正月初於蒲州開河渠同州開龍首渠以廣溉灌高祖登庸罷東京之役除入市之稅是時尉迥王謙司馬消難相次叛逆興師誅討賞費巨萬及受禪又遷都發山東丁毀造宮室仍依周制役丁為十二番匠則六番及頒新令制人五家為保保有長保五為閭閭四為族皆有正畿外置里正比閭正黨長比族正以相檢察焉男女三歲已下為黃十歲已下為小十七已下為中十八已上為丁丁從課役六十為老乃免自諸王已下至于都督皆給永業田各有差多者至一百頃少者至四十畝其丁男中男永業露田皆遵後齊之制並課樹以桑榆及棗其園宅率三口給一畝奴婢則五口給一畝丁男一牀租粟三石桑土調以絹絁麻土以布絹絁以匹加綿三兩布以端加麻三斤單丁及僕隸各半之未受地者皆不課有品爵及孝子順孫義夫節婦並免課役京官又給職分田一品者給田五頃每品以五十畝為差至五品則為田三頃六品二頃五十畝其下每品以五十畝為差至九品為一頃外官亦各有職分田又給公廨田以供公用開皇三年正月帝入新宮初令軍人以二十一成丁減十二番每歲為二十日役減調絹一匹為二丈先是尚依周末之弊官置酒坊收利鹽池鹽井皆禁百姓採用至是罷酒坊通鹽池鹽井與百姓共之遠近大悅是時突厥犯塞吐谷渾寇邊軍旅數起轉輸勞敝帝乃令朔州總管趙仲卿於長城以北大興屯田以實塞下又於河西勒百姓立堡營田積穀京師置常平監是時山東尚承齊俗機巧姦偽避役惰遊者十六七四方疲人或詐老詐小規免租賦高祖令州縣大索貌閲戶口不實者正長遠配而又開相糾之科大功已下兼令析籍各為戶頭以防容隱於是計帳進四十四萬三千丁新附一百六十四萬一千五百口高熲又以人間課輸雖有定分年常徵納除注多長吏肆情文帳出沒復無定簿難以推校乃為輸籍定樣請遍下諸州每年正月五日縣令巡人各隨便近五黨三黨共為一團依樣定戶上下帝從之自是姦無所容矣時百姓承平日久雖數遭水旱而戶口歲增諸州調物每歲河南自潼關河北自蒲坂達于京師相屬於路晝夜不絶者數月帝既躬履儉約六宮咸服浣濯之衣乘輿供御有故敝者隨令補用皆不改作非享燕之事所食不過一肉而已有司嘗進乾薑以布袋貯之帝用為傷費大加譴責後進香復以袋因笞所司以為後誡焉由是內外率職府帑充實百官祿賜及賞功臣皆出於豐厚焉九年陳平帝親御朱雀門勞凱旋師因行慶賞自門外夾道列布帛之積達于南郭以次頒給所費三百餘萬段帝以江表初定給復十年自餘諸州並免當年租賦十年五月又以宇內無事益寬徭賦百姓年五十者輸庸停防十一年江南又反越國公楊素討平之師還賜物甚廣其餘出師命賞亦莫不優隆十二年有司上言庫藏皆滿帝曰朕既薄賦於人又大經賜用何得爾也對曰用處常出納處常入略計每年賜用至數百萬段曾無減損於是乃更闢左藏之院構屋以受之下詔曰既富而教方知廉恥寧積於人無藏府庫河北河東今年田租三分減一兵減半功調全免時天下戶口歲增京輔及三河地少而人衆衣食不給議者咸欲徙就寬鄉其年冬帝命諸州考使議之又令尚書以其事策問四方貢士竟無長算帝乃發使四出均天下之田其狹鄉每丁才至二十畝老小又少焉十三年帝命楊素出於岐州北造仁壽宮素遂夷山堙谷營構觀宇崇臺纍榭宛轉相屬役使嚴急丁夫多死疲敝顛仆者推填坑坎覆以土石因而築為平地死者以萬數宮成帝行幸焉時方暑月而死人相次於道素乃一切焚除之帝頗知其事甚不悅及入新宮遊觀乃喜又謂素為忠後帝以歲暮晚日登仁壽殿周望原隰見宮外磷火彌漫又聞哭聲令左右觀之報曰鬼火帝曰此等工役而死既屬年暮魂魄思歸耶乃令灑酒宣敕以呪遣之自是乃息開皇三年朝廷以京師倉釰尚虛議為水旱之備於是詔於蒲陝虢熊伊洛鄭懷邵衛汴許汝等水次十三州置募運米丁又於衛州置黎陽倉洛州置河陽倉陝州置常平倉華州置廣通倉轉相灌注漕關東及汾晉之粟以給京師又遣倉部侍郎韋瓚向蒲陝以東募人能於洛陽運米四十石經砥柱之險達于常平者免其征戍其後以渭水多沙流有深淺漕者苦之四年詔曰京邑所居五方輻湊重關四塞水陸艱難大河之流波瀾東注百川海瀆萬里交通雖三門之下或有危慮但發自小平陸運至陝還從河水入於渭川兼及上流控引汾晉舟車來去為益殊廣而渭川水力大小無常流淺沙深即成阻閡計其途路數百而已動移氣序不能往復泛舟之役人亦勞止朕君臨區宇興利除害公私之弊情實愍之故東發潼關西引渭水因藉人力開通漕渠量事計功易可成就已令工匠巡歷渠道觀地理之宜審終久之義一得開鑿萬代無毀可使官及私家方舟巨舫晨昏漕運沿泝不停旬日之功堪省億萬誠知時當炎暑動致疲勤然不有暫勞安能永逸宣告人庶知朕意焉於是命宇文愷率水工鑿渠引渭水自大興城東至潼關三百餘里名曰廣通渠轉運通利關內賴之諸州水旱凶飢之處亦便開倉賑給五年五月工部尚書襄陽縣公長孫平奏曰古者三年耕而餘一年之積九年作而有三年之儲雖水旱為災而人無菜色皆由勸導有方蓄積先備故也去年亢陽關內不熟陛下哀愍黎元甚於赤子運山東之粟置常平之官開發倉釰普加賑賜少食之人莫不豐足鴻恩大德前古未比其強宗富室家道有餘者皆競出私財遞相賙贍此乃風行草偃從化而然但經國之理須存定式於是奏令諸州百姓及軍人勸課當社共立義倉收穫之日隨其所得勸課出粟及麥於當社造倉窖貯之即委社司執帳檢校每年收積勿使損敗若時或不熟當社有飢饉者即以此穀賑給自是諸州儲峙委積其後關中連年大旱而青兗汴許曹亳陳仁譙豫鄭洛伊潁邳等州大水百姓飢饉高祖乃命蘇威等分道開倉賑給又命司農丞王亶發廣通之粟三百餘萬石以拯關中又發故城中周代舊粟賤糶與人買牛驢六千餘頭分給尤貧者令往關東就食其遭水旱之州皆免其年租賦十四年關中大旱人飢上幸洛陽因令百姓就食從官並準見口賑給不以官位為限明年東巡狩因祠泰山是時義倉貯在人間多有費損十五年二月詔曰本置義倉止防水旱百姓之徒不思久計輕爾費損於後乏絶又北境諸州異於餘處雲夏長靈鹽蘭豐鄯涼甘瓜等州所有義倉雜種並納本州若人有旱儉少糧先給雜種及遠年粟十六年正月又詔秦疊成康武文芳宕旭洮岷渭紀河廓豳隴涇寧原敷丹延綏銀扶等州社倉並於當縣安置二月又詔社倉準上中下三等稅上戶不過一石中戶不過七斗下戶不過四斗其後山東頻年霖雨嵵宋陳颶曹戴譙潁等諸州達于滄海皆困水災所在沉溺十八年天子遣使將水工巡行川源相視高下發隨近丁以疏導之困乏者開倉賑給前後用穀五百餘石遭水之處租調皆免自是頻有年矣開皇八年五月高熲奏諸州無課調處及課州管戶數少者官人祿力乘前已來出隨近之州但判官本為牧人役力理出所部請於所管戶內計戶徵稅帝從之先是京官及諸州並給公廨錢回易生利以給公用至十四年六月工部尚書安平郡公蘇孝慈等以為所在官司因循往昔以公廨錢物出舉興生唯利是求煩擾百姓敗損風俗莫斯之甚於是奏皆給地以營農回易取利一皆禁止十七年十一月詔在京及在外諸司公廨在市回易及諸處興生並聽之唯禁出舉收利云煬帝即位是時戶口益多府庫盈溢乃除婦人及奴婢部曲之課男子以二十二成丁始建東都以尚書令楊素為營作大監每月役丁二百萬人徙洛州郭內人及天下諸州富商大賈數萬家以實之新置興洛及回洛倉又於皂澗營顯仁宮苑囿連接北至新安南及飛山西至澠池周圍數百里課天下諸州各貢草木花果奇禽異獸於其中開渠引穀洛水自苑西入而東注于洛又自板渚引河達于淮海謂之御河河畔築御道樹以柳又命黃門侍郎王弘上儀同於士澄往江南諸州採大木引至東都所經州縣遞送往返首尾相屬不絶者千里而東都役使促迫僵仆而斃者十四五焉每月載死丁東至城臯北至河陽車相望於道時帝將事遼碣增置軍府掃地為兵自是租賦之入益減矣又造龍舟鳳咨黃龍赤艦樓船篾舫募諸水工謂之殿腳衣錦行執青絲纜挽船以幸江都帝御龍舟文武官五品已上給樓船九品已上給黃篾舫舳艫相接二百餘里所經州縣並令供頓獻食豐辦者加官爵闕乏者譴至死又盛修車輿輦輅旌旗羽儀之飾課天下州縣凡骨角齒牙皮革毛羽可飾器用堪為氅毦者皆責焉徵發倉卒朝命夕辦百姓求捕網罟遍野水陸禽獸殆盡猶不能給而買於豪富蓄積之家其價騰踊是歲翟雉尾一直十縑白鷺鮮半之乃使屯田主事常駿使赤土國致羅剎又使朝請大夫張鎮州擊流求俘虜數萬士卒深入蒙犯瘴癘餒疾而死者十八九又以西域多諸寶物令裴矩往張掖監諸商胡互市啖之以利勸令入朝自是西域諸蕃往來相繼所經州郡疲於送迎縻費以萬萬計明年帝北巡狩又興衆百萬北築長城西距榆林東至紫河綿亘千餘里死者太半四年發河北諸郡百餘萬衆引沁水南達于河北通涿郡自是以丁男不供始以婦人從役五年西巡河右西域諸胡佩金玉被錦罽焚香奏樂迎候道左帝乃令武威張掖士女盛飾縱觀衣服車馬不鮮者州縣督課以誇示之其年帝親征吐谷渾破之於赤水慕容佛允委其家屬西奔青海帝駐兵不出遇天霖雨經大斗拔谷士卒死者十二三焉馬驢十八九於是置河源郡積石鎮又於西域之地置西海鄯善且末等郡謫天下罪人配為戍卒大開屯田發西方諸郡運糧以給之道里懸遠兼遇寇抄死亡相續六年將征高麗有司奏兵馬已多損耗詔又課天下富人量其資産出錢市武馬填元數限令取足復點兵具器仗皆令精新濫惡則使人便斬於是馬匹至十萬七年冬大會涿郡分江淮南兵配驍衛大將軍來護兒別以舟師濟滄海舳艫數百里並載軍糧期與大兵會平壤是歲山東河南大水漂沒四十餘郡重以遼東覆敗死者數十萬因屬疫疾山東尤甚所在皆以徵斂供帳軍旅所資為務百姓雖困而弗之恤也每急徭卒賦有所徵求長吏必先賤買之然後宣下乃貴賣與人旦暮之間價盈數倍裒刻徵斂取辦一時強者聚而為盜弱者自賣為奴婢九年詔又課關中富人計其資産出驢往伊吾河源且末運糧多者至數百頭每頭價至萬餘又發諸州丁分為四番於遼西柳城營屯往來艱苦生業盡罄盜賊四起道路南絶隴右牧馬盡為奴賊所掠楊玄感乘虛為亂時帝在遼東聞之遽歸于高陽郡及玄感平帝謂侍臣曰玄感一呼而從者如市益知天下人不欲多多則為賊不盡誅後無以示勸乃令裴蘊窮其黨與詔郡縣坑殺之死者不可勝數所在驚駭舉天下之人十分九為盜賊皆盜武馬始作長槍攻陷城邑帝又命郡縣置督捕以討賊益遣募人征遼馬少不充八馱而許為六馱又不足聽半以驢充在路逃者相繼執獲皆斬之而莫能止帝不懌遇高麗執送叛臣斛斯政遣使求降發詔赦之囚政至于京師於開遠門外磔而射殺之遂幸太原為突厥圍於雁門突厥尋散遽還洛陽募益驍果以充舊數是時百姓廢業屯集城堡無以自給然所在倉庫猶大充牣吏皆懼法莫肯賑救由是益困初皆剝樹皮以食之漸及於葉皮葉皆盡乃煮土或搗䤝為末而食之其後人乃相食十二年帝幸江都是時李密據洛口倉聚衆百萬越王侗與段達等守東都東都城內糧盡布帛山積乃以絹為汲綆然布以爨代王侑與衛玄守京師百姓飢饉亦不能救義師入長安發永豐倉以賑之百姓方蘇息矣晉自過江凡貨賣奴婢馬牛田宅有文券率錢一萬輸估四百入官賣者三百買者一百無文券者隨物所堪亦百分收四名為散估歷宋齊梁陳如此以為常以此人競商販不為田業故使均輸欲為懲勵雖以此為辭其實利在侵削又都西有石頭津東有方山津各置津主一人賊曹一人直水五人以檢察禁物及亡叛者其荻炭魚薪之類過津者並十分稅一以入官其東路無禁貨故方山津檢察甚簡淮水北有大市百餘小市十餘所大市備置官司稅斂既重時甚苦之梁初唯京師及三吳荊郢江湘梁益用錢其餘州郡則雜以穀帛交易交廣之域全以金銀為貨武帝乃鑄錢肉好周郭文曰五銖重如其文而又別鑄除其肉郭謂之女錢二品並行百姓或私以古錢交易有直百五銖五銖女錢太平百錢定平一百五銖雉錢五銖對文等號輕重不一天子頻下詔書非新鑄二種之錢並不許用而趣利之徒私用轉甚至普通中乃議盡罷銅錢更鑄鐵錢人以鐵賤易得並皆私鑄及大同已後所在鐵錢遂如丘山物價騰貴交易者以車載錢不復計數而唯論貫商旅姦詐因之以求利自破嶺以東八十為百名曰東錢江郢已上七十為百名曰西錢京師以九十為百名曰長錢中大同元年天子乃詔通用足陌詔下而人不從錢陌益少至于末年遂以三十五為百云陳初承梁喪亂之後鐵錢不行始梁末又有兩柱錢及鵝眼錢于時人雜用其價同但兩柱重而鵝眼輕私家多鎔錢又間以錫鐵兼以粟帛為貨至文帝天嘉五年改鑄五銖初出一當鵝眼之十宣帝太建十一年又鑄大貨六銖以一當五銖之十與五銖並行後還當一人皆不便乃相與訛言曰六銖錢有不利縣官之象未幾而帝崩遂廢六銖而行五銖竟至陳亡其嶺南諸州多以鹽米布交易俱不用錢云齊神武霸政之初承魏猶用永安五銖遷鄴已後百姓私鑄體制漸別遂各以為名有雍州青赤梁州生厚緊錢吉錢河陽生澀天柱赤牽之稱冀州之北錢皆不行交貿者皆以絹布神武帝乃收境內之銅及錢仍依舊文更鑄流之四境未幾之間漸復細薄姦偽競起文宣受禪除永安之錢改鑄常平五銖重如其文其錢甚貴且制造甚精至乾明皇建之間往往私鑄鄴中用錢有赤熟青熟細眉赤生之異河南所用有青薄鉛錫之別青齊徐兗梁豫州輩類各殊武平已後私鑄轉甚或以生鐵和銅至于齊亡卒不能禁後周之初尚用魏錢及武帝保定元年七月及更鑄布泉之錢以一當五與五銖並行時梁益之境又雜用古錢交易河西諸郡或用西域金銀之錢而官不禁建德三年六月更鑄五行大布錢以一當十大收商估之利與布泉錢並行四年七月又以邊境之上人多盜鑄乃禁五行大布不得出入四關布泉之錢聽入而不聽出五年正月以布泉漸賤而人不用遂廢之初令私鑄者絞從者遠配為戶齊平已後山東之人猶雜用齊氏舊錢至宣帝大象元年十一月又鑄永通萬國錢以一當十與五行大布及五銖凡三品並用高祖既受周禪以天下錢貨輕重不等乃更鑄新錢背面肉好皆有周郭文曰五銖而重如其文每錢一千重四斤二兩是時錢既新出百姓或私有鎔鑄三年四月詔四面諸關各付百錢為樣從關外來勘樣相似然後得過樣不同者即壞以為銅入官詔行新錢已後前代舊錢有五行大布永通萬國及齊常平所在用以貿易不止四年詔仍依舊不禁者縣令奪半年祿然百姓習用既久尚猶不絶五年正月詔又嚴其制自是錢貨始一所在流布百姓便之是時見用之錢皆須和以錫鑞錫鑞既賤求利者多私鑄之錢不可禁約其年詔乃禁出錫鑞之處並不得私有採取十年詔晉王廣聽於揚州立五爐鑄錢其後姦狡稍漸磨鑢錢郭取銅私鑄又雜以錫錢遞相放效錢遂輕薄乃下惡錢之禁京師及諸州邸肆之上皆令立榜置樣為準不中樣者不入於市十八年詔漢王諒聽於並州立五鑢鑄錢是時江南人間錢少晉王廣又聽於鄂州白紵山有銅處錮銅鑄錢於是詔聽置十爐鑄錢又詔蜀王秀聽於益州立五爐鑄錢是時錢益濫惡乃令有司括天下邸肆見錢非官鑄者皆毀之其銅入官而京師以惡錢貿易為吏所執有死者數年之間私鑄頗息大業已後王綱弛紊巨姦大猾遂多私鑄錢轉薄惡初每千猶重二斤後漸輕至一斤或翦鐵鍱裁皮糊紙以為錢相雜用之貨賤物貴以至於亡

body:
  text: 隋書卷十六志第十一律曆上自夫有天地焉有人物焉樹司牧以君臨懸政教而成務莫不擬乾坤之大象稟中和以建極揆影響之幽賾成律呂之精微是用範圍百度財成萬品昔者淳古葦籥創覩人籟之源女媧笙簧仍昭鳳律之首後聖廣業稽古彌崇伶倫含少乃擅比竹之工虞舜昭華方傳刻玉之美是以書稱叶時月正日同律度量衡又曰豫欲聞六律五聲八音七始訓以出納五言此皆候金常而列管憑璿璣以運鈞統三極之元紀七衡之響可以作樂崇德殷薦上帝故能動天地感鬼神和人心移風俗考得失徵成敗者也粵在夏商無聞改作其於周禮典同則掌六律六同之和以辨天地四方陰陽之聲以為樂器景王鑄鍾問律於泠州鳩對曰夫律者所以立鈞出度鈞有五則權衡規矩準繩咸備故詩曰尹氏太師執國之鈞天子是裨俾衆不迷是也太史公律書云王者制事立物法度軌則一稟於六律為萬事之本其於兵械尤所重焉故云望敵知吉凶聞聲效勝負百王不易之道也及秦氏滅學其道浸微漢室初興丞相張蒼首言音律未能審備孝武帝創置協律之官司馬遷言律呂相生之次詳矣及王莽之際考論音律劉歆條奏班固因志之蔡雍又記建武以後言律呂者司馬紹統採而續之炎歷將終而天下大亂樂工散亡器法湮滅魏武始獲杜夔使定音律夔依當時尺度權備典章及晉武受命遵而不革至泰始十年光祿大夫荀勗奏造新度更鑄律呂元康中勗子藩復嗣其事未及成功屬永嘉之亂中朝典章咸沒於石勒及帝南遷皇度草昧禮容樂器掃地皆盡雖稍加採掇而多所淪胥終于恭安竟不能備宋錢樂之衍京房六十律更增為三百六十梁博士沈重述其名數後魏周齊時有論者今依班志編録五代聲律度量以志于篇云漢志言律一曰備數二曰和聲三曰審度四曰嘉量五曰衡權自魏晉已降代有沿革今列其增損之要云備數五數者一十百千萬也傳曰物生而後有象滋而後有數是以言律者云數起於建子黃鍾之律始一而每辰三之歷九辰至酉得一萬九千六百八十三而五數備成以為律法又參之終亥凡歷十二辰得十有七萬七千一百四十七而辰數該矣以為律積以成法除該積得九寸即黃鍾宮律之長也此則數因律起律以數成故可歷管萬事綜核氣象其算用竹廣二分長三寸正策三廉積二百一十六枚成六觚乾之策也負策四廉積一百四十四枚成方坤之策也觚方皆經十二天地之大數也是故探賾索隱鈎深致遠莫不用焉一十百千萬所同由也律度量衡歷率其別用也故體有長短檢之以度則不失毫釐物有多少受之以器則不失圭撮量有輕重平之以權衡則不失黍絲聲有清濁協之以律呂則不失宮商三光運行紀以曆數則不差晷刻事物糅見御之以率則不乖其本故幽隱之情精微之變可得而綜也夫所謂率者有九流焉一曰方田以御田疇界域二曰粟米以御交質變易三曰衰分以御貴賤稅四曰少廣以御積冪方圓五曰商功以御功程積實六曰均輸以御遠近勞費七曰盈朒以御隱雜互見八曰方程以御錯糅正負九曰句股以御高深廣遠皆乘以散之除以聚之齊同以通之今有以貫之則算數之方盡於斯矣古之九數圓周率三圓徑率一其術疏舛自劉歆張衡劉徽王蕃皮延宗之徒各設新率未臻折衷宋末南徐州從事史祖沖之更開密法以圓徑一億為一丈圓周盈數三丈一尺四寸一分五釐九毫二秒七忽朒數三丈一尺四寸一分五釐九毫二秒六忽正數在盈朒二限之間密率圓徑一百一十三圓周三百五十五約率圓徑七周二十二又設開差冪開差立兼以正圓參之指要精密算氏之最者也所著之書名為綴術學官莫能究其深奧是故廢而不理和聲傳稱黃帝命伶倫斷竹長三寸九分而吹以為黃鍾之宮曰含少次制十二管以聽鳳鳴以別十二律比雌雄之聲以分律呂上下相生因黃鍾為始虞書云叶時月正日同律度量衡夏禹受命以聲為律以身為度周禮樂器以十二律為之度數司馬遷律書云黃鍾長八寸七分之一太簇長七寸七分二林鍾長五寸七分三應鍾長四寸三分二此樂之三始十二律之本末也班固司馬彪律志黃鍾長九寸聲最濁太簇長八寸林鍾長六寸應鍾長四寸七分四釐強聲最清鄭玄禮月令注蔡雍月令章句及杜夔荀勗等所論雖尺有增損而十二律之寸數並同漢志京房又以隔八相生一始自黃鍾終於中呂十二律畢矣中呂上生黃鍾不滿九寸謂之執始下生去滅上下相生終於南事更增四十八律以為六十其依行在辰上生包育隔九編於冬至之後分焉遲內其數遂減應鍾之清宋元嘉中太史錢樂之因京房南事之餘引而伸之更為三百律終於安運長四寸四分有奇總合舊為三百六十律日當一管宮徵旋韻各以次從何承天立法制議云上下相生三分損益其一蓋是古人簡易之法猶如古曆周天三百六十五度四分之一後人改制皆不同焉而京房不悟謬為六十承天更設新率則從中呂還得黃鍾十二旋宮聲韻無失黃鍾長九寸太簇長八寸二釐林鍾長六寸一釐應鍾長四寸七分九釐強其中呂上生所益之分還得十七萬七千一百四十七復十二辰參之數梁初因晉宋及齊無所改制其後武帝作鍾律緯論前代得失其略云案律呂京馬鄭蔡至蕤賓並上生大呂而班固律曆志至蕤賓仍以次下生若從班義夾鍾唯長三寸七分有奇律若過促則夾鍾之聲成一調中呂復去調半是過於無調仲春孟夏正相長養其氣舒緩不容短促求聲索實班義為乖鄭玄又以陰陽六位次第相生若如玄義陰陽相逐生者止是升陽其降陽復將何寄就筮數而論乾主甲壬而左行坤主乙癸而右行故陰陽得有升降之義陰陽從行者真性也六位升降者象數也今鄭乃執象數以配真性故言比而理窮云九六相生了不釋十二氣所以相通鄭之不思亦已明矣案京房六十準依法推乃自無差但律呂所得或五或六此一不例也而分焉上生乃復遲內上生盛變盛變仍復上生分居此二不例也房妙盡陰陽其當有以若非深理難求便是傳者不習比勑詳求莫能辨正聊以餘日試推其旨參校舊器及古夾鍾玉律更制新尺以證分毫制為四器名之為通四器絃間九尺臨嶽高一寸二分黃鍾之絃二百七十絲長九尺以次三分損益其一以生十二律之絃絲數及絃長各以律本所建之月五行生王終始之音相次之理為其名義名之為通通施三絃傳推月氣悉無差舛即以夾鍾玉律命之則還相中又制為十二笛以寫通聲其夾鍾笛十二調以飲玉律又不差異山謙之記云殿前三鍾悉是周景王所鑄無射也遣樂官以今無射新笛飲不相中以夷則笛飲則聲韻合和端門外鍾亦案其銘題定皆夷則其西廂一鍾天監中移度東以今笛飲乃中南呂驗其鐫刻乃是太簇則下今笛二調重勑太樂丞斯宣達令更推校鍾定有鑿處表𩹉皆然借訪舊識乃是宋泰始中使張永鑿之去銅既多故其調嘽下以推求鍾律便可得而見也宋武平中原使將軍陳傾致三鍾小大中各一則今之太極殿前二鍾端門外一鍾是也案西鍾銘則云清廟撞鍾秦無清廟此周制明矣又一銘云太簇鍾徵則林鍾宮所施也京房推用似有由也檢題既無秦漢年代直云夷則太簇則非秦漢明矣古人性質故作僮僕字則題而言彌驗非近且夫驗聲改政則五音六律非可差舛工守其音儒執其文歷年永久隔而不通無論樂奏求之多缺假使具存亦不可用周頌漢歌各敘功德豈容復施後王以濫名實今率詳論以言所見並詔百司以求厥中未及改制遇侯景亂陳氏制度亦無改作西魏廢帝元年周文攝政又詔尚書蘇綽詳正音律綽時得宋尺以定諸管草創未就會閔帝受禪政由冢宰方有齊寇事竟不行後掘太倉得古玉斗按以造律及衡其事又多湮沒至開皇初詔太常牛弘議定律呂於是博徵學者序論其法又未能決遇平江右得陳氏律管十有二枚並以付弘遣曉音律者陳山陽太守毛爽及太樂令蔡子元于普明等以候節氣作律譜時爽年老以白衣見高祖授淮州刺史辭不赴官因遣協律郎祖孝孫就其受法弘又取此管吹而定聲既天下一統異代器物皆集樂府曉音律者頗議考核以定鍾律更造樂器以被皇夏十四曲高祖與朝賢聽之曰此聲滔滔和雅令人舒緩然萬物人事非五行不生非五行不成非五行不滅故五音用火尺其事火重用金尺則兵用木尺則喪用土尺則亂用水尺則律呂合調天下和平魏及周齊貪布帛長度故用土尺今此樂聲是用水尺江東尺短於土長於水俗間不知者見玉作名為玉尺見鐵作名為鐵尺詔施用水尺律樂其前代金石並鑄毀之以息物議至仁壽四年劉焯上啓於東宮論張胄玄曆兼論律呂其大旨曰樂主於音音定於律音不以律不可克諧度律均鍾於是乎在但律終小呂數復黃鍾舊計未精終不復始故漢代京房妄為六十而宋代錢樂之更為三百六十考禮詮次豈有得然化未移風將恐由此匪直長短失於其差亦自管圍乖於其數又尺寸意定莫能詳考既亂管絃亦舛度量焯皆校定庶有明發其黃鍾管六十三為實以次每律減三分以七為寸法約之得黃鍾長九寸太簇長八寸一分四釐林鍾長六寸應鍾長四寸二分八釐七分之四其年高祖崩煬帝初登未遑改作事遂寢廢其書亦亡大業二年乃詔改用梁表律調鍾磬八音之器比之前代最為合古其制度文議並毛爽舊律並在江都淪喪律管圍容黍漢志云黃鍾圍九分林鍾圍六分太簇圍八分續志及鄭玄並云十二律空皆徑三分圍九分後魏安豐王依班固志林鍾空圍六分及太簇空圍八分作律吹之不合黃鍾商徵之聲皆空圍九分乃與均鍾器合開皇九年平陳後牛弘辛彥之鄭譯何妥等參考古律度各依時代制其黃鍾之管俱徑三分長九寸度有損益故聲有高下圓徑長短與度而差故容黍不同今列其數云晉前尺黃鍾容黍八百八粒梁法尺黃鍾容八百二十八梁表尺黃鍾三其一容九百二十五其一容九百一十其一容一千一百二十漢官尺黃鍾容九百三十九古銀錯題黃鍾籥容一千二百宋氏尺即鐵尺黃鍾凡二其一容一千二百其一容一千四十七後魏前尺黃鍾容一千一百一十五後周玉尺黃鍾容一千二百六十七後魏中尺黃鍾容一千五百五十五後魏後尺黃鍾容一千八百一十九東魏尺黃鍾容二千八百六十九萬寶常水尺律母黃鍾容黍一千三百二十梁表鐵尺律黃鍾副別者其長短及口空之圍徑並同而容黍或多或少皆是作者旁庣其腹使有盈虛候氣後齊神武霸府田曹參軍信都芳深有巧思能以管候氣仰觀雲色嘗與人對語即指天曰孟春之氣至矣人往驗管而飛灰已應每月所候言皆無爽又為輪扇二十四埋地中以測二十四氣每一氣感則一扇自動他扇並住與管灰相應若符契焉開皇九年平陳後高祖遣毛爽及蔡子元于普明等以候節氣依古於三重密屋之內以木為案十有二具每取律呂之管隨十二辰位置于桉上而以土埋之上平於地中實葭莩之灰以輕緹素覆律口每其月氣至與律冥符則灰飛衝素散出于外而氣應有早晚灰飛有多少或初入月其氣即應或至中下旬間氣始應者或灰飛出三五夜而盡或終一月才飛少許者高祖異之以問牛弘弘對曰灰飛半出為和氣吹灰全出為猛氣吹灰不能出為衰氣和氣應者其政平猛氣應者其臣縱衰氣應者其君暴高祖駁之曰臣縱君暴其政不平非月別而有異也今十二月律於一歲內應並不同安得暴君縱臣若斯之甚也弘不能對令爽等草定其法爽因稽諸故實以著于篇名曰律譜其略云臣爽按黃帝遣伶倫氏取竹于嶰谷聽鳳阿閣之下始造十二律焉乃致天地氣應是則數之始也陽管為律陰管為呂其氣以候四時其數以紀萬物云隸首作數蓋律之本也夫一十百千萬億兆者引而申焉曆度量衡出其中矣故有虞氏用律和聲鄒衍改之以定五始正朔服色亦由斯而別也夏正則人殷正則地周正則天孔子曰吾得夏時焉謂得氣數之要矣漢初興也而張蒼定律乃推五勝之法以為水德實因戰國官失其守後秦滅學其道浸微蒼補綴之未獲詳究及孝武創制乃置協律之官用李延年以為都尉頗解新聲變曲未達音律之源故其服色不得而定也至于元帝自曉音律郎官京房亦達其妙因使韋玄成等雜試問房房自敘云學焦延壽用六十律相生之法以上生下皆三生二以下生上皆三生四陽下生陰陰上生陽乃還相為宮之正法也於後劉歆典領條奏著其始末理漸研精班氏漢志盡歆所出也司馬彪志並房所出也至于後漢尺度稍長魏代杜夔亦制律呂以之候氣灰悉不飛晉光祿大夫荀勗得古銅管校夔所制長古四分方知不調事由其誤乃依周禮更造古尺用之定管聲韻始調左晉之後漸又訛謬至梁武帝時猶有汲冢玉律宋蒼梧時鑽為橫吹然其長短厚薄大體具存臣先人栖誠學算於祖耳幾問律於何承天沈研三紀頗達其妙後為太常丞典司樂職乃取玉管及宋太史尺並以聞奏詔付大匠依樣制管自斯以後律又飛灰侯景之亂臣兄喜於太樂得之後陳宣帝詣荊州為質俄遇梁元帝敗喜沒於周適欲上聞陳武帝立遂又以十二管衍為六十律私候氣序並有徵應至太建時喜為吏部尚書欲以聞奏會宣帝崩後主嗣立出喜為永嘉內史遂留家內貽諸子孫陳亡之際竟並遺失今正十二管在太樂者陽下生陰始於黃鍾陰上生陽終於中呂而一歲之氣畢於此矣中呂上生執始執始下生去滅終於南事六十律候畢於此矣仲冬之月律中黃鍾黃鍾者首於冬至陽之始也應天之數而長九寸十一月氣至則黃鍾之律應所以宣養六氣緝和九德也自此之後並用京房律準長短宮徵次日而用凡十二律各有所攝引而申之至于六十亦由八卦衍而重之以為六十四也相生者相變始黃鍾之管下生林鍾以陽生陰故變也相攝者相通如中呂之管攝於物應以母權子故相變者異時而各應相通者同月而繼應應有早晚者非正律氣乃子律相感寄母中應也其律大業末於江都淪喪律直日宋錢樂之因京房南事之餘更生三百律至梁博士沈重鍾律議曰易以三百六十策當期之日此律曆之數也淮南子云一律而生五音十二律而為六十音因而六之故三百六十音以當一歲之日律曆之數天地之道也此則自古而然矣重乃依淮南本數用京房之術求之得三百六十律各因月之本律以為一部以一部律數為母以一中氣所有日為子以母命子隨所多少各一律所建日辰分數也以之分配七音則建日冬至之聲黃鍾為宮太簇為商林鍾為徵南呂為羽姑洗為角應鍾為變宮蕤賓為變徵五音七聲於斯和備其次日建律皆依次類運行當日者各自為宮而商徵亦以次從以考聲徵氣辨識時序萬類所宜各順其節自黃鍾終於壯進一百五十律皆三分損一以下生自依行終於億兆二百九律皆三分益一以上生唯安運一律為終不生其數皆取黃鍾之實十七萬七千一百四十七為本以九三為法各除其實得寸分及小分餘皆委之即各其律之長也修其律部則上生下生宮徵之次也今略其名次云黃鍾包育含微帝德廣運下濟剋終執始握鑒持樞黃中通聖潛升殷普景盛滋萌光被咸亨乃文乃聖微陽分動生氣雲繁鬱湮升引屯結開元質未僾昧逋建玄中玉燭調風右黃鍾一部三十四律每律直三十四分日之三十一大呂荄動始贊大有坤元輔時匡弼分否又繁唯微棄望庶幾執義秉強陵陰侶陽識沈緝熙知道適時權變少出阿衡同雲承明善述休光右大呂一部二十七律每律直一日及二十七分日之三太簇未知其己義建亭毒條風湊始時息達生匏奏初角少陽柔橈商音屈齊扶弱承齊動植咸擢兼山止速隨期龍躍勾芒調序青要結萼延敷刑晉辨秩東作贊揚顯滯俶落右太簇一部三十四律夾鍾明庶協侶陰贊風從布政萬化開時震德乘條芬芳散朗淑氣風馳佚喜黨四隙種生恣性逍遙仁威爭南旭旦晨朝生遂羣分潔新右夾鍾一部二十七律姑洗南授懷來考神方顯攜角洗陳變虞擢穎嘉氣始升卿雲媚嶺疏道路時日旅實沈炎風首節柔條方結刑始方齊物華革荑茂實登明壯進下生安運依行上生包育少選道從朱黻揚庭含貞右姑洗一部三十四律中呂朱明啓運景風初緩羽物斯奮南中離春率農有程南訛敬致相趣內貞朱草含輝屈軼曜疇巳氣清和物應戒牟荒落貞軫天庭祚周右中呂一部二十七律蕤賓南事京房終律謐靜則選布萼滿羸潛動盛變賓安懷遠聲暨軌同海水息沴離躬安壯崇明遠眺升中鳳翥朝陽制時瑞通鶉火乂次高焰其煌右蕤賓一部二十七律林鍾謙侍崇德循道方壯陰升靡慝去滅華銷朋慶雲布均任仰成寬中安度德均無蹇禮溢智深任肅純恪歸嘉美音溫風候節蓂華繡嶺物無否與景口曜井日煥重輪財華右林鍾一部三十四律夷則升商清爽氣精陰德白藏御敘鮮刑貞剋金天劉獮會道歸仁陰侶去南陽消柔辛延乙和庚靡卉荑晉分積孔修九德咸藎僉惟俾乂右夷則一部二十七律南呂白呂捐秀敦實素風徑物酋稔結躬肥遁羸中晟陰抗節威遠有截歸期中德王猷允塞蓐收撙轡搖落未卬質隨分滿道心貞堅蓄止歸藏夷汗均義悅使亡勞九有光賁右南呂一部三十四律無射思沖懷謙恭儉休老恤農銷祥閉奄降婁藏邃日在旋春閹藏明奎鄰齊軌衆大蓄嗇斂下濟息肩無邊期保延年秋深野色玄月澄天右無射一部二十七律應鍾分焉祖微據始功成乂定靜謐遲內無為而乂姑射凝晦動寂應徵未育萬機萬壽無疆地久天長修復遲時方制無休九野八荒億兆安運右應鍾一部二十八律審度史記曰夏禹以身為度以聲為律禮記曰丈夫布手為尺周官云璧羡起度鄭司農云羡長也此璧徑尺以起度量易緯通卦驗十馬尾為一分淮南子云秋分而禾定定而禾熟律數十二而當一粟十二粟而當一寸者禾穗芒也説苑云度量權衡以粟生一粟為一分孫子算術云蠶所生吐絲為忽十忽為秒十秒為毫十毫為釐十釐為分此皆起度之源其文舛互唯漢志度者所以度長短也本起黃鍾之長以子穀秬黍中者一黍之廣度之九十黍為黃鍾之長一黍為一分十分為一寸十寸為一尺十尺為一丈十丈為一引而五度審矣後之作者又憑此説以律度量衡並因秬黍散為諸法其率可通故也黍有大小之差年有豐耗之異前代量校每有不同又俗傳訛替漸致增損今略諸代尺度一十五度並異同之説如左一周尺漢志王莽時劉歆銅斛尺後漢建武銅尺晉泰始十年荀勗律尺為晉前尺祖沖之所傳銅尺徐廣徐爰王隱等晉書云武帝泰始九年中書監荀勗校太樂八音不和始知為後漢至魏尺長於古四分有餘勗乃部著作郎劉恭依周禮制尺所謂古尺也依古尺更鑄銅律呂以調聲韻以尺量古器舉本銘尺寸無差又汲郡盜發魏襄王冢得古周時玉律及鍾磬與新律聲韻暗同于時郡國或得漢時故鍾吹新律命之皆應梁武鍾律緯云祖沖之所傳銅尺其銘曰晉泰始十年中書考古器揆校今尺長四分半所校古法有七品一曰姑洗玉律二曰小呂玉律三曰西京銅望臬四曰金錯望臬五曰銅斛六曰古錢七曰建武銅尺姑洗微強西京望臬微弱其餘與此尺同銘八十二字此尺者勗新尺也今尺者杜夔尺也雷次宗何胤之二人作鍾律圖所載荀勗校量古尺文與此銘同而蕭吉樂譜謂為梁朝所考七品謬也今以此尺為本以校諸代尺云二晉田父玉尺梁法尺實比晉前尺一尺七釐世説稱有田父於野地中得周時玉尺便是天下正尺荀勗試以校尺所造金石絲竹皆短校一米梁武帝鍾律緯稱主衣從上相承有周時銅尺一枚古玉律八枚檢主衣周尺東昏用為章信尺不復存玉律一囗蕭餘定七枚夾鍾有昔題刻乃制為尺以相參驗取細毫中黍積次酬定今之最為詳密長祖沖之尺校半分以新尺制為四器名為通又依新尺為笛以命古鍾按刻夷則以笛命飲和韻夷則定合案此兩尺長短近同三梁表尺實比晉前尺一尺二分二釐一毫有奇蕭吉云出於司馬法梁朝刻其度於影表以測影案此即奉朝請祖耳幾所算造銅圭影表者也經陳滅入朝大業中議以合古乃用之調律以制鍾磬等八音樂器四漢官尺實比晉前尺一尺三分七毫晉時始平掘地得古銅尺蕭吉樂譜云漢章帝時零陵文學史奚景於泠道縣舜廟下得玉律度為此尺傅暢晉諸公讚云荀勗造鍾律時人並稱其精密唯陳留阮咸譏其聲高後始平掘地得古銅尺歲久欲腐以校荀勗今尺短校四分時人以咸為解此兩尺長短近同五魏尺杜夔所用調律比晉前尺一尺四分七釐魏陳留王景元四年劉徽注九章云王莽時劉歆斛尺弱於今尺四分五釐比魏尺其斛深九寸五分五釐即晉荀勗所云杜夔尺長於今尺四分半是也六晉後尺實比晉前尺一尺六分二釐蕭吉云晉氏江東所用七後魏前尺實比晉前尺一尺二寸七釐八中尺實比晉前尺一尺二寸一分一釐九後尺實比晉前尺一尺二寸八分一釐即開皇官尺及後周市尺後周市尺比玉尺一尺九分三釐開皇官尺即鐵尺一尺二寸此後魏初及東西分國後周未用玉尺之前雜用此等尺甄鸞算術云周朝市尺得玉尺九分二釐或傳梁時有志公道人作此尺寄入周朝云與多鬚老翁周太祖及隋高祖各自以為謂己周朝人間行用及開皇初著令以為官尺百司用之終于仁壽大業中人間或私用之十東後魏尺實比晉前尺一尺五寸八毫此是魏中尉元延明纍黍用半周之廣為尺齊朝因而用之魏收魏史律曆志云公孫崇永平中更造新尺以一黍之長纍為寸法尋太常卿劉芳受詔修樂以秬黍中者一黍之廣即為一分而中尉元匡以一黍之廣度黍二縫以取一分三家紛競久不能決太和十九年高祖詔以一黍之廣用成分體九十之黍黃鍾之長以定銅尺有司奏從前詔而芳尺同高祖所制故遂典修金石迄武定未有論律者十一蔡雍銅籥尺後周玉尺實比晉前尺一尺一寸五分八釐從上相承有銅籥一以銀錯題其銘曰籥黃鍾之宮長九寸空圍九分容秬黍一千二百粒稱重十二銖兩之為一合三分損益轉生十二律祖孝孫云相承傳是蔡雍銅籥後周武帝保定中詔遣大宗伯盧景宣上黨公長孫紹遠岐國公斛斯徵等纍黍造尺從橫不定後因修倉掘地得古玉斗以為正器據斗造律度量衡因用此尺大赦改元天和百司行用終於大象之末其律黃鍾與蔡雍古籥同十二宋氏尺實比晉前尺一尺六分四釐錢樂之渾天儀尺後周鐵尺開皇初調鍾律尺及平陳後調鍾律水尺此宋代人間所用尺傳入齊梁陳以制樂律與晉後尺及梁時俗尺劉曜渾天儀尺略相依近當由人間用增損訛替之所致也周建德六年平齊後即以此同律度量頒于天下其後宣帝時達奚震及牛弘等議曰竊惟權衡度量經邦懋軌誠須詳求故實考校得衷謹尋今之鐵尺是太祖遣尚書故蘇綽所造當時檢勘用為前周之尺驗其長短與宋尺符同即以調鍾律並用均田度地今以上黨羊頭山黍依漢書律曆志度之若以大者稠纍依數滿尺實於黃鍾之律須撼乃容若以中者纍尺雖復小稀實於黃鍾之律不動而滿計此二事之殊良由消息未善其於鐵尺終有一會且上黨之黍有異他鄉其色至烏其形圓重用之為量定不徒然正以時有水旱之差地有肥瘠之異取黍大小未必得中案許慎解秬黍體大本異於常疑今之大者正是其中纍百滿尺即是會古實籥之外才剩十餘此恐圍徑或差造律未妙就如撼動取滿論理亦通今勘周漢古錢大小有合宋氏渾儀尺度無舛又依淮南纍粟十二成寸明先王制法索隱鈎深以律計分義無差異漢書食貨志云黃金方寸其重一斤今鑄金校驗鐵尺為近依文據理符會處多且平齊之始已用宣布今因而為定彌合時宜至於玉尺纍黍以廣為長纍既有剩實復不滿尋訪古今恐不可用其晉梁尺量過為短小以黍實管彌復不容據律調聲必致高急且八音克諧明王盛範同律度量哲后通規臣等詳校前經斟量時事謂用鐵尺於理為便未及詳定高祖受終牛弘辛彥之鄭譯何妥等久議不決既平陳上以江東樂為善曰此華夏舊聲雖隨俗改變大體猶是古法祖孝孫云平陳後廢周玉尺律便用此鐵尺律以一尺二寸即為市尺十三開皇十年萬寶常所造律呂水尺實比晉前尺一尺一寸八分六釐今太樂庫及內出銅律一部是萬寶常所造名水尺律説稱其黃鍾律當鐵尺南呂倍聲南呂黃鍾羽也故謂之水尺律十四雜尺趙劉曜渾天儀土圭尺長於梁法尺四分三釐實比晉前尺一尺五分十五梁朝俗間尺長於梁法尺六分三釐於劉曜渾儀尺二分實比晉前尺一尺七分一釐梁武鍾律緯云宋武平中原送渾天儀土圭云是張衡所作驗渾儀銘題是光初四年鑄土圭是光初八年作並是劉曜所制非張衡也制以為尺長今新尺四分三釐短俗間尺二分新尺謂梁法尺也嘉量周禮石函氏為量釜深尺內方尺而圓其外其實一釜其臀一寸其實一豆其耳三寸其實一升重一鈞其聲中黃鍾概而不稅其銘曰時文思索允臻其極嘉量既成以觀四國永啓厥後茲器維則春秋左氏傳曰齊舊四量豆區釜鍾四升曰豆各自其四以登於釜六斗四升也釜十則鍾六十四斗也鄭玄以為方尺積千寸比九章粟米法少二升八十一分升之二十二祖沖之以算術考之積凡一千五百六十二寸半方尺而圓其外減傍一釐八毫其徑一尺四寸一分四毫七秒二忽有奇而深尺即古斛之制也九章商功法程粟一斛積二千七百寸米一斛積一千六百二十寸菽答麻麥一斛積二千四百三十寸此據精粗為率使價齊而不等其器之積寸也以米斛為正則同于漢志孫子算術曰六粟為圭十圭為秒十秒為撮十撮為勺十勺為合應劭曰圭者自然之形陰陽之始四圭為撮孟康曰六十四黍為圭漢志曰量者籥合升斗斛也所以量多少也本起於黃鍾之籥用度數審其容以子穀秬黍中者千有二百實其籥以井水準其概合籥為合十合為升十升為斗十斗為斛而五量嘉矣其法用銅方尺而圓其外旁有庣焉其上為斛其下為斗左耳為升右耳為合籥其狀似爵以縻爵祿上三下二參天兩地圓而函方左一右二陰陽之象也圓象規其重二鈞備氣物之數各萬有一千五百二十也聲中黃鍾始於黃鍾而反覆焉其斛銘曰律嘉量斛方尺而圓其外庣旁九釐五毫冪百六十二寸深尺積一千六百二十寸容十斗祖沖之以圓率考之此斛當徑一尺四寸三分六釐一毫九秒二忽庣旁一分九毫有奇劉歆庣旁少一釐四毫有奇歆數術不精之所致也魏陳留王景元四年劉徽注九章商功曰當今大司農斛圓徑一尺三寸五分五釐深一尺積一千四百四十一寸十分寸之三王莽銅斛於今尺為深九寸五分五釐徑一尺三寸六分八釐七毫以徽術計之於今斛為容九斗七升四合有奇此魏斛大而尺長王莽斛小而尺短也梁陳依古齊以古升一斗五升為一斗後周武帝保定元年辛巳五月晉國造倉獲古玉斗暨五年乙酉冬十月詔改制銅律度遂致中和纍黍積籥同茲玉量與衡度無差準為銅升用頒天下內徑七寸一分深二寸八分重七斤八兩天和二年丁亥正月癸酉朔十五日戊子校定移地官府為式此銅升之銘也其玉升銘曰維大周保定元年歲在重光月旅蕤賓晉國之有司修繕倉廩獲古玉升形制典正若古之嘉量太師晉國公以聞勑納於天府暨五年歲在協洽皇帝乃詔稽準繩考灰律不失圭撮不差纍黍遂鎔金寫之用頒天下以合太平權衡度量今若以數計之玉升積玉尺一百一十寸八分有奇斛積一千一百八寸五分七釐三毫九秒又甄鸞算術云玉升一升得官斗一升三合四勺此玉升大而官斗小也以數計之甄鸞所據後周官斗積玉尺九十七寸有奇斛積九百七十七寸有奇後周玉斗並副金錯銅斗及建德六年金錯題銅斗實同以秬黍定量以玉稱權之一升之實皆重六斤十三兩開皇以古斗三升為一升大業初依復古斗衡權衡者平也權者重也衡所以任權而鈞物平輕重也其道如底以見準之正繩之直左旋見規右折見矩其在天也佐助琁璣斟酌建指以齊七政故曰玉衡權者銖兩斤鈞石也以稱物平施知輕重也古有黍絫錘錙鐶鉤鋝鎰之目歷代差變其詳未聞前志曰權本起於黃鍾之重一籥容千二百黍重十二銖兩之為兩二十四銖為兩十六兩為斤三十斤為鈞四鈞為石五權謹矣其制以義立之以物鈞之其餘大小之差以輕重為宜圜而環之令之肉倍好者周旋亡端終而復始亡窮已也權與物鈞而生衡衡運生規規圓生矩矩方生繩繩直生準準正則衡平而鈞權矣是為五則備于鈞器以為大範案趙書石勒十八年七月造建德殿得圓石狀如水碓其銘曰律權石重四鈞同律度量衡有辛氏造續咸議是王莽時物後魏景明中並州人王顯達獻古銅權一枚上銘八十一字其銘云律權石重四鈞又云黃帝初祖德匝于虞虞帝始祖德匝于新歲在大梁龍集戊辰戊辰直定天命有人據土德受正號即真改正建丑長壽隆崇同律度量衡稽當前人龍在己巳歲次實沈初班天下萬國永遵子子孫孫享傳億年此亦王莽所制也其時太樂令公孫崇依漢志先修稱尺及見此權以新稱稱之重一百二十斤新稱與權合若符契於是付崇調樂孝文時一依漢志作斗尺梁陳依古稱齊以古稱一斤八兩為一斤周玉稱四兩當古稱四兩半開皇以古稱三斤為一斤大業中依復古稱

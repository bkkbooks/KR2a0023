body:
  text: 隋書卷四十四列傳第九滕穆王瓚嗣王綸滕穆王瓚字生一名慧高祖母弟也周世以太祖軍功封竟陵郡公尚武帝妹順陽公主自右中侍上士遷御伯中大夫保定四年改為納言授儀同瓚貴公子又尚公主美姿儀好書愛士甚有令名於當世時人號曰楊三郎武帝甚親愛之平齊之役諸王咸從留瓚居守帝謂之曰六府事殷一以相付朕將遂事東方無西顧之憂矣其見親信如此宣帝即位遷吏部中大夫加上儀同未幾帝崩高祖入禁中將總朝政令廢太子勇召之欲有計議瓚素與高祖不協聞召不從曰作隋國公恐不能保何乃更為族滅事邪高祖作相遷大將軍尋拜大宗伯典修禮律進位上柱國邵國公瓚見高祖執政羣情未一恐為家禍陰有圖高祖之計高祖每優容之及受禪立為滕王後拜雍州牧上數與同坐呼為阿三後坐事去牧以王就第瓚妃宇文氏先時與獨孤皇后不平及此鬱鬱不得志陰有呪詛上命瓚出之瓚不忍離絶固請上不得已從之宇文氏竟除屬籍瓚由是忤旨恩禮更薄開皇十一年從幸栗園暴薨時年四十二人皆言其遇鴆以斃子綸嗣綸字斌籀性弘厚美姿容頗解鍾律高祖受禪封邵國公邑八千戶明年拜邵州刺史晉王廣納妃於梁詔綸致禮焉甚為梁人所敬綸以穆王之故當高祖之世每不自安煬帝即位尤被猜忌綸憂懼不知所為呼術者王琛而問之琛答曰王相祿不凡乃因曰滕即騰也此字足為善應有沙門惠恩崛多等頗解占候綸每與交通常令此三人為度星法有人告綸怨望呪詛帝命黃門侍郎王弘窮治之弘見帝方怒遂希旨奏綸厭蠱惡逆坐當死帝令公卿議其事司徒楊素等曰綸希冀國災以為身幸原其懷惡之由積自家世惟皇運之始四海同心在於孔懷彌須協力其先乃離阻大謀棄同即異父悖於前子逆於後非直覬覦朝廷便是圖危社稷為惡有狀其罪莫大刑茲無赦抑有舊章請依前律帝以公族不忍除名為民徙始安諸弟散徙邊郡大業七年親征遼東綸欲上表請從軍自效為郡司所遏未幾復徙朱崖及天下大亂為賊林仕弘所逼妻子竄于儋耳後歸大唐為懷化縣公綸弟坦字文籀初封竟陵郡公坐綸徙長沙坦弟猛字武籀徙衡山猛弟溫字明籀初徙零陵溫好學解屬文既而作零陵賦以自寄其辭哀思帝見而怒之轉徙南海溫弟詵字弘籀前亦徙零陵帝以其修謹襲封滕王以奉穆王嗣大業末薨於江都道悼王靜道悼王靜字賢籀滕穆王瓚之子也出繼叔父嵩嵩在周代以太祖軍功賜爵興城公早卒高祖踐位追封道王諡曰宣以靜襲焉卒無子國除衛昭王爽嗣王集衛昭王爽字師仁小字明達高祖異母弟也周世在襁褓中以太祖軍功封同安郡公六歲而太祖崩為獻皇后之所鞠養由是高祖於諸弟中特寵愛之十七為內史上士高祖執政拜大將軍秦州總管未之官轉授蒲州刺史進位柱國及受禪立為衛王尋遷雍州牧領左右將軍俄遷右領軍大將軍權領並州總管歲餘進位上柱國轉涼州總管爽美風儀有器局治甚有聲其年以爽為行軍元帥步騎七萬以備胡出平涼無虜而還明年大舉北伐又為元帥河間王弘豆盧績竇榮定高熲虞慶則等分道而進俱受爽節度爽親率李充節等四將出朔州遇沙鉢略可汗於白道接戰大破之虜獲千餘人驅馬牛羊巨萬沙鉢略可汗中重創而遁高祖大悅賜爽真食梁安縣千戶六年復為元帥步騎十五萬出合川突厥遁逃而返明年徵為納言高祖甚重之未幾爽寢疾上使巫者薛榮宗視之云衆鬼為厲爽令左右驅逐之居數日有鬼物來擊榮宗榮宗走下階而斃其夜爽薨時年二十五贈太尉冀州刺史子集嗣集字文會初封遂安王尋襲封衛王煬帝時諸侯王恩禮漸薄猜防日甚集憂懼不知所為乃呼術者俞普明章醮以祈福助有人告集呪詛憲司希旨鍛成其獄奏集惡逆坐當死天子下公卿議其事楊素等曰集密懷左道厭蠱君親公然呪詛無慚幽顯情滅人理事悖先朝是君父之罪人非臣子之所赦請論如律時滕王綸坐與相連帝不忍加誅乃下詔曰綸集以附萼之華猶子之重縻之好爵匪由德進正應與國升降休戚是同乃包藏妖禍誕縱邪僻在三之義愛敬俱淪急難之情孔懷頓滅公卿議既如此覽以口自本然雖復王法無私恩從義斷但法隱公族禮有親親致之極辟情所未忍於是除名為民遠徙邊郡遇天下大亂不知所終蔡王智積蔡王智積高祖弟整之子也整周明帝時以太祖軍功賜爵陳留郡公尋授開府車騎大將軍從武帝平齊至並州力戰而死及高祖作相贈柱國大司徒冀定瀛相懷衛趙貝八州刺史高祖受禪追封蔡王諡曰景以智積襲焉又封其弟智明為高陽郡公智才為開封縣公尋拜智積為開府儀同三司授同州刺史儀衛資送甚盛頃之以修謹聞高祖善之在州未嘗嬉戲遊獵聽政之暇端坐讀書門無私謁有侍讀公孫尚儀山東儒士府佐楊君英蕭德言並有文學時延於座所設唯餅果酒才三酌家有女妓唯年節嘉慶奏於太妃之前其簡靜如此昔高祖龍潛時景王與高祖不睦其太妃尉氏又與獨孤皇后不相諧以是智積常懷危懼每自貶損高祖知其若是亦哀憐之人或勸智積治産業者智積曰昔平原露朽財帛苦其多也吾幸無可露何更營乎有五男止教讀論語孝經而已亦不令交通賓客或問其故智積答曰卿非知我者其意恐兒子有才能以致禍也開皇二十年徵還京第無他職任闔門自守非朝覲不出煬帝即位滕王綸衛王集並以讒構得罪高陽公智明亦以交遊奪爵智積逾懼大業七年授弘農太守委政僚佐清靜自居及楊玄感作亂自東都引軍而西智積謂官屬曰玄感聞大軍將至欲西圖關中若成其計則根本固矣當以計縻之使不得進不出一旬自可擒耳及玄感軍至城下智積登陴詈辱之玄感怒甚留攻之城門為賊所燒智積乃更益火賊不得入數日宇文述等援軍至合擊破之十二年從駕江都寢疾帝時疏薄骨肉智積每不自安及遇患不呼醫臨終謂所親曰吾今日始知得保首領沒於地矣時人哀之有子道玄史臣曰周建懿親漢開盤石內以敦睦九族外以輯寧億兆深根固本崇奬王室安則有以同其樂衰則有以恤其危所由來久矣魏晉以下多失厥中不遵王度各徇所私抑之則勢齊於匹夫抗之則權侔於萬乘矯枉過正非一時也得失詳乎前史不復究而論焉高祖昆弟之恩素非篤睦閨房之隙又不相容至于二世承基其弊愈甚是以滕穆暴薨人皆竊議蔡王將沒自以為幸唯衛王養於獻后故任遇特隆而諸子遷流莫知死所悲夫其錫以茅土稱為盤石行無甲兵之衛居與氓隸為伍外內無虞顛危不暇時逢多難將何望焉

常侍顧愷之撰啓疑記三卷顧愷之撰千字文一卷梁給事郎周興嗣撰千字文一卷梁國子祭酒蕭子雲注千字文一卷胡肅注篆書千字文一卷演千字文五卷草書千字文一卷古今字詁三卷張揖撰梁有難字一卷錯誤字一卷並張揖撰異字二卷朱育撰字屬一卷賈魴撰亡雜字解詁四卷魏掖庭右丞周氏撰梁有解文字七卷周成撰字義訓音六卷古今字苑十卷曹侯彥撰亡雜字指一卷後漢太子中庶子郭顯卿撰字指二卷晉朝議大夫李彤撰梁有單行字四卷李彤撰又字偶五卷亡說文十五卷許慎撰梁有演說文一卷庾儼默注亡說文音隱四卷字林七卷晉弦令呂忱撰字林音義五卷宋揚州督護吳恭撰古今字書十卷字書三卷字書十卷字統二十一卷陽承慶撰玉篇三十一卷陳左衛將軍顧野王撰字類評三卷侯洪伯撰要字苑一卷宋豫章太守謝康樂撰梁有常用字訓一卷殷仲堪撰要用字對誤四卷梁輕車參軍鄒誕生撰亡要用雜字三卷鄒里撰梁有文字要記三卷王義撰亡俗語難字一卷祕書少監王劭撰雜字要三卷密州行參軍李少通撰文字整疑一卷正名一卷文字集略六卷梁文貞處士阮孝緒撰今字辨疑三卷李少通撰異字同音一卷梁有釋字同音三卷宋散騎常侍吉文甫撰字宗三卷薛立撰文字譜一卷梁有古今文字序一卷劉歊撰文字統略一卷焦子明撰亡文字辨嫌一卷彭立撰辨字一卷戴規撰雜字音一卷借音字一卷音書考源一卷聲韻四十一卷周研撰聲類十卷魏左校令李登撰韻集十卷韻集六卷晉安復令呂靜撰四聲韻林二十八卷張諒撰韻集八卷段弘撰羣玉典韻五卷梁有文章音韻二卷王該撰又五音韻五卷亡韻略一卷陽休之撰修續音韻決疑十四卷李概撰纂韻鈔十卷四聲指歸一卷劉善經撰四聲一卷梁太子少傅沈約撰四聲韻略十三卷夏侯詠撰音譜四卷李概撰韻英三卷釋靜洪撰通俗文一卷服虔撰訓俗文字略一卷後齊黃門郎顏之推撰證俗音字略六卷梁有詁幼二卷顏延之撰廣詁幼一卷宋給事中荀楷撰亡文字音七卷晉蕩昌長王延撰梁有纂文三卷亡翻真語一卷王延撰真言鑒誡一卷字書音同異一卷同音義三卷河洛語音一卷王長孫撰國語十五卷國語十卷鮮卑語五卷國語物名四卷後魏侯伏侯可悉陵撰國語真歌十卷國語雜物名三卷侯伏侯可悉陵撰國語十八傳一卷國語御歌十一卷鮮卑語十卷國語號令四卷國語雜文十五卷鮮卑號令一卷周武帝撰雜號令一卷古文官書一卷後漢議郎衛敬仲撰古今奇字一卷郭顯卿撰六文書一卷四體書勢一卷晉長水校尉衛撰雜體書九卷釋正度撰古今八體六文書法一卷古今篆隸雜字體一卷蕭子政撰古今文等書一卷篆隸雜體書二卷文字圖二卷古今字圖雜録一卷祕書學士曹憲撰婆羅門書一卷梁有扶南胡書一卷外國書四卷秦皇東巡會稽刻石文一卷一字石經周易一卷梁有三卷一字石經尚書六卷梁有今字石經鄭氏尚書八卷亡一字石經魯詩六卷梁有毛詩二卷亡一字石經儀禮九卷一字石經春秋一卷梁有一卷一字石經公羊傳九卷一字石經論語一卷梁有二卷一字石經典論一卷三字石經尚書九卷梁有十三卷三字石經尚書五卷三字石經春秋三卷梁有十二卷右一百八部四百四十七卷通計亡書合一百三十五部五百六十九卷孔子曰必也正名乎名謂書字名不正則言不順言不順則事不成說者以為書之所起起自黃帝蒼頡比類象形謂之文形聲相益謂之字著於竹帛謂之書故有象形諧聲會意轉注假借處事六義之別古者童子示而不誑六年教之數與方名十歲入小學學書計二十而冠始習先王之道故能成其德而任事然自蒼頡訖于漢初書經五變一日古文即蒼頡所作二曰大篆周宣王時史籀所作三曰小篆秦時李斯所作四曰隸書程邈所作五曰草書漢初作秦世既廢古文始用八體有大篆小篆刻符摹印蟲書署書殳書隸書漢時以六體教學童有古文奇字篆書隸書繆篆蟲鳥並藁書楷書懸針垂露飛白等二十餘種之勢皆出於上六書因事生變也魏世又有八分書其字義訓讀有史籀篇蒼頡篇三蒼埤蒼廣蒼等諸篇章訓詁說文字林音義聲韻體勢等諸書自後漢佛法行於中國又得西域胡書能以十四字貫一切音文省而義廣謂之婆羅門書與八體六文之義殊別今取以附體勢之下又後魏初定中原軍容號令皆以夷語後染華俗多不能通故録其本言相傳教習謂之國語今取以附音韻之末又後漢鐫刻七經著於石碑皆蔡雍所書魏正始中又立三字石經相承以為七經正字後魏之末齊神武執政自洛陽徙于鄴都行至河陽值岸崩遂沒于水其得至鄴者不盈太半至隋開皇六年又自鄴京載入長安置于祕書內省議欲補緝立于國學尋屬隋亂事遂寢廢營造之司因用為柱礎貞觀初祕書監臣魏徵始收聚之十不存一其相承傳拓之本猶在祕府並秦帝刻石附於此篇以備小學凡六藝經緯六百二十七部五千三百七十一卷通計亡書合九百五十部七千二百九十卷傳曰玉不琢不成器人不學不知道古之君子多識而不窮畜疑以待問學不踰等教不陵節言約而易曉師逸而功倍且耕且養三年而成一藝自孔子沒而微言絶七十子喪而大義乖學者離羣索居各為異說至于戰國典文遺棄六經之儒不能究其宗旨多立小數一經至數百萬言致令學者難曉虛誦問答脣腐齒落而不知益且先王設教以防人欲必本於人事折之中道上天之命略而言方外之理固所未說至後漢好圖讖晉世重玄言穿鑿妄作日以滋生先王正典雜之以妖妄大雅之論汩之以放誕陵夷至于近代去正轉疏無復師資之法學不心解專以浮華相尚豫造雜難擬為讎對遂有芟角反對互從等諸翻競之說馳騁煩言以紊彝譊譊成俗而不知變此學者之蔽也班固列六藝為九種或以緯書解經合為十種

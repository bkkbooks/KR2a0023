body:
  text: 隋書卷三十二志第二十七經籍一經夫經籍也者機神之妙旨聖哲之能事所以經天地緯陰陽正紀綱弘道德顯仁足以利物藏用足以獨善學之者將殖焉不學者將落焉大業崇之則成欽明之德匹夫克念則有王公之重其王者之所以樹風聲流顯號美教化移風俗何莫由乎斯道故曰其為人也溫柔敦厚詩教也疏通知遠書教也廣博易樂教也潔靜精微易教也恭儉莊敬禮教也屬辭此事春秋教也遭時制宜質文迭用應之以通變通變之以中庸中庸則可久通變則可大其教有適其用無窮實仁義之陶鈞誠道德之橐籥也其為用大矣隨時之義深矣言無得而稱焉故曰不疾而速不行而至今之所以知古後之所以知今其斯之謂也是以大道方行俯龜象而設卦後聖有作仰鳥跡以成文書契已傳繩木棄而不用史官既立經籍於是興焉夫經籍也者先聖據龍圖握鳳紀南面以君天下者咸有史官以紀言行言則左史書之動則右史書之故曰君舉必書懲勸斯在考之前載則三墳五典八索九丘之類是也下逮殷周史官尤備紀言書事靡有闕遺則周禮所稱太史掌建邦之六典八法八則以詔王治小史掌邦國之志定世繫辨昭穆內史掌王之八柄策命而二之外史掌王之外令及四方之志三皇五帝之書御史掌邦國都鄙萬民之治令以贊冢宰此則天子之史凡有五焉諸侯亦各有國史分掌其職則春秋傳晉趙穿弒靈公太史董狐書曰趙盾殺其君以示於朝宣子曰不然對曰子為正卿亡不越境反不討賊非子而誰齊崔杼弒莊公太史書曰崔杼弒其君崔子殺之其弟嗣書死者二人其弟又書乃舍之南史聞太史盡死執簡以往聞既書矣乃還楚靈王與右尹子革語左史倚相趨而過王曰此良史也能讀三墳五典八索九丘然則諸侯史官亦非一人而已皆以記言書事太史總而裁之以成國家之典不虛美不隱惡故得有所懲勸遺文可觀則左傳稱周志國語有鄭書之類是也暨夫周室道衰紀綱散亂國異政家殊俗褒貶失實隳紊舊章孔丘以大聖之才當傾頽之運歎鳳鳥之不至惜將墜於斯文乃述易道而刪詩書修春秋而正雅頌壞禮崩樂咸得其所自哲人萎而微言絶七十子散而大義乖戰國縱橫真僞莫辨諸子之言紛然淆亂聖人之至德喪矣先王之要道亡矣陵夷踳駁以至于秦秦政奮豺狼之心剗先代之迹焚詩書坑儒士以刀筆吏為師制挾書之令學者逃難竄伏山林或失本經口以傳說漢氏誅除秦項未及下車先命叔孫通草綿蕝之儀救擊柱之弊其後張蒼治律曆陵賈撰新語曹參薦蓋公言黃老惠帝除挾書之律儒者始以其業行於民間猶以去聖既遠經籍散逸簡札錯亂傳說紕繆遂使書分為二詩分為三論語有齊魯之殊春秋有數家之傳其餘互有踳駁不可勝言此其所以博而寡要勞而少功者也武帝置太史公命天下計書先上太史副上丞相開獻書之路置寫書之官外有太常太史博士之藏內有延閣廣內祕室之府司馬談父子世居太史探采前代斷自軒皇逮于孝武作史記一百三十篇詳其體制蓋史官之舊也至於孝成祕藏之書頗有亡散乃使謁者陳農求遺書於天下命光祿大夫劉向校經傳諸子詩賦步兵校尉任宏校兵書太史令尹咸校數術太醫監李柱國校方技每一書就向輒撰為一録論其指歸辨其訛謬而奏之向卒後哀帝使其子歆嗣父之業乃徙溫室中書於天祿閣上歆遂總括羣篇撮其指要著為七略一曰集略二曰六藝略三曰諸子略四曰詩賦略五曰兵書略六曰術數略七曰方技略大凡三萬三千九十卷王莽之末又被焚燒光武中興篤好文雅明章繼軌尤重經術四方鴻生巨儒負袠自遠而至者不可勝算石室蘭臺彌以充積又於東觀及仁壽閣集新書校書郎班固傅毅等典掌焉並依七略而為書部固又編之以為漢書藝文志董卓之亂獻帝西遷圖書縑帛軍人皆取為帷囊所收而西猶七十餘載兩京大亂掃地皆盡魏氏代漢采掇遺亡藏在祕書中外三閣魏祕書郎鄭默始制中經祕書監荀勗又因中經更著新簿分為四部總括羣書一曰甲部紀六藝及小學等書二曰乙部有古諸子家近世子家兵書兵家術數三曰丙部有史記舊事皇覽簿雜事四曰丁部有詩賦圖讚汲冢書大凡四部合二萬九千九百四十五卷但録題及言盛以縹囊書用緗素至於作者之意無所論辨惠懷之亂京華蕩覆渠閣文籍靡有孑遺東晉之初漸更鳩聚著作郎李充以勗舊簿校之其見存者但有三千一十四卷充遂總沒衆篇之名但以甲乙為次自爾因循無所變革其後中朝遺書稍流江左宋元嘉八年祕書監謝靈運造四部目録大凡六萬四千五百八十二卷元徽元年祕書丞王儉又造目録大凡一萬五千七百四卷儉又別撰七志一曰經典志紀六藝小學史記雜傳二曰諸子志紀今古諸子三曰文翰志紀詩賦四曰軍書志紀兵書五曰陰陽志紀陰陽圖緯六曰術藝志紀方技七曰圖譜志紀地域及圖書其道佛附見合九條然亦不述作者之意但於書名之下每立一傳而又作九篇條例編乎首卷之中文義淺近未為典則齊永明中祕書丞王亮監謝朏又造四部書目大凡一萬八千一十卷齊末兵火延燒祕閣經籍遺散梁初祕書監任昉躬加部集又於文德殿內列藏衆書華林園中總集釋典大凡二萬三千一百六卷而釋氏不豫焉梁有祕書監任昉殷鈞四部目録又文德殿目録其術數之書更為一部使奉朝請祖耳幾撰其名故梁有五部目録普通中有處士阮孝緒沉靜寡欲篤好墳史博采宋齊已來王公之家凡有書記參校官簿更為七録一曰經典録紀六藝二曰記傳録紀史傳三曰子兵録紀子書兵書四曰文集録紀詩賦五曰技術録紀數術六曰佛録七曰道録其分部題目頗有次序割析辭義淺薄不經梁武敦悅詩書下化其上四境之內家有文史元帝克平侯景收文德之書及公私經籍歸于江陵大凡七萬餘卷周師入郢咸自焚之陳天嘉中又更鳩集考其篇目遺闕尚多其中原則戰爭相尋干戈是務文教之盛苻姚而已宋武入關收其圖籍府藏所有才四千卷赤軸青紙文字古拙後魏始都燕代南略中原粗收經史未能全具孝文徙都洛邑借書於齊祕府之中稍以充實暨於爾朱之亂散落人間後齊遷鄴頗更搜聚迄於天統武平校寫不輟後周始基關右外逼強鄰戎馬生郊日不暇給保定之始書止八千後稍加增方盈萬卷周武平齊先封書府所加舊本才至五千隋開皇三年祕書監牛弘表請分遣使人搜訪異本每書一卷賞絹一匹校寫既定本即歸主於是民間異書往往間出及平陳已後經籍漸備檢其所得多太建時書紙墨不精書亦拙惡於是總集編次存為古本召天下工書之士京兆韋霈南陽杜頵等於祕書內補續殘缺為正副二本藏于宮中其餘以實祕書內外之閣凡三萬餘卷煬帝即位祕閣之書限寫五十副本分為三品上品紅琉璃軸中品紺琉璃軸下品漆軸於東都觀文殿東西廂構屋以貯之東屋藏甲乙西屋藏丙丁又聚魏已來古跡名畫於殿後起二臺東曰妙楷臺藏古跡西曰寶蹟臺藏古畫又於內道場集道佛經別撰目録大唐武德五年克平僞鄭盡收其圖書及古跡焉命司農少卿宋遵貴載之以船泝河西上將致京師行經底柱多被漂沒其所存者十不一二其目録亦為所漸濡時有殘缺今考見存分為四部合條為一萬四千四百六十六部有八萬九千六百六十六卷其舊録所取文義淺俗無益教理者並刪去之其舊録所遺辭義可采有所弘益者咸附入之遠覽馬史班書近觀王阮志録挹其風流體制削其浮雜鄙俚離其疏遠合其近密約文緒義凡五十五篇各列本條之下以備經籍志雖未能研幾探賾窮極幽隱庶乎弘道設教可以無遺闕焉夫仁義禮智所以治國也方技數術所以治身也諸子為經籍之鼓吹文章乃政化之黼黻皆為治之具也故列之於此志云歸藏十三卷晉太尉參軍薛貞注周易二卷魏文侯師卜子夏傳殘缺梁六卷周易十卷漢魏郡太守京房章句周易八卷漢曲臺長孟喜章句殘缺梁十卷又有漢單父長費直注周易四卷亡周易九卷後漢大司農鄭玄注梁又有漢南郡太守馬融注周易一卷亡周易五卷漢荊州牧劉表章句梁有漢荊州五業從事宋忠注周易十卷亡周易十一卷漢司空荀爽注周易十卷魏衛將軍王肅注周易十卷魏尚書郎王弼注六十四卦六卷韓康伯注繫辭以下三卷王弼又撰易略例一卷梁有魏大司農卿董遇注周易十卷魏散騎常侍荀輝注周易十卷亡周易十卷吳太常姚信注周易四卷晉儒林從事黃頴注梁有十卷今殘缺周易九卷吳侍御史虞翻注周易十五卷吳鬱林太守陵績注周易十卷晉散騎常侍干寶注周易三卷晉驃騎將軍王廙注殘缺梁有十卷周易八卷晉著作郎張璠注殘缺梁有十卷周易馬鄭二王四家集解十卷周易荀爽九家注十卷周易楊氏集二王注五卷梁有集馬鄭二王解十卷亡周易十卷蜀才注梁有齊安參軍費元圭注周易九卷謝氏注周易八卷尹濤注周易六卷亡周易十卷後魏司徒崔浩注周易十卷梁處士何胤注梁有臨海令伏曼容注周易八卷侍中朱异集注周易一百卷又周易集注三十卷亡周易七卷姚規注周易十三卷崔覲注周易十三卷傅氏注周易一帙十卷盧氏注周易繫辭二卷晉桓玄注周易繫辭二卷晉西中郎將謝萬等注周易繫辭二卷晉太常韓康伯注周易繫辭二卷梁太中大夫宋褰注又有宋東陽太守卞伯玉注繫辭二卷亡周易繫辭二卷荀柔之注周易集注繫辭二卷梁有宋太中大夫徐爰注繫辭二卷亡周易音一卷東晉太子前率徐邈撰周易音一卷東晉尚書郎李軌弘範撰周易音一卷范氏撰周易並注音七卷祕書學士陸德明撰周易盡神論一卷魏司空鍾會撰梁有周易無互體論三卷鍾會撰亡周易象論三卷晉尚書郎欒肇撰周易卦序論一卷晉司徒右長史楊乂撰周易統略五卷晉少府卿鄒湛撰周易論二卷晉馮翊太守阮渾撰周易論一卷晉荊州刺史宋岱撰梁有擬周易說八卷范氏撰周易宗塗四卷干寶撰周易問難二卷王氏撰周易問答一卷揚州從事徐伯珍撰周易難王輔嗣義一卷晉揚州刺史顧夷等撰周易雜論十四卷亡周易義一卷宋陳令范歆撰周易玄品二卷周易論十卷齊中書郎周顒撰梁有三十卷亡周易論四卷范氏撰周易統例十卷崔覲撰周易爻義一卷干寶撰周易乾坤義一卷齊步兵校尉劉瓛撰梁又有齊臨沂令李玉之梁釋法通等乾坤義各一卷亡周易大義二十一卷梁武帝撰周易幾義一卷梁南平王撰梁有周易疑通五卷宋中散大夫何諲之撰周易四德例一卷劉瓛撰亡周易大義一卷梁有周易錯八卷京房撰周易日月變例六卷虞翻陸績撰周易卦象數旨六卷東晉樂安亭侯李顒撰周易爻一卷馬揩撰亡周易大義二卷陸德明撰周易釋序義三卷周易開題義十卷梁蕃撰周易問二十卷周易義疏十九卷宋明帝集羣臣講梁又有國子講易議六卷宋明帝集羣臣講易義疏二十卷齊永明國學講周易講疏二十六卷又周易義三卷沈林撰亡周易講疏三十五卷梁武帝撰周易講疏十六卷梁五經博士褚仲都撰周易義疏十四卷梁都官尚書蕭子政撰周易繫辭義疏三卷蕭子政撰周易講疏三十卷陳咨議參軍張譏撰周易文句義二十卷梁有擬周易義疏十三卷周易義疏十六卷陳尚書左僕射周弘正撰周易私記二十卷周易講疏十三卷國子祭酒何妥撰周易繫辭義疏二卷劉瓛撰周易繫辭義疏一卷梁武帝撰周易繫辭義疏二卷蕭子政撰梁有周易乾坤三象周易新圖各一卷又周易普玄圖八卷薛景和撰周易大演通統一卷顏氏撰周易
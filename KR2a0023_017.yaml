body:
  text: 隋書卷十七志第十二律曆中夫曆者紀陰陽之通變極往數以知來可以迎日授時先天成務者也然則懸象著明莫大於二曜氣序環復無信於四時日月相推而明生矣寒暑迭進而歲成焉遂能成天地之文極乾坤之變天數五地數五五位相乘而各有合天數二十有五地數三十凡天地之數五十有五所以成變化而行鬼神也乾之策二百一十有六坤之策一百四十有四凡三百六十以當期之日也至乃陰陽迭用剛柔相摩四象既陳八卦成列此乃造文之元始創曆之厥初者歟洎乎炎帝分八節軒轅建五部少昊以鳳鳥司曆顓頊以南正司天陶唐則分命和仲夏后乃備陳鴻範湯武革命咸率舊章然文質既殊正朔斯革故天子置日官諸侯有日御以和萬國以協三辰至于寒暑晦明之徵陰陽生殺之數啓閉升降之紀消息盈虛之節皆應躔次而不淫遂得該浹生靈堪輿天地開物成務致遠鉤深周德既衰史官廢職疇人分散禨祥莫理秦兼天下頗推五勝自以獲水德之瑞以十月為正漢氏初興多所未暇百有餘載猶行秦曆至于孝武改用夏正時有古曆六家學者疑其紕繆劉向父子咸加討論班固因之採以為志光武中興未能詳考逮于永平之末乃復改行四分七十餘年儀式方備其後復命劉洪蔡雍共修律曆司馬彪用之以續班史當塗受命亦有史官韓翊創之於前楊偉繼之於後咸遵劉洪之術未及洪之深妙中左兩晉迭有增損至於西涼亦為蔀法事迹糾紛未能詳記宋氏元嘉何承天造曆迄于齊末相仍用之梁武初興因循齊舊天監中年方改行宋祖沖之甲子元曆陳武受禪亦無創改後齊文宣用宋景業曆西魏入關行李業興曆逮於周武帝乃有甄鸞造甲寅元曆遂參用推步焉大象之初太史上士馬顯又上丙寅元曆便即行用迄于開皇四年乃改用張賓曆十七年復行張胄玄曆至于義寧今采梁天監以來五代損益之要以著于篇云梁初因齊用宋元嘉曆天監三年下詔定曆員外散騎侍郎祖耳幾奏曰臣先在晉已來世居此職仰尋黃帝至今十二代曆元不同周天斗分疏密亦異當代用之各垂一法宋大明中臣先人考古法以為正曆垂之于後事皆符驗不可改張八年耳幾又上疏論之詔使太史令將匠道秀等候新舊二曆氣朔交會及七曜行度起八年十一月訖九年七月新曆密舊曆疏耳幾乃奏稱史官今所用何承天曆稍與天乖緯緒參差不可承案被詔付靈臺與新曆對課疏密前期百日並又再申始自去冬終于今朔得失之效並已月別啓聞夫七曜運行理數深妙一失其源則歲積彌爽所上脫可施用宜在來正至九年正月用祖沖之所造甲子元曆頒朔至大同十年制詔更造新曆以甲子為元六百一十九為章歲一千五百三十六為日法一百八十三年冬至差一度月朔以遲疾定其小餘有三大二小未及施用而遭侯景亂遂寢陳氏因梁亦用祖沖之曆更無所創改後齊文宣受禪命散騎侍郎宋景業協圖讖造天保曆景業奏依握誠圖及元命包言齊受録之期當魏終之紀得乘三十五以為蔀應六百七十六以為章文宣大悅乃施用之期曆統曰上元甲子至天保元年庚午積十一萬五百二十六算外章歲六百七十六度法二萬三千六百六十斗分五千七百八十七曆餘十六萬二千二百六十一至後主武平七年董峻鄭元偉立議非之曰宋景業移閏於天正退命於冬至交會之際承二大之後三月之交妄減平分臣案景業學非探賾識殊深解有心改作多依舊章唯寫子換母頗有變革妄誕穿鑿不會真理乃使日之所在差至八度節氣後天閏先一月朔望虧食既未能知其表𩹉遲疾之曆步又不可以傍通妄設平分虛退冬至虛退則日數減於周年平分妄設故加時差於異日五星見伏有違二旬遲疾逆留或乖兩宿軌之術妄刻水旱今上甲寅元曆並以六百五十七為章二萬二千三百三十八為蔀五千四百六十一為斗分甲寅歲甲子日為元紀又有廣平人劉孝孫張孟賓二人同知曆事孟賓受業於張子信並棄舊事更制新法又有趙道嚴準晷影之長短定日行之進退更造盈縮以求虧食之期劉孝孫以六百一十九為章八千四十七為紀一千九百六十六為歲餘甲子為上元命日度起虛中張孟賓以六百一十九為章四萬八千九百一為紀九百四十八為日法萬一千九百四十五為斗分元紀共命法略旨遠日月五星並從斗十一起盈縮轉度陰陽分至與漏刻相符共日影俱合循轉無窮上拒春秋下盡天統日月虧食及五星所在以二人新法考之無有不合其年訖干敬禮及曆家豫刻日食疏密六月戊申朔太陽虧劉孝孫言食於卯時張孟賓言食於甲時鄭元偉董峻言食於辰時宋景業言食於巳時至日食乃於卯甲之間其言皆不能中爭論未定遂屬國亡西魏入關尚行李業興正光曆法至周明帝武成元年始詔有司造周曆於是露門學士明克讓麟趾學士庾季才及諸日者採祖耳幾舊議通簡南北之術自斯已後頗覩其謬故周齊並時而曆差一日克讓儒者不處日官以其書下于太史及武帝時甄鸞造天和曆上元甲寅至天和元年丙戌積八十七萬五千七百九十二算外章歲三百九十一蔀法二萬三千四百六十日法二十九萬一百六十朔餘十五萬三千九百九十一斗分五千七百三十一會餘九萬三千五百一十六曆餘一十六萬八百三十冬至斗十五度參用推步終於宣政元年大象元年太史上士馬顯等又上丙寅元曆抗表奏曰臣案九章五紀之旨三統四分之説咸以節宣發斂考詳晷緯布政授時以為皇極者也而乾維難測斗憲易差盈縮之期致舛咎徵之道斯應寧止蛇或乘龍水能沴火因亦玉羊掩曜金雞喪精王化關以盛衰有國由其隆替曆之時義於斯為重自炎漢已還迄於有魏運經四代事涉千年日御天官不乏於世命元班朔互有沿改驗近則疊璧應辰經遠則連珠失次義難循舊其在茲乎大周受圖膺録牢籠萬古時夏乘殷斟酌前代曆變壬子元用甲寅高祖武皇帝索隱探頤盡性窮理以為此曆雖行未臻其妙爰降詔旨博訪時賢並勑太史上士馬顯等更事刊定務得其宜然術藝之士各封異見凡所上曆合有八家精粗踳駁未能盡善去年冬孝宣皇帝乃詔臣等監考疏密更令同造謹案史曹舊簿及諸家法數棄短取長共定今術開元發統肇自丙寅至於兩曜虧食五星伏見參校積時最為精密庶鐵炭輕重無失寒燠之宜灰箭飛浮不爽陰陽之度上元丙寅至大象元年己亥積四萬一千五百五十四算上日法五萬三千五百六十三亦名蔀會法章歲四百四十八斗分三千一百六十七蔀法一萬二千九百九十二章中為章會法日法五萬三千五百六十三曆餘二萬九千六百九十三會日百七十三會餘一萬六千六百一十九冬至日在斗十二度小周餘盈縮積其曆術別推入蔀會分用陽率四百九十九陰率九每十二月下各有日月蝕轉分推步加減之乃為定蝕大小餘而求加時之正其術施行時高祖作輔方行禪代之事欲以符命曜于天下道士張賓揣知上意自云玄相洞曉星曆因盛言有代謝之徵又稱上儀表非人臣相由是大被知遇在幕府及受禪之初擢賓為華州刺史使與儀同劉暉驃騎將軍董琳索盧縣公劉祐前太史上士馬顯太學博士鄭元偉前保章上士任悅開府掾張徹前蕩邊將軍張膺之校書郎衡洪建太史監候粟相太史司曆郭翟劉宜兼算學博士張乾門下參人王君瑞荀隆伯等議造新曆仍令太常卿盧賁監之賓等依何承天法微加增損四年二月撰成奏上高祖下詔曰張賓等存心算數通洽古今每有陳聞多所啓沃畢功表奏具已披覽使後月復育不出前晦之宵前月之餘罕留後朔之旦減朓就朒懸殊舊準月行表𩹉厥途乃異日交弗食由循陽道驗時轉算不越纖毫逖聽前修斯祕未啓有一於此實為精密宜頒天下依法施用張賓所造曆法其要以上元甲子己巳已來至開皇四年歲在甲辰積四百一十二萬九千一算上蔀法一十萬二千九百六十章歲四百二十九章月五千三百六通月五百三十七萬二千二百九日法一十八萬一千九百二十斗分二萬五千六十三會月一千二百九十七會率二百二十一會數一百一十半會分一十一億八千七百二十五萬八千一百八十九會日法四千二十萬四千三百二十會日百七十三餘五萬六千一百四十三小分一百一十交法五億一千二百一十萬四千八百交分法二千八百一十五陰陽曆一十三餘十一萬二百六十三小分二千三百二十八朔差二餘五萬七千九百二十一小分九百七十四蝕限一十二餘八萬一千三百三小分四百三十三半定差四萬四千五百四十八周日二十七餘一十萬八百五十九亦名少大法木精曰歲星合率四千一百六萬三千八百八十九火精曰熒惑合率八千二十九萬七千九百二十六土精曰鎮星合率三千八百九十二萬五千四百一十三金精曰太白合率六千一十一萬九千六百五十五水精曰辰星合率一千一百九十三萬一千一百二十五張賓所創之曆既行劉孝孫與冀州秀才劉焯並稱其失言學無師法刻食不中所駁凡有六條其一云何承天不知分閏之有失而用十九年之七閏其二云賓等不解宿度之差改而冬至之日守常度其三云連珠合璧七曜須同乃以五星別元其四云賓等唯知日氣餘分恰盡而為立元之法不知日月不合不成朔旦冬至其五云賓等但守立元定法不須明有進退其六云賓等唯識轉加大餘二十九以為朔不解取日月合會準以為定此六事微妙曆數大綱聖賢之通術而暉未曉此實管窺之謂也若乃驗影定氣何氏所優賓等推測去之彌遠合朔順天何氏所劣賓等依據循彼迷蹤蓋是失其菁華得其粳粃者也又云魏明帝時有尚書郎楊偉修景初曆乃上表立義駁難前非云加時後天食不在朔然觀楊偉之意故以食朔為真未能詳之而制其法至宋元嘉中何承天著曆其上表云月行不定或有遲疾合朔月食不在朔望亦非曆之意也然承天本意欲立合朔之術遭皮延宗飾非致難故事不得行至後魏獻帝時有龍宜弟復修延興之曆又上表云日食不在朔而習之不廢據春秋書食乃天之驗朔也此三人者前代善曆皆有其意未正其書但曆數所重唯在朔氣朔為朝會之首氣為生長之端朔有告餼之文氣有郊迎之典故孔子命曆而定朔旦冬至以為將來之範今孝孫曆法並按明文以月行遲疾定其合朔欲令食必在朔不在晦二之日也縱使頻月一小三大得天之統大抵其法有三今列之云第一勘日食證在朔引詩云十月之交朔日辛卯日有食之今以甲子元曆術推算符合不差春秋經書日合食三十五二十七日食經書有朔推與甲子元曆不差八食經書並無朔字左氏傳云不書朔官失之也公羊傳云不言朔者食二日也穀梁傳云不言朔者食晦也今以甲子元曆推算俱是朔日丘明受經夫子於理尤詳公羊穀梁皆臆説也春秋左氏隱公三年二月己巳日有食之推合己巳朔莊公十八年春三月日有食之推合壬子朔僖公十二年三月庚午日有食之推合庚午朔十五年夏五月日有食之推合癸未朔襄公十五年秋八月丁巳日有食之推合丁巳朔前後漢及魏晉四代所記日食朔晦及先晦都合一百八十一今以甲子元曆術推之並合朔日而食前漢合有四十五食三食並先晦一日三十二食並皆晦日十食並是朔日後漢合有七十四食三十七食並皆晦日三十七食並皆朔日魏合有十四食四食並皆晦日十食並皆朔日晉合有四十八食二十五食並皆晦日二十三食並皆朔日第二勘度差變驗尚書云日短星昴以正仲冬即是唐堯之時冬至之日日在危宿合昏之時昴正午案竹書紀年堯元年丙子今以甲子元曆術推算得合堯時冬至之日合昏之時昴星正午漢書武帝太初元年丁丑歲落下閎等考定太初曆冬至之日日在牽牛初今以甲子元曆術算即得斗末牛初矣晉時有薑岌又以月食驗於日度知冬至之日日在斗十七度宋文帝元嘉十年癸酉歲何承天考驗乾度亦知冬至之日日在斗十七度雖言冬至後上三日前後通融只合在斗十七度但堯年漢日所在既殊唯晉及宋所在未改故知其度理有變差至今大隋甲辰之歲考定曆數象以稽天道知冬至之日日在斗十三度第三勘氣影長驗春秋緯命曆序云魯僖公五年正月壬子朔旦冬至今以甲子元曆術推算得合不差宋書元嘉十年何承天以土圭測影知冬至已差三日詔使付外考驗起元嘉十三年為始畢元嘉二十年八年之中冬至之日與影長之日差校三日今以甲子元曆術推算但是冬至之日與影長之符合不差詳之如左十三年丙子天正十八日曆注冬至十五日影長即是今曆冬至日十四年丁丑天正二十九日曆注冬至二十六日影長即是今曆冬至日十五年戊寅天正十一日曆注冬至陰無影可驗今曆八日冬至十六年己卯天正二十一日曆注冬至十八日影長即是今曆冬至日十七年庚辰天正二日曆注冬至十月二十九日影長即是今曆冬至日十八年辛巳天正十三日曆注冬至十日影長即是今曆冬至日十九年壬午天正二十五日曆注冬至陰無影可驗今曆二十二日冬至二十年癸未天正六日曆注冬至三日影長即是今曆冬至日于時新曆初頒賓有寵於高祖劉暉附會之被升為太史令二人協議共短孝孫言其非毀天曆率意迂怪焯又妄相扶證惑亂時人孝孫焯等竟以他事斥罷後賓死孝孫為掖縣丞委官入京又上前後為劉暉所詰事寢不行仍留孝孫直太史纍年不調寓宿觀臺乃抱其書弟子輿櫬來詣闕下伏而慟哭執法拘以奏之高祖異焉以問國子祭酒何妥妥言其善即日擢授大都督遣與賓曆比校短長先是信都人張胄玄以算術直太史久未知名至是與孝孫共短賓曆異論鋒起久之不定至十四年七月上令參問日食事楊素等奏太史凡奏日食二十有五唯一晦三朔依剋而食尚不得其時又不知所起他皆無驗胄玄所剋前後妙衷時起分數合如符契孝孫所剋驗亦過半於是高祖引孝孫胄玄等親自勞徠孝孫因請先斬劉暉乃可定曆高祖不懌又罷之俄而孝孫卒楊素牛弘等傷惜之又薦胄玄上召見之胄玄因言日長影短之事高祖大悅賞賜甚厚令與參定新術劉焯聞胄玄進用又增損孝孫曆法更名七曜新術以奏之與胄玄之法頗相乖爽袁充與胄玄害之焯又罷至十七年胄玄曆成奏之上付楊素等校其短長劉暉與國子助教王頍等執舊曆術迭相駁難與司曆劉宜援據古史影等駁胄玄云命曆序僖公五年天正壬子朔旦日至左氏傳僖公五年正月辛亥朔日南至張賓曆天正壬子朔冬至合命曆序差傳一日張胄玄曆天正壬子朔合命曆序差傳一日三日甲寅冬至差命曆序二日差傳三日成公十二年命曆序天正辛卯朔旦日至張賓曆天正辛卯朔冬至合命曆序張胄玄曆天正辛卯朔合命曆序二日壬辰冬至差命曆序一日昭公二十年春秋左氏傳二月己丑朔日南至準命曆序庚寅朔旦日至張賓曆天正庚寅朔冬至並合命曆序差傳一日張胄玄曆天正庚寅朔合命曆序差傳一日二日辛卯冬至差命曆序一日差傳二日宜案命曆序及春秋左氏傳並閏餘盡之歲皆須朔旦冬至若依命曆序勘春秋三十七食合處至多若依左傳合者至少是以知傳為錯今張胄玄信情置閏命曆序及傳氣朔並差又宋元嘉冬至影有七張賓曆合者五差者二亦在前一日張胄玄曆合者三差者四在後一日元嘉十二年十一月甲寅朔十五日戊辰冬至日影長張賓曆合戊辰冬至張胄玄曆己巳冬至差後一日十三年十一月己酉朔二十六日甲戌冬至日影長張賓曆癸酉冬至差前一日張胄玄曆合甲戌冬至十五年十一月丁卯朔十八日甲申冬至日影長二曆並合甲申冬至十六年十一月辛酉朔二十九日己丑冬至日影長張賓曆合己丑冬至張胄玄曆庚寅冬至差後一日十七年十一月乙酉朔十日甲午冬至日影長張賓曆合甲午冬至張胄玄曆乙未冬至差後一日十八年十一月己卯朔二十一日己亥冬至日影長張賓曆合己亥冬至張胄玄曆庚子冬至差後一日十九年十一月癸卯朔三日乙巳冬至影長張賓曆甲辰冬至差前一日張胄玄曆合乙巳冬至又周從天和元年丙戌至開皇十五年乙卯合得冬夏至日影一十四張賓曆合得者十差者四三差前一日一差後一日張胄玄曆合者五差者九八差後一日一差前一日天和二年十一月戊戌朔三日庚子冬至日影長張賓曆合庚子冬至張胄玄曆辛丑冬至差後一日三年十一月壬辰朔十四日乙巳冬至日影長張賓曆合乙巳冬至張胄玄曆丙午冬至差後一日建德元年十一月己亥朔二十九日丁卯冬至日影長張賓曆丙寅冬至差前一日張胄玄曆合丁卯冬至二年五月丙寅朔三日戊辰夏至日影短張賓曆己巳夏至差後一日張胄玄曆庚午夏至差後二日三年十一月戊午朔二十日丁丑冬至日影長張賓曆合丁丑冬至張胄玄曆戊寅冬至差後一日六年十一月庚午朔二十三日壬辰冬至日影長張賓曆合壬辰冬至張胄玄曆癸巳冬至差後一日宣政元年十一月甲午朔五日戊戌冬至日影長兩曆並合戊戌冬至開皇四年十一月己未朔十一日己巳冬至日影長張賓曆合己巳冬至張胄玄曆庚午冬至差後一日五年十一月甲寅朔二十二日乙亥冬至日影長張賓曆甲戌冬至差前一日張胄玄曆合庚辰冬至七年五月乙亥朔九日癸未夏至日影短張賓曆壬午夏至差前一日張胄玄曆合癸未夏至十一月壬申朔十四日乙酉冬至日影長張賓曆合乙酉冬至張胄玄曆丙戌冬至差後一日十一年十一月己卯朔二十八日丙午冬至日影長張賓曆合丙午冬至張胄玄曆丁未冬至差後一日十四年十一月辛酉朔旦冬至張賓曆合十一月辛酉朔旦冬至張胄玄曆十一月辛酉朔二日壬戌冬至差後一日建德四年四月大乙酉朔三十日甲寅月晨見東方張賓曆四月大乙酉朔三十日甲寅月晨見東方張胄玄曆四月小乙酉朔五月大甲寅朔月晨見東方宜案影極長為冬至影極短為夏至二至自古史分可勘者二十四其二十一有影三有至日無影見行曆合一十八差者六旅騎尉張胄玄曆合者八差者一十六二差後二日一十四差後一日又開皇四年在洛州測冬至影與京師二處進退絲毫不差周天和已來案驗並在後更檢得建德四年晦朔東見張胄玄曆五月朔日月晨見東方今十七年張賓曆閏七月張胄玄曆閏五月又審至以定閏胄玄曆至既不當故知置閏必乖見行曆四月五月頻大張胄玄曆九月十月頻大為胄玄朔弱頻大在後晨故朔日殘月晨見東方宜又案開皇四年十二月十五日癸卯依曆月行在鬼三度時加酉月在卯上食十五分之九虧起西北今伺候一更一籌起食東北角十五分之十至四籌還生至二更一籌復滿五年六月三十日依曆太陽虧日在七星六度加時在午少強上食十五分之一半強虧起西南角今伺候日乃在午後六刻上始食虧起西北角十五分之六至未後一刻還生至五刻復滿六年六月十五日依曆太陰虧加時酉在卯上食十五分之九半弱虧起西南當其時陰雲不見月至辰巳雲𩹉見月已食三分之二虧從東北即還雲合至巳午間稍生至午後雲𩹉暫見已復滿十月三十日丁丑依曆太陽虧日在斗九度時加在辰少弱上食十五分之九強虧起東北角今候所見日出山一丈辰二刻始食虧起正西食三分之二辰後二刻始生入巳時三刻上復滿十年三月十六日癸卯依曆月行在氐七度時加戌月在辰太半上食十五分之七半強虧起東北今候月初出卯南帶半食出至辰初三分可食二分許漸生辰未已復滿見行曆九月十六日庚子月行在胃四度時加丑月在未半強上食十分之三半強虧起正東今伺候月以午後二刻食起正東須臾如南至未正上食南畔五分之四漸生入申一刻半復滿十二年七月十五日己未依曆月行在室七度時加戌月在辰太強上食十五分之十二半弱虧起西北今伺候一更三籌起西北上食準三分之二強與曆注同十三年七月十六日依曆月在申半強上食十五分之半弱虧起西南十五日夜從四更候月五更一籌起東北上食半強入雲不見十四年七月一日依曆時加巳弱上食十五分之十二半強至未後三刻日乃食虧起西北食半許入雲不見食頃暫見猶未復生因即雲鄣十五年十一月十六日庚午依曆月行在井十七度時加亥月在巳半上食十五分之九半強虧西北其夜一更四籌後月在辰上起食虧東南至二更三籌月在巳上食三分之二許漸生至三更一籌月在丙上復滿十六年十一月十六日乙丑依曆月行在井十七度時加丑月在未太弱上食十五分之十二半弱虧起東南十五日夜伺候至三更一籌月在丙上雲𩹉見巳食十五分之三許虧起正東至丁上食既後從東南生至四更三籌月在未末復滿而胄玄不能盡中迭相駁難高祖惑焉踰時不決會通事舍人顏慜楚上書云漢落下閎改顓頊曆作太初曆云後八百歲此曆差一日語在胄玄傳高祖欲神其事遂下詔曰朕應運受圖君臨萬宇思欲興復聖教恢弘令典上順天道下授人時搜揚海內廣延術士旅騎尉張胄玄理思沉敏術藝宏深懷道白首來上曆法令與太史舊曆並加勘審仰觀玄象參驗璿璣胄玄曆數與七曜符合太史所行乃多疏舛羣官博議咸以胄玄為密太史令劉暉司曆郭翟劉宜驍騎尉任悅往經修造致此乖謬通直散騎常侍領太史令庾季才太史丞邢俊司曆郭遠曆博士蘇粲曆助教傅俊成珍等既是職司須審疏密遂虛行此曆無所發明論暉等情狀已合科罪方共飾非護短不從正法季才等附下罔上義實難容於是暉等四人元造詐者並除名季才等六人容隱姦慝俱解見任胄玄所造曆法付有司施行擢拜胄玄為員外散騎侍郎領太史令胄玄進袁充互相引重各擅一能更為延譽胄玄言充曆妙極前賢充言胄玄曆術冠於今古胄玄學祖沖之兼傳其師法自茲厥後剋食頗中其開皇十七年所行曆術命冬至起虛五度後稍覺其疏至大業四年劉焯卒後乃敢改法命起虛七度諸法率更有增損朔終義寧今録戊辰年所定曆術著之于此云自甲子元至大業四年戊辰百四十二萬七千六百四十四年算外章歲四百一十章閏百五十一章月五千七十一日法千一百四十四月法三萬三千七百八十三辰法二百八十六歲分一千五百五十七萬三千九百六十三度法四萬二千六百四十沒分五百一十九萬一千三百二十一沒法七萬四千五百二十一周天分一千五百五十七萬四千四百六十六斗分一萬八百六十六氣法四十六萬九千四十氣時法一萬六百六十周日二十七日餘一千四百一十三周通七萬二百九周法二千五百四十八推積月術置入元已來至所求年以章月乘之如章歲得一為積月餘為閏餘閏餘三百九十七已上若冬至不在其月加積月一推月朔弦望術以月法乘積月如法得一為積日餘為小餘以六十去積日餘為大餘命以甲子算外為所求年天正月朔日天正月者建子月也今為去年十一月凡朔小餘五百三十七巳上其月大加大餘七小餘四百三十七太凡四分一為少二為半三為太小餘滿日法去之從大餘滿六十去之命如前為上弦日又加得望下弦後月
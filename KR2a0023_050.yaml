body:
  text: 隋書卷五十列傳第十五宇文慶宇文慶字神慶河南洛陽人也祖金殿魏征南大將軍仕歷五州刺史安吉侯父顯和夏州刺史慶沉深有器局少以聰敏見知周初受業東觀頗涉經史既而謂人曰書足記姓名而已安能久事筆硯為腐儒之業于時文州民夷相聚為亂慶應募從征賊據保巖谷徑路懸絶慶束馬而進襲破之以功授都督衛王直之鎮山南也引為左右慶善射有膽氣好格猛獸直甚壯之稍遷車騎大將軍儀同三司柱國府掾及誅宇文護慶有謀焉進授驃騎大將軍加開府後從武帝攻河陰先登攀堞與賊短兵接戰良久中石乃墜絶而後蘇帝勞之曰卿之餘勇可以賈人也復從武帝拔晉州其後齊師大至慶與宇文憲輕騎而覘卒與賊相遇為賊所窘憲挺身而遁慶退據汾橋衆賊爭進慶引弓射之所中人馬必倒賊乃稍却及破高緯拔高壁克并州下信都禽高湝功並居最周武帝詔曰慶勳庸早著英望華遠出內之績簡在朕心戎車自西俱總行陳東夏蕩定實有茂功高位縟禮宜崇榮册於是進位大將軍封汝南郡公邑千六百戶尋以行軍總管擊延安反胡平之拜延州總管俄轉寧州總管高祖為丞相復以行軍總管南征江表師次白帝徵還以勞進位上大將軍高祖與慶有舊甚見親待令督丞相軍事委以心腹尋加柱國開皇初拜左武衛將軍進位上柱國數年出除涼州總管歲餘徵還不任以職初上潛龍時嘗從容與慶言及天下事上謂慶曰天元實無積德視其相貌壽亦不長加以法令繁苛耽恣聲色以吾觀之殆將不久又復諸侯微弱各令就國曾無深根固本之計羽翮既剪何能及遠哉尉迥貴戚早著聲望國家有釁必為亂階然智量庸淺子弟輕佻貪而少惠終致亡滅司馬消難反覆之虜亦非池內之物變成俄頃但輕薄無謀未能為害不過自竄江南耳庸蜀嶮隘易生艱阻王謙愚蠢素無籌略但恐為人所誤不足為虞未幾上言皆驗及此慶恐上遺忘不復收用欲見舊蒙恩顧具録前言為表而奏之曰臣聞智侔造化二儀無以隱其靈明同日月萬象不能藏其狀先天弗違實聖人之體道未萌見兆諒達節之神機伏惟陛下特挺生知徇齊誕御懷五嶽其猶輕吞八荒而不梗蘊妙見於胸襟運奇謨於掌握臣以微賤早逢天眷不以庸下親蒙推赤所奉成規纖毫弗舛尋惟聖慮妙出蓍龜驗一人之慶有徵實天子之言無戲臣親聞親見實榮實喜上省表大悅下詔曰朕之與公本來親密懷抱委曲無所不盡話言歲久尚能記憶今覽表奏方悟昔談何謂此言遂成實録古人之先知禍福明可信也朕言之驗自是偶然公乃不忘彌表誠節深感至意嘉尚無已自是上每加優禮卒于家子靜禮初為太子千牛備身尋尚高祖女廣平公主授儀同安德縣公邑千五百戶後為熊州刺史先慶卒子協歷武賁郎將右翊衛將軍宇文化及之亂遇害協弟皛字婆羅門大業之世少養宮中後為千牛左右煬帝甚親昵之每有遊宴皛必侍從至於出入臥內伺察六宮往來不限門禁其恩幸如此時人號曰宇文三郎皛與宮人淫亂至於妃嬪公主亦有醜聲蕭后言於帝皛聞而懼數日不敢見其兄協因奏曰皛今已壯不可在宮掖帝曰皛安在協曰在朝堂帝不之罪因召入待之如初宇文化及弒逆之際皛時在玄覽門覺變將入奏為門司所遏不得時進會日暝宮門閉退還所守俄而難作皛與五十人赴之為亂兵所害李禮成李禮成字孝諧隴西狄道人也涼王皓之六世孫祖延實魏司徒父彧侍中禮成年七歲與姑之子蘭陵太守滎陽鄭皓隨魏武帝入關皓母每謂所親曰此兒平生未嘗回顧當為重器耳及長沉深有行檢不妄通賓客魏大統中釋褐著作郎遷太子洗馬員外散騎常侍周受禪拜平東將軍散騎常侍于時貴公子皆競習弓馬被服多為軍容禮成雖善騎射而從容儒服不失素望後以軍功拜車騎大將軍儀同三司賜爵修陽縣侯拜遷州刺史時朝廷有所徵發禮成度以蠻夷不可擾擾必為亂上表固諫周武帝從之伐齊之役從帝圍晉陽禮成以兵擊南門齊將席毗羅率精甲數千拒帝禮成力戰擊退之加開府進封冠軍縣公拜北徐州刺史未幾徵為民部中大夫禮成妻竇氏早沒知高祖有非常之表遂聘高祖妹為繼室情契甚歡及高祖為丞相進位上大將軍遷司武上大夫委以心膂及受禪拜陝州刺史進封絳郡公賞賜優洽尋徵為左衛將軍遷右武衛大將軍歲餘出拜襄州總管稱有惠政後數載復為左衛大將軍時突厥屢為寇患緣邊要害多委重臣由是拜寧州刺史歲餘以疾徵還京師終於家其子世師官至度支侍郎元孝矩弟褒元孝矩河南洛陽人也祖修義父子均並為魏尚書僕射孝矩西魏時襲爵始平縣公拜南豐州刺史時見周太祖專政將危元氏孝矩每慨然有興復社稷之志陰謂昆季曰昔漢氏有諸呂之變朱虛東牟卒安劉氏今宇文之心路人所見顛而不扶焉用宗子盍將圖之為兄則所遏孝矩乃止其後周太祖為兄子晉公護娶孝矩妹為妻情好甚密及閔帝受禪護總百揆孝矩之寵益隆及護誅坐徙蜀數載徵還京師拜益州總管司馬轉司憲大夫高祖重其門地娶其女為房陵王妃及高祖為丞相拜少冢宰進位柱國賜爵洵陽郡公時房陵王鎮洛陽及上受禪立為皇太子令孝矩代鎮既而立其女為皇太子妃親禮彌厚俄拜壽州總管賜孝矩璽書曰揚越氛祲侵軼邊鄙爭桑興役不識大猷以公志存遠略今故鎮邊服懷柔以禮稱朕意焉時陳將任蠻奴等屢寇江北復以孝矩領行軍總管屯兵於江上後數載自以年老筋力漸衰不堪軍旅上表乞骸骨轉涇州刺史高祖下書曰知執謙撝請歸初服恭膺寶命實賴元功方欲委裘寄以分陝何容便請高蹈獨為君子者乎若以邊境務煩即宜徙節涇郡養德臥治也在州歲餘卒官年五十九諡曰簡子無竭嗣孝矩兄子文都見誠節傳孝矩次弟雅字孝方有文武幹用開皇中歷左領左右將軍集沁二州刺史封順陽郡公季弟褒最知名褒字孝整便弓馬少有成人之量年十歲而孤為諸兄所鞠養性友悌善事諸兄諸兄議欲別居褒泣諫不得家素富多金寶褒無所受脫身而出為州里所稱及長寬仁大度涉獵書史仕周官至開府北平縣公趙州刺史及高祖為丞相從韋孝寬擊尉迥以功超拜柱國進封河間郡公邑二千戶開皇二年拜安州總管歲餘徙原州總管有商人為賊所劫其人疑同宿者而執之褒察其色寃而辭正遂捨之商人詣闕訟褒受金縱賊上遣使窮治之使者簿責褒曰何故利金而捨盜也褒便即引咎初無異詞使者與褒俱詣京師遂坐免官其盜尋發於他所上謂褒曰公朝廷舊人位望隆重受金捨盜非善事何至自誣也對曰臣受委一州不能息盜賊臣之罪一也州民為人所謗不付法司懸即放免臣之罪二也牽率愚誠無顧形迹不恃文書約束至令為物所疑臣之罪三也臣有三罪何所逃責臣又不言受賂使者復將有所窮究然則縲紲橫及良善重臣之罪是以自誣上歎異之稱為長者十四年以行軍總管屯兵備邊遼東之役復以行軍總管從漢王至柳城而還仁壽初嘉州夷獠為寇褒率步騎二萬擊平之煬帝即位拜齊州刺史尋改為齊郡太守吏民安之及興遼東之役郡官督事者前後相屬有西曹掾當行詐疾褒詰之掾理屈褒杖之掾遂大言曰我將詣行在所欲有所告褒大怒因杖百餘數日而死坐是免官卒於家時年七十三郭榮郭榮字長榮自云太原人也父徽魏大統末為同州司馬時武元皇帝為刺史由是與高祖有舊徽後官至洵州刺史安城縣公及高祖受禪拜太僕卿數年卒官榮容貌魁岸外疏內密與其交者多愛之周大冢宰宇文護引為親信護察榮謹厚擢為中外府水曹參軍時齊寇屢侵護令榮於汾州觀賊形勢時汾州與姚襄鎮相去懸遠榮以為二城孤迥勢不相救請於州鎮之間更築一城以相控攝護從之俄而齊將段孝先攻陷姚襄汾州二城唯榮所立者獨能自守護作浮橋出兵渡河與孝先戰孝先於上流縱大筏以擊浮橋護令榮督便水者引取其筏以功授大都督護又以稽胡數為寇亂使榮綏集之榮於上郡延安築周昌弘信廣安招遠咸寧等五城以遏其要路稽胡由是不能為寇武帝親總萬機拜宣納中士後從帝平齊以戰功賜馬二十匹綿絹六百段封平陽縣男遷司水大夫榮少與高祖親狎情契極歡嘗與高祖夜坐月下因從容謂榮曰吾仰觀玄象俯察人事周歷已盡我其代之榮深自結納宣帝崩高祖總百揆召榮撫其背而笑曰吾言驗未即拜相府樂曹參軍俄以本官復領蕃部大夫高祖受禪引為內史舍人以龍潛之舊進爵蒲城郡公加位上儀同纍遷通州刺史仁壽初西南夷獠多叛詔榮領八州諸軍事行軍總管率兵討之歲餘悉平賜奴婢三百餘口煬帝即位入為武候驃騎將軍以嚴正聞後數歲黔安首領田羅駒阻清江作亂夷陵諸郡民夷多應者詔榮擊平之遷左候衛將軍從帝西征吐谷渾拜銀青光祿大夫遼東之役以功進位左光祿大夫明年帝復事遼東榮以為中國疲敝萬乘不宜屢動乃言於帝曰戎狄失禮臣下之事臣聞千鈞之弩不為鼷鼠發機豈有親辱大駕以臨小寇帝不納復從軍攻遼東城榮親蒙矢石晝夜不釋甲胄百餘日帝每令人窺諸將所為知榮如是帝大悅每勞勉之九年帝至東都謂榮曰公年德漸高不宜久涉行陳當與公一郡任所選也榮不願違離頓首陳讓辭情哀苦有感帝心於是拜為右候衛大將軍後數日帝謂百僚曰誠心純至如郭榮者固無比矣其見信如此楊玄感之亂帝令馳守太原明年復從帝至柳城遇疾帝令存問動靜中使相望卒於懷遠鎮時年六十八帝為之廢朝贈兵部尚書諡曰恭贈物千段有子福善龐晃龐晃字元顯榆林人也父虬周驃騎大將軍晃少以良家子刺史杜達召補州都督周太祖既有關中署晃大都督領親信兵常置左右晃因徙居關中後遷驃騎將軍襲爵比陽侯衛王直出鎮襄州晃以本官從尋與長湖公元定擊江南孤軍深入遂沒於陳數年衛王直遣晃弟車騎將軍元俊齎絹八百匹贖焉乃得歸朝拜上儀同賜綵二百段復事衛王時高祖出為隨州刺史路經襄陽衛王令晃詣高祖晃知高祖非常人深自結納及高祖去官歸京師晃迎見高祖於襄邑高祖甚歡晃因白高祖曰公相貌非常名在圖籙九五之日幸願不忘高祖笑曰何妄言也頃之有一雄雉鳴於庭高祖命晃射之曰中則有賞然富貴之日持以為驗晃既射而中高祖撫掌大笑曰此是天意公能感之而中也因以二婢賜之情契甚密武帝時晃為常山太守高祖為定州總管屢相往來俄而高祖轉亳州總管將行意甚不悅晃因白高祖曰燕代精兵之處今若動衆天下不足圖也高祖握晃手曰時未可也晃亦轉為車騎將軍及高祖為揚州總管奏晃同行既而高祖為丞相進晃位開府命督左右甚見親待及踐阼謂晃曰射雉之符今日驗不晃再拜曰陛下應天順民君臨宇內猶憶曩時之言不勝慶躍上笑曰公之此言何得忘也尋加上開府拜右衛將軍進爵為公邑千五百戶河間王弘之擊突厥也晃以行軍總管從至馬邑別路出賀蘭山擊賊破之斬首千餘級晃性剛悍時廣平王雄當塗用事勢傾朝廷晃每陵侮之嘗於軍中臥見雄不起雄甚銜之復與高熲有隙二人屢譖晃由是宿衛十餘年官不得進出為懷州刺史數歲遷原州總管仁壽中卒官年七十二高祖為之廢朝贈物三百段米三百石諡曰敬子長壽頗知名官至驃騎將軍李安李安字玄德隴西狄道人也父蔚仕周為朔燕三州刺史襄武縣公安美姿儀善騎射周天和中釋褐右侍上士襲爵襄武公俄授儀同少師右上士高祖作相引之左右遷職方中大夫復拜安弟哲為儀同安叔父梁州刺史璋時在京師與周趙王謀害高祖誘哲為內應哲謂安曰寢之則不忠言之則不義失忠與義何以立身安曰丞相父也其可背乎遂陰白之及趙王等伏誅將加官賞安頓首而言曰兄弟無汗馬之勞過蒙奬擢合門竭節無以酬謝不意叔父無狀為凶黨之所蠱惑覆宗絶嗣其甘若薺蒙全首領為幸實多豈可將叔父之命以求官賞於是俯伏流涕悲不自勝高祖為之改容曰我為汝特存璋子乃命有司罪止璋身高祖亦為安隱其事而不言尋授安開府進封趙郡公哲上儀同黃臺縣男高祖即位授安內史侍郎轉尚書左丞黃門侍郎平陳之役以為楊素司馬仍領行軍總管率蜀兵順流東下時陳人屯白沙安謂諸將曰水戰非北人所長今陳人依險泊船必輕我而無備以夜襲之賊可破也諸將以為然安率衆先鋒大破陳師高祖嘉之詔書勞曰陳賊之意自言水戰為長險隘之間彌謂官軍所憚開府親將所部夜動舟師摧破賊徒生擒虜衆益官軍之氣破賊人之膽副朕所委聞以欣然進位上大將軍除郢州刺史數日轉鄧州刺史安請為內職高祖重違其意除左領左右將軍俄遷右領軍大將軍復拜哲開府儀同三司備身將軍兄弟俱典禁衛恩信甚重八年突厥犯塞以安為行軍總管從楊素擊之安別出長川會虜渡河與戰破之仁壽元年出安為寧州刺史哲為衛州刺史安子瓊哲子瑋始自襁褓乳養宮中至是年八九歲始命歸家其見親顧如是高祖嘗言及作相時事因愍安兄弟滅親奉國乃下詔曰先王立教以義斷恩割親愛之情盡事君之道用能弘奬大節體此至公往者周歷既窮天命將及朕登庸惟始王業初基承此澆季實繁姦宄上大將軍寧州刺史趙郡公李安其叔璋潛結藩枝扇惑猶子包藏不逞禍機將發安與弟開府儀同三司衛州刺史黃臺縣男哲深知逆順披露丹心凶謀既彰罪人斯得朕每念誠節嘉之無已疇庸册賞宜不踰時但以事涉其親猶有疑惑欲使安等名教之方自處有地朕常為思審遂致淹年今更詳按聖典求諸往事父子天性誠孝猶不並立況復叔姪恩輕情禮本有差降忘私奉國深得正理宜録舊勳重弘賞命於是拜安哲俱為柱國賜縑各五千匹馬百匹羊千口復以哲為備身將軍進封順陽郡公安謂親族曰雖家門獲全而叔父遭禍今奉此詔悲愧交懷因歔欷悲感不能自勝先患水病於是疾甚而卒時年五十三諡曰懷子瓊嗣少子孝恭最有名哲後坐事除名配防嶺南道病卒史臣曰宇文慶等龍潛惟舊疇昔親姻或素盡平生之言或早有腹心之託霑雲雨之餘潤照日月之末光騁步天衢與時升降高位厚秩貽厥後昆優矣皛幼養宮中未聞教義煬帝愛之不以禮其能不及於此乎安哲之於高祖未有君臣之分陷其骨肉使就誅夷大義滅親所聞異於此矣雖有悲悼何損於愆

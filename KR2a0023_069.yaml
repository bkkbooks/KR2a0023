body:
  text: 隋書卷六十九列傳第三十四王劭王劭字君懋太原晉陽人也父松年齊通直散騎侍郎劭少沈默好讀書弱冠齊尚書僕射魏收辟參開府軍事累遷太子舍人待詔文林館時祖孝徵魏收陽休之等嘗論古事有所遺忘討閱不能得因呼劭問之劭具論所出取書驗之一無舛誤自是大為時人所許稱其博物後遷中書舍人齊滅入周不得調高祖受禪授著作佐郎以母憂去職在家著齊書時制禁私撰史為內史侍郎李元操所奏上怒遣使收其書覽而悅之於是起為員外散騎侍郎修起居注劭以古有鑽燧改火之義近代廢絕於是上表請變火曰臣謹案周官四時變火以救時疾明火不數變時疾必興聖人作法豈徒然也在晉時有以洛陽火渡江者代代事之相續不滅火色變青昔師曠食飯云是勞薪所爨晉平公使視之果然車輞今溫酒及炙肉用石炭柴火竹火草火麻荄火氣味各不同以此推之新火舊火理應有異伏願遠遵先聖於五時取五木以變火用功甚少救益方大縱使百姓習久未能頓同尚食內及東宮諸主食不可不依古法上從之劭又言上有龍顏戴干之表指示羣臣上大悅賜物數百段拜著作郎劭上表言符命曰昔周保定二年歲在壬午五月五日青州黃河變清十里鏡澈齊氏以為己瑞改元曰河清是月至尊以大興公始作隋州刺史歷年二十隋果大興臣謹案易坤靈圖曰聖人受命瑞先見於河河者最濁未能清也竊以靈貺休祥理無虛發河清啟聖實屬大隋午為鶉火以明火德仲夏火王亦明火德月五日五合天數地數既得受命之辰允當先見之兆開皇初邵州人楊令悊近河得青石圖一紫石圖一皆隱起成文有至尊名下云八方天心永州又得石圖剖為兩段有楊樹之形黃根紫葉汝水得神龜腹下有文曰天卜楊興安邑掘地得古鐵版文曰皇始天年賚楊鐵券王興同州得石龜文曰天子延千年大吉臣以前之三石不異龍圖何以用石石鐵久固義與上名符合龜腹七字何以著龜龜亦久固兼是神靈之物孔子歎河不出圖洛不出書今於大隋聖世圖書屢出建德六年亳州大周村有龍鬬白者勝黑者死大象元年夏熒陽汴水北有龍鬬初見白氣屬天自東方歷陽武而來及至白龍也長十許丈有黑龍乘雲而至兩相薄乍合乍離自午至申白龍升天黑龍墜地謹案龍君象也前鬬於𩗗州周村者蓋象至尊以龍鬬之歲為亳州總管遂代周有天下後鬬於熒陽者熒字三火明火德之盛也白龍從東方來歷陽武者蓋象至尊將登帝位從東第入自崇陽門也西北升天者當乾位天門坤靈圖曰聖人殺龍龍不可得而殺皆盛氣也又曰泰姓商名宮黃色長八尺六十世河龍以正月辰見白龍與五黑龍鬬白龍陵故泰人有命謹案此言皆為大隋而發也聖人殺龍者前後龍死是也姓商者皇家於五姓為商也名宮者武元皇帝諱於五聲為宮黃色者隋色尚黃長八尺者武元皇帝身長八尺河龍以正月辰見者泰正月卦龍見之所於京師為辰地白龍與黑龍鬬者亳州熒陽龍鬬是也勝龍所以白者楊姓納音為商至尊又辛酉歲生位皆在西方西方色白也死龍所以黑者周色黑所以稱五者周閔明武宣靖凡五帝趙陳代越滕五王一時伏法亦當五數白龍陵者陵猶勝也鄭玄說陵當為除凡鬬能去敵曰除臣以泰人有命者泰之為言通也大也明其人道通德大有天命也乾鑿度曰泰表戴干鄭玄注云表者人形體之彰識也干盾也泰人之表戴干臣伏見至尊有戴干之表益知泰人之表不爽毫釐坤靈圖所云字字皆驗緯書又稱漢四百年終如其言則知六十世亦必然矣昔宗周卜世三十今則倍之稽覽圖云太平時陰陽和合風雨咸同海內不偏地有阻險故風有遲疾雖太平之政猶有不能均同唯平均乃不鳴條故欲風於亳亳者陳留也謹案此言蓋明至尊者為陳留公世子亳州總管遂受天命海內均同不偏不黨以成太平之風化也在大統十六年武元皇帝改封陳留公是時齊國有祕記云天王陳留入幷州齊王高洋為是誅陳留王彭樂其後武元皇帝果將兵入幷州周武帝時望氣者云亳州有天子氣於是殺亳州刺史紇豆陵恭至尊代為之又陳留老子祠有枯柏世傳云老子將度世云待枯柏生東南枝廻指當有聖人出吾道復行至齊枯柏從下生枝東南上指夜有三童子相與歌曰老子廟前古枯樹東南狀如傘聖主從此去及至尊牧亳州親至祠樹之下自是柏枝廻抱其枯枝漸指西北道教果行校考衆事太平主出於亳州陳留之地皆如所言稽覽圖又云治道得則陰物變為陽物鄭玄注云葱變為韭亦是謹案自六年以來遠近山石多變為玉石為陰玉為陽又左衞園中葱皆變為韭上覽之大悅賜物五百段未幾劭復上書曰易乾鑿度曰隨上六拘係之乃從維之王用享于西山隨者二月卦陽德施行藩決難解萬物隨陽而出故上六欲九五拘係之維持之明被陽化而陰隨從之也易稽覽圖坤六月有子女任政一年傳為復五月貧之從東北來立大起土邑西北地動星墜陽衞屯十一月神人從中山出趙地動北方三十日千里馬數至謹案凡此易緯所言皆是大隋符命隨者二月之卦明大隋以二月即皇帝位也陽德施行者明楊氏之德教施行於天下也藩決難解者明當時藩鄣皆是通決險難皆解散也萬物隨陽而出者明天地間萬物盡隨楊氏而出見也上六欲九五拘係之者五為王六為宗廟明宗廟神靈欲令登九五之位帝王拘民以禮係民以義也拘民以禮係民以義此二句亦是乾鑿度之言維持之者明能以綱維持正天下也被陽化而欲陰隨之者明陰類被服楊氏之風化莫不隨從陰謂臣下也王用享于西山者蓋明至尊常以歲二月幸西山仁壽宮也凡四稱隨三稱陽欲美隋楊丁寧之至也坤六月者坤位在未六月建未言至尊以六月生也有子女任政者言樂平公主是皇帝子女而為周后任理內政也一年傳為復者復是坤之一世卦陽氣初起言周宣帝崩後一年傳位與楊氏也五月貧之從東北來立者貧之當為真人字之誤也言周宣帝以五月崩真人革命當在此時至尊謙讓而逆天意故踰年乃立昔為定州總管在京師東北本而言之故曰真人從東北來立大起土邑者大起即大興言營大興城邑也西北地動星墜者蓋天意去周授隋故變動也陽衞者言楊氏得天衞助屯十一月神人從中山出者此卦動而大亨作故至尊以十一月被授亳州總管將從中山而出也趙地動者中山為趙地以神人將去故變動也北方三十日者蓋至尊從北方將往亳州之時停留三十日也千里馬者蓋至尊舊所乘騧騮馬也屯卦震下坎上震於馬作足坎於馬為美脊是故騧騮馬脊有肉鞍行則先作弄四足也數至者言曆數至也河圖帝通紀曰形瑞出變矩衡赤應隨協靈皇河圖皇參持曰皇辟出承元訖道無為治率被遂矩戲作術開皇色握神日投輔提象不絕立皇後翼不格道終始德優劣帝任政河曲出協輔嬉爛可述謹案凡此河圖所言亦是大隋符命形瑞出變矩衡者矩法也衡北斗星名所謂璿璣玉衡者也大隋受命形兆之瑞始出天象則為之變動北斗主天之法度故曰矩衡易緯伏戲矩衡神鄭玄注亦以為法玉衡之神與此河圖矩衡義同赤應隋者言赤帝降精感應而生隋也故隋以火德為赤帝天子協靈皇者協合也言大隋德合上靈天皇大帝也又年號開皇與靈寶經之開皇年相合故曰協靈皇皇辟出者皇大也辟君也大君出蓋謂至尊受命出為天子也承元訖者言承周天元終訖之運也道無為治率者治下脫一字言大道無為治定天下率從被遂矩戲作術者矩法也昔遂皇握機矩伏戲作八卦之術言大隋被服三皇之法術也遂皇機矩語見易緯開皇色者言開皇年易服色也握神日者握持羣神明照如日也又開皇以來日漸長亦其義投輔提者言投授政事於輔佐使之提挈也象不絕者法象不廢絕也立皇後翼不格者格至也言本立太子以為皇家後嗣而其輔翼之人不能至於善也道終始德優劣者言前東宮道終而德劣今皇太子道始而德優也帝任政河曲出者言皇帝親任政事而邵州河濱得石圖也協輔嬉爛可述者協合也嬉興也言羣臣合心輔佐以興政治爛然可紀述也所以於皇參持帝通紀二篇陳大隋符命者明皇道帝德盡在隋也上大悅以劭為至誠寵錫日隆時有人於黃鳳泉浴得二白石頗有文理遂附致其文以為字復言有諸物象而上奏曰其大玉有日月星辰八卦五岳及二麟雙鳳青龍朱雀騶玄武各當其方位又有五行十日十二辰之名凡二十七字又有天門地戶人門鬼門閉九字又有却非及二鳥其鳥皆人面則抱朴子所謂千秋萬歲也其小玉亦有五嶽却非虯犀之象二玉俱有仙人玉女乘雲控鶴之象別有異狀諸神不可盡識蓋是風伯雨師山精海若之類又有天皇大帝皇帝及四帝坐鉤陳北斗三公天將軍土司空老人天倉南河北河五星二十八宿凡四十五官諸字本無行伍然往往偶對於大玉則有皇帝姓名並臨南面與日字正鼎足復有老人星蓋明南面象日而長壽也皇后二字在西上有月形蓋明象月也於次玉則皇帝名與九千字次比兩楊字與萬年字次比隋與吉字正並蓋明長久吉慶也劭復廻互其字作詩二百八十篇奏之上以為誠賜帛千匹劭於是採民間歌謠引圖書讖緯依約符命捃摭佛經撰為皇隋靈感誌合三十卷奏之上令宣示天下劭集諸州朝集使洗手焚香閉目而讀之曲折其聲有如歌詠經涉旬朔徧而後罷上益喜賞賜優洽仁壽中文獻皇后崩劭復上言曰佛說人應生天上及上品上生無量壽國之時天佛放大光明以香花妓樂來迎之如來以明星出時入涅槃伏惟大行皇后聖德仁慈福善禎符備諸祕記皆云是妙善菩薩臣謹案八月二十二日仁壽宮內再雨金銀之花二十三日大寶殿後夜有神光二十四日卯時永安宮北有自然種種音樂震滿虛空至夜五更中奄然如寐便即升遐與經文所說事皆符驗臣又以愚意思之皇后遷化不在仁壽大興宮者蓋避至尊常居正處也在永安宮者象京師之永安門平生所出入也后升遐後二日苑內夜有鍾聲三百餘處此則生天之應顯然也上覽而且悲且喜時蜀王秀以罪廢上顧謂劭曰嗟乎吾有五子三子不才劭進曰自古聖帝明王皆不能移不肖之子黃帝有二十五子同姓者二餘各異德堯十子舜九子皆不肖夏有五觀周有三監上然其言其後上夢欲上高山而不能得崔彭捧脚李盛扶肘得上因謂彭曰死生當與爾俱劭曰此夢大吉上高山者明高崇大安永如山也彭猶彭祖李猶李老二人扶侍實為長壽之徵上聞之喜見容色其年上崩未幾崔彭亦卒煬帝嗣位漢王諒作亂帝不忍加誅劭上書曰臣聞黃帝滅炎蓋云母弟周公誅管信亦天倫叔向戮叔魚仲尼謂之遺直石碏殺石厚丘明以為大義此皆經籍明文帝王常法今陛下置此逆賊度越前聖含弘寬大未有以謝天下謹案賊諒毒被生民者也是知古者同德則同姓異德則異姓故黃帝有二十五子其得姓者十有四人唯青陽夷鼓與黃帝同為姬姓諒既自絕請改其氏劭以此求媚帝依違不從遷祕書少監數載卒官劭在著作將二十年專典國史撰隋書八十卷多錄口勑又採迂怪不經之語及委巷之言以類相從為其題目辭義繁雜無足稱者遂使隋代文武名臣列將善惡之迹堙沒無聞初撰齊誌為編年體二十卷復為齊書紀傳一百卷及平賊記三卷或文詞鄙野或不軌不物駭人視聽大為有識所嗤鄙然其採擿經史謬誤為讀書記三十卷時人服其精博爰自志學暨乎暮齒篤好經史遺落世事用思既專性頗怳忽每至對食閉目凝思盤中之肉輒為僕從所噉劭弗之覺唯責肉少數罰人人以情白劭劭依前閉目伺而獲之人方免笞辱其專固如此袁充袁充字德符本陳郡陽夏人也其後寓居丹陽祖昂父君正俱為梁侍中充少警悟年十餘歲其父黨至門時冬初充尚衣葛衫客戲充曰袁郎子絺兮兮淒其以風充應聲答曰唯絺與服之無斁以是大見嗟賞仕陳年十七為秘書郎歷太子舍人晉安王文學吏部侍郎散騎常侍及陳滅歸國歷蒙鄜二州司馬充性好道術頗解占候由是領太史令時上將廢皇太子正窮治東宮官屬充見上雅信符應因希旨進曰比觀玄象皇太子當廢上然之充復表奏隋興已後日影漸長曰開皇元年冬至日影一丈二尺七寸二分自爾漸短至十七年冬至影一丈二尺六寸三分四年冬至在洛陽測影一丈二尺八寸八分二年夏至影一尺四寸八分自爾漸短至十六年夏至影一尺四寸五分周官以土圭之法正日影日至之影尺有五寸鄭玄云冬至之影一丈三尺今十六年夏至之影短於舊影五分十七年冬至之影短於舊影三寸七分日去極近則影短而日長去極遠則影長而日短行內道則去極近外道則去極遠堯典云日短星昴以正仲冬據昴星昏中則知堯時仲冬日在須女十度以曆數推之開皇已來冬至日在斗十一度與唐堯之代去極並近謹案春秋元命包云日月出內道琁璣得常天帝崇靈聖王祖功京房別對曰太平日行上道升平行次道霸世行下道伏惟大隋啟運上感乾元影短日長振古未之有也上大悅告天下將作役功因加程課丁匠苦之仁壽初充言上本命與陰陽律呂合者六十餘條而奏之因上表曰皇帝載誕之初非止神光瑞氣嘉祥應感至於本命行年生月生日並與天地日月陰陽律呂運轉相符表𩹉合會此誕聖之異寶曆之元今與物更新改年仁壽歲月日子還共誕聖之時並同明合天地之心得仁壽之理故知洪基長算永永無窮上大悅賞賜優崇儕輩莫之比仁壽四年甲子歲煬帝初即位充及太史丞高智寶奏言去歲冬至日影逾長今歲皇帝即位與堯受命年合昔唐堯受命四十九年到上元第一紀甲子天正十一月庚戌冬至陛下即位其年即當上元第一紀甲子天正十一月庚戌冬至正與唐堯同自放勳以來凡經八上元其間緜代未有仁壽甲子之合謹案第一紀甲子太一在一宮天目居武德陰陽曆數並得符同唐堯丙辰生丙子年受命止合三五未若己丑甲子支干並當六合允一元三統之期合五紀九章之會共帝堯同其數與皇唐比其蹤信所謂皇哉唐哉唐哉皇哉者矣仍諷齊王暕率百官拜表奉賀其後熒惑守太微者數旬于時繕治宮室征役繁重充上表稱陛下修德熒惑退舍百僚畢賀帝大喜前後賞賜將萬計時軍國多務充候帝意欲有所為便奏稱天文見象須有改作以是取媚於上大業六年遷內史舍人從征遼東拜朝請大夫秘書少監其後天下亂帝初罹雁門之厄又盜賊益起帝心不自安充復假託天文上表陳嘉瑞以媚於上曰臣聞皇天輔德皇天福謙七政斯齊三辰告應伏惟陛下握錄圖而馭黔首提萬善而化八紘以百姓為心匪以一人受慶先天罔違所欲後天必奉其時是以初膺寶曆正當上元之紀乾之初九又與天命符會斯則聖人冥契故能動合天經謹按去年已來玄象星瑞毫釐無爽謹錄尤異上天降祥破突厥等狀七事其一去八月二十八日夜大流星如斗出王良北正落突厥營聲如崩牆其二八月二十九日夜復有大流星如斗出羽林向北流正當北方依占頻二夜流星墜賊所賊必敗散其三九月四日夜頻有兩星大如斗出北斗魁向東北流依占北斗主殺伐賊必敗其四歲星主福德頻行京都二處分野依占國家之福其五七月內熒惑守羽林九月七日已退舍依占不出三日賊必敗散其六去年十一月二十日夜有流星赤如火從東北向西南落賊帥盧明月營破其橦車其七十二月十五日夜通漢鎮北有赤氣亘北方突厥將亡之應也依勘城錄河南洛陽並當甲子與乾元初九爻及上元甲子符合此是福地永無所慮旋觀往政側聞前古彼則異時間出今則一朝總萃豈非天贊有道助殲兇孽方清九夷於東獩沉五狄於北溟告成岱岳無為汾水書奏帝大悅超拜秘書令親待逾昵帝每欲征討充皆預知之乃假託星象奬成帝意在位者皆切患之宇文化及殺逆之際幷誅充時年七十五史臣曰王劭爰自幼童迄乎白首好學不倦究極羣書搢紳洽聞之士無不推其博物雅好著述久在史官既撰齊書兼修隋典好詭怪之說尚委巷之談文詞鄙穢體統繁雜直愧南董才無遷固徒煩翰墨不足觀採袁充少在江左初以警悟見稱委質隋朝更以玄象自命並要求時幸干進務入劭經營符瑞雜以妖訛充變動星占謬增晷影厚誣天道亂常侮衆刑茲勿捨其在斯乎且劭為河朔清流充乃江南望族乾沒榮利得不以道頹其家聲良可歎息

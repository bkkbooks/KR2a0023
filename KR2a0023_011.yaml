body:
  text: 隋書卷十一志第六禮儀六梁制乘輿郊天祀地禮明堂祠宗廟元會臨軒則黑介幘通天冠平冕俗所謂平天冠者也其制玄表朱緑𩹉廣七寸長尺二寸加於通天冠上前垂四寸後垂三寸前圓而後方垂白玉珠十有二旒其長齊肩以組為纓各如其綬色傍垂黈纊珫珠以玉瑱其衣皂上絳下前三幅後四幅衣畫而裳繡衣則日月星辰山龍華蟲火宗彝畫以為繢裳則藻粉米黼黻以為繡凡十二章素帶廣四寸朱𩹉以朱繡裨飾其側中衣以絳緣領袖赤皮為蓋古之韍也絳袴襪赤舄佩白玉垂朱黃大綬黃赤縹紺四采革帶帶劍緄帶以組為之如綬色黃金辟邪首為帶鐍而飾以白玉珠又有通天冠高九寸前加金博山述黑介幘絳紗袍皂緣中衣黑舄是為朝服元正賀畢還儲更衣出所服也其釋奠先聖則皂紗袍絳緣中衣絳袴襪黑舄臨軒亦服袞冕未加元服則空頂介幘拜陵則箋布單衣介幘又有五梁進賢冠遠遊平上幘武冠單衣黑介幘宴會則服之單衣白帢以代古之疑衰皮辨為弔服為羣臣舉哀臨喪則服之天監三年何佟之議公卿以下祭服𩹉有中衣即今之中單也案後漢輿服志明帝永平二年初詔有司採周官禮記尚書乘輿服從歐陽説公卿以下服從大小夏侯説祭服絳緣領袖為中衣絳袴襪示其赤心奉神今中衣絳緣足有所明無俟於袴既非聖法謂不可施遂依議除之四年有司言平天冠等一百五條自齊以來隨故而毀未詳所送何佟之議禮祭服敝則焚之於是並燒除之其珠玉以付中署七年周捨議詔旨以王者袞服宜畫鳳皇以示差降按禮有虞氏皇而祭深衣而養老鄭玄所言皇則是畫鳳皇羽也又按禮所稱雜服皆以衣定名猶如袞冕則是袞衣而冕明有虞言皇者是衣名非冕明矣畫鳳之旨事實灼然制可又王僧崇云今祭服三公衣身畫獸其腰及袖又有青獸形與獸同義應是蜼即宗彝也兩袖各有禽鳥形類鸞鳳似是華蟲今畫宗彝即是周禮但鄭玄云蜼屬昂鼻長尾是獸之輕小者謂宜不得同獸尋冕服無鳳應改為雉又裳有圓花於禮無礙疑是畫師加葩花耳藻米黼黻並乖古制今請改正並去圓花帝曰古文日月星辰此以一辰攝三物也山龍華蟲又以一山攝三物也藻火粉米又以一藻攝三物也是為九章今袞服畫龍則宜應畫鳳明矣孔安國云華者花也則為花非疑若一向畫雉差降之文復將安寄鄭義是所未允又帝曰禮王者祀昊天上帝則大裘而冕祀五帝亦如之又云莞席之安而蒲越秸之用斯皆至敬無文貴誠重質今郊用陶匏與古不異而大裘蒲秸獨不復存其於質敬恐有未盡且一獻為質其劍佩之飾及公卿所著冕服可共詳定五經博士陸瑋等並云祭天猶存掃地之質而服章獨取黼黻為文於義不可今南郊神座皆用苮席此獨莞類未盡質素之理宜以秸為下藉蒲越為上席又司服云王祀昊天服大裘明諸臣禮不得同自魏以來皆用袞服今請依古更制大裘制可瑋等又尋大裘之制唯鄭玄注司服云大裘羔裘也既無所出未可為據案六冕之服皆玄上纁下今宜以玄繒為之其制式如裘其裳以纁皆無文繡冕則無旒詔可又乘輿宴會服單衣黑介幘舊三日九日小會初出乘金輅服之八年帝改去還皆乘輦服白紗帽九年司馬筠等參議禮記玉藻云諸侯玄冕以祭裨冕以朝雜記又云大夫冕而祭於公辨而祭於己今之尚書上異公侯下非卿士止有朝衣本無冕服但既預齋祭不容同在於朝宜依太常及博士諸齋官例著皂衣絳襈中單竹葉冠若不親奉則不須入廟帝從之十一年尚書參議按禮跣襪事由燕坐屨不宜陳尊者之側今則極敬之所莫不皆跣清廟崇嚴既絶禮凡有履行者應皆跣襪詔可陳永定元年武帝即位徐陵白所定乘輿御服皆採梁之舊制又以為冕旒後漢用白玉珠晉過江服章多闕遂用珊瑚雜珠飾以翡翠侍中顧和奏今不能備玉珠可用白琁從之蕭驕子云白琁蚌珠是也帝曰形制依此今天下初定務從節儉應用繡織成者並可彩畫金色宜塗珠玉之飾任用蚌也至天嘉初悉改易之定令具依天監舊事然亦往往改革今不同者皆隨事於注言之不言者蓋無所改制云皇太子金璽龜鈕朱綬三百二十首朝服遠遊冠金博山佩瑜玉翠緌垂組朱衣絳紗袍皂緣白紗中衣白曲領帶鹿盧劍火珠首素革帶玉鉤燮獸頭鞶囊其大小會祠廟朔望五日還朝皆朝服常還上宮則朱服若釋奠則遠遊冠玄朝服絳緣中單絳袴襪玄舄講則著介幘又有三梁進賢冠其侍祀則平冕九旒袞衣九章白紗絳緣中單絳繒赤舄絳靺若加元服則中舍執冕從皇太子舊有五時朝服自天監之後則朱服在上省則烏帽永福省則白帽云諸王金璽龜鈕纁朱綬一百六十首朝服遠遊冠介幘朱衣絳紗袍皂緣中衣素帶黑舄佩山玄玉垂組大帶獸頭鞶腰劍若加餘官則服其加官之服開國公金章龜鈕玄朱綬一百四十首朝服紗朱衣進賢三梁冠佩山玄玉獸頭鞶腰劍開國侯伯金章龜鈕青朱綬一百二十首朝服紗朱衣進賢三梁冠佩水蒼玉獸頭鞶腰劍開國子男金章龜鈕青綬二百首朝服紗朱衣進賢三梁冠佩水蒼玉獸頭鞶腰劍縣鄉亭關內關中及名號侯金印龜鈕紫綬朝服進賢二梁冠獸頭鞶腰劍關內關中及名號侯則圭鈕關外侯銀印圭鈕青綬朝服進賢二梁冠獸頭鞶腰劍諸王嗣子金印圭鈕紫綬八十首朝服進賢二梁冠佩山玄玉獸頭鞶腰劍開國公侯嗣子銀印圭鈕青綬八十首朝服進賢二梁冠佩水蒼玉獸頭鞶腰劍太宰太傅太保司徒司空金章龜鈕紫綬八十首朝服進賢三梁冠佩山玄玉獸頭鞶腰劍陳令加有相國丞相服制同大司馬大將軍太尉諸位從公者金章龜鈕紫綬八十首朝服武冠佩山玄玉獸頭鞶腰劍直將軍則不帶劍凡公及位從公言以將軍及以左右光祿開府儀同者各隨本位號其文則曰某位號儀同之章五等諸侯助祭郊廟皆平冕九旒青玉為珠有前無後各以其綬色為組纓旁垂黈纊衣玄上纁下畫山龍已下九章備五采大佩赤舄絇屨録尚書無章綬品秩悉以餘官總司其任服則餘官之服猶執笏紫荷其在都坐則東面最上尚書令僕射尚書銅印墨綬朝服納言幘進賢冠佩水蒼玉尚書則無印綬腰劍紫荷執笏陳尚書令僕射金章龜鈕紫綬八十首獸頭鞶尚書無印綬及鞶餘並同梁侍中散騎常侍通直常侍員外常侍朝服武冠貂蟬侍中左插常侍右插皆腰劍佩水蒼玉其員外常侍不給佩舊至尊朝會登殿侍中常侍夾御御下輿則扶左右侍中驂乘則不帶劍中書監令祕書監銅印墨綬朝服進賢兩梁冠佩水蒼玉腰劍獸頭鞶陳制銀章龜鈕青綬八十首獸頭鞶腰劍餘同梁左右光祿大夫皆與加金章紫綬同其但加金紫者謂之金紫光祿但加銀青者謂之光祿大夫陳令有特進進賢二梁冠朝服佩水蒼玉腰劍梁令不載光祿太中中散大夫太常光祿弘訓太僕太僕廷尉宗正大鴻臚大司農少府大匠諸卿丹陽尹太子保傅大長秋太子詹事銀章龜鈕青綬獸頭鞶朝服進賢冠二梁佩水蒼玉卿大夫助祭則冠平冕五旒黑玉為珠有前無後各以其綬采為組纓旁垂黈纊衣玄上纁下畫華蟲七章皆佩五采大佩赤舄絇屨陳宮卿改云慈訓餘皆同梁又有太舟卿服章同驃騎車騎衛將軍中軍冠軍輔國將軍四方中郎將金章紫綬中郎將則青綬朝服武冠佩水蒼玉陳令鎮衛驃騎車騎中軍中衛中撫軍中權四征四鎮四安四翊四平將軍金章獸鈕其冠軍四方中郎將金章豹鈕並紫綬八十首獸頭鞶朝服武冠佩水蒼玉自中軍已下諸將軍及冠軍四方中郎將並官不給佩領護軍中領護軍五營校尉銀印青綬朝服武冠佩水蒼玉獸頭鞶其屯騎夾御日假給佩餘校不給陳令領護金章龜鈕紫綬八十首中領護銀章龜鈕青綬八十首其五營校尉銀印圭鈕青綬八十首官不給佩餘並同梁弘訓衛尉衛尉陳宮卿云慈訓服同諸卿但武冠司隸校尉陳無官服左右衛驍騎遊擊前左右後軍將軍龍驤寧朔建威振威奮威揚威廣威武威建武振武奮武揚武廣武等將軍積弩積射強弩將軍監軍銀章青綬朝服武冠佩水蒼玉頭鞶驍遊已下並不給佩驍遊夾侍日假給陳令左右衛銀章龜鈕不給劍左右驍騎遊擊雲騎遊騎前左右後軍將軍左右中郎將銀印圭鈕餘服飾同梁亦官不給佩其驍遊雲騎夾御日假給其積弩積射冖出蟲弩銅印環鈕墨綬帶劍餘服同梁又有忠武軍師武臣爪牙龍騎雲麾鎮兵翊帥宣惠宣毅智威仁威勇威信威嚴威智武仁武勇武信武嚴武金章豹鈕紫綬八十首官不給輕車鎮朔武旅貞毅明威寧遠安遠征遠振遠宣遠等將軍金章貔鈕紫綬並獸頭鞶朝服武冠佩水蒼玉國子祭酒皂朝服進賢二梁冠佩水蒼玉御史中丞都水使者銀印墨綬朝服進賢二梁冠獸頭鞶腰劍佩水蒼玉陳中丞銀章龜鈕青綬八十首二梁冠餘同梁其都水陳梁改為太舟卿服在諸卿中見謁者僕射銅印環鈕墨綬八十首朝服高山冠獸頭鞶佩水蒼玉腰劍諸軍司銀章龜鈕青綬朝服武冠獸頭鞶給事中黃門侍郎散騎通直員外散騎侍郎奉朝請太子中庶子庶子武衛將軍武騎常侍朝服武冠腰劍陳令庶子已上簪筆其武衛不劍正直夾御白布袴褶中書侍郎朝服進賢一梁冠腰劍冗從僕射太子衛率銅印墨綬獸頭鞶朝服武冠陳衛率銀章龜鈕青綬不劍冗從銅印環鈕墨綬腰劍餘並同梁武賁中郎將羽林監銅印環鈕墨綬朝服武冠獸頭鞶腰劍其在陛牙及備鹵簿著毼尾絳紗縠單衣護胸奴中郎將護羌戎夷蠻越烏丸西域校尉銀印圭鈕青綬朝服武冠獸頭鞶陳令無此官其庶子鎮蠻寧蠻平戎西戎校尉平越中郎將服章同安夷撫夷護軍州郡國都尉奉車駙馬騎都尉諸護軍銀印圭鈕青綬獸頭鞶朝服武冠陳安遠鎮蠻護軍州郡國都尉奉車駙馬騎都尉諸護軍服章同無餘文州刺史銅印墨綬獸頭鞶腰劍絳朝服進賢二梁冠陳銅章龜鈕青綬餘同梁郡國太守相內史銀章龜鈕青綬獸頭鞶單衣介幘加中二千石依卿尹冠服劍佩尚書左右丞祕書丞銅印環鈕黃綬獸爪鞶朝服進賢一梁冠尚書祕書著作郎太子中舍人洗馬舍人朝服進賢一梁冠腰劍諸王友文學朱服進賢一梁冠陳令諸王師服同治書侍御史侍御史朝服腰劍法冠治書侍御史則有銅印環鈕墨綬陳又有殿中蘭臺侍御史朝服法冠腰劍簪筆諸博士給皂朝服進賢兩梁冠佩水蒼玉太學博士正限八人著佩限外六人不給廷尉律博士無佩並簪筆國子助教皂朝服進賢一梁冠簪筆公府長史獸頭鞶諸卿尹丞黃綬獸爪鞶簪筆諸縣署令秩千石者獸爪鞶銅印環鈕墨綬朝服進賢兩梁冠長史朱服諸卿尹丞建康令玄服公府掾屬主簿祭酒朱服進賢一梁冠公府令史亦同領護軍長史朱服獸頭鞶諸軍長史單衣介幘獸頭鞶諸卿部丞獄丞並皂朝服一梁冠黃綬獸爪鞶簪筆太子保傅詹事丞皂朝服一梁冠簪筆獸爪鞶黃綬郡國相內史丞長史單衣介幘長史獸頭鞶其丞黃綬獸爪鞶諸縣署令長相單衣介幘獸頭鞶銅印環鈕墨綬朝服進賢一梁冠諸署令朱衣武冠州都大中正郡中正單衣介幘太子門大夫獸頭鞶陵令長獸爪鞶銅印環鈕墨綬朝服進賢一梁冠令長朱服率更家令僕朝服兩梁冠獸頭鞶腰劍黃門諸署令僕長丞朱服進賢一梁冠銅印環鈕墨綬丞黃綬黃門冗從僕射監太子寺人監銅印環鈕墨綬朝服武冠獸頭鞶公府司馬領護軍司馬諸軍司馬護胸奴中郎將護羌戎夷蠻越烏丸戊己校尉長史司馬銅印環鈕墨綬獸頭鞶朝服武冠諸軍司馬單衣平巾幘長史介幘陳令公府司馬領護軍司馬諸軍司馬鎮安蠻安遠護軍蠻戎越校尉中郎將長史司馬其服章與梁
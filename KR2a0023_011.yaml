俱七等皆以火為領褾冕俱七旒諸子服自方冕而下六又無鷩冕火冕六章衣裳各三章毳冕五章衣三章裳二章裳重黻毳冕已下俱六等皆以宗彝為領褾冕俱六旒諸男服自方冕而下五又無火冕毳冕五章衣三章裳二章以藻為領褾冕五旒三公之服九一曰祀冕二曰火冕六章衣裳各三章衣重宗彝與藻裳重黻三曰毳冕五章衣三章裳二章衣重藻與粉米裳重黼黻四曰藻冕四章衣裳俱二章衣重藻與粉米裳重黼黻五曰繡冕三章衣一章裳二章衣重粉米裳重黼黻俱九等皆以宗彝為領褾六曰爵辨七曰韋辨八曰皮辨九曰玄冠三孤之服自祀冕而下八無火冕毳冕五章衣三章裳二章衣重粉米裳重黼黻藻冕四章衣裳各二章衣重藻與粉米裳重黼黻俱八等皆以藻為領褾繡冕三章衣一章裳二章衣重粉米裳重黼黻為八等公卿之服自祀冕而下七又無毳冕藻冕四章衣裳各二章衣重粉米裳重黼黻為七等皆以粉米為領褾各七繡冕三章衣一章裳二章衣重粉米裳重黼黻為七等上大夫之服自祀冕而下六又無藻冕繡冕三章衣一章裳二章衣重粉米裳重黼為六等中大夫之服自祀冕而下五又無皮辨繡冕三章衣一章裳二章衣重粉米為五等下大夫之服自祀冕而下四又無爵辨繡冕三章衣一章裳二章衣重粉米為四等士之服三一曰祀辨二曰爵辨三曰玄冠玄冠皆玄衣其裳上士以玄中士以黃下士雜裳謂前玄後黃也庶士之服一玄冠庶士庶人在官府史之屬其服緇衣裳後令文武俱著常服冠形如魏帢無簪有纓其凶服皆與庶人同其弔服諸侯於其卿大夫錫衰同姓緦衰於士疑衰其當事則辨絰否則皮辨公孤卿大夫之弔服錫衰辨絰皮辨亦如之士之弔服疑衰素裳當事辨絰否則徒辨皇后衣十二等其翟衣六從皇帝祀郊禖享先皇朝皇太后則服翬衣素質五色祭陰社朝命婦則服衣青質五色祭羣小祀受獻繭則服鷩衣赤衣采桑則服鳪衣黃色從皇帝見賓客聽女教則服鵫衣白色食命婦歸寧則服衣玄色俱十有二等以翬雉為領褾各有二臨婦學及法道門燕命婦有時見命婦則蒼衣春齋及祭還則青衣夏齋及祭還則朱衣采桑齋及采桑還則黃衣秋齋及祭還則素衣冬齋及祭還則玄衣自青衣而下五其領褾以相生之色諸公夫人九服其翟衣雉皆九等俱以雉為領褾各九自衣已下曰衣鷩衣鳪衣鵫衣衣並朱衣黃衣素衣玄衣而九自朱衣而下其領褾亦同用相生之色諸侯夫人自鷩而下八其翟衣雉皆八等俱以鷩雉為領褾無衣諸伯夫人自鳪而下七其翟衣雉皆七等俱以鳪雉為領褾又無鷩衣諸子夫人自鵫而下六其翟衣俱以鵫雉為領褾又無鳪衣諸男夫人自而下五其翟衣雉皆五等俱以雉為領褾又無鵫衣三妃三公夫人之服九一曰鳪衣二曰鵫衣三曰衣四曰青衣五曰朱衣六曰黃衣七曰素衣八曰玄衣九曰髾衣似髮華皆九樹其雉衣亦皆九等以鳪雉為領褾各九三三孤之內子自鵫衣而下八雉衣皆八等以鵫雉為領褾各八六嬪六卿之內子自衣而下七雉衣皆七等以雉為領褾各七上媛上大夫之孺人自青衣而下六中媛中大夫之孺人自朱衣而下五下媛下大夫之孺人自黃衣而下四御婉士之婦人自素衣而下三中宮六尚緅衣其色赤而微玄諸命秩之服曰公服其餘常服曰私衣皇后華皆有十二樹諸侯之夫人亦皆以命數為之節三妃三公夫人已下又各依其命一命再命者又俱以三為節皇后及諸侯夫人之服皆舄履三妃三公夫人已下翟衣則舄其餘皆履舄履各如其裳之色皇后之凶服斬衰齊衰降旁期已下弔服為妃嬪三公之夫人孤卿內子之喪錫衰錫者十五升去其半無事其縷有事其布哀在內也為諸侯夫人之喪緦衰緦亦十五升去其半有事其縷無事其布哀在外也為媛御婉及大夫孺人士之婦人之喪疑衰十四升疑於吉皆吉筓無首象筓去首飾太陰虧則素服蕩天下之陰事諸侯之夫人及三妃與三公之夫人已下凶事則五衰自緦已上皆服之其弔諸侯夫人於卿之內子大夫孺人錫衰於己之同姓之臣緦衰於士之婦人疑衰皆吉筓無首其三妃已下及媛三公夫人已下及孺人其弔服錫衰御婉及士之婦人弔服疑衰疑衰同筓九族已下皆骨筓皇帝三章龍火山諸侯二章去龍卿大夫一章以山皆織綵以成之皇帝八璽有神璽有傳國璽皆寶而不用神璽明受之於天傳國璽明受之於運皇帝負扆則置神璽於筵前之右置傳國璽於筵前之左又有六璽其一皇帝行璽封命諸侯及三公用之其二皇帝之璽與諸侯及三公書用之其三皇帝信璽發諸夏之兵用之其四天子行璽封命蕃國之君用之其五天子之璽與蕃國之君書用之其六天子信璽徵蕃國之兵用之六璽皆白玉為之方一寸五分高寸螭獸鈕皇后璽文曰皇后之璽白玉為之方寸五分高寸麟鈕三公諸侯皆金印方寸二分高八分龜鈕七命已上銀四命已上銅皆龜鈕三命已上銅印銅鼻其方皆寸其高六分文曰某公官之印皇帝之組綬以蒼以青以朱以黃以白以玄以纁以紅以紫以緅以碧以緑十有二色諸公九色自黃以下諸侯八色自白以下諸伯七色自玄以下諸子六色自纁已下諸男五色自紅已下三公之綬如諸公三孤之綬如諸侯六卿之綬如諸伯上大夫之綬如諸子中大夫之綬如諸男下大夫綬自紫已下士之綬自緅已下其璽印之綬亦如之保定四年百官始執笏常服上焉宇文護始命袍加下欄宣帝即位受朝於路門初服通天冠絳紗袍羣臣皆服漢魏衣冠大象元年制冕二十四旒衣服以二十四章為準二年下詔天臺近侍及宿衛之官皆著五色衣以錦綺繢繡為緣名曰品色衣有大禮則服冕內外命婦皆執笏其拜俯伏方興

body:
  text: 隋書卷八十列傳第四十五列女自昔貞專淑媛布在方策者多矣婦人之德雖在於溫柔立節垂名咸資於貞烈溫柔仁之本也貞烈義之資也非溫柔無以成其仁非貞烈無以顯其義是以詩書所記風俗所在圖像丹青流聲竹素莫不守約以居正殺身以成仁者也若文伯王陵之母白公嵵植之妻魯之義姑梁之高行衞君靈主之妾夏侯文寧之女或抱信以含貞或蹈忠而踐義不以存亡易心不以盛衰改節其修名彰於既往徽音傳於不朽不亦休乎或有王公大人之妃偶肆情於淫僻之俗雖衣繡衣食珍膳坐金屋乘玉輦不入彤管之書不霑良史之筆將草木以俱落與麋鹿而同死可勝道哉永言載思實庶姬之恥也觀夫今之靜女各勵松筠之操甘於玉折蘭摧足以無絕今古故述其雅志以纂前代之列女云蘭陵公主蘭陵公主字阿五高祖第五女也美姿儀性婉順好讀書高祖於諸女中特所鍾愛初嫁儀同王奉孝卒適河東柳述時年十八諸姊並驕貴主獨折節遵於婦道事舅姑甚謹遇有疾病必親奉湯藥高祖聞之大悅由是述漸見寵遇初晉王廣欲以主配其妃弟蕭瑒高祖初許之後遂適述晉王因不悅及述用事彌惡之高祖既崩述徙嶺表煬帝令主與述離絕將改嫁之公主以死自誓不復朝謁上表請免主號與述同徙帝大怒曰天下豈無男子欲與述同徙耶主曰先帝以妾適于柳家今其有罪妾當從坐不願陛下屈法申恩帝不從主憂憤而卒時年三十二臨終上表曰昔共姜自誓著美前詩鄎媯不言傳芳往誥妾雖負罪竊慕古人生既不得從夫死乞葬於柳氏帝覽之愈怒竟不哭乃葬主於洪瀆川資送甚薄朝野傷之南陽公主南陽公主者煬帝之長女也美風儀有志節造次必以禮年十四嫁於許國公宇文述子士及以謹肅聞及述病且卒主親調飲食手自奉上世以此稱之及宇文化及殺逆主隨至聊城而化及為竇建德所敗士及自濟北西歸大唐時隋代衣冠並在其所建德引見之莫不惶懼失常唯主神色自若建德與語主自陳國破家亡不能報怨雪恥淚下盈襟聲辭不輟情理切至建德及觀聽者莫不為之動容隕涕咸肅然敬異焉及建德誅化及時主有一子名禪師年且十歲建德遣武賁郎將於士澄謂主曰宇文化及躬行殺逆人神所不容今將族滅其家公主之子法當從坐若不能割愛亦聽留之主泣曰武賁既是隋室貴臣此事何須見問建德竟殺之主尋請建德削髮為尼及建德敗將歸西京復與士及遇於東都之下主不與相見士及就之立於戶外請復為夫妻主拒之曰我與君讎家今恨不能手刃君者但謀逆之日察君不預知耳因與告絕訶令速去士及固請之主怒曰必欲就死可相見也士及見其言切知不可屈乃拜辭而去襄城王恪妃襄城王恪妃者河東柳氏女也父旦循州刺史妃姿儀端麗年十餘以良家子合法相娉以為妃未幾而恪被廢妃修婦道事之愈敬煬帝嗣位恪復徙邊帝令使者殺之於道恪與辭訣妃曰若王死妾誓不獨生於是相對慟哭恪既死棺斂訖妃謂使者曰妾誓與楊氏同穴若身死之後得不別埋君之惠也遂撫棺號慟自經而卒見者莫不為之涕流華陽王楷妃華陽王楷妃者河南元氏之女也父巖性明敏有氣幹仁壽中為黃門侍郎封龍涸縣公煬帝嗣位坐與柳述連事除名為民徙南海後會赦還長安有人譖巖逃歸收而殺之妃有姿色性婉順初以選為妃未幾而楷被幽廢妃事楷踰謹每見楷有憂懼之色輒陳義理以慰諭之楷甚敬焉及江都之亂楷遇宇文化及之逆以妃賜其黨元武達武達初以宗族之禮置之別舍後因醉而逼之妃自誓不屈武達怒撻之百餘辭色彌厲因取甓自毀其面血淚交下武達釋之妃謂其徒曰我不能早死致令將見侵辱我之罪也因不食而卒譙國夫人譙國夫人者高涼洗氏之女也世為南越首領跨據山洞部落十餘萬家夫人幼賢明多籌略在父母家撫循部衆能行軍用師壓服諸越每勸親族為善由是信義結於本鄉越人之俗好相攻擊夫人兄南梁州刺史挺恃其富強侵掠傍郡嶺表苦之夫人多所規諫由是怨隙止息海南儋耳歸附者千餘洞梁大同初羅州刺史馮融聞夫人有志行為其子高涼太守寶娉以為妻融本北燕苗裔初馮弘之投高麗也遣融大父業以三百人浮海歸宋因留于新會自業及融三世為守牧他鄉羈旅號令不行至是夫人誡約本宗使從民禮每共寶參決辭訟首領有犯法者雖是親族無所舍縱自此政令有序人莫敢違遇侯景反廣州都督蕭勃徵兵援臺高州刺史李遷仕據大臯口遣召寶寶欲往夫人止之曰刺史無故不合召太守必欲詐君共為反耳寶曰何以知之夫人曰刺史被召援臺乃稱有疾鑄兵聚衆而後喚君今者若往必留質追君兵衆此意可見願且無行以觀其勢數日遷仕果反遣主帥杜平虜率兵入灨石寶知之遽告夫人曰平虜驍將也領兵入灨石即與官兵相拒勢未得還遷仕在州無能為也若君自往必有戰鬬宜遣使詐之卑辭厚禮云身未敢出欲遣婦往參彼聞之喜必無防慮於是我將千餘人步擔雜物唱言輸賧得至柵下賊必可圖寶從之遷仕果大喜覘夫人衆皆擔物不設備夫人擊之大捷遷仕遂走保于寧都夫人總兵與長城侯陳覇先會于灨石還謂寶曰陳都督大可畏極得衆心我觀此人必能平賊君宜厚資之及寶卒嶺表大亂夫人懷集百越數州晏然至陳永定二年其子僕年九歲遣帥諸首領朝于丹陽起家拜陽春郡守後廣州刺史歐陽紇謀反召僕至高安誘與為亂僕遣使歸告夫人夫人曰我為忠貞經今兩代不能惜汝輒負國家遂發兵拒境帥百越酋長迎章昭達內外逼之紇徒潰散僕以夫人之功封信都侯加平越中郎將轉石龍太守詔使持節冊夫人為中郎將石龍太夫人賚繡幰油絡駟馬安車一乘給鼓吹一部幷麾幢旌節其鹵簿一如刺史之儀至德中僕卒後遇陳國亡嶺南未有所附數郡共奉夫人號為聖母保境安民高祖遣總管韋洸安撫嶺外陳將徐璒以南康拒守洸至嶺下逡巡不敢進初夫人以扶南犀杖獻于陳主至此晉王廣遣陳主遺夫人書諭以國亡令其歸化幷以犀杖及兵符為信夫人見杖驗知陳亡集首領數千盡日慟哭遣其孫魂帥衆迎洸入至廣州嶺南悉定表魂為儀同三司冊夫人為宋康郡夫人未幾番禺人王仲宣反首領皆應之圍洸於州城進兵屯衡嶺夫人遣孫暄帥師救洸暄與逆黨陳佛智素相友善故遲留不進夫人知之大怒遣使執暄繫於州獄又遣孫盎出討佛智戰剋斬之進兵至南海與鹿愿軍會共敗仲宣夫人親被甲乘介馬張錦傘領彀騎衞詔使裴矩巡撫諸州其蒼梧首領陳坦岡州馮岑翁梁化鄧馬頭藤州李光略羅州龐靖等皆來參謁還令統其部落嶺表遂定高祖異之拜盎為高州刺史仍赦出暄拜羅州刺史追贈寶為廣州總管譙國公冊夫人為譙國夫人以宋康邑廻授僕妾洗氏仍開譙國夫人幕府置長史以下官屬給印章聽發部落六州兵馬若有機急便宜行事降勑書曰朕撫育蒼生情均父母欲使率土清淨兆庶安樂而王仲宣等輒相聚結擾亂彼民所以遣往誅翦為百姓除害夫人情在奉國深識正理遂令孫盎斬獲佛智竟破羣賊甚有大功今賜夫人物五千段暄不進愆誠合罪責以夫人立此誠效故特原免夫人宜訓導子孫敦崇禮教遵奉朝化以副朕心皇后以首飾及宴服一襲賜之夫人並盛於金篋幷梁陳賜物各藏于一庫每歲時大會皆陳于庭以示子孫曰汝等宜盡赤心向天子我事三代主唯用一好心今賜物具存此忠孝之報也願汝皆思念之時番州總管趙訥貪虐諸俚獠多有亡叛夫人遣長史張融上封事論安撫之宜幷言訥罪狀不可以招懷遠人上遣推訥得其贓賄竟致於法降勑委夫人招慰亡叛夫人親載詔書自稱使者歷十餘州宣述上意諭諸俚獠所至皆降高祖嘉之賜夫人臨振縣湯沐邑一千五百戶贈僕為崖州總管平原郡公仁壽初卒賻物一千段諡為誠敬夫人鄭善果母鄭善果母者清河崔氏之女也年十三出適鄭誠生善果而誠討尉迥力戰死于陣母年二十而寡父彥穆欲奪其志母抱善果謂彥穆曰婦人無再見男子之義且鄭君雖死幸有此兒棄兒為不慈背死為無禮寧當割耳截髮以明素心違禮滅慈非敢聞命善果以父死王事年數歲拜使持節大將軍襲爵開封縣公邑一千戶開皇初進封武德郡公年十四授沂州刺史轉景州刺史尋為魯郡太守母性賢明有節操博涉書史通曉治方每善果出聽事母坐胡牀於鄣後察之聞其剖斷合理歸則大悅即賜之坐相對談笑若行事不允或妄瞋怒母乃還堂蒙被而泣終日不食善果伏於牀前亦不敢起母方起謂之曰吾非怒汝乃愧汝家耳吾為汝家婦獲奉灑掃如汝先君忠勤之士也在官清恪未嘗問私以身徇國繼之以死吾亦望汝副其此心汝既年小而孤吾寡婦耳有慈無威使汝不知禮訓何可負荷忠臣之業乎汝自童子承襲茅土位至方伯豈汝身致之邪安可不思此事而妄加瞋怒心緣驕樂墮於公政內則墜爾家風或亡失官爵外則虧天子之法以取罪戾吾死之日亦何面目見汝先人於地下乎母自紡績夜分而寐善果曰兒封侯開國位居三品秩俸幸足母何自勤如是邪答曰嗚呼汝年已長吾謂汝知天下之理今聞此言故猶未也至於公事何由濟乎今此秩俸乃是天子報爾先人之徇命也當須散贍六姻為先君之惠妻子奈何獨擅其利以為富貴哉又絲枲紡織婦人之務上自王后下至大夫士妻各有所製若墮業者是為驕逸吾雖不知禮其可自敗名乎自初寡便不御脂粉常服大練性又節儉非祭祀賓客之事酒肉不妄陳於前靜室端居未嘗輒出門閤內外姻戚有吉凶事但厚加贈遺皆不詣其家非自手作及莊園祿賜所得雖親族禮遺悉不許入門善果歷任州郡唯內自出饌於衙中食之公廨所供皆不許受悉用修治廨宇及分給僚佐善果亦由此克己號為清吏煬帝遣御史大夫張衡勞之考為天下最徵授光祿卿其母卒後善果為大理卿漸驕姿清公平允遂不如疇昔焉孝女王舜孝女王舜者趙郡王子春之女也子春與從兄長忻不協屬齊滅之際長忻與其妻同謀殺子春舜時年七歲有二妹粲年五歲璠年二歲並孤苦寄食親戚舜撫育二妹恩義甚篤而舜陰有復讎之心長忻殊不為備姊妹俱長親戚欲嫁之輒拒不從乃密謂其二妹曰我無兄弟致使父讎不復吾輩雖是女子何用生為我欲共汝報復汝意如何二妹皆垂泣曰唯姊所命是夜姊妹各持刀踰牆而入手殺長忻夫妻以告父墓因詣縣請罪姊妹爭為謀首州縣不能決高祖聞而嘉歎特原其罪韓覬妻韓覬妻者洛陽于氏女也字茂德父實周大左輔于氏年十四適于覬雖生長膏腴家門鼎盛而動遵禮度躬自儉約宗黨敬之年十八覬從軍戰沒于氏哀毀骨立慟感行路每至朝夕奠祭皆手自捧持及免喪其父以其幼少無子將嫁之誓無異志復令家人敦喻于氏晝夜涕泣截髮自誓其父喟然傷感遂不奪其志焉因養夫之孽子世隆為嗣身自撫育愛同己生訓導有方卒能成立自孀居已後唯時或歸寧至於親族之家絕不來往有尊卑就省謁者送迎皆不出戶庭蔬食布衣不聽聲樂以此終身高祖聞而嘉歎下詔褒美表其門閭長安中號為節婦闕終于家年七十二陸讓母陸讓母者上黨馮氏女也性仁愛有母儀讓即其孽子也仁壽中為番州刺史數有聚斂贓貨狼籍為司馬所奏上遣使按之皆驗於是囚詣長安親臨問讓稱寃上復令治書侍御史撫按之狀不易前乃命公卿百僚議之咸曰讓罪當死詔可其奏讓將就刑馮氏蓬頭垢面詣朝堂數讓曰無汗馬之勞致位刺史不能盡誠奉國以答鴻恩而反違犯憲章贓貨狼籍若言司馬誣汝百姓百官不應亦皆誣汝若言至尊不憐愍汝何故治書覆汝豈誠臣豈孝子不誠不孝何以為人於是流涕嗚咽親持盂粥勸讓令食既而上表求哀詞情甚切上愍然為之改容獻皇后甚奇其意致請於上治書侍御史柳彧進曰馮氏母德之至有感行路如或殺之何以為勸上於是集京城士庶於朱雀門遣舍人宣詔曰馮氏以嫡母之德足為世範慈愛之道義感人神特宜矜免用奬風俗讓可減死除名為民復下詔曰馮氏體備仁慈夙閑禮度孽讓非其所生往犯憲章宜從極法躬自詣闕為之請命匍匐頓顙朕哀其義特免死辜使天下婦人皆如馮者豈不閨門雍睦風俗和平朕每嘉歎不能已宜摽揚優賞用章有德可賜物五百段集諸命婦與馮相識以寵異之劉昶女劉昶女者河南長孫氏之婦也昶在周尚公主官至柱國彭國公數為將帥位望隆顯與高祖有舊及受禪甚親任歷左武衞大將軍慶州總管其子居士為太子千牛備身聚徒任俠不遵法度數得罪上以昶故每輒原之居士轉恣每大言曰男兒要當辮頭反縛籧篨上作獠取公卿子弟膂力雄健者輒將至家以車輪括其頸而棒之殆死能不屈者稱為壯士釋而與交黨與三百人其趫捷者號為餓鶻隊武力者號為蓬轉隊每韝鷹紲犬連騎道中毆擊路人多所侵奪長安市里無貴賤見之者皆辟易至於公卿妃主莫敢與校者其女則居士之姊也每垂泣誨之殷勤墾惻居士不改至破家產昶年老奉養甚薄其女時寡居哀昶如此每歸寧于家躬勤紡績以致其甘脆有人告居士與其徒遊長安城登故未央殿基南向坐前後列隊意有不遜每相約曰當為一死耳又時有人言居士遣使引突厥令南寇當於京師應之上謂昶曰今日之事當復如何昶猶恃舊恩不自引咎直前曰黑白在于至尊上大怒下昶獄捕居士黨與治之甚急憲司又奏昶事母不孝其女知昶必不免不食者數日每親調飲食手自捧持詣大理餉其父見獄卒長跪以進歔欷嗚咽見者傷之居士坐斬昶竟賜死于家詔百僚臨視時其女絕而復蘇者數矣公卿慰諭之其女言父無罪坐子以及於禍詞情哀切人皆不忍聞見遂布衣蔬食以終其身上聞而歎曰吾聞衰門之女興門之男固不虛也鍾士雄母鍾士雄母者臨賀蔣氏女也士雄仕陳為伏波將軍陳主以士雄嶺南酋帥慮其反覆每質蔣氏於都下及晉王廣平江南以士雄在嶺表欲以恩義致之遣蔣氏歸臨賀既而同郡虞子茂鍾文華等作亂舉兵攻城遣人召士雄士雄將應之蔣氏謂士雄曰我前在揚都備嘗辛苦今逢聖化母子聚集沒身不能上報焉得為逆哉汝若禽獸其心背德忘義者我當自殺於汝前士雄於是遂止蔣氏復為書與子茂等諭以禍福子茂不從尋為官軍所敗上聞蔣氏甚異之封為安樂縣君時尹州寡婦胡氏者不知何氏妻也甚有志節為邦族所重當江南之亂諷諭宗黨皆守險不從叛逆封為密陵郡君孝婦覃氏孝婦覃氏者上郡鍾氏婦也與其夫相見未幾而夫死時年十八事後姑以孝聞數年之間姑及伯叔皆相繼而死覃氏家貧無以葬於是躬自節儉晝夜紡績蓄財十年而葬八喪為州里所敬上聞而賜米百石表其門閭元務光母元務光母者范陽盧氏女也少好讀書造次以禮盛年寡居諸子幼弱家貧不能就學盧氏每親自教授勖以義方世以此稱之仁壽末漢王諒舉兵反遣將綦良往山東略地良以務光為記室及良敗慈州刺史上官政簿籍務光之家見盧氏悅而逼之盧氏以死自誓政為人凶悍怒甚以燭燒其身盧氏執志彌固竟不屈節裴倫妻裴倫妻河東柳氏女也少有風訓大業末倫為渭源令屬薛舉之亂縣城為賊所陷倫遇害柳時年四十有二女及兒婦三人皆有美色柳氏謂之曰我輩遭逢禍亂汝父已死我自念不能全汝我門風有素義不受辱於羣賊我將與汝等同死如何其女等皆垂泣曰唯母所命柳氏遂自投于井其女及婦相繼而下皆重死於井中趙元楷妻趙元楷妻者清河崔氏之女也父儦在文學傳家有素範子女皆遵禮度元楷父為僕射家富於財重其門望厚禮以聘之元楷甚敬崔氏雖在宴私不妄言笑進止容服動合禮儀化及之反也元楷隨至河北將歸長安至滏口遇盜攻掠元楷僅以身免崔氏為賊所拘賊請以為妻崔氏謂賊曰我士大夫女為僕射子妻今日破亡自可即死遣為賊婦終必不能羣賊毀裂其衣形體悉露縛於牀簀之上將凌之崔氏懼為所辱詐之曰今力已屈當聽處分不敢相違請解縛賊遽釋之崔因著衣取賊佩刀倚樹而立曰欲殺我任加刀鋸若覔死可來相逼賊大怒亂射殺之元楷後得殺妻者支解之以祭崔氏之柩史臣曰夫稱婦人之德皆以柔順為先斯乃舉其中庸未臻其極者也至於明識遠圖貞心峻節志不可奪唯義所在考之圖史亦何世而無哉蘭陵主質邁寒松南陽主心踰匪石洗媼孝女之忠壯崔馮二母之誠懇足使義勇慚其志烈蘭玉謝其貞芳襄城華陽之妃裴倫元楷之婦時逢艱阻事乖好合甘心同穴顛沛靡它志勵冰霜言踰皎日雖詩詠共姜之自誓傳述伯姬之守死其將復何以加焉

body:
  text: 隋書卷二十二志第十七五行上易以八卦定吉凶則庖犧所以稱聖也書以九疇論休咎則大禹所以為明也春秋以災祥驗行事則仲尼所以垂法也天道以星象示廢興則甘石所以先知也是以祥符之兆可得而言妖訛之占所以徵驗夫神則陰陽不測天則欲人遷善均乎影響殊致同歸漢時有伏生董仲舒京房劉向之倫能言災異顧盼六經有足觀者劉向曰君道得則和氣應休徵生君道違則乖氣應咎徵發夫天有七曜地有五行五事愆違則天地見異況於日月星辰乎況於水火金木土乎若梁武之降號伽藍齊文宣之盤遊市里陳則蔣山之鳥呼曰奈何周則陽武之魚乘空而鬬隋則鵲巢黼帳火炎門闕豈唯天道亦曰人妖則祥眚呈形于何不至亦有脫略政教張羅樽糈崇信巫史重增愆罰昔懷王事神而秦兵逾進萇弘尚鬼而諸侯不來性者生之靜也欲者心之使也置情攸往引類同歸雀乳於空城之側鷮飛于鼎耳之上短長之制既曰由人黔隧崇山同車共軫必有神道裁成倚伏一則以為殃釁一則以為休徵故曰德勝不祥而義厭不惠是以聖王常由德義消伏災咎也洪範五行傳曰木者東方威儀容貌也古者聖王垂則天子穆穆諸侯皇皇登輿則有鸞和之節降車則有佩玉之度田狩則有三驅之制飲食則有享獻之無事不出境此容貌動作之得節所以順木氣也如人君違時令失威儀田獵馳騁不反宮室飲食湎不顧禮制縱欲恣睢出入無度多繇役以奪人時增賦稅以奪人財則木不曲直齊後主武平五年鄴城東青桐樹有如人狀京房易傳曰王德衰下人將起則有木生為人狀是時後主怠於國政耽荒酒色威儀不肅馳騁無度大發繇役盛修宮室後二歲而亡木不曲直之效也七年宮中有樹大數圍夜半無故自拔齊以木德王無故自拔亡國之應也其年齊亡開皇八年四月幽州人家以白楊木懸竈上積十餘年忽生三條皆長三尺餘甚鮮茂仁壽二年春盩厔人以楊木為屋梁生三條長二尺京房易傳曰妃后有顓木仆反立斷枯復生獨孤后專恣之應也仁壽元年十月蘭州楊樹上松生高三尺六節十二枝宋志曰松不改柯易葉楊者危脆之木此永久之業將集危亡之地也是時帝惑讒言幽廢冢嫡初立晉王為皇太子天戒若曰皇太子不勝任永久之業將致危亡帝不悟及帝崩太子立是為煬帝竟以亡國仁壽四年八月河間柳樹無故枯落既而花葉復生京房易飛候曰木再榮國有大喪是歲宮車晏駕洪範五行傳曰金者西方萬物既成殺氣之始也古之王者興師動衆建立旗鼓以誅殘賊禁暴虐安天下殺伐必應義以順金氣如人君樂侵陵好攻戰貪城邑之賂以輕百姓之命人皆不安外內騷動則金不從革陳禎明二年五月東冶鐵鑄有物赤色大如斗自天墜鎔所隆隆有聲鐵飛破屋而四散燒人家時後主與隋雖結和好遣兵度江掩襲城鎮將士勞敝府藏空竭東冶者陳人鑄兵之所鐵飛為變者金不從革之應天戒若曰陳國小而兵弱當以和好為固無鑄兵而黷武以害百姓後主不悟又遣僞將陳紀任蠻奴蕭摩訶數寇江北百姓不堪其役及隋師渡江而二將降發卒以滅亡洪範五行傳曰火者南方陽光為明也人君向南蓋取象也昔者聖帝明王負扆攝袂南面而聽斷天下攬海內之雄俊積之於朝以續聰明推邪佞之僞臣投之于野以通壅塞以順火氣夫不明之君惑於讒口白黑雜揉代相是非衆邪並進人君疑惑棄法律間骨肉殺太子逐功臣以孽代宗則火失其性梁天監元年五月有盜入南北掖燒神武門總章觀時帝初即位而火燒觀闕不祥之甚也既而太子薨皇孫不得立及帝暮年惑於朱虉之口果有侯景之亂宮室多被焚燒天誡所以先見也普通二年五月琬琰殿火延燒後宮三千餘間中大通元年朱雀航華表災明年同泰寺災大同三年朱雀門災水沴火也是時帝崇尚佛道宗廟牲牷皆以代之又委萬乘之重數詣同泰寺捨身為奴令王公已下贖之初陽為不許後為默許方始還宮天誡若曰梁武為國主不遵先王之法而淫於佛道橫多糜費將使其社稷不得血食也天數見變而帝不悟後竟以亡及江陵之敗闔城為賤隸焉即捨身為奴之應也陳永定三年重雲殿災東魏天平二年十一月閶闔門災是時齊神武作宰而大野拔斬樊子鵠以州來降神武聽讒而殺之司空元暉免逐功臣大臣之罰也武定五年八月廣宗郡火燒數千家後齊後主天統三年九龍殿災延燒西廊四年昭陽宣光瑤華三殿災延燒龍舟是時讒言任用正士道消祖孝徵作歌謠斛律明月以誅死讒夫昌邪勝正之應也京房易傳曰君不思道厥妖火燒宮開皇十四年將祠泰山令使者致石像神祠之所未至數里野火欻起燒像碎如小塊時帝頗信讒言猜阻骨肉滕王瓚失志而死創業功臣多被夷滅故天見變而帝不悟其後太子勇竟被廢戮大業十二年顯陽門災舊名廣陽則帝之姓名也國門之崇顯號令之所由出也時帝不遵法度驕奢荒怠裴蘊虞世基之徒阿諛順旨掩塞聰明宇文述以讒邪顯進忠諫者咸被誅戮天戒若曰信讒害忠則除廣陽也洪範五行傳曰水者北方之藏氣至陰也宗廟者祭祀之象也故天子親耕以供粢盛王后親蠶以供祭服敬之至也發號施令十二月咸得其氣則水氣順如人君簡宗廟不禱祀逆天時則水不潤下梁天監二年六月太末信安豐安三縣大水春秋考異郵曰陰盛臣逆人悲則水出河決是時江州刺史陳伯之益州刺史劉季連舉兵反叛師旅數興百姓愁怨臣逆人悲之應也六年八月建康大水濤上御道七尺七年五月建康又大水是時數興師旅以拒魏軍十二年四月建康大水是時大發卒築浮山堰以遏淮水勞役連年百姓悲怨之應也中大通五年五月建康大水御道通船京房易飛候曰大水至國賤人將貴蕭棟侯景僭稱尊號之應也後齊河清二年十二月兗趙魏三州大水天統三年並州汾水溢讖曰水者純陰之精陰氣洋溢者小人專制是時和士開元文遙趙彥深專任之應也武平六年八月山東諸州大水京房易飛候曰小人踊躍無所畏忌陰不制於陽則涌水出是時羣小用事邪佞滿朝閹豎嬖幸伶人封王此其所以應也開皇十八年河南八州大水是時獨孤皇后干預政事濫殺宮人放黜宰相楊素頗專水陰氣臣妾盛強之應也仁壽二年河南河北諸州大水京房易傳曰顓事有智誅罰絶理則厥災水亦由帝用刑嚴急臣下有小過帝或親臨斬決又先是柱國史萬歲以忤旨被戮誅罰絶理之應也大業三年河南大水漂沒三十餘郡帝嗣位已來未親郊廟之禮簡宗廟廢祭祀之應也洪範五行傳曰土者中央為內事宮室臺榭夫婦親屬也古者自天子至于士宮室寢居大小有差高卑異等骨肉有恩故明王賢君修宮室之制謹夫婦之別加親戚之恩敬父兄之禮則中氣和人君肆心縱意大為宮室高為臺榭雕文刻鏤以疲人力淫泆無別妻妾過度犯親戚侮父兄中氣亂則稼穡不成齊後主武平四年山東饑是時大興土木之功於仙都苑又起宮於邯鄲窮侈極麗後宮侍御千餘人皆寶衣玉食逆中氣之咎也煬帝大業五年燕代齊魯諸郡饑先是建立東都制度崇侈又宗室諸王多遠徙邊郡洪範五行傳曰貌之不恭是謂不肅則下不敬陰氣勝故厥咎狂厥罰常雨厥極惡時則有服妖時則有龜孽有雞禍有下體生上體之痾有青眚青祥惟金沴木貌不恭侯景僭即尊號升圓丘行不能正履有識者知其不免景尋敗梁元帝既平侯景破蕭紀而有驕矜之色性又沉猜由是臣下離二即位三年而為西魏所陷帝竟不得其死陳後主每祀郊廟必稱疾不行建寧令章華上奏諫曰拜三妃以臨軒祀宗廟而稱疾非祗肅之道後主怒而斬之又引江總孔範等內宴無復尊卑之序號為狎客專以詩酒為娛不恤國政祕書監傅縡上書諫曰人君者恭事上帝子愛下人省嗜欲遠邪佞未明求衣日旰忘食是以澤被區宇慶流子孫陛下頃來酒色過度不虔郊廟大神專媚淫昏之鬼小人在側宦竪擅權惡誠直如仇讎視時人如草芥後宮曳羅綺馬餘菽粟百姓流離轉尸蔽野神怒人怨衆叛親離臣恐東南王氣自斯而盡後主不聽驕恣日甚未幾而國滅陳司空侯安都自以有安社稷之功驕矜日甚每侍宴酒酣輒箕踞而坐嘗謂文帝曰何如作臨川王時又借華林園水殿與妻妾賓客置酒於其上帝甚惡之後竟誅死東魏武定五年後齊文襄帝時為世子屬神武帝崩祕不發喪朝魏帝於鄴魏帝宴之文襄起及嗣位又朝魏帝於鄴侍宴而惰有識者知文襄之不免後果為盜所害神武時司徒高昂嘗詣相府將直入門門者止之昂怒引弓射門者神武不之罪尋為西魏所殺後齊後主為周師所迫至鄴集兵斛律孝卿勸後主親勞將士宜流涕慷慨以感激之人當自奮孝卿授之以辭後主然之及對衆默無所言因赧然大笑左右皆哂將士怒曰身尚如此吾輩何急由是皆無戰心俄為周師所虜煬帝自負才學每驕天下之士嘗謂侍臣曰天下當謂朕承藉餘緒而有四海耶設令朕與士大夫高選亦當為天子矣謂當世之賢皆所不逮書云謂人莫己若者亡帝自矜己以輕天下能不亡乎帝又言習吳音其後竟終於江都此亦魯襄公終於楚宮之類也常雨水梁天監七年七月雨至十月乃霽洪範五行傳曰陰氣冖出蟲積然後生水雨之災時武帝頻年興師是歲又大舉北伐諸軍頗捷而士卒罷敝百姓怨望陰氣畜積之應也陳太建十二年八月大雨霪霖時始興王叔陵驕恣陰氣盛冖出蟲之應也明年宣帝崩後主立叔陵刺後主於喪次宮人救之僅而獲免叔陵出閣就東府作亂後主令蕭摩訶破之死者千數東魏武定五年秋大雨七十餘日元瑾劉思逸謀殺後齊文襄之應也後齊河清三年六月庚子大雨晝夜不息至甲辰山東大水人多餓死是歲突厥寇並州陰戎作梗此其應也天統三年十月積陰大雨胡太后淫亂之所感也武平七年七月大霖雨水潦人戶流亡是時駱提婆韓長鸞等用事小人專政之罰也後周建德三年七月霖雨三旬時衛剌王直潛謀逆亂屬帝幸雲陽宮以其徒襲肅章門尉遲運逆拒破之其日雨霽大雨雪梁普通二年三月大雪平地三尺洪範五行傳曰庶徵之常雨也然尤甚焉雨陰也雪又陰畜積甚盛也皆妾不妾臣不臣之應時義州刺史文僧朗以州叛於魏臣不臣之應也大同三年七月青州雪害苗稼是時交州刺史李賁舉兵反僭尊號置百官擊之不能克十年十二月大雪平地三尺是時邵陵王綸湘東王繹武陵王紀並權侔人主頗為驕恣皇太子甚惡之帝不能抑損上天見變帝又不悟及侯景之亂諸王各擁強兵外有赴援之名內無勤王之實委棄君父自相屠滅國竟以亡東魏興和二年五月大雪時後齊神武作宰發卒十餘萬築鄴城百姓怨思之徵也武定四年二月大雪人畜凍死道路相望時後齊霸政而步落稽舉兵反寇亂數州人多死亡後齊河清二年二月大雪連雨南北千餘里平地數尺繁霜晝下是時突厥木杆可汗與周師入並州殺掠吏人不可勝紀天統二年十一月大雪三年正月又大雪平地二尺武平三年正月又大雪是時馮淑妃陸令萱內制朝政陰氣盛積故天變屢見雷雨不時陳太建元年七月大雨震萬安陵華表又震慧日寺剎瓦官寺重閣門下一女子震死京房易飛候曰雷雨霹靂丘陵者逆先人令為火殺人者人君用讒言殺正人時蔡景歷以奸邪任用右僕射陸繕以讒毀獲譴發病而死十年三月震武庫時帝好兵頻年北伐內外虛竭將士勞敝既克淮南又進圖彭汴毛喜切諫不納由是吳明徹諸軍皆沒遂失淮南之地武庫者兵器之所聚也而震之天戒若曰宜戢兵以安百姓帝不悟又大興軍旅其年六月又震太皇寺剎莊嚴寺露槃重陽閣東樓鴻臚府門太皇莊嚴二寺陳國奉佛之所重陽閣每所遊宴鴻臚賓客禮儀之所在而同歲震者天戒若曰國威已喪不務修德後必有恃佛道耽宴樂棄禮儀而亡國者陳之君臣竟不悟至後主之代災異屢起懼而於太皇寺捨身為奴以祈冥助不恤國政耽酒色棄禮法不修鄰好以取敗亡齊武平元年夏震丞相段孝先南門柱京房易傳曰震擊貴臣門及屋者不出三年佞臣被誅後歲和士開被戮木氷東魏武定四年冬天雨木氷洪範五行傳曰陰之盛而凝滯也木者少陽貴臣象也將有害則陰氣脅木木先寒故得雨而氷襲之木氷一名介介者兵之象也時司徒侯景制河南及神武不豫文襄懼其為亂而徵之景因舉兵反豫州刺史高元成襄州刺史李密廣州刺史暴顯並為景所執辱貴臣有害之應也其後左僕射慕容紹宗與景戰於渦陽俘斬五萬後齊天保二年雨木氷三日初清河王嶽為高歸彥所譖是歲以憂死武平元年冬雨木氷明年二月又木氷時録尚書事和士開專政其年七月太保琅邪王儼矯詔殺之領軍大將軍庫狄伏連尚書右僕射馮子琮並坐儼賜死九月儼亦遇害六年七年頻歲春冬木氷其年周師入晉陽因平鄴都後主走青州貴臣死散州郡被兵者不可勝數大雨雹梁中大通元年四月大雨雹洪範五行傳曰雹陰脅陽之象也時帝數捨身為奴拘信佛法為沙門所制陳太建二年六月大雨雹十年四月又大雨雹十三年九月又雨雹時始興王叔陵驕恣陰結死士圖為不逞帝又寵遇之故天三見變帝不悟及帝崩叔陵果為亂逆服妖後齊婁后臥疾寢衣無故自舉俄而后崩文宣帝末年衣錦綺傳粉黛數為胡服微行市里粉黛者婦人之飾陽為陰事君變為臣之象也及帝崩太子嗣位被廢為濟南王又齊氏出自陰山胡服者將反初服也錦綵非帝王之法服微服者布衣之事齊亡之效也後主好令宮人以白越布折額狀如髽幗又為白蓋此二者喪禍之服也後主果為周武帝所滅父子同時被害武平時後主於苑內作貧兒村親衣縷之服而行乞其間以為笑樂多令人服烏衣以相執縛後主果為周所敗被虜於長安而死妃后窮困至以賣燭為業後周大象元年服冕二十有四旒車服旗鼓皆以二十四為節侍衛之官服五色雜以紅紫令天下車以大木為輪不施輻朝士不得佩綬婦人墨葬黃眉又造下帳如送終之具令五皇后各居其一實宗廟祭器於前帝親讀版而祭之又將五輅載婦人身率左右步從又倒懸雞及碎瓦於車上觀其作聲以為笑樂皆服妖也帝尋暴崩而政由於隋周之法度皆悉改易開皇中房陵王勇之在東宮及宜陽公王世積家婦人所服領巾製同槊幡軍幟婦人為陰臣象也而服兵幟臣有兵禍之應矣勇竟而遇害世積坐伏誅雞禍開皇中有人上書言頻歲已來雞鳴不鼓翅類腋下有物而妨之翮不得舉肘腋之臣當為變矣書奏不省京房易飛候曰雞鳴不鼓翅國有大害其後大臣多被夷滅諸王廢黜太子幽廢大業初天下雞多夜鳴京房易飛候曰雞夜鳴急令又云昏而鳴百姓有事人定鳴多戰夜半鳴流血漫漫及中年已後軍國多務用度不足於是急令暴賦責成守宰百姓不聊生矣各起而為盜戰爭不息尸骸被野龜孽開皇中掖庭宮每夜有人來挑宮人宮司以聞帝曰門衛甚嚴人何從而入當是妖精耳因戒宮人曰若逢但斫之其後有物如人夜來登牀宮人抽刀斫之若中枯骨其物落牀而走宮人逐之因入池而沒明日帝令涸池得一龜徑尺餘其上有刀迹殺之遂絶龜者水居而靈陰謀之象晉王諂媚宮掖求嗣之應云青眚青祥陳禎明二年四月羣鼠無數自蔡洲岸入石頭淮至青塘兩岸數日死隨流出江近青祥也京房易飛候曰鼠無故羣居不穴衆聚者其君死未幾而國亡金沴木陳天嘉六年秋七月儀賢堂無故自壓近金沴木也時帝盛修宮室起顯德等五殿稱為壯麗百姓失業故木失其性也儀賢堂者禮賢尚齒之謂無故自壓天戒若曰帝好奢侈不能用賢使能何用虛名也帝不悟明年竟崩禎明元年六月宮內水殿若有刀鋸斫伐之聲其殿因無故而倒七月朱雀航又無故自沉時後主盛修園囿不虔宗廟水殿者遊宴之所朱雀航者國門之大路而無故自壞天戒若曰宮室毀津路絶後主不悟竟為隋所滅宮廟為墟後齊孝昭帝將誅楊愔乘車向省入東門幰竿無故自折帝甚惡之歲餘而崩河清三年長廣郡廳事梁忽剝若人狀太守惡而削去之明日復然長廣帝本封也木為變不祥之兆其年帝崩武平七年秋穆后將如晉陽向北宮辭胡太后至宮內門所乘七寶車無故陷入於地牛沒四足是歲齊滅后被虜於長安後周建德六年青城門無故自崩青者東方色春宮之象也時皇太子無威儀禮節青城門無故自崩者皇太子不勝任之應帝不悟明年太子嗣位果為無道周室危亡實自此始大業中齊王暕於東都起第新構寢堂其無故而折時上無太子天下皆以暕次當立公卿屬望暕遂驕恣呼術者令相又為厭勝之事堂無故自折木失其性奸謀之應也天見變以戒之暕不悟後竟得罪於帝洪範五行傳曰言之不從是謂不乂厥咎僭厥罰常暘厥極憂時則有詩妖時則有毛蟲之孽時則有犬禍故有口舌之痾有白眚白祥惟木沴金言不從梁武陵王紀僭即帝位建元曰天正永豐侯蕭撝曰王不克矣昔桓玄年號大亨有識者以為二月了而玄之敗實在仲春今曰天正正之為文一止其能久乎果一年而敗後齊文宣帝時太子殷當冠詔令邢子才為制字子才字之曰正道帝曰正一止也吾兒其替乎子才請改帝不許曰天也因顧謂常山王演曰奪時任汝慎無殺也及帝崩太子嗣位常山果廢之而自立殷尋見害武成帝時左僕射和士開言於帝曰自古帝王盡為灰土堯舜桀紂竟亦何異陛下宜及少壯恣意歡樂一日可以當千年無為自勤約也帝悅其言彌加淫侈士開既導帝以非道身又擅權竟為御史中丞所殺武平中陳人寇彭城後主發言憂懼侍中韓長鸞進曰縱失河南猶得為龜茲國子淮南今沒何足多慮人生幾何時但為樂不須憂也帝甚悅遂耽荒酒色不以天下為虞未幾為周所滅武平七年後主為周師所敗走至鄴自稱太上皇傳位於太子改元隆化時人離合其字曰降死竟降周而死周武帝改元為宣政梁主蕭巋離合其字為宇文亡日其年六月帝崩宣帝在東宮時不修法度武帝數撻之及嗣位摸其痕而大罵曰死晚也年又改元為大象蕭巋又離合其字曰天子冢明年而帝崩開皇初梁王蕭琮改元為廣運江陵父老相謂曰運之為字軍走也吾君當為軍所走乎其後琮朝京師而被拘留不反其叔父巖掠居人以叛梁國遂廢文帝名皇太子曰勇晉王曰英秦王曰俊蜀王曰秀開皇初有人上書曰勇者一夫之用又千人之秀為英萬人之秀為俊斯乃布衣之美稱非帝王之嘉名也帝不省時人呼楊姓多為嬴者或言於上曰楊英反為嬴殃帝聞而不懌遽改之其後勇俊秀皆被廢黜煬帝嗣位終失天下卒為楊氏之殃煬帝即位號年曰大業識者惡之曰於字離合為大苦未也尋而天下喪亂率土遭荼炭之酷焉煬帝常從容謂祕書郎虞世南曰我性不欲人諫若位望通顯而來諫我以求當世之名者彌所不耐至於卑賤之士雖少寬假然卒不置之於地汝其知之時議者以為古先哲王之馭天下也明四目達四聰懸敢諫之鼓立書謗之木以開言者之路猶恐忠言之不至由是澤敷四海慶流子孫而帝惡直言讎諫士其能久乎竟逢殺逆旱梁天監元年大旱米斗五千人多餓死洪範五行傳曰君持亢陽之節興師動衆勞人過度以起城邑不顧百姓臣下悲怨然而心不能從故陽氣盛而失度陰氣沉而不附陽氣盛旱災應也初帝起兵襄陽破張沖敗陳伯之及平建康前後連戰百姓勞敝及即位後復與魏交兵不止之應也陳太建十二年春不雨至四月先是周師掠淮北始興王叔陵等諸軍敗績淮北之地皆沒於周蓋其應也東魏天平四年並肆汾建晉絳秦陝等諸州大旱人多流散是歲齊神武與西魏戰於沙苑敗績死者數萬東魏武定二年冬春旱先是西魏師入洛陽神武親帥軍大戰於芒山死者數萬後齊天保九年夏大旱先是大發卒築長城四百餘里勞役之應也乾明元年春旱先是發卒數十萬築金鳳聖應崇光三臺窮極侈麗不恤百姓亢陽之應也河清二年四月並晉已西五州旱是歲發卒築軹關突厥二十萬衆毀長城寇州後主天統二年春旱是時大發卒起大明宮開皇四年已後京師頻旱時遷都龍首建立宮室百姓勞敝亢陽之應也大業四年燕代緣邊諸郡旱時發卒百餘萬築長城帝親巡塞表百姓失業道殣相望八年天下旱百姓流亡時發四海兵帝親征高麗六軍凍餒死者十八九十三年天下大旱時郡縣鄉邑悉遣築城發男女無少長皆就役詩妖梁天監三年六月八日武帝講於重雲殿沙門志公忽然起歌樂須臾悲泣因賦五言詩曰樂哉三十餘悲哉五十𩹉但看八十三子地妖災起佞臣作欺妄賊臣滅君子若不信吾語龍時侯賊起且至馬中間銜悲不見喜梁自天監至于大同三十餘年江表無事至太清二年臺城陷帝享國四十八年所言五十𩹉也太清元年八月十三而侯景自懸瓠來降在丹陽之北子地帝惑朱虉之言以納景景之作亂始自戊辰之歲至午年帝憂崩十年四月八日志公於大會中又作詩曰兀尾狗子始著狂欲死不死齧人傷須臾之間自滅亡患在汝陰死三湘橫尸一旦無人藏侯景小字狗子初自懸瓠來降懸瓠則古之汝南也巴陵南有地名三湘即景奔敗之所天監中茅山隱士陶弘景為五言詩曰夷甫任散誕平叔坐談空不意昭陽殿忽作單于宮及大同之季公卿唯以談玄為務夷甫平叔朝賢也侯景作亂遂居昭陽殿大同中童謠曰青絲白馬壽陽來其後侯景破丹陽乘白馬以青絲為羈勒陳初有童謠曰黃班青驄馬發自壽陽涘來時冬氣末去日春風始其後陳主果為韓擒所敗擒本名擒獸黃班之謂也破建康之始復乘青驄馬往反時節皆相應陳時江南盛歌王獻之桃葉之詞曰桃葉復桃葉渡江不用楫但度無所苦我自迎接汝晉王伐陳之始置營桃葉山下及韓擒渡江大將任蠻奴至新林以導北軍之應陳後主造齊雲觀國人歌之曰齊雲觀寇來無際畔功未畢而為隋師所虜禎明初後主作新歌詞甚哀怨令後宮美人習而歌之其辭曰玉樹後庭花花開不復久時人以歌讖此其不久兆也齊神武始移都于鄴時有童謠云可憐青雀子飛入鄴城𩹉作窠猶未成舉頭失鄉里寄書與婦母好看新婦子魏孝靜帝者清河王之子也后則神武之女鄴都宮室未備即逢禪代作窠未成之效也孝靜尋崩文宣以后為太原長公主降於楊愔時婁后尚在故言寄書於婦母新婦子斥后也武定中有童謠云百尺高竿摧折水底燃燈澄滅高者齊姓也澄文襄名五年神武崩摧折之應七年文襄遇盜所害澄滅之徵也天保中陸法和入國書其屋壁曰十年天子為尚可百日天子急如火周年天子迭代坐時文宣帝享國十年而崩廢帝嗣立百餘日用替厥位孝昭即位一年而崩此其效也武平元年童謠曰狐截尾你欲除我我除你其年四月隴東王胡長仁謀遣刺客殺和士開事露返為士開所譖死二年童謠曰和士開七月三十日將你向南臺小兒唱訖一時拍手云殺却至七月二十五日御史中丞琅邪王儼執士開送於南臺而斬之是歲又有童謠曰七月刈禾傷早九月喫糕正好十月洗蕩飯甕十一月出却趙老七月士開被誅九月琅邪王遇害十一月趙彥深出為西兗州刺史武平末童謠曰黃花勢欲落清樽但滿酌時穆后母子淫僻干預朝政時人患之穆后小字黃花尋逢齊亡欲落之應也鄴中又有童謠曰金作掃帚玉作把淨掃殿屋迎西家未幾周師入鄴周初有童謠曰白楊樹頭金雞鳴祗有阿舅無外甥靜帝隋氏之甥既遜位而崩諸舅冖出蟲盛周宣帝與宮人夜中連臂踏蹀而歌曰自知身命促把燭夜行遊帝即位三年而崩開皇十年高祖幸並州宴秦孝王及王子相帝為四言詩曰紅顏詎幾玉貌須臾一朝花落白髮難除明年後歲誰有誰無明年而子相卒十八年而秦孝王薨大業十一年煬帝自京師如東都至長樂宮飲酒大醉因賦五言詩其卒章曰徒有歸飛心無復因風力令美人再三吟詠帝泣下霑襟侍御者莫不欷歔帝因幸江都復作五言詩曰求歸不得去真成遭箇春鳥聲爭勸酒梅花笑殺人帝以三月被弒即遭春之應也是年盜賊蜂起道路隔絶帝懼遂無還心帝復夢二竪子歌曰住亦死去亦死未若乘船渡江水由是築宮丹陽將居焉功未就而帝被殺大業中童謠曰桃李子鴻鵠繞陽山宛轉花林𩹉莫浪語誰道許其後李密坐楊玄感之逆為吏所拘在路逃叛潛結羣盜自陽城山而來襲破洛口倉後復屯兵苑內莫浪語密也宇文化及自號許國尋亦破滅誰道許者蓋驚疑之辭也毛蟲之孽梁武帝中大同元年邵陵王綸在南徐州臥內方晝有狸鬬於上墮而獲之太清中遇侯景之亂將兵援臺城至鍾山有蟄熊無何至齧綸所乘馬毛蟲之孽也綸尋為王僧辨所敗亡至南陽為西魏所殺中大同中每夜狐鳴闕下數年乃止京房易飛候曰野獸羣鳴邑中且空虛俄而國亂丹陽死喪略盡陳禎明初狐入牀下捕之不獲京房易飛候曰狐入君室室不居未幾而國滅東魏武定三年九月豹入鄴城南門格殺之五年八月豹又上銅爵臺京房易飛候曰野獸入邑及至朝廷若道上官府門有大害君亡是歲東魏師敗於玉壁神武遇疾崩後齊武平二年有出廟社之中京房易飛候曰入王室其君亡案廟者祖宗之神室也後五歲周師入鄴後主東奔武平末並肆諸州多狼而食人洪範五行傳曰狼貪暴之獸大體以白色為主兵之表也又似犬近犬禍也京房易傳曰君將無道害將及人去之深山以全身厥妖狼食人時帝任用小人競為貪暴殘賊人物食人之應尋為周軍所滅兵之象也武平中朔州府門外無何有小兒腳跡又擁土為城雉之狀時人怪而察之乃狐媚所為漸流至並鄴與武定三年同占是歲南安王思好起兵於北朔直指並州為官軍所敗鄭子饒羊法皓等復亂山東犬禍後齊天保四年鄴中及頓丘並有犬與女子交洪範五行傳曰異類不當交而交悖亂之氣犬交人為犬禍犬禍者亢陽失衆之應也時帝不恤國政恩澤不流於其國後主時犬為開府儀同雌者有夫人郡君之號給兵以奉養食以粱肉藉以茵蓐天奪其心爵加於犬近犬禍也天意若曰卿士皆類犬後主不悟遂以取滅後周保定三年有犬生子腰已後分為兩身二尾六足犬猛畜而有爪牙將士之象也時宇文護與侯伏侯龍恩等有謀懷二犬體後分此其應也大業元年雁門百姓間犬多去其主羣聚於野形頓變如狼而噉噬行人數年而止五行傳曰犬守禦者也而今去其主臣下不附之象形變如狼狼色白為主兵之應也其後帝窮兵黷武勞役不息天戒若曰無為勞役守禦之臣將叛而為害帝不悟遂起長城之役續有西域遼東之舉天下怨叛及江都之變並宿衛之臣也白眚白祥梁大同二年地生白毛長二尺近白祥也孫盛以為勞人之異先是大發卒築浮山堰功費巨億功垂就而復潰者數矣百姓厭役吁嗟滿道齊河清元年九月滄洲及長城之下地多生毛或白或黑長四五寸近白祥也時北築長城內興三臺人苦勞役開皇六年七月京師雨毛如髮尾長者三尺餘短者六七寸京房易飛候曰天雨毛其國大饑是時關中旱米粟涌貴後齊天統初岱山封禪壇玉璧自出近白祥也岱山王者易姓告代之所玉璧所用幣而自出將有易姓者用幣之象其後齊亡地入于周及高祖受周禪天下一統焚柴太山告祠之應也武平三年白水巖下青石壁傍有文曰齊亡走人改之為上延後主以為嘉瑞百僚畢賀後周師入國後主果棄鄴而走開皇十七年石隕於武安滏陽間十餘洪範五行傳曰石自高隕者君將有危殆也後七載帝崩開皇末高祖於宮中埋二小石於地以志置牀之所未幾變為玉劉向曰玉者至貴也賤將為貴之象及大業末盜皆僭名號大業十三年西平郡有石文曰天子立千年百僚稱賀有識者尤之曰千年萬歲者身後之意也今稱立千年者禍在非遠明年而帝被殺木沴金梁大同十二年曲阿建陵隧口石騏驎動木沴金也動者遷移之象天戒若曰園陵無主石驎將為人所徙也後竟國亡後齊河清四年殿上石自起兩兩相擊眭孟以為石陰類下人象殿上石自起者左右親人離叛之應及周師東伐寵臣尉相願乞扶貴和兄弟韓建業之徒皆叛入周梁大同十二年正月送辟邪二于建陵左雙角者至陵所右獨角者將引於車上振躍者三車兩轅俱折因換車未至陵二里又躍者三每一振則車側人莫不聳奮去地三四尺車輪陷入土三寸木沴金也劉向曰失衆心令不行言不從以亂金氣也石為陰臣象也臣將為變之應梁武暮年不以政事為意君臣唯講佛經談玄而已朝綱紊亂令不行言不從之咎也其後果致侯景之亂周建德元年濮陽郡有石像郡官令載向府將刮取金在道自躍投地如此者再乃以大繩縛著車壁又絶繩而下時帝既滅齊又事淮南征伐不息百姓疲敝失衆心之應也

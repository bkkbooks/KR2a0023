body:
  text: 隋書卷六十列傳第二十五崔仲方崔仲方字不齊博陵安平人也祖孝芬魏荊州刺史父宣猷周小司徒仲方少好讀書有文武才幹年十五周太祖見而異之令與諸子同就學時高祖亦在其中由是與高祖少相款密後以明經為晉公宇文護參軍事尋轉記室遷司玉大夫與斛斯徵柳敏等同修禮律後以軍功授平東將軍銀青光祿大夫賜爵石城縣男邑三百戶時武帝陰有滅齊之志仲方獻二十策帝大奇之後與少內史趙芬刪定格式尋從帝攻晉州齊之亞將崔景嵩請為內應仲方與段文振等登城應接遂下晉州語在文振傳又令仲方説翼城等四城下之授儀同進爵范陽縣侯後以行軍長史從郯公王軌擒陳將吳明徹於呂梁仲方計策居多宣帝嗣位為少內史奉使淮南而還會帝崩高祖為丞相與仲方相見握手極歡仲方亦歸心焉其夜上便宜十八事高祖並嘉納之又見衆望有歸陰勸高祖應天受命高祖從之及受禪上召仲方與高熲議正朔服色事仲方曰晉為金行後魏為水周為木皇家以火承木得天之統又聖躬載誕之初有赤光之瑞車服旗牲並宜用赤又勸上除六官請依漢魏之舊上皆從之進位上開府尋轉司農少卿進爵安固縣公令發丁三萬於朔方靈武築長城東至黃河西拒綏州南至勃出嶺綿亙七百里明年上復令仲方發丁十五萬於朔方已東緣邊險要築數十城以遏胡寇丁父艱去職未期起為虢州刺史上書論取陳之策曰臣謹案晉太康元年歲在庚子晉武平吳至今開皇六年歲次丙午合三百七載春秋寶乾圖云王者三百年一蠲法今三百之期可謂備矣陳氏草竊起於丙子至今丙午又子午為衝陰陽之忌昔史趙有言曰陳顓頊之族為水故歲在鶉火以滅又云周武王克商封胡公滿於陳至魯昭公九年陳災禆竈曰歲五及鶉火而後陳亡楚剋之楚祝融之後也為火正故復滅陳陳承舜後舜承顓頊雖太歲左行歲星右轉鶉火之歲陳族再亡戊午之年媯虞運盡語迹雖殊考事無別皇朝五運相承感火德而王國號為隋與楚同分楚是火正午為鶉火未為鶉首申為實沈酉為大梁既當周秦晉趙之分若當此分發兵將得歲之助以今量古陳滅不疑臣謂午未申酉並是數極蓋聞天時不如地利地利不如人和況主聖臣良兵強國富動植回心人神協契陳既主昏於上民讟於下險無百二之固衆非九國之師夏癸殷辛尚不能立獨此島夷而稽天討伏度朝廷自有宏謨但芻蕘所見冀申螢爝今唯須武昌已下蘄和滁方吳海等州更帖精兵密營渡計益信襄荊基郢等州速造舟楫多張形勢為水戰之具蜀漢二江是其上流水路衝要必爭之所賊雖於流頭荊門延州公安巴陵隱磯夏首蘄口盆城置船然終聚漢口峽口以水戰大決若賊必以上流有軍令精兵赴援者下流諸將即須擇便橫渡如擁衆自衛上江水軍鼓行以前雖恃九江五湖之險非德無以為固徒有三吳百越之兵無恩不能自立上覽而大悅轉基州刺史徵入朝仲方因面陳經略上善之賜以御袍袴並雜綵五百段進位開府而遣之及大舉伐陳以仲方為行軍總管率兵與秦王會及陳平坐事免未幾復位後數載轉會州總管時諸羌猶未賓附詔令仲方擊之與賊三十餘戰紫祖四鄰望方涉題千碉小鐵圍山白男王弱水等諸部悉平賜奴婢一百三十口黃金三十斤雜物稱是仁壽初授代州總管在職數年被徵入朝會上崩漢王諒餘黨據呂州不下煬帝令周羅攻之中流矢卒乃令仲方代總其衆月餘拔之進位大將軍拜民部尚書尋轉禮部尚書後三載坐事免尋為國子祭酒轉太常卿朝廷以其衰老出拜上郡太守未幾以母憂去職歲餘起為信都太守上表乞骸骨優詔許之尋卒於家時年七十六子民壽官至定陶令于仲文兄顗從父弟璽于仲文字次武建平公義之兄子父實周大左輔燕國公仲文少聰敏髫就學耽閲不倦其父異之曰此兒必興吾宗矣九歲嘗於雲陽宮見周太祖太祖問曰聞兒好讀書書有何事仲文對曰資父事君忠孝而已太祖甚嗟歎之其後就博士李祥受周易三禮略通大義及長倜儻有大志氣調英拔當時號為名公子起家為趙王屬尋遷安固太守有任杜兩家各失牛後得一牛兩家俱認州郡久不能決益州長史韓伯俊曰于安固少聰察可令決之仲文曰此易解耳於是令二家各驅牛羣至乃放所認者遂向任氏羣中又陰使人微傷其牛任氏嗟惋杜家自若仲文於是訶詰杜氏杜氏服罪而去始州刺史屈突尚宇文護之黨也先坐事下獄無敢繩者仲文至郡窮治遂竟其獄蜀中為之語曰明斷無雙有于公不避強禦有次武未幾徵為御正下大夫封延壽郡公邑三千五百戶數從征伐纍勳授儀同三司宣帝時為東郡太守高祖為丞相尉迥作亂遣將檀讓收河南之地復使人誘致仲文仲文拒之迥怒其不同己遣儀同宇文威攻之仲文迎擊大破威衆斬首五百餘級以功授開府迥又遣其將宇文胄渡石濟宇文威鄒紹自白馬二道俱進復攻仲文賊勢逾盛人情大駭郡人赫連僧伽敬子哲率衆應迥仲文自度不能支棄妻子將六十餘騎開城西門潰圍而遁為賊所追且戰且行所從騎戰死者十七八仲文僅而獲免達於京師迥於是屠其三子一女高祖見之引入臥內為之下泣賜綵五百段黃金二百兩進位大將軍領河南道行軍總管給以鼓吹馳傳詣洛陽發兵以討檀讓時韋孝寬拒迥於永橋仲文詣孝寬有所計議時總管字文欣頗有自疑之心因謂仲文曰公新從京師來觀執政意何如也尉迥誠不足平正恐事寧之後更有藏弓之慮仲文懼欣生變因謂之曰丞相寬仁大度明識有餘苟能竭誠必心無二仲文在京三日頻見三善以此為觀非尋常人也欣曰三善如何仲文曰有陳萬敵者新從賊中來即令其弟難敵召募鄉曲從軍討賊此其有大度一也上士宋謙奉使勾檢謙緣此別求他罪丞相責之曰入網者自可推求何須別訪以虧大體此其不求人私二也言及仲文妻子未嘗不泫此其有仁心三也欣自此遂安仲文軍至汴州之東倪塢與迥將劉子昂劉浴德等相遇進擊破之軍次蓼隄去梁郡七里讓擁衆數萬仲文以羸師挑戰讓悉衆來拒仲文偽北讓軍頗驕於是遣精兵左右翼擊之大敗讓軍生獲五千餘人斬首七百級進攻梁郡迥守將劉子寬棄城遁走仲文追擊擒斬數千人子寬僅以身免初仲文在蓼隄諸將皆曰軍自遠來士馬疲敝不可決勝仲文令三軍趣食列陳大戰既而破賊諸將皆請曰前兵疲不可交戰竟而剋勝其計安在仲文笑曰吾所部將士皆山東人果於速進不宜持久乘勢擊之所以制勝諸將皆以為非所及也進擊曹州獲迥所署刺史李仲康及上儀同房徑檀讓以餘衆屯城武別將高士儒以萬人屯永昌仲文詐移書州縣曰大將軍至可多積粟讓謂仲文未能卒至方槌牛享士仲文知其怠選精騎襲之一日便至遂拔城武迥將席毗羅衆十萬屯於沛縣將攻徐州其妻子在金鄉仲文遣人詐為毗羅使者謂金鄉城主徐善淨曰檀讓明日午時到金鄉將宣蜀公令賞賜將士金鄉人謂為信然皆喜仲文簡精兵偽建迥旗幟倍道而進善淨望見仲文軍且至以為檀讓乃出迎謁仲文執之遂取金鄉諸將多勸屠之仲文曰此城是毗羅起兵之所當寬其妻子其兵可自歸如即屠之彼望絶矣衆皆稱善於是毗羅恃衆來薄官軍仲文背城結陳去軍數里設伏於麻田中兩陳才合伏兵發俱曳柴鼓噪塵埃張天毗羅軍大潰仲文乘之賊皆投洙水而死為之不流獲檀讓檻送京師河南悉平毗羅匿滎陽人家執斬之傳首闕下勒石紀功樹於泗上入朝京師高祖引入臥內宴享極歡賜雜綵千餘段妓女十人拜柱國河南道大行臺屬高祖受禪不行未幾其叔父太尉翼坐事下獄仲文亦為吏所簿於獄中上書曰臣聞春生夏長天地平分之功子孝臣誠人倫不易之道曩者尉迥逆亂所在影從臣任處關河地居衝要嘗膽枕戈誓以必死迥時購臣位大將軍邑萬戶臣不顧妻子不愛身命冒白刃潰重圍三男一女相繼淪沒披露肝膽馳赴闕庭蒙陛下授臣以高官委臣以兵革于時河南凶寇狼顧鴟張臣以羸兵八千掃除氛祲摧劉寬於梁郡破檀讓於蓼隄平曹州復東郡安城武定永昌解亳州圍殄徐州賊席毗十萬之衆一戰土崩河南蟻聚之徒應時戡定當羣凶問鼎之際黎元乏主之辰臣第二叔翼先在幽州總馭燕趙南鄰羣寇北捍旄頭內外安撫得免罪戾臣第五叔智建旟黑水與王謙為鄰式遏蠻陬鎮綏蜀道臣兄顗作牧淮南坐制勍敵乘機勦定傳首京師王謙竊據二江叛換三蜀臣第三叔義受脤廟庭龔行天討自外父叔兄弟皆當文武重寄或銜命危難之間或侍衛鉤陳之側合門誠款冀有可明伏願垂泣辜之恩降雲雨之施追草昧之始録涓滴之功則寒灰更然枯骨生肉不勝區區之至謹冒死以聞上覽表並翼俱釋之未幾詔仲文率兵屯白狼塞以備胡明年拜行軍元帥統十二總管以擊胡出服遠鎮遇虜破之斬首千餘級六畜巨萬計於是從金河出白道遣總管辛明瑾元滂賀蘭志呂楚段諧等二萬人出盛樂道趨那頡山至護軍川北與虜相遇可汗見仲文軍容齊肅不戰而退仲文率精騎五千踰山追之不及而還上以尚書文簿繁雜吏多姦計令仲文勘録省中事其所發擲甚多上嘉其明斷厚加勞賞焉上每憂轉運不給仲文請決渭水開漕渠上然之使仲文總其事及伐陳之役拜行軍總管以舟師自章山出漢口陳郢州刺史荀法尚魯山城主誕法澄鄧沙彌等請降秦王俊皆令仲文以兵納之高智慧等作亂江南復以行軍總管討之時三軍乏食米粟踊貴仲文私糶軍糧坐除名明年復官爵率兵屯馬邑以備胡數旬而罷晉王廣以仲文有將領之才每常屬意至是奏之乃令督晉王軍府事後突厥犯塞晉王為元帥以仲文將前軍大破賊而還仁壽初拜太子右衛率煬帝即位遷右翊衛大將軍參掌文武選事從帝討吐谷渾進位光祿大夫甚見親幸遼東之役仲文率軍指樂浪道軍次烏骨城仲文簡羸馬驢數千置於軍後既而率衆東過高麗出兵掩襲輜重仲文回擊大破之至鴨緑水高麗將乙支文德詐降來入其營仲文先奉密旨若遇高元及文德者必擒之至是文德來仲文將執之時尚書右丞劉士龍為慰撫使固止之仲文遂捨文德尋悔遣人紿文德曰更有言議可復來也文德不從遂濟仲文選騎渡水追之每戰破賊文德遺仲文詩曰神策究天文妙算窮地理戰勝功既高知足願云止仲文答書諭之文德燒柵而遁時宇文述以糧盡欲還仲文議以精鋭追文德可以有功述固止之仲文怒曰將軍仗十萬之衆不能破小賊何顏以見帝且仲文此行也固無功矣述因厲聲曰何以知無功仲文曰昔周亞夫之為將也見天子軍容不變此決在一人所以功成名遂今者人各其心何以赴敵初帝以仲文有計畫令諸軍咨稟節度故有此言由是述等不得已而從之遂行東至薩水宇文述以兵餒退歸師遂敗績帝以屬吏諸將皆委罪於仲文帝大怒釋諸將獨繫仲文仲文憂恚發病困篤方出之卒於家時年六十八撰漢書刊繁三十卷略覽三十卷有子九人欽明最知名顗字元武身長八尺美鬚眉周大冢宰宇文護見而器之妻以季女尋以父勳賜爵新野郡公邑三千戶授大都督遷車騎大將軍儀同三司其後纍以軍功授上開府歷左右宮伯郢州刺史大象中以水軍總管從韋孝寬經略淮南顗率開府元紹貴上儀同毛猛等以舟師自潁口入淮陳防主潘深棄柵而走進與孝寬攻拔壽陽復引師圍硤石守將許約懼而降顗乃拜東廣州刺史尉迥之反也時總管趙文表與顗素不協顗將圖之因臥閣內詐得心疾謂左右曰我見兩三人至我前者輒大驚即欲斫之不能自制也其有賓客候問者皆令去左右顗漸稱危篤文表往候之令從者至大門而止文表獨至顗所顗欻然而起抽刀斫殺之因唱言曰文表與尉迥通謀所以斬之其麾下無敢動者時高祖以尉迥未平盧顗復生邊患因而勞勉之即拜吳州總管陳將錢茂和率數千人襲江陽顗逆擊走之陳復遣將陳紀周羅燕合兒等襲顗顗拒之而退賜綵數百段高祖受禪文表弟詣闕稱兄無罪上令案其事太傅竇熾等議顗當死上以門著勳績特原之貶為開府後襲爵燕國公邑萬六千戶尋以疾免開皇七年拜澤州刺史數年免職卒於家子世虔嗣璽字伯符父翼仕周為上柱國幽州總管任國公高祖為丞相尉迵作亂遣人誘翼翼鎖其使送之長安高祖甚悅及高祖受禪翼入朝上為之降榻握手極歡數日拜為太尉歲餘卒諡曰穆璽少有器幹仕周起家右侍上士尋授儀同領右羽林遷少胥附武帝時從齊王憲破齊師於洛陽以功賜爵豐寧縣子邑五百戶尋從帝平齊加開府改封黎陽縣公邑千二百戶授職方中大夫及宣帝嗣位轉右勳曹中大夫尋領右忠義高祖為丞相加上開府及受禪進位大將軍拜汴州刺史甚有能名上聞而善之優詔褒揚賜帛百匹尋加上大將軍進爵郡公轉邵州刺史在州數年甚有恩惠後檢校江陵總管州人張願等數十人詣闕上表請留璽上嘉歎良久令還邵州父老相賀尋遷洛州刺史復為熊州刺史並有惠政以疾徵還京師仁壽末卒于家諡曰靜有子志本段文振段文振北海期原人也祖壽魏滄州刺史父威周洮河甘渭四州刺史文振少有膂力膽氣過人性剛直明達時務初為宇文護親信護知其有幹用擢授中外府兵曹後武帝攻齊海昌王尉相貴於晉州其亞將侯子欽崔景嵩為內應文振杖槊登城與崔仲方等數十人先登文振隨景嵩至相貴所拔佩刃劫之相貴不敢動城遂下帝大喜賜物千段進拔文侯華谷高壁三城皆有力焉及攻并州陷東門而入齊安德王延宗懼而出降録前後勳將拜高秩以才毀獲譴因授上儀同賜爵襄國縣公邑千戶進平鄴都又賜綺羅二千匹後從滕王逌擊稽胡破之歷相州別駕揚州總管長史入為天官都上士從韋孝寬經略淮南俄而尉迥作亂時文振老母妻子俱在鄴城迥遣人誘之文振不顧歸於高祖高祖引為丞相掾領宿衛驃騎司馬消難之奔陳也高祖令文振安集淮南還除衛尉少卿兼內史侍郎尋以行軍長史從達奚震討叛蠻平之加上開府歲餘遷鴻臚卿衛王爽北征突厥以文振為長史坐勳簿不實免官後為石河二州刺史甚有威惠遷蘭州總管改封龍岡縣公突厥犯塞以行軍總管擊破之逐北至居延塞而還九年大舉伐陳以文振為元帥秦王司馬別領行軍總管及平江南授揚州總管司馬尋轉並州總管司馬以母憂去職未幾起令視事固辭不許後數年拜雲州總管尋為太僕卿十九年突厥犯塞文振以行軍總管拒之遇達頭可汗於沃野擊破之文振先與王世積有舊初文振北征世積遺以駝馬比還世積以罪被誅文振坐與交關功遂不録明年率衆出靈州道以備胡無虜而還越巂蠻叛文振擊平之賜奴婢二百口仁壽初嘉州獠作亂文振以行軍總管討之引軍山谷間為賊所襲前後阻險不得相救軍遂大敗文振復收散兵擊其不意竟破之文振性素剛直無所降下初軍次益州謁蜀王秀貌頗不恭秀甚銜之及此奏文振師徒喪敗右僕射蘇威與文振有隙因而譖之坐是除名及秀廢黜文振上表自申理高祖慰諭之授大將軍尋拜靈州總管煬帝即位徵為兵部尚書待遇甚重從征吐谷渾文振督兵屯雪山連營三百餘里東接楊義臣西連張壽合圍渾主於覆袁川以功進位右光祿大夫帝幸江都以文振行江都郡事文振見高祖時容納突厥啓民居于塞內妻以公主賞賜重疊及大業初恩澤彌厚文振以狼子野心恐為國患乃上表曰臣聞古者遠不間近夷不亂華周宣外攘戎狄秦帝築城萬里蓋遠圖良算弗可忘也竊見國家容受啓民資其兵食假以地利如臣愚計竊又未安何則夷狄之性無親而貪弱則歸投強則反噬蓋其本心也臣學非博覽不能遠見且聞晉朝劉曜梁代侯景近事之驗衆所共知以臣量之必為國患如臣之計以時喻遣令出塞外然後明設烽候緣邊鎮防務令嚴重此乃萬歲之長策也時兵曹郎斛斯政專掌兵事文振知政險薄不可委以機要屢言於帝帝並弗納及遼東之役授左候衛大將軍出南蘇道在道疾篤上表曰臣以庸微幸逢聖世濫蒙奬擢榮冠儕伍而智能無取叨竊已多言念國恩用忘寢食常思效其鳴吠以報萬分而攝養乖方疾患遂篤抱此深愧永歸泉壤不勝餘恨輕陳管穴竊見遼東小醜未服嚴刑遠降六師親勞萬乘但夷狄多詐深須防擬口陳降款心懷背叛詭伏多端勿得便受水潦方降不可淹遲唯願嚴勒諸軍星馳速發水陸俱前出其不意則平壤孤城勢可拔也若傾其本根餘城自剋如不時定脫遇秋霖深為艱阻兵糧又竭強敵在前靺鞨出後遲疑不決非上策也後數日卒於師帝省表悲歎久之贈光祿大夫尚書右僕射北平侯諡曰襄賜物一千段粟麥二千石威儀鼓吹送至墓所有子十人長子詮官至武牙郎將次綸少以俠氣聞文振弟文操大業中為武賁郎將性甚剛嚴帝令督祕書省學士時學士頗存儒雅文操輒鞭撻之前後或至千數時議者鄙之史臣曰仲方兼資文武雅有籌算伐陳之策信為深遠矣聲績克舉夫豈徒言哉仲文博涉書記以英略自許尉迥之亂遂立功名自茲厥後屢當推轂遼東之役實喪師徒斯乃大樹將顛蓋亦非戰人之罪也文振少以膽略見重終懷壯夫之志時進讜言頻稱諒直其取高位厚秩良有以也

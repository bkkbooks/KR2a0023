body:
  text: 隋書卷三十六列傳第一后妃夫陰陽肇分乾坤定位君臣之道斯著夫婦之義存焉陰陽和則裁成萬物家道正則化行天下由近及遠自家刑國配天作合不亦大乎興亡是繫不亦重乎是以先王慎之正其本而嚴其防後之繼體靡克聿修甘心柔曼之容罔念幽間之操成敗攸屬安危斯在故皇英降而虞道隆任姒歸而姬宗盛妹妲致夏殷之釁褒趙結周漢之禍爰歷晉宋實繁有徒皆位以寵升榮非德進恣行淫僻莫顧禮儀為梟為鴟敗不旋踵後之伉儷宸極正位居中罕蹈平易之塗多遵覆車之轍睢鳩之德千載寂寥牝雞之晨殊邦接響窈窕淑女靡有求於寤寐鏗鏘環珮鮮克嗣於徽音永念前修歎深彤管覽載籍於既往考行事於當時存亡得失之機蓋亦多矣故述皇后列傳所以垂戒將來然后妃之制夏殷以前略矣周公定禮內職始備列焉秦漢以下代有沿革品秩差次前史載之詳矣齊梁以降歷魏暨周廢置益損參差不一周宣嗣位不率典章衣褘翟稱中宮者凡有五夫人以下略無定數高祖思革前弊大矯其違唯皇后正位傍無私寵婦官稱號未詳備焉開皇二年著內官之式略依周禮省減其數嬪三員掌教四德視正三品世婦九員掌賓客祭祀視正五品女御三十八員掌女工絲枲視正七品又採漢晉舊儀置六尚六司六典遞相統攝以掌宮掖之政一曰尚宮掌導引皇后及閨閣廩賜管司令三人掌圖籍法式糾察宣奏典琮三人掌琮璽器玩二曰尚儀掌禮儀教學管司樂三人掌音律之事典贊三人掌導引內外命婦朝見三曰尚服掌服章寶藏管司飾三人掌簪珥花嚴典櫛三人掌巾櫛膏沐四曰尚食掌進膳先嘗管司醫三人掌方藥卜筮典器三人掌樽彝器皿五曰尚寢掌幃帳牀褥管司筵三人掌鋪設灑掃典執三人掌扇傘燈燭六曰尚工掌營造百役管司製三人掌衣服裁縫典會三人掌財帛出入六尚各三員視從九品六司視勳品六典視流外二品初文獻皇后功參歷試外預朝政內擅宮闈懷嫉妬之心虛嬪妾之位不設三妃防其上逼自嬪以下置六十員加又抑損服章降其品秩至文獻崩後始置貴人三員增嬪至九員世婦二十七員御女八十一員貴人等關掌宮闈之務六尚已下皆分隸焉煬帝時后妃嬪御無釐婦職唯端容麗飾陪從宴遊而已帝又參詳典故自製嘉名著之於令貴妃淑妃德妃是為三夫人品正第一順儀順容順華修儀修容修華充儀充容充華是為九嬪品正第二婕妤一十二員品正第三美人才人一十五員品正第四是為世婦寶林二十四員品正第五御女二十四員品正第六采女三十七員品正第七是為女御總一百二十以叙於宴寢又有承衣刀人皆趨侍左右並無員數視六品已下時又增置女官準尚書省以六局管二十四司一曰尚宮局管司言掌宣傳奏啓司簿掌名録計度司正掌格式推罰司闈掌門閣管鑰二曰尚儀局管司籍掌經史教學紙筆几案司樂掌音律司賓掌賓客司贊掌禮儀贊相導引三曰尚服局管司璽掌琮璽符節司衣掌衣服司飾掌湯沐巾櫛玩弄司仗掌仗衛戎器四曰尚食局管司膳掌膳羞司醞掌酒醴醯醢司藥掌醫巫藥劑司饎掌廩餼柴炭五曰尚寢局管司設掌牀席帷帳鋪設灑掃司輿掌輿輦傘扇執持羽儀司苑掌園種植蔬菜瓜果司燈掌火燭六曰尚工局管司製掌營造裁縫司寶掌金玉珠璣錢貨司綵掌繒帛司織掌織染六尚二十二司員各二人唯司樂司膳員各四人每司又置典及掌以二其職六尚十人品從第五司二十八人品從第六典二十八人品從第七掌二十八人品從第九女使流外量局間劇多者十人已下無定員數聯事分職各有司存焉文獻獨孤皇后河南洛陽人周大司馬河內公信之女也信見高祖有奇表故以后妻焉時年十四高祖與后相得誓無異生之子后初亦柔順恭孝不失婦道后姊為周明帝后長女為周宣帝后貴戚之盛莫與為比而后每謙卑自守世以為賢及周宣帝崩高祖居禁中總百揆后使人謂高祖曰大事已然騎獸之勢必不得下勉之高祖受禪立為皇后突厥嘗與中國交市有明珠一篋價值八百萬幽州總管陰壽白后市之后曰非我所須也當今戎狄屢寇將士罷勞未若以八百萬分賞有功者百僚聞而畢賀高祖甚寵憚之上每臨朝后輒與上方輦而進至閣乃止使宦官伺上政有所失隨則匡諫多所弘益候上退朝而同反燕寢相顧欣然后早失二親常懷感慕見公卿有父母者每為致禮焉有司奏以周禮百官之妻命於王后憲章在昔請依古制后曰以婦人與政或從此漸不可開其源也不許后每謂諸公主曰周家公主類無婦德失禮於舅姑離薄人骨肉此不順事爾等當誡之大都督崔長仁后之中外兄弟也犯法當斬高祖以后之故欲免其罪后曰國家之事焉可顧私長仁竟坐死后異母弟陀以猫鬼巫蠱咒詛於后坐當死后三日不食為之請命曰陀若𢀿政害民者妾不敢言今坐為妾身敢請其命陀於是減死一等后每與上言及政事往往意合宮中稱為二聖后頗仁愛每聞大理決囚未嘗不流涕然性尤妬忌後宮莫敢進御尉遲迥女孫有美色先在宮中上於仁壽宮見而悅之因此得幸后伺上聽朝陰殺之上由是大怒單騎從苑中而出不由徑路入山谷間二十餘里高熲楊素等追及上扣馬苦諫上太息曰吾貴為天子而不得自由高熲曰陛下豈以一婦人而輕天下上意少解駐馬良久中夜方始還宮后俟上於閣內及上至后流涕拜謝熲素等和解之上置酒極歡后自此意頗衰折初后以高熲是父之家客甚見親禮至是聞熲謂己為一婦人因此銜恨又以熲夫人死其妾生男益不善之漸加譖毀上亦每事唯后言是用后見諸王及朝士有妾孕者必勸上斥之時皇太子多內寵妃元氏暴薨后意太子愛妾雲氏害之由是諷上黜高熲竟廢太子立晉王廣皆后之謀也仁壽二年八月甲子月暈四重己巳太白犯軒轅其夜后崩於永安宮時年五十葬於太陵其後宣華夫人陳氏容華夫人蔡氏俱有寵上頗惑之由是發疾及危篤謂侍者曰使皇后在吾不及此云宣華夫人陳氏陳宣帝之女也性聰慧姿貌無雙及陳滅配掖庭後選入宮為嬪時獨孤皇后性妬後宮罕得進御唯陳氏有寵晉王廣之在藩也陰有奪宗之計規為內助每致禮焉進金蛇金駝等物以取媚於陳氏皇太子廢立之際頗有力焉及文獻皇后崩進位為貴人專房擅寵主斷內事六宮莫與為比及上大漸遺詔拜為宣華夫人初上寢疾於仁壽宮也夫人與皇太子同侍疾平旦出更衣為太子所逼夫人拒之得免歸於上所上怪其神色有異問其故夫人泫然曰太子無禮上恚曰畜生何足付大事獨孤誠誤我意謂獻皇后也因呼兵部尚書柳述黃門侍郎元巖曰召我兒述等將呼太子上曰勇也述巖出閣為勑書訖示左僕射楊素素以其事白太子太子遣張衡入寢殿遂令夫人及後宮同侍疾者並出就別室俄聞上崩而未發喪也夫人與諸後宮相顧曰事變矣皆色動股栗晡後太子遣使者齎金合子帖紙於際親署封字以賜夫人夫人見之惶懼以為鴆毒不敢發使者促之於是乃發見合中有同心結數枚諸宮人咸悅相謂曰得免死矣陳氏恚而却坐不肯致謝諸宮人共逼之乃拜使者其夜太子蒸焉及煬帝嗣位之後出居仙都宮尋召入歲餘而終時年二十九帝深悼之為製神傷賦容華夫人蔡氏丹陽人也陳滅之後以選入宮為世婦容儀婉嫕上甚悅之以文獻皇后故希得進幸及后崩漸見寵遇拜為貴人參斷宮掖之務與陳氏相亞上寢疾加號容華夫人上崩後自請言事亦為煬帝所蒸煬帝蕭皇后梁明帝巋之女也江南風俗二月生子者不舉后以二月生由是季父岌收而養之未幾岌夫妻俱死轉養舅氏張軻家然軻甚貧窶后躬親勞苦煬帝為晉王時高祖將為王選妃於梁遍占諸女諸女皆不吉巋迎后於舅氏令使者占之曰吉於是遂策為王妃后性婉順有智識好學解屬文頗知占候高祖大善之帝甚寵敬焉及帝嗣位詔曰朕祗承丕緒憲章在昔爰建長秋用承饗薦妃蕭氏夙禀成訓婦道克修宜正位軒闈式弘柔教可立為皇后帝每遊幸后未嘗不隨從時后見帝失德心知不可不敢厝言因為述志賦以自寄其詞曰承積善之餘慶備箕帚於皇庭恐修名之不立將負纍於先靈乃夙夜而匪懈實寅懼於玄冥雖自強而不息亮愚矇之所滯思竭節於天衢才追心而弗逮實庸薄之多幸荷隆寵之嘉惠賴天高而地厚屬王道之升平均二儀之覆載與日月而齊明乃春生而夏長等品物而同榮願立志於恭儉私自兢於誡盈孰有念於知足苟無希於濫名惟至德之弘深情不邇於聲色感懷舊之餘恩求故劍於宸極叨不世之殊盼謬非才而奉職何寵祿之踰分撫胸襟而未識雖沐浴於恩光內慚惶而纍息顧微躬之寡昧思令淑之良難實不遑於啓處將何情而自安若臨深而履薄心戰栗其如寒夫居高而必危慮處滿而防溢知恣夸之非道乃攝生於沖謐嗟寵辱之易驚尚無為而抱一履謙光而守志且願安乎容膝珠簾玉箔之奇金屋瑤臺之美雖時俗之崇麗蓋吾人之所鄙愧絺綌之不工豈絲竹之喧耳知道德之可尊明善惡之由己蕩囂煩之俗慮乃伏膺於經史綜針誡以訓心觀女圖而作軌遵古賢之令範冀福祿之能綏時循躬而三省覺今是而昨非嗤黃老之損思信為善之可歸慕周姒之遺風美虞妃之聖則仰先哲之高才貴至人之休德質菲薄而難蹤心恬愈而去惑乃平生之耿介實禮義之所遵雖生知之不敏庶積行以成仁懼達人之蓋寡謂何求而自陳誠素志之難寫同絶筆於獲麟及帝幸江都臣下離二有宮人白后曰外聞人人欲反后曰任汝奏之宮人言於帝帝大怒曰非所宜言遂斬之後人復白后曰宿衛者往往偶語謀反后曰天下事一朝至此勢已然無可救也何用言之徒令帝憂煩耳自是無復言者及宇文氏之亂隋軍至聊城化及敗沒於竇建德突厥處羅可汗遣使迎后於洺州建德不敢留遂入於虜庭大唐貞觀四年破滅突厥乃以禮致之歸于京師史臣曰二后帝未登庸早儷宸極恩隆好合始終不渝文獻德異鳲鳩心非均一擅寵移嫡傾覆宗社惜哉書曰牝雞之晨惟家之索高祖之不能敦睦九族抑有由矣蕭后初歸藩邸有輔佐君子之心煬帝得不以道便謂人無忠信父子之間尚懷猜阻夫婦之際其何有焉暨乎國破家亡竄身無地飄流異域良足悲矣

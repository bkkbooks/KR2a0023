body:
  text: 隋書卷九志第四禮儀四周大定元年靜帝遣兼太傅上柱國嵵國公椿大宗伯大將軍金城公煚奉皇帝璽紱策書禪位于隋司錄虞慶則白請設壇於東第博士何妥議以為受禪登壇以告天也故魏受漢禪設壇於繁昌為在行旅郊壇乃闕至如漢高在汜光武在鄗盡非京邑所築壇自晉宋揖讓皆在都下莫不並就南郊更無別築之義又後魏即位登朱雀觀周帝初立受朝於路門雖自我作古皆非禮也今即府為壇恐招後誚議者從之二月甲子椿等乘象輅備鹵簿持節率百官至門下奉策入次百官文武朝服立于門南北面高祖冠遠遊冠府僚陪列詔室入白禮曹導高祖府僚從出大門東廂西向椿奉策書煚奉璽紱出次節導而進高祖揖之入門而左椿等入門而右百官隨入庭中椿南向讀冊書畢進授高祖高祖北面再拜辭不奉詔上柱國李穆進喻朝旨又與百官勸進高祖不納椿等又奉策書進而敦勸高祖再拜俯受策以授高熲受璽以授虞慶則退就東階位使者與百官皆北面再拜搢笏三稱萬歲有司請備法駕高祖不許改服紗帽黃袍入幸臨光殿就閤內服袞冕乘小輿出自西序如元會儀禮部尚書以案承符命及祥瑞牒進東階下納言跪御前以聞內史令奉宣詔大赦改元曰開皇是日命有司奉冊祀于南郊後齊將崇皇太后則太尉以玉帛告圓丘方澤以幣告廟皇帝乃臨軒命太保持節太尉副之設九儐命使者受璽綬冊及節詣西上閤其日昭陽殿文物具陳臨軒訖使者就位持節及璽綬稱詔二侍中拜進受節及冊璽綬以付小黃門黃門以詣閤皇太后服褘衣處昭陽殿公主及命婦陪列於殿皆拜小黃門以節綬入女侍中受以進皇太后皇太后興受以授左右復坐反節於使者使者受節出冊皇后如太后之禮後齊冊皇太子則皇帝臨軒司徒為使司空副之太子服遠遊冠入至位使者入奉冊讀訖皇太子跪受冊於使以授中庶子又受璽綬於尚書以授庶子稽首以出就冊則使者持節至東宮宮臣內外官定列皇太子階東西面若幼則太師抱之主衣二人奉空頂幘服從以受冊明日拜章表於東宮殿庭中庶子中舍人乘軺車奉章詣朝堂謝擇日齋於崇正殿服冕乘石山安車謁廟擇日羣臣上禮又擇日會明日三品以上牋賀冊諸王以臨軒日上水一刻吏部令史乘馬齎召版詣王第王乘高車鹵簿至東掖門止乘軺車既入至席尚書讀冊訖以授王又授章綬事畢乘軺車入鹵簿乘高車詣閶闔門伏闕表謝報訖拜廟還第就第則鴻臚卿持節吏部尚書授冊侍御史授節使者受而出乘軺車持節詣王第入就西階東面王入立於東階西面使者讀冊博士讀版王俛伏興進受冊章綬茅土俛伏三稽首還本位謝如上儀在州鎮則使者受節冊乘軺車至州如王第諸王三公儀同尚書令五等開國太妃妃公主恭拜冊軸一枚長二尺以白練衣之用竹簡十二枚六枚與軸等六枚長尺二寸文出集書書皆篆字哀冊贈冊亦同諸王五等開國及鄉男恭拜以其封國所在方取社壇方面土包以白茅內青箱中函方五寸以青塗飾封授之以為社隋臨軒冊命三師諸王三公並陳車輅餘則否百司定列內史令讀冊訖受冊者拜受出又引次受冊者如上儀若冊開國郊社令奉茅土立於仗南西面每受冊訖授茅土焉後齊皇帝加元服以玉帛告圓丘方澤以幣告廟擇日臨軒中嚴羣官位定皇帝著空頂介幘以出太尉盥訖升脫空頂幘以黑介幘奉加訖太尉進太保之右北面讀祝訖太保加冕侍中繫玄紘脫絳紗袍加袞服事畢太保上壽羣官三稱萬歲皇帝入溫室移御坐會而不上壽後日文武羣官朝服上禮酒十二鍾米十二囊牛十二頭又擇日親拜圓丘方澤謁廟皇太子冠則太尉以制幣告七廟擇日臨軒有司供帳於崇正殿中嚴皇太子空頂幘公服出立東階之南西面使者入立西階之南東面皇太子受詔訖入室盥櫛出南面使者進揖詣冠席西面坐光祿卿盥訖詣太子前疏櫛使者又盥奉進賢三梁冠至太子前東面祝脫空頂幘加冠太子興入室更衣出又南面就席光祿卿盥櫛使者又盥祝脫三梁冠加遠遊冠太子又入室更衣設席中楹之西使者揖就席南面光祿卿洗爵酌醴使者詣席前北面祝太子拜受醴即席坐祭之啐之奠爵降階復本位西面三師三少及在位羣官拜事訖又擇日會宮臣又擇日謁廟隋皇太子將冠前一日皇帝齋於大興殿皇太子與賓贊及預從官齋於正寢其日質明有司告廟各設筵於阼階皇帝袞冕入拜即御座賓揖皇太子進升筵西向坐贊冠者坐櫛設纚賓盥訖進加緇布冠贊冠進設頍纓賓揖皇太子適東序衣玄衣素裳以出贊冠者又坐櫛賓進加遠遊冠改服訖賓又受冕太子適東序改服以出賓揖皇太子南面立賓進受醴進筵前北面立祝皇太子拜受觶賓復位東面答拜贊冠者奉饌於筵前皇太子祭奠禮畢降筵進當御東面拜納言承詔詣太子戒訖太子拜贊冠者引太子降自西階賓少進字之贊冠者引皇太子進立於庭東面諸親拜訖贊冠者拜太子皆答拜與賓贊俱復位納言承詔降令有司致禮賓贊又拜皇帝降復阼階拜皇太子已下皆拜皇帝出更衣還宮皇太子從至闕因入見皇后拜而還後齊皇帝納后之禮納采問名納徵訖告圓丘方澤及廟如加元服是日皇帝臨軒命太尉為使司徒副之持節詣皇后行宮東向奉璽綬冊以授中常侍皇后受冊於行殿使者出與公卿以下皆拜有司備迎禮太保太尉受詔而行主人公服迎拜於門使者入升自賓階東面主人升自阼階西面禮物陳於庭設席於兩楹間童子以璽書版升主人跪受送使者拜于大門之外有司先於昭陽殿兩楹間供帳為同牢之具皇后服大嚴繡衣帶綬珮加幜女長御引出升畫輪四望車女侍中負璽陪乘鹵簿如大駕皇帝服袞冕出升御坐皇后入門大鹵簿住門外小鹵簿入到東上閤施步鄣降車席道以入昭陽殿前至席位姆去幜皇后先拜後起皇帝後拜先起帝升自西階詣同牢坐與皇后俱坐各三飯訖又各酳二爵一卺奏禮畢皇后興南面立皇帝御太極殿王公已下拜皇帝興入明日后展衣於昭陽殿拜表謝又明日以榛栗棗脩見皇太后於昭陽殿擇日羣官上禮又擇日謁廟皇帝使太尉先以太牢告而後徧見羣廟皇太子納妃禮皇帝遣使納采有司備禮物會畢使者受詔而行主人迎于大門外禮畢會於聽事其次問名納吉並如納采納徵則使司徒及尚書令為使備禮物而行請期則以太常宗正卿為使如納采親迎則太尉為使三日妃朝皇帝於昭陽殿又朝皇后於宣光殿擇日羣官上禮他日妃還又他日皇太子拜閤隋皇太子納妃禮皇帝臨軒使者受詔而行主人俟於廟使者執雁主人迎拜於大門之東使者入升自西階立於楹間南面納采訖乃行問名儀事畢主人請致禮於從者禮有幣馬其次擇日納吉如納采又擇日以玉帛乘馬納徵又擇日告期又擇日命有司以特牲告廟冊妃皇太子將親迎皇帝臨軒醮而誡曰往迎爾相承我宗事勗帥以敬對曰謹奉詔既受命羽儀而行主人几筵於廟妃服褕翟立於東房主人迎於門外西面拜皇太子答拜主人揖皇太子先入主人升立於阼階西面皇太子升進當房戶前北面跪奠雁俛伏興拜降出妃父少進西面戒之母於西階上施衿結帨及門內施鞶申之出門妃升輅乘以几姆加幜皇太子乃御輪三周御者代之皇太子出大門乘輅羽儀還宮妃三日雞鳴夙興以朝奠笲於皇帝皇帝撫之又奠笲於皇后皇后撫之席於戶牖間妃立於席西祭奠而出後齊娉禮一曰納采二曰問名三曰納吉四曰納徵五曰請期六曰親迎皆用羔羊一口雁一隻酒黍稷稻米各一斛自皇子王已下至於九品皆同流外及庶人則減其半納徵皇子王用玄三匹纁二匹束帛十匹大璋一第一品已下至從三品用璧玉四品已下皆無獸皮二第一品已下至從五品用豹皮二六品已下至從九品用鹿皮錦綵六十匹一品錦綵四十匹二品三十匹三品二十匹四品雜綵十六匹五品十匹六品七品五匹絹二百匹一品一百四十匹二品一百二十匹三品一百匹四品八十匹五品六十匹六品七品五十匹八品九品三十匹羔羊一口羊四口犢二頭酒黍稷稻米各十斛一品至三品減羊二口酒黍稷稻米各減六斛四品五品減一犢酒黍稷稻米又減二斛六品已下無犢酒黍稷稻米各一斛諸王之子已封未封禮皆同第一品新婚從車皇子百乘一品五十乘第二第三品三十乘第四第五品二十乘第六第七品十乘八品達於庶人五乘各依其秩之飾梁大同五年臨城公婚公夫人於皇太子妃為姑姪進見之制議者互有不同令曰纁雁之儀既稱合於二姓酒食之會亦有姻不失親若使榛栗腶脩贄饋必舉副筓編珈盛飾斯備不應婦見之禮獨以親闕頃者敬進酏醴已傳婦事之則而奉盤沃盥不行侯服之家是知繁省不同質文異世臨城公夫人於妃既是姑姪宜停省後齊將講於天子先定經於孔父廟置執經一人侍講二人執讀一人擿句二人錄義六人奉經二人講之旦皇帝服通天冠玄紗袍乘象輅至學坐廟堂上講訖還便殿改服絳紗袍乘象輅還宮講畢以一太牢釋奠孔父配以顏回列軒懸樂六佾舞行三獻禮畢皇帝服通天冠絳紗袍升阼即坐宴畢還宮皇太子每通一經亦釋奠乘石山安車三師乘車在前三少從後而至學焉梁天監八年皇太子釋奠周捨議以為釋奠仍會既惟大禮請依東宮元會太子著絳紗襮樂用軒懸預升殿坐者皆服朱衣帝從之又有司以為禮云凡為人子者升降不由阼階案今學堂凡有三階愚謂客若降等則從主人之階今先師在堂義所尊敬太子宜登阼階以明從師之義若釋奠事訖宴會之時無復先師之敬太子升堂則宜從西階以明不由阼義吏部郎徐勉議鄭玄云由命士以上父子異宮宮室既異無不由阼階之禮請釋奠及宴會太子升堂並宜由東階若輿駕幸學自然中陛又檢東宮元會儀注太子升崇正殿不欲東西階責東宮典儀列云太子元會升自西階此則相承為謬請自今東宮大公事太子升崇正殿並由阼階其預會賓客依舊西階大同七年皇太子表其子寧國臨城公入學時議者以與太子有齒冑之義疑之侍中尚書令臣敬容尚書僕射臣纘尚書臣僧旻臣之遴臣筠等以為參點並事宣尼回路同諮泗水鄒魯稱盛洙汶無譏師道既光得一資敬無虧亞貳況於兩公而云不可制曰可後齊制新立學必釋奠禮先聖先師每歲春秋二仲常行其禮每月旦祭酒領博士已下及國子諸學生已上太學四門博士升堂助教已下太學諸生階下拜孔揖顏日出行事而不至者記之為一負雨霑服則止學生每十日給假皆以丙日放之郡學則於坊內立孔顏廟博士已下亦每月朝云隋制國子寺每歲以四仲月上丁釋奠於先聖先師年別一行鄉飲酒禮州郡學則以春秋仲月釋奠州郡縣亦每年於學一行鄉飲酒禮學生皆乙日試書丙日給假焉梁元會之禮未明庭燎設文物充庭臺門闢禁衞皆嚴有司各從其事太階東置白獸樽羣臣及諸蕃客並集各從其班而拜侍中奏中嚴王公卿尹各執珪璧入拜侍中乃奏外辦皇帝服袞冕乘輿以出侍中扶左常侍扶右黃門侍郎一人執曲直華蓋從至階降輿納舄升坐有司御前施奉珪藉王公以下至阼階脫舄劍升殿席南奉贄珪璧畢下殿納舄佩劍詣本位主客即徙珪璧於東廂帝興入徙御坐於西壁下東向設皇太子王公已下位又奏中嚴皇帝服通天冠升御坐王公上壽禮畢食食畢樂伎奏太官進御酒主書賦黃甘逮二品已上尚書騶騎引計吏郡國各一人皆跪受詔侍中讀五條詔計吏每應諾訖令陳便宜者聽詣白獸樽以次還坐宴樂罷皇帝乘輿以入皇太子朝則遠遊冠服乘金輅鹵簿以行預會則劍履升坐會訖先興天監六年詔曰頃代以來元日朝畢次會羣臣則移就西壁下東向坐求之古義王者讌萬國唯應南面何更居東面於是御坐南向以西方為上皇太子以下在北壁坐者悉西邊東向尚書令以下在南方坐者悉東邊西向舊元日御坐東向酒壺在東壁下御坐既南向乃詔壺於南蘭下又詔元日受五等贄珪璧並量付所司周捨案周禮冢宰大朝覲贊玉幣尚書古之冢宰頃王者不親撫玉則不復須冢宰贊助尋尚書主客曹郎既冢宰隸職今元日五等奠玉既竟請以主客郎受鄭玄注覲禮云既受之後出付玉人於外漢時少府職掌珪璧請主客受玉付少府掌帝從之又尚書僕射沈約議正會儀注御出乘輿至太極殿前納舄升階尋路寢之設本是人君居處不容自敬宮室案漢氏則乘小車升殿請自今元正及大公事御宜乘小輿至太極階仍乘版輿升殿制可陳制先元會十日百官並習儀注令僕已下悉公服監之設庭燎街闕城上殿前皆嚴兵百官各設部位而朝宮人皆於東堂隔綺疏而觀宮門既無籍外人但絳衣者亦得入觀是日上事人發白獸樽自餘亦多依梁禮云後齊正日侍中宣詔慰勞州郡國使詔牘長一尺三寸廣一尺雌黃塗飾上寫詔書三計會日侍中依儀勞郡國計吏問刺史太守安不及穀價麥苗善惡人間疾苦又班五條詔書於諸州郡國使人寫以詔牘一枚長二尺五寸廣一尺三寸亦以雌黃塗飾上寫詔書正會日依儀宣示使人歸以告刺史二千石一曰政在正身在愛人去殘賊擇良吏正決獄平徭賦二曰人生在勤勤則不匱其勸率田桑無或煩擾三曰六極之人務加寬養必使生有以自救沒有以自給四曰長吏華浮奉客以求小譽逐末捨本政之所疾宜謹察之五曰人事意氣干亂奉公外內溷淆綱紀不設所宜糾劾正會日侍中黃門宣詔勞諸郡上計勞訖付紙遣陳土宜字有脫誤者呼起席後立書迹濫劣者飲墨水一升文理孟浪無可取者奪容刀及席既而本曹郎中考其文迹才辭可取者錄牒吏部簡同流外三品叙元正大饗百官一品已下流外九品已上預會一品已下正三品已上開國公侯伯散品公侯及特命之官下代刺史並升殿從三品已下從九品以上及奉正使人比流官者在階下勳品已下端門外隋制正旦及冬至文物充庭皇帝出西房即御座皇太子鹵簿至顯陽門外入賀復詣皇后御殿拜賀訖還宮皇太子朝訖羣官客使入就位再拜上公一人詣西階解劍升賀降階帶劍復位而拜有司奏諸州表羣官在位者又拜而出皇帝入東房有司奏行事訖乃出西房坐定羣官入就位上壽訖上下俱拜皇帝舉酒上下舞蹈三稱萬歲皇太子預會則設坐於御東南西向羣臣上壽畢入解劍以升會訖先興後齊元日中宮朝會陳樂皇后褘衣乘輿以出於昭陽殿坐定內外命婦拜皇后興妃主皆跪皇后坐妃主皆起長公主一人前跪拜賀禮畢皇后入室乃移幄坐於西廂皇后改服褕狄以出坐定公主一人上壽訖就坐御酒食賜爵並如外朝會隋儀如後齊制而又有皇后受羣臣賀禮則皇后御坐而內侍受羣臣拜以入承令而山羣臣拜而罷後齊皇太子月五朝未明二刻乘小輿出為三師降至承華門升石山安車三師軺車在前三少在後自雲龍門入皇帝御殿前設拜席位至柏閣齋帥引洗馬中庶子從至殿前席南北面再拜天保元年皇太子監國在西林園冬會羣議皆東面二年於北城第內冬會又議東面吏部郎陸卬疑非禮魏收改為西面邢子才議欲依前曰凡禮有同者不可令異詩說天子至於大夫皆乘四馬況以方面之少何可皆不同乎若太子定西面者王公卿大夫士復何面邪南面人君正位今一官之長無不南面太子聽政亦南面坐議者言皆晉舊事太子在東宮西面為避尊位非為向臺殿也子才以為東晉博議依漢魏之舊太子普臣四海不以為嫌又何疑於東面禮世子絕旁親世子冠於阼冢子生接以太牢漢元著令太子絕馳道此皆禮同於君又晉王公世子攝命臨國乘七旒安車駕用三馬禮同三公近宋太子乘象輅皆有同處不以為嫌況東面者君臣通禮獨何為避明為向臺所以然也近皇太子在西林園在於殿猶且東面於北城非宮殿之處更不得邪諸人以東面為尊宴會須避案燕禮燕義君位在東賓位則在西君位在阼階故有武王踐阼篇不在西也禮乘君之車不敢曠左君在惡空其位左亦在東不在西也君在阼夫人在房鄭注人君尊東也前代及今皇帝宴會接客亦東堂西面若以東面為貴皇太子以儲后之禮監國之重別第宴臣賓自得申其正位禮者皆東宮臣屬公卿接宴觀禮而已若以西面為卑實是君之正位太公不肯北面說丹書西面則道之西面乃尊也君位南面有東有西何可皆避且事雖少異有可相比者周公臣也太子子也周公為冢宰太子為儲貳明堂尊於別第朝諸侯重於宴臣賓南面貴於東面臣疎於子冢宰輕於儲貳周公攝政得在明堂南面朝諸侯今太子監國不得於別第異宮東面宴客情所未安且君行以太子監國君宴不以公卿為賓明父子無嫌君臣有嫌案儀注親王受詔冠婚皇子皇女皆東面今不約王公南面而獨約太子何所取邪議者南尊改就西面轉君位更非合禮方面既少難為節文東西二面君臣通用太子宜然於禮為允魏收議云去天保初皇太子監國冬會羣官於西園都亭坐從東面義取於向中宮臺殿故也二年於宮冬會坐乃東面收竊以為疑前者遂有別議議者同之邢尚書以前定東面之議復申本懷此乃國之大禮無容不盡所見收以為太子東宮位在於震長子之義也案易八卦正位向中皇太子今居北城於宮殿為東北南面而坐於義為背也前者立議據東宮為本又案東宮舊事太子宴會多以西面為禮此又成證非徒言也不言太子常無東南二面之坐但用之有所至如西園東面所不疑也未知君臣車服有同異之議何為而發就如所云但知禮有同者不可令異不知禮有異者不可令同苟別君臣同異之禮恐重紙累札書不盡也子才竟執東面收執西面援引經據大相往復其後竟從西面為定時議又疑宮吏之姓與太子名同子才又謂曰案曲禮大夫士之子不與世子同名鄭注云若先之生亦不改漢法天子登位布名於天下四海之內無不咸避案春秋經衞石惡出奔晉在衞侯衎卒之前衎卒其子惡始立明石惡於長子同名諸侯長子在一國之內與皇太子於天子禮亦不異鄭言先生不改蓋以此義衞石惡宋向戌皆與君同名春秋不譏皇太子雖有儲貳之重未為海內所避何容便改人姓然事有消息不得皆同於古宮吏至微而有所犯朝夕從事亦是難安宜聽出宮尚書更補他職制曰可後周制正之二日皇太子南面列軒懸宮官朝賀及開皇初皇太子勇準故事張樂受朝宮臣及京官北面稱慶高祖誚之是後定儀注西面而坐唯宮臣稱慶臺官不復總集煬帝之為太子奏降章服宮官請不稱臣詔許之後齊立春日皇帝服通天冠青介幘青紗袍佩蒼玉青帶青袴青襪舄而受朝於太極殿尚書令等坐定三公郎中詣席跪讀時令訖典御酌酒卮置郎中前郎中拜還席伏飲禮成而出立夏季夏立秋讀令則施御座於中楹南向立冬如立春於西廂東向各以其時之色服儀並如春禮後齊每策秀孝中書策秀才集書策考貢士考功郎中策廉良皇帝常服乘輿出坐於朝堂中楹秀孝各以班草對其有脫誤書濫孟浪者起立席後飲墨水脫容刀後齊宴宗室禮皇帝常服別殿西廂東向七廟子孫皆公服無官者單衣介幘集神武門宗室尊卑次于殿庭七十者二人扶拜八十者扶而不拜升殿就位皇帝興宗室伏皇帝坐乃興拜而坐尊者南面卑者北面皆以西為上八十者一坐再至進絲竹之樂三爵畢宗室避席待詔而後復位乃行無算爵正晦汎舟則皇帝乘輿鼓吹至行殿升御坐乘版輿以與王公登舟置酒非預汎者坐於便幕仲春令辰陳養老禮先一日三老五更齋於國學皇帝進賢冠玄紗袍至璧雍入總章堂列宮懸王公已下及國老庶老各定位司徒以羽儀武賁安車迎三老五更于國學並進賢冠玄服黑舄素帶國子生黑介幘青單衣乘馬從以至皇帝釋劍執珽迎於門內三老至門五更去門十步則降車以入皇帝拜三老五更攝齊答拜皇帝揖進三老在前五更在後升自右階就筵三老坐五更立皇帝升堂北面公卿升自左階北面三公授几杖卿正履國老庶老各就位皇帝拜三老羣臣皆拜不拜五更乃坐皇帝西向肅拜五更進珍羞酒食親袒割執醬以饋執爵以酳以次進五更又設酒酏於國老庶老皇帝升御坐三老乃論五孝六順典訓大綱皇帝虛躬請受禮畢而還又都下及外州人年七十已上賜鳩杖黃帽有勑即給不為常也後周保定三年陳養老之禮以太傅燕國公于謹為三老有司具禮擇日高祖幸太學以食之事見謹傳

body:
  text: 隋書卷四十五列傳第十文四子高祖五男皆文獻皇后之所生也長曰房陵王勇次煬帝次秦孝王俊次庶人秀次庶人諒房陵王勇字睍地伐高祖長子也周世以太祖軍功封博平侯及高祖輔政立為世子拜大將軍左司衛封長寧郡公出為洛州總管東京小冢宰總統舊齊之地後徵還京師進位上柱國大司馬領內史御正諸禁衛皆屬焉高祖受禪立為皇太子軍國政事及尚書奏死罪已下皆令勇參決之上以山東民多流冗遣使按檢又欲徙民北實邊塞勇上書諫曰竊以導俗當漸非可頓革戀土懷舊民之本情波迸流離蓋不獲已有齊之末主暗時昏周平東夏繼以威虐民不堪命致有逃亡非厭家鄉願為羈旅加以去年三方逆亂賴陛下仁聖區宇肅清鋒刃雖屏瘡痍未復若假以數歲沐浴皇風逃竄之徒自然歸本雖北夷猖獗嘗犯邊烽今城鎮峻峙所在嚴固何待遷配以致勞擾臣以庸虛謬當儲二寸誠管見輒以塵聞上覽而嘉之遂寢其事是後時政不便多所損益上每納之上嘗從容謂羣臣曰前世皇王溺於嬖幸廢立之所由生朕傍無姬侍五子同母可謂真兄弟也豈若前代多諸內寵孽子忿諍為亡國之道邪勇頗好學解屬詞賦性寬仁和厚率意任情無矯飾之行引明克讓姚察陸開明等為之賓友勇嘗文飾蜀鎧上見而不悅恐致奢侈之漸因而誡之曰我聞天道無親唯德是與歷觀前代帝王未有奢華而得長久者汝當儲后若不上稱天心下合人意何以承宗廟之重居兆民之上吾昔日衣服各留一物時復看之以自警戒今以刀子賜汝宜識我心其後經冬至百官朝勇勇張樂受賀高祖知之問朝臣曰近聞至節內外百官相率朝東宮是何禮也太常少卿辛亶對曰於東宮是賀不得言朝高祖曰改節稱賀正可三數十人逐情各去何因有司徵召一時普集太子法服設樂以待之東宮如此殊乖禮制於是下詔曰禮有等差君臣不雜爰自近代聖教漸虧俯仰逐情因循成俗皇太子雖居上嗣義兼臣子而諸方嶽牧正冬朝賀任土作貢別上東宮事非典則宜悉停斷自此恩寵始衰漸生疑阻時高祖令選宗衛侍官以入上臺宿衛高熲奏稱若盡取強者恐東宮宿衛太劣高祖作色曰我有時行動宿衛須得雄毅太子育德東宮左右何須強武此極敝法甚非我意如我商量於交番之日分向東宮上下團伍不別豈非好事我熟見前代公不須仍踵舊風蓋疑高熲男尚勇女形於此言以防之也勇多內寵昭訓雲氏尤稱嬖幸禮匹於嫡勇妃元氏無寵嘗遇心疾二日而薨獻皇后意有他故甚責望勇自是雲昭訓專擅內政后彌不平頗遣人伺察求勇罪過晉王知之彌自矯飾姬妾但備員數唯共蕭妃居處皇后由是薄勇愈稱晉王德行其後晉王來朝車馬侍從皆為儉素敬接朝臣禮極卑屈聲名籍甚冠於諸王臨還揚州入內辭皇后因進言曰臣鎮守有限方違顏色臣子之戀實結于心一辭階闥無由侍奉拜見之期杳然未日因哽咽流涕伏不能興皇后亦曰汝在方鎮我又年老今者之別有切常離又泫然泣下相對歔欷王曰臣性識愚下常守平生昆弟之意不知何罪失愛東宮蓄盛怒欲加屠陷每恐讒譖生於投杼鴆毒遇於杯勺是用勤憂積念懼履危亡皇后忿然曰睍地伐漸不可耐我為伊索得元家女望隆基業竟不聞作夫妻專寵阿雲使有如許豚犬前新婦本無病痛忽爾暴亡遣人投藥致此夭逝事已如是我亦不能窮治何因復於汝處發如此意我在尚爾我死後當魚肉汝乎每思東宮竟無正嫡至尊千秋萬歲之後遣汝等兄弟向阿雲兒前再拜問訊此是幾許大苦痛邪晉王又拜嗚咽不能止皇后亦悲不自勝此別之後知皇后意移始構奪宗之計因引張衡定策遣褒公宇文述深交楊約令喻旨於越國公素具言皇后此語素瞿然曰但不知皇后如何必如所言吾又何為者後數日素入侍宴微稱晉王孝悌恭儉有類至尊用此揣皇后意皇后泣曰公言是也我兒大孝順每聞至尊及我遣內使到必迎於境首言及違離未嘗不泣又其新婦亦大可憐我使婢去常與之同寢共食豈若睍地伐共阿雲相對而坐終日酣宴昵近小人疑阻骨肉我所以益憐阿者常恐暗地殺之素既知意因盛言太子不才皇后遂遺素金始有廢立之意勇頗知其謀憂懼計無所出聞新豐人王輔賢能占候召而問之輔賢曰白虹貫東宮門太白襲月皇太子廢退之象也以銅鐵五兵造諸厭勝又於後園之內作庶人村屋宇卑陋太子時於中寢息布衣草褥冀以當之高祖知其不安在仁壽宮使楊素觀勇素至東宮偃息未入勇束帶待之故久不進以激怒勇勇銜之形於言色素還言勇怨望恐有他變願深防察高祖聞素譖毀甚疑之皇后又遣人伺覘東宮纖介事皆聞奏因加媒糵構成其罪高祖惑於邪議遂疏忌勇乃於玄武門達至德門量置候人以伺動靜皆隨事奏聞又東宮宿衛之人侍官已上名籍悉令屬諸衛府有健兒者咸屏去之晉王又令段達私於東宮幸臣姬威遺以財貨令取太子消息密告楊素於是內外喧謗過失日聞段達脅姬威曰東宮罪過主上皆知之矣已奉密詔定當廢立君能告之則大富貴威遂許諾九月壬子車駕至自仁壽宮翌日御大興殿謂侍臣曰我新還京師應開懷歡樂不知何意翻邑然愁苦吏部尚書牛弘對曰由臣等不稱職故至尊憂勞高祖既數聞讒譖疑朝臣皆具委故有斯問冀聞太子之愆弘為此對大乖本旨高祖因作色謂東宮官屬曰仁壽宮去此不遠而令我每還京師嚴備仗衛如入敵國我為患利不脫衣臥昨夜欲得近廁故在後房恐有警急還移就前殿豈非爾輩欲壞我國家邪於是執唐令則等數人付所司訊鞫令楊素陳東宮事狀以告近臣素顯言之曰臣奉勑向京令皇太子檢校劉居士餘黨太子奉詔乃作色奮厲骨肉飛騰語臣云居士黨盡伏法遣我何處窮討爾作右僕射委寄不輕自檢校之何關我事又云若大事不遂我先被誅今作天子竟乃令我不如諸弟一事以上不得自由因長歎回視云我大覺身妨高祖曰此兒不堪承嗣久矣皇后勸我廢之我以布素時生復是長子望其漸改隱忍至今勇昔從南兗州來語衛王云阿娘不與我一好婦女亦是可恨因指皇后侍兒曰是皆我物此言幾許異事其婦初亡即以斗帳安餘老嫗新婦初亡我深疑使馬嗣明藥殺我曾責之便懟曰會殺元孝矩此欲害我而遷怒耳初長寧誕育朕與皇后共抱養之自懷彼此連遣來索且雲定興女在外私合而生想此由來何必是其體胤昔晉太子取屠家女其兒即好屠割今儻非類便亂宗社又劉金驎諂佞人也呼定興作親家翁定興愚人受其此語我前解金驎者為其此事勇嘗引曹妙達共定興女同宴妙達在外說云我今得勸妃酒直以其諸子偏庶畏人不服故逆縱之欲收天下之望耳我雖德慚堯舜終不以萬姓付不肖子也我畏其加害如防大敵今欲廢之以安天下左衛大將軍五原公元旻諫曰廢立大事天子無二言詔旨若行後悔無及讒言罔極惟陛下察之旻辭直爭強聲色俱厲上不答是時姬威又抗表告太子非法高祖謂威曰太子事跡宜皆盡言威對曰皇太子由來共臣語唯意在驕奢欲得從樊川以至于散關總規為苑兼云昔漢武帝將起上林苑東方朔諫之賜朔黃金百斤幾許可笑我實無金輒賜此等若有諫者正當斬之不過殺百許人自然永息前蘇孝慈解左衛率皇太子奮髯揚肘曰大丈夫會當有一日終不忘之決當快意又宮內所須尚書多執法不與便怒曰僕射以下吾會戮一二人使知慢我之禍又於苑內築一小城春夏秋冬作役不輟營起亭殿朝造夕改每云至尊嗔我多側庶高緯陳叔寶豈是孽子乎嘗令師姥卜吉凶語臣曰至尊忌在十八年此期促矣高祖泫然曰誰非父母生乃至於此我有舊使婦女令看東宮奏我云勿令廣平王至皇太子處東宮憎婦亦廣平教之元贊亦知其陰惡勸我於左藏之東加置兩隊初平陳後宮人好者悉配春坊如聞不知厭足於外更有求訪朕近覽齊書見高歡縱其兒子不勝忿憤安可效尤邪於是勇及諸子皆被禁錮部分收其黨與楊素舞文巧詆鍛鍊以成其獄勇由是遂敗居數日有司承素意奏言左衛元旻身備宿衛常曲事於勇情存附託在仁壽宮裴弘將勇書於朝堂與旻題封云勿令人見高祖曰朕在仁壽宮有纖小事東宮必知疾於驛馬怪之甚久豈非此徒耶遣武士執旻及弘付法治其罪先是勇嘗從仁壽宮參起居還塗中見一枯槐根幹蟠錯大且五六圍顧左右曰此堪作何器用或對曰古槐尤堪取火于時衛士皆佩火燧勇因令匠者造數千枚欲以分賜左右至是獲於庫又藥藏局貯艾數斛亦搜得之大將為怪以問姬威威曰太子此意別有所在比令長寧王已下詣仁壽宮還每嘗急行一宿便至飼馬千匹云徑往捉城門自然餓死素以威言詰勇勇不服曰竊聞公家馬數萬匹勇忝備位太子有馬千匹乃是反乎素又發泄東宮服玩似加雕飾者悉陳之於庭以示文武羣官為太子之罪高祖遣將諸物示勇以誚詰之皇后又責之罪高祖使使責問勇勇不服太史令袁充進曰臣觀天文皇太子當廢上曰玄象久見矣羣臣無敢言者於是使人召勇勇見使者驚曰得無殺我耶高祖戎服陳兵御武德殿集百官立於東面諸親立於西面引勇及諸子列於殿庭命薛道衡宣廢勇之詔曰太子之位實為國本苟非其人不可虛立自古儲副或有不才長惡不悛仍令守器皆由情溺寵愛失於至理致使宗社傾亡蒼生塗地由此言之天下安危繫乎上嗣大業傳世豈不重哉皇太子勇地則居長情所鍾愛初登大位即建春宮冀德業日新隆茲負荷而性識庸暗仁孝無聞昵近小人委任姦佞前後愆釁難以具紀但百姓者天之百姓朕恭天命屬當安育雖欲愛子實畏上靈豈敢以不肖之子而亂天下勇及其男女為王公主者並可廢為庶人顧惟兆庶事不獲已興言及此良深愧歎令薛道衡謂勇曰爾之罪惡人神所棄欲求不廢其可得耶勇再拜而言曰臣合尸之都市為將來鑒誡幸蒙哀憐得全性命言畢泣下流襟既而舞蹈而去左右莫不憫默又下詔曰自古以來朝危國亂皆邪臣佞媚凶黨扇惑致使禍及宗社毒流兆庶若不標明典憲何以肅清天下左衛大將軍五原郡公元旻任掌兵衛委以心膂陪侍左右恩寵隆渥乃包藏姦伏離間君親崇長厲階最為魁首太子左庶子唐令則策名儲二位長宮僚諂曲取容音技自進躬執樂器親教內人贊成驕侈導引非法太子家令鄒文騰專行左道偏被親昵心腹委付巨細關知占問國家希覬災禍左衛率司馬夏侯福內事諂諛外作威勢凌侮上下褻濁宮闈典膳監元淹謬陳愛憎開示怨隙妄起訕謗潛行離阻進引妖巫營事厭禱前吏部侍郎蕭子寶往居省閣舊非宮臣禀性浮躁用懷輕險進畫姦謀要射榮利經營間構開造禍端前主璽下士何竦假託玄象妄說妖怪志圖禍亂心在速發兼制奇器異服皆竦規摹增長驕奢糜費百姓凡此七人為害乃甚並處斬妻妾子孫皆悉沒官車騎將軍閻毗東郡公崔君綽游騎尉沈福寶瀛州民章仇太翼等四人所為之事皆是悖惡論其狀迹罪合極刑但朕情存好生未能盡戮可並特免死各決杖一百身及妻子資財田宅悉可沒官副將作大匠高龍義豫追番丁輒配東宮使役營造亭舍進入春坊率更令晉文建通直散騎侍郎判司農少卿事元衡料度之外私自出給虛破丁功擅割園地並處盡於是集羣官于廣陽門外宣詔以戮之廣平王雄答詔曰至尊為百姓割骨肉之恩廢黜無德實為大慶天下幸甚乃移勇於內史省立晉王廣為皇太子仍以勇付之復囚於東宮賜楊素物三千段元胄楊約並千段楊難敵五百段皆鞫勇之功賞也時文林郎楊孝政上書諫曰皇太子為小人所誤宜加訓誨不宜廢黜上怒撻其胸尋而貝州長史裴肅表稱庶人罪黜已久當克己自新請封一小國高祖知勇之黜也不允天下之情乃徵肅入朝具陳廢立之意時勇自以廢非其罪頻請見上面申寃屈而皇太子遏之不得聞奏勇於是升樹大叫聲聞於上冀得引見素因奏言勇情志昏亂為癲鬼所著不可復收上以為然卒不得見素誣陷經營構成其罪類皆如此高祖寢疾於仁壽宮徵皇太子入侍醫藥而姦亂宮闈事聞於高祖高祖抵牀曰枉廢我兒因遣追勇未及發使高祖暴崩祕不發喪遽收柳述元巖繫於大理獄僞為高祖勑書賜庶人死追封房陵王不為立嗣勇有十男雲昭訓生長寧王儼平原王裕安城王筠高良娣生安平王嶷襄城王恪王良媛生高陽王該建安王韶成姬生潁川王煚後宮生孝實孝範長寧王儼勇長子也誕乳之初以報高祖高祖曰此即皇太孫何乃生不得地雲定興奏曰天生龍種所以因雲而出時人以為敏對六歲封長寧郡王勇敗亦坐廢黜上表乞宿衛辭情哀切高祖覽而憫焉楊素進曰伏願聖心同於螫手不宜復留意煬帝踐極儼常從行卒於道實鴆之也諸弟分徙嶺外仍勑在所皆殺焉秦孝王俊字阿祗高祖第三子也開皇元年立為秦王二年春拜上柱國河南道行臺尚書令洛州刺史時年十二加右武衛大將軍領關東兵三年遷秦州總管隴右諸州盡隸焉俊仁恕慈愛崇敬佛道請為沙門上不許六年遷山南道行臺尚書令伐陳之役以為山南道行軍元帥督三十總管水陸十餘萬屯漢口為上流節度陳將周羅荀法尚等以徑兵數萬屯鸚鵡洲總管崔弘度請擊之俊慮殺傷不許羅亦相率而降於是遣使奉章詣闕垂泣謂使者曰謬當推轂愧無尺寸之功以此多慚耳上聞而善之授揚州總管四十四州諸軍事鎮廣陵歲餘轉並州總管二十四州諸軍事初頗有令問高祖聞而大悅下書奬勵焉其後俊漸奢侈違犯制度出錢求息民吏苦之上遣使按其事與相連坐者百餘人俊猶不悛於是盛治宮室窮極侈麗俊有巧思每親運斤斧工巧之器飾以珠玉為妃作七寶羃又為水殿香塗粉壁玉砌金階梁柱楣棟之間周以明鏡間以寶珠極榮飾之美每與賓客妓女絃歌於其上俊頗好內妃崔氏性妬甚不平之遂於瓜中進毒俊由是遇疾徵還京師上以其奢縱免官以王就第左武衛將軍劉升諫曰秦王非有他過但費官物營廨舍而已臣謂可容上曰法不可違升固諫上忿然作色升乃止其後楊素復進諫曰秦王之過不應至此願陛下詳之上曰我是五兒之父若如公意何不別制天子兒律以周公之為人尚誅管蔡我誠不及周公遠矣安能虧法乎卒不許俊疾篤未能起遣使奉表陳謝上謂其使曰我戮力關塞創茲大業作訓垂範庶臣下守之而不失汝為吾子而欲敗之不知何以責汝俊慚怖疾甚大都督皇甫統上表請復王官不許歲餘以疾篤復拜上柱國二十年六月薨於秦邸上哭之數聲而已俊所為侈麗之物悉命焚之勑送終之具務從儉約以為後法也王府僚佐請立碑上曰欲求名一卷史書足矣何用碑為若子孫不能保家徒與人作鎮石耳妃崔氏以毒王之故下詔廢絶賜死於其家子浩崔氏所生也庶子曰湛羣臣議曰春秋之義母以子貴子以母貴貴既如此罪則可知故漢時栗姬有罪其子便廢郭后被廢其子斯黜大既然矣小亦宜同今秦王二子母皆罪廢不合承嗣於是以秦國官為喪主俊長女永豐公主年十二遭父憂哀慕盡禮免喪遂絶魚肉每至忌日輒流涕不食有開府王延者性忠厚領親信兵十餘年俊甚禮之及俊有疾延在閣下衣不解帶俊薨勺飲不入口者數日羸頓骨立上聞而憫之賜以御藥授驃騎將軍典宿衛俊葬之日延號慟而絶上嗟異之令通事舍人弔祭焉詔葬延於俊墓側煬帝即位立浩為秦王以奉孝王嗣封湛為濟北侯後以浩為河陽都尉楊玄感作逆之際左翊衛大將軍宇文述勒兵討之至河陽修啓於浩浩復詣述營兵相往復有司劾浩以諸侯交通內臣竟坐廢免宇文化及殺逆之始立浩為帝化及敗於黎陽北走魏縣自僭僞號因而害之湛驍果有膽烈大業初為滎陽太守坐浩免亦為化及所害庶人秀高祖第四子也開皇元年立為越王未幾徙封於蜀拜柱國益州刺史總管二十四州諸軍事二年進位上柱國西南道行臺尚書令本官如故歲餘而罷十二年又為內史令右領軍大將軍尋復出鎮於蜀秀有膽氣容貌瓌偉美鬚髯多武藝甚為朝臣所憚上每謂獻皇后曰秀必以惡終我在當無慮至兄弟必反兵部侍郎元衡使於蜀秀深結於衡以左右為請既還京師請益左右上不許大將軍劉噲之討西爨也高祖令上開府楊武通將兵繼進秀使嬖人萬智光為武通行軍司馬上以秀任非其人譴責之因謂羣臣曰壞我法者必在子孫乎譬如猛獸物不能害反為毛間蟲所損食耳於是遂分秀所統秀漸奢侈違犯制度車馬被服擬於天子及太子勇以讒毀廢晉王廣為皇太子秀意甚不平皇太子恐秀終為後變陰令楊素求其罪而譖之仁壽二年徵還京師上見不與語明日使使切讓之秀謝曰忝荷國恩出臨藩嶽不能奉法罪當萬死皇太子及諸王流涕庭謝上曰頃者秦王糜費財物我以父道訓之今秀蠹害生民當以君道繩之於是付執法者開府慶整諫曰庶人勇既廢秦王已薨陛下兒子無多何至如是然蜀王性甚耿介今被重責恐不自全上大怒欲斷其舌因謂羣臣曰當斬秀於市以謝百姓乃令楊素蘇威牛弘柳述趙綽等推治之太子陰作偶人書上及漢王姓字縛手釘心令人埋之華山下令楊素發之又作檄文曰逆臣賊子專弄威柄陛下唯守虛器一無所知陳甲兵之盛云指期問罪置秀集中因以聞奏上曰天下寧有是耶於是廢為庶人幽內侍省不得與妻子相見令給獠婢二人驅使與相連坐者百餘人秀既幽逼憤悶不知所為乃上表曰臣以多幸聯慶皇枝蒙天慈鞠養九歲榮貴唯知富樂未嘗憂懼輕恣愚心陷茲刑網負深山嶽甘心九泉不謂天恩尚假餘漏至如今者方知愚心不可縱國法不可犯撫膺念咎自新莫及猶望分身竭命少答慈造但以靈祇不祐福祿消盡夫婦抱思不相勝致只恐長辭明世永歸泉壤伏願慈恩賜垂矜愍殘息未盡之間希與爪子相見請賜一穴令骸骨有所爪子即其愛子也上因下詔數其罪曰汝地居臣子情兼家國庸蜀要重委以鎮之汝乃干紀亂常懷惡樂禍睨二宮佇遲災釁容納不逞結構異端我有不和汝便覘候望我不起便有異心皇太子汝兄也次當建立汝假託妖言乃云不終其位妄稱鬼怪又道不得入宮自言骨相非人臣德業堪承重器妄道清城出聖欲以己當之詐稱益州龍見託言吉兆重述木易之姓更治成都之宮妄說禾乃之名以當八千之運橫生京師妖異以證父兄之災妄造蜀地徵祥以符己身之籙汝豈不欲得國家惡也天下亂也輒造白玉之珽又為白羽之箭文物服飾豈似有君鳩集左道符書厭鎮漢王於汝親則弟也乃畫其形像書其姓名縛手釘心枷鎖杻械仍云請西嶽華山慈父聖母神兵九億萬騎收楊諒魂神閉在華山下勿令散蕩我之於汝親則父也復云請西嶽華山慈父聖母賜為開化楊堅夫妻回心歡喜又畫我形像縛手撮頭仍云請西嶽神兵收楊堅魂神如此形狀我今不知楊諒楊堅是汝何親也苞藏凶慝圖謀不軌逆臣之迹也希父之災以為身幸賊子之心也懷非分之望肆毒心於兄悖弟之行也嫉妬於弟無惡不為無孔懷之情也違犯制度壞亂之極也多殺不辜豺狼之暴也剝削民庶酷虐之甚也唯求財貨市井之業也專事妖邪頑嚚之性也弗克負荷不材之器也凡此十者滅天理逆人倫汝皆為之不祥之甚也欲免禍患長守富貴其可得平後復聽與其子同處煬帝即位禁錮如初宇文化及之弒逆也欲立秀為帝羣議不許於是害之並其諸子庶人諒字德章一名傑開皇元年立為漢王十二年為雍州牧加上柱國右衛大將軍歲餘轉左衛大將軍十七年出為並州總管上幸溫湯而送之自山以東至于滄海南拒黃河五十二州盡隸焉特許以便宜不拘律令十八年起遼東之役以諒為行軍元帥率衆至遼水遇疾疫不利而還十九年突厥犯塞以諒為行軍元帥竟不臨戎高祖甚寵愛之諒自以所居天下精兵處以太子讒廢居常怏怏陰有異圖遂諷高祖云突厥方強太原即為重鎮宜修武備高祖從之於是大發工役繕治器械貯納於並州招傭亡命左右私人殆將數萬王頍者梁將王僧辨之子也少倜儻有奇略為諒咨議參軍蕭摩訶者陳氏舊將二人俱不得志每鬱鬱思亂並為諒所親善及蜀王以罪廢諒愈不自安會高祖崩徵之不赴遂發兵反總管司馬皇甫誕切諫諒怒收繫之王頍說諒曰王所部將吏家屬盡在關西若用此等即宜長驅深入直據京都所謂疾雷不及掩耳若但欲割據舊齊之地宜任東人諒不能專定乃兼用二策唱言曰楊素反將誅之聞喜人總管府兵曹裴文安說諒曰井陘以西是王掌握之內山東士馬亦為我有宜悉發之分遣羸兵屯守要路仍令隨方略地率其精鋭直入蒲津文安請為前鋒王以大軍繼後風行電擊頓於霸上咸陽以東可指麾而定京師震擾兵不暇集上下相疑羣情離駭我即陳兵號令誰敢不從旬日之間事可定矣諒大悅於是遣所署大將軍余公理出太谷以趣河陽大將軍綦良出滏口以趣黎陽大將軍劉建出井陘以略燕趙柱國喬鍾葵出雁門署文安為柱國紇單貴王聃大將軍茹茹天保侯莫陳惠直指京師未至蒲津百餘里諒忽改圖令紇單貴斷河橋守蒲州而召文安文安至曰兵機詭速本欲出其不意王既不行文安又退使彼計成大事去矣諒不對以王聃為蒲州刺史裴文安為晉州薛粹為絳州梁菩薩為潞州韋道正為韓州張伯英為澤州煬帝遣楊素率騎五千襲王聃紇單貴於蒲州破之於是率步騎四萬趣太原諒使趙子開守高壁楊素擊走之諒大懼拒素於蒿澤屬天大雨諒欲旋師王頍諫曰楊素懸軍士馬疲弊王以鋭卒親戎擊之其勢必舉今見敵而還示人以怯阻戰士之心益西軍之氣願王必勿還也諒不從退守清源素進擊之諒勒兵與官軍大戰死者萬八千人諒退保並州楊素進兵圍之諒窮蹙降於素百僚奏諒罪當死帝曰朕終鮮兄弟情不忍言欲屈法恕諒一死於是除名為民絶其屬籍竟以幽死子皓因而禁錮宇文化及弒逆之際遇害史臣曰高祖之子五人莫有終其天命異哉房陵資於骨肉之親篤以君臣之義經綸締構契闊夷險撫軍監國凡二十年雖三善未稱而視膳無闕恩寵既變讒言間之顧復之慈頓隔於人理父子之道遂滅於天性隋室將亡之效衆庶皆知之矣慎子有言曰一兔走街百人逐之積兔於市過者不顧豈其無欲哉分定故也房陵分定久矣高祖一朝易之開逆亂之源長覬覦之望又維城肇建崇其威重恃寵而驕厚自封植進之既踰制退之不以道俊以憂卒實此之由俄屬天步方艱讒人已勝尺布斗粟莫肯相容秀窺岷蜀之阻諒起晉陽之甲成茲亂常之釁蓋亦有以動之也棠棣之詩徒賦有鼻之封無期或幽囚於囹圄或顛殞於鴆毒本根既絶枝葉畢剪十有餘年宗社淪陷自古廢嫡立庶覆族傾宗者多矣考其亂亡之禍未若有隋之酷詩曰殷鑒不遠在夏后之世後之有國有家者可不深戒哉

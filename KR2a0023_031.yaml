body:
  text: 隋書卷三十一志第二十六地理下彭城郡魯郡琅邪郡海郡下邳郡江都郡鍾離郡淮南郡弋陽郡蘄春郡廬江郡同安郡歷陽郡丹陽郡宣城郡毗陵郡吳郡會稽郡餘杭郡新安郡東陽郡永嘉郡建安郡遂安郡鄱陽郡臨川郡廬陵郡南康郡宜春郡豫章郡南海郡龍川郡義安郡高涼郡信安郡永熙郡蒼梧郡始安郡永平郡鬱林郡合浦郡珠崖郡寧越郡交趾郡九真郡日南郡比景郡海陰郡林邑郡南郡夷陵郡竟陵郡沔陽郡沅陵郡武陵郡清江郡襄陽郡舂陵郡漢東郡安陸郡永安郡義陽郡九江郡江夏郡澧陽郡巴陵郡長沙郡衡山郡桂陽郡零陵郡熙平郡彭城郡舊置徐州後齊置東南道行臺後周立總管府開皇七年行臺廢大業四年府廢統縣十一戶一十三萬二百三十二彭城舊置郡後周併沛及南陽平二郡入開皇初郡廢大業初復置郡有呂梁山徐山蘄梁置蘄郡後齊置仁州又析置龍亢郡開皇初郡廢大業初州廢穀陽後齊置穀陽郡開皇初郡廢又有巳吾義城二縣後齊併以為臨淮縣大業初併入焉沛留後齊廢開皇十六年復有微山黃山豐蕭舊置沛郡後齊廢為承高縣開皇六年改為龍城十八年改為臨沛大業初改曰蕭有相山滕舊曰蕃置蕃郡後齊廢開皇十六年改曰滕縣蘭陵舊曰承置蘭陵郡開皇初郡廢十六年分承置鄫州及蘭陵縣大業初州廢又併蘭陵鄫城二縣入焉尋改承為蘭陵有抱犢山符離後齊置睢南郡開皇初郡廢有竹邑縣梁置睢州開皇三年州廢又廢竹邑入焉有女山定陶山方與後齊廢開皇十六年復魯郡舊兗州大業二年改為魯郡統縣十戶十二萬四千一十九瑕丘舊廢開皇十三年復帶郡任城舊置高平郡開皇初廢鄒有鄒山承匡山曲阜舊曰魯郡後齊改郡為任城開皇三年郡廢四年改縣曰汶陽十六年改名曲阜泗水開皇十六年置有陪尾山尼丘山防山有洙泗水平陸後齊曰樂平開皇十六年改焉龔丘後齊曰平原縣開皇十六年改焉梁父有龜山博城舊曰博置泰山郡後齊改郡曰東平又併博平牟入焉開皇初郡廢十六年改縣曰汶陽尋改曰博城有奉高縣開皇六年改曰岱山大業初州廢又廢岱山縣入焉有岱山玉符山嬴開皇十六年分置牟城縣大業初併入焉有艾山有淄水琅邪郡舊置北徐州後周改曰沂州統縣七戶六萬三千四百二十三臨沂舊曰即丘帶郡開皇初郡廢十六年分置臨沂大業初併即丘入焉有大祠山費顓臾舊曰南武陽開皇十八年改名焉又有南城縣後齊廢有開明山新泰後齊廢蒙陰縣入焉沂水舊置南青州及東安郡後周改州為莒州開皇初郡廢改縣曰東安十六年又改曰沂水大業初州廢東安後齊廢開皇十六年復有松山莒舊置東莞郡後齊廢後置義唐郡開皇初廢東海郡梁置南北二青州東魏改為海州統縣五戶二萬七千八百五十八朐山舊曰朐置琅邪郡後周改縣曰朐山郡曰朐山開皇初郡廢大業初復帶郡有朐山羽山東海舊置廣饒縣及東海郡後齊分廣饒置東海縣開皇初廢郡及東海縣仁壽元年改廣饒曰東海有謝祿山鬱林山漣水舊曰襄賁置東海郡東魏改曰海安開皇初郡廢縣又改焉沭陽梁置潼陽郡東魏改曰沭陽郡置縣曰懷文後周改縣曰沭陽開皇初郡廢懷仁梁置南北二青州東魏廢州立義唐郡及懷仁縣開皇初郡廢下邳郡後魏置南徐州梁改為東徐州東魏又改曰東楚州陳改為安州後周改為泗州統縣七戶五萬二千七十宿豫舊置宿豫郡開皇初郡廢大業初置下邳郡又梁置朝陽臨沭二郡後齊置晉寧郡尋並廢夏丘後齊置並置夏丘郡尋立潼州後周改州為宋州縣曰晉陵開皇初郡廢十八年州廢縣復曰夏丘又東魏置臨潼郡睢陵縣後齊改郡為潼郡又梁置潼州後齊改曰睢州尋廢亦入潼郡開皇初郡縣並廢徐城梁置高平郡東魏又併梁東平陽平清河歸義四郡為高平縣又併梁朱沛循儀安豐三郡置朱沛縣又有安遠郡後齊廢後周又併朱沛入高平開皇初郡廢十八年更名徐城淮陽梁置淮陽郡東魏併綏化呂梁二郡置綏化縣後周改縣為淮陽開皇初郡廢又有梁臨清天水浮陽三郡東魏併為甬城縣後齊改曰文城縣後周又改為臨清開皇三年省入焉下邳梁曰歸政置武州下邳郡魏改縣為下邳置郡不改改州曰東徐後周改州為邳州開皇初郡廢大業初州廢有嶧山磬石山良城梁置武安郡開皇初郡廢十一年縣更名曰良城有徐山郯舊置郡開皇初廢禹貢海岱及淮惟徐州彭城魯郡琅邪東海下邳得其地焉在於天文自奎五度至胃六度為降婁於辰在戌其在列國則楚宋及魯之交考其舊俗人頗勁悍輕剽其士子則挾任節氣好尚賓遊此蓋楚之風焉大抵徐兗同俗故其餘諸郡皆得齊魯之所尚莫不賤商賈務稼穡尊儒慕學得洙泗之俗焉江都郡梁置南兗州後齊改為東廣州陳復曰南兗後周改為吳州開皇九年改為揚州置總管府大業初府廢統縣十六戶十一萬五千五百二十四江陽舊曰廣陵後齊置廣陵江陽二郡開皇初郡廢十八年改縣為邗江大業初更名江陽有江都宮揚子宮有陵湖江都自梁及隋或廢或置海陵梁置海陵郡開皇初郡廢又併建陵縣入尋析置江浦縣大業初省入寧海開皇初併如臯縣入高郵梁析置竹塘三歸二縣及置廣業郡尋以有嘉禾為神農郡開皇初郡廢又併竹塘三歸臨澤三縣入焉安宜梁置陽平郡及東莞郡開皇初郡廢又廢石鱉縣入焉有白馬湖山陽舊置山陽郡開皇初郡廢十二年置楚州大業初州廢有後魏淮陰郡東魏改為淮州後齊併魯富陵立懷恩縣後周改曰壽張又僑立東平郡開皇元年改郡為淮陰幷立楚州尋廢郡更改縣曰淮陰大業初州廢縣併入焉盱眙舊魏置盱眙郡陳置北譙州尋省開皇初郡廢又併考城直瀆陽城三縣入有都梁山鹽城後齊置射陽郡陳改曰鹽城開皇初郡廢清流舊曰頓丘置新昌郡及南譙州開皇初改為滁州郡廢又廢樂鉅高塘二縣入頓丘改曰新昌十八年又改為清流大業初州廢有白禪山曲亭山全椒梁曰北譙置北譙郡後齊改郡為臨滁後周又曰北譙開皇初郡廢改縣為滁水大業初改名焉有銅官山九鬬山六合舊曰尉氏置秦郡後齊置秦州後周改州曰方州改郡曰六合開皇初郡廢四年改尉氏曰六合省堂邑方山二縣入焉大業初州廢又後齊置瓦梁郡陳廢有瓜步山六合山永福舊曰沛梁置涇城東陽二郡陳廢州併二郡為沛郡後周改沛郡為石梁郡改沛縣曰石梁縣省橫山縣入焉開皇初郡廢大業初改縣曰永福有香山永福山句容有茅山浮山四平山延陵舊置南徐州南東海郡梁改曰蘭陵郡陳又改為東海開皇九年州郡並廢又廢丹徒縣入焉十五年置潤州大業初州廢有句驪山黃鵠山蒜山長塘湖曲阿有武進縣梁改為蘭陵開皇九年併入鍾離郡後齊曰西楚州開皇二年改曰濠州統縣四戶三萬五千一十五鍾離舊置郡開皇初郡廢大業中復置郡定遠舊曰東城梁改曰定遠置臨濠郡後齊改曰廣安開皇初郡廢又有舊九江郡後齊廢為曲陽縣縣尋廢又有梁置安州侯景亂廢化明故曰睢陵置濟陰郡後齊改縣曰池南陳復曰睢陵後周改為昭義開皇初郡廢大業初縣改名焉塗山舊曰當塗後齊改曰馬頭置郡曰荊山開皇初改縣曰塗山廢郡有當塗山淮南郡舊曰豫州後魏曰揚州梁曰南豫州東魏曰揚州陳又曰豫州後周曰揚州開皇九年曰壽州置總管府大業元年府廢統縣四戶三萬四千二百七十八壽春舊有淮南梁郡北譙汝陰等郡開皇初並廢幷廢蒙縣入焉大業初置淮南郡有八公山門溪安豐梁置陳留安豐二郡開皇初並廢有芍陂霍丘梁置安豐郡東魏廢開皇十九年置縣名焉長平梁置北陳郡開皇初廢又併西華縣入弋陽郡梁置光州統縣六戶四萬一千四百三十三光山舊置光城郡開皇初郡廢十八年置縣焉大業初置光陽郡又有舊黃川郡梁廢樂安梁置宋安郡及宋安光城二縣又有豐安郡開皇三年並廢入焉有弋陽山浮光山金山錫山定城後齊置南郢州後廢入南北二弋陽縣後又省北弋陽入南弋陽改為定遠焉又後魏置弋陽郡及有梁東新蔡縣後周改為淮南郡又後齊置齊安新蔡二郡及廢舊義州立東光城郡至開皇初五郡及郢州並廢殷城舊曰包信開皇初改名焉梁置義城郡及建州幷所領平高新蔡新城三郡開皇初並廢有大蘇山南松山固始梁曰蓼縣後齊改名焉置北建州尋廢州置新蔡郡後周改置澮州開皇初州郡並廢入又改縣為固始有安陽山期思陳置邊城郡閏皇初郡廢改縣名焉有後齊光化郡亦廢入焉有大別山蘄春郡後齊置雍州後周改曰蘄州開皇初置總管府九年府廢統縣五戶三萬四千六百九十蘄春舊曰蘄陽梁改曰蘄水後齊改曰齊昌置齊昌郡開皇十八年改為蘄春開皇初郡廢有安山浠水舊置永安郡開皇初郡廢有石鼓山蘄水舊曰蘄春梁改名焉有鼓吹山有蘄水黃梅舊曰永興開皇初改曰新蔡十八年改名焉有黃梅山羅田梁置義州義城郡開皇初並廢廬江郡梁置南豫州又改為合州開皇初改為廬州統縣七戶四萬一千六百三十二合肥梁曰汝陰置汝陰郡後齊分置北陳郡開皇初郡廢縣改名焉廬江齊置廬江郡梁置湘州後齊州廢開皇初郡廢有冶甫山上薄山三公山聖山藍家山襄安梁曰蘄開皇初改焉有龜山紫微山亞父山半陽山白石山四鼎山慎東魏置平梁郡陳曰梁郡開皇初郡廢有浮闍山霍山梁置霍州及岳安郡岳安縣後齊州廢開皇初郡廢縣改名焉卑水梁置北沛郡及新蔡縣開皇初郡廢又廢新蔡入焉有墜星山開化梁置有衡山九公山蹋鼓山天山多智山同安郡梁置豫州後改曰晉州後齊改曰江州陳又曰晉州開皇初曰熙州統縣五戶二萬一千七百六十六懷寧舊置晉熙郡開皇初郡廢大業三年置同安郡宿松梁置高塘郡開皇初郡廢改縣曰高塘十八年又改名焉有雷水太湖開皇初改為晉熙十八年復改名焉望江陳置大雷郡開皇十一年改曰義鄉十八年改名焉同安舊曰樅陽幷置樅陽郡開皇初郡廢十八年縣改名焉有浮度山歷陽郡後齊立和州統縣二戶八千二百五十四歷陽舊置歷陽郡開皇初郡廢大業初復置郡烏江梁置江都郡後齊改為齊江郡陳又改為臨江郡周改為同江郡開皇初郡廢大業初置歷陽郡有六合山丹陽郡自東晉已後置郡曰揚州平陳詔並平蕩耕墾更於石頭城置蔣州統縣三戶二萬四千一百二十五江寧梁置丹陽郡及南丹陽郡陳省南丹陽郡平陳又廢丹陽郡幷以秣陵建康同夏三縣入焉大業初置丹陽郡有蔣山當塗舊置淮南郡平陳廢郡幷襄垣于湖繁昌西鄉入焉有天門山楚山溧水舊曰溧陽開皇九年廢丹陽郡入十八年改焉有赭山廬山楚山宣城郡舊置南豫州平陳改為宣州統縣六戶一萬九千九百七十九宣城舊曰宛陵置宣城郡平陳郡廢仍併懷安寧國當塗浚遒四縣入焉大業初置郡有敬亭山涇平陳省安吳南陽二縣入焉有蓋山陵陽山南陵梁置併置南陵郡陳置北江州平陳州郡並廢幷所管石城臨城定陵故治南陵五縣入焉秋浦舊曰石城平陳廢開皇十九年置改名焉永世平陳廢開皇十二年又置有靈光山綏安舊曰石封平陳改名焉梁末立大梁郡又改為陳留平陳郡廢省大德故鄣安吉原鄉四縣入焉毗陵郡平陳置常州統縣四戶一萬七千五百九十九晉陵舊置晉陵郡平陳郡廢大業初置郡有橫山江陰梁置及置江陰郡平陳廢郡及利城梁豐縣入焉有毗陵山無錫有九龍山義興舊曰陽羨置義興郡平陳郡廢改縣名焉又廢義鄉國山臨津三縣入焉有計山洞庭山吳郡陳置吳州平陳改曰蘇州大業初復曰
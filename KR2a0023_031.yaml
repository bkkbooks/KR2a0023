名焉大業初置義陽郡有大龜山金山鍾山舊曰後齊改曰齊安仍置郡開皇初郡廢縣改曰鍾山有鍾山羅山後齊置曰高安開皇初廢十六年置曰羅山禮山舊曰東隨開皇九年改焉有關官有禮山淮源後齊置曰慕化置淮安郡開皇初郡廢大業初縣改名焉有油水九江郡舊置江州統縣二戶七千六百一十七湓城舊曰柴桑置尋陽郡梁又立汝南縣平陳郡廢又廢汝南柴桑二縣立尋陽縣十八年改曰彭蠡大業初置郡縣改名焉有巢湖彭蠡湖有廬山望夫山彭澤梁置太原郡領彭澤晉陽和城天水平陳郡縣並廢置龍城縣開皇十八年改名焉有釣磯江夏郡舊置郢州梁分置北新州尋又分北新立土富洄泉豪五州平陳改置鄂州統縣四戶一萬三千七百七十一江夏舊置江夏郡平陳郡廢大業初復置有烽火山塗水武昌舊置武昌郡平陳郡廢又廢西陵鄂二縣入焉有樊山白紵山永興陳曰陽新平陳改曰富川開皇十一年廢永興縣入十八年改名焉有五龍山蒲圻梁置上雋郡又有沙陽縣置沙州州尋廢平陳郡廢有石頭山魚嶽山鮑山澧陽郡平陳置松州尋改為澧州統縣六戶八千九百六澧陽平陳置縣大業初置郡有藥山有油水石門舊置天門郡平陳郡廢孱陵舊曰作唐置南平郡平陳郡廢縣改名焉安鄉舊置義陽郡平陳郡廢有皇山崇義後周置衡州開皇中置縣名焉十八年改州曰崇州大業初州廢有澧水慈利開皇中置曰零陵十八年改名焉有始零山巴陵郡梁置巴州平陳改曰岳州大業初改曰羅州統縣五戶六千九百三十四巴陵舊置巴陵郡平陳郡廢大業初復置郡華容舊曰安南梁置南安湘郡尋廢開皇十八年縣改名焉沅江梁置曰藥山仍為郡平陳郡廢縣改曰安樂十八年改曰沅江湘陰梁置岳陽郡及羅州陳廢州平陳廢郡及湘陰入岳陽縣置玉州尋改岳陽為湘陰廢玉山縣入焉十二年廢玉州羅開皇九年廢吳昌湘濱二縣入有水汨水長沙郡舊置湘州平陳置潭州總管府大業初府廢統縣四戶一萬四千二百七十五長沙舊曰臨湘置長沙郡平陳郡廢縣改名焉有銅山錫山衡山舊置衡陽郡平陳郡廢併衡山湘鄉湘西三縣入焉益陽平陳併新康縣入焉有浮梁山邵陽舊置邵陵郡平陳郡廢併扶夷都梁二縣入焉衡山郡平陳置衡州統縣四戶五千六十八衡陽舊置湘東郡平陳郡廢幷省臨烝新城重安三縣入焉有衡山武水連水陰舊曰陽平陳改名焉有肥水酃水湘潭平陳廢茶陵攸水陰山建寧四縣入焉有武陽山有歷水新寧有宜溪水舂江桂陽郡平陳置郴州統縣三戶四千六百六十六郴舊置桂陽郡平陳郡廢大業初復置有萬歲山有溱水臨武有華陰山盧陽陳置盧陽郡平陳郡廢有淥水零陵郡平陳初置永州總管府尋廢府統縣五戶六千八百四十五零陵舊曰泉陵置零陵郡平陳郡廢又廢應陽永昌祁陽三縣入焉大業初復置郡湘源平陳廢洮陽灌陽零陵三縣置縣有黃華山有觀水湘水洮水永陽舊曰營陽梁置永陽郡平陳郡廢併營浦謝沐二縣入焉營道平陳併泠道舂陵二縣入有九疑山營山馮乘有馮水熙平郡平陳置連州統縣九戶一萬二百六十五桂陽梁置陽山郡平陳郡廢大業初置熙平郡有貞女山方山有盧水洭水陽山有斟水連山梁置曰廣德隋改曰廣澤仁壽元年改名焉有黃連山宣樂梁置曰梁樂幷置梁樂郡平陳郡廢十八年改為宣樂游安熙平舊置齊樂郡平陳郡廢武化梁置桂嶺舊曰興安開皇十八年改名焉開建梁置南靜郡平陳郡廢尚書荊及衡陽惟荊州上當天文自張十七度至軫十一度為鶉首於辰在巳楚之分野其風俗物產頗同揚州其人率多勁悍決烈蓋亦天性然也南郡夷陵竟陵沔陽沅陵清江襄陽舂陵漢東安陸永安義陽九江江夏諸郡多雜蠻左其與夏人雜居者則與諸華不別其僻處山谷者則言語不通嗜好居處全異頗與巴渝同俗諸蠻本其所出承盤瓠之後故服章多以班布為飾其相呼以蠻則為深忌自晉氏南遷之後南郡襄陽皆為重鎮四方湊會故益多衣冠之緒稍尚禮義經籍焉九江襟帶所在江夏竟陵安陸各置名州為藩鎮重寄人物乃與諸郡不同大抵荊州率敬鬼尤重祠祀之事昔屈原為制九歌蓋由此也屈原以五月望日赴汨羅土人追至洞庭不見湖大船小莫得濟者乃歌曰何由得渡湖因爾鼓櫂爭歸競會亭上習以相傳為競渡之戲其迅楫齊馳櫂歌亂響喧振水陸觀者如雲諸郡率然而南郡襄陽尤甚二郡又有牽鈎之戲云從講武所出楚將伐吳以為教戰流遷不改習以相傳鈎初發動皆有鼓節羣譟歌謠振驚遠近俗云以此厭勝用致豐穰其事亦傳于他郡梁簡文之臨雍部發教禁之由是頗息其死喪之紀雖無被髮袒踊亦知號叫哭泣始死即出屍於中庭不留室內斂畢送至山中以十三年為限先擇吉日改入小棺謂之拾骨拾骨必須女壻蠻重女婿故以委之拾骨者除肉取骨棄小取大當葬之夕女壻或三數十人集會於宗長之宅著芒心接籬名曰茅綏各執竹竿長一丈許上三四尺許猶帶枝葉其行伍前却皆有節奏歌吟叫呼亦有章曲傳云盤瓠初死置之於樹乃以竹木刺而下之故相承至今以為風俗隱諱其事謂之刺北斗既葬設祭則親疎咸哭哭畢家人既至但歡飲而歸無復祭哭也其左人則又不同無衰服不復魄始死置屍館舍隣里少年各持弓箭遶屍而歌以箭扣弓為節其歌詞說平生樂事以至終卒大抵亦猶今之挽歌歌數十闋乃衣衾棺斂送往山林別為廬舍安置棺柩亦有於村側瘞之待二三十喪總葬石窟長沙郡又雜有夷蜒名曰莫徭自云其先祖有功常免徭役故以為名其男子但著白布褌衫更無巾袴其女子青布衫班布裙通無鞋屩婚嫁用鐵鈷為聘財武陵巴陵零陵桂陽澧陽衡山熙平皆同焉其喪葬之節頗同於諸左云

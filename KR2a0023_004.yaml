body:
  text: 隋書卷四帝紀第四煬帝下八年春正月辛巳大軍集于涿郡以兵部尚書段文振為左候衛大將軍壬午下詔曰天地大德降繁霜於秋令聖哲至仁著甲兵於刑典故知造化之有肅殺義在無私帝王之用干戈蓋非獲已版泉丹浦莫匪龔行取亂覆昏咸由順動況乎甘野誓師夏開承大禹之業商郊問罪周發成文王之志永監前載屬當朕躬粵我有隋誕膺靈命兼三才而建極一六合而為家提封所漸細柳盤桃之外聲教爰暨紫舌黃枝之域遠至邇安罔不和會功成治定於是乎在而高麗小醜迷昏不恭崇聚勃碣之間荐食遼獩之境雖復漢魏誅戮巢窟暫傾亂離多阻種落還集萃川藪於往代播實繁以迄今眷彼華壤翦為夷類歷年永久惡稔既盈天道禍淫亡徵已兆亂常敗德非可勝圖掩慝懷姦唯日不足移告之嚴未嘗面受朝覲之禮莫肯躬親誘納亡叛不知紀極充斥邊垂亟勞烽候關柝以之不靜生人為之廢業在昔薄伐已漏天網既緩前擒之戮未即後服之誅曾不懷恩翻為長惡乃兼契丹之黨虔劉海戍習靺鞨之服侵軼遼西又青丘之表咸修職貢碧海之濱同稟正朔遂奪攘琛賮遏絶往來虐及弗辜誠而遇禍輶軒奉使爰暨海東旌節所次途經藩境而擁塞道路拒絶王人無事君之心豈為臣之禮此而可忍孰不可容且法令苛酷賦斂煩重強臣豪族咸執國鈞朋黨比周以之成俗賄貨如市寃枉莫申重以仍歲災凶比屋飢饉兵戈不息徭役無期力竭轉輸身填溝壑百姓愁苦爰誰適從境內哀惶不勝其弊回首面內各懷性命之圖黃髮稚齒咸興酷毒之歎省俗觀風爰屆幽朔弔人問罪無俟再駕於是親總六師用申九伐拯厥阽危協從天意殄茲逋穢克嗣先謨今宜授律啓行分麾屆路掩勃澥而雷震歷夫餘以電掃比戈按甲誓旅而後行三令五申必勝而後戰左第一軍可鏤方道第二軍可長岑道第三軍可海冥道第四軍可蓋馬道第五軍可建安道第六軍可南蘇道第七軍可遼東道第八軍可玄菟道第九軍可扶餘道第十軍可朝鮮道第十一軍可沃沮道第十二軍可樂浪道右第一軍可黏蟬道第二軍可含資道第三軍可渾彌道第四軍可臨屯道第五軍可候城道第六軍可提奚道第七軍可踏頓道第八軍可肅慎道第九軍可碣石道第十軍可東暆道第十一軍可帶方道第十二軍可襄平道凡此衆軍先奉廟略駱驛引途總集平壤莫非如豺如貔之勇百戰百勝之雄顧則山嶽傾頽叱吒則風雲騰鬱心德攸同爪牙斯在朕躬馭元戎為其節度涉遼而東循海之右解倒懸於遐裔問疾苦於遺黎其外輕齎遊闕隨機赴響卷甲銜枚出其不意又滄海道軍舟艫千里高帆電逝巨艦雲飛橫斷浿江徑造平壤島嶼之望斯絶坎井之路已窮其餘被髮左衽之人控弦待發微盧彭濮之旅不謀同辭杖順臨逆人百其勇以此衆戰勢等摧枯然則王者之師義存止殺聖人之教必也勝殘天罰有罪本在元惡人之多僻脅從罔治若高元泥首轅門自歸司寇即宜解縛焚櫬弘之以恩其餘臣人歸朝奉順咸加慰撫各安生業隨才任用無隔夷夏營壘所次務在整肅芻蕘有禁秋毫勿犯布以恩宥喻以禍福若其同惡相濟抗拒官軍國有常刑俾無遺類明加曉示稱朕意焉總一百一十三萬三千八百號二百萬其餽運者倍之癸未第一軍發終四十日引師乃盡旌旗亘千里近古出師之盛未之有也乙未以右候衛大將軍衛玄為刑部尚書甲辰內史令元壽卒二月甲寅詔曰朕觀風燕裔問罪遼濱文武協力爪牙思奮莫不執鋭勤王捨家從役罕蓄倉廩之資兼損播殖之務朕所以夕惕愀然慮其匱乏雖復素飽之衆情在忘私悅使之人宜從其厚諸行從一品以下佽飛募人以上家口郡縣宜數存問若有糧食乏少皆宜賑給或雖有田疇貧弱不能自耕種可於多丁富室勸課相助使夫居者有斂積之豐行役無顧後之慮壬戌司空京兆尹光祿大夫觀王雄薨三月辛卯兵部尚書左候衛大將軍段文振卒癸巳上御師甲午臨戎于遼水橋戊戌大軍為賊所拒不果濟右屯衛大將軍左光祿大夫麥鐵杖武賁郎將錢士雄孟金叉等皆死之甲午車駕渡遼大戰于東岸擊賊破之進圍遼東乙未大頓見二大鳥高丈餘皓身朱足遊泳自若上異之命工圖寫並立銘頌五月壬午納言楊達卒于時諸將各奉旨不敢赴機既而高麗各城守攻之不下六月己未幸遼東責怒諸將止城西數里御六合城七月壬寅宇文述等敗績于薩水右屯衛將軍辛世雄死之九軍並陷將帥奔還亡者二千餘騎癸卯班師九月庚辰上至東都己丑詔曰軍國異容文武殊用匡危拯難則霸德攸興化人成俗則王道斯貴時方撥亂屠販可以登朝世屬隆平經術然後升仕豐都爰肇儒服無預于周行建武之朝功臣不參于吏職自三方未一四海交爭不遑文教唯尚武功設官分職罕以才授班朝治人乃由勳敘莫非拔足行陳出自勇夫斆學之道既所不習政事之方故亦無取是非暗于在己威福專於下吏貪冒貨賄不知紀極蠹政害民實由於此自今已後諸授勳官者並不得回授文武職事庶遵彼更張取類於調瑟求諸名製不傷于美錦若吏部輒擬用者御史即宜糾彈冬十月甲寅工部尚書宇文愷卒十一月己卯以宗女華容公主嫁于高昌王辛巳光祿大夫韓壽卒甲申敗將宇文述于仲文等並除名為民斬尚書右丞劉士龍以謝天下是歲大旱疫人多死山東尤甚密詔江淮南諸郡閲視民間童女姿質端麗者每歲貢之九年春正月丁丑徵天下兵募民為驍果集于涿郡壬午賊帥杜彥冰王潤等陷平原郡大掠而去辛卯置折衝果毅武勇雄武等郎將官以領驍果乙未平原李德逸聚衆數萬稱阿舅賊劫掠山東靈武白榆妄稱奴賊劫掠牧馬北連突厥隴右多被其患遣將軍范貴討之連年不能剋戊戌大赦己亥遣代王侑刑部尚書衛玄鎮京師辛丑以右驍騎將軍李渾為右驍衛大將軍二月己未濟北人韓進洛聚衆數萬為羣盜壬午復宇文述等官爵又徵兵討高麗三月丙子濟陰人孟海公起兵為盜衆至數萬丁丑發丁男十萬城大興戊寅幸遼東以越王侗民部尚書樊子蓋留守東都庚子北海人郭方預聚徒為盜自號盧公衆至三萬攻陷郡城大掠而去夏四月庚午車駕渡遼壬申遣宇文述楊義臣趣平壤五月丁丑熒惑入南斗己卯濟北人甄寶車聚衆萬餘寇掠城邑六月乙巳禮部尚書楊玄感反於黎陽丙辰玄感逼東都河南贊務裴弘策拒之反為賊所敗戊辰兵部侍郎斛斯政奔于高麗庚午上班師高麗犯後軍勑右武衛大將軍李景為後拒遣左翊衛大將軍宇文述左候衛將軍屈突通等馳傳發兵以討玄感秋七月己卯令所在發人城縣府驛癸未餘杭人劉元進舉兵反衆至數萬八月壬寅左翊衛大將軍宇文述等破楊玄感於閿鄉斬之餘黨悉平癸卯吳人朱燮晉陵人管崇擁衆十萬餘自稱將軍寇江左甲辰制驍果之家蠲免賦役丁未詔郡縣城去道過五里已上者徙就之戊申制盜賊籍沒其家乙卯賊帥陳瑱等衆三萬攻陷信安郡辛酉司農卿光祿大夫葛國公趙元淑以罪伏誅九月己卯濟陰人吳海流東海人彭孝才並舉兵為盜衆數萬庚辰賊帥梁慧尚率衆四萬陷蒼梧郡甲午車駕次上谷以供費不給上大怒免太守虞荷等官丁酉東陽人李三兒向但子舉兵作亂衆至萬餘閏月己巳幸博陵庚午上謂侍臣曰朕昔從先朝周旋於此年甫八歲日月不居倏經三紀追惟平昔不可復希言未卒流涕嗚咽侍衛者皆泣下沾襟冬十月丁丑賊帥呂明星率衆數千圍東郡武賁郎將費青奴擊斬之乙酉詔曰博陵昔為定州地居衝要先皇歷試所基王化斯遠故以道冠豳風義高姚邑朕巡撫氓庶爰屆茲邦瞻望郊廛緬懷敬止思所以宣播德澤覃被下人崇紀顯號式光令緒可改博陵為高陽郡赦境內死罪已下給復一年於是召高祖時故吏皆量材授職壬辰以納言蘇威為開府儀同三司朱燮管崇推劉元進為天子遣將軍吐萬緒魚俱羅討之連年不能剋齊人孟讓王薄等衆十餘萬據長白山攻剽諸郡清河賊張金稱衆數萬渤海賊帥格謙自號燕王孫宣雅自號齊王衆各十萬山東苦之丁亥以右候衛將軍郭榮為右候衛大將軍十一月己酉右候衛將軍馮孝慈討張金稱於清河反為所敗孝慈死之十二月甲申車裂玄感弟朝請大夫積善及黨與十餘人仍焚而揚之丁亥扶風人向海明舉兵作亂稱皇帝建元白烏遣太僕卿楊義臣擊破之十年春正月甲寅以宗女為信義公主嫁於突厥曷娑那可汗二月辛未詔百僚議伐高麗數日無敢言者戊子詔曰竭力王役致身戎事咸由徇義莫匪勤誠委命草澤棄骸原野興言念之每懷愍惻往年出車問罪將屆遼濱廟算勝略具有進止而諒惛凶罔識成敗高熲愎很本無智謀臨三軍猶兒戲視人命如草芥不遵成規坐貽撓退遂令死亡者衆不及埋藏今宜遣使人分道收葬設祭於遼西郡立道場一所恩加泉壤庶弭窮魂之寃澤及枯骨用弘仁者之惠辛卯詔曰黃帝五十二戰成湯二十七征方乃德施諸侯令行天下盧芳小盜漢祖尚且親戎隗囂餘燼光武猶自登隴豈不欲除暴止戈勞而後逸者哉朕纂成寶業君臨天下日月所照風雨所沾孰非我臣獨隔聲教蕞爾高麗僻居荒表鴟張狼噬侮慢不恭抄竊我邊陲侵軼我城鎮是以去歲出軍問罪遼碣殪長蛇於玄菟戮封豕於襄平扶餘衆軍風馳電逝追奔逐北徑踰浿水滄海舟楫衝賊腹心焚其城郭污其宮室高元伏鑕泥首送款軍門尋請入朝歸罪司寇朕以許其改過乃詔班師而長惡靡悛宴安鴆毒此而可忍孰不可容便可分命六師百道俱進朕當親執武節臨御諸軍秣馬丸都觀兵遼水順天誅於海外救窮民於倒懸征伐以正之明德以誅之止除元惡餘無所問若有識存亡之分悟安危之機翻然北首自求多福必其同惡相濟抗拒王師若火燎原刑茲無赦有司便宜宣布咸使知聞丁酉扶風人唐弼舉兵反衆十萬推李弘為天子自稱唐王三月壬子行幸涿郡癸亥次臨渝宮親御戎服禡祭黃帝斬叛軍者以釁鼓夏四月辛未彭城賊張大彪聚衆數萬保懸薄山為盜遣榆林太守董純擊破斬之甲午車駕次北平五月庚子詔舉郡孝悌廉潔各十人壬寅賊帥宋世謨陷琅邪郡庚申延安人劉迦論舉兵反自稱皇王建元大世六月辛未賊帥鄭文雅林寶護等衆三萬陷建安郡太守楊景祥死之秋七月癸丑車駕次懷遠鎮乙卯曹國遣使貢方物甲子高麗遣使請降囚送斛斯政上大悅八月己巳班師庚午右衛大將軍左光祿大夫鄭榮卒冬十月丁卯上至東都己丑還京師十一月丙申支解斛斯政於金光門外乙巳有事於南郊己酉賊帥司馬長安破長平郡乙卯離石胡劉苗王舉兵反自稱天子以其弟六兒為永安王衆至數萬將軍潘長文討之不能剋是月賊帥王德仁擁衆數萬保林慮山為盜十二月壬申上如東都其日大赦天下戊子入東都庚寅賊帥孟讓衆十餘萬據都梁宮遣江都郡丞王世充擊破之盡虜其衆十一年春正月甲午朔大宴百僚突厥新羅靺鞨畢大辭訶咄傳越烏那曷波臘吐火羅俱慮建忽論靺鞨訶多沛汗龜茲疏勒于闐安國曹國何國穆國畢衣密失范延伽折契丹等國並遣使朝貢戊戌武賁郎將高建毗破賊帥顏宣政於齊郡虜男女數千口乙卯大會蠻夷設魚龍曼延之樂頒賜各有差二月戊辰賊帥揚仲緒率衆萬餘攻北平滑公李景破斬之庚午詔曰設險守國著自前經重門禦暴事彰往策所以宅土寧邦禁邪固本而近代戰爭居人散逸田疇無伍郛郭不修遂使遊惰實繁寇未息今天下平一海內晏如宜令人悉城居田隨近給使強弱相容力役兼濟穿窬無所厝其姦宄萑蒲不得聚其逋逃有司具為事條務令得所丙子上谷人王須拔反自稱漫天王國號燕賊帥魏刁兒自稱歷山飛衆各十餘萬北連突厥南寇趙五月丁酉殺右驍衛大將軍光祿大夫郕公李渾將作監光祿大夫李敏並族滅其家癸卯賊帥司馬長安破西河郡己酉幸太原避暑汾陽宮秋七月己亥淮南人張起緒舉兵為盜衆至三萬辛丑光祿大夫右禦衛大將軍張壽卒八月乙丑巡北塞戊辰突厥始畢可汗率騎數十萬謀襲乘輿義成公主遣使告變壬申車駕馳幸雁門癸酉突厥圍城官軍頻戰不利上大懼欲率精騎潰圍而出民部尚書樊子蓋固諫乃止齊王暕以後軍保于崞縣甲申詔天下諸郡募兵於是守令各來赴難九月甲辰突厥解圍而去丁未曲赦太原雁門郡死罪已下冬十月壬戌上至于東都丁卯彭城人魏騏驎聚衆萬餘為盜寇魯郡壬申賊帥盧明月聚衆十餘萬寇陳汝間東海賊帥李子通擁衆度淮自號楚王建元明政寇江都十一月乙卯賊帥王須拔破高陽郡十二月戊寅有大流星如斛墜明月營破其衝車庚辰詔民部尚書樊子蓋發關中兵討絳郡賊敬盤陀柴保昌等經年不能剋譙郡人朱粲擁衆數十萬寇荊襄僭稱楚帝建元昌達漢南諸郡多為所陷焉十二年春正月甲午雁門人翟松柏起兵於靈丘衆至數萬轉攻傍縣二月己未真臘國遣使貢方物甲子夜有二大鳥似雕飛入大業殿止于御幄至明而去癸亥東海賊盧公暹率衆萬餘保于蒼山夏四月丁巳顯陽門災癸亥魏刁兒所部將甄翟兒復號歷山飛衆十萬轉寇太原將軍潘長文討之反為所敗長文死之五月丙戌朔日有蝕之既癸巳大流星隕于吳郡為石壬午上於景華宮徵求螢火得數斛夜出遊山放之光遍巖谷秋七月壬戌民部尚書光祿大夫濟北公樊子蓋卒甲子幸江都宮以越王侗光祿大夫段達太府卿元文都檢校民部尚書韋津右武衛將軍皇甫無逸右司郎盧楚等總留後事奉信郎崔民象以盜賊充斥於建國門上表諫不宜巡幸上大怒先解其頤乃斬之戊辰馮翊人孫華自號總管舉兵為盜高涼通守洗珤徹舉兵作亂嶺南溪洞多應之己巳熒惑守羽林月餘乃退車駕次汜水奉信郎王愛仁以盜賊日盛諫上請還西京上怒斬之而行八月乙巳賊帥趙萬海衆數十萬自山寇高陽壬子有大流星如斗出王良閣道聲如隤牆癸丑大流星如甕出羽林九月丁酉東海人杜揚州沈覔敵等作亂衆至數萬右禦衛將軍陳稜擊破之戊午有二枉矢出北斗魁委曲蛇形注於南斗壬戌安定人荔非世雄殺臨涇令舉兵作亂自號將軍冬十月己丑開府儀同三司左翊衛大將軍光祿大夫許公宇文述薨十二月癸未鄱陽賊操天成舉兵反自號元興王建元始興攻陷豫章郡乙酉以右翊衛大將軍來護兒為開府儀同三司行左翊衛大將軍壬辰鄱陽人林士弘自稱皇帝國號楚建元太平攻陷九江廬陵郡唐公破甄翟兒於西河虜男女數千口十三年春正月壬子齊郡賊杜伏威率衆渡淮攻陷歷陽郡丙辰勃海賊竇建德設壇於河間之樂壽自稱長樂王建元丁丑辛巳賊帥徐圓朗率衆數千破東平郡弘化人劉企成聚衆萬餘人為盜傍郡苦之二月壬午朔方人梁師都殺郡丞唐世宗據郡反自稱大丞相遣銀青光祿大夫張世隆擊之反為所敗戊子賊帥王子英破上谷郡己丑馬邑校尉劉武周殺太守王仁恭舉兵作亂北連突厥自稱定楊可汗庚寅賊帥李密翟讓等陷興洛倉越王侗遣武賁郎將劉長恭光祿少卿房崱擊之反為所敗死者十五六庚子李密自號魏公稱元年開倉以振羣盜衆至數十萬河南諸郡相繼皆陷焉壬寅劉武周破武賁郎將王智辨于桑乾鎮智辨死之三月戊午廬江人張子路舉兵反遣右禦衛將軍陳稜討平之丁丑賊帥李通德衆十萬寇廬江左屯衛將軍張鎮州擊破之夏四月癸未金城校尉薛舉率衆反自稱西秦霸王建元秦興攻陷隴右諸郡己丑賊帥孟讓夜入東都外郭燒豐都市而去癸巳李密陷回洛東倉丁酉賊帥房憲伯陷汝陰郡是月光祿大夫裴仁基淮陽太守趙他等並以衆叛歸李密五月辛酉夜有流星如甕墜於江都甲子唐公起義師於太原丙寅突厥數千寇太原唐公擊破之秋七月壬子熒惑守積尸丙辰武威人李軌舉兵反攻陷河西諸郡自稱涼王建元安樂八月辛巳唐公破武牙郎將宋老生於霍邑斬之九月己丑帝括江都人女寡婦以配從兵是月武陽郡丞元寶藏以郡叛歸李密與賊帥李文相攻陷黎陽倉彗星見於營室冬十月丁亥太原楊世洛聚衆萬餘人寇掠城邑丙申羅令蕭銑以縣反鄱陽人董景珍以郡反迎銑於羅縣號為梁王攻陷傍郡戊戌武賁郎將高毗敗濟北郡賊甄寶車於山十一月丙辰唐公入京師辛酉遙尊帝為太上皇立代王侑為帝改元義寧上起宮丹陽將遜于江左有烏鵲來巢幄帳驅不能止熒惑犯太微有石自江浮入于揚子日光四散如流血上甚惡之二年三月右屯衛將軍宇文化及武賁郎將司馬德戡元禮監門直閣裴虔通將作少監宇文智及武勇郎將趙行樞鷹揚郎將孟景內史舍人元敏符璽郎李覆牛方裕千牛左右李孝本弟孝質直長許弘仁薛世良城門郎唐奉義醫正張愷等以驍果作亂入犯宮闈上崩于溫室時年五十蕭后令宮人撤牀簀為棺以埋之化及發後右禦衛將軍陳稜奉梓宮於成象殿葬吳公臺下發斂之始容貌若生衆咸異之大唐平江南之後改葬雷塘初上自以藩王次不當立每矯情飾行以釣虛名陰有奪宗之計時高祖雅信文獻皇后而性忌妾媵皇太子勇內多嬖幸以此失愛帝後庭有子皆不育之示無私寵取媚於后大臣用事者傾心與交中使至第無貴賤皆曲承顏色申以厚禮婢僕往來者無不稱其仁孝又常私入宮掖密謀於獻后楊素等因機構扇遂成廢立自高祖大漸暨諒暗之中蒸淫無度山陵始就即事巡遊以天下承平日久士馬全盛慨然慕秦皇漢武之事乃盛治宮室窮極侈靡召募行人分使絶域諸蕃至者厚加禮賜有不恭命以兵擊之盛興屯田於玉門柳城之外課天下富室益市武馬匹直十餘萬富強坐是凍餒者十家而九帝性多詭譎所幸之處不欲人知每之一所輒數道置頓四海珍羞殊味水陸必備焉求市者無遠不至郡縣官人競為獻食豐厚者進擢疏儉者獲罪姦吏侵漁內外虛竭頭會箕斂人不聊生于時軍國多務日不暇給帝方驕怠惡聞政事冤屈不治奏請罕決又猜忌臣下無所專任朝臣有不合意者必構其罪而族滅之故高熲賀若弼先皇心膂參謀帷幄張衡李金才藩邸惟舊績著經綸或惡其直道或忿其正議求其無形之罪加以刎頸之誅其餘事君盡禮謇謇匪躬無辜無罪橫受夷戮者不可勝紀政刑弛紊賄貨公行莫敢正言道路以目六軍不息百役繁興行者不歸居者失業人飢相食邑落為墟上不之恤也東西遊幸靡有定居每以供費不給逆收數年之賦所至唯與後宮流連耽湎惟日不足招迎姥媼朝夕共肆醜言又引少年令與宮人穢亂不軌不遜以為娛樂區宇之內盜賊蜂起劫掠從官屠陷城邑近臣互相掩蔽隱賊數不以實對或有言賊多者輒大被詰責各求苟免上下相蒙每出師徒敗亡相繼戰士盡力必不加賞百姓無辜咸受屠戮黎庶憤怨天下土崩至於就擒而猶未之寤也史臣曰煬帝爰在弱齡早有令聞南平吳會北却胸奴昆弟之中獨著聲績於是矯情飾貌肆厥姦回故得獻后鍾心文皇革慮天方肇亂遂登儲兩踐峻極之崇基承丕顯之休命地廣三代威振八紘單于頓顙越裳重譯赤仄之泉流溢于都內紅腐之粟委積於塞下負其富強之資思逞無厭之欲狹殷周之制度尚秦漢之規摹恃才矜己傲狠明德內懷險躁外示凝簡盛冠服以飾其姦除諫官以掩其過淫荒無度法令滋章教絶四維刑參五虐鋤誅骨肉屠勦忠良受賞者莫見其功為戮者不知其罪驕怒之兵屢動土木之功不息頻出朔方三駕遼左旌旗萬里徵稅百端猾吏侵漁人不堪命乃急令暴條以擾之嚴刑峻法以臨之甲兵威武以董之自是海內騷然無聊生矣俄而玄感肇黎陽之亂胸奴有雁門之圍天子方棄中土遠之揚越姦宄乘釁強弱相陵關梁閉而不通皇輿往而不反加之以師旅因之以飢饉流離道路轉死溝壑十八九焉於是相聚萑蒲蝟毛而起大則跨州連郡稱帝稱王小則千百為羣攻城剽邑流血成川澤死人如亂麻炊者不及析骸食者不遑易子茫茫九土並為麋鹿之場黔黎俱充蛇豕之餌四方萬里簡書相續猶謂鼠竊狗盜不足為虞上下相蒙莫肯念亂振蜉蝣之羽窮長夜之樂土崩魚爛貫盈惡稔普天之下莫匪仇讎左右之人皆為敵國終然不悟同彼望夷遂以萬乘之尊死於一夫之手億兆靡感恩之士九牧無勤王之師子弟同就誅夷骸骨棄而莫掩社稷顛隕本枝殄絶自肇有書契以迄于茲宇宙崩離生靈塗炭喪身滅國未有若斯之甚也書曰天作孽猶可違自作孽不可逭傳曰吉凶由人祅不妄作又曰兵猶火也不戢將自焚觀隋室之存亡斯言信而有徵矣

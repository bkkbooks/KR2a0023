body:
  text: 隋書卷二十六志第二十一百官上易曰天尊地卑乾坤定矣卑高既陳貴賤位矣是以聖人法乾坤以作則因卑高以垂教設官分職錫圭胙土由近以制遠自中以統外內則公卿大夫士外則公侯伯子男咸所以協和萬邦平章百姓允釐庶績式敘彝倫其由來尚矣然古今異制文質殊途或以龍表官或以雲紀職放勛即分命四子重華乃爰置九官夏倍於虞殷倍於夏周監二代沿革不同其道既文置官彌廣逮于戰國戎馬交馳雖時有變革然猶承周制秦始皇廢先王之典焚百家之言創立朝儀事不師古始罷封侯之制立郡縣之官太尉主五兵丞相總百揆又置御史大夫以二於相自餘衆職各有司存漢高祖除暴寧亂輕刑約法而職官之制因於嬴氏其間同異抑亦可知光武中興聿遵前緒唯廢丞相與御史大夫而以三司綜理衆務洎于叔世事歸臺閣論道之官備員而已魏晉繼及大抵略同爰及宋齊亦無改作梁武受終多循齊舊然而定諸卿之位各配四時置戎秩之官百有餘號陳氏繼梁不失舊物高齊創業亦遵後魏臺省位號與江左稍殊所有節文備詳於志有周創據關右日不暇給洎乎克清江漢爰議憲章酌酆鎬之遺文置六官以綜務詳其典制有可稱焉高祖踐極百度伊始復廢周官還依漢魏唯以中書為內史侍中為納言自餘庶僚頗有損益煬帝嗣位意存稽古建官分職率由舊章大業三年始行新令于時三川定鼎萬國朝宗衣冠文物足為壯觀既而以人從欲待下若讎號令日改官名月易尋而南征不復朝廷播遷圖籍注記多從散逸今之存録者不能詳備焉梁武受命之初官班多同宋齊之舊有丞相太宰太傅太保大將軍大司馬太尉司徒司空開府儀同三司等官諸公及位從公開府者置官屬有長史司馬咨議參軍掾屬從事中郎記室主簿列曹參軍行參軍舍人等官其司徒則有左右二長史又增置左西掾一人自餘僚佐同於二府有公則置無則省而司徒無公唯省舍人餘官常置開府儀同三司位次三公諸將軍左右光祿大夫優者則加之同三公置官屬特進舊位從公武帝以鄧禹列侯就第特進奉朝請是特引見之稱無官定體於是革之尚書省置令左右僕射各一人又置吏部祠部度支左戶都官五兵等六尚書左右丞各一人吏部刪定三公比部祠部儀曹虞曹主客度支殿中金部倉部左戶駕部起部屯田都官水部庫部功論中兵外兵騎兵等郎二十三人令史百二十人書令史百三十人尚書掌出納王命敷奏萬機令總統之僕射副令又與尚書分領諸曹令闕則左僕射為主其祠部尚書多不置以右僕射主之若左右僕射並闕則置尚書僕射以掌左事置祠部尚書以掌右事然則尚書僕射祠部尚書不置矣又有起部尚書營宗廟宮室則權置之事畢則省以其事分屬都官左戶二尚書左右丞各一人佐令僕射知省事左掌臺內分職儀禁令報人章督録近道文書章表奏事糾諸不法右掌臺內藏及廬舍凡諸器用之物督録遠道文書章表奏事凡諸尚書文書詣中書省者密事皆以挈囊盛之封以左丞印自晉以後八座及郎中多不奏事天監元年詔曰自禮闈陵替歷茲永久郎署備員無取職事粳粃文案貴尚虛間空有趨墀之名了無握蘭之實曹郎可依昔奏事自是始奏事矣三年置侍郎視通直郎其郎中在職勤能滿二歲者轉之又有五都令史與左右丞共知所司舊用人常輕九年詔曰尚書五都職參政要非但總領衆局亦乃方軌二丞頃雖求才未臻妙簡可革用士流每盡時彥庶同持領秉此羣目於是以都令史視奉朝請其年以太學博士劉納兼殿中都司空法曹參軍劉顯兼吏部都太學博士孔虔孫兼金部都司空法曹參軍蕭軌兼左戶都宣毅墨曹參軍王顒兼中兵都五人並以才地兼美首膺茲選矣駕部又別領車府署庫部領南北武庫二署令丞門下省置侍中給事黃門侍郎各四人掌侍從左右擯相威儀盡規獻納糾正違闕監合嘗御藥封璽書侍郎中高功者在職一年詔加侍中祭酒與侍郎高功者一人對掌禁令公車太官太醫等令驊騮丞集書省置散騎常侍通直散騎常侍各四人員外散騎常侍無員散騎侍郎通直郎各四人又有員外散騎侍郎給事中奉朝請常侍侍郎掌侍從左右獻納得失省諸奏聞文書意異者隨事為駁集録比詔比璽為諸優文策文平處諸文章詩頌常侍高功者一人為祭酒與侍郎高功者一人對掌禁令糾諸逋違駙馬奉車車騎三都尉並無員駙馬以加尚公主者無班秩散騎常侍通直散騎常侍員外散騎常侍舊並為顯職與侍中通官宋代以來或輕或雜其官漸替天監六年革選詔曰在昔晉初仰惟盛化常侍侍中並奏帷幄員外常侍特為清顯陵始名公之胤位居納言曲蒙優禮方有斯授可分門下二局委散騎常侍尚書案奏分曹入集書通直常侍本為顯爵員外之選宜參舊準人數依正員格自是散騎視侍中通直視中丞員外視黃門郎中書省置監令各一人掌出內帝命侍郎四人功高者一人主省內事又有通事舍人主事令史等員及置令史以承其事通事舍人舊入直閣內梁用人殊重簡以才能不限資地多以他官兼領其後除通事直曰中書舍人祕書省置監丞各一人郎四人掌國之典籍圖書著作郎一人佐郎八人掌國史集注起居著作郎謂之大著作梁初周捨裴子野皆以他官領之又有撰史學士亦知史書佐郎為起家之選御史臺梁國初建置大夫天監元年復曰中丞置一人掌督司百僚皇太子已下其在宮門行馬內違法者皆糾彈之雖在行馬外而監司不糾亦得奏之專道而行逢尚書丞郎亦得停駐其尚書令僕御史中丞各給威儀十人其八人武冠絳韝執青儀囊在前囊題云宜官吉以受辭訴一人緗衣執鞭杖依列行七人唱呼入殿引喤至階一人執儀囊不喤屬官治書侍御史二人掌舉劾官品第六已下分統侍御史侍御史九人居曹掌知其事糾察不法殿中御史四人掌殿中禁衛內又有符節令史員謁者臺僕射一人掌朝覲賓饗之事屬官謁者十人掌奉詔出使拜假朝會擯贊高功者一人為假史掌差次謁者諸卿梁初猶依宋齊皆無卿名天監七年以太常為太常卿加置宗正卿以大司農為司農卿三卿是為春卿加置太府卿以少府為少府卿加置太僕卿三卿是為夏卿以衛尉為衛尉卿廷尉為廷尉卿將作大匠為大匠卿三卿是為秋卿以光祿勳為光祿卿大鴻臚為鴻臚卿都水使者為太舟卿三卿是為冬卿凡十二卿皆置丞及功曹主簿而太常視金紫光祿大夫統明堂二廟太史太祝廩犧太樂鼓吹乘黃北館典客館等令丞及陵監國學等又置協律校尉總章校尉監掌故樂正之屬以掌樂事太樂又有清商署丞太史別有靈臺丞詔以為陵監之名不出前誥且宗廟憲章既備典禮園寢職司理不容異諸正陵先立監者改為令於是陵置令矣國學有祭酒一人博士二人助教十人太學博士八人又有限外博士員天監四年置五經博士各一人舊國子學生限以貴賤帝欲招來後進五館生皆引寒門俊才不限人數大同七年國子祭酒到溉等又表立正言博士一人位視國子博士置助教二人宗正卿位視列曹尚書主皇室外戚之籍以宗室為之司農卿位視散騎常侍主農功倉廩統太倉導官籍田上林令又管樂遊北苑丞左右中部三倉丞莢庫荻庫箬庫丞湖西諸屯主天監九年又置勸農謁者視殿中御史太府卿位視宗正掌金帛府帑統左右藏令上庫丞掌太倉南北市令關津亦皆屬焉少府卿位視尚書左丞置材官將軍左中右尚方甄官平水署南塘邸稅庫東西冶中黃細作炭庫紙官柒署等令丞太僕卿位視黃門侍郎統南馬牧左右牧龍內外丞又有弘訓太僕亦置屬官衛尉卿位視侍中掌宮門屯兵卿每月丞每司馬令又有弘訓衛尉亦置屬官廷尉卿梁國初建曰大理天監元年復改為廷尉有正監平三人元會廷尉三官與建康三官皆法冠玄衣朝服以監東西中華門手執方木長三尺方一寸謂之執方四年置胄子律博士位視員外郎大匠卿位視太僕掌土木之工統左右校諸署光祿卿位視太子中庶子掌宮殿門戶統守宮黃門華林園暴室等令又有左右光祿金紫光祿太中中散等大夫並無員以養老疾鴻臚卿位視尚書左丞掌導護贊拜太舟卿梁初為都水臺使者一人參軍事二人河堤謁者八人七年改焉位視中書郎列卿之最末者也主舟航堤渠大長秋主諸宦者以司宮闈之職統黃門中署奚官暴室華林等署領軍護軍左右衛驍騎遊騎等六將軍是為六軍又有中領中護資輕於領護又左右前後四將軍左右中郎將屯騎步騎越騎長水射聲等五營校尉武賁冗從羽林三軍積射強弩二軍殿中將軍武騎之職皆以分司丹禁侍衛左右天監六年置左右驍騎左右遊擊將軍位視二率改舊驍騎曰雲騎遊擊曰遊騎降左右驍遊一階又置朱衣直閣將軍以經為方牧者為之其以左右驍遊帶領者量給儀從太子太傅一人位視尚書令少傅一人位視左僕射天監初又置東宮常侍皆散騎常侍為之詹事位視中護軍任總宮朝二傅及詹事各置丞功曹主簿五官家令率更令僕各一人家令自宋齊已來清流者不為之天監六年帝以三卿陵替乃詔革選家令視通直常侍率更僕視黃門三等皆置丞中大通三年以昭明太子妃居金華宮又置金華家令左右衛率各一人位視御史中丞各有丞左率領果毅統遠立忠建寧陵鋒夷寇祚德等七營右率領崇榮永吉崇和細射等四營二率各置殿中將軍十人員外將軍十人正員司馬四人又有員外司馬督官其屯騎步兵翊軍三校尉各一人謂之三校旅賁中郎將冗從僕射各一人謂之二將左右積弩將軍各一人門大夫一人視謁者僕射中庶子四人功高者一人為祭酒行則負璽前後部護駕中舍人四人功高者一人與中庶子祭酒共掌其坊之禁令又有通事守舍人典事守舍人典法守舍人員庶子四人掌侍從左右獻納得失高功者一人與高功舍人共掌其坊之禁令舍人十六人掌文記通事舍人二人視南臺御史多以餘官兼職典經局洗馬八人位視通直郎置典經守舍人典事守舍人員又有外監殿局內監殿局導客局齋內局主璽主衣扶侍等局門局錫庫局內局中藥藏局食官局外局車局等各置有司以承其事皇弟皇子府置師長史司馬從事中郎咨議參軍及掾屬中録事中記室中直兵等參軍功曹史録事記室中兵等參軍文學主簿正參軍行參軍長兼行參軍等員嗣王府則減皇弟皇子府師友文學長兼行參軍蕃王府則又減嗣王從事中郎咨議參軍掾屬録事記室中兵參軍等員自此以下則並不登二品王國置郎中令將軍常侍官又置典祠令廟長陵長典醫丞典府丞典書令學官令食官長中尉侍郎執事中尉司馬謁者典衛令舍人中大夫大農等官嗣王國則唯置郎中令中尉常侍大農等員蕃王則無常侍自此以下並不登二品諸王皆假金獸符第一至第五左竹使符第一至第十左諸公侯皆假銅獸符竹使符第一至第五名山大澤不以封監鐵金銀銅錫及竹園別都宮室園圃皆不以屬國諸王言曰令境內稱之曰殿下公侯封郡縣者言曰教境內稱之曰第下自稱皆曰寡人相以下公文上事皆詣典書世子主國其文書表疏儀式如臣而不稱臣文書下羣官皆言告諸王公侯國官皆稱臣上於天朝皆稱陪臣有所陳皆曰上疏其公文曰言事五等諸公位視三公班次之開國諸侯位視孤卿重號將軍光祿大夫班次之開國諸伯位視九卿班次之開國諸子位視二千石班次之開國諸男位視比二千石班次之公已下各置相典祠典書令典衛長一人而伯子典書謂之長典衛謂之丞男典祠謂之長典書謂之丞無典衛諸公
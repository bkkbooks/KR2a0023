body:
  text: 隋書卷四十一列傳第六高熲高熲字昭玄一名敏自云渤海蓨人也父賓背齊歸周大司馬獨孤信引為僚佐賜姓獨孤氏及信被誅妻子徙蜀文獻皇后以賓父之故吏每往來其家賓後官至鄀州刺史及熲貴贈禮部尚書渤海公熲少明敏有器局略涉書史尤善詞令初孩孺時家有柳樹高百許尺亭亭如蓋里中父老曰此家當出貴人年十七周齊王憲引為記室武帝時襲爵武陽縣伯除內史上士尋遷下大夫以平齊功拜開府尋從越王盛擊隰州叛胡平之高祖得政素知熲強明又習兵事多計略意欲引之入府遣國公楊惠諭意熲承旨欣然曰願受驅馳縱令公事不成熲亦不辭滅族於是為相府司録時長史鄭譯司馬劉昉並以奢縱被疏高祖彌屬意於熲委以心膂尉迥之起兵也遣子惇率步騎八萬進屯武陟高祖令韋孝寬擊之軍至河陽莫敢先進高祖以諸將不一令崔仲方監之仲方辭父在山東時熲又見劉昉鄭譯並無去意遂自請行深合上旨遂遣熲熲受命便發遣人辭母云忠孝不可兩兼歔欷就路至軍為橋於沁水賊於上流縱火熲預為土狗以禦之既渡焚橋而戰大破之遂至鄴下與迥交戰仍共宇文欣李詢等設策因平尉迥軍還侍宴於臥內上撤御帷以賜之進位柱國改封義寧縣公遷相府司馬任寄益隆高祖受禪拜尚書左僕射兼納言進封渤海郡公朝臣莫與為比上每呼為獨孤而不名也熲深避權勢上表遜位讓於蘇威上欲成其美聽解僕射數日上曰蘇威高蹈前朝熲能推舉吾聞進賢受上賞寧可令去官於是命熲復位俄拜左衛大將軍本官如故時突厥屢為寇患詔熲鎮遏緣邊及還賜馬百餘匹牛羊千計領新都大監制度多出於熲熲每坐朝堂北槐樹下以聽事其樹不依行列有司將伐之上特命勿去以示後人其見重如此又拜左領軍大將軍餘官如故母憂去職二旬起令視事熲流涕辭讓優詔不許開皇二年長孫覽元景山等伐陳令熲節度諸軍會陳宣帝薨熲以禮不伐喪奏請班師蕭巖之叛也詔熲綏集江漢甚得人和上嘗間熲取陳之策熲曰江北地寒田收差晚江南土熱水田早熟量彼收穫之際微徵士馬聲言掩襲彼必屯兵禦守足得廢其農時彼既聚兵我便解甲再三若此賊以為常後更集兵彼必不信猶豫之頃我乃濟師登陸而戰兵氣益倍又江南土薄舍多竹茅所有儲積皆非地窖密遣行人因風縱火待彼修立復更燒之不出數年自可財力俱盡上行其策由是陳人益敝九年晉王廣大舉伐陳以熲為元帥長史三軍咨禀皆取斷於熲及陳平晉王欲納陳主寵姬張麗華熲曰武王滅殷戮妲己今平陳國不宜取麗華乃命斬之王甚不悅及軍還以功加授上柱國進爵齊國公賜物九千段定食千乘縣千五百戶上因勞之曰公伐陳後人言公反朕已斬之君臣道合非青蠅所間也熲又遜位詔曰公識鑒通遠器略優深出參戎律廓清淮海入司禁旅實委心腹自朕受命常典機衡竭誠陳力心迹俱盡此則天降良輔翊贊朕躬幸無詞費也其優奬如此是後右衛將軍龐晃及將軍盧賁等前後短熲於上上怒之皆被疏黜因謂熲曰獨孤公猶鏡也每被磨瑩皎然益明未幾尚書都事姜曄楚州行參軍李君才並奏稱水旱不調罪由高熲請廢黜之二人俱得罪而去親禮逾密上幸並州留熲居守及上還京賜縑五千匹復賜行宮一所以為莊舍其夫人賀拔氏寢疾中使顧問絡繹不絶上親幸其第賜錢百萬絹萬匹復賜以千里馬上嘗從容命熲與賀若弼言及平陳事熲曰賀若弼先獻十策後於蔣山苦戰破賊臣文吏耳焉敢與大將軍論功帝大笑時論嘉其有讓尋以其子表仁取太子勇女前後賞賜不可勝計時熒惑入太微犯左執法術者劉暉私言於熲曰天文不利宰相可修德以禳之熲不自安以暉言奏之上厚加賞慰突厥犯塞以熲為元帥擊賊破之又出白道進圖入磧遣使請兵近臣緣此言熲欲反上未有所答熲亦破賊而還時太子勇失愛於上潛有廢立之意謂熲曰晉王妃有神憑之言王必有天下若之何熲長跪曰長幼有序其可廢乎上默然而止獨孤皇后知熲不可奪陰欲去之初夫人卒后言於上曰高僕射老矣而喪夫人陛下何能不為之娶上以后言謂熲熲流涕謝曰臣今已老退朝之後唯齊居讀佛經而已雖陛下垂哀之深至於納室非臣所願上乃止至是熲愛妾産男上聞之極歡后甚不悅上問其故后曰陛下當復信高熲邪始陛下欲為熲娶穎心存愛妾面欺陛下今其詐已見陛下安得信之上由是疏熲會議伐遼東熲固諫不可上不從以熲為元帥長史從漢王征遼東遇霖潦疾疫不利而還后言於上曰熲初不欲行陛下強遣之妾固知其無功矣又上以漢王年少專委軍於熲熲以任寄隆重每懷至公無自疑之意諒所言多不用甚銜之及還諒泣言於后曰兒幸免高熲所殺上聞之彌不平俄而上柱國王世積以罪誅當推核之際乃有宮禁中事云於熲處得之上欲成熲之罪聞此大驚時上柱國賀若弼吳州總管宇文刑部尚書薛胄民部尚書斛律孝卿兵部尚書柳述等明熲無罪上逾怒皆以之屬吏自是朝臣莫敢言者熲竟坐免以公就第未幾上幸秦王俊第召熲侍宴熲歔欷悲不自勝獨孤皇后亦對之泣左右皆流涕上謂熲曰朕不負公公自負也因謂侍臣曰我於高熲勝兒子雖或不見常似目前自其解落瞑然忘之如本無高熲不可以身要君自云第一也頃之熲國令上熲陰事稱其子表仁謂熲曰司馬仲達初託疾不朝遂有天下公今遇此焉知非福於是上大怒囚熲於內史省而鞫之憲司復奏熲他事云沙門真覺嘗謂熲云明年國有大喪尼令暉復云十七十八年皇帝有大厄十九年不可過上聞而益怒顧謂羣臣曰帝王豈可力求孔子以大聖之才作法垂世寧不欲大位邪天命不可耳熲與子言自比晉帝此何心乎有司請斬熲上曰去年殺虞慶則今茲斬王世積如更誅熲天下其謂我何於是除名為民熲初為僕射其母誡之曰汝富貴已極但有一斫頭耳爾宜慎之熲由是常恐禍變及此熲歡然無恨色以為得免於禍煬帝即位拜為太常時詔收周齊故樂人及天下散樂熲奏曰此樂久廢今若徵之恐無識之徒棄本逐末遞相教習帝不悅帝時侈靡聲色滋甚又起長城之役熲甚病之謂太常丞李懿曰周天元以好樂而亡殷鑒不遙安可復爾時帝遇啓民可汗恩禮過厚熲謂太府卿何稠曰此虜頗知中國虛實山川險易恐為後患復謂觀王雄曰近來朝廷殊無綱紀有人奏之帝以為謗訕朝政於是下詔誅之諸子徙邊熲有文武大略明達世務及蒙任寄之後竭誠盡節進引貞良以天下為己任蘇威楊素賀若弼韓擒等皆熲所推薦各盡其用為一代名臣自餘立功立事者不可勝數當朝執政將二十年朝野推服物無異議治致升平熲之力也論者以為真宰相及其被誅天下莫不傷惜至今稱寃不已所有奇策密謀及損益時政熲皆削藁世無知者其子盛道官至莒州刺史徙柳城而卒次弘德封應國公晉王府記室次表仁封渤海郡公徙蜀郡蘇威子夔蘇威字無畏京兆武功人也父綽魏度支尚書威少有至性五歲喪父哀毀有若成人周太祖時襲爵美陽縣公仕郡功曹大冢宰宇文護見而禮之以其女新興主妻焉見護專權恐禍及己逃入山中為叔父所逼卒不獲免然威每屏居山寺以諷讀為娛未幾授使持節車騎大將軍儀同三司改封懷道縣公武帝親總萬機拜稍伯下大夫前後所授並辭疾不拜有從父妹者適河南元雄雄先與突厥有隙突厥入朝請雄及其妻子將甘心焉周遂遣之威曰夷人昧利可以賂動遂標賣田宅罄家所有以贖雄論者義之宣帝嗣位就拜開府高祖為丞相高熲屢言其賢高祖亦素重其名召之及至引入臥內與語大悅居月餘威聞禪代之議遁歸田里高熲請追之高祖曰此不欲預吾事且置之及受禪徵拜太子少保追贈其父為邳國公邑三千戶以威襲焉俄兼納言民部尚書威上表陳讓詔曰舟大者任重馬駿者遠馳以公有兼人之才無辭多務也威乃止初威父在西魏以國用不足為征稅之法頗稱為重既而歎曰今所為者正如張弓非平世法也後之君子誰能弛乎威聞其言每以為己任至是奏減賦役務從輕典上悉從之漸見親重與高熲參掌朝政威見宮中以銀為幔鈎因盛陳節儉之美以諭上上為之改容雕飾舊物悉命除毀上嘗怒一人將殺之威入閣進諫不納上怒甚將自出斬之威當上前不去上避之而出威又遮止上拂衣而入良久乃召威謝曰公能若是吾無憂矣於是賜馬二匹錢十餘萬尋復兼大理卿京兆尹御史大夫本官悉如故治書侍御史梁毗以威領五職安繁戀劇無舉賢自代之心抗表劾威上曰蘇威朝夕孜孜志存遠大舉賢有闕何遽迫之顧謂威曰用之則行舍之則藏唯我與爾有是夫因謂朝臣曰蘇威不值我無以措其言我不得蘇威何以行其道楊素才辨無雙至若斟酌古今助我宣化非威之匹也蘇威若逢亂世南山四皓豈易屈哉其見重如此未幾拜刑部尚書解少保御史大夫之官後京兆尹廢檢校雍州別駕時高熲與威同心協贊政刑大小無不籌之故革運數年天下稱治俄轉民部尚書納言如故屬山東諸州民飢上令威賑恤之後二載遷吏部尚書歲餘兼領國子祭酒隋承戰爭之後憲章踳駁上令朝臣釐改舊法為一代通典律令格式多威所定世以為能九年拜尚書右僕射其年以母憂去職柴毀骨立上勑威曰公德行高人情寄殊重大孝之道蓋同俯就必須抑割為國惜身朕之於公為君為父宜依朕旨以禮自存未幾起令視事固辭優詔不許明年上幸並州命與高熲同總留事俄追詣行在所使決民訟威子夔少有盛名於天下引致賓客四海士大夫多歸之後議樂事夔與國子博士何妥各有所持於是夔妥俱為一議使百僚署其所同朝廷多附威同夔者十八九妥恚曰吾席間函丈四十餘年反為昨暮兒之所屈也遂奏威與禮部尚書盧愷吏部侍郎薛道衡尚書右丞王弘考功侍郎李同和等共為朋黨省中呼王弘為世子李同和為叔言二人如威之子弟也復言威以曲道任其從父弟徹肅等罔冒為官又國子學請蕩陰人王孝逸為書學博士威屬盧愷以為其府參軍上令蜀王秀上柱國虞慶則等雜治之事皆驗上以宋書謝晦傳中朋黨事令威讀之威惶懼免冠頓首上曰謝已晚矣於是免威官爵以開府就第知名之士坐威得罪者百餘人未幾上曰蘇威德行者但為人所誤耳命之通籍歲餘復爵邳公拜納言從祠太山坐不敬免俄而復位上謂羣臣曰世人言蘇威詐清家纍金玉此妄言也然其性很戾不切世要求名太甚從己則悅違之必怒此其大病耳尋令持節巡撫江南得以便宜從事過會稽踰五嶺而還時突厥都藍可汗屢為邊患復使威至可汗所與結和親可汗即遣使獻方物以勤勞進位大將軍仁壽初復拜尚書右僕射上幸仁壽宮以威總留後事及上還御史奏威職事多不理請推之上怒詰責威威拜謝上亦止後上幸仁壽宮不豫皇太子自京師來侍疾詔威留守京師煬帝嗣位加上大將軍及長城之役威諫止之高熲賀若弼等之誅也威坐與相連免官歲餘拜魯郡太守俄召還參預朝政未幾拜太常卿其年從征吐谷渾進位左光祿大夫帝以威先朝舊臣漸加委任後歲餘復為納言與左翊衛大將軍宇文述黃門侍郎裴矩御史大夫裴蘊內史侍郎虞世基參掌朝政時人稱為五貴及遼東之役以本官領左武衛大將軍進位光祿大夫賜爵寧陵侯其年進封房公威以年老上表乞骸骨上不許復以本官參掌選事明年從征遼東領右禦衛大將軍楊玄感之反也帝引威帳中懼見於色謂威曰此小兒聰明得不為患乎威曰夫識是非審成敗者乃所謂聰明玄感粗疏非聰明者必無所慮但恐寖成亂階耳威見勞役不息百姓思亂微以此諷帝帝竟不寤從還至涿郡詔威安撫關中以威孫尚輦直長儇為副其子鴻臚少卿夔先為關中簡黜大使一家三人俱奉使關右三輔榮之歲餘帝下手詔曰玉以潔潤丹紫莫能渝其質松表歲寒霜雪莫能凋其采可謂溫仁徑直性之然乎房公威器懷溫裕識量弘雅早居端揆備悉國章先皇舊臣朝之宿齒棟梁社稷弼諧朕躬守文奉法卑身率禮昔漢之三傑輔惠帝者蕭何周之十亂佐成王者邵奭國之寶器其在得賢參燮台階具瞻斯允雖復事藉論道終期獻替銓衡時務朝寄為重可開府儀同三司餘並如故威當時見尊重朝臣莫與為比後從幸雁門為突厥所圍朝廷危憚帝欲輕騎潰圍而出威諫曰城守則我有餘力輕騎則彼之所長陛下萬乘之主何宜輕脫帝乃止突厥俄亦解圍而去車駕至太原威言於帝曰今者盜賊不止士馬疲敝願陛下還京師深根固本為社稷之計帝初然之竟用宇文述等議遂往東都時天下大亂威知帝不可改意甚患之屬帝問侍臣盜賊事宇文述曰盜賊信少不足為虞威不能詭對以身隱於殿柱帝呼威而問之威對曰臣非職司不知多少但患其漸近帝曰何謂也威曰他日賊據長白山今者近在滎陽汜水帝不悅而罷尋屬五月五日百僚上饋多以珍玩威獻尚書一部微以諷帝帝彌不平後復問伐遼東事威對願赦羣盜遣討高麗帝益怒御史大夫裴蘊希旨令白衣張行本奏威昔在高陽典選濫授人官畏怯突厥請還京師帝令案其事及獄成下詔曰威立性朋黨好為異端懷挾詭道徼幸名利詆訶律令謗訕臺省昔歲薄伐奉述先志凡預切問各盡胸臆而威不以開懷遂無對命啓沃之道其若是乎資敬之義何其甚薄於是除名為民後月餘有人奏威與突厥陰圖不軌者大理簿責威威自陳奉事二朝三十餘載精誠微淺不能上感咎釁屢彰罪當萬死帝憫而釋之其年從幸江都宮帝將復用威裴蘊虞世基奏言昏耄羸疾帝乃止宇文化及之弒逆也以威為光祿大夫開府儀同三司化及敗歸於李密未幾密敗歸東都越王侗以為上柱國邳公王充僭號署太師威自以隋室舊臣遭逢喪亂所經之處皆與時消息以求容免及大唐秦王平王充坐於東都閶闔門內威請謁見稱老病不能拜起王遣人數之曰公隋朝宰輔政亂不能匡救遂令品物塗炭君弒國亡見李密王充皆拜伏舞蹈今既老病無勞相見也尋歸長安至朝堂請見又不許卒於家時年八十二威治身清儉以廉慎見稱每至公議惡人異己雖或小事必固爭之時人以為無大臣之體所修格令章程並行於當世然頗傷苛碎論者以為非簡允之法及大業末年尤多征役至於論功行賞威每承望風旨輒寢其事時羣盜蜂起郡縣有表奏詣闕者又訶詰使人令減賊數故出師攻討多不克捷由是為物議所譏子夔夔字伯尼少聰敏有口辨八歲誦詩書兼解騎射年十三從父至尚書省與安德王雄馳射賭得雄駿馬而歸十四詣學與諸儒論議詞致可觀見者莫不稱善及長博覽羣言尤以鍾律自命初不名夔其父改之頗為有識所哂起家太子通事舍人楊素甚奇之素每戲威曰楊素無兒蘇夔無父後與沛國公鄭譯國子博士何妥議樂因而得罪議寢不行著樂志十五篇以見其志數載遷太子舍人後加武騎尉仁壽末詔天下舉達禮樂之源者晉王昭時為雍州牧舉夔應之與諸州所舉五十餘人謁見高祖望夔謂侍臣唯此一人稱吾所舉於是拜晉王友煬帝嗣位遷太子洗馬轉司朝謁者以父免職夔亦去官後歷尚書職方郎燕王司馬遼東之役夔領宿衛以功拜朝散大夫時帝方勤遠略蠻夷朝貢前後相屬帝嘗從容謂宇文述虞世基等曰四夷率服觀禮華夏鴻臚之職須歸令望寧有多才藝美容儀可以接對賓客者為之乎咸以夔對帝然之即日拜鴻臚少卿其年高昌王麴伯雅來朝朝廷妻以公主夔有雅望令主婚焉其後弘化延安等數郡盜賊蜂起所在屯結夔奉詔巡撫關中突厥之圍雁門也夔領城東面事夔為弩樓車箱獸圈一夕而就帝見而善之以功進位通議大夫坐父事除名為民復丁母憂不勝哀而卒時年四十九史臣曰齊公霸圖伊始早預經綸魚水冥符風雲玄感正身直道弼諧興運心同契合言聽計從東夏克平南國底定參謀帷幄決勝千里高祖既復禹迹思布堯心舟楫是寄鹽梅斯在兆庶賴以康寧百僚資而輯睦年將二紀人無間言屬高祖將廢儲宮由忠信而得罪逮煬帝方逞浮侈以忤時而受戮若使遂無猜釁克終厥美雖未可參蹤稷契足以方駕蕭曹繼之實難惜矣邳公周道云季方事幽貞隋室龍興首應旌命綢繆任遇窮極榮寵久處機衡多所損益罄竭心力知無不為然志尚清儉體非弘曠好同惡異有乖直道不存易簡未為通德歷事二帝三十餘年雖廢黜當時終稱遺老君邪而不能正言國亡而情均衆庶豫違汝弼徒聞其語疾風徑草未見其人禮命闕於興王抑亦此之由也夔志識沉敏方雅可稱若天假之年足以不虧堂構矣

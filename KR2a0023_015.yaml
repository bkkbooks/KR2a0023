body:
  text: 隋書卷十五志第十音樂下開皇九年平陳獲宋齊舊樂詔於太常置清商署以管之求陳太樂令蔡子元于普明等復居其職由是牛弘奏曰臣聞周有六代之樂至韶武而已秦始皇改周舞曰五行漢高帝改韶舞曰文始以示不相襲也又造武德自表其功故高帝廟奏武德文始五行之舞又作昭容禮容增演其意昭容生於武德蓋猶古之韶也禮容生於文始矯秦之五行也文帝又作四時之舞故孝景帝立追述先功采武德舞作昭德舞被之管弦薦於太宗之廟孝宣采昭德舞為盛德舞更造新歌薦於武帝之廟據此而言遞相因襲縱有改作並宗於韶至明帝時東平獻王采文德舞為大武之舞薦于光武之廟漢末大亂樂章淪缺魏武平荊州獲杜夔以為軍謀祭酒使創雅樂時散騎侍郎鄧靜善詠雅歌樂師尹胡能習宗祀之曲舞師馮肅曉知先代諸舞總練研精復於古樂自夔始也文帝黃初改昭容之樂為昭業樂武德之舞為武頌舞文始之舞為大韶舞五行之舞為大武舞明帝初公卿奏上太祖武皇帝樂曰武始之舞高祖文皇帝樂曰咸熙之舞又製樂舞名曰章斌之舞有事於天地宗廟及臨朝大饗並用之晉武帝泰始二年遣傅玄等造行禮及上壽食舉歌詩張華表曰按漢魏所用雖詩章辭異興廢隨時至其韻逗曲折並繫於舊一皆因襲不敢有所改也九年荀勗典樂使郭夏宋識造正德大豫之舞改魏昭武舞曰宣武舞羽籥舞曰宣文舞江左之初典章堙紊賀循為太常卿始有登歌之樂大寧末阮孚等又增益之咸和間鳩集遺逸鄴沒胡後樂人頗復南度東晉因之以具鍾律太元間破苻永固又獲樂工楊蜀等閑練舊樂於是金石始備尋其設懸音調並與江左是同慕容垂破慕容永於長子盡獲苻氏舊樂垂息為魏所敗其鍾律令李佛等將太樂細伎奔慕容德於鄴德遷都廣固子超嗣立其母先沒姚興超以太樂伎一百二十人詣興贖母及宋武帝入關悉收南渡永初元年改正德舞曰前舞大武舞曰後舞文帝元嘉九年太樂令鍾宗之更調金石至十四年典書令奚縱復改定之又有凱容宣業之舞齊代因而用之蕭子顯齊書志曰宋孝建初朝議以凱容舞為韶舞宣業舞為武德舞據韶為言宣業即是古之大武非武德也故志有前舞凱容歌辭後舞凱容歌辭者矣至于梁初猶用凱容宣業之舞後改為大壯大觀焉今人猶喚大觀為前舞故知樂名雖隨代而改聲韻曲折理應常同前克荊州得梁家雅曲今平蔣州又得陳氏正樂史傳相承以為合古且觀其曲體用聲有次請修緝之以備雅樂其後魏洛陽之曲據魏史云太武平赫連昌所得更無明證後周所用者皆是新造雜有邊裔之聲戎音亂華皆不可用請悉停之制曰制禮作樂聖人之事也功成化洽方可議之今宇內初平正化未洽遽有變革我則未暇晉王廣又表請帝乃許之牛弘遂因鄭譯之舊又請依古五聲六律旋相為宮雅樂每宮但一調唯迎氣奏五調謂之五音縵樂用七調祭祀施用各依聲律尊卑為次高祖猶憶妥言注弘奏下不許作旋宮之樂但作黃鍾一宮而已於是牛弘及祕書丞姚察通直散騎常侍許善心儀同三司劉臻通直郎虞世基等更共詳議曰後周之時以四聲降神雖采周禮而年代深遠其法久絕不可依用謹案司樂凡樂圜鍾為宮黃鍾為角太簇為徵姑洗為羽舞雲門以祭天函鍾為宮太簇為角姑洗為徵南呂為羽舞咸池以祭地黃鍾為宮大呂為角太簇為徵圜鍾為羽舞韶以祀宗廟馬融曰圜鍾應鍾也賈逵鄭玄曰圜鍾夾鍾也鄭玄又云此樂無商聲祭尚柔剛故不用也干寶云不言商商為臣王者自謂故置其實而去其名若曰有天地人物無德以主之謙以自牧也先儒解釋既莫知適從然此四聲非直無商又律管乖次以其為樂無克諧之理今古事異不可得而行也按東觀書馬防傳大予丞鮑鄴等上作樂事下防防奏言建初二年七月鄴上言天子食飲必順于四時五味而有食舉之樂所以順天地養神明求福應也今官雅樂獨有黃鍾而食舉樂但有太簇皆不應月律恐傷氣類可作十二月均各應其月氣公卿朝會得聞月律乃能感天和氣宜應詔下太常評焉太常上言作樂器直錢百四十六萬奏寢今明詔復下臣防以為可須上天之明時因歲首之嘉月發太簇之律奏雅頌之音以迎和氣其條貫甚具遂獨施行起於十月為迎氣之樂矣又順帝紀云陽嘉二年冬十月庚午以春秋為辟雍隸太學隨月律十月作應鍾三月作姑洗元和以來音戾不調修復黃鍾作樂器如舊典據此而言漢樂宮懸有黃鍾均食舉太簇均止有二均不旋相為宮亦以明矣計從元和至陽嘉二年纔五十歲用而復止驗黃帝聽鳳以制律呂尚書曰予欲聞六律五聲周禮有分樂而祭此聖人制作以合天地陰陽之和自然之理乃云音戾不調斯言誣之甚也今梁陳雅曲並用宮聲按禮五聲十二律還相為宮盧植云十二月三管流轉用事當用事者為宮宮君也鄭玄曰五聲宮商角徵羽其陽管為律陰管為呂布十二辰更相為宮始自黃鍾終於南呂凡六十也皇侃疏還相為宮者十一月以黃鍾為宮十二月以大呂為宮正月以太簇為宮餘月放此凡十二管各備五聲合六十聲五聲成一調故十二調此即釋鄭義之明文無用商角徵羽為別調之法矣樂稽耀嘉曰東方春其聲角樂當宮於夾鍾餘方各以其中律為宮若有商角之理不得云宮於夾鍾也又云五音非宮不調五味非甘不和又動聲儀宮唱而商和是謂善本太平之樂也周禮奏黃鍾歌大呂以祀天神鄭玄以黃鍾之鍾大呂之聲為均均調也故崔靈恩云六樂十二調亦不獨論商角徵羽也又云凡六樂者皆文之以五聲播之以八音故知每曲皆須五聲八音錯綜而能成也禦寇子云師文鼓琴命宮而總四聲則慶雲浮景風翔唯韓詩云聞其宮聲使人溫厚而寬大聞其商聲使人方廉而好義及古有清角清徵之流此則當聲為曲今以五引為五聲迎氣所用者是也餘曲悉用宮聲不勞商角徵羽何以得知荀勗論三調為均首者得正聲之名明知雅樂悉在宮調已外徵羽角自為謠俗之音耳且西涼龜茲雜伎等曲數既多故得隸於衆調調各別曲至如雅樂少須以宮為本歷十二均而作不可分配餘調更成雜亂也其奏大抵如此帝並從之故隋代雅樂唯奏黃鍾一宮郊廟饗用一調迎氣用五調舊工更盡其餘聲律皆不復通或有能為蕤賓之宮者享祀之際肆之竟無覺者弘又修皇后房內之樂據毛萇侯苞孫毓故事皆有鍾聲而王肅之意乃言不可又陳統云婦人無外事而陰教尚柔柔以靜為體不宜用於鍾弘等採肅統以焉取正高祖龍潛時頗好音樂常倚琵琶作歌二首名曰地厚天高託言夫妻之義因即取之為房內曲命婦人幷登歌上壽並用之職在宮內女人教習之初後周故事懸鍾磬法七正七倍合為十四蓋準變宮變徵凡為七聲有正有倍而為十四也長孫紹遠引國語泠州鳩云武王伐殷歲在鶉火自鶉及駟七位故也既以七同其數而以律和其聲於是有七律又引尚書大傳謂之七始其注云謂黃鍾林鍾太簇南呂姑洗應鍾蕤賓也歌聲不應此者皆去之然據一均言也宮商角徵羽為正變宮變徵為和加倍而有十四焉又梁武帝加以濁倍三七二十一而同為架雖取繁會聲不合古又後魏時公孫崇設鍾磬正倍參懸之弘等並以為非而據周官小胥職懸鍾磬半之為堵全之為肆鄭玄曰鍾磬編懸之二八十六而在一虡鍾一堵磬一堵謂之肆又引樂緯宮為君商為臣君臣皆尊各置一副故加十四而懸十六又據漢成帝時犍為水濱得石磬十六枚此皆懸八之義也懸鍾磬法每虡準之懸八用七不取近周之法懸七也又參用儀禮及尚書大傳為宮懸陳布之法北方北向應鍾起西磬次之黃鍾次之鍾次之大呂次之皆東陳一建鼓在其東東鼓東方西向太簇起北磬次之夾鍾次之鍾次之姑洗次之皆南陳一建鼓在其南東鼓南方北向中呂起東鍾次之蕤賓次之磬次之林鍾次之皆西陳一建鼓在其西西鼓西方東向夷則起南鍾次之南呂次之磬次之無射次之皆北陳一建鼓在其北西鼓其大射則撤北面而加鉦鼓祭天用雷鼓雷鼗祭地用靈鼓靈鼗宗廟用路鼓路鼗各兩設在懸內又準儀禮宮懸四面設鎛鍾十二虡各依辰位又甲丙庚壬位各設鍾一虡乙丁辛癸位各陳磬一虡共為二十虡其宗廟殿庭郊丘社並同樹建鼓于四隅以象二十四氣依月為均四箱同作蓋取毛傳詩云四懸皆同之義古者鎛鍾據儀禮擊為節檢而無合曲之義又大射有二鎛皆亂擊焉乃無成曲之理依後周以十二鎛相生擊之聲韻克諧每鎛鍾建鼓各一人每鍾磬簨簴各一人歌二人執節一人琴瑟箏筑各一人每鍾虡竽笙簫笛塤篪各一人懸內柷敔各一人柷在東敔在西二舞各八佾樂人皆平巾幘絳衣樂器並采周官參之梁代擇用其尤善者其簨簴皆金五博山飾以崇牙樹羽旒蘇其樂器應漆者天地之神皆朱漆宗廟及殿庭則五色漆畫晉宋故事箱別各有柷敔既同時戞之今則不用又周官大司樂奏黃鍾歌大呂舞雲門以祀天神奏太簇歌應鍾舞咸池以祭地祇奏姑洗歌南呂舞大韶以祀四望奏蕤賓歌函鍾舞大夏以祭山川奏夷則歌小呂舞大護以享先妣奏無射歌夾鍾舞大武以享先祖此乃周制立二王三恪通己為六代之樂至四時祭祀則分而用之以六樂配十二調一代之樂則用二調矣隋去六代之樂又無四望先妣之祭今既與古祭法有別乃以神祇位次分樂配焉奏黃鍾歌大呂以祀圓丘黃鍾所以宣六氣也耀魄天神最為尊極故奏黃鍾以祀之奏太簇歌應鍾以祭方澤太簇所以贊陽出滯崐崙厚載之重故奏太簇以祀之奏姑洗歌南呂以祀五郊神州姑洗所以滌潔百物五郊神州天地之次故奏姑洗以祀之奏蕤賓歌函鍾以祭宗廟蕤賓所以安靜神人祖宗有國之本故奏蕤賓以祀之奏夷則歌小呂以祭社稷先農夷則所以詠歌九穀貴在秋成故奏夷則以祀之奏無射歌夾鍾以祭巡狩方嶽無射所以示人軌物觀風望秩故奏無射以祀之同用文武二舞其圓丘降神六變方澤降神八變宗廟禘祫降神九變皆用昭夏其餘祭享皆一變又周禮王出奏王夏尸出奏肆夏叔孫通法迎神奏嘉至今亦隨事立名皇帝入出皆奏皇夏羣官入出皆奏肆夏食舉上壽奏需夏迎送神奏昭夏薦獻郊廟奏諴夏宴饗殿上奏登歌幷文舞武舞合為八曲古有宮商角徵羽五引梁以三朝元會奏之今改為五音其聲悉依宮商不使差越唯迎氣於五郊降神奏之月令所謂孟春其音角是也通前為十三曲幷內宮所奏天高地厚二曲於房中奏之合十五曲其登歌法準禮郊特牲歌者在上匏竹在下大戴云清廟之歌懸一磬而尚拊搏又在漢代獨登歌者不以絲竹亂人聲近代以來有登歌五人別升於上絲竹一部進處階前此蓋尚書戞擊鳴球搏拊琴瑟以詠祖考來格之義也梁武樂論以為登歌者頌祖宗功業檢禮記乃非元日所奏若三朝大慶百辟俱陳升工籍殿以詠祖考君臣相對便須涕洟以此說非通還以嘉慶用之後周登歌備鍾磬琴瑟階上設笙管今遂因之合於儀禮荷瑟升歌及笙入立於階下間歌合樂是燕飲之事矣登歌法十有四人鍾東磬西工各一人琴瑟箏筑各一人幷歌者三人執節七人並坐階上笙竽簫笛塤篪各一人並立階下悉進賢冠絳公服斟酌古今參而用之祀神宴會通行之若有大祀臨軒陳於階壇之上若冊拜王公設宮懸不用登歌釋奠則唯用登歌而不設懸古者人君食皆用當月之調以取時律之聲使不失五常之性調暢四體令得時氣之和故鮑鄴上言天子食飲必順四時有食舉樂所以順天地養神明可作十二月均感天和氣此則殿庭月調之義也祭祀既已分樂臨軒朝會並用當月之律正月懸太簇之均乃至十二月懸大呂之均欲感君人情性允協陰陽之序也又文舞六十四人並黑介幘冠進賢冠絳紗連裳內單皁褾領襈裾革帶烏皮履十六人執十六人執帗十六人執旄十六人執羽左手皆執籥二人執纛引前在舞人數外衣冠同舞人武舞六十四人並服武弁朱衣革帶烏皮履左執朱干右執大戚依朱干玉戚之文二人執旌居前二人執鼗二人執鐸金錞二四人輿二人作二人執鐃次之二人執相在左二人執雅在右各工一人作自旌以下夾引並在舞人數外衣冠同舞人周官所謂以金錞和鼓金鐲節鼓金鐃止鼓金鐸通鼓也又依樂記象德擬功初來就位總干而山立思君道之難也發揚蹈厲威而不殘也舞亂皆坐四海咸安也武始而受命再成而定山東三成而平蜀道四成而北狄是通五成而江南是拓六成復綴以闡太平高祖曰不須象功德直象事可也然竟用之近代舞出入皆作樂謂之階步咸用肆夏今亦依定即周官所謂樂出入奏鍾鼓也又魏晉故事有矛俞弩俞及朱儒導引今據尚書直云干羽禮文稱羽籥干戚今文舞執羽籥武舞執干戚其矛俞弩俞等蓋漢高祖自漢中歸巴俞之兵執仗而舞也既非正典悉罷不用十四年三月樂定祕書監奇章縣公牛弘祕書丞北絳郡公姚察通直散騎常侍虞部侍郎許善心兼內史舍人虞世基儀同三司東宮學士饒陽伯劉臻等奏曰臣聞蕢桴土鼓由來斯尚雷出地奮著自易經邃古帝王經邦馭物揖讓而臨天下者禮樂之謂也秦焚經典樂書亡缺爰至漢興始加鳩採祖述增廣緝成朝憲魏晉相承更加論討沿革之宜備於故實永嘉之後九服崩離燕石苻姚遞據華土此其戎乎何必伊川之上吾其左袵無復微管之功前言往式於斯而盡金陵建社朝士南奔帝則皇規粲然更備與內原隔絕三百年於茲矣伏惟明聖膺期會昌在運今南征所獲梁陳樂人及晉宋旗章宛然俱至曩代所不服者今悉服之前朝所未得者今悉得之化洽功成於是乎在臣等伏奉明詔詳定雅樂博訪知音旁求儒彥研校是非定其去就取為一代正樂具在本司於是幷撰歌辭三十首詔並令施用見行者皆停之其人間音樂流僻日久棄其舊體者並加禁約務存其本先是高祖遣內史侍郎李元操直內史省盧思道等列清廟歌辭十二曲令齊樂人曹妙達於太樂教習以代周歌其初迎神七言象元基曲獻奠登歌六言象傾盃曲送神禮畢五言象行天曲至是弘等但改其聲合於鍾律而辭經勑定不敢易之至仁壽元年煬帝初為皇太子從饗于太廟聞而非之乃上言曰清廟歌辭文多浮麗不足以述宣功德請更議定於是制詔吏部尚書奇章公弘開府儀同三司領太子洗馬柳顧言祕書丞攝太常少卿許善心內史舍人虞世基禮部侍郎蔡徵等更詳故實創製雅樂歌辭其祠圓丘皇帝入至版位定奏昭夏之樂以降天神升壇奏皇夏之樂受玉帛登歌奏昭夏之樂皇帝降南陛詣罍洗洗爵訖升壇並奏皇夏初升壇俎入奏昭夏之樂皇帝初獻奏諴夏之樂皇帝既獻作文舞之舞皇帝飲福酒作需夏之樂皇帝反爵於坫還本位奏皇夏之樂武舞出作肆夏之樂送神作昭夏之樂就燎位還大次並奏皇夏圜丘降神奏昭夏辭肅祭典協良辰具嘉薦俟皇臻禮方成樂已變感靈心廻天眷闢華闕下乾宮乘精氣御祥風望爟火通田燭膺介圭受瑄玉神之臨慶陰陰煙衢洞宸路深善既福德斯輔流鴻祚徧區宇皇帝升壇奏皇夏辭於穆我君昭明有融道濟區域功格玄穹百神警衞萬國承風仁深德厚信洽義豐明發思政勤憂在躬鴻基惟永福祚長隆登歌辭德深禮大道高饗穆就陽斯恭陟配惟肅血膋升氣冕裘標服誠感清玄信陳史祝祗承靈貺載膺多福皇帝初獻奏諴夏辭肇禋崇祀大報尊靈因高盡敬掃地推誠六宗隨兆五緯陪營雲和發韵孤竹揚清我粢既潔我酌惟明元神是鑒百祿來成皇帝既獻奏文舞辭皇矣上帝受命自天睿圖作極文教遐宣四方監觀萬品陶甄有苗斯格無得稱焉天地之經和樂具舉休徵咸萃要荒式序正位履端秋霜春雨皇帝飲福酒奏需夏辭禮以恭事薦以饗時載清玄酒備潔薌萁廻旒分爵思媚軒墀惠均撤俎祥降受釐十倫以具百福斯滋克昌厥德永祚鴻基武舞辭御曆膺期乘乾表則成功戡亂順時經國兵暢五材武弘七德憬彼遐裔化行充塞三道備舉二儀交泰情發自中義均莫大祀敬恭肅鍾鼓繁會萬國斯歡兆人斯賴享茲介福康哉元首惠我無疆天長地久送神奏昭夏辭享序洽祀禮施神之駕嚴將馳奔精驅長離耀牲煙達潔誠照騰日馭鼓電鞭辭下土升上玄瞻寥廓杳無際澹羣心留餘惠皇帝就燎還大次並奏皇夏辭同上五郊歌辭五首迎送神登歌與圜丘同青帝歌辭奏角音震宮初動木德惟仁龍精戒旦鳥曆司春陽光煦物溫風先導巖處載驚膏田已冒犧牲豐潔金石和聲懷柔備禮明德惟馨赤帝歌辭奏徵音長嬴開序炎上為德執禮司萌持衡御國重離得位芒種在時含櫻薦實木槿垂蕤慶賞既行高明可處順時立祭事昭福舉黃帝歌辭奏宮音爰稼作土順位稱坤孕金成德履艮為尊黃本內色宮實聲始萬物資生四時咸紀靈壇汛掃盛樂高張威儀孔備褔履無疆白帝歌辭奏商音西成肇節盛德在秋三農稍已九穀行收金氣肅殺商威飂戾嚴風鼓莖繁霜殞蔕厲兵詰暴勑法慎刑神明降嘏國步惟寧黑帝歌辭奏羽音玄英啟候冥陵初起虹藏於天雉化於水嚴關重閉星廻日窮黃鍾動律廣莫生風玄樽示本天產惟質恩覃外區褔流景室感帝奏諴夏辭迎送神登歌與圜丘同禘祖垂典郊天有章以春之孟於國之陽繭栗惟誠陶匏斯尚人神接禮明幽交暢火靈降祚火曆載隆蒸哉帝道赫矣皇風雩祭奏諴夏辭迎送神登歌與圜丘同朱明啟候時載陽肅若舊典延五方嘉薦以陳盛樂奏氣序和平資靈祐公田既雨私亦濡人殷俗富政化敷蜡祭奏諴夏辭迎送神登歌與圜丘同四方有祀八蜡酬功收藏既畢榛葛送終使之必報祭之斯索三時告勞一日為澤神祇必來鱗羽咸致惟義之盡惟仁之至年成物阜罷役息人皇恩已洽靈慶無垠朝日夕月歌詩二首迎送神登歌與圜丘同朝日奏諴夏辭扶木上朝暾嵫山沉暮景寒來遊晷促暑至馳輝永時和合璧耀俗泰重輪明執圭盡昭事服冕罄虔誠夕月奏諴夏辭澄輝燭地域流耀鏡天儀曆草隨弦長珠胎逐望虧成形表蟾兔竊藥資王母西郊禮既成幽壇褔惟厚方丘歌辭四首唯此四者異餘並同圜丘迎神奏昭夏辭柔功暢陰德昭陳瘞典盛玄郊篚冪清膋鬯馥皇情虔具僚肅笙頌合鼓鼗會出桂旗屯孔蓋敬如在肅有承神胥樂慶褔膺奠玉帛登歌道惟生育器乃包藏報功稱範殷薦有常六瑚已饋五齊流香貴誠尚質敬洽義彰神祚惟永帝業增昌皇地祇歌辭奏諴夏辭原載垂德崐丘主神陰壇吉禮北至良辰鑒水呈潔牲栗表純樽壺夕視幣玉朝陳羣望咸秩精靈畢臻祔流於國祉被於人送神歌辭奏昭夏辭奠既徹獻已周竦靈駕逝遠遊洞四極帀九縣慶方流祉遍埋玉氣掩牲芬晰神理顯國文神州奏諴夏辭迎送神登歌與方丘同四海之內一和之壤地曰神州物賴生長咸池既降泰折斯饗牲牷尚黑珪玉實兩九宇載寧神功克廣社稷歌辭四首迎送神登歌與方丘同春祈社奏諴夏辭厚地開靈方壇崇祀達以風露樹之松梓勾萌既申芟柞伊始恭祈粢盛載膺休祉春祈稷奏諴夏辭粒食興教播厥有先尊神致潔報本惟虔瞻榆束耒望杏開田方憑戩褔佇詠豐年秋報社奏諴夏辭北墉申禮單出表誠豐犧入薦華樂在庭原隰既平泉流又清如雲已望高廩斯盈秋報稷奏諴夏辭人天務急農亦勤止或蔉或藨惟惟艹巳涼風戒時歲云秋矣物成則報功施必祀先農奏諴夏辭迎送神與方丘同農祥晨晰土膏初起春原俶載青壇致祀斂蹕長阡廻旌外壝房俎飾薦山罍沈滓親事朱弦躬持黛耜恭神務穡受釐降祉先聖先師奏諴夏辭經國立訓學重教先三墳肇冊五典留篇開鑿理著陶鑄功宣東膠西序春誦夏弦芳塵載仰祀典無騫太廟歌辭迎神歌辭務本興教尊神體國霜露感心享祀陳則官聯式序奔走在庭几筵結慕祼獻惟誠嘉樂載合神其降止永言保之錫以繁祉登歌辭孝熙嚴祖師象敬宗惟皇肅事有來雝雝雕梁霞複繡橑雲重觀德自感奉璋伊恭彝斝盡飾羽綴有容升歌發藻景褔來從俎入歌辭郊丘社廟同祭本用初祀由功舉駿奔咸會供神有序明酌盈樽豐犧實俎幽金既薦繢錯維旅享由明德香非稷黍載流嘉慶克固鴻緒皇高祖太原府君神室歌辭締基發祥肇源興慶廼仁廼哲克明克令庸宣國圖善流人詠開我皇業七百同盛皇曾祖康王神室歌辭皇條俊茂帝系靈長豐功疊軌厚利重光褔由善積代以德彰嚴恭盡禮永錫無疆皇祖獻王神室歌辭盛才必達丕基增舊涉渭同符遷邠等構弘風邁德義高道富神鑒孔昭王猷克懋皇考太祖武元皇帝神室歌辭深仁冥著至道潛敷皇矣太祖耀名天衢翦商隆祚奄宅隋區有命既集誕開靈符飲褔酒歌辭郊丘社廟同神道正直祀事有融肅雝備禮莊敬在躬羞燔已具奠酹將終降祥惟永受褔無窮送神歌辭饗禮具利事成佇旒冕肅簪纓金奏終玉俎撒盡孝敬窮嚴潔人祇分哀樂半降景褔憑幽贊元會皇帝出入殿庭奏皇夏辭郊丘社廟同深哉皇度粹矣天儀司陛整蹕式道先馳八屯霧擁七萃雲披退揚進揖步矩行規勾陳乍轉華蓋徐移羽旗照耀珪組陸離居高念下處安思危照臨有度紀律無虧皇太子出入奏肆夏辭惟熙帝載式固王猷體乾建本是曰孟侯馳道美漢寢門稱周德心既廣道業惟優傅保斯導賢才與遊瑜玉發響畫輪停輈皇基方峻匕鬯休食舉歌辭八首燔黍設教禮之始五味相資火為紀平心和德在甘旨牢羞既陳鍾石俟以斯而御揚盛軌養身必敬禮食昭時和歲阜庶物饒鹽梅既濟鼎鉉調特以膚腊加臐膮威儀濟濟懋皇朝饔人進羞樂侑作川潛之膾雲飛羊誩甘酸有宜芬勺藥金敦玉豆盛交錯御鼓既聲安以樂玉食惟后膳必珍芳菰既潔重秬新是能安體又調神荊包畢至海貢陳用之有節德無垠嘉羞入饋猶化謐沃土名滋帝臺實陽華之菜雕陵栗鼎俎芬芳豆籩溢通幽致遠車書一道高物備食多方山膚既善水豢良桓蒲在位簨業張加籩折俎爛成行恩風下濟道化光禮以安國仁為政具物必陳饔牢盛罝罘斤斧順時令懷生熙熙皆得性於茲宴喜流嘉慶皇道四達禮樂成臨朝日舉表時平甘芳既飫醑以清揚休玉卮正性情隆我帝載永明明上壽歌辭俗已乂時又良朝玉帛會衣裳基同北辰久壽共南山長黎元鼓腹樂未央宴羣臣登歌辭皇明馭歷仁深海縣載擇良辰式陳高宴顒顒卿士昂昂侯甸車旗煜爚衣纓葱蒨樂正展懸司宮飾殿三揖稱禮九賓為傳圓鼎臨碑方壺在面鹿鳴成曲嘉魚入薦筐篚相輝獻酬交徧飲和飽德恩風長扇文舞歌辭天眷有屬后德惟明君臨萬宇昭事百靈濯以江漢樹之風聲罄地必歸窮天皆至六戎仰朔八蠻請吏煙雲獻彩龜龍表異緝和禮樂燮理陰陽功由舞見德以歌彰兩儀同大日月齊光武舞歌辭惟皇御宇惟帝乘乾五材並用七德兼宣平暴夷險拯溺救燔九域載安兆庶斯賴續地之厚補天之大聲隆有截化覃無外鼓鍾既奮干戚攸陳功高德重政謐化淳鴻休永播久而彌新大射登歌辭道謐金科照時乂玉條明優賢饗禮洽選德射儀成鑾旗鬱雲動寶軑儼天行巾車整三乏司裘飾五正鳴球響高殿華鍾震廣庭烏號傳昔美淇衞著前名揖讓皆時傑升降盡朝英附枝觀體定杯水覩心平豐觚既來去燔炙復從橫欣看禮樂盛喜遇黃河清凱樂歌辭三首述帝德於穆我后睿哲欽明膺天之命載育羣生開元創曆邁德垂聲朝宗萬宇祗事百靈煥乎皇道昭哉帝則惠政滂流仁風四塞淮海未賓江湖背德運籌必勝濯征斯克八荒霧卷四表雲褰雄圖盛略邁後光前寰區已泰福祚方延長歌凱樂天子萬年述諸軍用命帝德遠覃天維宏布功高雲天聲隆韶護惟彼海隅未從王度皇赫斯怒元戎啟路桓桓猛將赳赳英謨攻如燎髮戰似摧枯救茲塗炭克彼妖逋塵清兩越氣靜三吳鯨鯢已夷封疆載闢班馬蕭蕭歸旌弈弈雲臺表効司勳紀績業並山河道固金石述天下太平阪泉軒德丹浦堯勳始實以武終乃以文嘉樂聖主大哉為君出師命將廓定重氛書軌既幷干戈是戢弘風設教政成人立禮樂聿興衣裳載緝風雲自美嘉祥爰集皇皇聖政穆穆神猷牢籠虞夏度越姬劉日月比曜天地同休永清四海長帝九州皇后房內歌辭至順垂典正內弘風母儀萬國訓範六宮求賢啟化進善宣功家邦載序道業斯融大業元年煬帝又詔修高廟樂曰古先哲王經國成務莫不因人心而制禮則天明而作樂昔漢氏諸廟別所樂亦不同至於光武之後始立共堂之制魏文承運初營廟寢太祖一室獨為別宮自茲之後兵車交爭制作規模日不暇給伏惟高祖文皇帝功侔造物道濟生靈享薦宜殊樂舞須別今若月祭時饗既與諸祖共庭至於舞功獨於一室交違禮意未合人情其詳議以聞有司未及陳奏帝又以禮樂之事總付祕書監柳顧言少府副監何稠著作郎諸葛潁祕書郎袁慶隆等增多開皇樂器大益樂員郊廟樂懸並令新製顧言等後親帝復難於改作其議竟寢諸郊廟歌辭亦並依舊制唯新造高祖廟歌九首今亡又遣祕書省學士定殿前樂工歌十四首終大業世每舉用焉帝又詔博訪知鍾律歌管者皆追之時有曹士立裴文通唐羅漢常寶金等雖知操弄雅鄭莫分然總付太常詳令刪定議修一百四曲其五曲在宮調黃鍾也一曲應調大呂也二十五曲商調太簇也一十四曲角調姑洗也一十三曲變徵調蕤賓也八曲徵調林鍾也二十五曲羽調南呂也一十三曲變宮調應鍾也其曲大抵以詩為本參以古調漸欲播之弦歌被之金石仍屬戎車不遑刊正禮樂之事竟無成功焉自漢至梁陳樂工其大數不相踰越及周幷齊隋幷陳各得其樂工多為編戶至六年帝乃大括魏齊周陳樂人子弟悉配太常並於關中為坊置之其數益多前代顧言等又奏仙都宮內四時祭享還用太廟之樂歌功論德別製其辭七廟同院樂依舊式又造饗宴殿庭宮懸樂器布陳簨簴大抵同前而於四隅各加二建鼓三案又設十二鎛鎛別鍾磬二架各依辰位為調合三十六架至於音律節奏皆依雅曲意在演令繁會自梁武帝之始也開皇時廢不用至是又復焉高祖時宮懸樂器唯有一部殿庭饗宴用之平陳所獲又有二部宗廟郊丘分用之至是並於樂府藏而不用更造三部五郊二十架工一百四十三人廟庭二十架工一百五十人饗宴二十架工一百七人舞郎各二等並一百三十二人顧言又增房內樂益其鍾磬奏議曰房內樂者主為王后弦歌諷誦而事君子故以房室為名燕禮鄉飲酒禮亦取而用也故云用之鄉人焉用之邦國焉文王之風由近及遠鄉樂以感人須存雅正既不設鍾鼓義無四懸何以取正於婦道也磬師職云燕樂之鍾磬鄭玄曰燕樂房內樂也所謂陰聲金石備矣以此而論房內之樂非獨弦歌必有鍾磬也內宰職云正后服位詔其禮樂之儀鄭玄云薦撤之禮當與樂相應薦撤之言雖施祭祀其入出賓客理亦宜同請以歌鍾歌磬各設二虡土革絲竹並副之幷升歌下管總名房內之樂女奴肄習朝燕用之制曰可於是內宮懸二十虡其鎛鍾十二皆以大磬充去建鼓餘飾並與殿庭同皇太子軒懸去南面設三鎛鍾於辰丑申三建鼓亦如之編鍾三虡編磬三虡共三鎛鍾為九虡其登歌減者二人簨虡金三博山樂器應漆者朱漆之其二舞用六佾其雅樂鼓吹多依開皇之故雅樂合二十器今列之如左金之屬二一曰鎛鍾每鍾懸一簨虡各應律呂之音即黃帝所命伶倫鑄十二鍾和五音者也二曰編鍾小鍾也各應律呂大小以次編而懸之上下皆八合十六鍾懸於一簨虡石之屬一曰磬用玉若石為之懸如編鍾之法絲之屬四一曰琴神農制為五弦周文王加二弦為七者也二曰瑟二十七弦伏犧所作者也三曰筑十二弦四曰箏十三弦所謂秦聲蒙恬所作者也竹之屬三一曰簫十六管長二尺舜所造者也二曰篪長尺四寸八孔蘇公所作者也三曰笛凡十二孔漢武帝時丘仲所作者也京房備五音有七孔以應七聲黃鍾之笛長二尺八寸四分四釐有奇其餘亦上下相次以為長短匏之屬二一曰笙二曰竽並女媧之所作也笙列管十九於匏內施簧而吹之竽大三十六管土之屬一曰塤六孔暴辛公之所作者也革之屬五一曰建鼓夏后氏加四足謂之足鼓殷人柱貫之謂之楹鼓周人懸之謂之懸鼓近代相承植而貫之謂之建鼓蓋殷所作也又棲翔鷺於其上不知何代所加或曰鵠也取其聲揚而遠聞或曰鷺鼓精也越王勾踐擊大鼓於雷門以厭吳晉時移於建康有雙鷺鼓而飛入雲或曰皆非也詩云振振鷺鷺于飛鼓咽咽醉言歸古之君子悲周道之衰頌聲之輟飾鼓以鷺存其風流未知孰是靈鼓靈鼗並八面雷鼓雷鼗六面路鼓路鼗四面鼓以桴擊鼗貫其中而手搖之又有節鼓不知誰所造也木之屬二一曰柷如桶方二尺八寸中有椎柄連底動之令左右擊以節樂二曰敔如伏獸背有二十七鉏鋙以竹長尺橫櫟之以止樂焉簨虡所以懸鍾磬橫曰簨飾以鱗屬植曰虡飾以臝及羽屬簨加木板於上謂之業殷人刻其上為崇牙以挂懸周人畫繒為戴之以璧垂五采羽於其下樹於簨虡之角近代又加金博山於簨上垂流蘇以合采羽五代相因同用之始開皇初定令置七部樂一曰國伎二曰清商伎三曰高麗伎四曰天竺伎五曰安國伎六曰龜茲伎七曰文康伎又雜有疎勒扶南康國百濟突厥新羅倭國等伎其後牛弘請存鞞鐸巾拂等四舞與新伎並陳因稱四舞按漢魏以來並施於宴饗鞞舞漢巴渝舞也至章帝造鞞舞辭云關東有賢女魏明代漢曲云明明魏皇帝鐸舞傅玄代魏辭云振鐸鳴金成公綏賦云鞞鐸舞庭八音並陳是也拂舞者沈約宋志云吳舞吳人思晉化其辭本云白符鳩是也巾舞者公莫舞也伏滔云項莊因舞欲劍高祖項伯紆長袖以扞其鋒魏晉傳為舞焉檢此雖非正樂亦前代舊聲故梁武報沈約云鞞鐸巾拂古之遺風楊泓云此舞本二八人桓玄即真為八佾後因而不改齊人王僧虔已論其事平陳所得者猶充八佾於懸內繼二舞後作之為失斯大檢四舞由來其實已久請並在宴會與雜伎同設於西涼前奏之帝曰其聲音節奏及舞悉宜依舊惟舞人不須捉鞞拂等及大業中煬帝乃定清樂西涼龜茲天竺康國疎勒安國高麗禮畢以為九部樂器工衣創造既成大備於茲矣清樂其始即清商三調是也並漢來舊曲樂器形制幷歌章古辭與魏三祖所作者皆被於史籍屬晉朝遷播夷羯竊據其音分散苻永固平張氏始於涼州得之宋武平關中因而入南不復存於內地及平陳後獲之高祖聽之善其節奏曰此華夏正聲也昔因永嘉流於江外我受天明命今復會同雖賞逐時遷而古致猶在可以此為本微更損益去其哀怨考而補之以新定律呂更造樂器其歌曲有陽伴舞曲有明君幷契其樂器有鍾磬琴瑟擊琴琵琶箜篌筑箏節鼓笙笛簫篪塤等十五種為一部工二十五人西涼者起苻氏之末呂光沮渠蒙遜等據有涼州變龜茲聲為之號為秦漢伎魏太武既平河西得之謂之西涼樂至魏周之際遂謂之國伎今曲項琵琶豎頭箜篌之徒並出自西域非華夏舊器楊澤新聲神白馬之類生於胡戎胡戎歌非漢魏遺曲故其樂器聲調悉與書史不同其歌曲有永世樂解曲有萬世豐舞曲有于闐佛曲其樂器有鍾磬彈箏搊箏臥箜篌豎箜篌琵琶五絃笙簫大篳篥長笛小篳篥橫笛腰鼓齊鼓擔鼓銅拔貝等十九種為一部工二十七人龜茲者起自呂光滅龜茲因得其聲呂氏亡其樂分散後魏平中原復獲之其聲後多變易至隋有西國龜茲齊朝龜茲土龜茲等凡三部開皇中其器大盛於閭閈時有曹妙達王長通李士衡郭金樂安進貴等皆妙絕弦管新聲奇變朝改暮易持其音技估衒公王之間舉時爭相慕尚高祖病之謂羣臣曰聞公等皆好新變所奏無復正聲此不祥之大也自家形國化成人風勿謂天下方然公家家自有風俗矣存亡善惡莫不繫之樂感人深事資和雅公等對親賓宴飲宜奏正聲聲不正何可使兒女聞也帝雖有此勑而竟不能救焉煬帝不解音律略不關懷後大製豔篇辭極淫綺令樂正白明達造新聲創萬歲樂藏鈎樂七夕相逢樂投壺樂舞席同心髻玉女行觴神仙留客擲磚續命鬬雞子鬬百草汎龍舟還舊宮長樂花及十二時等曲掩抑摧藏哀音斷絕帝悅之無已謂幸臣曰多彈曲者如人多讀書讀書多則能撰書彈曲多即能造曲此理之然也因語明達云齊氏偏隅曹妙達猶自封王我今天下大同欲貴汝宜自修謹六年高昌獻聖明樂曲帝令知音者於館所聽之歸而肄習及客方獻先於前奏之胡夷皆驚焉其歌曲有善善摩尼解曲有婆伽兒舞曲有小天又有疎勒鹽其樂器有豎箜篌琵琶五弦笙笛簫篳篥毛員鼓都曇鼓答臘鼓腰鼓羯鼓雞婁鼓銅拔貝等十五種為一部工二十人天竺者起自張重華據有涼州重四譯來貢男伎天竺即其樂焉歌曲有沙石疆舞曲有天曲樂器有鳳首箜篌琵琶五弦笛銅鼓毛員鼓都曇鼓銅拔貝等九種為一部工十二人康國起自周武帝娉北狄為后得其所獲西戎伎因其聲歌曲有戢殿農和正舞曲有賀蘭鉢鼻始末奚波地農惠鉢鼻始前拔地惠地等四曲樂器有笛正鼓加鼓銅拔等四種為一部工七人疎勒安國高麗並起自後魏平馮氏及通西域因得其伎後漸繁會其聲以別於太樂疎勒歌曲有亢利死讓樂舞曲有遠服解曲有鹽曲樂器有豎箜篌琵琶五弦笛簫篳篥答臘鼓腰鼓羯鼓雞婁鼓等十種為一部工十二人安國歌曲有附薩單時舞曲有末奚解曲有居和祗樂器有箜篌琵琶五弦笛簫篳篥雙篳篥正鼓和鼓銅拔等十種為一部工十二人高麗歌曲有芝栖舞曲有歌芝栖樂器有彈箏臥箜篌豎箜篌琵琶五弦笛笙簫小篳篥桃皮篳篥腰鼓齊鼓擔鼓貝等十四種為一部工十八人禮畢者本出自晉太尉庾亮家亮卒其伎追思亮因假為其面執翳以舞象其容取其諡以號之謂之為文康樂每奏九部樂終則陳之故以禮畢為名其行曲有單交路舞曲有散花樂器有笛笙簫篪鈴槃鞞腰鼓等七種三懸為一部工二十二人始齊武平中有魚龍爛漫俳優朱儒山車巨象拔井種瓜殺馬剝驢等奇怪異端百有餘物名為百戲周時鄭譯有寵於宣帝奏徵齊散樂人並會京師為之蓋秦角抵之流者也開皇初並放遣之及大業二年突厥染干來朝煬帝欲誇之總追四方散樂大集東都初於芳華苑積翠池側帝帷宮女觀之有舍利先來戲於場內須臾跳躍激水滿衢黿鼉龜鼇水人蟲魚徧覆于地又有大鯨魚噴霧翳日忽化成黃龍長七八丈聳踊而出名曰黃龍變又以繩繫兩柱相去十丈遣二倡女對舞繩上相逢切肩而過歌舞不輟又為夏育扛鼎取車輪石臼大甕器等各於掌上而跳弄之幷二人戴竿其上有舞忽然騰透而換易之又有神鼇負山幻人吐火千變萬化曠古莫儔染干大駭之自是皆於太常教習每歲正月萬國來朝留至十五日於端門外建國門內綿亘八里列為戲場百官起棚夾路從昏達旦以縱觀之至晦而罷伎人皆衣錦繡繒綵其歌舞者多為婦人服鳴環佩飾以花毦者殆三萬人初課京兆河南製此衣服而兩京繒錦為之中虛三年駕幸榆林突厥啟民朝于行宮帝又設以示之六年諸夷大獻方物突厥啟民以下皆國主親來朝賀乃於天津街盛陳百戲自海內凡有奇伎無不總萃崇侈器玩盛飾衣服皆用珠翠金銀錦罽絺繡其營費鉅億萬關西以安德王雄總之東都以齊王暕總之金石匏革之聲聞數十里外彈弦擫管以上一萬八千人大列炬火光燭天地百戲之盛振古無比自是每年以為常焉故事天子有事於太廟備法駕陳羽葆以入于次禮畢升車而鼓吹並作開皇十七年詔曰昔五帝異樂三王殊禮皆隨事而有損益因情而立節文仰惟祭享宗廟瞻敬如在罔極之感情深茲日而禮畢升路鼓吹發音還入宮門金石振響斯則哀樂同日心事相違情所不安理實未允宜改茲往式用弘禮教自今以後享廟日不須設鼓吹殿庭勿設樂懸在廟內及諸祭並依舊其王公已下祭私廟日不得作音樂至大業中煬帝制宴饗設鼓吹依梁為十二案案別有錞于鉦鐸軍樂鼓吹等一部案下皆熊羆貙豹騰倚承之以象百獸之舞其大駕鼓吹並朱漆畫大駕鼓吹小鼓加金鐲羽葆鼓鐃鼓節鼓皆五采重蓋其羽葆鼓仍飾以羽葆長鳴中鳴大小橫吹五采衣幡緋掌畫交龍五采脚大角幡亦如之大鼓長鳴大橫吹節鼓及橫吹後笛簫篳篥笳桃皮篳篥等工人服皆緋地苣文為袍袴及帽金鉦棡鼓其鉦鼓皆加八角紫傘小鼓中鳴小橫吹及橫吹後笛簫篳篥笳桃皮篳篥等工人服並青地苣文袍袴及帽羽葆鼓鐃及歌簫笳工人服並武弁朱衣革帶大角工人平巾幘緋衫白布大口袴其鼓吹督帥服與大角同以下準督帥服亦如之棡鼓一曲十二變與金鉦同夜警用一曲俱盡次奏大鼓大鼓一十五曲供大駕一十二曲供皇太子一十曲供王公等小鼓九曲供大駕三曲供皇太子及王公等長鳴色角一百二十具供大駕三十六具供皇太子十八具供王公等次鳴色角一百二十具供大駕十二具供皇太子一十具供王公等大角第一曲起捉馬第二曲被馬第三曲騎馬第四曲行第五曲入陣第六曲收軍第七曲下營皆以三通為一曲其辭並本之鮮卑鐃鼓十二曲供大駕六曲供皇太子三曲供王公等其樂器有鼓幷歌簫笳大橫吹二十九曲供大駕九曲供皇太子七曲供王公其樂器有角節鼓笛簫篳篥笳桃皮篳篥小橫吹十二曲供大駕夜警則十二曲俱用其樂器有角笛簫篳篥笳桃皮篳篥

body:
  text: 隋書卷五十八列傳第二十三明克讓明克讓字弘道平原鬲人也父山賓梁侍中克讓少好儒雅善談論博涉書史所覽將萬卷三禮禮論尤所研精龜策曆象咸得其妙年十四釋褐湘東王法曹參軍時舍人朱异在儀賢堂講老子克讓預焉堂邊有修竹异令克讓詠之克讓攬筆輒成其卒章曰非君多愛賞誰貴此貞心异甚奇之仕歷司徒祭酒尚書都官郎中散騎侍郎兼國子博士中書侍郎梁滅歸于長安周明帝引為麟趾殿學士俄授著作上士轉外史下大夫出為衛王友歷漢東南陳二郡守武帝即位復徵為露門學士令與太史官屬正定新曆拜儀同三司纍遷司調大夫賜爵歷城縣伯邑五百戶高祖受禪拜太子內舍人轉率更令進爵為侯太子以師道處之恩禮甚厚每有四方珍味輒以賜之時東宮盛徵天下才學之士至於博物洽聞皆出其下詔與太常牛弘等修禮議樂當朝典故多所裁正開皇十四年以疾去官加通直散騎常侍卒年七十上甚傷惜焉賻物五百段米三百石太子又贈絹布二千匹錢十萬朝服一具給棺槨著孝經義疏一部古今帝代記一卷文類四卷續名僧記一卷集二十卷子餘慶官至司門郎越王侗稱制為國子祭酒魏淡魏淡字彥深巨鹿下曲陽人也祖鸞魏光州刺史父季景齊大司農卿稱為著姓世以文學自業淡年十五而孤專精好學博涉經史善屬文詞采贍逸齊博陵王濟聞其名引為記室及琅邪王儼為京畿大都督以淡為鎧曹參軍轉殿中侍御史尋與尚書左僕射魏收吏部尚書陽休之國子博士熊安生同修五禮又與諸學士撰御覽書成除殿中郎中中書舍人復與李德林俱修國史周武帝平齊授納言中士及高祖受禪出為行臺禮部侍郎尋為散騎常侍聘陳主使還除太子舍人廢太子勇深禮遇之屢加優錫令注庾信集復撰笑苑詞林集世稱其博物數年遷著作郎仍為太子學士高祖以魏收所撰書褒貶失實平繪為中興書事不倫序詔淡別成魏史淡自道武下及恭帝為十二紀七十八傳別為史論及例一卷並目録合九十二卷淡之義例與魏收多所不同其一曰臣聞天子者繼天立極終始絶名故穀梁傳曰太上不名典禮曰天子不言出諸侯不生名諸侯尚不生名況天子乎若為太子必須書名良由子者對父生稱父前子名禮之意也是以桓公六年九月丁卯子同生傳曰舉以太子之禮杜預注云桓公子莊公也十二公唯子同是嫡夫人之長子備用太子之禮故史書之於策即位之日尊成君而不名春秋之義聖人之微旨也至如馬遷周之太子並皆言名漢之儲兩俱沒其諱以尊漢卑周臣子之意也竊謂雖立此理恐非其義何者春秋禮記太子必書名天王不言出此仲尼之褒貶皇王之稱謂非當時與異代遂為優劣也班固范曄陳壽王隱沈約參差不同尊卑失序至於魏收諱儲君之名書天子之字過又甚焉今所撰史諱皇帝名書太子字欲以尊君卑臣依春秋之義也其二曰五帝之聖三代之英積德纍功乃文乃武賢聖相承莫過周室名器不及后稷追諡止於三王此即前代之茂實後人之龜鏡也魏氏平文以前部落之君長耳太祖遠追二十八帝並極崇高違堯舜憲章越周公典禮但道武出自結繩未師典誥當須南董直筆裁而正之反更飾非言是觀過所謂決渤澥之水復去隄防襄陵之災未可免也但力微天女所誕靈異絶世尊為始祖得禮之宜平文昭成雄據塞表英風漸盛圖南之業基自此始長孫斤之亂也兵交御坐太子授命昭成獲免道武此時后緡方娠宗廟復存社稷有主大功大孝實在獻明此之三世稱諡可也自茲以外未之敢聞其三曰臣以為南巢桀亡牧野紂滅斬以黃鉞懸首白旗幽王死於驪山厲王出奔於彘未嘗隱諱直筆書之欲以勸善懲惡貽誡將來者也而太武獻文並皆非命前史立紀不異天年言論之間頗露首尾殺主害君莫知名姓逆臣賊子何所懼哉君子之過如日月之食圓首方足孰不瞻仰況復兵交御坐矢及王屋而可隱沒者乎今所撰史分明直書不敢回避且隱桓之死閔昭殺逐丘明據實於經下況復懸隔異代而致依違哉其四曰周道陵遲不勝其敝楚子親問九鼎吳人來徵百牢無君之心實彰行路夫子刊經皆書曰卒自晉德不競宇宙分崩或帝或王各自署置當其生日聘使往來略如敵國及其終也書之曰死便同庶人存沒頓殊能無懷愧今所撰史諸國凡處華夏之地者皆書曰卒同之吳楚其五曰壺遂發問馬遷答之義已盡矣後之述者仍未領悟董仲舒司馬遷之意本云尚書者隆平之典春秋者撥亂之法興衰理異制作亦殊治定則直欽明世亂則辭兼顯晦分路命家不相依放故云周道廢春秋作焉堯舜盛尚書載之是也漢興以來改正朔易服色臣力誦聖德仍不能盡余所謂述故事而君比之春秋謬哉然則紀傳之體出自尚書不學春秋明矣而范曄云春秋者文既總略好失事形今之擬作所以為短紀傳者史班之所變也網羅一代事義周悉適之後學此焉為優故繼而述之觀曄此言豈直非聖人之無法又失馬遷之意旨孫盛自謂鑽仰具體而放之魏收云魯史既修達者貽則子長自拘紀傳不存師表蓋泉源所由地非企及雖復遜辭畏聖亦未思紀傳所由來也淡又以為司馬遷創立紀傳以來述者非一人無善惡皆為立論計在身行迹具在正書事既無奇不足懲勸再述乍同銘頌重唯覺繁文案丘明亞聖之才發揚聖旨言君子曰者無非甚泰其間尋常直書而已今所撰史竊有慕焉可為勸戒者論其得失其無損益者所不論也淡所著魏書甚簡要大矯收繪之失上覽而善之未幾卒時年六十五有文集三十卷行於世子信言頗知名淡弟彥玄有文學歷揚州總管府記室洧州司馬有子滿行陸爽侯白陸爽字開明魏郡臨漳人也祖順宗魏南青州刺史父概之齊霍州刺史爽少聰敏年九歲就學日誦二千餘言齊尚書僕射楊遵彥見而異之曰陸氏代有人焉年十七齊司州牧清河王嶽召為主簿擢殿中侍御史俄兼治書纍轉中書侍郎及齊滅周武帝聞其名與陽休之袁叔德等十餘人俱徵入關諸人多將輜重爽獨載書數千卷至長安授宣納上士高祖受禪轉太子內直監尋遷太子洗馬與左庶子宇文愷等撰東宮典記七十卷朝廷以其博學有口辨陳人至境常令迎勞開皇十一年卒官時年五十三贈上儀同宣州刺史賜帛百匹子法言敏學有家風釋褐承奉郎初爽之為洗馬嘗奏高祖云皇太子諸子未有嘉名請依春秋之義更立名字上從之及太子廢上追怒爽云我孫製名寧不自解陸爽乃爾多事扇惑於勇亦由此人其身雖故子孫並宜屏黜終身不齒法言竟坐除名爽同郡侯白字君素好學有捷才性滑稽尤辨俊舉秀才為儒林郎通侻不恃威儀好為誹諧雜說人多愛狎之所在之處觀者如市楊素甚狎之素嘗與牛弘退朝白謂素曰日之夕矣素大笑曰以我為牛羊下來邪高祖聞其名召與語甚悅之令於祕書修國史每將擢之高祖輒曰侯白不勝官而止後給五品食月餘而死時人傷其薄命著旌異記十五卷行於世杜臺卿杜臺卿字少山博陵曲陽人也父弼齊衛尉卿臺卿少好學博覽書記解屬文仕齊奉朝請歷司空西閣祭酒司徒戶曹著作郎中書黃門侍郎性儒素每以雅道自居及周武帝平齊歸于鄉里以禮記春秋講授子弟開皇初被徵入朝臺卿嘗采月令觸類而廣之為書名玉燭寶典十二卷至是奏之賜絹二百匹臺卿患聾不堪吏職請修國史上許之拜著作郎十四年上表請致仕勑以本官還第數載終於家有集十五卷撰齊記二十卷並行於世無子有兄蕤學業不如臺卿而幹局過之仕至開州刺史子公贍少好學有家風卒於安陽令公贍子之松大業中為起居舍人辛德源辛德源字孝基隴西狄道人也祖穆魏平原太守父子馥尚書右丞德源沉靜好學年十四解屬文及長博覽書記少有重名齊尚書僕射楊遵彥殿中尚書辛術皆一時名士見德源並虛襟禮敬因同薦之於文宣帝起家奉朝請後為兼員外散騎侍郎聘梁使副後歷馮翊華山二王記室中書侍郎劉逖上表薦德源曰弱齡好古晚節逾厲枕藉六經漁獵百氏文章綺豔體調清華恭慎表於閨門謙撝著於朋執實後進之辭人當今之雅器必能效節一官騁足千里由是除員外散騎侍郎纍遷比部郎中復兼通直散騎常侍聘于陳及還待詔文林館除尚書考功郎中轉中書舍人及齊滅仕周為宣納上士因取急詣相州會尉迥作亂以為中郎德源辭不獲免遂亡去高祖受禪不得調者久之隱於林慮山鬱鬱不得志著幽居賦以自寄文多不載德源素與武陽太守盧思道友善時相往來魏州刺史崔彥武奏德源潛為交結恐其有姦計由是謫令從軍討南寧歲餘而還祕書監牛弘以德源才學顯著奏與著作郎王劭同修國史德源每於務隙撰集注春秋三傳三十卷注揚子法言二十三卷蜀王秀聞其名而引之居數歲奏以為掾後轉咨議參軍卒官有集二十卷又撰政訓內訓各二十卷有子素臣正臣並學涉有文義柳柳字顧言本河東人也永嘉之亂徙家襄陽祖惔梁侍中父暉都官尚書少聰敏解屬文好讀書所覽將萬卷仕梁釋褐著作佐郎後蕭察據荊州以為侍中領國子祭酒吏部尚書及梁國廢拜開府通直散騎常侍尋遷內史侍郎以無吏幹去職轉晉王咨議參軍王好文雅招引才學之士諸葛潁虞世南王胄朱瑒等百餘人以充學士而為之冠王以師友處之每有文什必令其潤色然後示人嘗朝京師還作歸藩賦命為序詞甚典麗初王屬文為庾信體及見已後文體遂變仁壽初引為東宮學士加通直散騎常侍檢校洗馬甚見親待每召入臥內與之宴謔尤俊辨多在侍從有所顧問應答如響性又嗜酒言雜誹諧由是彌為太子之所親狎以其好內典令撰法華玄宗為二十卷奏之太子覽而大悅賞賜優洽儕輩莫與為比煬帝嗣位拜祕書監封漢南縣公帝退朝之後便命入閣言宴諷讀終日而罷帝每與嬪后對酒時逢興會輒遣命之至與同榻共席恩若友朋帝猶恨不能夜召於是命匠刻木偶人施機關能坐起拜伏以像於帝每在月下對酒輒令宮人置之於座與相酬酢而為歡笑從幸揚州遇疾卒年六十九帝傷惜者久之贈大將軍諡曰康撰晉王北伐記十五卷有集十卷行於世許善心許善心字務本高陽北新城人也祖懋梁太子中庶子始平天門二郡守散騎常侍父亨仕梁至給事黃門侍郎在陳歷羽林監太中大夫衛尉卿領大著作善心九歲而孤為母范氏所鞠養幼聰明有思理所聞輒能誦記多聞默識為當世所稱家有舊書萬餘卷皆遍通涉十五解屬文箋上父友徐陵陵大奇之謂人曰才調極高此神童也起家除新安王法曹太子詹事江總舉秀才對策高第授度支郎中轉侍郎補撰史學士禎明二年加通直散騎常侍聘於隋遇高祖伐陳禮成而不獲反命纍表請辭上不許留縶賓館及陳亡高祖遣使告之善心衰服號哭於西階之下藉草東向經三日勑書唁焉明日有詔就館拜通直散騎常侍賜衣一襲善心哭盡哀入房改服復出北面立垂涕再拜受詔明日乃朝伏泣於殿下悲不能興上顧左右曰我平陳國唯獲此人既能懷其舊君即是我誠臣也勑以本官直門下省賜物千段草馬二十匹從幸太山還授虞部侍郎十六年有神雀降於含章闥高祖召百官賜宴告以此瑞善心於座請紙筆製神雀頌其詞曰臣聞觀象則天乾元合其德觀法審地域大表其尊雨施雲行四時所以生殺川流嶽立萬物於是裁成出震乘離之君紀司鳳之后玉錘玉斗而降金版金縢以傳並陶冶性靈含煦動植眇玄珠於赤水寂明鏡乎虛堂莫不景福氤氳嘉貺雥集馳聲南董越響雲韶粵我皇帝之君臨闡大方抗太極負鳳邸據龍圖不言行焉攝提建指不肅清焉喉鈴啓閉括地復夏截海翦商就望體其尊登咸昌其會綿區浹宇遐至邇安騰實飛聲直暢傍施無體之禮威儀布政之宮無聲之樂綴兆總章之觀上庠養老躬問百年下土字民心為百姓月棲日浴熱坂寒門吹鱗沒羽之荒赤蛇青馬之裔解辮請吏削衽承風豈止呼韓北埸俯勒狼居之岫熄慎南境近表不耐之城故使天弗愛道地寧吝寶川嶽展異幽明效靈狎素游頳團膏醴半景青赤孳歷虧盈足足懷仁般般擾義祥祐之來若此升隆之化如彼而登封盛典云亭佇白檢之儀致治成功柴燎靡玄圭之告雖奉常定禮武騎草文天子抑而未行推而不有允恭克讓其在斯乎七十二君信蔑如也故神禽顯賁玄應特昭白爵主鐵豸之奇赤爵銜丹書之貴班固神爵之頌履武戴文曹植嘉爵之篇棲庭集牖未若于飛武帳來賀文刷采青蒲將翱赤罽玉几朝御取玩軒楯之間金門旦開兼留翬翟之鑒終古曠世未或前聞福召冥徵得之茲日歲次上章律諧大呂玄枵會節玄英統時至尊未明求衣晨興於含章之殿爰有瑞爵翱翔而下載行載止當扆寧而徐前來集來儀承軒墀而顧步夫瑞者符也明主之休徵雀者爵也聖人之大寶謹案考異郵云軒轅有黃爵赤頭立日傍占云土精之應又禮稽命徵云祭祀合其宜則黃爵集昔漢集泰畤之殿魏下文昌之宮一見雍丘之祠三入平東之府並旁觀回矚事陋人微奚足稱矣抑又聞之不刳胎剖卵則鸞鳳馴鳴不漉浸焚原則螭龍盤蜿是知陛下止殺故飛走宅心皇慈好生而浮潛育德臣面奉綸綍垂示休祥預承嘉宴不勝藻躍李虔僻處西土陸機少長東隅微臣慚於往賢逢時盛乎曩代輒竭庸瑣敢獻頌云太素式肇大德資生功玄不器道要無名質文鼎革沿習因成祥圖瑞史赫赫明明天保大定於鑠我君武義乃武文教惟文橫塞宇宙旁凝射汾軒物重造姚風再薰煥發王策昭彰帝道御地七神飛天五老山祇吐祕河靈孕寶黑羽升壇青鱗伏皂丹烏流火白雉從風棲阿德劭鳴岐祚隆未如神爵近賀王宮五靈何有百福攸同孔圖獻赤荀文表白節節奇音行行瑞跡化玉黼扆銜環陛戟上天之命明神所格綏應在旃伊臣預焉永緝韋素方流管絃頌歌不足蹈無宣臣拜稽首億萬斯年頌成奏之高祖甚悅曰我見神雀共皇后觀之今旦召公等入適述此事善心於座始知即能成頌文不加點筆不停豪常聞此言今見其事因賜物二百段十七年除祕書丞于時祕藏圖籍尚多淆亂善心放阮孝緒七録更製七林各為總冠於篇首又於部録之下明作者之意區分其類例焉又奏追李文博陸從典等學者十許人正定經史錯謬仁壽元年攝黃門侍郎二年加攝太常少卿與牛弘等議定禮樂祕書丞黃門並如故四年留守京師高祖崩于仁壽宮煬帝祕喪不發先易留守官人出除巖州刺史逢漢王諒反不之官大元年轉禮部侍郎奏薦儒者徐文遠為國子博士包愷陸德明禇徽魯世達之輩並加品秩授為學官其年副納言楊達為冀州道大使以稱旨賜物五百段左衛大將軍宇文述每旦借本部兵數十人以供私役常半日而罷攝御史大夫梁毗奏劾之上方以腹心委述初付法推千餘人皆稱被役經二十餘日法官候伺上意乃言役不滿日其數雖多不合通計縱令有實亦當無罪諸兵士聞之更云初不被役上欲釋之付議虛實百僚咸議為虛善心以為述於仗衛之所抽兵私役雖不滿日闕於宿衛與常役所部情狀乃殊又兵多下番散還本府分道追至不謀同辭今殆一月方始翻覆姦狀分明此何可捨蘇威楊汪等二十餘人同善心之議其餘皆議免罪煬帝可免罪之奏後數月述譖善心曰陳叔寶卒善心與周羅虞世基袁充蔡徵等同往送葬善心為祭文謂為陛下敢於今日加叔寶尊號召問有實自援古例事得釋而帝甚惡之又太史奏帝即位之年與堯時符合善心議以國哀甫爾不宜稱賀述諷御史劾之左遷給事郎降品二等四年撰方物志奏之七年從至涿郡帝方自御戎以東討善心上封事忤旨免官其年復徵為守給事郎九年攝左翊衛長史從渡遼授建節尉帝嘗言及高祖受命之符因問鬼神之事勑善心與崔祖璿撰靈異記十卷初善心父撰著梁史未就而歿善心述成父志修續家書其序傳末述制作之意曰謹案太素將萌洪荒初判乾儀資始辰象所以正時峍載厚生品物於焉播氣參三才而育德肖二統而降靈有人民焉樹之君長有貴賤矣為其宗極保上天之眷命膺下土之樂推莫不執大方振長策感召風雲驅馳英俊干戈揖讓取之也殊功鼎玉龜符成之也一致革命創制竹素之道稍彰紀事記言筆墨之官漸著炎農以往存其名而漏其迹黃軒以來晦其文而顯其用登丘納麓具訓誥及典謨貫昴入房傳夏正與殷祀洎辨方正位論時訓功南北左右兼四名之別檮杌乘車擅一家之稱國惡雖諱君舉必書故賊子亂臣天下大懼元龜明鏡昭然可察及三郊遞襲五勝相沿俱稱百谷之王並以四海自任重光纍德何世無哉逮有梁之君臨天下江左建國莫斯為盛受命在於一君繼統傳乎四主克昌四十八載餘祚五十六年武皇帝出自諸生爰升寶曆拯百王之弊救萬姓之危反澆季之末流登上皇之獨道朝多君子野無遺賢禮樂必備憲章咸舉弘深慈於不殺濟大忍於無刑蕩蕩巍巍可為稱首屬陰戎入潁羯胡侵洛沸騰磣黷三季所未聞掃地滔天一元之巨厄廊廟有序翦成狐兔之場圭帛有儀碎夫犬羊之手福善積而身禍仁義在而國亡豈天道歟豈人事歟嘗別論之在序論之卷先君昔在前代早懷述作凡撰齊書為五十卷梁書紀傳隨事勒成及闕而未就者目録注為一百八卷梁室交喪墳籍銷盡冢壁皆殘不准無所盜帷囊同毀陳農何以求秦儒既坑先王之道將墜漢臣徒請口授之文亦絶所撰之書一時亡散有陳初建詔為史官補闕拾遺心識口誦依舊目録更加修撰且成百卷已有六帙五十八卷上祕閣訖善心早嬰荼蓼弗荷薪構太建之末頻抗表聞至德之初蒙授史任方願油素採訪門庭記録俯勵弱才仰成先志而單宗少強近虛室類原顏退屏無所交遊棲遲不求進益假班嗣之書徒聞其語給王隱之筆未見其人加以庸瑣涼能孤陋末學忝職郎署兼撰陳史致此書延時未即成續禎明二年以臺郎入聘值本邑淪覆他鄉播遷行人失時將命不復望都亭而長慟遷別館而懸壺家史舊書在後焚蕩今止有六十八卷在又並缺落失次自入京已來隨見補葺略成七十卷四帝紀八卷后妃一卷三太子録一卷為一帙十卷宗室王侯列傳一帙十卷具臣列傳二帙二十卷外戚傳一卷孝德傳一卷誠臣傳一卷文苑傳二卷儒林傳二卷逸民傳一卷數術傳一卷藩臣傳一卷合一帙十卷止足傳一卷列女傳一卷權幸傳一卷羯賊傳二卷逆臣傳二卷叛臣傳二卷傳論述一卷合一帙十卷凡稱史臣者皆先君所言下稱名案者並善心補闕別為論一篇託于傳之末十年又從至懷遠鎮加授朝散大夫突厥圍雁門攝左親衛武賁郎將領江南兵宿衛殿省駕幸江都郡追前勳授通議大夫詔還本品行給事郎十四年化及殺逆之日隋官盡詣朝堂謁賀善心獨不至許弘仁馳告之曰天子已崩宇文將軍攝政合朝文武莫不咸集天道人事自有代終何預於叔而低徊若此善心怒之不肯隨去弘仁反走上馬泣而言曰將軍於叔全無惡意忽自求死豈不痛哉還告唐奉義以狀白化及遣人就宅執至朝堂化及令釋之善心不舞蹈而出化及目送之曰此人大負氣命捉將來罵云我好欲放你敢如此不遜其黨輒牽曳因遂害之時年六十一及越王稱制贈左光祿大夫高陽縣公諡曰文節善心母范氏梁太子中舍人孝才之女少寡養孤博學有高節高祖知之勑尚食每獻時新常遣分賜嘗詔范入內侍皇后講讀封永樂郡君及善心遇禍范年九十有二臨喪不哭撫柩曰能死國難我有兒矣因臥不食後十餘日亦終李文博博陵李文博性貞介鯁直好學不倦至於教義名理特所留心每讀書至治亂得失忠臣烈士未嘗不反覆吟玩開皇中為羽騎尉特為吏部侍郎薛道衡所知令在聽事帷中披檢書史並察己行事若遇治政善事即抄撰記録如選用疏謬即委之臧否道衡每得其語莫不欣然從之後直祕書內省典校墳籍守道居貧晏如也雖衣食乏絶而清操逾厲不妄通賓客恆以禮法自處儕輩莫不敬憚焉道衡知其貧每延于家給以資費文博商略古今治政得失如指諸掌然無吏幹稍遷校書郎後出為縣丞遂得下考數歲不調道衡為司隸大夫遇之於東都尚書省甚嗟愍之遂奏為從事因為齊王司馬李綱曰今日遂遇文博得奏用之以為歡笑其見賞知音如此在洛下曾詣房玄齡相送於衢路玄齡謂之曰公生平志尚唯在正直今既得為從事故應有會素心比來激濁揚清所為多少文博遂奮臂厲聲曰夫清其流者必潔其源正其末者須端其本今治源混亂雖日免十貪郡守亦何所益其瞽直疾惡不知忌諱皆此類也于時朝政浸壞人多贓賄唯文博不改其操論者以此貴之遭離亂播遷不知所終初文博在內校書虞世基子亦在其內盛飾容服而未有所却文博因從容問之年紀答云十八文博乃謂之曰昔賈誼當此之年議論何事君今徒事儀容故何為者又秦孝王妃生男高祖大喜頒賜羣官各有差文博家道屢空人謂其悅乃云賞罰之設功過所歸今王妃生男於羣官何事乃妄受賞也其循名責實録過計功必使賞罰不濫功過無隱者皆爾文博本為經學後讀史書於諸子及論尤所該洽性長議論亦善屬文著治道集十卷大行於世史臣曰明克讓魏淡等或博學洽聞詞藻贍逸既稱燕趙之俊實曰東南之美所在見寶咸取祿位雖無往非命蓋亦道有存焉淡之魏書時稱簡正條例詳密足傳於後此外諸子各有記述雖道或小大皆志在立言美矣

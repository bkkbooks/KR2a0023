body:
  text: 隋書卷五十一列傳第十六長孫覽從子熾熾弟晟長孫覽字休因河南洛陽人也祖稚魏太師假黃鉞上黨文宣王父紹遠周小宗伯上黨郡公覽性弘雅有器量略涉書記尤曉鍾律魏大統中起家東宮親信周明帝時為大都督武帝在藩與覽親善及即位彌加禮焉超拜車騎大將軍每公卿上奏必令省讀覽有口辨聲氣雄壯凡所宣傳百僚屬目帝每嘉歎之覽初名善帝謂之曰朕以萬機委卿先覽遂賜名焉及誅宇文護以功進封薛國公其後歷小司空從平齊進位柱國封第二子寬管國公宣帝時進位上柱國大司徒俄歷同涇二州刺史高祖為丞相轉宜州刺史開皇二年將有事於江南徵為東南道行軍元帥統八總管出壽陽水陸俱進師臨江陳人大駭會陳宣帝卒覽欲乘釁遂滅之監軍高熲以禮不伐喪而還上常命覽與安德王雄上柱國元諧李充左僕射高熲右衛大將軍虞慶則吳州總管賀若弼等同宴上曰朕昔在周朝備展誠節但苦猜忌每致寒心為臣若此竟何情賴朕之於公義則君臣恩猶父子朕當與公共享終吉罪非謀逆一無所問朕亦知公至誠特付太子宜數參見之庶得漸相親愛柱臣素望實屬於公宜識朕意其恩禮如此又為蜀王秀納覽女為妃其後以母憂去職歲餘起令復位俄轉涇州刺史所在並有政績卒官子洪嗣仕歷宋順臨三州刺史司農少卿北平太守熾字仲光上黨文宣王稚之曾孫也祖裕魏太常卿冀州刺史父兕周開府儀同三司熊絳二州刺史平原侯熾性敏慧美姿儀頗涉羣書兼長武藝建德初武帝尚道法尤好玄言求學兼經史善於談論者為通道館學士熾應其選與英俊並遊通涉彌博建德二年授雍州倉城令尋轉盩厔令頻宰二邑考績連最遷崤郡守入為御正上士高祖作相擢為丞相府功曹參軍加大都督封陽平縣子邑二百戶遷稍伯下大夫其年王謙反熾從信州總管王長述泝江而上以熾為前軍破謙一鎮定楚合等五州擒僞總管荊山公元振以功拜儀同三司及高祖受禪熾率官屬先入清宮即日授內史舍人上儀同三司尋以本官攝判東宮右庶子出入兩宮甚被委遇加以處事周密高祖每稱美之授左領軍長史持節使於東南道三十六州廢置州郡巡省風俗還授太子僕加諫議大夫攝長安令與大興令梁毗俱為稱職然毗以嚴正聞熾以寬平顯為政不同部內各化尋領右常平監遷雍州贊治改封饒良縣子遷鴻臚少卿後數歲轉太常少卿進位開府儀同三司復持節為河南道二十八州巡省大使於路授吏部侍郎大業元年遷大理卿復為西南道大使巡省風俗擢拜戶部尚書吐谷渾寇張掖令熾率精騎五千擊走之追至青海而還以功授銀青光祿大夫六年幸江都宮留熾於東都居守仍攝左候衛將軍事其年卒官時年六十二諡曰靜子安世通事謁者晟字季晟性通敏略涉書記善彈工射趫捷過人時周室尚武貴遊子弟咸以相矜每共馳射時輩皆出其下年十八為司衛上士初未知名人弗之識也唯高祖一見深嗟異焉乃攜其手而謂人曰長孫郎武藝逸羣適與其言又多奇略後之名將非此子邪宣帝時突厥攝圖請婚于周以趙王招女妻之然周與攝圖各相誇競妙選驍勇以充使者因遣晟副汝南公宇文神慶送千金公主至其牙前後使人數十輩攝圖多不禮見晟而獨愛焉每共遊獵留之竟歲嘗有二鵰飛而爭肉因以兩箭與晟曰請射取之晟乃彎弓馳往遇鵰相攫遂一發而雙貫焉攝圖喜命諸子弟貴人皆相親友冀昵近之以學彈射其弟處羅侯號突利設尤得衆心而為攝圖所忌密託心腹陰與晟盟晟與之遊獵因察山川形勢部衆強弱皆盡知之時高祖作相晟以狀白高祖高祖大喜遷奉車都尉至開皇元年攝圖曰我周家親也今隋公自立而不能制復何面目見可賀敦乎因與高寶寧攻陷臨渝鎮約諸面部落謀共南侵高祖新立由是大懼修築長城發兵屯北境命陰壽鎮幽州虞慶則鎮並州屯兵數萬人以為之備晟先知攝圖玷厥阿波突利等叔姪兄弟各統強兵俱號可汗分居四面內懷猜忌外示和同難以力征易可離間因上書曰臣聞喪亂之極必致升平是故上天啓其機聖人成其務伏惟皇帝陛下當百王之末膺千載之期諸夏雖安戎埸尚梗興師致討未是其時棄於度外又復侵擾故宜密運籌策漸以攘之計失則百姓不寧計得則萬代之褔吉凶所係伏願詳思臣於周末忝充外使胸奴倚伏實所具知玷厥之於攝圖兵強而位下外名相屬內隙已彰鼓動其情必將自戰又處羅侯者攝圖之弟姦多而勢弱曲取於衆心國人愛之因為攝圖所忌其心殊不自安迹示彌縫實懷疑懼又阿波首鼠介在其間頗畏攝圖受其牽率唯強是與未有定心今宜遠交而近攻離強而合弱通使玷厥說合阿波則攝圖回兵自防右地又引處羅遣連奚霫則攝圖分衆還備左方首尾猜嫌腹心離阻十數年後承釁討之必可一舉而空其國矣上省表大悅因召與語晟復口陳形勢手畫山川寫其虛實皆如指掌上深嗟異皆納用焉因遣太僕元暉出伊吾道使詣玷厥賜以狼頭纛謬為欽敬禮數甚優玷厥使來引居攝圖使上反間既行果相猜二授晟車騎將軍出黃龍道齎幣賜奚霫契丹等遣為嚮導得至處羅侯所深布心腹誘令內附二年攝圖四十萬騎自蘭州入至于周盤破達奚長儒軍更欲南入玷厥不從引兵而去時晟又說染干詐告攝圖曰鐵勒等反欲襲其牙攝圖乃懼回兵出塞後數月突厥大入發八道元帥分出拒之阿波至涼州與竇榮定戰賊帥纍北時晟為偏將使謂之曰攝圖每來戰皆大勝阿波才入便即致敗此乃突厥之恥豈不內愧於心乎且攝圖之與阿波兵勢本敵今攝圖日勝為衆所崇阿波不利為國生辱攝圖必當因以罪歸於阿波成其夙計滅北牙矣願自量度能禦之乎阿波使至晟又謂之曰今達頭與隋連和而攝圖不能制可汗何不依附天子連結達頭相合為強此萬全之計豈若喪兵負罪歸就攝圖受其戮辱邪阿波納之因留塞上使人隨晟入朝時攝圖與衛王軍遇戰於白道敗走至磧聞阿波懷二乃掩北牙盡獲其衆而殺其母阿波還無所歸西奔玷厥乞師十餘萬東擊攝圖復得故地收散卒數萬與攝圖相攻阿波頻勝其勢益張攝圖又遣使朝貢公主自請改姓乞為帝女上許之四年遣晟副虞慶則使于攝圖賜公主姓為楊氏改封大義公主攝圖奉詔不肯起拜晟進曰突厥與隋俱是大國天子可汗不起安敢違意但可賀敦為帝女則可汗是大隋女壻奈何無禮不敬婦公乎攝圖乃笑謂其達官曰須拜婦公我從之耳於是乃拜詔書使還稱旨授儀同三司左勳衛車騎將軍七年攝圖死遣晟持節拜其弟處羅侯為莫何可汗以其子雍閭為葉護可汗處羅侯因晟奏曰阿波為天所滅與五六千騎在山谷間伏聽詔旨當取之以獻乃召文武議焉樂安公元諧曰請就彼梟首以懲其惡武陽公李充曰請生將入朝顯戮以示百姓上謂晟曰於卿何如晟對曰若突厥背誕須齊之以刑今其昆弟自相夷滅阿波之惡非負國家因其困窮取而為戮恐非招遠之道不如兩存之上曰善八年處羅侯死遣晟往弔仍齎陳國所獻寶器以賜雍閭十三年流人楊欽亡入突厥詐言彭公劉昶共宇文氏女謀欲反隋稱遣其來密告公主雍閭信之乃不修職貢又遣晟出使微觀察焉公主見晟乃言辭不遜又遣所私胡人安遂迦共欽計議扇惑雍閭晟至京師具以狀奏又遣晟往索欽雍閭欲勿與謬答曰檢校客內無此色人晟乃貨其達官知欽所在夜掩獲之以示雍閭因發公主私事國人大恥雍閭執遂迦等並以付晟上大喜加授開府仍遣入藩涖殺大義公主雍閭又表請婚僉議將許之晟又奏曰臣觀雍閭反覆無信特共玷厥有隙所以依倚國家縱與為婚終當必叛今若得尚公主承藉威靈玷厥染干必又受其徵發強而更反後恐難圖且染干者處羅侯之子也素有誠款于今兩代臣前與相見亦乞通婚不如許之招令南徙兵少力弱易可撫馴使敵雍閭以為邊捍上曰善又遣慰喻染干許尚公主十七年染干遣五百騎隨晟來逆女以宗女封安義公主以妻之晟說染干率衆南徙居度斤舊鎮雍閭疾之亟來抄略染干伺知動靜輒遣奏聞是以賊來每先有備十九年染干因晟奏雍閭作攻具欲打大同城詔發六總管並取漢王節度分道出塞討之雍閭大懼復共達頭同盟合力掩襲染干大戰于長城下染干敗績殺其兄弟子姪而部落亡散染干與晟獨以五騎逼夜南走至旦行百餘里收得數百騎乃相與謀曰今兵敗入朝一降人耳大隋天子豈禮我乎玷厥雖來本無寃隙若往投之必相存濟晟知其懷二乃密遣從者入伏遠鎮令速舉烽染干見四烽俱發問晟曰城上然烽何也晟紿之曰城高地迥必遙見賊來我國家法若賊少舉二烽來多舉三烽大逼舉四烽使見賊多而又近耳染干大懼謂其衆曰追兵已逼且可投城既入鎮晟留其達官執室以領其衆自將染干馳驛入朝帝大喜進授左勳衛驃騎將軍持節護突厥晟遣降虜覘候雍閭知其牙內屢有災變夜見赤虹光照數百里天狗隕雨血三日流星墜其營內有聲如雷每夜自驚言隋師且至並遣奏知仍請出討突厥都速等歸染干前後至者男女萬餘口晟安置之由是突厥悅附尋以染干為意利珍豆啓人可汗賜射於武安殿選善射者十二人分為兩朋啓人曰臣由長孫大使得見天子今日賜射願入其朋許之給晟箭六侯發皆入鹿啓人之朋竟勝時有羣飛上曰公善彈為我取之十發俱中並應丸而落是日百官獲賚晟獨居多尋遣領五萬人於朔州築大利城以處染干安義公主死持節送義城公主復以妻之晟又奏染干部落歸者既衆雖在長城之內猶被雍閭抄略往來辛苦不得寧居請徙五原以河為固於夏勝兩州之間東西至河南北四百里掘為橫塹令處其內任情放牧免於抄略人必自安上並從之二十年都藍大亂為其部下所殺晟因奏請曰今王師臨境戰數有功賊內攜離其主被殺乘此招誘必並來降請遣染干部下分頭招慰上許之果盡來附達頭恐怖又大集兵詔晟部領降人為秦川行軍總管取晉王廣節度出討達頭與王相抗晟進策曰突厥飲泉易可行毒因取諸藥毒水上流達頭人畜飲之多死於是大驚曰天雨惡水其亡我乎因夜遁晟追之斬首千餘級俘百餘口六畜數千頭王大喜引晟入內同宴極歡有突厥達官來降時亦預坐說言突厥之內大畏長孫總管聞其弓聲謂為霹靂見其走馬稱為閃電王笑曰將軍震怒威行域外遂與雷霆為比一何壯哉師旋授上開府儀同三司復遣還大利城安撫新附仁壽元年晟表奏曰臣夜登城樓望見磧北有赤氣長百餘里皆如雨足下垂被地謹驗兵書此名灑血其下之國必且破亡欲滅胸奴宜在今日詔楊素為行軍元帥晟為受降使者送染干北伐二年軍次北河值賊帥思力俟斤等領兵拒戰晟與大將軍梁默擊走之轉戰六十餘里賊衆多降晟又教染干分遣使者往北方鐵勒等部招攜取之三年有鐵勒思結伏利具渾斛薩阿拔僕骨等十餘部盡背達頭請來降附達頭衆大潰西奔吐谷渾晟送染干安置于磧口事畢入朝遇高祖崩匿喪未發煬帝引晟於大行前委以內衙宿衛知門禁事即日拜左領軍將軍遇楊諒作逆勑以本官為相州刺史發山東兵馬與李雄等共經略之晟辭曰有男行布今在逆地忽蒙此任情所不安帝曰公著勤誠朕之所悉今相州之地本是齊都人俗澆浮易可搔擾儻生變動賊勢即張思所以鎮之非公莫可公體國之深終不可以兒害義故用相委公其勿辭於是遣捉相州諒破追還轉武衛將軍大業三年煬帝幸榆林欲出塞外陳兵耀武經突厥中指于涿郡仍恐染干驚懼先遣晟往喻旨稱述帝意染干聽之因召所部諸國奚霫室韋等種落數十酋長咸萃晟以牙中草穢欲令染干親自除之示諸部落以明威重乃指帳前草曰此根大香染干遽嗅之曰殊不香也晟曰天子行幸所在諸侯躬親灑掃耘除御路以表至敬之心今牙中蕪穢謂是留香草耳染干乃悟曰奴罪過奴之骨肉皆天子賜也得效筋力豈敢有辭特以邊人不知法耳賴將軍恩澤而教導之將軍之惠奴之幸也遂拔所佩刀親自芟草其貴人及諸部爭放效之乃發榆林北境至于其牙又東達于薊長三千里廣百步舉國就役而開御道帝聞晟策乃益嘉焉後除淮陽太守未赴任復為右驍衛將軍五年卒時年五十八帝深悼惜之賵贈甚厚後突厥圍雁門帝歎曰向使長孫晟在不令胸奴至此晟好奇計務功名性至孝居憂毀瘠為朝士所稱貞觀中追贈司空上柱國齊國公諡曰獻少子無忌嗣其長子行布亦多謀略有父風起家漢王諒庫真甚見親狎後遇諒於並州起逆率衆南拒官軍乃留行布城守遂與豆盧育等閉門拒諒城陷遇害次子安以兄功授鷹揚郎將史臣曰長孫氏爰自代陰來儀京洛門傳鍾鼎家誓山河漢代八王無以方其茂績張氏七葉不能譬此重光覽獨擅雄辨熾早稱爽俊俱司禮閣並統師旅且公且侯文武不墜晟體資英武兼包奇略因機制變懷彼戎夷傾巢盡落屈膝稽顙塞垣絶鳴鏑之旅渭橋有單于之拜惠流邊朔功光王府保茲爵祿不亦宜乎

body:
  text: 隋書卷二十七志第二十二百官中後齊制官多循後魏置太師太傅太保是為三師擬古上公非勳德崇者不居次有大司馬大將軍是為二大並典司武事次置太尉司徒司空是為三公三師二大三公府三門當中開黃閤設內屏各置長史司馬諮議參軍從事中郎掾屬主簿錄事功曹記室戶曹金曹中兵外兵騎兵長流城局刑獄等參軍事東西閤祭酒及參軍事法墨田水鎧集士等曹行參軍兼左戶右戶行參軍長兼行參軍參軍督護等員司徒則加有左右長史三公下次有儀同三司加開府者亦置長史已下官屬而減記室倉城局田水鎧士等七曹各一人其品亦每官下三府一階三師二大置佐史則同太尉府乾明中又置丞相河清中分為左右亦各置府僚云特進左右光祿金紫銀青等光祿大夫用人俱以舊德就閑者居之自一品已下從九品已上又有驃騎車騎衞四征四鎮中軍鎮軍撫軍翊軍四安冠軍輔國龍驤鎮遠安遠建忠建節中堅中壘振威奮威廣德弘義折衝制勝伏波陵江輕車樓船勁武昭勇明威顯信度遼橫海踰岷越嶂戎昭武毅雄烈恢猛揚麾曜鋒蕩邊開城靜漠綏戎平越殄夷飛騎隼擊武牙武奮清野橫野偏裨等將軍以褒賞勳庸尚書省置令僕射吏部殿中祠部五兵都官度支等六尚書又有錄尚書一人位在令上掌興令同但不糾察令則彈糾見事與御史中丞更相廉察僕射職為執法置二則為左右僕射皆與令同左糾彈而右不糾彈錄令僕射總理六尚書事謂之都省其屬官左丞掌吏部考功主爵殿中儀曹三公祠部主客左右中兵左右外兵都官二千石度支左右戶十七曹幷彈糾見事又主管轄臺中有違失者兼糾駁之右丞各一人掌駕部虞曹屯田起部都兵比部水部膳部倉部金部庫部十一曹亦管轄臺中又主凡諸用度雜物脂燈筆墨幃帳唯不彈糾餘悉與左同幷都令史八人共掌其事其六尚書分統列曹吏部統吏部掌褒崇選補等事考功掌考第及秀孝貢士等事主爵掌封爵等事三曹殿中統殿中掌駕行百官留守名帳宮殿禁衞供御衣倉等事儀曹掌吉凶禮制事三公掌五時讀時令諸曹囚帳斷罪赦日建金雞等事駕部掌車輿牛馬牧等事四曹祠部統祠部掌祠部醫藥死喪贈賜等事主客掌諸蕃雜客等事虞曹掌地圖山川遠近園囿田獵殽膳雜味等事屯田掌藉田諸州屯田等事起部掌諸興造工匠等事五曹祠部無尚書則右僕射攝五兵統左中兵掌諸郡督告身諸宿衞官等事右中兵掌畿內丁帳事力蕃兵等事左外兵掌河南及潼關已東諸州丁帳及發召征兵等事右外兵掌河北及潼關已西諸州所典與左外同都兵掌鼓吹太樂雜戶等事五曹都官統都官掌畿內非違得失事二千石掌畿外得失等事比部掌詔書律令勾檢等事水部掌舟船津梁公私水事膳部掌侍官百司禮食肴饌等事五曹度支統度支掌計會凡軍國損益事役糧釰等事倉部掌諸倉帳出入等事左戶掌天下計帳戶籍等事右戶掌天下公私田宅租調等事金部掌權衡量度外內諸庫藏文帳等事庫部掌凡是戎仗器用所須事六曹凡二十八曹吏部三公郎中各二人餘並一人凡三十郎中吏部儀曹三公虞曹都官二千石比部左戶各量事置掌故主事員門下省掌獻納諫正及司進御之職侍中給事黃門侍郎各六人錄事四人通事令史主事令史八人統局六領左右局領左右各二人掌知朱華閣內諸事宣傳已下白衣齋子已上皆主之左右直長四人尚食局典御二人總知御膳事丞監各四人尚藥局典御及丞各二人總知御藥事侍御師尚藥監各四人主衣局都統子統各二人掌御衣服玩弄事齋帥局齋帥四人掌鋪設酒掃事殿中局殿中監四人掌駕前奏引行事制請修補東耕則進耒耜中書省管司王言及司進御之音樂監令各一人侍郎四人幷司伶官西涼部直長伶官西涼四部伶官龜茲四部伶官清商部直長伶官清商四部又領舍人省掌署勑行下宣旨勞問中書舍人主書各十人祕書省典司經籍監丞各一人郎中四人校書郎十二人正字四人又領著作省郎二人佐郎八人校書郎二人集書省掌諷議左右從容獻納散騎常侍通直散騎常侍各六人諫議大夫七人散騎侍郎六人員外散騎常侍二十人通直散騎侍郎六人給事中六人員外散騎侍郎一百二十人奉朝請二百四十人又領起居省散騎常侍通直散騎常侍散騎侍郎通直散騎侍郎各一人校書郎二人中侍中省掌出入門閤中侍中二人中常侍中給事中各四人又有中尚藥典御及丞幷中謁者僕射各二人中尚食局典御丞各二人監四人內謁者局統丞各一人御史臺掌察糾彈劾中丞一人治書侍御史二人侍御史八人殿中侍御史檢校御史各十二人錄事四人領符節署令一人符璽郎中四人都水臺管諸津橋使者二人參事十人又領都尉合昌坊城等三局尉皆分司諸津橋謁者臺掌凡諸吉凶公事導相禮儀事僕射二人謁者三十人錄事一人太常光祿衞尉宗正太僕大理鴻臚司農太府是為九寺置卿少卿丞各一人各有功曹五官主簿錄事等員太常掌陵廟羣祀禮樂儀制天文術數衣冠之屬其屬官有博士四人掌禮制協律郎二人掌監調律呂音樂八書博士二人等員統諸陵掌守衞山陵等事太廟掌郊廟社稷等事太樂掌諸樂及行禮節奏等事衣冠掌冠幘舄履之屬等事鼓吹掌百戲鼓吹樂人等事太祝掌郊廟贊祝祭社衣服等事太史掌天文地動風雲氣色律曆卜筮等事太醫掌醫藥等事廩犧掌養犧牲供祭羣祀等事太宰掌諸神祀烹宰行禮事等署令丞而太廟兼領郊祠掌五郊羣神事崇虛掌五岳四瀆神祀在京及諸州道士簿帳等事二局丞太樂兼領清商部丞掌清商音樂等事鼓吹兼領黃戶局丞掌供樂人衣服太史兼領靈臺掌天文觀候太卜掌諸卜筮二局丞光祿寺掌諸膳食帳幕器物宮殿門戶等事統守宮掌凡張設等事太官掌食膳事宮門主諸門籥事供府掌供御衣服玩弄之事肴藏掌器物鮭味等事清漳主酒歲二萬石春秋中半華林掌禁林木等事等署宮門署置僕射六人以司其事餘各有令丞又領東園局丞員掌諸凶具衞尉寺掌禁衞甲兵統城門寺置校尉二人以司其職掌宮殿城門幷諸倉庫管籥等事又領公車掌尚書所不理有枉屈經判奏聞武庫掌甲兵及吉凶儀仗衛士掌京城及諸門士兵等署令武庫又有修故局丞掌領匠修故甲等事大宗正寺掌宗室屬籍統皇子王國諸王國諸長公主家太僕寺掌諸車輦馬牛畜產之屬統驊騮掌御馬及諸鞍乘左右龍左右牝掌駝馬駝牛掌飼駝騾驢牛司羊掌諸羊乘黃掌諸輦輅車府掌諸雜車等署令丞驊騮署又有奉承直長二人左龍署有左龍局右龍署有右龍局左牝署有左牝局右牝署有右牝局駝牛署有典駝特牛牸牛三局司羊署有特羊牸羊局諸局並有都尉寺又領司訟典腊出入等三局丞大理寺掌決正刑獄正監評各一人律博士四人明法掾二十四人檻車督二人掾十人獄丞掾各二人司直明法各十人鴻臚寺掌蕃客朝會吉凶弔祭統典客典寺司儀等署令丞典客署又有京邑薩甫二人諸州薩甫一人典寺署有僧祗部丞一人司儀署又有奉禮郎三十人司農寺掌倉市薪菜園池果實統平準太倉鈎盾典農導官梁州水次倉石濟水次倉藉田等署令丞而鈎盾又別領大囿上林遊獵柴草池藪苜蓿等六部丞典農署又別領山陽平頭督亢等三部丞導官署又有御細部麴麵部典庫部等倉督員太府寺掌金帛府庫營造器物統左中右三尚方左藏司染諸冶東西道署黃藏右藏細作左校甄官等署令丞左尚方又別領別局樂器器作三局丞中尚方又別領別局涇州絲局雍州絲局定州紬綾局四局丞右尚方又別領別局丞司染署又別領京坊河東信都三局丞諸冶東道又別領滏口武安白間三局丞諸冶西道又別領晉陽冶泉部大原仇四局丞甄官署又別領石窟丞國子寺掌訓教冑子祭酒一人亦置功曹五官主簿錄事員領博士五人助教十人學生七十二人太學博士十人助教二十人太學生二百人四門學博士二十人助教二十人學生三百人長秋寺掌諸宮閣卿中尹各一人並用宦者丞二人亦有功曹五官主簿錄事員領中黃門掖庭晉陽宮中山宮園池中宮僕奚官等署令丞又有暴室局丞其中黃門又有冗從僕射及博士四人掖庭晉陽中山各有宮教博士二人中山署又別有麵豆局丞園池署又別有桑園部丞中宮僕署又別有乘黃局教尉細馬車都督車府部丞奚官署又別有染局丞將作寺掌諸營建大匠一人丞四人亦有功曹主簿錄事員若有營作則立將副將長史司馬主簿錄事各一人又領軍主副幢主副等昭玄寺掌諸佛教置大統一人統一人都維那三人亦置功曹主簿員以管諸州邵縣沙門曹領軍府將軍一人掌禁衞宮掖朱華閣外凡禁衞官皆主之輿駕出入督攝仗衞中領軍亦同有長史司馬功曹五官主簿錄事釐其府事又領左右衞領左右等府左右衞府將軍各一人掌左右廂所主朱華閣以外各武衞將軍二人貳之皆有司馬功曹主簿錄事釐其府事其御仗屬官有御仗正副都督御仗五職御仗等員其直盪屬官有直盪正副都督直入正副都督勳武前鋒正副都督勳武前鋒五藏等員直衞屬官有直衞正副都督翊衞正副都督前鋒正副都督等員直突屬官有直突都督勳武前鋒散都督等員直閣屬官有朱衣直閣直閣將軍直寢直齋直後之屬又有武騎雲騎將軍各一人驍騎遊擊前後左右等四軍將軍左右中郎將各五人步兵越騎射聲屯騎長水等校尉奉車都尉等各十人武賁中郎將羽林監各十五人冗從僕射三十人騎都尉六十人積弩積射強弩等將軍及武騎常侍各二十五人殿中將軍五十人員外將軍一百人殿中司馬督五十人員外司馬督一百人領左右府有領左右將軍領千牛備身又有左右備身正副都督左右備身五職左右備身員又有刀劍備身正副都督刀劍備身五職刀劍備身員又有備身正副督備身五職員護軍府將軍一人掌四中關津輿駕出則護駕中護軍亦同有長史司馬功曹五官主簿錄事釐其府事其屬官東西南北四中府皆統之四府各中郎將一人長史司馬錄事參軍統府錄事各一人又有統府直兵及功曹倉曹中兵外兵騎兵長流城局等參軍各一人法田鎧等曹行參軍各一人又領諸關尉津尉行臺在令無文其官置令僕射其尚書丞郎皆隨權制而置員焉其文未詳太子太師太傅太保是為三師掌師範訓導輔翊皇太子少師少傅少保是為三少各一人掌奉皇太子以觀三師之德出則三師在前三少在後詹事總東宮內外衆務事無大小皆統之府置丞功曹五官主簿錄事員領家令率更令僕等三寺左右衞二坊三寺各置丞二坊各置司馬俱有功曹主簿以承其事家令領食官典倉司藏等署令丞又領內坊令丞掌知閤內諸事其食官又別領器局酒局二丞典倉又別領園丞司藏又別領仗庫典作二局丞率更領中盾署令丞各一人掌周衞禁防漏刻鍾鼓僕寺領牧署令丞署又別有車輿局丞左右衞坊率各領騎官備身正副都督騎官備身五職騎官備身員又有內直備身正副都督內直備身五職內直備身員又有備身正副都督備身五職員又有直閣直前直後員又有旅騎屯衞典軍等校尉各二人騎尉三十人門下坊中庶子中舍人通事守舍人主事守舍人各四人又領殿內典膳藥藏齋帥等局殿內局有內直監二人副直監四人典膳藥藏局監丞各二人藥藏又有侍醫四人齋帥局齋帥內閣帥各二人典書坊庶子四人舍人二十八人又領典經坊洗馬八人守舍人二人門大夫坊門大夫主簿各一人幷統伶
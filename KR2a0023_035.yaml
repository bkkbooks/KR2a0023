body:
  text: 隋書卷三十五志第三十經籍四集道經佛經楚辭十二卷並目録後漢校書郎王逸注楚辭三卷郭璞注梁有楚辭十一卷宋何偃刪王逸注亡楚辭九悼一卷楊穆撰參解楚辭七卷皇甫遵訓撰楚辭音一卷徐邈撰楚辭音一卷宋處士諸葛氏撰楚辭音一卷孟奧撰楚辭音一卷楚辭音一卷釋道騫撰離騷草木疏二卷劉杳撰右十部二十九卷通計亡書十一部四十卷楚辭者屈原之所作也自周室衰亂詩人寢息諂佞之道興諷刺之辭廢楚有賢臣屈原被讒放逐乃著離騷八篇言己離別愁思申杼其心自明無罪因以諷諫冀君覺悟卒不省察遂赴汨羅死焉弟子宋玉痛惜其師傷而和之其後賈誼東方朔劉向揚雄嘉其文彩擬之而作蓋以原楚人也謂之楚辭然其氣質高麗雅致清遠後之文人咸不能逮始漢武帝命淮南王為之章句旦受詔食時而奏之其書今亡後漢校書郎王逸集屈原已下迄於劉向逸又自為一篇並敘而注之今行於世隋時有釋道騫善讀之能為楚聲音韻清切至今傳楚辭者皆祖騫公之音楚蘭陵令荀況集一卷殘缺梁二卷楚大夫宋玉集三卷漢武帝集一卷梁二卷漢淮南王集一卷梁二卷又有賈誼集四卷朝錯集三卷漢弘農都尉枚乘集二卷録各一卷亡漢中書令司馬遷集一卷漢太中大夫東方朔集二卷梁有漢光祿大夫吾丘壽王集二卷亡漢孝文園令司馬相如集一卷漢膠西相董仲舒集一卷梁二卷又有漢太常孔臧集二卷亡漢騎都尉李陵集二卷梁有漢丞相魏相集二卷録一卷左馮翊張敞集一卷録一卷亡漢諫議大夫王褒集五卷漢諫議大夫劉向集六卷梁有漢射聲校尉陳湯集二卷丞相韋玄成集二卷亡漢諫議大夫谷永集二卷梁有涼州剌史杜鄴集二卷騎都尉李尋集二卷亡漢司空師丹集一卷梁三卷録一卷漢光祿大夫息夫躬集一卷漢太中大夫揚雄集五卷漢太中大夫劉歆集五卷漢成帝班婕妤集一卷梁有班昭集三卷王莽建新大尹崔篆集一卷保成師友唐林集一卷中謁者史岑集二卷後漢東平王蒼集五卷桓談集五卷亡後漢司隸從事馮衍集五卷後漢徐令班彪集二卷梁五卷又有司徒掾陳元集一卷王隆集二卷雲陽令朱勃集二卷後漢處士梁鴻集二卷亡後漢車騎從事杜篤集一卷後漢車騎司馬傅毅集二卷梁五卷後漢大將軍護軍司馬班固集十七卷梁有魏郡太守黃香集二卷亡後漢長岑長崔駰集十卷後漢侍中賈逵集一卷梁二卷後漢校書郎劉騊駼集一卷梁二卷録一卷又有樂安相李尤集五卷大鴻臚竇章集二卷亡後漢濟北相崔瑗集六卷梁五卷後漢劉珍集二卷録一卷後漢河間相張衡集十一卷梁十二卷又一本十四卷又有郎中蘇順集二卷録二卷後漢太傅胡廣集二卷録一卷亡後漢黃門郎葛龔集六卷梁五卷一本七卷後漢司空李固集十二卷梁十卷後漢南郡太守馬融集九卷梁有外黃令高彪集二卷録一卷王逸集二卷録一卷司徒掾桓麟集二卷録一卷亡後漢徵士崔琦集一卷梁二卷又有酈炎集二卷録二卷陳相邊韶集一卷録一卷益州刺史朱穆集二卷録一卷亡後漢京兆尹延篤集一卷梁二卷録一卷又有司農卿皇甫規集五卷太常卿張奐集二卷録一卷王延壽集三卷五原太守崔實集二卷録一卷上計趙一集二卷録一卷亡後漢諫議大夫劉陶集三卷梁二卷録一卷又有外黃令張升集二卷録一卷侯瑾集二卷盧植集二卷議郎廉品集二卷亡後漢司空荀爽集一卷梁三卷録一卷後漢野王令劉梁集三卷梁二卷録一卷又有鄭玄集二卷録一卷亡後漢左中郎將蔡雍集十二卷梁有二十卷録一卷又有尚書令士孫瑞集二卷亡後漢太山太守應劭集二卷梁四卷又有別部司馬張超集五卷亡後漢少府孔融集九卷梁十卷録一卷後漢侍御史虞翻集二卷梁三卷録一卷後漢討虜長史張紘集一卷梁二卷録一卷梁有後漢處士禰衡集二卷録一卷亡後漢尚書右丞潘勗集二卷梁有録一卷亡後漢丞相倉曹屬阮瑀集五卷梁有録一卷亡魏太子文學徐幹集五卷梁有録一卷亡魏太子文學應瑒集一卷梁有五卷録一卷亡後漢丞相軍謀掾陳琳集三卷梁十卷録一卷魏太子文學劉楨集四卷録一卷後漢丞相主簿繁欽集十卷梁録一卷亡後漢丞相主簿楊修集一卷梁二卷録一卷後漢侍中王粲集十一卷梁有魏國郎中令路粹集二卷録一卷行御史大夫袁渙集五卷録一卷魏國奉常王修集二卷亡後漢尚書丁儀集一卷梁二卷録一卷後漢黃門郎丁廙集一卷梁二卷録一卷梁又有婦人後漢黃門郎秦嘉妻徐淑集一卷後漢董祀妻蔡文姬集一卷傅石甫妻孔氏集一卷亡魏武帝集二十六卷梁三十卷録一卷梁又有武皇帝逸集十卷亡魏武帝集新撰十卷魏文帝集十卷梁二十三卷魏明帝集七卷梁五卷或九卷録一卷梁又有高貴鄉公集四卷亡魏陳思王曹植集三十卷梁又有司徒華歆集二卷亡魏司徒王朗集三十四卷梁三十卷又司空陳羣集五卷亡魏給事中邯鄲淳集二卷梁有録一卷又有劉廙集二卷侍中吳質集五卷新城太守孟達集三卷魏徵士管寧集三卷録一卷亡魏光祿勳高堂隆集六卷梁十卷録一卷又有光録勳劉邵集二卷録一卷亡魏散騎常侍繆襲集五卷梁有録一卷又有散騎常侍王象集一卷光祿大夫韋誕集三卷録一卷散騎常侍麋元集五卷遊擊將軍卞蘭集二卷録一卷隰陽侯李康集二卷録一卷陳郡太守孫該集二卷録一卷尚書傅巽集二卷録一卷亡魏章武太守殷褒集一卷梁二卷魏司空王昶集五卷梁有録一卷魏衛將軍王肅集五卷梁有録一卷又有桓範集二卷中領軍曹羲集五卷録一卷亡魏尚書何晏集十一卷梁十卷録一卷魏衛尉卿應璩集十卷梁有録一卷又有王弼集五卷録一卷中書令劉階集二卷太常卿傅嘏集二卷録一卷樂安太守夏侯惠集二卷録一卷亡魏校書郎杜摯集二卷梁有毌丘儉集二卷録一卷征東軍司馬江奉集二卷亡魏太常夏侯玄集三卷梁有車騎將軍鍾育集五卷録一卷亡魏步兵校尉阮籍集十卷梁十三卷録一卷魏中散大夫嵇康集十三卷梁十五卷録一卷又有魏徵士呂安集二卷録一卷亡魏司徒鍾會集九卷梁十卷録一卷魏汝南太守程曉集二卷梁録一卷蜀丞相諸葛亮集二十五卷梁二十四卷又有蜀司徒許靖集二卷録一卷征北將軍夏侯霸集二卷亡吳輔義中郎將張溫集六卷梁有士燮集五卷亡吳偏將軍駱統集十卷梁有録一卷又有太子少傅薛綜集三卷録一卷亡吳選曹尚書暨豔集二卷梁三卷録一卷又有姚信集二卷録一卷謝承集四卷今亡吳人楊厚集二卷梁又有録一卷吳丞相陸凱集五卷梁有録一卷吳侍中胡綜集二卷梁有録一卷又有東觀令華核集五卷録一卷亡吳侍中張儼集一卷梁二卷録一卷又有韋昭集二集録一卷亡吳中書令紀騭集三卷梁有録一卷又有陸景集一卷亡晉宣帝集五卷梁有録一卷晉文帝集三卷齊王攸集二卷梁三卷晉王沈集五卷梁有鄭褒集二卷亡晉宗正嵇喜集一卷殘缺梁二卷録一卷晉散騎常侍應貞集一卷梁五卷晉司隸校尉傅玄集十五卷梁五十卷録一卷亡晉著作郎成公綏集九卷殘缺梁十卷又有裴秀集三卷録一卷亡晉金紫光祿大夫何楨集一卷梁五卷又有袁準集二卷録一卷亡晉少傅山濤集九卷梁五卷録一卷又一本十卷齊奉朝請裴津注又梁有向秀集二卷録一卷平原太守阮种集二卷録一卷阮侃集五卷録一卷亡晉太傅羊祜集一卷殘缺梁二卷録一卷又有蔡玄通集五卷太宰賈充集五卷録一卷荀勗集三卷録一卷亡晉征南將軍杜預集十八卷晉輔國將軍王濬集一卷殘缺梁二卷録一卷晉徵士皇甫謐集二卷録一卷晉侍中程咸集三卷梁有光祿大夫劉毅集二卷録一卷晉侍中庾峻集二卷録一卷亡晉巴西太守郤正集一卷晉散騎常侍薛瑩集三卷梁又有散騎常侍陶濬集二卷録一卷亡晉通事郎江偉集六卷梁有宣舒集五卷散騎常侍曹志集二卷録一卷鄒湛集三卷録一卷亡晉汝南太守孫育集六卷晉處士楊泉集二卷録一卷梁有司徒王渾集五卷冀州刺史王深集五卷亡晉徵士閔鴻集三卷梁有光祿大夫裴楷集二卷録一卷亡晉司空張華集十卷録一卷晉尚書僕射裴頠集九卷梁有太子中庶子許孟集三卷録一卷太宰何劭集二卷録一卷光祿大夫劉頌集三卷録一卷劉實集二卷録一卷亡晉散騎常侍王佑集三卷録一卷梁有晉驃騎將軍王濟集二卷亡華嶠集八卷梁二卷晉祕書丞司馬彪集四卷梁三卷録一卷又有尚書庾倏集二卷録一卷國子祭酒謝衡集二卷亡晉漢中太守李虔集一卷梁二卷録一卷晉司隸校尉傅咸集十七卷梁三十卷録一卷又有太子中庶子棗據集二卷録一卷劉寶集三卷亡晉馮翊太守孫楚集六卷梁十二卷録一卷晉散騎常侍夏侯湛集十卷梁有録一卷又有弋陽太守夏侯淳集二卷散騎侍郎王讚集五卷亡晉衛尉卿石崇集六卷梁有録一卷晉尚書郎張敏集二卷梁五卷又有黃門郎伏偉集一卷亡晉黃門郎潘嶽集十卷晉太常卿潘尼集十卷晉頓丘太守歐陽建集二卷梁有宗正劉許集二卷録一卷散騎常侍李重集二卷光祿大夫樂廣集二卷録一卷阮渾集三卷録一卷亡晉侍中嵇紹集二卷録一卷梁有錢唐令楊建集九卷長沙相盛彥集五卷左長史楊乂集三卷録一卷晉尚書盧播集一卷梁二卷録一卷又有欒肇集五卷録一卷南中郎長史應亨集二卷亡晉國子祭酒杜育集二卷晉太常卿摯虞集九卷梁十卷録一卷又祕書監繆徵集二卷録一卷亡晉齊王府記室左思集二卷梁有五卷録一卷又有晉豫章太守夏靖集二卷録一卷吳王文學鄭豐集二卷録一卷大司馬東曹掾張翰集二卷録一卷清河王文學陳略集二卷録一卷揚州從事陸沖集二卷録一卷亡晉平原內史陸機集十四卷梁四十七卷録一卷亡晉清河太守陸雲集十二卷梁十卷録一卷又有少府丞孫極集二卷録一卷亡晉中書郎張載集七卷梁一本二卷録一卷晉黃門郎張協集三卷梁四卷録一卷晉著作郎束集七卷梁五卷録一卷又有征南司馬曹攄集三卷録一卷散騎常侍江統集十卷録一卷著作郎胡濟集五卷録一卷亡晉中書令卞粹集一卷梁五卷又有光祿勳閭丘沖集二卷録一卷亡晉太傅從事中郎庾敳集一卷梁五卷録一卷又有太子中舍人阮瞻集二卷録一卷太子洗馬阮修集二卷録一卷廣威將軍裴邈集二卷録一卷亡晉太傳主簿郭象集二卷梁五卷録一卷又有廣州刺史嵇含集十卷録一卷亡晉安豐太守孫惠集八卷梁十一卷録一卷又有松滋令蔡洪集二卷録一卷亡晉平北將軍牽秀集四卷梁三卷録一卷又有車騎從事中郎蔡克集二卷録一卷遊擊將軍索靖集三卷隴西太守閻纂集二卷録一卷秦州刺史張輔集二卷録一卷交趾太守殷巨集二卷録一卷太子洗馬陶佐集五卷録一卷東晉鄱陽太守虞溥集二卷録一卷益陽令吳商集五卷仲長敖集二卷晉太常卿劉弘集三卷録一卷開府山簡集二卷録一卷兗州刺史宗岱集二卷侍中王峻集二卷録一卷濟陽內史王曠集五卷録一卷亡晉散騎常侍棗嵩集一卷梁二卷録一卷又有襄陽太守棗腆集二卷録一卷亡晉太尉劉琨集九卷梁十卷劉琨別集十二卷晉司空從事中郎盧諶集十卷梁有録一卷晉祕書丞傅暢集五卷梁有録一卷又有晉明帝集五卷録一卷簡文帝集五卷録一卷孝武帝集二卷録一卷彭城王紘集二卷譙烈王集九卷録一卷亡晉會稽王司馬道子集八卷梁九卷又有鎮東從事中郎傅毅集五卷亡晉衡陽內史曾瓌集三卷
金紫光祿大夫周閔奏事四卷晉中丞劉邵奏事六卷中丞司馬無忌奏事十三卷中丞虞谷奏事六卷中丞高嵩奏事五卷又諸彈事等十四部亡雜露布十二卷梁有雜檄文十七卷魏武帝露布文九卷亡山公啓事三卷范寧啓事三卷梁十卷梁有雜薦文十二卷薦文集七卷亡善文五十卷杜預撰雜集一卷殷仲堪撰梁魏周齊陳皇朝聘使雜啓九卷政道集十卷書集八十八卷晉散騎常侍王履撰梁八十卷亡書林十卷雜逸書六卷梁二十二卷徐爰撰應璩書林八卷夏赤松撰抱朴君書一卷葛洪撰蔡司徒書三卷蔡謨撰前漢雜筆十卷吳晉雜筆九卷吳朝文二十四卷李氏家書八卷晉左將軍王鎮惡與劉丹陽書一卷亡後周與齊軍國書二卷高澄與侯景書一卷策集一卷殷仲堪撰策集六卷梁有孝秀對策十二卷亡宋元嘉策孝秀文十卷誹諧文三卷誹諧文十卷袁淑撰梁有續誹諧文集十卷又有誹諧文一卷沈宗之撰任子春秋一卷杜嵩撰博陽秋一卷宋零陵令辛雍之撰亡法集百七卷梁沙門釋寶唱撰右一百七部二千二百一十三卷通計亡書合二百四十九部五千二百二十四卷總集者以建安之後辭賦轉繁衆家之集日以滋廣晉代摯虞苦覽者之勞倦於是採擲孔翠芟剪繁蕪自詩賦下各為條貫合而編之謂為流別是後文集總鈔作者繼軌屬辭之士以為覃奧而取則焉今次其前後並解釋評論總於此篇凡集五百五十四部六千六百二十二卷通計亡書合一千一百四十六部一萬三千三百九十卷文者所以明言也古者登高能賦山川能祭師旅能誓喪紀能誄作器能銘則可以為大夫言其因物騁辭情靈無擁者也唐歌虞詠商頌周雅事緣情紛綸相襲自斯已降其道彌繁世有澆淳時移治亂文體遷變邪正或殊宋玉屈原激清風於南楚嚴鄒枚馬陳盛藻於西京平子豔發於東都王粲獨步於漳滏爰逮晉氏見稱潘陸並黼藻相輝宮商間起清辭潤乎金石精義薄乎雲天永嘉已後玄風既扇辭多平淡文寡風力降及江東不勝其弊宋齊之世下逮梁初靈運高致之奇延年錯綜之美謝玄暉之藻麗沈休文之富溢輝煥斌蔚辭義可觀梁簡文之在東宮亦好篇什清辭巧製止乎衽席之間雕琢蔓藻思極閨闈之內後生好事遞相放習朝野紛紛號為宮體流宕不已訖于喪亡陳氏因之未能全變其中原則兵亂積年文章道盡後魏文帝頗效屬辭未能變俗例皆淳古齊宅漳濱辭人間起高言纍句紛紜絡繹清辭雅致是所未聞後周草創干戈不戢君臣戮力專事經營風流文雅我則未暇其後南平漢沔東定河朔訖于有隋四海一統采荊南之嵵梓收會稽之箭竹辭人才士總萃京師屬以高祖少文煬帝多忌當路執權逮相擯壓於是握靈蛇之珠韞荊山之玉轉死溝壑之內者不可勝數草澤怨刺於是興焉古者陳詩觀風斯亦所以關乎盛衰者也班固有詩賦略凡五種今引而伸之合為三種謂之集部凡四部經傳三千一百二十七部三萬六千七百八卷通計亡書合四千一百九十一部四万九千四百六十七卷經戒三百一部九百八卷餌服四十六部一百六十七卷房中十三部三十八卷符録十七部一百三卷右三百七十七部一千二百一十六卷道經者云有元始天尊生於太元之先稟自然之氣沖虛凝遠莫知其極所以説天地淪壞劫數終盡略與佛經同以為天尊之體常存不滅每至天地初開或在玉京之上或在窮桑之野授以祕道謂之開劫度人然其開劫非一度矣故有延康赤明龍漢開皇是其年號其間相去經四十一億萬載所度皆諸天仙上品有太上老君太上丈人天真皇人五方天帝及諸仙官轉共承受世人莫之豫也所説之經亦稟元一之氣自然而有非所造為亦與天尊常在不滅天地不壞則蘊而莫傳劫運若開其文自見凡八字盡道體之奧謂之天書字方一丈八角垂芒光輝照耀驚心眩目雖諸天仙不能省視天尊之開劫也乃命天真皇人改囀天音而辨析之自天真以下至于諸仙展轉節級以次相授諸仙得之始授世人然以天尊經歷年載始一開劫受法之人得而寶祕亦有年限方始傳授上品則年久下品則年近故今授道者經四十九年始得授人推其大旨蓋亦歸於仁愛清靜積而修習漸致長生自然神化或白日登仙與道合體其受道之法初受五千文籙次受三洞籙次受洞玄籙次受上清籙籙皆素書紀諸天曹官屬佐吏之名有多少又有諸符錯在其間文章詭怪世所不識受者必先潔齋然後齎金環一並諸贄幣以見於師師受其贄以籙授之仍剖金環各持其半云以為約弟子得籙緘而佩之其潔齋之法有黃籙玉籙金籙塗炭等齋為壇三成每成皆置綿蕝以為限域傍各開門皆有法象齋者亦有人數之限以次入于綿蕝之中魚貫面縛陳説愆咎告白神祇晝夜不息或一二七日而止其齋數之外有人者並在綿蕝之外謂之齋客但拜謝而已不面縛焉而又有諸消災度厄之法依陰陽五行數術推人年命書之如章表之儀並具贄幣燒香陳讀云奏上天曹請為除厄謂之上章夜中於星辰之下陳設酒脯餌幣物歷祀天皇太一祀五星列宿為書如上章之儀以奏之名之為醮又以木為印刻星辰日月於其上吸氣執之以印疾病多有愈者又能登刀入火而焚勑之使刃不能割火不能熱而又有諸服餌辟穀金丹玉漿雲英蠲除滓穢之法不可殫記云自上古黃帝帝嚳夏禹之儔並遇神人咸受道籙年代既遠經史無聞焉推尋事迹漢時諸子道書之流有三十七家大旨皆去健羡處沖虛而已無上天官符籙之事其黃帝四篇老子二篇最得深旨故言陶弘景者隱於句容好陰陽五行風角星算修辟穀導引之法受道經符籙武帝素與之遊及禪代之際弘景取圖讖之文合成景梁字以獻之由是恩遇甚厚又撰登真隱訣以證古有神仙之事又言神丹可成服之則能長生與天地永畢帝令弘景試合神丹竟不能就乃言中原隔絶藥物不精故也帝以為然敬之尤甚然武帝弱年好事先受道法及即位猶自上章朝士受道者衆三吳及邊海之際信之踰甚陳武世居吳興故亦奉焉後魏之世嵩山道士寇謙之自云嘗遇真人成公興後遇太上老君授謙之為天師而又賜之雲中音誦科誡二十卷又使玉女授其服氣導引之法遂得辟穀氣盛體輕顏色鮮麗弟子十餘人皆得其術其後又遇神人李譜云是老君玄孫授其圖籙真經劾召百神六十餘卷及銷鍊金丹雲英八石玉漿之法太武始光之初奉其書而獻之帝使謁者奉玉帛牲牢祀嵩嶽迎致其餘弟子於代都東南起壇宇給道士百二十餘人顯揚其法宣布天下太武親備法駕而受符籙焉自是道業大行每帝即位必受符籙以為故事刻天尊及諸仙之象而供養焉遷洛已後置道場於南郊之傍方二百步正月十月之十五日並有道士哥人百六人拜而祠焉後齊武帝遷鄴遂罷之文襄之世更置館宇選其精至者使居焉後周承魏崇奉道法每帝受籙如魏之舊尋與佛法俱滅開皇初又興高祖雅信佛法於道士蔑如也大業中道士以術進者甚衆其所以講經由以老子為本次講莊子及靈寶升玄之屬其餘衆經或言傳之神人篇卷非一自云天尊姓樂名靜信例皆淺俗故世甚疑之其術業優者行諸符禁往往神驗而金丹玉液長生之事歷代糜費不可勝紀竟無效焉今考其經目之數附之於此大乘經六百一十七部二千七十六卷五百五十八部一千六百九十七卷經五十九部三百七十九卷疏小乘經四百八十七部八百五十二卷雜經三百八十部七百一十六卷雜經目殘缺甚見數如此雜疑經一百七十二部三百三十六卷大乘律五十二部九十一卷小乘律八十部四百七十二卷七十七部四百九十卷律二部二十三卷講疏雜律二十七部四十六卷大乘論三十五部一百四十一卷三十部九十四卷論十五部四十七卷疏小乘論四十一部五百六十七卷二十一部四百九十一卷論十部七十六卷講疏雜論五十一部四百三十七卷三十二部二百九十九卷論九部一百三十八卷講疏記二十部四百六十四卷右一千九百五十部六千一百九十八卷佛經者西域天竺之迦維衛國淨飯王太子釋迦牟尼所説釋迦當周莊王之九年四月八日自母右脅而生姿貌奇異有三十二相八十二好捨太子位出家學道勤行精進覺悟一切種智而謂之佛亦曰佛陀亦曰浮屠皆胡言也華言譯之為淨覺其所説云人身雖有生死之異至於精神則不滅此身之前則經無量身矣積而修習精神清淨則成佛道天地之外四維上下更有天地亦無終極然皆有成有敗一成一敗謂之一劫自此天地已前則有無量劫矣每劫必有諸佛得道出世教化其數不同今此劫中當有千佛自初至于釋迦已七佛矣其次當有彌勒出世必經三會演説法藏開度衆生由其道者有四等之果一曰須洹二曰斯含三曰阿那含四曰阿羅漢至羅漢者則出入生死去來隱顯而不為纍阿羅漢已上至菩薩者深見佛性以至成道每佛滅度遺法相傳有正象末三等淳醨之異年歲遠近亦各不同末法已後衆生愚鈍無復佛教而業行轉惡年壽漸短經數百千載間乃至朝生夕死然後有大水大火大風之災一切除去之而更立生人又歸淳朴謂之小劫每一小劫則一佛出世初天竺中多諸外道並事水火毒龍而善諸變幻釋迦之苦行也是諸邪道並來嬲惱以亂其心而不能得及佛道成盡皆摧伏並為弟子弟子男曰桑門譯言息心而總曰僧譯言行乞女曰比丘尼皆剃落鬚髮釋纍辭家相與和居治心修淨行乞以自資而防心攝行僧至二百五十戒尼五百戒俗人信憑佛法者男曰優婆塞女曰優婆夷皆去殺盜淫妄言飲酒是為五誡釋迦在世教化四十九年乃至天龍人鬼並來聽法弟子得道以百千萬億數然後於拘尸那城娑羅雙樹間以二月十五日入般涅槃涅槃亦曰泥洹譯言滅度亦言常樂我淨初釋迦説法以人之性識根業各差故有大乘小乘之説至是謝世弟子大迦葉與阿難等五百人追共撰述綴以文字集載為十二部後數百年有羅漢菩薩相繼著論贊明其義然佛所説我滅度後正法五百年像法一千年末法三千年其義如此推尋典籍自漢已上中國未傳或云久以流布遭秦之世所以堙滅其後張騫使西域蓋聞有浮屠之教哀帝時博士弟子秦景使伊存口授浮屠經中土聞之未之信也後漢明帝夜夢金人飛行殿庭以問於朝而傅毅以佛對帝遣郎中蔡愔及秦景使天竺求之得佛經四十二章及釋迦立像並與沙門攝摩騰竺法蘭東還愔之來也以白馬負經因立白馬寺於洛城雍門西以處之其經緘于蘭臺石室而又畫像於清涼臺及顯節陵上章帝時楚王英以崇敬佛法聞西域沙門齎佛經而至者甚衆永平中法蘭又譯十住經其餘傳譯多未能通至桓帝時有安息國沙門安靜齎經至洛翻譯最為通解靈帝時有月支沙門支讖天竺沙門竺佛朔等並翻佛經而支讖所譯泥洹經二卷學者以為大得本旨漢末太守竺融亦崇佛法三國時有西域沙門康僧會齎佛經至吳譯之吳主孫權甚大敬信魏黃初中中國人始依佛戒剃髮為僧先是西域沙門來此譯小品經首尾乖舛未能通解甘露中有朱仕行者往西域至于闐國得經九十章晉元康中至鄴譯之題曰放光般若經太始中有月支沙門竺法護西遊諸國大得佛經至洛翻譯部數甚多佛教東流自此而盛石勒時常山沙門衛道安性聰敏誦經日至萬餘言以胡僧所譯維摩法華未盡深旨精思十年心了神悟乃正其乖舛宣揚解釋時中國紛擾四方隔絶道安乃率門徒南遊新野欲令玄宗所在流布分遣弟子各趨諸方法性詣揚州法和入蜀道安與慧遠之襄陽後至長安苻堅甚敬之道安素聞天竺沙門鳩摩羅什思通法門勸堅致之什亦聞安令問遙拜致敬姚萇弘始二年羅什至長安時道安卒後已二十載矣什深慨恨什之來也大譯經論道安所正與什所譯義如一初無乖舛初晉元熙中新豐沙門智猛策杖西行到華氏城得泥洹經及僧祗律東至高昌譯泥洹為二十卷後有天竺沙門曇摩羅讖復齎胡本來至河西沮渠蒙遜遣使至高昌取猛本欲相參驗未還而蒙遜破滅姚萇弘始十年猛本始至長安譯為三十卷曇摩羅讖又譯金光明等經時胡僧至長安者數十輩惟鳩摩羅什才德最優其所譯則維摩法華成實論等諸經及曇無懺所譯金光明曇摩羅懺所譯泥洹等經並為大乘之學而什又譯十誦律天竺沙門佛陀耶舍譯長阿含經及四方律兜佉勒沙門曇摩難提譯增一阿含經曇摩耶舍譯阿毗曇論並為小乘之學其餘經論不可勝記自是佛法流通極於四海矣東晉隆安中又有賓沙門僧伽提婆譯增一阿含經及中阿含經義熙中沙門支法領從于闐國得華嚴經三萬六千偈至金陵宣譯又有沙門法顯自長安遊天竺經三十餘國隨有經律之處學其書語譯而寫之還至金陵與天竺禪師跋羅參共辨定謂僧祗律學者傳之齊梁及陳並有外國沙門然所宣譯無大名部可為法門者梁武大崇佛法於華林園中總集釋氏經典凡五千四百卷沙門寶唱撰經目録又後魏時太武帝西征長安以沙門多違佛律羣聚穢亂乃詔有司盡坑殺之焚破佛像長安僧徒一時殲滅自餘征鎮豫聞詔書亡匿得免者十一二文成之世又使修復熙平中遣沙門慧生使西域采諸經律得一百七十部永平中又有天竺沙門菩提留支大譯佛經與羅什相埒其地持十地論並為大乘學者所重後齊遷鄴佛法不改至周武帝時蜀郡沙門衛元嵩上書稱僧徒猥濫武帝出詔一切廢毀開皇元年高祖普詔天下任聽出家仍令計口出錢營造經像而京師及並州相州洛州等諸大都邑之處並官寫一切經置于寺內而又別寫藏于祕閣天下之人從風而靡競相景慕民間佛經多於六經數十百倍大業時又令沙門智果於東都內道場撰諸經目分別條貫以佛所説經為三部一曰大乘二曰小乘三曰雜經其餘似後人假託為之者別為一部謂之疑經又有菩薩及諸深解奧義贊明佛理者名之為論及戒律並有大小及中三部之別又所學者録其當時行事名之為記凡十一種今舉其大數列於此篇右道佛經二千三百二十九部七千四百一十四卷道佛者方外之教聖人之遠致也俗士為之不通其指多離以迂怪假託變幻亂於世斯所以為弊也故中庸之教是所罕言然亦不可誣也故録其大綱附于四部之末大凡經傳存亡及道佛六千五百二十部五萬六千八百八十一卷

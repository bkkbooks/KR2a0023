body:
  text: 隋書卷八十五列傳第五十夫肖形天地人稱最靈以其知父子之道識君臣之義異夫禽獸者也傳曰人生在三事之如一然則君臣父子其道不殊父不可以不父子不可以不子君不可以不君臣不可以不臣故曰君猶天也天可讎乎是以有罪歸刑見危授命竭忠貞以立節不臨難而苟免故聞其風者懷夫慷慨千載之後莫不願以為臣此其所以生榮死哀取貴前哲者矣至於委質策名代卿世祿出受心膂之寄入參帷幄之謀身處機衡肆趙高之姦宄世荷權寵行王莽之桀逆生靈之所讎疾犬豕不食其餘雖薦社污宮彰必誅之釁棺焚骨明篡殺之咎可以懲夫既往未足深誡將來昔孔子修春秋而亂臣賊子知懼抑使之求名不得欲蓋而彰者也今故正其罪名以冠於篇首庶後之君子見作者之意焉宇文化及弟智及宇文化及左翊衛大將軍述之子也性凶險不循法度好乘肥挾彈馳騖道中由是長安謂之輕薄公子煬帝為太子時常領千牛出入臥內纍遷至太子僕數以受納貨賄再三免官太子嬖昵之俄而復職又以其弟士及尚南陽公主化及由此益驕處公卿間言辭不遜多所陵轢見人子女狗馬珍玩必請託求之常與屠販者遊以規其利煬帝即位拜太僕少卿益恃舊恩貪冒尤甚大業初煬帝幸榆林化及與弟智及違禁與突厥交市帝大怒囚之數月還至青門外欲斬之而後入城解衣辮髮以公主故久之乃釋並智及並賜述為奴述薨後煬帝追憶之遂起化及為右屯衛將軍智及為將作少監是時李密據洛口煬帝懼留淮左不敢還都從駕驍果多關中人久客羈旅見帝無西意謀欲叛歸時武賁郎將司馬德戡總領驍果屯於東城風聞兵士欲叛未之審遣校尉元武達陰問驍果知其情因謀構逆共所善武賁郎將元禮直閣裴虔通互相扇惑曰今聞陛下欲築宮丹陽勢不還矣所部驍果莫不思歸人人耦語並謀逃去我欲言之陛下性忌惡聞兵走即恐先事見誅今知而不言其後事發又當族滅我矣進退為戮將如之何虔通曰上實爾誠為公憂之德戡謂兩人曰我聞關中陷沒李孝常以華陰叛陛下收其二弟將盡殺之吾等家屬在西安得無此慮也虔通曰我子弟已壯誠不自保正恐旦暮及誅計無所出德戡曰同相憂當共為計取驍果若走可與俱去虔通等曰誠如公言求生之計無以易此因遞相招誘又轉告內史舍人元敏鷹揚郎將孟秉符璽郎李覆牛方裕直長許弘仁薛良城門郎唐奉義醫正張愷等日夜聚博約為刎頸之交情相款昵言無回避於座中輒論叛計並相然許時李孝質在禁令驍果守之中外交通所謀益急趙行樞者樂人之子家産巨萬先交智及勳侍楊士覽者宇文甥二人同告智及智及素狂悖聞之喜即共見德戡期以三月十五日舉兵同叛劫十二衛武馬虜掠居人財物結黨西歸智及曰不然當今天實喪隋英雄並起同心叛者已數萬人因行大事此帝王業也德戡然之行樞薛良請以化及為主相約既定方告化及化及性本駑怯初聞大懼色動流汗久之乃定義寧二年三月一日德戡欲宣言告衆恐以人心未一更思譎詐以脅驍果謂許弘仁張愷曰君是良醫國家任使出言惑衆衆必信君可入備身府告識者言陛下聞説驍果欲叛多醞毒酒因享會盡鴆殺之獨與南人留此弘仁等宣布此言驍果聞之遞相告語謀叛逾急德戡知計既行遂以十日總召故人諭以所為衆皆伏曰唯將軍命其夜奉義主閉城門乃與虔通相知諸門皆不下鑰至夜三更德戡於東城內集兵得數萬人舉火與城外相應帝聞有聲問是何事虔通偽曰草坊被燒外人救火故喧囂耳中外隔絶帝以為然孟秉智及於城外得千餘人劫候衛武賁馮普樂共布兵分捉郭下街巷至五更中德戡授虔通兵以換諸門衛士虔通因自開門領數百騎至成象殿殺將軍獨孤盛武賁郎將元禮遂引兵進宿衛者皆走虔通進兵排左閣馳入永巷問陛下安在有美人出方指云在西閣從往執帝帝謂虔通曰卿非我故人乎何恨而反虔通曰臣不敢反但將士思歸奉陛下還京師耳帝曰與汝歸虔通因勒兵守之至旦孟秉以甲騎迎化及化及未知事果戰栗不能言人有來謁之者但低頭據鞍答云罪過時士及在公主第弗之知也智及遣家僮莊桃樹就第殺之桃樹不忍執詣智及久之乃見釋化及至城門德戡迎謁引入朝堂號為丞相令將帝出江都門以示羣賊因復將入遣令狐行達弒帝於宮中又執朝臣不同己者數十人及諸外戚無少長害之唯留秦孝王子浩立以為帝十餘日奪江都人舟楫從水路西歸至顯福宮宿公麥孟才折衝郎將沈光等謀擊化及反為所害化及於是入據六宮其自奉養一如煬帝故事每於帳中南面端坐人有白事者默然不對下牙時方收取啓狀共奉義方裕良愷等參決之行至徐州水路不通復奪人車牛得二千兩並載宮人珍寶其戈甲戎器悉令軍士負之道遠疲極三軍始怨德戡失望竊謂行樞曰君大謬誤我當今撥亂必藉英賢化及庸暗羣小在側事將必敗當若之何行樞曰在我等爾廢之何難因共李本宇文導師尹正卿等謀以後軍萬餘兵襲殺化及更立德戡為主弘仁知之密告化及盡收捕德戡及其支黨十餘人皆殺之引兵向東郡通守王軌以城降之元文都推越王侗為主拜李密為太尉令擊化及密遣徐績據黎陽倉化及渡河保黎陽縣分兵圍績密壁清淇與績以烽火相應化及每攻倉密輒引兵救之化及數戰不利其將軍于弘達為密所擒送於侗所鑊烹之化及糧盡渡永濟渠與密決戰於童山遂入汲郡求軍糧又遣使拷掠東郡吏民以責米粟王軌怨之以城歸於李密化及大懼自汲郡將率衆圖以北諸州其將陳智略率嶺南驍果萬餘人張童兒率江東驍果數千人皆叛歸李密化及尚有衆二萬北走魏縣張愷等與其將陳伯謀去之事覺為化及所殺腹心稍盡兵勢日蹙兄弟更無他計但相聚酣宴奏女樂醉後因尤智及曰我初不知由汝為計強來立我今所向無成士馬日散負殺主之名天下所不納今者滅族豈不由汝乎持其兩子而泣智及怒曰事捷之日都不賜尤及其將敗乃欲歸罪何不殺我以降建德兄弟數相鬬鬩言無長幼醒而復飲以此為其衆多亡自知必敗化及歎曰人生故當死豈不一日為帝乎於是鴆殺浩僭皇帝位於魏縣國號許建元為天壽署置百官攻元寶藏於魏州四旬不剋反為所敗亡失千餘人乃東北趣聊城將招攜海曲諸賊時遣士及徇濟北求餽餉大唐遣淮安王神通安撫山東並招化及化及不從神通進兵圍之十餘日不剋而退竇建德悉衆攻之先是齊州賊帥王薄聞其多寶物詐來投附化及信之與共居守至是薄引建德入城生擒化及悉虜其衆先執智及元武達孟秉楊士覽許弘仁皆斬之乃以轞車載化及之河間數以殺君之罪並二子承基承趾皆斬之傳首於突厥義成公主梟於虜庭士及自濟北西歸長安智及幼頑凶好與人羣鬬所共遊處皆不逞之徒相聚鬬雞習放鷹狗初以父功賜爵濮陽郡公蒸淫醜穢無所不為其妻長孫妬而告述述雖為隱而大忿之纖芥之愆必加鞭箠弟士及恃尚主又輕忽之唯化及每事營護父再三欲殺輒救免之由是頗相親昵遂勸化及遣人入蕃私為交易事發當誅述獨證智及罪惡而為化及請命帝因兩釋述將死抗表言其凶勃必且破家帝後思述授智及將作少監其江都殺逆之事智及之謀也化及為丞相以為左僕射領十二衛大將軍化及僭號封齊王竇建德破聊城獲而斬之並其黨十餘人皆暴尸梟首司馬德戡司馬德戡扶風雍人也父元謙仕周為都督德戡幼孤以屠豕自給有桑門釋粲通德戡母和氏遂撫教之因解書計開皇中為侍官漸遷至大都督從楊素出討漢王諒充內營左右進止便僻俊辨多姦計素大善之以勳授儀同三司大業三年為鷹揚郎將從討遼左進位正議大夫遷武賁郎將煬帝甚昵之從至江都領左右備身驍果萬人營於城內因隋末大亂乃率驍果謀反語在化及事中既獲煬帝與其黨孟秉等推化及為丞相化及首封德戡為溫國公邑三千戶加光祿大夫仍統本兵化及意甚忌之後數日化及署諸將分配士卒乃以德戡為禮部尚書外示美遷實奪其兵也由是憤怨所獲賞物皆賂於智及智及為之言行至徐州捨舟登陸令德戡將後軍乃與趙行樞李本尹正卿宇文導師等謀襲化及遣人使于孟海公結為外助遷延未發以待使報許弘仁張愷知之以告化及因遣其弟士及陽為遊獵至于後軍德戡不知事露出營參謁因命執之並其黨與化及責之曰與公戮力共定海內出於萬死今始事成願得同守富貴公又何為反也德戡曰本殺昏主苦其毒害推立足下而又甚之逼於物情不獲已也化及不對命送至幕下縊而殺之時年三十九裴虔通裴虔通河東人也初煬帝為晉王以親信從稍遷至監門校尉煬帝即位擢舊左右授宣惠尉遷監門直閣纍從征役至通議大夫與司馬德戡同謀作亂先開宮門騎至成象殿殺將軍獨孤盛擒帝于西閣化及以虔通為光祿大夫莒國公化及引兵之北也令鎮徐州化及敗後歸於大唐即授徐州總管轉辰州刺史封長蛇男尋以隋朝殺逆之罪除名徙於嶺表而死王充王充字行滿本西域人也祖支頽徙居新豐頽死其妻少寡與儀同王粲野合生子曰瓊粲遂納之以為小妻其父收幼孤隨母嫁粲粲愛而養之因姓王氏官至懷汴二州長史充捲髮豺聲沉猜多詭詐頗窺書傳尤好兵法曉龜策推步盈虛然未嘗為人言也開皇中為左翊衛後以軍功拜儀同授兵部員外善敷奏明習法律而舞弄文墨高下其心或有駁難之者充利口飾非辭義鋒起衆雖知其不可而莫能屈稱為明辨煬帝時纍遷至江都郡丞時帝數幸江都充善候人主顏色阿諛順旨每入言事帝善之又以郡丞領江都宮監乃雕飾池臺陰奏遠方珍物以媚於帝由是益昵之大業八年隋始亂充內懷徼幸卑身禮士陰結豪俊多收衆心江淮間人素輕悍又屬盜賊羣起人多犯法有繫獄抵罪者充皆枉法出之以樹私恩及楊玄感反吳人朱燮晉陵人管崇起兵江南以應之自稱將軍擁衆十餘萬帝遣將軍吐萬緒魚俱羅討之不能剋充募江都萬餘人擊頻破之每有剋捷必歸功於下所獲軍實皆推與士卒身無所受由此人爭為用功最居多十年齊郡賊帥孟讓自長白山寇掠諸郡至盱眙有衆十餘萬充以兵拒之而羸師示弱保都梁山為五柵相持不戰後因其懈弛出兵奮擊大破之乘勝盡滅賊讓以數十騎遁去斬首萬人六畜軍資莫不盡獲帝以充有將帥才略始遣領兵討諸小盜所向皆破之然性矯偽詐為善能自勤苦以求聲譽十一年突厥圍帝於雁門充盡發江都人將往赴難在軍中反首垢面悲泣無度曉夜不解甲藉草而臥帝聞之以為愛己益信任之十二年遷為江都通守時厭次人格謙為盜數年兵十餘萬在豆子中充帥師破斬之威振羣賊又擊盧明月破之於南陽斬首數萬虜獲極多後還江都帝大悅自執杯酒以賜之時充又知帝好內乃言江淮良家有美女並願備後庭無由自進帝逾喜因密令閲視諸女姿質端麗合法相者取正庫及應入京物以娉納之所用不可勝計帳上云勑別用不顯其實有合意者則厚賞充或不中者又以賚之後令以船送東京而道路賊起使者苦役於淮泗中沉船溺之者前後十數或有發露充為祕之又遽簡閲以供進是後益見親昵遇李密攻陷興洛倉進逼東都官軍數却光祿大夫裴仁基以武牢降于密帝惡之大發兵將討焉發中詔遣充為將軍於洛口以拒密前後百餘戰互有勝負充乃引軍渡洛水逼倉城李密與戰充敗績赴水溺死者萬餘人時天寒大雪兵士既渡水衣皆霑濕在道凍死者又數萬人比至河陽才以千數充自繫獄請罪越王侗遣使赦之召令還都收合亡散復得萬餘人屯於含嘉城中不敢復出宇文化及殺帝於江都充與太府卿元文都將軍皇甫無逸右司郎盧楚奉侗為主侗以充為吏部尚書封鄭國公及侗取元文都盧楚之謀拜李密為太尉尚書令密遂稱臣復以兵拒化及於黎陽遣使告捷衆皆悅充獨謂其麾下諸將曰文都之輩刀筆吏耳吾觀其勢必為李密所擒且吾軍人每與密戰殺其父兄子弟前後已多一旦為之下吾屬無類矣出此言以激怒其衆文都知而大懼與楚等謀將因充入內伏甲而殺之期有日矣將軍段達遣其女壻張志以楚謀告之充夜勒兵圍宮城將軍費曜田世闍等與戰於東太陽門外曜軍敗充遂攻門而入無逸以單騎遁走獲楚殺之時宮門尚閉充令扣門言於侗曰元文都等欲執皇帝降于李密段達知而以告臣臣非敢謀反誅反者耳文都聞變入奉侗於乾陽殿陳兵衛之令將帥乘城以拒難兵敗又獲文都殺之侗命開門以納充充悉遣人代宿衛者乃入謁頓首流涕而言曰文都等無狀謀相屠害事急為此不敢背國侗與之盟充尋遣韋節等諷侗令拜為尚書左僕射總督內外諸軍事又授其兄惲為內史令入居禁中未幾李密破化及還其徑兵良馬多戰死士卒皆倦充欲乘其敝而擊之恐人不一乃假託鬼神言夢見周公乃立祠於洛水之上遣巫宣言周公欲令僕射急討李密當有大功不則兵皆疫死充兵多楚人俗信妖妄故出此言以惑之衆皆請戰充簡練精勇得二萬餘人馬千餘遷營於洛水南密軍偃師北山上時密新得志於化及有輕充之心不設壁壘充夜遣二百餘騎潛入北山伏溪谷中令軍秣馬蓐食既而宵濟人奔馬馳遲明而薄密密出兵應之陳未成列而兩軍合戰其伏兵蔽山而上潛登北原乘高下馳壓密營營中亂無能拒者即入縱火密軍大驚而潰降其將張童兒陳智略進下偃師初充兄偉及子玄應隨化及至東郡密得而囚之於城中至是盡獲之又執密長史邴元真妻子司馬鄭虔象之母及諸將子弟皆撫慰之各令潛呼其父兄兵次洛口邴元真鄭虔象等舉倉城以應之密以數十騎遁逸充悉收其衆而東盡于海南至于江悉來歸附充又令韋節諷侗拜為太尉署置官屬以尚書省為其府尋自稱鄭王遣其將高略帥師攻壽安不利而旋又帥師攻圍穀州三日而退明年自稱相國受九錫備物是後不朝侗矣有道士桓法嗣者自言解圖讖充昵之法嗣乃以孔子閉房記畫作丈夫持一干以驅羊法嗣云楊隋姓也干一者王字也居羊後明相國代隋為帝也又取莊子人間世德充符二篇上之法嗣釋曰上篇言世下篇言充此即相國名矣明當德被人間而應符命為天子也充大悅曰此天命也再拜受之即以法嗣為諫議大夫充又羅取雜鳥書帛繫其頸自言符命而散放之或有彈射得鳥而來獻者亦拜官爵既而廢侗於別宮僭即皇帝位建元曰開明國號鄭大唐遣秦王率衆圍之充頻出兵戰輒不利都外諸城相繼降款充窘迫遣使請救於竇建德建德率精兵援之師至武牢為秦王所破擒建德以詣城下充將潰圍而出諸將莫有應之者自知潛竄無所於是出降至長安為讎人獨孤修德所殺段達段達武威姑臧人也父嚴周朔州刺史達在周年始三歲襲爵襄垣縣公及長身長八尺美鬚髯便弓馬高祖為丞相以大都督領親信兵常置左右及踐阼為左直齋纍遷車騎將軍兼晉王參軍高智惠李積等之作亂也達率衆一萬擊定方滁二州賜縑千段遷進儀同又破汪文進等於宣州加開府賜奴婢五十口綿絹四千段仁壽初太子左衛副率大業初以蕃邸之舊拜左翊衛將軍征吐谷渾進位金紫光祿大夫帝征遼東百姓苦役平原祁孝德清河張金稱等並聚衆為羣盜攻陷城邑郡縣不能禦帝令達擊之數為金稱等所挫亡失甚多諸賊輕之號為段姥後用鄃令楊善會之計更與賊戰方致剋捷還京師以公事坐免明年帝征遼東以達留守涿郡俄復拜左翊衛將軍高陽魏刀兒聚衆十餘萬自號歷山飛寇掠燕趙達率涿郡通守郭絢擊敗之于時盜賊既多官軍惡戰達不能因機決勝唯持重自守頓兵饋糧多無剋獲時皆謂之為怯磱十二年帝幸江都宮詔達與太府卿元文都留守東都李密據洛口縱兵侵掠城下達與監門郎將龐玉武牙郎將霍舉率內兵出禦之頗有功遷左驍衛大將軍王充之敗也密復進據北芒來至上春門達與判左丞郭文懿尚書韋津出兵拒之達見賊盛不陳而走為密所乘軍大潰津沒於陳由是賊勢日盛及帝崩於江都達與元文都等推越王侗為主署開府儀同三司兼納言封陳國公元文都等謀誅王充也達陰告充為之內應及事發越王侗執文都於充充甚德於達特見崇重既破李密達等勸越王加充九錫備物尋諷令禪讓充僭尊號以達為司徒及東都平坐誅妻子籍沒史臣曰化及庸磱下才負恩纍葉王充斗筲小器遭逢時幸俱蒙奬擢禮越舊臣既屬崩剝之期不能致身竭命乃因利乘便先圖干紀率羣不逞職為亂階拔本塞源裂冠毀冕或躬為戎首或親行鴆毒釁深指鹿事切食蹯天地所不容人神所同憤故梟獍凶魁相尋葅戮蛇豕醜類繼踵誅夷快忠義於當年垂炯戒於來葉嗚呼為人臣者可不殷鑒哉可不殷鑒哉

body:
  text: 隋書卷十二志第七禮儀七高祖初即位將改周制乃下詔曰宣尼制法云行夏之時乘殷之輅奕葉共遵理無可革然三代所尚衆論多端或以為所建之時或以為所感之瑞或當其行色因以從之今雖夏數得天歷代通用漢尚於赤魏尚於黃驪馬玄牲已弗相踵明不可改建寅歲首常服於黑朕初受天命赤雀來儀兼姬周已還於茲六代三正回復五德相生總以言之並宜火色垂衣已降損益可知尚色雖殊常兼前代其郊丘廟社可依袞冕之儀朝會衣裳宜盡用赤昔丹烏木運姬有大白之旗黃星土德曹乘黑首之馬在祀與戎其尚異今之戎服皆可尚黃在外常所著者通用雜色祭祀之服須合禮經宜集通儒更可詳議太子庶子攝太常少卿裴政奏曰竊見後周制冕加為十二既與前禮數乃不同而色應五行又非典故謹案三代之冠其名各別六等之冕承用區分璪玉五采隨班異飾都無迎氣變色之文唯月令者起于秦代乃有青旗赤玉白駱黑衣與四時而色變全不言於辨冕五時冕色禮既無文稽於正典難以經證且後魏已來制度咸闕天興之歲草創繕修所造車服多參胡制故魏收論之稱為違古是也周氏因襲將為故事大象承統咸取用之輿輦衣冠甚多迂怪今皇隋革命憲章前代其魏周輦輅不合制者已勑有司盡令除廢然衣冠禮器尚且兼行乃有立夏袞衣以赤為質迎秋平冕用白成形既越典章須革其謬謹案續漢書禮儀志云立春之日京都皆著青衣秋夏悉如其色逮于魏晉迎氣五郊行禮之人皆同此制考尋故事唯幘從衣色今請冠及冕色並用玄唯應著幘者任依漢晉制曰可於是定令採用東齊之法乘輿袞冕垂白珠十有二旒以組為纓色如其綬黈纊充耳玉筓玄衣纁裳衣山龍華蟲火宗彝五章裳藻粉米黼黻四章衣重宗彝裳重黼黻為十二等衣褾領織成升龍白紗內單黼領青褾襈裾革帶玉鈎大帶素帶朱𩹉紕其外上以朱下以緑韍隨裳色龍火山三章鹿盧玉具劍火珠鏢首白玉雙佩玄組雙大綬六采玄黃赤白縹緑純玄質長二丈四尺五百首廣一尺小雙綬長二尺六寸色同大綬而首半之間施三玉環朱襪赤舄舄加金飾祀圓丘方澤感帝明堂五郊雩蠟封禪朝日夕月宗廟社稷籍田廟遣上將征還飲至元服納后正月受朝及臨軒拜王公則服之通天冠加金博山附蟬十二首施珠翠黑介幘玉簪導絳紗袍深衣制白紗內單皂領褾襈裾絳紗蔽膝白假帶方心曲領其革帶劍佩綬舄與上同若未加元服則雙童髻空頂黑介幘雙玉導加寶飾朔日受朝元會及冬會諸祭還則服之武辨金附蟬平巾幘餘服具服講武出征四時搜狩大射禡類宜社賞祖罰社纂嚴則服之黑介幘白紗單衣烏皮履拜陵則服之白紗帽白練裙襦烏皮履視朝聽訟及宴見賓客皆服之白帢白紗單衣烏皮履舉哀則服之神璽寶而不用受命璽封禪則用之皇帝行璽封命諸侯及三師三公則用之皇帝之璽賜諸侯及三師三公書則用之皇帝信璽徵諸夏兵則用之天子行璽封命蕃國之君則用之天子之璽賜蕃國之君書則用之天子信璽徵蕃國兵則用之常行詔勑則用內史門下印皇帝臨臣之喪三品已上服錫衰五等諸侯緦衰四品已下疑衰皇太子袞冕垂白珠九旒青纊充耳犀筓玄衣纁裳衣山龍華蟲火宗彝五章裳藻粉米黼黻四章織成為之白紗內單黼領青褾襈裾革帶金鉤大帶素帶不朱𩹉亦紕以朱緑黻隨裳色火山二章玉具劍火珠鏢首瑜玉雙佩朱組雙大綬四采赤白縹紺純朱質長一丈八尺三百二十首廣九寸小雙綬長二尺六寸色同大綬而首半之間施二玉環朱襪赤舄以金飾侍從皇帝祭祀及謁廟元服納妃則服之遠遊三梁冠加金附蟬九首施珠翠黑介幘纓翠緌犀簪導絳紗袍白紗內單皂領褾襈裾白假帶方心曲領絳紗蔽膝襪舄其革帶劍佩綬與上同未冠則雙童髻空頂黑介幘雙玉導加寶飾謁廟還宮元日朔日入朝釋奠則服之遠遊冠公服絳紗單衣革帶金鉤假帶方心紛長六尺四寸廣二寸四分色同其綬金縷鞶囊襪履五日常朝則服之白帢單衣烏皮履為宮臣舉哀則服之皇太子璽宮內大事用之小事用左右庶子印皇太子臨弔三師三少則錫衰宮臣四品已上緦衰五品已下疑衰袞冕青珠九旒以組為纓色如其綬自此已下纓皆如之服九章同皇太子王國公開國公初受冊執贄入朝祭親迎則服之三公助祭者亦服之鷩冕侯八旒伯七旒服七章衣華蟲火宗彝三章裳藻粉米黼黻四章八旒者重宗彝侯伯初受冊執贄入朝祭親迎則服之毳冕子六旒男五旒服五章衣宗彝藻粉米三章裳黼黻二章六旒者裳重黻子男初受冊執贄入朝祭親迎則服之冕三品七旒四品六旒五品五旒服三章七旒者衣粉米一章為三重裳黼黻二章各二重六旒者減黼一重五旒又減黻一重正三品已下從五品已上助祭則服之自王公已下服章皆繡為之祭服冕皆簪導青纊充耳玄衣纁裳白紗內單黼領冕已下內單青領青褾襈裾革帶鉤大帶王三公及公侯伯子男素帶不朱𩹉皆紕其外上以朱下以緑正三品已下從五品已上素帶紕其垂外以玄內以黃紐約皆用青組朱韍凡韍皆隨裳色袞鷩毳火山二章山一章劍佩綬襪赤舄爵辨玄纓無旒從九品已上助祭則服之其制服簪導玄衣纁裳無章白絹內單青領褾襈裾革帶大帶練帶紕其垂內外以緇紐約用青組爵襪赤履武辨平巾幘諸武職及侍臣通服之侍臣加金璫附蟬以貂為飾侍左者左珥右者右珥遠遊三梁冠黑介幘諸王服之進賢冠黑介幘文官服之從三品已上三梁從五品已上兩梁流內九品已上一梁法冠一名獬豸冠鐵為柱其上施珠兩枚為獬豸角形法官服之高山冠謁者服之却非冠門者及禁防伺非服之黑介幘平巾黑幘應服者並上下通服之庖人則緑幘白帢白紗單衣烏皮履上下通服之委貌冠未冠則雙童髻空頂黑介幘皆深衣青領烏皮履國子太學四門生服之朝服亦名具服冠幘簪導白筆絳紗單衣白紗內單皂領袖皂襈革帶鉤假帶曲領方心絳紗蔽膝襪舄綬劍佩從五品已上陪祭朝饗拜表凡大事則服之六品已下從七品已上去劍佩綬餘並同自餘公事皆從公服亦名從省服冠幘簪導絳紗單衣革帶鉤假帶方心襪履紛鞶囊從五品已上服之絳衣公服衣即單衣之不垂胡也袖狹形直如內餘同從省流外五品已下九品已上服之綬王纁朱綬四采赤黃縹紺純朱質纁文織長一丈八尺二百四十首廣九寸公玄朱綬四采玄赤縹紺純朱質玄文織長一丈八尺二百四十首廣九寸侯伯青朱綬四采青赤白縹純朱質青文織長一丈六尺百八十首廣八寸子男素朱綬三采青赤白純朱質白文織成一丈四尺百四十首廣七寸正從一品緑綟綬四采緑紫黃赤純緑質長一丈八尺二百四十首廣九寸從三品已上紫綬三采紫黃赤純紫質長一丈六尺百八十首廣八寸銀青光祿大夫朝議大夫及正從四品青綬三采青白紅純青質長一丈四尺百四十首廣七寸正從五品墨綬二采青紺純紺質長一丈二尺百首廣六寸自王公已下皆有小雙綬長二尺六寸色同大綬而首半之正從一品施二玉環已下不合其有綬者則有紛皆長六尺四寸廣二寸四分各隨其綬色鞶囊二品已上金縷三品金銀縷四品及開國男銀縷五品綵縷官無綬者則不合劍佩一品及五等諸侯並佩山玄玉五品已上佩水蒼玉年高致仕及以理去官被召謁見皆服前官從省服州郡秀孝試見之日皆假進賢一梁冠絳公服隱居道素之士被召入謁見者黑介幘白單衣革帶烏皮履左右衛左右武衛左右武候大將軍領左右大將軍並武辨絳朝服劍佩綬侍從則平巾幘紫衫大口袴褶金玳瑁裝兩襠甲唯左右武衛大將軍執赤柳杖左右衛左右武衛左右武候將軍領左右將軍左右監門衛將軍太子左右衛左右宗衛左右內等率左右監門郎將及諸副率並武辨絳朝服劍佩綬侍從則平巾幘紫衫大口袴金裝兩襠甲唯左右武衛將軍太子左右宗衛率執白檀杖直閣將軍直寢直齊太子直閣武辨絳朝服劍佩綬侍從則平巾幘絳衫大口袴褶銀裝兩襠甲皇后首飾花十二樹皇太子妃公主王妃三師三公及公夫人一品命婦並九樹侯夫人二品命婦並八樹伯夫人三品命婦並七樹子夫人世婦及皇太子昭訓四品已上官命婦並六樹男夫人五品命婦五樹女御及皇太子良娣三樹自皇后已下小花並如大花之數並兩博鬢也皇后褘衣深青織成為之為翬翟之形素質五色十二等青紗內單黼領羅縠褾襈蔽膝隨裳色用翟為章三等大帶隨衣色朱𩹉紕其外上以朱錦下以緑錦紐約用青組以青衣革帶青襪舄舄加金飾白玉佩玄組綬章采尺寸與乘輿同祭及朝會凡大事則服之鞠衣黃羅為之應服者皆同其蔽膝大帶及衣革帶舄隨衣色餘與褘衣同唯無雉親蠶則服之應服者皆以助祭青衣青羅為之制與鞠衣同去花大帶及佩綬以禮見皇帝則服之朱衣緋羅為之制如青衣宴見賓客則服之皇太后服與皇后同皇太后璽不行用若封令書則用宮官之印皇后璽不行用若封令書則用內侍之印皇太子妃褕翟青織成為之為搖翟之形青質五色九等青紗內單黼領羅縠褾襈蔽膝隨衣色以搖翟為章三等大帶隨衣色下朱𩹉紕其外上以朱錦下以緑錦紐約用青組以青衣革帶青襪舄舄加金飾瑜玉佩純朱綬章采尺寸與皇太子同助祭朝會凡大事則服之亦有鞠衣皇太子妃璽不行用若封書則用典內之印公主王妃三師三公及公侯伯夫人服褕翟繡為之公主王妃三師三公及公夫人為九等侯夫人八等伯夫人七等助祭朝會凡大事則服之亦有鞠衣子男夫人服闕翟緋羅為之刻赤繒為翟形不繡綴於服上子夫人六等男夫人五等助祭朝會凡大事則服之亦有鞠衣諸王公侯伯子男之母與妃夫人同其郡縣君各視其夫及子若郡縣君品高及無夫子者準品嬪及從三品已上官命婦青服制與褕翟同青羅為之唯無雉助祭朝會凡大事則服之亦有鞠衣世婦及皇太子昭訓從五品已上官命婦服青服助祭從蠶朝會凡大事則服之女御及皇太子良媛朱服制與青服同去佩綬助祭從蠶朝會凡大事則服之六尚朱絲布公服助祭從蠶朝會凡大事則服之六司六典及皇太子三司三典三掌青紗公服助祭從蠶朝會凡大事則服之佩綬嬪同九卿世婦及皇太子昭訓同五品公主王妃同諸王三師三公五等國夫人及從五品已上官命婦皆準其夫無夫者準品定令訖高祖元正朝會方御通天服郊丘宗廟盡用龍袞衣大裘毳皆未能備至平陳得其器物衣冠法服始依禮具然皆藏御府弗服用焉百官常服同於匹庶皆著黃袍出入殿省高祖朝服亦如之唯帶加十三環以為差異蓋取於便事及大業元年煬帝始詔吏部尚書牛弘工部尚書宇文愷兼內史侍郎虞世基給事郎善心儀曹郎袁朗等憲章古制創造衣冠自天子逮于胥皂服章皆有等差若先所有者則因循取用弘等議定乘輿服合八等焉大裘冕之制案周禮大裘之冕無旒三禮衣服圖大裘而冕王祀昊天上帝及五帝之服至秦除六冕唯留玄冕漢明帝永平中方始創制董巴志云漢六冕同制皆闊七寸長尺二寸前圓後方於是遂依此為大裘冕制青表朱𩹉不施旒纊不通於下其大裘之服案周官注羔裘也其制準禮圖以羔正黑者為之取同色繒以為領袖其裳用纁而無章飾絳襪赤舄祀圓丘感帝封禪五郊明堂雩蠟皆服之袞冕之制案禮玉藻十有二旒大戴禮云冕而加旒以蔽明也琇纊塞耳以蔽聰也又禮含文嘉前後邃延不視邪也加以黈纊不聽讒也三王之冕既不通制故夫子云行夏之時服周之冕今以采綖貫珠為旒十二邃延者出冕前後而下垂之旒齊於髆纊齊於耳組為纓玉笄導其為服之制案釋名云袞卷也謂畫龍於上也是時虞世基奏曰後周故事升日月於旌旗乃闕三辰而章無十二但有山龍華蟲作繪宗彝藻火粉米黼黻乃與三公不異開皇中就𩹉欲生分別故衣重宗彝裳重黼黻合重二物以就九章為十二等但每一物上下重行袞服用九鷩服用七今重此三物乃非典故且周氏執謙不敢負於日月所以綴此三象唯施太常天王袞衣章乃從九但天子譬日德在照臨辰為帝位月主正后負此三物合德齊明自古有之理應無惑周執謙道殊未可依重用宗彝又乖法服今準尚書豫欲觀古人之服日月星辰山龍華蟲作會宗彝藻火粉米黼黻絺繡具依此於左右髆上為日月各一當後領下而為星辰又山龍九物各重行十二又近代故實依尚書大傳山龍純青華蟲純黃作會宗彝純黑藻純白火純赤以此相間而為五采鄭玄議已自非之云五采相錯非一色也今並用織成於繡五色錯文準孔安國衣質以玄加山龍華蟲火宗彝等並織成為五物裳質以纁加藻粉米黼黻之四衣裳通數此為九章兼上三辰而備十二也衣褾領上各帖升龍漢晉以來率皆如此既是先王法服不可乖於夏制徵而用之理將為允墨勑曰可承以單衣又案董巴輿服志宗廟冕服云絳領袖為內單衣又車服雜記曰天子釋奠郊祭而單衣以絳緣今用白紗為內單黼領絳褾青裾及襈革帶玉鉤大帶朱𩹉紕其外紐約用組上加朱又案說文韍也所以蔽前禮記曰有虞氏韍夏后氏山殷火周龍章鄭玄曰冕之韍也舜始作之以尊祭服禹湯至周增以文飾禮記曰君朱鄭曰象裳色今依白武通注以蔽裳前上闊一尺象天數也下闊二尺象地數也長三尺象三才也加龍章山火以備三代之法也於是制袞冕之服玄衣纁裳合九章為十二等白紗內單黼領青褾襈革帶玉鉤大帶韍鹿盧玉具劍火珠鏢首白玉雙佩玄組大小綬朱襪赤舄舄飾以金宗廟社稷籍田方澤朝日夕月遣將授律征還飲至加元服納后正冬受朝臨軒拜爵皆服之通天冠之制案董巴志冠高九寸形正豎頂少邪却後乃直下為鐵卷梁前有高山故禮圖或謂之高山冠也晉起居注成帝咸和五年制詔殿內曰平天通天冠並不能佳可更修理之雖在禮無文故知天子所冠其來久矣又徐氏輿服注曰通天冠高九寸黑介幘金博山徐爰亦曰博山附蟬謂之金顏今制依此不通於下獨天子元會臨軒服之其服絳紗袍深衣制白紗內單皂領褾裾襈絳紗蔽膝白假帶方心曲領其劍佩綬舄革帶皆與上同元冬饗會諸祭還則服之四時視朔則內單領襈各隨其方色唯秋方色白以緑代之遠遊冠之制案漢雜事曰太子諸王服之故淮南子曰楚莊王冠通梁組纓注云通梁遠遊也晉令皇太子諸王給遠遊冠徐氏雜注曰天子雜服遠遊五梁太子諸王三梁董巴志曰制如通天有展筒橫之幘上今制依此天子加金博山九首施珠翠黑介幘金緣以承之翠緌纓犀簪導太子親王加金附蟬宗室王去附蟬並不通於庶姓其乘輿遠遊冠服白紗單衣承以裙襦烏皮履拜山陵則服之武辨之制案徐爰宋志謂籠冠是也禮圖曰武士服之董巴輿服志云諸常侍內常侍加黃金附蟬毦尾謂之惠文冠今制天子金博山三公已上玉冠枝四品已上金枝侍臣加附蟬毦豐貂文官七品已上毦白筆八品已下及武官皆不毦筆其乘輿武辨之服衣裳綬如通天之服講武出征四時搜狩大射禡類宜社賞祖罰社纂嚴皆服之辨之制案五經通義高五寸前後玉飾詩云璯辨如星董巴曰以鹿皮為之尚書顧命四人綦辨執戈故知自天子至于執戈通貴賤矣魏臺訪議曰天子以五采玉珠十二飾之今參準此通用烏漆紗而為之天子十二琪皇太子及一品九琪二品八琪三品七琪四品六琪五品五琪六品已下無琪唯文官服之不通武職案禮圖有結纓而無筓導少府少監何稠請施象牙簪導詔許之辨加簪導自茲始也乘輿鹿皮辨服緋大襦白羅裙金烏皮履革帶小綬長二尺六寸色同大綬而首半之間施三玉環白玉佩一隻視朝聽訟則服之凡辨服自天子已下內外九品已上辨皆以烏為質並衣袴褶五品已上以紫六品已下以絳宿衛及在仗內加兩襠螣蛇絳衣連裳典謁贊引流外冗吏通服之以縵後制鹿皮辨以賜近臣帽古野人之服也董巴云上古穴居野處衣毛帽皮以此而言不施衣冠明矣案宋齊之間天子宴私著白高帽士庶以烏其制不定或有卷荷或有下裙或有紗高屋或有烏紗長耳後周之時咸著突騎帽如今胡帽垂裙覆帶蓋索髮之遺象也又文帝項有瘤疾不欲人見每常著焉相魏之時著而謁帝故後周一代將為雅服小朝公宴咸許戴之開皇初高祖常著烏紗帽自朝貴已下至于冗吏通著入朝今復制白紗高屋帽其服練裙襦烏皮履宴接賓客則服之白帢案傅子魏太祖以天下凶荒資財乏匱擬古皮辨裁縑帛以為之蓋自魏始也梁令天子為朝臣等舉哀則服之今亦準此其服白紗單衣承以裙襦烏皮履舉哀臨喪則服之幘案董巴云起於秦人施於武將初為絳袙以表貴賤焉至漢孝文時乃加以高顏孝元帝額有壯髮不欲人見乃始進幘又董偃召見緑幘傅韝東觀記云詔賜段熲赤幘大冠一具故知自上已下至于皂隸及將帥等皆通服之今天子畋獵御戎文官出遊田里武官自一品已下至于九品並流外吏色皆同烏人以緑卒及馭人以赤舉輦人以黃駕五輅人逐其車色承遠遊進賢者施以掌導謂之介幘承武辨者施以筓導謂之平巾其乘輿黑介幘之服紫羅褶南布袴玉梁帶紫絲鞋長靿靴畋獵豫遊則服之皇太子服六等袞冕九旒朱組纓青纊珫耳犀簪導紺衣纁裳去日月星辰為九章白紗內單黼黻領青褾襈裾革帶金鉤大帶韍二章玉具劍侍從祭祀及謁廟加元服納妃則服之據晉咸寧四年故事衣色用玄改用紺舊章用織成降以繡玉具劍故事以火珠鏢首改以白珠開皇中皇太子冕同天子貫白珠及仁壽元年煬帝為太子以白珠太逼表請從青珠於是太子袞冕與三公王等皆青珠九旒旒短不及髆降天子二寸遠遊冠金附蟬加寶飾珠翠九首珠纓翠緌犀簪導絳紗袍白紗內單皂領褾襈裾白假帶方心曲領絳紗蔽膝襪舄革帶劍佩綬同袞冕未冠則雙童髻空頂黑介幘雙玉導加寶飾珠翠二首謁廟還元日朔旦入朝釋奠則服之始後周采用周禮皇太子朝賀皆袞冕九章服開皇初自非助祭皆冠遠遊冠至此牛弘奏云皇太子冬正大朝請服袞冕帝問給事郎許善心曰太子朝謁著遠遊冠有何典故對曰晉令皇太子給五時朝服遠遊冠至宋泰始六年更議儀注儀曹郎丘仲起議案周禮公自袞冕已下至卿大夫之玄冕皆其朝聘之服也伏尋古之公侯尚得服袞以入朝見況皇太子儲副之尊謂宜式遵盛典服袞朝賀兼左丞陸澄議服冕以朝實著經典自秦除六冕之制後漢始備古章魏晉以來非祀宗朝不欲令臣下服於袞冕位為公者必加侍官故太子入朝因亦不著但承天作副禮絶羣后宜遵前王之令典革近代之陋制皇太子朝請服冕自宋以下始定此儀至梁簡文之為太子嫌於上逼還冠遠遊下及於陳皆依此法後周之時亦言服袞入朝至于開皇復遵魏晉故事臣謂袞冕之服章玉雖差一日而觀頗欲相類臣子之道義無上逼故晉武帝太始三年詔太宰安平王孚著侍內之服四年又賜趙燕樂安王等散騎常侍之服自斯以後台鼎貴臣並加貂璫武辨故皇太子遂著遠遊謙不逼尊於理為允帝曰善竟用開皇舊式遠遊三梁冠從省服絳紗單衣革帶金鉤假帶方心佩一隻紛長六尺四寸闊二寸四分色同於綬金縷鞶囊白襪烏皮履金飾五日常朝則服之鹿皮辨九琪服絳羅襦白羅裙革帶履襪佩紛如從省服在宮聽政則服之平巾黑幘玉冠枝金花飾犀簪導紫羅褶南布袴玉梁帶長靿靴侍從田狩則服之白帢素單衣烏衣履為宮臣舉哀弔喪則服之諸王三公已下為服之制袞冕九章服三公攝祭及諸王初受冊贄入朝助祭親迎則服之綬各依其色鷩冕案禮圖王祭先公及卿之服天子九旒用玉二百一十六侯伯服以助祭七旒用玉八十新制依此服七章三品及公侯助祭則服之毳冕案禮圖王祀四望山川之服天子七旒用玉百六十八子男服以助祭五旒用玉五十新制依此服五章四品及伯助祭則服之冕案禮圖王者祭社稷五祀之服天子五旒用玉百二十孤卿服以助祭四旒用玉三十二新制依此服三章五品及子男助祭則服之玄冕案禮圖王祭羣小祀及視朝服天子四旒用玉三十二諸侯服以祭其宗廟三旒用玉十八新制依此服三章通給庶姓一品已下五品已上自製于家祭其私廟三品省衣粉米加三重裳黼黻加二重四品減黼一重五品減黻一重禮自玄冕以上加旒一等天子祭祀節級服之開皇以來天子唯用袞冕自鷩之下不施於尊具依前式而六等之冕皆有黈纊黃綿為之其大如橘自皇太子以下三犀導青纓爵辨案董巴志同於爵形一名冕有收持筓所謂夏收殷冔者也祠天地五郊明堂雲翹舞人服之禮云朱干玉戚冕而舞大夏此之謂也禮圖云士助君祭服之色如爵頭無旒有纊新制依此角為簪導衣青裳縓並縵無章六品已下皆通服之遠遊冠服王所服也衣裳內單如皇太子佩山玄玉金章龜鈕宋孝建故事亦謂之璽今文曰印又並歸於官府身不自佩例以銅易之大綬四采小綬同色施二玉環玉具劍烏皮舄舄加金飾唯帝子宗室封國王者服之進賢冠案漢官云平帝元始五年令公卿列侯冠三梁二千石兩梁千石以下一梁梁別貴賤自漢始也董巴釋曰如緇布冠文儒之服也前高七寸而却後高三寸而立王莽之時以幘承之新制依此內外文官通服之三品已上三梁五品已上兩梁九品已上一梁用明尊卑之等也其朝服亦名具服絳紗單衣白紗內單玄領裾襈袖革帶金鉤假帶曲領方心絳紗蔽膝白襪烏皮舄雙佩綬如遠遊之色自一品已下五品已上衣服盡同而綬依其品陪祭朝饗拜表凡大事皆服之六品七品綬八品九品去白筆內單而用履代舄其五品已上一品已下又有公服亦名從省服並烏皮履去曲領內單白筆蔽膝開皇故事亦去鞶囊佩綬何稠請去大綬而偏垂一小綬綴於獸頭鞶囊獨一隻佩正當於後詔從之一品已下五品已上同高山冠案董巴志云一曰側注謁者僕射之所服也胡伯始以為齊王冠秦滅齊以賜謁者傅子曰魏明帝以高山冠似通天乃毀變其形除去卷筒令如介幘幘上加物以象山峯行人使者通皆服之新制參用其事形如進賢於冠前加三峯以象魏制謁者大夫已下服之梁依其品獬豸冠案禮圖曰法冠也一曰柱後惠文如淳注漢官曰惠蟬也細如蟬翼今御史服之禮圖又曰獬豸冠高五寸秦制也法官服之董巴志曰獬豸神羊也蔡雍云如麟一角應劭曰古有此獸主觸不直故執憲者為冠以象之秦滅楚以其冠賜御史此即是也開皇中御史戴却非冠而無此色新制又以此而代却非御史大夫以金治書侍御史以犀侍御史已下用羚羊角獨御史司隸服之巾案方言云巾趙魏間通謂之承露郭林宗傳曰林宗嘗行遇雨巾沾角折又袁紹戰敗幅巾渡河此則野人及軍旅服也制有二等今高人道士所著是林宗折角庶人農夫常服是袁紹幅巾故事用全幅皂而向後襆髮俗人謂之襆頭自周武帝裁為四腳今通於貴賤矣簪導案釋名云簪建也所以建冠於髮也一曰筓筓係也所以拘冠使不墜也導所以導擽鬢髮使入巾幘之𩹉也今依周禮天子以玉筓而導亦如之又史記曰平原君誇楚為玳瑁簪班固與弟書云今遺仲升以黑犀簪士燮集云遣功曹史貢皇太子通天犀導故知天子獨得用玉降此通用玳瑁及犀今並準是唯辨用白牙筓導焉貂蟬案漢官侍內金蟬左貂金取剛固蟬取高潔也董巴志曰內常侍右貂金璫銀附蟬內書令亦同此今宦者去貂內史令金蟬右貂納言金蟬左貂開皇時加散騎常侍在門下者皆有貂蟬至是罷之唯加常侍聘外國者特給貂蟬還則輸納於內省白筆案徐氏雜注云古者貴賤皆執笏有事則書之故常簪筆今之白筆是遺象也魏略曰明帝時大會而史簪筆今文官七品已上通毦之武職雖貴皆不毦也纓案儀禮曰天子朱纓諸侯丹組纓今冕天子已下皆朱纓又尉繚子曰天子玄纓諸侯素纓別尊卑也今不用素並從冠色焉佩案禮天子佩白玉董巴司馬彪云君臣佩玉尊卑有序所以章德也今參用杜夔之法天子白玉太子瑜玉王山玄玉自公已下皆水蒼玉綬案禮天子玄組綬侯伯朱組綬大夫純組綬世子綦組綬漢官云蕭何為相國佩緑綬公侯紫卿二千石青令長千石黑今大抵準此天子以雙綬六采玄黃赤白縹緑純玄質長二丈四尺五百首闊一尺雙小綬長二尺六寸色同大綬而首半之間施四玉環開皇用三今加一皇太子朱雙綬四采赤白縹紺純朱質長一丈八尺三百二十首闊九寸雙小綬長一尺六寸色同大綬而首半之間施三玉環開皇用二今加一三公緑綟綬四采緑黃縹紫純緑質黃文織之長一丈八尺二百四十首闊九寸與親王綬俱施二玉環諸王纁朱綬四采赤黃縹紺純朱質纁文織之長一丈八尺二百四十首闊九寸公玄朱綬四采赤縹玄紺純朱質玄文織之長一丈八尺二百四十首闊九寸侯伯青朱綬四采青赤白縹純朱質青文織長一丈六尺百八十首闊八寸子男素朱綬三采青赤白純朱質素文織之長一丈四尺百四十首闊七寸二品已上纁紫綬四采纁紫赤黃純紫質纁文織之長一丈四尺百四十首闊八寸三品紺紫綬四采紫紺黃縹純紫質紺文織之長一丈六尺百八十首闊八寸四品青綬三采青白紅純青質長一丈四尺百四十首闊七寸五品墨綬二采青紺純紺質長一丈二尺百二十首闊六寸自王公已下皆有小綬二枚色同大綬而首半之正從一品施二玉環凡有綬者皆有紛並長六尺四寸闊二寸四分隨於綬色鞶囊案禮男鞶革女鞶絲東觀書詔賜鄧遵獸頭鞶囊一枚班固與弟書遺仲升獸頭旁囊金錯鉤也古佩印皆貯懸之故有囊稱或帶於旁故班氏謂為旁囊綬印鈕也今雖不佩印猶存古制有佩綬者通得佩之無佩則不今採梁陳東齊制品極尊者以金織成二品以上服之次以銀織成三品已上服之下以綖織成五品已上服之分為三等革帶案禮博二寸禮圖曰璫綴於革帶阮諶以為有章印則於革帶佩之東觀記楊賜拜太常詔賜自所著革帶故知形制尊卑不別今博三寸半加金縷螳蜋鉤以相拘帶自大裘至于小朝服皆用之劍案漢自天子至于百官無不佩刀蔡謨議云大臣優禮皆劍履上殿非侍臣解之蓋防刃也近代以木未詳所起東齊著令謂為象劍言象於劍周武帝時百官燕會並帶刀升座至開皇初因襲舊式朝服登殿亦不解焉十二年因蔡徵上事始制凡朝會應登殿坐者劍履俱脫其不坐者勑召奏事及須升殿亦就席解劍乃登納言黃門內史令侍郎舍人既夾侍之官則不脫其劍皆真刃非假既合舊典弘制依定又準晉咸康元年定令故事自天子已下皆衣冠帶劍今天子則玉具火珠鏢首餘皆玉鏢首唯侍臣帶劍上殿自王公已下非殊禮引升殿皆就席解而後升六品以下無佩綬者皆不帶曲領案釋名在單衣內襟領上橫以雍頸七品已上有內單者則服之從省服及八品已下皆無珽案禮天子搢珽方正於天下也又五經異義天子笏曰珽珽直無所屈也今制準此長尺二寸方而不折以球玉為之笏案禮諸侯以象大夫魚須文竹士以竹本象可也凡有指畫於君前受命書於笏笏畢用也五經要義曰所以記事防忽忘禮圖云度二尺有六寸中博二寸其殺六分去一晉宋以來謂之手板此乃不經今還謂之笏以法古名自西魏以降五品已上通用象牙六品已下兼用竹木履舄案圖云復下曰舄單下曰履夏葛冬皮近代或以重皮而不加木失於乾臘之義今取乾臘之理以木重底冕服者色赤冕衣者色烏履同烏色諸非侍臣皆脫而升殿凡舄唯冕服及具服著之履則諸服皆用唯褶服以靴靴胡履也取便於事施於戎服諸建華夋鳥鶡冠委貌長冠樊噲却敵巧士術氏却非等前代所有皆不採用皇后服四等有褘衣鞠衣青服朱服褘衣深青質織成領袖文以翬翟五采重行十二等首飾花十二鈿小花毦十二樹並兩博鬢素紗內單黼領羅縠褾襈色皆以朱蔽膝隨裳色以緅為緣用翟三章大帶隨衣裳飾以朱緑之錦青緣革帶青襪舄舄以金飾白玉佩玄組綬章采尺寸同於乘輿祭及朝會凡大事皆服之鞠衣黃羅為質織成領袖小花十二樹蔽膝革帶及舄隨衣色餘準褘衣親蠶服也青服去花大帶及佩綬金飾履禮見天子則服之朱服制如青服宴見賓客則服之有金璽盤螭鈕文曰皇后之璽冬正大朝則並黃琮各以笥貯進於座隅皇太后服同於后服而貴妃以下並亦給印貴妃德妃淑妃是為三妃服褕翟之衣首飾花九鈿并二博鬢金章龜鈕文從其職紫綬一百二十首長一丈七尺金縷織成獸頭鞶囊佩于闐玉順儀順容順華修儀修容修華充儀充容充華是為九嬪服闕翟之衣首飾花八鈿並二博鬢金章龜鈕文從其職紫綬一百首長一丈七尺金縷織成獸頭鞶囊佩采玉婕妤銀縷織成獸頭鞶囊首飾花七鈿他如嬪服美人才人服鞠衣首飾花六鈿並二博鬢銀印圭鈕文從其職青綬八十首長一丈六尺綵縷織成獸爪鞶囊佩水蒼玉寶林服展衣首飾花五鈿並二博鬢銀印環鈕文如其職艾綬八十首長一丈六尺鞶囊佩玉同於婕妤承衣刀人采女皆服褖衣無印綬參準宋泰始四年及梁陳故事增損用之皇太子妃服褕翟之衣青質五采織成為搖翟以備九章首飾花九鈿並二博鬢金璽龜鈕文如其職素紗內單黼領羅褾襈色皆用朱蔽膝二章大帶同褘衣青緑革帶朱襪青舄舄加金飾佩瑜玉纁朱綬一百六十首長二丈獸頭鞶囊凡大禮見皆服之唯侍親桑則用鞠衣之服花鈿佩綬與褕衣同準宋孝建二年故事而增損之良娣鞠衣之服銀印圭鈕文如其職佩采玉青綬八十首長一丈六尺獸爪鞶囊餘同世婦保林八子展衣之服銅印環鈕文如其職佩水蒼玉艾綬八十首長一丈六尺獸爪鞶囊自良娣等準宋大明六年故事而損益之諸王太妃妃長公主公主三公夫人一品命婦褕翟之服繡為九章首飾花九鈿佩山玄玉獸頭鞶囊綬同夫色公夫人縣主二品命婦亦服褕翟繡為八章首飾八鈿侍從親桑同用鞠衣自此之下佩皆水蒼玉侯伯夫人三品命婦亦服褕翟繡為七章首飾七鈿子夫人四品命婦服闕翟之衣刻赤繒為翟綴於服上以為六章首飾六鈿男夫人五品命婦亦服闕翟之衣刻繒為翟綴於服上以為五章首飾五鈿若當從侍親桑皆同鞠衣議既定帝幸修文殿覽之乃令何稠起部郎閻毗等造樣上呈二年總了始班行焉軒冕之盛貫古今矣三年正月朔旦大陳文物時突厥染干朝見慕之請襲冠冕帝不許明日率左光祿大夫褥但特勤阿史那職御左光祿大夫特勤阿史那伊順右光祿大夫意利發史蜀胡悉等並拜表固請衣冠帝大悅謂弘等曰昔漢制初成方知天子之貴今衣冠大備足致單于解辮此乃卿等功也弘愷善心世基何稠閻毗等賜帛各有差並事出優厚是後師旅務殷車駕多行幸百官行從唯服袴褶而軍旅間不便至六年後詔從駕涉遠者文武官等皆戎衣貴賤異等雜用五色五品已上通著紫袍六品已下兼用緋緑胥吏以青庶人以白屠商以皂士卒以黃卓彼上天宮室混成玄戈居其左上將居其右弧矢揚威羽林置陳易曰天垂象聖人則之昔軒轅氏之有天下也以師兵為營衛降至三代其儀大備西漢武帝每上甘泉則列鹵簿車千乘騎萬匹其居前殿則植戟懸楯以戒不虞其所由來者尚矣梁武受禪于齊侍衛多循其制正殿便殿閣及諸門上下各以直閣將軍等直領又置刀釤御刀御楯之屬直御左右兼有御仗鋋矟赤氅角抵勇士青氅衛仗長刀刀劍細仗羽林等左右二百七十六人以分直諸門行則儀衛左右又有左右夾轂蜀客楯劍格獸羽林八從遊蕩十二不從遊蕩直從細射廉察刀戟腰弩大弩等隊凡四十九隊亦分直諸門上下行則量為儀衛東西掖端大司馬東西華承明大通等門又各二隊及防殿三隊雖行幸不從又有八馬遊蕩馬左右夾轂左右馬百騎等各二隊及騎官閲武馬容雜伎馬容及左右馬騎直隊行則侍衛左右分為警衛車駕晨夜出入及涉險皆作函鹵簿應宿衛軍騎皆執兵持滿各當其所保護方面天明及度險乃奏解函撾鼓而依常列乘輿行則有大駕法駕小駕大駕以郊饗上天臨馭九伐法駕以祭方澤祀明堂奉宗廟藉千畝小駕以敬園陵親搜狩大駕則公卿奉引大將軍驂乘太僕馭法駕小駕皆侍中驂乘奉車郎馭公卿不引其餘行幸送往勞旋則槊仗近宴則隊仗三駕法天二仗法地其動也參天而兩地也陳氏承梁亦無改革齊文宣受禪之後警衛多循後魏之儀及河清中定令宮衛之制左右各有羽林郎十二隊又有持鈒隊鋋槊隊長刀隊細仗隊楯鎩隊雄戟隊格獸隊赤氅隊角抵隊羽林隊步遊蕩隊馬遊蕩隊又左右各武賁十隊左右翊各四隊又步遊蕩馬遊蕩左右各三隊是為武賁又有直從武賁左右各六隊在左者為前驅隊在右者為後拒隊又有募員武賁隊強弩隊左右各一隊在左者皆左衛將軍總之在右者皆右衛將軍總之以備警衛其領軍中領將軍侍從出入則著兩襠甲手執柳杖左右衛將軍將軍則兩襠甲手執檀杖侍從左右則有千牛備身左右備身刀劍備身之屬兼有武威熊渠鷹揚等備身三隊皆領左右將軍主之宿衛左右而戎服執仗兵有斧鉞弓箭刀矟旌旗皆囊首五色節文斾悉赭黃天子御正殿唯大臣夾侍兵仗悉在殿下郊祭鹵簿則督將平巾幘緋衫甲大口袴後周警衛之制置左右宮伯掌侍衛之禁各更直於內小宮伯二之臨朝則分在前侍之首並金甲各執龍環金飾長刀行則夾路車左右中侍掌御寢之禁皆金甲左執龍環右執獸環長刀並飾以金次左右侍陪中侍之後並銀甲左執鳳環右執麟環長刀次左右前侍掌御寢南門之左右並銀甲左執師子環右執象環長刀次左右後侍掌御寢北門之左右並銀甲左執犀環右執兕環長刀左右騎侍立於寢之東西階並銀甲左執羆環右執熊環長刀十二人兼執師子彤楯列左右侍之外自左右侍以下刀並以銀飾左右宗侍陪左右前侍之後夜則衛於寢庭之中皆服金塗甲左執豹環右執貔環長刀並金塗飾十二人兼執師子彤楯列於左右騎侍之外自左右中侍已下皆行則兼帶黃弓矢巡田則常服帶短刀如其長刀之飾左右庶侍掌非皇帝所御門閣之禁並服金塗甲左執解豸環右執環長劍並金飾十二人兼執師子彤楯列於左右宗侍之外行則兼帶皓弓矢左右勳侍掌陪左右庶侍而守出入則服金塗甲左執吉良環右執猙環長劍十二人兼執師子彤楯列於左右庶侍之外行則兼帶盧弓矢巡田則與左右庶侍俱常服佩短劍如其長劍之飾諸侍官大駕則俱侍中駕及露寢半之小駕三分之一左右武伯掌內外衛之禁令兼六率之士皇帝臨軒則備三仗於庭服金甲執金扣杖立於殿上東西階之側行則列兵於帝之左右從則服金甲被繡袍左右小武伯各二人二之服執同於武伯分立於大武伯下及露門之左右孰行幸則加錦袍左右武賁率掌武賁之士其隊器服皆玄以四色飾之各總左右持鈒之隊皇帝臨露寢則立於左右三仗第一行之南北出則分在隊之先後其副率二之左右旅賁率掌旅賁士其隊器服皆青以朱為飾立於三仗第二行之南北其副率二之左右射聲率掌射聲之士其器服皆朱以黃為飾立於三仗第三行之南北其副率二之左右驍騎率掌驍騎之士器服皆黃以皓為飾立於三仗第四行之南北其副率二之左右羽林率掌羽林之士其隊器服皆皓以玄為飾立於三仗第五行之南北其副率二之左右遊擊率掌遊擊之士其器服皆玄以青為飾其副率二之武賁已下六率通服金甲師子文袍執銀扣檀杖副率通服金甲獸文袍各有倅長帥長相次陪列行則引前倅長通服銀甲豹文袍帥長通服銀甲鶡文袍自副率已下通執獸環銀飾長刀凡大駕則盡行中駕及露寢則半之小駕半中駕常行軍旅則衣色尚烏高祖受命因周齊宮衛微有變革戎服臨朝大仗則領左右大將軍二人分在左右廂左右直寢左右直齊左右直後千牛備身左右備身等夾侍供奉於左右及坐後左右衛大將軍左右直閣將軍以次左右衛將軍各領儀刀為十二行內四行親衛行別以大都督領次外四行勳衛以帥都督領次外四行翊衛以都督領行各二人執金花師子楯猿刀一百四十人分左右帶橫刀後監門直長十二人左青龍旗右白獸旗左右武衛開府各領三仗六行在大仗內行別六十人大都督一人領之帥都督一人後之大駕則執黃麾仗其次戟二十四左青龍幢右白獸幢畢各一鈒金二十四金節十二道蓋獸又絳引幡朱幢為持鈒前隊應蹕大都督二人領之在御前橫街南左右武衛大將軍領大仗左右廂各六行行別三百六十人大都督一人領之及大業四年煬帝北巡出塞行宮設六合城方一百二十步高四丈二尺六合以木為之方六尺外面一方有板離合為之塗以青色壘六板為城高三丈六尺上加女牆板高六尺開南北門又於城四角起樓敵二門觀門樓檻皆丹青綺畫又造六合殿千人帳載以槍車車載六合三板其車軨解合交叉即為馬槍每車上張幕幕下張平一弩傅矢五人更守兩車之間施車軨馬槍皆外其轅以為外圍次內布鐵菱次內施蟄鞬每一蟄鞬中施弩牀長六尺闊三尺牀桄陛插鋼錐皆長五寸謂之蝦鬚皆施機關張則錐皆外向其牀上施旋機弩以繩連弩機人從外來觸繩則弩機旋轉向觸所而發其外又以矰周圍行宮二丈一鈴一柱柱舉矰去地二尺五寸當行宮南北門施槌磬連矰以機發之有人觸矰則衆鈴發響槌擊兩磬以知所警名為擊警八年征遼又造鉤陳以木板連如帳子張之則綺文卷之則直焉帝御營與賊城相對夜中設六合城周回八里城及女垣合高十仞上布甲士立仗建旗又四隅有闕面別一觀觀下開三門其中施行殿殿上容侍臣及三衛仗合六百人一宿而畢望之若真高麗旦忽見謂之為神焉

body:
  text: 隋書卷六十八列傳第三十三宇文愷宇文愷字安樂嵵國公忻之弟也在周以功臣子年三歲賜爵雙泉伯七歲進封安平郡公邑二千戶愷少有器局家世武將諸兄並以弓馬自達愷獨好學博覽書記解屬文多伎藝號為名父公子初為千牛累遷御正中大夫儀同三司高祖為丞相加上開府中大夫及踐阼誅宇文氏愷初亦在殺中以其與周本別兄忻有功於國使人馳赦之僅而得免後拜營宗廟副監太子左庶子廟成別封甑山縣公邑千戶及遷都上以愷有巧思詔領營新都副監高熲雖總大綱凡所規畫皆出於愷後決渭水達河以通運漕詔愷總督其事後拜萊州刺史甚有能名兄忻被誅除名於家久不得調會朝廷以魯班故道久絕不行令愷修復之既而上建仁壽宮訪可任者右僕射楊素言愷有巧思上然之於是檢校將作大匠歲餘拜仁壽宮監授儀同三司尋為將作少監文獻皇后崩愷與楊素營山陵事上善之復爵安平郡公邑千戶煬帝即位遷都洛陽以愷為營東都副監尋遷將作大匠愷揣帝心在宏侈於是東京制度窮極壯麗帝大悅之進位開府拜工部尚書及長城之役詔愷規度之時帝北巡欲誇戎狄令愷為大帳其下坐數千人帝大悅賜物千段又造觀風行殿上容侍衞者數百人離合為之下施輪軸推移倏忽有若神功戎狄見之莫不驚駭帝彌悅焉前後賞賚不可勝紀自永嘉之亂明堂廢絕隋有天下將復古制議者紛然皆不能決博考羣籍奏明堂議表曰臣聞在天成象房心為布政之宮在地成形丙午居正陽之位觀雲告月順生殺之序五室九宮統人神之際金口木舌發令兆民玉瓚黃琮式嚴宗祀何嘗不矜莊扆宁盡妙思於規摹凝睟冕旒致子來於矩伏惟皇帝陛下提衡握契御辯乘乾減五登三復上皇之化流凶去暴丕下武之緒用百姓之異心驅一代以同域康哉康哉民無能而名矣故使天符地寶吐醴飛甘造物資生澄源反朴九圍清謐四表削平襲我衣冠齊其文軌茫茫上玄陳珪璧之敬肅肅清廟感霜露之誠正金奏九韶六莖之樂定石渠五官三雍之禮乃卜瀍西爰謀洛食辨方面勢仰禀神謀敷土濬川為民立極兼聿遵先言表置明堂爰詔下臣占星揆日於是採崧山之祕簡披汶水之靈圖訪通議於殘亡購冬官於散逸總集衆論勒成一家昔張衡渾象以三分為一度裴秀輿地以二寸為千里臣之此圖用一分為一尺推而演之冀輪奐有序而經構之旨議者殊途或以綺井為重屋或以圓楣為隆棟各以臆說事不經見今錄其疑難為之通釋皆出證據以相發明議曰臣愷謹案淮南子曰昔者神農之治天下也甘雨以時五穀蕃植春生夏長秋收冬藏月省時考終歲獻貢以時嘗穀祀于明堂明堂之制有蓋而無四方風雨不能襲燥濕不能傷遷延而入之臣愷以為上古朴略創立典刑尚書帝命驗曰帝者承天立五府以尊天重象赤曰文祖黃曰神斗白曰顯紀黑曰玄矩蒼曰靈府注云唐虞之天府夏之世室殷之重屋周之明堂皆同矣尸子曰有虞氏曰總章周官考工記曰夏后氏世室堂脩二七博四脩一注云脩南北之深也夏度以步今堂脩十四步其博益以四分脩之一則明堂博十七步半也臣愷按三王之世夏最為古從質尚文理應漸就寬大何因夏室乃大殷堂相形為論理恐不爾記云堂脩七博四脩一若夏度以步則應脩七步注云今堂脩十四步乃是增益記文殷周二堂獨無加字便是其義類例不同山東禮本輒加二七之字何得殷無加尋之文周闕增筵之義研覈其趣或是不然讎校古書並無二字此乃桑間俗儒信情加減黃圖議云夏后氏益其堂之大一百四十四尺周人明堂以為兩杼間馬宮之言止論堂之一面據此為準則三代堂基並方得為上圓之制諸書所說並云下方鄭注周官獨為此義非直與古違異亦乃乖背禮文尋文求理深恐未愜尸子曰殷人陽館考工記曰殷人重屋堂脩七尋堂崇三尺四阿重屋注云其脩七尋五丈六尺放夏周則其博九尋七丈二尺又曰周人明堂度九尺之筵東西九筵南北七筵堂崇一筵五室凡室二筵禮記明堂位曰天子之廟複廟重檐鄭注云複廟重屋也注玉藻云天子廟及露寢皆如明堂制禮圖云於內室之上起通天之觀觀八十一尺得宮之數其聲濁君之象也大戴禮曰明堂者古有之凡九室一室有四戶八牖以茅蓋上圓下方外水曰璧雝赤綴戶白綴牖堂高三尺東西九仞南北七筵其宮方三百步凡人民疾六畜疫五穀災生於天道不順天道不順生於明堂不飾故有天災則飾明堂周書明堂曰堂方百一十二尺高四尺階博六尺三寸室居內方百尺室內方六十尺戶高八尺博四尺作洛曰明堂太廟露寢咸有四阿重亢重廊孔氏注云重亢累棟重廊累屋也禮圖曰秦明堂九室十二階各有所居呂氏春秋曰有十二堂與月令同並不論尺丈臣愷案十二階雖不與禮合一月一階非無理思黃圖曰堂方百四十四尺法坤之策也方象地屋圓楣徑二百一十六尺法乾之策也圓象天太室九宮法九州太室方六丈法陰之變數十二堂法十二月三十六戶法極陰之變數七十二牖法五行所行日數八達象八風法八卦通天臺徑九尺法乾以九覆六高八十一尺法黃鍾九九之數二十八柱象二十八宿堂高三尺土階三等法三統堂四向五色法四時五行殿門去殿七十二步法五行所行門堂長四丈取太室三之二垣高無蔽目之照牖六尺其外倍之殿垣方在水內法地陰也水四周於外象四海圓法陽也水闊二十四丈象二十四氣水內徑三丈應覲禮經武帝元封二年立明堂汶上無室其外略依此制泰山通議今亡不可得而辨也元始四年八月起明堂辟雍長安城南門制度如儀一殿垣四面門八觀水外周堤壤高四尺和會築作三旬五年正月六日辛未始郊太祖高皇帝以配天二十二日丁亥宗祀孝文皇帝於明堂以配上帝及先賢百辟卿士有益者於是秩而祭之親扶三老五更袒而割牲跪而進之因班時令宣恩澤諸侯王宗室四夷君長匈奴西國侍子悉奉貢助祭禮圖曰建武三十年作明堂明堂上圓下方上圓法天下方法地十二堂法日辰九室法九州室八牕八九七十二法一時之王室有二戶二九十八戶法土王十八日內堂正壇高三尺土階三等胡伯始注漢官云古清廟蓋以茅今蓋以瓦瓦下藉茅以存古制東京賦曰乃營三宮布政頒常複廟重屋八達九房造舟清池惟水泱泱薛綜注云複重廇覆謂屋平覆重棟也續漢書祭祀志云明帝永平二年祀五帝於明堂五帝坐各處其方黃帝在未皆如南郊之位光武位在青帝之南少退西面各一犢奏樂如南郊臣愷按詩云我將祀文王於明堂我將我享維牛維羊據此則備太牢之祭今云一犢恐與古殊自晉以前未有鵄尾其圓牆璧水一依本圖晉起居注裴頠議曰尊祖配天其義明著廟宇之制理據未分直可為一殿以崇嚴祀其餘雜碎一皆除之臣愷案天垂象聖人則之辟雍之星既有圖狀晉堂方構不合天文既闕重樓又無璧水空堂乖五室之義直殿違九階之文非古欺天一何過甚後魏於北臺城南造圓牆在璧水外門在水內迥立不與牆相連其堂上九室三三相重不依古制室間通巷違舛處多其室皆用墼累極成褊陋後魏樂志曰孝昌二年立明堂議者或言九室或言五室詔斷從五室後元叉執政復改為九室遭亂不成宋起居注曰孝武帝大明五年立明堂其牆宇規範擬則太廟唯十二間以應朞數依漢汶上圖儀設五帝位太祖文皇帝對饗鼎俎簠簋一依廟禮梁武即位之後移宋時太極殿以為明堂無室十二間禮疑議云祭用純漆俎瓦樽文於效質於廟止一獻用清酒平陳之後臣得目觀遂量步數記其尺丈猶見基內有焚燒殘柱毀斫之餘入地一丈儼然如舊柱下以樟木為跗長丈餘闊四尺許兩兩相並凡安數重宮城處所乃在郭內雖湫隘卑陋未合規摹祖宗之靈得崇嚴祀周齊二代闕而不修大饗之典於焉靡託自古明堂圖惟有二本一是宗周劉熙阮諶劉昌宗等作三圖略同一是後漢建武三十年作禮圖有本不詳撰人臣遠尋經傳傍求子史研究衆說總撰今圖其樣以木為之下為方堂堂有五室上為圓觀觀有四門帝可其奏會遼東之役事不果行以渡遼之功進位金紫光祿大夫其年卒官時年五十八帝甚惜之諡曰康撰東都圖記二十卷明堂圖議二卷釋疑一卷見行於世子儒童游騎尉少子溫起部承務郎閻毗閻毗榆林盛樂人也祖進魏本郡太守父慶周上柱國寧州總管毗七歲襲爵石保縣公邑千戶及長儀貌矜嚴頗好經史受漢書於蕭該略通大旨能篆書工草隸尤善畫為當時之妙周武帝見而悅之命尚清都公主宣帝即位拜儀同三司授千牛左右高祖受禪以技藝侍東宮數以琱麗之物取悅於皇太子由是甚見親待每稱之於上尋拜車騎宿衞東宮上嘗遣高熲大閱於龍臺澤諸軍部伍多不齊整唯毗一軍法制肅然熲言之於上特蒙賜帛俄兼太子宗衞率長史尋加上儀同太子服玩之物多毗所為及太子廢毗坐杖一百與妻子俱配為官奴婢後二歲放免為民煬帝嗣位盛修軍器以毗性巧諳練舊事詔典其職尋授朝請郎毗立議輦輅車輿多所增損語在輿服志擢拜起部郎帝嘗大備法駕嫌屬車太多顧謂毗曰開皇之日屬車十有二乘於事亦得今八十一乘以牛駕車不足以益文物朕欲減之從何為可毗對曰臣初定數共宇文愷參詳故實據漢胡伯始蔡邕等議屬車八十一乘此起於秦遂為後式故張衡賦云屬車九九是也次及法駕三分減一為三十六乘此漢制也又據宋孝建時有司奏議晉遷江左惟設五乘尚書令建平王宏曰八十一乘議兼九國三十六乘無所準憑江左五乘儉不中禮但帝王文物旂旒之數爰及冕玉皆同十二今宜準此設十二乘開皇平陳因以為法今憲章往古大駕依秦法駕依漢小駕依宋以為差等帝曰何用秦法乎大駕宜三十六法駕宜用十二小駕除之毗研精故事皆此類也長城之役毗總其事及帝有事岳詔毗營立壇場尋轉殿內丞從幸張掖郡高昌王朝于行所詔毗持節迎勞遂將護入東都尋以母憂去職未朞起令視事將興遼東之役自洛口開渠達於涿郡以通運漕毗督其役明年兼領右翊衞長史營建臨朔宮及征遼東以本官領武賁郎將典宿衞時衆軍圍遼東城帝令毗詣城下宣諭賊弓弩亂發所乘馬中流矢毗顏色不變辭氣抑揚卒事而去尋拜朝請大夫遷殿內少監又領將作少監事後復從帝征遼東會楊玄感作逆帝班師兵部侍郎斛斯政奔遼東帝令毗率騎二千追之不及政據高麗栢崖城毗攻之二日有詔徵還從至高陽暴卒時年五十帝甚悼惜之贈殿內監何稠劉龍黃亘亘弟袞何稠字桂林國子祭酒妥之兄子也父通善玉稠性絕巧有智思用意精微年十餘歲遇江陵陷隨妥入長安仕周御飾下士及高祖為丞相召補參軍兼掌細作署開皇初授都督累遷御府監歷太府丞稠博覽古圖多識舊物波斯嘗獻金緜錦袍組織殊麗上命稠為之稠錦既成踰所獻者上甚悅時中國久絕瑠璃之作匠人無敢厝意稠以綠瓷為之與真不異尋加員外散騎侍郎開皇末桂州俚李光仕聚衆為亂詔稠召募討之師次衡嶺遣使者諭其渠帥洞主莫崇解兵降款桂州長史王文同鎖崇以詣稠所稠詐宣言曰州縣不能綏養致邊民擾叛非崇之罪也乃命釋之引崇共坐幷從者四人為設酒食而遣之崇大悅歸洞不設備稠至五更掩入其洞悉發俚兵以臨餘賊象州逆帥杜條遼羅州逆帥龐靖等相繼降款分遣建州開府梁昵討叛夷羅壽羅州刺史馮暄討賊帥李大檀並平之傳首軍門承制署首領為州縣官而還衆皆悅服有欽州刺史甯猛力帥衆迎軍初猛力倔強山洞欲圖為逆至是惶懼請身入朝稠以其疾篤因示無猜貳遂放還州與之約曰八九月間可詣京師相見稠還奏狀上意不懌其年十月猛力卒上謂稠曰汝前不將猛力來今竟死矣稠曰猛力共臣為約假令身死當遣子入侍越人性直其子必來初猛力臨終誡其子長真曰我與大使為約不可失信於國士汝葬我訖即宜上路長真如言入朝上大悅曰何稠著信蠻夷乃至於此以勳授開府仁壽初文獻皇后崩與宇文愷參典山陵制度稠性少言善候上旨由是漸見親昵及上疾篤謂稠曰汝既曾葬皇后今我方死宜好安置屬此何益但不能忘懷耳魂其有知當相見於地下上因攬太子頸謂曰何稠用心我付以後事動靜當共平章大業初煬帝將幸揚州謂稠曰今天下大定朕承洪業服章文物闕略猶多卿可討閱圖籍營造輿服羽儀送至江都也其日拜太府少卿稠於是營黃麾三萬六千人仗及車輿輦輅皇后鹵簿百官儀服依期而就送于江都所役工十萬餘人用金銀錢物鉅億計帝使兵部侍郎明雅選部郎薛邁等勾覈之數年方竟毫釐無舛稠參會今古多所改創魏晉以來皮弁有纓而無筓導稠曰此古田獵之服也今服以入朝宜變其制故弁施象牙簪導自稠始也又從省之服初無佩綬稠曰此乃晦朔小朝之服安有人臣謁帝而去印綬兼無佩玉之節乎乃加獸頭小綬及佩一隻舊制五輅於轅上起箱天子與參乘同在箱內稠曰君臣同所過為相逼乃廣為盤輿別搆欄楯侍臣立於其中於內復起須彌平坐天子獨居其上自餘麾幢文物增損極多事見威儀志帝復令稠造戎車萬乘鈎陳八百連帝善之以稠守太府卿後三歲兼領少府監遼東之役攝右屯衞將軍領御營弩手三萬人時工部尚書宇文愷造遼水橋不成師不得濟右屯衞大將軍麥鐵杖因而遇害帝遣稠造橋二日而就初稠制行殿及六合城至是帝於遼左與賊相對夜中施之其城周廻八里城及女垣合高十仞上布甲士立仗建旗四隅置闕面別一觀觀下三門遲明而畢高麗望見謂若神功是歲加金紫光祿大夫明年攝左屯衞將軍從至遼左十二年加右光祿大夫從幸江都遇宇文化及作亂以為工部尚書化及敗陷于竇建德建德復以為工部尚書舒國公建德敗歸于大唐授將作少匠卒開皇時有劉龍者河間人也性強明有巧思齊後主知之令修三爵臺甚稱旨因而歷職通顯及高祖踐阼大見親委拜右衞將軍兼將作大匠遷都之始與高熲參掌制度代號為能大業時有黃亘者不知何許人也及其弟袞俱巧思絕人煬帝每令其兄弟直少府將作于時改創多務亘袞每參典其事凡有所為何稠先令亘袞立樣當時工人皆稱其善莫能有所損益亘官至朝散大夫袞官至散騎侍郎史臣曰宇文愷學藝兼該思理通贍規矩之妙參蹤班爾當時制度咸取則焉其起仁壽宮營建洛邑要求時幸窮侈極麗使文皇失德煬帝亡身危亂之源抑亦此之由至於考覽書傳定明堂圖雖意過其通有足觀者毗稠巧思過人頗習舊事稽前王之采章成一代之文物雖失之於華盛亦有可傳於後焉

body:
  text: 隋書卷五十五列傳第二十杜彥杜彥雲中人也父遷屬葛榮之亂徙家於豳彥性勇果善騎射仕周釋褐左侍上士後從柱國陸通擊陳將吳明徹於土州破之又擊叛蠻剋倉塠白楊二柵並斬其渠帥進平郢州賊帥樊志以戰功拜大都督尋遷儀同治隆山郡事明年拜隴州刺史賜爵永安縣伯高祖為丞相從韋孝寬擊尉迥於相州每戰有功賜物三千段奴婢三十口進位上開府改封襄武縣侯拜魏郡太守開皇初授丹州刺史進爵為公後六歲徵為左武衛將軍平陳之役以行軍總管與新義公韓擒相繼而進軍至南陵賊屯據江岸彥遣儀同樊子蓋率精兵擊破其柵獲船六百餘艘渡江擊南陵城拔之擒其守將許翼進至新林與擒合軍及陳平賜物五千段粟六千石進位柱國賜子寶安爵昌陽縣公高智慧等之作亂也復以行軍總管從楊素討之別解江州圍智慧餘黨往往屯聚保投溪洞彥水陸兼進攻錦山陽父若石壁四洞悉平之皆斬其渠帥賊李擁衆數千據彭山彥襲擊破之斬傳其首又擊徐州宜豐二洞悉平之賜奴婢百餘口拜洪州總管甚有治名歲餘雲州總管賀婁子幹卒上悼惜者久之因謂侍臣曰榆林國之重鎮安得子幹之輩乎後數日上曰吾思可以鎮榆林者莫過杜彥於是徵拜雲州總管突厥來寇彥輒擒斬之北夷畏憚胡馬不敢至塞後數年朝廷復追録前功賜子寶虔爵承縣公十八年遼東之役以行軍總管從漢王至營州上以彥曉習軍旅令總統五十營事及還拜朔州總管突厥復寇雲州上令楊素擊走之是後猶恐為邊患以彥素為突厥所憚復拜雲州總管未幾以疾徵還卒時年六十子寶虔大業末文城郡丞高勱高勱字敬德渤海蓨人也齊太尉清河王嶽之子也幼聰敏美風儀以仁孝聞為齊顯祖所愛年七歲襲爵清河王十四為青州刺史歷右衛將軍領軍大將軍祠部尚書開府儀同三司改封樂安王性剛直有才幹甚為時人所重斛律明月雅敬之每有征伐則引之為副遷侍中尚書右僕射及後主為周師所敗勱奉太后歸鄴時宦官放縱儀同苟子溢尤稱寵幸勱將斬之以徇太后救之乃釋劉文殊竊謂勱曰子溢之徒言成禍福何得如此勱攘袂曰今者西寇日侵朝貴多叛正由此輩弄權致使衣冠解體若得今日殺之明日受誅無所恨也文殊甚愧既至鄴勱勸後主五品已上家纍悉置三臺之上因脅之曰若戰不捷則燒之此輩惜妻子必當死戰可敗也後主不從遂棄鄴東遁勱後殿為周軍所得武帝見之與語大悅因問齊所由勱發言流涕悲不自勝帝亦為之改容授開府儀同三司高祖為丞相謂勱曰齊所以亡者由任邪佞公父子忠良聞於鄰境宜善自愛勱再拜謝曰勱亡齊末屬世荷恩榮不能扶危定傾以致淪覆既蒙獲宥恩幸已多況復濫叨名位致速官謗高祖甚器之以勱檢校揚州事後拜楚州刺史民安之先是城北有伍子胥廟其俗敬鬼祈禱者必以牛酒至破産業勱歎曰子胥賢者豈宜損百姓乎乃告諭所部自此遂止百姓賴之七年轉光州刺史上取陳五策又上表曰臣聞夷凶翦暴王者之懋功取亂侮亡往賢之雅誥是以苗民逆命爰興兩階之舞有扈不賓終召六師之伐皆所以寧一宇內匡濟羣生者也自昔晉氏失馭天網絶維羣凶於焉蝟起三方因而鼎立陳氏乘其際運拔起細微蒨頊縱其長蛇竊據吳會叔寶肆其昏虐毒被金陵數年已來荒悖滋甚牝雞司旦昵近姦回尚方役徒積骸千數疆埸防守長戍三年或微行暴露沉湎王侯之宅或奔馳駿騎顛墜康衢之首有功不賞無辜獲戮烽燧日警未以為虞耽淫靡嫚不知紀極天厭亂德妖實人興或空𩹉時有大聲或行路共傳鬼怪或刳人肝以祠天狗或自捨身以厭妖訛民神怨憤災異荐發天時人事昭然可知臣以庸才猥蒙朝寄頻歷藩任與其鄰接密邇仇讎知其動靜天討有罪此即其時若戎車雷動戈船電邁臣雖駑怯請效鷹犬高祖覽表嘉之答以優詔及大舉伐陳以勱為行軍總管從宜陽公王世積下陳江州以功拜上開府賜物三千段隴右諸羌數為寇亂朝廷以勱有威名拜洮州刺史下車大崇威惠民夷悅附其山谷間生羌相率詣府稱謁前後至者數千餘戶豪猾屏迹路不拾遺在職數年稱為治理後遇吐谷渾來寇勱遇疾不能拒戰賊遂大掠而去憲司奏勱亡失戶口又言受羌饋遺竟坐免官後卒於家時年五十六子士廉最知名爾朱敞爾朱敞字乾羅秀容契胡人爾朱榮之族子也父彥伯官至司徒博陵王齊神武帝韓陵之捷盡誅爾朱氏敞小隨母養於宮中及年十二自竇而走至于大街見童兒羣戲者敞解所著綺羅金翠之服易衣而遁追騎尋至初不識敞便執綺衣兒比究問知非會日已暮由是得免遂入一村見長孫氏媼踞胡牀而坐敞再拜求哀長孫氏愍之藏於復壁三年購之愈急迹且至長孫氏曰事急矣不可久留資而遣之遂詐為道士變姓名隱嵩山略涉經史數年之間人頗異之嘗獨坐巖石之下泫然而歎曰吾豈終於此乎伍子胥獨何人也於是間行微服西歸于周太祖見而禮之拜大都督行臺郎中封靈壽縣伯邑千五百戶遷通直散騎常侍轉車騎大將軍儀同三司進爵為侯保定中遷使持節驃騎大將軍開府儀同三司天和中增邑五百戶歷信臨熊潼四州刺史進爵為公武帝東征上表求從許之攻城陷陳所當皆破進位上開府除南光州刺史入為護軍大將軍歲餘轉膠州刺史於是迎長孫氏及弟置於家厚資給之高祖受禪改封邊城郡公黔安蠻叛命敞討平之師旋拜金州總管尋轉徐州總管在職數年號為明肅民吏懼之後以年老上表乞骸骨賜二馬軺車歸於河內卒於家時年七十二子最嗣周搖周搖字世安其先與後魏同源初為普乃氏及居洛陽改為周氏曾祖拔拔祖右六肱俱為北平王父恕延歷行臺僕射南荊州總管搖少剛果有武藝性謹厚動遵法度仕魏官至開府儀同三司周閔帝受禪賜姓車非氏封金水郡公歷鳳楚二州刺史吏民安之從帝平齊每戰有功超授柱國進封夔國公未幾拜晉州總管時高祖為定州總管文獻皇后自京師詣高祖路經搖所主禮甚薄既而白后曰公廨甚富於財限法不敢輒費又王臣無得效私其質直如此高祖以其奉法每嘉之及為丞相徙封濟北郡公尋拜豫州總管高祖受禪復姓周氏開皇初突厥寇邊燕薊多被其患前總管李崇為虜所殺上思所以鎮之臨朝曰無以加周搖者拜為幽州總管六州五十鎮諸軍事搖修鄣塞謹斥候邊民以安後六載徙為壽州初自以年老乞骸骨上召之既引見上勞之曰公積行纍仁歷仕三代克終富貴保茲遐壽良足善也賜坐褥歸於第歲餘終于家諡曰恭時年八十四獨孤楷獨孤楷字修則不知何許人也本姓李氏父屯從齊神武帝與周師戰于沙苑齊師敗績因為柱國獨孤信所擒配為士伍給使信家漸得親近因賜姓獨孤氏楷少謹厚便弄馬槊為宇文護執刀纍轉車騎將軍其後數從征伐賜爵廣阿縣公邑千戶拜右侍下大夫周末從韋孝寬平淮南以功賜子景雲爵西河縣公高祖為丞相進授開府每督親信兵及受禪拜右監門將軍進封汝陽郡公數歲遷右衛將軍仁壽初出為原州總管時蜀王秀鎮益州上徵之猶豫未發朝廷恐秀生變拜楷益州管馳傳代之秀果有異志楷諷諭久之乃就路楷察秀有悔色因勒兵為備秀至興樂去益州四十餘里將反襲楷密令左右覘所為知楷不可犯而止楷在益州甚有惠政蜀中父老于今稱之煬帝即位轉並州總管遇疾喪明上表乞骸骨帝曰公先朝舊臣歷職二代高風素望臥以鎮之無勞躬親簿領也遣其長子凌雲監省郡事其見重如此數載轉長平太守未視事而卒諡曰恭子凌雲平雲彥雲皆知名楷弟盛見誠節傳乞伏慧乞伏慧字令和馬邑鮮卑人也祖周魏銀青光祿大夫父纂金紫光祿大夫並為第一領民酋長慧少慷慨有大節便弓馬好鷹犬齊文襄帝時為行臺左丞加蕩寇將軍纍遷右衛將軍太僕卿自永寧縣公封宜民郡王其兄貴和又以軍功為王一門二王稱為貴顯周武平齊授使持節開府儀同大將軍拜佽飛右旅下大夫轉熊渠中大夫高祖為丞相從韋孝寬擊尉惇於武陟所當皆破授大將軍賜物八百段及平尉迥進位柱國賜爵西河郡公邑三千戶賚物二千三百段請以官爵讓兄朝廷不許論者義之高祖受禪拜曹州刺史曹土舊俗民多姦隱戶口簿帳不以實慧下車按察得戶數萬遷涼州總管先是突厥屢為寇抄慧於是嚴警烽燧遠為斥候虜亦素憚其名竟不入境歲餘轉齊州刺史得隱戶數千遷壽州總管其年左轉嵵州刺史在職數年遷徐州總管時年逾七十上表求致仕不許俄轉荊州總管又領潭桂二州總管三十一州諸軍事其俗輕剽慧躬行朴素以矯之風化大洽曾見人以捕魚者出絹買而放之其仁心如此百姓美之號其處曰西河公轉秦州總管煬帝即位為天水太守大業五年征吐谷渾郡濱西境民苦勞役又遇帝西巡坐為道不整獻食疏薄帝大怒命左右斬之見其無髮乃釋除名為民卒於家張威張威不知何許人也父琛魏弘農太守威少倜儻有大志善騎射膂力過人在周數從征伐位至柱國京兆尹封長壽縣公邑千戶王謙作亂高祖以威為行軍總管從元帥梁睿擊之軍次通谷謙守將李三王擁徑兵拒守睿以威為先鋒三王初閉壘不戰威令人詈侮以激怒之三王果出陳威令壯士奮擊三王軍潰大兵繼至於是擒斬四千餘人進至開遠謙將趙儼衆十萬連營三十里威鑿山通道自西嶺攻其背儼遂敗走追至成都與謙大戰威將中軍及謙平進位上柱國拜瀘州總管高祖受禪歷幽洛二州總管改封晉熙郡公尋拜河北道行臺僕射後督晉王軍府事數年拜青州總管賜錢八十萬米五百石雜綵三百段威在青州頗治産業遣家奴於民間鬻蘆蔔根其奴緣此侵擾百姓上深加譴責坐廢於家後從上祠太山至洛陽上謂威曰自朕之有天下每委公以重鎮可謂推赤心矣何乃不修名行唯利是視豈直孤負朕心亦且纍卿名德因問威曰公所執笏今安在威頓首曰臣負罪虧憲無顏復執謹藏於家上曰可持來威明日奉笏以見上曰公雖不遵法度功效實多朕不忘之今還公笏於是復拜洛州刺史後封睆城郡公尋轉相州刺史卒官有子植大業中至武賁郎將和洪和洪汝南人也少有武力勇烈過人周武帝時數從征伐以戰功纍遷車騎大將軍儀同三司時龍州蠻任公欣李國立等聚衆為亂刺史獨孤善不能禦朝議以洪有武略代善為刺史月餘擒公欣國立皆斬首梟之餘黨悉平從帝攻河陰洪力戰陷其西門帝壯之賞物千段復從帝平齊進位上儀同賜爵北平侯邑八百戶拜左勳曹下大夫柱國王軌之擒吳明徹也洪有功焉加位開府遷折衝中大夫尉迥作亂相州以洪為行軍總管從韋孝寬擊之軍至河陽迥遣兵圍懷州洪與總管宇文述等擊走又破尉惇於武陟及平相州每戰有功拜柱國封廣武郡公邑二千戶前後賜物萬段奴婢五十口金銀各百挺牛馬百匹時東夏初平物情尚梗高祖以洪有威名令領冀州事甚得人和數歲徵入朝為漕渠總管監轉拜泗州刺史屬突厥寇邊詔洪為北道行軍總管擊走虜至磧而還後遷徐州總管卒時年六十四侯莫陳穎侯莫陳穎字遵道代人也與魏南遷世為列將父崇魏周之際歷職顯要官至大司空穎少有器量風神警發為時輩所推魏大統末以父軍功賜爵廣平侯纍遷開府儀同三司周武帝時從滕王逌擊龍泉文城叛胡與柱國豆盧績各帥兵分路而進穎懸軍五百餘里破其三柵先是稽胡叛亂輒略邊人為奴婢至是詔胡敢有壓匿良人者誅籍沒其妻子有人言為胡村所隱匿者績將誅之穎謂績曰將在外君命有所不行諸胡固非悉反但相迫脅為亂耳大兵臨之首亂者知懼脅從者思降今漸加撫慰自可不戰而定如即誅之轉相驚恐為難不細未若召其渠帥以隱匿者付之令自歸首則羣胡可安績從之羣胡感悅爭來降附北土以安遷司武加振威中大夫高祖為丞相拜昌州刺史會受禪竟不行加上開府進爵升平郡公俄拜延州刺史數年轉陳州刺史平陳之役以行軍總管從秦王俊出魯山道屬陳將荀法尚陳紀降穎與行軍總管段文振度江安集初附尋拜饒州刺史未之官遷瀛州刺史甚有惠政在職數年坐與秦王俊交通免官百姓將送者莫不流涕因相與立碑頌穎清德未幾檢校汾州事俄拜邢州刺史仁壽中吏部尚書牛弘持節巡撫山東以穎為第一高祖嘉歎優詔褒揚時朝廷以嶺南刺史縣令多貪鄙蠻夷怨叛妙簡清吏以鎮撫之於是徵穎入朝及進見上與穎言及平生以為歡笑數日進位大將軍拜桂州總管十七州諸軍事賜物而遣之及到官大崇恩信民夷悅服溪洞生越多來歸附煬帝即位穎兄梁國公芮坐事徙邊朝廷恐穎不自安徵歸京師數年拜山太守其年嶺南閩越多不附帝以穎前在桂州有惠政為南土所信伏復拜南海太守後四歲卒官諡曰定子虔會最知名史臣曰杜彥東夏南服屢有戰功作鎮朔垂胡塵不起高勱死亡之際志氣懍然疾彼姦邪致茲餘慶爾朱敞幼有權奇終能止足崇基墜而復構不亦仁且智乎周搖以質實見知獨孤以恤人流譽乞伏慧能以國讓侯莫陳所居治理或知牧人之道或踐仁義之路皆有可稱焉慧以供帳不厚至於放黜並結髮登朝出入三代終享祿位不夭性齡蓋其任心而行不為矯飾之所致也

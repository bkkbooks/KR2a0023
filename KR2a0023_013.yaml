body:
  text: 隋書卷十三志第八音樂上夫音本乎太始而生於人心隨物感動播於形氣形氣既著協於律呂宮商克諧名之為樂樂者樂也聖人因百姓樂己之德正之以六律文之以五聲詠之以九歌舞之以八佾實升平之冠帶王化之源本記曰感於物而動故形於聲夫人者兩儀之播氣而性情之所起也恣其流湎往而不歸是以五帝作樂三王制禮摽舉人倫削平淫放其用之也動天地感鬼神格祖考諧邦國樹風成化象德昭功啓萬物之情通天下之志若夫升降有則宮商垂範禮踰其制則尊卑乖樂失其序則親疏亂禮定其象樂平其心外敬內和合情飾貌猶陰陽以成化若日月以為明也記曰大夫無故不撤懸士無故不撤琴瑟聖人造樂導迎和氣惡情屏退善心興起伊耆有葦籥之音伏犧有網罟之詠葛天八闋神農五弦事與功偕其來已尚黃帝樂曰咸池帝嚳曰六英帝顓頊曰五莖帝堯曰大章帝舜曰簫韶禹曰大夏殷湯曰護武王曰武周公曰勺教之以風賦弘之以孝友大禮與天地同節大樂與天地同和禮意風猷樂情膏潤傳曰如有王者必世而後仁成康化致升平刑厝而不用也古者天子聽政公卿獻詩秦人有作罕聞斯道漢高祖時叔孫通爰定篇章用祀宗廟唐山夫人能楚聲又造房中之樂武帝裁音律之響定郊丘之祭頗雜謳謠非全雅什漢明帝時樂有四品一曰大豫樂郊廟上陵之所用焉則易所謂先王作樂崇德殷薦之上帝以配祖考者也二曰雅頌樂辟雍饗射之所用焉則孝經所謂移風易俗莫善於樂者也三曰黃門鼓吹樂天子宴羣臣之所用焉則詩所謂坎坎鼓我蹲蹲我者也其四曰短簫鐃歌樂軍中之所用焉黃帝時岐伯所造以建武揚德風敵勵兵則周官所謂王師大捷則令凱歌者也又採百官詩頌以為登歌十月吉辰始用蒸祭董卓之亂正聲咸蕩漢雅樂郎杜夔能曉樂事八音七始靡不兼該魏武平荊州得夔使其刊定雅律魏有先代古樂自夔始也自此迄晉用相因循永嘉之寇盡淪胡羯於是樂人南奔穆皇羅鍾磬苻堅北敗孝武獲登歌晉氏不綱魏圖將霸道武克中山太武平統萬或得其宮懸或收其古樂于時經營是迫雅器斯寢孝文頗為詩歌以勗在位謠俗流傳布諸音律大臣馳騁漢魏旁羅宋齊功成奮豫代有制作莫不各揚廟舞自造郊歌宣暢功德輝光當世而移風易俗浸以陵夷梁武帝本自諸生博通前載未及下車意先風雅爰詔凡百各陳所聞帝又自糾擲前違裁成一代周太祖發跡關隴躬安戎狄羣臣請功成之樂式遵周舊依三材而命管承六典而揮文而下武之聲豈姬人之唱登歌之奏協鮮卑之音情動於中亦人心不能已也昔仲尼返魯風雅斯正所謂有其藝而無其時高祖受命惟新八州同貫制氏全出於胡人迎神猶帶於邊曲及顏何驟請頗涉雅音而繼想聞韶去之彌遠若夫二南斯理八風揚節順序旁通妖淫屏棄宮徵流唱翺翔率舞弘仁義之道安性命之真君子益厚小人無悔非大樂之懿其孰能與於此者哉是以舜詠南風而虞帝昌紂歌北鄙而殷王滅大樂不紊則王政在焉故録其不相因襲以備于志周官大司樂一千三百三十九人漢郊廟及武樂三百八十人煬帝矜奢頗玩淫曲御史大夫裴蘊揣知帝情奏括周齊梁陳樂工子弟及人間善聲調者凡三百餘人並付太樂倡優獿雜咸來萃止其哀管新聲淫弦巧奏皆出鄴城之下高齊之舊曲云梁氏之初樂緣齊舊武帝思弘古樂天監元年遂下詔訪百僚曰夫聲音之道與政通矣所以移風易俗明貴辨賤而韶護之稱空傳咸英之實靡託魏晉以來陵替滋甚遂使雅鄭混淆鍾石斯謬天人缺九變之節朝宴失四懸之儀朕昧旦坐朝思求厥旨而舊事匪存未獲釐正寤寐有懷所為歎息卿等學術通明可陳其所見於是散騎常侍尚書僕射沈約奏答曰竊以秦代滅學樂經殘亡至于漢武帝時河間獻王與毛生等共採周官及諸子言樂事者以作樂記其內史丞王定傳授常山王禹劉向校書得樂記二十三篇與禹不同向別録有樂歌詩四篇趙氏雅琴七篇師氏雅琴八篇龍氏雅琴百六篇唯此而已晉中經簿無復樂書別録所載已復亡逸案漢初典章滅絶諸儒捃拾溝渠牆壁之間得片簡遺文與禮事相關者即編次以為禮皆非聖人之言月令取呂氏春秋中庸表記防記緇衣皆取子思子樂記取公孫尼子檀弓殘雜又非方幅典誥之書也禮既是行己經邦之切故前儒不得不補綴以備事用樂書事大而用緩自非逢欽明之主制作之君不見詳議漢氏以來主非欽明樂既非人臣急事故言者寡陛下以至聖之德應樂推之符實宜作樂崇德殷薦上帝而樂書淪尋案無所宜選諸生分令尋討經史百家凡樂事無小大皆別纂録乃委一舊學撰為樂書以起千載絶文以定大梁之樂使五英懷慚六莖興愧是時對樂者七十八家咸多引流略浩蕩其詞皆言樂之宜改不言改樂之法帝既素善鍾律詳悉舊事遂自制定禮樂又立為四器名之為通通受聲廣九寸宣聲長九尺臨嶽高一寸二分每通皆施三絃一曰玄英通應鍾絃用一百四十二絲長四尺七寸四分差強黃鍾絃用二百七十絲長九尺大呂絃用二百五十二絲長八尺四寸三分差弱二曰青陽通太簇絃用二百四十絲長八尺夾鍾絃用二百二十四絲長七尺五寸弱姑洗絃用二百一十四絲長七尺一寸一分強三曰朱明通中呂絃用一百九十九絲長六尺六寸六分弱蕤賓絃用一百八十九絲長六尺三寸二分強林鍾絃用一百八十絲長六尺四曰白藏通夷則絃用一百六十八絲長五尺六寸二分弱南呂絃用一百六十絲長五尺三寸二分大強無射絃用一百四十九絲長四尺九寸九分強因以通聲轉推月氣悉無差違而還相得中又制為十二笛黃鍾笛長三尺八寸大呂笛長三尺六寸太簇笛長三尺四寸夾鍾笛長三尺二寸姑洗笛長三尺一寸中呂笛長二尺九寸蕤賓笛長二尺八寸林鍾笛長二尺七寸夷則笛長二尺六寸南呂笛長二尺五寸無射笛長二尺四寸應鍾笛長二尺三寸用笛以寫通聲飲古鍾玉律并周代古鍾並皆不差於是被以八音施以七聲莫不和韻是時北中郎司馬何佟之上言案周禮王出入則奏王夏尸出入則奏肆夏牲出入則奏昭夏今樂府之夏唯變王夏為皇夏蓋緣秦漢以來稱皇故也而齊氏仍宋儀注迎神奏昭夏皇帝出入奏永至牲出入更奏引牲之樂其為舛謬莫斯之甚請下禮局改正周捨議以為禮王入奏王夏大祭祀與朝會其用樂一也而漢制皇帝在廟奏永至樂朝會之日別有皇夏二樂有異於禮為乖宜除永至還用皇夏又禮尸出入奏肆夏賓入大門奏肆夏則所設唯在人神其與迎牲之樂不可濫也宋季失禮頓虧舊則神入廟門遂奏昭夏乃以牲牢之樂用接祖考之靈斯皆前代之深疵當今所宜改也時議又以為周禮云若樂六變天神皆降神居上玄去還恍忽降則自至迎則無所可改迎為降而送依前式又周禮云若樂八變則地祇皆出可得而禮地宜依舊為迎神並從之又以明堂設樂大略與南郊不殊惟壇堂異名而無就燎之位明堂則遍歌五帝其餘同於郊式焉初宋齊代祀天地祭宗廟準漢祠太一后土盡用宮懸又太常任昉亦據王肅議云周官以六律五聲八音六舞大合樂以致鬼神以和邦國以諧兆庶以安賓客以悅遠人是謂六同一時皆作今六代舞獨分用之不厭人心遂依肅議祀祭郊廟備六代樂至是帝曰周官分樂饗祀虞書止鳴兩懸求之於古無宮懸之議何事人禮縟事神禮簡也天子襲袞而至敬不文觀天下之物無可以稱其德者則以少為貴矣大合樂者是使六律與五聲克諧八音與萬舞合節耳豈謂致鬼神祇用六代樂也其後即言分樂序之以祭以享此乃曉然可明肅則失其旨矣推檢載籍初無郊禋宗廟遍舞六代之文唯明堂位曰禘祀周公於太廟朱干玉戚冕而舞大武皮辨素積裼而舞大夏納夷蠻之樂於太廟言廣魯於天下也夫祭尚於敬無使樂繁禮黷是以季氏逮暗而祭繼之以燭有司跛倚其為不敬大矣他日祭子路與焉質明而始晏朝而退孔子聞之曰誰謂由也不知禮乎若依肅議郊既有迎送之樂又有登歌各頌功德遍以六代繼之出入方待樂終此則乖於仲尼韙晏朝之意矣於是不備宮懸不遍舞六代逐所應須即設懸則非宮非軒非判非特宜以至敬所應施用耳宗廟省迎送之樂以其閟宮靈宅也齊永明中舞人冠幘並簪筆帝曰筆笏蓋以記事受言舞不受言何事簪筆豈有身服朝衣而足綦宴履於是去筆又晉及宋齊懸鍾磬大準相似皆十六架黃鍾之宮北方北面編磬起西其東編鍾其東衡大於鎛不知何代所作其東鎛鍾太簇之宮東方西面起北蕤賓之宮南方北面起東姑洗之宮西方東面起南所次皆如北面設建鼓於四隅懸內四面各有柷敔帝曰著晉宋史者皆言太元元嘉四年四廂金石大備今檢樂府止有黃鍾姑洗蕤賓太簇四格而已六律不具何謂四廂備樂之文其義焉在於是除去衡鍾設十二鎛鍾各依辰位而應其律每一鎛鍾則設編鍾磬各一虡合三十六架植建鼓於四隅元正大會備用之乃定郊禋宗廟及三朝之樂以武舞為大壯舞取易云大者壯也正大而天地之情可見也以文舞為大觀舞取易云大觀在上觀天之神道而四時不忒也國樂以雅為稱取詩序云言天下之事形四方之風謂之雅雅者正也止乎十二則天數也乃去階步之樂增撤食之雅焉衆官出入宋元徽三年儀注奏肅咸樂齊及梁初亦同至是改為俊雅取禮記司徒論選士之秀者而升之學曰俊士也二郊太廟明堂三朝同用焉皇帝出入宋孝建二年秋起居注奏永至齊及梁初亦同至是改為皇雅取詩皇矣上帝臨下有赫也二郊太廟同用皇太子出入奏胤雅取詩君子萬年永錫爾胤也王公出入奏寅雅取尚書周官二公弘化寅亮天地也上壽酒奏介雅取詩君子萬年介爾景福也食舉奏需雅取易雲上於天需君子以飲食宴樂也撤饌奏雍雅取禮記大饗客出以雍撤也並三朝用之牲出入宋元徽二年儀注奏引牲齊及梁初亦同至是改為滌雅取禮記帝牛必在滌三月也薦毛血宋元徽三年儀注奏嘉薦齊及梁初亦同至是改為牷雅取春秋左氏傳牲牷肥腯也北郊明堂太廟並同用降神及迎送宋元徽三年儀注奏昭夏齊及梁初亦同至是改為諴雅取尚書至諴感神也皇帝飲福酒宋元徽三年儀注奏嘉祚至齊不改梁初改為永祚至是改為獻雅取禮記祭統尸飲五君洗玉爵獻卿今之福酒亦古獻之義也北郊明堂太廟同用就燎位宋元徽三年儀注奏昭遠齊及梁不改就埋位齊永明六年儀注奏隸幽至是燎埋俱奏禋雅取周禮大宗伯以禋祀祀昊天上帝也其辭並沈約所製今列其歌詩三十曲云俊雅歌詩三曲四言設官分職髦俊攸俟髦俊伊何貴德尚齒唐乂咸事周寧多士區區衛國猶賴君子漢之得人帝猷乃理開我八襲闢我九重珩佩流響纓紱有容袞衣前邁列辟雲從義兼東序事美西雍分階等肅異列齊恭重列北上分庭異陛百司揚職九賓相禮齊宋舅甥魯衛兄弟思皇藹藹羣龍濟濟我有嘉賓實惟愷悌皇雅三曲五言帝德實廣運車書靡不賓執瑁朝羣后垂旒御百神八荒重譯至萬國婉來親華蓋拂紫微勾陳繞太一容裔被緹組參差羅畢星回照以爛天行徐且謐清蹕朝萬宇端冕臨正陽青絇黃金繶袞衣文繡裳既散華蟲采復流日月光胤雅一曲四言自昔殷代哲王迭有降及周成惟器是守上天乃眷大梁既受灼灼重明仰承元首體乾作二命服斯九置保置師居前居後前星北耀克隆萬壽寅雅一曲三言禮莫違樂具舉延藩辟朝帝所執桓蒲列齊莒垂袞毳紛容與升有儀降有序齊簪紱忘笑語始矜嚴終酣醑介雅三曲五言百福四象初萬壽三元始拜獻惟袞職同心協卿士北極永無窮南山何足擬壽隨百禮洽慶與三朝升惟皇集繁祉景福互相仍申錫永無遺穰簡必來應百味既含馨六飲莫能尚玉罍信湛湛金卮頗搖漾敬舉發天和祥祉流嘉貺需雅八曲七言實體平心待和味庶羞百品多為貴或鼎或鼒宣九沸楚桂胡鹽芼芳卉加籩列俎雕且蔚五味九變兼六和令芳甘旨庶且多三危之露九期禾圓案方丈粲星羅皇舉斯樂同山河九州上腴非一族玄芝碧樹壽華木終朝采之不盈掬用拂腥羶和九穀既甘且飫致遐福人欲所大味為先興和盡敬咸在旃碧鱗朱尾獻嘉鮮紅毛緑翼墜輕翾臣拜稽首萬斯年擊鍾以俟惟大國況乃御天流至德侑食斯舉揚盛則其禮不愆儀不忒風猷所被深且塞膳夫奉職獻芳滋不麛不夭咸以時調甘適苦別澠淄其德不爽受福釐於焉逸豫永無期備味斯饗惟至聖咸降人神禮為盛或風或雅流歌詠負鼎言歸啓殷命悠悠四海同茲慶道我六穗羅八珍洪鼎自爨匪勞薪荊包海物必來陳滑甘滫瀡味和神以斯至德被無垠雍雅三曲四言明明在上其儀有序終事靡愆收鉶撤俎乃升乃降和樂備舉天德莫違人謀是與敬行禮達茲焉宴語我餕惟阜我肴孔庶嘉味既充食旨斯飫屬厭無爽冲和在御擊壤齊歡懷生等豫蒸庶乃粒實由仁恕百司警列皇在在陛既飫且醑卒食成禮其容穆穆其儀濟濟凡百庶僚莫不愷悌奄有萬國抑由天啓滌雅一曲四言將修盛禮其儀孔熾有腯斯牲國門是置不黎不靡愆靡忌呈肌獻體永言昭事俯休皇德仰綏靈志百福具膺嘉祥允洎駿奔伊在慶覃遐嗣牷雅一曲四言反本興敬復古昭誠禮容宿設祀事孔明華俎待獻崇碑麗牲充哉繭握肅矣簪纓其膋既啓我豆既盈庖丁遊刃葛盧驗聲多祉攸集景福來並諴雅一曲三言南郊降神用懷忽慌瞻浩蕩盡諴潔致虔想出杳冥降無象皇情肅具僚仰人禮盛神途敞僾明靈申敬饗感蒼極洞玄壤諴雅一曲三言北郊迎神用地德溥昆丘峻揚羽翟鼓應出尊祗展誠信招海瀆羅嶽鎮惟福祉咸昭晉諴雅一曲四言南北郊明堂太廟送神同用我有明德馨非稷黍牲玉孔備嘉薦惟旅金懸宿設和樂具舉禮達幽明敬行樽俎鼓鍾云送遐福是與獻雅一曲四言神宮肅肅天儀穆穆禮獻既同膺此釐福我有馨明無愧史祝禋雅一曲四言就燎紫宮昭煥太一微玄降臨下土尊高上天載陳圭璧式備牲牷雲孤清引栒虡高懸俯昭象物仰致高煙肅彼靈祉咸達皇虔禋雅一曲四言就埋盛樂斯舉協徵調宮靈饗慶洽祉積化融八變有序三獻已終坎牲瘞玉酬德報功振垂成呂投壤生風道無虛致事由感通於皇盛烈比祚華嵩普通中薦蔬之後改諸雅歌勑蕭子雲製詞既無牲牢遂省滌雅牷雅云南郊舞奏黃鍾取陽始化也北郊舞奏林鍾取陰始化也明堂宗廟所尚者敬蕤賓是為敬之名復有陰主之義故同奏焉其南北郊明堂宗廟之禮加有登歌今又列其歌詩一十八曲云南郊皇帝初獻奏登歌二曲三言暾既明禮告成惟聖祖主上靈爵已獻罍又盈息羽籥展歌聲僾如在結皇情禮容盛樽俎列玄酒陳陶匏設獻清旨致虔潔王既升樂已闋降蒼昊垂芳烈北郊皇帝初獻奏登歌二曲四言方壇既坎地祇已出盛典弗愆羣望咸秩乃升乃獻敬成禮卒靈降無兆神饗載謐允矣嘉祚其升如日至哉坤元實惟厚載躬茲奠饗誠交顯晦或升或降搖珠動佩德表成物慶流皇代純嘏不愆祺福是賚宗廟皇帝初獻奏登歌七曲四言功高禮洽道尊樂備三獻具舉百司在位誠敬罔愆幽明同致茫茫億兆無思不遂蓋之如天容之如地殷兆玉筐周始邠王於赫文祖基我大梁肇土七十奄有四方帝軒百祀人思未忘永言聖烈祚我無疆有夏多罪殷人塗炭四海倒懸十室思亂自天命我殲凶殄難既躍乃飛言登天漢爰饗爰祀福祿攸贊犧象既飾罍俎斯具我鬱載馨黃流乃注卿士駿奔是務佩上鳴階纓還拂樹悠悠億兆天臨日煦猗與至德光被黔首鑄鎔蒼昊甄陶區有肅恭三獻對揚萬壽比屋可封含生無咎匪徒七百天長地久有命自天於皇后帝悠悠四海莫不來祭繁祉具膺八神聳衛福至有兆慶來無際播此餘休于彼荒裔祀典昭潔我禮莫違八簋充室六龍解騑神宮肅肅靈寢微微嘉薦既饗景福攸歸至德光被洪祚載輝明堂遍歌五帝登歌五曲四言歌青帝辭帝居在震龍德司春開元布澤含和尚仁羣居既散歲云陽止飭農分地人粒惟始雕梁繡栱丹楹玉墀靈威以降百福來綏歌赤帝辭炎光在離火為威德執禮昭訓持衡受則靡草既凋溫風以至嘉薦惟旅時羞孔備齊醍在堂笙鏞在下匪惟七百無絶終始歌黃帝辭鬱彼中壇含靈闡化回環氣象輪無輟駕布德焉在四序將收音宮數五飯稷驂宅屏居中旁臨外宇升為帝尊降為神主歌白帝辭神在秋方帝居西皓允茲金德裁成萬寶鴻來雀化參見火邪幕無玄鳥菊有黃華載列笙磬式陳彝俎靈罔常懷惟德是與歌黑帝辭德盛乎水玄冥紀節陰降陽騰氣凝象閉司智蒞坎駕鐵衣玄祁寒坼地晷度回天悠悠四海駿奔奉職祚我無疆永隆人極太祖太夫人廟舞歌閟宮肅肅清廟濟濟於穆夫人固天攸啓祚我梁德膺斯盛禮文達嚮重檐丹陛飾我俎彝潔我粢盛躬事奠饗推尊盡敬悠悠萬國具承茲慶大孝追遠兆庶攸詠太祖太夫人廟登歌光流者遠禮貴彌申嘉饗云備盛典必陳追養自本立愛惟親皇情乃慕帝服來尊駕齊六轡旗耀三辰感茲霜露事彼冬春以斯孝德永被蒸民大壯舞奏夷則大觀舞奏姑洗取其月王也二郊明堂太廟三朝並同用今亦列其歌詩二曲云大壯舞歌一曲四言高高在上實愛斯人眷求聖德大拯彝倫率土方燎如火在薪黔首暮不及晨朱光啓耀兆發穹旻我皇鬱起龍躍漢津言屆牧野電激雷震闕鞏之甲彭濮之人或貔或武漂杵浮輪我邦雖舊其命惟新六伐乃止七德必陳君臨萬國遂撫八夤大觀舞歌一曲四言皇矣帝烈大哉興聖奄有四方受天明命居上不怠臨下唯敬舉無愆則動無失正物從其本人遂其性昭播九功肅齊八柄寬以惠下德以為政三趾晨儀重輪夕映棧壑忘阻梯山匪敻如日有與天無竟載陳金石式流舞詠咸英韶夏於茲比盛相和五引角引萌生觸發歲在春咸池始奏德尚仁惉滯以息和且均徵引執衡司事宅離方滔滔夏日火德昌八音備舉樂無疆宮引八音資始君五聲興此和樂感百精優遊律呂被咸英商引司秋紀兌奏西音激揚鍾石和瑟琴風流福被樂愔愔羽引玄英紀運冬冰折物為音本和且悅窮高測深長無絶普通中薦蔬以後勑蕭子雲改諸歌辭為相和引則依五音宮商角徵羽為第次非隨月次也舊三朝設樂有登歌以其頌祖宗之功烈非君臣之所獻也於是去之三朝第一奏相和五引第二衆官入奏俊雅第三皇帝入閣奏皇雅第四皇太子發西中華門奏胤雅第五皇帝進王公發足第六王公降殿同奏寅雅第七皇帝入儲變服第八皇帝變服出儲同奏皇雅第九公卿上壽酒奏介雅第十太子入預會奏胤雅十一皇帝食舉奏需雅十二撤食奏雍雅十三設大壯武舞十四設大觀文舞十五設雅歌五曲十六設俳伎十七設鼙舞十八設鐸舞十九設拂舞二十設巾舞並白紵二十一設舞盤伎二十二設舞輪伎二十三設刺長追花幢伎二十四設受猾伎二十五設車輪折脰伎二十六設長蹻伎二十七設須彌山黃山三峽等伎二十八設跳鈴伎二十九設跳劍伎三十設擲倒伎三十一設擲倒案伎三十二設青絲幢伎三十三設一傘花幢伎三十四設雷幢伎三十五設金輪幢伎三十六設白獸幢伎三十七設擲蹻伎三十八設獮猴幢伎三十九設啄木幢伎四十設五案幢呪願伎四十一設辟邪伎四十二設青紫鹿伎四十三設白武伎作訖將白鹿來迎下四十四設寺子導安息孔雀鳳凰文鹿胡舞登連上雲樂歌舞伎四十五設緣高絙伎四十六設變黃龍弄龜伎四十七皇太子起奏胤雅四十八衆官出奏俊雅四十九皇帝興奏皇雅自宋齊已來三朝有鳳凰銜書伎至是乃下詔曰朕君臨南面道風蓋闕嘉祥時至為愧已多假令巢侔軒閣集同昌戶猶當顧循寡德推而不居況於名實頓爽自欺耳目一日元會太樂奏鳳凰銜書伎至乃舍人受書升殿跪奏誠復興乎前代率由自遠內省懷慚彌與事篤可罷之天監四年掌賓禮賀瑒請議皇太子元會出入所奏帝命別制養德之樂瑒謂宜名元雅迎送二傅亦同用之取禮一有元良萬國以貞之義明山賓嚴植之及徐勉等以為周有九夏梁有十二雅此並則天數為一代之曲今加一雅便成十三瑒又疑東宮所奏舞帝下其議瑒以為天子為樂以賞諸侯之有德者觀其舞知其德況皇儲養德春宮式瞻攸屬謂宜備大壯大觀二舞以宣文武之德帝從之於是改皇太子樂為元貞奏二舞是時禮樂制度粲然有序其後臺城淪沒簡文帝受制於侯景景以簡文女溧陽公主為妃請帝及主母范淑妃宴于西州奏梁所常用樂景儀同索超世亦在宴筵帝然屑涕景興曰陛下何不樂也帝強笑曰丞相言索超世聞此以為何聲景曰臣且不知何獨超世自此樂府不修風雅咸盡矣及王僧辨破侯景諸樂並送荊州經亂工器頗闕元帝詔有司補綴才備荊州陷沒周人不知采用工人有知音者並入關中隨例沒為奴婢鼓吹宋齊並用漢曲又充庭用十六曲高祖乃去四曲留其十二合四時也更制新歌以述功德其第一漢曲朱鷺改為木紀謝言齊謝梁升也第二漢曲思悲翁改為賢首山言武帝破魏軍於司部肇王迹也第三漢曲艾如張改為桐柏山言武帝牧司王業彌章也第四漢曲上之回改為道亡言東昏喪道義師起樊鄧也第五漢曲擁離改為忱威言破加湖元勳也第六漢曲戰城南改為漢東流言義師克魯山城也第七漢曲巫山高改為鶴樓峻言平郢城兵威無敵也第八漢曲上陵改為昏主恣淫慝言東昏政亂武帝起義平九江姑熟大破朱雀伐罪弔人也第九漢曲將進酒改為石首局言義師平京城仍廢昏定大事也第十漢曲有所思改為期運集言武帝應籙受禪德盛化遠也十一漢曲芳樹改為於穆言大梁闡運君臣和樂休祚方遠也十二漢曲上邪改為惟大梁言梁德廣運仁化洽也天監七年將有事太廟詔曰禮云齊日不樂今親奉始出宮振作鼓吹外可詳議八座丞郎參議請輿駕始出鼓吹從而不作還宮如常儀帝從之遂以定制初武帝之在雍鎮有童謠云襄陽白銅蹄反縛揚州兒識者言白銅蹄謂馬也白金色也及義師之興實以鐵騎揚州之士皆面縛果如謠言故即位之後更造新聲帝自為之詞三曲又令沈約為三曲以被絃管帝既篤敬佛法又制善哉大樂大歡天道仙道神王龍王滅過惡除愛水斷苦輪等十篇名為正樂皆述佛法又有法樂童子伎童子倚歌梵唄設無遮大會則為之陳初武帝詔求宋齊故事太常卿周弘讓奏曰齊氏承宋咸用元徽舊式宗祀朝饗奏樂俱同唯北郊之禮頗有增益皇帝入壝門奏永至飲福酒奏嘉胙太尉亞獻奏凱容埋牲奏隸幽帝還便殿奏休成衆官並出奏肅成此乃元徽所闕永明六年之所加也唯送神之樂宋孝建二年秋起居注云奏肆夏永明中改奏昭夏帝遂依之是時並用梁樂唯改七室舞辭今列之云皇祖步兵府君神室奏凱容舞辭於赫皇祖宮牆高嶷邁彼厥初成茲峻極縵樂簡簡閟寢翼翼祼饗若存惟靈靡測皇祖正員府君神室奏凱容舞辭昭哉上德浚彼洪源道光前訓慶流後昆神猷緬邈清廟斯存以享以祀惟祖惟尊皇祖懷安府君神室奏凱容舞辭選辰崇饗飾禮嚴敬靡愛牲牢兼馨粢盛明明列祖龍光遠映肇我王風形斯舞詠皇高祖安成府君神室奏凱容舞辭道遙積慶德遠昌基永言祖武致享從思九章停列八舞回墀靈其降止百福來綏皇曾祖太常府君神室奏凱容舞辭肇迹帝基義標鴻篆恭惟載德瓊源方闡享薦三清筵陳四璉增我堂構式敷帝典皇祖景皇帝神室奏景德凱容舞辭皇祖執德長發其祥顯仁藏用懷道韜光寧斯閟寢合此蕭薌永昭貽厥還符翦商皇考高祖武皇帝神室奏武德舞辭蒸哉聖祖撫運升離道周經緯功格玄祇方軒邁扈比舜陵媯緝熙是詠欽明在斯雲雷遘屯圖南共舉大定揚越震威衡楚四奧宅心九疇還叙景星出翼非雲入呂德暢容辭慶昭羽綴於穆清廟載揚徽烈嘉玉既陳豐盛斯潔是將是享鴻猷無絶天嘉元年文帝始定圓丘明堂及宗廟樂都官尚書到仲舉權奏衆官入出皆奏肅成牲入出奏引犧上毛血奏嘉薦迎送神奏昭夏皇帝入壇奏永至皇帝升陛奏登歌皇帝初獻及太尉亞獻光祿勳終獻並奏宣烈皇帝飲福酒奏嘉胙就燎位奏昭遠還便殿奏休成至太建元年定三朝之樂採梁故事第一奏相和五引各隨王月則先奏其鍾唯衆官入奏俊雅林鍾作太簇參應之取其臣道也鼓吹作皇帝出閣奏皇雅黃鍾作太簇夾鍾姑洗大呂皆應之鼓吹作皇太子入至十字陛奏胤雅太簇作南呂參應之取其二月少陽也皇帝延王公登奏寅雅夷則作夾鍾應之取其月法也皇帝入寧變服奏皇雅黃鍾作林鍾參應之鼓吹作皇帝出寧及升座皆奏皇雅並如變服之作上壽酒奏介雅太簇作南呂參應之取其陽氣盛長萬物輻湊也食舉奏需雅蕤賓作大呂參應之取火主於禮所謂食我以禮也撤饌奏雍雅無射作中呂參應之取其津潤已竭也武舞奏大壯夷則作夾鍾參應之七月金始王取其堅斷也鼓吹引而去來文舞奏大觀姑洗作應鍾參應之三月萬物必榮取其布惠者也鼓吹引而去來衆官出奏俊雅蕤賓作林鍾夷則南呂無射應鍾太簇參應之鼓吹作皇帝起奏皇雅黃鍾作林鍾夷則南呂無射參應之鼓吹作祠用宋曲宴准梁樂蓋取人神不雜也制曰可五年詔尚書左丞劉平儀曹郎張崖定南北郊及明堂儀注改天嘉中所用齊樂盡以韶為名工就位定協律校尉舉麾太樂令跪贊云奏懋韶之樂降神奏通韶牲入出奏潔韶帝入壇及還便殿奏穆韶帝初再拜舞七德工執干楯曲終復綴出就懸東繼舞九序工執羽籥獻爵於天神及太祖之座奏登歌帝飲福酒奏嘉韶就望燎奏報韶至六年十一月侍中尚書左僕射建昌侯徐陵儀曹郎中沈罕奏來年元會儀注稱舍人蔡景歷奉勑先會一日太樂展宮懸高絙五案於殿庭客入奏相和五引帝出黃門侍郎舉麾於殿上掌故應之舉於階下奏康韶之樂詔延王公登奏變韶奉圭璧訖初引下殿奏亦如之帝興入便殿奏穆韶更衣又出奏亦如之帝舉酒奏綏韶進膳奏侑韶帝御茶果太常丞跪請進舞七德繼之九序其鼓吹雜伎取晉宋之舊微更附益舊元會有黃龍變文鹿師子之類太建初定制皆除之至是蔡景歷奏悉復設焉其制鼓吹一部十六人則簫十三人笳二人鼓一人東宮一部降三人簫減二人笳減一人諸王一部又降一人減簫一庶姓一部又降一人復減簫一及後主嗣位耽荒於酒視朝之外多在宴筵尤重聲樂遣宮女習北方簫鼓謂之代北酒酣則奏之又於清樂中造黃鸝留及玉樹後庭花金叉兩臂垂等曲與幸臣等製其歌詞綺豔相高極於輕薄男女唱和其音甚哀

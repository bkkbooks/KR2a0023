body:
  text: 隋書卷七十四列傳第三十九酷吏夫為國之體有四焉一曰仁義二曰禮制三曰法令四曰刑罰仁義禮制政之本也法令刑罰政之末也無本不立無末不成然教化遠而刑罰近可以助化而不可以專行可以立威而不可以繁用老子曰其政察察其人缺缺又曰法令滋章盜賊多有然則令之煩苛吏之嚴酷不能致理百代可知考覽前載有時而用之矣昔秦任獄吏赭衣滿道漢革其風矯枉過正禁網疎闊遂漏吞舟大姦巨猾犯義侵禮故剛克之吏摧拉凶邪一切禁姦以救時弊雖垂教義或有所取焉高祖膺期平一江左四海九州服教從義至於威行郡國力折公侯乘傳賦人探丸斫吏者所在蔑聞焉無曩時之弊亦已明矣士文等功不足紀才行無聞遭遇時來叨竊非據肆其褊性多行無禮君子小人咸罹其毒凡厥所莅莫不懍然居其下者視之如蛇虺過其境者逃之如寇讎與人之恩心非好善加人之罪事非疾惡其所笞辱多在無辜察其所為豺狼之不若也無禁姦除猾之志肆殘虐幼賤之心君子惡之故編為酷吏傳也厙狄士文厙狄士文代人也祖干齊左丞相父敬武衞將軍肆州刺史士文性孤直雖鄰里至親莫與通狎少讀書在齊襲封章武郡王官至領軍將軍周武帝平齊山東衣冠多迎周師唯士文閉門自守帝奇之授開府儀同三司隨州刺史高祖受禪加上開府封湖陂縣子尋拜貝州刺史性清苦不受公料家無餘財其子常噉官餅士文枷之於獄累日杖之一百步送還京僮隸無敢出門所買鹽菜必於外境凡有出入皆封署其門親舊絕跡慶弔不通法令嚴肅吏人股戰道不拾遺有細過必深文陷害嘗入朝遇上置酒高會賜公卿入左藏任取多少人皆極重士文獨口銜絹一匹兩手各持一匹上問其故士文曰臣口手俱滿餘無所須上異之別加賞物勞而遣之士文至州發擿姦隱長吏尺布升粟之贓無所寬貸得千餘人而奏之上悉配防嶺南親戚相送哭泣之聲徧於州境至嶺南遇瘴癘死者十八九於是父母妻子唯哭士文士文聞之令人捕捉檛捶盈前而哭者彌甚有京兆韋焜為貝州司馬河東趙達為清河令二人並苛刻唯長史有惠政時人為之語曰刺史羅刹政司馬蝮蛇瞋長史含笑判清河生喫人上聞而歎曰士文之暴過於猛獸竟坐免未幾以為雍州長史士文謂人曰我向法深不能窺候要貴必死此官矣及下車執法嚴正不避貴戚賓客莫敢至門人多怨望士文從父妹為齊氏嬪有色齊滅之後賜薛國公長孫覽為妾覽妻鄭氏性妬譖之於文獻后后令覽離絕士文恥之不與相見後應州刺史唐君明居母憂娉以為妻由是士文君明並為御史所劾士文性剛在獄數日憤恚而死家無餘財有子三人朝夕不繼親友無內之者田式田式字顯標馮翊下邽人也祖安興父長樂仕魏俱為本郡太守式性剛果多武藝拳勇絕人周明帝時年十八授都督領鄉兵後數載拜渭南太守政尚嚴猛吏人重足而立無敢違法者遷本郡太守親故屏跡請託不行武帝聞而善之進位儀同三司賜爵信都縣公擢拜延州刺史從帝平齊以功加上開府徙為建州刺史改封梁泉縣公高祖總百揆尉迥作亂鄴城從韋孝寬擊之以功拜大將軍進爵武山郡公及受禪拜襄州總管專以立威為務每視事于外必盛氣以待其下官屬股慄無敢仰視有犯禁者雖至親昵無所容貸其女婿京兆杜寧自長安省之式誡寧無出外寧久之不得還竊上北樓以暢羈思式知之笞寧五十其所愛奴嘗詣式白事有蟲上其衣衿揮袖拂去之式以為慢己立棒殺之或僚吏姦贓部內劫盜者無問輕重悉禁地牢中寢處糞穢令其苦毒自非身死終不得出每赦書到州式未暇讀先召獄卒殺重囚然後宣示百姓其刻暴如此由是為上所譴除名為百姓式慚恚不食妻子至其所輒怒唯侍僮二人給使左右從家中索椒欲以自殺家人不與陰遣所侍僮詣市買毒藥妻子又奪而棄之式恚臥其子信時為儀同至式前流涕曰大人既是朝廷舊臣又無大過比見公卿放辱者多矣旋復升用大人何能久乎乃至於此式欻然而起抽刀斫信信遽走避之刃中於閾上知之以式為罪己之深復其官爵尋拜廣州總管卒官燕榮燕榮字貴公華陰弘農人也父偘周大將軍榮性剛嚴有武藝仕周為內侍上士從武帝伐齊以功授開府儀同三司封高邑縣公高祖受禪進位大將軍封落叢郡公拜晉州刺史從河間王弘擊突厥以功拜上柱國遷青州總管榮在州選絕有力者為伍伯吏人過之者必加詰問輒楚撻之創多見骨姦盜屏迹境內肅然他州縣人行經其界者畏若寇讎不敢休息上甚善之後因入朝覲特加勞勉榮以母老請每歲入朝上許之及辭上賜宴于內殿詔王公作詩以餞之伐陳之役以為行軍總管率水軍自東萊傍海入太湖取吳郡既破丹陽吳人共立蕭瓛為主阻兵於晉陵為宇文述所敗退保包山榮率精甲五千躡之瓛敗走為榮所執晉陵會稽悉平檢校揚州總管尋徵為右武候將軍突厥寇邊以為行軍總管屯幽州母憂去職明年起為幽州總管榮性嚴酷有威容長史見者莫不惶懼自失范陽盧氏代為著姓榮皆署為吏卒以屈辱之鞭笞左右動至千數流血盈前飲噉自若嘗按部道次見叢荊堪為笞棰命取之輒以試人人或自陳無咎榮曰後若有罪當免爾及後犯細過將檛之人曰前日被杖使君許有罪宥之榮曰無過尚爾況有過邪榜捶如舊榮每巡省管內聞官人及百姓妻女有美色輒舍其室而淫之貪暴放縱日甚是時元弘嗣被除為幽州長史懼為榮所辱固辭上知之勑榮曰弘嗣杖十已上罪皆須奏聞榮忿曰豎子何敢弄我於是遣弘嗣監納倉粟颺得一糠一粃輒罰之每笞雖不滿十然一日之中或至三數如是歷年怨隙日構榮遂收付獄禁絕其糧弘嗣飢餒抽衣絮雜水咽之其妻詣闕稱寃上遣考功侍郎劉士龍馳驛鞫問奏榮虐毒非虛又贓穢狼籍遂徵還京師賜死先是榮家寢室無故有蛆數斛從地墳出未幾榮死於蛆出之處有子詢趙仲卿趙仲卿天水隴西人也父剛周大將車仲卿性粗暴有膂力周齊王憲甚禮之從擊齊攻臨秦統戎威遠伏龍張壁等五城盡平之又擊齊將段孝先於姚襄城苦戰連日破之以功授大都督尋典宿衞平齊之役以功遷上儀同兼趙郡太守入為畿伯中大夫王謙作亂仲卿使在利州即與總管豆盧勣發兵拒守為謙所攻仲卿督兵出戰前後一十七陣及謙平進位大將軍封長垣縣公邑千戶高祖受禪進爵河北郡公開皇三年突厥犯塞以行軍總管從河間王弘出賀蘭山仲卿別道俱進無虜而還復鎮平涼尋拜石州刺史法令嚴猛纖微之失無所容捨鞭笞長吏輒至二百官人戰慄無敢違犯盜賊屏息皆稱其能遷兗州刺史未之官拜朔州總管于時塞北盛興屯田仲卿總統之微有不理者仲卿輒召主掌撻其胸背或解衣倒曳於荊棘中時人謂之猛獸事多克濟由是收穫歲廣邊戍無餽運之憂會突厥啟民可汗求婚於國上許之仲卿因是間其骨肉遂相攻擊十七年啟民窘迫與隋使長孫晟投通漢鎮仲卿率騎千餘馳援之達頭不敢逼潛遣人誘致啟民所部至者二萬餘家其年從高熲指白道以擊達頭仲卿率兵三千為前鋒至族蠡山與虜相遇交戰七日大破之追奔至乞伏泊復破之虜千餘口雜畜萬計突厥悉衆而至仲卿為方陣四面拒戰經五日會高熲大兵至合擊之虜乃敗走追度白道踰秦山七百餘里時突厥降者萬餘家上命仲卿處之安以功進位上柱國賜物三千段朝廷慮達頭掩襲啟民令仲卿屯兵二萬以備之代州總管韓洪永康公李藥王蔚州刺史劉隆等將步騎一萬鎮安達頭騎十萬來寇韓洪軍大敗仲卿自樂寧鎮邀擊斬首虜千餘級明年督役築金河定襄二城以居啟民時有表言仲卿酷暴者上令御史王偉按之並實惜其功不罪也因勞之曰知公清正為下所惡賜物五百段仲卿益恣由是免官仁壽中檢校司農卿蜀王秀之得罪奉詔往益州窮按之秀賓客經過之處仲卿必深文致法州縣長吏坐者太半上以為能賞婢奴五十口黃金二百兩米粟五千石奇寶雜物稱是煬帝嗣位判兵部工部二曹尚書事其年卒時年六十四諡曰肅贈物五百段子弘嗣崔弘度弟弘昇崔弘度字摩訶衍博陵安平人也祖楷魏司空父說周敷州刺史弘度膂力絕人儀貌魁岸鬚面甚偉性嚴酷年十七周大冢宰宇文護引為親信尋授都督累轉大都督時護子中山公訓為蒲州刺史令弘度從焉嘗與訓登樓至上層去地四五丈俯臨之訓曰可畏也弘度曰此何足畏歘然擲下至地無損傷訓以其拳捷大奇之後以戰勳授儀同從武帝滅齊進位上開府鄴縣公賜物三千段粟麥三千石奴婢百口雜畜千計尋從汝南公宇文神舉破盧昌期於范陽宣帝嗣位從鄖國公韋孝寬經略淮南弘度與化政公宇文忻司水賀婁子幹至肥口陳將潘琛率兵數千來拒戰隔水而陣忻遣弘度諭以禍福琛至夕而遁進攻壽陽降陳守將吳文立弘度功最以前後勳進位上大將軍襲父爵安平縣公及尉迥作亂以弘度為行軍總管從韋孝寬討之弘度募長安驍雄數百人為別隊所當無不披靡弘度妹先適迥子為妻及破鄴城迥窘迫升樓弘度直上龍尾追之迥彎弓將射弘度弘度脫兜鍪謂迥曰相識不今日各圖國事不得顧私以親戚之情謹遏亂兵不許侵辱事勢如此早為身計何所待也迥擲弓於地罵大丞相極口而自殺弘度顧其弟弘昇曰汝可取迥頭弘昇遂斬之進位上柱國時行軍總管例封國公弘度不時殺迥致縱惡言由是降爵一等為武鄉郡公開皇初突厥入寇弘度以行軍總管出原州以拒之虜退弘度進屯靈武月餘而還拜華州刺史納其妹為秦孝王妃尋遷襄州總管弘度素貴御下嚴急動行捶罰吏人讋氣聞其聲莫不戰慄所在之處令行禁止盜賊屏跡梁王蕭琮來朝上以弘度為江陵總管鎮荊州弘度未至而琮叔父巖擁居人以叛弘度追之不及陳人憚弘度亦不敢窺荊州平陳之役以行軍總管從秦孝王出襄陽道及陳平賜物五千段高智慧等作亂復以行軍總管出泉門道隸於楊素弘度與素品同而年長素每屈下之一旦隸素意甚不平素言多不用素亦優容之及還檢校原州事仍領行軍總管以備胡無虜而還上甚禮之復以其弟弘昇女為河南王妃仁壽中檢校太府卿自以一門二妃無所降下每誡其僚吏曰人當誠恕無得欺誑皆曰諾後嘗食鼈待者八九人弘度一一問之曰鼈美乎人懼之皆云鼈美弘度大罵曰傭奴何敢誑我汝初未食鼈安知其美俱杖八十官屬百工見之者莫不流汗無敢欺隱時有屈突蓋為武候驃騎亦嚴刻長安為之語曰寧飲三升酢不見崔弘度寧茹三升艾不逢屈突蓋然弘度理家如官子弟斑白動行捶楚閨門整肅為當時所稱未幾秦王妃以罪誅河南王妃復被廢黜弘度憂恚謝病於家諸弟乃與之別居彌不得志煬帝即位河南王為太子帝將復立崔妃遣中使就第宣旨使者詣弘昇家弘度不之知也使者返帝曰弘度有何言使者曰弘度稱有疾不起帝默然其事竟寢弘度憂憤未幾卒弘昇字上客在周為右侍上士尉迥作亂相州與兄弘度擊之以功拜上儀同尋加上開府封黃臺縣侯邑八百戶高祖受禪進爵為公授驃騎將軍宿衞十餘年以勳舊遷慈州刺史數歲轉鄭州刺史後以戚屬之故待遇愈隆遷襄州總管及河南王妃罪廢弘昇亦免官煬帝即位歷冀州刺史信都太守進位金紫光祿大夫轉涿郡太守遼東之役檢校左武衞大將軍事指平壤與宇文述等同敗績奔還發病而卒時年六十元弘嗣元弘嗣河南洛陽人也祖剛魏漁陽王父經周漁陽郡公弘嗣少襲爵十八為左親衞開皇九年從晉王平陳以功授上儀同十四年除觀州總管長史在州專以嚴峻任事吏人多怨之二十年轉幽州總管長史于時燕榮為總管肆虐於弘嗣每被笞辱弘嗣心不伏榮遂禁弘嗣於獄將殺之及榮誅死弘嗣為政酷又甚之每推鞫囚徒多以酢灌鼻或椓弋其下竅無敢隱情姦偽屏息仁壽末授木工監修營東都大業初煬帝潛有取遼東之意遣弘嗣往東萊海口監造船諸州役丁苦其捶楚官人督役晝夜立於水中略不敢息自腰以下無不生蛆死者十三四尋遷黃門侍郎轉殿內少監遼東之役進位金紫光祿大夫明年帝復征遼東會奴賊寇隴右詔弘嗣擊之及玄感作亂逼東都弘嗣屯兵安定或告之謀應玄感者代王侑遣使執之送行在所以無反形當釋帝疑不解除名徙日南道死時年四十九有子仁觀王文同王文同京兆頻陽人也性明辯有幹用開皇中以軍功拜儀同尋授桂州司馬煬帝嗣位徵為光祿少卿以忤旨出為山郡丞有一人豪猾每持長吏長短前後守令咸憚之文同下車聞其名召而數之因令左右剡木為大橛埋之於庭出尺餘四角各埋小橛令其人踣心於木橛上縳四支於小橛以棒毆其背應時潰爛郡中大駭吏人相視懾氣及帝征遼東令文同巡察河北諸郡文同見沙門齋戒菜食者以為妖妄皆收繫獄比至河間召諸郡官人小有遲違者輒皆覆面於地而箠殺之求沙門相聚講論及長老共為佛會者數百人文同以為聚結惑衆盡斬之又悉裸僧尼驗有淫狀非童男女者數千人復將殺之郡中士女號哭於路諸郡驚駭各奏其事帝聞而大怒遣使者達奚善意馳鎖之斬於河間以謝百姓讎人剖其棺臠其肉而噉之斯須咸盡史臣曰御之良者不在於煩策政之善者無取於嚴刑故雖寬猛相資德刑互設然不嚴而化前哲所重士文等運屬欽明時無桀黠未閑道德實懷殘忍賊人肌體同諸木石輕人性命甚於芻狗長惡不悛鮮有不及故或身嬰罪戮或憂恚顛隕凡百君子以為有天道焉嗚呼後來之士立身從政縱不能為子高門以待封其可令母掃墓而望喪乎

body:
  text: 隋書卷八十二列傳第四十七南蠻南蠻雜類與華人錯居曰蜒曰獽曰俚曰獠曰甫久俱無君長隨山洞而居古先所謂百越是也其俗斷髮文身好相攻討浸以微弱稍屬於中國皆列為郡縣同之齊人不復詳載大業中南荒朝貢者十餘國其事迹多湮滅而無聞今所存録四國而已林邑林邑之先因漢末交址女子徵側之亂內縣功曹子區連殺縣令自號為王無子其甥范熊代立死子逸立日南人范文因亂為逸僕隸遂教之築宮室造器械逸甚信任使文將兵極得衆心文因間其子弟或奔或徙及逸死國無嗣文自立為王其後范佛為晉揚威將軍戴桓所破宋交州刺史檀和之將兵擊之深入其境至梁陳亦通使往來其國延袤數千里土多香木金寶物産大抵與交址同以磚為城蜃灰塗之東向戶尊官有二其一曰西那婆帝其二曰薩婆地歌其屬官三等其一曰倫多姓次歌倫致帝次乙他伽蘭外官分為二百餘部其長官曰弗羅次曰可輪如牧宰之差也王戴金花冠形如章甫衣朝霞布珠璣瓔珞足躡革履時復錦袍良家子侍衛者二百許人皆執金裝刀有弓箭刀槊以竹為弩傅毒於矢樂有琴笛琵琶五絃頗與中國同每擊鼓以警衆吹蠡以即戎其人深目高鼻髮拳色黑俗皆徒跣以幅布纏身冬月衣袍婦人椎髻施椰葉席每有婚媾令媒者齎金銀釧酒二壺魚數頭至女家於是擇日夫家會親賓歌相對女家請一婆羅門送女至男家壻盥手因牽女授之王死七日而葬有官者三日庶人一日皆以函盛尸鼓導從輿至水次積薪焚之收其餘骨王則內金罌中沉之於海有官者以銅罌沉之於海口庶人以瓦送之於江男女皆截髮隨喪至水次盡哀而止歸則不哭每七日然香散花復哭盡哀而止盡七七而罷至百日三年亦如之人皆奉佛文字同於天竺高祖既平陳乃遣使獻方物其後朝貢遂絶時天下無事羣臣言林邑多奇寶者仁壽末上遣大將軍劉方為歡州道行軍總管率欽州刺史寧長真歡州刺史李暈開府秦雄步騎萬餘及犯罪者數千人擊之其王梵志率其徒乘巨象而戰方軍不利方於是多掘小坑草覆其上因以兵挑之梵志悉衆而陳方與戰偽北梵志逐之至坑所其衆多陷轉相驚駭軍遂亂方縱兵擊之大破之頻戰輒敗遂棄城而走方入其都獲其廟主十八枚皆鑄金為之蓋其有國十八葉矣方班師梵志復其故地遣使謝罪於是朝貢不絶赤土赤土國扶南之別種也在南海中水行百餘日而達所都土色多赤因以為號東波羅剌國西婆羅娑國南訶羅旦國北拒大海地方數千里其王姓瞿曇氏名利富多塞不知有國近遠稱其父釋王位出家為道傳位於利富多塞在位十六年矣有三妻並鄰國王之女也居僧祗城有門三重相去各百許步每門圖畫飛仙仙人菩薩之像縣金花鈴毦婦女數十人或奏樂或捧金花又飾四婦人容飾如佛塔邊金剛力士之狀夾門而立門外者持兵仗門內者執白佛夾道垂素網綴花王宮諸屋悉是重閣北戶北面而坐坐三重之榻衣朝霞布冠金花冠垂雜寶瓔珞四女子立侍左右兵衛百餘人王榻後作一木龕以金銀五香木雜鈿之龕後懸一金光焰夾榻又樹二金鏡鏡前並陳金甕甕前各有金香爐當前置一金伏牛牛前樹一寶蓋蓋左右皆有寶扇婆羅門等數百人東西重行相向而坐其官有薩陀迦羅一人陀拏達義二人迦利蜜迦三人共掌政事俱羅末帝一人掌刑法每城置那邪迦一人鉢帝十人其俗等皆穿耳剪髮無跪拜之禮以香油塗身其俗敬佛尤重婆羅門婦人作髻於項後男女通以朝霞朝雲雜色布為衣豪富之室恣意華靡唯金鎖非王賜不得服用每婚嫁擇吉日女家先期五日作樂飲酒父執女手以授壻七日乃配焉既娶則分財別居唯幼子與父同居父母兄弟死則剔髮素服就水上構竹木為棚棚內積薪以尸置上燒香建幡吹蠡擊鼓以送之縱火焚薪遂落於水貴賤皆同唯國王燒訖收灰貯以金瓶藏於廟屋冬夏常溫雨多霽少種植無時特宜稻穄白豆黑麻自餘物産多同於交址以甘蔗作酒雜以紫瓜根酒色黃赤味亦香美亦名椰漿為酒煬帝即位募能通絶域者大業三年屯田主事常駿虞部主事王君政等請使赤土帝大悅賜駿等帛各百匹時服一襲而遣齎物五千段以賜赤土王其年十月駿等自南海郡乘舟晝夜二旬每值便風至焦石山而過東南泊陵伽鉢拔多洲西與林邑相對上有神祠焉又南行至師子石自是島嶼連接又行二三日西望見狼牙須國之山於是南達雞籠島至於赤土之界其王遣婆羅門鳩摩羅以舶三十艘來迎吹蠡擊鼓以樂隋使進金鎖以纜駿船月餘至其都王遣其子那邪迦請與駿等禮見先遣人送金盤貯香花並鏡鑷金合二枚貯香油金瓶八枚貯香水白疊布四條以擬供使者盥洗其日未時那邪迦又將象二頭持孔雀蓋以迎使人並致金花金盤以藉詔函男女百人奏蠡鼓婆羅門二人導路至王宮駿等奉詔書上閣王以下皆坐宣詔訖引駿等坐奏天竺樂事畢駿等還館又遣婆羅門就館送食以草葉為盤其大方丈因謂駿曰今是大國中人非復赤土國矣飲食疏薄願為大國意而食之後數日請駿等入宴儀衛導從如初見之禮王前設兩牀牀上並設草葉盤方一丈五尺上有黃白紫赤四色之餅牛羊魚鱉豬蝳蝐之肉百餘品延駿升牀從者坐於地席各以金鍾置酒女樂迭奏禮遺甚厚尋遣那邪迦隨駿貢方物並獻金芙蓉冠龍腦香以鑄金為多羅葉隱起成文以為表金函封之令婆羅門以香花奏蠡鼓而送之既入海見緑魚羣飛水上浮海十餘日至林邑東南並山而行其海水闊千餘步色黃氣腥舟行一日不絶云是大魚糞也循海北岸達于交址駿以六年春與那邪迦於弘農謁帝大悅賜駿等物二百段俱授秉義尉那邪迦等官賞各有差真臘真臘國在林邑西南本扶南之屬國也去日南郡舟行六十日而南接車渠國西有朱江國其王姓剎利氏名質多斯那自其祖漸已強盛至質多斯那遂兼扶南而有之死子伊奢那先代立居伊奢那城郭下二萬餘家城中有一大堂是王聽政之所總大城三十城有數千家各有部帥官名與林邑同其王三日一聽朝坐五香七寶牀上施寶帳其帳以文木為竿象牙金鈿為壁狀如小屋懸金光焰有同於赤土前有金香爐二人侍側王著朝霞古貝瞞絡腰腹下垂至脛頭戴金寶花冠被真珠瓔珞足履革屣耳懸金璫常服白疊以象牙為屩若露髮則不加瓔珞臣人服製大抵相類有五大臣一曰孤落支二曰高相憑三曰婆何多陵四曰舍摩陵五曰髯多婁及諸小臣朝於王者輒以階下三稽首王喚上階則跪以兩手抱膊繞王環坐議政事訖跪伏而去階庭門閣侍衛有千餘人被甲持仗其國與參半朱江二國和親數與林邑陀桓二國戰爭其人行止皆持甲仗若有征伐因而用之其俗非王正妻子不得為嗣王初立之日所有兄弟並刑殘之或去一指或劓其鼻別處供給不得仕進人形小而色黑婦人亦有白者悉拳髮垂耳性氣捷徑居處器物頗類赤土以右手為淨左手為穢每旦澡洗以楊枝淨齒讀誦經呪又澡灑乃食食罷還用楊枝淨齒又讀經呪飲食多蘇酪沙糖粳粟米餅欲食之時先取雜肉羹與餅相和手擩而食娶妻者唯送衣一具擇日遣媒人迎婦男女二家各八日不出晝夜燃燈不息男婚禮畢即與父母分財別居父母死小兒未婚者以餘財與之若婚畢財物入官其喪葬兒女皆七日不食剔髮而哭僧尼道士親故皆來聚會音樂送之以五香木燒尸收灰以金銀瓶盛送于大水之內貧者或用瓦而以彩色畫之亦有不焚送尸山中任野獸食者其國北多山阜南有水澤地氣尤熱無霜雪饒瘴癘毒土宜粱稻少黍粟果菜與日南九真相類異者有婆那娑樹無花葉似柿實似冬瓜菴羅樹花葉似棗實似李毗野樹花似木瓜葉似杏實似楮婆田羅樹花葉實並似棗而小異歌畢他樹花似林檎葉似榆而厚大實似李其大如升自餘多同九真海中有魚名建同四足無鱗其鼻如象吸水上噴高五六十尺有浮胡魚其形似嘴如鸚鵡有八足多大魚半身出水望之如山每五六月中毒氣流行即以白豬白牛白羊於城西門外祠之不然者五穀不登六畜多死人衆疾疫近都有陵伽鉢婆山上有神祠每以兵五千人守衛之城東有神名婆多利祭用人肉其王年別殺人以夜祀禱亦有守衛者千人其敬鬼如此多奉佛法尤信道士佛及道士並立像於館大業十二年遣使貢獻帝禮之甚厚其後亦絶婆利婆利國自交址浮海南過赤土丹丹乃至其國國界東西四月行南北四十五日行王姓剎利邪伽名護濫那婆官曰獨訶邪拿次曰獨訶氏拿國人善投輪刀其大如鏡中有竅外鋒如鋸遠以投人無不中其餘兵器與中國略同俗類真臘物産同於林邑其殺人及盜截其手姦者鎖其足期年而止祭祀必以月晦盤貯酒肴浮之流水每十一月必設大祭海出珊瑚有鳥名舍利解人語大業十二年遣使朝貢後遂絶于時南荒有丹丹盤盤二國亦來貢方物其風俗物産大抵相類云史臣曰禮云南方曰蠻有不火食者矣書稱蠻夷猾夏詩曰蠢爾蠻荊種類實繁代為紛梗自秦並二楚漢平百越地窮丹徼景極日南水陸可居咸為郡縣暨乎境分吳蜀時經晉宋道有污隆服叛不一高祖受命克平九宇煬帝纂業威加八荒甘心遠夷志求珍異故師出於流求兵加於林邑威振殊俗過於秦漢遠矣雖有荒外之功無救域中之敗傳曰非聖人外寧必內憂誠哉斯言也

body:
  text: 隋書卷七十九列傳第四十四外戚歷觀前代外戚之家乘母后之權以取高位厚秩者多矣然而鮮有克終之美必罹顛覆之患何哉皆由乎無德而尊不知紀極忽於滿盈之戒罔念高危之咎故鬼瞰其室憂必及之夫其誠著艱難功宣社稷不以謙沖自牧未免顛蹶之禍而況道不足以濟時仁不足以利物自矜於己以富貴驕人者乎此呂霍上官閻梁竇鄧所以繼踵而亡滅者也昔文皇潛躍之際獻后便相推轂煬帝大橫方兆蕭妃密勿經綸是以恩禮綢繆始終不易然內外親戚莫預朝權昆弟在位亦無殊寵至於居擅玉堂家稱金穴暉光戚里重灼四方將三司以比儀命五侯而同拜者終始一代寂無聞焉考之前王可謂矯其弊矣故雖時經擾攘無有陷於不義市朝遷貿而皆得以保全比夫憑藉寵私階緣恩澤乘其非據旋就顛隕者豈可同日而言哉此所謂愛之以禮能改覆車輒其事為外戚傳云高祖外家呂氏高祖外家呂氏其族蓋微平齊之後求訪不知所在至開皇初濟南郡上言有男子呂永吉自稱有姑字苦桃為楊忠妻勘驗知是舅子始追贈外祖雙周為上柱國太尉八州諸軍事青州刺史封齊郡公諡曰敬外祖母姚氏為齊敬公夫人詔並改葬於齊州立廟置守冢十家以永吉襲爵留在京師大業中授上黨郡太守性識庸劣職務不理後去官不知所終永吉從父道貴性尤頑騃言詞鄙陋初自鄉里徵入長安上見之悲泣道貴略無戚容但連呼高祖名云種末定不可偷大似苦桃姊是後數犯忌諱動致違忤上甚恥之乃命高熲厚加供給不許接對朝士拜上儀同三司出為濟南太守令即之任斷其入朝道貴還至本郡高自崇重每與人言自稱皇舅數將儀衛出入閭里從故人遊宴官民咸苦之後郡廢終於家子孫無聞焉獨孤羅弟獨孤羅字羅仁雲中人也父信初仕魏為荊州刺史武帝之入關也信棄父母妻子西歸長安歷職顯貴羅由是遂為高氏所囚信後仕周為大司馬及信為宇文護所誅羅始見釋寓居中山孤貧無以自給齊將獨孤永業以宗族之故見而哀之為買田宅遺以資畜初信入關之後復娶二妻郭氏生子六人善穆藏順整崔氏生獻皇后及齊亡高祖為定州總管獻皇后遣人尋羅得之相見悲不自勝侍御者皆泣於是厚遺車馬財物未幾周武帝以羅功臣子久淪異域徵拜楚安郡太守以疾去官歸于京師諸弟見羅少長貧賤每輕侮之不以兄禮事也然性長者亦不與諸弟校競長短后由是重之及高祖為丞相拜儀同常置左右既受禪下詔追贈羅父信官爵曰褒德纍行往代通規追遠慎終前王盛典故柱國信風宇高曠獨秀生民睿哲居宗清獻映世宏謀長策道著於弼諧緯義經仁事深於拯濟方當宣風廊廟亮采台階而運屬艱危功高弗賞眷言令範事切於心今景運初開椒闈肅建載懷塗山之義無忘褒紀之典可贈太師上柱國冀定等十州刺史趙國公邑萬戶其諸弟以羅母沒齊先無夫人之號不當承襲上以問后后曰羅誠嫡長不可誣也於是襲爵趙國公以其弟善為河內郡公穆為金泉縣公藏為武平縣公為武喜縣公整為千牛備身擢拜羅為左領左右將軍尋遷左衛將軍前後賞賜不可勝計久而出為涼州總管進位上柱國仁壽中徵拜左武衛大將軍煬帝嗣位改封蜀國公未幾卒官諡曰恭子纂嗣仕至河陽郡尉纂弟武都大業末亦為河陽郡尉庶長子開遠宇文化及之弒逆也裴虔通率賊入成象殿宿衛兵士皆從逆開遠時為千牛與獨孤盛力戰於閣下為賊所執賊義而捨之善後官至柱國卒子覽嗣仕至左候衛將軍大業末卒獨孤字黎邪仕周胥附上士坐父徙蜀郡十餘年宇文護被誅始歸長安高祖受禪拜上開府右領左右將軍久之出為郢州刺史進位上大將軍纍轉延州刺史好左道其妻母先事貓鬼因轉入其家上微聞而不之信也會獻皇后及楊素妻鄭氏俱有疾召醫者視之皆曰此貓鬼疾也上以后之異母弟妻楊素之異母妹由是意所為陰令其兄穆以情喻之上又避左右諷言無有上不悅左轉遷州刺史出怨言上令左僕射高熲納言蘇威大理正皇甫孝緒大理丞楊遠等雜治之婢徐阿尼言本從母家來常事貓鬼每以子日夜祀之言子者鼠也其貓鬼每殺人者所死家財物潛移於畜貓鬼家嘗從家中索酒其妻曰無錢可酤因謂阿尼曰可令貓鬼向越公家使我足錢也阿尼便呪之歸數日貓鬼向素家十一年上初從並州還於園中謂阿尼曰可令貓鬼向皇后所使多賜吾物阿尼復呪之遂入宮中楊遠乃於門下外省遣阿尼呼貓鬼阿尼於是夜中置香粥一盆以匙扣而呼之曰貓女可來無住宮中久之阿尼色正青若被牽曳者云貓鬼已至上以其事下公卿奇章公牛弘曰妖由人興殺其人可以絶矣上令以犢車載夫妻將賜死於其家弟司勳侍中整詣闕求哀於是免死除名為民以其妻楊氏為尼先是有人訟其母為人貓鬼所殺者上以為妖妄怒而遣之及此詔誅被訟行貓鬼家未幾而卒煬帝即位追念舅氏聽以禮葬乃下詔曰外氏衰禍獨孤不幸早世遷卜有期言念渭陽之情追懷傷切宜加禮命允備哀榮可贈正議大夫帝意猶不已復下詔曰舅氏之尊戚屬斯重而降年弗永凋落相繼緬惟先往宜崇徽秩復贈銀青光祿大夫有二子延福延壽弟整官至幽州刺史大業初卒贈金紫光祿大夫平鄉侯蕭巋子琮琮弟瓛蕭巋字仁遠梁昭明太子統之孫也父察初封嶽陽王鎮襄陽侯景之亂其兄河東王譽與其叔父湘東王繹不協為繹所害及繹嗣位察稱藩于西魏乞師請討繹周太祖以察為梁主遣柱國于謹等率騎五萬襲繹滅之察遂都江陵有荊郡其西平州延袤三百里之地稱皇帝於其國車服節文一同王者仍置江陵總管以兵戍之察薨巋嗣立年號天保巋俊辨有才學兼好內典周武帝平齊之後巋來賀帝享之甚歡親彈琵琶令巋起舞巋曰陛下親御五絃臣敢不同百獸高祖受禪恩禮彌厚遣使賜金五百兩銀千兩布帛萬匹馬五百匹巋來朝上甚敬焉詔巋位在王公之上巋被服端麗進退間雅天子矚目百僚傾慕賞賜以億計月餘歸藩帝親餞於滻水之上後備禮納其女為晉王妃又欲以其子瑒尚蘭陵公主由是漸見親待獻皇后言於上曰梁主通家腹心所寄何勞猜防也上然之於是罷江陵總管巋專制其國歲餘巋又來朝賜縑萬匹珍玩稱是及還上親執手曰梁主久滯荊楚未復舊都故鄉之念良軫懷抱朕當振旅長江相送旋反耳巋拜謝而去其年五月寢疾臨終上表曰臣以庸暗曲荷天慈寵冠外藩恩踰連山爰及子女尚主婚王每願躬擐甲胄身先士卒掃蕩逋寇上報明時而攝生乖舛遽罹痾疾屬纊在辰顧陰待謝長違聖世感戀嗚咽遺嗣孤藐特乞降慈伏願聖躬與山嶽同固皇基等天日俱永臣雖九泉實無遺恨並獻所服金裝劍上覽而嗟悼焉巋在位二十三年年四十四薨梁之臣子諡曰孝明皇帝廟號世宗子琮嗣巋著孝經周易義記及大小乘幽微十四卷行於世琮字溫文性寬仁有大度倜儻不羈博學有文義兼善弓馬遣人伏地著帖琮馳馬射之十發十中持帖者亦不懼初封東陽王尋立為梁太子及嗣位上賜璽書曰負荷堂構其事甚重雖窮憂勞常須自力輯諧內外親任才良聿遵世業是所望也彼之疆守咫尺陳人水潦之時特宜警備陳氏比日雖復朝聘相尋疆埸之間猶未清肅唯當恃我必不可干勿得輕人而不設備朕與梁國積世相知重以親姻情義彌厚江陵之地朝寄非輕為國為民深宜抑割加饘粥以禮自存又賜梁之大臣璽書誡勉之時琮年號廣運有識者曰運之為字軍走也吾君將奔走乎其年琮遣大將軍戚昕以舟師襲陳公安不克而還徵琮叔父岑入朝拜為大將軍封懷義公因留不遣復置江陵總管以監之琮所署大將軍許世武密以城召陳將宜黃侯陳紀謀泄琮誅之後二歲上徵琮入朝率其臣下二百餘人朝于京師江陵父老莫不隕涕相謂曰吾君其不反矣上以琮來朝遣武鄉公崔弘度將兵戍之軍至鄀州琮叔父巖及弟瓛等懼弘度掩襲之遂引陳人至城下虜居民而叛於是廢梁國上遣左僕射高熲安集之曲赦江陵死罪給民復十年梁二主各給守墓十戶拜琮為柱國賜爵莒國公煬帝嗣位以皇后之故甚見親重拜內史令改封梁公琮之宗族緦麻以上並隨才擢用於是諸蕭昆弟布列朝廷琮性淡雅不以職務自嬰退朝縱酒而已內史令楊約與琮同列帝令約宣旨誡勵約復以私情喻之琮答曰琮若復事事則何異於公哉約笑而退約兄素時為尚書令見琮嫁從父妹於鉗耳氏因謂琮曰公帝王之族望高戚美何乃適妹鉗耳氏乎琮曰前已嫁妹於侯莫陳氏此復何疑素曰鉗耳羌也侯莫陳虜也何得相比素意以虜優羌劣琮曰以羌異虜未之前聞素慚而止琮雖羈旅見北間豪貴無所降下嘗與賀若弼深相友善弼既被誅復有童謠曰蕭蕭亦復起帝由是忌之遂廢於家未幾而卒贈左光祿大夫子鉉襄城通守復以琮弟子巨為梁公巨小名藏煬帝甚昵之以為千牛與宇文皛出入宮掖伺察內外帝每有遊宴巨未嘗不從焉遂於宮中多行淫穢江都之變為宇文化及所殺瓛字欽文少聰敏解屬文在梁為荊州刺史頗有能名崔弘度以兵至鄀州瓛懼與其叔父巖奔于陳陳主以為侍中安東將軍吳州刺史甚得物情三吳父老皆曰吾君子也及陳亡吳人推瓛為主吳人見梁武簡文及察巋等兄弟並第三而踐尊位瓛自以巋之第三子也深自矜負有謝異者頗知廢興梁陳之際言無不驗江南人甚敬信之及陳主被擒異奔於瓛由是益為衆所歸褒國公宇文述以兵討之瓛遣王哀守吳州自將拒述述遣兵別道襲吳州哀懼衣道士服棄城而遁瓛衆聞之悉無鬬志與述一戰而敗瓛將左右數人逃于太湖匿於民家為人所執送於述所斬之長安時年二十一弟璟為朝請大夫尚衣奉御瑒歷衛尉卿祕書監陶丘侯瑀歷內史侍郎河池太守史臣曰三五哲王防深慮遠舅甥之國罕執鈞衡母后之家無聞傾敗爰及漢晉顛覆繼軌皆由乎進不以禮故其斃亦速若使獨孤權侔呂霍必敗於仁壽之前蕭氏勢均梁竇豈全於大業之後今或不隕舊基或更隆先構豈非處之以道不預權寵之所致乎

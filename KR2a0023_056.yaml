body:
  text: 隋書卷五十六列傳第二十一盧愷盧愷字長仁涿郡范陽人也父柔終於魏中書監愷性孝友神情爽悟略涉書記頗解屬文周齊王憲引為記室其後襲爵容城伯邑千一百戶從憲伐齊愷說柏杜鎮下之遷小吏部大夫增邑七百戶染工上士王神歡者嘗以賂自進冢宰宇文護擢為計部下大夫愷諫曰古者登高能賦可為大夫求賢審官理須詳慎今神歡出自染工更無殊異徒以家富自通遂與搢紳並列實恐惟鵜之刺聞之外境護竟寢其事建德中增邑二百戶歲餘轉內史下大夫武帝在雲陽宮勑諸屯簡老牛欲以享士愷進諫曰昔田子方贖老馬君子以為美談向奉明勑欲以老牛享士有虧仁政帝美其言而止轉禮部大夫為聘陳使副先是行人多從其國禮及愷為使一依本朝陳人莫能屈四年秋李穆攻拔軹關柏崖二鎮命愷作露布帝讀之大悅曰盧愷文章大進荀景倩故是令君之子尋授襄州總管司録轉治中大象元年徵拜東京吏部大夫開皇初加上儀同三司除尚書吏部侍郎進爵為侯仍攝尚書左丞每有敷奏侃然正色雖逢喜怒不改其常帝嘉愷有吏幹賜錢二十萬並賚雜綵三百匹加散騎常侍八年上親考百僚以愷為上愷固讓不敢受高祖曰吏部勤幹舊所聞悉今者上考僉議攸同當仁不讓何愧之有皆在朕心無勞飾讓歲餘拜禮部尚書攝吏部尚書事會國子博士何妥與右僕射蘇威不平奏威陰事愷坐與相連上以愷屬吏憲司奏愷曰房恭懿者尉遲迥之黨不當仕進威愷二人曲相薦達纍轉為海州刺史又吏部預選者甚多愷不即授官皆注色而遣威之從父弟徹肅二人並以鄉正徵詣吏部徹文狀後至而先任用肅左足攣蹇才用無算愷以威故授朝請郎愷之朋黨事甚明白上大怒曰愷敢將天官以為私惠愷免冠頓首曰皇太子將以通事舍人蘇夔為舍人夔即蘇威之子臣以夔未當遷固啓而止臣若與威有私豈當如此上曰蘇威之子朝廷共知卿乃固執以徼身幸至所不知者便行朋附姦臣之行也於是除名為百姓未幾卒于家自周氏以降選無清濁及愷攝吏部與薛道衡陸彥師等甄別士流故涉黨固之譖遂及於此子義恭嗣令狐熙令狐熙字長熙燉煌人也代為西州豪右父整仕周官至大將軍始豐二州刺史熙性嚴重有雅量雖在私室終日儼然不妄通賓客凡所交結必一時名士博覽羣書尤明三禮善騎射頗知音律起家以通經為吏部上士尋授帥都督輔國將軍轉夏官府都上士俱有能名以母憂去職殆不勝喪其父戒之曰大孝在於安親義不絶嗣吾今見存汝又隻立何得過爾毀頓貽吾憂也熙自是稍加饘粥服闋除小駕部復丁父憂非杖不起人有聞其哭聲莫不為之下泣河陰之役詔令墨縗從事還授職方下大夫襲爵彭陽縣公邑二千一百戶及武帝平齊以留守功增邑六百戶進位儀同歷司勳吏部二曹中大夫甚有當時之譽高祖受禪之際熙以本官行納言事尋除司徒左長史加上儀同進爵河南郡公時吐谷渾寇邊以行軍長史從元帥元諧討之以功進位上開府會蜀王秀出鎮於蜀綱紀之選咸屬正人以熙為益州總管長史未之官拜滄州刺史時山東承齊之弊戶口簿籍類不以實熙曉諭之令自歸首至者一萬戶在職數年風教大洽稱為良二千石開皇四年上幸洛陽熙來朝吏民恐其遷易悲泣於道及熙復還百姓出境迎謁歡叫盈路在州獲白烏白麞嘉麥甘露降於庭前柳樹八年徙為河北道行臺度支尚書吏民追思相與立碑頌德及行臺廢授並州總管司馬後徵為雍州別駕尋為長史遷鴻臚卿後以本官兼吏部尚書往判五曹尚書事號為明幹上甚任之及上祠太山還次汴州惡其殷盛多有姦俠於是以熙為汴州刺史下車禁游食抑工商民有向街開門者杜之船客停於郭外星居者勒為聚落僑人逐令歸本其有滯獄並決遣之令行禁止稱為良政上聞而嘉之顧謂侍臣曰鄴都天下難理處也勑相州刺史豆盧通令習熙之法其年來朝考績為天下之最賜帛三百匹頒告天下上以嶺南夷越數為反亂徵拜桂州總管十七州諸軍事許以便宜從事刺史以下官得承制補授給帳內五百人賜帛五百匹發傳送其家纍改封武康郡公熙至部大弘恩信其溪洞渠帥更相謂曰前時總管皆以兵威相脅今者乃以手教相諭我輩其可違乎於是相率歸附先是州縣生梗長吏多不得之官寄政於總管府熙悉遣之為建城邑開設學校華夷感敬稱為大化時有寧猛力者與陳後主同日生自言貌有貴相在陳日已據南海平陳後高祖因而撫之即拜安州刺史然驕倨恃其阻險未嘗參謁熙手書諭之申以交友之分其母有疢熙復遣以藥物猛力感之詣府請謁不敢為非熙以州縣多有同名者於是奏改安州為欽州黃州為峯州利州為智州德州為歡州東寧為融州上皆從之在職數年上表曰臣忝寄嶺表四載于茲犬馬之年六十有一才輕任重愧懼兼深常願收拙避賢稍免官謗然所管遐曠綏撫尤難雖未能頓革夷風頗亦漸識皇化但臣夙患消渴比更增甚筋力精神轉就衰邁昔在壯齒猶不如人況今年疾俱侵豈可猶當重寄請解所任優詔不許賜以醫藥熙奉詔令交州渠帥李佛子入朝佛子欲為亂請至仲冬上道熙意在羈縻遂從之有人詣闕訟熙受佛子賂而捨之上聞而固疑之既而佛子反問至上大怒以為信然遣使者鎖熙詣闕熙性素剛鬱鬱不得志行至永州憂憤發病而卒時年六十三上怒不解於是沒其家財及行軍總管劉方擒佛子送於京師言熙實無贓貨上乃悟於是召其四子聽預仕焉少子德棻最知名薛胄薛胄字紹玄河東汾陰人也父端周蔡州刺史胄少聰明每覽異書便曉其義常歎訓注者不會聖人深旨輒以意辨之諸儒莫不稱善性慷慨志立功名周明帝時襲爵文城郡公纍遷上儀同尋拜司金大夫後加開府高袓受禪擢拜魯州刺史未之官檢校廬州總管事尋除兗州刺史及到官繫囚數百胄剖斷旬日便了囹圄空虛有陳州人向道力者僞作高平郡守將之官胄遇諸塗察其有異將留詰之司馬王君馥固諫乃聽詣郡既而悔之即遣主簿追禁道力有部人徐俱羅者嘗任海陵郡守先是已為道力僞代之比至秩滿公私不悟俱羅遂語君馥曰向道力以經代俱羅為郡使君豈容疑之君馥以俱羅所陳又固請胄胄呵君馥曰吾已察知此人詐也司馬容姦當連其坐君馥乃止遂往收之道力懼而引僞其發姦摘伏皆此類也時人謂為神明先是兗州城東沂泗二水合而南流泛濫大澤中胄遂積石堰之使決令西注陂澤盡為良田又通轉運利盡淮海百姓賴之號為薛公豐兗渠胄以天下太平登封告禪帝王盛烈遂遣博士登太山觀古跡撰封禪圖及儀上之高祖謙讓不許後轉郢州刺史前後俱有惠政徵拜衛尉卿尋轉大理卿持法寬平名為稱職後遷刑部尚書時左僕射高熲稍被疏忌及王世積之誅也熲事與相連上因此欲成熲罪胄明雪之正議其獄由是忤旨械繫之久而得免檢校相州事甚有能名會漢王諒作亂並州遣僞將綦良東略地攻逼慈州刺史上官政請援於胄胄畏諒兵鋒不敢拒良又引兵攻胄胄欲以計却之遣親人魯世範說良曰天下事未可知胄為人臣去就須得其所何遽相攻也良於是釋去進圖黎陽及良為史祥所攻棄軍歸胄朝廷以胄懷二心鎖詣大理相州吏人素懷其恩詣闕理胄者百餘人胄竟坐除名配防嶺南道病卒有子筠獻並知名宇文宇文字公輔河南洛陽人也其先與周同出祖直力覲魏巨鹿太守父珍周宕州刺史慷慨有大節博學多通仕周為禮部上士嘗奉使鄧至國及黑水龍涸諸羌前後降附三十餘部及還奉詔修定五禮書成奏之賜公田十二頃粟百石纍遷少吏部擢八人為縣令皆有異績時以為知人轉內史都上士武帝將出兵河陽以伐齊謀及臣下進策曰齊氏建國于今纍葉雖曰無道藩屏之寄尚有其人今之用兵須擇其地河陽衝要精兵所聚盡力攻圍恐難得志如臣所見彼汾之曲戍小山平攻之易拔用武之地莫過於此願陛下詳之帝不納師竟無功建德五年大舉伐齊卒用計於是募三輔豪俠少年數百人以為別隊從帝攻拔晉州身被三創苦戰不息帝奇而壯之後從帝平齊以功拜上儀同封武威縣公邑千五百戶賜物千五百段奴婢百五十口馬牛羊千餘頭拜司州總管司録宣帝嗣位遷左守廟大夫時突厥寇甘州帝令侯莫陳昶率兵擊之為監軍謂昶曰黠虜之勢來如激矢去若絶絃若欲追躡良為難及且宜選精騎直趨祁連之西賊若收軍必自蓼泉之北此地險隘兼復下濕度其人馬三日方度緩轡追討何慮不及彼勞我逸破之必矣若邀此路真上策也昶不能用之西取合黎大軍行遲虜已出塞其年又率兵從梁士彥攻拔壽陽尋改封安樂縣公增邑六百戶賜物六百段加以口馬除澮州刺史俄轉南司州刺史後司馬消難之奔陳也追之不及遇陳將樊毅戰於漳口自旦及午三戰三捷虜獲三千人除黃州刺史尋轉南定州刺史開皇初以前功封平昌縣公加邑一千二百戶入為尚書右丞時西羌內附詔持節安集之置鹽澤蒲昌二郡而還遷尚書左丞當官正色為百僚所憚三年突厥寇甘州以行軍司馬從元帥竇榮定擊破之還除太僕少卿轉吏部侍郎平陳之役楊素出信州道令持節為諸軍節度仍領行軍總管劉仁恩之破陳將呂仲肅也有謀焉加開府擢拜刑部尚書領太子虞候率上嘗親臨釋奠與博士論議詞致清遠觀者屬目上大悅顧謂侍臣曰朕今覩周公之制禮見宣尼之論孝實慰朕心於是頒賜各有差時朝廷以晉陽為重鎮並州總管必屬親王其長史司馬亦一時高選前長史王韶卒以有文武幹用出為並州長史俄以父艱去職尋詔起之十八年遼東之役授元帥漢王府司馬仍尋領行軍總管軍還之後歷朔代吳三州總管皆有能名煬帝即位徵拜刑部尚書仍持節巡省河北還除泉州刺史歲餘復拜刑部尚書尋轉禮部尚書既以才能著稱歷職顯要聲望甚重物議時談多見推許帝頗忌之時帝漸好聲色尤勤遠略謂高熲曰昔周天元好聲色而國亡以今方之不亦甚乎又言長城之役幸非急務有人奏之竟坐誅死時年六十二天下寃之所著辭賦二十餘萬言為尚書孝經注行於時有子儉瑗張衡張衡字建平河內人也祖嶷魏河陽太守父光周萬州刺史衡幼懷志尚有骨鯁之風年十五詣太學受業研精覃思為同輩所推周武帝居太后憂與左右出獵衡露髮輿櫬扣馬切諫帝嘉焉賜衣一襲馬一匹擢拜漢王侍讀衡又就沈重受三禮略究大旨纍遷掌朝大夫高祖受禪拜司門侍郎及晉王廣為河北行臺衡歷刑部度支二曹郎後以臺廢拜並州總管掾及王轉牧揚州衡復為掾王甚親任之衡亦竭慮盡誠事之奪宗之計多衡所建也以母憂去職歲餘起授揚州總管司馬賜物三百段開皇中熙州李英林聚衆反署置百官以衡為行軍總管率步騎五萬人討平之拜開府賜奴婢一百三十口物五百段金銀雜畜稱是及王為皇太子拜衡右庶子仍領給事黃門侍郎煬帝嗣位除給事黃門侍郎進位銀青光祿大夫俄遷御史大夫甚見親重大業三年帝幸榆林郡還至太原謂衡曰朕欲過公宅可為朕作主人衡於是馳至河內與宗族具牛酒帝上太行開直道九十里以抵其宅帝悅其山泉留宴三日因謂衡曰往從先皇拜太山之始塗經洛陽瞻望於此深恨不得相過不謂今日得諧宿願衡俯伏辭謝奉觴上壽帝益歡賜其宅傍田三十頃良馬一匹金帶縑綵六百段衣一襲御食器一具衡固讓帝曰天子所至稱幸者蓋為此也不足為辭衡復獻食於帝帝令頒賜公卿下至衛士無不霑洽衡以藩邸之舊恩寵莫與為比頗自驕貴明年帝幸汾陽宮宴從官特賜絹五百匹時帝欲大汾陽宮令衡與紀弘整具圖奏之衡承間進諫曰比年勞役繁多百姓疲敝伏願留神稍加折損帝意甚不平後嘗目衡謂侍臣曰張衡自謂由其計畫令我有天下也時齊王暕失愛於上帝密令人求暕罪失有人譖暕違制將伊闕令皇甫詡從之汾陽宮又録前幸涿郡及祠嶽時父老謁見者衣冠多不整帝譴衡以憲司皆不能舉正出為榆林太守明年帝復幸汾陽宮衡督役築樓煩城因而謁帝帝惡衡不損瘦以為不念咎因謂衡曰公甚肥澤宜且還郡衡復之榆林俄而勑衡督役江都宮有人詣衡訟宮監者衡不為理還以訟書付監其人大為監所困禮部尚書楊玄感使至江都其人詣玄感稱寃玄感固以衡為不可及與衡相見未有所言又先謂玄感曰薛道衡真為枉死玄感具上其事江都丞王世充又奏衡頻減頓具帝於是發怒鎖衡詣江都市將斬之久而乃釋除名為民放還田里帝每令親人覘衡所為八年帝自遼東還都衡妾言衡怨望謗訕朝政竟賜盡于家臨死大言曰我為人作何物事而望久活監刑者塞耳促令殺之義寧中以死非其罪贈大將軍南陽郡公諡曰忠有子希玄楊汪楊汪字元度本弘農華陰人也曾祖順徙居河東父琛儀同三司及汪貴追贈平鄉縣公汪少凶疏好與人羣鬬拳所毆擊無不顛踣長更折節勤學專精左氏傳通三禮解褐周冀王侍讀王甚重之每曰楊侍讀德業優深孤之穆生也其後問禮於沈重受漢書於劉臻二人推許之曰吾弗如也由是知名纍遷夏官府都上士及高祖居相引知兵事遷掌朝下大夫高祖受禪賜爵平鄉縣伯邑二百戶歷尚書司勳兵部二曹侍郎秦州總管長史名為明幹遷尚書左丞坐事免後歷荊洛二州長史每聽政之暇必延生徒講授時人稱之數年高祖謂諫議大夫王達曰卿為我覔一好左丞達遂私於汪曰我當薦君為左丞若事果當以良田相報也汪以達所言奏之達竟以獲罪卒拜汪為尚書左丞汪明習法令果於剖斷當時號為稱職煬帝即位守大理卿汪視事二日帝將親省囚徒其時繫囚二百餘人汪通宵究審詰朝而奏曲盡事情一無遺誤帝甚嘉之歲餘拜國子祭酒帝令百僚就學與汪講論天下通儒碩學多萃焉論難鋒起皆不能屈帝令御史書其問答奏之省而大悅賜良馬一匹大業中為銀青光祿大夫及楊玄感反河南贊治裴弘策出師禦之戰不利弘策出還遇汪而屏人交語既而留守樊子蓋斬弘策以狀奏汪帝疑之出為梁郡通守後李密已逼東都其徒頻寇梁郡汪勒兵拒之頻挫其鋭煬帝崩王世充推越王侗為主徵拜吏部尚書頗見親委及世充僭號汪復用事世充平以凶黨誅死史臣曰盧愷諫說可稱令狐熙所居而治薛胄執憲平允宇文聲望攸歸張衡以鯁正立名楊汪以學業自許然皆有善始鮮克令終九仞之基俱傾於一匱惜哉夫忠為令德施非其人尚或不可況託足邪徑而又不得其人者歟語曰無為權首將受其咎又曰無始禍無召亂張衡既召亂源實為權首動不以順其能不及於此乎

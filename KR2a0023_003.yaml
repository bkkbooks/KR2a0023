body:
  text: 隋書卷三帝紀第三煬帝上煬皇帝諱廣一名英小字阿高祖第二子也母曰文獻獨孤皇后上美姿儀少敏慧高祖及后於諸子中特所鍾愛在周以高祖勳封雁門郡公開皇元年立為晉王拜柱國並州總管時年十三尋授武衛大將軍進位上柱國河北道行臺尚書令大將軍如故高祖令項城公韶安道公李徹輔導之上好學善屬文沉深嚴重朝野屬望高祖密令善相者來和遍視諸子和曰晉王眉上雙骨隆起貴不可言既而高祖幸上所居第見樂器絃多斷絶又有塵埃若不用者以為不好聲妓善之上尤自矯飾當時稱為仁孝嘗觀獵遇雨左右進油衣上曰士卒皆霑濕我獨衣此乎乃令持去六年轉淮南道行臺尚書令其年徵拜雍州牧內史令八年冬大舉伐陳以上為行軍元帥及陳平執陳湘州刺史施文慶散騎常侍沈客卿市令陽慧朗刑法監徐析尚書都令史暨慧以其邪佞有害於民斬之右闕下以謝三吳於是封府庫資財無所取天下稱賢進位太尉賜輅車乘馬袞冕之服玄圭白璧各一復拜並州總管俄而江南高智慧等相聚作亂徙上為揚州總管鎮江都每歲一朝高祖之祠太山也領武候大將軍明年歸藩後數載突厥寇邊復為行軍元帥出靈武無虜而還及太子勇廢立上為皇太子是月當受册高祖曰吾以大興公成帝業令上出舍大興縣其夜烈風大雪地震山崩民舍多壞壓死者百餘口仁壽初奉詔巡撫東南是後高祖每避暑仁壽宮令上監國四年七月高祖崩上即皇帝位於仁壽宮八月奉梓宮還京師並州總管漢王諒舉兵反詔尚書左僕射楊素討平之九月乙巳以備身將軍崔彭為左領軍大將軍十一月乙未幸洛陽丙申發丁男數十萬掘塹自龍門東接長平汲郡抵臨清關度河至浚儀襄城達於上洛以置關防癸丑詔曰乾道變化陰陽所以消息沿創不同生靈所以順敘若使天意不變施化何以成四時人事不易為政何以釐萬姓易不云乎通其變使民不倦變則通通則久有德則可久有功則可大朕又聞之安安而能遷民用丕變是故姬邑兩周如武王之意殷人五徙成湯后之業若不因人順天功業見乎變愛人治國者可不謂歟然洛邑自古之都王畿之內天地之所合陰陽之所和控以三河固以四塞水陸通貢賦等故漢祖曰吾行天下多矣唯見洛陽自古皇王何嘗不留意所不都者蓋有由焉或以九州未一或以困其府庫作洛之制所以未暇也我有隋之始便欲創茲懷洛日復一日越暨于今念茲在茲興言感哽朕肅膺寶曆纂臨萬邦遵而不失心奉先志今者漢王諒悖逆毒被山東遂使州縣或淪非所此由關河懸遠兵不赴急加以並州移戶復在河南周遷殷人意在於此況復南服遐遠東夏殷大因機順動今也其時羣司百辟僉諧厥議但成周墟塉弗堪葺宇今可於伊洛營建東京便即設官分職以為民極也夫宮室之制本以便生上棟下宇足避風露高臺廣厦豈曰適形故傳云儉德之共侈惡之大宣尼有云與其不遜也寧儉豈謂瑤臺瓊室方為宮殿者乎土階采椽而非帝王者乎是知非天下以奉一人乃一人以主天下也民惟國本本固邦寧百姓足孰與不足今所營構務從節儉無令雕牆峻宇復起於當今欲使卑宮菲食將貽於後世有司明為條格稱朕意焉十二月乙丑以右武衛將軍來護兒為右驍衛大將軍戊辰以柱國李景為右武衛大將軍以右衛率周羅為右武候大將軍大業元年春正月壬辰朔大赦改元立妃蕭氏為皇后改豫州為溱州洛州為豫州廢諸州總管府丙申立晉王昭為皇太子丁酉以上柱國宇文述為左衛大將軍上柱國郭衍為左武衛大將軍延壽公于仲文為右衛大將軍己亥以豫章王暕為豫州牧戊申發八使巡省風俗下詔曰昔者哲王之治天下也其在愛民乎既富而教家給人足故能風淳俗厚遠至邇安治定功成率由斯道朕嗣膺寶曆撫育黎獻夙夜戰兢若臨川谷雖則聿遵先緒弗敢失墜永言政術多有缺然況以四海之遠兆民之衆未獲親臨問其疾苦每慮幽仄莫舉寃屈不申一物失所乃傷和氣萬方有罪責在朕躬所以寤寐增歎而夕惕載懷者也今既布政惟始宜存寬大可分遣使人巡省方俗宣揚風化薦拔淹滯申達幽枉孝悌力田給以優復魚衆寡孤獨不能自存者量加振濟義夫節婦旌表門閭高年之老加其版授並依別條賜以粟帛篤疾之徒給侍丁者雖有侍養之名曾無賙贍之實明加檢校使得存養若有名行顯著操履修潔及學業才能一藝可取咸宜訪採將身入朝所在州縣以禮發遣其有蠹政害人不便於時者使還之日具録奏聞己酉以吳州總管宇文為刑部尚書二月己卯以尚書左僕射楊素為尚書令三月丁未詔尚書令楊素納言楊達將作大匠宇文愷營建東京徙豫州郭下居人以實之戊申詔曰聽採輿頌謀及庶民故能審政刑之得失是知昧旦思治欲使幽枉必達彝倫有章而牧宰任稱朝委苟為徼幸以求考課虛立殿最不存治實綱紀於是弗理寃屈所以莫申關河重阻無由自達朕故建立東京躬親存問今將巡歷淮海觀省風俗眷求讜言徒繁詞翰而鄉校之內闕爾無聞恇然夕惕用忘興寢其民下有知州縣官人政治苛刻侵害百姓背公徇私不便於民者宜聽詣朝堂封奏庶乎四聰以達天下無寃又於皂澗營顯仁宮採海內奇禽異獸草木之類以實園苑徙天下富商大賈數萬家於東京辛亥發河南諸郡男女百餘萬開通濟渠自西苑引穀洛水達于河自板渚引河通于淮庚申遣黃門侍郎王弘上儀同於士澄往江南採木造龍舟鳳艒黃龍赤艦樓船等數萬艘夏四月癸亥大將軍劉方擊林邑破之五月庚戌民部尚書義豐侯韋沖卒六月甲子熒惑入太微秋七月丁酉制戰亡之家給復十年丙午滕王綸衛王集並奪爵徙邊閏七月甲子以尚書令楊素為太子太師安德王雄為太子太傅河間王弘為太子太保丙子詔曰君民建國教學為先移風易俗必自茲始而言絶義乖多歷年代進德修業其道寖微漢採坑焚之餘不絶如線晉承板蕩之運掃地將盡自時厥後軍國多虞雖復黌宇時建示同愛禮函丈或陳殆為虛器遂使紆青拖紫非以學優製錦操刀類多牆面上陵下替綱維靡立雅缺道消實由於此朕纂承洪緒思弘大訓將欲尊師重道用闡厥繇講信修睦敦奬名教方今宇宙平一文軌攸同十步之內必有芳草四海之中豈無奇秀諸在家及見入學者若有篤志好古耽悅典墳學行優敏堪膺時務所在採訪具以名聞即當隨其器能擢以不次若研精經術未願進仕者可依其藝業深淺門蔭高卑雖未升朝並量準給祿庶夫恂恂善誘不日成器濟濟盈朝何遠之有其國子等學亦宜申明舊制教習生徒具為課試之法以盡砥礪之道八月壬寅上御龍舟幸江都以左武衛大將軍郭衍為前軍右武衛大將軍李景為後軍文武官五品已上給樓船九品已上給黃蔑舳艫相接二百餘里冬十月己丑赦江淮已南揚州給復五年舊總管內給復三年十一月己未以大將軍崔仲方為禮部尚書二年春正月辛酉東京成賜監督者各有差以大理卿梁毗為刑部尚書丁卯遣十使併省州縣二月丙戌詔尚書令楊素吏部尚書牛弘大將軍宇文愷內史侍郎虞世基禮部侍郎許善心制定輿服始備輦路及五時副車上常服皮辨十有二琪文官辨服佩玉五品已上給犢車通幰三公親王加油絡武官平巾幘袴褶三品已上給匏槊下至胥吏服色皆有差非庶人不得戎服戊戌置都尉官三月庚午車駕發江都先是太府少卿何稠太府丞雲定興盛修儀仗於是課州縣送羽毛百姓求捕之網羅被水陸禽獸有堪氅毦之用者殆無遺類至是而成夏四月庚戌上自伊闕陳法駕備千乘萬騎入於東京辛亥上御端門大赦免天下今年租稅癸丑以冀州刺史楊文思為民部尚書五月甲寅金紫光祿大夫兵部尚書李通坐事免乙卯詔曰旌表先哲式存饗祀所以優禮賢能顯彰遺愛朕永鑒前修尚想名德何嘗不興歎九原屬懷千載其自古已來賢人君子有能樹聲立德佐世匡時博利殊功有益於人者並宜營立祠宇以時致祭墳壟之處不得侵踐有司量為條式稱朕意焉六月壬子以尚書令太子太師楊素為司徒進封豫章王暕為齊王秋七月癸丑以衛尉卿衛玄為工部尚書庚申制百官不得計考增級必有德行功能灼然顯著者擢之壬戌擢藩邸舊臣鮮于羅等二十七人官爵有差甲戌皇太子昭薨乙亥上柱國司徒楚國公楊素薨八月辛卯封皇孫倓為燕王侗為越王侑為代王九月乙丑立秦孝王俊子浩為秦王冬十月戊子以靈州刺史段文振為兵部尚書十二月庚寅詔曰前代帝王因時創業君民建國禮尊南面而歷運推移年世永久丘壟殘毀樵牧相趨塋兆堙蕪封樹莫辨興言淪滅有愴于懷自古已來帝王陵墓可給隨近十戶蠲其雜役以供守視三年春正月癸亥勑並州逆黨已流配而逃亡者所獲之處即宜斬決丙子長星竟天出於東壁二旬而止是月武陽郡上言河水清二月己丑彗星見於奎掃文昌歷大陵五車北河入太微掃帝坐前後百餘日而止三月辛亥車駕還京師壬子以大將軍姚辨為左屯衛將軍癸丑遣羽騎尉朱寬使於流求國乙卯河間王弘薨夏四月庚辰詔曰古者帝王觀風問俗皆所以憂勤兆庶安集遐荒自蕃夷內附未遑親撫山東經亂須加存恤今欲安輯河北巡省趙魏所司依式甲申頒律令大赦天下關內給復三年壬辰改州為郡改度量權衡並依古式改上柱國已下官為大夫甲午詔曰天下之重非獨治所安帝王之功豈一士之略自古明君哲后立政經邦何嘗不選賢與能收採幽滯周稱多士漢號得人常想前風載懷欽佇朕負扆夙興冕旒待旦引領巖谷置以周行冀與羣才共康庶績而彙茅寂寞投竿罕至豈美璞韜采未值良工將介石在懷確乎難拔永鑒前哲憮然興歎凡厥在位譬諸股肱若濟巨川義同舟楫豈得保茲寵祿晦爾所知優遊卒歲甚非謂也祁大夫之舉善良史以為至公臧文仲之蔽賢尼父譏其竊位求諸往古非無褒貶宜思進善用匡寡薄夫孝悌有聞人倫之本德行敦厚立身之基或節義可稱或操履清潔所以激貪厲俗有益風化強毅正直執憲不撓學業優敏文才美秀並為廊廟之用實乃瑚璉之資才堪將略則拔之以禦侮膂力驍壯則任之以爪牙爰及一藝可取亦宜採録衆善畢舉與時無棄以此求治庶幾非遠文武有職事者五品已上宜依令十科舉人有一於此不必求備朕當待以不次隨才升擢其見任九品已上官者不在舉送之限丙申車駕北巡狩丁酉以刑部尚書宇文為禮部尚書戊戌勑百司不得踐暴禾稼其有須開為路者有司計地所收即以近倉酬賜務從優厚己亥次赤岸澤以太牢祭故太師李穆墓五月丁巳突厥啓民可汗遣子拓特勤來朝戊午發河北十餘郡丁男鑿太行山達于並州以通馳道丙寅啓民可汗遣其兄子毗黎伽特勤來朝辛未啓民可汗遣使請自入塞奉迎輿駕上不許癸酉有星孛于文昌上將星皆動搖六月辛巳獵於連谷丁亥詔曰聿追孝饗德莫至焉崇建寢廟禮之大者然則質文異代損益殊時學滅坑焚經典散逸憲章湮墜廟堂制度師説不同所以世數多少莫能是正連室異宮亦無準定朕獲奉祖宗欽承景業永惟嚴配思隆大典於是詢謀在位博訪儒術咸以為高祖文皇帝受天明命奄有區夏拯羣飛於四海革凋敝於百王恤獄緩刑生靈皆遂其性輕徭薄賦比屋各安其業恢夷宇宙混一車書東漸西被無思不服南征北怨俱荷來蘇駕毳乘風歷代所弗至辮髮左衽聲教所罕及莫不厥角關塞頓顙闕庭譯靡絶時書無虛月韜戈偃武天下晏如嘉瑞休徵表𩹉禔福猗歟偉歟無得而名者也朕又聞之德厚者流光治辨者禮縟是以周之文武漢之高光其典章特立諡號斯重豈非緣情稱述即崇顯之義乎高祖文皇帝宜別建廟宇以彰巍巍之德仍遵月祭用表蒸蒸之懷有司以時創造務合典制又名位既殊禮亦異等天子七廟事著前經諸侯二昭義有差降故其以多為貴王者之禮今可依用貽厥後昆戊子次榆林郡丁酉啓民可汗來朝己亥吐谷渾高昌並遣使貢方物甲辰上御北樓觀漁于河以宴百僚秋七月辛亥啓民可汗上表請變服襲冠帶詔啓民贊拜不名位在諸侯王上甲寅上於郡城東御大帳其下備儀衛建旌旗宴啓民及其部落三千五百人奏百戲之樂賜啓民及其部落各有差丙子殺光祿大夫賀若弼禮部尚書宇文太常卿高熲尚書左僕射蘇威坐事免發丁男百餘萬築長城西距榆林東至紫河一旬而罷死者十五六八月壬午車駕發榆林乙酉啓民飾廬清道以候乘輿帝幸其帳啓民奉觴上壽宴賜極厚上謂高麗使者曰歸語爾王當早來朝見不然者吾與啓民巡彼土矣皇后亦幸義城公主帳己丑啓民可汗歸蕃癸巳入樓煩關壬寅次太原詔營晉陽宮九月己未次濟源幸御史大夫張衡宅宴享極歡己巳至于東都壬申以齊王暕為河南尹開府儀同三司癸酉以民部尚書楊文思為納言四年春正月乙巳詔發河北諸郡男女百餘萬開永濟渠引沁水南達于河北通涿郡庚戌百僚大射於允武殿丁卯賜城內居民米各十石壬申以太府卿元壽為內史令鴻臚卿楊玄感為禮部尚書癸酉以工部尚書衛玄為右候衛大將軍大理卿長孫熾為民部尚書二月己卯遣司朝謁者崔毅使突厥處羅致汗血馬三月辛酉以將作大匠宇文愷為工部尚書壬戌百濟倭赤土迦羅舍國並遣使貢方物乙丑車駕幸五原因出塞巡長城丙寅遣屯田主事常駿使赤土致羅剎夏四月丙午以離石之汾源臨泉雁門之秀容為樓煩郡起汾陽宮癸丑以河內太守張定和為左屯衛大將軍乙卯詔曰突厥意利珍豆啓民可汗率領部落保附關塞遵奉朝化思改戎俗頻入謁覲屢有陳請以氈牆毳幕事窮荒陋上棟下宇願同比屋誠心懇切朕之所重宜於萬壽戍置城造屋其帷帳牀褥已上隨事量給務從優厚稱朕意焉五月壬申蜀郡獲三足烏張掖獲玄狐各一秋七月辛巳發丁男二十餘萬築長城自榆谷而東乙未左翊衛大將軍宇文述破吐谷渾於曼頭赤水八月辛酉親祠嶽河北道郡守畢集大赦天下車駕所經郡縣免一年租調九月辛未徵天下鷹師悉集東京至者萬餘人戊寅彗星出於五車掃文昌至房而滅辛巳詔免長城役者一年租賦冬十月丙午詔曰先師尼父聖德在躬誕發天縱之姿憲章文武之道命世膺期蘊茲素王而頽山之歎忽踰於千祀盛德之美不存於百代永惟懿範宜有優崇可立孔子後為紹聖侯有司求其苗裔録以申上辛亥詔曰昔周王下車首封唐虞之胤漢帝承曆亦命殷周之後皆所以褒立先代憲章在昔朕嗣膺景業傍求雅訓有一弘益欽若令典以為周兼夏殷文質大備漢有天下車書混一魏晉沿襲風流未遠並宜立後以存繼絶之義有司可求其胄緒列聞乙卯頒新式於天下五年春正月丙子改東京為東都癸未詔天下均田戊子上自東都還京師己丑制民間鐵叉搭鈎刃之類皆禁絶之太守每歲密上屬官景迹二月戊戌次于閿鄉詔祭古帝王陵及開皇功臣墓庚子制魏周官不得為蔭辛丑赤土國遣使貢方物戊申車駕至京師丙辰宴耆舊四百人於武德殿頒賜各有差己未上御崇德殿之西院愀然不怡顧謂左右曰此先帝之所居實用增感情所未安宜於此院之西別營一殿壬戌制父母聽隨子之官三月己巳車駕西巡河右庚午有司言武功男子史永遵與從父昆弟同居上嘉之賜物一百段米二百石表其門閭乙亥幸扶風舊宅夏四月己亥大獵於隴西壬寅高昌吐谷渾伊吾並遣使來朝乙巳次狄道黨項羌來貢方物癸亥出臨津關渡黃河至西平陳兵講武五月乙亥上大獵於拔延山長圍周亘二千里庚辰入長寧谷壬午度星嶺甲申宴羣臣於金山之上丙戌梁浩亹御馬度而橋壞斬朝散大夫黃亘及督役者九人吐谷渾王率衆保覆袁川帝分命內史元壽南屯金山兵部尚書段文振北屯雪山太僕卿楊義臣東屯琵琶峽將軍張壽西屯泥嶺四面圍之渾主伏允以數十騎遁出遣其名王詐稱伏允保車我真山壬辰詔右屯衛大將軍張定和往捕之定和挺身挑戰為賊所殺亞將柳武建擊破之斬首數百級甲午其仙頭王被圍窮蹙率男女十餘萬口來降六月丁酉遣左光祿大夫梁默右翊衛將軍李瓊等追渾主皆遇賊死之癸卯經大斗拔谷山路隘險魚貫而出風霰晦冥與從官相失士卒凍死者太半丙午次張掖辛亥詔諸郡學業該通才藝優洽膂力驍壯超絶等倫在官勤奮堪理政事立性正直不避強禦四科舉人壬子高昌王麴伯雅來朝伊吾吐屯設等獻西域數千里之地上大悅癸丑置西海河源鄯善且末等四郡丙辰上御觀風行殿盛陳文物奏九部樂設魚龍曼延宴高昌王吐屯設於殿上以寵異之其蠻夷陪列者三十餘國戊午大赦天下開皇已來流配悉放還鄉晉陽逆黨不在此例隴右諸郡給復一年行經之所給復二年秋七月丁卯置馬牧於青海渚中以求龍種無效而止九月癸未車駕入長安冬十月癸亥詔曰優德尚齒載之典訓尊事乞言義彰膠序鬻熊為師取非筋力方叔元老克壯其猷朕永言稽古用求至治是以厖眉黃髮更令收敘務簡秩優無虧藥膳庶等臥治佇其弘益今歲耆老赴集者可於近郡處置年七十以上疾患沉滯不堪居職即給賜帛送還本郡其官至七品已上者量給廩以終厥身十一月丙子車駕幸東都六年春正月癸亥朔旦有盜數十人皆素冠練衣焚香持華自稱彌勒佛入自建國門監門者皆稽首既而奪衛士仗將為亂齊王暕遇而斬之於是都下大索與相連坐者千餘家丁丑角抵大戲於端門街天下奇伎異藝畢集終月而罷帝數微服往觀之己丑倭國遣使貢方物二月乙巳武賁郎將陳稜朝請大夫張鎮州擊流求破之獻俘萬七千口頒賜百官乙卯詔曰夫帝圖草創王業艱難咸仗股肱協同心德用能拯厥頽運克膺大寶然後疇庸茂賞開國承家誓以山河傳之不朽近代喪亂四海未一茅土妄假名實相乖歷茲永久莫能懲革皇運之初百度伊始猶循舊貫未暇改作今天下交泰文軌攸同宜率遵先典永垂大訓自今已後唯有功勳乃得賜封仍令子孫承襲丙辰改封安德王雄為觀王河間王子慶為郇王庚申徵魏齊周陳樂人悉配太常三月癸亥幸江都宮甲子以鴻臚卿史祥為左驍衛大將軍夏四月丁未宴江淮已南父老頒賜各有差六月辛卯室韋赤土並遣使貢方物壬辰雁門賊帥尉文通聚衆三千保於莫壁谷遣鷹揚楊伯泉擊破之甲寅制江都太守秩同京尹冬十月壬申刑部尚書梁毗卒壬子民部尚書銀青光祿大夫長孫熾卒十二月己未左光祿大夫吏部尚書牛弘卒辛酉朱崖人王萬昌舉兵作亂遣隴西太守韓洪討平之七年春正月壬寅左武衛大將軍光祿大夫真定侯郭衍卒二月己未上升釣臺臨揚子津大宴百僚頒賜各有差庚申百濟遣使朝貢乙亥上自江都御龍舟入通濟渠遂幸于涿郡壬午詔曰武有七德先之以安民政有六本興之以教義高麗高元虧失藩禮將欲問罪遼左恢宣勝略雖懷伐國仍事省方今往涿郡巡撫民俗其河北諸郡及山西山東年九十已上者版授太守八十者授縣令三月丁亥右光祿大夫左屯衛大將軍姚辨卒夏四月庚午至涿郡之臨朔宮五月戊子以武威太守樊子蓋為民部尚書秋大水山東河南漂沒三十餘郡民相賣為奴婢冬十月乙卯底柱山崩偃河逆流數十里戊午以東平太守吐萬緒為左屯衛大將軍十二月己未西面突厥處羅多利可汗來朝上大悅接以殊禮于時遼東戰士及餽運者填咽於道晝夜不絶苦役者始為羣盜甲子勑都尉鷹揚與郡縣相知追捕隨獲斬決之

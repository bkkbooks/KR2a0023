body:
  text: 隋書卷七十三列傳第三十八循吏古之善牧人者養之以仁使之以義教之以禮隨其所便而處之因其所欲而與之從其所好而勸之如父母之愛子如兄之愛弟聞其飢寒為之哀見其勞苦為之悲故人敬而悅之愛而親之若子産之理鄭國子賤之居單父賈琮之牧冀州文翁之為蜀郡皆可以恤其災患導以忠厚因而利之惠而不費其暉映千祀聲芳不絶夫何為哉用此道也然則五帝三王不易人而化皆在所由化之而已故有無能之吏無不可化之人高祖膺運撫圖除凶靜亂日旰忘食思邁前王然不敦詩書不尚道德專任法令嚴察臨下吏存苟免罕聞寬惠乘時射利者多以一切求名暨煬帝嗣興志存遠略車轍馬迹將遍天下綱紀弛紊四維不張其或善於侵漁強於剝割絶億兆之命遂一人之求者謂之奉公即時升擢其或顧名節存綱紀抑奪攘之心以從百姓之欲者則謂之附下旋及誅夷夫吏之侵漁得其所欲雖重其禁猶或為之吏之清平失其所欲雖崇其賞猶或不為況於上賞其姦下得其欲求其廉潔不亦難乎彥光等立嚴察之朝屬昏狂之主執心平允終行仁恕餘風遺愛沒而不忘寬惠之音足以傳於來葉故列其行事以繫循吏之篇爾梁彥光梁彥光字修芝安定烏氏人也祖茂魏秦華二州刺史父顯周荊州刺史彥光少岐嶷有至性其父每謂所親曰此兒有風骨當興吾宗七歲時父遇篤疾醫云餌五石可愈時求紫石英不得彥光憂瘁不知所為忽於園中見一物彥光所不識怪而持歸即紫石英也親屬咸異之以為至孝所感魏大統末入太學略涉經史有規檢造次必以禮解褐祕書郎時年十七周受禪遷舍人上士武帝時纍遷小馭下大夫母憂去職毀瘁過禮未幾起令視事帝見其毀甚嗟歎久之頻蒙慰諭後轉小內史下大夫建德中為御正下大夫從帝平齊以功授開府陽城縣公邑千戶宣帝即位拜華州刺史進封華陽郡公增邑五百戶以陽城公轉封一子尋進位上大將軍遷御正上大夫俄拜柱國青州刺史屬帝崩不之官及高祖受禪以為岐州刺史兼領岐州宮監增邑五百戶通前二千戶甚有惠政嘉禾連理出於州境開皇二年上幸岐州悅其能乃下詔曰賞以勸善義兼訓物彥光操履平直識用凝遠布政岐下威惠在人廉慎之譽聞於天下三載之後自當遷陟恐其匱乏且宜旌善可賜粟五百斛物三百段御傘一枚庶使有感朕心日增其美四海之內凡曰官人慕高山而仰止聞清風而自勵未幾又賜錢五萬後數歲轉相州刺史彥光前在岐州其俗頗質以靜鎮之合境大化奏課連最為天下第一及居相部如岐州法鄴都雜俗人多變詐為之作歌稱其不能理化上聞而譴之竟坐免歲餘拜趙州刺史彥光言於上曰臣前待罪相州百姓呼為戴帽餳臣自分廢黜無復衣冠之望不謂天恩復垂收採請復為相州改絃易調庶有以變其風俗上答隆恩上從之復為相州刺史豪猾者聞彥光自請而來莫不嗤笑彥光下車發摘姦隱有若神明於是狡猾之徒莫不潛竄合境大駭初齊亡後衣冠士人多遷關內唯技巧商販及樂戶之家移實州郭由是人情險詖妄起風謠訴訟官人萬端千變彥光欲革其弊乃用秩俸之物招致山東大儒每鄉立學非聖哲之書不得教授常以季月召集之親臨策試有勤學異等聰令有聞者升堂設饌其餘並坐廊下有好諍訟惰業無成者坐之庭中設以草具及大成當舉行賓貢之禮又於郊外祖道並以財物資之於是人皆剋勵風俗大改有滏陽人焦通性酗酒事親禮闕為從弟所訟彥光弗之罪將至州學令觀於孔子廟于時廟中有韓伯瑜母杖不痛哀母力弱對母悲泣之像通遂感悟既悲且愧若無自容彥光訓諭而遣之後改過勵行卒為善士以德化人皆此類也吏人感悅略無諍訟後數歲卒官時年六十贈冀定青瀛四州刺史諡曰襄子文謙嗣文謙弘雅有父風以上柱國嫡子例授儀同開皇十五年拜上州刺史煬帝即位轉饒州刺史歲餘為鄱陽太守稱為天下之最徵拜戶部侍郎遼東之役領武賁郎將尋以本官兼檢校太府衛尉二少卿明年又領武賁郎將為盧龍道軍副會楊玄感作亂其弟武賁郎將玄縱先隸文謙玄感反問未至而玄縱逃走文謙不之覺坐是配防桂林而卒時年五十六少子文讓初封陽城縣公後為鷹揚郎將從衛玄擊楊玄感於東都力戰而死贈通議大夫樊叔略樊叔略陳留人也父歡仕魏為南兗州刺史阿陽侯屬高氏專權將謀興復之計為高氏所誅叔略時在髫遂被腐刑給使殿省身長九尺志氣不凡頗為高氏所忌內不自安遂奔關西周太祖見而器之引置左右尋授都督襲爵為侯大冢宰宇文護執政引為中尉叔略多計數曉習時事護漸委信之兼督內外纍遷驃騎大將軍開府儀同三司護誅後齊王憲引為園苑監時憲素有吞關東之志叔略因事數進兵謀憲甚奇之建德五年從武帝伐齊叔略部率精鋭每戰身先士卒以功加上開府進封清鄉縣公邑千四百戶拜汴州刺史號為明決宣帝時於洛陽營建東京以叔略有巧思拜營構監宮室制度皆叔略所定功未就而帝崩尉迥之亂高祖令叔略鎮大梁迥將宇文威來寇叔略擊走之以功拜大將軍復為汴州刺史高祖受禪加位上大將軍進爵安定郡公在州數年甚有聲譽鄴都俗薄號曰難化朝廷以叔略所在著稱遷相州刺史政為當時第一上降璽書褒美之賜物三百段粟五百石班示天下百姓為之語曰智無窮清鄉公上下正樊安定徵拜司農卿吏人莫不流涕相與立碑頌其德政自為司農凡種植叔略別為條制皆出人意表朝廷有疑滯公卿所未能決者叔略輒為評理雖無學術有所依據然師心獨見暗與理合甚為上所親委高熲楊素亦禮遇之叔略雖為司農往往參督九卿事性頗豪侈每食必方丈備水陸十四年從祠太山行至洛陽上令録囚徒具狀將奏晨起至獄門於馬上暴卒時年五十九上悼惜久之贈亳州刺史諡曰襄趙軌趙軌河南洛陽人也父肅魏廷尉卿軌少好學有行檢周蔡王引為記室以清苦聞遷衛州治中高祖受禪轉齊州別駕有能名其東鄰有桑椹落其家軌遣人悉拾還其主誡其諸子曰吾非以此求名意者非機杼之物不願侵人汝等宜以為誡在州四年考績連最持節使者郃陽公梁子恭狀上高祖嘉之賜物三百段米三百石徵軌入朝父老相送者各揮涕曰別駕在官水火不與百姓交是以不敢以壺酒相送公清若水請酌一杯水奉餞軌受而飲之既至京師詔與奇章公牛弘撰定律令格式時衛王爽為原州總管上見爽年少以軌所在有聲授原州總管司馬在道夜行其左右馬逸入田中暴人禾軌駐馬待明訪禾主酬直而去原州人吏聞之莫不改操後數年遷硤州刺史撫緝萌夷甚有恩惠尋轉壽州總管長史芍陂舊有五門堰蕪穢不修軌於是勸課人吏更開三十六門灌田五千餘頃人賴其利秩滿歸鄉里卒于家時年六十二子弘安弘智並知名房恭懿房恭懿字慎言河南洛陽人也父謨齊吏部尚書恭懿性沉深有局量達於從政仕齊釋褐開府參軍事歷平恩令濟陰守並有能名會齊亡不得調尉迥之亂恭懿預焉迥敗廢于家開皇初吏部尚書蘇威薦之授新豐令政為三輔之最上聞而嘉之賜物四百段恭懿以所得賜分給窮乏未幾復賜米三百石恭懿又以賑貧人上聞而止之時雍州諸縣令每朔朝謁上見恭懿必呼至榻前訪以理人之術蘇威重薦之超授澤州司馬有異績賜物百段良馬一匹遷德州司馬在職歲餘盧愷復奏恭懿政為天下之最上甚異之復賜百段因謂諸州朝集使曰如房恭懿志存體國愛養我百姓此乃上天宗廟之所祐助豈朕寡薄能致之乎朕即拜為刺史豈止為一州而已當令天下模範之卿等宜師斆也上又曰房恭懿所在之處百姓視之如父母朕若置之而不賞上天宗廟其當責我內外官人宜知我意於是下詔曰德州司馬房恭懿出宰百里毗贊二藩善政能官標映倫伍班條按部實允僉屬委以方嶽聲實俱美可使持節海州諸軍事海州刺史未幾會國子博士何妥奏恭懿尉迥之黨不當仕進威愷二人朋黨曲相薦舉上大怒恭懿竟得罪配防嶺南未幾徵還京師行至洪州遇患卒論者于今冤之公孫景茂公孫景茂字元蔚河間阜城人也容貌魁梧少好學博涉經史在魏察孝廉射策甲科為襄城王長史兼行參軍遷太常博士多所損益時人稱為書庫後歷高唐令大理正俱有能名及齊滅周武帝聞而召見與語器之授濟北太守以母憂去職開皇初詔徵入朝訪以政術拜汝南太守郡廢轉曹州司馬在職數年以老病乞骸骨優詔不許俄遷息州刺史法令清靜德化大行時屬平陳之役征人在路有疾病者景茂撤減俸祿為饘粥湯藥分賑濟之賴全活者以千數上聞而嘉之詔宣告天下十五年上幸洛陽景茂謁見時年七十七上命升殿坐問其年幾景茂以實對上哀其老嗟嘆久之景茂再拜曰呂望八十而遇文王臣踰七十而逢陛下上甚悅賜物三百段詔曰景茂修身潔己耆宿不虧作牧化人聲績顯著年終考校獨為稱首宜升戎秩兼進藩條可上儀同三司伊州刺史明年以疾徵吏人號泣於道及疾愈復乞骸骨又不許轉道州刺史悉以秩俸買牛犢雞豬散惠孤弱不自存者好單騎巡人家至戶入閲視百姓産業有修理者於都會時乃褒揚稱述如有過惡隨即訓導而不彰也由是人行義讓有無均通男子相助耕耘婦人相從紡績大村或數百戶皆如一家之務其後請致事上優詔聽之仁壽中上明公楊紀出使河北見景茂神力不衰還以狀奏於是就拜淄州刺史賜以馬輿便道之官前後歷職皆有德政論者稱為良牧大業初卒官年八十七諡曰康身死之日諸州人吏赴喪者數千人或不及葬皆望墳慟哭野祭而去辛公義辛公義隴西狄道人也祖徽魏徐州刺史父季慶青州刺史公義早孤為母氏所養親授書傳周天和中選良家子任太學生以勤苦著稱武帝時召入露門學令受道義每月集御前令與大儒講論數被嗟異時輩慕之建德初授宣納中士從平齊纍遷掌治上士掃寇將軍高祖作相授內史上士參掌機要開皇元年除主客侍郎攝內史舍人事賜爵安陽縣男邑二百戶每陳使來朝常奉詔接宴轉駕部侍郎使往江陵安輯邊境七年使勾檢諸馬牧所獲十餘萬匹高祖喜曰唯我公義奉國罄心從軍平陳以功除岷州刺史土俗畏病若一人有疾即合家避之父子夫妻不相看養孝義道絶由是病者多死公義患之欲變其俗因分遣官人巡檢部內凡有疾病皆以牀輿來安置廳事暑月疫時病人或至數百廳廊悉滿公義親設一榻獨坐其間終日連夕對之理事所得秩俸盡用市藥為迎醫療之躬勸其飲食於是悉差方召其親戚而諭之曰死生由命不關相著前汝棄之所以死耳今我聚病者坐臥其間若言相染那得不死病兒復差汝等勿復信之諸病家子孫慚謝而去後人有遇病者爭就使君其家無親屬因留養之始相慈愛此風遂革合境之內呼為慈母後遷牟州刺史下車先至獄中因露坐牢側親自驗問十餘日間決斷咸盡方還大廳受領新訟皆不立文案遣當直佐僚一人側坐訊問事若不盡應須禁者公義即宿廳事終不還閣人或諫之曰此事有程使君何自苦也答曰刺史無德可以導人尚令百姓係於囹圄豈有禁人在獄而心自安乎罪人聞之咸自款服後有欲諍訟者其鄉閭父老遽相曉曰此蓋小事何忍勤勞使君訟者多兩讓而止時山東霖雨自陳汝至于滄海皆苦水災境內犬牙獨無所損山出黃銀獲之以獻詔水部郎婁崱就公義禱焉乃聞空中有金石絲竹之響仁壽元年追充揚州道黜陟大使豫章王暕恐其部內官僚犯法未入州境預令屬公義公義答曰奉詔不敢有私及至揚州皆無所縱捨暕銜之及煬帝即位揚州長史王弘入為黃門侍郎因言公義之短竟去官吏人守闕訴冤相繼不絶後數歲帝悟除內史侍郎丁母憂未幾起為司隸大夫檢校右禦衛武賁郎將將征至柳城郡卒時年六十二子融柳儉柳儉字道約河東解人也祖元璋魏司州大中正相華二州刺史父裕周聞喜令儉有局量立行清苦為州里所敬雖至親昵無敢狎侮周代歷宣納上士畿伯大夫及高祖受禪擢拜水部侍郎封率道縣伯未幾出為廣漢太守甚有能名俄而郡廢時高祖初有天下勵精思政妙簡良能出為牧宰以儉仁明著稱擢拜蓬州刺史獄訟者庭遣不為文書約束佐史從容而已獄無繫囚蜀王秀時鎮益州列上其事遷卭州刺史在職十餘年萌夷悅服蜀王秀之得罪也儉坐與交通免職及還鄉里乘敝車羸馬妻子衣食不贍見者咸歎服焉煬帝嗣位徵之于時以功臣任職牧州領郡者並帶戎資唯儉起自良吏帝嘉其績用特授朝散大夫拜弘化太守賜物一百段而遣之儉清節逾勵大業五年入朝郡國畢集帝謂納言蘇威吏部尚書牛弘曰其中清名天下第一者為誰威等以儉對帝又問其次威以涿郡丞郭絢潁川郡丞敬肅等二人對帝賜儉帛二百匹絢肅各一百匹令天下朝集使送至郡邸以旌異焉論者美之及大業末盜賊蜂起數被攻逼儉撫結人夷卒無離叛竟以保全及義兵至長安尊立恭帝儉與留守李粲縞素於州南向慟哭既而歸京師相國賜儉物三百段就拜上大將軍歲餘卒于家時年八十九郭絢郭絢河東安邑人也家素寒微初為尚書令史後以軍功拜儀同歷數州司馬長史皆有能名大業初刑部尚書宇文巡省河北引絢為副煬帝將有事於遼東以涿郡為衝要訪可任者聞絢有幹局拜涿郡丞吏人悅服數載遷為通守兼領留守及山東盜賊起絢逐捕之多所剋獲時諸郡無復完者唯涿郡獨全後將兵擊竇建德於河間戰死人吏哭之數月不息敬肅敬肅字弘儉河東蒲坂人也少以貞介知名釋褐州主簿開皇初為安陵令有能名擢拜秦州司馬轉豳州長史仁壽中為衛州司馬俱有異績煬帝嗣位遷潁川郡丞大業五年朝東都帝令司隸大夫薛道衡為天下羣官之狀道衡狀稱肅曰心如鐵石老而彌篤時左翊衛大將軍宇文述當塗用事其邑在潁川每有書屬肅肅未嘗開封輒令使者持去述賓客有放縱者以法繩之無所寬貸由是述銜之八年朝於涿郡帝以其年老有治名將擢為太守者數矣輒為述所毀不行大業末乞骸骨優詔許之去官之日家無餘財歲餘終于家時年八十劉曠劉曠不知何許人也性謹厚每以誠恕應物開皇初為平鄉令單騎之官人有諍訟者輒丁寧曉以義理不加繩劾各自引咎而去所得俸祿賑施窮乏百姓感其德化更相篤勵曰有君如此何得為非在職七年風教大洽獄中無繫囚爭訟絶息囹圄盡皆生草庭可張羅及去官吏人無少長號泣於路將送數百里不絶遷為臨潁令清名善政為天下第一尚書左僕射高熲言其狀上召之及引見勞之曰天下縣令固多矣卿能獨異於衆良足美也顧謂侍臣曰若不殊奬何以為勸於是下優詔擢拜莒州刺史王伽王伽河間章武人也開皇末為齊州行參軍初無足稱後被州使送流囚李參等七十餘人詣京師時制流人並枷鎖傳送伽行次滎陽哀其辛苦悉呼而謂之曰卿輩既犯國刑虧損名教身嬰縲紲此其職也今復重勞援卒豈獨不愧於心哉參等辭謝伽曰汝等雖犯憲法枷鎖亦大辛苦吾欲與汝等脫去行至京師總集能不違期不皆拜謝曰必不敢違伽於是悉脫其枷停援卒與期曰某日當至京師如致前却吾當為汝受死舍之而去流人咸悅依期而至一無離叛上聞而驚異之召見與語稱善久之於是悉召流人並令攜負妻子俱入賜宴於殿庭而赦之乃下詔曰凡在有生含靈稟性咸知好惡並識是非若臨以至誠明加勸導則俗必從化人皆遷善往以海內亂離德教廢絶官人無慈愛之心兆庶懷姦詐之意所以獄訟不息澆薄難治朕受命上天安養萬姓思遵聖法以德化人朝夕孜孜意在於此而伽深識朕意誠心宣導參等感悟自赴憲司明是率土之人非為難教良是官人不加曉示致令陷罪無由自新若使官盡王伽之儔人皆李參之輩刑厝不用其何遠哉於是擢伽為雍令政有能名魏德深魏德深本巨鹿人也祖沖仕周為刑部大夫建州刺史因家弘農父毗鬱林令德深初為文帝挽郎後歷馮翊書佐武陽司戶書佐以能遷貴鄉長為政清淨不嚴而治會興遼東之役徵稅百端使人往來責成郡縣于時王綱弛紊吏多贓賄所在徵斂下不堪命唯德深一縣有無相通不竭其力所求皆給百姓不擾稱為大治于時盜賊羣起武陽諸城多被淪陷唯貴鄉獨全郡丞元寶藏受詔逐捕盜賊每戰不利則器械必盡輒徵發於人動以軍法從事如此者數矣其鄰城營造皆聚於廳事吏人遞相督責晝夜喧囂猶不能濟德深各問其所欲任隨便修營官府寂然若無事唯約束長吏所修不須過勝餘縣使百姓勞苦然在下各自竭心常為諸縣之最尋轉館陶長貴鄉吏人聞之相與言及其事皆歔欷流涕語不成聲及將赴任傾城送之號泣之聲道路不絶既至館陶闔境老幼皆如見其父母有猾人員外郎趙君實與郡丞元寶藏深相交結前後令長未有不受其指麾者自德深至縣君實屏處於室未嘗輒敢出門逃竄之徒歸來如市貴鄉父老冒涉艱險詣闕請留德深有詔許之館陶父老復詣郡相訟以貴鄉文書為詐郡不能決會持節使者韋霽杜整等至兩縣詣使訟之乃斷從貴鄉貴鄉吏人歌呼滿道互相稱慶館陶衆庶合境悲哭因而居住者數百家寶藏深害其能會越王侗徵兵於郡寶藏遂令德深率兵千人赴東都俄而寶藏以武陽歸李密德深所領皆武陽人也以本土從賊念其親戚輒出都門東向慟哭而反人或謂之曰李密兵馬近在金墉去此二十餘里汝必欲歸誰能相禁何為自苦如此其人皆垂泣曰我與魏明府同來不忍棄去豈以道路艱難乎其得人心如此後與賊戰沒於陳貴鄉館陶人庶至今懷之時有櫟陽令渤海高世衡蕭令彭城劉高城臯令弘農劉熾俱有恩惠大業之末長史多贓污衡高及熾清節逾厲風教大洽獄無繫囚為吏人所稱史臣曰古語云善為水者引之使平善化人者撫之使靜水平則無損於隄防人靜則不犯於憲章然則易俗移風服教從義不資於明察必藉於循良者也彥光等皆內懷直道至誠待物故得所居而化所去見思至於景茂之遏惡揚善公義之撫視疾病劉曠之化行所部德深之愛結人心雖信臣杜詩鄭渾朱邑不能繼也詩云愷悌君子人之父母豈徒言哉恭懿所在尤異屢簡帝心追既往之一眚遂流亡於道路惜乎柳儉去官妻子不贍趙軌秩滿酌水餞離清矣

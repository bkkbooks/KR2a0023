body:
  text: 隋書卷六十三列傳第二十八樊子蓋樊子蓋字華宗廬江人也祖道則梁越州刺史父儒侯景之亂奔于齊官至仁州刺史子蓋解褐武興王行參軍出為慎縣令東汝北陳二郡太守員外散騎常侍封富陽縣侯邑五百戶周武帝平齊授儀同三司治郢州刺史高祖受禪以儀同領鄉兵後除樅陽太守平陳之役以功加上開府改封上蔡縣伯食邑七百戶賜物三千段粟九千斛拜辰州刺史俄轉嵩州刺史母憂去職未幾起授齊州刺史固讓不許其年轉循州總管許以便宜從事十八年入朝奏嶺南地圖賜以良馬雜物加統四州令還任所遣光祿少卿柳謇之餞於霸上煬帝即位徵還京師轉涼州刺史子蓋言於帝曰臣一居嶺表十載於茲犬馬之情不勝戀戀願趨走闕庭萬死無恨帝賜物三百段慰諭遣之授銀青光祿大夫武威太守以善政聞大業三年入朝帝引之內殿特蒙褒美乃下詔曰設官之道必在用賢安人之術莫如善政龔汲振德化於前張杜垂清風於後共治天下實資良守子蓋幹局通敏操履清潔自剖符西服愛惠為先撫道有方寬猛得所處脂膏不潤其質酌貪泉豈渝其性故能治績克彰課最之首凡厥在位莫匪王臣若能人思奉職各展其效朕將冕旒垂拱何憂不治哉於是進位金紫光祿大夫賜物千段太守如故五年車駕西巡將入吐谷渾子蓋以彼多鄣氣獻青木香以禦霧露及帝還謂之曰人道公清定如此不子蓋謝曰臣安敢言清止是小心不敢納賄耳由此賜之口味百餘斛又下詔曰導德齊禮實惟共治懲惡勸善用明黜陟朕親巡河右觀省人風所歷郡縣訪採治績罕遵法度多蹈刑網而金紫光祿大夫武威太守樊子蓋執操清潔處涅不渝立身雅正臨人以簡威惠兼舉寬猛相資故能畏而愛之不嚴斯治實字人之盛績有國之良臣宜加褒顯以弘奬勵可右光祿大夫太守如故賜縑千匹粟麥二千斛子蓋又自陳曰臣自南裔即適西垂常為外臣未居內職不得陪屬車奉丹陛溘死邊城沒有遺恨惟陛下察之帝曰公侍朕則一人而已委以西方則萬人之敵宜識此心六年帝避暑隴川宮又云欲幸河西子蓋傾望鑾輿願巡郡境帝知之下詔曰卿夙懷恭順深執誠心聞朕西巡欣然望幸丹款之至甚有可嘉宜保此純誠克終其美是歲朝於江都宮帝謂之曰富貴不還故鄉真衣繡夜行耳勑廬江郡設三千人會賜米麥六千石使謁墳墓宴故老當時榮之還除民部尚書時處羅可汗及高昌王款塞復以子蓋檢校武威太守應接二蕃遼東之役徵攝左武衛將軍出長岑道後以宿衛不行進授左光祿大夫尚書如故其年帝還東都以子蓋為涿郡留守九年車駕復幸遼東命子蓋為東都留守屬楊玄感作逆來逼王城子蓋遣河南贊治裴弘策逆擊之返為所敗遂斬弘策以徇國子祭酒楊汪小有不恭子蓋又將斬之汪拜謝頓首流血久乃釋免於是三軍莫不戰栗將吏無敢仰視玄感每盡鋭攻城子蓋徐設備禦至輒摧破故久不能克會來護兒等救至玄感解去子蓋凡所誅殺者數萬人又檢校河南內史車駕至高陽追詣行在所既而引見帝逆勞之曰昔高祖留蕭何於關西光武委寇恂以河內公其人也子蓋謝曰臣任重器小寧可竊譬兩賢但以陛下威靈小盜不足除耳進位光祿大夫封建安侯尚書如故賜縑三千匹女樂五十人子蓋固讓優詔不許帝顧謂子蓋曰朕遣越王留守東都示以皇枝盤石社稷大事終以委公特宜持重戈甲五百人而後出此亦勇夫重閉之義也無賴不軌者便誅鋤之凡可施行無勞形迹今為公別造玉麟符以代銅獸又指越代二王曰今以二孫委公與衛文升耳宜選貞良宿德有方幅者教習之動靜之節宜思其可於是賜以良田甲第十年冬車駕還東都帝謂子蓋曰玄感之反神明故以彰公赤心耳析圭進爵宜有令謨是日下詔進爵為濟公言其功濟天下特為立名無此郡國也賜縑三千匹奴婢二十口後與蘇威宇文述陪宴積翠亭帝親以金杯屬子蓋酒曰良算嘉謀俟公後動即以此杯賜公用為永年之瑞並綺羅百匹十一年從駕汾陽宮至于雁門車駕為突厥所圍頻戰不利帝欲以精騎潰圍而出子蓋諫曰陛下萬乘之主豈宜輕脫一朝狼狽雖悔不追未若守城以挫其鋭四面徵兵可立而待陛下亦何所慮乃欲身自突圍因垂泣願暫停遼東之役以慰衆望聖躬親出慰撫厚為勳格人心自奮不足為憂帝從之其後援兵稍至虜乃引去納言蘇威追論勳格太重宜在斟酌子蓋執奏不宜失信帝曰公欲收物情邪子蓋默然不敢對從駕還東都時絳郡賊敬槃陀柴保昌等阻兵數萬汾晉苦之詔令子蓋進討于時人物殷阜子蓋善惡無所分別汾水之北村塢盡焚之百姓大駭相率為盜其有歸首者無少長悉坑之擁數萬之衆經年不能破賊有詔徵還又將兵擊宜陽賊以疾停卒于京第時年七十有二上悲傷者久之顧謂黃門侍郎裴矩曰子蓋臨終有何語矩對曰子蓋病篤深恨雁門之恥帝聞而歎息令百官就弔賜縑三百匹米五百斛贈開府儀同三司諡曰景會葬者萬餘人武威民吏聞其死莫不嗟痛立碑頌德子蓋無他權略在軍持重未嘗負敗臨民明察下莫敢欺然嚴酷少恩果於殺戮臨終之日見斷頭鬼前後重沓為之厲云史祥史祥字世休朔方人也父寧周少司徒祥少有文武才幹仕周太子車右中士襲爵武遂縣公高祖踐阼拜儀同領交州事進爵陽城郡公祥在州頗有惠政後數年轉驃騎將軍伐陳之役從宜陽公王世積以舟師出九江道先鋒與陳人合戰破之進拔江州上聞而大悅下詔曰朕以陳叔寶世為僭逆挻虐生民故命諸軍救彼塗炭小寇狼狽顧恃江湖之險遂敢泛舟楫擬抗王師公親率所部應機奮擊沉溺俘獲厥功甚茂又聞帥旅進取江州行軍總管襄邑公賀若弼既獲京口新義公韓擒尋剋姑熟驃騎既渡江岸所在橫行晉王兵馬即入建業清蕩吳越旦夕非遠驃騎高才壯志是朕所知善為經略以取大賞使富貴功名永垂竹帛也進位上開府尋拜蘄州總管未幾徵拜左領左右將軍後以行軍總管從晉王廣擊突厥於靈武破之遷右衛將軍仁壽中率兵屯弘化以備胡煬帝時在東宮遺祥書曰將軍總戎塞表胡虜清塵秣馬休兵猶事校獵足使李廣慚勇魏尚愧能冠彼二賢獨在吾子昔余濫舉推轂治兵振皇靈於塞外驅犬羊乎大漠于時同行軍旅契闊戎旃望龍城而衝冠眄狼居而發憤將軍英圖不世猛氣無前但物不遂心僶俯從事每一思此我勞如何將軍宿心素志早同膠漆久而敬之方成魚水近者陪隨鑾駕言旋上京本即述職南蕃宣條下國不悟皇鑒曲發備位少陽戰戰兢兢如臨冰谷至如建節邊境征伐四方褰帷作牧綏撫百姓上稟成規下盡臣節是所願也是所甘心仰慕前修庶得自效謬其入守神器元良萬國身輕負重何以克堪所望故人匡其不逮比監國多暇養疾間宮厭北閣之端居罷南皮之馳射博望之苑既乏名賢飛蓋之園理乖終宴親朋遠矣琴書寂然想望吾賢疹如疾首祥答書曰行人戾止奉所賜況恩紀綢繆形於文墨不悟飛雪增冰之地忽載三陽毳幕韋韝之鄉俄聞九奏精駭思越莫知啓處祥少不學軍旅長遇升平幸以先人緒餘備職宿衛懼駑蹇無致遠之用朽薄非折衝之材豈欲追蹤古人語其優劣曩者王師薄伐天人受脤絶漠揚旌威震海外當此之時猛將如雲謀夫如雨至若祥者列於卒伍預聞指蹤之規得免逗遛之責循涯揣分實為幸甚爰以情喻雷陳事方劉葛信聖人之屈己非庸人之擬議何則川澤之大污潦攸歸松柏之高蔦蘿斯託微心眷眷孟侯所知也仰惟體元良之德煥重離之暉三善克修萬邦以正斯固道高周誦契協商皓豈在管蠡所能窺測伏承監國多暇養德怡神咀嚼六經逍遙百氏追西園之愛客眷南皮之出遊疇昔之恩無忘造次祥自忝式遏載罹寒暑身在邊隅情馳魏闕每至清風夕起朗月孤照想鳴葭之啓路思託乘於後車塞表京華山川悠遠瞻望浮雲伏增潸結太子甚親遇之煬帝即位漢王諒發兵作亂遣其將綦良自滏口徇黎陽塞白馬津余公理自太行下河內帝以祥為行軍總管軍於河陰久不得濟祥謂軍吏曰余公理輕而無謀才用素不足稱又新得志謂其衆可恃恃衆必驕且河北人先不習兵所謂擁市人而戰以吾籌之不足圖也乃令軍中修攻具公理使諜知之果屯兵於河陽內城以備祥祥於是艤船南岸公理聚甲以當之祥乃簡精鋭於下流潛渡公理率衆拒之祥至須水兩軍相對公理未成列祥縱擊大破之東趣黎陽討綦良等良列陳以待兵未接良棄軍而走於是其衆大潰祥縱兵乘之殺萬餘人進位上大將軍賜縑綵七千段女妓十人良馬二十匹轉太僕卿帝嘗賜祥詩曰伯煚朝寄重夏侯親遇深貴耳唯聞古賤目詎知今早摽徑草質久有背淮心掃逆黎山外振旅河之陰功已書王府留情太僕針祥上表辭謝帝降手詔曰昔歲勞公問罪河朔賊爾日塞兩關之路據倉阻河百姓脅從人亦衆矣公竭誠奮勇一舉剋定詩不云乎喪亂既平既安且寧非英才大略其孰能與於此邪故聊示所懷亦何謝也尋遷鴻臚卿時突厥啓民可汗請朝帝遣祥迎接之從征吐谷渾祥率衆出間道擊虜破之俘男女千餘口賜奴婢六十人馬三百匹進位左光祿大夫拜左驍衛將軍及遼東之役出踏頓道不利而還由是除名為民俄拜燕郡太守被賊高開道所圍祥稱疾不視事及城陷開道甚禮之會開道與羅藝通和送祥於涿郡卒於塗有子義隆永年令祥兄雲字世高弟威字世儀並有幹局雲官至萊州刺史武平縣公威官至武賁郎將武當縣公元壽元壽字長壽河南洛陽人也祖敦魏侍中邵陵王父寶周涼州刺史壽少孤性仁孝九歲喪父哀毀骨立宗族鄉黨咸異之事母以孝聞及長方直頗涉經史周武成初封隆城縣侯邑千戶保定四年改封儀隴縣侯授儀同三司開皇初議伐陳以壽有思理奉使於淮浦監修船艦以強濟見稱四年參督漕渠之役授尚書主爵侍郎八年從晉王伐陳除行臺左丞兼領元帥府屬及平陳拜尚書左丞高祖嘗出苑觀射文武並從焉開府蕭摩訶妻患且死奏請遣子向江南收其家産御史見而不言壽奏劾之曰臣聞天道不言功成四序聖皇垂拱任在百司御史之官義存糾察直繩莫舉憲典誰寄今月五日鑾輿徙蹕親臨射苑開府儀同三司蕭摩訶幸厠朝行預觀盛禮奏稱請遣子世略暫往江南重收家産妻安遇患彌留有日安若長逝世略不合此行竊以人倫之義伉儷為重資愛之道烏鳥弗虧摩訶遠念資財近忘匹好又命其子捨危惙之母為聚斂之行一言才發名教頓盡而兼殿內侍御史臣韓微之等親所聞見竟不彈糾若知非不舉事涉阿縱如不以為非豈關理識謹按儀同三司太子左庶子檢校治書侍御史臣劉行本出入宮省備蒙任遇攝職憲臺時月稍久庶能整肅纓冕澄清風教而在法司虧失憲體瓶罄罍恥何所逃愆臣謬膺朝寄忝居左轄無容寢默謹以狀聞其行本微之等請付大理上嘉納之尋授太常少卿數年拜基州刺史在任有公廉之稱入為太府少卿進位開府煬帝嗣位漢王諒舉兵反左僕射楊素為行軍元帥壽為長史壽每遇賊為士卒先以功授大將軍遷太府卿四年拜內史令從帝西討吐谷渾壽率衆屯金山東西連營三百餘里以圍渾主及還拜右光祿大夫七年兼左翊衛將軍從征遼東行至涿郡遇疾卒時年六十三帝悼惜焉哭之甚慟贈尚書右僕射光祿大夫諡曰景子敏頗有才辨而輕險多詐壽卒後帝追思之擢敏為守內史舍人而交通博徒數漏泄省中語化及之反也敏創其謀偽授內史侍郎為沈光所殺楊義臣楊義臣代人也本姓尉遲氏父崇仕周為儀同大將軍以兵鎮山時高祖為定州總管崇知高祖相貌非常每自結納高祖甚親待之及為丞相尉迥作亂崇以宗族之故自囚於獄遣使請罪高祖下書慰諭之即令馳驛入朝置左右開皇初封秦興縣公歲餘從行軍總管達奚長儒擊突厥於周盤力戰而死贈大將軍豫州刺史以義臣襲崇官爵時義臣尚幼養於宮中年未弱冠奉詔宿衛如千牛者數年賞賜甚厚上嘗從容言及恩舊顧義臣嗟歎久之因下詔曰朕受命之初羣凶未定明識之士有足可懷尉義臣與尉迥本同骨肉既狂悖作亂鄴城其父崇時在常山典司兵甲與迥鄰接又是至親知逆順之理識天人之意即陳丹款慮染惡徒自執有司請歸相府及北夷內侵橫戈制敵輕生重義馬革言旋操表存亡事貫幽顯雖高官大賞延及於世未足表松筠之志彰節義之門義臣可賜姓楊氏賜錢三萬貫酒三十斛米麥各百斛編之屬籍為皇從孫未幾拜陝州刺史義臣性謹厚能馳射有將領之才由是上甚重之其後突厥達頭可汗犯塞以行軍總管率步騎三萬出白道與賊遇戰大破之明年突厥又寇邊雁門馬邑多被其患義臣擊之虜遂出塞因而追之至大斤山與虜相遇時太平公史萬歲軍亦至義臣與萬歲合軍擊虜大破之萬歲為楊素所陷而死義臣功竟不録仁壽初拜朔州總管賜以御甲煬帝嗣位漢王諒作亂並州時代州總管李景為漢王將喬鍾葵所圍詔義臣救之義臣率馬步二萬夜出西陘遲明行數十里鍾葵覘見義臣兵少悉衆拒之鍾葵亞將王拔驍勇善用矟射之者不能中每以數騎陷陳義臣患之募能當拔者車騎將軍楊思恩請當之義臣見思恩氣貌雄勇顧之曰壯士也賜以卮酒思恩望見拔立於陳後投觴於地策馬赴之再往不剋義臣復選騎士十餘人從之思恩遂突擊殺數人直至拔麾下短兵方接所從騎士退思恩為拔所殺拔遂乘之義臣軍北者十餘里於是購得思恩尸義臣哭之甚慟三軍莫不下泣所從騎士皆腰斬義臣自以兵少悉取軍中牛驢得數千頭復令兵數百人人持一鼓潛驅之澗谷間出其不意義臣晡後復與鍾葵軍戰兵初合命驅牛驢者疾進一時鳴鼓塵埃張天鍾葵軍不知以為伏兵發因而大潰縱擊破之以功進位上大將軍賜物二千段雜綵五百段女妓十人良馬二十匹尋授相州刺史後三歲徵為宗正卿未幾轉太僕卿從征吐谷渾令義臣屯琵琶峽連營八十里南接元壽北連段文振合圍渾主於覆袁川其後復征遼東以軍將指肅慎道至鴨緑水與乙支文德戰每為先鋒一日七捷後與諸軍俱敗竟坐免俄而復位明年以為軍副與大將軍宇文述趣平壤至鴨緑水會楊玄感作亂班師檢校趙郡太守妖賊向海公聚衆作亂寇扶風安定間義臣奉詔擊平之尋從帝復征遼東進位左光祿大夫時渤海高士達清河張金稱並相聚為盜衆已數萬攻陷郡縣帝遣將軍段達討之不能剋詔義臣率遼東還兵數萬擊之大破士達斬金稱又收合降賊入豆子討格謙擒之以狀聞奏帝惡其威名遽追入朝賊由是復盛義臣以功進位光祿大夫尋拜禮部尚書未幾卒官衛玄衛玄字文升河南洛陽人也祖悅魏司農卿父豄侍中左武衛大將軍玄少有器識周武帝在藩引為記室遷給事上士襲爵興勢公食邑四千戶轉宣納下大夫武帝親總萬機拜益州總管長史賜以萬釘寶帶稍遷開府儀同三司太府中大夫治內史事仍領京兆尹稱為冖出蟲濟宣帝時以忤旨免官高祖作相檢校熊州事和州蠻反玄以行軍總管擊平之及高祖受禪遷淮州總管進封同軌郡公坐事免未幾拜嵐州刺史會起長城之役詔玄監督之俄檢校朔州總管事後為衛尉少卿仁壽初山獠作亂出為資州刺史以鎮撫之玄既到官時獠攻圍大牢鎮玄單騎造其營謂羣獠曰我是刺史銜天子詔安養汝等勿驚懼也諸賊莫敢動於是説以利害渠帥感悅解兵而去前後歸附者十餘萬口高祖大悅賜縑二千匹除遂州總管仍令劍南安撫煬帝即位復徵為衛尉卿夷獠攀戀數百里不絶玄曉之曰天子詔徵不可久住因與之訣夷獠各揮涕而去歲餘遷工部尚書其後拜魏郡太守尚書如故帝謂玄曰魏郡名都衝要之所民多姦宄是用煩公此郡去都道里非遠宜數往來詢謀朝政賜物五百段而遣之未幾拜右候衛大將軍檢校左候衛事大業八年轉刑部尚書遼東之役檢校右禦衛大將軍率師出增地道時諸軍多不利玄獨全衆而還拜金紫光祿大夫九年車駕幸遼東使玄與代王侑留守京師拜為京兆內史尚書如故許以便宜從事勑代王待以師傅之禮會楊玄感圍逼東都玄率步騎七萬援之至華陰掘楊素冢焚其骸骨夷其塋域示士卒以必死既出潼關議者恐崤函有伏兵請於陝縣沿流東下直趣河陽以攻其背玄曰以吾度之此計非豎子所及於是鼓行而進既度函谷卒如所量於是遣武賁郎將張峻為疑軍於南道玄以大兵直趣城北玄感逆拒之且戰且行屯軍金谷於軍中掃地而祭高祖曰刑部尚書京兆內史臣衛文升敢昭告于高祖文皇帝之靈自皇家啓運三十餘年武功文德漸被海外楊玄感孤負聖恩躬為蛇豕蜂飛蟻聚犯我王略臣二世受恩一心事主董率熊羆志梟凶逆若社稷靈長宜令醜徒冰碎如或大運去矣幸使老臣先死詞氣抑揚三軍莫不涕咽時衆寡不敵與賊頻戰不利死傷太半玄感盡鋭來攻玄苦戰賊稍却進屯北芒會宇文述來護兒等援兵至玄感懼而西遁玄遣通議大夫斛斯萬善監門直閣龐玉前鋒追之及于閿鄉與宇文述等合擊破之車駕至高陽徵詣行在所帝勞之曰社稷之臣也使朕無西顧之憂乃下詔曰近者妖氛充斥擾動關河文升率勵義勇應機響赴表𩹉奮擊摧破凶醜宜升榮命式弘賞典可右光祿大夫賜以良田甲第資物巨萬還鎮京師帝謂之曰關右之任一委於公公安社稷乃安公危社稷亦危出入須有兵衛坐臥宜自牢勇夫重閉此其義也今特給千兵以充侍從賜以玉麟符十一年詔玄安撫關中時盜賊蜂起百姓飢饉玄竟不能救恤而官方壞亂貨賄公行玄自以年老上表乞骸骨帝使內史舍人封德彝馳諭之曰京師國本王業所基宗廟園陵所在藉公耆舊臥以鎮之朕為國計義無相許故遣德彝口陳指意玄乃止義師入關自知不能守憂懼稱疾不知政事城陷歸于家義寧中卒時年七十七子孝則官至通事舍人兵部承務郎早卒劉權劉權字世略彭城豐人也祖軌齊羅州刺史權少有俠氣重然諾藏亡匿死吏不敢過門後更折節好學動循法度初為州主簿仕齊釋褐奉朝請行臺郎中及齊滅周武帝以為假淮州刺史高祖受禪以車騎將軍領鄉兵後從晉王廣平陳以功進授開府儀同三司賜物三千段宋國公賀若弼甚禮之開皇十二年拜蘇州刺史賜爵宗城縣公于時江南初平物情尚擾權撫以恩信甚得民和煬帝嗣位拜衛尉卿進位銀青光祿大夫大業五年從征吐谷渾權率衆出伊吾道與賊相遇擊走之逐北至青海虜獲千餘口乘勝至伏俟城帝復令權過曼頭赤水置河源郡積石鎮大開屯田留鎮西境在邊五載諸羌懷附貢賦歲入吐谷渾餘燼遠遁道路無壅徵拜司農卿加位金紫光祿大夫尋為南海太守行至鄱陽會羣盜起不得進詔令權召募討之權率兵與賊相遇不與戰先乘單舸詣賊營説以利害羣賊感悅一時降附帝聞而嘉之既至南海甚有異政數歲遇盜賊羣起數來攻郡豪帥多願推權為首權竟盡力固守以拒之子世徹又密遣人齎書詣權稱四方擾亂英雄並起時不可失諷令舉兵權召集佐僚對斬其使竟無異圖守之以死卒官時年七十世徹倜儻不羈頗為時人所許大業末羣雄並起世徹所至之處輒為所忌多拘禁之後竟為兗州賊帥徐圓朗所殺權從父烈字子將美容儀有器局官至鷹揚郎將有子德威知名於世史臣曰子蓋雅有幹局質性嚴敏見義而勇臨機能斷保全都邑勤亦懋哉楊諒干紀史祥著獨克之效羣盜侵擾義臣致三捷之功此皆名重當年聲流後葉者也元壽彈奏行本有意存夫名教然其計功稱伐猶居義臣之後端揆之贈不已優乎文升東都解圍頗亦宣力西京居守政以賄成鄙哉鄙哉夫何足數劉權淮楚舊族早著雄名屬擾攘之辰居尉他之地遂能拒子邪計無所覬覦雖謝勤王之謀足為守節之士矣

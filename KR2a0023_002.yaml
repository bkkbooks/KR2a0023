body:
  text: 隋書卷二帝紀第二高祖下八年春正月乙亥陳遣散騎常侍袁雅兼通直散騎常侍周止水來聘二月庚子鎮星入東井辛酉陳人寇硤州三月辛未上柱國隴西郡公李詢卒壬申以成州刺史姜須達為會州總管甲戌遣兼散騎常侍程尚賢兼通直散騎常侍韋惲使于陳戊寅詔曰昔有苗不賓唐堯薄伐孫皓僭虐晉武行誅有陳竊據江表逆天暴物朕初受命陳頊尚存思欲教之以道不以龔行為令往來修睦望其遷善時日無幾釁惡已聞厚納叛亡侵犯城戍勾吳閩越肆厥殘忍于時王師大舉將一車書陳頊反地收兵深懷震懼責躬請約俄而致殞矜其喪禍仍詔班師叔寶承風因求繼好載佇克念共敦行李每見圭璪入朝輶軒出使何嘗不殷勤曉喻戒以惟新而狼子之心出而彌野威侮五行怠棄三正誅翦骨肉夷滅才良據手掌之地恣溪壑之險劫奪閭閻資産俱竭驅蹙內外勞役弗已徵責女子擅造宮室日增月益止足無期帷薄嬪嬙有踰萬數寶衣玉食窮奢極侈淫聲樂飲俾晝作夜斬直言之客滅無罪之家剖人之肝分人之血欺天造惡祭鬼求恩歌衢路酣醉宮閫盛粉黛而執干戈曳羅綺而呼警蹕躍馬振策從旦至昏無所經營馳走不息負甲持仗隨逐徒行追而不及即加罪譴自古昏亂罕或能比介士武夫飢寒力役筋髓罄於土木性命俟於溝渠君子潛逃小人得志家家隱殺戮各各任聚斂天災地孽物怪人妖衣冠鉗口道路以目傾心翹足誓告於我日月以冀文奏相尋重以背德違言搖蕩疆埸巴峽之下海澨已西江北江南為鬼為蜮死隴窮發掘之酷生居極攘奪之苦抄掠人畜斷截樵蘇市井不立農事廢寢歷陽廣陵窺覦相繼或謀圖城邑或劫剝吏人晝伏夜遊鼠竄狗盜彼則羸兵敝卒來必就擒此則重門設險有勞藩捍天之所覆無非朕臣每關聽覽有懷傷惻有梁之國我南藩也其君入朝潛相招誘不顧朕恩士女深迫脅之悲城府致空虛之歎非直朕居人上懷此無忘既而百辟屢以為言兆庶不堪其請豈容對而不誅忍而不救近日秋始謀欲弔人益部樓船盡令東騖便有神龍數十騰躍江流引伐罪之師向金陵之路船住則龍止船行則龍去四日之內三軍皆覩豈非蒼旻愛人幽明展事降神先路協贊軍威以上天之靈助戡定之力便可出師授律應機誅殄在斯舉也永清吳越其將士糧仗水陸資須期會進止一準別勑秋八月丁未河北諸州饑遣吏部尚書蘇威賑恤之九月丁丑宴南征諸將頒賜各有差癸巳嘉州言龍見冬十月己亥太白出西方己未置淮南行臺省於壽春以晉王廣為尚書令辛酉陳遣兼散騎常侍王琬兼通直散騎常侍許善心來聘拘留不遣甲子將伐陳有事於太廟命晉王廣秦王俊清河公楊素並為行軍元帥以伐陳於是晉王廣出六合秦王俊出襄陽清河公楊素出信州荊州刺史劉仁恩出江陵宜陽公王世積出蘄春新義公韓擒虎出廬江襄邑公賀若弼出吳州落叢公燕榮出東海合總管九十兵五十一萬八千皆受晉王節度東接滄海西拒巴蜀旌旗舟楫橫亘數千里曲赦陳國有星孛于牽牛十一月丁卯車駕餞師詔購陳叔寶位上柱國萬戶公乙亥行幸定城陳師誓衆丙子幸河東十二月庚子至自河東九年春正月己巳白虹夾日辛未賀若弼拔陳京口韓擒虎拔陳南豫州癸酉以尚書右僕射虞慶則為右衛大將軍丙子賀若弼敗陳師於蔣山獲其將蕭摩訶韓擒虎進師入建鄴獲其將任蠻奴獲陳主叔寶陳國平合州三十郡一百縣四百癸巳遣使持節巡撫之二月乙未廢淮南行臺省丙申制五百家為鄉正一人百家為里長一人丁酉以襄州總管韋世康為安州總管夏四月己亥幸驪山親勞旋師乙巳三軍凱入獻俘於太廟拜晉王廣為太尉庚戌上御廣陽門宴將士頒賜各有差辛亥大赦天下己未以陳都官尚書孔範散騎常侍王瑳王儀御史中丞沈觀等邪佞於其主以致亡滅皆投之邊裔辛酉以信州總管楊素為荊州總管吏部侍郎宇文為刑部尚書宗正少卿楊虉為工部尚書壬戌詔曰往以吳越之野羣黎塗炭干戈方用積習未寧今率土大同含生遂性太平之法方可流行凡我臣僚澡身浴德開通耳目宜從茲始喪亂已來緬將十載君無君德臣失臣道父有不慈子有不孝兄弟之情或薄夫婦之義或違長幼失序尊卑錯亂朕為帝王志存愛養時有臻道不敢寧息內外職位遐邇黎人家家自修人人克念使不軌不法蕩然俱盡兵可立威不可不戢刑可助化不可專行禁衛九重之餘鎮守四方之外戎旅軍器皆宜停罷代路既夷羣方無事武力之子俱可學文人間甲仗悉皆除毀有功之臣降情文藝家門子姪各守一經令海內翕然高山仰止京邑庠序爰及州縣生徒受業升進於朝未有灼然明經高第此則教訓不篤考課未精明勒所由隆茲儒訓官府從宦丘園素士心迹相表寬弘為念勿為局促乖我皇猷朕君臨區宇於茲九載開直言之路披不諱之心形於顏色勞於興寢自頃逞藝論功昌言乃衆推誠切諫其事甚疏公卿士庶非所望也各啓至誠匡茲不逮見善必進有才必舉無或噤默退有後言頒告天下咸悉此意閏月甲子以安州總管韋世康為信州總管丁丑頒木魚符於於總管刺史雌一雄一己卯以吏部尚書蘇威為尚書右僕射六月乙丑以荊州總管楊素為納言丁丑以吏部侍郎盧愷為禮部尚書時朝野物議咸願登封秋七月丙午詔曰豈可命一將軍除一小國遐邇注意便謂太平以薄德而封名山用虛言而干上帝非朕攸聞而今以後言及封禪宜即禁絶八月壬戌以廣平王雄為司空冬十一月壬辰考使定州刺史豆盧通等上表請封禪上不許庚子以右衛大將軍虞慶則為右武候大將軍右領軍將軍李安為右領軍大將軍甲寅降囚徒十二月甲子詔曰朕祗承天命清蕩萬方百王衰敝之後兆庶澆浮之日聖人遺訓掃地俱盡制禮作樂今也其時朕情存古樂深思雅道鄭衛淫聲魚龍雜戲樂府之內盡以除之今欲更調律呂改張琴瑟且妙術精微非因教習工人代掌止傳糟粕不足達神明之德論天地之和區域之間奇才異藝天知神授何代無哉蓋晦迹於非時俟昌言於所好宜可搜訪速以奏聞庶覩一藝之能共就九成之業仍詔太常牛弘通直散騎常侍許善心祕書丞姚察通直郎虞世基等議定作樂己巳以黃州總管周法尚為永州總管十年春正月乙未以皇孫昭為河南王楷為華陽王二月庚申幸並州夏四月辛酉至自並州五月乙未詔曰魏末喪亂宇縣瓜分役車歲動未遑休息兵士軍人權置坊府南征北伐居處無定家無完堵地罕包桑為流寓之人竟無鄉里之號朕甚愍之凡是軍人可悉屬州縣墾田籍帳一與民同軍府統領宜依舊式罷山東河南及北方緣邊之地新置軍府六月辛酉制人年五十免役收庸癸亥以靈州總管王世積為荊州總管淅州刺史元胄為靈州總管秋七月癸卯以納言楊素為內史令庚戌上親録囚徒辛亥高麗遼東郡公高陽卒壬子吐谷渾遣使來朝八月壬申遣柱國襄陽郡公韋洸上開府東萊郡公王景並持節巡撫嶺南百越皆服冬十月甲子頒木魚符於京師官五品已上戊辰以永州總管周法尚為桂州總管十一月辛卯幸國學頒賜各有差丙午契丹遣使朝貢辛丑有事於南郊是月婺州人汪文進會稽人高智慧蘇州人沈玄皆舉兵反自稱天子署置百官樂安蔡道人蔣山李稜饒州吳代華永嘉沈孝徹泉州王國慶餘杭楊寶英交趾李春等皆自稱大都督攻陷州縣詔上柱國內史令越國公楊素討平之十一年春正月丁酉以平陳所得古器多為妖變悉命毀之辛丑高麗遣使朝貢丙午皇太子妃元氏薨上舉哀於文思殿二月戊午吐谷渾遣使貢方物以大將軍蘇孝慈為工部尚書丙子以臨潁令劉曠治術尤異擢為莒州刺史己卯突厥遣使獻七寶碗辛巳晦日有蝕之三月壬午遣通事舍人若干洽使于吐谷渾癸未以幽州總管周搖為壽州總管朔州總管吐萬緒為夏州總管夏四月戊午突厥雍虞閭可汗遣其特勤來朝五月甲子高麗遣使貢方物癸卯詔百官悉詣朝堂上封事乙巳以右衛將軍元旻為左衛大將軍秋七月己丑以柱國杜彥為洪州總管八月壬申幸栗園滕王瓚薨乙亥至自栗園上柱國沛國公鄭譯卒十二月丙辰靺鞨遣使貢方物十二年春正月壬子以蘇州刺史皇甫績為信州總管宣州刺史席代雅為廣州總管二月己巳以蜀王秀為內史令兼右領軍大將軍漢王諒為雍州牧右衛大將軍夏四月辛卯以壽州總管周搖為襄州總管五月辛亥廣州總管席代雅卒秋七月乙巳尚書右僕射邳國公蘇威禮部尚書容城縣侯盧愷並坐事除名壬戌幸昆明池其日還宮己巳有事於太廟壬申晦日有蝕之八月甲戌制天下死罪諸州不得便決皆令大理覆治乙亥幸龍首池癸巳制宿衛者不得輒離所守丁酉上柱國夏州總管楚國公豆盧績卒戊戌上親録囚徒九月丁未以工部尚書楊虉為吳州總管冬十月丁丑以遂安王集為衛王壬午有事于太廟至太祖神主前上流涕嗚咽悲不自勝十一月辛亥有事於南郊壬子宴百僚頒賜各有差己未上柱國新義郡公韓擒虎卒庚申以豫州刺史權武為潭州總管甲子百僚大射於武德殿十二月癸酉突厥遣使來朝乙酉以上柱國內史令楊素為尚書右僕射己酉吐谷渾靺鞨並遣使貢方物十三年春正月乙巳上柱國郇國公韓建業卒丙午契丹奚霫室韋並遣使貢方物壬子親祀感帝己未以信州總管韋世康為吏部尚書壬戌行幸岐州二月丙子詔營仁壽宮丁亥至自岐州戊子宴考使於嘉則殿己卯立皇孫暕為豫章王戊子晉州刺史南陽郡公賈悉達隰州總管撫寧郡公韓延等以賄伏誅己丑制坐事去官者配流一年丁酉制私家不得隱藏緯候圖讖夏四月癸未制戰亡之家給復一年五月癸亥詔人間有撰集國史臧否人物者皆令禁絶秋七月戊申靺鞨遣使貢方物壬子左衛大將軍雲州總管巨鹿郡公賀婁子幹卒丁巳幸昆明池戊辰晦日有蝕之九月丙辰降囚徒庚申以邵國公楊綸為滕王乙丑以柱國杜彥為雲州總管冬十月乙卯上柱國華陽郡公梁彥光卒十四年夏四月乙丑詔曰在昔聖人作樂崇德移風易俗於斯為大自晉氏播遷兵戈不息雅樂流散年代已多四方未一無由辨正賴上天鑒臨明神降福拯茲塗炭安息蒼生天下大同歸於治理遺文舊物皆為國有比命所司總令研究正樂雅聲詳考已訖宜即施用見行者停人間音樂流僻日久棄其舊體競造繁聲浮宕不歸遂以成俗宜加禁約務存其本五月辛酉京師地震關內諸州旱六月丁卯詔省府州縣皆給公廨田不得治生與人爭利秋七月乙未以邳國公蘇威為訥言八月辛未關中大旱人飢上率戶口就食於洛陽九月己未以齊州刺史樊子蓋為循州總管丁巳以基州刺史崔仲方為會州總管冬閏十月甲寅詔曰齊梁陳往皆創業一方綿歷年代既宗祀廢絶祭奠無主興言矜念良以愴然莒國公蕭琮及高仁英陳叔寶等宜令以時修其祭祀所須器物有司給之乙卯制外官九品已上父母及子年十五已上不得將之官十一月壬戌制州縣佐吏三年一代不得重任癸未有星孛于角亢十二月乙未東巡狩十五年春正月壬戌車駕次齊州親問疾苦丙寅旅王符山庚午上以歲旱祠太山以謝愆咎大赦天下二月丙辰收天下兵器敢有私造者坐之關中緣邊不在其例丁巳上柱國蔣國公梁睿卒三月己未至自東巡狩望祭五嶽海瀆丁亥幸仁壽宮營州總管韋藝卒夏四月己丑朔大赦天下甲辰以趙州刺史楊達為工部尚書丁未以開府儀同三司韋沖為營州總管五月癸酉吐谷渾遣使朝貢丁亥制京官五品已上佩銅魚符六月戊子詔鑿底柱庚寅相州刺史豆盧通貢綾文布命焚之於朝堂乙未林邑遣使來貢方物辛丑詔名山大川未在祀典者悉祠之秋七月乙丑晉王廣獻毛龜甲戌遣邳國公蘇威巡省江南戊寅至自仁壽宮辛巳制九品已上官以理去職者聽並執笏冬十月戊子以吏部尚書韋世康為荊州總管十一月辛酉幸溫湯乙丑至自溫湯十二月戊子勑盜邊糧一升已上皆斬並籍沒其家己丑詔文武官以四考交代十六年春正月丁亥以皇孫裕為平原王筠為安成王嶷為安平王恪為襄城王該為高陽王韶為建安王煚為潁川王夏五月丁巳以懷州刺史龐晃為夏州總管蔡陽縣公姚辨為靈州總管六月甲午制工商不得進仕並州大蝗辛丑詔九品已上妻五品已上妾夫亡不得改嫁秋八月丙戌詔決死罪者三奏而後行刑冬十月己丑幸長春宮十一月壬子至自長春宮十七年春二月癸未太平公史萬歲擊西寧羌平之庚寅幸仁壽宮庚子上柱國王世積討桂州賊李光仕平之壬寅河南王昭納妃宴羣臣頒賜各有差三月丙辰詔曰分職設官共理時務班位高下各有等差若所在官人不相敬憚多自寬縱事難克舉諸有殿失雖備科條或據律乃輕論情則重不即決罪無以懲肅其諸司論屬官若有愆犯聽於律外斟酌決杖辛酉上親録囚徒癸亥上柱國彭國公劉昶以罪伏誅庚午遣治書侍御史柳彧皇甫誕巡省河南河北夏四月戊寅頒新曆壬午詔曰周曆告終羣凶作亂釁起蕃服毒被生人朕受命上玄廓清區宇聖靈垂祐文武同心申明公穆鄖襄公孝寬廣平王雄蔣國公睿楚國公績齊國公熲越國公素魯國公慶則新寧公長叉宜陽公世積趙國公羅雲隴西公詢廣業公景真昌公振沛國公譯項城公子相巨鹿公子幹等登庸納揆之時草昧經綸之日丹誠大節心盡帝圖茂績殊勳力宣王府宜弘其門緒與國同休其世子世孫未經州任者宜量才升用庶享榮位世祿無窮五月宴百僚於玉女泉頒賜各有差己巳蜀王秀來朝高麗遣使貢方物甲戌以左衛將軍獨孤羅雲為涼州總管閏月己卯羣鹿入殿門馴擾侍衛之內秋七月丁丑桂州人李代賢反遣右武候大將軍虞慶則討平之丁亥上柱國並州總管秦王俊坐事免以王就第戊戌突厥遣使貢方物八月丁卯荊州總管上庸郡公韋世康卒九月甲申至自仁壽宮庚寅上謂侍臣曰禮主於敬皆當盡心黍稷非馨貴在祗肅廟庭設樂本以迎神齊祭之日觸目多感當此之際何可為心在路奏樂禮未為允羣公卿士宜更詳之冬十月丁未頒銅獸符於驃騎車騎府戊申道王靜薨庚午詔曰五帝異樂三王殊禮皆隨事而有損益因情而立節文仰惟祭享宗廟瞻敬如在罔極之感情深茲日而禮畢升路鼓吹發音還入宮門金石振響斯則哀樂同日心事相違情所不安理實未允宜改茲往式用弘禮教自今已後享廟日不須備鼓吹殿庭勿設樂懸辛未京師大索十一月丁亥突厥遣使來朝十二月壬子上柱國右武候大將軍魯國公虞慶則以罪伏誅十八年春正月辛丑詔曰吳越之人往承弊俗所在之處私造大船因相聚結致有侵害其江南諸州人間有船長三丈已上悉括入官二月甲辰幸仁壽宮乙巳以漢王諒為行軍元帥水陸三十萬伐高麗三月乙亥以柱國杜彥為朔州總管夏四月癸卯以蔣州刺史郭衍為洪州總管五月辛亥詔畜猫鬼蠱毒厭魅野道之家投於四裔六月丙寅下詔黜高麗王高元官爵秋七月壬申詔以河南八州水免其課役丙子詔京官五品已上總管刺史以志行修謹清平幹濟二科舉人九月己丑漢王諒師遇疾疫而旋死者十八九庚寅勑舍客無公驗者坐及刺史縣令辛卯至自仁壽宮冬十一月甲戌上親録囚徒癸未有事於南郊十二月庚子上柱國夏州總管任城郡公王景以罪伏誅是月自京師至仁壽宮置行宮十有二所十九年春正月癸酉大赦天下戊寅大射武德殿宴賜百官二月己亥晉王廣來朝辛丑以並州總管長史宇文為朔州總管甲寅幸仁壽宮夏四月丁酉突厥利可汗內附達頭可汗犯塞遣行軍總管史萬歲擊破之六月丁酉以豫章王暕為內史令秋八月癸卯上柱國尚書左僕射齊國公高熲坐事免辛亥上柱國皖城郡公張威卒甲寅上柱國城陽郡公李徹卒九月乙丑以太常卿牛弘為吏部尚書冬十月甲午以突厥利可汗為啓人可汗築大利城處其部落庚子以朔州總管宇文為代州總管十二月乙未突厥都藍可汗為部下所殺丁丑星隕於勃海二十年春正月辛酉朔上在仁壽宮突厥高麗契丹並遣使貢方物癸亥以代州總管宇文為吳州總管二月己巳以上柱國崔弘度為原州總管丁丑無雲而雷三月辛卯熙州人李英林反遣行軍總管張衡討平之夏四月壬戌突厥犯塞以晉王廣為行軍元帥擊破之乙亥天有聲如瀉水自南而北六月丁丑秦王俊薨秋八月老人星見九月丁未至自仁壽宮癸丑吳州總管楊虉卒冬十月己未太白晝見乙丑皇太子勇及諸子並廢為庶人殺柱國太平縣公史萬歲己巳殺左衛大將軍五原郡公元旻十一月戊子天下地震京師大風雪以晉王廣為皇太子十二月戊午詔東宮官屬不得稱臣於皇太子辛巳詔曰佛法深妙道教虛融咸降大慈濟度羣品凡在含識皆蒙覆護所以雕鑄靈相圖寫真形率土瞻仰用申誠敬其五嶽四鎮節宣雲雨江河淮海浸潤區域並生養萬物利益兆人故建廟立祀以時恭敬敢有毀壞偷盜佛及天尊像嶽鎮海瀆神形者以不道論沙門壞佛像道士壞天尊者以惡逆論仁壽元年春正月乙酉朔大赦改元以尚書右僕射楊素為尚書左僕射納言蘇威為尚書右僕射丁酉徙河南王昭為晉王突厥寇安遣柱國韓洪擊之官軍敗績以晉王昭為內史令辛丑詔曰君子立身雖云百行唯誠與孝最為其首故投主殉節自古稱難殞身王事禮加二等而代俗之徒不達大義至於致命戎旅不入兆域虧孝子之意傷人臣之心興言念此每深愍歎且入廟祭祀並不廢闕何止墳塋獨在其外自今已後戰亡之徒宜入墓域二月乙卯朔日有蝕之辛巳以上柱國獨孤楷為原州總管三月壬辰以豫章王暕為揚州總管夏四月以淅州刺史蘇孝慈為洪州總管五月己丑突厥男女九萬口來降壬辰驟雨震雷大風拔木宜君湫水移於始平六月癸丑洪州總管蘇孝慈卒乙卯遣十六使巡省風俗乙丑詔曰儒學之道訓教生人識父子君臣之義知尊卑長幼之序升之於朝任之以職故能贊理時務弘益風範朕撫臨天下思弘德教延集學徒崇建庠序開進仕之路佇賢雋之人而國學胄子垂將千數州縣諸生咸亦不少徒有名録空度歲時未有德為代範才任國用良由設學之理多而未精今宜簡省明加奬勵於是國子學唯留學生七十人太學四門及州縣學並廢其日頒舍利於諸州秋七月戊戌改國子為太學九月癸未以柱國杜彥為雲州總管十一月己丑有事於南郊壬辰以資州刺史衛玄為遂州總管二年春二月辛亥以邢州刺史侯莫陳頴為桂州總管宗正楊祀為荊州總管三月己亥幸仁壽宮壬寅以齊州刺史張喬為潭州總管夏四月庚戌岐雍二州地震秋七月丙戌詔內外官各舉所知戊子以原州總管獨孤楷為益州總管八月己巳皇后獨孤氏崩九月丙戌至自仁壽宮壬辰河南北諸州大水遣工部尚書楊達賑恤之乙未上柱國襄州總管金水郡公周搖卒隴西地震冬十月壬子曲赦益州管內癸丑以工部尚書楊達為納言閏月甲申詔尚書左僕射楊素與諸術者刊定陰陽舛謬己丑詔曰禮之為用時義大矣黃琮蒼璧降天地之神粢盛牲食展宗廟之敬正父子君臣之序明婚姻喪紀之節故道德仁義非禮不成安上治人莫善於禮自區宇亂離綿歷年代王道衰而變風作微言絶而大義乖與代推移其弊日甚至於四時郊祀之節文五服麻葛之隆殺是非異說踳駁殊塗致使聖教凋訛輕重無準朕祗承天命撫臨生人當洗滌之時屬干戈之代克定禍亂先運武功刪正彝典日不暇給今四海乂安五戎勿用理宜弘風訓俗導德齊禮綴往聖之舊章興先王之茂則尚書左僕射越國公楊素尚書右僕射邳國公蘇威吏部尚書奇章公牛弘內史侍郎薛道衡祕書丞許善心內史舍人虞世基著作郎王劭或任居端揆博達古今或器推令望學綜經史委以裁緝實允僉議可並修定五禮壬寅葬獻皇后於太陵十二月癸巳上柱國益州總管蜀王秀廢為庶人交州人李佛子舉兵反遣行軍總管劉方討平之三年春二月己卯原州總管比陽縣公龐晃卒戊子以大將軍蔡陽郡公姚辨為左武候大將軍夏五月癸卯詔曰哀哀父母生我劬勞欲報之德昊天罔極但風樹不靜嚴敬莫追霜露既降感思空切六月十三日是朕生日宜令海內為武元皇帝元明皇后斷屠六月甲午詔曰禮云至親以朞斷蓋以四時之變易萬物之更始故聖人象之其有三年加隆爾也但家無二尊母為厭降是以父存喪母還服于朞者服之正也豈容朞內而更小祥然三年之喪而有小祥者禮云朞祭禮也朞而除喪道也以是之故雖未再朞而天地一變不可不祭不可不除故有練焉以存喪祭之本然朞喪有練於理未安雖云十一月而練乃無所法象非朞非時豈可除祭而儒者徒擬三年之喪立練禫之節可謂苟存其變而失其本欲漸於奪乃薄於喪致使子則冠練去絰黃𩹉縓緣絰則布葛在躬粗服未改豈非絰哀尚存子情已奪親疏失倫輕重顛倒乃不順人情豈聖人之意也故知先聖之禮廢於人邪三年之喪尚有不行之者至於祥練之節安能不墜者乎禮云父母之喪無貴賤一也而大夫士之喪父母乃貴賤異服然則禮壞樂崩由來漸矣所以晏平仲之斬粗縗其老謂之非禮滕文公之服三年其臣咸所不欲蓋由王道既衰諸侯異政將踰越於法度惡禮制之害己乃滅去篇籍自制其宜遂至骨肉之恩輕重從俗無易之道隆殺任情況孔子沒而微言隱秦滅學而經籍焚者乎有漢之興雖求儒雅人皆異說義非一貫又近代亂離唯務兵革其於典禮時所未遑夫禮不從天降不從地出乃人心而己者謂情緣於恩也故恩厚者其禮隆情輕者其禮殺聖人以是稱情立文別親疏貴賤之節自臣子道消上下失序莫大之恩逐情而薄莫重之禮與時而殺此乃服不稱喪容不稱服非所謂聖人緣恩表情制禮之義也然喪與易也寧在於戚則禮之本也禮有其餘未若於哀則情之實也今十一月而練者非禮之本非情之實由是言之父存喪母不宜有練但依禮十三月而祥中月而禫庶以合聖人之意達孝子之心秋七月丁卯詔曰日往月來唯天所以運序山鎮川流唯地所以宣氣運序則寒暑無差宣氣則雲雨有作故能成天地之大德育萬物而為功況一人君于四海睹物欲運獨見致治不藉羣才未之有也是以唐堯欽明命羲和以居嶽虞舜睿德升元凱而作相伊尹鼎俎之媵為殷之阿衡呂望漁釣之夫為周之尚父此則鳴鶴在陰其子必和風雲之從龍虎賢哲之應聖明君德不回臣道以正故能通天地之和順陰陽之序豈不由元首而有股肱乎自王道衰人風薄居上莫能公道以御物為下必踵私法以希時上下相蒙君臣義失義失則政乖政乖則人困蓋同德之風難嗣離德之軌易追則任者不休休者不任則衆口鑠金戮辱之禍不測是以行歌避代辭位灌園卷而可懷黜而無慍放逐江湖之上沈赴河海之流所以自潔而不悔者也至於閭閻秀異之士鄉曲博雅之儒言足以佐時行足以勵俗遺棄於草野堙滅而無聞豈勝道哉所以覽古而歎息者也方今區宇一家煙火萬里百勝乂安四夷賓服豈是人功實乃天意朕惟夙夜祗懼將所以上嗣明靈是以小心勵己日慎一日以黎元在念憂兆庶未康以庶政為懷慮一物失所雖求傅巖莫見幽人徒想崆峒未聞至道唯恐商歌於長夜抱關於夷門遠跡犬羊之間屈身僮僕之伍其令州縣搜揚賢哲皆取明知今古通識治亂究政教之本達禮樂之源不限多少不得不舉限以三旬咸令進路徵召將送必須以禮八月壬申上柱國檢校幽州總管落叢郡公燕榮以罪伏誅九月壬戌置常平官甲子以營州總管韋沖為民部尚書十二月癸酉河南諸州水遣納言楊達賑恤之四年春正月丙辰大赦甲子幸仁壽宮乙丑詔賞罰支度事無巨細並付皇太子夏四月乙卯上不豫六月庚申大赦天下有星入月中數日而退長人見於雁門秋七月乙未日青無光八日乃復己亥以大將軍段文振為雲州總管甲辰上以疾甚臥於仁壽宮與百僚辭訣並握手歔欷丁未崩於大寶殿時年六十四遺詔曰嗟乎自昔晉室播遷天下喪亂四海不一以至周齊戰爭相尋年將三百故割疆土者非一所稱帝王者非一人書軌不同生人塗炭上天降鑒爰命於朕用登大位豈關人力故得撥亂反正偃武修文天下大同聲教遠被此又是天意欲寧區夏所以昧旦臨朝不敢逸豫一日萬機留心親覽晦明寒暑不憚劬勞匪曰朕躬蓋為百姓故也王公卿士每日闕庭刺史以下三時朝集何嘗不罄竭心府誡勑殷勤義乃君臣情兼父子庶藉百僚智力萬國歡心欲令率土之人永得安樂不謂遘疾彌留至於大漸此乃人生常分何足言及但四海百姓衣食不豐教化政刑猶未盡善興言念此唯以留恨朕今年踰六十不復稱夭但筋力精神一時勞竭如此之事本非為身止欲安養百姓所以致此人生子孫誰不愛念既為天下事須割情勇及秀等並懷悖惡既知無臣子之心所以廢黜古人有言知臣莫若於君知子莫若於父若令勇秀得志共治家國必當戮辱遍於公卿酷毒流於人庶今惡子孫已為百姓黜屏好子孫足堪負荷大業此雖朕家事理不容隱前對文武侍衛具已論述皇太子廣地居上嗣仁孝著聞以其行業堪成朕志但令內外羣官同心戮力以此共治天下朕雖瞑目何所復恨但國家事大不可限以常禮既葬公除行之自昔今宜遵用不勞改定凶禮所須才令周事務從節儉不得勞人諸州總管刺史已下宜各率其職不須奔赴自古哲王因人作法前帝後帝沿革隨時律令格式或有不便於事者宜依前勑修改務當政要嗚呼敬之哉無墜朕命乙卯發喪河間楊柳四株無故黃落既而花葉復生八月丁卯梓宮至自仁壽宮丙子殯于大興前殿冬十月己卯合葬於太陵同墳而異穴上性嚴重有威容外質木而內明敏有大略初得政之始羣情不附諸子幼弱內有六王之謀外致三方之亂握強兵居重鎮者皆周之舊臣上推以赤心各展其用不踰朞月克定三邊未及十年平一四海薄賦斂輕刑罰內修制度外撫戎夷每旦聽朝日昃忘倦居處服玩務存節儉令行禁止上下化之開皇仁壽之間丈夫不衣綾綺而無金玉之飾常服率多布帛裝帶不過以銅鐵骨角而已雖嗇於財至於賞賜有功亦無所愛吝乘輿四出路逢上表者則駐馬親自臨問或潛遣行人採聽風俗吏治得失人間疾苦無不留意嘗遇關中饑遣左右視百姓所食有得豆屑雜糠而奏之者上流涕以示羣臣深自咎責為之徹膳不御酒肉者殆將一朞及東拜太山關中戶口就食洛陽者道路相屬上勑斥候不得輒有驅逼男女參廁於杖衛之間逢扶老幼者輒引馬避之慰勉而去至艱險之處見負擔者遽令左右扶助之其有將士戰沒必加優賞仍令使者就家勞問自強不息朝夕孜孜人庶殷繁帑藏充實雖未能臻於至治亦足稱近代之良主然天性沉猜素無學術好為小數不達大體故忠臣義士莫得盡心竭辭其草創元勳及有功諸將誅夷罪退罕有存者又不悅詩書廢除學校唯婦言是用廢黜諸子逮于暮年持法尤峻喜怒不常過於殺戮嘗令左右送西域朝貢使出玉門關其人所經之處或受牧宰小物饋遺鸚鵡皮馬鞭之屬上聞而大怒又詣武庫見署中蕪穢不治於是執武庫令及諸受遺者出開遠門外親自臨決死者數十人又往往潛令人賂遺令史府史有受者必死無所寬貸議者以此少之史臣曰高祖龍德在田奇表見異晦明藏用故知我者希始以外戚之尊受託孤之任與能之議未為當時所許是以周室舊臣咸懷憤惋既而王謙固三蜀之阻不踰朞月尉迥舉全齊之衆一戰而亡斯乃非止人謀抑亦天之所贊也乘茲機運遂遷周鼎于時蠻夷猾夏荊揚未一劬勞日昃經營四方樓船南邁則金陵失險驃騎北指則單于款塞職方所載並入疆理禹貢所圖咸受正朔雖晉武之克平吳會漢宣之推亡固存比義論功不能尚也七德既敷九歌已洽要荒咸暨尉候無警於是躬節儉平徭賦倉廩實法令行君子咸樂其生小人各安其業強無陵弱衆不暴寡人物殷阜朝野歡娛二十年間天下無事區宇之內晏如也考之前王足以參蹤盛烈但素無術學不能盡下無寬仁之度有刻薄之資暨乎暮年此風逾扇又雅好符瑞暗於大道建彼維城權侔京室皆同帝制靡所適從聽哲婦之言惑邪臣之說溺寵廢嫡託付失所滅父子之道開昆弟之隙縱其尋斧翦伐本枝墳土未乾子孫繼踵屠戮松檟才列天下已非隋有惜哉迹其衰怠之源稽其亂亡之兆起自高祖成於煬帝所由來遠矣非一朝一夕其不祀忽諸未為不幸也

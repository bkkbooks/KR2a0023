body:
  text: 隋書卷五帝紀第五恭帝恭皇帝諱侑元德太子之子也母曰韋妃性聰敏有氣度大業三年立為陳王後數載徙為代王邑萬戶及煬帝親征遼東令於京師總留事十一年從幸晉陽拜太原太守尋鎮京師義兵入長安尊煬帝為太上皇奉帝纂業義寧元年十一月壬戌上即皇帝位於大興殿詔曰王道喪亂天步不康古往今來代有其事屬之於朕逢此百罹彼蒼者天胡寧斯忍襁褓之歲夙遭憫凶孺子之辰太上播越興言感動實疚于懷太尉唐公膺期作宰時稱舟楫大拯橫流糾合義兵翼戴皇室與國休戚再匡區夏爰奉明詔弼豫幼沖顯命光臨天威咫尺對揚尊號悼心失圖一人在遠三讓不遂僶俯南面厝身無所苟利社稷莫敢或違俯從羣議奉遵聖旨可大赦天下改大業十三年為義寧元年十一月十六日昧爽以前大辟罪已下皆赦除之常赦所不免者不在赦限甲子以光祿大夫大將軍太尉唐公為假黃鉞使持節大都督內外諸軍事尚書令大丞相進封唐王丙寅詔曰朕惟孺子未出深宮太上遠巡追蹤穆滿時逢多難委當尊極辭不獲免恭己臨朝若涉大川罔知所濟撫躬永歎憂心孔棘民之情僞曾未之聞王業艱難載云其易賴股肱戮力上宰賢良匡佐沖人輔其不逮軍國機務事無大小文武設官位無貴賤憲章賞罰咸歸相府庶績其凝責成斯屬逖聽前史茲為典故因循仍舊非曰徒言所存至公無為讓德己巳以唐王子隴西公建成為唐國世子敦煌公為京兆尹改封秦公元吉為齊公食邑各萬戶太原置鎮北府乙亥張掖康老和舉兵反十二月癸未薛舉自稱天子寇扶風秦公為元帥擊破之丁亥桂陽人曹武徹舉兵反建元通聖丁酉義師擒驍衛大將軍屈突通於閿鄉虜其衆數萬乙巳賊帥張善安陷廬江郡二年春正月丁未詔唐王劍履上殿入朝不趨贊拜不名加前後羽葆鼓吹壬戌將軍王世充為李密所敗河內通守孟善誼武賁郎將王辨楊威劉長恭梁德董智通皆死之庚戌河陽郡尉獨孤武都降於李密三月丙辰右屯衛將軍宇文化及殺太上皇於江都宮右禦衛將軍獨孤盛死之齊王暕趙王杲燕王倓光祿大夫開府儀同三司行右翊衛大將軍宇文協金紫光祿大夫內史侍郎虞世基銀青光祿大夫御史大夫裴蘊通議大夫行給事郎許善心皆遇害化及立秦王浩為帝自稱大丞相朝士文武皆受其官爵光祿大夫宿公麥才折衝郎將朝請大夫沈光同謀討賊夜襲化及營反為所害戊辰詔唐王備九錫之禮加璽紱遠遊冠緑綟綬位在諸侯王上唐國置丞相已下一依舊式五月乙巳朔詔唐王冕十有二旒建天子旌旗出警入蹕金根車駕備五時副車置旄頭雲罕車八佾設鍾虡宮懸王后王子王女爵命之號一遵舊典戊午詔曰天禍隋國大行太上皇遇盜江都酷甚望夷釁深驪北憫豫小子奄逮丕愆哀號承感心情糜潰仰惟荼毒仇復靡申形影相弔罔知啓處相國唐王膺期命世扶危拯溺自北徂南東征西怨總九合於一匡決百勝於千里糾率夷夏大庇氓黎保乂朕躬繄王是賴德侔造化功格蒼旻兆庶歸心曆數斯在屈為人臣載違天命在昔虞夏揖讓相推苟非重華誰堪命禹當今九服崩離三靈改卜大運去矣請避賢路兆謀布德顧己莫能私僮命駕須歸藩國豫本代王及豫而代天之所廢豈期如是庶憑稽古之聖以誅四凶幸值惟新之恩預充三恪雪寃恥於皇祖守禋祀為孝孫朝聞夕殞及泉無恨今遵故事遜於舊邸庶官羣辟改事唐朝宜依前典趣上尊號若釋重負感泰兼懷假手真人俾除醜逆濟濟多士明知朕意仍勑有司凡有表奏皆不得以聞是日上遜位於大唐以為酅國公武德二年夏五月崩時年十五史臣曰恭帝年在幼沖遭家多難一人失德四海土崩羣盜蜂起豺狼塞路南巢遂往流彘不歸既鍾百六之期躬踐數終之運謳歌有屬笙鍾變響雖欲不遵堯舜之迹其庸可得乎

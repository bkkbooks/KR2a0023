body:
  text: 隋書卷三十八列傳第三劉昉劉昉博陵望都人也父孟良大司農從魏武入關周太祖以為東梁州刺史昉性輕狡有姦數周武帝時以功臣子入侍皇太子及宣帝嗣位以技佞見狎出入宮掖寵冠一時授大都督遷小御正與御正中大夫顏之儀並見親信及帝不悆召昉及之儀俱入臥內屬以後事帝瘖不復能言昉見靜帝幼沖不堪負荷然昉素知高祖又以后父之故有重名於天下遂與鄭譯謀引高祖輔政高祖固讓不敢當昉曰公若為當速為之如不為昉自為也高祖乃從之及高祖為丞相以昉為司馬時宣帝弟漢王贊居禁中每與高祖同帳而坐昉飾美妓進於贊贊甚悅之昉因說贊曰大王先帝之弟時望所歸孺子幼沖豈堪大事今先帝初崩群情尚擾王且歸第待事寧之後入為天子此萬全之計也贊時年未弱冠性識庸下聞昉之說以為信然遂從之高祖以昉有定策之功拜上大將軍封黃國公與沛國公鄭譯皆為心膂前後賞賜鉅萬出入以甲士自衞朝野傾矚稱為黃沛時人為之語曰劉昉牽前鄭譯推後昉自恃其功頗有驕色然性粗疎溺於財利富商大賈朝夕盈門于時尉迥起兵高祖令韋孝寬討之至武陟諸將不一高祖欲遣昉譯一人往監軍因謂之曰須得心膂以統大軍公等兩人誰當行者昉自言未嘗為將譯又以母老為請高祖不懌而高熲請行遂遣之由是恩禮漸薄又王謙司馬消難相繼而反高祖憂之忘寢與食昉逸遊縱酒不以職司為意相府事物多所遺落高祖深銜之以高熲代為司馬是後益見疎忌及受禪進位柱國改封舒國公閑居無事不復任使昉自以佐命元功中被疎遠甚不自安後遇京師饑上令禁酒昉使妾賃屋當壚沽酒治書侍御史梁毗劾奏昉曰臣聞處貴則戒之以奢持滿則守之以約昉既位列羣公秩高庶尹縻爵稍久厚祿已淹正當戒滿歸盈鑒斯止足何乃規麴糵之潤競錐刀之末身昵酒徒家為逋藪若不糾繩何以肅厲有詔不治昉鬱鬱不得志時柱國梁士彥宇文忻俱失職忿望昉並與之交數相往士彥妻有美色昉因與私通士彥不之知也情好彌協遂相與謀反許推士彥為帝後事泄上窮治之昉自知不免默無所對下詔誅之曰朕君臨四海慈愛為心加以起自布衣入升皇極公卿之內非親則友位雖差等情皆舊人護短全長思覆育每殷勤戒約言無不盡天之曆數定於杳冥豈慮苞藏之心能為國家之害欲使其長守富貴不觸刑書故也上柱國郕國公梁士彥上柱國嵵國公宇文忻柱國舒國公劉昉等朕受命之初並展勤力酬勳報効榮高祿重待之既厚愛之實隆朝夕宴言備知朕意但心如溪壑志等豺狼不荷朝恩忽謀逆亂士彥爰始幼來自誣罔稱有相者云其應籙年過六十必據九五初平尉迥暫臨相州已有反心彰於行路朕即遣人代之不聲其罪入京之後逆意轉深忻昉之徒言相扶助士彥許率僮僕剋期不遠欲於蒲州起事即斷河橋捉黎陽之關塞河陽之路劫調布以為牟甲募盜賊而為戰士就食之人亦云易集輕忽朝廷嗤笑官人自謂一朝奮發無人當者其第二子剛每常苦諫第三子叔諧固深勸奬朕既聞知猶恐枉濫乃授晉部之任欲驗蒲州之情士彥得以欣然云是天贊忻及昉等皆賀時來忻往定鄴城自矜不已位極人臣猶恨賞薄云我欲反何慮不成怒色忿言所在流布朕深念其功不計其禮任以武候授以領軍寄之爪牙委之心腹忻密為異計樹黨宮闈多奏親友入參宿衞朕推心待物言必依許為而弗止心迹漸彰仍解禁兵令其改悔而志規不逞愈結於懷乃與士彥情意偏厚要請神明誓不負約俱營賊逆逢則交謀委彥河東自許關右蒲津之事即望從征兩軍結東西之旅一舉合連橫之勢然後北破晉陽還圖宗社昉入佐相府便為非法三度事發二度其婦自論常云姓是卯金刀名是一萬日劉氏應王為萬日天子朕訓之導之示其利害每加寬宥望其修改口請自新志存如舊亦與士彥情好深重逆節姦心盡探肝鬲嘗共士彥論太白所犯問東井之間思秦地之亂訪軒轅之𩹉願宮掖之災唯待蒲坂事興欲在關內應接殘賊之策千端萬緒惟忻及昉名位並高寧肯北面曲躬臣於士彥乃是各懷不遜圖成亂階一得擾攘之基方逞吞幷之事人之姦詐一至於此雖國有常刑罪在不赦朕載思草創咸著厥誠情用愍然未忍極法士彥忻昉身為謀首叔諧贊成父意義實難容並已處盡士彥忻昉兄弟叔姪特恕其命有官者除名士彥小男女忻母妻女及小男並放士彥叔諧妻妾及資財田宅忻昉妻妾及資財田宅悉沒官士彥昉兒年十五以上遠配上儀同薛摩兒是士彥交舊上柱國府戶曹參軍事裴石達是士彥府僚反狀逆心巨細皆委薛摩兒聞語仍相應和俱不申陳宜從大辟問即承引頗是恕心可除名免死朕握圖當籙六載於斯政事徒勤淳化未洽興言軫念良深歎憤臨刑至朝堂宇文忻見高熲向之叩頭求哀昉勃然謂忻曰事形如此何叩頭之有於是伏誅籍沒其家後數日上素服臨射殿盡取昉忻士彥三家資物置於前令百僚射取之以為鑒誡云鄭譯鄭譯字正義滎陽開封人也祖瓊魏太常父道邕周司空譯頗有學識兼知鍾律善騎射譯從祖開府文寬尚魏平陽公主則周太祖元后之妹也主無子太祖令譯後之由是譯少為太祖所親令與諸子遊集年十餘歲嘗詣相府司錄李長宗長宗於衆中戲之譯斂容謂長宗曰明公位望不輕瞻仰斯屬輒相玩狎無乃喪德也長宗甚異之文寬後誕二子譯復歸本生周武帝時起家給事中士拜銀青光祿大夫轉左侍上士與儀同劉昉侍帝側譯時喪妻帝命譯尚梁安固公主及帝親總萬機以為御正下大夫俄轉太子宮尹時太子多失德內史中大夫烏丸軌每勸帝廢太子而立秦王由是太子不自安其後詔太子西征吐谷渾太子乃陰謂譯曰秦王上愛子也烏丸軌上信臣也今吾此行得無扶蘇之事乎譯曰願殿下勉著仁孝無失子道而已勿為他慮太子然之既破賊譯以功最賜爵開國子邑三百戶後坐褻狎皇太子帝大怒除名為民太子復召之譯戲狎如初因言於太子曰殿下何時可得據天下太子悅而益昵之及帝崩太子嗣位是為宣帝超拜開府內史下大夫封歸昌縣公邑一千戶委以朝政俄遷內史上大夫進封沛國公邑五千戶以其子善願為歸昌公元琮為永安縣男又監國史譯頗專權時帝幸東京譯擅取官材自營私第坐是復除名為民劉昉數言於帝帝復召之顧待如初詔領內史事初高祖與譯有同學之舊譯又素知高祖相表有奇傾心相結至是高祖為宣帝所忌情不自安嘗在永巷私於譯曰久願出藩公所悉也敢布心腹少留意焉譯曰以公德望天下歸心欲求多福豈敢忘也謹即言之時將遣譯南征譯請元帥帝曰卿意如何譯對曰若定江東自非懿戚重臣無以鎮撫可令隋公行且為壽陽總管以督軍事帝從之乃下詔以高祖為揚州總管譯發兵俱會壽陽以伐陳行有日矣帝不悆遂與御正下大夫劉昉謀引高祖入受顧託既而譯宣詔文武百官皆受高祖節度時御正中大夫顏之儀與宦者謀引大將軍宇文仲輔政仲已至御坐譯知之遽率開府楊惠及劉昉皇甫績柳裘俱入仲與之儀見譯等愕然逡巡欲出高祖因執之於是矯詔復以譯為內史上大夫明日高祖為丞相拜譯柱國相府長史治內史上大夫事及高祖為大冢宰總百揆以譯兼領天官都府司會總六府事出入臥內言無不從賞賜玉帛不可勝計每出入以甲士從拜其子元璹為儀同時尉迥王謙司馬消難等作亂高祖逾加親禮俄而進位上柱國恕以十死譯性輕險不親職務而贓貨狼籍高祖陰疎之然以其有定策功不忍廢放陰勑官屬不得白事於譯譯猶坐廳事無所關預譯懼頓首求解職高祖寬諭之接以恩禮及上受禪以上柱國公歸第賞賜豐厚進子元璹爵城臯郡公邑二千戶元珣永安男追贈其父及亡兄二人並為刺史譯自以被疎陰呼道士章醮以祈福助其婢奏譯厭蠱左道上謂譯曰我不負公此何意也譯無以對譯又與母別居為憲司所劾由是除名下詔曰譯嘉謀良策寂爾無聞鬻獄賣官沸騰盈耳若留之於世在人為不道之臣戮之於朝入地為不孝之鬼有累幽顯無以置之宜賜以孝經令其熟讀仍遣與母共居未幾詔譯參撰律令復授開府隆州刺史請還治疾有詔徵之見於醴泉宮上賜宴甚歡因謂譯曰貶退已久情相矜愍於是復爵沛國公位上柱國上顧謂侍臣曰鄭譯與朕同生共死間關危難興言念此何日忘之譯因奉觴上壽上令內史令李德林立作詔書高熲戲謂譯曰筆乾譯答曰出為方岳杖策言歸不得一錢何以潤筆上大笑未幾詔譯參議樂事譯以周代七聲廢缺自大隋受命禮樂宜新更修七始之義名曰樂府聲調凡八篇奏之上嘉美焉俄遷岐州刺史在職歲餘復奉詔定樂於太常前後所論樂事語在音律志上勞譯曰律令則公定之音樂則公正之禮樂律令公居其三良足美也於是還岐州開皇十一年以疾卒官時年五十二上遣使弔祭焉諡曰達子元璹嗣煬帝初立五等悉除以譯佐命元功詔追改封譯莘公以元璹襲元璹初為驃騎將軍後轉武賁郎將數以軍功進位右光祿大夫遷右候衞將軍大業末出為文城太守及義兵起義將張倫略地至文城元璹以城歸之柳裘柳裘字茂和河東解人齊司空世隆之曾也祖惔梁尚書左僕射父明太子舍人義興太守裘少聰慧弱冠有令名在梁仕歷尚書郎駙馬都尉梁元帝為魏軍所逼遣裘請和於魏俄而江陵陷遂入關中周明武間自麟趾學士累遷太子侍讀封昌樂縣侯後除天官府都上士宣帝即位拜儀同三司進爵為公轉御飾大夫及帝不悆留侍禁中與劉昉韋皇甫績同謀引高祖入總萬機高祖固讓不許裘進曰時不可再機不可失今事已然宜早定大計天與不取反受其咎如更遷延恐貽後悔高祖從之進位上開府拜內史大夫委以機密及尉迥作亂天下騷動幷州總管李穆頗懷猶豫高祖令裘往喻之裘見穆盛陳利害穆甚悅遂歸心於高祖後以奉使功賜綵三百匹金九環帶一腰時司馬消難阻兵安陸又令喻之未到而消難奔陳高祖即令裘隨便安集淮南賜馬及雜物開皇元年進位大將軍拜許州刺史在官清簡吏民懷之復轉曹州刺史其後上思裘定策功欲加榮秩將徵之顧問朝臣曰曹州刺史何當入朝或對曰即今冬也帝乃止裘尋卒高祖傷惜者久之諡曰安子惠童嗣皇甫績韋皇甫績字功明安定朝那人也祖穆魏隴東太守父道周湖州刺史雍州都督績三歲而孤為外祖韋孝寬所鞠養嘗與諸外兄博奕孝寬以其惰業督以嚴訓愍績孤幼特捨之績歎曰我無庭訓養於外氏不能剋躬勵己何以成立深自感激命左右自杖三十孝寬聞而對之流涕於是精心好學略涉經史周武帝為魯公時引為侍讀建德初轉宮尹中士武帝嘗避暑雲陽宮時宣帝為太子監國衞剌王作亂城門已閉百僚多有遁者績聞難赴之於玄武門遇皇太子太子下樓執績手悲喜交集帝聞而嘉之遷小宮尹宣政初錄前後功封義陽縣男拜畿伯下大夫累轉御正下大夫宣帝崩高祖總己績有力焉語在鄭譯傳加位上開府轉內史中大夫進封郡公邑千戶尋拜大將軍開皇元年出為豫州刺史增邑通前二千五百戶尋拜都官尚書後數載轉晉州刺史將之官稽首而言曰臣實庸鄙無益於國每思犯難以報國恩今偽陳尚存以臣度之有三可滅上問其故績答曰大吞小一也以有道伐無道二也納叛臣蕭巖於我有詞三也陛下若命鷹揚之將臣請預戎行展絲髮之効上嘉其壯志勞而遣之及陳平拜蘇州刺史高智慧等作亂江南州民顧子元發兵應之因以攻績相持八旬子元素感績恩於冬至日遣使奉牛酒績遺子元書曰皇帝握符受籙合極通靈受揖讓於唐虞棄干戈於湯武東踰蟠木方朔所未窮西盡流沙張騫所不至玄漠黃龍之外交臂來王葱嶺榆關之表屈膝請吏曩者偽陳獨阻聲教江東士民困於荼毒皇天輔仁假手朝廷聊申薄伐應時瓦解金陵百姓死而復生吳會臣民白骨還肉唯當懷音感德行歌擊壤豈宜自同吠主翻成反噬卿非吾民何須酒禮吾是隋將何容外交易子析骸未能相告況是足食足兵高城深塹坐待強援綽有餘力何勞踵輕敝之俗作虛偽之辭欲阻誠臣之心徒惑驍雄之志以此見期必不可得卿宜善思活路曉諭黎元能早改迷失道非遠子元得書於城下頓首陳謝楊素援兵至合擊破之拜信州總管十二州諸軍事俄以病乞骸骨詔徵還京賜以御藥中使相望顧問不絕卒於家時年五十二諡曰安子偲嗣大業之世官至尚書主爵郎韋者京兆人也仕周內史大夫高祖以有定策之功累遷上柱國封普安郡公開皇初卒於蒲州刺史盧賁盧賁字子徵涿郡范陽人也父光周開府燕郡公賁略涉書記頗解鍾律周武帝時襲爵燕郡公邑一千九百戶後歷魯陽太守太子小宮尹儀同三司平齊有功增邑四百戶轉司武上士時高祖為大司武賁知高祖為非常人深自推結宣帝嗣位加開府及高祖初被顧託羣情未一乃引賁置於左右高祖將之東第百官皆不知所去高祖潛令賁部伍仗衞因召公卿而謂曰欲求富貴者當相隨來往往偶語欲有去就賁嚴兵而至衆莫敢動出崇陽門至東宮門者拒不內賁諭之不去瞋目叱之門者遂却既而高祖得入賁典宿衞後承問進說曰周歷已盡天人之望實歸明公願早應天順民也天與不取反受其咎高祖甚然之及受禪命賁清宮因典宿衞賁於是奏改周代旗幟更為嘉名其青龍騶虞朱雀玄武千秋萬歲之旗皆賁所創也尋拜散騎常侍兼太子左庶子左領軍右將軍時高熲蘇威共掌朝政賁甚不平之柱國劉昉時被疏忌賁因諷昉及上柱國元諧李詢華州刺史張賓等謀黜熲威五人相與輔政又以晉王上之愛子謀行廢立復私謂皇太子曰賁將數謁殿下恐為上所譴願察區區之心謀泄上窮治其事昉等委罪於賓賁公卿奏二人坐當死上以龍潛之舊不忍加誅並除名為民賓未幾卒歲餘賁復爵位檢校太常卿賁以古樂宮懸七八損益不同歷代通儒議無定準於是上表曰殷人以上通用五音周武克殷得鶉火天駟之應其音用七漢興加應鍾故十六枚而在一簴鄭玄注周禮二八十六為簴此則七八之義其來遠矣然世有沿革用捨不同至周武帝復改懸七以林鍾為宮夫樂者治之本也故移風易俗莫善於樂是以吳札觀而辯興亡然則樂也者所以動天地感鬼神情發於聲治亂斯應周武以林鍾為宮蓋將亡之徵也且林鍾之管即黃鍾下生之義黃鍾君也而生於臣明為皇家九五之應又陰者臣也而居君位更顯國家登極之祥斯實冥數相符非關人事伏惟陛下握圖御宇道邁前王功成作樂煥乎曩策臣聞五帝不相沿樂三王不相襲禮此蓋隨時改制而不失雅正者也上竟從之即改七懸八以黃鍾為宮詔賁與儀同楊慶和刪定周齊音律未幾拜郢州刺史尋轉虢州刺史後遷懷州刺史決沁水東注名曰利民渠又派入溫縣名曰溫潤渠以溉舄鹵民賴其利後數年轉齊州刺史民飢穀米踴貴閉人糶而自糶之坐是除名為民後從幸洛陽上從容謂賁曰我始為大司馬時卿以布腹心於我及總百揆頻繁左右與卿足為恩舊卿若無過者位與高熲齊坐與凶人交構由是廢黜言念疇昔之恩復當牧伯之位何乃不思報効以至於此吾不忍殺卿是屈法申私耳賁俯伏陳謝詔復本官後數日對詔失旨又自功績有怨言上大怒顧謂羣臣曰吾將與賁一州觀此不可復用後皇太子為其言曰此輩並有佐命之功雖性行輕險誠不可棄上曰我抑屈之全其命也微劉昉鄭譯及賁柳裘皇甫績等則我不至此然此等皆反覆子也當周宣帝時以無賴得幸及帝大漸顏之儀等請以宗王輔政此輩行詐顧命於我我將為治又欲亂之故昉謀大逆於前譯為巫蠱於後如賁之徒皆不滿志任之則不遜致之則怨自難信也非我棄之衆人見此或有竊議謂我薄於功臣斯不然矣蘇威進曰漢光武欲全功臣皆以列侯奉朝請至尊仁育復用此道以安之上曰然遂廢於家是歲卒年五十四史臣曰高祖肇基王業昉譯實啟其謀當軸執鈞物無異論不能忘身急病以義斷恩方乃慮難求全偷安懷祿暨夫帝遷明德義非簡在鹽梅之寄自有攸歸言追昔款內懷觖望恥居吳耿之末羞與絳灌為伍事君盡禮既闕於宿心不愛其親遽彰於物議其在周也靡忠貞之節其奉隋也愧竭命之誠非義掩其前功畜怨興其後釁而望不陷刑辟保貴全生難矣柳裘皇甫績盧賁因人成事協規不二大運光啟莫參樞要斯固在人欲其悅己在我欲其罵人理自然也晏嬰有言一心可以事百君百心不可以事一君於昉譯見之矣

body:
  text: 隋書卷十四志第九音樂中齊神武霸跡肇創遷都于鄴猶曰人臣故咸遵魏典及文宣初禪尚未改舊章宮懸各設十二鎛鍾於其辰位四面並設編鍾磐各一簨簴合二十架設建鼓於四隅郊廟朝會同用之其後將有創革尚藥典御祖珽自言舊在洛下曉知舊樂上書曰魏氏來自雲朔肇有諸華樂操土風未移其俗至道武帝皇始元年破慕容寶于中山獲晋樂器不知采用皆委棄之天興初吏部郎鄧彥海奏上廟樂創制宮懸而鍾管不備樂章既闕雜以簸邏迴歌初用八佾作皇始之舞至太武帝平河西得沮渠蒙遜之伎賓嘉大禮皆雜用焉此聲所興蓋苻堅之末呂光出平西域得胡戎之樂因又改變雜以秦聲所謂秦漢樂也至永熙中錄尚書長孫承業共臣先人太常卿瑩等斟酌繕修戎華兼采至於鍾律煥然大備自古相襲損益可知今之創制請以為準珽因采魏安豐王延明及信都芳等所著樂說而定正聲始具宮懸之器仍雜西涼之曲樂名廣成而舞不立號所謂洛陽舊樂者也武成之時始定四郊宗廟三朝之樂羣臣入出奏肆夏牲入出薦毛血並奏昭夏迎送神及皇帝初獻禮五方上帝並奏高明之樂為覆壽之舞皇帝入壇門及升壇飲福酒就燎位還便殿並奏皇夏以高祖配饗奏武德之樂為昭烈之舞祼地奏登歌其四時祭廟及禘祫皇六世祖司空五世祖吏部尚書高祖秦州刺史曾祖太尉武貞公祖文穆皇帝諸神室並奏始基之樂為恢祚之舞高祖神武皇帝神室奏武德之樂為昭烈之舞文襄皇帝神室奏文德之樂為宣政之舞顯祖文宣皇帝神室奏文正之樂為光大之舞肅宗孝昭皇帝神室奏文明之樂為休德之舞其入出之儀同四郊之禮今列其辭云大禘圜丘及北郊歌辭夕牲羣臣入門奏肆夏樂辭肇應靈序奄字黎人乃朝萬國爰徵百神祗展方望幽顯咸臻禮崇聲協贄列珪陳翼差鱗次端笏垂紳來趨動色式贊天人迎神奏高明樂辭登歌辭同惟神監矣北郊云惟祗監矣皇靈肅止圓璧展事北郊云方琮展事成文即始北郊云即陰成理士備八能樂合六變北郊云樂合八變風湊伊雅光華襲薦宸衞騰景靈駕霏煙嚴壇生白綺席凝玄牲出入奏昭夏辭剛柔設位惟皇配之言肅其禮念暢在茲飾牲舉獸載歌且舞既捨伊腯致精靈府物色惟典齋沐加恭宗族咸暨罔不率從薦毛血奏昭夏辭羣臣出奏肆夏進熟羣臣入奏肆夏辭同初入展禮上月肅事應時繭栗為用交暢有期弓矢斯發盆簝將事圓神致祀北郊云方祇致祀率由先志和以鑾刀臭以血膋致哉敬矣厥義孔高進熟皇帝入門奏皇夏辭帝敬昭宣皇誠肅致玉帛齊軌屏攝咸次三垓上列北郊云重垓上列四陛旁升北郊云分陛旁升龍陳萬騎鳳動千乘神儀天藹睟容離曜金根停軫奉光先導皇帝升丘奏皇夏辭壇上登歌辭同紫壇雲曖北郊云層壇雲曖紺幄霞褰北郊云嚴幄霞褰我其陟止載致其虔百靈竦聽萬國咸仰人神咫尺玄應肸蠁皇帝初獻奏高明樂辭上下眷旁午從爵以質獻以恭咸斯暢樂惟雍孝敬闡臨萬邦皇帝奠爵訖奏高明樂覆燾之舞辭自天子之會昌神道丘陵肅事北郊云方澤祗事克光天保九關洞開百靈環列八樽呈備五聲投節皇帝獻太祖配饗神座奏武德之樂昭烈之舞辭皇帝小退當昊天上帝神座前奏皇夏辭同上皇夏配神登聖主極尊靈敬宣昭燭咸達窅冥禮弘化定樂贊功成穰穰介福下被羣生皇帝飲福酒奏皇夏之樂皇帝詣東陛還便坐又奏皇夏辭同初入門皇心緬且感吉蠲奉至誠赫哉光盛德乾峍詔百靈報福歸昌運承祐播休明風雲馳九域龍蛟躍四溟浮幕呈光氣儷象燭華精護武方知恥韶夏僅同聲送神降丘南陛奏高明樂辭皇帝之望燎位又奏皇夏辭同上皇夏獻享畢懸佾周神之駕將上遊北郊云將下遊超斗極北郊云超荒極絕河流北郊云崑丘懷萬國寧九州欣帝道心顧留帀上下荷皇休紫壇既燎奏昭夏樂辭皇帝自望燎還本位奏皇夏辭同上皇夏玄黃覆載元首照臨合德致禮有契其心敬申事闋潔誠云報玉帛載升北郊云牲玉載陳棫樸斯燎寥廓幽曖播以馨香皇靈惟監降福無疆皇帝還便殿奏皇夏辭羣臣出奏肆夏辭同上肆夏祠感帝用圜丘辭天大親嚴匪敬伊孝永言肆饗宸明增耀陽丘既暢北郊云陰澤云暢大典逾光乃安斯息欽若舊章天迴地旋鳴鑾引警且萬且億皇曆惟永五郊迎氣樂辭青帝降神奏高明樂辭歲云獻谷風歸斗東指雁北飛電鞭激雷車遽虹旌靡青龍馭和氣洽具物滋翻降止應帝期赤帝降神奏高明樂辭婺女司旦中呂宣朱精御節離景延根荄俊茂溫風發柘火風水應炎月執衡長物德孔昭赤旂霞曳會今朝黃帝降神奏高明樂辭居中帀五運乘衡畢四時含養資羣物協德固皇基嘽緩契王風持載符君德良辰動靈駕承祀昌邦國白帝降神奏高明樂辭風凉露降馳景颺寒精山川搖落平秩在西成蓋藏成積蒸人被嘉祉從享來儀鴻休溢千祀黑帝降神奏高明樂辭虹藏雉化告寒冰壯地坼年殫日次月紀方極九州萬邦獻力協光是紀歲窮微陽潛兆方融天子赫赫明聖享神降福惟敬祠五帝於明堂樂歌辭先祀一日夕牲羣官入自門奏肆夏國陽崇祀嚴恭有聞荒華胥暨樂我大君冕瑞有列禽帛恭叙羣后師師威儀容與執禮辨物司樂考章率由靡墜休有烈光太祝令迎神奏高明樂覆燾舞辭祖德光國圖昌祗上帝禮四方闢紫宮洞華闕龍獸奮風雲發飛朱雀從玄武攜日月帶雷雨耀宇內溢區中眷帝道感皇風帝道康皇風扇粢盛列椒糈薦神且寧會五精歸福祿幸閭亭太祖配饗奏武德樂昭烈舞辭五方天帝奏高明之樂覆燾之舞辭同迎氣我惟我祖自天之命道被歸仁時屯啟聖運鍾千祀授手萬姓夷兇掩虐匡頹翼正載經載營庶士咸寧九功以洽七德兼盈丹書入告玄玉來呈露甘泉白雲郁河清聲教咸往舟車畢會仁加有形化洽無外嚴親惟重陟配惟大既祐斯歌率土攸賴牲出入奏昭夏樂辭孝饗不匱精潔臨年滌牢委溢形色博牷于以用之言承歆祀肅肅威儀敢不敬止載飾載省維牛維羊明神有察保茲萬方薦血毛奏昭夏辭羣臣出奏肆夏進熟羣臣入奏肆夏同上肆夏辭我將宗祀夤獻厥誠鞠躬如在側聽無聲薦色斯純呈氣斯臭有滌有濯惟神其祐五方來格一人多祉明德惟馨於穆不已進熟皇帝入門奏皇夏辭皇帝升壇奏皇夏辭同象乾上構儀峍下基集靈崇祖永言孝思室陳簋豆庭羅懸佾夙夜畏威保茲貞吉舞貴其夜歌重其升降斯百祿惟響惟應皇帝初獻奏高明樂覆燾舞辭度几筵闢牖戶禮上帝感皇祖酌惟潔滌以清薦心款達神明皇帝祼獻奏高明樂覆燾舞辭帝精來降應我明德禮殫義展流祉邦國既受多祉實資孝敬祀竭其誠荷天休命皇帝飲福酒奏皇夏辭恭祀洽盛禮宣英猷爛層景廣澤同深泉上靈鍾百福羣神歸萬年月軌咸梯岫日域盡浮川瑞鳥飛玄扈潛鱗躍翠漣皇家膺寶曆兩地復參天太祝送神奏高明樂覆燾舞辭青陽奏發朱明歌西皓唱玄冥大禮罄廣樂成神心懌將遠征飾龍駕矯鳳旍指閶闔層城出溫谷邁炎庭跨西汜過北溟忽萬億耀光精比電騖與雷行嗟皇道懷萬靈固王業震天聲皇帝還便殿奏皇夏辭文物備矣聲明有章登薦唯肅禮邈前王鬯齊云終折旋告罄穆穆旒冕蘊誠畢敬屯衞按部鑾蹕迴途暫留紫殿將及清都享廟樂辭先祀一日夕牲羣臣入奏肆夏辭霜凄雨暢烝哉帝心有敬其祀肅事惟歆昭昭車服濟濟衣簪鞠躬貢酎磬折奉琛差以五列和以八音式祗王度如玉如金迎神奏高明登歌樂辭日卜惟吉辰擇其良奕奕清廟黼黻周張大呂為角應鍾為羽路鼗陰竹德歌昭舞祀事孔明百神允穆神心乃顧保茲介福牲出入奏昭夏樂辭大祀云事獻奠有儀既歌既展贊顧迎犧執從伊竦芻飾惟慄俟用於庭將升於室且握且騂以致其誠惠我貽頌降祉千齡薦血毛奏昭夏辭三公出奏肆夏進熟羣臣入奏肆夏辭同愐彼遐慨悠然永思留連七享纏綿四時神升魄沈靡聞靡見陰陽載俟臭聲兼薦祖考其鑒言萃王休降神敷錫百福是由進熟皇帝入北門奏皇夏樂辭齊居嚴殿夙駕層闈車輅垂彩旒袞騰輝聳誠載仰翹心有慕洞洞自形斤斤表步閟宮有邃神道依俙孝心緬邈爰屬爰依太祝祼地奏登歌樂辭皇帝詣東陛奏皇夏升殿又奏皇夏辭同太室窅窅神居宿設鬱鬯惟芬珪璋惟潔彝斝應時龍蒲代用藉茅無咎福祿攸降端感會事儼思修禮齊齊勿勿俄俄濟濟皇帝升殿殿上作登歌樂辭我祠我祖永惟厥先炎農肇聖靈祉蟬聯霸圖中造帝業方宣道昌基構撫運承天奄家六合爰光八埏尊神致禮孝思惟纏寒來暑反惕薦在年匪敬伊慕備物不愆設簴設業鞉鼓填填辟公在位有容伊虔登歌啟佾下管應懸厥容無爽幽明肅然誠帀厚地和達穹玄既調風雨載協山川周庭有列湯孫永延教聲惟被邁後光前皇帝初獻皇祖司空公神室奏始基樂恢祚舞辭克明克俊祖武惟昌業弘營土聲被海方有流厥德終耀其光明神幽贊景祚攸長皇帝初獻皇祖吏部尚書神室奏始基樂恢祚舞辭顯允盛德隆我前構瑤源彌瀉瓊根愈秀誕惟有族丕緒克茂大業崇新洪基增舊皇帝初獻皇祖秦州使君神室奏始基樂恢祚舞辭祖德丕顯明哲知機豹變東國鵲起西歸禮申官次命改朝衣敬思孝享多福無違皇帝獻太祖太尉武貞公神室奏始基樂恢祚舞辭兆靈有業潛德無聲韜光戢耀貫幽洞冥道弘舒卷施博藏行緬追歲事夜遽不寧皇帝獻皇祖文穆皇帝神室奏始基樂恢祚舞辭皇皇祖德穆穆其風語默自已明叡在躬荷天之錫聖表克隆高山作矣寶祚其崇離光旦旦載煥載融感薦惟永神保無窮皇帝獻高祖神武皇帝神室奏武德樂昭烈舞辭天造草昧時難糾紛孰拯斯溺靡救其焚大人利見緯武經文顧指惟極吐吸風雲開天闢地峻岳夷海冥工掩迹上德不宰神心有應龍化無待義征九服仁兵告凱上平下成靡或不寧匪王伊帝偶極崇靈享親則孝潔祀惟誠禮備樂序肅贊神明皇帝獻文襄皇帝神室奏文德樂宣政舞辭聖武丕基叡文顯統眇哉神啟鬱矣天縱道則人弘德云邁種昭冥咸叙崇深畢綜自中徂外經朝庇野政反淪風威還缺雅旁作穆穆格于上下維享維宗來鑒來假皇帝獻顯祖文宣皇帝奏文正樂光大舞辭玄曆已謝蒼靈告期圖璽有屬揖讓惟時龍升獸變弘我帝基對揚穹昊實啟雍熙欽若皇猷永懷王度欣賞斯穆威刑允措軌物俱宣憲章咸布俗無邪指下歸正路茫茫九域振以乾綱混通華裔配括天壤作禮視德列樂傳響薦祀惟虔衣冠載仰皇帝還東壁飲福酒奏皇夏樂辭孝心翼翼率禮兢兢時洗時薦或降或升在堂在戶載湛載凝多品斯奠備物攸膺蘭芬敬挹玉俎恭承受祭之祜知彼岡陵送神奏高明樂辭仰榱桷慕衣冠禮云罄祀將闌神之駕紛奕奕乘白雲無不適窮昭域極幽塗歸帝祉眷皇都皇帝詣便殿奏皇夏樂辭羣官出奏肆夏辭同禮行斯畢樂奏以終受嘏先退載暢其衷鑾軒循轍麾旌復路光景徘徊絃歌顧慕靈之相矣有錫無疆國圖日競家曆天長元會大饗協律不得升陛黃門舉麾於殿上今列其歌辭云賓入門四箱奏肆夏辭昊蒼眷命興王統天業高帝始道邈皇先禮成化穆樂合風宣賓朝荒夏揚對穹玄皇帝出閤奏皇夏樂辭夏正肇旦周物充庭具僚在位俛伏無聲大君穆穆宸儀動睟日煦天迴萬靈胥萃皇帝當扆羣臣奉賀奏皇夏辭天子南面乾覆離明三千咸列萬國填幷猶從禹會如次湯庭奉茲一德上下和平皇帝入宁變服黃鍾太簇二箱奏皇夏辭我應天曆四海為家協同內外混一戎華鶴蓋龍馬風乘雲車夏章夷服其會如麻九賓有儀八音有節肅肅於位飲和在列四序氤氳三光昭晣君哉大矣軒唐比轍皇帝變服移幄坐於西箱帝出升御坐姑洗奏皇夏辭皇運應籙廓定區宇受終以文構業以武堯昔命舜舜亦命禹大人馭歷重規沓矩欽明在上昭納入夤從靈體極誕聖窮神化生羣品陶育蒸人展禮肆樂協此元春王公奠璧奏肆夏辭萬方咸暨三揖以申垂旒馮玉五瑞交陳拜稽有章升降有節聖皇負扆虞唐比烈上壽黃鍾箱奏上壽曲辭仰三光奏萬壽人皇御六氣天地同長久皇太子入至坐位酒至御殿上奏登歌辭大齊統曆道化光明馬圖呈寶龜籙告靈百蠻非衆八荒非逖同作堯人俱包禹迹其一天覆地載成以四時惟皇是則比大於茲羣星拱極衆川赴海萬宇駿奔一朝咸在其二齊之以禮相趨帝庭應規蹈矩玉色金聲動之以樂和風四布龍申鳳舞鸞歌麟步其三食至御前奏食舉樂辭三端正啟萬方觀禮具物充庭二儀合體百華照曉千門洞晨或華或裔奉贄惟新悠悠亘六丘員首莫不臣仰施如雨晞和猶春風化表笙鏞歌謳被琴瑟誰言文軌異今朝混為一其一彤庭爛景丹陛流光懷黃綰白鵷鷺成行文贊百揆武鎮四方折衝鼓雷電獻替協陰陽大矣哉道邁上皇陋五帝狹三王窮禮物該樂章序冠帶垂衣裳其二天壤和家國穆悠悠萬類咸孕育契冥化侔大造靈効珍神歸寶興雲氣飛龍蒼麟一角鳳五光朱雀降黃玉表九尾馴三足擾化之定至矣哉瑞感德四方來其三囹圄空水火菽粟求賢振滯棄珠玉衣不靡宮以卑當陽端默垂拱無為云云萬有其樂不訾其四嗟此舉時逢至道肖形咸自持賦命無傷夭行氣進皇輿遊龍服帝皁聖主寧區宇乾坤永相保其五牧野征鳴條戰大齊家萬國拱揖應終禪奧主廓清都大君臨赤縣高居深視當扆正殿旦暮之期今一見其六兩儀分牧以君陶有象化無垠大齊德邈誰羣超鳳火冠龍雲露以潔風以薰榮光至氣氤氳其七神化遠人靈協寒暑調風雨燮披泥檢受圖諜圖諜啟期運昌分四序綴三光延寶祚眇無疆其八惟皇道升平日河水清海不溢雲干呂風入律驅黔首入仁壽與天高並地厚其九刑以厝頌聲揚皇情邈眷汾襄岱山高配林壯亭亭聳云云望斾葳蕤駕騤騤刊金闕奠玉龜其十文舞將作先設階步辭我后降德肇峻皇基搖鈴大號振鐸命期雲行雨洽天臨地持茫茫區宇萬代一時文來武肅成定於茲象容則舞歌德言詩鏘鏘金石列列匏絲鳳儀龍至樂我雍熙文舞辭皇天有命歸我大齊受茲華玉爰錫玄珪奄家環海實子蒸黎圖開寶匣檢封芝泥無思不順自東徂西教南暨朔罔敢或攜比日之明如天之大神化斯洽率土無外眇眇舟車華戎畢會祠我春秋服我冠帶儀協震象樂均天籟蹈武在庭其容藹藹武舞將作先設階步辭大齊統曆天鑒孔昭金人降汎火鳳來巢眇均虞德干戚降苗夙沙攻主歸我軒朝禮符揖讓樂契咸韶蹈揚惟序律度時調武舞辭天眷橫流宅心玄聖祖功宗德重光襲映我皇恭己誕膺靈命宇外斯燭域中咸鏡悠悠率土時惟保定微微動植莫違其性仁豐庶物施洽羣生海寧洛變契此休明雅宣茂烈頌紀英聲鏗鍠鍾鼓掩抑簫笙歌之不足舞以禮成鑠矣王度緬邁千齡皇帝入鍾鼓奏皇夏辭禮終三爵樂奏九成允也天子穹壤和平載色載笑反寢宴息一人有祉百神奉職鼓吹二十曲皆改古名以叙功德第一漢朱鷺改名水德謝言魏謝齊興也第二漢思悲翁改名出山東言神武帝戰廣阿創大業破尒朱兆也第三漢艾如張改名戰韓陵言神武滅四胡定京洛遠近賓服也第四漢上之回改名殄關隴言神武遣侯莫陳悅誅賀拔岳定關隴平河外漠北款秦中附也第五漢擁離改名滅山胡言神武屠劉蠡升高車懷殊俗蠕蠕來向化也第六漢戰城南改名立武定言神武立魏主天下既安而能遷於鄴也第七漢巫山高改名戰芒山言神武斬周十萬之衆其軍將脫身走免也第八漢上陵改名擒蕭明言梁遣兄子貞陽侯來寇彭宋文襄帝遣太尉清河王岳一戰擒殄俘馘萬計也第九漢將進酒改名破侯景言文襄遣清河王岳摧殄侯景克復河南也第十漢君馬黃改名定汝潁言文襄遣清河王岳擒周大將軍王思政於長葛汝潁悉平也第十一漢芳樹改名克淮南言文襄遣清河王岳南翦梁國獲其司徒陸法和克壽春合肥鍾離淮陰盡取江北之地也第十二漢有所思改名嗣丕基言文宣帝統纘大業也第十三漢稚子班改名聖道洽言文宣克隆堂構無思不服也第十四漢聖人出改名受魏禪言文宣應天順人也第十五漢上邪改名平瀚海言蠕蠕盡部落入寇武州之塞而文宣命將出征平殄北荒滅其國也第十六漢臨高臺改名服江南言文宣道洽無外梁主蕭繹來附化也第十七漢遠如期改名刑罰中言孝昭帝舉直措枉獄訟無怨也第十八漢石留行改名遠夷至言時主化霑海外西夷諸國遣使朝貢也第十九漢務成改名嘉瑞臻言時主應期河清龍見符瑞總至也第二十漢玄雲改名成禮樂言時主功成化洽制禮作樂也古又有黃雀釣竿二曲略而不用並議定其名被於鼓吹諸州鎮戍各給鼓吹樂多少各以大小等級為差諸王為州皆給赤鼓赤角皇子則增給吳鼓長鳴角上州刺史皆給青鼓青角中州已下及諸鎮戍皆給黑鼓黑角樂器皆有衣並同鼓色雜樂有西涼鼙舞清樂龜茲等然吹笛彈琵琶五絃及歌舞之伎自文襄以來皆所愛好至河清以後傳習尤盛後主唯賞胡戎樂耽愛無已於是繁手淫聲爭新哀怨故曹妙達安未弱安馬駒之徒至有封王開府者遂服簪纓而為伶人之事後主亦自能度曲親執樂器悅玩無惓倚絃而歌別採新聲為無愁曲音韻窈窕極於哀思使胡兒閹官之輩齊唱和之曲終樂闋莫不殞涕雖行幸道路或時馬上奏之樂往哀來竟以亡國周太祖迎魏武入關樂聲皆闕恭帝元年平荊州大獲梁氏樂器以屬有司及建六官乃詔曰六樂尚矣其聲歌之節舞蹈之容寂寥已絕不可得而詳也但方行古人之事可不本於茲乎自宜依準制其歌舞祀五帝日月星辰於是有司詳定郊廟祀五帝日月星辰用黃帝樂歌大呂舞雲門祭九州社稷水旱雩禜用唐堯樂歌應鍾舞大咸祀四望饗諸侯用虞舜樂歌南呂舞大韶祀四類幸辟雍用夏禹樂歌函鍾舞大夏祭山川用殷湯樂歌小呂舞大護享宗廟用周武王樂歌夾鍾舞大武皇帝出入奏皇夏賓出入奏肆夏牲出入奏昭夏蕃國客出入奏納夏有功臣出入奏章夏皇后進羞奏深夏宗室會聚奏族夏上酒宴樂奏陔夏諸侯相見奏驁夏皇帝大射歌騶虞諸侯歌狸首大夫歌采蘋士歌采蘩雖著其文竟未之行也及閔帝受禪居位日淺明帝踐阼雖革魏氏之樂而未臻雅正天和元年武帝初造山雲舞以備六代南北郊雩壇太廟禘祫俱用六舞南郊則大夏降神大護獻熟次作大武正德武德山雲之舞北郊則大護降神大夏獻熟次作大武正德武德山雲之舞雩壇以大武降神正德獻熟次作大夏大護武德山雲之舞太廟祫禘則大武降神山雲獻熟次作正德大夏大護武德之舞時享太廟以山雲降神大夏獻熟次作武德之舞拜社以大護降神大武獻熟次作正德之舞五郊朝日以大夏降神大護獻熟神州夕月籍田以正德降神大護獻熟建德二年十月甲辰六代樂成奏於崇信殿羣臣咸觀其宮懸依梁三十六架朝會則皇帝出入奏皇夏皇太子出入奏肆夏王公出入奏驁夏五等諸侯正日獻玉帛奏納夏宴族人奏族夏大會至尊執爵奏登歌十八曲食舉奏深夏舞六代大夏大護大武正德武德山雲之舞於是正定雅音為郊廟樂創造鍾律頗得其宜宣帝嗣位郊廟皆循用之無所改作今採其辭云員丘歌辭降神奏昭夏重陽禋祀大報天丙午封壇肅且圜孤竹之管雲和弦神光未下風肅然王城七里通天臺紫微斜照影徘徊連珠合璧重光來天策暫轉鉤陳開皇帝將入明奏皇夏旌迴外壝蹕靜郊門千乘按轡萬騎雲屯藉茅無咎掃地惟尊揖讓展禮衡璜節步星漢就列風雲相顧取法於天降其永祚俎入奏昭夏日至大禮豐犧上辰牲牢修牧繭栗毛純俎豆斯立陶匏以陳大報反命居陽兆日六變鼓鍾三和琴瑟俎奇豆偶惟誠惟質奠玉帛奏昭夏員玉已奠蒼幣斯陳瑞形成象璧氣含春禮從天數智總員神為祈為祀至敬咸遵皇帝升壇奏皇夏七星是仰八陛有憑就陽之位如日之升思虔肅肅施敬繩繩祝史陳信玄象斯格惟類之典惟靈之澤幽顯對揚人神咫尺皇帝初獻作雲門之舞獻以誠鬱以清山罍舉沈齊傾惟尚饗洽皇情降景福通神明皇帝初獻配帝作雲門之舞長丘遠歷大電遙源弓藏高隴鼎沒寒門人生于祖物本於天尊神配德迄用康年皇帝初獻及獻配帝畢奏登歌歲之祥國之陽蒼靈敬翠雲長象為飾龍為章乘長日坯蟄戶列雲漢迎風雨大呂歌雲門舞省滌濯奠牲牷鬱金酒鳳凰樽迴天眷顧中原皇帝飲福酒奏皇夏國命在禮君命在天陳誠惟肅飲福惟虔洽斯百禮福以千年鈎陳掩映天駟徘徊彫禾飾斝翠羽承罍受斯茂祉從天之來撤奠奏雍樂禮將畢樂將闌迴日轡動天關翠鳳搖和鑾響五雲飛三步上風為馭雷為車無轍迹有煙霞暢皇情休靈命雨留甘雲餘慶帝就望燎位奏皇夏六典聯事九司咸則率由舊章於焉允塞掌禮移次燔柴在焉煙升玉帛氣斂牲牷休氣馨香膋芳昭晣翼翼虔心明明上徹帝還便座奏皇夏玉帛禮畢人神事分嚴承乃眷瞻仰迴雲輦路千門王城九軌式道移候司方迴指得一惟清於萬斯寧受茲景命于天告成方澤歌辭降神奏昭夏報功陰澤展禮玄郊平琮鎮瑞方鼎升庖調歌絲竹縮酒江茅聲舒鍾鼓器質陶匏列耀秀華凝芳都荔川澤茂祉丘陵容衞雲飾山罍蘭浮汎齊日至之禮歆茲大祭奠玉奏昭夏曰若厚載欽明方澤敢以敬恭陳之玉帛德包含養功藏靈迹斯箱既千子孫則百初獻奏登歌辭舞詞同員丘質明孝敬求陰順陽壇有四陛琮為八方牲牷蕩滌蕭合馨香和鑾戾止振鷺來翔威儀簡簡鍾鼓喤喤聲和孤竹韻入空桑封中雲氣坎上神光下元之主功深蓋藏望坎位奏皇夏司筵撤席掌禮移次迴顧封壇恭臨坎位瘞玉埋俎藏芬斂氣是曰就幽成斯地意祀五帝歌辭奠玉帛奏皇夏辭嘉玉惟芳嘉幣惟量成形依禮禀色隨方神班有次歲禮惟常威儀抑抑率由舊章初獻奏皇夏惟令之月惟嘉之辰司壇宿設掌史誠陳敢用明禮言功上神鈎陳旦闢閶闔朝分旒垂象冕樂奏山雲將迴霆策暫轉天文五運周環四時代序鱗次玉帛循迴樽俎神其降之介福斯許皇帝初獻青帝奏雲門舞甲在日鳥中星禮東后奠蒼靈樹春旗命青史候雁還東風起歌木德舞震宮泗濱石龍門桐孟之月陽之天億斯慶兆斯年皇帝初獻配帝奏舞帝出于震蒼德於神其明在日其位居春勞以定國功以施人言從配祀近取諸身皇帝初獻赤帝奏雲門舞招搖指午對南宮日月相會實沈中離光布政動溫風純陽之月樂炎精赤雀丹書飛送迎朱絃絳鼓罄虔誠萬物含養各長生皇帝獻配帝奏舞以炎為政以火為官位司南陸享配離壇三和實俎百味浮蘭神其茂豫天步艱難皇帝初獻黃帝奏雲門舞三光儀表正四氣風雲同戊己行初曆黃鍾始變宮平琮禮內鎮陰管奏司中齋壇芝曄曄清野桂馮馮夕牢芬六鼎安歌韻八風神光乃超忽佳氣葱葱皇帝初獻配帝奏舞四時咸一德五氣或同論猶吹鳳凰管尚對梧桐園器圜居土厚位總配神尊始知今奏樂還用我雲門皇帝初獻白帝奏雲門舞肅靈兌景承配秋壇雲高火落露白蟬寒帝律登年金精行令瑞獸霜輝祥禽雪映司藏肅殺萬保咸宜厥田上上收功在斯皇帝初獻配帝奏舞金行秋令白帝朱宣司正五雉歌庸九川執文之德對越彼天介以福祉君子萬年皇帝初獻黑帝奏雲門舞北辰為政玄壇北陸之祀員官宿設玄圭浴蘭坎德陰風御寒次律將迴窮紀微陽欲動細泉管猶調於陰竹聲未入於春弦待歸餘於送曆方履慶於斯年皇帝初獻配帝奏舞地始坼虹始藏服玄玉居玄堂沐蕙氣浴蘭湯匏器潔水泉香陟配彼福無疆君欣欣此樂康宗廟歌辭皇帝入廟門奏皇夏肅肅清廟巖巖寢門欹器防滿金人戒言應懸鼓崇牙樹羽階變升歌庭紛象舞閑安象設緝熙清奠春鮪初登新萍先薦僾然入室儼乎其位悽愴履之非寒之謂降神奏昭夏永惟祖武潛慶靈長龍圖革命鳳曆歸昌功移上墋德耀中陽清廟肅肅猛虡煌煌曲高大夏聲和盛唐牲牷蕩滌蕭合馨香和鑾戾止振鷺來翔永敷萬國是則四方俎入皇帝升階奏皇夏年祥辯日上協龜言奏酎承列來庭駿奔彫禾飾斝翠羽承樽敬殫如此恭惟執燔皇帝獻皇高祖奏皇夏慶緒千重秀鴻源萬里長無時猶戢翼有道故韜光盛德必有後仁義終克昌明星初肇慶大電久呈祥皇帝獻皇曾祖德皇帝奏皇夏克昌光上烈基聖穆西藩崇仁高涉渭積德被居原帝圖張往迹王業茂前尊重芬德陽廟疊慶壽陵園百靈光祖武千年福孝孫皇帝獻皇祖太祖文皇帝奏皇夏雄圖屬天造宏略遇羣飛風雲猶聽命龍躍遂乘機百二當天險三分拒樂推函谷風塵散河陽氛霧晞濟弱淪風起扶危運歸地紐崩還正天樞落更追原祠乍超忽畢隴或綿微終封三尺劍長卷一戎衣皇帝獻文宣皇太后奏皇夏月靈興慶沙祥發源功參禹迹德贊堯門言容典禮褕狄徽章儀形溫德令問昭陽日月不居歲時晼晚瑞雲纏心閟宮惟遠皇帝獻閔皇帝奏皇夏龍圖基代德天步屬艱難謳歌還受瑞揖讓乃登壇升輿芒刺重入位據關寒卷舒雲汎濫游揚日浸微出鄭終無反居桐竟不歸祀夏今惟舊尊靈諡更追皇帝獻明皇帝奏皇夏若水逢降君窮桑屬惟政丕哉馭帝籙鬱矣當天命方定五雲官先齊八風令文昌氣似珠太史河如鏡南宮學已開東觀書還聚文辭金石韵毫翰風飈豎清室桂馮馮齋房芝詡詡寧思玉管笛空見靈衣舞皇帝獻高祖武皇帝奏皇夏南河吐雲氣北斗降星神百靈咸仰德千年一聖人書成紫微動律定鳳凰馴六軍命西土甲子陳東鄰戎衣此一定萬里更無塵煙雲同五色日月並重輪流沙既西靜盤木又東臣凱樂聞朱雁鐃歌見白麟今為六代祀還得九疑賓皇帝還東壁飲福酒奏皇夏禮殫祼獻樂極休成長離前掞宗祀文明縮酌浮蘭澄罍合鬯磬折禮容旋回靈貺受釐徹俎飲福移樽惟光惟烈文子文孫皇帝還便坐奏皇夏庭闋四始筵終三薦顧步階墀徘徊餘奠六龍矯首七萃警途鼓移行漏風轉相烏翼翼從事綿綿四時惟神降嘏永言保之太祖輔魏之時高昌款附乃得其伎教習以備饗宴之禮及天和六年武帝罷掖庭四夷樂其後帝娉皇后於北狄得其所獲康國龜茲等樂更雜以高昌之舊並於大司樂習焉採用其聲被於鍾石取周官制以陳之明帝武成二年正月朔旦會羣臣於紫極殿始用百戲武帝保定元年詔罷之及宣帝即位而廣召雜伎增修百戲魚龍漫衍之伎常陳殿前累日繼夜不知休息好令城市少年有容貌者婦人服而歌舞相隨引入後庭與宮人觀聽戲樂過度遊幸無節焉武帝以梁鼓吹熊羆十二案每元正大會列於懸間與正樂合奏宣帝時革前代鼓吹制為十五曲第一改漢朱鷺為玄精季言魏道陵遲太祖肇開王業也第二改漢思悲翁為征隴西言太祖起兵誅侯莫陳悅掃清隴右也第三改漢艾如張為迎魏帝言武帝西幸太祖奉迎宅關中也第四改漢上之回為平竇泰言太祖擁兵討泰悉擒斬也第五改漢擁離為復農言太祖攻復陝城關東震肅也第六改漢戰城南為克沙苑言太祖俘斬齊十萬衆於沙苑神武脫身至河單舟走免也第七改漢巫山高為戰河陰言太祖破神武於河上斬其將高敖曹昔多婁貸文也第八改漢上陵為平漢東言太祖命將平隨郡安陸俘馘萬計也第九改漢將進酒為取巴蜀言太祖遣軍平定蜀地也第十改漢有所思為拔江陵言太祖命將擒蕭繹平南土也第十一改漢芳樹為受魏禪言閔帝受終於魏君臨萬國也第十二改漢上邪為宣重光言明帝入承大統載隆皇道也第十三改漢君馬黃為哲皇出言高祖以聖德繼天天下向風也第十四改漢稚子班為平東夏言高祖親率六師破齊擒齊主於青州一舉而定山東也第十五改古聖人出為擒明徹言陳將吳明徹侵軼徐部高祖遣將盡俘其衆也宣帝晨出夜還陳鼓吹嘗幸同州自應門至赤岸數十里間鼓樂俱作祈雨仲山還令京城士女於衢巷奏樂以迎之公私頓敝以至於亡高祖既受命定令宮懸四面各二虡通十二鎛鍾為二十虡虡各一人建鼓四人柷敔各一人歌琴瑟簫筑箏搊箏臥箜篌小琵琶四面各十人在編磬下笙竽長笛橫笛簫篳篥箎壎四面各八人在編鍾下舞各八佾宮懸簨虡金五博山飾以旒蘇樹羽其樂器應漆者天地之神皆朱宗廟加五色漆畫天神懸內加雷鼓地祇加靈鼓宗廟加路鼓登歌鍾一虡磬一虡各一人歌四人兼琴瑟簫笙竽橫笛箎壎各一人其漆畫及博山旒蘇樹羽與宮懸同登歌人介幘朱連裳烏皮履宮懸及下管人平巾幘朱連裳凱樂人武弁朱衣履韈文舞進賢冠絳紗連裳帛內單皁領袖襈烏皮鞮左執籥右執翟二人執纛引前在舞人數外衣冠同舞人武弁朱衣烏皮履三十二人執戈龍楯三十二人執戚龜二人執旍居前二人執鼗二人執鐸二人執鐃二人執錞四人執弓矢四人執殳四人執戟四人執矛自旍已下夾引並在舞人數外衣冠同舞人皇帝宮懸及登歌與前同應漆者皆五色漆畫懸內不設鼓皇太子軒懸去南面設三鎛鍾於辰丑申三建鼓亦如之其登歌去兼歌者減二人其簨虡金三博山樂器漆者皆朱漆之其餘與宮懸同大鼓小鼓大駕鼓吹並朱漆畫大鼓加金鐲凱樂及節鼓飾以羽葆其長鳴中鳴橫吹皆五采衣幡緋掌畫交龍五采脚大角幡亦如之大鼓長鳴工人皁地苣文金鉦棡鼓小鼓中鳴吳橫吹工人青地苣文凱樂工人武弁朱衣橫吹緋地苣文並為帽袴褶大角工人平巾幘緋衫白布大口袴內宮鼓樂服色皆準此皇太子鐃及節鼓朱漆畫飾以羽葆餘鼓吹並朱漆大鼓小鼓無金鐲長鳴中鳴橫吹五采衣幡緋掌畫蹲獸五采脚大角幡亦如之大鼓長鳴橫吹工人紫帽緋袴褶金鉦棡鼓小鼓中鳴工人青帽青袴褶鐃吹工人武弁朱衣大角工人平巾幘緋衫白布大口袴正一品鐃及節鼓朱漆畫飾以羽葆餘鼓吹並朱漆長鳴中鳴橫吹五采衣幡緋掌畫蹲獸五采脚大角幡亦如之大鼓長鳴橫吹工人紫帽赤布袴褶金鉦棡鼓小鼓中鳴工人青帽青布袴褶鐃吹工人武弁朱衣大角工人平巾幘緋衫白布大口袴三品以上朱漆鐃飾以五采騶哄工人武弁朱衣餘同正一品四品鐃及工人衣服同三品餘鼓皆綠沈金鉦棡鼓大鼓工人青帽青布袴褶開皇二年齊黃門侍郎顏之推上言禮崩樂壞其來自久今太常雅樂並用胡聲請馮梁國舊事考尋古典高祖不從曰梁樂亡國之音奈何遣我用邪是時尚因周樂命工人齊樹提檢校樂府改換聲律益不能通俄而柱國沛公鄭譯奏上請更修正於是詔太常卿牛弘國子祭酒辛彥之國子博士何妥等議正樂然淪謬既久音律多乖積年議不定高祖大怒曰我受天命七年樂府猶歌前代功德邪命治書侍御史李諤引弘等下將罪之諤奏武王克殷至周公相成王始制禮樂斯事體大不可速成高祖意稍解又詔求知音之士集尚書參定音樂譯云考尋樂府鍾石律呂皆有宮商角徵羽變宮變徵之名七聲之內三聲乖應每求訪終莫能通先是周武帝時有龜茲人曰蘇祗婆從突厥皇后入國善胡琵琶聽其所奏一均之中間有七聲因而問之答云父在西域稱為知音代相傳習調有七種以其七調勘校七聲冥若合符一曰娑力華言平聲即宮聲也二曰雞識華言長聲即商聲也三曰沙識華言質直聲即角聲也四曰沙侯加濫華言應聲即變徵聲也五曰沙臘華言應和聲即徵聲也六曰般贍華言五聲即羽聲也七曰俟利華言斛牛聲即變宮聲也譯因習而彈之始得七聲之正然其就此七調又有五旦之名旦作七調以華言譯之旦者則謂均也其聲亦應黃鍾太簇林鍾南呂姑洗五均已外七律更無調聲譯遂因其所捻琵琶絃柱相飲為均推演其聲更立七均合成十二以應十二律律有七音音立一調故成七調十二律合八十四調旋轉相交盡皆和合仍以其聲考校太樂所奏林鍾之宮應用林鍾為宮乃用黃鍾為宮應用南呂為商乃用太簇為商應用應鍾為角乃取姑洗為角故林鍾一宮七聲三聲並戾其十一宮七十七音例皆乖越莫有通者又以編懸有八因作八音之樂七音之外更立一聲謂之應聲譯因作書二十餘篇以明其指至是譯以其書宣示朝廷幷立議正之時邳國公世子蘇夔亦稱明樂駁譯曰韓詩外傳所載樂聲感人及月令所載五音所中並皆有五不言變宮變徵又春秋左氏所云七音六律以奉五聲準此而言每宮應立五調不聞更加變宮變徵二調為七調七調之作所出未詳譯答之曰周有七音之律漢書律曆志天地人及四時謂之七始黃鍾為天始林鍾為地始太簇為人始是為三始姑洗為春蕤賓為夏南呂為秋應鍾為冬是為四時四時三始是以為七今若不以二變為調曲則是冬夏聲闕四時不備是故每宮須立七調衆從譯議譯又與夔俱云案今樂府黃鍾乃以林鍾為調首失君臣之義清樂黃鍾宮以小呂為變徵乖相生之道今請雅樂黃鍾宮以黃鍾為調首清樂去小呂還用蕤賓為變徵衆皆從之夔又與譯議欲累黍立分正定律呂時以音律久不通譯夔等一朝能為之以為樂聲可定而何妥舊以學聞雅為高祖所信高祖素不悅學不知樂妥又恥己宿儒不逮譯等欲沮壞其事乃立議非十二律旋相為宮曰經文雖道旋相為宮恐是直言其理亦不通隨月用調是以古來不取若依鄭玄及司馬彪須用六十律方得和韻今譯唯取黃鍾之正宮兼得七始之妙義非止金石諧韻亦乃簨虡不繁可以享百神可以合萬舞矣而又非其七調之義曰近代書記所載縵樂鼓琴吹笛之人多云三調三調之聲其來久矣請存三調而已時牛弘總知樂事弘不能精知音律又有識音人萬寶常修洛陽舊曲言幼學音律師於祖孝徵知其上代修調古樂周之璧翣殷之崇牙懸八用七盡依周禮備矣所謂正聲又近前漢之樂不可廢也是時競為異議各立朋黨是非之理紛然淆亂或欲令各修造待成擇其善者而從之妥恐樂成善惡易見乃請高祖張樂試之遂先說曰黃鍾者以象人君之德及奏黃鍾之調高祖曰滔滔和雅甚與我心會妥因陳用黃鍾一宮不假餘律高祖大悅班賜妥等修樂者自是譯等議寢

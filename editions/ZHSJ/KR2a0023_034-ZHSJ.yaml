body:
  text: 隋書卷三十四志第二十九經籍三子晏子春秋七卷齊大夫晏嬰撰曾子二卷目一卷魯國曾參撰子思子七卷魯穆公師孔伋撰公孫尼子一卷尼似孔子弟子孟子十四卷齊卿孟軻撰趙岐注孟子七卷鄭玄注孟子七卷劉熙注梁有孟子九卷綦毌邃撰亡孫卿子十二卷楚蘭陵令荀況撰梁有王孫子一卷亡董子一卷戰國時董無心撰魯連子五卷錄一卷魯連齊人不仕稱為先生新語二卷陸賈撰賈子十卷錄一卷漢梁太傅賈誼撰鹽鐵論十卷漢廬江府丞桓寬撰新序三十卷錄一卷劉向撰說苑二十卷劉向撰揚子法言十五卷解一卷揚雄撰李軌注梁有揚子法言六卷侯苞注亡揚子法言十三卷宋衷注揚子太玄經九卷宋衷注梁有揚子太玄經九卷揚雄自作章句亡揚子太玄經十卷陸績宋衷注揚子太玄經十卷蔡文邵注梁有揚子太玄經十四卷虞翻注揚子太玄經十三卷陸凱注揚子太玄經七卷王肅注亡桓子新論十七卷後漢六安丞桓譚撰潛夫論十卷後漢處士王符撰梁有王逸正部論八卷後漢侍中王逸撰後序十二卷後漢司隸校尉應奉撰周生子要論一卷錄一卷魏侍中周生烈撰亡申鑒五卷荀悅撰魏子三卷後漢會稽人魏朗撰梁有文檢六卷似後漢末人作亡牟子二卷後漢太尉牟融撰典論五卷魏文帝撰徐氏中論六卷魏太子文學徐幹撰梁目一卷王子正論十卷王肅撰梁有去伐論集三卷王粲撰亡杜氏體論四卷魏幽州刺史杜恕撰梁有新書五卷王基撰周子九卷吳中書郎周昭撰亡顧子新語十二卷吳太常顧譚撰通語十卷晉尚書左丞殷興撰典語十卷典語別二卷並吳中夏督陸景撰亡譙子法訓八卷譙周撰梁有譙子五教志五卷亡袁子正論十九卷袁準撰梁又有袁子正書二十五卷袁準撰孫氏成敗志三卷孫毓撰古今通論二卷王嬰撰蔡氏化清經十卷松滋令蔡洪撰通經二卷晉丞相從事中郎正長文撰亡新論十卷晉散騎常侍夏侯湛撰梁有楊子物理論十六卷楊子大元經十四卷並晉徵士楊泉撰新論十卷晉金紫光祿大夫華譚撰梅子新論一卷亡志林新書三十卷虞喜撰梁有廣林二十四卷又後林十卷虞喜撰干子十八卷干寶撰閎論二卷晉江州從事蔡韶撰顧子十卷晉揚州主簿顧夷撰亡要覽十卷晉郡儒林祭酒呂竦撰正覽六卷梁太子詹事周捨撰梁有三統五德論二卷曹思文撰亡諸葛武侯集誡二卷衆賢誡十三卷女篇一卷女鑒一卷婦人訓誡集十一卷娣姒訓一卷曹大家女誡一卷貞順志一卷右六十二部五百三十卷通計亡書合六十七部六百九卷儒者所以助人君明教化者也聖人之教非家至而戶說故有儒者宣而明之其大抵本於仁義及五常之道黃帝堯舜禹湯文武咸由此則周官太宰以九兩繫邦國之人其四曰儒是也其後陵夷衰亂儒道廢闕仲尼祖述前代修正六經三千之徒並受其義至于戰國孟軻子思荀卿之流宗而師之各有著述發明其指所謂中庸之教百王不易者也俗儒為之不顧其本苟欲譁衆多設問難便辭巧說亂其大體致令學者難曉故曰博而寡要鬻子一卷周文王師鬻熊撰老子道德經二卷周柱下史李耳撰漢文帝時河上公注梁有戰國時河上丈人注老子經二卷漢長陵三老母丘望之注老子二卷漢徵士嚴遵注老子二卷虞翻注老子二卷亡老子道德經二卷王弼注梁有老子道德經二卷張嗣注老子道德經二卷蜀才注亡老子道德經二卷鍾會注梁有老子道德經二卷晉太傅羊祜解釋老子經二卷東晉江州刺史王尚述注老子二卷晉郎中程韶集解老子二卷邯鄲氏注老子二卷常氏傳老子二卷孟氏注老子二卷盈氏注亡老子道德經二卷音一卷晉尚書郎孫登注老子道德經二卷劉仲融注梁有老子道德經二卷巨生解老子道德經二卷晉西中郎將袁真注老子道德經二卷張憑注老子道德經二卷釋惠琳注老子道德經二卷釋惠嚴注老子道德經二卷王玄載注亡老子道德經二卷盧景裕撰老子音一卷李軌撰梁有老子音一卷晉散騎常侍戴逵撰亡老子四卷梁曠撰老子指歸十一卷嚴遵注老子指趣三卷毌丘望之撰老子義綱一卷顧歡撰梁有老子道德論二卷何晏撰老子序決一卷葛仙公撰老子雜論一卷何王等注老子私記十卷梁簡文帝撰老子玄示一卷韓壯撰老子玄譜一卷晉柴桑令劉遺民撰老子玄機三卷宗塞撰老子幽易五卷又老子志一卷山琮撰亡老子義疏一卷顧歡撰梁有老子義疏一卷釋慧觀撰亡老子義疏五卷孟智周私記老子義疏四卷韋處玄撰老子講疏六卷梁武帝撰老子義疏九卷戴詵撰老子節解二卷老子章門一卷文子十二卷文子老子弟子七略有九篇梁七錄十卷亡鶡冠子三卷楚之隱人列子八卷鄭之隱人列禦寇撰東晉光祿勳張湛注莊子二十卷梁漆園吏莊周撰晉散騎常侍向秀注本二十卷今闕梁有莊子十卷東晉議郎崔譔注亡莊子十六卷司馬彪注本二十一卷今闕莊子三十卷目一卷晉太傅主簿郭象注梁七錄三十三卷集注莊子六卷梁有莊子三十卷晉丞相參軍李頤注莊子十八卷孟氏注錄一卷亡莊子音一卷李軌撰莊子音三卷徐邈撰莊子集音三卷徐邈撰莊子注音一卷司馬彪等撰莊子音三卷郭象撰梁有向秀莊子音一卷莊子外篇雜音一卷莊子內篇音義一卷莊子講疏十卷梁簡文帝撰本二十卷今闕莊子講疏二卷張譏撰亡莊子講疏八卷莊子文句義二十八卷本三十卷今闕梁有莊子義疏十卷又莊子義疏三卷宋處士王叔之撰亡莊子內篇講疏八卷周弘正撰莊子義疏八卷戴詵撰南華論二十五卷梁曠撰本三十卷南華論音三卷莊成子十二卷梁有蹇子一卷今亡玄言新記明莊部二卷梁澡撰守白論一卷任子道論十卷魏河東太守任嘏撰梁有渾輿經一卷魏安成令桓威撰亡唐子十卷吳唐滂撰梁有蘇子七卷晉北中郎參軍蘇彥撰宣子二卷晉宜城令宣舒撰陸子十卷陸雲撰亡杜氏幽求新書二十卷杜夷撰抱朴子內篇二十一卷音一卷葛洪撰梁有顧道士新書論經三卷晉方士顧谷撰亡孫子十二卷孫綽撰符子二十卷東晉員外郎符朗撰梁有賀子述言十卷宋太學博士賀道養撰少子五卷齊司徒左長史張融撰梁有養生論三卷嵇康撰攝生論二卷晉河內太守阮侃撰無宗論四卷聖人無情論六卷亡夷夏論一卷顧歡撰梁二卷梁又有談衆三卷亡簡文談疏六卷晉簡文帝撰無名子一卷張太衡撰玄子五卷遊玄桂林二十一卷目一卷張譏撰廣成子十三卷商洛公撰張太衡注疑近人作右七十八部合五百二十五卷道者蓋為萬物之奧聖人之至賾也易曰一陰一陽之謂道又曰仁者見之謂之仁智者見之謂之智百姓日用而不知夫陰陽者天地之謂也天地變化萬物蠢生則有經營之迹至於道者精微淳粹而莫知其體處陰與陰為一在陽與陽不二仁者資道以成仁道非仁之謂也智者資道以為智道非智之謂也百姓資道而日用而不知其用也聖人體道成性清虛自守為而不恃長而不宰故能不勞聰明而人自化不假修營而功自成其玄德深遠言象不測先王懼人之惑置于方外六經之義是所罕言周官九兩其三曰師蓋近之矣然自黃帝以下聖哲之士所言道者傳之其人世無師說漢時曹參始薦蓋公能言黃老文帝宗之自是相傳道學衆矣下士為之不推其本苟以異俗為高狂狷為尚迂誕譎怪而失其真管子十九卷齊相管夷吾撰商君書五卷秦相衞鞅撰梁有申子三卷韓相申不害撰亡慎子十卷戰國時處士慎到撰韓子二十卷目一卷韓非撰梁有朝氏新書三卷漢御史大夫錯撰亡正論六卷漢大尚書崔寔撰梁有法論十卷劉邵撰政論五卷魏侍中劉廙撰阮子正論五卷魏清河太守阮武撰亡世要論十二卷魏大司農桓範撰梁有二十卷又有陳子要言十四卷吳豫章太守陳融撰蔡司徒難論五卷晉三公令史黃命撰亡右六部合七十二卷法者人君所以禁淫慝齊不軌而輔於治者也易著先王明罰飭法書美明于五刑以弼五教周官司寇掌建國之三典以佐王刑邦國詰四方司刑以五刑之法麗萬民之罪是也刻者為之則杜哀矜絕仁愛欲以威劫為化殘忍為治乃至傷恩害親鄧析子一卷析鄭大夫尹文子二卷尹文周之處士遊齊稷下士操一卷魏文帝撰梁有刑聲論一卷亡人物志三卷劉邵撰梁有士緯新書十卷姚信撰又姚氏新書二卷與士緯相似九州人士論一卷魏司空盧毓撰通古人論一卷亡右四部合七卷名者所以正百物叙尊卑列貴賤各控名而責實無相僭濫者也春秋傳曰古者名位不同節文異數孔子曰名不正則言不順言不順則事不成周官宗伯以九儀之命正邦國之位辨其名物之類是也拘者為之則苛察繳繞滯於析辭而失大體墨子十五卷目一卷宋大夫墨翟撰隨巢子一卷巢似墨翟弟子胡非子一卷非似墨翟弟子梁有田俅子一卷亡右三部合一十七卷墨者強本節用之術也上述堯舜夏禹之行茅茨不翦糲粱之食桐棺三寸貴儉兼愛嚴父上德以孝示天下右鬼神而非命漢書以為本出清廟之守然則周官宗伯掌建邦之天神地祇人鬼肆師掌立國祀及兆中廟中之禁令是其職也愚者為之則守於節儉不達時變推心兼愛而混於親疎也鬼谷子三卷皇甫謐注鬼谷子周世隱於鬼谷梁有補闕子十卷湘東鴻烈十卷並元帝撰亡鬼谷子三卷樂一注右二部合六卷從橫者所以明辯說善辭令以通上下之志者也漢書以為本出行人之官受命出疆臨事而制故曰誦詩三百使于四方不能專對雖多亦奚以為周官掌交以節與幣巡邦國之諸侯及萬姓之聚導王之德意志慮使辟行之而和諸侯之好達萬民之說諭以九稅之利九儀之親九牧之維九禁之難九戎之威是也佞人為之則便辭利口傾危變詐至於賊害忠信覆邦亂家尉繚子五卷梁幷錄六卷尉繚梁惠王時人尸子二十卷目一卷梁十九卷秦相衞鞅上客尸佼撰其九篇亡魏黃初中續呂氏春秋二十六卷秦相呂不韋撰高誘注淮南子二十一卷漢淮南王劉安撰許慎注淮南子二十一卷高誘注論衡二十九卷後漢徵士王充撰梁有洞序九卷錄一卷應奉撰亡風俗通義三十一卷錄一卷應劭撰梁三十卷仲長子昌言十二卷錄一卷漢尚書郎仲長統撰蔣子萬機論八卷蔣濟撰梁有篤論四卷杜恕撰芻蕘論五卷鍾會撰梁有諸葛子五卷吳太傅諸葛恪撰亡傅子百二十卷晉司隸校尉傅玄撰默記三卷吳大鴻臚張儼撰裴氏新言五卷吳大鴻臚裴玄撰梁有新義十八卷吳太子中庶子劉廞撰析言論二十卷晉議郎張顯撰桑丘先生書二卷晉征南軍師楊偉撰亡時務論十二卷楊偉撰梁有古世論十七卷桓子一卷秦子三卷吳秦菁撰劉子十卷何子五卷亡立言六卷蘇道撰梁有孔氏說林二卷孔衍撰亡抱朴子外篇三十卷葛洪撰梁有五十一卷金樓子十卷梁元帝撰博物志十卷張華撰張公雜記一卷張華撰梁有五卷與博物志相似小小不同又有雜記十卷何氏撰亡雜記十一卷張華撰梁有子林二十卷孟儀撰亡廣志二卷郭義恭撰部略十五卷博覽十三卷諫林五卷齊晉陵令何翌之撰述政論十三卷陸澄撰古今注三卷崔豹撰古今訓十一卷張顯撰古今善言三十卷宋車騎將軍范泰撰善諫二卷宋領軍長史虞通之撰缺文十三卷陸澄撰政論十三卷陸澄撰記聞二卷宋後軍參軍徐益壽撰新舊傳四卷釋俗語八卷劉霽撰稱謂五卷後周大將軍盧辯撰備遺記三卷纂要一卷戴安道撰亦云顏延之撰方類六卷俗說三卷沈約撰梁五卷雜說二卷沈約撰袖中記二卷沈約撰袖中略集一卷沈約撰珠叢一卷沈約撰採璧三卷梁中書
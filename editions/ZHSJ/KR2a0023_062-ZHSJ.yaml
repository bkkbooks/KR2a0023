body:
  text: 隋書卷六十二列傳第二十七王韶王韶字子相自云太原晉陽人也世居京兆祖諧原州刺史父諒早卒韶幼而方雅頗好奇節有識者異之在周累以軍功官至車騎大將軍儀同三司復轉軍正武帝既拔晉州意欲班師韶諫曰齊失紀綱於茲累世天奬王室一戰而扼其喉加以主昏於上民懼於下取亂侮亡正在今日方欲釋之而去以臣愚固深所未解願階下圖之帝大悅賜縑一百匹及平齊氏以功進位開府封晉陽縣公邑五百戶賜口馬雜畜以萬計遷內史中大夫宣帝即位拜豐州刺史改封昌樂縣公高祖受禪進爵項城郡公邑二千戶轉靈州刺史加位大將軍晉王廣之鎮幷州也除行臺右僕射賜綵五百匹韶性剛直王甚憚之每事諮詢不致違於法度韶嘗奉使檢行長城其後王穿池起三山韶既還自鎖而諫王謝而罷之高祖聞而嘉歎賜金百兩幷後宮四人平陳之役以本官為元帥府司馬帥師趣河陽與大軍會既至壽陽與高熲支度軍機無所擁滯及剋金陵韶即鎮焉晉王廣班師留韶於石頭防遏委以後事歲餘徵還高祖謂公卿曰晉王以幼稚出藩遂能剋平吳越綏靜江湖子相之力也於是進位柱國賜奴婢三百口綿絹五千段開皇十一年上幸幷州以其稱職特加勞勉其後上謂韶曰自朕至此公鬚鬢漸白無乃憂勞所致柱石之望唯在於公努力勉之韶辭謝曰臣比衰暮殊不解作官人高祖曰是何意也不解者是未用心耳韶對曰臣昔在昏季猶且用心況逢明聖敢不罄竭但神化精微非駑蹇所逮加以今年六十有六桑榆云晚比於疇昔昏忘又多豈敢自寬以速身累恐以衰暮虧紊朝綱耳上勞而遣之秦王俊為幷州總管仍為長史歲餘馳驛入京勞敝而卒時年六十八高祖甚傷惜之謂秦王使者曰語爾王我前令子相緩來如何乃遣馳驛殺我子相豈不由汝邪言甚悽愴使有司為之立宅曰往者何用宅為但以表我深心耳又曰子相受我委寄十有餘年終始不易寵章未極舍我而死乎發言流涕因命取子相封事數十紙傳示羣臣上曰其直言匡正裨益甚多吾每披尋未嘗釋手煬帝即位追贈司徒尚書令靈豳等十州刺史魏國公子士隆嗣士隆略知書計尤便弓馬慷慨有父風大業之世頗見親重官至備身將軍改封耿公數令討擊山賊往往有捷越王侗稱帝士隆率數千兵自江淮而至會王世充僭號甚禮重之署尚書右僕射士隆憂憤疽發背卒元巖元巖字君山河南洛陽人也父禎魏敷州刺史巖好讀書不治章句剛鯁有器局以名節自許少與渤海高熲太原王韶同志友善仕周釋褐宣威將軍武賁給事大冢宰宇文護見而器之以為中外記室累遷內史中大夫昌國縣伯宣帝嗣位為政昏暴京兆郡丞樂運乃輿櫬詣朝堂陳帝八失言甚切至帝大怒將戮之朝臣皆恐懼莫有救者巖謂人曰臧洪同日尚可俱死其況比干乎若樂運不免吾將與之俱斃詣閣請見言於帝曰樂運知書奏必死所以不顧身命者欲取後世之名階下若殺之乃成其名落其術內耳不如勞而遣之以廣聖度運因獲免後帝將誅烏丸軌巖不肯署詔御正顏之儀切諫不入巖進繼之脫巾頓顙三拜三進帝曰汝欲黨烏丸軌邪巖曰臣非黨軌正恐濫誅失天下之望帝怒使閹豎搏其面遂廢于家高祖為丞相加位開府民部中大夫及受禪拜兵部尚書進爵平昌郡公邑二千戶巖性嚴重明達世務每有奏議侃然正色庭諍面折無所迴避上及公卿皆敬憚之時高祖初即位每懲周代諸侯微弱以致滅亡由是分王諸子權侔王室以為磐石之固遣晉王廣鎮幷州蜀王秀鎮益州二王年並幼稚於是盛選貞良有重望者為之僚佐于時巖與王韶俱以骨鯁知名物議稱二人才具侔於高熲由是拜巖為益州總管長史韶為河北道行臺右僕射高祖謂之曰公宰相大器今屈輔我兒如曹參相齊之意也及巖到官法令明肅吏民稱焉蜀王性好奢侈嘗欲取獠口以為閹人又欲生剖死囚取膽為藥巖皆不奉教排閤切諫王輒謝而止憚巖為人每循法度蜀中獄訟巖所裁斷莫不悅服其有得罪者相謂曰平昌公與吾罪吾何怨焉上甚嘉之賞賜優洽十三年卒官上悼惜久之益州父老莫不殞涕于今思之巖卒之後蜀王竟行其志漸致非法造渾天儀司南車記里鼓凡所被服擬於天子又共妃出獵以彈彈人多捕山獠以充宦者僚佐無能諫止及秀得罪上曰元巖若在吾兒豈有是乎子弘嗣仕歷給事郎司朝謁者北平通守劉行本劉行本沛人也父瓌仕梁歷職清顯行本起家武陵國常侍遇蕭修以梁州北附遂與叔父璠同歸于周寓居京兆之新豐每以諷讀為事精力忘疲雖衣食乏絕晏如也性剛烈有不可奪之志周大冢宰宇文護引為中外府記室武帝親總萬機轉御正中士兼領起居注累遷掌朝下大夫周代故事天子臨軒掌朝典筆硯持至御坐則承御大夫取以進之及行本為掌朝將進筆於帝承御復欲取之行本抗聲謂承御曰筆不可得帝驚視問之行本言於帝曰臣聞設官分職各有司存臣既不得佩承御刀承御亦焉得取臣筆帝曰然因令二司各行所職及宣帝嗣位多失德行本切諫忤旨出為河內太守高祖為丞相尉迥作亂進攻懷州行本率吏民拒之拜儀同賜爵文安縣子及踐阼徵拜諫議大夫檢校治書侍御史未幾遷黃門侍郎上嘗怒一郎於殿前笞之行本進曰此人素清其過又小願陛下少寬假之上不顧行本於是正當上前曰陛下不以臣不肖置臣左右臣言若是陛下安得不聽臣言若非當致之於理以明國法豈得輕臣而不顧也臣所言非私因置笏於地而退上斂容謝之遂原所笞者于時天下大同四夷內附行本以党項羌密邇封域最為後服上表劾其使者曰臣聞南蠻遵校尉之統西域仰都護之威比見西羌鼠竊狗盜不父不子無君無臣異類殊方於斯為下不悟羈縻之惠詎知含養之恩狼戾為心獨乖正朔使人近至請付推科上奇其志焉雍州別駕元肇言於上曰有一州吏受人餽錢三百文依律合杖一百然臣下車之始與其為約此吏故違請加徒一年行本駁之曰律令之行並發明詔與民約束今肇乃敢重其教命輕忽憲章欲申己言之必行忘朝廷之大信虧法取威非人臣之禮上嘉之賜絹百匹在職數年拜太子左庶子領治書如故皇太子虛襟敬憚時唐令則亦為左庶子太子昵狎之每令以絃歌教內人行本責之曰庶子當匡太子以正道何有嬖昵房帷之間哉令則甚慚而不能改時沛國劉臻平原明克讓魏郡陸爽並以文學為太子所親行本怒其不能調護每謂三人曰卿等正解讀書耳時左衞率長史夏侯福為太子所昵嘗於閤內與太子戲福大笑聲聞於外行本時在閤下聞之待其出行本數之曰殿下寬容賜汝顏色汝何物小人敢為褻慢因付執法者治之數日太子為福致請乃釋之太子嘗得良馬令福乘而觀之太子甚悅因欲令行本復乘之行本不從正色而進曰至尊置臣於庶子之位者欲令輔導殿下以正道非為殿下作弄臣也太子慚而止復以本官領大興令權貴憚其方直無敢至門者由是請託路絕法令清簡吏民懷之未幾卒官上甚傷惜之及太子廢上曰嗟乎若使劉行本在勇當不及於此無子梁毗梁毗字景和安定烏氏人也祖越魏涇豫洛三州刺史郃陽縣公父茂周滄兗二州刺史毗性剛謇頗有學涉周武帝時舉明經累遷布憲下大夫平齊之役以毗為行軍總管長史剋幷州毗有力焉除為別駕加儀同三司宣政中封易陽縣子邑四百戶遷武藏大夫高祖受禪進爵為侯開皇初置御史官朝廷以毗鯁正拜治書侍御史名為稱職尋轉大興令遷雍州贊治毗既出憲司復典京邑直道而行無所迴避頗失權貴心由是出為西寧州刺史改封邯鄲縣侯在州十一年先是蠻夷酋長皆服金冠以金多者為豪儁由此遞相陵奪每尋干戈邊境略無寧歲毗患之後因諸酋長相率以金遺毗於是置金坐側對之慟哭而謂之曰此物飢不可食寒不可衣汝等以此相滅不可勝數今將此來欲殺我邪一無所納悉以還之於是蠻夷感悟遂不相攻擊高祖聞而善之徵為散騎常侍大理卿處法平允時人稱之歲餘進位上開府毗見左僕射楊素貴寵擅權百僚震慴恐為國患因上封事曰臣聞臣無有作威福臣之作威福其害乎而家凶乎而國竊見左僕射越國公素幸遇愈重權勢日隆搢紳之徒屬其視聽忤意者嚴霜夏零阿旨者膏雨冬澍榮枯由其脣吻廢興候其指麾所私皆非忠讜所進咸是親戚子弟布列兼州連縣天下無事容息異圖四海稍虞必為禍始夫姦臣擅命有漸而來王莽資之於積年桓玄基之於易世而卒殄漢祀終傾晉祚季孫專魯田氏篡齊皆載典誥非臣臆說陛下若以素為阿衡臣恐其心未必伊尹也伏願揆鑒古今量為處置俾洪基永固率土幸甚輕犯天顏伏聽斧鑕高祖大怒命有司禁止親自詰之毗極言曰素既擅權寵作威作福將領之處殺戮無道又太子及蜀王罪廢之日百僚無不震悚惟素揚眉奮肘喜見容色利國家有事以為身幸毗發言謇謇有誠亮之節高祖無以屈也乃釋之素自此恩寵漸衰但素任寄隆重多所折挫當時朝士無不慴伏莫有敢與相是非辭氣不撓者獨毗與柳彧及尚書右丞李綱而已後上不復專委於素蓋由察毗之言也煬帝即位遷刑部尚書幷攝御史大夫事奏劾宇文述私役部兵帝議免述罪毗固諍因忤旨遂令張衡代為大夫毗憂憤數月而卒帝令吏部尚書牛弘弔之贈縑五百匹子敬真大業之世為大理司直時帝欲成光祿大夫魚俱羅之罪令敬真治其獄遂希旨陷之極刑未幾敬真有疾見俱羅為之厲數日而死柳彧柳彧字幼文河東解人也七世祖卓隨晉南遷寓居襄陽父仲禮為梁將敗歸周復家本土彧少好學頗涉經史周大冢宰宇文護引為中外府記室久而出為寧州總管掾武帝親總萬機彧詣闕求試帝異之以為司武中士轉鄭令平齊之後帝大賞從官留京者不預彧上表曰今太平告始信賞宜明酬勳報勞務先有本屠城破邑出自聖規斬將搴旗必由神略若負戈擐甲征扞劬勞至於鎮撫國家宿衛為重俱禀成算非專己能留從事同功勞須等皇太子以下實有守宗廟之功昔蕭何留守茅土先於平陽穆之居中沒後猶蒙優策不勝管見奉表以聞於是留守並加汎級高祖受禪累遷尚書虞部侍郎以母憂去職未幾起為屯田侍郎固讓弗許時制三品已上門皆列戟左僕射高熲子弘德封應國公申牒請戟彧判曰僕射之子更不異居父之戟槊已列門外尊有壓卑之義子有避父之禮豈容外門既設內閤又施事竟不行熲聞而歎伏後遷治書侍御史當朝正色甚為百僚之所敬憚上嘉其婞直謂彧曰大丈夫當立名於世無容容而已賜錢十萬米百石于時刺史多任武將類不稱職彧上表曰方今天下太平四海清謐共治百姓須任其才昔漢光武一代明哲起自布衣備知情偽與二十八將披荊棘定天下及功成之後無所職任伏見詔書以上柱國和干子為嵵州刺史其人年垂八十鍾鳴漏盡前任趙州闇於職務政由羣小賄賂公行百姓吁嗟歌謠滿道乃云老禾不早殺餘種穢良田古人有云耕當問奴織當問婢此言各有所能也干子弓馬武用是其所長治民莅職非其所解至尊思治無忘寢興如謂優老尚年自可厚賜金帛若令刺舉所損殊大臣死而後已敢不竭誠上善之干子竟免有應州刺史唐君明居母喪娶雍州長史庫狄士文之從父妹彧劾之曰臣聞天地之位既分夫婦之禮斯著君親之義生焉尊卑之教攸設是以孝惟行本禮實身基自國刑家率由斯道竊以愛敬之情因心至切喪紀之重人倫所先君明鑽燧雖改在文無變忽劬勞之痛成嬿爾之親冒此苴縗命彼褕翟不義不昵春秋載其將亡無禮無儀詩人欲其遄死士文贊務神州名位通顯整齊風教四方是則棄二姓之重匹違六禮之軌儀請禁錮終身以懲風俗二人竟坐得罪隋承喪亂之後風俗頹壞彧多所矯正上甚嘉之又見上勤於聽受百僚奏請多有煩碎因上疏諫曰臣聞自古聖帝莫過唐虞象地則天布政施化不為叢脞是謂欽明語曰天何言哉四時行焉故知人君出令誡在煩數是以舜任五臣堯咨四岳設官分職各有司存垂拱無為天下以治所謂勞於求賢逸於任使又云天子穆穆諸侯皇皇此言君臣上下體裁有別比見四海一家萬機務廣事無大小咸關聖聽陛下留心治道無憚疲勞亦由羣官懼罪不能自決取判天旨聞奏過多乃至營造細小之事出給輕微之物一日之內酬答百司至乃日旰忘食夜分未寢動以文簿憂勞聖躬伏願思臣至言少減煩務以怡神為意以養性為懷思武王安樂之義念文王勤憂之理若其經國大事非臣下裁斷者伏願詳決自餘細務責成所司則聖體盡無疆之壽臣下蒙覆育之賜也上覽而嘉之後以忤旨免未幾復令視事因謂彧曰無改爾心以其家貧勑有司為之築宅因曰柳彧正直士國之寶也其見重如此右僕射楊素當塗顯貴百僚慴憚無敢忤者嘗以少譴勑送南臺素恃貴坐彧牀彧從外來見素如此於階下端笏整容謂素曰奉勑治公之罪素遽下彧據案而坐立素於庭辨詰事狀素由是銜之彧時方為上所信任故素未有以中之彧見近代以來都邑百姓每至正月十五日作角抵之戲遞相誇競至於糜費財力上奏請禁絕之曰臣聞昔者明王訓民治國率履法度動由禮典非法不服非道不行道路不同男女有別防其邪僻納諸軌度竊見京邑爰及外州每以正月望夜充街塞陌聚戲朋遊鳴鼓聒天燎炬照地人戴獸面男為女服倡優雜技詭狀異形以穢嫚為歡娛用鄙褻為笑樂內外共觀曾不相避高棚跨路廣幕陵雲袨服靚塟車馬填噎肴醑肆陳絲竹繁會竭貲破產競此一時盡室并孥無問貴賤男女混雜緇素不分穢行因此而生盜賊由斯而起浸以成俗實有由來因循敝風曾無先覺非益於化實損於民請頒行天下並即禁斷康哉雅頌足美盛德之形容鼓腹行歌自表無為之至樂敢有犯者請以故違勑論詔可其奏是歲持節巡省河北五十二州奏免長吏贓污不稱職者二百餘人州縣肅然莫不震懼上嘉之賜絹布二百匹三十領拜儀同三司歲餘加員外散騎常侍治書如故仁壽初復持節巡省太原道十九州及還賜絹百五十匹彧嘗得博陵李文博所撰治道集十卷蜀王秀遣人求之彧送之於秀秀復賜彧奴婢十口及秀得罪楊素奏彧以內臣交通諸侯除名為民配戍懷遠鎮行達高陽有詔徵還至晉陽值漢王諒作亂遣使馳召彧將與計事彧為使所逼初不知諒反將入城而諒反形已露彧度不得免遂詐中惡不食自稱危篤諒怒囚之及諒敗楊素奏彧心懷兩端以候事變迹雖不反心實同逆坐徙敦煌楊素卒後乃自申理有詔徵還京師卒於道有子紹為介休令趙綽趙綽河東人也性質直剛毅在周初為天官府史以恭謹恪勤擢授夏官府下士稍以明幹見知累轉內史中士父艱去職哀毀骨立世稱其孝既免喪又為掌教中士高祖為丞相知其清正引為錄事參軍尋遷掌朝大夫從行軍總管是云暉擊叛蠻以功拜儀同賜物千段高祖受禪授大理丞處法平允考績連最轉大理正尋遷尚書都官侍郎未幾轉刑部侍郎治梁士彥等獄賜物三百段奴婢十口馬二十匹每有奏讞正色侃然上嘉之漸見親重上以盜賊不禁將重其法綽進諫曰陛下行堯舜之道多存寬宥況律者天下之大信其可失乎上忻然納之因謂綽曰若更有聞見宜數陳之也遷大理少卿故陳將蕭摩訶其子世略在江南作亂摩訶當從坐上曰世略年未二十亦何能為以其名將之子為人所逼耳因赦摩訶綽固諫不可上不能奪欲綽去而赦之固命綽退食綽曰臣奏獄未決不敢退朝上曰大理其為朕特赦摩訶也因命左右釋之刑部侍郎辛亶嘗衣緋褌俗云利於官上以為厭蠱將斬之綽曰據法不當死臣不敢奉詔上怒甚謂綽曰卿惜辛亶而不自惜也命左僕射高熲將綽斬之綽曰陛下寧可殺臣不得殺辛亶至朝堂解衣當斬上使人謂綽曰竟何如對曰執法一心不敢惜死上拂衣而入良久乃釋之明日謝綽勞勉之賜物三百段時上禁行惡錢有二人在市以惡錢易好者武候執以聞上令悉斬之綽進諫曰此人坐當杖殺之非法上曰不關卿事綽曰陛下不以臣愚暗置在法司欲妄殺人豈得不關臣事上曰撼大木不動者當退對曰臣望感天心何論動木上復曰啜羹者熱則置之天子之威欲相挫耶綽拜而益前訶之不肯退上遂入治書侍御史柳彧復上奏切諫上乃止上以綽有誠直之心每引入閤中或遇上與皇后同榻即呼綽坐評論得失前後賞賜萬計其後進位開府贈其父為蔡州刺史時河東薛冑為大理卿俱名平恕然冑斷獄以情而綽守法俱為稱職上每謂綽曰朕於卿無所愛惜但卿骨相不當貴耳仁壽中卒官時年六十三上為之流涕中使弔祭鴻臚監護喪事有二子元方元襲裴肅裴肅字神封河東聞喜人也父俠周民部大夫肅少剛正有局度少與安定梁毗同志友善仕周釋褐給事中士累遷御正下大夫以行軍長史從韋孝寬征淮南屬高祖為丞相肅聞而歎曰武帝以雄才定六合墳土未乾而一朝遷革豈天道歟高祖聞之甚不悅由是廢于家開皇五年授膳部侍郎後二歲遷朔州總管長史轉貝州長史俱有能名仁壽中肅見皇太子勇蜀王秀左僕射高熲俱廢黜遣使上書曰臣聞事君之道有犯無隱愚情所懷敢不聞奏竊見高熲以天挺良才元勳佐命陛下光寵亦已優隆但鬼瞰高明世疵俊異側目求其長短者豈可勝道哉願陛下錄其大功忘其小過臣又聞之古先聖帝教而不誅陛下至慈度越前聖二庶人得罪已久寧無革心願陛下弘君父之慈顧天性之義各封小國觀其所為若能遷善漸更增益如或不悛貶削非晚今者自新之路永絕愧悔之心莫見豈不哀哉書奏上謂楊素曰裴肅憂我家事此亦至誠也於是徵肅入朝皇太子聞之謂左庶子張衡曰使勇自新欲何為也衡曰觀肅之意欲令如吳太伯漢東海王耳皇太子甚不悅頃之肅至京師見上于含章殿上謂肅曰吾貴為天子富有四海後宮寵幸不過數人自勇以下並皆同母非為憎愛輕事廢立因言勇不可復收之意既而罷遣之未幾上崩煬帝嗣位不得調者久之肅亦杜門不出後執政者以嶺表荒遐遂希旨授肅永平郡丞甚得民夷心歲餘卒時年六十二夷獠思之為立廟於鄣江之浦有子尚賢史臣曰猛獸之處山林藜藿為之不採正臣之立朝廷姦邪為之折謀皆志在匪躬義形于色豈惟綱紀由其隆替抑亦社稷繫以存亡者也晉蜀二王帝之愛子擅以權寵莫拘憲令求其恭肅不亦難乎元巖王韶任當彼相並見嚴憚莫敢為非謇諤之風有足稱矣行本正色於房陵梁毗抗言於楊素直辭鯁氣懍焉可想趙綽之居大理囹圄無寃柳彧之處憲臺姦邪自肅然不畏強禦梁毗其有焉邦之司直行本柳彧近之矣裴肅朝不坐宴不預忠誠慷慨犯忤龍鱗固知嫠婦憂宗周之亡處女悲太子之少非徒語也方諸前載有閻纂之風焉

body:
  text: 隋書卷十九志第十四天文上若夫法紫微以居中擬明堂而布政依分野而命國體衆星而効官動必順時教不違物故能成變化之道合陰陽之妙爰在庖犧仰觀俯察謂以天之七曜二十八星周於穹圓之度以麗十二位也在天成象示見吉凶五緯入房啟姬王之肇跡長星孛斗鑒宋人之首亂天意人事同乎影響自夷王下堂而見諸侯赧王登臺而避責記曰天子微諸侯僭於是師兵吞滅僵仆原野秦氏以戰國之餘怙茲凶暴小星交鬬長彗橫天漢高祖驅駕英雄墾除災害五精從歲七重暈畢含樞曾緬道不虛行自西京創制多歷年載世祖中興當塗馭物金行水德祗奉靈命玄兆著明天人不遠昔者榮河獻籙溫洛呈圖六爻摛範三光宛備則星官之書自黃帝始高陽氏使南正重司天北正黎司地帝堯乃命羲和欽若昊天夏有昆吾殷有巫咸周之史佚宋之子韋魯之梓慎鄭之裨竈魏有石氏齊有甘公皆能言天文察微變者也漢之傳天數者則有唐都李尋之倫光武時則有蘇伯况郎雅光並能參伍天文發揚善道補益當時監垂來世而河洛圖緯雖有星占星官之名未能盡列後漢張衡為太史令鑄渾天儀總序經星謂之靈憲其大略曰星也者體生於地精發於天紫宮為帝皇之居太微為五帝之坐在野象物在朝象官居其中央謂之北斗動係於占實司王命四布於方為二十八星日月運行歷示休咎五緯經次用彰禍福則上天之心於是見矣中外之官常明者百有二十可名者三百二十為星二千五百微星之數萬一千五百二十庶物蠢動咸得繫命而衡所鑄之圖遇亂堙滅星官名數今亦不存三國時吳太史令陳卓始列甘氏石氏巫咸三家星官著於圖錄幷注占贊總有二百五十四官一千二百八十三星幷二十八宿及輔官附坐一百八十二星總二百八十三官一千五百六十五星宋元嘉中太史令錢樂之所鑄渾天銅儀以朱黑白三色用殊三家而合陳卓之數高祖平陳得善天官者周墳幷得宋氏渾儀之器乃命庾季才等參校周齊梁陳及祖耳幾孫僧化官私舊圖刊其大小正彼疎密依準三家星位以為蓋圖旁摛始分甄表常度幷具赤黃二道內外兩規懸象著明纏離攸次星之隱顯天漢昭回宛若穹蒼將為正範以墳為太史令墳博考經書勤於教習自此太史觀生始能識天官煬帝又遣宮人四十人就太史局別詔袁充教以星氣業成者進內以參占驗云史臣於觀臺訪渾儀見元魏太史令晁崇所造者以鐵為之其規有六其外四規常定一象地形二象赤道其餘象二極其內二規可以運轉用合八尺之管以窺星度周武帝平齊所得隋開皇三年新都初成以置諸觀臺之上大唐因而用焉馬遷天官書及班氏所載妖星暈珥雲氣虹霓存其大綱未能備舉自後史官更無紀錄春秋傳曰公既視朔遂登觀臺凡分至啟閉必書雲物神道司存安可誣也今略舉其形名占驗次之經星之末云天體古之言天者有三家一曰蓋天二曰宣夜三曰渾天蓋天之說即周髀是也其本庖犧氏立周天曆度其所傳則周公受於殷商周人志之故曰周髀髀股也股者表也其言天似蓋笠地法覆槃天地各中高外下北極之下為天地之中其地最高而滂四隤三光隱映以為晝夜天中高於外衡冬至日之所在六萬里北極下地高於外衡下地亦六萬里外衡高於北極下地二萬里天地隆高相從日去地八萬里日麗天而平轉分冬夏之間日所行道為七衡六間每衡周徑里數各依算術用句股重差推晷影極游以為遠近之數皆得於表股也故曰周髀又周髀家云天圓如張蓋地方如局天旁轉如推磨而左行日月右行天左轉故日月實東行而天牽之以西沒譬之於蟻行磨石之上磨左旋而蟻右去磨疾而蟻遲故不得不隨磨以左廻焉天形南高而北下日出高故見日入下故不見天之居如倚蓋故極在人北是其證也極在天之中而今在人北所以知天之形如倚蓋也日朝出陰中暮入陰中陰氣暗冥故從沒不見也夏時陽氣多陰氣少陽氣光明與日同暉故日出即見無蔽之者故夏日長也冬時陰氣多陽氣少陰氣暗冥掩日之光雖出猶隱不見故冬日短也漢末揚子雲難蓋天八事以通渾天其一云日之東行循黃道晝夜中規牽牛距北極北南百一十度東井距北極南七十度幷百八十度周三徑一二十八宿周天當五百四十度今三百六十度何也其二曰春秋分之日正出在卯入在酉而晝漏五十刻即天蓋轉夜當倍晝今夜亦五十刻何也其三曰日入而星見日出而不見即斗下見日六月不見日六月北斗亦當見六月不見六月今夜常見何也其四曰以蓋圖視天河起斗而東入狼弧間曲如輪今視天河直如繩何也其五曰周天二十八宿以蓋圖視天星見者當少不見者當多今見與不見等何出入無冬夏而兩宿十四星當見不以日長短故見有多少何也其六曰天至高也地至卑也日託天而旋可謂至高矣縱人目可奪水與影不可奪也今從高山上以水望日日出水下影上行何也其七曰視物近則大遠則小今日與北斗近我而小遠我而大何也其八曰視蓋橑與車輻間近杠轂即密益遠益疎今北極為天杠轂二十八宿為天橑輻以星度度天南方次地星間當數倍今交密何也其後桓譚鄭玄蔡邕陸績各陳周髀考驗天狀多有所違逮梁武帝於長春殿講義別擬天體全同周髀之文蓋立新意以排渾天之論而已宣夜之書絕無師法唯漢祕書郎郗萌記先師相傳云天了無質仰而瞻之高遠無極眼瞀精絕故蒼蒼然也譬之旁望遠道之黃山而皆青俯察千仞之深谷而窈黑夫青非真色而黑非有體也日月衆星自然浮生虛空之中其行其止皆須氣焉是以七曜或逝或住或順或逆伏見無常進退不同由乎無所根繫故各異也故辰極常居其所而北斗不與衆星西沒也晉成帝咸康中會稽虞喜因宣夜之說作安天論以為天高窮於無窮地深測於不測天確乎在上有常安之形地魄焉在下有居靜之體當相覆冒方則俱方圓則俱圓無方圓不同之義也其光曜布列各自運行猶江海之有潮汐萬品之有行藏也葛洪聞而譏之曰苟辰宿不麗於天天為無用便可言無何必復云有之而不動乎由此而談葛洪可謂知言之選也喜族祖河間相聳又立穹天論云天形穹隆如雞子幕其際周接四海之表浮乎元氣之上譬如覆奩以抑水而不沒者氣充其中故也日繞辰極沒西還東而不出入地中天之有極猶蓋之有斗也天北下於地三十度極之傾在地卯酉之北亦三十度人在卯酉之南十餘萬里故斗極之下不為地中當對天地卯酉之位耳日行黃道繞極極北去黃道百一十五度南去黃道六十七度二至之所舍以為長短也吳太常姚信造昕天論云人為靈蟲形最似天今人頤前侈臨胸而項不能覆背近取諸身故知天之體南低入地北則偏高也又冬至極低而天運近南故日去人遠而斗去人近北天氣至故水寒也夏至極起而天運近北而斗去人遠日去人近南天氣至故蒸熱也極之高時日行地中淺故夜短天去地高故晝長也極之低時日行地中深故夜長天去地下故晝短也自虞喜虞聳姚信皆好奇徇異之說非極數談天者也前儒舊說天地之體狀如鳥卵天包地外猶之裹黃周旋無端其形渾渾然故曰渾天又曰王表𩹉有水兩儀轉運各乘氣而浮載水而行漢王仲任據蓋天之說以駁渾儀云舊說天轉從地下過今掘地一丈輙有水天何得從水中行乎甚不然也日隨天而轉非入地夫人目所望不過十里天地合矣實非合也遠使然耳今視日入非入也亦遠耳當日入西方之時其下之人亦將謂之為中也四方之人各以其近者為出遠者為入矣何以明之今試使一人把大炬火夜行於平地去人十里火光滅矣非火滅也遠使然耳今日西轉不復見是火滅之類也日月不圓也望視之所以圓者去人遠也夫日火之精也月水之精也水火在地不圓在天何故圓丹陽葛洪釋之曰渾天儀注云天如雞子地如中黃孤居於天內天大而地小天表𩹉有水天地各乘氣而立載水而行周天三百六十五度四分度之一又中分之則半覆地上半繞地下故二十八宿半見半隱天轉如車轂之運也諸論天者雖多然精於陰陽者少張平子陸公紀之徒咸以為推步七曜之道以度曆象昏明之證候校以四八之氣考以漏刻之分占晷影之往來求形驗於事情莫密於渾象也張平子既作銅渾天儀於密室中以漏水轉之與天皆合如符契也崔子玉為其碑銘曰數術窮天地制作侔造化高才偉藝與神合契蓋由於平子渾儀及地動儀之有驗故也若天果如渾者則天之出入行於水中為必然矣故黃帝書曰天在地外水在天外水浮天而載地者也又易曰時乘六龍夫陽爻稱龍龍者居水之物以喻天天陽物也又出入水中與龍相似故比以龍也聖人仰觀俯察審其如此故晉卦坤上離下以證日出於地也又明夷之卦離下坤上以證日入於地也又需卦乾下坎上此亦天入水中之象也天為金金水相生之物也天出入水中當有何損而謂為不可乎然則天之出入水中無復疑矣又今視諸星出於東者初但去地小許耳漸而西行先經人上後遂轉西而下焉不旁旋也其先在西之星亦稍下而沒無北轉者日之出入亦然若謂天磨石轉者衆星日月宜隨天而廻初在於東次經於南次到於西次及於北而復還於東不應橫過去也今日出於東冉冉轉上及其入西亦復漸漸稍下都不繞邊北去了了如此王生必固謂為不然者疏矣今日徑千里其中足以當小星之數十也若日以轉遠之故但當光曜不能復來照及人耳宜猶望見其體不應都失其所在也日光既盛其體又大於星今見極北之小星而不見日之在北者明其不北行也若日以轉遠之故不復可見其比入之間應當稍小而日方入之時反乃更大此非轉遠之徵也王生以火炬喻日吾亦將借子之矛以刺子之楯焉把火之人去人轉遠其光轉微而日月自出至入不漸小也王生以火喻之謬矣又日之入西方視之稍稍去初尚有半如橫破鏡之狀須臾淪沒矣若如王生之言日轉北去者其北都沒之頃宜先如豎破鏡之狀不應如橫破鏡也如此言之日入北方不亦孤孑乎又月之光微不及日遠矣月盛之時雖有重雲蔽之不見月體而夕猶朗然是月光猶從雲中而照外也日若繞西及北者其光故應如月在雲中之狀不得夜便大暗也又日入則星月出焉明知天以日月分主晝夜相代而照也若日常出者不應日亦入而星月出也又案河洛之文皆云水火者陰陽之餘氣也夫言餘氣則不能生日月可知也顧當言日精生火者可耳若水火是日月所生則亦何得盡如日月之圓乎今火出於陽燧陽燧圓而火不圓也水出於方諸方諸方而水不方也又陽燧可以取火於日而無取日於火之理此則日精之生火明矣方諸可以取水於月無取月於水之道此則月精之生水了矣王生又云遠故視之圓若審然者月初生之時及既虧之後何以視之不圓乎而日食或上或下從側而起或如鉤至盡若遠視見圓不宜見其殘缺左右所起也此則渾天之體信而有徵矣宋何承天論渾天象體曰詳尋前說因觀渾儀研求其意有悟天形正圓而水居其半地中高外卑水周其下言四方者東曰暘谷日之所出西曰濛汜日之所入莊子又云北溟有魚化而為鳥將徙於南溟斯亦古之遺記四方皆水證也四方皆水謂之四海凡五行相生水生於金是故百川發源皆自山出由高趣下歸注於海日為陽精光曜炎熾一夜入水所經焦竭百川歸注足以相補故旱不為減浸不為益又云周天三百六十五度三百四分之七十五天常西轉一日一夜過周一度南北二極相去一百一十六度三百四分度之六十五強即天經也黃道衺帶赤道春分交於奎七度秋分交於軫十五度冬至斗十四度半強夏至井十六度半從北極扶天而南五十五度強則居天四維之中最高處也即天頂也其下則地中也自外與王蕃大同王蕃渾天說具於晉史舊說渾天者以日月星辰不問春秋冬夏晝夜晨昏上下去地中皆同無遠近列子曰孔子東遊見兩小兒鬬問其故一小兒曰我以日始出去人近而日中時遠也一小兒曰我以為日初出遠而日中時近也言初出近者曰日初出大如車蓋及其日中裁如盤蓋此不為遠者小近者大乎言日初出遠者曰日初出時滄滄涼涼及其中時熱如探湯此不為近者熱遠者涼乎桓譚新論云漢長水校尉平陵關子陽以為日之去人上方遠而四傍近何以知之星宿昏時出東方其間甚疎相離丈餘及夜半在上方視之甚數相離一二尺以準度望之逾益明白故知天上之遠於傍也日為天陽火為地陽地陽上升天陽下降今置火於地從傍與上診其熱遠近殊不同焉日中正在上覆蓋人人當天陽之衝故熱於始出時又新從太陰中來故復涼於其西在桑榆間也桓君山曰子陽之言豈其然乎張衡靈憲曰日之薄地闇其明也由闇視明明無所屈是以望之若大方其中天地同明明還自奪故望之若小火當夜而揚光在晝則不明也月之於夜與日同而差微晉著作郎陽平束字廣微以為傍方與上方等傍視則天體存於側故日出時視日大也日無小大而所存者有伸厭厭而形小伸而體大蓋其理也又日始出時色白者雖大不甚始出時色赤者其大則甚此終以人目之惑無遠近也且夫置器廣庭則函牛之鼎如釜堂崇十仞則八尺之人猶短物有陵之非形異也夫物有惑心形有亂目誠非斷疑定理之主故仰遊雲以觀月月常動而雲不移乘船以涉水水去而船不徙矣姜岌云余以為子陽言天陽下降日下熱束言天體存於目則日大頗近之矣渾天之體圓周之徑詳之於天度驗之於晷影而紛然之說由人目也參伐初出在旁則其間疎在上則其間數以渾檢之度則均也旁之與上理無有殊也夫日者純陽之精也光明外曜以眩人目故人視日如小及其初出地有遊氣以厭日光不眩人目即日赤而大也無遊氣則色白大不甚矣地氣不及天故一日之中晨夕日色赤而中時日色白地氣上升蒙蒙四合與天連者雖中時亦赤矣日與火相類火則體赤而炎黃日赤宜矣然日色赤者猶火無炎也光衰失常則為異矣梁奉朝請祖耳幾曰自古論天者多矣而羣氏糾紛至相非毀竊覽同異稽之典經仰觀辰極傍矚四維覩日月之升降察五星之見伏校之以儀象覆之以晷漏則渾天之理信而有徵輒遺衆說附渾儀云考靈曜先儒求得天地相去十七萬八千五百里以晷影驗之失於過多既不顯求之術而虛設其數蓋夸誕之辭宜非聖人之旨也學者多固其說而未之革豈不知尋其理歟抑未能求其數故也王蕃所考校之前說不啻減半雖非揆格所知而求之以理誠未能遙趣其實蓋近密乎輙因王蕃天高數以求冬至春分日高及南戴日下去地中數法令表高八尺與冬至影長一丈三尺各自乘幷而開方除之為法天高乘表高為實實如法得四萬二千六百五十八里有奇即冬至日高也以天高乘冬至影長為實實如法得六萬九千三百二十里有奇即冬至南戴日下去地中數也求春秋分數法令表高及春秋分影長五尺三寸九分各自乘幷而開方除之為法因冬至日高實而以法除之得六萬七千五百二里有奇即春秋分日高也以天高乘春秋分影長實實如法而一得四萬五千四百七十九里有奇即春秋分南戴日下去地中數也南戴日下所謂丹穴也推北極里數法夜於地中表南傅地遙望北辰紐星之末令與表端參合以人目去表數及表高各自乘幷而開方除之為法天高乘表高數為實實如法而一即北辰紐星高地數也天高乘人目去表為實實如法即去北戴極下之數也北戴斗極為空桐日去赤道表𩹉二十四度遠寒近暑而中和二分之日去天頂三十六度日去地中四時同度而有寒暑者地氣上騰天氣下降故遠日下而寒近日下而暑非有遠近也猶火居上雖遠而炎在傍雖近而微視日在傍而大居上而小者仰矚為難平觀為易也由視有夷險非遠近之効也今懸珠於百仞之上或置之於百仞之前從而觀之則大小殊矣先儒弗斯取驗虛繁翰墨夷途頓轡雄辭析辯不亦迂哉今大寒在冬至後二氣者寒積而未消也大暑在夏至後二氣者暑積而未歇也寒暑均和乃在春秋分後二氣者寒暑積而未平也譬之火始入室而未甚溫弗事加薪久而逾熾既已遷之猶有餘熱也渾天儀案虞書舜在琁璣玉衡以齊七政則考靈曜所謂觀玉儀之遊昏明主時乃命中星者也琁璣中而星未中為急急則日過其度月不及其宿琁璣未中而星中為舒舒則日不及其度月過其宿琁璣中而星中為調調則風雨時庶草蕃蕪而五穀登萬事康也所言琁璣者謂渾天儀也故春秋文耀鉤云唐堯即位羲和立渾儀而先儒或因星官書北斗第二星名琁第三星名璣第五星名玉衡仍七政之言即以為北斗七星載筆之官莫之或辨史遷班固猶且致疑馬季長創謂璣衡為渾天儀鄭玄亦云其轉運者為璣其持正者為衡皆以玉為之七政者日月五星也以璣衡視其行度以觀天意也故王蕃云渾天儀者羲和之舊器積代相傳謂之璣衡其為用也以察三光以分宿度者也又有渾天象者以著天體以布星辰而渾象之法地當在天中其勢不便故反觀其形地為外匡於已解者無異在內詭狀殊體而合於理可謂奇巧然斯二者以考於天蓋密矣又云古舊渾象以二分為一度周七尺三寸半分而莫知何代所造今案虞喜云落下閎為漢孝武帝於地中轉渾天定時節作泰初曆或其所製也漢孝和帝時太史揆候皆以赤道儀與天度頗有進退以問典星待詔姚崇等皆曰星圖有規法日月實從黃道官無其器至永元十五年詔左中郎將賈逵乃始造太史黃道銅儀至桓帝延熹七年太史令張衡更以銅製以四分為一度周天一丈四尺六寸一分亦於密室中以漏水轉之令司之者閉戶而唱之以告靈臺之觀天者琁璣所加某星始見某星已中某星今沒皆如合符蕃以古製局小以布星辰相去稠穊不得了察張衡所作又復傷大難可轉移蕃今所作以三分為一度周一丈九寸五分四分分之三張古法三尺六寸五分四分分之一減衡法亦三尺六寸五分四分分之一渾天儀法黃赤道各廣一度有半故今所作渾象黃赤道各廣四分半相去七寸二分又云黃赤二道相共交錯其間相去二十四度以兩儀準之二道俱三百六十五度有奇又赤道見者常一百八十二度半強又南北考之天見者亦一百八十二度半強是以知天之體圓如彈丸南北極相去一百八十二度半強也而陸績所作渾象形如鳥卵以施二道不得如法若使二道同規則其間相去不得滿二十四度若令相去二十四度則黃道當長於赤道又兩極相去不翅八十二度半強案績說云天東西徑三十五萬七千里直徑亦然則績意亦以天為正圓也器與言謬頗為乖僻然則渾天儀者其制有機有衡既動靜兼狀以效二儀之情又周旋衡管用考三光之分所以揆正宿度準步盈虛來古之遺法也則先儒所言圓規徑八尺漢候臺銅儀蔡邕所欲寢伏其下者是也梁華林重雲殿前所置銅儀其制則有雙環規相並間相去三寸許正豎當子午其子午之間應南北極之衡各合而為孔以象南北樞植楗於前後以屬焉又有單橫規高下正當渾之半皆周帀分為度數署以維辰之位以象地又有單規斜帶南北之中與春秋二分之日道相應亦周帀分為度數而署以維辰並相連著屬楗植而不動其𩹉又有雙規相並如外雙規內徑八尺周二丈四尺而屬雙軸軸兩頭出規外各二寸許合兩為一內有孔圓徑二寸許南頭入地下注於外雙規南樞孔中以象南極北頭出地上入於外雙規規北樞孔中以象北極其運動得東西轉以象天行其雙軸之間則置衡長八尺通中有孔圓徑一寸當衡之半兩邊有關各注著雙軸衡既隨天象東西轉運又自於雙軸間得南北低仰所以準驗辰曆分考次度其於揆測唯所欲為之者也檢其鑴題是偽劉曜光初六年史官丞南陽孔挺所造則古之渾儀之法者也而宋御史中丞何承天及太中大夫徐爰各著宋史咸以為即張衡所造其儀略舉天狀而不綴經星七曜魏晉喪亂沉沒西戎義熙十四年宋高祖定咸陽得之梁尚書沈約著宋史亦云然皆失之遠矣後魏道武天興初命太史令晁崇修渾儀以觀星象十有餘載至明元永興四年壬子詔造太史候部鐵儀以為渾天法考琁璣之正其銘曰於皇大代配天比祚赫赫明明聲列遐布爰造茲器考正宿度貽法後葉永垂典故其製並以銅鐵唯誌星度以銀錯之南北柱曲抱雙規東西柱直立下有十字水平以植四柱十字之上以龜負雙規其餘皆與劉曜儀大同即今太史候臺所用也渾天象渾天象者其制有機而無衡梁末祕府有以木為之其圓如丸其大數圍南北兩頭有軸徧體布二十八宿三家星黃赤二道及天漢等別為橫規環以匡其外高下管之以象地南軸頭入地注於南植以象南極北軸頭出於地上注於北植以象北極正東西運轉昏明中星既其應度分至氣節亦驗在不差而已不如渾儀別有衡管測揆日月分步星度者也吳太史令陳苗云先賢制木為儀名曰渾天即此之謂耶由斯而言儀象二器遠不相涉則張衡所造蓋亦止在渾象七曜而何承天莫辨儀象之異亦為乖失宋文帝以元嘉十三年詔太史更造渾儀太史令錢樂之依案舊說采效儀象鑄銅為之五分為一度徑六尺八分少周一丈八尺二寸六分少地在天內不動立黃赤二道之規南北二極之規布列二十八宿北斗極星置日月五星於黃道上為之杠軸以象天運昏明中星與天相符梁末置於文德殿前至如斯制以為渾儀儀則內闕衡管以為渾象而地不在外是參兩法別為一體就器用而求猶渾象之流外內天地之狀不失其位也吳時又有葛衡明達天官能為機巧改作渾天使地居于天中以機動之天動而地止以上應晷度則樂之之所放述也到元嘉十七年又作小渾天二分為一度徑二尺二寸周六尺六寸安二十八宿中外官星備足以白青黃等三色珠為三家星其日月五星悉居黃道亦象天運而地在其中宋元嘉所造儀象器開皇九年平陳後並入長安大業初移於東都觀象殿蓋圖晉侍中劉智云顓頊造渾儀黃帝為蓋天然此二器皆古之所制但傳說義者失其用耳昔者聖王正曆明時作圓蓋以圖列宿極在其中廻之以觀天象分三百六十五度四分度之一以定日數日行於星紀轉廻右行故圓規之以為日行道欲明其四時所在故於春也則以青為道於夏也則以赤為道於秋也則以白為道於冬也則以黑為道四季之末各十八日則以黃為道蓋圖已定仰觀雖明而未可正昏明分晝夜故作渾儀以象天體今案自開皇已後天下一統靈臺以後魏鐵渾天儀測七曜盈縮以蓋圖列星坐分黃赤二道距二十八宿分度而莫有更為渾象者矣仁壽四年河間劉焯造皇極曆上啟於東宮論渾天云璿璣玉衡正天之器帝王欽若世傳其象漢之孝武詳考律曆糾落下閎鮮于妄人等共所營定逮于張衡又尋述作亦其體制不異閎等雖閎制莫存而衡造有器至吳時陸績王蕃並要修鑄績小有異蕃乃事同宋有錢樂之魏初晁崇等總用銅鐵小大有殊規域經模不異蕃造觀蔡邕月令章句鄭玄注考靈曜勢同衡法迄今不改焯以愚管留情推測見其數制莫不違爽失之千里差若毫釐大象一乖餘何可驗况赤黃均度月無出入至所定氣不別衡分刻本差輸廻守故其為疎謬不可復言亦既由理不明致使異家間出蓋及宣夜三說並驅平昕安穹四天騰沸至當不二理唯一揆豈容天體七種殊說又影漏去極就渾可推百骸共體本非異物此真已驗彼偽自彰豈朗日未暉爝火不息理有而闕詎不可悲者也昔蔡邕自朔方上書曰以八尺之儀度知天地之象古有其器而無其書常欲寢伏儀下案度成數而為立說邕以負罪朔裔書奏不許邕若蒙許亦必不能邕才不踰張衡衡本豈有遺思也則有器無書觀不能悟焯今立術改正舊渾又以二至之影定去極晷漏幷天地高遠星辰運周所宗有本皆有其率祛今賢之巨惑稽往哲之羣疑豁若雲披朗如霧散為之錯綜數卷已成待得影差謹更啟送又云周官夏至日影尺有五寸張衡鄭玄王蕃陸績先儒等皆以為影千里差一寸言南戴日下萬五千里表影正同天高乃異考之算法必為不可寸差千里亦無典說明為意斷事不可依今交愛之州表北無影計無萬里南過戴日是千里一寸非其實差焯今說渾以道為率道里不定得差乃審既大聖之年升平之日釐改羣謬斯正其時請一水工幷解算術士取河南北平地之所可量數百里南北使正審時以漏平地以繩隨氣至分同日度影得其差率里即可知則天地無所匿其形辰象無所逃其數超前顯聖効象除疑請勿以人廢言不用至大業三年勑諸郡測影而焯尋卒事遂寢廢地中周禮大司徒職以土圭之法測土深正日景以求地中此則渾天之正說立儀象之大本故云日南則景短多暑日北則景長多寒日東則景夕多風日西則景朝多陰日至之景尺有五寸謂之地中天地之所合也四時之所交也風雨之所會也陰陽之所和也然則百物阜安乃建王國焉又考工記匠人建國水地以縣置槷以縣以景為規識日出之景與日入之景晝參諸日中之景夜考之極星以正朝夕案土圭正影經文闕略先儒解說又非明審祖耳幾錯綜經注以推地中其法曰先驗昏旦定刻漏分辰次乃立儀表於準平之地名曰南表漏刻上水居日之中更立一表於南表影末名曰中表夜依中表以望北極樞而立北表令參相直三表皆以懸準定乃觀三表直者其立表之地即當子午之正三表曲者地偏僻每觀中表以知所偏中表在西則立表處在地中之西當更向東求地中若中表在東則立表處在地中之東也當更向西求地中取三表直者為地中之正又以春秋二分之日旦始出東方半體乃立表於中表之東名曰東表令東表與日及中表參相直是視日之夕日入西方半體又立表於中表之西名曰西表亦從中表西望西表及日參相直乃觀三表直者即地南北之中也若中表差近南則所測之地在卯酉之南中表差在北則所測之地在卯酉之北進退南北求三表直正東西者則其地處中居卯酉之正也晷影昔者周公測晷影於陽城以參考曆紀其於周禮在大司徒之職以土圭之法測土深正日景以求地中日至之景尺有五寸則天地之所合四時之所交百物阜安乃建王國然則日為陽精玄象之著然者也生靈因之動息寒暑由其遞代觀陰陽之升降揆天地之高遠正位辨方定時考閏莫近於茲也古法簡略旨趣難究術家考測互有異同先儒皆云夏至立八尺表於陽城其影與土圭等案尚書考靈曜稱日永景尺五寸日短景尺三寸易通卦驗曰冬至之日樹八尺之表日中視其晷景長短以占和否夏至景一尺四寸八分冬至一丈三尺周髀云成周土中夏至景一尺六寸冬至景一丈三尺五寸劉向鴻範傳曰夏至景長一尺五寸八分冬至一丈三尺一寸四分春秋二分景七尺三寸六分後漢四分曆魏景初曆宋元嘉曆大明祖沖之曆皆與考靈曜同漢魏及宋所都皆別四家曆法候影則齊且緯候所陳恐難依據劉向二分之影直以率推非因表候定其長短然尋晷影尺丈雖有大較或地域不改而分寸參差或南北殊方而長短維一蓋術士未能精驗馮古所以致乖今刪其繁雜附於此云梁天監中祖耳幾造八尺銅表其下與圭相連圭上為溝置水以取平正揆測日晷求其盈縮至大同十年太史令虞又用九尺表格江左之影夏至一尺三寸二分冬至一丈三尺七分立夏立秋二尺四寸五分春分秋分五尺三寸九分陳氏一代唯用梁法齊神武以洛陽舊器並徙鄴中以暨文宣受終竟未考驗至武平七年訖干景禮始薦劉孝孫張孟賓等於後主劉張建表測影以考分至之氣草創未就仍遇朝亡周自天和以來言曆者紛紛復出亦驗二至之影以考曆之精粗及高祖踐極之後大議造曆張冑玄兼明揆測言日長之瑞有詔司存而莫能考決至開皇十九年袁充為太史令欲成冑玄舊事復表曰隋興已後日景漸長開皇元年冬至之影長一丈二尺七寸二分自爾漸短至十七年冬至影一丈二尺六寸三分四年冬至在洛陽測影長一丈二尺八寸八分二年夏至影一尺四寸八分自爾漸短至十六年夏至影一尺四寸五分其十八年冬至陰雲不測元年十七年十八年夏至亦陰雲不測周官以土圭之法正日影日至之影尺有五寸鄭玄云冬至之景一丈三尺今十六年夏至之影短於舊五分十七年冬至之影短於舊三寸七分日去極近則影短而日長去極遠則影長而日短行內道則去極近行外道則去極遠堯典云日短星昴以正仲冬據昴星昏中則知堯時仲冬日在須女十度以曆數推之開皇以來冬至日在斗十一度與唐堯之代去極俱近謹案元命包云日月出內道琁璣得其常天帝崇靈聖王初功京房別對曰太平日行上道升平日行次道霸代日行下道伏惟大隋啟運上感乾元影短日長振古希有是時廢庶人勇晉王廣初為太子充奏此事深合時宜上臨朝謂百官曰景長之慶天之祐也今太子新立當須改元宜取日長之意以為年號由是改開皇二十一年為仁壽元年此後百工作役並加程課以日長故也皇太子率百官詣闕陳賀案日徐疾盈縮無常充等以為祥瑞大為議者所貶又考靈曜周髀張衡靈憲及鄭玄注周官並云日影於地千里而差一寸案宋元嘉十九年壬午使使往交州測影夏至之日影出表南三寸二分何承天遙取陽城云夏至一尺五寸計陽城去交州路當萬里而影實差一尺八寸二分是六百里而差一寸也又梁大同中二至所測以八尺表率取之夏至當一尺一寸七分強後魏信都芳注周髀四術稱永平元年戊子當梁天監之七年見洛陽測影又見公孫崇集諸朝士共觀祕書影同是夏至日其中影皆長一尺五寸八分以此推之金陵去洛南北略當千里而影差四寸則二百五十里而影差一寸也况人路迂廻山川登降方於鳥道所校彌多則千里之言未足依也其揆測參差如此故備論之漏刻昔黃帝創觀漏水制器取則以分晝夜其後因以命官周禮挈壺氏則其職也其法總以百刻分于晝夜冬至晝漏四十刻夜漏六十刻夏至晝漏六十刻夜漏四十刻春秋二分晝夜各五十刻日未出前二刻半而明既沒後二刻半乃昏減夜五刻以益晝漏謂之昏旦漏刻皆隨氣增損冬夏二至之間晝夜長短凡差二十刻每差一刻為一箭冬至互起其首凡有四十一箭晝有朝有禺有中有晡有夕夜有甲乙丙丁戊昏旦有星中每箭各有其數皆所以分時代守更其作役漢興張蒼因循古制猶多疎闊及孝武考定星曆下漏以追天度亦未能盡其理劉向鴻範傳記武帝時所用法云冬夏二至之間一百八十餘日晝夜差二十刻大率二至之後九日而增損一刻焉至哀帝時又改用晝夜一百二十刻尋亦寢廢至王莽竊位又遵行之光武之初亦以百刻九日加減法編於甲令為常符漏品至和帝永元十四年霍融上言官曆率九日增減一刻不與天相應或時差至二刻半不如夏曆漏刻隨日南北為長短乃詔用夏曆漏刻依日行黃道去極每差二度四分為增減一刻凡用四十八箭終於魏晉相傳不改宋何承天以月蝕所在當日之衡考驗日宿知移舊六度冬至之日其影極長測量晷度知冬至移舊四日前代諸漏春分晝長秋分晝短差過半刻皆由氣日不正所以而然遂議造漏法春秋二分昏旦晝夜漏各五十五刻齊及梁初因循不改至天監六年武帝以晝夜百刻分配十二辰辰得八刻仍有餘分乃以晝夜為九十六刻一辰有全刻八焉至大同十年又改用一百八刻依尚書考靈曜晝夜三十六頃之數因而三之冬至晝漏四十八刻夜漏六十刻夏至晝漏七十刻夜漏三十八刻春秋二分晝漏六十刻夜漏四十八刻昏旦之數各三刻先令祖耳幾為漏經皆依渾天黃道日行去極遠近為用箭日率陳文帝天嘉中亦命舍人朱史造漏依古百刻為法周齊因循魏漏晉宋梁大同並以百刻分于晝夜隋初用周朝尹公正馬顯所造漏經至開皇十四年鄜州司馬袁充上晷影漏刻充以短影平儀均布十二辰立表隨日影所指辰刻以驗漏水之節十二辰刻互有多少時正前後刻亦不同其二至二分用箭辰刻之法今列之云冬至日出辰正入申正晝四十刻夜六十刻子丑亥各二刻寅戌各六刻卯酉各十三刻辰申各十四刻巳未各十刻午八刻右十四日改箭春秋二分日出卯正入酉正晝五十刻夜五十刻子四刻丑亥七刻寅戌九刻卯酉十四刻辰申九刻巳未七刻午四刻右五日改箭夏至日出寅正入戌正晝六十刻夜四十刻子八刻丑亥十刻寅戌十四刻卯酉十三刻辰申六刻巳未二刻午二刻右一十九日加減一刻改箭袁充素不曉渾天黃道去極之數苟役私智變改舊章其於施用未為精密開皇十七年張冑玄用後魏渾天鐵儀測知春秋二分日出卯酉之北不正當中與何承天所測頗同皆日出卯三刻五十五分入酉四刻二十五分晝漏五十刻一十分夜漏四十九刻四十分晝差六十分刻之四十仁壽四年劉焯上皇極曆有日行遲疾推二十四氣皆有盈縮定日春秋分定日去冬至各八十八日有奇去夏至各九十三日有奇二分定日晝夜各五十刻又依渾天黃道驗知冬至夜漏五十九刻一百分刻之八十六晝漏四十刻一十四分夏至晝漏五十九刻八十六分夜漏四十刻一十四分冬夏二至之間晝夜差一十九刻一百分刻之七十二冑玄及焯漏刻並不施用然其法制皆著在曆術推驗加時最為詳審大業初耿詢作古欹器以漏水注之獻于煬帝帝善之因令與宇文愷依後魏道士李蘭所修道家上法稱漏制造稱水漏器以充行從又作候影分箭上水方器置於東都乾陽殿前鼓下司辰又作馬上漏刻以從行辨時刻揆日晷下漏刻此二者測天地正儀象之本也晷漏沿革今古大殊故列其差以補前闕經星中宮北極五星鉤陳六星皆在紫宮中北極辰也其紐星天之樞也天運無窮三光迭耀而極星不移故曰居其所而衆星共之賈逵張衡蔡邕王蕃陸績皆以北極紐星為樞是不動處也祖耳幾以儀準候不動處在紐星之末猶一度有餘北極大星太一之座也第一星主月太子也第二星主日帝王也第三星主五星庶子也所謂第二星者最赤明者也北極五星最為尊也中星不明主不用事右星不明太子憂鉤陳後宮也太帝之正妃也太帝之坐也北四星曰女御宮八十一御妻之象也鉤陳口中一星曰天皇太帝其神曰耀魄寶主御羣靈秉萬神圖抱極樞四星曰四輔所以輔佐北極而出度授政也太帝上九星曰華蓋蓋所以覆蔽太帝之坐也又九星直曰杠蓋下五星曰五帝內坐設叙順帝所居也客犯紫宮中坐大臣犯主華蓋杠旁六星曰六甲可以分陰陽而紀節候故在帝旁所以布政教而授人時也極東一星曰柱下史主記過古者有左右史此之象也柱史北一星曰女史婦人之微者主傳漏故漢有侍史傳舍九星在華蓋上近河賓客之館主胡人入中國客星守之備姦使亦曰胡兵起傳舍南河中五星曰造父御官也一曰司馬或曰伯樂星亡馬大貴西河中九星如鉤狀曰鈎星伸則地動天一一星在紫宮門右星南天帝之神也主戰鬬知人吉凶者也太一一星在天一南相近亦天帝神也主使十六神知風雨水旱兵革饑饉疾疫災害所生之國也紫宮垣十五星其西蕃七東蕃八在北斗北一曰紫微太帝之坐也天子之常居也主命主度也一曰長垣一曰天營一曰旗星為蕃衞備蕃臣也宮闕兵起旗星直天子出自將宮中兵東垣下五星曰天柱建政教懸圖法之所也常以朔望日懸禁令於天柱以示百司周禮以正歲之月懸法象魏此之類也門內東南維五星曰尚書主納言夙夜諮謀龍作納言此之象也尚書西二星曰陰德陽德主周急振無宮門左星內二星曰大理主平刑斷獄也門外六星曰天牀主寢舍解息燕休西南角外二星曰內主六宮之飲食主后夫人與太子宴飲東北維外六星曰天主盛饌北斗七星輔一星在太微北七政之樞機陰陽之元本也故運乎天中而臨制四方以建四時而均五行也魁四星為琁璣杓三星為玉衡又象號令之主又為帝車取乎運動之義也又魁第一星曰天樞二曰琁三曰璣四曰權五曰玉衡六曰開陽七曰搖光一至四為魁五至七為杓樞為天琁為地璣為人權為時玉衡為音開陽為律搖光為星石氏云第一曰正星主陽德天子之象也二曰法星主陰刑女主之位也三曰令星主禍害也四曰伐星主天理伐無道五曰殺星主中央助四旁殺有罪六曰危星主天倉五穀七曰部星亦曰應星主兵又云一主天二主地三主火四主水五主土六主木七主金又曰一主秦二主楚三主梁四主吳五主趙六主燕七主齊魁中四星為貴人之牢曰天理也輔星傅乎開陽所以佐斗成功也又曰主危正矯不平又曰丞相之象也七政星明其國昌不明國殃斗旁欲多星則安斗中少星則人恐上天下多訟法者無星二十日有輔星明而斗不明臣強主弱斗明輔不明主強臣弱也杓南三星及魁第一星皆曰三公宣德化調七政和陰陽之官也文昌六星在北斗魁前天之六府也主集計天道一曰上將大將建威武二曰次將尚書正左右三曰貴相太常理文緒四曰司祿司中司隸賞功進五曰司命司怪太史主滅咎六曰司寇大理佐理寶所謂一者起北斗魁前近內階者也明潤大小齊天瑞臻文昌北六星曰內階天皇之陛也相一星在北斗南相者總領百司而掌邦教以佐帝王安邦國集衆事也其明吉太陽守一星在相西大將大臣之象也主戒不虞設武備也非其常兵起西北四星曰勢勢腐刑人也天牢六星在北斗魁下貴人之牢也主愆過禁暴淫太微天子庭也五帝之坐也亦十二諸侯府也其外蕃九卿也一曰太微為衡衡主平也又為天庭理法平辭監升授德列宿受符諸神考節舒情稽疑也南蕃中二星間曰端門東曰左執法廷尉之象也西曰右執法御史大夫之象也執法所以舉刺凶姦者也左執法之東左掖門也右執法之西右掖門也東蕃四星南第一曰上相其北東太陽門也第二星曰次相其北中華東門也第三星曰次將其北東太陰門也第四星曰上將所謂四輔也西蕃四星南第一星曰上將其北西太陽門也第二星曰次將其北中華西門也第三曰次相其北西太陰門也第四星曰上相亦四輔也東西蕃有芒及搖動者諸侯謀天子也執法移則刑罰尤急月五星所犯中坐成刑月五星入太微軌道吉西南角外三星曰明堂天子布政之宮也明堂西三星曰靈臺觀臺也主觀雲物察符瑞候災變也左執法東北一星曰謁者主贊賓客也謁者東北三星曰三公內坐朝會之所居也三公北三星曰九卿內坐主治萬事九卿西五星曰內五諸侯內侍天子不之國者也辟雍之禮得則太微諸侯明黃帝坐一星在太微中含樞紐之神也天子動得天度止得地意從容中道則太微五帝坐明坐以光黃帝坐不明人主求賢士以輔法不然則奪勢又曰太微五坐小弱青黑天子國亡四帝坐四星四星俠黃帝坐東方星蒼帝靈威仰之神也南方星赤帝熛怒之神也西方星白帝招距之神也北方星黑帝叶光紀之神也五帝坐北一星曰太子帝儲也太子北一星曰從官侍臣也帝坐東北一星曰幸臣屏四星在端門之內近右執法屏所以壅蔽帝庭也執法主刺舉臣尊敬君上則星光明潤澤郎位十五星在帝坐東北一曰依烏郎位也周官之元士漢官之光祿中散諫議議郎三署郎中是其職也或曰今之尚書也郎位主衞守也其星明大臣有劫主又曰客犯上其星不具后死幸臣誅客星入之大臣為亂郎將一星在郎位北主閱具所以為武備也武賁一星在太微西蕃北下台南靜室旄頭之騎官也常陳七星如畢狀在帝坐北天子宿衞武賁之士以設強毅也星搖動天子自出明則武兵用微則武兵弱三台六星兩兩而居起文昌列招搖太微一曰天柱三公之位也在天曰三台主開德宣符也西近文昌二星曰上台為司命主壽次二星曰中台為司中主宗東二星曰下台為司祿主兵所以昭德塞違也又曰三台為天階太一躡以上下一曰泰階上星為天子下星為女主中階上星為諸侯三公下星為卿大夫下階上星為士下星為庶人所以和陰陽而理萬物也其星有變各以所主占人君臣和集如其常度南四星曰內平近職執法平罪之官也中台之北一星曰大尊貴戚也下台南一星曰武賁衞官也攝提六星直斗杓之南主建時節伺禨祥攝提為楯以夾擁帝席也主九卿明大三公恣客星入之聖人受制西三星曰周鼎主流亡大角一星在攝提間大角者天王座也又為天棟正經紀北三星曰帝席主宴獻酬酢梗河三星在大角北梗河者天矛也一曰天鋒主胡兵又為喪故其變動應以兵喪也星亡其國有兵謀招搖一星在其北一曰矛楯主胡兵占與梗河略相類也招搖與北斗杓間曰天庫星去其所則有庫開之祥也招搖欲與棟星梗河北斗相應則胡常來受命於中國招搖明而不正胡不受命玄戈二星在招搖北玄戈所主與招搖同或云主北夷客星守之胡大敗天槍三星在北斗杓東一曰天鉞天之武備也故在紫宮之左所以禦難也女牀三星在其北後宮御也主女事天棓五星在女牀北天子先驅也主忿爭與刑罰藏兵亦所以禦難也槍棓皆以備非常也一星不具國兵起東七星曰扶筐盛桑之器主勸蠶也七公七星在招搖東天之相也三公之象主七政貫索九星在其前賤人之牢也一曰連索一曰連營一曰天牢主法律禁暴強也牢口一星為門欲其開也九星皆明天下獄煩七星見小赦五星大赦動則斧鑕用中空則更元漢志云十五星天紀九星在貫索東九卿也九河主萬事之紀理怨訟也明則天下多辭訟亡則政理壞國紀亂散絕則地震山崩織女三星在天紀東端天女也主果蓏絲帛珍寶也王者至孝神祇咸喜則織女星俱明天下和平大星怒角布帛貴東足四星曰漸臺臨水之臺也主晷漏律呂之事西之五星曰輦道王者嬉遊之道也漢輦道通南北宮象也左右角間二星曰平道之官平道西一星曰進賢主卿相舉逸才角北二星曰天田亢北六星曰亢池亢舟航也池水也主送往迎來氐北一星曰天乳主甘露房中道一星曰歲守之陰陽平房西二星南北列曰天福主乘輿之官若禮巾車公車之政主祠事東咸西咸各四星在房心北日月五星之道也房之戶所以防淫佚也星明則吉暗則凶月五星犯守之有陰謀東咸西三星南北列曰罰星主受金贖鍵閉一星在房東北近鉤鈐主關鑰天市垣二十二星在房心東北主權衡主聚衆一曰天旗庭主斬戮之事也市中星衆潤澤則歲實星稀則歲虛熒惑守之戮不忠之臣又曰若怒角守之戮者臣殺主彗星除之為徙市易都客星入之兵大起出之有貴喪市中六星臨箕曰市樓市府也主市價律度其陽為金錢其陰為珠玉變見各以所主占之北四星曰天斛主量者也斛西北二星曰列肆主寶玉之貨市門左星內二星曰車肆主衆賈之區帝坐一星在天市中候星西天庭也光而潤則天子吉威令行微小凶大人當之候一星在帝坐東北主伺陰陽也明大輔臣強四夷開候細微則國安亡則主失位移則主不安宦者四星在帝坐西南侍主刑餘之人也星微則吉明則凶非其常宦者有憂斗五星在宦者南主平量仰則天下斗斛不平覆則歲穰宗正二星在帝坐東南宗大夫也彗星守之若失色宗正有事客星守動則天子親屬有變客星守之貴人死宗星二在候星東宗室之象帝輔血脉之臣也客星守之宗人不和東北二星曰帛度東北二星曰屠肆各主其事天江四星在尾北主太陰江星不具天下津河關道不通明若動搖大水出大兵起參差則馬貴熒惑守之有立王客星入之河津絕天籥八星在南斗杓西主關閉建星六星在南斗北亦曰天旗天之都關也為謀事為天鼓為天馬南二星天庫也中央二星市也鈇鑕也上二星旗跗也斗建之間三光道也星動則人勞月暈之蛟龍見牛馬疫月五星犯之大臣相譖臣謀主亦為關梁不通有大水東南四星曰狗國主鮮卑烏丸沃且熒惑守之外夷為變太白逆守之其國亂客星犯守之有大盜其王且來狗國北二星曰天雞主候時天弁九星在建星北市官之長也主列肆闤闠若市籍之事以知市珍也星欲明吉彗星犯守之糴貴囚徒起兵河鼓三星旗九星在牽牛北天鼓也主軍鼓主鈇鉞一曰三武主天子三將軍中央大星為大將軍左星為左將軍右星為右將軍左星南星也所以備關梁而距難也設守阻險知謀徵也旗即天鼓之旗所以為旌表也左旗九星在鼓左旁鼓欲正直而明色黃光澤將吉不正為兵憂也星怒馬貴動則兵起曲則將失計奪勢旗星戾亂相陵旗端四星南北列曰天桴桴鼓桴也星不明漏刻失時前近河鼓若桴鼓相直皆為桴鼓用離珠五星在須女北須女之藏府也女子之星也星非故後宮亂客星犯之後宮凶虛北二星曰司命北二星曰司祿又北二星曰司危又北二星曰司非司命主舉過行罰滅不祥司祿增年延德故在六宗北犯司危主驕佚亡下司非以法多就私瓠瓜五星在離珠北主陰謀主後宮主果食明則歲熟微則歲惡后失勢非其故則山搖谷多水旁五星曰敗瓜主種天津九星梁所以度神通四方也一星不備津關道不通星明動則兵起如流沙死人亂麻微而參差則馬貴若死星亡若從河水為害或曰水賊稱王也東近河邊七星曰車府主車之官也車府東南五星曰人星主靜衆庶柔遠能邇一曰臥星主防淫其南三星內析東南四星曰杵臼主給軍糧客星入之兵起天下聚米天津北四星如衡狀曰奚仲古車正也騰蛇二十二星在營室北天蛇星主水蟲星明則不安客星守之水雨為災水物不收王良五星在奎北居河中天子奉車御官也其四星曰天駟旁一星曰王良亦曰天馬其星動為策馬車騎滿野亦曰王良梁為天橋主御風雨水道故或占津梁其星移有兵亦曰馬病客星守之橋不通前一星曰策王良之御策也主天子僕在王良旁若移在馬後是謂策馬則車騎滿野閣道六星在王良前飛道也從紫宮至河神所乘也一曰閣道主道里天子遊別宮之道也亦曰閣道所以扞難滅咎也一曰王良旗一曰紫宮旗亦所以為旌表而不欲其動搖旗星者兵所用也傅路一星在閣道南旁別道也備閣道之敗復而乘之也一曰太僕主禦風雨亦遊從之義也東壁北十星曰天主馬之官若今驛亭也主傳令置驛逐漏馳鶩謂其行急疾與晷漏競馳天將軍十二星在婁北主武兵中央大星天之大將也外小星吏士也大將星搖兵起大將出小星不具兵發南一星曰軍南門主誰何出入太陵八星在胃北陵者墓也太陵卷舌之口曰積京主大喪也積京中星絕則諸侯有喪民多疾兵起粟聚少則粟散星守之有土功太陵中一星曰積尸明則死人如山天船九星在太陵北居河中一曰舟星主度所以濟不通也亦主水旱不在漢中津河不通中四星欲其均明即天下大安不則兵若喪客彗星出入之為大水有兵中一星曰積水候水災昴西二星曰天街三光之道主伺候關梁中外之境天街西一星曰月卷舌六星在北主口語以知佞讒也曲者吉直而動天下有口舌之害中一星曰天讒主巫醫五車五星三柱九星在畢北五車者五帝車舍也五帝坐也主天子五兵一曰主五穀豐耗西北大星曰天庫主太白主秦次東北星曰獄主辰星主燕趙次東星曰天倉主歲星主魯衞次東南星曰司空主填星主楚次西南星曰卿星主熒惑主魏五星有變皆以其所主而占之三柱一曰三泉一曰休一曰旗五車星欲均明闊狹有常也天子得靈臺之禮則五車三柱均明中有五星曰天潢天潢南三星曰咸池魚囿也月五星入天潢兵起道不通天下亂易政咸池明有龍墮死猛獸及狼害人若兵起五車南六星曰諸王察諸侯存亡西五星曰厲石金若客星守之兵動北八星曰八穀主候歲八穀一星亡一穀不登天關一星在五車南亦曰天門日月所行也主邊事主開閉芒角有兵五星守之貴人多死東井鉞前四星曰司怪主候天地日月星辰變異及鳥獸草木之妖明主聞災修德保福也司怪西北九星曰坐旗君臣設位之表也坐旗西四星曰天高臺榭之高主遠望氣象天高西一星曰天河主察山林妖變南河北河各三星夾東井一曰天高天之闕門主關梁南河曰南戍一曰南宮一曰陽門一曰越門一曰權星主火北河一曰北戍一曰北宮一曰陰門一曰胡門一曰衡星主水兩河戍間日月五星之常道也河戍動搖中國兵起南河三星曰闕丘主宮門外象魏也五諸侯五星在東井北主刺舉戒不虞又曰理陰陽察得失亦曰主帝心一曰帝師二曰帝友三曰三公四曰博士五曰太史此五者常為帝定疑議星明大潤澤則天下大治角則禍在中五諸侯南三星曰天樽主盛饘粥以給酒食之正也積薪一星在積水東供給庖廚之正也水位四星在東井東主水衡客星若水火守犯之百川流溢軒轅十七星在七星北軒轅黃帝之神黃龍之體也后妃之主士職也一曰東陵一曰權星主雷雨之神南大星女主也次北一星妃也次將軍也其次諸星皆次妃之屬也女主南小星女御也左一星少民少后宗也右一星大民太后宗也欲其色黃小而明也軒轅右角南三星曰酒旗酒官之旗也主饗宴飲食五星守酒旗天下大酺有酒肉財物賜若爵宗室酒旗南二星曰天相丞相之象也軒轅西四星曰爟爟者烽火之爟也邊亭之警候爟北四星曰內平少微四星在太微西士大夫之位也一名處士亦天子副主或曰博士官一曰主衞掖門南第一星處士第二星議士第三星博士第四星大夫明大而黃則賢士舉也月五星犯守之處士女主憂宰相易南四星曰長垣主界域及胡夷熒惑入之胡入中國太白入之九卿謀

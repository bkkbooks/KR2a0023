body:
  text: 隋書卷四十八列傳第十三楊素弟約從父文思文紀楊素字處道弘農華陰人也祖暄魏輔國將軍諫議大夫父敷周汾州刺史沒於齊素少落拓有大志不拘小節世人多未之知唯從叔祖魏尚書僕射寬深異之每謂子孫曰處道當逸羣絕倫非常之器非汝曹所逮也後與安定牛弘同志好學研精不倦多所通涉善屬文工草隸頗留意於風角美鬚髯有英傑之表周大冢宰宇文護引為中外記室後轉禮曹加大都督武帝親總萬機素以其父守節陷齊未蒙朝命上表申理帝不許至於再三帝大怒命左右斬之素乃大言曰臣事無道天子死其分也帝壯其言由是贈敷為大將軍諡曰忠壯拜素為車騎大將軍儀同三司漸見禮遇帝命素為詔書下筆立成詞義兼美帝嘉之顧謂素曰善自勉之勿憂不富貴素應聲答曰臣但恐富貴來逼臣臣無心圖富貴及平齊之役素請率父麾下先驅帝從之賜以竹策曰朕方欲大相驅策故用此物賜卿從齊王憲與齊人戰於河陰以功封清河縣子邑五百戶其年授司城大夫明年復從憲拔晉州憲屯兵雞棲原齊主以大軍至憲懼而宵遁為齊兵所躡衆多敗散素與驍將十餘人盡力苦戰憲僅而獲免其後每戰有功及齊平加上開府改封成安縣公邑千五百戶賜以粟帛奴婢雜畜從王軌破陳將吳明徹於呂梁治東楚州事封弟慎為義安侯陳將樊毅築城於泗口素擊走之夷毅所築宣帝即位襲父爵臨貞縣公以弟約為安成公尋從韋孝寬徇淮南素別下盱眙鍾離及高祖為丞相素深自結納高祖甚器之以素為汴州刺史行至洛陽會尉迥作亂滎州刺史宇文冑據武牢以應迥素不得進高祖拜素大將軍發河內兵擊冑破之遷徐州總管進位柱國封清河郡公邑二千戶以弟岳為臨貞公高祖受禪加上柱國開皇四年拜御史大夫其妻鄭氏性悍素忿之曰我若作天子卿定不堪為皇后鄭氏奏之由是坐免上方圖江表先是素數進取陳之計未幾拜信州總管賜錢百萬錦千段馬二百匹而遣之素居永安造大艦名曰五牙上起樓五層高百餘尺左右前後置六拍竿並高五十尺容戰士八百人旗幟加於上次曰黃龍置兵百人自餘平乘舴艋等各有差及大舉伐陳以素為行軍元帥引舟師趣三硤軍至流頭灘陳將戚欣以青龍百餘艘屯兵數千人守狼尾灘以遏軍路其地險峭諸將患之素曰勝負大計在此一舉若晝日下船彼則見我灘流迅激制不由人則吾失其便乃以夜掩之素親率黃龍數千艘銜枚而下遣開府王長襲引步卒從南岸擊欣別柵令大將軍劉仁恩率甲騎趣白沙北岸遲明而至擊之欣敗走悉虜其衆勞而遣之秋毫不犯陳人大悅素率水軍東下舟艫被江旌甲曜日素坐平乘大船容貌雄偉陳人望之懼曰清河公即江神也陳南康內史呂仲肅屯岐亭正據江峽於北岸鑿岩綴鐵鎖三條橫截上流以遏戰船素與仁恩登陸俱發先攻其柵仲肅軍夜潰素徐去其鎖仲肅復據荊門之延洲素遣巴蜑卒千人乘五牙四艘以柏檣碎賊十餘艦遂大破之俘甲士二千餘人仲肅僅以身免陳主遣其信州刺史顧覺鎮安蜀城荊州刺史陳紀鎮公安皆懼而退走巴陵以東無敢守者湘州刺史岳陽王陳叔慎遣使請降素下至漢口與秦孝王會及還拜荊州總管進爵郢國公邑三千戶真食長壽縣千戶以其子玄感為儀同玄奬為清河郡公賜物萬段粟萬石加以金寶又賜陳主妹及女妓十四人素言於上曰里名勝母曾子不入逆人王誼前封於郢臣不願與之同於是改封越國公尋拜納言歲餘轉內史令俄而江南人李稜等聚衆為亂大者數萬小者數千共相影響殺害長吏以素為行軍總管帥衆討之賊朱莫問自稱南徐州刺史以盛兵據京口素率舟師入自楊子津進擊破之晉陵顧世興自稱太守與其都督鮑遷等復來拒戰素逆擊破之執遷虜三千餘人進擊無錫賊帥葉略又平之吳郡沈玄沈傑等以兵圍蘇州刺史皇甫績頻戰不利素率衆援之玄勢迫走投南沙賊帥陸孟孫素擊孟孫於松江大破之生擒孟孫玄黝歙賊帥沈雪沈能據柵自固又攻拔之浙江賊帥高智慧自號東揚州刺史船艦千艘屯據要害兵甚勁素擊之自旦至申苦戰而破智慧逃入海素躡之從餘姚泛海趣永嘉智慧來拒戰素擊走之擒獲數千人賊帥汪文進自稱天子據東陽署其徒蔡道人為司空守樂安進討悉平之又破永嘉賊帥沈孝徹於是步道向天台指臨海郡逐捕遺逸寇前後百餘戰智慧遁守閩越上以素久勞於外詔令馳傳入朝加子玄感官為上開府賜綵物三千段素以餘賊未殄恐為後患又自請行乃下詔曰朕憂勞百姓日旰忘食一物失所情深納隍江外狂狡妄構妖逆雖經殄除民未安堵猶有賊首凶魁逃亡山洞恐其聚結重擾蒼生內史令上柱國越國公素識達古今經謀長遠比曾推轂舊著威名宜任以大兵總為元帥宣布朝風振揚威武擒剪叛亡慰勞黎庶軍民事務一以委之素復乘傳至會稽先是泉州人王國慶南安豪族也殺刺史劉弘據州為亂諸亡賊皆歸之自以海路艱阻非北人所習不設備伍素汎海掩至國慶遑遽棄州而走餘黨散入海島或守溪洞素分遣諸將水陸追捕乃密令人謂國慶曰爾之罪狀計不容誅唯有斬送智慧可以塞責國慶於是執送智慧斬於泉州自餘支黨悉來降附江南大定上遣左領軍將軍獨孤陀至浚儀迎勞比到京師問者日至拜素子玄奬為儀同賜黃金四十斤加銀瓶實以金錢縑三千段馬二百匹羊二千口公田百頃宅一區代蘇威為尚書右僕射與高熲專掌朝政素性疎而辯高下在心朝臣之內頗推高熲敬牛弘厚接薛道衡視蘇威蔑如也自餘朝貴多被陵轢其才藝風調優於高熲至於推誠體國處物平當有宰相識度不如熲遠矣尋令素監營仁壽宮素遂夷山堙谷督役嚴急作者多死宮側時聞鬼哭之聲及宮成上令高熲前視奏稱頗傷綺麗大損人丁高祖不悅素憂懼計無所出即於北門啟獨孤皇后曰帝王法有離宮別館今天下太平造此一宮何足損費后以此理諭上上意乃解於是賜錢百萬錦絹三千段十八年突厥達頭可汗犯塞以素為靈州道行軍總管出塞討之賜物二千段黃金百斤先是諸將與虜戰每慮胡騎奔突皆以戎車步騎相參輿鹿角為方陣騎在其內素謂人曰此乃自固之道非取勝之方也於是悉除舊法令諸軍為騎陣達頭聞之大喜曰此天賜我也因下馬仰天而拜率精騎十餘萬而至素奮擊大破之達頭被重創而遁殺傷不可勝計羣虜號哭而去優詔褒揚賜縑二萬匹及萬釘寶帶加子玄感位大將軍玄奬玄縱積善並上儀同素多權略乘機赴敵應變無方然大抵馭戎嚴整有犯軍令者立斬之無所寬貸每將臨寇輒求人過失而斬之多者百餘人少不下十數流血盈前言笑自若及其對陣先令一二百人赴敵陷陣則已如不能陷陣而還者無問多少悉斬之又令三二百人復進還如向法將士股慄有必死之心由是戰無不勝稱為名將素時貴倖言無不從其從素征伐者微功必錄至於他將雖有大功多為文吏所譴却故素雖嚴忍士亦以此願從焉二十年晉王廣為靈朔道行軍元帥素為長史王卑躬以交素及為太子素之謀也仁壽初代高熲為尚書左僕射賜良馬百匹牝馬二百匹奴婢百口其年以素為行軍元帥出雲州擊突厥連破之突厥退走率騎追躡至夜而及之將復戰恐賊越逸令其騎稍後於是親將兩騎幷降突厥二人與虜並行不之覺也候其頓舍未定趣後騎掩擊大破之自是突厥遠遁磧南無復虜庭以功進子玄感位為柱國玄縱為淮南郡公賞物二萬段及獻皇后崩山陵制度多出於素上善之下詔曰君為元首臣則股肱共治萬姓義同一體上柱國尚書左僕射仁壽宮大監越國公素志度恢弘機鑒明遠懷佐時之略包經國之才王業初基霸圖肇建策名委質受脤出師擒剪凶魁克平虢鄭頻承廟算揚旍江表每禀戎律長驅塞陰南指而吳越肅清北臨而獯獫摧服自居端揆參贊機衡當朝正色直言無隱論文則詞藻縱橫語武則權奇間出既文且武唯朕所命任使之處夙夜無怠獻皇后奄離六宮遠日云及塋兆安厝委素經營然葬事依禮唯卜泉石至如吉凶不由於此素義存奉上情深體國欲使幽明俱泰寶祚無窮以為陰陽之書聖人所作禍福之理特須審慎乃徧歷川原親自占擇纖介不善即更尋求志圖元吉孜孜不已心力備盡人靈協贊遂得神臯福壤營建山陵論素此心事極誠孝豈與夫平戎定寇比其功業非唯廊廟之器實是社稷之臣若不加褒賞何以申茲勸勵可別封一子義康郡公邑萬戶子子孫孫承襲不絕餘如故幷賜田三十頃絹萬段米萬石金鉢一實以金銀鉢一實以珠幷綾錦五百段時素貴寵日隆其弟約從父文思弟文紀及族父虉並尚書列卿諸子無汗馬之勞位至柱國刺史家僮數千後庭妓妾曳綺羅者以千數第宅華侈制擬宮禁有鮑亨者善屬文殷冑者工草隸並江南士人因高智慧沒為家奴親戚故吏布列清顯素之貴盛近古未聞煬帝初為太子忌蜀王秀與素謀之構成其罪後竟廢黜朝臣有違忤者雖至誠體國如賀若弼史萬歲李綱柳彧等素皆陰中之若有附會及親戚雖無才用必加進擢朝廷靡然莫不畏附唯兵部尚書柳述以帝壻之重數於上前面折素大理卿梁毗抗表上言素作威作福上漸疎忌之後因出勑曰僕射國之宰輔不可躬親細務但三五日一度向省評論大事外示優崇實奪之權也終仁壽之末不復通判省事上賜王公以下射素箭為第一上手以外國所獻金精盤價直鉅萬以賜之四年從幸仁壽宮宴賜重疊及上不豫素與兵部尚書柳述黃門侍郎元巖等入閤侍疾時皇太子入居大寶殿慮上有不諱須豫防擬乃手自為書封出問素素錄出事狀以報太子宮人誤送上所上覽而大恚所寵陳貴人又言太子無禮上遂發怒欲召庶人勇太子謀之於素素矯詔追東宮兵士帖上臺宿衞門禁出入並取宇文述郭衍節度又令張衡侍疾上以此日崩由是頗有異論漢王諒反遣茹茹天保來據蒲州燒斷河橋又遣王聃子率數萬人幷力拒守素將輕騎五千襲之潛於渭口宵濟遲明擊之天保敗走聃子懼而以城降有詔徵還初素將行也計日破賊皆如所量帝於是以素為幷州道行軍總管河北安撫大使率衆數萬討諒時晉絳呂三州並為諒城守素各以二千人縻之而去諒遣趙子開擁衆十餘萬策絕徑路屯據高壁布陣五十里素令諸將以兵臨之自引奇兵潛入霍山緣崖谷而進直指其營一戰破之殺傷數萬諒所署介州刺史梁修羅屯介休聞素至懼棄城而走進至清源去幷州三十里諒率其將王世宗趙子開蕭摩訶等衆且十萬來拒戰又擊破之擒蕭摩訶諒退保幷州素進兵圍之諒窮蹙而降餘黨悉平帝遣素弟修武公約齎手詔勞素曰我有隋之御天下也于今二十有四年雖復外夷侵叛而內難不作修文偃武四海晏然朕以不天銜恤在疚號天叩地無所逮及朕本以藩王謬膺儲兩復以庸虛纂承鴻業天下者先皇之天下也所以戰戰兢兢弗敢失墜況復神器之重生民之大哉賊諒苞藏禍心自幼而長羊質獸心假託名譽不奉國諱先圖叛逆違君父之命成莫大之罪誑惑良善委任奸回稱兵內侮毒流百姓私假署置擅相謀戮小加大少凌長民怨神怒衆叛親離為惡不同同歸於亂朕寡兄弟猶未忍及言是故開關門而待寇戢干戈而不發朕聞之天生蒸民為之置君仰惟先旨每以子民為念朕豈得枕伏苫廬顛而不救也大義滅親春秋高義周旦以誅二叔漢啟乃戮七藩義在茲乎事不獲已是以授公戎律問罪太原且逆子賊臣何代不有豈意今者近出家國所歎荼毒甫爾便及此事由朕不能和兄弟不能安蒼生德澤未弘兵戈先動賊亂者止一人塗炭者乃衆庶非唯寅畏天威亦乃孤負付囑薄德厚恥愧乎天下公乃先朝功臣勳庸克茂至如皇基草創百物惟始便匹馬歸朝誠識兼至汴部鄭州風卷秋籜荊南塞北若火燎原早建殊勳夙著誠節及獻替朝端具瞻惟允爰弼朕躬以濟時難昔周勃霍光何以加也賊乃竊據蒲州關梁斷絕公以少擊衆指期平殄高壁據嶮抗拒官軍公以深謀出其不意霧廓雲除冰消瓦解長驅北邁直趣巢窟晉陽之南蟻徒數萬諒不量力猶欲舉斧公以稜威外討發憤於內忘身殉義親當矢石兵刃暫交魚潰鳥散僵屍蔽野積甲若山諒遂守窮城以拒鈇鉞公董率驍勇四面攻圍使其欲戰不敢求走無路智力俱盡面縛軍門斬將搴旗伐叛柔服元惡既除東夏清晏嘉庸茂績於是乎在昔武安平趙淮陰定齊豈若公遠而不勞速而克捷者也朕殷憂諒闇不得親御六軍未能問道於上庠遂使劬勞於行陣言念於此無忘寢食公乃建累世之元勳執一心之確志古人有言曰疾風知勁草世亂有誠臣公得之矣乃銘之常鼎豈止書勳竹帛哉功績克諧哽歎無已稍冷公如宜軍旅務殷殊當勞慮故遣公弟指宣往懷迷塞不次素上表陳謝曰臣自惟虛薄志不及遠州郡之職敢憚劬勞卿相之榮無階覬望然時逢昌運王業惟始雖涓流赴海誠心屢竭輕塵集岳功力蓋微徒以南陽里閭豐沛子弟高位重爵榮顯一時遂復入處朝端出總戎律受文武之任預帷幄之謀豈臣才能實由恩澤欲報之德義極昊天伏惟陛下照重離之明養繼天之德牧臣於疎遠照臣以光暉南服降枉道之書春宮奉肅成之旨然草木無識尚榮枯候時況臣有心實自効無路晝夜廻徨寢食慚惕常懼朝露奄至虛負聖慈賊諒包藏禍心有自來矣因幸國哀便肆凶逆興兵晉代搖蕩山東陛下拔臣於凡流授臣以戎律蒙心膂之寄禀平亂之規蕭王赤心人皆以死漢皇大度天下爭歸妖寇廓清豈臣之力曲蒙使臣弟約齎詔書問勞高旨峻筆有若天臨洪恩大澤便同海運悲欣慚懼五情振越雖百殞微軀無以一報其月還京師因從駕幸洛陽以素領營東京大監以平諒之功拜其子萬石仁行姪玄挺皆儀同三司賚物五萬段綺羅千匹諒之妓妾二十人大業元年遷尚書令賜東京甲第一區物二千段尋拜太子太師餘官如故前後賞錫不可勝計明年拜司徒改封楚公真食二千五百戶其年卒官諡曰景武贈光祿大夫太尉公弘農河東絳郡臨汾文城河內汲郡長平上黨西河十郡太守給轀車班劍四十人前後部羽葆鼓吹粟麥五千石物五千段鴻臚監護喪事帝又下詔曰夫銘功彝器紀德豐碑所以垂名迹於不朽樹風聲於沒世故楚景武公素茂績元勳劬勞王室竭盡誠節協贊朕躬故以道邁三傑功參十亂未臻遐壽遽戢清徽春秋遞代方綿歲祀式播彫篆用圖勳德可立碑宰隧以彰盛美素嘗以五言詩七百字贈番州刺史薛道衡詞氣宏拔風韻秀上亦為一時盛作未幾而卒道衡歎曰人之將死其言也善豈若是乎有集十卷素雖有建立之策及平楊諒功然特為帝所猜忌外示殊禮內情甚薄太史言隋分野有大喪因改封於楚楚與隋同分欲以此厭當之素寢疾之日帝每令名醫診候賜以上藥然密問醫人恐不死素又自知名位已極不肯服藥亦不將慎每語弟約曰我豈須更活耶素負冒財貨營求產業東西二京居宅侈麗朝毀夕復營繕無已爰及諸方都會處邸店水磑幷利田宅以千百數時議以此鄙之子玄感嗣別有傳諸子皆坐玄感誅死約字惠伯素異母弟也在童兒時嘗登樹墮地為查所傷由是竟為宦者性如沉靜內多譎詐好學強記素友愛之凡有所為必先籌於約而後行之在周末以素軍功賜爵安成縣公拜上儀同三司高祖受禪授長秋卿久之為邵州刺史入為宗正少卿轉大理少卿時皇太子無寵而晉王廣規欲奪宗以素幸於上而雅信約於是用張衡計遣宇文述大以金寶賂遺於約因通王意說之曰夫守正履道固人臣之常致反經合義亦達者之令圖自古賢人君子莫不與時消息以避禍患公之兄弟功名蓋世當塗用事有年歲矣朝臣為足下家所屈辱者可勝數哉又儲宮以所欲不行每切齒於執政公雖自結於人主而欲危公者固亦多矣主上一旦棄羣臣公亦何以取庇今皇太子失愛於皇后主上素有廢黜之心此公所知也今若請立晉王在賢兄之口耳誠能因此時建大功王必鐫銘於骨髓斯則去累卵之危成太山之安也約然之因以白素素本凶險聞之大喜乃撫掌而對曰吾之智思殊不及此賴汝起予約知其計行復謂素曰今皇后之言上無不用宜因機會早自結託則匪唯長保榮祿傳祚子孫又晉王傾身禮士聲名日盛躬履節儉有主上之風以約料之必能安天下兄若遲疑一旦有變令太子用事恐禍至無日矣素遂行其策太子果廢及晉王入東宮引約為左庶子改封修武縣公進位大將軍及素被高祖所疎出約為伊州刺史入朝仁壽宮遇高祖崩遣約入京易留守者縊殺庶人勇然後陳兵集衆發高祖凶問煬帝聞之曰令兄之弟果堪大任即位數日拜內史令約有學術兼達時務帝甚任之後數載加位右光祿大夫後帝在東都令約詣京師享廟行至華陰見其兄墓遂枉道拜哭為憲司所劾坐是免官未幾拜淅陽太守其兄子玄感時為禮部尚書與約恩義甚篤既愴分離形於顏色帝謂之曰公比憂瘁得非為叔邪玄感再拜流涕曰誠如聖旨帝亦思約廢立功由是徵入朝未幾卒以素子玄挺後之文思字溫才素從叔也父寬魏左僕射周小冢宰文思在周年十一拜車騎大將軍儀同三司散騎常侍尋以父功封新豐縣子邑五百戶天和初治武都太守十姓獠反文思討平之復治翼州事党項羌叛文思率州兵討平之進擊資中武康隆山生獠及東山獠並破之後從陳王攻齊河陰城又從武帝攻拔晉州以勳進授上儀同三司改封永寧縣公增邑至千戶壽陽劉叔仁作亂從清河公宇文神舉討之戰於塼井在陣生擒叔仁又別從王誼破賊於鯉魚柵其後累以軍功遷果毅右旅下大夫高祖為丞相從韋孝寬拒尉迥於武陟迥遣其將李儁圍懷州與行軍總管宇文述擊走之破尉惇平鄴城皆有功進授上大將軍改封洛川縣公尋拜隆州刺史開皇元年進爵正平郡公加邑二千戶後為魏州刺史甚有惠政及去職吏民思之為立碑頌德轉冀州刺史煬帝嗣位徵為民部尚書轉納言改授右光祿大夫從幸江都宮以足疾不堪趨奏復授民部尚書加位左光祿大夫卒官時年七十諡曰定初文思當襲父爵自以非嫡遂讓封於弟文紀當世多之文紀字溫範少剛正有器局在周襲爵華山郡公邑二千七百戶自右侍上士累遷車騎大將軍儀同三司安州總管長史將兵迎陳降將李瑗於齊安與陳將周法尚軍遇擊走之以功進授開府入為虞部下大夫高祖為丞相改封汾陰縣公從梁睿討王謙以功進授上大將軍前後增邑三千戶拜資州刺史入為宗正少卿坐事除名後數載復其爵位拜熊州刺史改封上明郡公除宗正卿兼給事黃門侍郎判禮部尚書事仁壽二年遷荊州總管歲餘卒官時年五十八諡曰恭史臣曰楊素少而輕俠俶儻不羈兼文武之資包英奇之略志懷遠大以功名自許高祖龍飛將清六合許以腹心之寄每當推轂之重掃妖氛於牛斗江海無波摧驍騎於龍庭匈奴遠遁考其夷凶靜亂功臣莫居其右覽其奇策高文足為一時之傑然專以智詐自立不由仁義之道阿諛時主高下其心營構離宮陷君於奢侈謀廢冢嫡致國於傾危終使宗廟丘墟巿朝霜露究其禍敗之源實乃素之由也幸而得死子為亂階墳土未乾闔門殂戮丘隴發掘宗族誅夷則知積惡餘殃信非徒語多行無禮必自及其斯之謂歟約外示溫柔內懷狡算為蛇畫足終傾國本俾無遺育宜哉

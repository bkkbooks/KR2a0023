body:
  text: 隋書卷五十四列傳第十九王長述王長述京兆霸城人也祖羆魏太尉父慶遠周淮州刺史長述幼有儀範年八歲周太祖見而異之曰王公有此孫足為不朽解褐員外散騎侍郎封長安縣伯累遷撫軍將軍銀青光祿大夫太子舍人長述早孤少為祖羆所養及羆薨居喪過禮有詔褒異之免喪襲封扶風郡公邑三千戶除中書舍人修起居注改封龍門郡公從于謹平江陵有功增邑五百戶周受禪又增邑通前四千七百戶拜賓部大夫出為晉州刺史轉玉壁總管長史尋授司憲大夫出拜廣州刺史甚有威惠吏人懷之在任數年蠻夷歸之者三萬餘戶朝議嘉之就拜大將軍後歷襄仁二州總管並有能名及高祖為丞相授信州總管部內夷獠猶有未賓長述討平之進位上大將軍王謙作亂益州遣使致書於長述因執其使上其書又陳取謙之策上大悅前後賜黃金五百兩授行軍總管率衆討謙以功進位柱國開皇初復獻平陳之計修營戰艦為上流之師上善其能頻加賞勞下書曰每覽高策深相嘉歎命將之日當以公為元帥也後數歲以行軍總管擊南寧未至道病卒上甚傷惜之令使者弔祭贈上柱國冀州刺史諡曰莊子謨嗣謨弟軌大業末東郡通守少子文楷起部郎李衍李衍字拔豆遼東襄平人也父弼周太師衍少專武藝慷慨有志略周太祖時釋褐千牛備身封懷仁縣公加開府改封普寧縣公遷義州刺史尋從韋孝寬鎮玉壁城數與賊戰敵人憚之及平齊以軍功進授大將軍改封真鄉郡公拜左宮伯賜雜綵三百匹奴婢二十口賜子仲威爵浮陽郡公後歷定鄜二州刺史及王謙作亂高祖以衍為行軍總管從梁睿擊平之進位上大將軍賜縑二千匹開皇元年又以行軍總管討叛蠻平之進位柱國賜帛二千匹尋檢校利州總管事明年突厥犯塞以行軍總管率衆討之不見虜而還轉介州刺史後數年朝廷將有事江南詔衍於襄州道營戰船及大舉伐陳授行軍總管從秦王俊出襄陽道以功賜帛三千匹米六百石拜安州總管頗有惠政歲餘以疾還京師卒於家時年五十七子仲威嗣衍弟子長雅尚高祖女襄國公主襲父綸爵為河陽郡公開皇初拜將軍散騎常侍歷內史侍郎河州刺史檢校奏州總管衍從孫密別有傳伊婁謙伊婁謙字彥恭本鮮卑人也其先代為酋長隨魏南遷祖信中部太守父靈相隆二州刺史謙性忠直善辭令仕魏為直閤將軍周受禪累遷宣納上士使持節車騎大將軍武帝將伐齊引入內殿從容謂曰朕將有事戎馬何者為先謙對曰愚臣誠不足以知大事但偽齊僭擅跋扈不恭沈溺倡優耽昏麴糵其折衝之將斛律明月己斃讒人之口上下離心道路仄目若命六師臣之願也帝大笑因使謙與小司寇拓拔偉聘齊觀釁帝尋發兵齊主知之令其僕射陽休之責謙曰貴朝盛夏徵兵馬首何向謙答曰僕憑式之始未聞興師設復西增白帝之城東益巴丘之戍人情理豈足怪哉謙參軍高遵以情輸於齊遂拘留謙不遣帝克幷州召謙勞之曰朕之舉兵本俟卿還不圖高遵中為叛逆乖朕宿心遵之罪也乃執遵付謙任令報復謙頓首請赦之帝曰卿可聚衆唾面令知愧也謙跪曰以遵之罪又非唾面之責帝善其言而止謙竟待遵如初其寬厚仁恕皆此類也尋賜爵濟陽縣伯累遷前驅中大夫大象中進爵為侯加位開府高祖作相授亳州總管俄徵還京既平王謙謙恥與逆人同名因爾稱字高祖受禪以彥恭為左武候將軍俄拜大將軍進爵為公數年出為澤州刺史清約自處甚得人和以疾去職吏人攀戀行數百里不絕數歲卒於家時年七十子傑嗣田仁恭田仁恭字長貴平涼長城人也父弘周大司空仁恭性寬仁有局度在周以明經為掌式中士後以父軍功賜爵鶉陰子大冢宰宇文護引為中外兵曹後數載復以父功拜開府儀同三司遷中外府掾從護征伐數有戰功改封襄武縣公邑五百戶從武帝平齊加授上開府進封淅陽郡公增邑二千戶拜幽州總管宣帝時進爵雁門郡公高祖為丞相徵拜小司馬進位大將軍從韋孝寬破尉遲迥於相州拜柱國高祖受禪進上柱國拜太子太師甚見親重嘗幸其第宴飲極歡禮賜殊厚奉詔營廟社進爵觀國公增邑通前五千戶未幾拜右武衞大將軍歲餘卒官時年四十七贈司空諡曰敬子世師嗣次子德懋在孝義傳時有任城郡公王景鮮虞縣公謝慶恩並官至上柱國大義公辛遵及其弟韶並官至柱國高祖以其俱佐命功臣特加崇貴親禮與仁恭等事皆亡失云元亨元亨字德良一名孝才河南洛陽人也父季海魏司徒馮翊王遇周齊分隔季海遂仕長安亨時年數歲與母李氏在洛陽齊神武帝以亨父在關西禁錮之其母則魏司空李沖之女也素有智謀遂詐稱凍餒請就食於滎陽齊人以其去關西尚遠老婦弱子不以為疑遂許之李氏陰託大豪李長壽攜亨及孤姪八人潛行草間得至長安周太祖見而大悅以亨功臣子甚優禮之亨年十二魏恭帝在儲宮引為交友釋褐千牛備身大統末襲爵馮翊王邑千戶授拜之日悲慟不能自勝俄遷通直散騎常侍歷武衞將軍勳州刺史改封平涼王周閔帝受禪例降為公明武時歷隴州刺史御正大夫小司馬宣帝時為洛州刺史高祖為丞相遇尉遲迥作亂洛陽人梁康邢流水等舉兵應迥旬日之間衆至萬餘州治中王文舒潛與梁康相結將圖亨亨陰知其謀乃選關中兵得二千人為左右執文舒斬之以兵襲擊梁康邢流水皆破之高祖受禪徵拜太常卿增邑七百戶尋出為衞州刺史加大將軍衞土俗薄亨以威嚴鎮之在職八年風化大洽後以老病表乞骸骨吏人詣闕上表請留臥治上嗟歎者久之其年亨以篤疾重請還京上令使者致醫藥問動靜相望於道歲餘卒于家時年六十九諡曰宣杜整杜整字皇育京兆杜陵人也祖盛魏直閤將軍潁川太守父闢渭州刺史整少有風概九歲丁父憂哀毀骨立事母以孝聞及長驍勇有旅力好讀孫吳兵法魏大統末襲爵武鄉侯周太祖引為親信後事宇文護子中山公訓甚被親遇俄授都督明帝時為內侍上士累遷儀同三司拜武州刺史從武帝平齊加上儀同進爵平原縣公邑千戶入為勳曹中大夫高祖為丞相進位開府及受禪加上開府進封長廣郡公俄拜左武衞將軍在職數年以母憂去職起令視事開皇六年突厥犯塞詔遣衞王爽總戎北伐以整為行軍總管兼元帥長史至合川無虜而還整密進取陳之策上善之於是以行軍總管鎮襄陽尋病卒時年五十五高祖聞而傷之贈帛四百匹米四百石諡曰襄子楷嗣官至開府整弟肅亦少有志行開皇初為通直散騎常侍北地太守李徹李徹字廣達朔方巖綠人也父和開皇初為柱國徹性剛毅有器幹偉容儀多武藝大冢宰宇文護引為親信尋拜殿中司馬累遷奉車都尉護以徹謹厚有才具甚禮之護子中山公訓為蒲州刺史護令徹以本官從焉未幾拜車騎大將軍儀同三司武帝時從皇太子西征吐谷渾以功賜爵同昌縣男邑三百戶後從帝拔晉州及帝班師徹與齊王憲屯雞栖原齊主高緯以大軍至憲引兵西上以避其鋒緯遣其驍將賀蘭豹子率勁騎躡憲戰於晉州城北憲師敗徹與楊素宇文慶等力戰憲軍賴以獲全復從帝破齊師於汾北乘勝下高壁拔晉陽擒高湝於冀州俱有力焉錄前後功加開府別封蔡陽縣公邑千戶宣帝即位從韋孝寬略定淮南每為先鋒及淮南平即授淮州刺史安集初附甚得其歡心高祖受禪加上開府轉雲州刺史歲餘徵為左武衞將軍及晉王廣之鎮幷州也朝廷妙選正人有文武才幹者為之僚佐上以徹前代舊臣數持軍旅詔徹總晉王府軍事進爵齊安郡公時蜀王秀亦鎮益州上謂侍臣曰安得文同王子相武如李廣達者乎其見重如此明年突厥沙鉢略可汗犯塞上令衞王爽為元帥率衆擊之以徹為長史遇虜於白道行軍總管李充言於爽曰周齊之世有同戰國中夏力分其來久矣突厥每侵邊諸將輒以全軍為計莫能死戰由是突厥勝多敗少所以每輕中國之師今者沙鉢略悉國內之衆屯據要險必輕我而無備精兵襲之可破也爽從之諸將多以為疑唯徹奬成其計請與同行遂與充率精騎五千出其不意掩擊大破之沙鉢略棄所服金甲潛草中而遁以功加上大將軍沙鉢略因此屈膝稱藩未幾沙鉢略為阿拔所侵上疏請援以徹為行軍總管率精騎一萬赴之阿拔聞而遁去及軍還復領行軍總管屯平涼以備胡寇封安道郡公開皇十年進位柱國及晉王廣轉牧淮海以徹為揚州總管司馬改封德廣郡公尋徙封城陽郡公其後突厥犯塞徹復領行軍總管擊破之左僕射高熲之得罪也以徹素與熲相善因被疎忌不復任使後出怨言上聞而召之入臥內賜宴言及平生因遇鴆而卒大業中其妻宇文氏為孽子安遠誣以呪詛伏誅崔彭崔彭字子彭博陵安平人也祖楷魏殷州刺史父謙周荊州總管彭少孤事母以孝聞性剛毅有武略工騎射善周官尚書略通大義周武帝時為侍伯上士累轉門正上士及高祖為丞相周陳王純鎮齊州高祖恐純為變遣彭以兩騎徵純入朝彭未至齊州三十里因詐病止傳舍遣人謂純曰天子有詔書至王所彭苦疾不能強步願王降臨之純疑有變多將從騎至彭所彭出傳舍迎之察純有疑色恐不就徵因詐純曰王可避人將密有所道純麾從騎彭又曰將宣詔王可下馬純遽下彭顧其騎士曰陳王不從詔徵可執也騎士因執而鎖之彭乃大言曰陳王有罪詔徵入朝左右不得輒動其從者愕然而去高祖見而大悅拜上儀同及踐阼遷監門郎將兼領右衞長史賜爵安陽縣男數歲轉車騎將軍俄轉驃騎典宿衞性謹密在省闥二十餘年每當上在仗危坐終日未嘗有怠惰之容上甚嘉之上每謂彭曰卿當上日我寢處自安又嘗曰卿弓馬固以絕人頗知學不彭曰臣少愛周禮尚書每於休沐之暇不敢廢也上曰試為我言之彭因說君臣戒慎之義上稱善觀者以為知言後加上開府遷備身將軍上嘗宴達頭可汗使者於武德殿有鴿鳴於梁上上命彭射之既發而中上大悅賜錢一萬及使者反可汗復遣使於上曰請得崔將軍一與相見上曰此必善射聞於虜庭所以來請耳遂遣之及至匈奴中可汗召善射者數十人因擲肉於野以集飛鳶遣其善射者射之多不中復請彭射之彭連發數矢皆應弦而落突厥相顧莫不歎服可汗留彭不遣百餘日上賂以繒綵然後得歸仁壽末進爵安陽縣公邑二千戶煬帝即位遷左領軍大將軍從幸洛陽彭督後軍時漢王諒初平餘黨往往屯聚令彭率衆數萬鎮遏山東復領慈州事帝以其清賜絹五百匹未幾而卒時年六十三帝遣使弔祭贈大將軍諡曰肅子寶德嗣史臣曰王長述等或出總方岳或入司禁旅咸著聲績以功名終有以取之也伊婁謙志量弘遠不念舊惡請赦高遵之罪有國士之風焉崔彭巡警巖廊毅然難犯禦侮之寄有足稱乎

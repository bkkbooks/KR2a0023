body:
  text: 隋書卷八十一列傳第四十六東夷高麗高麗之先出自夫餘夫餘王嘗得河伯女因閉於室內為日光隨而照之感而遂孕生一大卵有一男子破殼而出名曰朱蒙夫餘之臣以朱蒙非人所生咸請殺之王不聽及壯因從獵所獲居多又請殺之其母以告朱蒙朱蒙棄夫餘東南走遇一大水深不可越朱蒙曰我是河伯外孫日之子也今有難而追兵且及如何得渡於是魚鼈積而成橋朱蒙遂渡追騎不得濟而還朱蒙建國自號高句麗以高為氏朱蒙死子閭達嗣至其孫莫來興兵遂幷夫餘至裔孫位宮以魏正始中入寇西安平毌丘儉拒破之位宮玄孫之子曰昭列帝為慕容氏所破遂入丸都焚其宮室大掠而還昭列帝後為百濟所殺其曾孫璉遣使後魏璉六世孫湯在周遣使朝貢武帝拜湯上開府遼東郡公遼東王高祖受禪湯復遣使詣闕進授大將軍改封高麗王歲遣使朝貢不絕其國東西二千里南北千餘里都於平壤城亦曰長安城東西六里隨山屈曲南臨浿水復有國內城漢城並其都會之所其國中呼為三京與新羅每相侵奪戰爭不息官有太大兄次大兄次小兄次對盧次意侯奢次烏拙次太大使者次大使者次小使者次褥奢次翳屬次仙人凡十二等復有內評外評五部褥薩人皆皮冠使人加插鳥羽貴者冠用紫羅飾以金銀服大袖衫大口袴素皮帶黃革屨婦人裙襦加襈兵器與中國略同每春秋校獵王親臨之人稅布五匹穀五石遊人則三年一稅十人共細布一匹租戶一石次七斗下五斗反逆者縛之於柱爇而斬之籍沒其家盜則償十倍用刑既峻罕有犯者樂有五絃琴箏篳篥橫吹簫鼓之屬吹蘆以和曲每年初聚戲於浿水之上王乘腰輿列羽儀以觀之事畢王以衣服入水分左右為二部以水石相濺擲諠呼馳逐再三而止俗好蹲踞潔淨自喜以趨走為敬拜則曳一脚立各反拱行必搖手性多詭伏父子同川而浴共室而寢婦人淫奔俗多遊女有婚嫁者取男女相悅然即為之男家送猪酒而已無財聘之禮或有受財者人共恥之死者殯於屋內經三年擇吉日而葬居父母及夫之喪服皆三年兄弟三月初終哭泣葬則鼓作樂以送之埋訖悉取死者生時服玩車馬置於墓側會葬者爭取而去敬鬼神多淫祠開皇初頻有使入朝及平陳之後湯大懼治兵積穀為守拒之策十七年上賜湯璽書曰朕受天命愛育率土委王海隅宣揚朝化欲使圓首方足各遂其心王每遣使人歲常朝貢雖稱藩附誠節未盡王既人臣須同朕德而乃驅逼靺鞨固禁契丹諸藩頓顙為我臣妾忿善人之慕義何毒害之情深乎太府工人其數不少王必須之自可聞奏昔年潛行財貨利動小人私將弩手逃竄下國豈非修理兵器意欲不臧恐有外聞故為盜竊時命使者撫慰王藩本欲問彼人情教彼政術王乃坐之空館嚴加防守使其閉目塞耳永無聞見有何陰惡弗欲人知禁制官司畏其訪察又數遣馬騎殺害邊人屢騁姦謀動作邪說心在不賓朕於蒼生悉如赤子賜王土宇授王官爵深恩殊澤彰著遐邇王專懷不信自猜疑常遣使人密覘消息純臣之義豈若是也蓋當由朕訓導不明王之愆違一已寬恕今日以後必須改革守藩臣之節奉朝正之典自化爾藩勿忤他國則長享富貴實稱朕心彼之一方雖地狹人少然普天之下皆為朕臣今若黜王不可虛置終須更選官屬就彼安撫王若洒心易行率由憲章即是朕之良臣何勞別遣才彥也昔帝王作法仁信為先有善必賞有惡必罰四海之內具聞朕旨王若無罪朕忽加兵自餘藩國謂朕何也王必虛心納朕此意慎勿疑惑更懷異圖往者陳叔寶代在江陰殘害人庶驚動我烽候抄掠我邊境朕前後誡勑經歷十年彼則恃長江之外聚一隅之衆惛狂驕傲不從朕言故命將出師除彼凶逆來往不盈旬月兵騎不過數千歷代逋寇一朝清蕩遐邇乂安人神胥悅聞王歎恨獨致悲傷黜陟幽明有司是職罪王不為陳滅賞王不為陳存樂禍好亂何為爾也王謂遼水之廣何如長江高麗之人多少陳國朕若不存含育責王前愆命一將軍何待多力慇懃曉示許王自新耳宜得朕懷自求多福湯得書惶恐將奉表陳謝會病卒子元嗣立高祖使使拜元為上開府儀同三司襲爵遼東郡公賜衣一襲元奉表謝恩幷賀祥瑞因請封王高祖優冊元為王明年元率靺鞨之衆萬餘騎寇遼西營州總管韋沖擊走之高祖聞而大怒命漢王諒為元帥總水陸討之下詔黜其爵位時餽運不繼六軍乏食師出臨渝關復遇疾疫王師不振及次遼水元亦惶懼遣使謝罪上表稱遼東糞土臣元云云上於是罷兵待之如初元亦歲遣朝貢煬帝嗣位天下全盛高昌王突厥啟人可汗並親詣闕貢獻於是徵元入朝元懼藩禮頗闕大業七年帝將討元之罪車駕渡遼水上營於遼東城分道出師各頓兵於其城下高麗率兵出拒戰多不利於是皆嬰城固守帝令諸軍攻之又勑諸將高麗若降者即宜撫納不得縱兵城將陷賊輒言請降諸將奉旨不敢赴機先令馳奏比報至賊守禦亦備隨出拒戰如此者再三帝不悟由是食盡師老轉輸不繼諸軍多敗績於是班師是行也唯於遼水西拔賊武厲邏置遼東郡及通定鎮而還九年帝復親征之乃勑諸軍以便宜從事諸將分道攻城賊勢日蹙會楊玄感作亂反書至帝大懼即日六軍並還兵部侍郎斛斯政亡入高麗高麗具知事實悉銳來追殿軍多敗十年又發天下兵會盜賊蜂起人多流亡所在阻絕軍多失期至遼水高麗亦困弊遣使乞降囚送斛斯政以贖罪帝許之頓於懷遠鎮受其降款仍以俘囚軍實歸至京師以高麗使者親告於太廟因拘留之仍徵元入朝元竟不至帝勑諸軍嚴裝更圖後舉會天下大亂遂不克復行百濟百濟之先出自高麗國其國王有一侍婢忽懷孕王欲殺之婢云有物狀如雞子來感於我故有娠也王捨之後遂生一男棄之廁溷久而不死以為神命養之名曰東明及長高麗王忌之東明懼逃至淹水夫餘人共奉之東明之後有仇台者篤於仁信始立其國于帶方故地漢遼東太守公孫度以女妻之漸以昌盛為東夷強國初以百家濟海因號百濟歷十餘代代臣中國前史載之詳矣開皇初其王餘昌遣使貢方物拜昌為上開府帶方郡公百濟王其國東西四百五十里南北九百餘里南接新羅北拒高麗其都曰居拔城官有十六品長曰左平次大率次恩率次德率次杅率次奈率次將德服紫帶次施德皂帶次固德赤帶次李德青帶次對德以下皆黃帶次文督次武督次佐軍次振武次剋虞皆用白帶其冠制並同唯奈率以上飾以銀花長史三年一交代畿內為五部部有五巷士人居焉五方各有方領一人方佐貳之方有十郡郡有將其人雜有新羅高麗倭等亦有中國人其衣服與高麗略同婦人不加粉黛女辮髮垂後已出嫁則分為兩道盤於頭上俗尚騎射讀書史能吏事亦知醫藥蓍龜占相之術以兩手據地為敬有僧尼多寺塔有鼓角箜篌箏竽箎笛之樂投壺圍樗蒲握槊弄珠之戲行宋元嘉曆以建寅月為歲首國中大姓有八族沙氏燕氏氏解氏貞氏國氏木氏氏婚娶之禮略同於華喪制如高麗有五穀牛猪雞多不火食厥田下濕人皆山居有巨栗每以四仲之月王祭天及五帝之神並其始祖仇台廟於國城歲四祠之國西南人島居者十五所皆有城邑平陳之歲有一戰船漂至海東牟羅國其船得還經于百濟昌資送之甚厚幷遣使奉表賀平陳高祖善之下詔曰百濟王既聞平陳遠令奉表往復至難若逢風浪便致傷損百濟王心迹淳至朕已委知相去雖遠事同言面何必數遣使來相體悉自今以後不須年別入貢朕亦不遣使往王宜知之使者舞蹈而去開皇十八年昌使其長史王辯那來獻方物屬興遼東之役遣使奉表請為軍導帝下詔曰往歲為高麗不供職貢無人臣禮故命將討之高元君臣恐懼畏服歸罪朕已赦之不可致伐厚其使而遣之高麗頗知其事以兵侵掠其境昌死子餘宣立死子餘璋立大業三年璋遣使者燕文進朝貢其年又遣使者王孝鄰入獻請討高麗煬帝許之令覘高麗動靜然璋內與高麗通和挾詐以窺中國七年帝親征高麗璋使其臣國智牟來請軍期帝大悅厚加賞錫遣尚書起部郎席律詣百濟與相知明年六軍渡遼璋亦嚴兵於境聲言助軍實持兩端尋與新羅有隙每相戰爭十年復遣使朝貢後天下亂使命遂絕其南海行三月有牟羅國南北千餘里東西數百里土多麞鹿附庸於百濟百濟自西行三日至貊國云新羅新羅國在高麗東南居漢時樂浪之地或稱斯羅魏將毌丘儉討高麗破之奔沃沮其後復歸故國留者遂為新羅焉故其人雜有華夏高麗百濟之屬兼有沃沮不耐韓獩之地其王本百濟人自海逃入新羅遂王其國傳祚至金真平開皇十四年遣使貢方物高祖拜真平為上開府樂浪郡公新羅王其先附庸於百濟後因百濟征高麗高麗人不堪戎役相率歸之遂致強盛因襲百濟附庸於迦羅國其官有十七等其一曰伊罰干貴如相國次伊尺干次迎干次破彌干次大阿尺干次阿尺干次乙吉干次沙咄干次及伏干次大奈摩干次奈摩次大舍次小舍次吉土次大烏次小烏次造位外有郡縣其文字甲兵同於中國選人壯健者悉入軍烽戍邏俱有屯管部伍風俗刑政衣服略與高麗百濟同每正月旦相賀王設宴會班賚羣官其日拜日月神至八月十五日設樂令官人射賞以馬布其有大事則聚羣官詳議而定之服色尚素婦人辮髮繞頭以雜綵及珠為飾婚嫁之禮唯酒食而已輕重隨貧富新婚之夕女先拜舅姑次即拜夫死有棺斂葬起墳陵王及父母妻子喪持服一年田甚良沃水陸兼種其五穀果菜鳥獸物產略與華同大業以來歲遣朝貢新羅地多山險雖與百濟構隙百濟亦不能圖之靺鞨靺鞨在高麗之北邑落俱有酋長不相總一凡有七種其一號粟末部與高麗相接勝兵數千多驍武每寇高麗中其二曰伯咄部在粟末之北勝兵七千其三曰安車骨部在伯咄東北其四曰拂部在伯咄東其五曰號室部在拂東其六曰黑水部在安車骨西北其七曰白山部在粟末東南勝兵並不過三千而黑水部尤為勁健自拂以東矢皆石鏃即古之肅慎氏也所居多依山水渠帥曰大莫弗瞞咄東夷中為強國有徒太山者俗甚敬畏上有熊羆豹狼皆不害人人亦不敢殺地卑濕築土如堤鑿穴以居開口向上以梯出入相與偶耕土多粟麥穄水氣鹹生鹽於木皮之上其畜多猪嚼米為酒飲之亦醉婦人服布男子衣猪狗皮俗以溺洗手面於諸夷最為不潔其俗淫而妬其妻外婬人有告其夫者夫輒殺妻殺而後悔必殺告者由是姦婬之事終不發揚人皆射獵為業角弓長三尺箭長尺有二寸常以七八月造毒藥傅矢以射禽獸中者立死開皇初相率遣使貢獻高祖詔其使曰朕聞彼土人庶多能勇捷今來相見實副朕懷朕視爾等如子爾等宜敬朕如父對曰臣等僻處一方道路悠遠聞內國有聖人故來朝拜既蒙勞賜親奉聖顏下情不勝歡喜願得長為奴僕也其國西北與契丹相接每相劫掠後因其使來高祖誡之曰我憐念契丹與爾無異宜各守土境豈不安樂何為輒相攻擊甚乖我意使者謝罪高祖因厚勞之令宴飲於前使者與其徒皆起舞其曲折多戰鬬之容上顧謂侍臣曰天地間乃有此物常作用兵意何其甚也然其國與隋懸隔唯粟末白山為近煬帝初與高麗戰頻敗其衆渠帥度地稽率其部來降拜為右光祿大夫居之柳城與邊人來往悅中國風俗請被冠帶帝嘉之賜以錦綺而褒寵之及遼東之役度地稽率其徒以從每有戰功賞賜優厚十三年從帝幸江都尋放歸柳城在塗遇李密之亂密遣兵邀之前後十餘戰僅而得免至高陽復沒於王須拔未幾遁歸羅藝流求國流求國居海島之中當建安郡東水行五日而至土多山洞其王姓歡斯氏名渴剌兜不知其由來有國代數也彼土人呼之為可老羊妻曰多拔荼所居曰波羅檀洞塹柵三重環以流水樹棘為藩王所居舍其大一十六間琱刻禽獸多鬬鏤樹似橘而葉密條纖如髮然下垂國有四五帥統諸洞洞有小王往往有村村有鳥了帥並以善戰者為之自相樹立理一村之事男女皆以白紵繩纏髮從項後盤繞至額其男子用鳥羽為冠裝以珠貝飾以赤毛形製不同婦人以羅紋白布為帽其形正方織鬬鏤皮幷雜色紵及雜毛以為衣製裁不一綴毛垂螺為飾雜色相間下垂小貝其聲如珮綴鐺施釧懸珠於頸織藤為笠飾以毛羽有刀矟弓箭劍鈹之屬其處少鐵刃皆薄小多以骨角輔助之編紵為甲或用熊豹皮王乘木獸令左右輿之而行導從不過數十人小王乘机鏤為獸形國人好相攻擊人皆驍健善走難死而耐創諸洞各為部隊不相救助兩陣相當勇者三五人出前跳噪交言相罵因相擊射如其不勝一軍皆走遣人致謝即共和解收取鬬死者共聚而食之仍以髑髏將向王所王則賜之以冠使為隊帥無賦斂有事則均稅用刑亦無常准皆臨事科決犯罪皆斷於鳥了帥不伏則上請於王王令臣下共議定之獄無枷鎖唯用繩縛決死刑以鐵錐大如筯長尺餘鑽頂而殺之輕罪用杖俗無文字望月虧盈以紀時節候草藥枯以為年歲人深目長鼻頗類於胡亦有小慧無君臣上下之節拜伏之禮父子同牀而寢男子拔去髭鬢身上有毛之處皆亦除去婦人以墨黥手為蟲蛇之文嫁娶以酒肴珠貝為娉或男女相悅便相匹偶婦人產乳必食子衣產後以火自灸令汗出五日便平復以木槽中暴海水為鹽木汁為酢釀米為酒其味甚薄食皆用手偶得異味先進尊者凡有宴會執酒者必待呼名而後飲上王酒者亦呼王名銜杯共飲頗同突厥歌呼蹋蹄一人唱衆皆和音頗哀怨扶女子上膊搖手而舞其死者氣將絕舉至庭親賓哭泣相弔浴其屍以布帛纏之裹以葦草親土而殯上不起墳子為父者數月不食肉南境風俗少異人有死者邑里共食之有熊羆豺狼尤多猪雞無牛羊驢馬厥田良沃先以火燒而引水灌之持一插以石為刃長尺餘闊數寸而墾之土宜稻粱黍麻豆赤豆胡豆黑豆等木有楓栝樟松楩楠杉梓竹籐果藥同於江表風土氣候與嶺南相類俗事山海之神祭以酒肴鬬戰殺人便將所殺人祭其神或依茂樹起小屋或懸髑髏於樹上以箭射之或累石繫幡以為神主王之所居壁下多聚髑髏以為佳人間門戶上必安獸頭骨角大業元年海師何蠻等每春秋二時天清風靜東望依希似有煙霧之氣亦不知幾千里三年煬帝令羽騎尉朱寬入海求訪異俗何蠻言之遂與蠻俱往因到流求國言不相通掠一人而返明年帝復令寬慰撫之流求不從寬取其布甲而還時倭國使來朝見之曰此夷邪久國人所用也帝遣武賁郎將陳稜朝請大夫張鎮州率兵自義安浮海擊之至高華嶼又東行二日至鼊嶼又一日便至流求初稜將南方諸國人從軍有崐崘人頗解其語遣人慰諭之流求不從拒逆官軍稜擊走之進至其都頻戰皆敗焚其宮室虜其男女數千人載軍實而還自爾遂絕倭國倭國在百濟新羅東南水陸三千里於大海之中依山島而居魏時譯通中國三十餘國皆自稱王夷人不知里數但計以日其國境東西五月行南北三月行各至於海其地勢東高西下都於邪靡堆則魏志所謂邪馬臺者也古云去樂浪郡境及帶方郡並一萬二千里在會稽之東與儋耳相近漢光武時遣使入朝自稱大夫安帝時又遣使朝貢謂之倭奴國桓靈之間其國大亂遞相攻伐歷年無主有女子名卑彌呼能以鬼道惑衆於是國人共立為王有男弟佐卑彌理國其王有侍婢千人罕有見其面者唯有男子二人給王飲食通傳言語其王有宮室樓觀城柵皆持兵守衞為法甚嚴自魏至于齊梁代與中國相通開皇二十年倭王姓阿每字多利思比孤號阿輩雞彌遣使詣闕上令所司訪其風俗使者言倭王以天為兄以日為弟天未明時出聽政跏趺坐日出便停理務云委我弟高祖曰此太無義理於是訓令改之王妻號雞彌後宮有女六七百人名太子為利歌彌多弗利無城郭內官有十二等一曰大德次小德次大仁次小仁次大義次小義次大禮次小禮次大智次小智次大信次小信員無定數有軍尼一百二十人猶中國牧宰八十戶置一伊尼翼如今里長也十伊尼翼屬一軍尼其服飾男子衣裙襦其袖微小履如屨形漆其上繫之於脚人庶多跣足不得用金銀為飾故時衣橫幅結束相連而無縫頭亦無冠但垂髮於兩耳上至隋其王始制冠以錦綵為之以金銀鏤花為飾婦人束髮於後亦衣裙襦裳皆有襈攕竹為梳編草為薦雜皮為表緣以文皮有弓矢刀矟弩斧漆皮為甲骨為矢鏑雖有兵無征戰其王朝會必陳設儀仗奏其國樂戶可十萬其俗殺人強盜及姦皆死盜者計贓酬物無財者沒身為奴自餘輕重或流或杖每訊究獄訟不承引者以木壓膝或張強弓以弦鋸其項或置小石於沸湯中令所競者探之云理曲者即手爛或置蛇甕中令取之云曲者即螫手矣人頗恬靜罕爭訟少盜賊樂有五弦琴笛男女多黥臂點面文身沒水捕魚無文字唯刻木結繩敬佛法於百濟求得佛經始有文字知卜筮尤信巫覡每至正月一日必射戲飲酒其餘節略與華同好博握槊樗蒲之戲氣候溫暖草木冬青土地膏腴水多陸少以小環挂鸕項令入水捕魚日得百餘頭俗無盤俎藉以檞葉食用手餔之性質直有雅風女多男少婚嫁不取同姓男女相悅者即為婚婦入夫家必先跨犬乃與夫相見婦人不淫妬死者斂以棺槨親賓就屍歌舞妻子兄弟以白布製服貴人三年殯於外庶人卜日而瘞及葬置屍船上陸地牽之或以小輿有阿蘇山其石無故火起接天者俗以為異因行禱祭有如意寶珠其色青大如雞卵夜則有光云魚眼精也新羅百濟皆以倭為大國多珍物並敬仰之通使往來大業三年其王多利思比孤遣使朝貢使者曰聞海西菩薩天子重興佛法故遣朝拜兼沙門數十人來學佛法其國書曰日出處天子致書日沒處天子無恙云云帝覽之不悅謂鴻臚卿曰蠻夷書有無禮者勿復以聞明年上遣文林郎裴清使於倭國度百濟行至竹島南望羅國經都斯麻國䄄在大海中又東至一支國又至竹斯國又東至秦王國其人同於華夏以為夷洲疑不能明也又經十餘國達於海岸自竹斯國以東皆附庸於倭倭王遣小德阿輩臺從數百人設儀仗鳴鼓角來迎後十日又遣大禮哥多毗從二百餘騎郊勞既至彼都其王與清相見大悅曰我聞海西有大隋禮義之國故遣朝貢我夷人僻在海隅不聞禮義是以稽留境內不即相見今故清道飾館以待大使冀聞大國惟新之化清答曰皇帝德並二儀澤流四海以王慕化故遣行人來此宣諭既而引清就館其後清遣人謂其王曰朝命既達請即戒塗於是設宴享以遣清復令使者隨清來貢方物此後遂絕史臣曰廣谷大川異制人生其間異俗嗜欲不同言語不通聖人因時設教所以達其志而通其俗也九夷所居與中夏懸隔然天性柔順無獷暴之風雖緜邈山海而易以道御夏殷之代時或來王暨箕子避地朝鮮始有八條之禁疎而不漏簡而可久化之所感千載不絕今遼東諸國或衣服參冠冕之容或飲食有俎豆之器好尚經術愛樂文史遊學於京都者往來繼路或亡沒不歸非先哲之遺風其孰能致於斯也故孔子曰言忠信行篤敬雖蠻貊之邦行矣誠哉斯言其俗之可採者豈徒楛矢之貢而已乎自高祖撫有周餘惠此中國開皇之末方事遼左天時不利師遂無功二代承基志包宇宙頻踐三韓之域屢發千鈞之弩小國懼亡敢同困獸兵連不戢四海騷然遂以土崩喪身滅國兵志有之曰務廣德者昌務廣地者亡然遼東之地不列於郡縣久矣諸國朝正奉貢無闕於歲時二代震而矜之以為人莫若己不能懷以文德遽動干戈內恃富強外思廣地以驕取怨以怒興師若此而不亡自古未之聞也然則四夷之戒安可不深念哉

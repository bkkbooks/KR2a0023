body:
  text: 隋書卷六十六列傳第三十一李諤李諤字士恢趙郡人也好學解屬文仕齊為中書舍人有口辯每接對陳使周武帝平齊拜天官都上士諤見高祖有奇表深自結納及高祖為丞相甚見親待訪以得失于時兵革屢動國用虛耗諤上重穀論以諷焉高祖深納之及受禪歷比部考功二曹侍郎賜爵南和伯諤性公方明達世務為時論所推遷治書侍御史上謂羣臣曰朕昔為大司馬每求外職李諤陳十二策苦勸不許朕遂決意在內今此事業諤之力也賜物二千段諤見禮教凋敝公卿薨亡其愛妾侍婢子孫輒嫁賣之遂成風俗諤上書曰臣聞追遠慎終民德歸厚三年無改方稱為孝如聞朝臣之內有父祖亡沒日月未久子孫無賴便分其妓妾嫁賣取財有一於茲實損風化妾雖微賤親承衣履服斬三年古今通式豈容遽褫縗絰強傅鉛華泣辭靈几之前送付他人之室凡在見者猶致傷心況乎人子能堪斯忍復有朝廷重臣位望通貴平生交舊情若弟兄及其亡沒杳同行路朝聞其死夕規其妾方便求娉以得為限無廉恥之心棄友朋之義且居家理治可移於官既不正私何能贊務上覽而嘉之五品以上妻妾不得改醮始於此也諤又以屬文之家體尚輕薄遞相師効流宕忘反於是上書曰臣聞古先哲王之化民也必變其視聽防其嗜欲塞其邪放之心示以淳和之路五教六行為訓民之本詩書禮易為道義之門故能家復孝慈人知禮讓正俗調風莫大於此其有上書獻賦制誄鐫銘皆以褒德序賢明勳證理苟非懲勸義不徒然降及後代風教漸落魏之三祖更尚文詞忽君人之大道好雕蟲之小藝下之從上有同影響競騁文華遂成風俗江左齊梁其弊彌甚貴賤賢愚唯務吟詠遂復遺理存異尋虛逐微競一韻之奇爭一字之巧連篇累牘不出月露之形積案盈箱唯是風雲之狀世俗以此相高朝廷據茲擢士祿利之路既開愛尚之情愈篤於是閭里童昏貴遊總丱未窺六甲先製五言至如羲皇舜禹之典伊傅周孔之說不復關心何嘗入耳以傲誕為清虛以緣情為勳績指儒素為古拙用詞賦為君子故文筆日繁其政日亂良由棄大聖之軌模構無用以為用也損本逐末流徧華壤遞相師祖久而愈扇及大隋受命聖道聿興屏黜輕浮遏止華偽自非懷經抱質志道依仁不得引預搢紳參廁纓冕開皇四年普詔天下公私文翰並宜實錄其年九月泗州刺史司馬幼之文表華豔付所司治罪自是公卿大臣咸知正路莫不鑽仰墳集棄絕華綺擇先王之令典行大道於茲世如聞外州遠縣仍踵敝風選吏舉人未遵典則至有宗黨稱孝鄉曲歸仁學必典謨交不苟合則擯落私門不加收齒其學不稽古逐俗隨時作輕薄之篇章結朋黨而求譽則選充吏職舉送天朝蓋由縣令刺史未行風教猶挾私情不存公道臣既忝憲司職當糾察若聞風即劾恐挂網者多請勒諸司普加搜訪有如此者具狀送臺諤又以當官者好自矜伐復上奏曰臣聞舜戒禹云汝惟不矜天下莫與汝爭能汝惟不伐天下莫與汝爭功言偃又云事君數斯辱矣朋友數斯疏矣此皆先哲之格言後王之軌轍然則人臣之道陳力濟時雖勤比大禹功如師望亦不得厚自矜伐上要君父況復功無足紀勤不補過而敢自陳勳績輕干聽覽世之喪道極於周代下無廉恥上使之然用人唯信其口取士不觀其行矜誇自大便以幹濟蒙擢謙恭靜退多以恬默見遺是以通表陳誠先論己之功狀承顏敷奏亦道臣最用心自衒自媒都無慚恥之色強干橫請唯以乾沒為能自隋受命此風頓改耕夫販婦無不革心況乃大臣仍遵敝俗如聞刺史入京朝覲乃有自陳勾檢之功諠訴堦墀之側言辭不遜高自稱譽上黷冕旒特為難恕凡如此輩具狀送臺明加罪黜以懲風軌上以諤前後所奏頒示天下四海靡然向風深革其弊諤在職數年務存大體不尚嚴猛由是無剛謇之譽而潛有匡正多矣邳公蘇威以臨道店舍乃求利之徒事業污雜非敦本之義遂奏高祖約遣歸農有願依舊者所在州縣錄附市籍仍撤毀舊店並令遠道限以時日正值冬寒莫敢陳訴諤因別使見其如此以為四民有業各附所安逆旅之與旗亭自古非同一概即附市籍於理不可且行旅之所依託豈容一朝而廢徒為勞擾於事非宜遂專決之並令依舊使還詣闕然後奏聞高祖善之曰體國之臣當如此矣以年老出拜通州刺史甚有惠政民夷悅服後三歲卒官有子四人大體大鈞並官至尚書郎世子大方襲爵最有材品大業初判內史舍人帝方欲任之遇卒鮑宏鮑宏字潤身東海郯人也父機以才學知名事梁官至治書侍御史宏七歲而孤為兄泉之所愛育年十二能屬文嘗和湘東王繹詩繹嗟賞不已引為中記室遷鎮南府諮議尚書水部郎轉通直散騎侍郎江陵既平歸于周明帝甚禮之引為麟趾殿學士累遷遂伯下大夫與杜子暉聘于陳謀伐齊也陳遂出兵江北以侵齊帝嘗問宏取齊之策宏對云我強齊弱勢不相侔齊主昵近小人政刑日紊至尊仁惠慈恕法令嚴明事等建瓴何憂不剋但先皇往日出師洛陽彼有其備每不剋捷如臣計者進兵汾潞直掩晉陽出其不虞以為上策帝從之及定山東除少御正賜爵平遙縣伯邑六百戶加上儀同高祖作相奉使山南會王謙舉兵於蜀路次潼州為謙將達奚惎所執逼送成都竟不屈節謙敗之後馳傳入京高祖嘉之賜以金帶及受禪加開府除利州刺史進爵為公轉卭州刺史秩滿還京時有尉義臣者其父崇不從尉迥後復與突厥戰死上嘉之將賜姓為金氏訪及羣下宏對曰昔項伯不同項羽漢高賜姓劉氏秦真父能死難魏武賜姓曹氏如臣愚見請賜以皇族高祖曰善因賜義臣姓為楊氏後授均州刺史以目疾免卒於家時年九十六初周武帝勑宏修皇室譜一部分為帝緒疎屬賜姓三篇有集十卷行於世裴政裴政字德表河東聞喜人也高祖壽孫從宋武帝徙家于壽陽歷前軍長史廬江太守祖邃梁侍中左衞將軍豫州大都督父之禮廷尉卿政幼明敏博聞強記達於時政為當時所稱年十五辟邵陵王府法曹參軍事轉起部郎枝江令湘東王之臨荊州也召為宣惠府記室尋除通直散騎侍郎侯景作亂加壯武將軍帥師隨建寧侯王琳進討之擒賊率宋子仙獻于荊州及平侯景先鋒入建鄴以軍功連最封夷陵侯徵授給事黃門侍郎復帥師副王琳拒蕭紀破之於硤口加平越中郎將鎮南府長史及周師圍荊州琳自桂州來赴難次于長沙政請從間道先報元帝至百里洲為周人所獲蕭詧謂政曰我武皇帝之孫也不可為爾君乎爾亦何煩殉身於七父若從我計則貴及子孫如或不然分腰領矣政詭曰唯命詧鎖之送至城下使謂元帝曰王僧辯聞臺城被圍已自為帝王琳孤弱不復能來政許之既而告城中曰援兵大至各思自勉吾以間使被擒當以碎身報國監者擊其口終不易辭詧怒命趣行戮蔡大業諫曰此民望也若殺之則荊州不可下矣因得釋會江陵陷與城中朝士俱送于京師周文帝聞其忠授員外散騎侍郎引事相府命與盧辯依周禮建六卿設公卿大夫士幷撰次朝儀車服器用多遵古禮革漢魏之法事並施行尋授刑部下大夫轉少司憲政明習故事又參定周律能飲酒至數斗不亂簿案盈几剖決如流用法寬平無有寃濫囚徒犯極刑者乃許其妻子入獄就之至冬將行決皆曰裴大夫致我於死死無所恨其處法詳平如此又善鍾律嘗與長孫紹遠論樂語在音律志宣帝時以忤旨免職高祖攝政召復本官開皇元年轉率更令加位上儀同三司詔與蘇威等修定律令政採魏晉刑典下至齊梁沿革輕重取其折衷同撰著者十有餘人凡疑滯不通皆取決於政進位散騎常侍轉左庶子多所匡正見稱純売心東宮凡有大事皆以委之右庶子劉榮性甚專固時武職交番通事舍人趙元愷作辭見帳未及成太子有旨再三催促榮語元愷云但爾口奏不須造帳及奏太子問曰名帳安在元愷曰禀承劉榮不聽造帳太子即以詰榮榮便拒諱云無此語太子付政推問未及奏狀有附榮者先言於太子曰政欲陷榮推事不實太子召責之政奏曰凡推事有兩一察情一據證審其曲直以定是非臣察劉榮位高任重縱令實語元愷蓋是纖介之愆計理而論不須隱諱又察元愷受制於榮豈敢以無端之言妄相點累二人之情理正相似元愷引左衞率崔蒨等為證蒨等款狀悉與元愷符同察情既敵須以證定臣謂榮語元愷事必非虛太子亦不罪榮而稱政平直政好面折人短而退無後言時雲定興數入侍太子為奇服異器進奉後宮又緣女寵來往無節政數切諫太子不納政因謂定興曰公所為者不合禮度又元妃暴薨道路籍籍此於太子非令名也願公自引退不然將及禍定興怒以告太子太子益疎政由是出為襄州總管妻子不之官所受秩奉散給僚吏民有犯罪者陰悉知之或竟歲不發至再三犯乃因都會時於衆中召出親案其罪五人處死流徙者甚衆合境惶懾令行禁止小民蘇息稱為神明爾後不修囹圄殆無爭訟卒官年八十九著承聖降錄十卷及太子廢高祖追憶之曰向遣裴政劉行本在共匡弼之猶應不令至此子南金仕至膳部郎柳莊柳莊字思敬河東解人也祖季遠梁司徒從事中郎父遐霍州刺史莊少有遠量博覽墳籍兼善辭令濟陽蔡大寶有重名於江左時為岳陽王蕭詧諮議見莊便歎曰襄陽水鏡復在於茲矣大寶遂以女妻之俄而詧辟為參軍轉法曹及詧稱帝還署中書舍人歷給事黃門侍郎吏部郎中鴻臚卿及高祖輔政蕭巋令莊奉書入關時三方搆難高祖懼巋有異志及莊還謂莊曰孤昔以開府從役江陵深蒙梁主殊眷今主幼時艱猥蒙顧託中夜自省實懷慚懼梁主奕葉重光委誠朝廷而今已後方見松筠之節君還本國幸申孤此意於梁主也遂執莊手而別時梁之將帥咸潛請興師與尉迥等為連衡之勢進可以盡節於周氏退可以席卷山南唯巋疑為不可會莊至自長安具申高祖結託之意遂言於巋曰昔袁紹劉表王淩諸葛誕之徒並一時之雄傑也及據要害之地擁哮闞之羣功業莫建而禍不旋踵者良由魏武晉氏挾天子保京都仗大義以為名故能取威定霸今尉迥雖曰舊將昏耄已甚消難王謙常人之下者非有匡合之才況山東庸蜀從化日近周室之恩未洽在朝將相多為身計競効節於楊氏以臣料之迥等終當覆滅隋公必移周國未若保境息民以觀其變巋深以為然衆議遂止未幾消難奔陳迥及謙相次就戮巋謂莊曰近者若從衆人之言社稷已不守矣高祖踐阼莊又入朝高祖深慰勉之及為晉王廣納妃于梁莊因是往來四五反前後賜物數千段蕭琮嗣位遷太府卿及梁國廢授開府儀同三司尋除給事黃門侍郎幷賜以田宅莊明習舊章雅達政事凡所駁正帝莫不稱善蘇威為納言重莊器識常奏帝云江南人有學業者多不習世務習世務者又無學業能兼之者不過於柳莊高熲亦與莊甚厚莊與陳茂同官不能降意茂見上及朝臣多屬意於莊心每不平常謂莊為輕己帝與茂有舊曲被引召數陳莊短經歷數載譖愬頗行尚書省嘗奏犯罪人依法合流而上處以大辟莊奏曰臣聞張釋之有言法者天子所與天下共也今法如是更重之是法不信於民心方今海內無事正是示信之時伏願陛下思釋之之言則天下幸甚帝不從由是忤旨俄屬尚藥進丸藥不稱旨茂因密奏莊不親監臨帝遂怒十一年徐璒等反於江南以行軍總管長史隨軍討之璒平即授饒州刺史甚有治名後數載卒官年六十二源師源師字踐言河南洛陽人也父文宗有重名於齊開皇初終於莒州刺史師早有聲望起家司空府參軍事稍遷尚書左外兵郎中又攝祠部後屬孟夏以龍見請雩時高阿那肱為相謂真龍出見大驚喜問龍所在師整容報曰此是龍星初見依禮當雩祭郊壇非謂真龍別有所降阿那肱忿然作色曰何乃干知星宿祭竟不行師出而竊歎曰國家大事在祀與戎禮既廢也何能久乎齊亡無日矣七年周武帝平齊授司賦上士高祖受禪除魏州長史入為尚書考功侍郎仍攝吏部朝章國憲多所參定十七年歷尚書左右丞以明幹著稱時蜀王秀頗違法度乃以師為益州總管司馬俄而秀被徵秀恐京師有變將謝病不行師數勸之不可違命秀作色曰此自我家事何預卿也師垂涕對曰師荷國厚恩忝參府幕僚吏之節敢不盡心但比年以來國家多故秦孝王寢疾奄至薨殂庶人二十年太子相次淪廢聖上之情何以堪處而有勑追王已淹時月今乃遷延未去百姓不識王心儻生異議內外疑駭發雷霆之詔降一介之使王何以自明願王自計之秀乃從徵秀廢之後益州官屬多相連坐師以此獲免後加儀同三司煬帝即位拜大理少卿帝在顯仁宮勑宮外衞士不得輒離所守有一主帥私令衞士出外帝付大理繩之師據律奏徒帝令斬之師奏曰此人罪誠難恕若陛下初便殺之自可不關文墨既付有司義歸典脫宿衞近侍者更有此犯將何以加之帝乃止轉刑部侍郎師居職強明有口辯而無廉平之稱未幾卒官有子崐玉郎茂郎茂字蔚之山新市人也父基齊潁川太守茂少敏慧七歲誦騷雅日千餘言十五師事國子博士河間權會受詩易三禮及玄象刑名之學又就國子助教長樂張率禮受三傳羣言至忘寢食家人恐茂成病節其燈燭及長稱為學者頗解屬文年十九丁父憂居喪過禮仕齊解褐司空府行參軍會陳使傅縡來聘令茂接對之後奉詔於祕書省刊定載籍遷保城令有能名百姓為立清德頌及周武平齊上柱國王誼薦之授陳州戶曹屬高祖為亳州總管見而悅之命掌書記時周武帝為象經高祖從容謂茂曰人主之所為也感天地動鬼神而象經多糾法將何以致治茂竊歎曰此言豈常人所及也乃陰自結納高祖亦親禮之後還家為州主簿高祖為丞相以書召之言及疇昔甚歡授衞州司錄有能名尋除衞國令時有繫囚二百茂親自究審數日釋免者百餘人歷年辭訟不詣州省魏州刺史元暉謂茂曰長史言衞國民不敢申訴者畏明府耳茂進曰民猶水也法令為隄防隄防不固必致奔突苟無決溢使君何患哉暉無以應之有民張元預與從父弟思蘭不睦丞尉請加嚴法茂曰元預兄弟本相憎疾又坐得罪彌益其忿非化民之意也於是遣縣中耆舊更往敦諭道路不絕元預等各生感悔詣縣頓首請罪茂曉之以義遂相親睦稱為友悌茂自延州長史轉太常丞遷民部侍郎時尚書右僕射蘇威立條章每歲責民間五品不遜或答者乃云管內無五品之家不相應領類多如此又為餘糧簿擬有無相贍茂以為繁紆不急皆奏罷之數歲以母憂去職未朞起令視事又奏身死王事者子不退田品官年老不減地皆發於茂茂性明敏剖決無滯當時以吏幹見稱仁壽初以本官領大興令煬帝即位遷雍州司馬尋轉太常少卿後二歲拜尚書左丞參掌選事茂工法理為世所稱時工部尚書宇文愷右翊衞大將軍于仲文競河東銀窟茂奏劾之曰臣聞貴賤殊禮士農異業所以人知局分家識廉恥宇文愷位望已隆祿賜優厚拔葵去織寂爾無聞求利下交曾無愧色于仲文大將宿衞近臣趨侍階庭朝夕聞道虞芮之風抑而不慕分銖之利知而必爭何以貽範庶僚示民軌物若不糾繩將虧政教愷與仲文竟坐得罪茂撰州郡圖經一百卷奏之賜帛三百段以書付祕府于時帝每巡幸王綱已紊法令多失茂既先朝舊臣明習世事然善自謀身無謇諤之節見帝忌刻不敢措言唯竊歎而已以年老上表乞骸骨不許會帝親征遼東以茂為晉陽宮留守其年山贊治王文同與茂有隙奏茂朋黨附下罔上詔遣納言蘇威御史大夫裴蘊雜治之茂素與二人不平因深文巧詆成其罪狀帝大怒及其弟司隸別駕楚之皆除名為民徙且末郡茂怡然受命不以為憂在途作登壠賦以自慰詞義可觀復附表自陳帝頗悟十年追還京兆歲餘而卒時年七十五有子知年高構高構字孝基北海人也性滑稽多智辯給過人好讀書工吏事弱冠州補主簿仕齊河南王參軍事歷徐州司馬蘭陵平原二郡太守齊滅後周武帝以為許州司馬高祖受禪轉冀州司馬甚有能名徵拜比部侍郎尋轉民部時內史侍郎晉平東與兄子長茂爭嫡尚書省不能斷朝臣三議不決構斷而合理上以為能召入內殿勞之曰我聞尚書郎上應列宿觀卿才識方知古人之言信矣嫡庶者禮教之所重我讀卿判數徧詞理愜當意所不能及賜米百石由是知名尋遷雍州司馬以明斷見稱歲餘轉吏部侍郎號為稱職復徙雍州司馬坐事左轉盩厔令甚有治名上善之復拜雍州司馬又為吏部侍郎以公事免煬帝立召令復位時為吏部者多以不稱職去官唯構最有能名前後典選之官皆出其下時人以構好劇談頗謂輕薄然其內懷方雅特為吏部尚書牛弘所重後以老病解職弘時典選凡將有所擢用輒遣人就第問其可不河東薛道衡才高當世每稱構有清鑒所為文筆必先以草呈構而後出之構有所詆訶道衡未嘗不嗟伏大業七年終于家時年七十二所舉杜如晦房玄齡等後皆自致公輔論者稱構有知人之鑒開皇中昌黎豆盧寔為黃門侍郎稱為慎密河東裴術為右丞多所糾正河東士爕平原東方舉安定皇甫聿道俱為刑部並執法平允弘農劉士龍清河房山基為考功河東裴鏡民為兵部並稱明幹京兆韋焜為民曹屢進讜言南陽韓則為延州長史甚有惠政此等事行遺闕皆有吏幹為當時所稱張虔威張虔威字元敬清河東武城人也父晏之齊北徐州刺史虔威性聰敏涉獵羣書其世父暠之謂人曰虔威吾家千里駒也年十二州補主簿十八為太尉中兵參軍後累遷太常丞及齊亡仕周為宣納中士高祖得政引為相府典籤開皇初晉王廣出鎮幷州盛選僚佐以虔威為刑獄參軍累遷為屬王甚美其才與河內張衡俱見禮重晉邸稱為二張焉及王為太子遷員外散騎侍郎太子內舍人煬帝即位授內史舍人儀同三司尋以藩邸之舊加開府尋拜謁者大夫從幸江都以本官攝江都贊治稱為幹理虔威嘗在塗見一遺囊恐其主求失因令左右負之而行後數日物主來悉以付之淮南太守楊綝嘗與十餘人同來謁見帝問虔威曰其首立者為誰虔威下殿就視而答曰淮南太守楊綝帝謂虔威曰卿為謁者大夫而乃不識參見人何也虔威對曰臣非不識楊綝但慮不審所以不敢輕對石建數馬足蓋慎之至也帝甚嘉之其廉慎皆此類也于時帝數巡幸百姓疲敝虔威因上封事以諫帝不悅自此見疎未幾卒官有子爽仕至蘭陵令虔威弟虔雄亦有才器秦孝王俊為秦州總管選為法曹參軍王嘗親案囚徒虔雄誤不持狀口對百餘人皆盡事情同輩莫不歎服後歷壽春陽城二縣令俱有治績榮毗兄建緒榮毗字子諶北平無終人也父權魏兵部尚書毗少剛鯁有局量涉獵羣言仕周釋褐漢王記室轉內史下士開皇中累遷殿內監時以華陰多盜賊妙選長吏楊素薦毗為華州長史世號為能素之田宅多在華陰左右放縱毗以法繩之無所寬貸毗因朝集素謂之曰素之舉卿適以自罰也毗答曰奉法一心者但恐累公所舉素笑曰前者戲耳卿之奉法素之望也時晉王在揚州每令人密覘京師消息遣張衡於路次往往置馬坊以畜牧為辭實給私人也州縣莫敢違毗獨遏絕其事上聞而嘉之賚絹百匹轉蒲州司馬漢王諒之反也河東豪傑以城應諒刺史丘和覺遁歸關中長史渤海高義明謂毗曰河東要害國之東門若失之則為難不細城中雖復恟恟非悉反也但收桀黠者十餘人斬之自當立定耳毗然之義明馳馬追和將與協計至城西門為反者所殺毗亦被執及諒平拜治書侍御史帝謂之曰今日之舉馬坊之事也無改汝心帝亦敬之毗在朝侃然正色為百僚所憚後以母憂去職歲餘起令視事尋卒官贈鴻臚少卿毗兄建緒性甚亮直兼有學業仕周為載師下大夫儀同三司及平齊之始留鎮鄴城因著齊紀三十卷建緒與高祖有舊及為丞相加位開府拜息州刺史將之官時高祖陰有禪代之計因謂建緒曰且躊躇當共取富貴建緒自以周之大夫因義形於色曰明公此旨非僕所聞高祖不悅建緒遂行開皇初來朝上謂之曰卿亦悔不建緒稽首曰臣位非徐廣情類楊彪上笑曰朕雖不解書語亦知卿此言不遜也歷始洪二州刺史俱有能名陸知命陸知命字仲通吳郡富春人也父敖陳散騎常侍知命性好學通識大體以貞介自持釋褐陳始興王行參軍後歷太學博士南獄正及陳滅歸于家會高智慧等作亂于江左晉王廣鎮江都以其三吳之望召令諷諭反者知命說下賊十七城得其渠帥陳正緒蕭思行等三百餘人以功拜儀同三司賜以田宅復用其弟恪為汧陽令知命以恪非百里才上表陳讓朝廷許之時見天下一統知命勸高祖都洛陽因上太平頌以諷焉文多不載數年不得調詣朝堂上表請使高麗曰臣聞聖人當扆物色芻蕘匹夫奔踶或陳狂瞽伏願暫輟旒纊覽臣所謁昔軒轅馭曆既緩夙沙之誅虞舜握圖猶稽有苗之伐陛下當百代之末膺千載之期四海廓清三邊底定唯高麗小豎狼顧燕垂王度含弘每懷遵養者良由惡殺好生欲諭之以德也臣請以一節宣示皇風使彼君臣面縛闕下書奏天子異之歲餘授普寧鎮將人或言其正直者由是待詔於御史臺煬帝嗣位拜治書侍御史侃然正色為百僚所憚帝甚敬之後坐事免歲餘復職時齊王暕頗驕縱暱近小人知命奏劾之暕竟得罪百僚震慄遼東之役為東暆道受降使者卒於師時年六十七贈御史大夫房彥謙房彥謙字孝沖本清河人也七世祖諶仕燕太尉掾隨慕容氏遷于齊子孫因家焉世為著姓高祖法壽魏青冀二州刺史壯武侯曾祖伯祖齊郡平原二郡太守祖翼宋安太守並世襲爵壯武侯父熊釋褐州主簿行清河廣川二郡守彥謙早孤不識父為母兄之所鞠養長兄彥詢雅有清鑒以彥謙天性穎悟每奇之親教讀書年七歲誦數萬言為宗黨所異十五出後叔父子貞事所繼母有踰本生子貞哀之撫養甚厚後丁所繼母憂勺飲不入口者五日事伯父樂陵太守豹謁盡心力每四時珍果口弗先嘗遇期功之戚必蔬食終禮宗從取則焉其後受學于博士尹琳手不釋卷遂通涉五經解屬文工草隸雅有詞辯風概高人年十八屬廣寧王孝珩為齊州刺史辟為主簿時禁網疎闊州郡之職尤多縱弛及彥謙在職清簡守法州境肅然莫不敬憚及周師入鄴齊主東奔以彥謙為齊州治中彥謙痛本朝傾覆將糾率忠義潛謀匡輔事不果而止齊亡歸于家周帝遣柱國辛遵為齊州刺史為賊帥輔帶劍所執彥謙以書諭之帶劍慚懼送遵還州諸賊並各歸首及高祖受禪之後遂優遊鄉曲誓無仕心開皇七年刺史韋藝固薦之不得已而應命吏部尚書盧愷一見重之擢授承奉郎俄遷監察御史後屬陳平奉詔安撫泉括等十州以銜命稱旨賜物百段米百石衣一襲奴婢七口遷秦州總管錄事參軍嘗因朝集時左僕射高熲定考課彥謙謂熲曰書稱三載考績黜陟幽明唐虞以降代有其法黜陟合理褒貶無虧便是進必得賢退皆不肖如或舛謬法乃虛設比見諸州考校執見不同進退多少參差不類況復愛憎肆意致乖平坦清介孤直未必高名卑諂巧官翻居上等直為真偽混淆是非瞀亂宰貴既不精練斟酌取捨曾經驅使者多以蒙識獲成未歷臺省者皆為不知被退又四方懸遠難可詳悉唯量準人數半破半成徒計官員之少多莫顧善惡之衆寡欲求允當其道無由明公鑒達幽微平心遇物今所考校必無阿枉脫有前件數事未審何以裁之唯願遠布耳目精加採訪褒秋毫之善貶纖介之惡非直有光至治亦足標奬賢能詞氣侃然觀者屬目熲為之動容深見嗟賞因歷問河西隴右官人景行彥謙對之如響熲顧謂諸州總管刺史曰與公言不如獨與秦州考使語後數日熲言於上上弗能用以秩滿遷長葛令甚有惠化百姓號為慈父仁壽中上令持節使者巡行州縣察長吏能不以彥謙為天下第一超授鄀州司馬吏民號哭相謂曰房明府今去吾屬何用生為其後百姓思之立碑頌德鄀州久無刺史州務皆歸彥謙名有異政內史侍郎薛道衡一代文宗位望清顯所與交結皆海內名賢重彥謙為人深加友敬及兼襄州總管辭翰往來交錯道路煬帝嗣位道衡轉牧番州路經彥謙所留連數日屑涕而別黃門侍郎張衡亦與彥謙相善于時帝營東都窮極侈麗天下失望又漢王構逆罹罪者多彥謙見衡當塗而不能匡救以書諭之曰竊聞賞者所以勸善刑者所以懲惡故疎賤之人有善必賞尊貴之戚犯惡必刑未有罰則避親賞則遺賤者也今諸州刺史受委宰牧善惡之間上達本朝懾憚憲章不敢怠慢國家祗承靈命作民父母刑賞曲直升聞於天夤畏照臨亦宜謹肅故文王云我其夙夜畏天之威以此而論雖州國有殊高下懸邈然憂民慎法其理一也至如幷州釁逆須有甄明若楊諒實以詔命不通慮宗社危逼徵兵聚衆非為干紀則當原其本情議其刑罰上副聖主友于之意下曉愚民疑惑之心若審知內外無虞嗣后纂統而好亂樂禍妄有覬覦則管蔡之誅當在於諒同惡相濟無所逃罪梟懸孥戮國有常刑其間乃有情非協同力不自固或被擁逼淪陷凶威遂使籍沒流移恐為寃濫恢恢天網豈其然乎罪疑從輕斯義安在昔叔向置鬻獄之死晉國所嘉釋之斷犯蹕之刑漢文稱善羊舌寧不愛弟廷尉非苟違君但以執法無私不容輕重且聖人大寶是曰神器苟非天命不可妄得故蚩尤項籍之驍勇伊尹霍光之權勢李老孔丘之才智呂望孫武之兵術吳楚連磐石之據產祿承母后之基不應歷運之兆終無帝王之位況乎蕞爾一隅蜂扇蟻聚楊諒之愚鄙羣小之凶慝而欲憑陵畿甸覬幸非望者哉開闢以降書契云及帝皇之跡可得而詳自非積德累仁豐功厚利孰能道洽幽顯義感靈祇是以古之哲王昧旦丕顯履氷在念御朽競懷逮叔世驕荒曾無戒懼肆於民上騁嗜奔慾不可具載請略陳之曩者齊陳二國並居大位自謂與天地合德日月齊明罔念憂虞不恤刑政近臣懷寵稱善而隱惡史官曲筆掩瑕而錄美是以民庶呼嗟終閉塞於視聽公卿虛譽日敷陳於左右法網嚴密刑辟日多徭役煩興老幼疲苦昔鄭有子產齊有晏嬰楚有叔敖晉有士會凡此小國尚足名臣齊陳之疆豈無良佐但以執政壅蔽懷私徇軀忘國憂家外同內忌設有正直之士才堪幹持於己非宜即加擯壓倘遇諂佞之輩行多穢匿於我有益遽蒙薦舉以此求賢何從而至夫賢材者非尚膂力豈繫文華唯須正身負戴確乎不動譬棟之處屋如骨之在身所謂棟梁骨鯁之材也齊陳不任骨鯁信近讒諛天高聽卑監其淫僻故總收神器歸我大隋向使二國祗敬上玄惠恤魚眾寡委任方直斥遠浮華卑菲為心惻隱為務河朔強富江湖險隔各保其業民不思亂泰山之固弗可動也然而寢臥積薪宴安鴆毒遂使禾黍生廟霧露沾衣弔影撫心何嗟及矣故詩云殷之未喪師克配上帝宜鑒于殷駿命不易萬機之事何者不須熟慮哉伏惟皇帝望雲就日仁孝夙彰錫社分珪大成規矩及總統淮海盛德日新當璧之符遐邇僉屬讚歷甫爾寬仁已布率土蒼生翹足而喜幷州之亂變起倉卒職由楊諒詭惑詿誤吏民非有構怨本朝棄德從賊者也而有司將帥稱其願反非止誣陷良善亦恐大點皇猷足下宿當重寄早預心膂粵自藩邸柱石見知方當書名竹帛傳芳萬古稷契伊呂彼獨何人既屬明時須存謇諤立當世之大誡作將來之憲範豈容曲順人主以愛虧刑又使脅從之徒橫貽罪譴忝蒙眷遇輒寫微誠野人愚瞽不知忌諱衡得書歎息而不敢奏聞彥謙知王綱不振遂去官隱居不仕將結構蒙山之下以求其志會置司隸官盛選天下知名之士朝廷以彥謙公方宿著時望所歸徵授司隸刺史彥謙亦慨然有澄清天下之志凡所薦舉皆人倫表式其有彈射當之者曾無怨言司隸別駕劉陵上侮下訐以為直刺史憚之皆為之拜唯彥謙執志不撓亢禮長揖有識嘉之亦不敢為恨大業九年從駕渡遼監扶餘道軍其後隋政漸亂朝廷靡然莫不變節彥謙直道守常介然孤立頗為執政者之所嫉出為涇陽令未幾終于官時年六十九彥謙居家每子姪定省常為講說督勉之亹亹不倦家有舊業資產素殷又前後居官所得俸祿皆以周恤親友家無餘財車服器用務存素儉自少及長一言一行未嘗涉私雖致屢空怡然自得嘗從容獨笑顧謂其子玄齡曰人皆因祿富我獨以官貧所遺子孫在於清白耳所有文筆恢廓閑雅有古人之深致又善草隸人有得其尺牘者皆寶玩之太原王邵北海高構蓨縣李綱河東柳彧薛孺皆一時知名雅澹之士彥謙並與為友雖冠蓋成列而門無雜賓體資文雅深達政務有識者咸以遠大許之初開皇中平陳之後天下一統論者咸云將致太平彥謙私謂所親趙郡李少通曰主上性多忌剋不納諫爭太子卑弱諸王擅威在朝唯行苛酷之政未施弘大之體天下雖安方憂危亂少通初謂不然及仁壽大業之際其言皆驗大唐馭宇追贈徐州都督臨淄縣公諡曰定史臣曰大廈云構非一木之枝帝王之功非一士之略長短殊用大小異宜梲棟梁莫可棄也李諤等或文能遵義或才足幹時識用顯於當年故事留於臺閣參之有隋多士取其開物成務皆廊廟之榱桷亦北辰之衆星也

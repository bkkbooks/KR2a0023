body:
  text: 隋書卷十志第五禮儀五輿輦之別蓋先王之所以列等威也然隨時而變代有不同梁初尚遵齊制其後武帝既議定禮儀乃漸有變革始永明中步兵校尉伏曼容奏宋大明中尚書左丞荀萬秋議金玉二輅並建碧旂象革木輅並建赤旂非時運所上又非五方之色今五輅五牛及五色幡旗並請準齊所尚青色時議所駁不行及天監三年乃改五輅旗同用赤而旒不異以從行運所尚也七年帝曰據禮玉輅以祀金輅以賓而今大祀並乘金輅詔下詳議周捨以為金輅以之齋車本不關於祭祀於是改陵廟皆乘玉輅大駕則太僕卿御法駕則奉車郎馭其餘四輅則使人執轡以朱絲為之執者武冠朱衣又齊永明制玉輅上施重屋棲寶鳳皇綴金鈴鑷珠璫玉蚌佩四角金龍銜五綵毦又畫麒麟頭加於馬首者十二年帝皆省之初齊武帝造大小輦並如軺車但無輪轂下橫轅軛梁初漆畫代之後帝令上可加笨輦形如犢車自茲始也中方八尺左右開四望金為龍首飾其五末謂轅轂頭及衡端也金鸞棲軛其下施重層以空青雕鏤為龍鳳象漆木橫前名為望板其下交施三十六橫小輿形似軺車金裝漆畫但施八橫元正大會乘出上殿西堂舉哀亦乘之行則從後一名輿車羊車一名輦其上如軺小兒衣青布袴褶五辮髻數人引之時名羊車小史漢氏或以人牽或駕果下馬梁貴賤通得乘之名曰牽子畫輪車一乘駕牛乘用如齊制舊史言之詳矣衣書車十二乘駕牛漢皁蓋朱𩹉過江加綠油幢朱絲絡青交路黃金塗五末一曰副車梁朝謂之衣書車皇太子鸞輅駕三馬左右騑朱斑輪倚獸較伏鹿軾九旒畫降龍青蓋畫幡文輈黃金塗五末近代亦謂之鸞輅即象輅也梁東宮初建及太子釋奠元正朝會則乘之以畫輪為副若常乘畫輪以軺衣書車為副畫輪車上開四望綠油幢朱繩絡兩箱𩹉飾以錦黃金塗五末二千石四品已上及列侯皆給軺車駕牛伏兔箱青油幢朱絲絡轂輞皆黑漆天監二年令三公開府尚書令則給鹿幡軺施耳後戶皁輞尚書僕射左右光祿大夫侍中中書監令祕書監則給鳳轄軺後戶皁輞領護國子祭酒太子詹事尚書侍中列卿散騎常侍給聊泥軺無後戶漆輪車騎驃騎及諸王除刺史帶將軍給龍雀軺以金銀飾御史中丞給方蓋軺形如小傘諸王三公有勳德者皆特加皁輪車駕牛形如犢車但烏漆輪轂黃金雕裝上加青油幢朱絲絡通幰或四望上臺三夫人亦乘之以搨幢涅幰為副王公加禮者給油幢絡車駕牛朱輪華轂天監二年令上臺六宮長公主公主諸王太妃妃皆乘青油輿幢通幰車搨幢涅幰為副采女皇女諸王嗣子侯夫人皆乘赤油搨幢車以涅幰為副侍女直乘涅幰之乘諸王三公並乘通幰平乘車竹箕子壁仰楤榆為輞如今犢車但舉幰通覆上方州刺史並乘通幰平肩輿從橫施八橫亦得金渡裝較天子至于下賤通乘步輿方四尺上施隱膝以及襻舉之無禁限載輿亦如之但不施脚以其就席便也優禮者人輿以升殿司徒謝朏以脚疾優之五牛旗左青赤右白黑黃居其中蓋古之五時副車也舊有五色立車五色安車合十乘名為五時車建旗十二各如車色立車則正豎其旗安車則斜注馬亦隨五時之色白馬則朱其鬣尾左右騑驂金鋄鏤鍚黃屋左纛如金根之制行則從後名五時副車晉過江不有事則權以馬車代之建旗其上後但以五色木牛象車豎旗於牛背使人輿之旗常纏不舒唯天子親戎乃舒其斾周遷以為晉武帝平吳後造五牛之旗非過江始為也指南車大駕出為先啟之乘漢初置俞兒騎並為先驅左太冲曰俞騎騁路指南司方後廢其騎而存其車記里車駕牛其中有木人執槌車行一里則打一槌鼓吹車上施層樓四角金龍銜旒蘇羽葆凡鼓吹陸則樓車水則樓船在殿庭則畫筍虡為樓樓上有翔鷺棲烏或為鵠形陳承梁末王琳縱火延燒車府至天嘉元年勑守都官尚書寶安侯到仲舉議造玉金象革木等五輅及五色副車皆金薄交龍為輿倚較文貔伏軾虯首銜軛左右吉陽筩鸞雀立衡文畫轓綠油蓋黃絞𩹉相思橑金華末斜注旂旗於車之左各依方色加棨戟於車之右韜以黻繡之衣獸頭幡長丈四尺懸於戟杪玉輅正副同駕六馬餘輅皆駕四馬馬並黃金為文髦插以翟尾玉為鏤鍚又以綵畫赤油長三尺廣八寸繫兩軸頭古曰飛軨改以綵畫蛙蟆幡綴兩軸頭即古飛軨遺象也五輅兩箱後皆用玳瑁為鵾翅加以金銀雕飾故俗人謂之金鵾車兩箱之𩹉衣以紅錦金花帖釘上用紅紫錦為後檐青絞純帶夏用簟冬用綺繡褥此後漸修具依梁制後魏天興初詔儀曹郎董謐撰朝饗儀始制軒冕未知古式多違舊章孝文帝時儀曹令李韶更奏詳定討論經籍議改正之唯備五輅各依方色其餘車輦猶未能具至熙平九年明帝又詔侍中崔光與安豐王延明博士崔瓚採其議大造車服定制五輅並駕五馬皇太子乘金輅朱蓋赤質四馬三公及王朱屋青表制同於輅名曰高車駕三馬庶姓王侯及尚書令僕已下列卿已上並給軺車駕用一馬或乘四望通幰車駕一牛自斯以後條章粗備北齊咸取用焉其後因而著令並無增損王庶姓王儀同三司已上親公主雉尾扇紫傘皇宗及三品已上官青傘朱𩹉其青傘碧𩹉達於士人不禁正從第一品執事官散官及儀同三司諸公主得乘油色朱絡網車車牛飾得用金塗及純銀二品三品得乘卷通幰車車牛飾用金塗四品已下七品已上得乘偏幰車車牛飾用銅尚書令給哄士十五人左右僕射御史中丞各十二人周氏設六官置司輅之職以掌公車之政辨其名品與其物色皇帝之輅十有二等一曰蒼輅以祀昊天上帝二曰青輅以祀東方上帝三曰朱輅以祀南方上帝及朝日四曰黃輅以祭地祇中央上帝五曰白輅以祀西方上帝及夕月六曰玄輅以祀北方上帝及感帝祭神州此六輅通漆之而已不用他物為飾皆疏面旒就以方色俱十有二疏面刻皮當顱七曰玉輅以享先皇加元服納后八曰碧輅以祭社稷享諸先帝大貞於龜食三老五更享食諸侯及耕籍九曰金輅以祀星辰祭四望視朔大射賓射饗羣臣巡犧牲養國老十曰象輅以望秩羣祀視朝燕諸侯及羣臣燕射養庶老適諸侯家巡省臨太學幸道法門十一曰革輅以巡兵即戎十二曰木輅以田獵行鄉畿此六輅又以六色漆而畫之用玉碧金象革物以飾諸末皆鍚面金鉤就以五采俱十有二鍚面鏤金當顱鉤以屬勒鞶纓皇后之車亦十二等一曰重翟以從皇帝重翟羽為車蕃祀郊禖享先皇朝皇太后二曰厭翟以祭陰社次其羽也三曰翟輅以採桑翟羽飾之四曰翠輅以從皇帝見賓客翠羽飾之五曰雕輅以歸寧刻諸末也六曰篆輅以臨諸道法門篆諸飾也六輅皆鍚面朱總總以朱絲為之置馬勒直兩耳與兩鑣也金鉤七曰蒼輅以適命婦家八曰青輅九曰朱輅十曰黃輅十一曰白輅十二曰玄輅五時常出入則供之六輅皆疏面繢總以畫繒為之諸公之輅九方輅各象方之色碧輅金輅皆鍚面鞶纓九就金鉤象輅犀輅貝輅革輅篆輅木輅皆疏面鞶纓九就凡就皆以朱白蒼三采諸侯自方輅而下八又無碧輅諸伯自方輅而下七又無金輅諸子自方輅而下六又無象輅諸男自方輅而下五又無犀輅凡就各如其命諸公夫人之輅車九厭翟翟輅翠輅皆鍚面朱總金鉤雕輅篆輅皆勒面刻白黑韋為當顱繢總朱輅黃輅白輅玄輅皆雕面刻漆韋為當顱鷖總總青黑色繒其著如朱總諸侯夫人自翟輅而下八諸伯夫人自翠輅而下七諸子夫人自雕輅而下六諸男夫人自篆輅而下五鞶纓就數各視其君公孤卿大夫皆以中之色乘祀輅士乘祀車三公之輅車九祀輅犀輅貝輅篆輅木輅夏篆夏縵墨車輚車自篆已上金塗諸末疏鍚鞶纓金鉤木輅已下銅飾諸末疏鞶纓皆九就三孤自祀輅而下八無犀輅六卿自祀輅而下七又無貝輅上大夫自祀輅而下六又無篆輅中大夫自祀輅而下五又無木輅下大夫自祀輅而下四又無夏篆士車三祀車墨車輚車凡就各如其命之數自孤下就以朱綠二采三妃三公夫人之輅九篆輅朱輅黃輅白輅玄輅皆勒面繢總夏篆夏縵墨車輚車皆雕面鷖總三三孤內子自朱輅已下八六嬪六卿內子自黃輅而下七上媛婦中大夫孺人自玄輅而下五下媛婦大夫孺人自夏篆而下四御婉士自夏縵而下三其鞶纓就各以其等皆簟笰漆之君以赤卿大夫士以玄君駕四三輈六轡卿大夫駕三二輈五轡士駕二一輈四轡輅之制重輪重較而加耳焉皇帝皇后之輅輿廣六尺有六寸輪高七尺畫輪轂輈衡以雲牙箱軾以虡文虡內畫以雜獸獸伏軾鹿倚較諸侯及夫人命夫命婦之輅車廣六尺有二寸輪崇六尺有六寸畫轂以雲牙軾以虡文虡內畫以雲華鹿倚較士不畫后夫人內子已下同去獸與鹿凡旗太常畫三辰日月五星旃畫青龍皇帝升龍諸侯交龍旟畫朱雀旌畫黃麟旗畫白獸旐畫玄武皆加雲其旜物在軍亦書其事號加之以雲氣徽幟亦如之通帛為旜雜帛為物在軍亦書其人官與姓名之事號徽幟亦書之但畫其所書之例旌節又畫白獸而析羽於其上司常掌旗物之藏通帛之旗六以供郊丘之祀一曰蒼旗二曰青旗三曰朱旗四曰黃旗五曰白旗六曰玄旗畫繢之旗六以充玉輅之等一曰三辰之常二曰青龍之旗三曰朱鳥之旟四曰黃麟之旌五曰白獸之旗六曰玄武之旐皆左建旗而右建闟戟又有繼旗四以施軍旅一曰麾以供軍將二曰以供師帥三曰以供旅帥四曰斾以供倅長諸公方輅碧輅建旂金輅建旟象輅建物木輅建旐諸侯自金輅而下如諸公之旗諸伯自象輅而下如諸侯之旗諸子自犀輅而下如諸伯之旗諸男自象輅而下如諸子之旗三公犀輅貝輅篆輅建旜木輅建旐夏篆夏縵及輚車建物孤卿已下各以其等建其旗旌杠皇帝六刃諸侯五刃大夫四刃士三刃旒皇帝曳地諸侯及軹大夫及轂士及軫凡注毛於杠首曰綏析羽曰旌全羽曰其幓皇帝諸侯加以弧韣闟戟方六尺而被之以黻唯皇帝諸侯輅建焉闟戟杠綢與旗同車之蓋圓以象天輿方以象地輪輻三十以象日月蓋橑二十有八以象列宿設和鑾以節趨行被旗旒以表貴賤其取象也大其彰德也明是以王者尚之皇帝皇后在喪之車五一曰木車初喪乘之二曰素車卒哭乘之三曰藻車既練乘之四曰駹車祥而乘之五曰漆車禫而乘之及平齊得其輿輅藏於中府盡不施用至大象初遣鄭譯閱視武庫得魏舊物取尤異者並加雕飾分給六宮有乾象輦羽葆圓蓋畫日月五星二十八宿天街雲罕山林奇怪及遊麟飛鳳朱雀玄武騶虞青龍駕二十四馬以給天中皇后助祭則乘又有大樓輦車龍輈十二加以玉飾四轂六衡方輿圓蓋金鷄樹羽寶鐸旒蘇鸞雀立衡六螭龍銜軛建太常畫升龍日月駕二十牛又有象輦左右金鳳白鹿仙人羽葆旒蘇金鈴玉佩初駕二象後以六駝代之並有遊觀小樓等輦駕十五馬車等合十餘乘皆魏天興中之所制也宣帝至是咸復御之復令天下車皆以渾成木為輪開皇元年內史令李德林奏周魏輿輦乖制請皆廢毀高祖從之唯留魏太和時儀曹令李韶所製五輅齊天保所遵用者又留魏熙平中太常卿穆紹議皇后之輅其從祭則御金根車親桑則御雲母車並駕四馬歸寧則御紫罽車遊行則御安車弔問則御紺罽車幷車並駕三馬於後著令制五輅玉輅青質以玉飾諸末重箱盤輿左青龍右白虎金鳳翅畫虡文鳥獸黃屋左纛金鳳在軾前八鸞在衡二鈴在軾龍輈前設鄣塵青蓋黃𩹉繡飾博山鏡子樹羽輪皆朱斑重牙左建旗十有二旒幓旒皆畫升龍其長曳地右載闟戟長四尺廣三尺黻文旂首金龍頭銜結綬及鈴緌駕蒼龍金鋄方釳插翟尾五隼鏤鍚鞶纓十有二就鍚馬當顱鏤金為之鞶馬大帶纓馬鞅皆以五彩飾之就成也一帀為一就祭祀納后則供之金輅赤質以金飾諸末左建旟右建闟戟旟畫鳥隼餘與玉輅同駕赤朝覲會同饗射飲至則供之象輅黃質以象飾諸末左建旌右建闟戟旌畫黃麟駕黃行道則供之革輅白質輓之以革左建旗右建闟戟旗畫白獸駕白駱巡守臨兵事則供之木輅漆之左建旐右建闟戟旐畫龜蛇駕黑田獵則供之五輅之蓋旌旗之質及鞶纓皆從輅之色蓋之𩹉俱用黃其鏤鍚五輅同安車飾重輿曲壁紫油纁朱𩹉通幰朱絲絡網朱鞶纓朱覆髮具絡駕赤臨幸則供之四望車制同犢車金飾青油纁朱𩹉通幰拜陵臨弔則供之皇后皇太后重翟青質金飾諸末朱輪金根朱牙其箱飾以重翟羽青油纁朱𩹉通幰繡紫帷朱絲絡網繡紫絡帶八鑾在衡鍚鞶纓十二就金鋄方釳插翟尾朱總總以朱為之如馬纓而小著馬勒在兩耳兩鑣也駕蒼龍受冊從郊禖享廟則供之厭翟赤質金飾諸末輪畫朱牙其箱飾以次翟羽紫油纁朱𩹉通幰紅錦帷朱絲絡網紅錦絡帶其餘如重翟駕赤親桑則供之翟車黃質金飾諸末輪畫朱牙其車側飾以翟羽黃油纁黃𩹉通幰白紅錦帷朱絲絡網白紅錦絡帶其餘如重翟駕黃歸寧則供之諸鞶纓之色皆從車質安車赤質金飾紫通幰朱𩹉駕四馬臨幸及弔則供之皇太子金輅赤質金飾諸末重較箱畫虡文鳥獸黃屋伏鹿軾龍輈金鳳一在軾前設鄣塵朱蓋黃𩹉輪畫朱牙左建旂九旒右載闟戟旂首金龍頭銜結綬及鈴緌駕赤四八鑾在衡二鈴在軾金鋄方釳插翟尾五隼鏤鍚鞶纓九就從祀享正冬大朝納妃則乘之軺車金飾諸末紫通幰朱𩹉駕一馬五日常朝及朝饗宮臣出入行道乘之四望車金飾諸末紫油纁通幰朱𩹉朱絲絡網駕一馬弔臨則乘之公及一品象輅黃質以象飾諸末建旟畫以鳥隼受冊告廟升壇上任親迎及葬則乘之侯伯及二品三品革輅白質以革飾諸末建旟畫熊獸受冊告廟親迎及葬則乘之子男及四品木輅黑質以漆飾之建旐畫以龜蛇受冊告廟親迎及葬則乘之象輅已下旒及就數各依爵品雖依禮製名未及創造開皇三年閏十二月並詔停造而盡用舊物至九年平陳又得輿輦舊著令者以付有司所不載者並皆毀棄雖從儉省而於禮多闕十四年詔又以見所乘車輅因循近代事非經典令更議定於是命有司詳考故實改造五輅及副玉輅青質祭祀乘之金輅赤質朝會禮還乘之象輅黃質臨幸乘之革輅白質戎事乘之木輅玄質耕藉乘之五輅皆朱斑輪龍輈重輿建十二旒並畫升龍左建闟戟旂旒與輅同色樊纓十有二就王五等開國第一第二品及刺史輅朱質朱蓋斑輪左建旂旂畫龍一升一降右建闟戟第三第四品輅朱質朱蓋左建旜通帛為之旂旜皆赤其旒及樊纓就數各依其品大業元年更製車輦五輅之外設副車詔尚書令楚公楊素吏部尚書奇章公牛弘工部尚書安平公宇文愷內史侍郎虞世基禮部侍郎許善心太府少卿何稠朝請郎閻毗等詳議奏決於是審擇前朝故事定其取捨云玉輅禋祀所用飾以玉白武通云玉輅大輅也周禮巾車氏所掌鏤鍚樊纓十有再就建太常十有二旒虞氏謂之鸞車夏后氏謂之鉤車殷謂之大輅周謂之乘輅大戴禮著其形式上蓋如規象天二十八橑象列星下方輿象地三十輻象一月前視則覩鑾和之聲側觀則覩四時之運昔成湯用而郊祀因有山車之瑞亦謂桑根車蔡邕獨斷論漢制度凡乘輿車皆有六馬羽蓋金爪黃屋左纛鏤鋄方釳重轂繁纓黃繒為蓋𩹉也左纛以旄牛尾建於竿上其大如斗立于左騑也鏤鋄高闊各五寸上如傘形施於髮上而插翟尾也方釳當顱蓋馬冠也繁纓膺前索也重轂重施轂也應劭漢官大輅龍旂畫龍於旂上也董巴志謂為瑞山車秦謂金根即殷輅矣司馬彪志亦云漢備五輅或謂德車其所駕馬皆如方色唯晉太常卿摯虞獨疑大輅謂非玉輅摯虞之說理實可疑而歷代通儒混為玉輅詳其施用義亦不殊左建太常案釋名日月為常畫日月於旗端言常明也又云自夏始也奚仲為夏車正加以旂常於是旒就有差用明尊卑之別也董巴所述全明漢制天子建太常十二斿曳地日月升龍象天明也今之玉輅參用舊典消息取捨裁其折中以青為質玉飾其末重箱盤輿左龍右獸金鳳翅畫虡文軛左立纛金鳳一在軾前八鸞在衡二鈴在軾龍輈之上前設鄣塵青蓋黃𩹉繡游帶金博山綴以鏡子下垂八佩樹四十葆羽輪皆朱斑重牙復轄左建太常十有二旒皆畫升龍日月其長曳地右載闟戟長四尺闊三尺黻文旗首金龍頭銜鈴及緌垂以結綬駕蒼龍金鋄方釳插翟尾五隼鏤鍚鞶纓十有二就皆五繒罽以為文飾天子祭祀納后則乘之馭士二十八人餘輅準此副車案蔡邕獨斷五輅之外乃復設五色安車立車各一乘皆駕四馬是為五時副車俗人名曰五帝車者蓋副車也故張良狙擊秦皇帝誤中副車漢家制度亦備副車司馬彪云德車駕六後駕四是為副車魏志亦云天子命太祖駕金根六馬設五時副車江左乃闕至梁始備開皇中不置副車平陳得之毀而弗用至是復並設之副玉輅色及旗章一同正輅唯降二等駕用四馬馭士二十四人餘四副準此金輅案尚書即綴輅也周官金輅鏤鍚繁纓九就建大旂以賓同姓以封夫禮窮則通下得通於上也故天子乘之接賓宴同姓諸侯受而出封是以漢太子諸王皆乘金輅及安車並朱斑輪倚獸較伏鹿軾黑文畫藩青蓋金華施橑朱畫轅金塗飾非皇子為王不錫此乘皆左右騑駕三馬旂九旒畫降龍皇孫乘綠車亦駕之魏晉制太子及諸王皆駕四馬依摯虞議天子金輅次在第二又云金輅以朝象輅以賓則是晉用輅與周異矣宋起居注泰始四年尚書令建安王休仁議天子之元子士也故齒冑於辟雍欲使知教而後尊不得生而貴矣既命之後禮同上公故天子賜之金輅但減旂章為等級象及革木賜異姓諸侯在朝卿士亦準斯例此則皇太子及帝子王者通得乘之自晉過江王公以下車服卑雜唯有太子禮秩崇異又乘山石安車義不經見事無所出賜金輅者此為古制降乘輿二等駕用四馬唯天子五輅通駕六馬旟旌旗旐並十二旒左建旟案爾雅錯革鳥曰旟郭璞云此謂全剝鳥皮毛置之竿上也舊說刻為革鳥孫叔然云革急也言畫急疾鳥於旒上也周官所謂鳥隼為旟亦是急義今之金輅赤質黃金飾諸末左建旟畫飛隼右建闟戟鞶輿鳳趐等並同玉輅駕赤臨朝會同饗射飲至則用之皇太子輅古者金飾宋齊以來並乘象輅宇文愷閻毗奏案宋大明六年初備五輅有司奏云秦改周輅創制金根漢魏因循其形莫改而金玉二輅雕飾略同造次瞻覩殆無差別若錫於東儲在禮嫌重非所以崇峻陛級表示等威今皇太子宜乘象輅碧旂九葉進不斥尊退不逼下酌時沿古於禮為中觀宋此義乃無副車新置五輅金玉同體至象已下即為差降所以太子不得乘金輅欲示等威故令給象今取周禮之名依漢家之制天子五輅形飾並同旒及繁纓例皆十二黃屋左纛金根重轂無不悉同唯應五方色以為殊耳若用此輅給於太子革木盡皆不可何况金象者乎既製副車駕用四馬至於金輅自有等差春秋之義降下以兩今天子金輅駕用六馬十二旒太子金輅駕用四馬降龍九旒制頗同於副車又有旌旗之別幷嫡皇孫及親王等輅並給金輅而減其雕飾合於古典臣謂非嫌制曰可於是太子金輅赤質制同副車具體而小亦駕四馬馭士二十人皇嫡孫金輅綠質降太子一等去盤輿重轂轅上起箱末以金飾旌長七刃七旒駕用四馬馭士一十八人親王金輅以赤為質餘同於皇嫡孫唯在其國及納妃親迎則給之常朝則乘象輅象輅案尚書即先輅也周禮象輅朱繁纓五就建大赤以朝異姓以封左建旌案爾雅注旄首曰旌許慎所說游車載旌廣雅云天子旌高九刃諸侯七刃大夫五刃周書王會張羽旌禮記云龍旂九旒天子之旌也今象輅以黃為質象飾諸末左建旌畫綠麟右建闟戟駕黃祀后土則用之革輅案釋名天子車也周禮革輅龍勒絛纓五就建大白用之即戎以封四衞古者革輓而漆之更無他飾又有戎輅之萃廣車之萃闕車之萃輕車之萃此皆兵車所謂五戎然革輅亦名戎輅天子在軍所乘廣車橫陣車也闕車補闕車也飾並以革故師供革車各以其萃摯虞議云革輅第四左建旌案釋名熊獸為旗周官龍旂九旒以象大火今革輅白質鞔之以革左建旗畫騶虞右建闟戟駕白駱巡守臨兵則用之三品已下並乘革輅朱色為質馭士十六人木輅案尚書即次輅也周官木輅緇樊鵠纓建麾以畋以封藩國晉摯虞云畋輅第五唯宋泰始詔乘木輅以耕稼徐爰釋疑略曰天子五輅晉遷江左闕其三唯有金輅以郊木輅即戎宋大明時始備其數凡五輅之蓋旌旗之質及鞶纓皆從方色蓋𩹉並黃雕飾如一沈約曰金象革木禮圖不載其形今旒數羽葆並同玉輅左建旐案周官龜蛇為旐釋名云龜知氣兆之吉凶也許慎云旐有四斿以象營室今木輅黑質漆之左建旐畫玄武右建闟戟駕黑畋獵用之四品方伯乘木輅赤質駕士十四人安車案禮卿大夫致事則乘之其制如輜車幷蔡邕獨斷有五色安車皆畫輪重轂今畫輪重輿曲壁紫油幢絳𩹉通幰朱絲絡網赤鞶纓駕四馬省問臨幸則乘之皇太子安車斑輪赤質制略同乘輿亦駕四馬四望車案晉中朝大駕鹵簿四望車駕牛中道東宮舊儀皇太子及妃皆有畫輪四望車今四望車制同犢車黃金飾青油幢朱𩹉紫通幰紫絲網駕一牛拜陵臨弔則用之皇太子四望車綠油幢青通幰朱絲絡網耕根車案沈約云親幸耕籍御之三蓋車一名芝車又名耕根車置耒耜於軾上即潘岳所謂紺轅屬於黛耜者也開皇無之駕出親耕則乘木輅蓋依宋泰始之故事也今耕根車以青為質三重施蓋羽葆雕裝並同玉輅駕六馬其軾平以青囊盛耒而加於上籍千畝行三推禮則親乘焉羊車案晉司隸校尉劉毅奏護軍羊琇私乘者也開皇無之至是始置焉其制如軺車金寶飾紫錦幰朱絲網馭童二十人皆兩鬟髻服青衣取年十四五者為謂之羊車小史駕以果下馬其大如羊屬車案古者諸侯貳車九乘秦滅九國兼其車服故為八十一乘漢遵不改武帝祠太一甘泉則盡用之明帝上原陵又用之法駕三十六乘小駕十二乘開皇中大駕十二乘法駕減半大業初屬車備八十一乘並如犢車紫通幰朱絲絡網黃金飾駕一牛在鹵簿中單行正道至三年二月帝嫌其多問起部郎閻毗毗曰臣共宇文愷參詳故實此起於秦遂為後式故張衡賦云屬車九九是也次及法駕三分減一此漢制也故文帝紀奉天子法駕迎代邸如淳曰屬車三十六乘是也又據宋孝建時有司奏議晉遷江左唯設五乘尚書令建平王宏曰八十一乘無所準憑江左五乘儉不中禮但帝王旂旒之數皆用十二今宜準此設十二乘開皇平陳因以為法令憲章往古大駕依秦法駕依漢小駕依宋以為差等帝曰大駕宜用三十六法駕宜用十二小駕除之可也輦案釋名人所輦也漢成帝遊後庭則乘之徐爰釋問云天子御輦侍中陪乘今輦制象軺車而不施輪通幰朱絡飾以金玉用人荷之副輦加笨制如犢車亦通幰朱絡謂之蓬輦自梁武帝始也輿案說文云箯竹輿也周官曰周人上輿漢室制度以雕為之方徑六尺今輿制如輦而但小耳宮苑宴私則御之小輿幰方形同幄帳自閤出升正殿則御之軺車案六韜一名遙車蓋言遙遠四顧之車也漢武帝迎申公弟子二人乘軺傳從此又是馳傳車也晉氏鹵簿御史軺車行中道晉公卿禮秩云尚書令軺黑耳後戶今軺車青通幰駕二馬王侯入學五品朝婚通給之司隸刺史及縣令詔使品第六七則並駕一馬犢車案魏武書贈楊彪七香車二乘用牛駕之蓋犢車也長沙耆舊傳曰劉壽常乘通幰車今犢車通幰自王公已下至五品已上並給乘之三品已上青幰朱𩹉五品已上紺幰碧𩹉皆白銅裝唯有慘及弔喪者則不張幰而乘鐵裝車六品已下不給任自乘犢車弗許施幰初五品已上乘偏幰車其後嫌其不美停不行用以亘幰代之三品已上通幰車則青壁一品軺車油幰朱網唯車輅一等聽勑始得乘之馬珂三品已上九子四品七子五品五子皇后重翟車案周禮正后亦有五輅一曰重翟二曰厭翟三曰安車四曰翟車五曰輦車漢制后法駕乘重翟車今重翟青質金飾諸末畫輪金根朱牙重轂其箱飾以重翟羽青油幢朱𩹉通幰紫繡帷朱絲絡紫繡帶八鑾在衡鏤鍚鞶纓十有二就金鋄方釳插翟尾朱總綴於馬勒及兩金鑣之上駕蒼龍受冊從祀郊禖享廟則供之厭翟赤質金飾諸末朱輪畫朱牙其箱飾以次翟羽紫油幢朱𩹉通幰紅錦帷朱絲絡網紅錦帶其餘如重翟駕赤採桑則供之翟車黃質金飾諸末輪畫朱牙其箱飾以翟羽黃油幢黃𩹉通幰白紅錦帷朱絲絡網白紅錦帶其餘如重翟駕黃歸寧則供之諸鞶纓之色皆從車質安車金飾紫通幰朱𩹉駕四馬臨幸及弔則供之輦車金飾同於蓬輦通幰斑輪駕用四馬宮苑近行則乘之皇后屬車三十六乘初宇文愷閻毗奏定請減乘輿之半禮部侍郎許善心奏駁曰謹案周禮后備六服幷設五輅采章之數並與王同屬車之制不應獨異又宋孝建時議定輿輦天子屬車十有二乘至大明元年九月有司奏皇后副車未有定式詔下禮官議正其數博士王燮之議鄭玄云后象王立六宮亦正寢一而燕寢五推其所立每與王同謂十二乘通關為允宋帝從之遂為後式今請依乘輿不須差降制曰可三妃乘翟車以赤為質駕二馬九嬪已下並乘犢車青幰朱絡網皇太子妃乘翟車以赤為質駕三馬畫轅金飾犢車為副紫幰朱絡網良娣已下並乘犢車青幰朱𩹉三公夫人公主王妃並犢車紫幰朱絡網五品已上命婦並乘青幰與其夫同

body:
  text: 隋書卷三十志第二十五地理中河南郡滎陽郡梁郡譙郡濟陰郡襄城郡潁川郡汝南郡淮陽郡汝陰郡上洛郡弘農郡淅陽郡南陽郡淯陽郡淮安郡東郡東平郡濟北郡武陽郡渤海郡平原郡信都郡清河郡魏郡汲郡河內郡長平郡上黨郡河東郡絳郡文城郡臨汾郡龍泉郡西河郡離石郡雁門郡馬邑郡定襄郡樓煩郡太原郡襄國郡武安郡趙郡山郡博陵郡河間郡涿郡上谷郡漁陽郡北平郡安樂郡遼西郡北海郡齊郡東萊郡高密郡河南郡舊置洛州大業元年移都改曰豫州東面三門北曰上春中曰建陽南曰永通南面二門東曰長夏正南曰建國里一百三市三三年改為郡置尹統縣十八戶二十萬二千二百三十河南帶郡有關官有郟山有瀍水洛陽有漢已來舊都後魏置司州東魏改曰洛州後周置東京六府洛州總管開皇元年改六府置東京尚書省其年廢東京尚書省二年廢總管置河南道行臺省三年廢行臺以洛州刺史領總監十四年於金墉城別置總監煬帝即位廢省舊河南縣東魏遷鄴改為宜遷縣後周復曰河南大業元年徙入新都又東魏置洛陽郡河陰縣開皇初郡並廢又析置伊川縣大業初河陰伊川二縣併入焉閿鄉舊曰湖城開皇十六年改焉有王澗全鳩澗秦山桃林開皇十六年置有上陽宮有淄水陝後魏置及置陝州農郡後周又置崤郡開皇初郡並廢大業初州廢置弘農宮有常平倉溫湯有砥柱熊耳後周置及同軌郡開皇初郡廢又有後魏崤縣大業初廢入有二崤有天柱山大頭山硤石山穀水澠池後周置河南郡大象中廢新安後周置中州及東垣縣州尋廢開皇十六年置穀州仁壽四年州廢又廢新安入東垣大業初改名新安有冶官有騩山強山缺門山孝水澗水金谷水偃師舊廢開皇十六年置有關官有河陽倉有都尉府有首陽山酈山乾脯山鞏後齊廢開皇十六年復有興洛倉有九山有天陵山緱山東首陽山宜陽後魏置宜陽郡東魏置陽州後周改曰熊州又復後魏置南澠池縣後周改曰昌洛開皇初郡廢十八年改昌洛曰洛水大業初廢熊州省洛水入宜陽又東魏置金門郡後周廢有福昌宮金門山女几山太陰山嶕嶢山壽安後魏置縣曰甘棠仁壽四年改焉有顯仁宮有慈澗陸渾東魏置伊川郡領南陸渾縣開皇初廢郡改縣曰伏流大業初改曰陸渾又有東魏北荊州後周改曰和州開皇初又改曰伊州大業初州廢又有東魏東亭縣尋廢有方山三塗山孤山陽山王母澗伊闕舊曰新城東魏置新城郡開皇初郡廢十八年縣改名焉有伊闕山興泰大業初置有鹿蹄山石墨山鍾山緱氏舊廢東魏置開皇十六年廢大業初又置有緱氏山轘轅山景山嵩陽後魏置曰潁陽東魏分置堙陽後周廢潁陽入開皇六年改曰武林十八年改曰輪氏大業元年改曰嵩陽又有東魏中川郡後周廢有嵩高山少室山潁水陽城後魏置陽城郡開皇初廢十六年置嵩州仁壽四年廢又後魏置康城縣仁壽四年廢入焉有箕山偃月山荊山禹山崤山滎陽郡舊鄭州開皇十六年置管州大業初復曰鄭州統縣十一戶十六萬九百六十四管城舊曰中牟東魏置廣武郡開皇初郡廢改中牟曰內牟十六年析置管城十八年改內牟曰圃田入焉後魏置曲梁縣後齊廢有鄭水汜水舊曰成臯即武牢也後魏置東中府東魏置北豫州後周置滎州開皇初曰鄭州十八年改成臯曰汜水大業初置武牢都尉府有周山天陵山滎澤開皇四年置曰廣武仁壽元年改名焉原武開皇十六年置陽武圃田開皇十六年置曰郟城大業初改焉浚儀東魏置梁州陳留郡後齊廢開封郡入後周改曰汴州開皇初郡廢大業初州廢有關官有通濟渠蔡水酸棗後齊廢開皇六年復有關官新鄭後魏廢開皇十六年復大業初併宛陵縣入焉有關官有大騩山滎陽舊置滎陽郡後齊省卷京二縣入改曰成臯郡開皇初郡廢有京索水梧桐澗開封東魏置郡後齊廢梁郡開皇十六年置宋州統縣十三戶十五萬五千四百七十七宋城舊曰睢陽置梁郡開皇初郡廢十八年縣改名焉大業初又置郡又梁置北新安郡尋廢雍丘後魏置陽夏郡開皇初郡廢十六年置嵵州大業初州廢襄邑後齊廢開皇十六年復寧陵後齊廢開皇六年復虞城後魏曰蕭後齊廢開皇十六年置改名焉又後魏置沛郡後齊廢穀熟後魏廢開皇十六年復陳留後魏廢開皇六年復十六年析置新里縣大業初廢入焉又有小黃縣後齊廢入有睢水渙水下邑後齊廢巳吾縣入焉考城後魏曰考陽置北梁郡後齊郡縣並廢為城安縣開皇十八年以重名改曰考城楚丘後魏曰巳氏置北譙郡後齊郡縣並廢開皇四年又置巳氏六年改曰楚丘碭山後魏置曰安陽開皇十八年改名焉有碭山魚山圉城舊曰圉後齊廢開皇六年復置曰圉城有谷水柘城舊曰柘久廢開皇十六年置曰柘城譙郡後魏置南兗州後周置總管府後改曰亳州開皇元年府廢統縣六戶七萬四千八百一十七譙舊曰小黃置陳留郡開皇初郡廢十六年分置梅城縣大業三年改小黃為譙縣併梅城入焉酇舊廢開皇十六年復舊有馬頭郡後魏又置下邑縣後齊並廢城父宋置曰浚儀開皇十八年改焉谷陽後齊省開皇六年復山桑後魏置渦州渦陽縣又置譙郡梁改渦州曰西徐州東魏改曰譙州開皇初郡廢十六年改渦陽為肥水大業初州廢改縣曰山桑又梁置北新安郡東魏改置蒙郡後齊廢郡置蒙縣後又置郡開皇初郡廢又梁置陽夏郡東魏廢臨渙後魏置臨渙郡又別置丹城縣東魏析置白樿縣後齊郡廢開皇元年丹城省大業初白樿又省並入焉有嵇山龍岡濟陰郡後魏置西兗州後周改曰曹州統縣九戶十四萬九百四十八濟陰後魏置沛郡後齊廢又開皇六年分置黃縣十八年改為蒙澤大業初廢入焉外黃後齊廢成安縣入又開皇十八年置首城縣大業初廢入焉濟陽成武後齊置永昌郡開皇初郡廢十六年置戴州大業初州廢寃句乘氏定陶單父後魏曰離狐置北濟陰郡後齊郡縣並廢開皇六年更置名單父金鄉開皇十六年分置昌邑縣大業初併入襄城郡東魏置北荊州後周改曰和州開皇初改為伊州大業初改曰汝州統縣八戶十萬五千九百一十七承休舊曰汝原置汝北郡後改曰汝陰郡後周郡廢大業初改縣曰承休置襄城郡有黃水梁舊置汝北郡後齊廢有濫泉郟城舊曰龍山東魏置順陽郡及南陽郡南陽縣開皇初改龍山曰汝南三年二郡並廢十八年改汝南曰輔城南陽曰期城大業初改輔城曰郟城廢期城入焉有關官有大留山陽翟東魏置陽翟郡開皇初郡廢有鈞臺有九山祠汝源汝南有後魏汝南郡及符壘縣並後齊廢魯後魏置荊州尋廢立魯陽郡後置魯州開皇初郡廢大業初州廢有關官有和山大義山犫城舊曰雉陽開皇十八年改曰湛水大業初改名焉又有後周置武山郡開皇初廢後魏置南陽縣河山縣大業初並廢入焉有應山潁川郡舊置潁州東魏改曰鄭州後周改曰許州統縣十四戶十九萬五千六百四十潁川舊曰長社置潁川郡後齊廢潁陰縣入開皇初廢郡改縣焉又東魏置黃臺縣大業初廢入焉置郡襄城舊置襄城郡後周置汝州開皇初郡廢大業初州廢有水汝墳後齊置漢廣郡尋廢有首山葉後齊置襄州後周廢襄州置南襄城郡開皇初郡廢又東魏置定南郡後周廢為定南縣大業初省入北舞舊置定陵郡開皇初廢有百尺溝郾城開皇初置十六年置道州大業初州廢又後魏置潁川郡後齊改為臨潁郡開皇初郡廢又有邵陵縣大業初廢有水繁昌臨潁尉氏後齊廢開皇六年復長葛開皇六年置許昌強開皇十六年置曰陶城大業初改焉扶溝陵東魏置許昌郡後齊廢縣開皇初郡廢七年復陵縣十六年置洧州大業初州廢又開皇十六年置蔡陂縣至是省入焉汝南郡後魏置豫州東魏置行臺後周置總管府後改曰舒州尋復曰豫州及改洛州為豫州此為溱州又改曰蔡州統縣十一戶十五萬二千七百八十五汝陽舊曰上蔡置汝南郡開皇初郡廢大業初置郡改縣曰汝陽并廢保城縣入焉有鴻郄陂城陽舊廢梁置又有義興縣後魏置城陽郡梁置楚州東魏置西楚州後齊曰永州開皇九年廢入純州十八年改義興為純義大業初州縣並廢入焉又梁置伍城郡後齊廢有十丈山大木山真陽舊置郢州東魏廢州置義陽郡後齊廢郡入保城縣開皇十一年廢縣十六年置縣曰真丘大業初改曰真陽又有白狗縣梁置淮州後齊廢州以置齊興郡郡尋廢開皇初改縣曰淮川至是亦省入焉又有後魏安陽縣後廢有汶水新息後魏置東豫州梁改曰西豫州又改曰淮州東魏復曰東豫州後周改曰息州大業初州廢又後魏置汝南郡開皇初郡廢又梁置滇州尋廢又梁置北光城郡東魏廢又有北新息縣後齊廢褒信宋改曰包信大業初改復舊焉又梁置梁安郡開皇初廢又有長陵郡後齊廢為縣大業初又省縣焉上蔡後魏置曰臨汝後齊廢開皇中置曰武津大業初改名焉平輿舊廢大業初改新蔡置焉有葛陂新蔡齊置北新蔡郡魏曰新蔡郡東魏置蔡州後齊廢州置廣寧郡開皇初郡廢十六年置舒州及舒縣廣寧縣仁壽元年改廣寧曰汝北大業初州廢改汝北曰新蔡又後齊置永康縣後改名曰澺水至是及舒縣並廢入焉朗山舊曰安昌置初安郡廢十八年縣改名焉又梁置陳州後魏廢又齊置荊州尋廢後周又置威州後又廢吳房故曰遂寧後齊省綏義縣入焉大業初改曰吳房西平後魏置襄城郡後齊改郡曰文城開皇初郡廢又有故武陽縣十八年改曰吳房大業初省又有故洧州灊州並後齊置開皇初皆廢淮陽郡開皇十六年置陳州統縣十戶十二萬七千一百四宛丘後魏曰項置陳郡開皇初縣改名宛丘尋廢郡後析置臨蔡縣大業初置淮陽郡并臨蔡縣入焉又後魏置南陽郡東魏廢西華舊曰長平開皇十八年改曰鴻溝大業初改焉有舊長平縣後齊廢水開皇十六年置又有後魏汝陽郡及縣後齊郡廢大業初縣廢扶樂開皇十六年置有渦水太康舊曰陽夏并置淮陽郡開皇初郡廢七年更名太康有洼水鹿邑舊曰武平開皇十八年改名焉項城東魏置揚州及丹陽郡秣陵縣梁改曰殷州東魏又改曰北揚州後齊改曰信州後周改曰陳州開皇初改秣陵為項縣十六年分置沈州大業初州廢又有項城郡開皇初分立陳郡三年並廢南頓舊置南頓郡後齊廢郡及平鄉縣入改曰和城大業初又改為南頓開皇六年置鮦陽後齊廢開皇十一年復又東魏置財州後齊廢以置包信縣開皇初廢汝陰郡舊置潁州統縣五戶六萬五千九百二十六汝陰舊置汝陰郡開皇初郡廢大業初復置潁陽梁曰陳留并置陳留郡及陳州東魏廢州開皇初廢郡十八年縣改名焉有鄭縣後齊廢清丘梁曰許昌及置潁川郡開皇初廢郡十八年縣改名焉潁上梁置下蔡郡後齊廢郡大業初縣改名焉下蔡梁置汴郡後齊郡廢大業初縣改名焉又梁置淮陽郡後齊改曰潁川郡開皇初郡廢上洛郡舊置洛州後周改為商州統縣五戶一萬五百一十六上洛舊置上洛郡開皇初郡廢大業初復置有秦嶺山熊耳山洛水丹水商洛有關官洛南舊曰拒陽置拒陽郡開皇初郡廢縣改名焉有玄扈山陽虛山豐陽後周置開皇初併南陽縣入有洵水甲水上津舊置北上洛郡梁改為南洛州西魏又改為上州後周併漫川開化二縣入大業初廢州有天柱山詔及山女思山弘農郡大業三年置統縣四戶二萬七千四百六十六弘農舊置西農郡後周廢大業初置弘農郡又有石城郡玉城縣西魏並廢有石隄山盧氏後魏置漢安郡西魏置義川郡開皇初郡廢州改為虢州大業初州廢有關官有石扇山長泉後魏曰南陝西魏改焉有松楊山檀山朱陽舊置朱陽
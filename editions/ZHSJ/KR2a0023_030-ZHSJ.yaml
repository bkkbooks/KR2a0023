改為石邑七年改曰陽有山有陽溪有范水新樂開皇十六年置有黃山隋昌後魏曰魏昌後齊廢開皇十六年復仍改焉毌極義豐開皇六年置舊有安國縣後齊廢深澤後齊廢開皇六年復安平後齊置博陵郡開皇初廢十六年置深州大業初州廢河間郡舊置瀛州統縣十三戶十七萬三千八百八十三河間舊置河間郡開皇初郡廢大業初復置郡併武垣縣入焉文安有狐狸淀樂壽舊曰樂城開皇十八年改為廣城仁壽初改焉束城舊曰束州後齊廢開皇十六年置後改名焉景城舊曰成平開皇十八年改焉高陽舊置高陽郡開皇初郡廢十六年置蒲州大業初州廢并任丘縣入焉鄚有易城縣後齊廢開皇中置永寧縣大業初廢入焉博野舊曰博陸後魏改為博野後齊廢蠡吾縣入焉有君子淀清苑舊曰樂鄉後齊省樊輿北新城清苑樂鄉入永寧改名焉開皇十八年改為清苑長蘆開皇初置并立漳河郡郡尋廢十六年置景州大業初州廢平舒舊置章武郡開皇初廢魯城開皇十六年置饒陽開皇十六年分置安平蕪蔞二縣大業初省入焉涿郡舊置幽州後齊置東北道行臺後周平齊改置總管府大業初府廢統縣九戶八萬四千五十九薊舊置燕郡開皇初廢大業初置涿郡良鄉安次涿舊置范陽郡開皇初郡廢固安舊曰故安開皇六年改焉雍奴昌平舊置東燕州及平昌郡後周州郡並廢後又置平昌郡開皇初郡廢又省萬年縣入焉有關官有長城懷戎後齊置北燕州領長寧永豐二郡後周去北字開皇初郡廢大業初州廢有喬山歷陽山大小翮山有漷水上谷郡開皇元年置易州統縣六戶三萬八千七百易開皇初置黎郡尋廢十六年置縣大業初置上谷郡舊有故安縣後齊廢有駁牛山五廻嶺有易水徐水淶水舊曰縣後周廢開皇元年以范陽為更置范陽於此六年改為固安八年廢十年又置為永陽十八年改為淶水舊范陽居此俗號小范陽開皇初改為遂城舊曰武遂後魏置南營州准營州置五郡十一縣龍城廣興定荒屬昌黎郡石城廣都屬建德郡襄平新昌屬遼東郡永樂屬樂浪郡富平帶方永安屬營丘郡後齊唯留昌黎一郡領永樂新昌二縣餘並省開皇元年州移三年郡廢十八年改為遂城有龍山永樂舊曰北平後周改名焉有郎山飛狐後周置曰廣昌仁壽初改焉有栗山有巨馬河漁陽郡開皇六年徙玄州於此幷立總管府大業初府廢統縣一戶三千九百二十五無終後齊置後周又廢徐無縣入焉大業初置漁陽郡有長城有燕山無終山有泃河如河庚水灅水濫水有海北平郡舊置平州統縣一戶二千二百六十九盧龍舊置北平郡領新昌朝鮮二縣後齊省朝鮮入新昌又省遼西郡幷所領海陽縣入肥如開皇六年又省肥如入新昌十八年改名盧龍大業初置北平郡有長城有關官有臨渝宮有覆舟山有碣石有玄水盧水溫水閏水龍鮮水巨梁水有海安樂郡舊置安州後周改為玄州開皇十六年州徙尋置檀州統縣二戶七千五百九十九燕樂後魏置廣陽郡領大興方城燕樂三縣後齊廢郡以大興方城入焉大業初置安樂郡有長城有沽河密雲後魏置密雲郡領白檀要陽密雲三縣後齊廢郡及二縣入密雲又有舊安樂郡領安市土垠二縣後齊廢土垠入安市後周廢安市入密雲縣開皇初郡廢有長城有桃花山螺山有漁水遼西郡舊置營州開皇初置總管府大業初府廢統縣一戶七百五十一柳城後魏置營州於和龍城領建德冀陽昌黎遼東樂浪營丘等郡龍城大興永樂帶方定荒石城廣都陽武襄平新昌平剛柳城富平等縣後齊唯留建德冀陽二郡永樂帶方龍城大興等縣其餘並廢開皇元年唯留建德一郡龍城一縣其餘並廢尋又廢郡改縣為龍山十八年改為柳城大業初置遼西郡有帶方山禿黎山雞鳴山松山有渝水白狼水冀州於古堯之都也舜分州為十二冀州析置幽幷其於天文自胃七度至畢十一度為大梁屬冀州自尾十度至南斗十一度為析木屬幽州自危十六度至奎四度為娵訾屬幷州自柳九度至張十六度為鶉火屬三河則河內河東也准之星次本皆冀州之域帝居所在故其界尤大至夏廢幽并入焉得唐之舊矣信都清河河間博陵山趙郡武安襄國其俗頗同人性多敦厚務在農桑好尚儒學而傷於遲重前代稱冀幽之士鈍如椎蓋取此焉俗重氣俠好結朋黨其相赴死生亦出於仁義故班志述其土風悲歌慷慨椎剽掘冢亦自古之所患焉前諺云仕官不偶遇冀部實弊此也魏郡鄴都所在浮巧成俗彫刻之工特云精妙士女被服咸以奢麗相高其性所尚習得京洛之風矣語曰魏郡清河天公無奈何斯皆輕狡所致汲郡河內得殷之故壤考之舊說有紂之餘教汲又衞地習仲由之勇故漢之官人得以便宜從事其多行殺戮本以此焉今風俗頗移皆向於禮矣長平上黨人多重農桑性尤朴直蓋少輕詐河東絳郡文城臨汾龍泉西河土地沃少塉多是以傷於儉嗇其俗剛強亦風氣然乎太原山川重複實一都之會本雖後齊別都人物殷阜然不甚機巧俗與上黨頗同人性勁悍習於戎馬離石雁門馬邑定襄樓煩涿郡上谷漁陽北平安樂遼西皆連接邊郡習尚與太原同俗故自古言勇俠者皆推幽幷云然涿郡太原自前代已來皆多文雅之士雖俱曰邊郡然風教不為比也北海郡舊置青州後周置總管府開皇十四年府廢統縣十戶十四萬七千八百四十五益都舊置齊郡開皇初廢大業初置北海郡有堯山峱山臨淄及東安平西安並後齊廢開皇十六年又置臨淄及時水縣大業初廢高陽時水二縣入焉有社山葵丘牛山稷山千乘舊置樂安郡開皇初郡廢博昌舊曰樂安開皇十六年改焉又十八年析置新河縣大業初廢入焉壽光開皇十六年置閭丘縣大業初廢入焉臨朐舊曰昌國開皇六年改為逢山又置般陽縣大業初改曰臨朐幷廢般陽入焉有逢山沂山穆陵山大峴山有汶水浯水都昌有箕山阜山白狼山北海舊曰下密置北海郡後齊改郡曰高陽開皇初郡廢十六年分置濰州大業初州廢縣改名焉營丘後齊廢開皇十六年復有叢角山女節山下密後魏曰膠東後齊廢開皇六年復改為濰水大業初改名焉有鐵山有溉水齊郡舊曰齊州統縣十戶十五萬二千三百二十三歷城舊置濟南郡開皇初廢大業初置齊郡廢山茌縣入焉有舜山雞山盧山鵲山華山鮑山祝阿臨邑臨濟開皇六年置曰朝陽十六年改曰臨濟別置朝陽大業初廢入焉鄒平舊曰平原開皇十八年改名焉章丘舊曰高唐開皇十六年改焉又置營城縣大業初廢入焉又宋置東魏郡後齊廢有東陵山長白山龍盤山長山舊曰武強置廣川郡併東清河平原二郡入改曰東平原郡開皇初郡廢又十六年置濟南縣十八年改武強曰長山大業初省濟南縣入焉高苑後齊曰長樂開皇十八年改為會城大業初改焉亭山舊曰衞國後齊併土鼓肥鄉入焉開皇六年改名亭山有龍舟山儒山淄川舊曰貝丘置東清河郡後齊郡廢開皇十六年置淄州十八年縣改名焉大業初州廢東萊郡舊置光州開皇五年改曰萊州統縣九戶九萬三百五十一掖舊置東萊郡後齊併曲城當利二縣入焉開皇初廢郡大業初復置郡有缶山有掖水光水膠水舊曰長廣仁壽元年改名焉有明堂山盧鄉後齊盧鄉及挺城並廢開皇十六年復置盧鄉幷廢挺城入焉即墨後齊及不其縣並廢開皇十六年復幷廢不其入焉有大勞山馬山有田橫島觀陽後周廢開皇十六年復又分置牟州大業初州廢昌陽有巨神山黃舊置東牟長廣二郡後齊廢東牟郡入長廣郡開皇初郡廢牟平有牟山龍山金山九目山文登後齊置有石橋有文登山斥山之罘山高密郡舊置膠州開皇五年改為密州統縣七戶七萬一千九百二十諸城舊曰東武置高密郡開皇初郡廢十八年縣改名焉大業初復置郡有烽火山東莞後齊併姑幕縣入焉有箕山濰水郚城舊置平昌郡後齊廢郡置琅邪縣廢朱虛入焉大業初改名郚城安丘開皇十六年置曰牟山大業初改名幷省安昌入焉高密後齊廢淳于縣入焉膠西舊曰黔陬置平昌郡開皇初郡廢十六年置縣曰膠西大業初又以黔陬入焉琅邪開皇十六年置曰豐泉大業初改焉有徐山盧山鄣日山膠水周禮職方氏正東曰青州其在天官自須女八度至危十五度為玄枵於辰在子齊之分野吳札觀樂聞齊之歌曰泱泱乎大風也哉國未可量也在漢之時俗彌侈泰織作冰紈綺繡純麗之物號為冠帶衣履天下始太公以尊賢尚智為教故士庶傳習其風莫不矜于功名依於經術闊達多智志度舒緩其為失也夸奢朋黨言與行謬齊郡舊曰濟南其俗好教飾子女淫哇之音能使骨騰肉飛傾詭人目俗云齊倡本出此也祝阿縣俗賓婚大會餚饌雖豐至於蒸膾嘗之而已多則謂之不敬共相誚責此其異也大抵數郡風俗與古不殊男子多務農桑崇尚學業其歸于儉約則頗變舊風東萊人尤朴魯故特少文義

body:
  text: 隋書卷七志第二禮儀二春秋龍見而雩梁制不為祀四月後旱則祈雨行七事一理寃獄及失職者二振魚眾寡孤獨者三省繇輕賦四舉進賢良五黜退貪邪六命會男女恤怨曠七撤膳羞弛樂懸而不作天子又降法服七日乃祈社稷七日乃祈山林川澤常興雲雨者七日乃祈羣廟之主于太廟七日乃祈古來百辟卿士有益於人者七日乃大雩祈上帝徧祈所有事者大雩禮立圓壇於南郊之左高及輪廣四丈周十二丈四陛牲用黃牯牛一祈五天帝及五人帝於其上各依其方以太祖配位於青帝之南五官配食於下七日乃去樂又徧祈社稷山林川澤就故地處大雩國南除地為墠舞童六十四人祈百辟卿士於雩壇之左除地為墠舞童六十四人皆袨服為八列各執羽翳每列歌雲漢詩一章而畢旱而祈澍則報以太牢皆有司行事唯雩則不報若郡國縣旱請雨則五事同時並行一理寃獄失職二存魚眾寡孤獨三省徭役四進賢良五退貪邪守令皆潔齋三日乃祈社稷七日不雨更齋祈如初三變仍不雨復齋祈其界內山林川澤常興雲雨者祈而澍亦各有報陳氏亦因梁制祈而澍則報以少牢武帝時以德皇帝配文帝時以武帝配廢帝即位以文帝配青帝牲用黃牯牛而以清酒四升洗其首其壇墠配饗歌舞皆如梁禮天子不親奉則太宰太常光祿行三獻禮其法皆採齊建武二年事也梁陳制諸祠官皆給除穢氣藥先齋一日服之以取清潔天監九年有事雩壇武帝以為雨既類陰而求之正陽其謬已甚東方既非盛陽而為生養之始則雩壇應在東方祈晴亦宜此地於是遂移於東郊十年帝又以雩祭燔柴以火祈水於理為乖儀曹郎朱虉議曰案周宣雲漢之詩毛注有瘞埋之文不見有燔柴之說若以五帝必柴今明堂又無其事於是停用柴從坎瘞典十一年帝曰四望之祀頃來遂絕宜更議復朱虉議鄭衆云四望謂日月星海鄭玄云謂五岳四鎮四瀆尋二鄭之說互有不同竊以望是不即之名凡厥遙祭皆有斯目豈容局於星漢拘於海瀆請命司天有關水旱之義爰有四海名山大川能興雲致雨一皆備祭帝從之又揚州主簿顧協又云禮仲夏大雩春秋龍見而雩則雩常祭也水旱且又禱之謂宜式備斯典太常博士亦從協議祠部郎明巖卿以為祈報之祀已備郊禋沿革有時不必同揆帝從其議依舊不改大同五年又築雩壇於藉田兆內有祈禜則齋官寄藉田省云後齊以孟夏龍見而雩祭太微五精帝於夏郊之東為圓壇廣四十五尺高九尺四面各一陛為三壝外營相去深淺幷燎壇一如南郊於其上祈穀實以顯宗文宣帝配青帝在甲寅之地赤帝在丙巳之地黃帝在己未之地白帝在庚申之地黑帝在壬亥之地面皆內向藉以秸配帝在青帝之南小退藉以莞席牲以騂其儀同南郊又祈禱者有九焉一曰雩二曰南郊三曰堯廟四曰孔顏廟五曰社稷六曰五岳七曰四瀆八曰滏口九曰豹祠水旱癘疫皆有事焉無牲皆以酒脯棗栗之饌若建午建未建申之月不雨則使三公祈五帝於雩壇禮用玉幣有燎不設金石之樂選伎工端潔善謳詠者使歌雲漢詩於壇南自餘同正雩南郊則使三公祈五天帝於郊壇有燎座位如雩五人帝各在天帝之左其儀如郊禮堯廟則遣使祈於平陽孔顏廟則遣使祈於國學如堯廟社稷如正祭五岳遣使祈於岳所四瀆如祈五岳滏口如祈堯廟豹祠如祈滏口隋雩壇國南十三里啟夏門外道左高一丈周百二十尺孟夏之月龍星見則雩五方上帝配以五人帝於上以太祖武元帝配饗五官從配於下牲用犢十各依方色京師孟夏後旱則祈雨理寃獄失職存魚眾寡孤獨振困乏掩骼埋胔省徭役進賢良舉直言退佞諂黜貪殘命有司會男女恤怨曠七日乃祈岳鎮海瀆及諸山川能興雲雨者又七日乃祈社稷及古來百辟卿士有益於人者又七日乃祈宗廟及古帝王有神祠者又七日乃修雩祈神州又七日仍不雨復從岳瀆已下祈如初典秋分已後不雩但禱而已皆用酒脯初請後二旬不雨者即徙市禁屠皇帝御素服避正殿減膳撤樂或露坐聽政百官斷傘扇令人家造土龍雨澍則命有司報州郡尉祈雨則理寃獄存魚眾寡孤獨掩骼埋胔潔齋祈于社七日乃祈界內山川能興雨者徙市斷屠如京師祈而澍亦各有報霖雨則禜京城諸門三禜不止則祈山川岳鎮海瀆社稷又不止則祈宗廟神州報以太牢州郡縣苦雨亦各禜其城門不止則祈界內山川及祈報用羊豕禮天子每以四立之日及季夏乘玉輅建大旂服大裘各於其方之近郊為兆迎其帝而祭之所謂燔柴於泰壇掃地而祭者也春迎靈威仰者三春之始萬物禀之而生莫不仰其靈德服而畏之也夏迎赤熛怒者火色熛怒其靈炎至明盛也秋迎白招拒者招集拒大也言秋時集成萬物其功大也冬迎叶光紀者叶拾光華紀法也言冬時收拾光華之色伏而藏之皆有法也中迎含樞紐者含容也樞機有開闔之義紐者結也言土德之帝能含容萬物開闔有時紐結有法也然此五帝之號皆以其德而名焉梁陳後齊後周及隋制度相循皆以其時之日各於其郊迎而以太皡之屬五人帝配祭並以五官三辰七宿於其方從祀焉梁制迎氣以始祖配牲用特牛一其儀同南郊天監七年尚書左丞司馬筠等議以昆蟲未蟄不以火田鳩化為鷹罻羅方設仲春之月祀不用牲止珪璧皮幣斯又事神之道可以不殺明矣况今祀天豈容尚此請夏初迎氣祭不用牲帝從之八年明山賓議曰周官祀昊天以大裘祀五帝亦如之頃代郊祀之服皆用袞冕是以前奏迎氣祀五帝亦服袞冕愚謂迎氣祀五帝亦宜用大裘禮俱一獻帝從之陳迎氣之法皆因梁制後齊五郊迎氣為壇各於四郊又為黃壇於未地所祀天帝及配帝五官之神同梁其玉帛牲各以其方色其儀與南郊同帝及后各以夕牲日之旦太尉陳幣告請其廟以就配焉其從祀之官位皆南陛之東西向壇上設饌畢太宰丞設饌於其座亞獻畢太常少卿乃於其所獻事畢皆撤又云立春前五日於州大門外之東造青土牛兩頭耕夫犁具立春有司迎春於東郊豎青幡於青牛之傍焉後周五郊壇其崇及去國如其行之數其廣皆四丈其方俱百二十步內壝皆半之祭配皆同後齊星辰七宿岳鎮海瀆山林川澤丘陵墳衍亦各於其方配郊而祀之其星辰為壇崇五尺方二丈岳鎮為坎方二丈深二尺山林已下亦為坎壇崇三尺坎深一尺俱方一丈其儀頗同南郊冢宰亞獻宗伯終獻禮畢隋五時迎氣青郊為壇國東春明門外道北去宮八里高八尺赤郊為壇國南明德門外道西去宮十三里高七尺黃郊為壇國南安化門外道西去宮十二里高七尺白郊為壇國西開遠門外道南去宮八里高九尺黑郊為壇宮北十一里丑地高六尺並廣四丈各以四方立日黃郊以季夏土王日祀其方之帝各配以人帝以太祖武元帝配五官及星三辰七宿亦各依其方從祀其牲依方色各用犢二星辰加羊豕各一其儀同南郊其岳瀆鎮海各依五時迎氣日遣使就其所祭之以太牢晉江左以後乃至宋齊相承始受命之主皆立六廟虛太祖之位宋武初為宋王立廟於彭城但祭高祖已下四世中興二年梁武初為梁公曹文思議天子受命之日便祭七廟諸侯始封即祭五廟祠部郎謝廣等並駁之遂不施用乃建臺於東城立四親廟幷妃郗氏而為五廟告祠之禮並用太牢其年四月即皇帝位謝廣又議以為初祭是四時常祭首月既不可移易宜依前剋日於東廟致齋帝從之遂於東城時祭訖遷神主於太廟始自皇祖太中府君皇祖淮陰府君皇高祖濟陰府君皇曾祖中從事史府君皇祖特進府君幷皇考以為三昭三穆凡六廟追尊皇考為文皇帝皇妣為德皇后廟號太祖皇祖特進以上皆不追尊擬祖遷於上而太祖之廟不毀與六親廟為七皆同一堂共庭而別室春祀夏礿秋嘗冬蒸幷臘一歲凡五謂之時祭三年一禘五年一祫謂之殷祭禘以夏祫以冬皆以功臣配其儀頗同南郊又有小廟太祖太夫人廟也非嫡故別立廟皇帝每祭太廟訖乃詣小廟亦以一太牢如太廟禮天監三年尚書左丞何佟之議曰禘於首夏物皆未成故為小袷於秋冬萬物皆成其禮尤大司勳列功臣有六皆祭於大蒸知祫尤大乃及之也近代禘袷並及功臣有乖典制宜改詔從之自是祫祭乃及功臣是歲都令史王景之列自江左以來郊廟祭祀帝已入齋百姓尚哭以為乖禮佟之等奏案禮國門在皐門外今之籬門是也今古殊制若禁凶服不得入籬門為太遠宜以六門為斷詔曰六門之內士庶甚多四時蒸嘗俱斷其哭若有死者棺器須來既許其大而不許其細也到齋日宜去廟二百步斷哭四年何佟之議案禮未祭一日大宗伯省牲鑊祭日之晨君親牽牲麗碑後代有冒暗之防而人主猶必親奉故有夕牲之禮頃代人君不復躬牽相承丹陽尹牽牲於古無取宜依以未祭一日之暮太常省牲視鑊祭日之晨使太尉牽牲出入也少牢饋食殺牲於廟門外今儀注詣烹牲謂宜依舊帝可其奏佟之又曰鄭玄云天子諸侯之祭禮先有祼尸之事乃迎牲今儀注乃至薦熟畢太祝方執珪瓚祼地違謬若斯又近代人君不復躬行祼禮太尉既攝位實宜親執其事而越使卑賤太祝甚乖舊典愚謂祭日之晨宜使太尉先行祼獻乃後迎牲帝曰祼尸本使神有所附今既無尸祼將安設佟之曰如馬鄭之意祼雖獻尸而義在求神今雖無尸求神之義恐不可闕帝曰此本因尸以祀神今若無尸則宜立寄求之所祼義乃定佟之曰祭統云獻之屬莫重於祼今既存尸卒食之獻則祼鬯之求實不可闕又送神更祼經記無文宜依禮革奏未報而佟之卒後明山賓復申其理帝曰佟之既不復存宜從其議也自是始使太尉代太祝行祼而又牽牲太常任昉又以未明九刻呈牲又加太尉祼酒三刻施饌間中五刻行儀不辦近者臨祭從事實以二更至未明三刻方辦明山賓議謂九刻已疑太早况二更非復祭旦帝曰夜半子時即是晨始宜取三更省牲餘依儀注又有司以為三牲或離杙依制埋瘞猪羊死則不埋請議其制司馬褧等議以為牲死則埋必在滌矣謂三牲在滌死悉宜埋帝從之五年明山賓議樽彝之制祭圖唯有三樽一曰象樽周樽也二曰山罍夏樽也三曰著樽殷樽也徒有彝名竟無其器直酌象樽之酒以為珪瓚之實竊尋祼重於獻不容共樽宜循彝器以備大典案禮器有六彝春祠夏礿祼用雞彝鳥彝王以珪瓚初祼后以璋瓚亞祼故春夏兩祭俱用二彝今古禮殊無復亞祼止循其二春夏雞彝秋冬斝彝庶禮物備也帝曰雞是金禽亦主巽位但金火相伏用之通夏於義為疑山賓曰臣愚管不奉明詔則終年乖舛案鳥彝是南方之物則主火位木生於火宜以鳥彝春夏兼用帝從之七年舍人周捨以為禮玉輅以祀金輅以賓則祭日應乘玉輅詔下其議左丞孔休源議玉輅既有明文而儀注金輅當由宋齊乖謬宜依捨議帝從之又禮官司馬筠議自今大事遍告七廟小事止告一室於是議以封禪南北郊祀明堂巡省四方御臨戎出征皇太子加元服寇賊平蕩築宮立闕纂戎戒嚴解嚴合十一條則遍告七廟講武修宗廟明堂臨軒封拜公王四夷款化貢方物諸公王以愆削封及詔封王紹襲合六條則告一室帝從之九年詔簠簋之實以藉田黑黍十二年詔曰祭祀用洗匜中水盥仍又滌爵爵以禮神宜窮精潔而一器之內雜用洗手外可詳議於是御及三公應盥及洗爵各用一匜十六年四月詔曰夫神無常饗饗于克誠所以西鄰礿祭實受其福宗廟祭祀猶有牲牢無益至誠有累冥道自今四時蒸嘗外可量代八座議以大脯代一元大武八座又奏既停宰殺無復省牲之事請立省饌儀其衆官陪列並同省牲帝從之十月詔曰今雖無復牲腥猶有脯脩之類即之幽明義為未盡可更詳定悉薦時蔬左丞司馬筠等參議大餅代大脯餘悉用蔬菜帝從之又舍人朱虉議二廟祀相承止有鈃羹蓋祭祀之禮應有兩羹相承止於一鈃即禮為乖請加熬油蓴羹一鈃帝從之麑是起至敬殿景陽臺立七廟座月中再設凈饌自是訖於臺城破諸廟遂不血食普通七年祔皇太子所生丁貴嬪神主于小廟其儀未祔前先修坎室改塗其日有司行掃除開坎室奉皇考太夫人神主於坐奠制幣訖衆官入自東門位定祝告訖撤幣埋於兩楹間有司遷太夫人神主於上又奉穆貴嬪神主於下陳祭器如時祭儀禮畢納神主閉于坎室陳制立七廟一歲五祠謂春夏秋冬臘也每祭共以一太牢始祖以三牲首餘唯骨體而已五歲再殷殷大祫而合祭也初文帝入嗣而皇考始興昭烈王廟在始興國謂之東廟天嘉四年徙東廟神主祔于梁之小廟改曰國廟祭用天子儀後齊文襄嗣位猶為魏臣置王高祖秦州使君王曾祖太尉武貞公王祖太師文穆公王考相國獻武王凡四廟文宣帝受禪置六廟曰皇祖司空公廟皇祖吏部尚書廟皇祖秦州使君廟皇祖文穆皇帝廟太祖獻武皇帝廟世宗文襄皇帝廟為六廟獻武已下不毀已上則遞毀並同廟而別室既而遷神主於太廟文襄文宣並太祖之子文宣初疑其昭穆之次欲別立廟衆議不同至二年秋始祔太廟春祠夏礿秋嘗冬蒸皆以孟月幷臘凡五祭禘祫如梁之制每祭室一太牢始以皇后預祭河清定令四時祭廟禘祭及元日廟庭並設庭燎二所王及五等開國執事官散官從三品已上皆祀五世五等散品及執事官散官正三品已下從五品已上祭三世三品已上牲用一太牢五品已下少牢執事官正六品已下從七品已上祭二世用特牲正八品已下達於庶人祭於寢牲用特肫或亦祭祖禰諸廟悉依其宅堂之制其間數各依廟多少為限其牲皆子孫見官之牲後周之制思復古之道乃右宗廟而左社稷置太祖之廟幷高祖已下二昭二穆凡五親盡則遷其有德者謂之祧廟亦不毀閔帝受禪追尊皇祖為德皇帝文王為文皇帝廟號太祖擬已上三廟遞遷至太祖不毀其下相承置二昭二穆為五焉明帝崩廟號世宗武帝崩廟號高祖並為祧廟而不毀其時祭各於其廟祫禘則於太祖廟亦以皇后預祭其儀與後齊同所異者皇后亞獻訖后又薦加豆之籩其實菱芡芹葅兔醢冢宰終獻訖皇后親撤豆降還板位然後太祝撤焉高祖既受命遣兼太保宇文善兼太尉李詢奉策詣同州告皇考桓王廟兼用女巫同家人之禮上皇考桓王尊號為武元皇帝皇妣尊號為元明皇后奉迎神主歸于京師犧牲尚赤祭用日出是時帝崇建社廟改周制左宗廟而右社禝宗廟未言始祖又無受命之祧自高祖已下置四親廟同殿異室而已一曰皇高祖太原府君廟二曰皇曾祖康王廟三曰皇祖獻王廟四曰皇考太祖武元皇帝廟擬祖遷於上而太祖之廟不毀各以孟月饗以太牢四時薦新於太廟有司行事而不出神主祔祭之禮並準時饗其司命戶以春竈以夏門以秋行以冬各於享廟日中霤則以季夏祀黃郊日各命有司祭於廟西門道南牲以少牢三年一袷以孟冬遷主未遷主合食於太祖之廟五年一禘以孟夏其遷主各食於所遷之廟未遷之主各於其廟禘祫之月則停時饗而陳諸瑞物及伐國所獲珍奇於廟庭及以功臣配饗幷以其日使祀先代王公帝堯於平陽以契配帝舜於河東咎繇配夏禹於安邑伯益配殷湯於汾陰伊尹配文王武王於灃渭之郊周公召公配漢高帝於長陵蕭何配各以一太牢而無樂配者饗於廟庭大業元年煬帝欲遵周法營立七廟詔有司詳定其禮禮部侍郎攝太常少卿許善心與博士褚亮等議曰謹案禮記天子七廟三昭三穆與太祖之廟而七鄭玄注曰此周制也七者太祖及文王武王之祧與親廟四也殷則六廟契及湯與二昭二穆也夏則五廟無太祖禹與二昭二穆而已玄又據王者禘其祖之所自出而立四廟案鄭玄義天子唯立四親廟幷始祖而為五周以文武為受命之祖特立二祧是為七廟王肅注禮記尊者尊統上卑者尊統下故天子七廟諸侯五廟其有殊功異德非太祖而不毀不在七廟之數案王肅以為天子七廟是通百代之言又據王制之文天子七廟諸侯五廟大夫三廟降二為差是則天子立四親廟又立高祖之父高祖之祖幷太祖而為七周有文武姜嫄合為十廟漢諸帝之廟各立無迭毀之義至元帝時貢禹匡衡之徒始建其禮以高帝為太祖而立四親廟是為五廟唯劉歆以為天子七廟諸侯五廟降殺以兩之義七者其正法可常數也宗不在數內有功德則宗之不可預設為數也是以班固稱考論諸儒之議劉歆博而篤矣光武即位建高廟於洛陽乃立南頓君以上四廟就祖宗而為七至魏初高堂隆為鄭學議立親廟四太祖武帝猶在四親之內乃虛置太祖及二祧以待後代至景初間乃依王肅更立五世六世祖就四親而為六廟晉武受禪博議宗祀自文帝以上六世祖征西府君而宣帝亦序於昭穆未升太祖故祭止六也江左中興賀循知禮至於寢廟之儀皆依魏晉舊事宋武帝初受晉命為王依諸侯立親廟四即位之後增祠五世祖相國掾府君六世祖右北平府君止於六廟逮身歿主升從昭穆猶太祖之位也降及齊梁守而弗革加崇迭毀禮無違舊臣等又案姬周自太祖已下皆別立廟至於禘袷俱合食於太祖是以炎漢之初諸廟各立歲時嘗享亦隨處而祭所用廟樂皆象功德而歌焉至光武乃總立一堂而羣主異室斯則新承寇亂欲從約省自此以來因循不變伏惟高祖文皇帝睿哲玄覽神武應期受命開基垂統聖嗣當文明之運定祖宗之禮且損益不同沿襲異趣時王所制可以垂法自歷代以來雜用王鄭二義若尋其指歸校以優劣康成止論周代非謂經通子雍總貫皇王事兼長遠今請依據古典崇建七廟受命之祖宜別立廟祧百代之後為不毀之法至於鑾駕親奉申孝享於高廟有司行事竭誠敬於羣主俾夫規模可則嚴祀易遵表有功而彰明德大復古而貴能變臣又案周人立廟亦無處置之文據冢人處職而言之先王居中以昭穆為左右阮忱撰禮圖亦從此義漢京諸廟既遠又不序禘祫今若依周制理有未安雜用漢儀事難全採謹詳立別圖附之議末其圖太祖高祖各一殿准周文武二祧與始祖而三餘並分室而祭始祖及二祧之外從迭毀之法詔可未及創制既營建洛邑帝無心京師乃於東都固本里北起天經宮以游高祖衣冠四時致祭於三年有司奏請準前議於東京建立宗廟帝謂祕書監柳曰今始祖及二祧已具今後子孫處朕何所又下詔唯議別立高祖之廟屬有行役遂復停寢自古帝王之興皆禀五精之氣每易姓而起以致太平必封乎太山所以告成功也封訖而禪乎梁甫梁甫者太山之支山卑下者也能以其道配成高德故禪乎梁甫亦以告太平也封禪者高厚之謂也天以高為尊地以厚為德增太山之高以報天也厚梁甫之基以報地也明天之所命功成事就有益於天地若天地之更高厚云記曰王者因天事天因地事地因名山升中于天而鳳凰降龜龍格齊桓公既霸而欲封禪管仲言之詳矣秦始皇既黜儒生而封太山禪梁甫其封事皆祕之不可得而傳也漢武帝頗採方士之言造為玉牒而編以金繩封廣九尺高一丈二尺光武中興聿遵其故晉宋齊梁及陳皆未遑其議後齊有巡狩之禮幷登封之儀竟不之行也開皇十四年羣臣請封禪高祖不納晉王廣又率百官抗表固請帝命有司草儀注於是牛弘辛彥之許善心姚察虞世基等創定其禮奏之帝逡巡其事曰此事體大朕何德以堪之但當東狩因拜岱山耳十五年春行幸兗州遂次岱岳為壇如南郊又壝外為柴壇飾神廟展宮懸於庭為埋坎二於南門外又陳樂設位於青帝壇如南郊帝服兗冕乘金輅備法駕而行禮畢遂詣青帝壇而祭焉開皇十四年閏十月詔東鎮沂山南鎮會稽山北鎮醫無閭山冀州鎮霍山並就山立祠東海於會稽縣界南海於南海鎮南並近海立祠及四瀆吳山並取側近巫一人主知灑掃並命多蒔松柏其霍山雩祀日遣使就焉十六年正月又詔北鎮於營州龍山立祠東鎮晉州霍山鎮若修造並準西鎮吳山造神廟大業中煬帝因幸晉陽遂祭岳其禮頗採高祖拜岱宗儀增置二壇命道士女官數十人於壝中設醮十年幸東都過祀華岳築場於廟側事乃不經蓋非有司之定禮也禮天子以春分朝日於東郊秋分夕月於西郊漢法不俟二分於東西郊常以郊泰畤旦出竹宮東向揖日其夕西向揖月魏文譏其煩似家人之事而以正月朝日于東門之外前史又以為非時及明帝太和元年二月丁亥朝日于東郊八月己丑夕月于西郊始合於古後周以春分朝日於國東門外為壇如其郊用特牲青幣青圭有邸皇帝乘青輅及祀官俱青冕執事者青弁司徒亞獻宗伯終獻燔燎如圓丘秋分夕月於國西門外為壇於坎中方四丈深四尺燔燎禮如朝日開皇初於國東春明門外為壇如其郊每以春分朝日又於國西開遠門外為坎深三尺廣四丈為壇於坎中高一尺廣四尺每以秋分夕月牲幣與周同凡人非土不生非穀不食土穀不可偏祭故立社稷以主祀古先聖王法施於人則祀之故以勾龍主社周棄主稷而配焉歲凡再祭蓋春求而秋報列於中門之外外門之內尊而親之與先祖同也然而古今既殊禮亦異制故左社稷而右宗廟者得質之道也右社稷而左宗廟者文之道也梁社稷在太廟西其初蓋晉元帝建武元年所創有太社帝社太稷凡三壇門牆並隨其方色每以仲春仲秋幷令郡國縣祠社稷先農縣又兼祀靈星風伯雨師之屬及臘又各祠社稷于壇百姓則二十五家為一社其舊社及人稀者不限其家春秋祠水旱禱祈祠具隨其豐約其郡國有五岳者置宰祝三人及有四瀆若海應祠者皆以孟春仲冬祠之舊太社犧吏牽牲司農省牲太祝吏讚牲天監四年明山賓議以為案郊廟省牲日則犧令牽牲太祝令讚牲祭之日則太尉牽牲郊特牲云社者神地之道國主社稷義實為重今公卿貴臣親執盛禮而令微吏牽牲頗為輕末且司農省牲又非其義太常禮官實當斯職禮祭社稷無親事牽之文謂宜以太常省牲犧令牽牲太祝令讚牲帝唯以太祝讚牲為疑又以司農省牲於理似傷犧吏執紖即事成卑議以太常丞牽牲餘依明議於是遂定至大同初又加官社官稷幷前為五壇焉陳制皆依梁舊而帝社以三牲首餘以骨體薦粢盛為六飯粳以敦稻以牟黃粱以簠白粱以簋黍以瑚粢以璉又令太史署常以二月八日於署庭中以太牢祠老人星兼祠天皇大帝太一日月五星鉤陳北極北斗三台二十八宿大人星子孫星都四十六坐凡應預祠享之官亦太醫給除穢氣散藥先齋一日服之以自潔其儀本之齊制後齊立太社帝社太稷三壇於國右每仲春仲秋月之元辰及臘各以一太牢祭焉皇帝親祭則司農卿省牲進熟司空亞獻司農終獻後周社稷皇帝親祀則冢宰亞獻宗伯終獻開皇初社稷並列於含光門內之右仲春仲秋吉戊各以一太牢祭焉牲色用黑孟冬下亥又臘祭之州郡縣二仲月並以少牢祭百姓亦各為社又於國城東南七里延興門外為靈星壇立秋後辰令有司祠以一少牢古典有天子東耕儀江左未暇至宋始有其典梁初藉田依宋齊以正月用事不齋不祭天監十二年武帝以為啟蟄而耕則在二月節內書云以殷仲春藉田理在建卯於是改用二月又國語云王即齋宮與百官御事並齋三日乃有沐浴祼饗之事前代當以耕而不祭故闕此禮國語又云稷臨之太史讚之則知耕藉應有先農神座兼有讚述耕旨今藉田應散齋七日致齋三日兼於耕所設先農神座陳薦羞之禮讚辭如社稷法又曰齊代舊事藉田使御史乘馬車載耒耜於五輅後禮云親載耒耜措于參保介之御間則置所乘輅上若以今輅與古不同則宜升之次輅以明慎重而遠在餘處於義為乖且御史掌視尤為輕賤自今宜以侍中奉耒耜載於象輅以隨木輅之後普通二年又移藉田於建康北岸築兆域大小列種梨柏便殿及齋官省如南北郊別有望耕臺在壇東帝親耕畢登此臺以觀公卿之推伐又有祈年殿云北齊藉於帝城東南千畝內種赤粱白穀大豆赤黍小豆黑穄麻子小麥色別一頃自餘一頃地中通阡陌作祠壇於陌南阡西廣輪三十六尺高九尺四陛三壝四門又為大營於外又設御耕壇於阡東陌北每歲正月上辛後吉亥使公卿以一太牢祠先農神農氏於壇上無配饗祭訖親耕先祠司農進穜稑之種六宮主之行事之官幷齋設齋省於壇所列宮懸又置先農坐於壇上衆官朝服司空一獻不燎祠訖皇帝乃服通天冠青紗袍黑介幘佩蒼玉黃綬青帶袜舄備法駕乘木輅耕官具朝服從殿中監進御耒於壇南百官定列帝出便殿升耕壇南陛即御座應耕者各進於列帝降自南陛至耕位釋劍執耒三推三反升壇即坐耕官一品五推五反二品七推七反三品九推九反藉田令帥其屬以牛耕終千畝以青箱奉穜稑種跪呈司農詣耕所灑之耰訖司農省功奏事畢皇帝降之便殿更衣饗宴禮畢班賚而還隋制於國南十四里啟夏門外置地千畝為壇孟春吉亥祭先農於其上以后稷配牲用一太牢皇帝服兗冕備法駕乘金根車禮三獻訖因耕司農授耒皇帝三推訖執事者以授應耕者各以班五推九推而司徒帥其屬終千畝播殖九穀納于神倉以擬粢盛穰以餉犧牲云周禮王后蠶於北郊而漢法皇后蠶於東郊魏遵周禮蠶于北郊吳韋昭制西蠶頌則孫氏亦有其禮矣晉太康六年武帝楊皇后蠶于西郊依漢故事江左至宋孝武大明四年始於臺城西白石里為西蠶設兆域置大殿七間又立蠶觀自是有其禮後齊為蠶坊於京城北之西去皇宮十八里之外方千步蠶宮方九十步牆高一丈五尺被以棘其中起蠶室二十七口別殿一區置蠶宮令丞佐史皆宦者為之路西置皇后蠶壇高四尺方二丈四出階廣八尺置先蠶壇於桑壇東南大路東橫路之南壇高五尺方二丈四出階廣五尺外兆方四十步面開一門有綠襜襦衣黃履以供蠶母每歲季春穀雨後吉日使公卿以一太牢祀先蠶黃帝軒轅氏於壇上無配如祀先農禮訖皇后因親桑於桑壇備法駕服鞠衣乘重翟帥六宮升桑壇東陛即御座女尚書執筐女主衣執鈎立壇下皇后降自東陛執筐者處右執鈎者居左蠶母在後乃躬桑三條訖升壇即御座內命婦以次就桑鞠衣五條展衣七條褖衣九條以授蠶母還蠶室切之授世婦灑一簿預桑者並復本位后乃降壇還便殿改服設勞酒班賚而還後周制皇后乘翠輅率三妃三御媛御婉三公夫人三孤內子至蠶所以一太牢親祭進奠先蠶西陵氏神禮畢降壇昭化嬪亞獻淑嬪終獻因以公桑焉隋制於宮北三里為壇高四尺季春上巳皇后服鞠衣乘重翟率三夫人九嬪內外命婦以一太牢制幣祭先蠶於壇上用一獻禮祭訖就桑位於壇南東面尚功進金鉤典制奉筐皇后採三條反鉤命婦各依班採五條九條而止世婦亦有蠶母受切桑灑訖還依位皇后乃還宮自後齊後周及隋其典大抵多依晉儀然亦時有損益矣禮仲春以玄鳥至之日用太牢祀于高禖漢武帝年二十九乃得太子甚喜為立禖祠於城南祀以特牲因有其祀晉惠帝元康六年禖壇石中破為二詔問石毀今應復不博士議禮無高禖置石之文未知造設所由既已毀破可無改造更下西府博議而賊曹屬束議以石在壇上蓋主道也祭器弊則埋而置新今宜埋而更造不宜遂廢時此議不用後得高堂隆故事魏青龍中造立此石詔更鐫石令如舊置高禖壇上埋破石入地一丈案梁太廟北門內道西有石文如竹葉小屋覆之宋元嘉中修廟所得陸澄以為孝武時郊禖之石然則江左亦有此禮矣後齊高禖為壇於南郊傍廣輪二十六尺高九尺四陛三壝每歲春分玄鳥至之日皇帝親帥六宮祀青帝於壇以太昊配而祀高禖之神以祈子其儀青帝北方南向配帝東方西向禖神壇下東陛之南西向禮用青珪束帛牲共以一太牢祀日皇帝服兗冕乘玉輅皇后服褘衣乘重翟皇帝初獻降自東陛皇后亞獻降自西陛並詣便坐夫人終獻上嬪獻于禖神訖帝及后並詣欑位乃送神皇帝皇后及羣官皆拜乃撤就燎禮畢而還隋制亦以玄鳥至之日祀高禖於南郊壇牲用太牢一舊禮祀司中司命風師雨師之法皆隨其類而祭之兆風師於西方者就秋風之勁而不從箕星之位兆司中司命於南郊以天神是陽故兆於南郊也兆雨師於北郊者就水位在北也隋制於國城西北十里亥地為司中司命司祿三壇同壝祀以立冬後亥國城東北七里通化門外為風師壇祀以立春後丑國城西南八里金光門外為雨師壇祀以立夏後申壇皆三尺牲並以一少牢昔伊耆氏始為蜡蜡者索也古之君子使人必報之故周法以歲十二月合聚萬物而索饗之仁之至義之盡也其祭法四方各自祭之若不成之方則闕而不祭後周亦存其典常以十一月祭神農氏伊耆氏后稷氏田畯鱗羽臝毛介水墉坊郵表畷獸猫之神於五郊五方上帝地祇五星列宿蒼龍朱雀白獸玄武五人帝五官之神岳鎮海瀆山林川澤丘陵墳衍原隰各分其方合祭之日月五方皆祭之上帝地祇神農伊耆人帝於壇上南郊則以神農既蜡無其祀三辰七宿則為小壇於其側岳鎮海瀆山林川澤丘陵墳衍原隰則各為坎餘則於平地皇帝初獻上帝地祇神農伊耆及人帝冢宰亞獻宗伯終獻上大夫獻三辰五官后稷田畯岳鎮海瀆中大夫獻七宿山林川澤已下自天帝人帝田畯羽毛之類牲幣玉帛皆從燎地祇郵表畷之類皆從埋祭畢皇帝如南郊便殿致齋明日乃蜡祭于南郊如東郊儀祭訖又如黃郊便殿致齋明日乃祭祭訖又如西郊便殿明日乃祭祭訖又如北郊便殿明日蜡祭訖還宮隋初因周制定令亦以孟冬下亥蜡百神臘宗廟祭社稷其方不熟則闕其方之蜡焉又以仲冬祭名源川澤於北郊用一太牢祭井於社宮用一少牢季冬藏冰仲春開冰並用黑牡秬黍於冰室祭司寒神開冰加以桃弧棘矢開皇四年十一月詔曰古稱臘者接也取新故交接前周歲首今之仲冬建冬之月稱蜡可也後周用夏后之時行姬氏之蜡考諸先代於義有違其十月行蜡者停可以十二月為臘於是始革前制後齊正月晦日中書舍人奏祓除年暮上臺東宮奏擇吉日詣殿堂貴臣與師行事所須皆移尚書省備設云後主末年祭非其鬼至於躬自鼓以事胡天鄴中遂多淫祀茲風至今不絕後周欲招來西域又有拜胡天制皇帝親焉其儀並從夷俗淫僻不可紀也

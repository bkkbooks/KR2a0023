body:
  text: 隋書卷四十六列傳第十一趙煚趙煚字賢通天水西人也祖超宗魏河東太守父仲懿尚書左丞煚少孤養母至孝年十四有人盜伐其父墓中樹者煚對之號慟因執送官見魏右僕射周惠達長揖不拜自述孤苦涕泗交集惠達為之隕涕歎息者久之及長深沉有器局略涉書史周太祖引為相府參軍事尋從破洛陽及太祖班師煚請留撫納亡叛太祖從之煚於是帥所領與齊人前後五戰斬郡守鎮將縣令五人虜獲甚衆以功封平定縣男邑三百戶纍轉中書侍郎閔帝受禪遷陝州刺史蠻酋向天王聚衆作亂以兵攻信陵秭歸煚勒所部五百人出其不意襲擊破之二郡獲全時周人於江南岸置安蜀城以禦陳屬霖雨數旬城頽者百餘步蠻酋鄭南鄉叛引陳將吳明徹欲掩安蜀議者皆勸煚益修守禦煚曰不然吾自有以安之乃遣使說誘江外生蠻向武陽令乘虛掩襲所居獲其南鄉父母妻子南鄉聞之其黨各散陳兵遂退明年吳明徹屢為寇患煚勒兵禦之前後十六戰每挫其鋒獲陳裨將覃冏王足子吳朗等三人斬首百六十級以功授開府儀同三司遷荊州總管長史入為民部中大夫武帝出兵鞏洛欲收齊河南之地煚諫曰河南洛陽四面受敵縱得之不可以守請從河北直指太原傾其巢穴可一舉以定帝不納師竟無功尋從上柱國于翼率衆數萬自三鴉道以伐陳克陳十九城而還以讒毀功不見録除益州總管長史未幾入為天官司會纍遷御正上大夫煚與宗伯斛斯徵素不協徵後出為齊州刺史坐事下獄自知罪重遂踰獄而走帝大怒購之甚急煚上密奏曰徵自以負罪深重懼死遁逃若不北竄胸奴則南投吳越徵雖愚陋久歷清顯奔彼敵國無益聖朝今者炎旱為災可因茲大赦帝從之徵賴而獲免煚卒不言高祖為丞相加上開府復拜天官都司會俄遷大宗伯及踐阼煚授璽紱進位大將軍賜爵金城郡公邑二千五百戶拜相州刺史朝廷以煚曉習故事徵拜尚書右僕射視事未幾以忤旨尋出為陝州刺史俄轉冀州刺史甚有威德煚嘗有疾百姓奔馳爭為祈禱其得民情如此冀州俗薄市井多姦詐煚為銅斗鐵尺置之於肆百姓便之上聞而嘉焉頒告天下以為常法嘗有人盜煚田中蒿者為吏所執煚曰此乃刺史不能宣風化彼何罪也慰諭而遣之令人載蒿一車以賜盜者盜者愧恧過於重刑其以德化民皆此類也上幸洛陽煚來朝上勞之曰冀州大藩民用殷實卿之為政深副朕懷開皇十九年卒時年六十八子義臣嗣官至太子洗馬後同楊諒反誅趙芬趙芬字士茂天水西人也父演周秦州刺史芬少有辨智頗涉經史周太祖引為相府鎧曹參軍歷記室纍遷熊州刺史撫納降附得二千戶加開府儀同三司大冢宰宇文護召為中外府掾俄遷吏部下大夫芬性強濟所居之職皆有聲績武帝親總萬機拜內史下大夫轉少御正芬明習故事每朝廷有所疑議衆不能決者芬輒為評斷莫不稱善後為司會申國公李穆之討齊也引為行軍長史封淮安縣男邑五百戶復出為淅州刺史轉東京小宗伯鎮洛陽高祖為丞相尉迥與司馬消難陰謀往來芬察知之密白高祖由是深見親委遷東京左僕射進爵郡公開皇初罷東京官拜尚書左僕射與郢國公王誼修律令俄兼內史令上甚信任之未幾以老病出拜蒲州刺史加金紫光祿大夫仍領關東運漕賜錢百萬粟五千石而遣之後數年上表乞骸骨徵還京師賜以二馬軺車几杖被褥歸于家皇太子又致巾帔後數年卒上遣使致祭鴻臚監護喪事子元恪嗣官至揚州總管司馬左遷候衛長史少子元楷與元恪皆明幹世事元楷大業中為歷陽郡丞與廬江郡丞徐仲宗皆竭百姓之産以貢于帝仲宗遷南郡丞元楷超拜江都郡丞兼領江都宮使楊尚希楊尚希弘農人也祖真魏天水太守父承賓商直淅三州刺史尚希齠而孤年十一辭母請受業長安涿郡盧辨見而異之令入太學專精不倦同輩皆共推伏周太祖嘗親臨釋奠尚希時年十八令講孝經詞旨可觀太祖奇之賜姓普六茹氏擢為國子博士纍轉舍人仕明武世歷太學博士太子宮尹計部中大夫賜爵高都縣侯東京司憲中大夫宣帝時令尚希撫慰山東河北至相州而帝崩與相州總管尉迥發喪於館尚希出謂左右曰蜀公哭不哀而視不安將有他計吾不去將及於難遂夜中從捷徑而遁遲明迥方覺分數十騎自驛路追之不及遂歸京師高祖以尚希宗室之望又背迥而至待之甚厚及迥屯兵武陟遣尚希督宗室兵三千人鎮潼關尋授司會中大夫高祖受禪拜度支尚書進爵為公歲餘出為河南道行臺兵部尚書加銀青光祿大夫尚希時見天下州郡過多上表曰自秦並天下罷侯置守漢魏及晉邦邑屢改竊見當今郡縣倍多於古或地無百里數縣並置或戶不滿千二郡分領具僚以衆資費日多吏卒人倍租調歲減清幹良才百分無一動須數萬如何可覓所謂民少官多十羊九牧琴有更張之義瑟無膠柱之理今存要去間並小為大國家則不虧粟帛選舉則易得賢才敢陳管見伏聽裁處帝覽而嘉之於是遂罷天下諸郡尋拜瀛州刺史未之官奉詔巡省淮南還除兵部尚書俄轉禮部尚書授上儀同尚希性弘厚兼以學業自通甚有雅望為朝廷所重上時每旦臨朝日側不倦尚希諫曰周文王以憂勤損壽武王以安樂延年願陛下舉大綱責成宰輔繁碎之務非人主所宜親也上歡然曰公愛我者尚希素有足疾上謂之曰蒲州出美酒足堪養病屈公臥治之於是出拜蒲州刺史仍領本州宗團驃騎尚希在州甚有惠政復引瀵水立隄防開稻田數千頃民賴其利開皇十年卒官時年五十七諡曰平子旻嗣後改封丹水縣公官至安定郡丞長孫平長孫平字處均河南洛陽人也父儉周柱國平美容儀有器幹頗覽書記仕周釋褐衛王侍讀時武帝逼於宇文護謀與衛王誅之王前後常使平往來通意於帝及護伏誅拜開府樂部大夫宣帝即位置東京官屬以平為小司寇與小宗伯趙芬分掌六府高祖龍潛時與平情好款洽及為丞相恩禮彌厚尉迥王謙司馬消難並稱兵內侮高祖深以淮南為意時賀若弼鎮壽陽恐其懷二心遣平馳驛往代之弼果不從平麾壯士執弼送于京師開皇三年徵拜度支尚書平見天下州縣多罹水旱百姓不給奏令民間每秋家出粟麥一石已下貧富差等儲之閭巷以備凶年名曰義倉因上書曰臣聞國以民為本民以食為命勸農重穀先王令軌古者三年耕而餘一年之積九年作而有三年之儲雖水旱為災而民無菜色皆由勸導有方蓄積先備者也去年亢陽關右饑餒陛下運山東之粟置常平之官開發倉廩普加賑賜大德鴻恩可謂至矣然經國之道義資遠算請勒諸州刺史縣令以勤農積穀為務上深嘉納自是州里豐衍民多賴焉後數載轉工部尚書名為稱職時有人告大都督邴紹非毀朝廷為憒憒者上怒將斬之平進諫曰川澤納污所以成其深山嶽藏疾所以就其大臣不勝至願願陛下弘山海之量茂寬裕之德鄙諺曰不癡不聾未堪作大家翁此言雖小可以喻大邴紹之言不應聞奏陛下又復誅之臣恐百代之後有虧聖德上於是赦紹因勑羣臣誹謗之罪勿復以聞其後突厥達頭可汗與都藍可汗相攻各遣使請援上使平持節宣諭令其和解賜縑三百匹良馬一匹而遣之平至突厥所為陳利害遂各解兵可汗贈平馬二百匹及還平進所得馬上盡以賜之未幾遇譴以尚書檢校汴州事歲餘除汴州刺史其後歷許貝二州俱有善政鄴都俗薄舊號難治前後刺史多不稱職朝廷以平所在善稱轉相州刺史甚有能名在州數年會正月十五日百姓大戲畫衣裳為鍪甲之象上怒而免之俄而念平鎮淮南時事進位大將軍拜太常卿判吏部尚書事仁壽中卒官諡曰康子師孝性輕狡好利數犯法上以其不克負荷遣使弔平國官師孝後為渤海郡主簿屬大業之季政教陵遲師孝恣行貪濁一郡苦之後為王世充所害元暉元暉字叔平河南洛陽人也祖琛魏朔二州刺史父翌尚書左僕射暉鬚眉如畫進止可觀頗好學涉獵書記少得美名於京下周太祖見而禮之命與諸子遊處每同席共硯情契甚厚弱冠召補相府中兵參軍尋遷武伯下大夫于時突厥屢為寇患朝廷將結和親令暉齎錦綵十萬使于突厥暉說以利害申國厚禮可汗大悅遣其名王隨獻方物俄拜儀同三司賓部下大夫保定初大冢宰宇文護引為長史會齊人來結盟好以暉多才辨與千乘公崔睦俱使于齊遷振威中大夫武帝之娉突厥后也令暉致禮焉加開府轉司憲大夫及平關東使暉安集河北封義寧子邑四百戶高祖總百揆加上開府進爵為公開皇初拜都官尚書兼領太僕奏請決杜陽水灌三畤原溉舄鹵之地數千頃民賴其利明年轉左武候將軍太僕卿如故尋轉兵部尚書監漕渠之役未幾坐事免頃之拜魏州刺史頗有惠政在任數年以疾去職歲餘卒于京師時年六十上嗟悼久之勑鴻臚監護喪事諡曰元子肅嗣官至光祿少卿肅弟仁器性明敏官至日南郡丞韋師韋師字公穎京兆杜陵人也父瑱周驃騎大將軍師少沉謹有至性初就學始讀孝經捨書而歎曰名教之極其在茲乎少丁父母憂居喪盡禮州里稱其孝行及長略涉經史尤工騎射周大冢宰宇文護引為中外府記室轉賓曹參軍師雅知諸蕃風俗及山川險易其有夷狄朝貢師必接對論其國俗如視諸掌夷人驚服無敢隱情齊王憲為雍州牧引為主簿本官如故及武帝親總萬機轉少府大夫及平高氏詔師安撫山東徙為賓部大夫高祖受禪拜吏部侍郎賜爵井陘侯邑五百戶數年遷河北道行臺兵部尚書詔為山東河南十八州安撫大使奏事稱旨賜錢三百萬兼領晉王廣司馬其族人世康為吏部尚書與師素懷勝負于時晉王為雍州牧盛存望第以司空楊雄尚書左僕射高熲並為州都督引師為主簿而世康弟世約為法曹從事世康恚恨不能食又恥世約在師之下召世約數之曰汝何故為從事遂杖之後從上幸醴泉宮上召師與左僕射高熲上柱國韓擒等於臥內賜宴令各舊事以為笑樂平陳之役以本官領元帥掾陳國府藏悉委於師秋毫無所犯稱為清白後上為長寧王儼納其女為妃除汴州刺史甚有治名卒官諡曰定子德政嗣大業中仕至給事郎楊虉楊虉字文殊弘農華陰人也祖鈞魏司空父儉侍中虉美風儀沉深有器局髫就學日誦千言見者奇之九歲丁父憂哀毀過禮殆將滅性及免喪之後絶慶弔閉戶讀書數年之間博涉書記周閔帝時為寧都太守甚有能名賜爵昌樂縣子後數以軍功進為侯高祖作相行濟州事及踐阼拜宗正少卿加上開府蜀王秀之鎮益州也朝廷盛選綱紀以虉方直拜益州總管長史賜錢二十萬縑三百匹馬五十匹而遣之尋遷西南道行臺兵部尚書數載復為宗正少卿未幾擢拜刑部尚書歲餘出除吳州總管甚有能名時晉王廣鎮揚州詔令虉每歲一與王相見評論得失規諷疑闕數載卒官時年六十二子虔遜蘇孝慈兄子沙羅蘇孝慈扶風人也父武周周兗州刺史孝慈少沉謹有器幹美容儀周初為中侍上士後拜都督聘于齊以奉使稱旨遷大都督其年又聘于齊還授宣納上士後從武帝伐齊以功進位開府賜爵文安縣公邑千五百戶尋改封臨水縣公增邑千二百戶纍遷工部上大夫高祖受禪進爵安平郡公拜太府卿于時王業初基百度伊始徵天下工匠纖微之巧無不畢集孝慈總其事世以為能俄遷大司農歲餘拜兵部尚書待遇踰密時皇太子勇頗知時政上欲重宮官之望多令大臣領其職於是拜孝慈為太子右衛率尚書如故明年上於陝州置常平倉轉輸京下以渭水多沙流乍深乍淺漕運者苦之於是決渭水為渠以屬河令孝慈督其役渠成上善之又領太子右庶子轉授左衛率仍判工部民部二尚書稱為幹理數載進位大將軍轉工部尚書率如故先是以百僚供費不足臺省府寺咸置廨錢收息取給孝慈以為官民爭利非興化之道上表請罷之請公卿以下給職田各有差上並嘉納焉開皇十八年將廢太子憚其在東宮出為淅州刺史太子以孝慈去甚不平形於言色其見重如此仁壽初遷洪州總管俱有惠政其後桂林山越相聚為亂詔孝慈為行軍總管擊平之其年卒官有子會昌孝慈兄子沙羅字子粹父順周眉州刺史沙羅仕周釋褐都督後從韋孝寬破尉迥以功授開府儀同三司封通秦縣公開皇初蜀王秀鎮益州沙羅以本官從拜資州刺史八年冉尨羌作亂攻汶山金川二鎮沙羅率兵擊破之授邛州刺史後數載檢校利州總管事從史萬歲擊西爨纍戰有功進位大將軍賜物千段尋檢校益州總管長史會越巂人王奉舉兵作亂沙羅從段文振討平之賜奴婢百口會蜀王秀廢吏案奏沙羅云王奉為奴所殺秀乃詐稱左右斬之又調熟獠令出奴婢沙羅隱而不奏由是除名卒於家有子康李雄李雄字毗盧趙郡高邑人也祖榼魏太中大夫父徽伯齊陝州刺史陷于周雄因隨軍入長安雄少慷慨有大志家世並以學業自通雄獨習騎射其兄子旦讓之曰棄文尚武非士大夫之素業雄答曰竊覽自古誠臣貴仕文武不備而能濟其功業者鮮矣雄雖不敏頗觀前志但不守章句耳既文且武兄何病焉子旦無以應之周太祖時釋褐輔國將軍從達奚武平漢中定興州又討汾州叛胡録前後功拜驃騎大將軍儀同三司閔帝受禪進爵為公遷小賓部其後復從達奚武與齊人戰於芒山諸軍大敗雄所領獨全武帝時從陳王純迎后於突厥進爵奚伯拜硤州刺史數歲徵為本府中大夫尋出為涼州總管長史從滕王逌破吐谷渾於青海以功加上儀同宣帝嗣位從行軍總管韋孝寬略定淮南雄以輕騎數百至硤石說下十餘城拜豪州刺史高祖總百揆徵為司會中大夫以淮南之功加位上開府及受禪拜鴻臚卿進爵高都郡公食邑二千戶後數年晉王廣出鎮並州以雄為河北行臺兵部尚書上謂雄曰吾兒既少更事未多以卿兼文武才今推誠相委吾無北顧之憂矣雄頓首而言曰陛下不以臣之不肖寄臣以重任臣雖愚固心非木石謹當竭誠效命以答鴻恩歔欷流涕上慰諭而遣之雄當官正直侃然有不可犯之色王甚敬憚吏民稱焉歲餘卒官子公挺嗣張煚劉仁恩郭均馮世基厙狄嶔張煚字士鴻河間鄚人也父羡少好學多所通涉仕魏為蕩難將軍從武帝入關纍遷銀青光祿大夫周太祖引為從事中郎賜姓叱羅氏歷司職大夫雍州治中雍州刺史儀同三司賜爵虞鄉縣公復入為司成中大夫典國史周代公卿類多武將唯羡以素業自通甚為當時所重後以年老致仕于家及高祖受禪欽其德望以書徵之曰朕初臨四海思存政術舊齒名賢實懷勤佇儀同昔在周室德業有聞雖云致仕猶克壯年即宜入朝用副虛想及謁見勑令勿拜扶升殿上降榻執手與之同坐宴語久之賜以几杖會遷都龍首羡上表勸以儉約上優詔答之俄而卒時年八十四贈滄州刺史諡曰定撰老子莊子義名曰道言五十二篇煚好學有父風在魏釋褐奉朝請遷員外侍郎周太祖引為外兵曹閔帝受禪加前將軍明武世歷膳部大夫冢宰司録賜爵北平縣子邑四百戶宣帝時加儀同進爵為伯高祖為丞相煚深自推結高祖以其有幹用甚親遇之及受禪拜尚書右丞進爵為侯俄遷太府少卿領營新都監丞丁父憂去職柴毀骨立未朞起令視事固讓不許授儀同三司襲爵虞鄉縣公增邑通前千五百戶尋遷太府卿拜民部尚書晉王廣為揚州總管授煚司馬加銀青光祿大夫煚性和厚有識度甚有當時之譽後拜冀州刺史晉王廣頻表請之復為晉王長史檢校蔣州事及晉王為皇太子復為冀州刺史進位上開府吏民悅服稱為良二千石仁壽四年卒官時年七十四子慧寶官至絳郡丞開皇時有劉仁恩者不知何許人也倜儻有文武幹用初為毛州刺史治績號天下第一擢拜刑部尚書又以行軍總管從楊素伐陳與素破陳將呂仲肅於荊門仁恩之計居多授上大將軍甚有當時之譽馮翊郭均上黨馮世基並明悟有幹略相繼為兵部尚書代人厙狄嶔性弘厚有局度官至民部尚書此四人俱顯名於當世然事行闕落史莫能詳史臣曰二趙明習故事當世所推及居端右無聞殊績固知人之才器各有分限大小異宜不可踰量長孫平諫赦誹謗之罪可謂仁人之言高祖悅而從之其利亦已博矣元暉以明敏顯達韋師以清白成名楊尚希楊虉宗室之英譽望隆重蘇孝慈李雄張煚內外所履咸稱貞幹並任開皇之初蓋當時之選也

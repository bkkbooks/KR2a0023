body:
  text: 隋書卷三十七列傳第二李穆子渾穆兄子詢詢弟崇崇子敏李穆字顯慶自云隴西成紀人漢騎都尉陵之後也陵沒匈奴子孫代居北狄其後隨魏南遷復歸隴祖斌以都督鎮高平因家焉父文保早卒及穆貴贈司空穆風神警俊倜儻有奇節周太祖首建義旗穆便委質釋褐統軍永熙末奉迎魏武帝授都督封永平縣子邑三百戶又領鄉兵累以軍功進爵為伯從太祖擊齊師於芒山太祖臨陣墮馬穆突圍而進以馬策擊太祖而詈之授以從騎潰圍俱出賊見其輕侮謂太祖非貴人遂緩之以故得免既而與穆相對泣顧謂左右曰成我事者其此人乎即令撫慰關中所至克定擢授武衞將軍儀同三司進封安武郡公增邑一千七百戶賜以鐵券恕其十死尋加開府領侍中初芒山之敗穆以驄馬授太祖太祖於是內驄馬盡以賜之封穆姊妹皆為郡縣君宗從舅氏頒賜各有差轉太僕從于謹破江陵增邑千戶進位大將軍擊曲沔蠻破之授原州刺史拜嫡子惇為儀同三司穆以二兄賢遠並為佐命功臣而子弟布列清顯穆深懼盈滿辭不受拜太祖不許俄遷雍州刺史兼小冢宰周元年增邑三千戶通前三千七百戶又別封一子為升遷伯穆讓兄子孝軌許之宇文護執政穆兄遠及其子植俱被誅穆當從坐先是穆知植非保家之主每勸遠除之遠不能用及遠臨刑泣謂穆曰顯慶吾不用汝言以至於此將復奈何穆以此獲免除名為民及其子弟亦免官植弟淅州刺史基當坐戮穆請以二子代基之命護義而兩釋焉未幾拜開府儀同三司直州刺史復爵安武郡公武成中子弟免官爵者悉復之尋除少保進位大將軍歲餘拜小司徒進位柱國轉大司空奉詔築通洛城天和中進爵申國公持節綏集東境築武申旦郛慈澗崇德安民交城鹿盧等諸鎮建德初拜太保歲餘出為原州總管數年進位上柱國轉幷州總管大象初加邑至九千戶拜大左輔總管如故高祖作相尉迥之作亂也遣使招穆穆鎖其使上其書穆子士榮以穆所居天下精兵處陰勸穆反穆深拒之乃奉十三環金帶於高祖蓋天子之服也穆尋以天命有在密表勸進高祖既受禪下詔曰公既舊德且又父黨敬惠來旨義無有違便以今月十三日恭膺天命俄而穆來朝高祖降坐禮之拜太師贊拜不名真食成安縣三千戶於是穆子孫雖在襁褓悉拜儀同其一門執象笏者百餘人穆之貴盛當時無比穆上表乞骸骨詔曰朕初臨宇內方藉嘉猷養老乞言實懷虛想七十致仕本為常人至若呂尚以期頤佐周張蒼以華皓相漢高才命世不拘禮遲得此心留情規訓公年既耆舊筋力難煩今勒所司敬蠲朝集如有大事須共謀謨別遣侍臣就第詢訪時太史奏云當有移都之事上以初受命甚難之穆上表曰帝王所居隨時興廢天道人事理有存焉始自三皇暨夫兩漢有一世而屢徙無革命而不遷曹馬同洛水之陽魏周共長安之內此之四代蓋聞之矣曹則三家鼎立馬則四海尋分有魏及周甫得平定事乃不暇非曰師古往者周運將窮禍生華裔廟堂冠帶屢覩姦回士有苞藏人稀柱石四海萬國皆縱豺狼不叛不侵百城罕一伏惟陛下膺期誕聖秉籙受圖始晦君人之德俯從將相之重內翦羣兇崇朝大定外誅巨猾不日肅清變大亂之民成太平之俗百靈符命兆庶謳歌幽顯樂推日月填積方屈箕潁之志始順內外之請自受命神宗弘道設教陶冶與陰陽合德覆育共天地齊旨萬物開闢之初八表光華之旦視聽以革風俗且移至若帝室天居未議經創非所謂發明大造光贊惟新自漢已來為喪亂之地爰從近代累葉所都未嘗謀龜問筮瞻星定鼎何以副聖主之規表大隋之德竊以神州之廣福地之多將為皇家興廟建寢上玄之意當別有之伏願遠順天人取決卜筮時改都邑光宅區夏任子來之民垂無窮之業應神宮於辰極順和氣於天壤理康物阜永隆長世臣日薄桑榆位高軒冕經邦論道自顧缺然丹赤所懷無容噤默上素嫌臺城制度迮小又宮內多鬼妖蘇威嘗勸遷上不納遇太史奏狀意乃惑之至是省穆表上曰天道聰明已有徵應太師民望復抗此請則可矣遂從之歲餘下詔曰禮制凡品不拘上智法備小人不防君子太師上柱國申國公器宇弘深風猷遐曠社稷佐命公為稱首位極帥臣才為人傑萬頃不測百鍊彌精乃無伯玉之非豈有顏回之貳故以自居寥廓弗關憲網然王者作教惟旌善人去法弘道示崇年德自今已後雖有愆罪但非謀逆縱有百死終不推問開皇六年薨于第年七十七遺令曰吾荷國恩年宦已極啟足歸泉無所復恨竟不得陪玉鑾於岱宗預金泥於梁甫眷眷光景其在斯乎詔遣黃門侍郎監護喪事賵馬四匹粟麥二千斛布絹一千匹贈使持節冀定趙相瀛毛魏衞洛懷十州諸軍事冀州刺史諡曰明賜以石椁前後部羽葆鼓吹轀輬車百僚送之郭外詔遣太常卿牛弘齎哀冊祭以太牢孫筠嗣筠父惇字士獻穆長子也仕周官至安樂郡公鳳州刺史先穆卒筠幼以穆功拜儀同開皇八年以嫡孫襲爵仁壽初叔父渾忿其吝嗇陰遣兄子善衡賊殺之求盜不獲高祖大怒盡禁其親族初筠與從父弟瞿曇有𨻶時渾有力遂證瞿曇殺之瞿曇竟坐斬而善衡獲免四年議立嗣邳公蘇威奏筠不義骨血相殺請絕其封上不許惇弟怡官至儀同早卒贈渭州刺史怡弟雅少有識量周保定中屢以軍功封西安縣男拜大都督天和中從元定征江西時諸軍失利遂沒於陳後得歸國拜開府儀同三司領左右軍其年從太子西征吐谷渾雅率步騎二千督軍糧於洮河為賊所躡相持數日雅患之遂與偽和虜備稍解縱奇兵擊破之賜奴婢百口封一子為侯後拜齊州刺史俄徵還京數載授瀛州刺史高祖作相鎮靈州以備胡還授大將軍遷荊州總管加邑八百戶開皇初進爵為公雅弟官至鹽州刺史封陽曲侯弟榮官至合州刺史長城縣公榮弟直官至車騎將軍歸政縣侯直弟雄官至柱國密國公驃騎將軍雄弟渾最知名渾字金才穆第十子也姿貌瓌偉美鬚髯起家周左侍上士尉迥反於鄴時穆在幷州高祖慮其為迥所誘遣渾乘驛往布腹心穆遽令渾入京奉熨斗於高祖曰願執威柄以熨安天下也高祖大悅又遣渾詣韋孝寬所而述穆意焉適遇平鄴以功授上儀同三司封安武郡公閏皇初進授象城府驃騎將軍晉王廣出藩渾以驃騎領親信從往揚州仁壽元年從左僕射楊素為行軍總管出夏州北三百里破突厥阿勿俟斤於納遠川斬首五百級進位大將軍拜左武衞將軍領太子宗衞率初穆孫筠卒高祖議立嗣渾規欲紹之謂其妻兄太子左衞率宇文述曰若得襲封當以國賦之半每歲奉公述利之因入白皇太子曰立嗣以長不則以賢今申明公嗣絕徧觀其子孫皆無賴不足以當榮寵唯金才有勳於國謂非此人無可以襲封者太子許之竟奏高祖封渾為申國公以奉穆嗣大業初轉右驍衞將軍六年有詔追改穆封為郕國公渾仍襲焉累加光祿大夫九年遷右驍衞大將軍渾既紹父業日增豪侈後房曳羅綺者以百數二歲之後不以俸物與述述大恚之因醉廼謂其友人于象賢曰我竟為金才所賣死且不忘渾亦知其言由是結𨻶後帝討遼東有方士安伽陀自言曉圖讖謂帝曰當有李氏應為天子勸盡誅海內凡姓李者述知之因誣構渾於帝曰伽陀之言信有徵矣臣與金才夙親聞其情趣大異常日數共李敏善衡等日夜屏語或終夕不寐渾大臣也家代隆盛身捉禁兵不宜如此願陛下察之帝曰公言是矣可覔其事述乃遣武賁郎將裴仁基表告渾反即日發宿衞千餘人付述掩渾等家遣左丞元文都御史大夫裴蘊雜治之案問數日不得其反狀以實奏聞帝不納更遣述窮治之述入獄中召出敏妻宇文氏謂之曰夫人帝甥也何患無賢夫李敏金才名當妖讖國家殺之無可救也夫人當自求全若相用語身當不坐敏妻曰不知所出惟尊長教之述曰可言李家謀反金才嘗告敏云汝應圖籙當為天子今主上好兵勞擾百姓此亦天亡隋時也正當共汝取之若復渡遼吾與汝必為大將每軍二萬餘兵固以五萬人矣又發諸房子姪內外親婭並募從征吾家子弟決為主帥分領兵馬散在諸軍伺候間隙首尾相應吾與汝前發襲取御營子弟響起各殺軍將一日之間天下足定矣述口自傳授令敏妻寫表封云上密述持入奏之曰已得金才反狀幷有敏妻密表帝覽之泣曰吾宗社幾傾賴親家公而獲全耳於是誅渾敏等宗族三十二人自餘無少長皆徙嶺外渾從父兄威開皇初以平蠻功官至上柱國黎國公詢字孝詢父賢周大將車詢沉深有大略頗涉書記仕周納言上士俄轉內史上士兼掌吏部以幹濟聞建德三年武帝幸雲陽宮拜司衞上士委以留府事周衞王直作亂焚肅章門詢於內益火故賊不得入帝聞而善之拜儀同三司遷長安令累遷英果中大夫屢以軍功加位大將軍賜爵平高郡公高祖為丞相尉迥作亂遣韋孝寬擊之以詢為元帥長史委以心膂軍至永橋諸將不一詢密啟高祖請重臣監護高祖遂令高熲監軍與熲同心協力唯詢而已及平尉迥進位上柱國改封隴西郡公賜帛千匹加以口馬開皇元年引杜陽水灌三畤原詢督其役民賴其利尋檢校襄州總管事歲餘拜隰州總管數年以疾徵還京師中使顧問不絕卒於家時年四十九上悼惜者久之諡曰襄有子元方嗣崇字永隆英果有籌算膽力過人周元年以父賢勳封廻樂縣侯時年尚小拜爵之日親族相賀崇獨泣下賢怪而問之對曰無勳於國而幼少封侯當報主恩不得終於孝養是以悲耳賢由此大奇之起家州主簿非其所好辭不就官求為將兵都督隨宇文護伐齊以功最擢授儀同三司尋除小司金大夫治軍器監建德初遷少侍伯大夫轉少承御大夫攝太子宮正周武帝平齊引參謀議以勳加授開府封襄陽縣公邑一千戶尋改封廣宗縣公轉太府中大夫歷工部中大夫遷右司馭高祖為丞相遷左司武上大夫加授上開府儀同大將軍尋為懷州刺史進爵郡公加邑至二千戶尉迥反遣使招之崇初欲相應後知叔父穆以幷州附高祖慨然太息曰合家富貴者數十人值國有難竟不能扶傾繼絕復何面目處天地間乎韋孝寬亦疑之與俱臥起其兄詢時為元帥長史每諷諭之崇由是亦歸心焉及破尉惇拜大將軍既平尉迥授徐州總管尋進位上柱國開皇三年除幽州總管突厥犯塞崇輒破之奚霫契丹等懾其威略爭來內附其後突厥大為寇掠崇率步騎三千拒之轉戰十餘日師人多死遂保於砂城突厥圍之城本荒廢不可守禦曉夕力戰又無所食每夜出掠賊營復得六畜以繼軍糧突厥畏之厚為其備每夜中結陣以待之崇軍苦飢出輒遇敵死亡略盡遲明奔還城者尚且百許人然多傷重不堪更戰突厥意欲降之遣使謂崇曰若來降者封為特勤崇知必不免令其士卒曰崇喪師徒罪當死今日効命以謝國家待看吾死且可降賊方便散走努力還鄉若見至尊道崇此意乃挺刃突賊復殺二人賊亂射之卒于陣年四十八贈豫鄎申永澮亳六州諸軍事豫州刺史諡曰壯子敏嗣敏字樹生高祖以其父死王事養宮中者久之及長襲爵廣宗公起家左千牛美姿儀善騎射歌舞管絃無不通解開皇初周宣帝后封樂平公主有女娥英妙擇婚對勑貴公子弟集弘聖宮者日以百數公主親在帷中並令自序幷試技藝選不中者輒引出之至敏而合意竟為姻媾敏假一品羽儀禮如尚帝之女後將侍宴公主謂敏曰我以四海與至尊唯一女夫當為汝求柱國若授餘官汝慎無謝及進見上上親御琵琶遣敏歌舞既而大悅謂公主曰李敏何官對曰一白丁耳上因謂敏曰今授汝儀同敏不答上曰不滿爾意邪今授汝開府敏又不謝上曰公主有大功於我我何得向其女婿而惜官乎今授卿柱國敏廼拜而蹈舞遂於坐發詔授柱國以本官宿衞後避諱改封經城縣公邑一千戶歷蒲豳金華敷州刺史多不莅職常留京師往來宮內侍從遊宴賞賜超於功臣後幸仁壽宮以為岐州刺史大業初轉衞尉卿樂平公主之將薨也遺言於煬帝曰妾無子息唯有一女不自憂死但深憐之今湯沐邑乞廻與敏帝從之竟食五千戶攝屯衞將軍楊玄感反後城大興敏之策也轉將作監從征高麗領新城道軍將加光祿大夫十年帝復征遼東遣敏於黎陽督運時或言敏一名洪兒帝疑洪字當讖嘗面告之冀其引決敏由是大懼數與金才善衡等屏人私語宇文述知而奏之竟與渾同誅年三十九其妻宇文氏後數月亦賜鴆而終梁睿梁睿字恃德安定烏氏人也父禦西魏太尉睿少沉敏有行檢周太祖時以功臣子養宮中者數年其後命諸子與睿遊處同師共業情契甚歡七歲襲爵廣平郡公累加儀同三司邑五百戶尋為本州大中正魏恭帝時加開府改封為五龍郡公拜渭州刺史周閔帝受禪徵為御伯未幾出為中州刺史鎮新安以備齊齊人來寇睿輒挫之帝甚嘉歎拜大將軍進爵蔣國公入為司會後從齊王憲拒齊將斛律明月於洛陽每戰有功遷小冢宰武帝時歷敷州刺史涼安二州總管俱有惠政進位柱國高祖總百揆代王謙為益州總管行至漢川而謙反遣兵攻始州睿不得進高祖命睿為行軍元帥率行軍總管于義張威達奚長儒梁昇石孝義步騎二十萬討之時謙遣開府李三王等守通谷睿使張威擊破之擒數千人進至龍門謙將趙儼秦會擁衆十萬據嶮為營周亘三十里睿令將士銜枚出自間道四面奮擊力戰破之蜀人大駭睿鼓行而進謙將敬豪守劍閣梁巖拒平林並懼而來降謙又令高阿那肱達奚惎等以盛兵攻利州聞睿將至惎分兵據開遠睿顧謂將士曰此虜據要欲遏吾兵勢吾當出其不意破之必矣遣上開府拓拔宗趣劍閣大將軍宇文敻詣巴西大將軍趙達水軍入嘉陵睿遣張威王倫賀若震于義韓相貴阿那惠等分道攻惎自午及申破之惎奔歸于謙睿進逼成都謙令達奚惎乙弗虔城守親率精兵五萬背城結陣睿擊之謙不利將入城惎虔以城降拒謙不內謙將麾下三十騎遁走新都令王寶執之睿斬謙于市劍南悉平進位上柱國總管如故賜物五千段奴婢一千口金二千兩銀三千兩食邑千戶睿時威振西川夷獠歸附唯南寧酋帥爨震恃遠不賓睿上疏曰竊以遠撫長駕王者令圖易俗移風有國典南寧州漢世柯之地近代已來分置興古雲南建寧朱提四郡戶口殷衆金寶富饒二河有駿馬明珠益寧出鹽井犀角晉太始七年以益州曠遠分置寧州至偽梁南寧州刺史徐文盛被湘東徵赴荊州屬東夏尚阻未遑遠略土民爨瓚遂竊據一方國家遙授刺史其子震相承至今而震臣禮多虧貢賦不入每年奉獻不過數十匹馬其處去益路止一千朱提北境即與戎州接界如聞彼人苦其苛政思被皇風伏惟大丞相匡贊聖朝寧濟區宇絕後光前方垂萬代闢土服遠今正其時幸因平蜀士衆不煩重興師旅押獠既訖即請略定南寧自盧戎已來軍糧須給過此即於蠻夷徵稅以供兵馬其寧州朱提雲南西爨並置總管州鎮計彼熟蠻租調足供城防倉儲一則以肅蠻夷二則裨益軍國今謹件南寧州郡縣及事意如別有大都督杜神敬昔曾使彼具所諳練今幷送往書未答又請曰竊以柔遠能邇著自前經拓土開疆王者所務南寧州漢代柯之郡其地沃壤多是漢人既饒寶物又出名馬今若往取仍置州郡一則遠振威名二則有益軍國其處與交廣相接路乃非遙漢代開此本為討越之計伐陳之日復是一機以此商量決謂須取高祖深納之然以天下初定恐民心不安故未之許後竟遣史萬歲討平之並因睿之策也睿威惠兼著民夷悅服聲望逾重高祖陰憚之薛道衡從軍在蜀因入接宴說睿曰天下之望已歸于隋密令勸進高祖大悅及受禪顧待彌隆睿復上平陳之策上善之下詔曰公英風震動妙算縱橫清蕩江南宛然可見循環三復但以欣然公既上才若管戎律一舉大定固在不疑但朕初臨天下政道未洽恐先窮武事未為盡善昔公孫述隗囂漢之賊也光武與其通和稱為皇帝尉佗之於高祖初猶不臣孫晧之答晉文書尚云白或尋款服或即滅亡王者體大義存遵養雖陳國來朝未盡藩節如公大略誠須責罪尚欲且緩其誅宜知此意淮海未滅必興師旅若命水襲終當相屈想以身許國無足致辭也睿乃止焉睿時見突厥方強恐為邊患復陳鎮守之策十餘事上書奏之曰竊以戎狄作患其來久矣防遏之道自古為難所以周無上算漢收下策以其倏來忽往雲屯霧散強則騁其犯塞弱又不可盡除故也今皇祚肇興宇內寧一唯有突厥種類尚為邊梗此臣所以廢寢與食寤寐思之昔匈奴未平去病辭宅先零尚在充國自劾臣才非古烈而志追昔士謹件安置北邊城鎮烽候及人馬糧貯戰守事意如別謹幷圖上呈伏惟裁覽上嘉歎久之答以厚意睿時自以周代舊臣久居重鎮內不自安屢請入朝於是徵還京師及引見上為之興命睿上殿握手極歡睿退謂所親曰功遂身退今其時也遂謝病於家闔門自守不交當代上賜以版輿每有朝覲必令三衞輿上殿睿初平王謙之始自以威名太盛恐為時所忌遂大受金賄以自穢由是勳簿多不以實詣朝堂稱屈者前後百數上令有司案驗其事主者多獲罪睿惶懼上表陳謝請歸大理上慰諭遣之十五年從上至洛陽而卒時年六十五諡曰襄子洋嗣官歷嵩徐二州刺史武賁郎將大業六年詔追改封睿為戴公命以洋襲焉史臣曰李穆梁睿皆周室功臣高祖王業初基俱受腹心之寄故穆首登師傅睿終膺殊寵觀其見機而動抑亦民之先覺然方魏朝之貞烈有愧王陵比晉室之忠臣終慚徐廣穆之子孫特為隆盛朱輪華轂凡數十人見忌當時禍難遄及得之非道可不戒歟

body:
  text: 隋書卷五十二列傳第十七韓擒虎弟僧壽洪韓擒字子通河南東垣人也後家新安父雄以武烈知名仕周官至大將軍洛虞等八州刺史擒少慷慨以膽略見稱容貌魁岸有雄傑之表性又好書經史百家皆略知大旨周太祖見而異之令與諸子遊集後以軍功拜都督新安太守稍遷儀同三司襲爵新義郡公武帝伐齊齊將獨孤永業守金墉城擒説下之進平范陽加上儀同拜永州刺史陳人逼光州擒以行軍總管擊破之又從宇文欣平合州高祖作相遷和州刺史陳將甄慶任蠻奴蕭摩訶等共為聲援頻寇江北前後入界擒屢挫其鋒陳人奪氣開皇初高祖潛有吞並江南之志以擒有文武才用夙著聲名於是拜為廬州總管委以平陳之任甚為敵人所憚及大舉伐陳以擒為先鋒擒率五百人宵濟襲採石守者皆醉擒遂取之進攻姑熟半日而拔次於新林江南父老素聞其威信來謁軍門晝夜不絶陳人大駭其將樊巡魯世真田瑞等相繼降之晉王廣上狀高祖聞而大悅宴賜羣臣晉王遣行軍總管杜彥與擒合軍步騎二萬陳叔寶遣領軍蔡徵守朱雀航聞擒將至衆懼而潰任蠻奴為賀若弼所敗棄軍降於擒擒以精騎五百直入朱雀門陳人欲戰蠻奴撝之曰老夫尚降諸君何事衆皆散走遂平金陵執陳主叔寶時賀若弼亦有功乃下詔於晉王曰此二公者深謀大略東南逋寇朕本委之靜地恤民悉如朕意九州不一已數百年以名臣之功成太平之業天下盛事何用過此聞以欣然實深慶快平定江表二人之力也賜物萬段又下優詔於擒弼曰申國威於萬里宣朝化於一隅使東南之民俱出湯火數百年寇旬日廓清專是公之功也高名塞於宇宙盛業光於天壤逖聽前古罕聞其匹班師凱入誠知非遠相思之甚寸陰若歲及至京弼與擒爭功於上前弼曰臣在蔣山死戰破其鋭卒擒其驍將震揚威武遂平陳國韓擒略不交陳豈臣之比擒曰本奉明旨令臣與弼同時合勢以取偽都弼乃敢先期逢賊遂戰致令將士傷死甚多臣以輕騎五百兵不血刃直取金陵降任蠻奴執陳叔寶據其府庫傾其巢穴弼至夕方扣北掖門臣啓關而納之斯乃救罪不暇安得與臣相比上曰二將俱合上勳於是進位上柱國賜物八千段有司劾擒放縱士卒淫污陳宮坐此不加爵邑先是江東有謠歌曰黃斑青瀐馬發自壽陽涘來時冬氣末去日春風始皆不知所謂擒本名豹平陳之際又乘青瀐馬往反時節與歌相應至是方悟其後突厥來朝上謂之曰汝聞江南有陳國天子乎對曰聞之上命左右引突厥詣擒前曰此是執得陳國天子者擒厲然顧之突厥惶恐不敢仰視其有威容如此別封壽光縣公食邑千戶以行軍總管屯金城禦備胡寇即拜涼州總管俄徵還京上宴之內殿恩禮殊厚無何其鄰母見擒門下儀衛甚盛有同王者母異而問之其中人曰我來迎王忽然不見又有人疾篤忽驚走至擒家曰我欲謁王左右問曰何王也答曰閻羅王擒子弟欲撻之擒止之曰生為上柱國死作閻羅王斯亦足矣因寢疾數日竟卒時年五十五子世諤嗣世諤倜儻驍捷有父風楊玄感之作亂也引世諤為將每戰先登及玄感敗為吏所拘時帝在高陽送詣行所世諤日令守者市酒殽以酣暢揚言曰吾死在朝夕不醉何為漸以酒進守者守者狎之遂飲令致醉世諤因得逃奔山賊不知所終僧壽字玄慶擒母弟也亦以勇烈知名周武帝時為侍伯中旅下大夫高祖得政從韋孝寬平尉迥每戰有功授大將軍封昌樂公邑千戶開皇初拜安州刺史時擒為廬州總管朝廷不欲同在淮南轉為熊州刺史後轉蔚州刺史進爵廣陵郡公尋以行軍總管擊突厥於雞頭山破之後坐事免數歲復拜蔚州刺史突厥甚憚之十七年屯蘭州以備胡明年遼東之役領行軍總管還檢校靈州總管事從楊素擊突厥破之進位上柱國改封江都郡公煬帝即位又改封新蔡郡公自是之後不復任用大業五年從幸太原有京兆人達奚通妾王氏能清歌朝臣多相會觀之僧壽亦豫焉坐是除名尋令復位八年卒於京師時年六十五有子孝基洪字叔明擒季弟也少驍勇善射膂力過人仕周侍伯上士後以軍功拜大都督高祖為丞相從韋孝寬破尉迥於相州加上開府甘棠縣侯邑八百戶高祖受禪進爵為公尋授驃騎將軍開皇九年平陳之役授行軍總管及陳平晉王廣大獵於蔣山有猛獸在圍中衆皆懼洪馳馬射之應弦而倒陳氏諸將列觀於側莫不歎伏焉王大喜賜縑百匹尋以功加柱國拜蔣州刺史數歲轉廉州刺史時突厥屢為邊患朝廷以洪驍勇檢校朔州總管事尋拜代州總管仁壽元年突厥達頭可汗犯塞洪率蔚州刺史劉隆大將軍李藥王拒之遇虜於安衆寡不敵洪四面搏戰身被重創將士沮氣虜悉衆圍之矢下如雨洪偽與虜和圍少解洪率所領潰圍而出死者大半殺虜亦倍洪及藥王除名為民隆竟坐死煬帝北巡至安見白骨被野以問侍臣侍臣曰往者韓洪與虜戰處也帝憫然傷之收葬骸骨命五郡沙門為設佛供拜洪隴西太守未幾朱崖民王萬昌作亂詔洪擊平之以功加位金紫光祿大夫領郡如故俄而萬昌弟仲通復叛又詔洪討平之師未旋遇疾而卒時年六十三賀若弼賀若弼字輔伯河南洛陽人也父敦以武烈知名仕周為金州總管宇文護忌而害之臨刑呼弼謂之曰吾必欲平江南然此心不果汝當成吾志且吾以舌死汝不可不思因引錐刺弼舌出血誡以慎口弼少慷慨有大志驍勇便弓馬解屬文博涉書記有重名於當世周齊王憲聞而敬之引為記室未幾封當亭縣公遷小內史周武帝時上柱國烏丸軌言於帝曰太子非帝王器臣亦嘗與賀若弼論之帝呼弼問之弼知太子不可動搖恐禍及己詭對曰皇太子德業日新未覩其闕帝默然弼既退軌讓其背己弼曰君不密則失臣臣不密則失身所以不敢輕議也及宣帝嗣位軌竟見誅弼乃獲免尋與韋孝寬伐陳攻拔數十城弼計居多拜壽州刺史改封襄邑縣公高祖為丞相尉迥作亂鄴城恐弼為變遣長孫平馳驛代之高祖受禪陰有並江南之志訪可任者高熲曰朝臣之內文武才幹無若賀若弼者高祖曰公得之矣於是拜弼為吳州總管委以平陳之事弼欣然以為己任與壽州總管源雄並為重鎮弼遺雄詩曰交河驃騎幕合浦伏波營勿使騏驎上無我二人名獻取陳十策上稱善賜以寶刀開皇九年大舉伐陳以弼為行軍總管將渡江酹酒而呪曰弼親承廟略遠振國威伐罪弔民除凶翦暴上天長江鑒其若此如使褔善禍淫大軍利涉如事有乖違得葬江魚腹中死且不恨先是弼請緣江防人每交代之際必集歷陽於是大列旗幟營幕被野陳人以為大兵至悉發國中士馬既知防人交代其衆復散後以為常不復設備及此弼以大軍濟江陳人弗之覺也襲陳南徐州拔之執其刺史黃恪軍令嚴肅秋毫不犯有軍士於民間沽酒者弼立斬之進屯蔣山之白土岡陳將魯達周智安任蠻奴田瑞樊毅孔範蕭摩訶等以徑兵拒戰田瑞先犯弼軍弼擊走之魯達等相繼遞進弼軍屢却弼揣知其驕士卒且惰於是督厲將士殊死戰遂大破之麾下開府員明擒摩訶至弼命左右牽斬之摩訶顏色自若弼釋而禮之從北掖門而入時韓擒已執陳叔寶弼至呼叔寶視之叔寶惶懼流汗股栗再拜弼謂之曰小國之君當大國卿拜禮也入朝不失作歸命侯無勞恐懼既而弼恚恨不獲叔寶功在韓擒之後於是與擒相詬挺刃而出上聞弼有功大悅下詔褒揚語在韓擒傳晉王以弼先期決戰違軍命於是以弼屬吏上驛召之及見迎勞曰克定三吳公之功也命登御坐賜物八千段加位上柱國進爵宋國公真食襄邑三千戶加以寶劍寶帶金甕金盤各一並雉尾扇曲蓋雜綵二千段女樂二部又賜陳叔寶妹為妾拜右領軍大將軍尋轉右武候大將軍弼時貴盛位望隆重其兄隆為武都郡公弟東為萬榮郡公並刺史列將弼家珍玩不可勝計婢妾曳綺羅者數百時人榮之弼自謂功名出朝臣之右每以宰相自許既而楊素為右僕射弼仍為將軍甚不平形於言色由是免官弼怨望愈甚後數年下弼獄上謂之曰我以高熲楊素為宰相汝每倡言云此二人惟堪啖飯耳是何意也弼曰熲臣之故人素臣之舅子臣並知其為人誠有此語公卿奏弼怨望罪當死上惜其功於是除名為民歲餘復其爵位上亦忌之不復任使然每宴賜遇之甚厚開皇十九年上幸仁壽宮宴王公詔弼為五言詩詞意憤怨帝覽而容之嘗遇突厥入朝上賜之射突厥一發中的上曰非賀若弼無能當此於是命弼弼再拜祝曰臣若赤誠奉國者當一發破的如其不然發不中也既射一發而中上大悅顧謂突厥曰此人天賜我也煬帝之在東宮嘗謂弼曰楊素韓擒史萬歲三人俱稱良將優劣如何弼曰楊素是猛將非謀將韓擒是鬬將非領將史萬歲是騎將非大將太子曰然則大將誰也弼拜曰唯殿下所擇弼意自許為大將及煬帝嗣位尤被疏忌大業三年從駕北巡至榆林帝時為大帳其下可坐數千人召突厥啓民可汗饗之弼以為大侈與高熲宇文等私議得失為人所奏竟坐誅時年六十四妻子為官奴婢羣從徙邊子懷亮慷慨有父風以柱國世子拜儀同三司坐弼為奴俄亦誅死史臣曰夫天地未泰聖哲啓其機疆埸尚梗爪牙宣其力周之方邵漢室韓彭代有其人非一時也自晉衰微中原幅裂區宇分隔將三百年陳氏憑長江之地險恃金陵之餘氣以為天限南北人莫能窺高祖爰應千齡將一函夏賀若弼慷慨申必取之長策韓擒奮發賈餘勇以爭先勢甚疾雷鋒踰駭電隋氏自此一戎威加四海稽諸天道或時有廢興考之人謀實二臣之力其俶儻英略賀若居多武毅威雄韓擒稱重方於晉之王杜勳庸綽有餘地然賀若功成名立矜伐不已竟顛殞於非命亦不密以失身若念父臨終之言必不及於斯禍矣韓擒纍世將家威聲動俗敵國既名遂身全幸也廣陵甘棠咸有武藝驍雄膽略並為當時所推赳赳干城難兄難弟矣

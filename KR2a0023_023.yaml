body:
  text: 隋書卷二十三志第十八五行下洪範五行傳曰視之不明是謂不知厥咎舒厥罰常燠厥極疾時則有草妖時則有羽蟲之孽故有羊禍故有目疾有赤眚赤祥惟水沴火常燠後齊天保八年三月大熱人或暍死劉向五行傳曰視不明用近習賢者不進不肖不退百職廢壞庶事不從其過在政教舒緩時帝狂躁荒淫無度之應草妖高祖時上黨有人宅後每夜有人呼聲求之不得去宅一里所但見人參一本枝葉峻茂因掘去之其根五尺餘具體人狀呼聲遂絶蓋草妖也視不明之咎時晉王陰有奪宗之計諂事親要以求聲譽譖皇太子高祖惑之人參不當言有物憑之上黨黨與也親要之人乃黨晉王而譖太子高祖不悟聽邪言廢無辜有罪用因此而亂也羽蟲之孽梁中大同元年邵陵王綸在南徐州坐聽事有野鳥如鳶數百飛屋梁上彈射不中俄頃失所在京房易飛候曰野鳥入君室其邑虛君亡之他方後綸為湘東王所襲竟致奔亡為西魏所殺侯景在梁將受錫命陳備物於庭有野鳥如山鵲赤嘴集於册書之上鵂鶹鳴於殿與中大同元年同占景尋敗將亡入海中為羊鵾所殺陳後主時蔣山有衆鳥鼓翼而鳴曰奈何帝京房易飛候曰鳥鳴門闕如人音邑且亡蔣山吳之望也鳥於上鳴吳空虛之象及陳亡建康為墟又陳未亡時有一足鳥集于殿庭以嘴畫地成文曰獨足上高臺盛草變成灰獨足者叔寶獨行無衆之應盛草成灰者陳政蕪穢被隋火德所焚除也叔寶至長安館於都水臺上高臺之義也後齊孝昭帝即位之後有雉飛上御座占同中大同元年又有鳥止於後園其色赤形似鴨而有九頭其年帝崩天統三年九月萬春鳥集仙都苑京房易飛候曰非常之鳥來宿於邑中邑有兵周師入鄴之應也武成胡后生後主初有梟升后帳而鳴梟不孝之鳥不祥之應也後主嗣位胡后淫亂事彰遂幽后於北宮焉武平七年有鸛巢太極殿又巢並州嘉陽殿雉集晉陽宮御座獲之京房易飛候曰鳥無故巢居君門及殿屋上邑且虛其年國滅周大象二年二月有禿鶖集洛陽宮太極殿其年帝崩後宮常虛開皇初梁主蕭琮新起後有鵂鳥集其帳隅未幾琮入朝被留於長安梁國遂廢大業末京師宮室中有鴻雁之類無數翔集其間俄而長安不守十三年十一月烏鵲巢帝帳幄驅不能止帝尋逢弒羊禍開皇十二年六月繁昌楊悅見雲中二物如羝羊黃色大如新生犬鬬而墜悅獲其一數旬失所在近羊禍也洪範五行傳曰君不明逆火政之所致也狀如新生犬者羔類也雲體掩蔽邪佞之象羊國姓羔羊子也皇太子勇既升儲二晉王陰毀而被廢黜二羔鬬一羔墜之應也恭帝義寧二年麟遊太守司馬武獻羊羔生而無尾時議者以為楊氏子孫無後之象是歲煬帝被殺於江都恭帝遜位赤眚赤祥梁天監十五年七月荊州巿殺人而身不僵首墮于地動口張目血如竹箭直上丈餘然後如雨細下是歲荊州大旱近赤祥寃氣之應陳太建十四年三月御座幄上見一物如車輪色正赤尋而帝患無故大叫數聲而崩至德三年十二月有赤物隕于太極殿前初下時鐘皆鳴又嘗進白飲忽變為血又有血霑殿階瀝瀝然至御榻尋而國滅後齊河清二年太原雨血劉向曰血者陰之精傷害之象僵尸之類也明年周師與突厥入並州大戰城西伏尸百餘里京房易飛候曰天雨血染衣國亡君戮亦後主亡國之應四年三月有物隕於殿庭色赤形如數斗器衆星隨者如小鈴四月婁太后崩武平中有血點地自咸陽王斛律明月宅而至于太廟大將社稷之臣也後主以讒言殺之天戒若曰殺明月則宗廟隨而覆矣後主不悟國祚竟絶洪範五行傳曰聽之不聰是謂不謀厥咎急厥罰寒厥極貧時則有鼓妖有魚孽有彘禍有黑眚黑祥惟火沴水寒東魏武定四年二月大寒人畜凍死者相望於道京房易飛候曰誅過深當燠而寒是時後齊神武作相先是爾朱文暢等謀害神武事泄伏誅諸與交通者多有濫死河清元年歲大寒京房易傳曰有德遭險茲謂逆命厥異寒讖曰殺無罪其寒必異是時帝淫於文宣李后因生子后愧恨不舉之帝大怒於后前殺其子太原王紹德后大哭帝倮后而撻殺之投于水中良久乃蘇寃酷之應梁天監三年三月六年三月並隕霜殺草京房易傳曰興兵妄誅謂亡法厥罰霜是時大發卒拒魏軍於鍾離連兵數歲大同三年六月朐山隕霜陳太建十年八月隕霜殺稻菽是時大興師選衆遣將吳明徹與周師相拒於呂梁鼓妖梁天監四年十一月天清朗西南有電光有雷聲二易曰鼓之以雷霆霆近鼓妖洪範五行傳曰雷霆託於雲猶君之託於人也君不恤於天下故兆人有怨叛之心也是歲交州刺史李凱舉兵反十九年九月西北隱隱有聲如雷赤氣下至地是歲盜殺東莞琅邪二郡守以朐山引魏軍中大通六年十二月西南有聲如雷其年北梁州刺史蘭欽舉兵反陳太建二年十二月西北有聲如雷其年湘州刺史華皎舉兵反齊天保四年四月西南有聲如雷是時帝不恤天下興師旅後周建德六年正月西方有聲如雷未幾吐谷渾寇邊開皇十四年正月旦廓州連雲山有聲如雷是時五羌反叛侵擾邊鎮二十年無雲而雷京房易飛候曰國將易君下人不靜小人先命國凶有兵甲後數歲帝崩漢王諒舉兵反徙其黨數十萬家大業中滏陽石鼓頻歲鳴其後天下大亂兵戎並起魚孽梁大同十年三月帝幸朱方至四塹中及玄武湖魚皆驤首見於上若望乘輿者帝入宮而沒洪範五行傳曰魚陰類也下人象又有鱗甲兵之應也下人將舉兵圍宮而睨乘輿之象也後果有侯景之亂齊後主武平七年相州鸕泊魚盡飛去而水涸洪範五行傳曰急之所致魚陰類下人象也晏子曰河伯以水為國以魚為百姓水涸魚飛國亡人散之象明年而國亡後周大象元年六月陽武有鯉魚乘空而鬬猶臣下興起小人從之而鬬也明年帝崩國失政尉迥起兵相州高祖遣兵擊敗之開皇十七年大興城西南四里有袁村設佛會有老翁皓首白裙襦衣來食而去衆莫識追而觀之行二里許不復見但有一陂中有白魚長丈餘小魚從者無數人爭射之或弓折弦斷後竟中之剖其腹得粳飯始知此魚向老翁也後數日漕渠暴溢射人皆溺死大業十二年淮陽郡驅人入子城鑿斷羅郎郭至女垣之下有穴其中得鯉魚長七尺餘昔魏嘉平四年魚集武庫屋上王肅以為魚生於水而亢於屋水之物失其所也邊將殆棄甲之變後果有東關之敗是時長白山賊寇掠河南月餘賊至城下郡兵拒之反為所敗男女死者萬餘人蟲妖梁大同初大蝗籬門松柏葉皆盡洪範五行傳曰介蟲之孽也與魚同占京房易飛候曰食祿不益聖化天視以蟲蟲無益於人而食萬物也是時公卿皆以虛淡為美不親職事無益食物之應也後齊天保八年河北六州河南十二州蝗畿人皆祭之帝問魏尹丞崔叔瓚曰何故蟲叔瓚對曰五行志云土功不時則蝗蟲為災今外築長城內修三臺故致災也帝大怒毆其頰擢其髮溷中物塗其頭役者不止九年山東又蝗十年幽州大蝗洪範五行傳曰刑罰暴虐貪叨不厭興師動衆取城修邑而失衆心則蟲為災是時帝用刑暴虐勞役不止之應也後周建德二年關中大蝗開皇十六年並州蝗時秦孝王俊裒刻百姓盛修邸第後竟獲譴而死彘禍開皇末渭南有沙門三人行投法於人場圃之上夜見大豕來詣其所小豕從者十餘謂沙門曰阿練我欲得賢聖道然猶負他一命言罷而去賢聖道者君上之所行也皇太子勇當嗣業行君上之道而被囚廢之象也一命者言為煬帝所殺開皇末渭南有人寄宿他舍夜中聞二豕對語其一曰歲將盡阿耶明日殺我供歲何處避之一答曰可向水北姊家因相隨而去天將曉主人覔豕不得意是宿客而詰之宿客言狀主人如其言而得豕其後蜀王秀得罪帝將殺之樂平公主每匡救得全後數年而帝崩歲盡之應黑眚黑祥梁承聖三年六月有黑氣如龍見于殿內近黑祥也黑周所尚之色今見於殿內周師入梁之象其年為周所滅帝亦遇害陳太建五年六月西北有黑雲屬地散如豬者十餘洪範五行傳曰當有兵起西北時後周將王軌軍於呂梁明年擒吳明徹軍皆覆沒火沴水後齊河清元年四月河濟清襄楷曰河諸侯之象應濁反清諸侯將為天子之象是後十餘歲隋有天下大業三年武陽郡河清數里鏡徹十二年龍門又河清後二歲大唐受禪陳太建十四年七月江水赤如血自建康西至荊州禎明中江水赤自方州東至海洪範五行傳曰火沴水也法嚴刑酷傷水性也五行變節陰陽相干氣色繆亂皆敗亂之象也京房易占曰水化為血兵且起是時後主初即位用刑酷暴之應其後為隋師所滅禎明二年四月郢州南浦水黑如墨黑水在關中而今淮南水黑荊揚州之地陷於關中之應後周大象元年六月咸陽池水變為血與陳太建十四年同占是時刑罰嚴急未幾國亡洪範五行傳曰思心不容是謂不聖厥咎瞀厥罰常風厥極凶短折有脂夜之妖有華孽有牛禍有心腹之痾有黃眚黃祥木金水火沴土常風梁天監六年八月戊戌大風折木京房易飛候曰角日疾風天下昏不出三月中兵必起是歲魏軍入鍾離承聖三年十一月癸未帝閲武於南城北風大急普天昏暗洪範五行傳曰人君瞀亂之應時帝既平侯景公卿咸勸帝反丹陽帝不從又多猜忌有瞀亂之行故天變應之以風是歲為西魏滅陳天嘉六年七月癸未大風起西南吹倒靈臺候樓洪範五行傳以為大臣專恣之咎時太子沖幼安成王頊專政帝不時抑損明年崩皇太子嗣位頊遂廢之太建十二年六月壬戌大風吹壞臯門中闥十二年九月夜又風發屋拔樹始興王叔陵專恣之應至德中大風吹倒朱雀門禎明三年六月丁巳大風自西北激濤水入石頭淮是時後主任司馬申誅戮忠諫沈客卿施文慶專行邪僻江總孔範等崇長淫縱杜塞聰明瞀亂之咎後齊河清二年大風三旬乃止時帝初委政佞臣和士開專恣日甚天統三年五月大風晝晦發屋拔樹天變再見而帝不悟明年帝崩後主詔內外表奏皆先詣士開然後聞徹趙郡王睿馮翊王潤按士開驕恣不宜仍居內職反為士開所譖睿竟坐死士開出入宮掖生殺在口尋為琅邪王儼所誅七年三月大風起西北發屋拔樹五日乃止時高阿那瓌駱提婆等專恣之應開皇二十年十一月京都大風發屋拔樹秦隴壓死者千餘人地大震鼓皆應淨剎寺鍾三鳴佛殿門鎖自開銅像自出戶外鍾鼓自鳴者近鼓妖也揚雄以為人君不聰為衆所惑空名得進則鼓妖見時獨孤皇后干預政事左僕射楊素權傾人主帝聽二人之讒而黜僕射高熲廢太子勇為庶人晉王釣虛名而見立思心瞀亂陰氣盛之象也鎖及銅像並金也金動木震之水沴金之應洪範五行傳曰失衆心甚之所致也高熲楊勇無罪而咸廢黜失衆心也仁壽二年西河有胡人乘騾在道忽為回風所飄並一車上千餘尺乃墜皆碎焉京房易傳曰衆逆同志至德乃潛厥異風後二載漢王諒在並州潛謀逆亂車及騾騎之象也升空而墜顛隕之應也天戒若曰無妄動車騎終當覆敗而諒不悟及高祖崩諒發兵反州縣響應衆至數十萬月餘而敗夜妖梁承聖二年十月丁卯大風晝晦天地昏暗近夜妖也京房易飛候曰羽日風天下昏人大疾不然多寇盜三年為西魏所滅陳禎明三年正月朔旦雲霧晦冥入鼻辛酸後主昏昧近夜妖也洪範五行傳曰王失中臣下強盛以蔽君明則雲陰是時北軍臨江柳莊任蠻奴並進中款後主惑佞臣孔範之言而昏暗不能用以至覆敗東魏武定四年冬大霧六日晝夜不解洪範五行傳曰晝而晦冥若夜者陰侵陽臣將侵君之象也明年元劉思逸謀殺大將軍之應周大象二年尉迥敗於相州坑其黨與數萬人於遊豫園其處每聞鬼夜哭聲洪範五行傳曰哭者死亡之表近夜妖也鬼而夜哭者將有死亡之應京房易飛候曰鬼夜哭國將亡明年周氏王公皆見殺周室亦亡仁壽中仁壽宮及長城之下數聞鬼哭尋而獻后及帝相次而崩於仁壽宮大業八年楊玄感作亂於東都尚書樊子蓋坑其黨與於長夏門外前後數萬洎于末年數聞其處鬼哭有呻吟之聲與前同占其後王世充害越王侗于洛陽華孽後齊武平元年槐華而不結實槐三公之位也華而不實萎落之象至明年録尚書事和士開伏誅隴東王胡長仁太保琅邪王儼皆遇害左丞相段韶薨陳後主時有張貴妃孔貴嬪並有國色稱為妖艷後主惑之寵冠宮掖每充侍從詩酒為娛一入後庭數旬不出荒淫侈靡莫知紀極府庫空竭頭會箕斂天下怨叛將士離心敵人鼓行而進莫有死戰之士女德之咎也及敗亡之際後主與此姬俱投於井隋師執張貴妃而戮之以謝江東洪範五行傳曰華者猶榮華容色之象也以色亂國故謂華孽齊後主有寵姬馮小憐慧而有色能彈琵琶尤工歌後主惑之拜為淑妃選綵女數千為之羽從一女之飾動費千金帝從禽於三堆而周師大至邊吏告急相望於道帝欲班師小憐意不已更請合圍帝從之由是遲留而晉州遂陷後與周師相遇於晉州之下坐小憐而失機者數矣因而國滅齊之士庶至今咎之牛禍梁武陵王紀祭城隍神將烹牛忽有赤蛇繞牛口牛禍也象類言之又為龍蛇之孽魯宣公三年郊牛之口傷時以為天不享棄宣公也五行傳曰逆君道傷故有龍蛇之孽是時紀雖以赴援為名而實妄自尊亢思心之咎神不享君道傷之應果為元帝所敗後齊武平二年並州獻五足牛牛禍也洪範五行傳曰牛事應宮室之象也帝尋大發卒於仙都苑穿池築山樓殿間起窮華極麗功始就而亡國後周建德六年陽武有獸三狀如水牛一黃一赤一黑與黑者鬬久之黃者自傍觸之黑者死黃赤俱入于河近牛禍也黑者周之所尚色死者滅亡之象後數載周果滅而隋有天下旗牲尚赤戎服以黃大業初山有牛四腳膝上各生一蹄其後建東都築長城開溝洫心腹之痾陳禎明三年隋師臨江後主從容而言曰齊兵三來周師再來無弗摧敗彼何為者都官尚書孔範曰長江天塹古以為限隔南北今日北軍豈能飛渡耶臣每患官卑彼若渡來臣為太尉矣後主大悅因奏妓縱酒賦詩不輟心腹之痾也存亡之機定之俄頃君臣旰食不暇後主已不知懼孔範從而蕩之天奪其心曷能不敗陳國遂亡範亦遠徙齊文宣帝嘗宴於東山投杯赫怒下詔西伐極陳甲兵之盛既而泣謂羣臣曰黑衣非我所制卒不行有識者以帝精魄已亂知帝祚之不永帝後竟得心疾耽荒酒色性忽狂暴數年而崩武成帝丁太后憂緋袍如故未幾登三臺置酒作樂侍者進白袍帝大怒投之臺下未幾而崩黃眚黃祥梁大同元年天雨土二年天雨灰其色黃近黃祥也京房易飛候曰聞善不及茲謂有知厥異黃厥咎龍厥災不嗣蔽賢絶道之咎也時帝自以為聰明博達惡人勝己又篤信佛法捨身為奴絶道蔽賢之罰也大寶元年正月天雨黃沙二年簡文帝夢丸土而吞之尋為侯景所廢以土囊壓之而斃諸子遇害不嗣之應也陳後主時夢黃衣人圍城後主惡之繞城橘樹盡伐去之隋高祖受禪之後上下通服黃衣未幾隋師攻圍之應也後周大象二年正月天雨黃土移時乃息與大同元年同占時帝昏狂滋甚期年而崩至于靜帝用遜厥位絶道不嗣之應也開皇二年京師雨土是時帝懲周室諸侯微弱以亡天下故分封諸子並為行臺專制方面失土之故有土氣之祥其後諸王各謀為逆亂京房易飛候曰天雨土百姓勞苦而無功其時營都邑後起仁壽宮頽山堙谷丁匠死者太半裸蟲之孽梁太清元年丹陽有莫氏妻生男眼在頂上大如兩歲兒墜地而言曰兒是旱疫鬼不得住母曰汝當令我得過疫鬼曰有上官何得自由母可急作絳帽故當無憂母不暇作帽以絳繫髮自是旱疫者二年揚徐兗豫尤甚莫氏鄉鄰多以絳免他土效之無驗大寶二年京口人於藏兒年五歲登城西南角大樓打鼓作長江櫑鼓兵象也是時侯景亂江南陳永定三年有人長三丈見羅浮山通身潔白衣服楚麗京房占曰長人見亡後二歲帝崩後主為太子時有婦人突入東宮而大言曰畢國主後主立而祚終之應也至德三年八月建康人家婢死埋之九日而更生有牧牛人聞而出之禎明二年有船下忽聞人言曰明年亂視之得死嬰兒長二尺而無頭明年陳滅齊天保中臨漳有婦人産子二頭共體是後政由姦佞上下無別兩頭之應也後主時有桑門貌若狂人見烏則向之作禮見沙門則毆辱之烏周色也未幾齊為周所吞滅除佛法後周保定三年有人産子男陰在背上如尾兩足指如獸爪陰不當生於背而生於背者陰陽反覆君臣顛倒之象人足不當有爪而有爪者將致攫人之變也是時晉蕩公宇文護專擅朝政征伐自己陰懷篡逆天戒若曰君臣之分已倒矣將行攫噬之禍帝見變而悟遂誅晉公親萬機躬節儉克平齊國號為高祖轉禍為福之效也武帝時有冖出蟲練者佯狂持一瓠至晉蕩公護門而擊破之曰身尚可子苦矣時護專政因朝太后帝擊殺之發兵捕其諸子皆備楚毒而死強練又行乞於市人或遺之粟麥輒以無底受之因大笑曰盛空未幾周滅高祖移都長安城為墟矣開皇六年霍州有老翁化為猛獸七年相州有桑門變為蛇尾繞樹而自抽長二丈許仁壽四年有人長數丈見於應門其迹長四尺五寸其年帝崩大業元年雁門人房回安母年百歲額上生角長二寸洪範五行傳曰婦人陰象也角兵象也下反上之應是後天下果大亂陰戎圍帝於雁門四年雁門宋谷村有婦人生一肉卵大如斗埋之後數日所埋處雲霧盡合從地雷震而上視之洞穴失卵所在六年趙郡李來王家婢産一物大如卵六年正月朔旦有盜衣白練裙襦手持香花自稱彌勒佛出世入建國門奪衛士仗將為亂齊王暕遇而斬之後三年楊玄感作亂引兵圍洛陽戰敗伏誅八年有澄公者若狂人於東都大叫唱賊帝聞而惡之明年玄感舉兵圍洛陽十二年澄公又叫賊李密逼東都孟讓燒豐都巿而去九年帝在高陽唐縣人宋子賢善為幻術每夜樓上有光明能變作佛形自稱彌勒出世又懸大鏡於堂上紙素上畫為蛇為獸及人形有人來禮謁者轉側其鏡遣觀來生形像或映見紙上蛇形子賢輒告云此罪業也當更禮念又令禮謁乃轉人形示之遠近惑信日數百千人遂潛謀作亂將為無遮佛會因舉兵欲襲擊乘輿事泄鷹揚郎將以兵捕之夜至其所繞其所居但見火坑兵不敢進郎將曰此地素無坑止妖妄耳及進無復火矣遂擒斬之並坐其黨與千餘家其後復有桑門向海明於扶風自稱彌勒佛出世潛謀逆亂人有歸心者輒獲吉夢由是人皆惑之三輔之士翕然稱為大聖因舉兵反衆至數萬官軍擊破之京房易飛候曰妖言動衆者茲謂不信路無人行不出三年起兵自是天下大亂路無人行木金水火沴土梁天監五年十一月京師地震木金水火沴土也洪範五行傳曰臣下盛將動而為害京房易飛候曰地動以冬十一月者其邑飢亡時交州刺史李凱舉兵反明年霜歲儉人飢普通三年正月建康地震是時義州刺史文僧朗以州叛六年十二月地震京房易飛候曰地冬動有音以十二月者其邑有行兵是時帝令豫章王琮將兵北伐中大通五年正月建康地震京房易飛候曰地以春動歲不昌是歲大水百姓飢饉大同三年十一月建康地震京房易飛候曰地震以十一月邑有大喪及飢亡明年霜為災百姓飢三年十月建康地震是歲會稽山賊起七年二月建康地震是歲交州人李賁舉兵逐刺史蕭咨九年閏正月地震李賁自稱皇帝署置百官太清三年四月建康地再震時侯景自為大丞相録尚書事帝所須不給是月以憂憤崩陳永定二年五月建康地震時王琳立蕭莊於郢州太建四年十一月地震陳寶應反閩中禎明元年正月地震施文慶沈客卿專恣之應也東魏武定二年十一月西河地陷而且燃京房易妖占曰地自陷其君亡祖耳幾曰火陽精也地者陰主也地燃越陰之道行陽之政臣下擅恣終以自害時後齊神武作宰而侯景專擅河南後二歲神武果崩景遂作亂而自取敗亡之應後齊河清二年並州地震和士開專恣之應後周建德二年涼州地頻震城郭多壞地裂出泉京房易妖占曰地分裂羌夷叛時吐谷渾頻寇河西開皇十四年五月京師地震京房易飛候曰地動以夏五月人流亡是歲關中飢帝令百姓就糧於關東仁壽二年四月岐雍地震京房易飛候曰地動以夏四月五穀不熟人大飢三年梁州就谷山崩洪範五行傳曰崩散落背叛不事上之類也梁州為漢地明年漢王諒舉兵反大業七年砥柱山崩壅河逆流數十里劉向洪範五行傳曰山者君之象水者陰之表人之類也天戒若曰君人擁威重將崩壞百姓不得其所時帝興遼東之師百姓不堪其役四海怨叛帝不能悟卒以滅亡洪範五行傳曰皇之不極是謂不建厥咎瞀厥罰常陰厥極弱時則有射妖則有龍蛇之孽則有馬禍雲陰開皇二十年十月久陰不雨劉向曰王者失中臣下強盛而蔽君明則雲陰是時獨孤后遂與楊素陰譖太子勇廢為庶人射妖東魏武定四年後齊神武作宰親率諸軍攻西魏於玉壁其年十一月帝不豫班師將士震懼皆曰韋孝寬以定功弩射殺丞相西魏下令國中曰徑弩一發凶身自殞神武聞而惡之其疾暴增近射妖也洪範五行傳曰射者兵戎禍亂之象氣逆天則禍亂將起神武行殿中將軍曹魏祖諫曰王以死氣逆生氣為客不利主人則可帝不從頓軍五旬頻戰沮衄又聽孤虛之言於城北斷汾水起土山其處天險千餘尺功竟不就死者七萬氣逆天之咎也其年帝崩明年王思政擾河南武平後主自並州還鄴至八公嶺夜與左右歌而行有一人忽發狂意後主以為狐媚伏草中彎弓而射之傷數人幾中後主後主執而斬之其人不自覺也狐而能媚獸之妖妄也時帝不恤國政專與內人閹豎酣歌為樂或衣縷衣行乞為娛此妖妄之象人又射之兵戎禍亂之應也未幾而國滅龍蛇之孽梁天監二年北梁州潭中有龍鬬濆霧數里龍蛇之孽洪範五行傳曰龍獸之難害者也天之類君之象天氣害君道傷則龍亦害鬬者兵革之象也京房易飛候曰衆心不安厥妖龍鬬是時帝初即位而有陳伯之劉季連之亂國內危懼普通五年六月龍鬬于曲阿王陂因西行至建陵城所經之處樹木皆折開數十丈與天監二年同占經建陵而樹木折者國有兵革之禍園陵殘毀之象時帝專以講論為務不崇耕戰將輕而卒惰君道既傷故有龍孽之應帝殊不悟至太清元年黎州水中又有龍鬬波浪涌起雲霧四合而見白龍南走黑龍隨之其年侯景以兵來降帝納之而無備國人皆懼俄而難作帝以憂崩大同十年夏有龍夜因雷而墮延陵人家井中明旦視之大如驢將以戟刺之俄見庭中及室中各有大蛇如數百斛船家人奔走洪範五行傳曰龍陽類貴象也上則在天下則在地不當見庶人邑里室家井中幽深之象也諸侯且有幽執之禍皇不建之咎也後侯景反果幽殺簡文于酒庫宗室王侯皆幽死陳太建十一年正月龍見南兗州池中與梁大同十年同占未幾後主嗣位驕淫荒怠動不得中其後竟以國亡身被幽執東魏武定元年有大蛇見武牢城是時北豫州刺史高仲密妻李氏慧而艷世子澄悅之仲密內不自安遂以武牢叛陰引西魏大戰於河陽神武為西兵所窘僅而獲免死者數千後齊天保九年有龍長七八丈見齊州大堂占同大同十年時常山長廣二王權重帝不思抑損明年帝崩太子殷嗣立常山王演果廢帝為濟南王幽而害之河清元年龍見濟州浴堂中占同天保九年先是平秦王歸彥受昭帝遺詔立太子百年為嗣而歸彥遂立長廣王湛是為武成帝而廢百年為樂陵王竟以幽死天統四年貴鄉人伐枯木得一黃龍折腳死於孔中齊稱木德龍君象木枯龍死不祥之甚其年武成崩武平三年龍見邯鄲井中其氣五色屬天又見汲郡佛寺涸井中占同河清元年後主竟降周後被誅武平七年並州招遠樓下有赤蛇與黑蛇鬬數日赤蛇死赤齊尚色黑周尚色鬬而死滅亡之象也後主任用邪佞與周師連兵於晉州之下委軍於孽臣高阿那肱竟啓敵人皇不建之咎也後主遂為周師所虜琅邪王儼壞北宮中白馬浮圖石趙時澄公所建見白蛇長數丈回旋失所在時儼專誅失中之咎也見變不知戒以及於難後周建德五年黑龍墜於亳州而死龍君之象黑周所尚色墜而死不祥之甚時皇太子不才帝每以為慮直臣王軌宇文孝伯等驟請廢立帝不能用後二歲帝崩太子立虐殺齊王及孝伯等因而國亡仁壽四年龍見代州總管府井中其龍或變為鐵馬甲士彎弓上射之象變為鐵馬近馬禍也彎弓上射又近射妖諸侯將有兵革之變以致幽囚也是時漢王諒潛謀逆亂故變兵戒之諒不悟遂興兵反事敗廢為庶人幽囚數年而死馬禍侯景僭尊號於江南每將戰其所乘白馬長鳴蹀足者輒勝垂頭者輒不利西州之役馬臥不起景拜請且箠之竟不動近馬禍也洪範五行傳曰馬者兵象將有寇戎之事故馬為怪景因此大敗陳太建五年衡州馬生角洪範五行傳曰馬生角兵之象敗亡之表也是時宣帝遣吳明徹出師呂梁與周師拒連兵數歲衆軍覆沒明徹竟為周師所虜天保中廣宗有馬兩耳間生角如羊尾京房易傳曰天子親伐則馬生角四年契丹犯塞文宣帝親御六軍以擊之大業四年太原馬死者太半帝怒遣使案問主者曰每夜中馬無故自驚因而致死帝令巫者視之巫者知帝將有遼東之役因希旨言曰先帝令楊素史萬歲取之將鬼兵以伐遼東也帝大悅因釋主者洪範五行傳曰逆天氣故馬多死是時帝每歲巡幸北事長城西通且末國內虛耗天戒若曰除馬無事巡幸帝不悟遂至亂十一年河南扶風三郡並有馬生角長數寸與天保初同占是時帝頻歲親征高麗義寧元年帝在江都宮龍馬無故而死旬日死至數百匹與大業四年同占

body:
  text: 隋書卷六十一列傳第二十六宇文述雲定興宇文述字伯通代郡武川人也本姓破野頭役屬鮮卑俟豆歸後從其主為宇文氏父盛周上柱國述少驍鋭便弓馬年十一時有相者謂述曰公子善自愛後當位極人臣周武帝時以父軍功起家拜開府述性恭謹沈密周大冢宰宇文護甚愛之以本官領護親信及帝親總萬機召為左宮伯纍遷英果中大夫賜爵博陵郡公尋改封濮陽郡公高祖為丞相尉迥作亂相州述以行軍總管率步騎三千從韋孝寬擊之軍至河陽迥遣將李俊攻懷州述別擊俊軍破之又與諸將擊尉惇於永橋述先鋒陷陳俘馘甚衆平尉迥每戰有功超拜上柱國進爵褒國公賜縑三千匹開皇初拜右衛大將軍平陳之役復以行軍總管率衆三萬自六合而濟時韓擒賀若弼兩軍趣丹陽述進據石頭以為聲援陳主既擒而蕭瓛蕭巖據東吳之地擁兵拒守述領行軍總管元契張默言等討之水陸兼進落叢公燕榮以舟師自海至亦受述節度上下詔曰公鴻勳大業名高望重奉國之誠久所知悉金陵之寇既已清蕩而吳會之地東路為遙蕭巖蕭瓛並在其處公率將戎旅撫慰彼方振揚國威宣布朝化以公明略乘勝而往風行電掃自當稽服若使干戈不用黎庶獲安方副朕懷公之力也陳永新侯陳君範自晉陵奔瓛並軍合勢見述軍且至瓛懼立柵於晉陵城東又絶塘道留兵拒述瓛自義興入太湖圖掩述後述進破其柵回兵擊瓛大敗之斬瓛司馬曹此晉王之賜令述與公為歡樂耳約大驚曰何為者述因為王申意約然其説退言於素素亦從之於是素每與述謀事晉王與述情好益密命述子士及尚南陽公主前後賞賜不可勝計及晉王為皇太子以述為左衛率舊令率官第四品上以述素貴遂進率品為第三其見重如此煬帝嗣位拜左衛大將軍改封許國公大業三年加開府儀同三司每冬正朝會輒給鼓吹一部從幸榆林時鐵勒契弊歌稜攻敗吐谷渾其部攜散遂遣使請降求救帝令述以兵屯西平之臨羌城撫納降附吐谷渾見述擁強兵懼不敢降遂西遁述領鷹揚郎將梁元禮張峻崔師等追之至曼頭城攻拔之斬三千餘級乘勝至赤水城復拔之其餘黨走屯丘尼川述進擊大破之獲其王公尚書將軍二百人前後虜男女四千口而還渾主南走雪山其故地皆空帝大悅明年從帝西幸巡至金山登燕支述每為斥候時渾賊復寇張掖進擊走之還至江都宮勑述與蘇威常典選舉參預朝政述時貴重委任與蘇威等其親愛則過之帝所得遠方貢獻及四時口味輒見班賜中使相望於道述善於供奉俯仰折旋容止便辟宿衛者咸取則焉又有巧思凡有所裝飾皆出人意表數以奇服異物進獻宮掖由是帝彌悅焉時述貴幸言無不從勢傾朝廷左衛將軍張瑾與述連官嘗有評議偶不中意述張目叱之瑾惶懼而走文武百僚莫敢違忤然性貪鄙知人有珍異之物必求取之富商大賈及隴右諸胡子弟述皆接以恩意呼之為兒由是競加餽遺金寶纍積後庭曳羅綺者數百家僮千餘人皆控良馬被服金玉述之寵遇當時莫與為比及征高麗述為扶餘道軍將臨發帝謂述曰禮七十者行役以婦人從公宜以家纍自隨古稱婦人不入軍謂臨戰時耳至於營壘之間無所傷也項籍虞姬即其故事述與九軍至鴨緑水糧盡議欲班師諸將多異同述又不測帝意會乙支文德來詣其營述先與于仲文俱奉密旨令誘執文德既而緩縱文德逃歸語在仲文傳述內不自安遂與諸將渡水追之時文德見述軍中多飢色欲疲述衆每鬬便北述一日之中七戰皆捷既恃驟勝又內逼羣議於是遂進東濟薩水去平壤城三十里因山為營文德復遣使偽降請述曰若旋師者當奉高元朝行在所述見士卒疲敝不可復戰又平壤嶮固卒難致力遂因其詐而還衆半濟賊擊後軍於是大潰不可禁止九軍敗績一日一夜還至鴨緑水行四百五十里初渡遼九軍三十萬五千人及還至遼東城唯二千七百人帝大怒以述等屬吏至東都除名為民明年帝有事遼東復述官爵待之如初從至遼東與將軍楊義臣率兵復臨鴨緑水會楊玄感作亂帝召述班師令馳驛赴河陽發諸郡兵以討玄感時玄感逼東都聞述軍將至懼而西遁將圖關中述與刑部尚書衛玄左禦衛將軍來護兒武衛將軍屈突通等躡之至閿鄉皇天原與玄感相及述與來護兒列陳當其前遣屈突通以奇兵擊其後大破之遂斬玄感傳首行在所賜物數千段復從東征至懷遠而還突厥之圍雁門帝懼述請潰圍而出樊子蓋固諫不可帝乃止及圍解車駕次太原議者多勸帝還京師帝有難色述因奏曰從官妻子多在東都便道向洛陽自潼關而入可也帝從之是歲至東都述又觀望帝意勸幸江都帝大悅述於江都遇疾中使相望帝將親臨視之羣臣苦諫乃止遂遣司宮魏氏問述曰必有不諱欲何所言述二子化及智及時並得罪于家述因奏曰化及臣之長子早預藩邸願陛下哀憐之帝聞泫然曰吾不忘也及薨帝為之廢朝贈司徒尚書令十郡太守班劍四十人轀輬車前後部鼓吹諡曰恭帝令黃門侍郎裴矩祭以太牢鴻臚監護喪事子化及別有傳雲定興者附會於述初定興女為皇太子勇昭訓及勇廢除名配少府定興先得昭訓明珠絡帳私賂於述自是數共交遊定興每時節必有賂遺並以音樂干述述素好著奇服炫耀時人定興為製馬韀於後角上缺方三寸以露白色世輕薄者爭放學之謂為許公缺勢又遇天寒定興曰入內宿衛必當耳冷述曰然乃製夾頭巾令深袙耳又學之名為許公袙勢述大悅曰雲兄所作必能變俗我聞作事可法故不虛也後帝將事四夷大造兵器述薦之因勑少府工匠並取其節度述欲為之求官謂定興曰兄所製器仗並合上心而不得官者為長寧兄弟猶未死耳定興曰此無用物何不勸上殺之述因奏曰房陵諸子年並成立今欲動兵征討若將從駕則守掌為難若留一處又恐不可進退無用請早處分帝從之因鴆殺長寧又遣以下七弟分配嶺表仍遣間使於路盡殺之五年大閲軍實帝稱甲仗為佳述奏曰並雲定興之功也擢授少府丞尋代何稠為少監轉衛尉少卿遷左禦衛將軍仍知少府事十一年授左屯衛大將軍凡述所薦達皆至大官趙行樞以太常樂戶家財億計述謂為兒多受其賄稱其驍勇起家為折衝郎將郭衍郭衍字彥文自云太原介休人也父崇以舍人從魏武帝入關其後官至侍中衍少驍武善騎射周陳王純引為左右纍遷大都督時齊氏未平衍奉詔於天水募人以鎮東境得樂徙千餘家屯於陝城拜使持節車騎大將軍儀同三司每有寇至輒率所領禦之一歲數告捷頗為齊人所憚王益親任之建德中周武帝出幸雲陽衍朝於行所時議欲伐齊衍請為前鋒攻河陰城授儀同大將軍武帝圍晉州慮齊兵來援令衍從陳王守千里徑又從武帝與齊主大戰於晉州追齊師至高壁敗之仍從平並州以功加授開府封武強縣公邑一千二百戶賜姓叱羅氏宣政元年為右中軍熊渠中大夫尉迥之起逆從韋孝寬戰於武陟進戰於相州先是迥遣弟子勤為青州總管率青齊之衆來助迥迥敗勤與迥子惇祐等欲東奔青州衍將精騎一千追破之執祐於陳勤遂遁走而惇亦逃逸衍至濟州入據其城又擊其餘黨於濟北纍戰破之執送京師超授上柱國封武山郡公賞物七千段密勸高祖殺周室諸王早行禪代由是大被親昵開皇元年勑復舊姓為郭氏突厥犯塞以衍為行軍總管領兵屯於平涼數歲虜不入徵為開漕渠大監部率水工鑿渠引渭水經大興城北東至于潼關漕運四百餘里關內賴之名之曰富民渠五年授瀛州刺史遇秋霖大水其屬縣多漂沒民皆上高樹依大冢衍親備船並齎糧拯救之民多獲濟衍先開倉賑恤後始聞奏上大善之選授朔州總管所部有安鎮北接蕃境常勞轉運衍乃選沃饒地置屯田歲剩粟萬餘石民免轉輸之勞又築桑乾鎮皆稱旨十年從晉王廣出鎮揚州遇江表搆逆命衍為總管領精鋭萬人先屯京口於貴洲南與賊戰敗之生擒魁帥大獲舟楫糧儲以充軍實乃討東陽永嘉宣城黟歙諸洞盡平之授蔣州刺史衍臨下甚踞事上姦諂晉王愛昵之宴賜隆厚遷洪州總管王有奪宗之謀託衍心腹遣宇文述以情告之衍大喜曰若所謀事果自可為皇太子如其不諧亦須據淮海復梁陳之舊副君酒客其如我何王因召衍陰共計議又恐人疑無故來往託以衍妻患癭王妃蕭氏有術能療之以狀奏高祖高祖聽衍共妻向江都往來無度衍又詐稱桂州俚反王乃奏衍行兵討之由是大修甲仗陰養士卒及王入為太子徵授左監門率轉左宗衛率高祖於仁壽宮將大漸太子與楊素矯詔令衍宇文述領東宮兵帖上臺宿衛門禁並由之及上崩漢王起逆而京師空虛使衍馳還總兵居守大業元年拜左武衛大將軍帝幸江都令衍統左軍改授光祿大夫又從討吐谷渾出金山道納降二萬餘戶衍能揣上意阿諛順旨帝每謂人曰唯有郭衍心與朕同又嘗勸帝取樂五日一視事無得效高祖空自劬勞帝從之益稱其孝順初新令行衍封爵從例除六年以恩幸封真定侯七年從往江都卒贈左衛大將軍賵賜甚厚諡曰襄長子臻武牙郎將次子嗣本孝昌縣令史臣曰謇謇匪躬為臣之高節和而不同事君之常道宇文述郭衍以水濟水如脂如韋便辟足恭柔顏取悅君所謂可亦曰可焉君所謂不亦曰不焉無所是非不能輕重默默苟容偷安高位甘素餐之責受彼己之譏此固君子所不為亦丘明之深恥也

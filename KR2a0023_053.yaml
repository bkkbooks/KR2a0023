body:
  text: 隋書卷五十三列傳第十八達奚長儒達奚長儒字富仁代人也祖俟魏定州刺史父慶驃騎大將軍儀同三司長儒少懷節操膽烈過人十五襲爵樂安公魏大統中起家奉車都尉周太祖引為親信以質直恭勤授子都督數有戰功假輔國將軍纍遷使持節撫軍將軍通直散騎常侍平蜀之役為先鋒攻城野戰所當必破之除車騎大將軍儀同三司增邑三百戶天和中除渭南郡守遷驃騎大將軍開府儀同三司從武帝平齊遷上開府進爵成安郡公邑千二百戶別封一子縣公宣政元年除左前軍勇猛中大夫後與烏丸軌圍陳將吳明徹於呂梁陳遣驍將劉景率徑勇七千來為聲援軌令長儒逆拒之長儒於是取車輪數百繫以大石沉之清水連轂相次以待景軍景至船艦礙輪不得進長儒乃縱奇兵水陸俱發大破之俘數千人及獲吳明徹以功進位大將軍尋授行軍總管北巡沙塞卒與虜遇接戰大破之高祖作相王謙舉兵於蜀沙氐上柱國楊永安扇動利興武文沙龍等六州以應謙詔長儒擊破之謙二子自京師亡歸其父長儒並捕斬之高祖受禪進位上大將軍封蘄春郡公邑二千五百戶開皇二年突厥沙鉢略可汗並弟葉護及潘那可汗衆十餘萬寇掠而南詔以長儒為行軍總管率衆二千擊之遇於周槃衆寡不敵軍中大懼長儒慷慨神色愈烈為虜所衝突散而復聚且戰且行轉鬬三日五兵咸盡士卒以拳毆之手皆見骨殺傷萬計虜氣稍奪於是解去長儒身被五創通中者二其戰士死傷者十八九突厥本欲大掠秦隴既逢長儒兵皆力戰虜意大沮明日於戰處焚尸慟哭而去高祖下詔曰突厥猖狂輒犯邊塞犬羊之衆彌亘山原而長儒受任北鄙式遏寇賊所部之內少將百倍以晝通宵四面抗敵凡十有四戰所向必摧凶徒就戮過半不反鋒刃之餘亡魂竄迹自非英威奮發奉國情深撫御有方士卒用命豈能以少破衆若斯之偉言念勳庸宜隆名器可上柱國餘勳回授一子其戰亡將士皆贈官三轉子孫襲之其年授寧州刺史尋轉鄜州刺史母憂去職長儒性至孝水漿不入口五日毀悴過禮殆將滅性天子嘉歎起為夏州總管三州六鎮都將事胸奴憚之不敢窺塞以病免又除襄州總管在職二年轉蘭州總管高祖遣涼州總管獨孤羅原州總管元褒靈州總管賀若誼等發卒備胡皆受長儒節度長儒率衆出祁連山北西至蒲類海無虜而還復轉荊州總管三十六州諸軍事高祖謂之曰江陵要害國之南門今以委公朕無慮也歲餘卒官諡曰威子皓大業時官至太僕少卿賀婁子幹賀婁子幹字萬壽本代人也隨魏氏南遷世居關右祖道成魏侍中太子太傅父景賢右衛大將軍子幹少以驍武知名周武帝時釋褐司水上士稱為強濟纍遷小司水以勤勞封思安縣子俄授使持節儀同大將軍大象初領軍器監尋除秦州刺史進爵為伯及尉迥作亂子幹與宇文司録從韋孝寬討之遇賊圍懷州子幹與宇文述等擊破之高祖大悅手書曰逆賊尉迥敢遣蟻衆作寇懷州公受命誅討應機蕩滌聞以嗟贊不易可言丈夫富貴之秋正在今日善建功名以副朝望也其後每戰先登及破鄴城與崔弘度逐迥至樓上進位上開府封武川縣公邑三千戶以思安縣伯別封子皎開皇元年進爵巨鹿郡公其年吐谷渾寇涼州子幹以行軍總管從上柱國元諧擊之功最優詔褒美高祖慮邊塞未安即令子幹鎮涼州明年突厥寇蘭州子幹率衆拒之至可洛峐山與賊相遇賊衆甚盛子幹阻川為營賊軍不得水數日人馬甚敝縱擊大破之於是冊授子幹為上大將軍曰於戲敬聽朕命唯爾器量間明志情強果任經武將勤績有聞往歲凶醜未寧屢驚疆埸拓土靜亂殊有厥勞是用崇茲賞典加此車服往欽哉祗承榮冊可不慎歟徵授營新都副監尋拜工部尚書其年突厥復犯塞以行軍總管從竇榮定擊之子幹別路破賊斬首千餘級高祖嘉之遣通事舍人曹威齎優詔勞勉之子幹請入朝詔令馳驛奉見吐谷渾復寇邊西方多被其害命子幹討之馳驛至河西發五州兵入掠其國殺男女萬餘口二旬而還高祖以隴西頻被寇掠甚患之彼俗不設村塢勑子幹勒民為堡營田積穀以備不虞子幹上書曰比者凶寇侵擾蕩滅之期匪朝伊夕伏願聖慮勿以為懷今臣在此觀機而作不得準詔行事且隴西河右土曠民稀邊境未寧不可廣為田種比見屯田之所獲少費多虛役人功卒逢踐暴屯田疏遠者請皆廢省但隴右之民以畜牧為事若更屯聚彌不獲安只可嚴謹斥候豈容集人聚畜請要路之所加其防守但使鎮戍連接烽候相望民雖散居必謂無慮高祖從之俄而虜寇岷洮二州子幹勒兵赴之賊聞而遁去高祖以子幹曉習邊事授榆關總管十鎮諸軍事餘歲拜雲州刺史甚為虜所憚後數年突厥雍虞閭遣使請降並獻羊馬詔以子幹為行軍總管出西北道應接之還拜雲州總管以突厥所獻馬百匹羊千口以賜之乃下書曰自公守北門風塵不警突厥所獻還以賜公母憂去職朝廷以榆關重鎮非子幹不可尋起視事十四年以病卒官時年六十高祖傷惜者久之賻縑千匹米麥千斛贈懷魏等四州刺史諡曰懷子善柱嗣官至黔安太守子幹兄詮亦有才器位至銀青光祿大夫鄯純深三州刺史北地太守東安郡公史萬歲史萬歲京兆杜陵人也父靜周滄州刺史萬歲少英武善騎射驍捷若飛好讀兵書兼精占候年十五值周齊戰於芒山萬歲時從父入軍旗鼓正相望萬歲令左右趣治裝急去俄而周師大敗其父由是奇之武帝時釋褐侍伯上士及平齊之役其父戰沒萬歲以忠臣子拜開府儀同三司襲爵太平縣公尉迥之亂也萬歲從梁士彥擊之軍次馮翊見羣雁飛來萬歲謂士彥曰請射行中第三者既射之應弦而落三軍莫不悅服及與迥軍相遇每戰先登鄴城之陳官軍稍却萬歲謂左右曰事急矣吾當破之於是馳馬奮擊殺數十人衆亦齊力官軍乃振及迥平以功拜上大將軍爾朱績以謀反伏誅萬歲頗相關涉坐除名配敦煌為戍卒其戍主甚驍武每單騎深入突厥中掠取羊馬輒大剋獲突厥無衆寡莫之敢當其人深自矜負數罵辱萬歲萬歲患之自言亦有武用戍主試令馳射而工戍主笑曰小人定可萬歲請弓馬復掠突厥中大得六畜而歸戍主始善之每與同行輒入突厥數百里名讋北夷竇榮定之擊突厥也萬歲詣轅門請自效榮定數聞其名見而大悅因遣人謂突厥曰士卒何罪過令殺之但當各遣一壯士決勝負耳突厥許諾因遣一騎挑戰榮定遣萬歲出應之萬歲馳斬其首而還突厥大驚不敢復戰遂引軍而去由是拜上儀同領車騎將軍平陳之役又以功加上開府及高智慧等作亂江南以行軍總管從楊素擊之萬歲率衆二千自東陽別道而進踰嶺越海攻陷溪洞不可勝數前後七百餘戰轉鬬千餘里寂無聲問者十旬遠近皆以萬歲為沒萬歲以水陸阻絶信使不通乃置書竹筒中浮之於水汲者得之以言於素素大悅上其事高祖嗟歎賜其家錢十萬還拜左領軍將軍先是南寧夷爨玩來降拜昆州刺史既而復叛遂以萬歲為行軍總管率衆擊之入自蜻蛉川經弄凍次小勃弄大勃弄至于南中賊前後屯據要害萬歲皆擊破之行數百里見諸葛亮紀功碑銘其背曰萬歲之後勝我者過此萬歲令左右倒其碑而進渡西二河入渠濫川行千餘里破其三十餘部虜獲男女二萬餘口諸夷大懼遣使請降獻明珠徑寸於是勒石頌美隋德萬歲遣使馳奏請將玩入朝詔許之爨玩陰有二心不欲詣闕因賂萬歲以金寶萬歲於是捨玩而還蜀王時在益州知其受賂遣使將索之萬歲聞而悉以所得金寶沉之於江索無所獲以功進位柱國晉王廣虛襟敬之待以交友之禮上知為所善令萬歲督晉府軍事明年爨玩復反蜀王秀奏萬歲受賂縱賊致生邊患無大臣節上令窮治其事事皆驗罪當死上數之曰受金放賊重勞士馬朕念將士暴露寢不安席食不甘味卿豈社稷臣也萬歲曰臣留爨玩者恐其州有變留以鎮撫臣還至瀘水詔書方到由是不將入朝實不受賂上以萬歲心有欺隱大怒曰朕以卿為好人何乃官高祿重翻為國賊也顧有司曰明日將斬之萬歲懼而服罪頓首請命左僕射高熲左衛大將軍元旻等進曰史萬歲雄略過人每行兵用師之處未嘗不身先士卒尤善撫御將士樂為致力雖古名將未能過也上意少解於是除名為民歲餘復官爵尋拜河州刺史復領行軍總管以備胡開皇末突厥達頭可汗犯塞上令晉王廣及楊素出靈武道漢王諒與萬歲出馬邑道萬歲率柱國張定和大將軍李藥王楊義臣等出塞至大斤山與虜相遇達頭遣使問曰隋將為誰候騎報史萬歲也突厥復問曰得非敦煌戍卒乎候騎曰是也達頭聞之懼而引去萬歲馳追百餘里乃及擊大破之斬數千級逐北入磧數百里虜遁逃而還楊素害其功因譖萬歲云突厥本降初不為寇來於塞上畜牧耳遂寢其功萬歲數抗表陳狀上未之悟會上從仁壽宮初還京師廢皇太子窮東宮黨與上問萬歲所在萬歲實在朝堂楊素見上方怒因曰萬歲謁東宮矣以激怒上上謂為信然令召萬歲時所將士卒在朝稱寃者數百人萬歲謂之曰吾今日為汝極言於上事當決矣既見上言將士有功為朝廷所抑詞氣憤厲忤於上上大怒令左右殺之既而悔追之不及因下詔罪萬歲曰柱國太平公萬歲拔擢委任每總戎機往以南寧逆亂令其出討而昆州刺史爨玩包藏逆心為民興患朕備有成勑令將入朝萬歲乃多受金銀違勑令住致爨玩尋為反逆更勞師旅方始平定所司檢校罪合極刑捨過念功恕其性命年月未久即復本官近復總戎進討蕃裔突厥達頭可汗領其凶衆欲相拒抗既見軍威便即奔退兵不血刃賊徒瓦解如此稱捷國家盛事朕欲成其勳庸復加褒賞而萬歲定和通簿之日乃懷姦詐妄稱逆面交兵不以實陳懷反覆之方弄國家之法若竭誠立節心無虛罔者乃為良將至如萬歲懷詐要功便是國賊朝憲難虧不可再捨死之日天下士庶聞者識與不識莫不寃惜萬歲為將不治營伍令士卒各隨所安無警夜之備虜亦不敢犯臨陳對敵應變無方號為良將有子懷義劉方馮昱王襀李充楊武通陳永貴房兆劉方京兆長安人也性剛決有膽氣仕周承御上士尋以戰功拜上儀同高祖為丞相方從韋孝寬破尉迥於相州以功加開府賜爵河陰縣侯邑八百戶高祖受禪進爵為公開皇三年從衛王爽破突厥於白道進位大將軍其後歷甘瓜二州刺史尚未知名仁壽中會交州俚人李佛子作亂據越王故城遣其兄子大權據龍編城其別帥李普鼎據烏延城左僕射楊素言方有將帥之略上於是詔方為交州道行軍總管以度支侍郎敬德亮為長史統二十七營而進方法令嚴肅軍容齊整有犯禁者造次斬之然仁而愛士有疾病者親自撫養長史敬德亮從軍至尹州疾甚不能進留之州館分別之際方哀其危篤流涕嗚咽感動行路其有威惠如此論者稱為良將至都隆嶺遇賊二千餘人來犯官軍方遣營主宋纂何貴嚴願等擊破之進兵臨佛子先令人諭以禍褔佛子懼而降送於京師其有桀黠者恐於後為亂皆斬之尋授歡州道行軍總管以尚書右丞李綱為司馬經略林邑方遣欽州刺史寧長真歡州刺史李暈上開府秦雄以步騎出越常方親率大將軍張遜司馬李綱舟師趣比景高祖崩煬帝即位大業元年正月軍至海口林邑王梵志遣兵守險方擊走之師次闍黎江賊據南岸立柵方盛陳旗幟擊金鼓賊懼而潰既渡江行三十里賊乘巨象四面而至方以弩射象象中創却蹂其陳王師力戰賊奔於柵因攻破之俘馘萬計於是濟區粟度六里前後逢賊每戰必擒進至大緣江賊據險為柵又擊破之徑馬援銅柱南行八日至其國都林邑王梵志棄城奔海獲其廟主金人污其宮室刻石紀功而還士卒腳腫死者十四五方在道遇患而卒帝甚傷惜之乃下詔曰方肅承廟略恭行天討飲冰遄邁視險若夷摧鋒直指出其不意鯨鯢盡殪巢穴咸傾役不再勞肅清海外致身王事誠績可嘉可贈上柱國盧國公子通仁嗣開皇時有馮昱王襀李充楊武通陳永貴房兆俱為邊將名顯當時昱襀並不知何許人也昱多權略有武藝高祖初為丞相以行軍總管與王誼李威等討叛蠻平之拜柱國開皇初又以行軍總管屯乙弗泊以備胡突厥數萬騎來掩之昱力戰纍日衆寡不敵竟為虜所敗亡失數千人殺虜亦過當其後備邊數年每戰常大克捷襀驍勇善射高祖以其有將帥才每以行軍總管屯兵江北禦陳寇數有戰功為陳人所憚伐陳之役及高智慧反攻討皆有殊績官至柱國白水郡公充隴西成紀人也少慷慨有英略開皇中頻以行軍總管擊突厥有功官至上柱國武陽郡公拜朔州總管甚有威名為虜所憚後有人譖其謀反徵還京師上譴怒之充性素剛遂憂憤而卒武通弘農華陰人性果烈善馳射數以行軍總管討西南夷每有功封白水郡公拜左武衛大將軍時党項羌屢為邊患朝廷以其有威名歷岷蘭二州總管以鎮之後與周法尚討嘉州叛獠法尚軍初不利武通率數千人為賊斷其歸路武通於是束馬懸車出賊不意頻戰破之賊知其孤軍無援傾部落而至武通轉鬬數百里為賊所拒四面路絶武通輕騎接戰墜馬為賊所執殺而噉之永貴隴右胡人也本姓白氏以勇烈知名高祖甚親愛之數以行軍總管鎮邊每戰必單騎陷陳官至柱國蘭利二州總管封北陳郡公兆代人也本姓屋引氏剛毅有武略頻為行軍總管擊胡以功官至柱國徐州總管並史失其事史臣曰長儒等結髮從戎俱有驍雄之略總統師旅各擅禦侮之功長儒以步卒二千抗十萬之虜師殲矢盡勇氣彌厲壯哉子幹西涉青海北臨玄塞胡夷懾憚烽候無警亦有可稱萬歲實懷智勇善撫士卒人皆樂死師不疲勞北却胸奴南平夷獠兵鋒所指威驚絶域論功杖氣犯忤貴臣偏聽生姦死非其罪人皆痛惜有李廣之風焉劉方號令無私治軍嚴肅克剪林邑遂清南海徼外百蠻無思不服凡此諸將志烈過人出當推轂之重入受爪牙之寄雖馬伏波之威行南裔趙充國之聲動西羌語事論功各一時也

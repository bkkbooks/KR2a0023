body:
  text: 隋書卷四十九列傳第十四牛弘牛弘字里仁安定鶉觚人也本姓氏祖熾郡中正父允魏侍中工部尚書臨涇公賜姓為牛氏弘初在襁褓有相者見之謂其父曰此兒當貴善愛養之及長鬚貌甚偉性寬裕好學博聞在周起家中外府記室內史上士俄轉納言上士專掌文翰甚有美稱加威烈將軍員外散騎侍郎修起居其後襲封臨涇公宣政元年轉內史下大夫進位使持節大將軍儀同三司開皇初遷授散騎常侍祕書監弘以典籍遺逸上表請開獻書之路曰經籍所興由來尚矣爻畫肇於庖羲文字生於蒼頡聖人所以弘宣教導博通古今揚於王庭肆於時夏故堯稱至聖猶考古道而言舜其大智尚觀古人之象周官外史掌三皇五帝之書及四方之志武王問黃帝顓頊之道太公曰在丹書是知握符御曆有國有家者曷嘗不以詩書而為教因禮樂而成功也昔周德既衰舊經紊棄孔子以大聖之才開素王之業憲章祖述制禮刊詩正五始而修春秋闡十翼而弘易道治國立身作範垂法及秦皇馭宇吞滅諸侯任用威力事不師古始下焚書之令行偶語之刑先王墳籍掃地皆盡本既先亡從而顛覆臣以圖讖言之經典盛衰信有徵數此則書之一厄也漢興改秦之弊敦尚儒術建藏書之策置校書之官屋壁山巖往往間出外有太常太史之藏內有延閣祕書之府至孝成之世亡逸尚多遣謁者陳農求遺書於天下詔劉向父子讎校篇籍漢之典文於斯為盛及王莽之末長安兵起宮室圖書並從焚燼此則書之二厄也光武嗣興尤重經誥未及下車先求文雅於是鴻生巨儒繼踵而集懷經負帙不遠斯至肅宗親臨講肄和帝數幸書林其蘭臺石室鴻都東觀祕牒填委更倍於前及孝獻移都吏民擾亂圖書縑帛皆取為帷囊所收而西裁七十餘乘屬西京大亂一時燔蕩此則書之三厄也魏文代漢更集經典皆藏在祕書內外三閣遣祕書郎鄭默刪定舊文時之論者美其朱紫有別晉氏承之文籍尤廣晉祕書監荀勗定魏內經更著新簿雖古文舊簡猶云有缺新章後録鳩集已多足得恢弘正道訓範當世屬劉石憑陵京華覆滅朝章國典從而失墜此則書之四厄也永嘉之後寇竊競興因河據洛跨秦帶趙論其建國立家雖傳名號憲章禮樂寂滅無聞劉裕平姚收其圖籍五經子史才四千卷皆赤軸青紙文字古拙僭偽之盛莫過二秦以此而論足可明矣故知衣冠軌物圖畫記注播遷之餘皆歸江左晉宋之際學藝為多齊梁之間經史彌盛宋祕書丞王儉依劉氏七略撰為七志梁人阮孝緒亦為七録總其書數三萬餘卷及侯景渡江破滅梁室祕省經籍雖從兵火其文德殿內書史宛然猶存蕭繹據有江陵遣將破平侯景收文德之書及公私典籍重本七萬餘卷悉送荊州故江表圖書因斯盡萃於繹矣及周師入郢繹悉焚之於外城所收十才一二此則書之五厄也後魏爰自幽方遷宅伊洛日不暇給經籍闕如周氏創基關右戎車未息保定之始書止八千後加收集方盈萬卷高氏據有山東初亦採訪驗其本目殘缺猶多及東夏初平獲其經史四部重雜三萬餘卷所益舊書五千而已今御書單本合一萬五千餘卷部帙之間仍有殘缺比梁之舊目止有其半至於陰陽河洛之篇醫方圖譜之説彌復為少臣以經書自仲尼已後迄于當今年踰千載數遭五厄興集之期屬膺聖世伏惟陛下受天明命君臨區宇功無與二德冠往初自華夏分離彝倫攸斁其間雖霸王遞起而世難未夷欲崇儒業時或未可今土宇邁於三王民黎盛於兩漢有人有時正在今日方當大弘文教納俗升平而天下圖書尚有遺逸非所以仰協聖情流訓無窮者也臣史籍是司寢興懷懼昔陸賈奏漢祖云天下不可馬上治之故知經邦立政在於典謨矣為國之本莫此攸先今祕藏見書亦足披覽但一時載籍須令大備不可王府所無私家乃有然士民殷雜求訪難知縱有知者多懷吝惜必須勒之以天威引之以微利若猥發明詔兼開購賞則異典必臻觀閣斯積重道之風超於前世不亦善乎伏願天監少垂照察上納之於是下詔獻書一卷賚縑一匹一二年間篇籍稍備進爵奇章郡公邑千五百戶三年拜禮部尚書奉勑修撰五禮勒成百卷行於當世弘請依古制修立明堂上議曰竊謂明堂者所以通神靈感天地出教化崇有德孝經曰宗祀文王於明堂以配上帝祭義云祀于明堂教諸侯孝也黃帝曰合宮堯曰五府舜曰總章布政興治由來尚矣周官考工記曰夏后氏世室堂修二七廣四修一鄭玄注云修十四步其廣益以四分修之一則堂廣十七步半也殷人重屋堂修七尋四阿重屋鄭云其修七尋廣九尋也周人明堂度九尺之筵南北七筵五室凡室二筵鄭云此三者或舉宗廟或舉王寢或舉明堂互言之明其同制也馬融王肅干寶所注與鄭亦異今不具出漢司徒馬宮議云夏后氏世室室顯於堂故命以室殷人重屋屋顯於堂故命以屋周人明堂堂大於夏室故命以堂夏后氏益其堂之廣百四十四尺周人明堂以為兩序間大夏后氏七十二尺若據鄭玄之説則夏室大於周堂如依馬宮之言則周堂大於夏室後王轉文周大為是但宮之所言未詳其義此皆去聖久遠禮文殘缺先儒解説家異人殊鄭注玉藻亦云宗廟路寢與明堂同制王制曰寢不踰廟明大小是同今依鄭玄注每室及堂止有一丈八尺四壁之外四尺有餘若以宗廟論之祫享之時周人旅酬六尸并后稷為七先公昭穆二尸先王昭穆二尸合十一尸三十六主及君北面行事於二丈之堂愚不及此若以正寢論之便須朝宴據燕禮諸侯宴則賓及卿大夫脫屨升坐是知天子宴則三公九卿並須升堂燕義又云席小卿次上卿言皆侍席止於二筵之間豈得行禮若以明堂論之總享之時五帝各於其室設青帝之位須於木室之內少北西面太昊從食坐於其西近南北面祖宗配享者又於青帝之南稍退西面丈八之室神位有三加以簠簋邊豆牛羊之俎四海九州美物咸設復須席上升歌出樽反坫揖讓升降亦以隘矣據茲而説近是不然案劉向別録及馬宮蔡雍等所見當時有古文明堂禮王居明堂禮明堂圖明堂大圖明堂陰陽太山通義魏文侯孝經傳等並説古明堂之事其書皆亡莫得而正今明堂月令者鄭玄云是呂不韋著春秋十二紀之首章禮家鈔合為記蔡雍王肅云周公所作周書內有月令第五十三即此也各有證明文多不載束以為夏時之書劉瓛云不韋鳩集儒者尋于聖王月令之事而記之不韋安能獨為此記今案不得全稱周書亦未可即為秦典其內雜有虞夏殷周之法皆聖王仁恕之政也蔡雍具為章句又論之曰明堂者所以宗祀其祖以配上帝也夏后氏曰世室殷人曰重屋周人曰明堂東曰青陽南曰明堂西曰總章北曰玄堂內曰太室聖人南面而聽向明而治人君之位莫不正焉故雖有五名而主以明堂也制度之數各有所依堂方一百四十四尺坤之策也屋圓楣徑二百一十六尺乾之策也太廟明堂方六丈通天屋徑九丈陰陽九六之變且圓蓋方覆九六之道也八闥以象卦九室以象州十二宮以應日辰三十六戶七十二牖以四戶八牖乘九宮之數也戶皆外設而不閉示天下以不藏也通天屋高八十一尺黃鍾九九之實也二十八柱布四方四方七宿之象也堂高三尺以應三統四向五色各象其行水闊二十四丈象二十四氣於外以象四海王者之大禮也觀其模範天地則象陰陽必據古文義不虛出今若直取考工不參月令青陽總章之號不得而稱九月享帝之禮不得而用漢代二京所建與此説悉同建安之後海內大亂京邑焚燒憲章泯絶魏氏三方未平無聞興造晉則侍中裴頠議曰尊祖配天其義明著而廟宇之制理據未分宜可直為一殿以崇嚴父之祀其餘雜碎一皆除之宋齊已還咸率茲禮此乃世乏通儒時無思術前王盛事於是不行後魏代都所造出自李沖三三相重合為九室簷不覆基房間通街穿鑿處多迄無可取及遷宅洛陽更加營構五九紛競遂至不成宗配之事於焉靡託今皇猷遐闡化覃海外方建大禮垂之無窮弘等不以庸虛謬當議限今檢明堂必須五室者何尚書帝命驗曰帝者承天立五府赤曰文祖黃曰神斗白曰顯紀黑曰玄矩蒼曰靈府鄭玄注曰五府與周之明堂同矣且三代相沿多有損益至於五室確然不變夫室以祭天天實有五若立九室四無所用布政視朔自依其辰鄭司農云十二月分在青陽等左右之位不云居室鄭玄亦言每月於其時之堂而聽政焉禮圖畫個皆在堂偏是以須為五室明堂必須上圓下方者何孝經援神契曰明堂者上圓下方八窗四達布政之宮禮記盛德篇曰明堂四戶八牖上圓下方五經異義稱講學大夫淳于登亦云上圓下方鄭玄同之是以須為圓方明堂必須重屋者何案考工記夏言九階四旁兩夾窗門堂三之二室三之一殷周不言者明一同夏制殷言四阿重屋周承其後不言屋制亦盡同可知也其殷人重屋之下本無五室之文鄭注云五室者亦據夏以知之明周不云重屋因殷則有灼然可見禮記明堂位曰太廟天子明堂言魯為周公之故得用天子禮樂魯之太廟與周之明堂同又曰復廟重簷刮楹達嚮天子之廟飾鄭注復廟重屋也據廟既重屋明堂亦不疑矣春秋文公十三年太室屋壞五行志曰前堂曰太廟中央曰太室屋其上重者也服虔亦云太室太廟太室之上屋也周書作洛篇曰乃立太廟宗宮路寢明堂咸有四阿反坫重亢重廊孔朝注曰重亢纍棟重廊纍屋也依黃圖所載漢之宗廟皆為重屋此去古猶近遺法尚在是以須為重屋明堂必須為辟雍者何禮記盛德篇云明堂者明諸侯尊卑也外水曰辟雍明堂陰陽録曰明堂之制周圜行水左旋以象天內有太室以象紫宮此明堂有水之明文也然馬宮王肅以為明堂辟雍太學同處蔡雍盧植亦以為明堂靈臺辟雍太學同實異名雍云明堂者取其宗祀之清貌則謂之清廟取其正室則曰太室取其堂則曰明堂取其四門之學則曰太學取其周水圜如璧則曰璧雍其實一也其言別者五經通義曰靈臺以望氣明堂以布政辟雍以養老教學三者不同袁準鄭玄亦以為別歷代所疑豈能輒定今據郊祀志云欲治明堂未曉其制濟南人公玉帶上黃帝時明堂圖一殿無壁蓋之以茅水圜宮垣天子從之以此而言其來則久漢中元二年起明堂辟雍靈臺於洛陽並別處然明堂亦有壁水李尤明堂銘云流水洋洋是也以此須有辟雍夫帝王作事必師古昔今造明堂須以禮經為本形制依於周法度數取於月令遺闕之處參以餘書庶使該詳沿革之理其五室九階上圓下方四阿重屋四旁兩門依考工記孝經説堂方一百四十四尺屋圓楣徑二百一十六尺太室方六丈通天屋徑九丈八闥二十八柱堂高三尺四向五色依周書月令論殿垣方在內水周如外水內徑三百步依太山盛德記覲禮經仰觀俯察皆有則象足以盡誠上帝祗配祖宗弘風布教作範於後矣弘等學不稽古輒申所見可否之宜伏聽裁擇上以時事草創未遑制作竟寢不行六年除太常卿九年詔改定雅樂又作樂府歌詞撰定圓丘五帝凱樂并議樂事弘上議云謹案禮五聲六律十二管還相為宮周禮奏黃鍾歌大呂奏太簇歌應鍾皆是旋相為宮之義蔡雍明堂月令章句曰孟春月則太簇為宮姑洗為商蕤賓為角南呂為徵應鍾為羽大呂為變宮夷則為變徵他月倣此故先王之作律呂也所以辨天地四方陰陽之聲揚子雲曰聲生於律律生於辰故律呂配五行通八風歷十二辰行十二月循環轉運義無停止譬如立春木王火相立夏火王土相季夏餘分土王金相立秋金王水相立冬水王木相還相為宮者謂當其王月名之為宮今若十一月不以黃鍾為宮十三月不以太簇為宮便是春木不王夏王不相豈不陰陽失度天地不通哉劉歆鍾律書云春宮秋律百卉必雕秋宮春律萬物必榮夏宮冬律雨雹必降冬宮夏律雷必發聲以斯而論誠為不易且律十二今直為黃鍾一均唯用七律以外五律竟復何施恐失聖人制作本意故須依禮作還相為宮之法上曰不須作旋相為宮且作黃鍾一均也弘又論六十律不可行謹案續漢書律曆志元帝遣韋玄成問京房於樂府房對受學故小黃令焦延壽六十律相生之法以上生下皆三生二以下生上皆三生四陽下生陰陰上生陽終於中呂而十二律畢矣中呂上生執始執始下生去滅上下相生終於南事六十律畢矣十二律之變至於六十猶八卦之變至於六十四也冬至之聲以黃鍾為宮太簇為商姑洗為角林鍾為徵南呂為羽應鍾為變宮蕤賓為變徵此聲氣之元五音之正也故各統一日其餘以次運行當日者各自為宮而商徵以類從焉房又曰竹聲不可以度調故作準以定數準之狀如瑟長一丈而十三絃隱間九尺以應黃鍾之律九寸中央一絃下畫分寸以為六十律清濁之節執始之類皆房自造房云受法於焦延壽未知延壽所承也至元和年待詔候鍾律殷彤上言官無曉六十律以準調音者故待詔嚴崇具以準法教其子宣願召宣補學官主調樂器大史丞弘試宣十二律其二中其四不中其六不知何律宣遂罷自此律家莫能為準施絃熹平年東觀召典律者太子舍人張光問準意光等不知歸閲舊藏乃得其器形制如房書猶不能定其絃緩急故史官能辨清濁者遂絶其可以相傳者唯大榷常數及候氣而已據此而論京房之法漢世已不能行沈約宋志曰詳案古典及今音家六十律無施於樂禮云十二管還相為宮不言六十封禪書云大帝使素女鼓五十絃瑟而悲破為二十五絃假令六十律為樂得成亦所不用取大樂必易大禮必簡之意也又議曰案周官云大司樂掌成均之法鄭衆注云均調也樂師主調其音三禮義宗稱周官奏黃鍾者用黃鍾為調歌大呂者用大呂為調奏者謂堂下四懸歌者謂堂上所歌但一祭之間皆用二調是知據宮稱調其義一也明六律六呂迭相為宮各自為調今見行之樂用黃鍾之宮乃以林鍾為調與古典有違晉內書監荀勗依典記以五聲十二律還相為宮之法制十二笛黃鍾之笛正聲應黃鍾下徵應林鍾以姑洗為清角大呂之笛正聲應大呂下徵應夷則以外諸均例皆如是然今所用林鍾是勗下徵之調不取其正先用其下於理未通故須改之上甚善其議詔弘與姚察許善心何妥虞世基等正定新樂事在音律志是後議置明堂詔弘條上故事議其得失事在禮志上甚敬重之時楊素恃才矜貴輕侮朝臣唯見弘未嘗不改容自肅素將擊突厥詣太常與弘言別弘送素至中門而止素謂弘曰大將出征故來別何相送之近也弘遂揖而退素笑曰奇章公可謂其智可及其愚不可及也亦不以屑懷尋授大將軍拜吏部尚書時高祖又令弘與楊素蘇威薛道衡許善心虞世基崔子發等並召諸儒論新禮降殺輕重弘所立議衆咸推服之仁壽二年獻皇后崩三公已下不能定其儀注楊素謂弘曰公舊學時賢所仰今日之事決在於公弘了不辭讓斯須之間儀注悉備皆有故實素歎曰衣冠禮樂盡在此矣非吾所及也弘以三年之喪祥禫具有降殺期服十一月而練者無所象法以聞於高祖高祖納焉下詔除期練之禮自弘始也弘在吏部其選舉先德行而後文才務在審慎雖致停緩所有進用並多稱職吏部侍郎高孝基鑒賞機晤清慎絶倫然爽俊有餘迹似輕薄時宰多以此疑之唯弘深識其真推心委任隋之選舉於斯為最時論彌服弘識度之遠煬帝之在東宮也數有詩書遺弘弘亦有答及嗣位之後嘗賜弘詩曰晉家山吏部魏世盧尚書莫言先哲異奇才並佐余學行敦時俗道素乃沖虛納言雲閣上禮儀皇運初彝倫欣有垂拱事端居其同被賜詩者至於文詞贊揚無如弘美大業二年進位上大將軍三年改為右光祿大夫從拜嶽壇場圭幣墠畤牲牢並弘所定還下太行煬帝嘗引入內帳對皇后賜以同席飲食其禮遇親重如此弘謂其諸子曰吾受非常之遇荷恩深重汝等子孫宜以誠敬自立以答恩遇之隆也六年從幸江都其年十一月卒於江都郡時年六十六帝傷惜之賵贈甚厚歸葬安定贈開府儀同三司光祿大夫文安侯諡曰憲弘榮寵當世而車服卑儉事上盡禮待下以仁訥於言而敏於行上嘗令其宣勑弘至階下不能言退還拜謝云並忘之上曰傳語小辨故非宰臣任也愈稱其質直大業之世委遇彌隆性寬厚篤志於學雖職務繁雜書不釋手隋室舊臣始終信任悔吝不及唯弘一人而已有弟曰弼好酒而酗嘗因醉射殺弘駕車牛弘來還宅其妻迎謂之曰叔射殺牛矣弘聞之無所怪問直答云作脯坐定其妻又曰叔忽射殺牛大是異事弘曰已知之矣顏色自若讀書不輟其寬和如此有文集十三卷行於世長子方大亦有學業官至內史舍人次子方裕性凶險無人心從幸江都與裴虔通等同謀弒逆事見司馬德戡傳史臣曰牛弘篤好墳籍學優而仕有淡雅之風懷曠遠之度採百王之損益成一代之典章漢之叔孫不能尚也綢繆省闥三十餘年夷險不渝始終無際雖開物成務非其所長然澄之不清混之不濁可謂大雅君子矣子實不才崇基不構干紀犯義以墜家風惜哉

body:
  text: 隋書卷六十四列傳第二十九李圓通李圓通京兆涇陽人也父景以軍士隸武元皇帝因與家僮黑女私生圓通景不之認由是孤賤給使高祖家及為隋國公擢授參軍事初高祖少時每宴賓客令圓通監圓通性嚴整左右婢僕咸所敬憚唯世子乳母恃寵輕之賓客未供每有干請圓通不許或輒持去圓通大怒叱人撾之數十叫呼之聲徹於閣內僚吏左右代其失色賓去之後高祖具知之召圓通命坐賜食從此獨善之以為堪當大任高祖作相賜封懷昌男久之授帥都督進爵新安子委以心膂圓通多力徑捷長於武用周氏諸王素憚高祖每伺高祖之隙圖為不利賴圓通保護獲免者數矣高祖深感之由是參預政事授相國外兵曹仍領左親信尋授上儀同高祖受禪拜內史侍郎領左衛長史進爵為伯歷左右庶子給事黃門侍郎尚書左丞攝刑部尚書深被任信後以左丞領左翊衛驃騎將軍伐陳之役圓通以行軍總管從楊素出信州道以功進位大將軍進封萬安縣侯拜揚州總管長史尋轉並州總管長史秦孝王仁柔自善少斷決府中事多決於圓通入為司農卿治粟內史遷刑部尚書後數歲復為並州長史孝王以奢侈得罪圓通亦坐免官尋檢校刑部尚書事仁壽中以勳舊進爵郡公煬帝嗣位拜兵部尚書帝幸揚州以圓通留守京師判宇文述田以還民述訴其受賂帝怒而徵之見帝於洛陽坐是免官圓通憂懼發疾而卒贈柱國封爵悉如故子孝常大業末為華陰令陳茂陳茂河東猗氏人也家世寒微質直恭謹為州里所敬高祖為隋國公引為僚佐遇待與圓通等每令典家事未嘗不稱旨高祖善之後從高祖與齊師戰於晉州賊甚盛高祖將挑戰茂固止不得因捉馬鞚高祖忿之拔刀斫其額流血被面詞氣不撓高祖感而謝之厚加禮敬其後官至上士高祖為丞相委以心膂及受禪拜給事黃門侍郎封魏城縣男每典機密在官十餘年轉益州總管司馬遷太府卿進爵為伯後數載卒官子政嗣政字弘道倜儻有文武大略善鍾律便弓馬少養宮中年十七為太子千牛備身時京師大俠劉居士重政才氣數從之遊圓通子孝常與政相善並與居士交結及居士下獄誅政及孝常當從坐上以功臣子撻之二百而赦之由是不得調煬帝時授協律郎遷通事謁者兵曹承務郎帝美其才甚重之宇文化及之亂也以為太常卿後歸大唐卒於梁州總管張定和張定和字處謐京兆萬年人也少貧賤有志節初為侍官會平陳之役定和當從征無以自給其妻有嫁時衣服定和將鬻之妻靳固不與定和於是遂行以功拜儀同賜帛千匹遂棄其妻是後數以軍功加上開府驃騎將軍從上柱國李充擊突厥先登陷陳虜刺之中頸定和以草塞創而戰神氣自若虜遂敗走上聞而壯之遣使者齎藥馳詣定和所勞問之進位柱國封武安縣侯賞物二千段良馬二匹金百兩煬帝嗣位拜宜州刺史尋轉河內太守頗有惠政歲餘徵拜左屯衛大將軍從帝征吐谷渾至覆袁川時吐谷渾主與數騎而遁其名王詐為渾主保車我真山帝命定和率師擊之既與賊相遇輕其衆少呼之令降賊不肯下定和不被甲挺身登山賊伏兵於巖谷之下發矢中之而斃其亞將柳武建擊賊悉斬之帝為流涕贈光祿大夫時舊爵例除於是復封武安侯諡曰壯武贈絹千匹米千石子世立嗣尋拜為光祿大夫張奫張奫字文懿自云清河人也家於淮陰好讀兵書尤便刀楯周世鄉人郭子冀密引陳寇奫父雙欲率子弟擊之猶豫未決奫贊成其謀竟以破賊由是以勇決知名起家州主簿高祖作相授大都督領鄉兵賀若弼之鎮壽春也為間諜平陳之役頗有功焉進位開府儀同三司封文安縣子邑八百戶賜物二千五百段粟二千五百石歲餘率水軍破逆賊笮子游於京口薛子建於和州徵入朝拜大將軍高祖命升御坐而宴之謂奫曰卿可為朕兒朕為卿父今日聚集示無外也其後賜綺羅千匹緑沉甲獸文具裝尋從楊素征江表別破高智慧於會稽吳世華於臨海進位上大將軍賜奴婢六十口縑綵三百匹歷撫顯齊三州刺史俱有能名開皇十八年為行軍總管從漢王諒征遼東諸軍多物故奫衆獨全高祖善之賜物二百五十段仁壽中遷潭州總管在職三年卒有子孝廉麥鐵杖麥鐵杖始興人也驍勇有膂力日行五百里走及奔馬性疏誕使酒好交遊重信義每以漁獵為事不治産業陳太建中結聚為羣盜廣州刺史歐陽頠俘之以獻沒為官戶配執御傘每罷朝後行百餘里夜至南徐州踰城而入行光火劫盜旦還及時仍又執傘如此者十餘度物主識之州以狀奏朝士見鐵杖每旦在不之信也後數告變尚書蔡徵曰此可驗耳於仗下時購以百金求人送詔書與南徐州刺史鐵杖出應募齎勑而往明旦及奏事帝曰信然為盜明矣惜其勇捷誡而釋之陳亡後徙居清流縣遇江東反楊素遣鐵杖頭戴草束夜浮渡江覘賊中消息具知還報後復更往為賊所擒逆帥李稜遣兵仗三十人衛之縛送高智慧行至庱亭衛者憩食哀其餒解手以給其餐鐵杖取賊刀亂斬衛者殺之皆盡悉割其鼻懷之以歸素大奇之後叙戰勳不及鐵杖遇素馳驛歸于京師鐵杖步追之每夜則同宿素見而悟特奏授儀同三司以不識書放還鄉里成陽公李徹稱其驍武開皇十六年徵至京師除車騎將軍仍從楊素北征突厥加上開府煬帝即位漢王諒反於並州又從楊素擊之每戰先登進位柱國尋除萊州刺史無治名後轉汝南太守稍習法令羣盜屏跡後因朝集考功郎竇威嘲之曰麥是何姓鐵杖應口對曰麥豆不殊那忽相怪威赧然無以應之時人以為敏慧尋除右屯衛大將軍帝待之逾密鐵杖自以荷恩深重每懷竭命之志及遼東之役請為前鋒顧謂醫者吳景賢曰大丈夫性命自有所在豈能艾炷灸頞瓜蒂噴鼻治黃不差而臥死兒女手中乎將渡遼謂其三子曰阿奴當備淺色黃衫吾荷國恩今是死日我既被殺爾當富貴唯誠與孝爾其勉之及濟橋未成去東岸尚數丈賊大至鐵杖跳上岸與賊戰死武賁郎將錢士雄孟金叉亦死之左右更無及者帝為之流涕購得其尸下詔曰鐵杖志氣驍果夙著勳庸陪麾問罪先登陷陳節高義烈身殞功存興言至誠追懷傷悼宜賚殊榮用彰飾德可贈光祿大夫宿國公諡曰武烈子孟才嗣尋授光祿大夫孟才有二弟仲才季才俱拜正議大夫賵贈巨萬贈轀輬車給前後部羽葆鼓吹平壤道敗將宇文述等百餘人皆為執紼王公已下送至郊外士雄贈左光祿大夫右屯衛將軍武冖出蟲侯諡曰剛子傑嗣金叉贈右光祿大夫子善誼襲官孟才字智稜果烈有父風帝以孟才死節將子恩賜殊厚拜武賁郎將及江都之難慨然有復讎之志與武牙郎錢傑素交友二人相謂曰吾等世荷國恩門著誠節今賊臣弒逆社稷淪亡無節可紀何面目視息世間哉於是流涕扼腕遂相與謀糾合恩舊欲於顯福宮邀擊宇文化及事臨發陳藩之子謙知其謀而告之與其黨沈光俱為化及所害忠義之士哀焉沈光沈光字總持吳興人也父君道仕陳吏部侍郎陳滅家于長安皇太子勇引署學士後為漢王諒府掾諒敗除名光少驍捷善戲馬為天下之最略綜書記微有詞藻常慕立功名不拘小節家甚貧窶父兄並以傭書為事光獨跅弛交通輕俠為京師惡少年之所朋附人多贍遺得以養親每致甘食美服未嘗困匱初建禪定寺其中幡竿高十餘丈適遇繩絶非人力所及諸僧患之光見而謂僧曰可持繩來當相為上耳諸僧驚喜因取而與之光以口銜索拍竿而上直至龍頭繫繩畢手足皆放透空而下以掌拒地倒行數十步觀者駭悅莫不嗟異時人號為肉飛仙大業中煬帝徵天下驍果之士以伐遼左光預焉同類數萬人皆出其下光將詣行在所賓客送至灞上者百餘騎光酹酒而誓曰是行也若不能建立功名當死於高麗不復與諸君相見矣及從帝攻遼東以衝梯擊城竿長十五丈光升其端臨城與賊戰短兵接殺十數人賊競擊之而墜未及於地適遇竿有垂絙光接而復上帝望見壯異之馳召與語大悅即日拜朝請大夫賜寶刀良馬致左右親顧漸密未幾以為折衝郎將賞遇優重帝每推食解衣以賜之同輩莫與為比光自以荷恩深重思懷竭節及江都之難潛構義勇將為帝復讎先是帝寵昵官奴名為給使宇文化及以光驍勇方任之令其總統營於禁內時孟才錢傑等陰圖化及因謂光曰我等荷國厚恩不能死難以衛社稷斯則古人之所恥也今又俯首事讎受其驅率有靦面目何用生為吾必欲殺之死無所恨公義士也肯從我乎光泣下霑襟曰是所望於將軍也僕領給使數百人並荷先帝恩遇今在化及內營以此復讎如鷹鸇之逐鳥雀萬世之功在此一舉願將軍勉之孟才為將軍領江淮之衆數千人期以營將發時晨起襲化及光語泄陳謙告其事化及大懼曰此麥鐵杖子也及沈光者並勇決不可當須避其鋒是夜即與腹心走出營外留人告司馬德戡等遣領兵馬逮捕孟才光聞營內喧聲知事發不及被甲即襲化及營空無所獲值舍人元敏數而斬之遇德戡兵入四面圍合光大呼潰圍給使齊奮斬首數十級賊皆披靡德戡輒復遣騎持弓弩翼而射之光身無介胄遂為所害麾下數百人皆鬬而死一無降者時年二十八壯士聞之莫不為之隕涕來護兒來護兒字崇善江都人也幼而卓詭好立奇節初讀詩至擊鼓其鏜踊躍用兵羔裘豹飾孔武有力捨書而歎曰大丈夫在世當如是會為國滅賊以取功名安能區區久事隴畝羣輩驚其言而壯其志護兒所住白土村密邇江岸于時江南尚阻賀若弼之鎮壽州也常令護兒為間諜授大都督平陳之役護兒有功焉進位上開府從楊素擊高智慧于浙江而賊據岸為營周亘百餘里船艦被江鼓譟而進素令護兒率數百輕艓徑登江岸直掩其營破之時賊前與素戰不勝歸無所據因而潰散智慧將逃於海護兒追至泉州智慧窮蹙遁走閩越進位大將軍除泉州刺史時有盛道延擁兵作亂侵擾州境護兒進擊破之又從蒲山公李寬破汪文進於黟歙進位柱國仁壽三年除瀛州刺史賜爵黃縣公邑三千戶尋加上柱國除右禦衛將軍煬帝即位遷右驍衛大將軍帝甚親重之大業六年從駕江都賜物千段令上先人冢宴父老州里榮之數歲轉右翊衛大將軍遼東之役護兒率樓船指滄海入自浿水去平壤六十里與高麗相遇進擊大破之乘勝直造城下破其郛郭於是縱軍大掠稍失部伍高元弟建武募敢死士五百人邀擊之護兒因却屯營海浦以待期會後知宇文述等敗遂班師明年又出滄海道師次東萊會楊玄感作逆黎陽進逼鞏洛護兒勒兵與宇文述等擊破之封榮國公邑二千戶十年又帥師度海至卑奢城高麗舉國來戰護兒大破之斬首千餘級將趣平壤高元震懼遣使執叛臣斛斯政詣遼東城下上表請降帝許之遣人持節詔護兒旋師護兒集衆曰三度出兵未能平賊此還也不可重來今高麗困弊野無青草以我衆戰不日剋之吾欲進兵徑圍平壤取其僞主獻捷而歸答表請行不肯奉詔長史崔君肅固爭不許護兒曰賊勢破矣專以相任自足辦之吾在閫外事合專決豈容千里禀聽成規俄頃之間動失機會勞而無功故其宜也吾寧征得高元還而獲譴捨此成功所不能矣君肅告衆曰若從元帥違拒詔書必當聞奏皆獲罪也諸將懼盡勸還方始奉詔十三年轉為左翊衛大將軍進位開府儀同三司任委逾密前後賞賜不可勝計江都之難宇文化及忌而害之長子楷以父軍功授散騎郎朝散大夫楷弟弘仕至果毅郎將金紫光祿大夫弘弟整武賁郎將右光祿大夫整尤驍勇善撫士衆討擊羣盜所向皆捷諸賊甚憚之為作歌曰長白山頭百戰場十十五五把長槍不畏官軍十萬衆只畏榮公第六郎化及反皆遇害唯少子濟獲免魚俱羅魚俱羅馮翊下邽人也身長八尺膂力絶人聲氣雄壯言聞數百步弱冠為親衛纍遷大都督從晉王廣平陳以功拜開府賜物一千五百段未幾沈玄高智慧等作亂江南楊素以俱羅壯勇請與同行每戰有功加上開府高唐縣公拜疊州總管以母憂去職還至扶風會楊素率兵將出靈州道擊突厥路逢俱羅大悅遂奏與同行及遇賊俱羅與數騎奔擊瞋目大呼所當皆披靡出左入右往返若飛以功進位柱國拜豐州總管初突厥數入境為寇俱羅輒擒斬之自是突厥畏懼屏迹不敢畜牧於塞上初煬帝在藩俱羅弟贊以左右從纍遷大都督及帝嗣位拜車騎將軍贊性凶暴虐其部下令左右炙肉遇不中意以籤刺瞎其眼有溫酒不適者立斷其舌帝以贊藩邸之舊不忍加誅謂近臣曰弟既如此兄亦可知因召俱羅譴責之出贊於獄令自為計贊至家飲藥而死帝恐俱羅不自安慮生邊患轉為安州刺史歲餘遷趙郡太守後因朝集至東都與將軍梁伯隱有舊數相往來又從郡多將雜物以貢獻帝不受因遺權貴御史劾俱羅以郡將交通內臣帝大怒與伯隱俱坐除名未幾越巂飛山蠻作亂侵掠郡境詔俱羅白衣領將並率蜀郡都尉段鍾葵討平之大業九年重征高麗以俱羅為碣石道軍將及還江南劉元進作亂詔俱羅將兵向會稽諸郡逐捕之于時百姓思亂從盜如市俱羅擊賊帥朱燮管崇等戰無不捷然賊勢浸盛敗而復聚俱羅度賊非歲月可平諸子並在京洛又見天下漸亂終恐道路隔絶于時東都饑饉穀食踊貴俱羅遣家僕將船米至東都糶之益市財貨潛迎諸子朝廷微知之恐其有異志發使案驗使者至前後察問不得其罪帝復令大理司直梁敬真就鎖將詣東都俱羅相表異人目有重瞳陰為帝之所忌敬真希旨奏俱羅師徒敗衄於是斬東都市家口籍沒陳陵陳稜字長威廬江襄安人也祖碩以漁釣自給父峴少驍勇事章大寶為帳內部曲告大寶反授譙州刺史陳滅廢于家高智慧汪文進等作亂江南廬江豪傑亦舉兵相應以峴舊將共推為主峴欲拒之稜謂峴曰衆亂既作拒之禍且及己不如僞從別為後計峴然之時柱國李徹軍至當塗峴潛使稜至徹所請為內應徹上其事拜上大將軍宣州刺史封譙郡公邑一千戶詔徹應接之徹軍未至謀泄為其黨所殺稜僅以獲免上以其父之故拜開府尋領鄉兵煬帝即位授驃騎將軍大業三年拜武賁郎將後三歲與朝請大夫張鎮周發東陽兵萬餘人自義安泛海擊流求國月餘而至流求人初見船艦以為商旅往往詣軍中貿易稜率衆登岸遣鎮周為先鋒其主歡斯渴剌兜遣兵拒戰鎮周頻擊破之稜進至低沒檀洞其小王歡斯老模率兵拒戰稜擊敗之斬老模其日霧雨晦冥將士皆懼稜刑白馬以祭海神既而開霽分為五軍趣其都邑渴剌兜率衆數千逆拒稜遣鎮周又先鋒擊走之稜乘勝逐北至其柵渴剌兜背柵而陳稜盡鋭擊之從辰至未苦鬬不息渴剌兜自以軍疲引入柵稜遂填塹攻破其柵斬渴剌兜獲其子島槌虜男女數千而歸帝大悅進稜位右光祿大夫武賁如故鎮周金紫光祿大夫遼東之役以宿衛遷左光祿大夫明年帝復征遼東稜為東萊留守楊玄感之作亂也稜率衆萬餘人擊平黎陽斬玄感所署刺史元務本尋奉詔於江南營戰艦至彭城賊帥孟讓衆將十萬據都梁宮阻淮為固稜潛於下流而濟至江都率兵襲讓破之以功進位光祿大夫賜爵信安侯後帝幸江都宮俄而李子通據海陵左才相掠淮北杜伏威屯六合衆各數萬帝遣稜率宿衛兵擊之往往克捷超拜右禦衛將軍復渡清江擊宣城賊俄而帝以弒崩宇文化及引軍北上召稜守江都稜集衆縞素為煬帝發喪備儀衛改葬於吳公臺下衰杖送喪慟感行路論者深義之稜後為李子通所陷奔杜伏威伏威忌之尋而見害王辨斛斯萬善王辨字警略馮翊蒲城人也祖訓以行商致富魏世出粟助給軍糧為假清河太守辨少習兵書尤善騎射慷慨有大志在周以軍功授帥都督開皇初遷大都督仁壽中遷車騎將軍漢王諒之作亂也從楊素討平之賜爵武寧縣男邑三百戶後三歲遷尚舍奉御從征吐谷渾拜朝請大夫數年轉鷹揚郎將遼東之役以功加通議大夫尋遷武賁郎將及山東盜賊起上谷魏刀兒自號歷山飛衆十餘萬劫掠燕趙帝引辨升御榻問以方略辨論取賊形勢帝稱善曰誠如此計賊何足憂也於是發從行步騎三千擊敗之賜黃金二百兩明年渤海賊帥高士達自號東海公衆以萬數復令辨擊之屢挫其鋭帝在江都宮聞而馳召之及引見禮賜甚厚復令往信都經略士達於是復戰破之優詔褒顯時賊帥郝孝德孫宣雅時季康竇建德魏刀兒等往往屯聚大至十萬小至數千寇掠河北辨進兵擊之所往皆捷深為羣賊所憚及翟讓寇徐豫辨進頻擊走之讓尋與李密屯據洛口倉辨與王世充討密阻洛水相持經年辨率諸將攻敗密因薄其營戰破外柵密諸營已有潰者乘勝將入城世充不知恐將士勞倦於是鳴角收兵翻為密徒所乘官軍大潰不可救止辨至洛水橋已壞不得渡遂涉水至中流為溺人所引墜馬辨時身被重甲敗兵前後相蹈藉不能復上馬竟溺死焉時年五十六三軍莫不痛惜之河南斛斯萬善驍勇果毅與辨齊名大業中從衛玄討楊玄感頻戰有功及玄感敗走萬善與數騎追及之玄感窘迫自殺由是知名拜武賁郎將突厥始畢之圍雁門也萬善奮擊之所向皆破每賊至輒出當其鋒或下馬坐地引強弓射賊所中皆殪由是突厥莫敢逼城十許日竟退萬善之力也其後頻討羣盜纍功至將軍時有將軍鹿願范貴馮孝慈俱為將帥數從征討並有名於世然事皆亡失故史官無所述焉史臣曰楚漢未分絳灌所以宣力曹劉競逐關張所以立名然則名立資草昧之初力宣候經綸之會攀附鱗翼世有之矣圓通護兒之輩定和鐵杖之倫皆一時之壯士因於貧賤當其鬱抑未遇亦安知其有鴻鵠之志哉終能振拔污泥之中騰躍風雲之上符馬革之願快生平之心非遇其時焉能至於此也俱羅欲加之罪非其咎釁王辨殞身勍敵志實勤王陳稜縞素發喪哀感行路義之所動固已深乎孟才錢傑沈光等感恩懷舊臨難忘生雖功無所成其志有可稱矣

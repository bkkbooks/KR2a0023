body:
  text: 隋書卷七十一列傳第三十六誠節易稱聖人大寶曰位何以守位曰仁又云立人之道曰仁與義然則士之立身成名在乎仁義而已故仁道不遠則殺身以成仁義重於生則捐生而取義是以龍逢投軀於夏癸比干竭節於商辛申蒯斷臂於齊莊弘演納肝於衛懿爰逮漢之紀信欒布晉之向雄嵇紹凡在立名之士莫不庶幾焉至於臨難忘身見危授命雖斯文不墜而行之蓋寡固知士之所重信在茲乎非夫內懷鐵石之心外負凌霜之節孰能安之若命赴蹈如歸者也皇甫誕等當擾攘之際踐必死之機白刃臨頸確乎不拔可謂歲寒貞柏疾風徑草千載之後懍懍如生豈獨聞彼伯夷懦夫立志亦冀將來君子有所庶幾故掇採所聞為誠節傳劉弘劉弘字仲遠彭城叢亭里人魏太常卿芳之孫也少好學有行檢重節概仕齊行臺郎中襄城沛郡穀陽三郡太守西楚州刺史及齊亡周武帝以為本郡太守尉迥之亂也遣其將席毗掠徐兗弘勒兵拒之以功授儀同永昌太守齊州長史志在立功不安佐職平陳之役表請從軍以行軍長史從總管吐萬緒度江以功加上儀同封濩澤縣公拜泉州刺史會高智慧作亂以兵攻州弘城守百餘日救兵不至前後出戰死亡太半糧盡無所食與士卒數百人煮犀甲腰帶及剝樹皮而食之一無離叛賊知其飢餓欲降之弘抗節彌厲賊悉衆來攻城陷為賊所害上聞而嘉歎者久之賜物二千段子長信襲其官爵皇甫誕子無逸皇甫誕字玄慮安定烏氏人也祖和魏膠州刺史父璠周隋州刺史誕少剛毅有器局周畢王引為倉曹參軍高祖受禪為兵部侍郎數年出為魯州長史開皇中復入為比部刑部二曹侍郎俱有能名遷治書侍御史朝臣無不肅憚上以百姓多流亡令誕為河南道大使以檢括之及還奏事稱旨上甚悅令判大理少卿明年遷尚書右丞俄以母憂去職未期起令視事尋轉尚書左丞時漢王諒為並州總管朝廷盛選僚佐前後長史司馬皆一時名士上以誕公方著稱拜並州總管司馬總府政事一以咨之諒甚敬焉及煬帝即位徵諒入朝諒用咨議王頍之謀發兵作亂誕數諫止諒不納誕因流涕曰竊料大王兵資無敵京師者加以君臣位定逆順勢殊士馬雖精難以取勝願王奉詔入朝守臣子之節必有松喬之壽纍代之榮如更遷延陷身叛逆一挂刑書為布衣黔首不可得也願察區區之心思萬全之計敢以死請諒怒而囚之及楊素將至諒屯清源以拒之諒主簿豆盧育出誕於獄相與協謀閉城拒諒諒襲擊破之並抗節而遇害帝以誕亡身徇國嘉悼者久之下詔曰褒顯名節有國通規加等飾終抑惟令典並州總管司馬皇甫誕性理淹通志懷審正效官贊務聲績克宣值狂悖構禍凶威孔熾確殉單誠不從妖逆雖幽縶寇手而雅志彌厲遂潛與義徒據城抗拒衆寡不敵奄致非命可贈柱國封弘義公諡曰明子無逸嗣無逸尋為淯陽太守政甚有聲大業令行舊爵例除以無逸誠義之後賜爵平輿侯入為刑部侍郎守右武衛將軍初漢王諒之反也州縣莫不響應有嵐州司馬陶模繁畤令敬釗並抗節不從陶模陶模京兆人也性明敏有器幹仁壽初為嵐州司馬諒既作亂刺史喬鍾葵發兵將赴逆模拒之曰漢王所圖不軌公荷國厚恩致位方伯謂當竭誠效命以答慈造豈有大行皇帝梓宮未掩翻為厲階鍾葵失色曰司馬反邪臨之以兵辭氣不撓葵義而釋之軍吏進曰若不斬模何以壓衆心於是囚之於獄悉掠取資財分賜黨與及諒平煬帝嘉之拜開府授大興令楊玄感之反也率兵從衛玄擊之以功進位銀青光祿大夫卒官敬釗敬釗字積善河東蒲坂人也父元約周布憲中大夫釗仁壽中為繁畤令甚有能名及賊至力戰城陷賊帥墨弼掠其資産而臨之以兵釗辭氣不撓弼義而止之執送於偽將喬鍾葵所鍾葵釋之署為代州總管司馬釗正色拒之至於再三鍾葵忿然曰受官則可不然當斬釗答曰忝為縣宰遭逢逆亂進不能保境退不能死節為辱已多何乃復以偽官相迫也死生唯命餘非所聞鍾葵怒甚熟視釗曰卿不畏死邪復將殺之會楊義臣軍至鍾葵遽出戰因而大敗釗遂得免大業三年煬帝避暑汾陽宮代州長史柳銓司馬崔寶山上其狀付有司將加褒賞會虞世基奏格而止後遷朝邑令未幾終遊元遊元字楚客廣平任人魏五更明根之玄孫也父寶藏位至太守元少聰敏年十六齊司徒徐顯秀引為參軍事周武帝平齊之後歷壽春令譙州司馬俱有能名開皇中為殿內侍御史晉王廣為揚州總管以元為法曹參軍父憂去職後為內直監煬帝嗣位遷尚書度支郎遼東之役領左驍衛長史為蓋牟道監軍拜朝請大夫兼治書侍御史宇文述等九軍敗績帝令元按其獄述時貴幸其子士及又尚南陽公主勢傾朝廷遣家僮造元有所請屬元不之見他日數述曰公地屬親賢腹心是寄當咎身責己以勸事君乃遣人相造欲何所道按之愈急仍以狀劾之帝嘉其公正賜朝服一襲九年奉使於黎陽督運楊玄感作逆乃謂元曰獨夫肆虐天下士大夫肝腦塗地加以陷身絶域之所軍糧斷絶此亦天亡之時也我今親率義兵以誅無道卿意如何元正色答曰尊公荷國寵靈功參佐命高官重祿近古莫儔公之弟兄青紫交映當謂竭誠盡節上答鴻恩豈意墳土未乾親圖反噬深為明公不取願思禍福之端僕有死而已不敢聞命玄感怒而囚之屢脅以兵竟不屈節於是害之帝甚嘉歎贈銀青光祿大夫賜縑五百匹拜其子仁宗為正議大夫弋陽郡通守馮慈明馮慈明字無佚信都長樂人也父子琮仕齊官至尚書右僕射慈明在齊以戚屬之故年十四為淮陽王開府參軍事尋補司州主簿進除中書舍人周武平齊授帥都督高祖受禪開三府官除司空司倉參軍事纍遷行臺禮部侍郎晉王廣為並州總管盛選僚屬以慈明為司士後歷吏部員外郎兼內史舍人煬帝即位以母憂去職帝以慈明始事藩邸後更在臺意甚銜之至是謫為伊吾鎮副未之官轉交址郡丞大業九年被徵入朝時兵部侍郎斛斯政亡奔高麗帝見慈明深慰勉之俄拜尚書兵曹郎加位朝請大夫十三年攝江都郡丞事李密之逼東都也詔令慈明安集瀍洛追兵擊密至鄢陵為密黨崔樞所執密延慈明於坐勞苦之因而謂曰隋祚已盡區宇沸騰吾躬率義兵所向無敵東都危急計日將下今欲率四方之衆問罪於江都卿以為何如慈明答曰慈明直道事人有死而已不義之言非所敢對密不悅冀其後改厚加禮焉慈明潛使人奉表江都及致書東都留守論賊形勢密知其狀又義而釋之出至營門賊帥翟讓怒曰爾為使人為我所執魏公相待至厚曾無感戴寧有畏乎慈明勃然曰天子使我來正欲除爾輩不圖為賊黨所獲我豈從汝求活耶欲殺但殺何須罵詈因謂羣賊曰汝等本無惡心因飢饉逐食至此官軍且至早為身計讓益怒於是亂刀斬之時年六十八梁郡通守楊汪上狀帝歎惜之贈銀青光祿大夫拜其二子惇怦俱為尚書承務郎王充推越王侗為主重贈柱國戶部尚書昌黎郡公諡曰壯武長子忱先在東都王充破李密忱亦在軍中遂遣奴負父尸柩詣東都身不自送未幾又盛花燭納室時論醜之張須張須弘農閿鄉人也性剛烈有勇略弱冠從史萬歲討西爨以功授儀同賜物三百段煬帝嗣位漢王諒作亂並州從楊素擊平之加開府大業中為齊郡丞會興遼東之役百姓失業又屬歲飢穀米踊貴須將開倉賑給官屬咸曰須待詔勑不可擅與須曰今帝在遠遣使往來必淹歲序百姓有倒懸之急如待報至當委溝壑矣吾若以此獲罪死無所恨先開倉而後上狀帝知之而不責也明年賊帥王薄聚結亡命數萬人寇掠郡境官軍擊之多不利須發兵拒之薄遂引軍南轉掠魯郡須躡之及于岱山之下薄恃驟勝不設備須選精鋭出其不意擊之薄衆大潰因乘勝斬首數千級薄收合亡散得萬餘人將北度河須追之至臨邑復破之斬五千餘級獲六畜萬計時天下承平日久多不習兵須獨勇決善戰又長於撫馭得士卒心論者號為名將薄復北戰連豆子賊孫宣雅石秪闍郝孝德等衆十餘萬攻章丘須遣舟師斷其津濟親率馬步二萬襲擊大破之賊徒散走既至津梁復為舟師所拒前後狼狽獲其家纍輜重不可勝計露布以聞帝大悅優詔褒揚令使者圖畫其形容而奏之其年賊裴長才石子河等衆二萬奄至城下縱兵大掠須未暇集兵親率五騎與戰賊競赴之圍百餘重身中數創勇氣彌厲會城中兵至賊稍却須督軍復戰長才敗走後數旬賊帥秦君弘郭方預等合軍圍北海兵鋒甚鋭須謂官屬曰賊自恃強謂我不能救吾今速去破之必矣於是簡精兵倍道而進賊果無備擊大破之斬數萬級獲輜重三千兩司隸刺史裴操之上狀帝遣使勞問之十年賊左孝友衆將十萬屯於蹲狗山須列八風營以逼之復分兵扼其要害孝友窘迫面縛來降其黨解象王良鄭大彪李晼等衆各萬計須悉討平之威振東夏以功遷齊郡通守領河南道十二郡黜陟討捕大使俄而賊盧明月衆十餘萬將寇河北次祝阿須邀擊殺數千人賊呂明星帥仁泰霍小漢等衆各萬餘擾濟北須進軍擊走之尋將兵拒東郡賊翟讓前後三十餘戰每破走之轉滎陽通守時李密説讓取洛口倉讓憚須不敢進密勸之讓遂與密率兵逼滎陽須拒之讓懼而退須乘之逐北十餘里時李密先伏數千人於林木間邀擊須軍遂敗績密與讓合軍圍之須潰圍輒出左右不能盡出須躍馬入救之來往數四衆皆敗散乃仰天曰兵敗如此何面見天子乎乃下馬戰死時年五十二其所部兵晝夜號哭數日不止越王侗遣左光祿大夫裴仁基招撫其衆移鎮武牢帝令其子元備總父兵元備時在齊郡遇賊竟不果行楊善會楊善會字敬仁弘農華陰人也父初官至毗陵太守善會大業中為鄃令以清正聞俄而山東飢饉百姓相聚為盜善會以左右數百人逐捕之往皆克捷其後賊帥張金稱衆數萬屯于縣界屠城剽邑郡縣莫能禦善會率勵所領與賊搏戰或日有數合每挫其鋒煬帝遣將軍段達來討金稱善會進計於達達不能用軍竟敗焉達深謝善會後復與賊戰進止一以謀之於是大克金稱復引渤海賊孫宣雅高士達等衆數十萬破黎陽而還軍鋒甚盛善會以徑兵千人邀擊破之擢拜朝請大夫清河郡丞金稱稍更屯聚以輕兵掠冠氏善會與平原通守楊元弘步騎數萬衆襲其本營武賁郎將王辨軍亦至金稱釋冠氏來援因與辨戰不利善會選精鋭五百赴之所當皆靡辨軍復振賊退守本營諸軍各還于時山東思亂從盜如市郡縣微弱陷沒相繼能抗賊者唯善會而已前後七百餘陳未嘗負敗每恨衆寡懸殊未能滅賊會太僕楊義臣討金稱復為賊所敗退保臨清取善會之策頻與決戰賊乃退走乘勝遂破其營盡俘其衆金稱將數百人遁逃後歸漳南招集餘黨善會追捕斬之傳首行在所帝賜以尚方甲矟弓劍進拜清河通守其年從楊義臣斬漳南賊帥高士達傳首江都宮帝下詔褒揚之士達所部將竇建德自號長樂王來攻信都臨清賊王安阻兵數千與建德相影響善會襲安斬之建德既下信都復擾清河善會逆拒之反為所敗嬰城固守賊圍之四旬城陷為賊所執建德釋而禮之用為貝州刺史善會罵之曰老賊何敢擬議國士恨吾力劣不能擒汝等我豈是汝屠酤兒輩敢欲更相吏邪臨之以兵辭氣不撓建德猶欲活之為其部下所請又知終不為己用於是害之清河士庶莫不傷痛焉獨孤盛獨孤盛上柱國楷之弟也性剛烈有膽氣煬帝在藩盛以左右從纍遷為車騎將軍及帝嗣位以藩邸之舊漸見親待纍轉為右屯衛將軍宇文化及之作亂也裴虔通引兵至成象殿宿衛者皆釋仗而走盛謂虔通曰何物兵形勢太異也虔通曰事勢已然不預將軍事將軍慎無動盛大罵曰老賊是何物語不及被甲與左右十餘人逆拒之為亂兵所殺越王侗稱制贈光祿大夫紀國公諡曰武節元文都元文都洵陽公孝矩之兄子也父孝則周小冢宰江陵總管文都性鯁直明辨有器幹仕周為右侍上士開皇初授內史舍人歷庫部考功二曹郎俱有能名擢為尚書左丞轉太府少卿煬帝嗣位轉司農少卿司隸大夫尋拜御史大夫坐事免未幾授太府卿帝漸任之甚有當時之譽大業十三年帝幸江都宮詔文都與段達皇甫無逸韋津等同為東都留守及帝崩文都與達津等共推越王侗為帝侗署文都為內史令開府儀同三司光祿大夫左驍衛大將軍攝右翊衛將軍魯國公既而宇文化及立秦王浩為帝擁兵至彭城所在響震文都諷侗遣使通於李密密於是請降因授官爵禮其使甚厚王充不悅因與文都有隙文都知之陰有誅充之計侗復以文都領御史大夫充固執而止盧楚説文都曰王充外軍一將耳本非留守之徒何得預吾事且洛口之敗罪不容誅今者敢懷跋扈宰制時政此而不除方為國患文都然之遂懷奏入殿事臨發有人以告充充時在朝堂懼而馳還含嘉城謀作亂文都頻遣呼之充稱疾不赴至夜作亂攻東太陽門而入拜於紫微觀下侗遣人謂之曰何為者充曰元文都盧楚謀相殺害請斬文都歸罪司寇侗見兵勢漸盛度終不免謂文都曰公自見王將軍也文都遷延而泣侗遣其署將軍黃桃樹執文都以出文都顧謂侗曰臣今朝亡陛下亦當夕及侗慟哭而遣之左右莫不憫默出至興教門充令左右亂斬之諸子並見害盧楚盧楚涿郡范陽人也祖景祚魏司空掾楚少有才學鯁急口吃言語澀難大業中為尚書右司郎當朝正色甚為公卿所憚及帝幸江都東都官僚多不奉法楚每存糾舉無所回避越王侗稱尊號以楚為內史令左備身將軍攝尚書左丞右光祿大夫封涿郡公與元文都等同心勠力以輔幼主及王充作亂兵攻太陽門武衛將軍皇甫無逸斬關逃難呼楚同去楚謂之曰僕與元公有約若社稷有難誓以俱死今捨去不義及兵入楚匿於太官署賊黨執之送於充所充奮袂令斬之於是鋒刃交下肢體糜碎劉子翊劉子翊彭城叢亭里人也父遍齊徐州司馬子翊少好學頗解屬文性剛謇有吏幹仕齊殿中將軍開皇初為南和丞纍轉秦州司法參軍事十八年入考功尚書右僕射楊素見而異之奏為侍御史時永寧令李公孝四歲喪母九歲外繼其後父更別娶後妻至是而亡河間劉炫以無撫育之恩議不解任子翊駁之曰傳云繼母如母與母同也當以配父之尊居母之位齊杖之制皆如親母又為人後者為其父母期報期者自以本生非殊親之與繼也父雖自處傍尊之地於子之情猶須隆其本重是以令云為人後者為其父母並解官申其心喪父卒母嫁為父後者雖不服亦申心喪其繼母嫁不解官此專據嫁者生文耳將知繼母在父之室則制同親母若謂非有撫育之恩同之行路何服之有乎服既有之心喪焉可獨異三省令旨其義甚明今言令許不解何其甚謬且後人者為其父母期未有變隔以親繼親繼既等故知心喪不殊服問云母出則為繼母之黨服豈不以出母族絶推而遠之繼母配父引而親之乎子思曰為伋也妻是為白也母不為伋也妻是不為白也母定知服以名重情因父親所以聖人敦之以孝慈弘之以名義是使子以名服同之親母繼以義報等之己生如謂繼母之來在子出之後制有淺深者考之經傳未見其文譬出後之人所後者初亡後之者始至此復可以無撫育之恩而不服重乎昔長沙人王毖漢末為上計詣京師既而吳魏隔絶毖於內國更娶生子昌毖死後為東平相始知吳之母亡便情繫居重不攝職事于時議者不以為非然則繼母之與前母於情無別若要以撫育始生服制王昌復何足云乎又晉鎮南將軍羊祜無子取弟子伊為子祜薨伊不服重祜妻表聞伊辭曰伯生存養己伊不敢違然無父命故還本生尚書彭權議子之出養必由父命無命而出是為叛子於是下詔從之然則心服之制不得緣恩而生也論云禮者稱情而立文仗義而設教還以此義諭彼之情稱情者稱如母之情仗義者仗為子之義名義分定然後能尊父順名崇禮篤敬苟以母養之恩始成母子則恩由彼至服自己來則慈母如母何得待父命又云繼母慈母本實路人臨己養己同之骨血若如斯言子不由父縱有恩育得如母乎其慈繼雖在三年之下而居齊期之上禮有倫例服以稱情繼母本以名服豈藉恩之厚薄也至於兄弟之子猶子也私昵之心實殊禮服之制無二彼言以輕如重自以不同此謂如重之辭即同重法若使輕重不等何得為如律云準枉法者但準其罪以枉法論者即同真法律以弊刑禮以設教準者準擬之名以者即真之稱如以二字義用不殊禮律兩文所防是一將此明彼足見其義取譬伐柯何遠之有又論云取子為後者將以供承祧廟奉養己身不得使宗子歸其故宅以子道事本父之後妻也然本父後妻因父而得母稱若如來旨本父亦可無心喪乎何直父之後妻論又云禮言舊君其尊豈復君乎已去其位非復純臣須言舊以殊之別有所重非復純孝故言其已見之目以其父之文是名異也此又非通論何以言之其舊訓殊所用亦別舊者易新之稱其者因彼之辭安得以相類哉至如禮云其父析薪其子不克負荷傳云衛雖小其君在焉若其父而有異其君復有異乎斯不然矣斯不然矣今炫敢違禮乖令侮聖干法使出後之子無情於本生名義之分有虧於風俗徇飾非於明世強媒糵於禮經雖欲揚己露才不覺言之傷理事奏竟從子翊之議仁壽中為新豐令有能名大業三年除大理正甚有當時之譽擢授治書侍御史每朝廷疑議子翊為之辨析多出衆人意表從幸江都值天下大亂帝猶不悟子翊因侍切諫由是忤旨令子翊為丹陽留守尋遣於上江督運為賊吳子所虜子翊説之因以衆首復遣領首賊清江遇煬帝被殺賊知而告之子翊弗信斬所言者賊又欲請以為主子翊不從羣賊執子翊至臨川城下使告城中云帝已崩子翊反其言於是見害時年七十堯君素堯君素魏郡湯陰人也煬帝為晉王時君素以左右從及嗣位纍遷鷹擊郎將大業之末盜賊蜂起人多流亡君素所部獨全後從驍衛大將軍屈突通拒義兵於河東俄而通引兵南遁以君素有膽略署領河東通守義師遣將呂紹宗韋義節等攻之不剋及通軍敗至城下呼之君素見通歔欷流涕悲不自勝左右皆哽咽通亦泣下霑襟因謂君素曰吾軍已敗義旗所指莫不響應事勢如此卿當早降以取富貴君素答曰公當爪牙之寄為國大臣主上委公以關中代王付公以社稷國祚隆替懸之於公奈何不思報效以至於此縱不能遠慚主上公所乘馬即代王所賜也公何面目乘之哉通曰吁君素我力屈而來君素曰方今力猶未屈何用多言通慚而退時圍甚急行李斷絶君素乃為木鵝置表於頸具論事勢浮之黃河沿流而下河陽守者得之達于東都越王侗見而歎息於是承制拜君素為金紫光祿大夫密遣行人勞苦之監門直閣龐玉武衛將軍皇甫無逸前後自東都歸義俱造城下為陳利害大唐又賜金券待以不死君素卒無降心其妻又至城下謂之曰隋室已亡天命有屬君何自苦身取禍敗君素曰天下事非婦人所知引弓射之應弦而倒君素亦知事必不濟然要在守死不易每言及國家未嘗不歔欷嘗謂將士曰吾是藩邸舊臣纍蒙奬擢至於大義不得不死今穀支數年食盡此穀足知天下之事必若隋室傾敗天命有歸吾當斷頭以付諸君也時百姓苦隋日久及逢義舉人有息肩之望然君素善於統領下不能叛歲餘頗得外生口城中微知江都傾覆又糧食乏絶人不聊生男女相食衆心離駭白虹降於府門兵器之端夜皆光見月餘君素為左右所害陳孝意河東陳孝意少有志尚弱冠以貞介知名大業初為魯郡司法書佐郡內號為廉平太守蘇威嘗欲殺一囚孝意固諫至於再三威不許孝意因解衣請先受死良久威意乃解謝而遣之漸加禮敬及威為納言奏孝意為侍御史後以父憂去職居喪過禮有白鹿馴擾其廬時人以為孝感之應未期起授雁門郡丞在郡菜食齋居朝夕哀臨每一發聲未嘗不絶倒柴毀骨立見者哀之于時政刑日紊長吏多贓污孝意清節彌厲發姦擲伏動若有神吏民稱之煬帝幸江都馬邑劉武周殺太守王仁恭舉兵作亂孝意率兵與武賁郎將王智辨討之戰於下館城反為所敗武周遂轉攻傍郡百姓凶凶將懷叛逆前郡丞楊長仁雁門令王確等並桀黠為無賴所歸謀應武周孝意陰知之族滅其家郡中戰栗莫敢異志俄而武周引兵來攻孝意拒之每致克捷但孤城獨守外無聲援孝意執志誓以必死每遣使江都道路隔絶竟無報命孝意亦知帝必不反每每旦暮向詔勑庫俯伏流涕悲動左右圍城百餘日糧盡為校尉張倫所殺以城歸武周張季珣京兆張季珣父祥少為高祖所知其後引為丞相參軍事開皇中纍遷並州司馬仁壽末漢王諒舉兵反遣其將劉建略地燕趙至井陘祥勒兵拒守建攻之復縱火燒其郭下祥見百姓驚駭其城側有西王母廟祥登城望之再拜號泣而言曰百姓何罪致此焚燒神其有靈可降雨相救言訖廟上雲起須臾驟雨其火遂滅士卒感其至誠莫不用命城圍月餘李雄援軍至賊遂退走以功授開府歷汝州刺史靈武太守入為都水監卒官季珣少慷慨有志節大業末為鷹擊郎將其府據箕山為固與洛口連接及李密翟讓攻陷倉城遣人呼之季珣罵密極口密怒遣兵攻之連年不能克時密衆數十萬在其城下季珣四面阻絶所領不過數百人而執志彌固誓以必死經三年資用盡樵蘇無所得撤屋而爨人皆穴處季珣撫巡之一無離叛糧盡士卒羸病不能拒戰遂為所陷季珣坐聽事顏色自若密遣兵擒送之羣賊曳季珣令拜密季珣曰吾雖為敗軍之將猶是天子爪牙之臣何容拜賊也密壯而釋之翟讓從之求金不得遂殺之時年二十八其弟仲琰大業末為上洛令及義兵起率吏人城守部下殺之以歸義仲琰弟琮為千牛左右宇文化及之亂遇害季珣家素忠烈兄弟俱死國難論者賢之松贇北海松贇性剛烈重名義為石門府隊正大業末有賊楊厚擁徒作亂來攻北海縣贇從郡兵討之贇輕騎覘賊為厚所獲厚令贇謂城中云郡兵已破宜早歸降贇偽許之既至城下大呼曰我是松贇為官軍覘賊邂逅被執非力屈也今官軍大來並已至矣賊徒寡弱旦暮擒剪不足為憂賊以刀築贇口引之而去毆擊交下贇罵厚曰老賊何敢致辱賢良禍自及也言未卒賊已斬斷其腰城中望之莫不流涕扼腕鋭氣益倍北海卒完煬帝遣戶曹郎郭子賤討厚破之以贇亡身殉節嗟悼不已上表奏之優詔褒揚贈朝散大夫本郡通守史臣曰古人以天下至大方身則小生為重矣比義則輕然則死有重於太山生以理全者也生有輕於鴻毛死與義合者也然死不可追生無再得故處不失節所以為難矣楊諒玄感李密反形已成凶威方熾皇甫誕遊元馮慈明臨危不顧視死如歸可謂勇於蹈義矣獨孤盛元文都盧楚堯君素豈不知天之所廢人不能興甘就葅醢之誅以徇忠貞之節雖功未存於社稷力無救於顛危然視彼苟免之徒貫三光而洞九泉矣須善會有溫序之風子翊松贇蹈解揚之烈國家昏亂有忠臣誠哉斯言也

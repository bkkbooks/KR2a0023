body:
  text: 隋書卷五十七列傳第二十二盧思道從父兄昌衡盧思道字子行范陽人也祖陽烏魏祕書監父道亮隱居不仕思道聰爽俊辨通侻不羈年十六遇中山劉松松為人作碑銘以示思道思道讀之多所不解於是感激閉戶讀書師事河間邢子才後思道復為文以示劉松松又不能甚解思道乃喟然歎曰學之有益豈徒然哉因就魏收借異書數年之間才學兼著然不持操行好輕侮人齊天保中魏史未出思道先已誦之由是大被笞辱前後屢犯因而不調其後左僕射楊遵彥薦之於朝解褐司空行參軍長兼員外散騎侍郎直中書省文宣帝崩當朝文士各作挽歌十首擇其善者而用之魏收陽休之祖孝徵等不過得一二首唯思道獨得八首故時人稱為八米盧郎後漏泄省中語出為丞相西閣祭酒歷太子舍人司徒録事參軍每居官多被譴辱後以擅用庫錢免歸於家嘗於薊北悵然感慨為五言詩以見意人以為工數年復為京畿主簿歷主客郎給事黃門侍郎待詔文林館周武帝平齊授儀同三司追赴長安與同輩陽休之等數人作聽蟬鳴篇思道所為詞意清切為時人所重新野庾信遍覽諸同作者而深歎美之未幾以母疾還鄉遇同郡祖英伯及從兄昌期宋護等舉兵作亂思道預焉周遣柱國宇文神舉討平之罪當法已在死中神舉素聞其名引出之令作露布思道援筆立成文無加點神舉嘉而宥之後徐掌教上士高祖為丞相遷武陽太守非其好也為孤鴻賦以寄其情曰余志學之歲自鄉里遊京師便見識知音歷受羣公之眷年登弱冠甫就朝列談者過誤遂竊虛名通人楊令君邢特進已下皆分庭致禮倒屣相接翦拂吹噓長其光價而才本駑拙性實疏懶勢利貨殖淡然不營雖籠絆朝市且三十載而獨往之心未始去懷抱也攝生舛和有少氣疾分符坐嘯作守東原洪河之湄沃野彌望囂務既屏魚鳥為鄰有離羣之鴻為羅者所獲野人馴養貢之於余置諸池庭朝夕賞玩既用銷憂兼以輕疾大易稱鴻漸於陸羽儀盛也揚子曰鴻飛冥冥騫翥高也淮南云東歸碣石違溽暑也平子賦曰南寓衡陽避祁寒也若其雅步清音遠心高韻鵷鸞以降罕見其儔而鎩翮牆陰偶影獨立唼喋粃稗雞鶩為伍不亦傷乎余五十之年忽焉已至永言身事慨然多緒乃為之賦聊以自慰云其詞曰惟此孤鴻擅奇羽蟲實禀清高之氣遠生遼碣之東氄毛將落和鳴順風壯冰云厚矯翅排空出島嶼之綿邈犯霜露之溟濛驚絓魚之密網畏落雁之虛弓若其斗柄東指女夷司月乃遙集於寒門遂輕舉於玄闕至如天高氣肅搖落在時既嘯儔於淮浦亦弄吭於江湄摩赤霄以凌厲乘丹氣之威夷遡商飆之嫋嫋玩陽景之遲遲彭蠡方春洞庭初緑理翮整翰羣浮侶浴振雪羽而臨風掩霜毛而候旭饜江湖之菁藻飫原野之菽粟行離離而高逝響噰噰而相續潔齊國之氷紈皓密山之華玉若乃晨沐清露安趾徐步夕息芳洲延頸乘流違寒競逐浮沅水宿避暑言歸絶漠雲飛望玄鵠而為侶比朱鷺而相依倦天衢之冥漠降河渚之芳菲忽值羅人設綱虞者懸機永辭寥廓蹈迹重圍始則窘束籠樊憂憚刀俎靡軀絶命恨失其所終乃馴狎園庭栖託池稻粱為惠恣其容與於是翕羽宛頸屏氣銷聲滅煙霞之高想閟江海之幽情何時驤首奮翼上凌太清騫翥鼓舞遠薄層城惡禽視而不貴小鳥顧而相輕安控地而無恥豈沖天之復榮若夫圖南之羽偉而去羡栖睫之蟲微而不賤各遂性於天壤弗企懷以交戰不聽咸池之樂不饗太牢之薦匹晨雞而共飲偶野以同膳匪揚聲以顯聞寧校體而求見聊寓形乎沼沚且夷心於溏淀齊榮辱以晏如承君子之餘開皇初以母老表請解職優詔許之思道自恃才地多所陵轢由是官塗淪滯既而又著勞生論指切當時其詞曰莊子曰大塊勞我以生誠哉斯言也余年五十羸老云至追惟疇昔勤矣厥生乃著茲論因言時云爾罷郡屏居有客造余者少選之頃盱衡而言曰生者天地之大德人者有生之最靈所以作配兩儀稱貴羣品妍蚩愚智之辨天懸壤隔行己立身之異入海登山今吾子生於右地九葉卿族天授俊才萬夫所仰學綜流略慕孔門之游夏辭窮麗則擬漢日之卿雲行藏有節進退以禮不諂不驕無慍無懌偃仰貴賤之間從容語默之際何其裕也下走所欣羡焉余莞爾而笑曰未之思乎何所言之過也子其清耳請為左右陳之夫人之生也皆未若無生在余之生勞亦勤止紈綺之年伏膺教義規行矩步從善而登巾冠之後濯纓受署韁鎖仁義籠絆朝市失翹陸之本性喪江湖之遠情淪此風波溺於倒躓憂勞總至事非一緒何則地胄高華既致嫌於管庫才識美茂亦受嫉於愚庸篤學強記聾瞽於焉側目清言河瀉木訥所以疚心豈徒蟲惜春漿鴟吝腐鼠相江都而永歎傅長沙而不歸固亦魯值臧倉楚逢靳尚趙一為之哀歌張升於是慟哭有齊之季不遇休明申脰就鞅屏迹無地段圭張讓金貝是視賈謐郭淮腥臊可饜淫刑以逞禍近池魚耳聽惡來之讒足踐龍逢之血周氏末葉仍值僻王斂笏升階汗流浹背莒客之踵躋焦原匹茲非險齊人之手執馬尾方此未危若乃羊腸句注之道據鞍振策武落雞田之外櫛風沐雨三旬九食不敢稱弊此之為役蓋其小小者耳今泰運肇開四門以穆冕旒司契於上夔龍佐命於下岐伯善卷恥徇幽憂卞隨務光悔從木石余年在秋方已迫知命情禮宜退不獲晏安一葉從風無損鄧林之攢植雙鳧退飛不虧渤澥之游泳耕田鑿井晚息晨興候南山之朝雲攬北堂之明月泛勝九穀之書觀其節制崔實四人之令奉以周旋晨荷簑笠白屋黃冠之伍夕談穀稼霑體塗足之倫濁酒盈樽高歌滿席恍兮惚兮天地一指此野人之樂也子或以是羡余乎客曰吾子之事既聞之矣他人有心又請論其梗概余答曰雲飛泥沉卑高異等圓行方止動息殊致是以摩霄運海輕罻羅於藪澤五衢四照忽斤斧於山林余晚值昌辰遂其弱尚觀人事之隕穫覩時路之邅危玄冬修夜靜言長想可以纍歎悼心流涕酸鼻人之百年脆促已甚奔駒流電不可為辭顧慕周章數紀之內窮通榮辱事無足道而有識者鮮無識者多褊隘凡近輕險躁薄居家則人面獸心不孝不義出門則諂諛讒佞無愧無恥退身知足忘伯陽之炯戒陳力就列棄周任之格言悠悠遠古斯患已積迄於近代此蠹尤深范卿撝讓之風搢紳不嗣夏書昏墊之罪執政所安朝露未晞小車盈董石之巷夕陽且落皂蓋填閻竇之里皆如脂如韋俯僂匍匐噉惡求媚舐痔自親美言諂笑助其愈樂詐泣佞哀恤其喪紀近通旨酒遠貢文蛇艷姬美女委如脫屣金銑玉華棄同遺跡及鄧通失路一簪之賄無餘梁冀就誅五侯之貴將起向之求官買職晚謁晨趨刺促望塵之舊遊伊優上堂之夜客始則亡魂褫魄若牛兄之遇獸心戰色沮似葉公之見龍俄而抵掌揚眉高視闊步結侶棄廉公之第手哭聖卿之門華轂生塵來如激矢雀羅暫設去等絶絃飴蜜非甘山川未阻千變萬化鬼出神入為此者皆衣冠士族或有藝能不恥不仁不畏不義靡愧友朋莫慚妻子外呈厚貌內蘊百心繇是則紆青佩紫牧州典郡冠幘劫人厚自封殖妍歌妙舞列鼎撞鍾耳倦絲桐口飫珍旨雖素論以為非而時宰之不責末俗蚩蚩如此之敝余則違時薄宦屏息窮居甚恥驅馳深畏乾沒心若死灰不營勢利家無儋石不費囊錢偶影聯官將數十載駑拙致笑輕生所以告勞也真人御宇雕為朴人知榮辱時反雍熙風力上宰內敷文教方邵重臣外揚武節被之大道洽以淳風舉必以才爵無濫授禀斯首鼠不預衣簪阿黨比周掃地俱盡輕薄之儔滅影竄迹礫石變成瑜瑾莨莠化為芝蘭曩之扇俗攪時駭耳穢目今悉不聞不見莫余敢侮易曰聖人作而萬物覩斯之謂乎歲餘被徵奉詔郊勞陳使頃之遭母憂未幾起為散騎侍郎奏內史侍郎事于時議置六卿將除大理思道上奏曰省有駕部寺留大僕省有刑部寺除大理斯則重畜産而賤刑名誠為未可又陳殿庭非杖罰之所朝臣犯笞罪請以贖論上悉嘉納之是歲卒于京師時年五十二上甚惜之遣使吊祭焉有集三十卷行於時子赤松大業中官至河東長史昌衡字子均父道虔魏尚書僕射昌衡小字龍子風神淡雅容止可法博涉經史工草行書從弟思道小字釋奴宗中俱稱英妙故幽州為之語曰盧家千里釋奴龍子年十七魏濟陰王元暉業召補太尉參軍事兼外兵參軍齊氏受禪歷平恩令太子舍人尋為僕射祖孝徵所薦遷尚書金部郎孝徵每曰吾用盧子均為尚書郎自謂無愧幽州矣其後兼散騎侍郎迎勞周使武帝平齊授司玉中士與大宗伯斛斯徵修禮令開皇初拜尚書祠部侍郎高祖嘗大集羣下令自陳功績人皆競進昌衡獨無所言左僕射高熲目而異之陳使賀徹周濆相繼來聘朝廷每令昌衡接對之未幾出為徐州總管長史甚有能名吏部尚書蘇威考之曰德為人表行為士則論者以為美談嘗行至浚儀所乘馬為他牛所觸因致死牛主陳謝求還價直昌衡謂之曰六畜相觸自關常理此豈人情也君何謝拒而不受性寬厚不校皆此類也轉壽州總管長史總管宇文述甚敬之委以州務歲餘遷金州刺史仁壽中奉詔持節為河南道巡省大使及還以奉使稱旨授儀同三司賜物三百段昌衡自以年在懸車表乞骸骨優詔不許大業初徵為太子左庶子行詣洛陽道卒時年七十二子寶素寶胤李孝貞李孝貞字元操趙郡柏人人也父希禮齊信州刺史世為著姓孝貞少好學能屬文在齊釋褐司徒府參軍事簡靜不妄通賓客與從兄儀曹郎中騷太子舍人季節博陵崔子武范陽盧詢祖為斷金之契後以射策甲科拜給事中于時黃門侍郎高乾和親要用事求婚於孝貞孝貞拒之由是有隙陰譖之出為太尉府外兵參軍後歷中書舍人博陵太守司州別駕復兼散騎常侍聘周使副還除給事黃門侍郎周武帝平齊授儀同三司少典祀下大夫宣帝即位轉吏部下大夫高祖為丞相尉迥作亂相州孝貞從韋孝寬擊之以功授上儀同三司開皇初拜馮翊太守為犯廟諱於是稱字後數歲遷蒙州刺史吏民安之自此不復留意於文筆人問其故慨然歎曰五十之年倏焉而過鬢垂素髮筋力已衰宦意文情一時盡矣悲夫然每暇日輒引賓客絃歌對酒終日為歡徵拜內史侍郎與內史李德林參典文翰然孝貞無幹劇之用頗稱不理上譴怒之勑御史劾其事由是出為金州刺史卒官所著文集二十卷行於世有子允玉孝貞弟孝威亦有雅望大業中官至大理少卿薛道衡從弟孺薛道衡字玄卿河東汾陰人也祖聰魏齊州刺史父孝通常山太守道衡六歲而孤專精好學年十三講左氏傳見子産相鄭之功作國僑贊頗有詞致見者奇之其後才名益著齊司州牧彭城王浟引為兵曹從事尚書左僕射弘農楊遵彥一代偉人見而嗟賞授奉朝請吏部尚書隴西辛術與語歎曰鄭公業不亡矣河東裴讞目之曰自鼎遷河朔吾謂關西孔子罕值其人今復遇薛君矣武成作相召為記室及即位纍遷太尉府主簿歲餘兼散騎常侍接對周陳二使武平初詔與諸儒修定五禮除尚書左外兵郎陳使傅縡聘齊以道衡兼主客郎接對之縡贈詩五十韻道衡和之南北稱美魏收曰傅縡所謂以蚓投魚耳待詔文林館與范陽盧思道安平李德林齊名友善復以本官直中書省尋拜中書侍郎仍參太子侍讀後主之時漸見親用于時頗有附會之譏後與侍中斛律孝卿參預政事道衡具陳備周之策孝卿不能用及齊亡周武引為御史二命士後歸鄉里自州主簿入為司祿上士高祖作相從元帥梁睿擊王謙攝陵州刺史大定中授儀同攝卭州刺史高祖受禪坐事除名河間王弘北征突厥召典軍書還除內史舍人其年兼散騎常侍聘陳主使道衡因奏曰江東蕞爾一隅僭擅遂久實由永嘉已後華夏分崩劉石符姚慕容赫連之輩妄竊名號尋亦滅亡魏氏自北徂南未遑遠略周齊兩立務在兼並所以江表逋誅積有年祀陛下聖德天挺光膺寶祚比隆三代平一九州豈容使區區之陳久在天網之外臣今奉使請責以稱藩高祖曰朕且含養置之度外勿以言辭相折識朕意焉江東雅好篇什陳主尤愛雕蟲道衡每有所作南人無不吟誦焉及八年伐陳授淮南道行臺尚書吏部郎兼掌文翰王師臨江高熲夜坐幕下謂之曰今段之舉克定江東已不君試言之道衡答曰凡論大事成敗先須以至理斷之禹貢所載九州本是王者封域後漢之季羣雄競起孫權兄弟遂有吳楚之地晉武受命尋即吞併永嘉南遷重此分割自爾已來戰爭不息否終斯泰天道之郭璞有云江東偏王三百年還與中國合今數將滿矣以運數而言其必克一也有德者昌無德者亡自古興滅皆由此道主上躬履恭儉憂勞庶政叔寶峻宇雕牆酣酒荒色上下離心人神同憤其必克二也為國之體在於任寄彼之公卿備員而已拔小人施文慶委以政事尚書令江總唯事詩酒本非經略之才蕭摩訶任蠻奴是其大將一夫之用耳其必克三也我有道而大彼無德而小量其甲士不過十萬西自巫峽東至滄海分之則勢懸而力弱聚之則守此而失彼其必克四也席卷之勢其在不疑熲欣然曰君言成敗事理分明吾今豁然矣本以才學相期不意籌略乃爾還除吏部侍郎後坐抽擢人物有言其黨蘇威任人有意故者除名配防嶺表晉王廣時在揚州陰令人諷道衡從揚州路將奏留之道衡不樂王府用漢王諒之計遂出江陵道而去尋有詔徵還直內史省晉王由是銜之然愛其才猶頗見禮後數歲授內史侍郎加上儀同三司道衡每至構文必隱坐空齊踏壁而臥聞戶外有人便怒其沉思如此高祖每曰薛道衡作文書稱我意然誡之以迂誕後高祖善其稱職謂楊素牛弘曰道衡老矣驅使勤勞宜使其朱門陳戟於是進位上開府賜物百段道衡辭以無功高祖曰爾久勞階陛國家大事皆爾宣行豈非爾功也道衡久當樞要才名益顯太子諸王爭相與交高熲楊素雅相推重聲名籍甚無競一時仁壽中楊素專掌朝政道衡既與素善上不欲道衡久知機密因出檢校襄州總管道衡久蒙驅策一旦違離不勝悲戀言之哽咽高祖愴然改容曰爾光陰晚暮侍奉誠勞朕欲令爾將攝兼撫萌俗今爾之去朕如斷一臂於是賚物三百段九環金帶並時服一襲馬十匹慰勉遣之在任清簡吏民懷其惠煬帝嗣位轉番州刺史歲餘上表求致仕帝謂內史侍郎虞世基曰道衡將至當以祕書監待之道衡既至上高祖文皇帝頌其詞曰太始太素荒茫造化之初天皇地皇杳冥書契之外其道絶其迹遠言談所不詣耳目所不追至於入穴登巢鶉居鷇飲不殊於羽族取類於毛羣亦何貴於人靈何用於心識羲軒已降爰暨唐虞則乾象而施法度觀人文而化天下然後帝王之位可重聖哲之道為尊夏后殷周之國禹湯文武之主功濟生民聲流雅頌然陵替於三五慚德於干戈秦居閏位任刑名為政本漢執靈圖雜霸道而為業當塗興而三方峙典午末而四海亂九州封域窟穴鯨鯢之羣五都遺黎蹴踏戎馬之足雖玄行定嵩洛木運據崤函未正滄海之流詎息崑山之燎協千齡之旦暮當萬葉之一朝者其在大隋乎粵若高祖文皇帝誕聖降靈則赤光照室韜神晦迹則紫氣騰天龍顏日角之奇玉理珠衡之異著在圖籙彰乎儀表而帝系靈長神基崇峻類邠岐之纍德異豐沛之勃起俯膺歷試納揆賓門位長六卿望高百辟猶重華之為太尉若文命之任司空蒼歷將盡率土糜沸玉弩驚天金鋩照野姦雄挻禍據河朔而連海岱猾長縱惡杜白馬而塞成臯庸蜀逆命憑銅梁之險鄖黃背誕引金陵之寇三川已震九鼎將飛高祖龍躍鳳翔濡足授手應赤伏之符受玄狐之籙命百下百勝之將動九天九地之師平共工而殄蚩尤翦猰窳而戮鑿齒不煩二十八將無假五十二征曾未踰時妖逆咸殄廓氛霧於區宇出黎元於塗炭天柱傾而還正地維絶而更紐殊方稽顙識牛馬之內向樂師伏地懼鍾石之變聲萬姓所以樂推三靈於是改卜壇場已備猶弘五讓之心億兆難違方從四海之請光臨寶祚展禮郊丘舞六代而降天神陳四圭而饗上帝乾坤交泰品物咸亨酌前王之令典改易徽號因庶萌之子來移創都邑天文上當朱鳥地理下據黑龍正位辨方揆影於日月內宮外座取法於辰象懸政教於魏闕朝羣后於明堂除舊布新移風易俗天街之表地脉之外獯獫孔熾其來自久橫行十萬樊噲於是失辭提步五千李陵所以陷沒周齊兩盛競結旄頭娉狄后於漠北未足息其侵擾傾珍藏於山東不能止其貪暴炎靈啓祚聖皇馭宇運天策於帷扆播神威於沙朔柳室氈裘之長皆為臣隸瀚海蹛林之地盡充池苑三吳百越九江五湖地分南北天隔內外談黃旗紫蓋之氣恃龍蟠獸據之嶮有僭僞之君妄竊帝王之號時經五代年移三百爰降皇情永懷大道愍彼黎獻獨為匪人今上利建在唐則哲居代地憑宸極天縱神武受脤出車一舉平定於是八荒無外九服大同四海為家萬里為宅乃休牛散馬偃武修文自華夏亂離綿積年代人造戰爭之具家習澆僞之風聖人之遺訓莫存先王之舊典咸墜爰命秩宗刊定五禮申勑大豫改正六樂玉帛樽俎之儀節文乃備金石匏革之奏雅俗始分而留心政術垂神聽覽早朝晏罷廢寢忘食憂百姓之未安懼一物之失所行先王之道夜思待旦革百王之弊朝不及夕見一善事喜彰於容旨聞一愆犯歎深於在豫薄賦輕徭務農重穀倉廩有紅腐之積黎萌無阻飢之慮天性弘慈聖心惻隱恩加禽獸胎卵於是獲全仁霑草木牛羊所以勿踐至於憲章重典刑名大辟申法而屈情決斷於俄頃故能彝倫攸上下齊肅左右絶諂諛之路縉紳無勢力之門小心翼翼敬事於天地終日乾乾誡慎於亢極陶黎萌於德化致風俗於太康公卿庶尹遐邇嶽牧僉以天平地成千載之嘉會登封降禪百王之盛典宜其金泥玉檢展禮介丘飛聲騰實常為稱首天子為而不恃成而不居沖旨凝邈固辭弗許而雖休勿休上德不德更乃潔誠岱嶽遜謝愆咎方知六十四卦謙撝之道為尊七十二君告成之義為小巍巍蕩蕩無得以稱焉而深誠至德感達於穹壤和氣薰風充溢於宇宙二儀降福百靈薦祉日月星象風雲草樹之祥山川玉石鱗介羽毛之瑞歲見月彰不可勝紀至於振古所未有圖籍所不載目所不見耳所未聞古語稱聖人作萬物覩神靈滋百寶用此其效矣既而遊心姑射脫屣之志已深鑄鼎荊山升天之駕遂遠凡在黎獻具惟帝臣慕深考妣哀纏弓劍塗山幽峻無復玉帛之禮長陵寂寞空見衣冠之遊若乃降精熛怒飛名帝籙開運握圖創業垂統聖德也撥亂反正濟國寧人六合八紘同文共軌神功也玄酒陶匏雲和孤竹禋祀上帝尊極配天大孝也偃伯戢戈正禮裁樂納民壽域驅俗福林至政也張四維而臨萬宇侔三皇而並五帝豈直錙銖周漢么麼魏晉而已雖五行之舞每陳於清廟九德之歌無絶於樂府而玄功暢洽不局於形器懿業遠大豈盡於揄揚臣輕生多幸命偶興運趨事紫宸驅馳丹陛一辭天闕奄隔鼎湖空有攀龍之心徒懷蓐蟻之意庶憑毫翰敢希贊述昔堙海之禽不增於大地泣河之士非益於洪流盡其心之所存忘其力之所及輒緣斯義不覺斐然乃作頌曰悠哉邃古邈矣季世四海九州萬王千帝三代之後其道逾替爰逮金行不勝其弊戎狄猾夏羣凶縱慝竊號淫名十有餘國怙威逞暴悖禮亂德五嶽塵飛三象霧塞玄精啓曆發迹幽方並吞寇僞獨擅雄強載祀二百比祚前王江湖尚阻區域未康句吳閩越河朔渭涘九縣瓜分三方鼎跱狙詐不息干戈競起東夏雖平亂離瘼矣五運協期千年肇旦赫矣高祖人靈攸贊聖德迥生神謀獨斷疸惡彰善夷凶靜難宗伯撰儀太史練日孤竹之管雲和之瑟展禮上玄飛煙太一圭璧朝會山川望秩占揆星景移建邦畿下憑赤壤上協紫微布政衢室懸法象魏帝宅天府固本崇威胸河瀚海龍荒狼望種落陸梁時犯亭障皇威遠懾帝德遐暢稽顙歸誠稱臣內向吳越提封斗牛星象積有年代自稱君長大風未繳長鯨漏網授鉞天人豁然清蕩戴日戴斗太平太蒙禮教周被書軌大同復禹之跡成舜之功禮以安上樂以移風憂勞庶績矜育黔首三面解羅萬方引咎納民軌物驅時仁壽神化隆平生靈熙阜虔心恭己奉天事地協氣橫流休徵紹至壇場望幸云亭虛位推而不居聖道彌粹齊跡姬文登發嗣聖道類漢光傳莊寶命知來藏往玄覽幽鏡鼎業靈長洪基隆盛崆峒問道汾射窅然御辨遐逝乘雲上仙哀纏率土痛感穹玄流澤萬葉用教百年尚想睿圖永惟聖則道洽幽顯仁霑動植爻象不陳乾坤將息微臣作頌用申罔極帝覽之不悅顧謂蘇威曰道衡致美先朝此魚藻之義也於是拜司隸大夫將置之罪道衡不悟司隸刺史房彥謙素相善知必及禍勸之杜絶賓客卑辭下氣而道衡不能用會議新令久不能決道衡謂朝士曰向使高熲不死令決當久行有人奏之帝怒曰汝憶高熲邪付執法者勘之道衡自以非大過促憲司早斷暨於奏日冀帝赦之勑家人具饌以備賓客來候者及奏帝令自盡道衡殊不意未能引訣憲司重奏縊而殺之妻子徙且末時年七十天下寃之有集七十卷行於世有子五人收最知名出繼族父孺孺清貞孤介不交流俗涉歷經史有才思雖不為大文所有詩詠詞致清遠開皇中為侍御史揚州總管司功參軍每以方直自處府僚多不便之及滿轉清陽令襄城郡掾卒官所經並有惠政與道衡偏相友愛收初生即與孺為後養於孺宅至於成長殆不識本生太常丞胡仲操曾在朝堂就孺借刀子割爪甲孺以仲操非雅士竟不與之其不肯妄交清介獨行皆此類也道衡兄子邁官至選部郎從父弟道實官至禮部侍郎離石太守並知名於世從子德音有雋才起家為游騎尉佐魏淡修魏史史成遷著作佐郎及越王侗稱制東都王世充之僭號也軍書羽檄皆出其手世充平以罪伏誅所有文筆多行於時史臣曰二三子有齊之季皆以辭藻著聞爰歷周隋咸見推重李稱一代俊偉薛則時之令望握靈蛇以俱照騁逸足以並驅文雅縱橫金聲玉振靜言揚榷盧居二子之右李薛紆青拖紫思道官塗寥落雖窮通有命抑亦不護細行之所致也

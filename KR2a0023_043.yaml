body:
  text: 隋書卷四十三列傳第八河間王弘子慶河間王弘字辟惡高祖從祖弟也祖愛敬早卒父元孫少孤隨母郭氏養於舅族及武元皇帝與周太祖建義關中元孫時在鄴下懼為齊人所誅因假外家姓為郭氏元孫死齊為周所並弘始入關與高祖相得高祖哀之為買田宅弘性明悟有文武幹略數從征伐纍遷開府儀同三司高祖為丞相常置左右委以心腹高祖詣周趙王宅將及於難弘時立於戶外以衛高祖尋加上開府賜爵永康縣公及上受禪拜大將軍進爵郡公尋贈其父為柱國尚書令河間郡公其年立弘為河間王拜右衛大將軍歲餘進授柱國時突厥屢為邊患以行軍元帥率衆數萬出靈州道與虜相遇戰大破之斬數千級賜物二千段出拜寧州總管進位上柱國弘在州治尚清靜甚有恩惠後數載徵還京師未幾拜蒲州刺史得以便宜從事時河東多盜賊民不得安弘奏為盜者百餘人投之邊裔州境帖然號為良吏每晉王廣入朝弘輒領揚州總管及晉王歸藩弘復還蒲州在官十餘年風教大洽煬帝嗣位徵還拜太子太保歲餘薨大業六年追封郇王子慶嗣慶傾曲善候時變帝時猜忌骨肉滕王綸等皆被廢放唯慶獲全纍遷滎陽郡太守頗有治績及李密據洛口倉滎陽諸縣多應密慶勒兵拒守密頻遣攻之不能克歲餘城中糧盡兵勢日蹙密因遺慶書曰自昏狂嗣位多歷歲年剝削生民塗炭天下璿室瑤臺之麗未極驕奢糟丘酒池之荒非為淫亂今者共舉義旗勘剪凶虐八方同德萬里俱來莫不期入關以亡秦爭渡河而滅紂東窮海岱南洎江淮凡厥遺人承風慕義唯滎陽一郡王獨守迷夫微子紂之元兄族實為重項伯籍之季父戚乃非疏然猶去朝歌而入周背西楚而歸漢豈不眷戀宗祊留連骨肉但識寶鼎之將移知神器之先改而王之先代家住山東本姓郭氏乃非楊族止為宿與隋朝先有勳舊遂得預霑盤石名在葭莩婁敬之與漢高殊非血胤呂布之於董卓良異天親芝焚蕙歎事不同此又王之昏主心若豺狼讎忿同胞有逾沉閼惟勇及諒咸磬甸師況乃族類為非何能自保為王計者莫若舉城從義開門送款安若太山高枕而臥長守富貴足為美談乃至子孫必有餘慶今王世充屢被摧蹙自救無聊偷存晷漏詎能支久段達韋津東都自固何暇圖人世充朝亡達便夕滅又江都荒湎流宕忘歸內外崩離人神怨憤上江米船皆被抄截士卒飢餒半菽不充事切析骸義均煮弩舉烽火於驪山諸侯莫至浮膠船於漢水還日未期王獨守孤城絶援千里餱糧之計僅有月餘敝卒之多才盈數百有何恃賴欲相拒抗求枯魚於市肆即事非虛因歸雁以運糧竟知何日然城中豪傑王之腹心思殺長吏將為內啓正恐禍生匕首釁發蕭牆空以七尺之軀懸賞千金之購可為寒心可為酸鼻者也幸能三思自求多福于時江都敗問亦至慶得書遂降于密改姓為郭氏密為王世充所破復歸東都更為楊氏越王侗不之責也及侗稱制拜宗正卿世充將篡慶首為勸進世充既僭偽號降爵郇國公慶復為郭氏世充以兄女妻之署滎州刺史及世充將敗慶欲將其妻同歸長安其妻謂之曰國家以妾奉箕帚於公者欲以申厚意結公心耳今叔父窮迫家國阽危而公不顧婚姻孤負付屬為全身之計非妾所能責公也妾若至長安則公家一婢耳何用妾為願得送還東都君之惠也慶不許其妻遂沐浴靚葬仰藥而死慶歸大唐為宜州刺史郇國公復姓楊氏其嫡母元太妃年老兩目失明王世充以慶叛己而斬之楊處綱楊處綱高祖族父也生長北邊少習騎射在周嘗以軍功拜上儀同高祖受禪贈其父鍾葵為柱國尚書令義城縣公以處綱襲焉授開府督武候事尋為太子宗衛率轉左監門郎將後數載起授右領軍將軍處綱雖無才藝而性質直在官強濟亦為當時所稱尋拜蒲州刺史吏民悅之進位大將軍後遷秦州總管卒官諡曰恭弟處樂官至洛州刺史漢王諒之反也朝廷以為有二心廢錮不齒楊子崇楊子崇高祖族弟也父盆生贈荊州刺史子崇少好學涉獵書記有風儀愛賢好士開皇初拜儀同以車騎將軍典宿衛後為司門侍郎煬帝嗣位纍遷候衛將軍坐事免未幾復令檢校將軍事從帝幸汾陽宮子崇知突厥必為寇患屢請早還京師帝不納尋有雁門之圍及賊退帝怒之曰子崇怯磱妄有陳請驚動我衆心不可居爪牙之寄出為離石郡太守治有能名自是突厥屢寇邊塞胡賊劉六兒復擁衆劫郡境子崇上表請兵鎮遏帝復大怒下書令子崇巡行長城子崇出百餘里四面路絶不得進而歸時百姓飢饉相聚為盜子崇前後捕斬數千人歲餘朔方梁師都馬邑劉武周等各稱兵作亂郡中諸胡復相嘯聚子崇患之言欲朝集遂與心腹數百人自孟門關將還京師輜重半濟遇河西諸縣各殺長吏叛歸師都道路隔絶子崇退歸離石所將左右既聞太原有兵起不復入城遂各叛去子崇悉收叛者父兄斬之後數日義兵夜至城下城中豪傑復出應之城陷子崇為讎家所殺觀德王雄弟達觀德王雄初名惠高祖族子也父紹仕周歷八州刺史儻城縣公賜姓叱呂引氏雄美姿儀有器度雍容間雅進止可觀周武帝時為太子司旅下大夫帝幸雲陽宮衛王直作亂以其徒襲肅章門雄逆拒破之進位上儀同封武陽縣公邑千戶纍遷右司衛上大夫大象中進爵國公邑五千戶高祖為丞相雍州牧畢王賢謀作難雄時為別駕知其謀以告高祖賢伏誅以功授柱國雍州牧仍領相府虞候周宣帝葬備諸王有變令雄率六千騎送至陵所進位上柱國高祖受禪除左衛將軍兼宗正卿俄遷右衛大將軍參預朝政進封廣平王食邑五千戶以公別封一子雄請封弟士貴朝廷許之或奏高熲朋黨者上詰雄於朝雄對曰臣忝衛宮闈朝夕左右若有朋附豈容不知至尊欽明睿哲萬機親覽熲用心平允奉法而行此乃愛憎之理惟陛下察之高祖深然其言雄時貴寵冠絶一時與高熲虞慶則蘇威稱為四貴雄寬容下士朝野傾矚高祖惡其得衆陰忌之不欲其典兵馬乃下册書拜雄為司空曰維開皇九年八月朔壬戌皇帝若曰於戲惟爾上柱國左衛大將軍宗正卿廣平王風度寬弘位望隆顯爰司禁旅綿歷十載入當心腹外任爪牙驅馳軒陛勤勞著績念舊庸勳禮秩加等公輔之寄民具爾瞻宜竭乃誠副茲名實是用命爾為司空往欽哉光應寵命得不慎歟外示優崇實奪其權也雄無職務乃閉門不通賓客尋改封清漳王仁壽初高祖曰清漳之名未允聲望命職方進地圖上指安德郡以示羣臣曰此號足為名德相稱於是改封安德王大業初授太子太傅及元德太子薨檢校鄭州刺史事歲餘授懷州刺史尋拜京兆尹帝親征吐谷渾詔雄總管澆河道諸軍及還改封觀王上表讓曰臣早逢興運預班末屬有命有時藉風雲之會無才無德濫公卿之首蒙先皇不次之賞荷陛下非分之恩久紊台槐常慮盈滿豈可仍叨匪服重竊鴻名臣實面牆敢緣往例臣誠昧寵交懼身責昔劉賈封王豈備三階之任曹洪上將寧超五等之爵沉臣袞章踰於帝子京尹亞於皇枝錫土作藩鈕金開國於臣何以自處在物謂其乖分是以露款執愚祈恩固守伏願陛下曲留慈照特鑒丹誠頻觸宸嚴伏增流汗優詔不許遼東之役檢校左翊衛大將軍出遼東道次瀘河鎮遘疾而薨時年七十一帝為之廢朝鴻臚監護喪事有司考行請諡曰懿帝曰王道高雅俗德冠生人乃賜諡曰德贈司徒襄國武安渤海清河上黨河間濟北高密濟陰長平等十郡太守子恭仁位至吏部侍郎恭仁弟綝性和厚頗有文學歷義州刺史淮南太守及父薨起為司隸大夫遼東之役帝令綝於臨海頓別有所督楊玄感之反也玄感弟玄縱自帝所逃赴其兄路逢綝綝避人偶語久之既別而復相就者數矣司隸刺史劉休文奏之時綝兄吏部侍郎恭仁將兵於外帝以是寢之未發其事綝憂懼發病而卒綝弟續仕至散騎侍郎雄弟達字士達少聰敏有學行仕周官至儀同內史下大夫遂寧縣男高祖受禪拜給事黃門侍郎進爵為子時吐谷渾寇邊詔上柱國元諧為元帥達為司馬軍還兼吏部侍郎加開府歲餘轉內史侍郎出為鄯鄭趙三州刺史俱有能名平陳之後四海大同上差品天下牧宰達為第一賜雜綵五百段加以金帶擢拜工部尚書加位上開府達為人弘厚有局度楊素每言曰有君子之貌兼君子之心者唯楊達耳獻皇后及高祖山陵制度達並參豫焉煬帝嗣位轉納言仍領營東都副監帝甚信重之遼東之役領右武衛將軍進位左光祿大夫卒於師時年六十二帝歎惜者久之贈吏部尚書始安侯諡曰恭贈物三百五十段史臣曰高祖始遷周鼎衆心未附利建同姓維城宗社是以河間觀德咸啓山河屬乃葭莩地非寵逼故高位厚秩與時終始楊慶二三其德志在苟生變本宗如反掌棄慈母如遺迹及身而絶宜其然矣觀王位登台袞慶流後嗣保茲寵祿實仁厚之所致乎

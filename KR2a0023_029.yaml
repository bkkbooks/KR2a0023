門不祀古人所以誡焉其風俗大抵與漢中不別其人敏慧輕急貌多蕞陋頗慕文學時有斐然多溺於逸樂少從宦之士或至耆年白首不離鄉邑人多工巧綾錦雕鏤之妙殆侔於上國貧家不務儲蓄富室專於趨利其處家室則女勤作業而士多自間聚會宴飲尤足意錢之戲小人薄於情禮父子率多異居其邊野富人多規固山澤以財物雄役夷獠故輕為姦藏權傾州縣此亦其舊俗乎又有獽狿蠻賨其居處風俗衣服飲食頗同於獠而亦與蜀人相類

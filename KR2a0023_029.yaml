body:
  text: 隋書卷二十九志第二十四地理上京兆郡馮翊郡扶風郡安定郡北地郡上郡雕陰郡延安郡弘化郡平涼郡朔方郡鹽川郡靈武郡榆林郡五原郡天水郡隴西郡金城郡枹罕郡澆河郡西平郡武威郡張掖郡敦煌郡鄯善郡且末郡西海郡河源郡漢川郡西城郡房陵郡清化郡通川郡宕渠郡漢陽郡臨洮郡宕昌郡武都郡同昌郡河池郡順政郡義城郡平武郡汶山郡普安郡金山郡新城郡巴西郡遂寧郡涪陵郡巴郡巴東郡蜀郡臨卭郡眉山郡隆山郡資陽郡瀘川郡犍為郡越巂郡黔安郡自古聖王之受命也莫不體國經野以為人極上應躔次下裂山河分疆畫界建都錫社是以放勛御曆修職貢者九州文命會同執玉帛者萬國洎乎殷遷夏鼎周黜殷命雖質文之用不同損益之途或革而封建之制率由舊章於是分土惟三列爵惟五千里以制畿甸九服以別要荒十國為連連有帥倍連為卒卒有正皆所以式固鴻基蕃屏王室興邦致化康俗庇人者歟周德既衰諸侯力政干戈日用戎馬生郊強陵弱衆暴寡魯滅於楚鄭滅於韓田氏篡齊六卿分晉其餘弒君亡國不得守其社稷者不可勝數逮于七雄競逐二帝爭強疆埸之事一彼一此秦始皇據百二之巖險奮六世之餘烈力爭天下蠶食諸侯在位二十餘年遂乃削平宇內懲周氏之微弱恃狙詐以為強蔑棄經典罷侯置守子弟無立錐之地功臣無尺土之賞身沒而區宇幅裂及子而社稷淪胥漢高祖挺神武之宏圖掃清禍亂矯秦皇之失策封建王侯並跨州連邑有踰古典而郡縣之制無改於秦逮于孝武務勤遠略南兼百越東定三韓通卭笮之險塗斷胸奴之右臂雖聲教遠洎而人亦勞止昭宣之後罷戰務農戶口既其滋多郡縣亦有增置至于平帝郡國一百有三戶一千二百二十三萬光武中興承王莽之餘弊兵戈不戢飢疫荐臻率土遺黎十才一二乃併省郡縣四百餘所明章之後漸至滋繁郡縣之數有加曩日逮炎靈數盡三國爭強兵革屢興戶口減半有晉太康之後文軌方同大抵編戶二百六十餘萬尋而五胡逆亂二帝播遷東晉洎于宋齊僻陋江左苻姚之與劉石竊據中原事迹糾紛難可具紀梁武帝除暴寧亂奄有舊吳天監十年有州二十三郡三百五十縣千二十二其後務恢境宇頻事經略開拓閩越克復淮浦平俚洞破柯又以舊州遐闊多有析置大同年中州一百七郡縣亦稱於此既而侯景構禍臺城淪陷墳籍散逸注記無遺郡縣戶口不能詳究逮于陳氏土宇彌蹙西亡蜀漢北喪淮肥威力所加不出荊揚之域州有四十二郡唯一百九縣四百三十八戶六十萬後齊承魏末喪亂與周人抗衡雖開拓淮南而郡縣僻小天保之末總加併省洎乎國滅州九十有七郡一百六十縣三百六十五戶三百三萬周氏初有關中百度草創遂乃訓兵教戰務穀勸農南清江漢西兼巴蜀卒能以寡擊衆戡定強鄰及于東夏削平多有省廢大象二年通計州二百一十一郡五百八縣一千一百二十四高祖受終惟新朝政開皇三年遂廢諸郡洎于九載廓定江表尋以戶口滋多析置州縣煬帝嗣位又平林邑更置三州既而併省諸州尋即改州為郡乃置司隸刺史分部巡察五年平定吐谷渾更置四郡大凡郡一百九十縣一千二百五十五戶八百九十萬七千五百四十六口四千六百一萬九千九百五十六墾田五千五百八十五萬四千四十一頃其邑居道路山河溝洫沙磧鹹鹵丘陵阡陌皆不預焉東西九千三百里南北萬四千八百一十五里東南皆至於海西至且末北至五原隋氏之盛極於此也京兆郡開皇三年置雍州城東西十八里一百一十五步南北十五里一百七十五步東面通化春明延興三門南面啓夏明德安化三門西面延平金光開遠三門北面光化一門里一百六市二大業三年改州為郡故名焉置尹統縣二十二戶三十萬八千四百九十九大興開皇三年置後周于舊郡置縣曰萬年高祖龍潛封號大興故至是改焉有長樂宮有後魏杜城縣西霸城縣西魏山北縣並後周廢長安帶郡有仙都福陽太平等宮有關官有舊長安城始平故置扶風郡開皇三年郡廢武功後周置武功郡建德中郡廢有永豐渠普濟渠盩厔後周置周南郡及州又有倉城溫湯二縣尋並廢有司竹園有宜壽仙遊文山鳳皇等宮有關官有太一山有溫湯醴泉後魏曰寧夷西魏置寧夷郡後周改為秦郡後廢又以新畤甘泉二縣入焉開皇十八年改縣名醴泉有甘泉水波水浪水有九嵕山溫秀嶺上宜開皇十七年置有舊莫西縣十八年改名好畤大業三年廢入焉鄠有甘泉宮有終南山有潦水藍田後周置藍田郡尋廢郡及白鹿玉山二縣入焉有關官有滋水新豐有溫湯華原後魏置北雍州西魏改為宜州又置北地郡尋改為通川郡開皇初郡廢大業初州廢及土門縣入焉有沮水頻山宜君舊置宜君郡開皇初郡廢有清水同官鄭後魏置東雍州並華山郡西魏改曰華州開皇初郡廢大業初州廢有少華山渭南後魏置渭南郡西魏分置靈源中源二縣後周郡及二縣並廢入焉有步壽宮萬年高陵後魏曰高陸大業初改焉三原後周置建忠郡建德初郡廢涇陽舊置咸陽縣開皇初廢有茂農渠雲陽舊置後周置雲陽郡開皇初郡廢有涇水五龍水甘水走馬水富平舊置北地郡後周改曰中華郡尋罷有荊山華陰有興德宮有關官有京輔都尉有白渠有華山馮翊郡後魏置華州西魏改曰同州統縣八戶九萬一千五百七十二馮翊後魏曰華陰西魏改為武鄉置武鄉郡開皇初郡廢大業初改名馮翊置馮翊郡有沙苑韓城開皇十八年置有關官有梁山有鬼谷郃陽朝邑後魏曰南五泉西魏改焉有長春宮有關官有朝坂澄城後魏置澄城郡後周併五泉縣入焉開皇初郡廢蒲城舊置南北二白水西魏改為蒲城置白水郡開皇初郡廢下邽舊置延壽郡開皇初郡廢大業初併蓮勺縣入焉有金氏陂白水有五龍山馬蘭山扶風郡舊置岐州統縣九戶九萬二千二百二十三雍後魏置秦平郡西魏改為岐山郡開皇三年郡廢大業初置扶風郡有岐陽宮岐山後周曰三龍縣開皇十六年改名焉又有後魏周城縣後周廢有岐山陳倉後魏曰宛川西魏改曰陳倉後周置顯州尋州縣俱廢開皇十八年置曰陳倉有陳倉山有關官虢後魏置武都郡西魏改縣曰洛邑後周置朔州州尋廢郡開皇初廢大業初改縣為虢郿舊曰平陽縣西魏改曰郿城後周廢入周城縣開皇十八年改周城為渭濱大業二年改為郿又後周置雲州建德中廢有安仁宮鳳泉宮有太白山五丈原普閏大業初置有仁壽宮有漆水岐水杜水汧源西魏置隴東郡及汧陰縣後改縣曰杜陽後周又曰汧陰開皇三年郡廢五年縣改曰汧源又有西魏東秦州後改為隴州大業三年州廢有關官有隴山汧山汧水汧陽舊置汧陽郡後周罷南由後魏置西魏改為鎮後周復置縣又有舊長蛇縣開皇末廢有關官有盤龍山安定郡舊置涇州統縣七戶七萬六千二百八十一安定帶郡鶉觚舊置趙平郡後周廢郡並以宜祿縣入焉大業初分置靈臺縣二年廢陰盤後魏置平涼郡開皇初郡廢有盧水朝那西魏置安武郡及析置安武縣開皇三年郡縣並廢入焉良原大業初置臨涇大業初置初曰湫谷尋改焉華亭大業初置有隴水芮水北地郡後魏置豳州西魏改為寧州大業初復曰豳州統縣六戶七萬六百九十定安舊置趙興郡開皇初郡廢大業初置北地郡羅川舊曰陽周開皇中改焉又西魏置顯州後周廢有橋山彭原舊曰彭陽後魏置西北地郡有洛蟠城西魏置蔚州有豐城西魏置雲州後周二州並廢開皇初郡廢十八年改縣曰彭原有珊瑚水襄樂後魏置襄樂郡後周廢又西魏置燕州後周廢又有子午山新平舊曰白土西魏置豳州開皇四年改縣為新平大業初州廢三水西魏置州尋廢上郡後魏置東秦州後改為北華州西魏改為敷州大業二年改為鄜城郡後改為上郡統縣五戶五萬三千四百八十九洛交開皇三年置大業三年置上郡內部舊置敷州及內部郡開皇三年郡廢大業初州廢三川舊名長城西魏改焉又有利仁縣尋廢入焉鄜城後魏曰敷城大業初改焉洛川有鄜水雕陰郡西魏置綏州大業初改為上州統縣十一戶三萬六千一十八上縣西魏置安寧郡與安寧綏德安人三縣同置開皇初郡廢改安人為吉萬大業初置雕陰郡廢安寧吉萬二縣入又後周置義良縣亦廢入焉大斌西魏置仍立安政郡開皇初廢有平水延福西魏置曰延陵開皇中改焉儒林後周置銀州開皇三年改名焉大業初州廢真鄉西魏置後周置真鄉郡開皇初郡廢開光舊置開光郡開皇三年郡廢有圁水銀城後周置曰石城後改名焉城平西魏置開疆西魏置有後魏撫寧郡開皇三年郡廢撫寧西魏置綏德西魏置延安郡後魏置東夏州西魏改為延州置總管府開皇中府廢統縣十一戶五萬三千九百三十九膚施大業三年置及置延安郡有豐林山豐林後魏置曰廣武及遍城郡開皇初郡廢十八年改為豐林大業初又併沃野縣入焉魏平後魏置並立朔方郡後周廢郡併朔方政和二縣入焉金明有冶官有清水臨真有西魏神水郡真川縣後周郡廢大業初廢真川入焉延川西魏置曰文安及置文安郡開皇初郡廢改縣為延川延安西魏置又置義鄉縣大業中廢義鄉入焉因城後魏置後周廢尋又置義川西魏置汾州義川郡後改州為丹州後周改縣為丹陽開皇初郡廢改縣曰義川又廢樂川郡入大業初州廢又廢雲巖縣入焉汾川舊曰安平後周改曰汾川大業初廢門山縣入焉咸寧舊曰永寧西魏改為太平開皇中改為咸寧弘化郡西魏置朔州後周廢開皇十六年置慶州統縣七戶五萬二千四百七十三合水開皇十六年置大業初置弘化郡馬嶺大業初置華池仁壽初置又西魏置蔚州後周廢歸德西魏置州後周廢有雕水洛源大業初置有博水洱水弘化開皇十八置弘州大業初州廢弘德大業初置平涼郡舊置原州後周置總管府大業初府廢統縣五戶二萬七千九百九十五平高後魏置太平郡後改為平高開皇初郡廢大業初置平涼郡有關官有笄頭山百泉後魏置長城郡及黃石縣西魏改黃石為長城開皇初郡廢大業初縣改為百泉平涼後周置有可藍山會寧西魏置會州後周廢開皇十六年置縣默亭朔方郡後魏置夏州後周置總管府大業初府廢統縣三戶一萬一千六百七十三巖緑西魏置弘化郡開皇初廢大業初置朔方郡寧朔後周置長澤西魏置闡熙郡又有後魏大安郡及置長州開皇三年郡廢又廢山鹿新二縣入焉大業三年州廢鹽川郡西魏置西安州後改為鹽州統縣一戶三千七百六十三五原後魏置郡曰大興西魏改為五原後又為大興開皇初郡廢大業初置鹽川郡靈武郡後魏置靈州後周置總管府大業元年府廢統縣六戶一萬二千三百三十回樂後周置帶普樂郡又西魏置臨河郡開皇元年改臨河郡曰新昌三年郡並廢大業初置靈武郡弘靜開皇十一年置有賀蘭山懷遠後周置仍立懷遠郡開皇三年郡廢靈武後周置曰建安後又置歷城郡開皇三年郡廢十八年改建安為廣閏仁壽元年改名焉鳴沙後周置會州尋廢開皇十九年置環州及鳴沙縣大業三年州廢有關官豐安開皇十年置榆林郡開皇二十年置勝州統縣三戶二千三百三十榆林開皇七年置大業初置郡富昌開皇十年置金河開皇三年置曰陽壽及置油雲縣又置榆關總管五年改置雲州總管十八年改陽壽曰金河二十年雲州移二縣俱廢仁壽二年又置金河縣帶關五原郡開皇五年置豐州仁壽元年置總管府大業元年府廢統縣三戶二千三百三十九原開皇五年置大業初置郡永豐開皇五年置安化開皇十一年置天水郡舊
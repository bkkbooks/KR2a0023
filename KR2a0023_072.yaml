body:
  text: 隋書卷七十二列傳第三十七孝義孝經云夫孝天之經也地之義也人之行也論語云君子務本本立而道生孝悌也者其為仁之本與呂覽云夫孝三皇五帝之本務萬事之綱紀也執一術而百善至百邪去天下順者其唯孝乎然則孝之為德至矣其為道遠矣其化人深矣故聖帝明王行之於四海則與天地合其德與日月齊其明諸侯卿大夫行之於國家則永保其宗社長守其祿位匹夫匹婦行之於閭閻則播徽烈於當年揚休名於千載此皆資純至以感物故聖哲之所重田翼郎方貴等闕稽古之學無俊偉之才並能任其自然情無矯飾篤於天性勤其四體竭股肱之力盡愛敬之心自足膝下之歡忘懷軒冕之貴不言之化人神通感雖或位登台輔爵列王侯祿積萬鍾馬踰千駟死之日曾不得與斯人之徒隸齒孝之大也不其然乎故述其所行為孝義傳陸彥師陸彥師字雲房魏郡臨漳人祖希道魏定州刺史父子彰中書監彥師少有行檢為邦族所稱長而好學解屬文魏襄城王元旭引為參軍事以父艱去職哀毀殆不勝喪與兄卬廬於墓次負土成墳公卿重之多就墓側存問晦朔之際車馬不絶齊文宣聞而嘉歎旌表其閭號其所住為孝終里中書令河間邢邵表薦之未報彭城王浟為司州牧召補主簿後歷中外府東閣祭酒兄卬當襲父始平侯以彥師昆弟中最幼表讓封焉彥師固辭而止時稱友悌孝義總萃一門遷中書舍人尋轉通直散騎侍郎每陳使至必令高選主客彥師所接對者前後六輩歷中書黃門侍郎以不阿宦者遇讒出為中山太守有惠政數年徵為吏部郎中周武平齊授載師下大夫宣帝時轉少納言賜爵臨水縣男奉使幽薊俄而高祖為丞相彥師遇疾請假還鄴尉迥將為亂彥師微知之遂委妻子潛歸長安高祖嘉之授內史下大夫拜上儀同高祖受禪拜尚書左丞進爵為子彥師素多病未幾以務劇疾動乞解所職有詔聽以本官就第歲餘轉吏部侍郎隋承周制官無清濁彥師在職凡所任人頗甄別於士庶論者美之後復以病出為汾州刺史卒官田德懋田德懋觀國公仁恭之子也少以孝友著名開皇初以父軍功賜爵平原郡公授太子千牛備身丁父艱哀毀骨立廬於墓側負土成墳上聞而嘉之遣員外散騎侍郎元志就吊焉復降璽書曰皇帝謝田德懋知在窮疾哀毀過禮倚廬墓所負土成墳朕孝理天下思弘名教復與汝通家情義素重有聞孝感嘉歎兼深春日暄和氣力何似宜自抑割以禮自存也並賜縑二百匹米百石復下詔表其門閭後歷太子舍人義州司馬大業中為給事郎尚書駕部郎卒官薛濬薛濬字道賾刑部尚書內陽公胄之從祖弟也父琰周渭南太守濬少喪父早孤養母以孝聞幼好學有志行尋師於長安時初平江陵何妥歸國見而異之授以經業周天和中襲爵虞城侯歷納言上士新豐令開皇初擢拜尚書虞部侍郎尋轉考功侍郎帝聞濬事母至孝以其母老賜輿服機杖四時珍味當時榮之後其母疾濬貌甚憂瘁親故弗之識也暨丁母艱詔鴻臚監護喪事歸葬夏陽于時隆冬極寒濬衰絰徒跣冒犯霜雪自京及鄉五百餘里足凍墮指瘡血流離朝野為之傷痛州里賵助一無所受尋起令視事濬屢陳誠發請終喪制優詔不許及至京上見其毀瘠過甚為之改容顧謂羣臣曰吾見薛濬哀毀不覺悲感傷懷嗟異久之濬竟不勝喪病且卒其弟謨時為晉王府兵曹參軍事在揚州濬遺書與謨曰吾以不造幼丁艱酷窮遊約處屢絶簞瓢晚生早孤不聞詩禮賴奉先人貽厥之訓獲稟母氏聖善之規負笈裹糧不憚艱遠從師就業欲罷不能砥行厲心困而彌篤服膺教義爰至長成自釋耒登朝于茲二十三年矣雖官非聞達而祿喜逮親庶保期頤得終色養何圖精誠無感禍酷荐臻兄弟俱被奪情苫廬靡申哀訴是用扣心泣血隕氣摧魂者也既而創巨釁深不勝荼毒啓手啓足幸及全歸使夫死而有知得從先人於地下矣豈非至願哉但念爾伶俜孤宦遠在邊服顧此恨恨如何可言適已有書冀得與汝面訣忍死待汝已歷一旬汝既未來便成今古緬然永別為恨何言勉之哉勉之哉書成而絶時年四十二有司以聞高祖為之屑涕降使齎册書弔祭曰皇帝咨故考功侍郎薛濬於戲惟爾操履貞和器業詳敏允膺列宿勤謇克彰及遘私艱奄從毀滅嘉爾誠孝感于朕懷奠酹有加抑惟朝典故遣使人指申往命魂而有靈歆茲榮渥嗚呼哀哉濬性清儉死之日家無遺資濬初為童兒時與宗中諸兒遊戲于澗濱見一黃蛇有角及足召羣兒共視了無見者濬以為不祥歸大憂悴母逼而問之濬以實對時有胡僧詣宅乞食濬母怖而告之僧曰此乃兒之吉應且是兒也早有名位然壽不過六七耳言終而出忽然不見時咸異之既而終於四十二六七之言於是驗矣子乾福武安郡司倉書佐王頒王頒字景彥太原祁人也祖神念梁左衛將軍父僧辨太尉頒少俶儻有文武幹局其父平侯景留頒質於荊州遇元帝為周師所陷頒因入關聞其父為陳武帝所殺號慟而絶食頃乃蘇哭泣不絶聲毀瘠骨立至服闋常布衣蔬食藉藁而臥周明帝嘉之召授左侍上士纍遷漢中太守尋拜儀同三司開皇初以平蠻功加開府封蛇丘縣公獻取陳之策上覽而異之召與相見言畢而歔欷上為之改容及大舉伐陳頒自請行率徒數百人從韓擒先鋒夜濟力戰被傷恐不堪復鬬悲感嗚咽夜中因睡夢有人授藥比寤而創不痛時人以為孝感及陳滅頒密召父時士卒得千餘人對之涕泣其間壯士或問頒曰郎君來破陳國滅其社稷讎恥已雪而悲哀不止者將為霸先早死不得手刃之邪請發其丘壟櫬焚骨亦可申孝心矣頒頓顙陳謝額盡流血答之曰其為帝王墳塋甚大恐一宵發掘不及其尸更至明朝事乃彰露若之何諸人請具鍬鍤一旦皆萃於是夜發其陵剖棺見陳武帝鬚並不落其本皆出自骨中頒遂焚骨取灰投水而飲之既而自縳歸罪於晉王王表其狀高祖曰朕以義平陳王頒所為亦孝義之道也朕何忍罪之舍而不問有司録其戰功將加柱國賜物五千段頒固辭曰臣緣國威靈得雪怨恥本心徇私非是為國所加官賞終不敢當高祖從之拜代州刺史甚有惠政母憂去職後為齊州刺史卒官時年五十二弟頍見文學傳楊慶楊慶字伯悅河間人也祖玄父剛並以至孝知名慶美姿儀性辨慧年十六齊國子博士徐遵明見而異之及長頗涉書記年二十五郡察孝廉以侍養不行其母有疾不解襟帶者七旬及居母憂哀毀骨立負土成墳齊文宣帝表其門閭賜帛三十匹綿十屯粟五十石高祖受禪屢加褒賞擢授儀同三司版授平陽太守年八十五終於家郭俊郭俊字弘乂太原文水人也家門雍睦七葉共居犬豕同乳烏鵲通巢時人以為義感之應州縣上其事上遣平昌公宇文詣其家勞問之治書御史柳彧巡省河北表其門閭漢王諒為並州總管聞而嘉歎賜兄弟二十餘人衣各一襲田翼田翼不知何許人也性至孝養母以孝聞其後母臥疾歲餘翼親易燥濕母食則食母不食則不食母患暴痢翼謂中毒遂親嘗惡及母終翼一慟而絶其妻亦不勝哀而死鄉人厚共葬之紐回紐回字孝政河東安邑人也性至孝周武成中父母喪廬於墓側負土成墳廬前生麻一株高丈許圍之合拱枝葉鬱茂冬夏恆青有烏棲其上回舉聲哭烏即悲鳴時人異之周武帝表其閭擢授甘棠令開皇初卒子士雄少質直孝友喪父復廬於墓側負土成墳其庭前有一槐樹先甚鬱茂及士雄居喪樹遂枯死服闋還宅死樹復榮高祖聞之歎其父子至孝下詔褒揚號其所居為纍德里劉士俊劉士俊彭城人也性至孝丁母喪絶而復蘇者數矣勺飲不入口者七日廬於墓側負土成墳列植松柏狐狼馴擾為之取食高祖受禪表其門閭郎方貴郎方貴淮南人也少有志尚與從父弟雙貴同居開皇中方貴嘗因出行遇雨淮水泛長於津所寄渡船人怒之撾方貴臂折至家其弟雙貴驚問所由方貴具言之雙貴恚恨遂向津毆擊船人致死守津者執送之縣官案問其狀以方貴為首當死雙貴從坐當流兄弟二人爭為首坐縣司不能斷送詣州兄弟各引咎州不能定二人爭欲赴水而死州狀以聞上聞而異之特原其罪表其門閭賜物百段後為州主簿翟普林翟普林楚丘人也性仁孝事親以孝聞州郡辟命皆固辭不就躬耕色養鄉鄰謂為楚丘先生後父母疾親易燥濕不解衣者七旬大業初父母俱終哀毀殆將滅性廬於墓側負土為墳盛冬不衣繒絮唯者單縗而已家有一烏犬隨其在墓若普林哀臨犬亦悲號見者嗟異焉有二鵲巢其廬前柏樹每入其廬馴狎無所驚懼大業中司隸巡察奏其孝感擢授孝陽令李德饒李德饒趙郡柏人人也祖徹魏尚書右丞父純開皇中為介州長史德饒少聰敏好學有至性宗黨咸敬之弱冠為校書郎仍直內史省參掌文翰轉監察御史糾正不避貴戚大業三年遷司隸從事每巡四方理雪寃枉褒揚孝悌雖位秩未通其德行為當時所重凡與交結皆海內髦彥性至孝父母寢疾輒終日不食十旬不解衣及丁憂水漿不入口五日哀慟嘔血數升及送葬之日會仲冬積雪行四十餘里單縗徒跣號踴幾絶會葬者千餘人莫不為之流涕後甘露降於庭樹有鳩巢其廬納言楊達巡省河北詣其廬弔慰之因改所居村名孝敬村里為和順里後為金河長未之官值羣盜蜂起賊帥格謙孫宣雅等十餘頭聚衆於渤海時有勑許其歸首謙等懼不敢降以德饒信行有聞遣使奏曰若使德饒來者即相率歸首帝於是遣德饒往渤海慰諭諸賊行至冠氏會他盜攻陷縣城德饒見害其弟德紹性重然諾大業末為離石郡司法書佐太守楊子崇特禮之及義兵起子崇遇害棄尸城下德紹赴哭盡哀收瘞之至介休詣義師請葬子崇大將軍嘉之因贈子崇官令德紹為使者往離石禮葬子崇焉華秋華秋汲郡臨河人也幼喪父事母以孝聞家貧傭賃為養其母遇患秋容貌毀悴鬚鬢頓改州里咸嗟異之及母終之後遂絶櫛沐髮盡禿落廬於墓側負土成墳有人欲助之者秋輒拜而止之大業初調狐皮郡縣大獵有一兔人逐之奔入秋廬中匿秋膝下獵人至廬所異而免之自爾此兔常宿廬中馴其左右郡縣嘉其孝感具以狀聞煬帝降使勞問表其門閭後羣盜起常往來廬之左右咸相誡曰勿犯孝子鄉人賴秋而全者甚衆徐孝肅徐孝肅汲郡人也宗族數千家多以豪侈相尚唯孝肅性儉約事親以孝聞雖在幼齒宗黨間每有爭訟皆至孝肅所平論之為孝肅所短者無不引咎而退孝肅早孤不識父及長問其母父狀因求畫工圖其形像構廟置之而定省焉朔望享祭養母至孝數十年家人未見其有忿恚之色及母老疾孝肅親易燥濕憂悴數年見者無不悲悼母終孝肅茹蔬飲水盛冬單縗毀瘠骨立祖父母父母墓皆負土成墳廬於墓所四十餘載被髮徒跣遂以身終其弟德備聰敏通涉五經河朔間稱為儒者德備終子處默又廬於墓側奕葉稱孝焉史臣曰昔者弘愛敬之理必籍王公大人近古敦孝友之情多茅屋之下而彥師道賾或家傳纓冕或身誓山河遂乃負土成墳致毀滅性雖乖先王之制亦觀過以知仁矣郎貴昆弟爭死而身全田翼夫妻俱喪而名立德饒仁懷羣盜德紹義感興王亦足稱也紐回劉俊之倫翟林華秋之輩或茂草嘉樹榮枯於庭宇或走獸翔禽馴狎於廬墓非夫孝悌之至通於神明者乎

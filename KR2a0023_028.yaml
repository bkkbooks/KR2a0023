畿外諸郡從事四十人副刺史巡察其所掌六條一察品官以上理政能不二察官人貪殘害政三察豪強姦猾侵害下人及田宅踰制官司不能禁止者四察水旱蟲災不以實言枉徵賦役及無災妄蠲免者五察部內賊盜不能窮逐隱而不申者六察德行孝悌茂才異行隱不貢者每年二月乘軺巡郡縣十月入奏置丞從六品主簿從八品録事從九品各一人後又罷司隸臺而留司隸從事之名不為常員臨時選京官清明者權攝以行光祿已下八寺卿皆降為從三品少卿各加置二人為從四品諸寺上署令並增為正六品中署令為從六品下署令為正七品始開皇中署司唯典掌受納至是署令為判首取二卿判丞唯知勾檢令闕丞判五年寺丞並增為從五品太常寺罷太祝署而留太祝員八人屬寺後又增為十人奉禮減置六人太廟署又置陰室丞守視陰室改樂師為樂正置十人太卜又省博士員置太卜卜正二十人以掌其事太醫又置醫監五人正十人罷衣冠清商二署太僕減驊騮署入殿內尚乘局改龍曰典署有左右駁皂二加置主乘司庫司廪官罷牛羊署大理寺丞改為勾檢官增正員為六人分判獄事置司直十六人降為從六品後加至二十人又置評事四十八人掌頗同司直正九品鴻臚寺改典客署為典蕃署初煬帝置四方館於建國門外以待四方使者後罷之有事則置名隸鴻臚寺量事繁簡臨時損益東方曰東夷使者南方曰南蠻使者西方曰西戎使者北方曰北狄使者各一人掌其方國及互市事每使者署典護録事職儀監府監置互市監及副參軍各一人録事主綱紀職掌其貴賤立功合者儀掌小大次序監府掌其貢獻財貨監置掌安置其駝馬船車並糾察非違互市監及副掌互市參軍事出入交易司農但統上林太倉鉤盾導官四署罷典農華林二署而以平準京市隸太府太府寺既分為少府監而但管京都市五署及平準左右藏等凡八署京師東市曰都會西市曰利人東都東市曰豐都南市曰大同北市曰通遠及改諸令為監唯市署曰令國子監依舊置祭酒加置司業一人從四品丞三人加為從六品並置主簿録事各一人國子學置博士正五品助教從七品員各一人學生無常員太學博士助教各二人學生五百人先是仁壽元年省國子祭酒博士置太學博士員五人為從五品總知學事至是太學博士降為從六品將作監改大監少監為大匠少匠丞加為從六品統左右校及甄官署五年又改大匠為大監正四品少匠為少監正五品十三年又改監少監為令少令丞加品至從五品少府監置監從三品少監從四品各一人丞從五品二人統左尚右尚內尚司織司染鎧甲弓弩掌冶等署復改監少監為令少令併司織司染為織染署廢鎧甲弓弩二署都水監改為使者增為正五丞為從七品統舟楫河渠二署舟楫署每津置尉一人五年又改使者為監四品加置少監為五品後又改監少監為令從三品少令從四品長秋監置令一人正四品少令一人從五品丞二人正七品並用士人改內常侍為內承奉置二人正五品給事為內承直置四人從五品並用宦者罷內謁者官領掖庭宮闈奚官等三署並參用士人後又置內謁者員十二衛各置大將軍一人將軍二人總府事並統諸鷹揚府改驃騎為鷹揚郎將正五品車騎為鷹揚副郎將從五品大都督為校尉帥都督為旅帥都督為隊正增置隊副以二之改三衛為三侍其直閣將軍直寢奉車都尉駙馬都尉直齋別將統軍軍主幢主之屬並廢以武候府司辰師員隸為太史局官其軍士左右衛所領名為驍騎左右驍衛所領名豹騎左右武衛所領名熊渠左右屯衛所領名羽林左右禦衛所領名射聲左右候衛所領名佽飛而總號衛士每衛置護軍四人掌副二將軍將軍無則一人攝尋改護軍為武賁郎將正四品而置武牙郎將六人副焉從四品諸衛皆置長史從五品又有録事參軍司倉兵騎鎧等員翊衛又加有親侍鷹揚府每府置鷹揚郎將一人正五品副鷹揚郎將一人從五品各有司馬及兵倉兩司其府領親勳武三侍非翊衛府皆無三侍鷹揚每府置越騎校尉二人掌騎士步兵校尉二人領步兵並正六品外軍鷹揚官並同左右候衛增置察非掾二人專糾彈之事五年又改副郎將並為鷹擊郎將左右領左右府改為左右備身府各置備身郎將一人又各置直齋二人以二之並正四品掌侍衛左右統千牛左右司射左右各十六人並正六品千牛掌執千牛刀宿衛司射掌供御弓箭置長史正六品録事司兵倉騎參軍等員並正八品有折衝郎將各三人正四品掌領驍果又各置果毅郎將三人以二之從四品其驍果置左右雄武府雄武郎將以領之以武勇郎將為副員同鷹揚鷹擊有司兵司騎二局並置參軍事左右監門府改將軍為郎將各置一人正四品直閣各六人正五品置官屬並同備身府又增左右門尉員一百二十人正六品置門候員二百四十人正七品並分掌門禁守衛門下坊減內舍人洗馬員各置二人減侍醫置二人改門大夫為宮門監正字為正書典書坊改太子舍人為管記舍人減置四人改通事舍人為宣令舍人為八員家令改為司府令內坊承直改為典直左右衛率改為左右侍率正四品改親衛為功曹勳衛為義曹翊衛為良曹罷直齋直閣員左右宗衛率改為左右武侍率正四品左右虞候開府改為左右虞候率正四品並置副率左右內率降為正五品千牛備身改為司仗左右備身左右改為主射左右各員八人左右監門率改為宮門將降為正五品監門直長改為直事置六十人開皇中置國王郡王國公郡公縣公侯伯子男為九等者至是唯留王公侯三等餘並廢之王府諸司參軍更名諸司書佐屬參軍則直以屬為名改國令為家令自餘以國為名者皆去之行宮所在皆立總監以司之上宮正五品中宮從五品下宮正七品隴右諸牧置左右牧監各一人以司統之罷州置郡郡置太守上郡從三品中郡正四品下郡從四品京兆河南則俱為尹並正三品罷長史司馬置贊務一人以二之京兆河南從四品上郡正五品中郡從五品下郡正六品次置東西曹掾京兆河南從五品上郡正六品中郡從六品下郡正七品主簿司功倉戶兵法士曹等書佐各因郡之大小而為增減改行參軍為行書佐舊有兵處則刺史帶諸軍事以統之至是別置都尉副都尉都尉正四品領兵與郡不相知副都尉正五品又置京輔都尉從三品立府於潼關主兵領遏並置副都尉從四品又置諸防主副官掌同諸鎮大興長安河南洛陽四縣令並增為正五品諸縣皆以所管間劇及衝要以為等級丞主簿如故其後諸郡各加置通守一人位次太守京兆河南則謂之內史又改郡贊務為丞位在通守下縣尉為縣正尋改正為戶曹法曹分司以承郡之六司河南洛陽長安大興則加置功曹而為三司司各二人郡縣佛寺改為道場道觀改為玄壇各置監丞京都諸坊改為里皆省除里司官以主其事帝自三年定令之後驟有制置制置未久隨復改易其餘不可備知者蓋史之闕文云

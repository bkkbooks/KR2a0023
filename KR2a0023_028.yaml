body:
  text: 隋書卷二十八志第二十三百官下高祖既受命改周之六官其所制名多依前代之法置三師三公及尚書門下內史祕書內侍等省御史都水等臺太常光祿衛尉宗正太僕大理鴻臚司農太府國子將作等寺左右衛左右武衛左右武候左右領左右監門左右領軍等府分司統職焉三師不主事不置府僚蓋與天子坐而論道者也三公參議國之大事依後齊置府僚無其人則闕祭祀則太尉亞獻司徒奉俎司空行掃除其位多曠皆攝行事尋省府及僚佐置公則坐於尚書都省朝之衆務總歸於臺閣尚書省事無不總置令左右僕射各一人總吏部禮部兵部都官度支工部等六曹事是為八座屬官左右丞各一人都事八人分司管轄吏部尚書統吏部侍郎二人主爵侍郎一人司勳侍郎二人考功侍郎一人禮部尚書統禮部祠部侍郎各一人主客膳部侍郎各二人兵部尚書統兵部職方侍郎各二人駕部庫部侍郎各一人都官尚書統都官侍郎二人刑部比部侍郎各一人司門侍郎二人度支尚書統度支戶部侍郎各二人金部倉部侍郎各一人工部尚書統工部屯田侍郎各二人虞部水部侍郎各一人凡三十六侍郎分司曹務直宿禁省如漢之制門下省納言二人給事黃門侍郎四人録事通事令史各六人又有散騎常侍通直散騎常侍各四人諫議大夫七人散騎侍郎四人員外散騎常侍六人通直散騎侍郎四人並掌部從朝直又有給事二十人員外散騎侍郎二十人奉朝請四十人並掌同散騎常侍等兼出使勞問統城門尚食尚藥符璽御府殿內等六局城門局校尉二人直長四人尚食局典御二人直長四人食醫四人尚藥局典御二人侍御醫直長各四人醫師四十人符璽御府殿內局監各二人直長各四人內史省置監令各一人尋廢監置令二人侍郎四人舍人八人通事舍人十六人主書十人録事四人祕書省監丞各一人郎四人校書郎十二人正字四人録事二人領著作太史二曹著作曹置郎二人佐郎八人校書郎正字各二人太史曹置令丞各二人司曆二人監候四人其曆天文漏刻視祲各有博士及生員內侍省內侍內常侍各二人內給事四人內謁者監六人內寺伯二人內謁者十二人寺人六人伺非八人並用宦者領內尚食掖庭宮闈奚官內僕內府等局尚食置典御及丞各二人餘各置令丞皆二人其宮闈內僕則加置丞各一人掖庭又有宮教博士二人御史臺大夫一人治書侍御史二人侍御史八人殿內侍御史監察御史各十二人録事二人後魏延昌中王顯有寵於宣武為御史中尉請革選御史此後踵其事每一中尉則更置御史自開皇後始自吏部選用仍依舊入直禁中都水臺使者及丞各二人參軍三十人河堤謁者六十人録事二人領掌船局都水尉二人又領諸津上津每尉一人丞二人中津每尉丞各一人下津每典作一人津長四人太常光祿衛尉宗正太僕大理鴻臚司農太府等九寺並置卿少卿各一人太僕尋加少卿一人各置丞太常衛尉宗正大理鴻臚將作二人光祿太僕各三人司農五人太府六人主簿太府四人餘寺各二人録事各二人光祿則加至三人司農太府則各四人等員太常寺又有博士四人協律郎二人奉禮郎十六人統郊社太廟諸陵太祝衣冠太樂清商鼓吹太醫太卜廩犧等署各置令並一人太樂太醫則各加至二人丞各一人郊社太樂鼓吹則各至二人郊社署又有典瑞四人太祝署有太祝二人太樂署清商署各有樂師員太樂八人清商二人鼓吹署有哄師二人太醫署有主藥二人醫師二百人藥園師二人醫博士二人助教二人按摩博士二人祝禁博士二人等員太卜署有卜師二十人相師十人男覡十六人女巫八人太卜博士助教各二人相博士助教各一人等員光祿寺統太官肴藏良醞掌醢等署各置令太官三人肴藏良醞各二人掌醢一人丞太官八人肴藏掌醢各二人良醞四人太官又有監膳十二人良醞有掌醞五十人掌醢有掌醢十人等員衛尉寺統公車武庫守宮等署各置令公車一人武庫守宮各二人丞公車一人武庫二人等員宗正寺不統署太僕寺又有獸醫博士員一百二十人統驊騮乘黃龍車府典牧牛羊等署各置令二人乘黃車府則各減一人丞二人乘黃則一人典牧牛羊則各三人等員大理寺不統署又有正監評各一人司直十人律博士八人明法二十人獄掾八人鴻臚寺統典客司儀崇玄三署各置令二人崇玄則惟置一人典客署又有掌客十人司儀有掌儀二十人等員司農寺統太倉典農平準廩市鉤盾華林上林導官等署各置令二人鉤盾上林則加至三人華林惟置一人太倉又有米廩督二人穀倉督四人鹽倉督二人京市有肆長四十人導官有御細倉督二人麴麥丏倉督二人等員太府寺統左藏左尚方內尚方右尚方司染右藏黃藏掌冶甄官等署各置令二人左右尚方則加至二人黃藏則惟置一人丞四人左尚則八人右尚則六人黃藏則一人等員國子寺元隸太常祭酒一人屬官有主簿録事各一人統國子太學四門書算學各置博士國子太學四門各五人書算各二人助教國子太學四門各五人書算各二人學生國子一百四十人太學四門各三百六十人書四十人算八十人等員將作寺大匠一人丞主簿録事各二人統左右校署令各二人丞左校四人右校三人各有監作左校十二人右校八人等員左右衛左右武衛左右武候各大將軍一人將軍二人並有長史司馬録事功倉兵騎等曹參軍法曹鎧曹行參軍各一人行參軍左右衛左右武候各六人左右武衛各八人等員左右衛掌宮掖禁禦督攝仗衛又各有直閣將軍六人直寢十二人直齋直後各十五人並掌宿衛侍從奉車都尉六人掌馭副車武騎常侍十人殿內將軍十五人員外將軍三十人殿內司馬督二十人員外司馬督四十人並以參軍府朝出使勞問左右衛又各統親衛置開府左勳衛開府左翊一開府二開府三開府四開府及武衛武候領軍東宮領兵開府準此府置開府一人有長史司馬録事及倉兵等曹參軍法曹行參軍各一人行參軍三人又有儀同府武衛武候領軍東宮領兵儀同皆準此儀同已下置員同開府但無行參軍員諸府皆領軍坊每坊東宮軍坊準此置坊主一人佐二人每鄉團東宮鄉團準此置團主一人佐二人左右武衛府無直閣已下員但領外軍宿衛左右武候掌車駕出先驅後殿晝夜巡察執捕姦非烽候道路水草所置巡狩師田則掌其營禁右加置司辰師四人漏刻生一百一十人左右領左右府各大將軍一人將軍二人掌侍衛左右供御兵仗領千牛備身十二人掌執千牛刀備身左右十二人掌供御弓箭備身六十人掌宿衛侍從各置長史司馬録事及倉兵二曹參軍事鎧曹行參軍各一人等員左右監門府各將軍一人掌宮殿門禁及守衛事各置郎將二人校尉直長各三十人長史司馬録事及倉兵曹參軍鎧曹行參軍各一人行參軍四人等員左右領軍府各掌十二軍籍帳差科辭訟之事不置將軍唯有長史司馬掾屬及録事功倉戶騎兵等曹參軍法鎧等曹行參軍各一人行參軍十六人等員又置明法四人隸於法司掌律令輕重行臺省則有尚書令僕射左右任置兵部兼吏部禮部度支兼都官工部尚書及丞左右任置各一人都事四人有考功兼吏部爵部司勳禮部兼祠部主客膳部兵部兼職方駕部庫部刑部兼都官司門度支兼倉部戶部兼比部金部工部屯田兼水部虞部侍郎各一人每行臺置食貨農圃武器百工監副監各一人各置丞食貨四人農圃六人武器二人百工四人録事食貨農圃百工各二人武器一人等員太子置太師太傅太保少師少傅少保開皇初置詹事二年定令罷之門下坊置左庶子二人內舍人四人録事二人主事令史四人統司經宮門內直典膳藥藏齋帥等六局司經置洗馬四人校書六人正字二人宮門置大夫二人內直置監副監各二人監殿舍人四人典膳藥藏並置監丞各二人藥藏又有侍醫四人齋帥置四人典書坊右庶子二人舍人通事舍人各八人録事二人主事令史四人內坊典內及丞各二人丞直四人録事一人內置尉二人掌內車輿之事家令掌刑法食膳倉庫什物奴婢等事率更令掌伎樂漏刻僕掌宗族親疏車輿騎乘各一人三寺各置丞家令二人寺各一人録事家令二人寺各一人家令領食官典倉司藏三署令各一人丞食官二人典倉一人司藏三人僕寺領牧令一人員左右衛各置率一人副率二人掌宮中禁衛各置長史司馬及録事功倉兵騎兵等曹參軍事法曹鎧曹行參軍各一人行參軍四人員又各有直閣四人直寢八人直齋直後各十人左右宗衛制官如左右衛各掌以宗人侍衛加置行參軍二人而無直閣直寢直齋直後等員左右虞候各置開府一人掌斥候伺非長史已下如左右衛而無録事參軍員減行參軍一人左右內率副率各一人掌領備身已上禁內侍衛供奉兵仗又無功騎兵法等曹及行參軍員餘與虞候同有千牛備身八人掌執千牛刀備身左右八人掌供奉弓箭備身二十人掌宿衛侍從左右監門各率一人副率二人掌諸門禁長史已下同內率府而各有直長十人高祖又採後周之制置上柱國柱國上大將軍大將軍上開府儀同三司開府儀同三司上儀同三司儀同三司大都督帥都督都督總十一等以酬勤勞又有特進左右光祿大夫金紫光祿大夫銀青光祿大夫朝議大夫朝散大夫並為散官以加文武官之德聲者並不理事六品已下又有翊軍等四十三號將軍品凡十六等為散號將軍以加泛授居曹有職務者為執事官無職務者為散官戎上柱國已下為散實官軍為散號官諸省及左右衛武候領左右監門府為內官自餘為外官國王郡王國公郡公縣公侯伯子男凡九等皇伯叔昆弟皇子為親王置師友各二人文學二人嗣王則無師友長史司馬咨議參軍事掾屬各一人主簿二人録事功曹記室戶倉兵等曹騎兵城局等參軍事東西閣祭酒各一人參軍事四人法田水鎧士等曹行參軍各一人行參軍六人長兼行參軍八人典籤二人上柱國嗣王郡王無主簿録事參軍東西閣祭酒長兼行參軍等員而加參軍事為五人行參軍為十二人柱國又無騎兵參軍事水曹行參軍等員而減參軍事行參軍各一人上大將軍又無咨議參軍事田曹鎧曹行參軍員又減行參軍一人大將軍又無掾屬員又減參軍事二人上開府又無法曹士曹行參軍參軍事員開府又無典籤員減行參軍二人上儀同又無功曹城局參軍事員又減行參軍二人儀同又無倉曹員減行參軍三人三師三公置府佐與柱國同若上柱國任三師三公唯從上柱國置王公已下三品已上又並有親信帳內各隨品高卑而制員諸王置國官有令大農各一人尉各二人典衛各八人常侍各二人侍郎各四人廟長學官長各一人食官牧長丞各一人典府長丞各一人舍人各四人等員上柱國柱國公減典衛二人無侍郎員侯伯又減典衛二人食官牧長各一人子男又減尉典衛常侍舍人各一人上大將軍大將軍公同柱國子男其侯伯減公典衛侍郎牧丞各一人子男無令無典衛又減舍人一人上開府開府公同大將軍子男其侯伯又無常侍無食官牧丞子男又無侍郎牧長上儀同儀同公同開府子男其侯伯又無尉無學官長子男又無長食官長二王後置國官與諸王同郡王與上柱國公同國公無上開府已上官者與開府公同散郡公與儀同侯伯同散縣公與儀同子男同大長公主長公主公主並置家令丞各一人主簿謁者舍人各二人等員郡主唯減主簿員雍州置牧屬官有別駕贊務州都郡正主簿録事西曹書佐金戶兵法士等曹從事部郡從事武猛從事等員並佐
body:
  text: 隋書卷一帝紀第一高祖上高祖文皇帝姓楊氏諱堅弘農郡華陰人也漢太尉震八代孫鉉仕燕為北平太守鉉生元壽後魏代為武川鎮司馬子孫因家焉元壽生太原太守惠嘏嘏生平原太守烈烈生寧遠將軍禎禎生忠忠即皇考也皇考從周太祖起義關西賜姓普六茹氏位至柱國大司空隋國公薨贈太保諡曰桓皇妣呂氏以大統七年六月癸丑夜生高祖於馮翊般若寺紫氣充庭有尼來自河東謂皇妣曰此兒所從來甚異不可於俗間處之尼將高祖舍於別館躬自撫養皇妣嘗抱高祖忽見頭上角出遍體鱗起皇妣大駭墜高祖於地尼自外入見曰已驚我兒致令晚得天下為人龍顏額上有五柱入頂目光外射有文在手曰王長上短下沈深嚴重初入太學雖至親昵不敢狎也年十四京兆尹薛善辟為功曹十五以太祖勳授散騎常侍車騎大將軍儀同三司封成紀縣公十六遷驃騎大將軍加開府周太祖見而嘆曰此兒風骨不似代間人明帝即位授右小宮伯進封大興郡公帝嘗遣善相者趙昭視之昭詭對曰不過作柱國耳既而陰謂高祖曰公當為天下君必大誅殺而後定善記鄙言武帝即位遷左小宮伯出為隋州刺史進位大將軍後徵還遇皇妣寢疾三年晝夜不離左右代稱純孝宇文護執政尤忌高祖屢將害焉大將軍侯伏侯壽等匡護得免其後襲爵隋國公武帝娉高祖長女為皇太子妃益加禮重齊王憲言於帝曰普六茹堅相貌非常臣每見之不覺自失恐非人下請早除之帝曰此止可為將耳內史王軌驟言於帝曰皇太子非社稷主普六茹堅貌有反相帝不悅曰必天命有在將若之何高祖甚懼深自晦匿建德中率水軍三萬破齊師於河橋明年從帝平齊進位柱國與宇文憲破齊任城王高湝於冀州除定州總管先是定州城西門久閉不行齊文宣帝時或請開之以便行路帝不許曰當有聖人來啓之及高祖至而開焉莫不驚異尋轉亳州總管宣帝即位以后父徵拜上柱國大司馬大象初遷大後丞右司武俄轉大前疑每巡幸委居守時帝為刑經聖制其法深刻高祖以法令滋章非興化之道切諫不納高祖位望益隆帝頗以為忌帝有四幸姬並為皇后諸家爭寵數相毀譖帝每忿怒謂后曰必族滅爾家因召高祖命左右曰若色動即殺之高祖既至容色自若乃止大象二年五月以高祖為揚州總管將發暴有足疾不果行乙未帝崩時靜帝幼沖未能親理政事內史上大夫鄭譯御正大夫劉昉以高祖皇后之父衆望所歸遂矯詔引高祖入總朝政都督內外諸軍事周氏諸王在藩者高祖悉恐其生變稱趙王招將嫁女於突厥為詞以徵之丁未發喪庚戌周帝拜高祖假黃金戊左大丞相百官總己而聽焉以正陽宮為丞相府以鄭譯為長史劉昉為司馬具置僚佐宣帝時刑政苛酷羣心崩駭莫有固志至是高祖大崇惠政法令清簡躬履節儉天下悅之六月趙王招陳王純越王盛代王達滕王逌並至于長安相州總管尉遲迥自以重臣宿將志不能平遂舉兵東夏趙魏之士從者若流旬日之間衆至十餘萬又宇文胄以滎州石遜以建州席毗以沛郡毗弟叉羅以兗州皆應於迥迥遣子質於陳請援高祖命上柱國鄖國公韋孝寬討之雍州牧畢王賢及趙陳等五王以天下之望歸於高祖因謀作亂高祖執賢斬之寢趙王等之罪因詔五王劍履上殿入朝不趨用安其心七月陳將陳紀蕭摩訶等寇廣陵吳州總管于顗轉擊破之廣陵人杜喬生聚衆反刺史元義討平之韋孝寬破尉遲迥於相州傳首闕下餘黨悉平初迥之亂也鄖州總管司馬消難據州響應淮南州縣多同之命襄州總管王誼討之消難奔陳荊郢羣蠻乘釁作亂命亳州總管賀若誼討平之先是上柱國王謙為益州總管既見幼主在位政由高祖遂起巴蜀之衆以匡復為辭高祖方以東夏山南為事未遑致討謙進兵屯劍閣陷始州至是乃命行軍元帥上柱國梁睿討平之傳首闕下巴蜀阻險人好為亂於是更開平道毀劍閣之路立銘垂誡焉五王陰謀滋甚高祖齎酒肴以造趙王第欲觀所為趙王伏甲以宴高祖高祖幾危賴元胄以濟語在胄傳於是誅趙王招越王盛九月以世子勇為洛州總管東京小冢宰壬子周帝詔曰假黃鉞使持節左大丞相都督內外諸軍事上柱國大冢宰隋國公堅感山河之靈應星辰之氣道高雅俗德協幽顯釋巾登仕搢紳傾屬開物成務朝野承風受詔先皇弼諧寡薄合天地而生萬物順陰陽而撫四夷近者內有艱虞外聞妖寇以鷹鸇之志運帷帳之謀行兩觀之誅掃萬里之外遐邇清肅實所賴焉四海之廣百官之富俱禀大訓咸餐至道治定功成棟梁斯託神猷盛德莫二於時可授大丞相罷左右丞相之官餘如故冬十月壬申詔贈高祖曾祖烈為柱國太保都督徐兗等十州諸軍事徐州刺史隋國公諡曰康祖禎為柱國太傅都督陝蒲等十三州諸軍事同州刺史隋國公諡曰獻考忠為上柱國太師大冢宰都督冀定等十三州諸軍事雍州牧誅陳王純癸酉上柱國鄖國公韋孝寬卒十一月辛未誅代王達滕王逌十二月甲子周帝詔曰天大地大合其德者聖人一陰一陽調其氣者上宰所以降神載挺陶鑄羣生代蒼蒼之工成巍巍之業假黃鉞使持節大丞相都督內外諸軍事上柱國大冢宰隋國公應百代之期當千齡之運家隆台鼎之盛門有翊贊之勤心同伊尹必致堯舜情類孔丘憲章文武爰初入仕風流映世公卿仰其軌物搢紳謂為師表入處禁闈出居藩政芳猷茂績問望彌遠往平東夏人情未安燕南趙北實為天府擁節杖旄任當連率柔之以德導之以禮畏之若神仰之若日芳風美迹歌頌獨存淮海榛蕪多歷年代作鎮南鄙選衆惟賢威震殊俗化行黔首任掌鉤陳職司邦政國之大事朝寄更深鑾駕巡游留臺務廣周公陝西之任僅可為倫漢臣關內之重未足相況及天崩地坼先帝升遐朕以眇年奄經荼毒親受顧命保乂皇家姦人乘隙潛圖宗社無君之意已成竊發之期有日英規潛運大略川回匡國庇人罪人斯得兩河遘亂三魏稱兵半天之下洶洶鼎沸祖宗之基已危生人之命將殆安陸作釁南通吳越蜂飛蠆聚江漢騷然巴蜀鴟張翻將問鼎秦塗更阻漢門重閉畫籌帷帳建出師車諸將禀其謀壯士感其義不違時日咸得清蕩九功遠被七德允諧百僚師師四門穆穆光景照臨之地風雲去來之所允武允文幽明同德驟山驟水遐邇歸心使朕繼踵上皇無為以治聲高宇宙道格天壤伊尹輔殷霍光佐漢方之蔑如也昔營丘曲阜地多諸國重耳小白錫用殊禮蕭何優贊拜之儀番君越公侯之爵姬劉以降代有令謨宜崇典禮憲章自昔可授相國總百揆去都督內外諸軍事大冢宰之號進公爵為王以隋州之崇業鄖州之安陸城陽溫州之宜人應州之平靖上明順州之淮南士州之永川昌州之廣昌安昌申州之義陽淮安息州之新蔡建安豫州之汝南臨潁廣寧初安蔡州之蔡陽郢州之漢東二十郡為隋國劍履上殿入朝不趨贊拜不名備九錫之禮加璽紱遠游冠相國印緑綟綬位在諸侯王上隋國置丞相已下一依舊式高祖再讓不許乃受王爵十郡而已詔進皇祖考爵並為王夫人為王妃辛巳司馬消難以陳師寇江州刺史成休寧擊却之大定元年春二月壬子令曰已前賜姓皆復其舊是日周帝詔曰伊周作輔不辭殊禮之錫桓文為霸允應異物之典所以表格天之勳彰不代之業相國隋王前加典策式昭大禮固守謙光絲言未綍宜申顯命一如往旨王功必先人賞存後己退讓為本誠乖朕意宜命百辟盡詣王宮衆心克感必令允納如有表奏勿復通聞癸丑文武百官詣閣敦勸高祖乃受甲寅策曰咨爾假黃鉞使持節大丞相都督內外諸軍事上柱國大冢宰隋王天覆地載藉人事以財成日往月來由王道而盈昃五氣陶鑄萬物流形誰代上玄之工斯則大聖而已曰惟先正翊亮皇朝種德積善載誕上相精采不代風骨異人匡國濟時除凶撥亂百神奉職萬國宅心殷相以先知悟人周輔乃弘道於代方斯蔑如也今將授王典禮其敬聽朕命朕以不德早承丕緒上靈降禍夙遭愍凶妖醜覬覦密圖社稷宮省之內疑慮驚心公受命先皇志在匡弼輯諧內外潛運機衡姦人懾憚謀用丕顯俾贅旒之危為太山之固是公重造皇室作霸之基也伊我祖考之代任寄已深入掌禁兵外司藩政文經武略久播朝野戎軒大舉長驅晉魏平陽震熊羆之勢冀部耀貔豹之威初平東夏人情未一叢臺之北易水之南西距井陘東至滄海比數千里舉袂如帷委以連城建旌杖節教因其俗刑用輕典如泥從印猶草隨風此又公之功也吳越不賓多歷年代淮海之外時非國有爰整其旅出鎮於亳武以威物文以懷遠羣盜自奔外戶不閉人黎慕義襁負而歸自北之風化行南國此又公之功也宣帝御宇任重宗臣入典八屯外司九代禁衛勤巡警之務治兵得搜狩之禮此又公之功也鑾駕游幸頻委留臺文武注意軍國咨禀萬事咸理反顧無憂此又公之功也朕在諒暗公實總己磐石之宗姦回者衆招引無賴連結羣小往者國衰甫爾已創陰謀積惡數旬昆吾方稔泣誅磬甸宗廟以寧此又公之功也尉迥猖狂稱兵鄴邑欲長戟而指北闕冖出蟲弩而圍南斗憑陵三魏之間震驚九州之半聚徒百萬悉成蛇豕淇水洹水一飲而竭人之死生翻繫凶豎壽之長短不由司命公乃戒彼鷹揚出車練卒誓蒼兕於河朔建瓴水於山東口授兵書手畫行陳量敵制勝指日剋期諸將遵其成旨壯士感其大義輕死忘生轉鬬千里旗鼓奮發如火燎毛玄黃變漳河之水京觀比爵臺之峻百城氛祲一旦廓清此又公之功也青土連率跨據東秦藉負海之饒倚連山之險望三輔而將逐鹿指六國而願連雞風雨之兵助鬼為虐本根既拔枝葉自殞屈法申恩示以大信此又公之功也申部殘賊充斥一隅蠅飛蟻聚攻州略地播以玄澤迷更知反服而捨之無費遺鏃此又公之功也宇文胄親則宗枝外藩巖邑影響鄴賊有同就燥迫脅吏人叛換城戍偏師討蹙遂入網羅束之武牢有同囹圄事窮將軍如伏國刑此又公之功也檀讓席毗擁衆河外陳韓梁鄭宋衛鄒魯村落成梟獍之墟入庶為豺狼之餌強以陵弱大則吞小城有晝閉巷無行人授律出師隨機掃定讓既授首毗亦梟懸此又公之功也司馬消難與國親姻作鎮安陸性多嗜欲意好貪聚屬城子女劫掠靡餘部人貨財多少具罄擅誅刺舉之使專殺儀台之臣懼罪畏威動而內奰蠶食郡縣鴆毒華夷聞有王師自投南裔帝唐崇山之罰僅可方此大漢流禦之刑是亦相匹逋逃入藪荊郢用安此又公之功也王謙在蜀翻為厲階閉劍閣之門塞靈關之宇自謂五丁復起萬夫莫向分閫推轂嘗不踰時風馳席卷一舉大定擒斬凶惡掃地無遺此又公之功也陳頊因循僞業自擅金陵屢遣醜徒趑趄江北公指麾藩鎮無不摧殄方置文深之柱非止尉他之拜此又公之功也公有濟天下之勤重之以明德始於辟命屈己登庸素業清徽聲掩廊廟雄規神略氣蓋朝野序百揆而穆四門一匡之舉九合尊賢崇德尚齒貴功録舊旌善興亡繼絶寬猛相濟彝倫攸敦睦帝親崇奬王室星象不拆陰陽自調玄冥祝融如奉太公之召雨師風伯似應成王之宰祥風嘉氣觸石搖林瑞獸異禽游園鳴閣至功至德可大可久盡品物之和究杳冥之極朕又聞之昔者明王設官胙土營丘四履得征五侯參墟寵章異其禮物故藩屏作固垂拱責成沈默巖廊不下堂席公道高往烈賞薄前王朕以眇身託于兆人之上求諸故實甚用懼焉往加大典憲章在昔謙以自牧未應朝禮日月不居便已隔歲時談物議其謂朕何今進授相國總百揆以申州之義陽等二十郡為隋國今命使持節太傅上柱國嵵國公椿大宗伯大將軍金城公趙煚授相國印綬相國禮絶百辟任總羣官舊職常典宜與事革昔堯臣太尉舜佐司空姬旦相周霍光輔漢不居藩國唯在天朝其以相國總百揆去衆號焉上所假節大丞相大冢宰印綬又加九錫其敬聽朕後命以公執律修德慎獄恤刑為其訓範人無異志是用錫公大輅戎輅各一玄牡二駟公勤心地利所寶人天崇本務農公私殷阜是用錫公袞冕之服赤舄副焉公樂以移風雅以變俗遐邇胥悅天地咸和是用錫公軒懸之樂六佾之舞公仁風德教覃及海隅荒忽幽遐回首內向是用錫公朱戶以居公水鏡人倫銓衡庶職能官流詠遺賢必舉是用錫公納陛以登公執鈞於內正性率下犯義無禮罔不屏黜是用錫公武賁之士三百人公元本闕是用錫公鈇鉞各一公威嚴夏日精厲秋霜猾夏必誅顧天壤掃清姦宄折衝無外是用錫公彤弓一彤矢百盧弓十盧矢千惟公孝通神明肅恭祀典尊嚴如在情切幽明是用錫公秬鬯一卣圭瓚副焉隋國置丞相以下一遵舊式往欽哉其敬循往策祇服大典簡恤爾庶功對揚我太祖之休命於是建臺置官丙辰詔王冕十有二旒建天子旌旗出警入蹕乘金根車駕六馬備五時副車置旄頭雲樂舞八佾設鍾虡宮懸王妃為王后長子為太子前後三讓乃受俄而周帝以衆望有歸乃下詔曰元氣肇闢樹之以君有命不所輔惟德天心人事選賢與能盡四海而樂推非一人而獨有周德將盡妖孽遞生骨肉多虞藩維構釁影響同惡過半區宇或小或大圖帝圖王則我祖宗之業不絶如線相國隋王睿聖自天英華獨秀刑法與禮儀同運文德共武功俱遠愛萬物其如己任兆庶以為憂手運璣衡躬命將士芟夷姦宄刷蕩氛祲化通冠帶威震幽遐虞舜之大功二十未足相比姬發之合位三五豈可足論況木行已謝火運既興河洛出革命之符星辰表代終之象煙雲改色笙簧變音獄訟咸歸謳歌盡至且天地合德日月貞明故以稱大為王照臨下土朕雖寡昧未達變通幽顯之情皎然易識今便祗順天命出遜別宮禪位於隋一依唐虞漢魏故事高祖三讓不許遣兼太傅上柱國嵵國公椿奉冊曰咨爾相國隋王粵若上古之初爰啓清濁降符授聖為天下君事上帝而理兆人和百靈而利萬物非以區宇之富未以宸極為尊大庭軒轅以前驪連赫胥之日咸以無為無欲不將不迎遐哉其詳不可聞已厥有載籍遺文可觀聖莫逾於堯美未過於舜堯得太尉已作運衡之篇舜遇司空便精華之竭彼褰裳脫屣二宮設饗百辟歸禹若帝之初斯蓋上則天時不敢不授下祗天命不可不受湯代於夏武革於殷干戈揖讓雖復異揆應天順人其道靡異自漢迄晉有魏至周天曆逐獄訟之歸神鼎隨謳歌之去道高者稱帝録盡者不王與夫文祖神宗無以別也周德將盡禍難頻興宗戚姦回咸將竊發顧瞻宮闕將圖宗社藩維連率逆亂相尋搖蕩三方不合如礪蛇行鳥攫投足無所王受天明命睿德在躬救頽運之艱匡墜地之業拯大川之溺撲燎原之火除羣凶於城社廓妖氛於遠服至德合於造化神用洽於天壤八極九野萬方四裔圓首方足罔不樂推往歲長星夜掃經天晝見八風比夏后之作五緯同漢帝之聚除舊之徵昭然在上近者赤雀降祉玄龜效靈鍾石變音蛟魚出穴布新之貺煥焉在下九區歸往百靈協贊人神屬望我不獨知仰祗皇靈俯順人願今敬以帝位禪於爾躬天祚告窮天祿永終於戲王宜允執厥和儀刑典訓升圓丘而敬蒼昊御皇極而撫黔黎副率土之心恢無疆之祚可不盛歟遣大宗伯大將軍金城公趙煚奉皇帝璽紱百官勸進高祖乃受焉開皇元年二月甲子上自相府常服入宮備禮即皇帝位於臨光殿設壇於南郊遣使柴燎告天是日告廟大赦改元京師慶雲見易周氏官儀依漢魏之舊以柱國相國司馬渤海郡公高熲為尚書左僕射兼納言相國司録沁源縣公虞慶則為內史監兼吏部尚書相國內郎咸安縣男李德林為內史令上開府漢安縣公韋世康為禮部尚書上開府義寧縣公元暉為都官尚書開府民部尚書昌國縣公元巖為兵部尚書上儀同司宗長孫毗為工部尚書上儀同司會楊尚希為度支尚書上柱國雍州牧國公楊惠為左衛大將軍乙丑追尊皇考為武元皇帝廟號太祖皇妣為元明皇后遣八使巡省風俗丙寅修廟社立王后獨孤氏為皇后王太子勇為皇太子丁卯以大將軍金城郡公趙煚為尚書右僕射上開府濟陽侯伊婁彥恭為左武候大將軍己巳以周帝為介國公邑五千戶為隋室賓旌旗車服禮樂一如其舊上書不為表答表不稱詔周氏諸王盡降為公辛未以皇弟同安郡公爽為雍州牧乙亥封皇弟邵國公慧為滕王同安公爽為衛王皇子雁門公廣為晉王俊為秦王秀為越王諒為漢王以上柱國並州總管申國公李穆為太師上柱國鄧國公竇熾為太傅上柱國幽州總管任國公于翼為太尉觀國公田仁恭為太子太師武德郡公柳敏為太子太保濟南郡公孫恕為太子少傅開府蘇威為太子少保丁丑以晉王廣為並州總管以陳留郡公楊智積為蔡王興城郡公楊靜為道王戊寅以官牛五千頭分賜貧人三月辛巳高平獲赤雀太原獲蒼烏長安獲白雀各一宣仁門槐樹連理衆枝內附壬午白狼國獻方物甲申太白晝見乙酉又晝見以上柱國元景山為安州總管丁亥詔犬馬器玩口味不得獻上戊子弛山澤之禁以上開府當亭縣公賀若弼為楚州總管和州刺史新義縣公韓擒為廬州總管己丑盩厔縣獻連理樹植之宮庭辛卯以上柱國神武郡公竇毅為定州總管戊戌以太子少保蘇威兼納言吏部尚書餘官如故庚子詔曰自古帝王受終革代建侯錫爵多與運遷朕應籙受圖君臨海內載懷沿革事有不同然則前帝後王俱在兼濟立功立事爵賞仍行苟利於時其致一揆何謂物我之異無計今古之殊其前代品爵悉可依舊丁未梁主蕭巋使其太宰蕭巖司空劉義來
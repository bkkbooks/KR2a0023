十卷百家集譜十卷王儉撰梁有王逡之續儉百家譜四卷南族譜二卷百家譜拾遺一卷又有齊梁帝譜四卷梁帝譜十三卷亡百家譜三十卷王僧孺撰百家譜集鈔十五卷王僧孺撰百家譜二十卷賈執撰百家譜十五卷傅昭撰百家譜世統十卷百家譜鈔五卷姓氏英賢譜一百卷賈執撰案梁有王司空新集諸州譜十一卷又別有諸姓譜一百一十六卷益州譜四十卷關東關北譜三十三卷梁武帝總集境內十八州譜六百九十卷亡後魏辨宗録二卷元暉業撰後魏皇帝宗族譜四卷魏孝文列姓族牒一卷後齊宗譜一卷益州譜三十卷冀州姓族譜二卷洪州諸姓譜九卷吉州諸姓譜八卷江州諸姓譜十一卷諸州雜譜八卷袁州諸姓譜八卷揚州譜鈔五卷京兆韋氏譜二卷謝氏譜一十卷楊氏血脈譜二卷楊氏家譜狀並墓記一卷楊氏枝分譜一卷楊氏譜一卷北地傅氏譜一卷蘇氏譜一卷述系傳一卷姚最撰氏族要狀十五卷姓苑一卷何氏撰復姓苑一卷齊永元中表簿五卷竹譜一卷錢譜一卷顧烜撰錢圖一卷右四十一部三百六十卷通計亡書合五十三部一千二百八十卷氏姓之書其所由來遠矣書稱別生分類傳曰天子建德因生以賜姓周家小史定繫世辨昭穆則亦史之職也秦兼天下剗除舊迹公侯子孫失其本繫漢初得世本黃帝已來祖世所出而漢又有帝王年譜後漢有鄧氏官譜晉世摯虞作族姓昭穆記十卷齊梁之間其書轉廣後魏遷洛有八氏十姓咸出帝族又有三十六族則諸國之從魏者九十二姓世為部落大人者並為河南洛陽人其中國士人則第其門閥有四海大姓郡姓州姓縣姓及周太祖入關諸姓子孫有功者並令為其宗長仍撰譜録紀其所承又以關內諸州為其本望其鄧氏官譜及族姓昭穆記晉亂已亡自餘亦多遺失今録其見存者以為譜系篇七略別録二十卷劉向撰七略七卷劉歆撰晉中經十四卷荀勗撰晉義熙已來新集目録三卷宋元徽元年四部書目録四卷王儉撰今書七志七十卷王儉撰梁天監六年四部書目録四卷殷鈞撰梁東宮四部目録四卷劉遵撰梁文德殿四部目録四卷劉孝標撰七録十二卷阮孝緒撰魏闕書目録一卷陳祕閣圖書法書目録一卷陳天嘉六年壽安殿四部目録四卷陳德教殿四部目録四卷陳承香殿五經史記目録二卷開皇四年四部目録四卷開皇八年四部書目録四卷香四部目録四卷隋大業正御書目録九卷法書目録六卷雜儀注目録四卷雜撰文章家集十卷荀勗撰文章志四卷摯虞撰續文章志二卷傅亮撰晉江左文章志三卷宋明帝撰宋世文章志二卷沈約撰書品二卷名手畫録一卷正流論一卷右三十部二百一十四卷古者史官既司典籍蓋有目録以為綱紀體制堙滅不可復知孔子刪書別為之序各陳作者所由韓毛二詩亦皆相類漢時劉向別録劉歆七略剖析條流各有其部推尋事迹疑則古之制也自是之後不能辨其流別但記書名而已博覽之士疾其渾漫故王儉作七志阮孝緒作七録並皆別行大體雖準向歆而遠不逮矣其先代目録亦多散亡今總其見存編為簿録篇凡史之所記八百一十七部一萬三千二百六十四卷通計亡書合八百七十四部一萬六千五百五十八卷夫史官者必求博聞強識疏通知遠之士使居其位百官衆職咸所二焉是故前言往行無不識也天文地理無不察也人事之紀無不達也內掌八柄以詔王治外執六典以逆官政書美以彰善記惡以垂戒範圍神化昭明令德窮聖人之至賾詳一代之斖斖自史官廢絶久矣漢氏頗循其舊班馬因之魏晉已來其道逾替南董之位以祿貴遊政駿之司罕因才授故梁世諺曰上車不落則著作體中何如則祕書於是尸素之儔盱衡延閣之上立言之士揮翰蓬茨之下一代之記至數十家傳説不同聞見舛駁理失中庸辭乖體要致令允恭之德有闕於典墳忠肅之才不傳於簡策斯所以為蔽也班固以史記附春秋今開其事類凡十三種別為史部

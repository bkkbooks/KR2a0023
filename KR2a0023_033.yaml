body:
  text: 隋書卷三十三志第二十八經籍二史史記一百三十卷目録一卷漢中書令司馬遷撰史記八十卷宋南中郎外兵參軍裴駰注史記音義十二卷宋中散大夫徐野民撰史記音三卷梁輕車録事參軍鄒誕生撰古史考二十五卷晉義陽亭侯譙周撰漢書一百一十五卷漢護軍班固撰太山太守應劭集解漢書集解音義二十四卷應劭撰漢書音訓一卷服虔撰漢書音義七卷韋昭撰漢書音二卷梁尋陽太守劉顯撰漢書音二卷夏侯詠撰漢書音義十二卷國子博士蕭該撰漢書音十二卷廢太子勇命包愷等撰漢書集注十三卷晉灼撰漢書注一卷齊金紫光祿大夫陸澄撰漢書續訓三卷梁平北咨議參軍韋稜撰漢書訓纂三十卷陳吏部尚書姚察撰漢書集解一卷姚察撰論前漢事一卷蜀丞相諸葛亮撰漢書駁議二卷晉安北將軍劉寶撰定漢書疑二卷姚察撰漢書傳五卷項岱撰漢疏四卷梁有漢書孟康音九卷劉孝標注漢書一百四十卷陸澄注漢書一百二卷梁元帝注漢書一百一十五卷並亡東觀漢記一百四十三卷起光武記注至靈帝長水校尉劉珍等撰後漢書一百三十卷無帝紀吳武陵太守謝承撰後漢記六十五卷本一百卷梁有今殘缺晉散騎常侍薛瑩撰續漢書八十三卷晉祕書監司馬彪撰後漢書十七卷本九十七卷今殘缺晉少府卿華嶠撰後漢書八十五卷本一百二十二卷晉祠部郎謝沈撰後漢南記四十五卷本五十五卷今殘缺晉江州從事張瑩撰後漢書九十五卷本一百卷晉祕書監袁山松撰後漢書九十七卷宋太子詹事范曄撰後漢書一百二十五卷范曄本梁剡令劉昭注後漢書音一卷後魏太常劉芳撰范漢音訓三卷陳宗道先生臧競撰范漢音三卷蕭該撰後漢書讚論四卷范曄撰漢書纘十八卷范曄撰梁有蕭子顯後漢書一百卷王韶後漢林二百卷韋闡後漢音二卷亡魏書四十八卷晉司空王沈撰吳書二十五卷韋昭撰本五十五卷梁有今殘缺吳紀九卷晉太學博士環濟撰晉有張勃吳録三十卷亡三國志六十五卷録一卷晉太子中庶子陳壽撰宋太中大夫裴松之注魏志音義一卷盧宗道撰論三國志九卷何常侍撰三國志評三卷徐衆撰梁有三國志序評三卷晉著作佐郎王濤撰亡晉書八十六卷本九十三卷今殘缺晉著作郎王隱撰晉書二十六卷本四十四卷訖明帝今殘缺晉散騎常侍虞預撰晉書十卷未成本十四卷今殘缺晉中書郎朱鳳撰訖元帝晉中興書七十八卷起東晉宋湘東太守何法盛撰晉書三十六卷宋臨川內史謝靈運撰晉書一百一十卷齊徐州主簿臧榮緒撰晉書十一卷本一百二卷梁有今殘缺蕭子雲撰晉史草三十卷梁蕭子顯撰梁有鄭忠晉書七卷沈約晉書一百一十一卷庾銑東晉新書七卷亡宋書六十五卷宋中散大夫徐爰撰宋書六十五卷齊冠軍録事參軍孫嚴撰宋書一百卷梁尚書僕射沈約撰梁有宋大明中所撰宋書六十一卷亡齊書六十卷梁吏部尚書蕭子顯撰齊紀十卷劉陟撰齊紀二十卷沈約撰梁有江淹齊史十三卷亡梁書四十九卷梁中書郎謝吳撰本一百卷梁史五十三卷陳領軍大著作郎許亨撰梁書帝紀七卷姚察撰通史四百八十卷梁武帝撰起三皇訖梁後魏書一百三十卷後齊僕射魏收撰後魏書一百卷著作郎魏彥深撰陳書四十二卷訖宣帝陳吏部尚書陸瓊撰周史十八卷未成吏部尚書牛弘撰右六十七部三千八十三卷通計亡書合八十部四千三十卷古者天子諸侯必有國史以紀言行後世多務其道彌繁夏殷已上左史記言右史記事周則太史小史內史外史御史分掌其事而諸侯之國亦置史官又春秋國語引周志鄭書之説推尋事迹似當時記事各有職司後又合而撰之總成書記其後陵夷衰亂史官放絶秦滅先王之典遺制莫存至漢武帝時始置太史公命司馬談為之以掌其職時天下計書皆先上太史副上丞相遺文古事靡不畢臻談乃據左氏國語世本戰國策楚漢春秋接其後事成一家之言談卒其子遷又為太史令嗣成其志上自黃帝訖于炎漢合十二本紀十表八書三十世家七十列傳謂之史記遷卒以後好事者亦頗著述然多鄙淺不足相繼至後漢扶風班彪綴後傳數十篇並譏正前失彪卒明帝命其子固續成其志以為唐虞三代世有典籍史遷所記乃以漢氏繼於百王之末非其義也故斷自高祖終於孝平王莽之誅為十二紀八表十志六十九傳潛心積思二十餘年建初中始奏表及紀傳其十志竟不能就固卒後始命曹大家續成之先是明帝召固為蘭臺令史與諸先輩陳宗尹敏孟冀等共成光武本紀擢固為郎典校祕書固撰後漢事作列傳載記二十八篇其後劉珍劉毅劉陶伏無忌等相次著述東觀謂之漢記及三國鼎峙魏氏及吳並有史官晉時巴西陳壽刪集三國之事唯魏帝為紀其功臣及吳蜀之主並皆為傳仍各依其國部類相從謂之三國志壽卒後梁州大中正范穎表奏其事帝詔河南尹洛陽令就壽家寫之自是世有著述皆擬班馬以為正史作者尤廣一代之史至數十家唯史記漢書師法相傳並有解釋三國志及范曄後漢雖有音注既近世之作並讀之可知梁時明漢書有劉顯韋稜陳時有姚察隋代有包愷蕭該並為名家史記傳者甚微今依其世代聚而編之以備正史紀年十二卷汲冢書並竹書同異一卷漢紀三十卷漢祕書監荀悅撰後漢紀三十卷袁彥伯撰後漢紀三十卷張璠撰獻帝春秋十卷袁曄撰魏氏春秋二十卷孫盛撰魏紀十二卷左將軍陰淡撰漢魏春秋九卷孔舒元撰晉紀四卷陸機撰晉紀二十三卷干寶撰訖愍帝晉紀十卷晉前軍咨議曹嘉之撰漢晉陽秋四十七卷訖愍帝晉滎陽太守習鑿齒撰晉紀十一卷訖明帝晉荊州別駕鄧粲撰晉陽秋三十二卷訖哀帝孫盛撰晉紀二十三卷宋中散大夫劉謙之撰晉紀十卷宋吳興太守王韶之撰晉紀四十五卷宋中散大夫徐廣撰續晉陽秋二十卷宋永嘉太守檀道鸞撰續晉紀五卷宋新興太守郭季産撰宋略二十卷梁通直郎裴子野撰宋春秋二十卷梁吳興令王琰撰齊春秋三十卷梁奉朝請吳均撰齊典五卷王逸撰齊典十卷三十國春秋三十一卷梁湘東世子蕭方等撰戰國春秋二十卷李概撰梁典三十卷劉璠撰梁典三十卷陳始興王咨議何之元撰梁撮要三十卷陳征南咨議陰僧仁撰梁後略十卷姚勗撰梁太清紀十卷梁長沙蕃王蕭韶撰淮海亂離志四卷蕭世怡撰梁末侯景之亂齊紀三十卷紀後齊事崔子發撰齊志十卷後齊事王劭撰右三十四部六百六十六卷自史官放絶作者相承皆以班馬為準起漢獻帝雅好典籍以班固漢書文繁難省命潁川荀悅作春秋左傳之體為漢紀三十篇言約而事詳辨論多美大行於世至晉太康元年汲郡人發魏襄王冢得古竹簡書字皆科斗發冢者不以為意往往散亂帝命中書監荀勗令和嶠撰次為十五部八十七卷多雜碎怪妄不可訓知唯周易紀年最為分了其周易上下篇與今正同紀年皆用夏正建寅之月為歲首起自夏殷周三代王事無諸侯國別唯特記晉國起自殤叔次文侯昭侯以至曲沃莊伯盡晉國滅獨記魏事下至魏哀王謂之今王蓋魏國之史記也其著書皆編年相次文意大似春秋經諸所記事多與春秋左氏扶同學者因之以為春秋則古史記之正法有所著述多依春秋之體今依其世代編而之以見作者之別謂之古史周書十卷汲冢書似仲尼刪書之餘古文瑣語四卷汲冢書春秋前傳十卷何承天撰春秋前雜傳九卷何承天撰春秋後傳三十一卷晉著作郎樂資撰戰國策三十二卷劉向録戰國策二十一卷高誘撰注戰國策論一卷漢京兆尹延篤撰楚漢春秋九卷陸賈撰古今注八卷伏無忌撰越絶記十六卷子貢撰吳越春秋十二卷趙曄撰吳越春秋削繁五卷楊方撰吳越春秋十卷皇甫遵撰吳越記六卷南越志八卷沈氏撰小史八卷漢靈獻二帝紀三卷漢侍中劉芳撰殘缺梁有六卷山陽公載記十卷樂資撰漢末英雄記八卷王粲撰殘缺梁有十卷九州春秋十卷司馬彪撰記漢末事魏武本紀四卷梁並曆五卷魏尚書八卷孔衍撰梁十卷成魏晉世語十卷晉襄陽令郭頒撰魏末傳二卷梁又有魏末傳並魏氏大事三卷亡呂布本事一卷毛范撰晉諸公讚二十一卷晉祕書監傅暢撰晉後略記五卷晉下邳太守荀綽撰晉書鈔三十卷梁豫章內史張緬撰晉書鴻烈六卷張氏撰宋中興伐逆事二卷宋拾遺十卷梁少府卿謝綽撰左史六卷李概撰魏國統二十卷梁祚撰梁帝紀七卷梁太清録八卷梁承聖中興略十卷劉仲威撰梁末代紀一卷梁皇帝實録三卷周興嗣撰記武帝事梁皇帝實録五卷梁中書郎謝吳撰記元帝事棲鳳春秋五卷臧嚴撰陳王業曆一卷陳中書郎趙齊旦撰史要十卷漢桂陽太守衛颯撰約史記要言以類相從典略八十九卷魏郎中魚豢撰史漢要集二卷晉祠部郎王蔑撰抄史記入春秋者不録三史略二十九卷吳太子太傅張溫撰史記正傳九卷張瑩撰後漢略二十五卷張緬撰漢皇德紀三十卷漢有道徵士侯瑾撰起光武至沖帝洞紀四卷韋昭撰記庖犧已來至漢建安二十七年續洞紀一卷臧榮緒撰帝王世紀十卷皇甫謐撰起三皇盡漢魏帝王世紀音四卷虞綽撰帝王本紀十卷來奧撰續帝王世紀十卷何茂材撰十五代略十卷吉文甫撰起庖犧至晉帝王要略十二卷環濟撰紀帝王及天官地理喪服周載八卷東晉臨賀太守孟儀撰略記前代下至秦本三十卷今亡漢書鈔三十卷晉散騎常侍葛洪撰拾遺録二卷偽秦姚萇方士王子年撰王子年拾遺記十卷蕭綺撰華夷帝王世紀三十卷楊曄撰正史削繁九十四卷阮孝緒撰童悟十二卷帝王世録一卷甄鸞撰先聖本紀十卷劉縚撰年曆帝紀三十卷姚恭撰帝王諸侯世略十一卷王霸記三卷潘傑撰歷代記三十二卷隋書六十卷未成祕書監王劭撰右七十二部九百一十七卷通計亡書七十三部九百三十九卷自秦撥去古文篇籍遺散漢初得戰國策蓋戰國遊士記其策謀其後陸賈作楚漢春秋以述誅鋤秦項之事又有越絶相承以為子貢所作後漢趙曄又為吳越春秋其屬辭比事皆不與春秋史記漢書相似蓋率爾而作非史策之正也靈獻之世天下大亂史官失其常守博達之士愍其廢絶各記聞見以備遺亡是後羣才景慕作者甚衆又自後漢已來學者多鈔撮舊史自為一書或起自人皇或斷之近代亦各其志而體制不經又有委巷之説迂怪妄誕真虛莫測然其大抵皆帝王之事通人君子必博采廣覽以酌其要故備而存之謂之雜史趙書十卷一曰二石集記石勒事偽燕太傅長史田融撰二石傳二卷晉北中郎參軍王度撰二石偽治時事二卷王度撰漢之書十卷璩撰華陽國志十二卷常璩撰梁有蜀平記十卷蜀漢偽官故事一卷亡燕書二十卷記慕容雋事偽燕尚書范亨撰南燕録五卷記慕容德事偽燕尚書郎張詮撰南燕録六卷記慕容德事偽燕中書郎王景暉撰南燕書七卷遊覽先生撰燕志十卷記馮跋事魏侍中高閭撰秦書八卷何仲熙撰記苻健事秦記十一卷宋殿中將軍裴景仁撰梁雍州主簿席惠明注秦紀十卷記姚萇事魏左民尚書姚和都撰涼記八卷記張軌事偽燕右僕射張咨撰涼書十卷記張軌事偽涼大將軍從事中郎劉景撰西河記二卷記張重華事晉侍御史喻歸撰涼記十卷記呂光事偽涼著作佐郎段龜龍撰涼書十卷高道讓撰涼書十卷沮渠國史托跋涼録十卷敦煌實録十卷劉景撰十六國春秋一百卷魏崔鴻撰纂録一十卷戰國春秋二十卷李概撰漢趙記十卷和苞撰吐谷渾記二卷宋新亭侯段國撰梁有翟遼書二卷諸國略記二卷永嘉後纂年記二卷段業傳一卷亡天啓紀十
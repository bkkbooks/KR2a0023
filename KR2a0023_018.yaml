法月在外者其去交辰數若日氣所繫之限止一而無等次者加所去辰一即為食數若限有等次加別繫同者隨所去交辰數而返其衰以少為多以多為少亦加其一以為食數皆以十五為限乃以命之即各日之所食多少凡日食月行黃道體所映蔽大較正交如累璧漸減則有差在內食分多在外無損雖外全而月下內損而更高交淺則閒遙交深則相搏而不淹因遙而蔽多所觀之地又偏所食之時亦別月居外道此不見虧月外之人反以為食交分正等同在南方冬損則多夏虧乃少假均冬夏早晚又殊處南辰體則高居東西傍而下視有邪正理不可一由準率若實而違古史所詳事有紛互今故推其梗概求者知其指歸苟地非於陽城皆隨所而漸異然月食以月行虛道暗氣所衝日有暗氣天有虛道正黃道常與日對如鏡居下魄耀見陰名曰暗虛奄月則食故稱當月月食當星星亡雖夜半之辰子午相對正隔於地虛道即虧既月兆日光當午更耀時亦隔地無廢稟明諒以天光神妙應感玄通正當夜半何害虧稟月由虛道表𩹉俱食日之與月體同勢等校其食分月盡為多容或形差微增虧數疎而不漏綱要克舉推日食所在辰術置定餘倍日限克減之月在𩹉三乘朔辰為法除之所得以艮巽坤乾為次命艮算外不滿法者半法減之無可減者為前所減之殘為後前則因餘後者減法各為其率乃以十加去交辰三除之以乘率十四而一為差其朔所在氣二分前後一氣內即為定差近冬至以去寒露驚蟄近夏至以去清明白露氣數倍而三除去交辰謂增之近冬至艮巽以加坤乾以減近夏至艮巽以減坤乾以加其差為定差乃艮以坤加巽以乾減定餘月在外直三除去交辰以乘率十四而一亦為定差艮坤以減巽乾以加定餘皆為食餘如氣求入辰法即日食所在辰及大小其求辰刻以辰克乘辰餘朔辰而一得刻及分若食近朝夕者以朔所入氣日之出入刻校食所在知食見否之少多所在辰為正見推月食所在辰術三日阻減望定餘半置望之所入氣日不見刻朔日法乘之百而一所得若食餘與之等以下又以此所得減朔日法其殘食餘與之等以上為食正見數其食餘亦朔辰而一如求加辰所在又如前求刻校之月在衝辰食日月食既有起訖晚早亦或變常進退皆於正見前後十二刻半候之推日月食起訖辰術準其食分十五分為率全以下各為衰十四分以上以一為衰以盡於五分每因前衰每降一分積衰增二以加於前以至三分每積增四二分每增四二分增六一分增十九皆累算為各衰三百為率各衰減之各以其殘乘朔日法皆率而一所得為食衰數其率全即以朔日法為衰數以衰數加減食餘其減者為起加者為訖數亦如氣求入辰法及求刻以加減食所刻等得起訖晚早之辰與校正見多少之數史書虧復起訖不同今以其全一辰為率推日月食所起術月在景內者其正南則起右上虧左上若正東月自日上邪北而下其在東南維前東向望之初不正橫月高日下乃月稍西北日漸東南過於維後南向望之月更北日差西南以至於午之後亦南望之月欹西北日復東南西南維後西向而望月為東北日則西南正西自日北下邪虧而亦後不正橫月高日下若食十二分以上起右虧左其正東起上近虧下而北午前則漸自上邪下維西起西北虧東南維北起西南虧東北午後則稍從下傍下維東起西南虧東北維北虧東南在東則以上為東在西則以下為西月在外者其正南起右下虧左上在正東月自日南邪下而映維北則月微東南日返西維西南日稍移東北以至於午月南日北過午之後月稍東南日更西北維北月有西南日復東北正西月自日下邪南而上皆準此體以定起虧隨其所處每用不同其月之所食皆依日虧起每隨類反之皆與日食限同表𩹉而與日返其逆順上勢下過其分五星歲為木熒惑為火鎮為土太白為金辰為水木數千八百六十萬五千四百六十八伏半平八十三萬六千八百四十八復日三百九十八餘四萬一千一百五十六歲一殘日三十三餘二萬九千七百四十九半見去日十四度平見在春分前以四乘去立春日小滿前又三乘去春分日增春分所乘者白露後亦四乘去寒露日小暑加七日小雪前以八乘去寒露日冬至後以八乘去立春日為減小雪至冬至減七日見初日行萬一千八百一十八分日益遲七十分百一十日行十八度分四萬七百三十八而留二十八日乃逆日退六千四百三十六分八十七日退十二度分二百四又留二十八日初日行四千一百八十八分日益疾七十分百一十日亦行十八度分四萬七百三十八而伏火數三千六百三十七萬七千五百九十五伏半平三百三十七萬九千三百二十七半復日七百七十九餘四萬一千九百一十九歲再殘日四十九餘萬九千一百六見去日十六度平見在雨水前以十九乘去大寒日清明前又十八乘去雨水日增雨水所乘者夏至後以十六乘去處暑日小滿後又十五日寒露前以十八乘去白露日小雪前又十七乘去寒露所乘者大雪後二十九乘去大寒日為減小雪至大雪減二十五日見初在冬至則二百三十六日行百五十八度以後日度隨其日數增損各一盡三十日一日半損一又八十六日二日損一復三十八日同又十五日三日損一復十二日同又三十九日三日增一又二十四日二日增一又五十八日一日增一復三十三日同又三十日二日損一還終至冬至二百三十六日行百五十八度其立春盡春分夏至盡立夏八日減一日春分至立夏減六日立秋至秋分減五度各其初行日及度數白露至寒露初日行半度四十日行二十度以其殘日及度計充前數皆差行日益遲二十分各盡其日度乃遲初日行分二萬二千六百六十九日益遲一百一十分六十一日行二十五度分萬五千四百九初減度五者於此初日加分三千八百二十三篾十七以遲日為母盡其遲日行三十度分同而留十三日前減日分於二留乃逆日退分萬二千五百二十六六十三日退十六度分四萬二千八百三十四又留十三日而行初日萬六千六十九日益疾百一十分六十一日行二十五度分萬五千四百九立秋盡秋分增行度五加初日分同前更疾在冬至則二百一十三日行百三十五度盡三十六日一日損一又二十日二日損一復二十四日同又五十四日三日日增一又十二日二日增一又四十二日一日增一又十四日一日增一半又十二日增一復四十五日同又一百六日二日損一亦終冬至二百一十三日行百三十五度前增行度五者於此亦減五度為疾日及數其立夏盡夏至日亦日行半度六十日行三十度夏至盡立秋亦初日行半度四十日行二十度其殘亦計充如前皆差行日盡益疾二十分各盡其日度而伏土數千七百六十三萬五千五百九十四伏半平八十六萬四千九百九十五復日三百七十八餘四千一百六十二歲一殘日十二餘三萬九千三百九十九半見去日十六度半平見在大暑前以七乘去小滿日寒露後九乘去小雪日為加大暑至寒露加八日小寒前以九乘去小雪日雨水後以四乘去小滿日立春後又三乘去雨水日增雨水所乘者為減小寒至立春減八日見日行分四千三百六十四八十日行七度分二萬二千六百一十二而留三十九日乃逆日退分二千八百二十百三日退六度分萬五百九十六又留三十九日亦行分日四千三百六十四八十日行七度分二萬二千六百一十二而伏金數二千七百二十三萬六千二百八晨伏半平百九十五萬七千一百四復日五百八十三餘四萬二千七百五十六歲一殘日二百一十八餘三萬一千三百四十九半夕見伏二百五十六日晨見伏三日百二十七日餘與復同見去日十一度夕平見在立秋前以六乘去芒種日秋分後以五乘去小雪日小雪後又四乘去大雪日增小雪所乘者為加立秋至秋分加七日立春前以五乘去大雪日雨水前又四乘去立春日增立春所乘者清明後以六乘去芒種日為減雨水至清明減七日晨平見在小寒前以六乘去冬至日立春前又五乘去小寒日增小寒所乘者芒種前以六乘去夏至日立夏前又五乘去芒種日增芒種所乘者為加立春至立夏加五日小暑前以六乘去夏至日立秋前又五乘去小暑日增小暑所乘者大雪後以六乘去冬至日立冬後又五乘去大雪日增大雪所乘者為減立秋至立冬減五日夕見百七十一日行二百六度其穀雨至小滿寒露二五皆十日加一度小滿至白露加三度乃十二日行十二度冬至後十二日減日度各一雨水盡見夏至日度七夏至後六日增一大暑至立秋還日度十二至寒露日度二十二後六日減一自大雪盡冬至又日度十二而遲日益遲疾五百二十分初日行分二萬三千七百九十一篾三十五行日為母四十三日行三十二度前加度者此依減之留九日乃逆日退太半度九日退六度而夕伏晨見日退太半度九日退六度復留九日而行日益疾遲五百二十分初日行分四萬五千六百三十一篾三十五四十三日行三十二度芒種至小暑大雪至立冬十五日減一度小暑至立冬減二度又十二日行十二度冬至後十五日增日度各一驚蟄至春分日度十七後十五日減一盡夏至還日度十二後六日減一至白露日度皆盡霜降後五日增一盡冬至又日度十二乃疾百七十一日行二百六度前減者此亦加之而晨伏水數五百四十萬五千六晨伏半平七十九萬九十九後復日百一十五餘四萬九百四十六夕見伏五十一日晨見伏六十四日餘與復同見去日十七度夕應見在立秋及後小雪前者不見其白露前立冬夏後時有見者晨應見在立春及後小滿前者不見其驚蟄前立冬後時有見者夕見日行一度太十二日行二十度小暑至白露行度半十二日行十八度及乃八日行八度大暑後二日去度一訖十六日而日度俱盡而遲日行半度四日行二度益遲日行少半度三日行一度前行度半者去此益遲乃留四日而夕伏晨見留四日為日行少半度三日行一度大寒至驚蟄無此行更疾日行半度四日行二度又八日行八度亦大寒後二日去度一訖十六日亦日度俱盡益疾日行一度太十二日行二十度初無遲者此行度半十二日行十八度而晨伏推星平見術各以伏半減積半實乃以其數去之殘返減數滿氣日法為日不滿為餘即所求年天正冬至後平見日餘金水滿晨見伏日者去之晨平見求平見月日以冬至去定朔日餘加其後日及餘滿復日又去起天正月依定大小朔除之不盡算外日即星見所在求後平見因前見去其歲一再皆以殘日加之亦可其復日金水準以晨夕見伏日加晨得夕加夕得晨求常見日以轉法除所得加減者為日其不滿以餘通乘之為餘幷日皆加減平見日餘即為常見日及餘求定見日以其先後已通者先減後加常見日即得定見日餘求星見所在度置星定見其日夜半所在宿度及分以其日先後餘分前加分後減氣日法而乘定見餘氣日法而一所得加夜半度分乃以星初見去日度數晨減夕加之即星初見所在宿度及分求次日各加一日所行度及分其有益疾遲者則副置一日行分各以其分疾增遲損乃如加之有篾者滿法從分其母有不等齊而進退之留即因前逆則依減入虛去分逆出光先加皆以篾法除為轉分其不盡者仍謂之篾各得每日所在知去日度二七增以日所入先後分定之諸行星度求水其外內二八準月行增損黃道而步之不明者依黃道而求所去日度先後分亦分明前加後減其金火諸日度計數增損定之者其日少度多以日減度之殘者與日多度少之度皆度法乘之日數而一所得為分不滿篾以日數為母日少者以分幷減之一度日多者直為度分即皆一日平行分其差行者皆減所行日數一乃半其益疾益遲分而乘之益疾以減益遲以加一日平行分皆初日所行分有計日加減而日數不滿未得成度者以氣日法若度法乘見已所行日即日數除之所得以增損其氣日疾法為日及度其不成者亦即為蔑其木火土晨有見而夕有伏金水即夕見還夕伏晨見即晨伏然火之初行及後疾距冬至日計日增損日度者皆當先置從冬至日餘數累加於位上以知其去冬至遠近乃以初見與後疾初日去冬至日數而增損定之而後依其所直日度數行之也

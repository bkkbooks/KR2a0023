body:
  text: 隋書卷十八志第十三律曆下開皇二十年袁充奏日長影短高祖因以曆事付皇太子遣更研詳著日長之候太子徵天下曆算之士咸集于東宮劉焯以太子新立復增修其書名曰皇極曆駁正冑玄之短太子頗嘉之未獲考驗焯為太學博士負其精博志解冑玄之印官不滿意又稱疾罷歸至仁壽四年焯言冑玄之誤於皇太子其一曰張冑玄所上見行曆日月交食星度見留雖未盡善得其大較官至五品誠無所愧但因人成事非其實錄就而討論違舛甚衆其二曰冑玄弦望晦朔違古且疎氣節閏候乖天爽命時不從子半晨前別為後日日躔莫悟緩急月逡妄為兩種月度之轉輒遺盈縮交會之際意造氣差七曜之行不循其道月星之度行無出入應黃反赤當近更遠虧食乖準陰陽無法星端不協珠璧不同盈縮失倫行度愆序去極晷漏應有而無食分先後彌為煩碎測今不審考古莫通立術之疎不可紀極今隨事糾駁凡五百三十六條其三曰冑玄以開皇五年與李文琮於張賓曆行之後本州貢舉即齎所造曆擬以上應其曆在鄉陽流布散寫甚多今所見行與焯前曆不異玄前擬獻年將六十非是怱迫倉卒始為何故至京未幾即變同焯曆與舊懸殊焯作於前玄獻於後捨己從人異同暗會且孝孫因焯冑玄後附孝孫曆術之文又皆是孝孫所作則元本偷竊事甚分明恐冑玄推諱故依前曆為駁凡七十五條幷前曆本俱上其四曰玄為史官自奏虧食前後所上多與曆違今算其乖舛有一十三事又前與太史令劉暉等校其疎密五十四事云五十三條新計後為曆應密於舊見用算推更疎於本今糾發幷前凡四十四條其五曰冑玄於曆未為精通然孝孫初造皆有意徵天推步事必出生不是空文徒為臆斷其六曰焯以開皇三年奉勑修造顧循記注自許精微秦漢以來無所與讓尋聖人之迹悟曩哲之心測七曜之行得三光之度正諸氣朔成一曆象會通今古符允經傳稽於庶類信而有徵冑玄所違焯法皆合冑玄所闕今則盡有隱括始終謂為總備仍上啟曰自木鐸寢聲緒言成燼羣生蕩析諸夏沸騰曲技雲浮疇官雨絕曆紀廢壞千百年矣焯以庸鄙謬荷甄擢專精藝業耽玩數象自力羣儒之下冀覩聖人之意開皇之初奉勑脩撰性不諧物功不克終猶被冑玄竊為己法未能盡妙協時多爽尸官亂日實點皇猷請徵冑玄答驗其長短焯又造曆家同異名曰稽極大業元年著作郎王劭諸葛潁二人因入侍宴言劉焯善曆推步精審證引陽明帝曰知之久矣仍下其書與冑玄參校冑玄駁難云焯曆有歲率月率而立定朔月有三大三小案歲率月率者平朔之章歲章月也以平朔之率而求定朔值三小者猶似減三五為十四值三大者增三五為十六也校其理實並非十五之正故張衡及何承天創有此意為難者執數以校其率率皆自敗故不克成今焯為定朔則須除其平率然後為可互相駁難是非不決焯又罷歸四年駕幸汾陽宮太史奏曰日食無效帝召焯欲行其曆袁充方幸於帝左右冑玄共排焯曆又會焯死曆竟不行術士咸稱其妙故錄其術云甲子元距大隋仁壽四年甲子稱積一百萬八千八百四十算歲率六百七十六月率八千三百六十一朔日法千二百四十二朔實三萬六千六百七十七旬周六十朔辰百三半日干元五十二日限十一盈汎十六虧總十七推經朔術置入元距所求年月率乘之如歲率而一為積月不滿為閏衰朔實乘積月滿朔日法得一為積日不滿為朔餘旬周去積日不盡為日即所求年天正經朔日及餘求上下弦望加經朔日七餘四百七十五小即上弦經日及餘又加得望下弦及後月朔就徑求望者加日十四餘九百五十半下弦加日二十二餘百八十四餘九百五十半下弦加五十九每月加閏衰二十大即各其月閏衰也凡月建子為天正建丑為地正建寅為人正即以人正為正月統求所起本於天正若建歲曆從正月始氣候月星所值節度雖有前却並亦隨之其前地正為十二月天正為十一月幷諸氣度皆屬往年其日之初亦從星起晨前多少俱歸昨日若氣在夜半之後量影以後日為正諸因加者各以其餘減法殘者為全餘若所因之餘滿全餘以上皆增全一而加之減其全餘即因餘少於全餘者不增全加皆得所求分度亦爾凡日不全為餘積以成餘者曰秒度不全為分積以成分者曰篾其有不成秒曰麼不成篾曰𡺣其分餘秒篾皆一為小二為半三為大四為全加滿全者從一其三分者一為少二為太若加者秒篾成法分餘滿法從日度一日度有所滿則從去之而日命以日辰者滿旬周則亦除命有連分餘秒篾者亦隨全而從去其日度雖滿而分秒不滿者未可從去仍依本數若減者秒篾不足減分餘一加法而減之分餘不足減者加所從去或前日度乃減之即其名有總而日度全及分餘共者須相加除當皆連全及分餘共加除之若須相乘有分餘者母必通全內子乘訖報除或分餘相幷母不同者子乘而幷之母相乘為法其幷滿法從一為全此即齊同之也既除為分餘而有不成若例有秒篾法乘而又法除得秒篾數已為秒篾及正有分餘而所不成不復須者須過半從一無半棄之若分餘其母不等須變相通以彼所法之母乘此而分餘而此母除之得彼所須之子所有秒篾者亦法乘不滿此母又除而得其數麼𡺣亦然其所除去而有不盡全則謂之不盡亦曰不如其不成全全乃為不滿分餘秒篾更曰不成凡以數相減而有小及半太須相加減同於分餘法者皆以其母三四除其氣度日法以半及太大本率二三乘之少小即須因所除之數隨其分餘而加減焉秋分後春分前為盈汎春分後秋分前為虧總須取其數汎總為名指用其時春分為主虧日分後盈日分前凡所不見皆放於此氣日法四萬六千六百四十四歲數千七百三萬六千四百六十六半度準三百三十八約率九氣辰三千八百八十七餘通八百九十七秒法四十八麼法五推氣術半閏衰乘朔實又度準乘朔餘加之如約率而一所得滿氣日法為去經朔日不滿為氣餘以去經朔日即天正月冬至日定餘乃加夜數之半者減日一滿者因前皆為定日命日甲子算外即定冬至日其餘如半氣辰千九百四十三半以下者為氣加子半後也過以上先加此數乃氣辰而一命以辰算外即氣所在辰十二辰外為子初以後餘也又十二乘辰餘四為小太亦曰少五為半少六為半七為半太八為大少亦曰太九為太十為大太十一為窮辰少其又不成法者半以上為進以下為退退以配前為強進以配後為弱即初不成一而有退者謂之沾辰初成十一而有進者謂之窮辰未旦其名有重者則於間可以加之命辰通用其餘辨日分辰而判諸日因別亦皆準此因冬至有減日者還加之每加日十五餘萬一百九十二秒三十七即各次氣日及餘諸月齊其閏衰如求冬至法亦即其月中氣日去經朔數其求後月節氣日如次之求前節者減之月氣躔衰衰總陟降率遲速數十一月大雪冬至中增二十八先端陟五十速本十二月小寒節大寒中增二十四增二十先二十八先五十二陟四十三陟三十六速五十速九十三正月立春節雨水中增二十增二十四先七十二先九十二陟三十六陟四十三速一百二十九速一百六十五二月驚蟄節春分中增二十八損二十八先一百一十六先一百四十四陟五十陟降五十速二百八速二百五十八三月清明節穀雨中損二十四損二十先一百一十六先九十二降四十三降三十六速二百八速一百六十五四月立夏節小滿中損二十損二十四先七十二先五十二降三十六降四十三速一百二十九速九十三五月芒種節夏至中損二十八增二十八先後端二十八後端降五十降陟五十速五十遲本六月小暑節大暑中增二十四增二十後二十八後五十二陟四十三陟三十六遲五十遲九十三七月立秋節處暑中增二十增二十四後七十二後九十二陟三十六陟四十三遲一百二十九遲一百六十五八月白露節秋分中增二十八損二十八後一百一十六後一百四十四陟五十陟降五十遲二百八遲二百五十八九月寒露節霜降中損二十四損二十後一百一十六後九十二陟降四十三降三十六遲二百八遲一百六十五十月立冬節小雪中損二十損二十四後七十二後五十二降三十六降四十三遲一百二十九遲九十三十一月大雪節冬至損二十八後二十八降五十遲五十推每日遲速數術見求所在氣陟降率幷後氣率半之以日限乘而汎總除得氣末率又日限乘二率相減之殘汎總除為總差其總差亦日限乘而汎總除為別差率前少者以總差減末率為初率乃別差加之前多者即以總差加末率皆為氣初日陟降數以別差前多者日減前少者日加初數得每日數所曆推定氣日隨算其數陟加降減其遲速為各遲速數其後氣無同率及有數同者皆因前末以末數為初率加總差為末率及差漸加初率為每日數通計其秒調而御之求月朔弦望應平會日所入遲速各置其經餘為辰以入氣辰減之乃日限乘日日內辰為入限以乘其氣前多之末率前少之初率日限而一為總率其前多者入限減汎總之殘乘總差汎總而一為入差幷於總差入限乘倍日限除加以總率前少者入限自乘再乘別差七日限自乘倍而除亦總率皆為總數乃以陟加降減其氣遲速數為定即速加遲減其經餘各其月平會日所入遲速定日及餘求每日所入先後各置其氣躔衰與衰總皆以餘通乘之所乃躔衰如陟降率衰總如遲速數亦如求遲速法即得每所入先後及定數求定氣其每日所入先後數即為氣餘其所曆日皆以先加之以後減之隨算其日通準其餘滿一氣即為二至後一氣之數以加二氣如法用別其日而命之又算其次每相加命各得其定氣日及餘也亦以其先後已通者先減後加其氣即次氣定日及餘亦因別其日命以甲子各得所求求土王距四立各四氣外所入先後加減滿二十二日餘八千一百五十四秒十麼二除所滿日外即土始王日求候日定氣即初候日也三除氣各為平候日餘亦以所入先後數為氣餘所曆之日皆以先加後減隨計其日通準其餘每滿其平以加氣日而命之即得次候日亦算其次每相加命又得末候及次氣日氣初候次候末候夜半漏昏去中星冬至夜五十九刻八十六分武始交八芸始生荔挺出二十七刻分四十三八十二度轉分四十七小寒蚯蚓結麋角解水泉動二十七刻二十六八十三度十六大寒雁北向鵲始巢雉始雊二十六刻七十六八十五度六立春雞始乳東風解凍蟄蟲始振二十五刻九十八半八十七度四十九雨水魚上冰獺祭魚鴻雁來二十四刻九十六半九十一度三十六驚蟄始雨水桃始華倉庚鳴二十三刻七十七半九十六度三春分鷹化為鳩玄鳥至雷始發聲二十二刻五十一百度三十七半清明電始見蟄蟲咸動蟄蟲啟戶二十一刻二十二半百五度二十一穀雨桐始華田鼠為鴽虹始見二十刻三半百九度三十九立夏萍始生戴勝降桑螻蟈鳴十九刻一半百一十三度二十五小滿蚯蚓出王瓜生苦菜秀十八刻二十三百十六度十九芒種蘼草死小暑至螳蜋生十七刻六十九百一十八度十八夏至夜四十刻十四分鵙始鳴反舌無聲鹿角解十七刻五十七百一十八度四十小暑蟬始鳴半夏生木菫榮十七刻六十九百一十八度十八大暑溫風至蟋蟀居壁鷹乃學習十八刻二十三百一十六度十九立秋腐草為螢土潤溽暑涼風至十九刻一半百一十三度二十五處暑白露降寒蟬鳴鷹祭鳥二十刻三半百九度三十九白露天地始肅暴風至鴻雁來二十一刻二十二半百五度二十一秋分玄鳥歸養羞雷始收聲二十二刻五十百度三十七半寒露蟄蟲附戶殺氣盛陽氣始衰二十三刻七十七半九十六度三霜降水始涸鴻雁來賓雀入水為蛤二十四刻九十六半九十一度三十六立冬菊有黃華豺祭獸水始氷二十五刻九十八半八十七度四十九小雪地始凍雉入水為蜃虹藏不見二十六刻七十六八十五度六大雪冰益壯地始坼曷旦鳴二十七刻二十六八十三度十六倍夜半之漏得夜刻也以減百刻不盡為晝刻每減晝刻五以加夜刻即其晝為日見夜為不見刻數刻分以百為母求日出入辰刻十二除百刻九十二除百刻得辰刻數為法半不見刻以半辰加之為日出實又加日出見刻為日入實如法而一命子算外即所在辰不滿法為刻及分求辰前餘數氣朔日法乘夜半刻百而一即其餘也求每日刻差每氣準為十五日全刻二百二十五為法其二至各前後於二分而數因相加減間皆六氣各盡於四立為三氣至與前日為一乃每日增太又各二氣每日增少其末之氣每日增少之小而末六日不加而裁焉二望至前後一氣之末日終於十少二氣初日稍增為十二半終於二十大太三氣初日二十一終於三十少四立初日三十一終於三十五太五氣亦少增初日三十六太終四十一少末氣初日四十一少終於四十二每氣前後累算其數又百八十乘為實各汎總乘法而除得其刻差隨而加減夜刻而半之各得入氣夜之半定刻其分後十五日外累算盡日乃副置之百八十乘虧總除為其所因數以減上位不盡為所加也不全日者隨辰率之求晨去中星加周度一各昏去中星減之不盡為辰晨去度求每日度差準日因增加裁累算所得百四十三之四百而一亦百八十乘汎總除為度差數滿轉法為度隨日加減各得所求分後氣間亦求準外與前求刻至前加減皆因日數逆算求之亦可因至向背其刻各冬減夏加而度各冬加夏減若至前以入氣減氣間不盡者因後氣而反之以不盡日累算乘除所定從後氣而逆以加減皆得其數此但略校其總若精存于稽極云轉終日二十七餘千二百五十五終法二千二百六十三終實六萬二千三百五十六終全餘千八轉法五十二篾法八百九十七閏限六百七十六推入轉術終實去積日不盡以終法乘而又去不如終實者滿終法得一日不滿為餘即其年天正經朔夜半入轉日及餘求次日加一日每日滿轉終則去之且其二十八日者加全餘為夜半入初日餘求弦望皆因朔加其經日各得夜半所入日餘求次月加大月二日小月一日皆及全餘亦其夜半所入求經辰所入朔弦望經餘變從轉不成為秒加其夜半所入皆其辰入日及餘因朔辰所入每加日七餘八百六十五秒千一百六十大秒滿日法成餘亦得上弦望下弦次朔經辰所入徑求者加望日十四餘千七百三十一秒千七十九半下弦日二十二餘三百三十四秒九百九十八小次朔日一餘二千二百八秒九百一十七亦朔望各增日一減其全餘望五百三十一秒百六十二半朔五十四秒三百二十五求月平應會日所入以月朔弦望會日所入遲速定數亦變從轉餘乃速加遲減其經辰所入餘即各平會所入日餘轉日速分一違速差加減朓朒積一日七百六十四消七加六十八朓初二日七百五十七消八加六十一朓百二十三三日七百四十九消十一加五十三朓二百三十四四日七百三十八消十二加四十二朓三百三十一五日七百二十六消十三加三十一朓四百八六日七百一十三消十三加十八朓四百六十四七日七百消十二加五九分八加朓四百九十六減秒太一減八日六百八十八消十四減七朓五百五九日六百七十四消十四減二十一朓四百九十二十日六百六十消十二減三十四朓四百五十四十一日六百四十八消九減四十六朓三百九十一十二日六百三十九消七減五十五朓三百七十三日六百三十二消六減六十二朓二百七十四日六百二十六息二減五十六七減朓九十四加十六二加十五日六百二十八息七加六十六朒二十八十六日六百三十五息九加五十九朒百四十八十七日六百四十四息十一加五十朒二百五十六十八日六百五十五息十一加三十九朒三百四十七十九日六百六十六息十三加二十九朒四百一十九二十日六百七十九息十四加十六朒四百七十一二十一日六百九十三息十二加三六加朒五百減大三減二十二日七百五息十四減十朒五百五當日自減減見為五百四二十三日七百一十九息十三減二十三朒四百八十七二十四日七百三十二息十二減三十六朒四百四十六二十五日七百四十四息十減四十八朒三百八十一二十六日七百五十四息七減五十八朒二百九十三二十七日七百六十一息五篾四減六十五朒百八十八二十八日七百六十六蔑四平五息四消減七十三十八少終餘朒七十推朔弦望定日術三十一太全餘各以月平會所入之日加減限限幷後限而半之為通率又二限相減為限衰前多者以入餘減終法殘乘限衰終法而一并於限衰而半之前少者半入餘乘限衰亦終法而一減限衰皆加通率入餘乘之日法而一所得為平會加減限數其限數又別從轉餘為變餘朓減朒加本入餘限前多者朓以減與未減朒以加與未加皆減終法幷而半之以乘限衰前少者亦朓朒各幷二入餘半之以乘限衰皆終法而一加於通率變餘乘之日法而一所得以朓減朒加限數加減朓朒積而定朓朒乃朓減朒加其平會日所入餘滿若不足進退之即朔弦望定日及餘不滿晨前數者借減日算命甲子算外各其日也不減與減朔日立算與後月同若俱無立算者月大其定朔算後加所借減算閏衰限滿閏限定朔無中氣者為閏滿之前後在分前若近春分後秋分前而或月有二中者皆量置其朔不必依定其後無同限者亦因前多以通率數為半衰而減之前少即為通率其加減變餘進退日者分為一日隨餘初末如法求之所得幷以加減限數凡分餘秒篾事非因舊文不著母者皆十為法若法當求數用相加減而更不過通遠率少數微者則不須算其入七日餘二千一十一十四日餘千七百五十九二十一日餘千五百七二十八日始終餘以下為初數各減終法以上為末數其初末數皆加減相返其要各為九分初則七日八分十四日七分二十一日六分二十八日五分末則七日一分十四日二分二十一日三分二十八日四分雖初稍弱而末微強餘差止一理勢兼舉皆今有轉差各隨其數若算所求七日與二十一日得初衰數而末初加隱而不顯且數與平行正等亦初末有數而算所無其十四日二十八日既初末數存而虛衰亦顯其數當去法不見求朔弦望之辰所加定餘半朔辰五十一大以下為加子過以上加此數乃朔辰而一亦命以子十二算外又加子初以後其求入辰強弱如氣求入辰法度度法四萬六千六百四十四周數千七百三萬七千七十六周分萬二千一十六轉十三篾三百五十五周差六百九半在日謂之餘通在度謂之篾法亦氣為日法為度法隨事名異其數本同女末接虛謂之周分變周從轉謂之轉晨昏所距日在黃道中準度赤道計之斗二十六牛八女十二虛十危十七室十六壁九北方玄武七宿九十八度奎十六婁十二胃十四昴十一畢十六觜二參九西方白虎七宿八十度井三十三鬼四柳十五星七張十八翼十八軫十七南方朱雀七宿百一十二度角十二亢九氏十五房五心五尾十八箕十一東方蒼龍七宿七十五度前皆赤道度其數常定紘帶天中儀極攸準推黃道術準冬至所在為赤道度後於赤道西四度為限初數九十七每限增一以終百七其三度少弱平乃初限百九亦每限增一終百一十九春分所在因百一十九每限損一又終百九亦三度少弱平乃初限百七每限損一終九十七夏至所在又加冬至後法得秋分冬至所在數各以數乘其限度百八而一累而總之即皆黃道度也度有分者前後輩之宿有前却度亦依體數逐差遷道不常定準令為度見步天行歲久差多隨術而變斗二十四牛七女十一半虛十危十七室十七壁十北方九十六度半奎十七婁十三胃十五昴十一畢十五半觜二參九西方八十二度半井三十鬼四柳十四半星七張十七翼十九軫十八南方一百九度半角十三亢十氐十六房五心五尾十七箕十半東方七十六度半前見黃道度一三步日所行月與五星出入循此推月道所行度術準交定前後所在度半之亦於赤道四度為限初十一每限損一以終於一其三度強平乃初限數一每限增一亦終十一為交所在即因十一每限損一以終於一亦三度強平又初限數一每限增一終於十一復至交半返前表𩹉仍因十一增損如道得後交及交半數各積其數百八十而一即道所行每與黃道差數其月在表半後交前損減增加交後半前損加增減於黃道其月在𩹉各返之即得月道所行度其限未盡四度以所直行數乘入度四而一若月在黃道度增損於黃道之表𩹉不正當於其極可每日準去黃道度增損於黃道而計去赤道之遠近準上黃道之率以求之道遁伏相消朓朒互補則可知也積交差多隨交為正其五星先候在月表𩹉出入之漸又格以黃儀準求其限若不可推明者依黃道命度推日度術置入元距所求年歲數乘之為積實周數去之不盡者滿度法得積度不滿為分以冬至餘減分命積度以黃道起於虛一宿次除之不滿宿算外即所求年天正冬至夜半日所在度及分求年天正定朔度以定朔日至冬至每日所入先後餘為分日為度加分以減冬至度即天正定朔夜半日在所度分亦去朔日乘衰總已通者以至前定氣除之又如上求差加以幷去朔日乃減度亦即天正定朔日所在度皆日為度餘為分其所入先後及衰總用增損者皆分前增分後損其平日之度求次日每日所入先後分增損度以加定朔度得夜半求弦望去定朔每日所入分累而增損去定朔日乃加定朔度亦得其夜半求次月曆算大月三十日小月二十九日每日所入先後分增損其月以加前朔度即各夜半所在至虛去周分求朔弦望辰所加各以度準乘定餘約率而一為平分又定餘乘其日所入先後分日法而一乃增損其平分以加其夜半即各辰所加其分皆篾法約之為轉分不成為篾凡朔辰所加者皆為合朔日月同度推月而與日同度術各以朔平會加減限數加減朓朒為平會朓朒以加減定朔度準乘約率除以加減定朔辰所加日度即平會辰日所在又平會餘乘度準約率除減其辰所在為平會夜半日所在乃以四百六十四半乘平會餘亦以周差乘朔實除從之以減夜半日所在即月平會夜半所在三十七半乘平會餘增其所減以加減半得月平會辰平行度五百二乘朓朒亦以周差乘朔實除而從之朓減朒加其平行即月定朔辰所在度而與日同若即以平會朓朒所得分加減平會辰所在亦得同度求月弦望定辰度各置其弦望辰所加日度及分加上弦度九十一轉分十六篾三百一十三望度百八十二轉分三十二篾六百二十六下弦度二百七十三轉分四十九篾四十二皆至虛去轉周求之定朔夜半入轉經朔夜半所入準於定朔日有增損者亦以一日加減之否者因經朔為定其因定求朔次日弦望次月夜半者如於經月法為之推月轉日定分術以夜半入轉餘乘逡差終法而一為見差以息加消減其日逡分為月每日所行逡定分求次日各以逡定分加轉分滿轉法從度皆其夜半因日轉若各加定日皆得朔弦望夜半月所在定度其就辰加以求夜半各以逡分一四消者定餘乘差終法除幷差而半之息者半定餘以乘差終法而一皆加所減乃以定餘乘
body:
  text: 隋書卷六志第一禮儀一唐虞之時祭天之屬為天禮祭地之屬為地禮祭宗廟之屬為人禮故書云命伯夷典朕三禮所以彌綸天地經緯陰陽辨幽賾而洞幾深通百神而節萬事殷因於夏有所損益旁垂祗訓以勸生靈商辛無道雅章湮滅周公救亂弘制斯文以吉禮敬鬼神以凶禮哀邦國以賓禮親賓客以軍禮誅不虔以嘉禮合姻好謂之五禮故曰禮經三百威儀三千未有入室而不由戶者也成康由之而刑厝不用自犬戎弒后遷周削弱禮失樂微風凋俗敝仲尼預蠟賓而歎曰丘有志焉禹湯文武成王周公未有不謹於禮者也於是緝禮興樂欲救時弊君棄不顧道鬱不行故敗國喪家亡人必先廢其禮昭公娶孟子而諱姓楊侯竊女色而傷人故曰婚姻之禮廢則淫僻之罪多矣羣飲而逸不知其郵鄉飲酒之禮廢則爭鬬之獄繁矣魯侯逆五廟之祀漢帝罷三年之制喪祭之禮廢則骨肉之恩薄矣諸侯下堂於天子五伯召君於河陽朝聘之禮廢則侵陵之漸起矣秦氏以戰勝之威並吞九國盡收其儀禮歸之咸陽唯採其尊君抑臣以為時用至於退讓起於趨步忠孝成於動止華葉靡舉鴻纖並擯甚芻狗之棄路若章甫之遊越懦林道盡詩書為煙漢高祖既平秦亂初誅項羽放賞元勳未遑朝制羣臣飲酒爭功或拔劍擊柱高祖患之叔孫通言曰儒者難與進取可與守成於是請起朝儀而許焉猶曰度吾能行者為之微習禮容皆知順軌若祖述文武憲章洙泗則良由不暇自畏之也武帝興典制而愛方術至於鬼神之祭流宕不歸世祖中興明皇纂位祀明堂襲冠冕登靈臺望雲物得其時制百姓悅之而朝廷憲章其來已舊或得之於升平之運或失之於凶荒之年而世載遐邈風流訛舛必有人情將移禮意殷周所以異軌秦漢於焉改轍至於增輝風俗廣樹隄防非禮威嚴亦何以尚譬山祇之有嵩岱海若之有滄溟飾以涓塵不貽伊敗而高堂生於所傳士禮亦謂之儀弘暢人情粉飾行事洎西京以降用相裁準咸稱當世之美自有周旋之節黃初之詳定朝儀太始之削除乘謬則宋書言之備矣梁武始命羣儒裁成大典吉禮則明山賓凶禮則嚴植之軍禮則陸璉賓禮則賀瑒嘉禮則司馬褧帝又命沈約周捨徐勉何佟之等咸在參詳陳武克平建業多準梁舊仍詔尚書左丞江德藻員外散騎常侍沈洙博士沈文阿中書舍人劉師知等或因行事隨時取捨後齊則左僕射陽休之度支尚書元修伯鴻臚卿王晞國子博士熊安生在周則蘇綽盧辨宇文並習於儀禮者也平章國典以為時用高祖命牛弘辛彥之等採梁及北齊儀注以為五禮云禮曰萬物本乎天人本乎祖所以配上帝也秦人蕩六籍以為煨燼祭天之禮殘缺儒者各守其所見物而為之義焉一云祭天之數終歲有九祭地之數一歲有二圓丘方澤三年一行若圓丘方澤之年祭天有九祭地有二若天不通圓丘之祭終歲有八地不通方澤之祭終歲有一此則鄭學之所宗也一云唯有昊天無五精之帝而一天歲二祭壇位唯一圓丘之祭即是南郊南郊之祭即是圓丘日南至於其上以祭天春又一祭以祈農事謂之二祭無別天也五時迎氣皆是祭五行之人帝太皡之屬非祭天也天稱皇天亦稱上帝亦直稱帝五行人帝亦得稱上帝但不得稱天故五時迎氣及文武配祭明堂皆祭人帝非祭天也此則王學之所宗也梁陳以降以迄于隋議者各宗所師故郊丘互有變易梁南郊為圓壇在國之南高二丈七尺上徑十一丈下徑十八丈其外再壝四門常與北郊間歲正月上辛行事用一特牛祀天皇上帝之神於其上以皇考太祖文帝配禮以蒼璧制幣五方上帝五官之神太一天一日月五星二十八宿太微軒轅文昌北斗三台老人風伯司空雷電雨師皆從祀其二十八宿及雨師等座有坎五帝亦如之餘皆平地器以陶匏席用秸太史設柴壇於丙地皇帝齊於萬壽殿乘玉輅備大駕以行禮禮畢變服通天冠而還北郊為方壇於北郊上方十丈下方十二丈高一丈四面各有陛其外為壝再重與南郊間歲正月上辛以一特牛祀后地之神於其上以德后配禮以黃琮制幣五官之神先農五嶽沂山嶽山白石山霍山無閭山蔣山四海四瀆松江會稽江錢塘江四望皆從祀太史設埋坎於壬地焉天監三年左丞吳操之啓稱傳云啓蟄而郊郊應立春之後尚書左丞何佟之議今之郊祭是報昔歲之功而祈今年之福故取歲首上辛不拘立春之先後周冬至於圓丘大報天也夏正又郊以祈農事故有啓蟄之說自晉太始二年並圓丘方澤同於二郊是知今之郊禋禮兼祈報不得限以一途也帝曰圓丘自是祭天先農即是祈穀但就陽之位故在郊也冬至之夜陽氣起於甲子既祭昊天宜在冬至祈穀時可依古必須啓蟄在一郊壇分為二祭自是冬至謂之祀天啓蟄名為祈穀何佟之又啓案鬯者盛以六彝覆以畫冪備其文飾施之宗廟今南北二郊儀注有祼既乖尚質謂宜革變博士明山賓議以為表記天子親耕粢盛秬鬯以事上帝蓋明堂之祼耳郊不應祼帝從之又有司以為祀竟器席相承還庫請依典燒埋之佟之等議案禮祭器弊則埋之今一用便埋費而乘典帝曰薦藉輕物陶匏賤器方還付庫容復穢惡但敝則埋之蓋謂四時祭器耳自是從有司議燒埋之四年佟之云周禮天曰神地曰祇今天不稱神地不稱祇天欑題宜曰皇天座地欑宜曰后地座又南郊明堂用沉香取本天之質陽所宜也北郊用上和香以地於人親宜加雜馥帝並從之五年明山賓稱伏尋制旨周以建子祀天五月祭地殷以建丑祀天六月祭地夏以建寅祀天七月祭地自頃代以來南北二郊同用夏正詔更詳議山賓以為二儀並尊三朝慶始同以此日二郊為允並請迎五帝於郊皆以始祖配饗及郊廟受福唯皇帝再拜明上靈降祚臣下不敢同也詔並依議六年議者以為北郊有嶽鎮海瀆之座而又有四望之座疑為煩重儀曹郎朱虉議曰望是不即之名豈容局於星海拘於嶽瀆明山賓曰舜典云望于山川春秋傳曰江漢沮漳楚之望也而今北郊設嶽鎮海瀆又立四望竊謂煩黷宜省徐勉曰嶽瀆是山川之宗至於望祀之義不止於嶽瀆也若省四望於義為非議久不能決至十六年有事北郊帝復下其議於是八座奏省四望松江浙江五湖等座其鍾山白石既土地所在並留如故七年帝以一獻為質三獻則文事天之道理不應然詔下詳議博士陸瑋明山賓禮官司馬褧以為宗祧三獻義兼臣下上天之禮主在帝王約理申義一獻為允自是天地之祭皆一獻始省太尉亞獻光祿終獻又太常丞王僧崇稱五祀位在北郊圓丘不宜重設帝曰五行之氣天地俱有故宜兩從僧崇又曰風伯雨師即箕畢星矣而今南郊祀箕畢二星復祭風師雨師恐乖祀典帝曰箕畢自是二十八宿之名風師雨師自是箕畢星下隸兩祭非嫌十一年太祝牒北郊止有一海及二郊相承用柒俎盛牲素案承玉又制南北二郊壇下衆神之座悉以白茅詔下詳議八座奏禮云觀天下之物無可以稱其德則知郊祭為俎理不應柒又藉用白茅禮無所出皇天大帝坐既用俎則知郊有俎義於是改用素俎並北郊置四海座五帝以下悉用蒲席藁薦並以素俎又帝曰禮祭月於坎良由月是陰義今五帝天神而更居坎又禮云祭日於壇祭月於坎並是別祭不關在郊故得各從陰陽而立壇坎兆於南郊就陽之義居於北郊就陰之義既云就陽義與陰異星月與祭理不為坎八座奏曰五帝之義不應居坎良由齊代圓丘小而且峻邊無安神之所今丘形既大易可取安請五帝座悉於壇上外壝二十八宿及雨師等座悉停為坎自是南北二郊悉無坎位矣十七年帝以威仰魄寶俱是天帝於壇則尊於下則卑且南郊所祭天皇其五帝別有明堂之祀不煩重設又郊祀二十八宿而無十二辰於義闕然於是南郊始除五帝祀加十二辰座與二十八宿各於其方而為壇陳制亦以間歲正月上辛用特牛一祀天地於南北二郊永定元年武帝受禪修南郊圓壇高二丈二尺五寸上廣十丈柴燎告天明年正月上辛有事南郊以皇考德皇帝配除十二辰座加五帝位其餘準梁之舊北郊為壇高一丈五尺廣八丈以皇妣昭后配從祀亦準梁舊及文帝天嘉中南郊改以高祖配北郊以德皇帝配天太中大夫領大著作攝太常卿許亨奏曰昔梁武帝云天數五地數五五行之氣天地俱有故南北郊內並祭五祀臣按周禮以血祭社稷五祀鄭玄云陰祀自血起貴氣臭也五祀五官之神也五神主五行隸於地故與埋沈副辜同為陰祀既非煙柴無關陽祭故何休云周爵五等者法地有五行也五神位在北郊圓丘不宜重設制曰可亨又奏曰梁武帝議箕畢自是二十八宿之名風師雨師自是箕畢下隸非即星也故郊雩之所皆雨祭之臣案周禮大宗伯之職云槱燎祀司中司命風師雨師鄭衆云風師箕也雨師畢也詩云月離于畢俾滂沱矣如此則風伯雨師即箕畢星矣而今南郊祀箕畢二星復祭風伯雨師恐乖祀典制曰若郊設星位任即除之亨又奏曰梁儀注曰一獻為質三獻為文事天之事故不三獻臣案周禮司樽所言三獻施於宗祧而鄭注一獻施於羣小祀今用小祀之禮施於天神大帝梁武此義為不通矣且樽俎之物依於質文拜獻之禮主於虔敬今請凡郊丘祀事準於宗祧三獻為允制曰依議廢帝光大中又以昭后配北郊及宣帝即位以南北二郊卑下更議增廣久而不決至太建十一年尚書祠部郎王元規議曰案前漢黃圖上帝壇徑五丈高九尺后土壇方五丈高六尺梁南郊壇上徑十一丈下徑十八丈高二丈七尺北郊壇上方十丈下方十二丈高一丈即日南郊壇廣十丈高二丈二尺五寸北郊壇廣九丈三尺高一丈五寸今議增南郊壇上徑十二丈則天大數下徑十八丈取於三分益一高二丈七尺取三倍九尺之堂北郊壇上方十丈以則地義下至十五丈亦取二分益一高一丈二尺亦取二倍漢家之數禮記云為高必因丘陵為下必因川澤因名山升中于天因吉土饗帝于郊周官云冬日至祠天於地上之圓丘夏日至祭地於澤中之方丘祭法云燔柴於泰壇祭天也瘞埋於泰折祭地也記云至敬不壇掃地而祭於其質也以報覆燾持載之功爾雅亦云丘言非人所造為古圓方兩丘並因見有而祭本無高廣之數後世隨事遷都而建立郊禮或有地吉而未必有丘或有見丘而不必廣潔故有築建之法而制丈尺之儀愚謂郊祀事重圓方二丘高下廣狹既無明文但五帝不相沿三王不相襲今謹述漢梁并即日三代壇不同及更增修丈尺如前聽旨尚書僕射臣繕左戶尚書臣元饒左丞臣周確舍人臣蕭淳儀曹郎臣沈客卿同元規議詔遂依用後主嗣立無意典禮之事加舊儒碩學漸以凋喪至於朝亡竟無改作後齊制圓丘方澤並三年一祭謂之禘祀圓丘在國南郊丘下廣輪二百七十尺上廣輪四十六尺高四十五尺三成成高十五尺上中二級四面各一陛下級方維八陛周以三壝去丘五十步中壝去內壝外壝去中壝各二十五步皆通八門又為大營於外壝之外輪廣三百七十步其營塹廣一十二尺深一丈四面各通一門又為燎壇於中壝之外當丘之丙地廣輪三十六尺高三尺四面各有陛方澤為壇在國北郊廣輪四十尺高四尺面各一陛其外為三壝相去廣狹同圓丘壝外大營廣輸三百二十步營塹廣一十二尺深一丈四面各通一門又為瘞坎於壇之壬地中壝之外廣深一丈二尺圓丘則以蒼璧束帛正月上辛祀昊天上帝於其上以高祖神武皇帝配五精之帝從祀於其中丘面皆內向日月五星北斗二十八宿司中司命司人司祿風師雨師靈星於下丘為衆星之位遷於內壝之中合用蒼牲九夕牲之旦太尉告廟陳幣於神武廟訖埋於兩楹間焉皇帝初獻太尉亞獻光祿終獻司徒獻五帝司空獻日月五星二十八宿太常丞已下薦衆星方澤則以黃琮束帛夏至之日禘昆崙皇地祇於其上以武明皇后配其神州之神社稷岱嶽沂鎮會稽鎮云云山亭亭山蒙山羽山嶧山嵩嶽霍嶽衡鎮荊山內方山大別山敷淺原山桐柏山陪尾山華嶽太嶽鎮積石山龍門山江山岐山荊山嶓冢山壺口山雷首山底柱山析城山王屋山西傾朱圉山鳥鼠同穴山熊耳山敦物山蔡蒙山梁山岷山武功山太白山嶽醫無閭山鎮陰山白登山碣石山太行山狼山封龍山漳山宣務山閼山方山苟山狹龍山淮水東海泗水沂水淄水濰水江水南海漢水穀水洛水伊水漾水沔水河水西海黑水潦水渭水涇水酆水濟水北海松水京水桑乾水漳水呼水衛水洹水延水並從祀其神州位在青陛之北甲寅地社位赤陛之西未地稷位白陛之南庚地自餘並內壝之內內向各如其方合用牲十二儀同圓丘其後諸儒定禮圓丘改以冬至云其南北郊則歲一祀皆以正月上辛南郊為壇於國南廣輪三十六尺高九尺四面各一陛為三壝內壝去壇二十五步中壝外壝相去如內壝四面各通一門又為大營於外壝之外廣輪二百七十步營塹廣一丈深八尺四面各一門又為燎壇於中壝之外丙地廣輪二十七尺高一尺八寸四面各一陛祀所感帝靈威仰於壇以高祖神武皇帝配禮用四圭有邸幣各如方色其上帝及配帝各用騂特牲一儀燎同圓丘其北郊則為壇如南郊壇為瘞坎如方澤坎祀神州神於其上以武明皇后配禮用兩圭有邸各用黃牲一儀瘞如北郊後周憲章姬周祭祀之式多依儀禮司量掌為壇之制圓丘三成成崇一丈二尺深二丈上徑六丈十有二階每等十有二節在國陽七里之郊圓壝徑三百步內壝半之方一成下崇一丈徑六丈八尺上崇五尺方四丈八方方一階階十級級一尺方丘在國陰六里之郊丘一成八方下崇一丈方六丈八尺上崇五尺方四丈方一階尺一級其壝八面徑百二十步內壝半之南郊為方壇於國南五里其崇一丈二尺其廣四丈其壝方百二十步內壝半之神州之壇崇一丈方四丈在北郊方丘之右其壝如方丘其祭圓丘及南郊並正月上辛圓丘則以其先炎帝神農氏配昊天上帝於其上五方上帝日月內官中官外官衆星並從祀皇帝乘蒼輅載玄冕備大駕而行預祭者皆蒼服南郊以始祖獻侯莫那配所感帝靈威仰於其上北郊方丘則以神農配后地之祇神州則以獻侯莫那配焉其用牲之制祀昊天上帝祭皇地祇及五帝日月五星十二辰四望五官各以其方色毛宗廟以黃社稷以黝散祭祀用純表磔禳用厖高祖受命欲新制度乃命國子祭酒辛彥之議定祀典為圓丘於國之南太陽門外道東二里其丘四成各高八尺一寸下成廣二十丈再成廣十五丈又三成廣十丈四成廣五丈再歲冬至之日祀昊天上帝於其上以太祖武元皇帝配五方上帝日月五星內官四十二座次官一百三十六座外官一百一十一座衆星三百六十座並皆從祀上帝日月在丘之第二等北斗五星十二辰河漢內官在丘第三等二十八宿中官在丘第四等外官在內壝之內衆星在內壝之外其牲上帝配帝用蒼犢二五帝日月用方色犢各一五星已下用羊豕各九為方丘於宮城之北十四里其丘再成成高五尺下成方十丈上成方五丈夏至之日祭皇地祇於其上以太祖配神州迎州冀州戎州拾州柱州營州咸州陽州九州山海川林澤丘陵墳衍原隰並皆從祀地祇及配帝在壇上用黃犢二神州九州神座於第二等八陛之間神州東南方迎州南方冀州戎州西南方拾州西方柱州西北方營州北方咸州東北方陽州東方各用方色犢一九州山海已下各依方面八陛之間其冀州山林川澤丘陵墳衍於壇之南少西加羊豕各九南郊為壇於國之南太陽門外道西一里去宮十里壇高七尺廣四丈孟春上辛祠所感帝赤熛怒於其上以太祖武元皇帝配其禮四圭有邸牲用騂犢二北郊孟冬祭神州之神以太祖武元皇帝配牲用犢二凡大祀齊官皆於其晨集尚書省受誓戒散齊四日致齊三日祭前一日晝漏上水五刻到祀所沐浴著明衣咸不得聞見衰絰哭泣昊天上帝五方上帝日月皇地祇神州社稷宗廟等為大祀星辰五祀四望等為中祀司中司命風師雨師及諸星諸山川等為小祀大祀養牲在滌九旬中祀三旬小祀一旬其牲方色難備者聽以純色代告祈之牲者不養祭祀犧牲不得捶撲其死則埋之初帝既受周禪恐黎元未愜多說符瑞以耀之其或造作而進者不可勝計仁壽元年冬至祠南郊置昊天上帝及五方天帝位並于壇上如封禪禮板曰維仁壽元年歲次作噩嗣天子臣堅敢昭告于昊天上帝璇璣運行大明南至臣蒙上天恩造羣靈降福撫臨率土安養兆人顧惟虛薄德化未暢夙夜憂懼不敢荒怠天地靈祇降錫休瑞鏡發區宇昭彰耳目爰始登極蒙授龜圖遷都定鼎醴泉出地平陳之歲龍引舟師省俗巡方展禮東嶽盲者得視瘖者得言復有躄人忽然能步自開皇已來日近北極行於上道晷度延長天啓太平獸見一角改元仁壽楊樹生松石魚彰合符之徵玉龜顯永昌之慶山圖石瑞前後繼出皆載臣姓名褒紀國祚經典諸緯爰及玉龜文字義理遞相符會宮城之內及在山谷石變為玉不可勝數桃區一嶺盡是琉璃黃銀出於神山碧玉生於瑞巘多楊山響三稱國興連雲山聲萬年臨國野鵝降天仍住池沼神鹿入苑頻賜引導騶虞見質遊驎在野鹿角生於楊樹龍湫出於荊谷慶雲發彩壽星垂耀宮殿樓閣咸出靈芝山澤川原多生寶物威香散馥零露凝甘敦煌烏山黑石變白弘祿巖嶺石華遠照玄狐玄豹白兔白狼赤雀蒼烏野蠶天豆嘉禾合穗珍木連理神瑞休徵洪恩景福降賜無疆不可具紀此皆昊天上帝爰降明靈矜愍蒼生寧靜海內故錫茲嘉慶咸使安樂豈臣微誠所能上感虔心奉謝敬薦玉帛犧齊粢盛庶品燔祀于昊天上帝皇考太祖武元皇帝配神作主大業元年孟春祀感帝孟冬祀神州改以高祖文帝配其餘並用舊禮十年冬至祀圓丘帝不齊于次詰朝備法駕至便行禮是日大風帝獨獻上帝三公分獻五帝禮畢御馬疾驅而歸明堂在國之陽梁初依宋齊其祀之法猶依齊制禮有不通者武帝更與學者議之舊齊儀郊祀帝皆以袞冕至天監七年始造大裘而明堂儀注猶云袞服十年儀曹郎朱虉以為禮大裘而冕祭昊天上帝五帝亦如之良由天神高遠義須誠質今從泛祭五帝理不容文於是改服大裘虉又以為齊儀初獻樽彝明堂貴質不應三獻又不應象樽禮云朝踐用太樽鄭云太樽瓦也記又云有虞氏瓦樽此皆在廟所用猶以質素况在明堂禮不容象今請改用瓦樽庶合文質之衷又曰宗廟貴文故庶羞百品天義尊遠則須簡約今儀注所薦與廟不異即理徵事如為未允請自今明堂肴膳準二郊但帝之為名本主生育成歲之功實為顯著非如昊天義絶言象雖曰同郊復應微異若水土之品蔬果之屬猶宜以薦止用梨棗橘栗四種之果薑蒲葵韭四種之葅粳稻黍粱四種之米自此以外郊所無者請並從省除初博士明山賓制儀注明堂祀五帝行禮先自赤帝始虉又以為明堂既泛祭五帝不容的有先後東階而升宜先春帝請改從青帝始又以為明堂籩豆等器皆以雕飾尋郊祀貴質改用陶匏宗廟貴文誠宜雕俎明堂之禮既方郊為文則不容陶匏比廟為質又不應雕俎斟酌二途須存厥衷請改用純漆虉又以舊儀明堂祀五帝先酌鬱鬯灌地求神及初獻清酒次酃終醁禮畢太祝取俎上黍肉當御前以授請依郊儀止一獻清酒且五帝天神不可求之於地二郊之祭並無黍肉之禮並請停灌及授俎法又以為舊明堂皆用太牢案記云郊用特牲又云天地之牛角繭栗五帝既曰天神理無三牲之祭而毛詩我將篇云祀文王於明堂有維羊維牛之說良由周監二代其義貴文明堂方郊未為極質故特用三牲止為一代之制今斟酌百王義存通典蔬果之薦雖符周禮而牲牢之用宜遵夏殷請自今明堂止用特牛既合質文之中又見貴誠之義帝並從之先是帝欲有改作乃下制旨而與羣臣切磋其義制曰明堂準大戴禮九室八牖三十六戶以茅蓋屋上圓下方鄭玄據援神契亦云上圓下方又云八窗四達明堂之義本是祭五帝神九室之數未見其理若五堂而言雖當五帝之數向南則背叶光紀向北則背赤熛怒東向西向又亦如此於事殊未可安且明堂之祭五帝則是總義在郊之祭五帝則是別義宗祀所配復應有室若專配一室則是義非配五若皆配五則便成五位以理而言明堂本無有室朱虉以為月令天子居明堂左個右個聽朔之禮既在明堂今若無室則於義成闕制曰若如鄭玄之義聽朔必在明堂於此則人神混淆莊敬之道有廢春秋云介居二大國之間此言明堂左右個者謂所祀五帝堂之南又有小室亦號明堂分為三處聽朔既三處則有左右之義在營域之內明堂之外則有個名故曰明堂左右個也以此而言聽朔之處自在五帝堂之外人神有別差無相干其議是非莫定初尚未改十二年太常丞虞石胡復引周禮明堂九尺之筵以為高下修廣之數堂崇一筵故階高九尺漢家制度猶遵此禮故張衡云度堂以筵者也鄭玄以廟寢三制既同俱應以九尺為度制曰可於是毀宋太極殿以其材構明堂十二間基準太廟以中央六間安六座悉南向東來第一青帝第二赤帝第三黃帝第四白帝第五黑帝配帝總配享五帝在阼階東上西向大殿後為小殿五間以為五佐室焉陳制明堂殿屋十二間中央六間依齊制安六座四方帝各依其方黃帝居坤維而配饗坐依梁法武帝時以德帝配文帝時以武帝配廢帝已後以文帝配牲以太牢粢盛六飯鈃羹果蔬備薦焉後齊採周官考工記為五室周採漢三輔黃圖為九室各存其制而竟不立高祖平陳收羅嵵梓郊丘宗社典禮粗備唯明堂未立開皇十三年詔命議之禮部尚書牛弘國子祭酒辛彥之等定議事在弘傳後檢校將作大匠事宇文愷依月令文造明堂木樣重檐復廟五房四達丈尺規矩皆有準憑以獻高祖異之命有司於郭內安業里為規兆方欲崇建又命詳定諸儒爭論莫之能決弘等又條經史正文重奏時非議既多久而不定又議罷之及大業中愷又造明堂議及樣奏之煬帝下其議但令於霍山採木而建都興役其制遂寢終隋代祀五方上帝止於明堂以季秋在雩壇上而祀其用幣各於其方人帝各在天帝之左太祖武元皇帝在太昊南西向五官在庭亦各依其方牲用犢十二皇帝太尉司農行三獻禮于青帝及太祖自餘有司助奠祀五官於堂下行一獻禮有燎其省牲進熟如南郊儀

body:
  text: 隋書卷八十四列傳第四十九北狄突厥突厥之先平涼雜胡也姓阿史那氏後魏太武滅沮渠氏阿史那以五百家奔茹茹世居金山工於鐵作金山狀如兜鍪俗呼兜鍪為突厥因以為號或云其先國於西海之上為鄰國所滅男女無少長盡殺之至一兒不忍殺刖足斷臂棄於大澤中有一牝狼每銜肉至其所此兒因食之得以不死其後遂與狼交狼有孕焉彼鄰國者復令人殺此兒而狼在其側使者將殺之其狼若為神所憑歘然至於海東止於山上其山在高昌西北下有洞穴狼入其中遇得平壤茂草地方二百餘里其後狼生十男其一姓阿史那氏最賢遂為君長故牙門建狼頭纛示不忘本也有阿賢設者率部落出於穴中世臣茹茹至大葉護種類漸強當後魏之末有伊利可汗以兵擊鐵勒大敗之降五萬餘家遂求婚於茹茹茹茹主阿那瓌大怒遣使罵之伊利斬其使率衆襲茹茹破之卒弟逸可汗立又破茹茹病且卒捨其子攝圖立其弟俟斗稱為木杆可汗木杆勇而多智遂擊茹茹滅之西破挹怛東走契丹北方戎狄悉歸之抗衡中夏後與西魏師入侵東魏至于太原其俗畜牧為事隨逐水草不厥處穹廬檳帳被髮左衽食肉飲酪身衣裘褐賤老貴壯官有葉護次設特勤次俟利發次吐屯發下至小官凡二十八等皆世為之有角弓鳴鏑甲矟刀劍善騎射性殘忍無文字刻木為契候月將滿輒為寇抄謀反叛殺人者皆死淫者割勢而腰斬之鬬傷人目者償之以女無女則輸婦折支體者輸馬盜者則償贓十倍有死者停尸帳中家人親屬多殺牛馬而祭之繞帳號呼以刀劃面血淚交下七度而止於是擇日置尸馬上而焚之取灰而葬表木為塋立屋其中圖畫死者形儀及其生時所經戰陳之狀嘗殺一人則立一石有至千百者父兄死子弟妻其羣母及嫂五月中多殺羊馬以祭天男子好樗蒲女子踏鞠飲馬酪取醉歌呼相對敬鬼神信巫覡重兵死而病終大抵與胸奴同俗木杆在位二十年卒復捨其子大邏便而立其弟是為他鉢可汗他鉢以攝圖為爾伏可汗統其東面又以其弟褥但可汗子為步離可汗居西方時他鉢控弦數十萬中國憚之周齊爭結姻好傾府藏以事之他鉢益驕每謂其下曰我在南兩兒常孝順何患貧也齊有沙門惠琳被掠入突厥中因謂他鉢曰齊國富強者為有佛法耳遂說以因緣果報之事他鉢聞而信之建一伽藍遣使聘于齊氏求淨名涅槃華嚴等經並十誦律他鉢亦躬自齊戒繞塔行道恨不生內地在位十年病且卒謂其子菴羅曰吾聞親莫過於父子吾兄不親其子委地於我我死汝當避大邏便也及他鉢卒國中將立大邏便以其母賤衆不服菴羅母貴突厥素重之攝圖最後至謂國中曰若立菴羅者我當率兄弟以事之如立大邏便我必守境利刃長矛以相待矣攝圖長而且雄國人皆憚莫敢拒者竟立菴羅為嗣大邏便不得立心不服菴羅每遣人罵辱之菴羅不能制因以國讓攝圖國中相與議曰四可汗之子攝圖最賢因迎立之號伊利俱盧設莫何始波羅可汗一號沙鉢略治都斤山菴羅降居獨洛水稱第二可汗大邏便乃請沙鉢略曰我與爾俱可汗子各承父後爾今極尊我獨無位何也沙鉢略患之以為阿波可汗還領所部沙鉢略勇而得衆北夷皆歸附之及高祖受禪待之甚薄北夷大怨會營州刺史高寶寧作亂沙鉢略與之合軍攻陷臨渝鎮上勑緣邊修保鄣峻長城以備之仍命重將出鎮幽並沙鉢略妻宇文氏之女曰千金公主自傷宗祀絶滅每懷復隋之志日夜言之於沙鉢略由是悉衆為寇控弦之士四十萬上令柱國馮昱屯乙弗泊蘭州總管叱李長叉守臨洮上柱國李崇屯幽州達奚長儒據周槃皆為虜所敗於是縱兵自木硤石門兩道來寇武威天水安定金城上郡弘化延安六畜咸盡天子震怒下詔曰往者魏道衰敝禍難相尋周齊抗衡分割諸夏突厥之虜俱通二國周人東慮恐齊好之深齊氏西虞懼周交之厚謂虜意輕重國逐安危非徒並有大敵之憂思減一邊之防竭生民之力供其來往傾府庫之財棄於沙漠華夏之地實為勞擾猶復劫剝烽戍殺害吏民無歲月而不有也惡積禍盈非止今日朕受天明命子育萬方愍臣下之勞除既往之弊以為厚斂兆庶多惠豺狼未嘗感恩資而為賊違天地之意非帝王之道節之以禮不為虛費省徭薄賦國用有餘因入賊之物加賜將士息道路之民務於耕織清邊制勝成策在心凶醜愚暗未知深旨將大定之日比戰國之時乘昔世之驕結今時之恨近者盡其巢窟俱犯北邊朕分置軍旅所在邀截望其深入一舉滅之而遠鎮偏師逢而摧翦未及南上遽已奔北應弦染鍔過半不歸且彼渠帥其數凡五昆季爭長父叔相猜外示彌縫內乖心腹世行暴虐家法殘忍東夷諸國盡挾私讎西戎羣長皆有宿怨突厥之北契丹之徒切齒磨牙常伺其便達頭前攻酒泉其後于闐波斯挹怛三國一時即叛沙鉢略近趣周槃其部內薄孤束紇羅尋亦翻動往年利稽察大為高麗靺鞨所破娑毗設又為紇支可汗所殺與其為鄰皆願誅剿部落之下盡異純民千種萬類仇敵怨偶泣血拊心銜悲積恨圓首方足皆人類也有一於此更切朕懷彼地咎徵妖作年將一紀乃獸為人語人作神言云其國亡訖而不見每冬雷震觸地火生種類資給惟藉水草去歲四時竟無雨雪川枯蝗暴卉木燒盡饑疫死亡人畜相半舊居之所赤地無依遷徙漠南偷存晷刻斯蓋上天所忿驅就齊斧幽明合契今也其時故選將治兵贏糧聚甲義士奮發壯夫肆憤願取名王之首思撻單于之背雲歸霧集不可數也東極滄海西盡流沙縱百勝之兵橫萬里之衆亘朔野之追躡望天崖而一掃此則王恢所說其猶射癰何敵能當何遠不服但皇王舊迹北止幽都荒遐之表文軌所棄得其地不可而居得其民不忍皆殺無勞兵革遠規溟海諸將今行義兼含育有降者納有違者死異域殊方被其擁抑放聽復舊廣闢邊境嚴治關塞使其不敢南望永服威刑臥鼓息烽暫勞終逸制御夷狄義在斯乎何用侍子之朝寧勞渭橋之拜普告海內知朕意焉於是以河間王弘上柱國豆盧績竇榮定左僕射高熲右僕射虞慶則並為元帥出塞擊之沙鉢略率阿波貪汗二可汗等來拒戰皆敗走遁去時虜飢甚不能得食於是粉骨為糧又多災疫死者極衆既而沙鉢略以阿波驍悍忌之因其先歸襲擊其部大破之殺阿波之母阿波還無所歸西奔達頭可汗達頭者名玷厥沙鉢略之從父也舊為西面可汗既而大怒遣阿波率兵而東其部落歸之者將十萬騎遂與沙鉢略相攻又有貪汗可汗素睦於阿波沙鉢略奪其衆而廢之貪汗亡奔達頭沙鉢略從弟地勤察別統部落與沙鉢略有隙復以衆叛歸阿波連兵不已各遣使詣闕請和求援上皆不許會千金公主上書請為一子之例高祖遣開府徐平和使於沙鉢略晉王廣時鎮並州請因其釁而乘之上不許沙鉢略遣使致書曰辰年九月十日從天生大突厥天下賢聖天子伊利俱盧設莫何始波羅可汗致書大隋皇帝使人開府徐平和至辱告言語具聞也皇帝是婦父即是翁此是女夫即是兒例兩境雖殊情義是一今重疊親舊子子孫孫乃至萬世不斷上天為證終不違負此國所有羊馬都是皇帝畜生彼有繒綵都是此物彼此有何異也高祖報書曰大隋天子貽書大突厥伊利俱盧設莫何沙鉢略可汗得書知大有好心向此也既是沙鉢略婦翁今日看沙鉢略共兒子不異即以親舊厚意常使之外今特別遣大臣虞慶則往彼看女復看沙鉢略也沙鉢略陳兵列其寶物坐見慶則稱病不能起且曰我父伯以來不向人拜慶則責而喻之千金公主私謂慶則曰可汗豺狼性過與爭將齧人長孫晟說諭之攝圖辭屈乃頓顙跪受璽書以戴於首既而大慚其羣下因相聚慟哭慶則又遣稱臣沙鉢略謂其屬曰何名為臣報曰隋國稱臣猶此稱奴耳沙鉢略曰得作大隋天子奴虞僕射之力也贈慶則馬千匹並以從妹妻之時沙鉢略既為達頭所困又東畏契丹遣使告急請將部落度漠南寄居白道川內有詔許之詔晉王廣以兵援之給以衣食賜以車服鼓吹沙鉢略因西擊阿波破擒之而阿拔國部落乘虛掠其妻子官軍為擊阿拔敗之所獲悉與沙鉢略沙鉢略大喜乃立約以磧為界因上表曰大突厥伊利俱盧設始波羅莫何可汗臣攝圖言大使尚書右僕射虞慶則至伏奉詔書兼宣慈旨仰惟恩信之著逾久愈明徒知負荷不能答謝伏惟大隋皇帝之有四海上契天心下順民望二儀之所覆載七曜之所照臨莫不委質來賓回首面內實萬世之一聖千年之一期求之古昔未始聞也突厥自天置以來五十餘載保有沙漠自王蕃隅地過萬里士馬億數力兼戎夷抗禮華夏在於北狄莫與為大頃者氣候清和風雲順序意以華夏其有大聖興焉況今被霑德義仁化所及禮讓之風自朝滿野竊以天無二日土無二王伏惟大隋皇帝真皇帝也豈敢阻兵恃險偷竊名號今便感慕淳風歸心有道屈膝稽顙永為藩附雖復南瞻魏闕山川悠遠北面之禮不敢廢失當令侍子入朝神馬歲貢朝夕恭承唯命是視至於削衽解辮革音從律習俗已久未能改變闔國同心無不銜荷不任下情欣慕之至謹遣第七兒臣窟含真等奉表以聞高祖下詔曰沙鉢略稱雄漠北多歷世年百蠻之大莫過於此往雖與和猶是二國今作君臣便成一體情深義厚朕甚嘉之荷天之休海外有截豈朕薄德所能致此已勑有司肅告郊廟宜普頒天下咸使知聞自是詔答諸事並不稱其名以異之其妻可賀敦周千金公主賜姓楊氏編之屬籍改封大義公主策拜窟含真為柱國封安國公宴於內殿引見皇后賞勞甚厚沙鉢略大悅於是歲時貢獻不絶七年正月沙鉢略遣其子入貢方物因請獵於代之間又許之仍遣人賜其酒食沙鉢略率部落再拜受賜沙鉢略一日手殺鹿十八頭齎尾舌以獻還至紫河鎮其牙帳為火所燒沙鉢略惡之月餘而卒上為廢朝三日遣太常弔祭焉贈物五千段初攝圖以其子雍虞閭性磱遺令立其弟葉護處羅侯雍虞閭遣使迎處羅侯將立之處羅侯曰我突厥自木杆可汗以來多以弟代兄以庶奪嫡失先祖之法不相敬畏汝當嗣位我不憚拜汝也雍虞閭又遣使謂處羅侯曰叔與我父共根連體我是枝葉寧有我作主令根本反同枝葉令叔父之尊下我卑稚又亡父之命其可廢乎願叔勿疑相讓者五六處羅侯竟立是為葉護可汗以雍虞閭為葉護遣使上表言狀上賜之鼓吹幡旗處羅侯長頤僂背眉目疏朗勇而有謀以隋所賜旗鼓西征阿波敵人以為得隋兵所助多來降附遂生擒阿波既而上書請阿波死生之命上下其議左僕射高熲進曰骨肉相殘教之蠹也存養以示寬大上曰善熲因奉觴進曰自軒轅以來獯粥多為邊患今遠窮北海皆為臣妾此之盛事振古未聞臣敢再拜上壽其後處羅侯又西征中流矢而卒其衆奉雍虞閭為主是為頡伽施多那都藍可汗雍虞閭遣使詣闕賜物三千段每歲遣使朝貢時有流人楊欽亡入突厥中謬云彭國公劉昶與宇文氏謀反令大義公主發兵擾邊都藍執欽以聞并貢葧布魚膠其弟欽羽設部落強盛都藍忌而擊之斬首於陳其年遣其母弟褥但特勤獻于闐玉杖上拜褥但為柱國康國公明年突厥部落大人相率遣使貢馬萬匹羊二萬口駝牛各五百頭尋遣使請緣邊置市與中國貿易詔許之平陳之後上以陳叔寶屏風賜大義公主主心不平因書屏風為詩陳亡自寄其辭曰盛衰等朝暮世道若浮萍榮華實難守池臺終自平富貴今何在空事寫丹青杯酒無樂弦歌詎有聲余本皇家子飄流入虜庭一朝覩成敗懷抱忽縱橫古來共如此非我獨申名唯有明君曲偏傷遠嫁情上聞而惡之禮賜益薄公主復與西面突厥泥利可汗連結上恐其為變將圖之會主與所從胡私通因發其事下詔廢黜之恐都藍不從遣奇章公牛弘將美妓四人以啖之時沙鉢略子曰染干號突利可汗居北方遣使求婚上令裴矩謂之曰當殺大義主者方許婚突利以為然復譖之都藍因發怒遂殺公主於帳都藍與達頭可汗有隙數相征伐上和解之各引兵而去十七年突利遣使來逆女上舍之太常教習六禮妻以宗女安義公主上欲離間北夷故特厚其禮遣牛弘蘇威斛律孝卿相繼為使突厥前後遣使入朝三百七十輩突利本居北方以尚主之故南徙度斤舊鎮錫賚優厚雍虞閭怒曰我大可汗也反不如染干於是朝貢遂絶數為邊患十八年詔蜀王秀出靈州道以擊之明年又遣漢王諒為元帥左僕射高熲率將軍王察上柱國趙仲卿並出朔州道右僕射楊素率柱國李徹韓僧壽出靈州上柱國燕榮出幽州以擊之雍虞閭與玷厥舉兵攻染干盡殺其兄弟子姪遂度河入蔚州染干夜以五騎與隋使長孫晟歸朝上令染干與雍虞閭使者因頭特勤相辨詰染干辭直上乃厚待之雍虞閭弟都速六棄其妻子與突利歸朝上嘉之敕染干與都速六摴蒲稍稍輸以寶物用慰其心夏六月高熲楊素擊玷厥大破之拜染干為意利珍豆啓民可汗華言意智健也啓民上表謝恩曰臣既蒙豎立復改官名昔日姦心今悉除去奉事至尊不敢違法上於朔州築大利城以居之是時安義主已卒上以宗女義成公主妻之部落歸者甚衆雍虞閭又擊之上復令入塞雍虞閭侵掠不已遷於河南在夏勝二州之間發徒掘塹數百里東西拒河盡為啓民畜牧之地於是遣越國公楊素出靈州行軍總管韓僧壽出慶州太平公史萬歲出燕州大將軍姚辨出河州以擊都藍師未出塞而都藍為其麾下所殺達頭自立為步迦可汗其國大亂遣太平公史萬歲出朔州以擊之遇達頭於大斤山虜不戰而遁追斬首虜二千餘人晉王廣出靈州達頭遁逃而去尋遣其弟子俟利伐從磧東攻啓民上又發兵助啓民守要路俟利伐退走入磧啓民上表陳謝曰大隋聖人莫緣可汗憐養百姓如天無不覆也如地無不載也諸姓蒙威恩赤心歸服並將部落歸投聖人可汗來也或南入長城或住白道人民羊馬遍滿山谷染干譬如枯木重起枝葉枯骨重生皮肉千萬世長與大隋典羊馬也仁壽元年代州總管韓洪為虜所敗於安廢為庶人詔楊素為雲州道行軍元帥率啓民北征斛薛等諸姓初附于啓民至是而叛素軍河北值突厥阿勿思力俟斤等南度掠啓民男女六千口雜畜二十餘萬而去素率上大將軍梁默輕騎追之轉戰六十餘里大破俟斤悉得人畜以歸啓民素又遣柱國張定和領軍大將軍劉升別路邀擊並多斬獲而還兵既度河賊復掠啓民部落素率驃騎范貴於窟結谷東南奮擊復破之追奔八十餘里是歲泥利可汗及葉護俱被鐵勒所敗步迦尋亦大亂奚霫五部內徙步迦奔吐谷渾啓民遂有其衆歲遣朝貢大業三年四月煬帝幸榆林啓民及義成公主來朝行宮前後獻馬三千匹帝大悅賜物萬二千段啓民上表曰已前聖人先帝莫緣可汗存在之日憐臣賜臣安義公主種種無少短臣種末為聖人先帝憐養臣兄弟姤惡相共殺臣臣當時無處去向上看只見天下看只見地實憶聖人先帝言語投命去來聖人先帝見臣大憐臣死命養活勝於往前遣臣作大可汗坐著也其突厥百姓死者以外還聚作百姓也至尊今還如聖人先帝捉天下四方坐也還養活臣及突厥百姓實無少短臣今憶想聖人及至尊養活事具奏不可盡並至尊聖心𩹉在臣今非是舊日邊地突厥可汗臣即是至尊臣民至尊憐臣時乞依大國服飾法用一同華夏臣今率部落敢以上聞伏願天慈不違所請表奏帝下其議公卿請依所奏帝以為不可乃下詔曰先王建國夷夏殊風君子教民不求變俗斷髮文身咸安其性旃裘卉服各尚所宜因而利之其道弘矣何必化諸削衽縻以長纓豈遂性之至理非包含之遠度衣服不同既辨要荒之庶類區別彌見天地之情仍璽書答啓民以為磧北未靜猶須征戰但使好心孝順何必改變衣服也帝法駕御千人大帳享啓民及其部落酋長三千五百人賜物二十萬段其下各有差復下詔曰德合天地覆載所以弗遺功格區宇聲教所以咸洎至於梯山航海請受正朔襲冠解辮同彼臣民是故王會納貢義彰前冊呼韓入臣待以殊禮突厥意利珍豆啓民可汗志懷沈毅世修藩職往者挺身違難拔足歸仁先朝嘉此款誠授以徽號資其甲兵之衆收其破滅之餘復祀於既亡之國繼絶於不存之地斯固施均亭育澤漸要荒者矣朕以薄德祗奉靈命思播遠猷光融令緒是以親巡朔野撫寧藩服啓民深委誠心入奉朝覲率其種落拜首軒墀言念丹款良以嘉尚宜隆榮數式優典可賜路車乘馬鼓吹幡旗贊拜不名位在諸侯王上帝親巡雲內泝金河而東北幸啓民所居啓民奉觴上壽跪伏甚恭帝大悅賦詩曰鹿塞鴻旗駐龍庭翠輦回檳帳望風舉穹廬向日開呼韓頓顙至屠耆接踵來索辮擎羶肉韋韝獻酒杯何如漢天子空上單于臺帝賜啓民及主金甕各一及衣服被褥錦綵特勤以下各有差先是高麗私通使啓民所啓民推誠奉國不敢隱境外之交是日將高麗使人見勑令牛弘宣旨謂之曰朕以啓民誠心奉國故親至其所明年當往涿郡爾還日語高麗王知宜早來朝勿自疑懼存育之禮當同於啓民如或不朝必將啓民巡行彼土使人甚懼啓民仍扈從入塞至定襄詔令歸藩明年朝於東都禮賜益厚是歲疾終上為之廢朝三日立其子咄吉世是為始畢可汗表請尚公主詔從其俗十一年來朝於東都其年車駕避暑汾陽宮八月始畢率其種落入寇圍帝於雁門詔諸郡發兵赴行在所援軍方至始畢引去由是朝貢遂絶明年復寇馬邑唐公以兵擊走之隋末亂離中國人歸之者無數遂大強盛勢陵中夏迎蕭皇后置於定襄薛舉竇建德王世充劉武周梁師都李軌高開道之徒雖僭尊號皆北面稱臣受其可汗之號使者往來相望於道也西突厥西突厥者木杆可汗之子大邏便也與沙鉢略有隙因分為二漸以強盛東拒都斤西越金山龜茲鐵勒伊吾及西域諸胡悉附之大邏便為處羅侯所執其國立鞅素特勤之子是為泥利可汗卒子達漫立號泥撅處羅可汗其母向氏本中國人生達漫而泥利卒向氏又嫁其弟婆實特勤開皇末婆實共向氏入朝遇達頭亂遂留京師每舍之鴻臚寺處羅可汗居無處然多在烏孫故地復立二小可汗分統所部一在石國北以制諸胡國一居龜茲北其地名應娑官有俟發閻洪達以評議國事自餘與東國同每五月八日相聚祭神歲遣重臣向其先世所居之窟致祭焉當大業初處羅可汗撫御無道其國多叛與鐵勒屢相攻大為鐵勒所敗時黃門侍郎裴矩在敦煌引致西域聞國亂復知處羅思其母氏因奏之煬帝遣司朝謁者崔君肅齎書慰諭之處羅甚踞受詔不肯起君肅謂處羅曰突厥本一國也中分為二自相仇敵每歲交兵積數十年而莫能相滅者明知啓民與處羅國其勢敵耳今啓民舉其部落兵且百萬入臣天子甚有丹誠者何也但以切恨可汗而不能獨制故卑事天子以借漢兵連二大國欲滅可汗耳百官兆庶咸請許之天子弗違師出有日矣顧可汗母向氏本中國人歸在京師處于賓館聞天子之詔懼可汗之滅旦夕守闕哭泣悲哀是以天子憐焉為其輟策向夫人又匍匐謝罪因請發使以召可汗令入內屬乞加恩禮同於啓民天子從之故遣使到此可汗若稱藩拜詔國乃永安而母得延壽不然者則向夫人為誑天子必當取戮而傳首虜庭發大隋之兵資北蕃之衆左提右挈以擊可汗死亡則無日矣奈何惜兩拜之禮剿慈母之命吝一句稱臣喪胸奴國也處羅聞之矍然而起流涕再拜跪受詔書君肅又說處羅曰啓民內附先帝嘉之賞賜極厚故致兵強國富今可汗後附與之爭寵須深結於天子自表至誠既以道遠未得朝覲宜立一功以明臣節處羅曰如何君肅曰吐谷渾者啓民少子莫賀咄設之母家也今天子又以義成公主妻於啓民啓民畏天子之威而與之絶吐谷渾亦因憾漢故職貢不修可汗若請誅之天子必許漢擊其內可汗攻其外破之必矣然後身自入朝道路無阻因見老母不亦可乎處羅大喜遂遣使朝貢帝將西狩六年遣侍御史韋節召處羅令與車駕會於大斗拔谷其國人不從處羅謝使者辭以他故帝大怒無如之何適會其酋長射匱遣使來求婚裴矩因奏曰處羅不朝恃強大耳臣請以計弱之分裂其國即易制也射匱者都六之子達頭之孫世為可汗君臨西面今聞其失職附隸於處羅故遣使來以結援耳願厚禮其使拜為大可汗則突厥勢分兩從我矣帝曰公言是也因遣裴矩朝夕至館微諷諭之帝於仁風殿召其使者言處羅不順之意稱射匱有好心吾將立為大可汗令發兵誅處羅然後當為婚也帝取桃竹白羽箭一枝以賜射匱因謂之曰此事宜速使疾如箭也使者返路經處羅處羅愛箭將留之使者譎而得免射匱聞而大喜興兵襲處羅處羅大敗棄妻子將左右數千騎東走在路又被劫掠遁於高昌東保時羅漫山高昌王麴伯雅上狀帝遣裴矩將向氏親要左右馳至玉門關晉昌城矩遣向氏使詣處羅所論朝廷弘養之義丁寧曉諭之遂入朝然每有怏怏之色以七年冬處羅朝於臨朔宮帝享之處羅稽首謝曰臣總西面諸蕃不得早來朝拜今參見遲晚罪責極深臣心𩹉悚懼不能道盡帝曰往者與突厥相侵擾不得安居今四海既清與一家無異朕皆欲存養使遂性靈譬如天上止有一箇日照臨莫不寧帖若有兩箇三箇日萬物何以得安比者亦知處羅總攝事繁不得早來相見今日見處羅懷抱豁然歡善處羅亦當豁然不煩在意明年元會處羅上壽曰自天以下地以上日月所照唯有聖人可汗今是大日願聖人可汗千歲萬歲常如今日也詔留其纍弱萬餘口令其弟達度闕牧畜會寧郡處羅從征高麗賜號為曷薩那可汗賞賜甚厚十年正月以信義公主嫁焉賜錦綵袍千具綵萬匹帝將復其故地以遼東之役故未遑也每從巡幸江都之亂隨化及至河北化及將敗奔歸京師為北蕃突厥所害鐵勒鐵勒之先胸奴之苗裔也種類最多自西海之東依據山谷往往不絶獨洛河北有僕骨同羅韋紇拔也古覆羅並號俟斤蒙陳吐如紇斯結渾斛薛等諸姓勝兵可二萬伊吾以西焉耆之北傍白山則有契弊薄落職乙嘻蘇婆那曷烏歡紇骨也嘻於尼歡等勝兵可二萬金山西南有薛延陀嘻勒兒十槃達契等一萬餘兵康國北傍阿得水則有訶嘻曷嶻撥忽比干具海曷比悉何嵯蘇拔也未渴達等有三萬許兵得嶷海東西有蘇路羯三索咽蔑促隆忽等諸姓八千餘拂菻東則有恩屈阿蘭北褥九離伏嗢昏等近二萬人北海南則都波等雖姓氏各別總謂為鐵勒並無君長分屬東西兩突厥居無所隨水草流移人性凶忍善於騎射貪婪尤甚以寇抄為生近西邊者頗為藝植多牛羊而少馬自突厥有國東西征討皆資其用以制北荒開皇末晉王廣北征納啓民大破步迦可汗鐵勒於是分散大業元年突厥處羅可汗擊鐵勒諸部厚稅斂其物又猜忌薛延陀等恐為變遂集其魁帥數百人盡誅之由是一時反叛拒處羅遂立俟利發俟斤契弊歌楞為易勿真莫何可汗居貪汗山復立薛延陀內俟斤字也嘻為小可汗處羅可汗既敗莫何可汗始大莫何勇毅絶倫甚得衆心為鄰國所憚伊吾高昌焉耆諸國悉附之其俗大抵與突厥同唯丈夫婚畢便就妻家待産乳男女然後歸舍死者埋殯之此其異也大業三年遣使貢方物自是不絶云奚奚本曰庫莫奚東部胡之種也為慕容氏所破遺落者竄匿松漠之間其俗甚為不潔而善射獵好為寇鈔初臣於突厥後稍強盛分為五部一曰辱紇王二曰莫賀弗三曰契箇四曰木昆五曰室得每部俟斤一人為其帥隨逐水草頗同突厥有阿會氏五部中為盛諸部皆歸之每與契丹相攻擊虜獲財畜因而得賞死者以葦薄裹尸懸之樹上自突厥稱藩之後亦遣使入朝或通或絶最為無信大業時歲遣使貢方物契丹室韋契丹之先與庫莫奚異種而同類並為慕容氏所破俱竄於松漠之間其後稍大居黃龍之北數百里其俗頗與靺鞨同好為寇盜父母死而悲哭者以為不壯但以其尸置於山樹之上經三年之後乃收其骨而焚之因酹而祝曰冬月時向陽食若我射獵時使我多得猪鹿其無禮頑嚚於諸夷最甚當後魏時為高麗所侵部落萬餘口求內附止于白貔河其後為突厥所逼又以萬家寄於高麗開皇四年率諸莫賀弗來謁五年悉其衆款塞高祖納之聽居其故地六年其諸部相攻擊久不止又與突厥相侵高祖使使責讓之其國遣使詣闕頓顙謝罪其後契丹別部出伏等背高麗率衆內附高祖納之安置於渴奚那頡之北開皇末其別部四千餘家背突厥來降上方與突厥和好重失遠人之心悉令給糧還本勑突厥撫納之固辭不去部落漸衆遂北徙逐水草當遼西正北二百里依託紇臣水而居東西亘五百里南北三百里分為十部兵多者三千少者千餘逐寒暑隨水草畜牧有征伐則酋帥相與議之興兵動衆合符契突厥沙鉢略可汗遣吐屯潘垤統之室韋契丹之類也其南者為契丹在北者號室韋分為五部不相總一所謂南室韋北室韋鉢室韋深末怛室韋太室韋並無君長人民貧弱突厥常以三吐屯總領之南室韋在契丹北三千里土地卑濕至夏則移向西北貸勃缺對二山多草木饒禽獸又多蚊蚋人皆巢居以避其患漸分為二十五部每部有餘莫弗瞞咄猶酋長也死則子弟代立嗣絶則擇賢豪而立之其俗丈夫皆被髮婦人槃髮衣服與契丹同乘牛車籧篨為屋如突厥檳車之狀渡水則束薪為或以皮為舟者馬則織草為韉結繩為轡寢則屈為屋以籧篨覆上移則載行以猪皮為席編木為藉婦女皆抱膝而坐氣候多寒田收甚薄無羊少馬多猪牛造酒食噉與靺鞨同俗婚嫁之法二家相許壻輒盜婦將去然後送牛馬為娉更將歸家待有娠乃相隨還舍婦人不再嫁以為死人之妻難以共居部落共為大棚人死則置尸其上居喪三年年唯四哭其國無鐵取給於高麗多貂南室韋北行十一日至北室韋分為九部落繞吐紇山而居其部落渠帥號乞引莫賀咄每部有莫何弗三人以二之氣候最寒雪深沒馬冬則入山居土穴中牛畜多凍死饒麞鹿射獵為務食肉衣皮鑿氷沒水中而網射魚鱉地多積雪懼陷坑穽騎木而行俗皆捕貂為業冠以狐衣以魚皮又北行千里至鉢室韋依胡布山而住人衆多北室韋不知為幾部落用樺皮蓋屋其餘同北室韋從鉢室韋西南四日行至深末怛室韋因水為號也冬月穴居以避太陰之氣又西北數千里至大室韋徑路險阻語言不通尤多貂及青鼠北室韋時遣使貢獻餘無至者史臣曰四夷之為中國患也久矣北狄尤甚焉種落實繁迭雄邊塞年代遐邈非一時也五帝之世則有獯粥焉其在三代則獫狁焉逮乎兩漢則胸奴焉當塗典午則烏丸鮮卑焉後魏及周則蠕蠕突厥焉此其酋豪相繼互為君長者也皆以畜牧為業侵鈔為資倏來忽往雲飛鳥集智謀之士議和親於廟堂之上折衝之臣論奮擊於塞垣之下然事無規權無定勢親疏因其強弱服叛在其盛衰衰則款塞頓顙盛則彎弓寇掠屈申異態強弱相反正朔所不及冠帶所不加唯利是視不顧盟誓至於莫相救讓驕黠憑陵和親約結之謀行師用兵之事前史論之備矣故不詳而究焉及蠕蠕衰微突厥始大至於木杆遂雄朔野東極東胡舊境西盡烏孫之地彎弓數十萬列處於代陰南向以臨周齊二國莫之能抗爭請盟好求結和親乃與周合從終亡齊國高祖遷鼎厥徒孔熾負其衆力將蹈秦郊內自相圖遂以乖亂達頭可汗遠遁啓民願保塞下於是推亡固存返其舊地助討餘燼部衆遂強卒於仁壽不侵不叛暨乎始畢未虧臣禮煬帝撫之非道始有雁門之圍俄屬羣盜並興於此寖以雄盛豪傑雖建名號莫不請好息民於是分置官司總統中國子女玉帛相繼於道使者之車往來結轍自古蕃夷驕僭未有若斯之甚也及聖哲膺期掃除氛祲暗於時變猶懷旅拒率其羣醜屢隳亭鄣殘毀我雲代搖蕩我太原肆掠於涇陽飲馬於渭汭聖上奇謀潛運神機密動遂使百世不羈之虜一舉而滅瀚海龍庭之地畫為九州幽都窮髮之民隸於編戶實帝皇所不及書契所未聞由此言之雖天道有盛衰亦人事之工拙也加以為而弗恃有而弗居類天地之含容同陰陽之化育斯乃大道之行也固無得而稱焉

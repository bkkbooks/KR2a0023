body:
  text: 宋天聖二年隋書刊本原跋隋書自開皇仁壽時王劭為書八十卷以類相從定為篇目至於編年紀傳並闕其體唐武德五年起居舍人令狐德奏請修五代史五代謂梁陳齊周隋也十二月詔中書令封德彝舍人顏師古修隋史緜歷數載不就而罷貞觀三年續詔秘書監魏徵修隋史左僕射房喬總監徵又奏於中書省置秘書內省令前中書侍郎顏師古給事中孔穎達著作郎許敬宗撰隋史徵總知其務多所損益務存簡正序論皆徵所作凡成帝紀五列傳五十十年正月壬子徵等詣闕上之十五年又詔左僕射于志寧太史令李淳風著作郎韋安仁符璽郎李延壽同修五代史志凡勒成十志三十卷顯慶元年五月己卯太尉長孫無忌等詣朝堂上進詔藏秘閣後又編第入隋書其實別行亦呼為五代史志案魏徵本傳貞觀七年為侍中十年五代史成加光祿大夫進封鄭國公俄請遜位拜特進今諸本並云特進又經籍志四卷獨云侍中鄭國公魏徵撰𣰋忌傳又云永徽三年始受詔監修疑當時先已刊修𣰋忌因成書而進今紀傳題以徵志以𣰋忌從衆本所載也紀傳亦有題太子少師許敬宗撰案敬宗傳貞觀八年除著作郎修國史遷中書舍人十年左授洪州司馬龍朔三年始拜太子少師與今錄年月官位不同疑後人所益房喬志寧初並受詔又李延壽傳云被詔與著作佐郎敬播同修五代史志按延壽貞觀三年與顏師古同被勑修隋史其年以內憂去職今諸本並不載喬等名位天文律曆五行三志皆淳風獨作五行志序諸本云褚遂良作案本傳未嘗受詔撰述疑祗為一序今故略其名氏天聖二年五月十一日上御藥供奉藍元用奉傳聖旨齎禁中隋書一部付崇文院至六月五日勑差官校勘時命臣綬臣燁提點右正言直史館張觀等校勘觀尋為度支判官續命黃鑑代之仍內出版式雕造

body:
  text: 隋書卷四十列傳第五梁士彥子剛梁默梁士彥字相如安定烏氏人也少任俠不仕州郡性剛果喜正人之是非好讀兵書頗涉經史周世以軍功拜儀同三司武帝將有事東夏聞其勇決自扶風郡守除九曲鎮將進位上開府封建威縣公齊人甚憚焉尋遷熊州刺史後從武帝拔晉州進位柱國除使持節晉絳二州諸軍事晉州刺史及帝還後齊後主親總六軍而圍之獨守孤城外無聲援衆皆震懼士彥慷慨自若賊盡鋭攻之樓堞皆盡城雉所存尋仞而已或短兵相接或交馬出入士彥謂將士曰死在今日吾為爾先於是勇烈齊奮呼聲動地無不一當百齊師少却乃令妻妾軍民子女晝夜修城三日而就帝率六軍亦至齊師解圍營於城東十餘里士彥見帝持帝鬚而泣曰臣幾不見陛下帝亦為之流涕時帝以將士疲倦意欲班師士彥叩馬諫曰今齊師遁衆心皆動因其懼也而攻之其勢必舉帝從之大軍遂進帝執其手曰余之有晉州為平齊之基若不固守則事不諧矣朕無前慮惟恐後變善為我守之及齊平封郕國公進位上柱國雍州主簿宣帝即位除東南道行臺使持節徐州總管三十二州諸軍事徐州刺史與烏丸軌擒陳將吳明徹裴忌於呂梁別破黃陵略定淮南地高祖作相轉亳州總管二十四州諸軍事尉迥之反也以為行軍總管從韋孝寬擊之至河陽與迥軍相對令家僮梁默等數人為前鋒士彥以其徒繼之所當皆破乘勝至草橋迥衆復合進戰大破之及圍鄴城攻北門而入馳啓西門納宇文欣之兵及迥平除相州刺史高祖忌之未幾徵還京師間居無事自恃元功甚懷怨望遂與宇文欣劉昉等謀作亂將率僮僕於享廟之際因車駕出圖以發機復欲於蒲州起事略取河北捉黎陽關塞河陽路劫調布以為牟甲募盜賊以為戰士其甥裴通豫知其謀而奏之高祖未發其事授晉州刺史欲觀其意士彥欣然謂昉等曰天也又請儀同薛摩兒為長史高祖從之後與公卿朝謁高祖令左右執士彥欣昉等於行間詰之曰爾等欲反何敢發此意初猶不伏捕薛摩兒適至於是庭對之摩兒具論始末云第二子剛垂泣苦諫第三子叔諧曰作猛獸要須成斑士彥失色顧謂摩兒曰汝殺我於是伏誅時年七十二有子五人操字孟德出繼伯父官至上開府義鄉縣公長寧王府驃騎早卒剛字永固弱冠授儀同以平尉迥勳加開府擊突厥有功進位上大將軍通政縣公涇州刺史士彥之誅也以諫獲免徙瓜州叔諧官至上儀同廣平縣公車騎將軍志遠為安定伯務為建威伯皆坐士彥誅梁默者士彥之蒼頭驍武絶人士彥每從征伐常與默陷陳仕周致位開府開皇末以行軍總管從楊素北征突厥進位大將軍漢王諒之反也復以行軍總管從楊素討平之加授柱國大業五年從煬帝征吐谷渾遇賊力戰而死贈光祿大夫宇文欣宇文欣字仲樂本朔方人徙京兆祖莫豆于周安平公父貴周大司馬許國公欣幼而敏慧為兒童時與羣輩遊戲輒為部伍進止行列無不用命有識者見而異之年十二能左右馳射驍捷若飛謂所親曰自古名將唯以韓白衛霍為美談吾察其行事未足多尚若使與僕並時不令豎子獨擅高名也其少小慷慨如此年十八從周齊王憲討突厥有功拜儀同三司賜爵興固縣公韋孝寬之鎮玉壁也以欣驍勇請與同行屢有戰功加位開府驃騎將軍進爵化政郡公邑二千戶從武帝伐齊攻拔晉州齊後主親馭六軍兵勢甚盛帝憚之欲旋師欣諫曰以陛下之聖武乘敵人之荒縱何往不克若使齊人更得令主君臣協力雖湯武之勢未易平也今主暗臣愚兵無鬬志雖有百萬之衆實為陛下奉耳帝從之戰遂大克及帝攻陷並州先勝後敗帝為賊所窘左右皆殲帝挺身而遁諸將多勸帝還欣勃然而進曰自陛下克晉州破高緯乘勝逐北以至於此致令僞主奔波關東響振自古行兵用師未有若斯之盛也昨日破城將士輕敵微有不利何足為懷丈夫當死中求生敗中取勝今者破竹其勢已成奈何棄之而去帝納其言明日復戰遂拔晉陽及齊平進位大將軍賜物千段尋與烏丸軌破陳將吳明徹於呂梁進位柱國賜奴婢二百口除豫州總管高祖龍潛時與欣情好甚協及為丞相恩顧彌隆尉迥作亂以欣為行軍總管從韋孝寬擊之時兵屯河陽諸軍莫敢先進帝令高熲馳驛監軍與熲密謀進取者唯欣而已迥遣子惇盛兵武陟欣先鋒擊走之進臨相州迥遣精甲三千伏於野馬岡欲邀官軍欣以五百騎襲之斬獲略盡進至草橋迥又拒守欣率奇兵擊破之直趨鄴下迥背城結陳與官軍大戰官軍不利時鄴城士女觀戰者數萬人欣與高熲李詢等謀曰事急矣當以權道破之於是擊所觀者大囂而走轉相騰藉聲如雷霆欣乃傳呼曰賊敗矣衆軍復振齊力急擊之迥軍大敗及平鄴城以功加上柱國賜奴婢二百口牛馬羊萬計高祖顧謂欣曰尉迥傾山東之衆運百萬之師公舉無遺策戰無全陳誠天下之英傑也進封英國公增邑三千戶自是以後每參帷幄出入臥內禪代之際欣有力焉後拜右領軍大將軍恩顧彌重欣妙解兵法馭戎齊整當時六軍有一善事雖非欣所建在下輒相謂曰此必英公法也其見推服如此後改封嵵國公上嘗欲令欣率兵擊突厥高熲言於上曰欣有異志不可委以大兵乃止欣既佐命功臣頻經將領有威名於當世上由是微忌焉以譴去官欣與梁士彥昵狎數相往來士彥時亦怨望陰圖不軌欣謂士彥曰帝王豈有常乎相扶即是公於蒲州起事我必從征兩陳相當然後連結天下可圖也謀泄伏誅年六十四家口籍沒欣兄善弘厚有武藝仕周官至上柱國許國公高祖受禪遇之甚厚拜其子穎為上儀同及欣誅並廢于家善未幾卒穎至大業中為司農少卿及李密逼東都叛歸于密欣弟愷別有傳王誼王誼字宜君河南洛陽人也父顯周鳳州刺史誼少慷慨有大志便弓馬博覽羣言周閔帝時為左中侍上士時大冢宰宇文護執政勢傾王室帝拱默無所關預有朝士於帝側微為不恭誼勃然而進將擊之其人惶懼請罪乃止自是朝士無敢不肅歲餘遷御正大夫丁父艱毀瘁過禮廬於墓側負土成墳歲餘起拜雍州別駕固讓不許武帝即位授儀同纍遷內史大夫封楊國公從帝伐齊至並州帝既入城反為齊人所敗左右多死誼率麾下驍雄赴之帝賴以全濟時帝以六軍挫衄將班師誼固諫帝從之及齊平授相州刺史未幾復徵為大內史汾州稽胡為亂誼率兵擊之帝弟越王盛譙王儉雖為總管並受誼節度其見重如此及平賊而還賜物五千段封一子開國公帝臨崩謂皇太子曰王誼社稷臣宜處以機密不須遠任也皇太子即位是為宣帝憚誼剛正出為襄州總管及高祖為丞相轉為鄭州總管司馬消難舉兵反高祖以誼為行軍元帥率四總管討之軍次近郊消難懼而奔陳于時北至商洛南拒江淮東西二千餘里巴蠻多叛共推渠帥蘭雒州為主雒州自號河南王以附消難北連尉迥誼率行軍總管李威馮暉李遠等分討之旬月皆平高祖以誼前代舊臣甚加禮敬遣使勞問冠蓋不絶以第五女妻其子奉孝尋拜大司徒誼自以與高祖有舊亦歸心焉及上受禪顧遇彌厚上親幸其第與之極歡太常卿蘇威立議以為戶口滋多民田不贍欲減功臣之地以給民誼奏曰百官者歷世勳賢方蒙爵土一旦削之未見其可如臣所慮正恐朝臣功德不建何患人田有不足上然之竟寢威議開皇初上將幸岐州誼諫曰陛下初臨萬國人情未洽何用此行上戲之曰吾昔與公位望齊等一朝屈節為臣或當恥愧是行也震揚威武欲以服公心耳誼笑而退尋奉使突厥上嘉其稱旨進封郢國公未幾其子奉孝卒踰年誼上表言公主少請除服御史大夫楊素劾誼曰臣聞喪服有五親疏異節喪制有四降殺殊文王者之所常行故曰不易之道也是以賢者不得踰不肖者不得不及而儀同王奉孝既尚蘭陵公主奉孝以去年五月身喪始經一周而誼便請除釋竊以雖曰王姬終成下嫁之禮公則主之猶在移天之義況復三年之喪自上達下及朞釋服在禮未詳然夫婦則人倫攸始喪紀則人道至大苟不重之取笑君子故鑽燧改火責以居喪之速朝祥暮歌譏以忘哀之早然誼雖不自強爵位已重欲為無禮其可得乎乃薄俗傷教為父則不慈輕禮易喪致婦於無義若縱而不正恐傷風俗請付法推科有詔勿治然恩禮稍薄誼頗怨望或告誼謀反上令案其事主者奏誼有不遜之言實無反狀上賜酒而釋之于時上柱國元諧亦頗失意誼數與相往來言論醜惡胡僧告之公卿奏誼大逆不道罪當死上見誼愴然曰朕與公舊為同學甚相憐愍將奈國法何於是下詔曰誼有周之世早豫人倫朕共遊庠序遂相親好然性懷險薄巫覡盈門鬼言怪語稱神道聖朕受命之初深存誡約口云改悔心實不悛乃說四天王神道誼應受命書有誼讖天有誼星桃鹿二川岐州之下歲在辰巳興帝王之業密令卜問伺殿省之災又說其身是明王信用左道所在詿誤自言相表當王不疑此而赦之將或為亂禁暴除惡宜伏國刑上復令大理正趙綽謂誼曰時命如此將若之何於是賜死於家時年四十六元諧元諧河南洛陽人也家代貴盛諧性豪俠有氣調少與高祖同受業於國子甚相友愛後以軍功纍遷大將軍及高祖為丞相引致左右諧白高祖曰公無黨援譬如水間一堵牆大危矣公其勉之尉迥作亂遣兵寇小鄉令諧擊破之及高祖受禪上顧諧笑曰水間牆竟何如也於是賜宴極歡進位上大將軍封樂安郡公邑千戶奉詔參修律令時吐谷渾寇涼州詔諧為行軍元帥率行軍總管賀婁子幹郭竣元浩等步騎數萬擊之上勑諧曰公受朝寄總兵西下本欲自寧疆境保全黎庶非是貪無用之地害荒服之民王者之師意在仁義渾賊若至界首者公宜曉示以德臨之以教誰敢不服也時賊將定城王鍾利房率騎三千渡河連結党項諧率兵出鄯州趣青海邀其歸路吐谷渾引兵拒諧相遇於豐利山賊鐵騎二萬與諧大戰諧擊走之賊駐兵青海遣其太子可博汗以徑騎五萬來掩官軍諧逆擊敗之追奔三十餘里俘斬萬計虜大震駭於是移書諭以禍福其名王十七人公侯十三人各率其所部來降上大悅下詔曰褒善疇庸有聞前載諧識用明達神情警悟文規武略譽流朝野申威拓土功成疆埸深謀大節實簡朕心加禮延代宜隆賞典可柱國別封一子縣公諧拜寧州刺史頗有威惠然剛愎好排詆不能取媚於左右嘗言於上曰臣一心事主不曲取人意上曰宜終此言後以公事免時上柱國王誼有功於國與諧俱無任用每相往來胡僧告諧誼謀反上按其事無逆狀上慰諭而釋之未幾誼伏誅諧漸被疏忌然以龍潛之舊每預朝請恩禮無虧及上大宴百僚諧進曰陛下威德遠被臣請突厥可汗為候正陳叔寶為令史上曰朕平陳國以伐罪弔人非欲誇誕取威天下公之所奏殊非朕心突厥不知山川何能警候叔寶昏醉寧堪驅使諧默然而退後數歲有人告諧與從父弟上開府滂臨澤侯田鸞上儀同祁緒等謀反上令案其事有司奏諧謀令祁緒勒党項兵即斷巴蜀時廣平王雄左僕射高熲二人用事諧欲譖去之云左執法星動已四年矣狀一奏高熲必死又言太白犯月光芒相照主殺大臣楊雄必當之諧嘗與滂同謁上諧私謂滂曰我是主人殿上者賊也因令滂望氣滂曰彼雲似蹲狗走鹿不如我輩有福德雲上大怒諧滂鸞緒並伏誅籍沒其家王世積王世積闡熙新人也父雅周使持節開府儀同三司世積容貌魁岸腰帶十圍風神爽拔有傑人之表在周有軍功拜上儀同封長子縣公高祖為丞相尉迥作亂從韋孝寬擊之每戰有功拜上大將軍高祖受禪進封宜陽郡公高熲美其才能甚善之嘗密謂熲曰吾輩俱周之臣子社稷淪滅其若之何熲深拒其言未幾授蘄州總管平陳之役以舟師自蘄水趣九江與陳將紀瑱戰於蘄口大破之既而晉王廣已平丹陽世積於是移書告諭遣千金公權始璋略取新蔡陳江州司馬黃偲棄城而遁始璋入據其城世積繼至陳豫章太守徐璒廬陵太守蕭廉潯陽太守陸仲容巴山太守王誦太原太守馬齊昌太守黃正始安成太守任瓘等及鄱陽臨川守將並詣世積降以功進位柱國荊州總管賜絹五千段加之寶帶邑三千戶後數歲桂州人李光仕作亂世積以行軍總管討平之上遣都官員外郎辛凱卿馳勞之及還進位上柱國賜物二千段上甚重之世積見上性忌刻功臣多獲罪由是縱酒不與執政言及時事上以為有酒疾舍之宮內令醫者療之世積詭稱疾愈始得就第及起遼東之役世積與漢王並為行軍元帥至柳城遇疾疫而還拜涼州總管令騎士七百人送之官未幾其親信安定皇甫孝諧有罪吏捕之亡抵世積世積不納由是有憾孝諧竟配防桂州事總管令狐熙熙又不之禮甚因窮因徼幸上變稱世積嘗令道人相其貴不道人答曰公當為國主謂其妻曰夫人當為皇后又將之涼州其所親謂世積曰河西天下精兵處可以圖大事也世積曰涼州土曠人稀非用武之國由是被徵入朝按其事有司奏左衛大將軍元旻右衛大將軍元胄左僕射高熲並與世積交通受其名馬之贈世積竟坐誅旻胄等免官拜孝諧為上大將軍虞慶則虞慶則京兆櫟陽人也本姓魚其先仕於赫連氏遂家靈武代為北邊豪傑父祥周靈武太守慶則幼雄毅性倜儻身長八尺有膽氣善鮮卑語身被重鎧帶兩鞬左右馳射本州豪俠皆敬憚之初以弋獵為事中便折節讀書常慕傅介子班仲升為人仕周釋褐中外府行參軍稍遷外兵參軍事襲爵沁源縣公宣政元年授儀同大將軍除並州總管長史二年授開府時稽胡數為反叛越王盛內史下大夫高熲討平之將班師熲與盛謀須文武幹略者鎮遏之表請慶則於是即拜石州總管甚有威惠境內清肅稽胡慕義而歸者八千餘戶開皇元年進位大將軍遷內史監吏部尚書京兆尹封彭城郡公營新都總監二年冬突厥入寇慶則為元帥討之部分失所士卒多寒凍墮指者千餘人偏將達奚長儒率騎兵二千人別道邀賊為虜所圍甚急慶則案營不救由是長儒孤軍獨戰死者十八九上不之責也尋遷尚書右僕射後突厥主攝圖將內附請一重臣充使於是上遣慶則詣突厥所攝圖恃強初欲亢禮慶則責以往事攝圖不服其介長孫晟又說諭之攝圖及弟葉護皆拜受詔因即稱臣朝貢請永為藩附初慶則出使高祖勑之曰我欲存立突厥彼送公馬但取五三匹攝圖見慶則贈馬千匹又以女妻之上以慶則勳高皆無所問授上柱國封魯國公食任城縣千戶詔以彭城公回授第二子義高祖平陳之後幸晉王第置酒會羣臣高熲等奉觴上壽上因曰高熲平江南虞慶則降突厥可謂茂功矣楊素曰皆由至尊威德所被慶則曰楊素前出兵武牢硤石若非至尊威德亦無克理遂與互相長短御史欲彈之上曰今日計功為樂宜不須劾上觀羣臣宴射慶則進曰臣蒙賚酒食令盡樂御史在側恐醉而被彈上賜御史酒因遣之出慶則奉觴上壽極歡上謂諸公曰飲此酒願我與諸公等子孫常如今日世守富貴九年轉為右衛大將軍尋改為右武候大將軍開皇十七年嶺南人李賢據州反高祖議欲討之諸將二三請行皆不許高祖顧謂慶則曰位居宰相爵乃上公國家有賊遂無行意何也慶則拜謝恐懼上乃遣焉為桂州道行軍總管以婦弟趙什柱為隨府長史什柱先與慶則愛妾通恐事彰乃宣言曰慶則不欲此行遂聞於上先是朝臣出征上皆宴別禮賜遣之及慶則南討辭上上色不悅慶則由是怏怏不得志暨平賢至潭州臨桂鎮慶則觀眺山川形勢曰此誠嶮固加以足糧若守得其人攻不可拔遂使什柱馳詣京奏事觀上顏色什柱至京因告慶則謀反上案驗之慶則於是伏誅拜什柱為柱國慶則子孝仁幼豪俠任氣起家拜儀同領晉王親信坐父事除名煬帝嗣位以藩邸之舊授候衛長史兼領金谷監監禁苑有巧思頗稱旨九年伐遼授都水丞充使監運頗有功然性奢華以駱駝負函盛水養魚而自給十一年或告孝仁謀圖不軌遂誅之其弟澄道東宮通事舍人坐除名元胄元胄河南洛陽人也魏昭成帝之六代孫祖順魏濮陽王父雄武陵王胄少英果多武藝美鬚眉有不可犯之色周齊王憲見而壯之引致左右數從征伐官至大將軍高祖初被召入將受顧託先呼胄次命陶澄並委以腹心宿臥內及為丞相每典軍在禁中又引弟威俱入侍衛周趙王招知高祖將遷周鼎乃要高祖就第趙王引高祖入寢室左右不得從唯楊弘與胄兄弟坐於戶側趙王謂其二子員貫曰汝當進瓜我因刺殺之及酒酣趙王欲生變以佩刀子刺瓜連啖高祖將為不利胄進曰相府有事不可久留趙王訶之曰我與丞相言汝何為者叱之使却胄瞋目憤氣扣刀入衛趙王問其姓名胄以實對趙王曰汝非昔事齊王者乎誠壯士也因賜之酒曰吾豈有不善之意邪卿何猜警如是趙王僞吐將入後閣胄恐其為變扶令上坐如此者再三趙王稱喉乾命胄就取飲胄不動會滕王逌後至高祖降階迎之胄與高祖耳語曰事勢大異可速去高祖猶不悟謂曰彼無兵馬復何能為胄曰兵馬悉他家物一先下手大事便去胄不辭死死何益耶高祖復入坐胄聞屋後有被甲聲遽請曰相府事殷公何得如此因扶高祖下牀趣而去趙王將追之胄以身蔽戶王不得出高祖及門胄自後而至趙王恨不時發彈指出血及誅趙王賞賜不可勝計高祖受禪進位上柱國封武陵郡公邑三千戶拜左衛將軍尋遷右衛大將軍高祖從容曰保護朕躬成此基業元胄功也後數載出為豫州刺史歷亳淅二州刺史時突厥屢為邊患朝廷以胄素有威名拜靈州總管北夷甚憚焉後復徵為右衛大將軍親顧益密嘗正月十五日上與近臣登高時胄下直上令馳召之及胄見上謂曰公與外人登高未若就朕勝也賜宴極歡晉王廣每致禮焉房陵王之廢也胄豫其謀上正窮治東宮事左衛大將軍元旻苦諫楊素乃譖之上大怒執旻於仗胄時當下直不去因奏曰臣不下直者為防元旻耳復以此言激怒上上遂誅旻賜胄帛千匹蜀王秀之得罪胄坐與交通除名煬帝即位不得調時慈州刺史上官政坐事徙嶺南將軍丘和亦以罪廢胄與和有舊因數從之遊胄嘗酒酣謂和曰上官政壯士也今徙嶺表得無大事乎因自拊腹曰若是公者不徒然矣和明日奏之胄竟坐死於是徵政為驍衛將軍拜和代州刺史史臣曰昔韓信愆垓下之期則項王不滅英布無淮南之舉則漢道未隆以二子之勳庸咸憤怨而葅戮況乃無古人之殊績而懷悖逆之心者乎梁士彥宇文欣皆一時之壯士也遭雲雷之會並以勇略成名遂貪天之功以為己力報者倦矣施者未厭將生厲階求逞其欲及茲顛墜自取之也王誼元諧王世積虞慶則元胄或契闊艱厄或綢繆恩舊將安將樂漸見遺忘內懷怏怏矜伐不已雖時主之刻薄亦言語以速禍乎然高祖佐命元功鮮有終其天命配享清廟寂寞無聞斯蓋草創帝圖事出權道本異同心故久而逾薄其牽牛蹊田雖則有罪奪之非道能無怨乎皆深文巧詆致之刑辟高祖沉猜之心固已甚矣求其餘慶不亦難哉

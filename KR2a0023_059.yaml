body:
  text: 隋書卷五十九列傳第二十四煬三子煬帝三男蕭皇后生元德太子昭齊王暕蕭嬪生趙王杲元德太子昭煬帝長子也生而高祖命養宮中三歲時於玄武門弄石師子高祖與文獻后至其所高祖適患腰痛舉手憑后昭因避去如此者再三高祖歎曰天生長者誰復教乎由是大奇之高祖嘗謂曰當為爾娶婦昭應聲而泣高祖問其故對曰漢王未婚時在至尊所一朝娶婦便則出外懼將違離是以啼耳上歎其有至性特鍾愛焉年十二立為河南王仁壽初徙為晉王拜內史令兼左衞大將軍後三年轉雍州牧煬帝即位便幸洛陽宮昭留守京師大業元年帝遣使者立為皇太子昭有武力能引強弩性謙沖言色恂恂未嘗忿怒有深嫌可責者但云大不是所膳不許多品帷席極於儉素臣吏有老父母者必親問其安否歲時皆有惠賜其仁愛如此明年朝於洛陽後數月將還京師願得少留帝不許拜請無數體素肥因致勞疾帝令巫者視之云房陵王為祟未幾而薨詔內史侍郎虞世基為哀冊文曰維大業二年七月癸丑朔二十三日皇太子薨于行宮粵三年五月庚辰朔六日將遷座于莊陵禮也蜃綍宵載鶴關曉闢肅文物以具陳儼賓從其如昔皇帝悼離方之云晦嗟震宮之虧象顧守器以長懷臨登餕而興想先遠戒日占謀允從庭彝徹祖階戺收重抗銘旌以啟路動徐輪於振容揆行度名累德彰諡爰詔史冊式遵典志俾濬哲之徽猷播長久乎天地其辭曰宸基峻極帝緒會昌體元襲聖儀耀重光氣秀春陸神華少陽居周軼誦處漢韜莊有縱生知誕膺惟睿性道觿日幾深綺歲降迹大成俯情多藝樹親建國命懿作藩威蕤先路舄奕渠門庸服有紀分器惟尊風高楚殿雅盛梁園睿后膺儲天人協順本茂條遠基崇體峻改王參墟奄有唐晉在貴能謙居沖益慎封畿千里閶闔九重神州王化禁旅軍容瞻言偃草高視折衝帷扆清秘親賢允屬泛景鳳瀾飛華螭玉揮翰泉涌敷言藻縟式是便煩思謀啟沃洪惟積德豐衍繁祉粵自天孫光升元子綠車逮事翠纓奉祀肅穆滿容儀形讓齒禮樂交暢愛敬兼資優游養德恭己承儀南山聘隱東序尊師有粹神儀深穆其度顯顯觀德溫溫審諭烔戒齊箴留連王賦入監出撫日就月將沖情玉裕令問金相宜綏景福永作元良神理冥漠天道難究仁不必壽善或愆祐遽瑤山之頹壞忽桂宮之毀構痛結幽明悲纏宇宙慟皇情之深憫摧具僚其如疚鳴呼哀哉廻環氣朔荏苒居諸沾零露於瑤圃下申霜於玉除夜漏盡兮空階曙曉月懸兮帷殿虛鳴呼哀哉將寧甫竁長違望苑渡渭涘於造舟遵長平之修坂望鶴駕而不追顧龍樓而日遠嗚呼哀哉永隔存沒長分古今去榮華於人世即潛要之幽深霏夕煙而稍起慘落景而將沈聽哀挽之悽楚雜灌木之悲吟紛徒御而流袂欷纓弁以霑衿嗚呼哀哉九地黃泉千年白日雖金石之能久終天壤乎長畢敢圖芳於篆素永飛聲而騰實帝深追悼有子三人韋妃生恭皇帝大劉良娣生燕王倓小劉良娣生越王侗燕王倓字仁安敏慧美姿儀煬帝於諸孫中特所鍾愛常置左右性好讀書尤重儒素非造次所及有若成人良娣早終每至忌日未嘗不流涕嗚咽帝由是益以奇之宇文化及弒逆之際倓覺變欲入奏恐露其事因與梁公蕭鉅千牛宇文皛等穿芳林門側水竇而入至玄武門詭奏曰臣卒中惡命縣俄頃請得面辭死無所恨冀以見帝為司宮者所遏竟不得聞俄而難作為賊所害時年十六越王侗字仁謹美姿儀性寬厚大業二年立為越王帝每巡幸侗常留守東都楊玄感作亂之際與民部尚書樊子蓋拒之及玄感平朝於高陽拜高陽太守俄以本官復留守東都十三年帝幸江都復令侗與金紫光祿大夫段達太府卿元文都攝民部尚書韋津右武衞將軍皇甫無逸等總留臺事宇文化及之弒逆也文都等議以侗元德太子之子屬最為近於是乃共尊立大赦改元曰皇泰諡帝曰明廟號世祖追尊元德太子為孝成皇帝廟號世宗尊其母劉良娣為皇太后以段達為納言右翊衞大將軍攝禮部尚書王世充亦納言左翊衞大將軍攝吏部尚書元文都內史令左驍衞大將軍盧楚亦內史令皇甫無逸兵部尚書右武衞大將軍郭文懿內史侍郎趙長文黃門侍郎委以機務為金書鐵券藏之宮掖于時洛陽稱段達等為七貴未幾宇文化及立秦王子浩為天子來次彭城所經城邑多從逆黨侗懼遣使者蓋琮馬公政招懷李密密遂遣使請降侗大悅禮其使甚厚即拜密為太尉尚書令魏國公令拒化及下書曰我大隋之有天下於茲三十八載高祖文皇帝聖略神功載造區夏世祖明皇帝則天法地混一華戎東暨蟠木西通細柳前踰丹徼後越幽都日月之所臨風雨之所至圓首方足禀氣食芼莫不盡入提封皆為臣妾加以寶貺畢集靈瑞咸臻作樂制禮移風易俗智周寰海萬物咸受其賜道濟天下百姓用而不知世祖往因歷試統臨南服自居皇極順茲望幸所以往歲省方展禮肆覲停鑾駐蹕按駕清道八屯如昔七萃不移豈意釁起非常逮於軒陛災生不意延及冕旒奉諱之日五情崩隕攀號荼毒不能自勝且聞之自古代有屯剝賊臣逆子無世無之至如宇文化及世傳庸品其父述往屬時來早霑厚遇賜以婚媾置之公輔位尊九命祿重萬鍾禮極人臣榮冠世表徒承海嶽之恩未有涓塵之益化及以此下材夙蒙顧盼出入外內奉望階墀昔陪藩國統領禁衞及從升皇祚陪列九卿但本性兇狠恣其貪穢或交結惡黨或侵掠貨財事重刑篇狀盈獄簡在上不遺簪履恩加草芥應至死辜每蒙恕免三經除解尋復本職再徙邊裔仍即追還生成之恩昊天罔極奬擢之義人事罕聞化及梟獍為心禽獸不若縱毒興禍傾覆行宮諸王兄弟一時殘酷痛暴行路世不忍言有窮之在夏時犬戎之於周代釁辱之極亦未是過朕所以刻骨崩心飲膽嘗血瞻天視地無處容身今王公卿士庶僚百辟咸以大寶鴻名不可顛墜元兇巨猾須早夷殄翼戴朕躬嗣守寶位顧惟寡薄志不逮此今者出黼扆而杖旄鉞釋衰麻而擐甲冑銜寃誓眾忍淚治兵指日遄征以平大盜且化及偽立秦王之子幽遏比於囚拘其身自稱霸相專擅擬於九五履踐禁御據有宮闈昂首揚眉初無慚色衣冠朝望外懼兇威志士誠臣內皆憤怨以我義師順彼天道梟夷醜族匪夕伊朝太尉尚書令魏公丹誠內發宏略外舉率勤王之師討違天之逆果毅爭先熊羆競逐金鼓振讋若火焚毛鋒刃縱橫如湯沃雪魏公志在匡濟投袂前驅朕親御六軍星言繼進以此衆戰以斯順舉擘山可以動射石可以入況擁此人徒皆有離德京都侍衞西憶鄉家江左淳民南思邦邑比來表書駱驛人信相尋若王師一臨舊章暫覩自應解甲倒戈冰銷葉散且聞化及自恣天奪其心殺戮不辜挫辱人士莫不道路仄目號天跼地朕今復讎雪恥梟轘者一人拯溺救焚所哀者士庶唯天鑒孔殷祐我宗社億兆感義俱會朕心梟戮元兇策勳飲至四海交泰稱朕意焉兵術軍機並受魏公節度密見使者大悅北面拜伏臣禮甚恭密遂東拒化及七貴頗不協陰有相圖之計未幾元文都盧楚郭文懿趙長文等為世充所殺皇甫無逸遁歸長安世充詣侗所陳謝辭情哀苦侗以為至誠命之上殿被髮為盟誓無貳志自是侗無所關預侗心不能平遂與記室陸士季謀圖世充事不果而止及世充破李密衆望益歸之遂自為鄭王總百揆加九錫備法物侗不能禁也段達雲定興等十人入見於侗曰天命不常鄭王功德甚盛願陛下揖讓告禪遵唐虞之迹侗聞之怒曰天下者高祖之天下東都者世祖之東都若隋德未衰此言不可發必天命有改亦何論於禪讓公等或先朝舊臣績宣上代或勤王立節身服軒冕忽有斯言朕復當何所望神色懍然侍衞者莫不流汗既而退朝對良娣而泣世充更使人謂侗曰今海內未定須得長君待四方乂安復子明辟必若前盟義不違負侗不得已遜位於世充遂被幽於含涼殿世充僭偽號封為潞國公邑五千戶月餘宇文儒童裴仁基等謀誅世充復尊立侗事泄並見害世充兄世惲因勸世充害侗以絕民望世充遣其姪行本齎鴆詣侗所曰願皇帝飲此酒侗知不免請與母相見不許遂布席焚香禮佛呪曰從今以去願不生帝王尊貴之家於是仰藥不能時絕更以帛縊之世充偽諡為恭皇帝齊王暕字世朏小字阿孩美容儀疎眉目少為高祖所愛開皇中立為豫章王邑千戶及長頗涉經史尤工騎射初為內史令仁壽中拜揚州總管沿淮以南諸軍事煬帝即位進封齊王增邑四千戶大業二年帝初入東都盛陳鹵簿暕為軍導尋轉豫州牧俄而元德太子薨朝野注望咸以暕當嗣帝又勑吏部尚書牛弘妙選官屬公卿由是多進子弟明年轉雍州牧尋徙河南尹開府儀同三司元德太子左右二萬餘人悉隸於暕寵遇益隆自樂平公主及諸戚屬競來致禮百官稱謁填咽道路暕頗驕恣昵近小人所行多不法遣喬令則劉虔安裴該皇甫諶庫狄仲錡陳智偉等求聲色狗馬令則等因此放縱訪人家有女者輒矯暕命呼之載入暕宅因緣藏隱恣行淫穢而後遣之仲錡智偉二人詣隴西撾炙諸胡責其名馬得數匹以進於暕暕令還主仲錡等詐言王賜將歸於家暕不之知也又樂平公主嘗奏帝言柳氏女美者市未有所答久之主復以柳氏進於暕暕納之其後帝問主柳氏女所在主曰在齊王所帝不悅暕於東都營第大門無故而崩聽事𧸐中折識者以為不祥其後從帝幸榆林暕督後軍步騎五萬與帝相去數十里而舍會帝於汾陽宮大獵詔暕以千騎入圍暕大獲麋鹿以獻而帝未有得也乃怒從官皆言為暕左右所遏獸不得前帝於是發怒求暕罪失時制縣令無故不得出境有伊闕令皇甫詡幸於暕違禁將之汾陽宮又京兆人達奚通有妾王氏善歌貴遊宴聚多或要致於是展轉亦出入王家御史韋德裕希旨劾暕帝令甲士千餘大索暕第因窮治其事暕妃韋氏者民部尚書沖之女也早卒暕遂與妃姊元氏婦通遂產一女外人皆不得知陰引喬令則於第內酣宴令則稱慶脫暕帽以為歡樂召相工令徧視後庭相工指妃姊曰此產子者當為皇后王貴不可言時國無儲副暕自謂次當得立又以元德太子有三子內常不安陰挾左道為厭勝之事至是事皆發帝大怒斬令則等數人妃姊賜死暕府僚皆斥之邊遠時趙王杲猶在孩孺帝謂侍臣曰朕唯有暕一子不然者當肆諸市朝以明國憲也暕自是恩寵日衰雖為京尹不復關預時政帝令武賁郎將一人監其府事暕有微失武賁輒奏之帝亦常慮暕生變所給左右皆以老弱備員而已暕每懷危懼心不自安又帝在江都宮元會暕具法服將朝無故有血從裳中而下又坐齋中見羣鼠數十至前而死視皆無頭暕意甚惡之俄而化及作亂兵將犯蹕帝聞顧謂蕭后曰得非阿孩邪其見疎忌如此化及復令人捕暕暕時尚臥未起賊既進暕驚曰是何人莫有報者暕猶謂帝令捕之因曰詔使且緩兒不負國家賊於是曳至街而斬之及其二子亦遇害暕竟不知殺者為誰時年三十四有遺腹子政道與蕭后同入突厥處羅可汗號為隋王中國人沒入北蕃者悉配之以為部落以定襄城處之及突厥滅歸于大唐授員外散騎侍郎趙王杲小字季子年七歲以大業九年封趙王尋授光祿大夫拜河南尹從幸淮南詔行江都太守事杲聰令美容儀帝有所製詞賦杲多能誦之性至孝常見帝風動不進膳杲亦終日不食又蕭后當灸杲先請試炷后不許之杲泣請曰后所服藥皆蒙嘗之今灸願聽嘗炷悲咽不已后竟為其停灸由是尤愛之後遇化及反杲在帝側號慟不已裴虔通使賊斬之於帝前血湔御服時年十二史臣曰元德太子雅性謹重有君人之量降年不永哀哉齊王敏慧可稱志不及遠頗懷驕僭故煬帝疎而忌之心無父子之親貌展君臣之敬身非積善國有餘殃至令趙及燕越皆不得其死悲夫

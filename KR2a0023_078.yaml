body:
  text: 隋書卷七十八列傳第四十三藝術夫陰陽所以正時日順氣序者也卜筮所以決嫌疑定猶豫者也醫巫所以禦妖邪養性命者也音律所以和人神節哀樂者也相術所以辨貴賤明分理者也技巧所以利器用濟艱難者也此皆聖人無心因民設教救恤災患禁止淫邪自三五哲王其所由來久矣然昔之言陰陽者則有箕子裨竈梓慎子韋曉音律者則師曠師摯伯牙杜夔卜筮則史扁史蘇嚴君平司馬季主論相術則內史叔服姑布子卿唐舉許負語醫則文摯扁鵲季咸華他其巧思則奚仲墨翟張平子馬德衡凡此諸君者仰觀俯察探賾索隱咸詣幽微思侔造化通靈入妙殊才絶技或弘道以濟時或隱身以利物深不可測固無得而稱焉近古涉乎斯術者鮮有存夫貞一多肆其淫僻厚誣天道或變亂陰陽曲成君欲或假託神怪熒惑民心遂令時俗妖訛不獲返其真性身罹災毒莫得壽終而死藝成而下意在茲乎歷觀經史百家之言無不存夫藝術或其玄妙或記其迂誕非徒用廣異聞將以明乎勸戒是以後來作者或相祖述故今亦採其尤著者列為藝術篇云庾季才子質庾季才字叔奕新野人也八世祖滔隋晉元帝過江官至散騎常侍封遂昌侯因家于南郡江陵縣祖詵梁處士與宗人易齊名父曼倩光祿卿季才幼穎悟八歲誦尚書十二通周易好占玄象居喪以孝聞梁廬陵王績辟荊州主簿湘東王繹重其術藝引授外兵參軍西臺建纍遷中書郎領太史封宜昌縣伯季才固辭太史元帝曰漢司馬遷歷世尸掌魏高堂隆猶領此職不無前例卿何憚焉帝亦頗明星曆因共仰觀從容謂季才曰朕猶慮禍起蕭牆何方可息季才曰頃天象告變秦將入郢陛下宜留重臣作鎮荊陝整旆還都以避其患假令羯寇侵蹙止失荊湘在於社稷可得無慮必久停留恐非天意也帝初然之後與吏部尚書宗懍等議乃止俄而江陵陷滅竟如其言周太祖一見季才深加優禮令參掌太史每有征討預侍從賜宅一區水田十頃並奴婢牛羊什物等謂季才曰卿是南人未安北土故有此賜者欲絶卿南望之心宜盡誠事我當以富貴相答初郢都之陷也衣冠士人多沒為賤季才散所賜物購求親故文帝問何能若此季才曰僕聞魏克襄陽先昭異度晉平建業喜得士衡伐國求賢古之道也今郢都覆敗君信有罪搢紳何咎皆為賤隸鄙人羈旅不敢獻言誠切哀之故贖購耳太祖乃悟曰吾之過也微君遂失天下之望因出令免梁俘為奴婢者數千口武成二年與王褒庾信同補麟趾學士纍遷稍伯大夫車騎大將軍儀同三司其後大冢宰宇文護執政謂季才曰比日天道有何徵祥季才對曰荷恩深厚若不盡言便同木石頃上台有變不利宰輔公宜歸政天子請老私門此則自享期頤而受旦奭之美子孫藩屏終保維城之固不然者非復所知護沈吟久之謂季才曰吾本意如此但辭未獲免耳公既王官可依朝例無煩別參寡人也自是漸疏不復別見及護滅之後閲其書記武帝親自臨檢有假託符命妄造異端者皆致誅戮唯得季才書兩紙盛言緯候災祥宜反政歸權帝謂少宗伯斛斯徵曰庾季才至誠謹甚得人臣之禮因賜粟三百石帛二百段遷太史中大夫詔撰靈臺祕苑加上儀同封臨潁伯邑六百戶宣帝嗣位加驃騎大將軍開府儀同三司增邑三百戶及高祖為丞相嘗夜召季才而問曰吾以庸虛受茲顧命天時人事卿以為何如季才曰天道精微難可意察切以人事卜之符兆已定季才縱言不可公豈復得為箕潁之事乎高祖默然久之因舉首曰吾今譬猶騎獸誠不得下矣因賜雜綵五十匹絹二百段曰愧公此意宜善為思之大定元年正月季才言曰今月戊戌平旦青氣如樓闕見於國城之上俄而變紫逆風西行氣經云天不能無雲而雨皇王不能無氣而立今王氣已見須即應之二月日出卯入酉居天之正位謂之二八之門日者人君之象人君正位宜用二月其月十三日甲子甲為六甲之始子為十二辰之初甲數九子數又九九為天數其日即是驚蟄陽氣壯發之時昔周武王以二月甲子定天下享年八百漢高帝以二月甲午即帝位享年四百故知甲子甲午為得天數今二月甲子宜應天受命上從之開皇元年授通直散騎常侍高祖將遷都夜與高熲蘇威二人定議季才旦而奏曰臣仰觀玄象俯察圖記龜兆允襲必有遷都且堯都平陽舜都冀土是知帝王居止世代不同且漢營此城經今將八百歲水皆鹹鹵不甚宜人願陛下協天人之心為遷徙之計高祖愕然謂熲等曰是何神也遂發詔施行賜絹三百段馬兩匹進爵為公謂季才曰朕自今已後信有天道矣於是令季才與其子質撰垂象地形等志上謂季才曰天地祕奧推測多途執見不同或致差舛朕不欲外人干預此事故使公父子共為之也及書成奏之賜米千石絹六百段九年出為均州刺史策書始降將就藩時議以季才術藝精通有詔還委舊任季才以年老頻表去職每降優旨不許會張胄玄曆行及袁充言日影長上以問季才季才因言充謬上大怒由是免職給半祿歸第所有祥異常使人就家訪焉仁壽三年卒時年八十八季才局量寬弘術業優博篤於信義志好賓遊常吉日良辰與琅琊王褒彭城劉瑴河東裴政及宗人信等為文酒之會次有劉臻明克讓柳之徒雖為後進亦申遊發撰靈臺祕苑一百二十卷垂象志一百四十二卷地形志八十七卷並行於世庾質字行修少而明敏早有志尚八歲誦梁世祖玄覽言志等十賦拜童子郎仕周齊煬王記室開皇元年除奉朝請歷鄢陵令遷隴州司馬大業初授太史令操履貞立言忠鯁每有災異必指事面陳而煬帝性多忌刻齊王暕亦被猜嫌質子儉時為齊王屬帝謂質曰汝不能一心事我乃使兒事齊王何向背如此邪質曰臣事陛下子事齊王實是一心不敢有二帝怒不解由是出為合水令八年帝親伐遼東徵詣行在所至臨渝謁見帝謂質曰朕承先旨親事高麗度其土地人民才當我一郡卿以為剋不質對曰以臣管窺伐之可剋切有愚見不願陛下親行帝作色曰朕今總兵至此豈可未見賊而自退也質又曰陛下若行慮損軍威臣猶願安駕住此命驍將勇士指授規模倍道兼行出其不意事宜在速緩必無功帝不悅曰汝既難行可住此也及師還授太史令九年復征高麗又問質曰今段復何如對曰臣實愚迷猶執前見陛下若親動萬乘糜費實多帝怒曰我自行尚不能剋直遣人去豈有成功也帝遂行既而禮部尚書楊玄感據黎陽反兵部侍郎斛斯政奔高麗帝大懼遽而西還謂質曰卿前不許我行當為此耳今者玄感其成事乎質曰玄感地勢雖隆德望非素因百姓之勞苦冀僥幸而成功今天下一家未易可動帝曰熒惑入斗如何對曰斗楚之分玄感之所封也今火色衰謝終必無成十年帝自西京將往東都質諫曰比歲伐遼民實勞敝陛下宜鎮撫關內使百姓畢力歸農三五年間令四海少得豐實然後巡省於事為宜陛下思之帝不悅質辭疾不從帝聞之怒遣使馳傳鎖質詣行在所至東都詔令下獄竟死獄中子儉亦傳父業兼有學識仕歷襄武令元德太子學士齊王屬義寧初為太史令時有盧太翼耿詢並以星曆知名盧太翼盧太翼字協昭河間人也本姓章仇氏七歲詣學日誦數千言州里號曰神童及長間居味道不求榮利博綜羣書爰及佛道皆得其精微尤善占候算曆之術隱於白鹿山數年徙居林慮山茱萸酶請業者自遠而至初無所拒後憚其煩逃於五臺山地多藥物與弟子數人廬於巖下蕭然絶世以為神仙可致皇太子勇聞而召之太翼知太子必不為嗣謂所親曰吾拘逼而來不知所稅駕也及太子廢坐法當死高祖惜其才而不害配為官奴久之乃釋其後目盲以手摸書而知其字仁壽末高祖將避暑仁壽宮太翼固諫不納至于再三太翼曰臣愚豈敢飾詞但恐是行鑾輿不反高祖大怒繫之長安獄期還而斬之高祖至宮寢疾臨崩謂皇太子曰章仇翼非常人也前後言事未嘗不中吾來日道當不反今果至此爾宜釋之及煬帝即位漢王諒反帝以問之答曰上稽玄象下參人事何所能為未幾諒果敗帝常從容言及天下氏族謂太翼曰卿姓章仇四嶽之胄與盧同源於是賜姓為盧氏大業九年從駕至遼東太翼言於帝曰黎陽有兵氣後數日而玄感反書聞帝甚異之數加賞賜太翼所言天文之事不可稱數關諸祕密世莫得聞後數載卒於洛陽耿詢耿詢字敦信丹陽人也滑稽辨給伎巧絶人陳後主之世以客從東衡州刺史王勇於嶺南勇卒詢不歸遂與諸越相結皆得其歡心會郡俚反叛推詢為主柱國王世積討擒之罪當誅自言有巧思世積釋之以為家奴久之見其故人高智寶以玄象直太史詢從之受天文算術詢創意造渾天儀不假人力以水轉之施於暗室中使智寶外候天時合如符契世積知而奏之高祖配詢為官奴給使太史局後賜蜀王秀從往益州秀甚信之及秀廢復當誅何稠言於高祖曰耿詢之巧思若有神臣誠為朝廷惜之上於是特原其罪詢作馬上刻漏世稱其妙煬帝即位進欹器帝善之放為良民歲餘授右尚方署監事七年車駕東征詢上書曰遼東不可討師必無功帝大怒命左右斬之何稠苦諫得免及平壤之敗帝以詢言為中以詢守太史丞宇文化及弒逆之後從至黎陽謂其妻曰近觀人事遠察天文宇文必敗李氏當王吾知所歸矣詢欲去之為化及所殺著鳥情占一卷行於世韋鼎韋鼎字超盛京兆杜陵人也高祖玄隱於商山因而歸宋祖睿梁開府儀同三司父正黃門侍郎鼎少通侻博涉經史明陰陽逆剌尤善相術仕梁起家湘東王法曹參軍遭父憂水漿不入口者五日哀毀過禮殆將滅性服闋為邵陵王主簿侯景之亂鼎兄昂卒於京城鼎負尸出寄于中興寺求棺無所得鼎哀憤慟哭忽見江中有物流至鼎所鼎切異之往見乃新棺也因以充殮元帝聞之以為精誠所感侯景平司徒王僧辨以為戶曹屬歷太尉掾大司馬從事中書侍郎陳武帝在南徐州鼎望氣知其當王遂寄孥焉因謂陳武帝曰明年有大臣誅死後四歲梁其代終天之曆數當歸舜後昔周滅殷氏封媯滿于宛丘其裔子孫因為陳氏僕觀明公天縱神武繼絶統者無乃是乎武帝陰有圖僧辨意聞其言大喜因而定策及受禪拜黃門侍郎俄遷司農卿司徒右長史貞威將軍領安右晉安王長史行府國事轉廷尉卿太建中為聘周主使加散騎常侍尋為祕書監宣遠將軍轉臨海王長史行吳興郡事入為太府卿至德初鼎盡質貨田宅寓居僧寺友人大匠卿毛彪問其故答曰江東王氣盡於此矣吾與爾當葬長安期運將及故破産耳初鼎之聘周也嘗與高祖相遇鼎謂高祖曰觀公容貌故非常人而神監深遠亦非羣賢所逮也不久必大貴貴則天下一家歲一周天老夫當委質公相不可言願深自愛及陳平上馳召之授上儀同三司待遇甚厚上每與公王宴賞鼎預焉高祖嘗從容謂之曰韋世康與公相去遠近鼎對曰臣宗族分派南北孤絶自生以來未嘗訪問帝曰公百世卿族何得爾也乃命官給酒肴遣世康與鼎還杜陵樂飲十餘日鼎乃考校昭穆自楚太傅孟以下二十餘世作韋氏譜七卷時蘭陵公主寡上為之求夫選親衛柳述及蕭瑒等以示於鼎鼎曰瑒當封侯而無貴妻之相述亦通顯而守位不終上曰位由我耳遂以主降述上又問鼎諸兒誰得嗣答曰至尊皇后所最愛者即當與之非臣敢預知也上笑曰不肯顯言乎開皇十二年除光州刺史以仁義教導務弘清靜州中有土豪外修邊幅而內行不軌常為劫盜鼎於都會時謂之曰卿是好人那忽作賊因條其徒黨謀議逗留其人驚懼即自首伏又有人客遊通主家之妾及其還去妾盜珍物於夜亡尋於草中為人所殺主家知客與妾通因告客殺之縣司鞫問具得姦狀因斷客死獄成上於鼎鼎覽之曰此客實姦而殺非也乃某寺僧月斗妾盜物令奴殺之贓在某處即放此客遣掩僧並獲贓物自是部內肅然不言咸稱其有神道無拾遺尋追入京以年老多病纍加優賜頃之卒年七十九來和來和字弘順京兆長安人也少好相術所言多驗大冢宰宇文護引之左右由是出入公卿之門初為夏官府下士纍遷少卜上士賜爵安定鄉男遷畿伯下大夫進封洹水縣男高祖微時來詣和相和待人去謂高祖曰公當王有四海及為丞相拜儀同既受禪進爵為子開皇末和上表自陳曰臣早奉龍顏自周代天和三年已來數蒙陛下顧問當時具言至尊膺圖受命光宅區宇此乃天授非由人事所及臣無勞效坐致五品二十餘年臣是何人敢不慚懼愚臣不任區區之至謹録陛下龍潛之時臣有所言一得書之祕府死無所恨昔陛下在周嘗與永富公竇榮定語臣曰我聞有行聲即識其人臣當時即言公眼如曙星無所不照當王有天下願忍誅殺建德四年五月周武帝在雲陽宮謂臣曰諸公皆汝所識隋公相祿何如臣報武帝曰隋公止是守節人可鎮一方若為將領陳無不破臣即於宮東南奏聞陛下謂臣此語不忘明年烏丸軌言於武帝曰隋公非人臣帝尋以問臣臣知帝有疑臣詭報曰是節臣更無異相于時王誼梁彥光等知臣此語大象二年五月至尊從永巷東門入臣在永巷門東北面立陛下問臣曰我無災障不臣奏陛下曰公骨法氣色相應天命已有付屬末幾遂總百揆上覽之大悅進位開府賜物五百段米三百石地十頃和同郡韓則嘗詣和相和謂之曰後四五當得大官人初不知所謂則至開皇十五年五月而終人問其故和曰十五年為三五加以五月為四五大官椁也和言多此類著相經四十卷道士張賓焦子順雁門人董子華此三人當高祖龍潛時並私謂高祖曰公當為天子善自愛及踐阼以賓為華州刺史子順為開府子華為上儀同蕭吉蕭吉字文休梁武帝兄長沙宣武王懿之孫也博學多通尤精陰陽算術江陵陷遂歸于周為儀同宣帝時吉以朝政日亂上書切諫帝不納及隋受禪進上儀同以本官太常考定古今陰陽書吉性孤峭不與公卿相沉浮又與楊素不協由是擯落於世鬱鬱不得志見上好徵祥之說欲乾沒自進遂矯其迹為悅媚焉開皇十四年上書曰今年歲在甲寅十一月朔旦以辛酉為冬至來年乙卯正月朔旦以庚申為元日冬至之日即在朔旦樂汁圖徵云天元十一月朔旦冬至聖王受享祚今聖主在位居天元之首而朔旦冬至此慶一也辛酉之日即是至尊本命辛德在丙此十一月建丙子酉德在寅正月建寅為本命與月德合而居元朔之首此慶二也庚申之日即是行年乙德在庚卯德在申來年乙卯是行年與歲合德而在元旦之朝此慶三也陰陽書云年命與歲月合德者必有福慶洪範傳云歲之朝月之朝日之朝主王者經書並謂三長應之者延年福吉況乃甲寅蔀首十一月陽之始朔旦冬至是聖王上元正月是正陽之月歲之首月之先朔旦是歲之元月之朝日之先嘉辰之會而本命為九元之先行年為三長之首並與歲月合德所以靈寶經云角音龍精其祚日強來歲年命納音俱角曆之與經如合符契又甲寅乙卯天地合也甲寅之年以辛酉冬至來年乙卯以甲子夏至冬至陽始郊天之日即是至尊本命此慶四也夏至陰始祀地之辰即是皇后本命此慶五也至尊德並乾之覆育皇后仁同地之載養所以二儀元氣並會本辰上覽之大悅賜物五百段房陵王時為太子言東宮多鬼鼠妖數見上令吉詣東宮禳邪氣於宣慈殿設神坐有回風從艮地鬼門來掃太子坐吉以桃湯葦火驅逐之風出宮門而止又謝土於未地設壇為四門置五帝坐于時至寒有蝦從西南來入人門升赤帝坐還從人門而出行數步忽然不見上大異之賞賜優洽又上言太子當不安位時上陰欲廢立得其言是之由此每被顧問及獻皇后崩上令吉卜擇葬所吉歷筮山原至一處云卜年二千卜世二百具圖而奏之上曰吉凶由人不在於地高緯父葬豈不卜乎國尋滅亡正如我家墓田若云不吉朕不當為天子若云不凶我弟不當戰沒然竟從吉言吉表曰去月十六日皇后山陵西北雞未鳴前有黑雲方圓五六百步從地屬天東南又有旌旗車馬帳幕布滿七八里並有人往來檢校部伍甚整日出乃滅同見者十餘人謹案葬書云氣王與姓相生大吉今黑氣當冬王與姓相生是大吉利子孫無疆之候也上大悅其後上將親臨發殯吉復奏上曰至尊本命辛酉今歲斗魁及天岡臨卯酉謹按陰陽書不得臨喪上不納退而告族人蕭平仲曰皇太子遣宇文左率深謝余云公前稱我當為太子竟有其驗終不忘也今卜山陵務令我早立我立之後當以富貴相報吾記之曰後四載太子御天下今山陵氣應上又臨喪兆益見矣且太子得政隋其亡乎當有真人出治之矣吾前紿云卜年二千者是三十字也卜世二百者取三十二運也吾言信矣汝其志之及煬帝嗣位拜太府少卿加位開府嘗行經華陰見楊素冢上有白氣屬天密言於帝帝問其故吉曰其候素家當有兵禍滅門之象改葬者庶可免乎帝後從容謂楊玄感曰公家宜早改葬玄感亦微知其故以為吉祥託以遼東未滅不遑私門之事未幾而玄感以反族滅帝彌信之後歲餘卒官著金海三十卷相經要録一卷宅經八卷葬經六卷樂譜二十卷及帝王養生方二卷相手版要決一卷太一立成一卷並行於世時有楊伯醜臨孝恭劉祐俱以陰陽術數知名楊伯醜楊伯醜馮翊武鄉人也好讀易隱於華山開皇初被徵入朝見公卿不為禮無貴賤皆汝之人不能測也高祖召與語竟無所答上賜之衣服至朝堂捨之而去於是被髮陽狂遊行市里形體垢穢未嘗櫛沐嘗有張永樂者賣卜京師伯醜每從之遊永樂為卦有不能決者伯醜輒為分析爻象尋幽入微永樂嗟服自以為非所及也伯醜亦開肆賣卜有人嘗失子就伯醜筮者卦成伯醜曰汝子在懷遠坊南門道東北壁上有青裙女子抱之可往取也如言果得或者有金數兩夫妻共藏之於後失金其夫意妻有異志將逐之其妻稱寃以詣伯醜為筮之曰金在矣悉呼其家人指一人曰可取金來其人赧然應聲而取之道士韋知常詣伯醜問吉凶伯醜曰汝勿東北行必不得已當早還不然者楊素斬汝頭未幾上令知常事漢王諒俄而上崩諒舉兵反知常逃歸京師知常先與楊素有隙及素平並州先訪知常將斬之賴此獲免又人有失馬來詣伯醜卜者時伯醜為皇太子所召在塗遇之立為作卦卦成曰我不遑為卿占之卿且向西市東壁門南第三店為我買魚作膾當得馬矣其人如此言須臾有一人牽所失馬而至遂擒之崖州嘗獻徑寸珠其使者陰易之上心疑焉召伯醜令筮伯醜曰有物出自水中質圓而色光是大珠也今為人所隱具言隱者姓名容狀上如言簿責之果得本珠上奇之賜帛二十匹國子祭酒何妥嘗詣之論易聞妥之言倏然而笑曰何用鄭玄王弼之言乎久之微有辨答所說辭義皆異先儒之旨而思理玄妙故論者以為天然獨得非常人所及也竟以壽終臨孝恭臨孝恭京兆人也明天文算術高祖甚親遇之每言災祥之事未嘗不中上因令考定陰陽官至上儀同著欹器圖三卷地動銅儀經一卷九宮五墓一卷遁甲月令十卷元辰經十卷元辰厄一百九卷百怪書十八卷祿命書二十卷九宮龜經一百一十卷太一式經三十卷孔子馬頭易卜書一卷並行於世劉祐劉祐滎陽人也開皇初為大都督封索盧縣公其所占候合如符契高祖甚親之初與張賓劉暉馬顯定曆後奉詔撰兵書十卷名曰金韜上善之復著陰策二十卷觀臺飛候六卷玄象要記五卷律曆術文一卷婚姻志三卷産乳志二卷式經四卷四時立成法一卷安曆志十二卷歸正易十卷並行於世張胄玄張胄玄渤海蓨人也博學多通尤精術數冀州刺史趙煚薦之高祖徵授雲騎尉直太史參議律曆事時輩多出其下由是太史令劉暉等甚忌之然暉言多不中胄玄所推步甚精密上異之令楊素與術數人立議六十一事皆舊法久難通者令暉與胄玄等辨析之暉杜口一無所答胄玄通者五十四焉由是擢拜員外散騎侍郎兼太史令賜物千段暉及黨與八人皆斥逐之改定新曆言前曆差一日內史通事顏敏楚上言曰漢時落下閎改顓頊曆作太初曆云後當差一日八百年當有聖者定之計今相去七百一十年術者舉其成數聖者之謂其在今乎上大悅漸見親用胄玄所為曆法與古不同者有三事其一宋祖沖之於歲周之末創設差分冬至漸移不循舊軌每四十六年却差一度至梁虞曆法嫌沖之所差太多因以一百八十六年冬至移一度胄玄以此二術年限懸隔追檢古注所失極多遂折中兩家以為度法冬至所宿歲別漸移八十三年却行一度則上合堯時日永星火次符漢曆宿起牛初明其前後並皆密當其二周馬顯造丙寅元曆有陰陽轉法加減章分進退蝕餘乃推定日創開此數當時術者多不能曉張賓因而用之莫能考正胄玄以為加時先後逐氣參差就月為斷於理未可乃因二十四氣列其盈縮所出實由日行遲則月逐日易及令合朔加時早日行速則月逐日少遲令合朔加時晚檢前代加時早晚以為損益之率日行自秋分已後至春分其勢速計一百八十二日而行一百八十度自春分已後至秋分日行遲計一百八十二日而行一百七十六度每氣之下即其率也其三自古諸曆朔望值交不問內外入限便食張賓立法創有外限應食不食猶未能明胄玄以日行黃道歲一周天月行月道二十七日有餘一周天月道交絡黃道每行黃道內十三日有奇而出又行黃道外十三日有奇而入終而復始月經黃道謂之交朔望去交前後各十五度已下即為當食若月行內道則在黃道之北食多有驗月行外道在黃道之南也雖遇正交無由掩映食多不驗遂因前法別立定限隨交遠近逐氣求差損益食分事皆明著其超古獨異者有七事其一古曆五星行度皆守率見伏盈縮悉無格准胄玄推之各得其真率合見之數與古不同其差多者至加減三十許日即如熒惑平見在雨水氣即均加二十九日見在小雪氣則均減二十五日加減平見以為定見諸星各有盈縮之數皆如此例但差數不同特其積候所知時人不能原其意旨其二辰星舊率一終再見凡諸古曆皆以為然應見不見人未能測胄玄積候知辰星一終之中有時一見及同類感召相隨而出即如辰星平晨見在雨水氣者應見即不見若平晨見在啓蟄氣者去日十八度外三十六度內晨有木火土金一星者亦相隨見其三古曆步術行有定限自見已後依率而推進退之期莫知多少胄玄積候知五星遲速留退真數皆與古法不同多者至差八十餘日留回所在亦差八十餘度即如熒惑前疾初見在立冬初則二百五十日行一百七十七度定見在夏至初則一百七十日行九十二度追步天驗今古皆密其四古曆食分依平即用推驗多少實數罕符胄玄積候知月從木火土金星行有向背月向四星即速背之則遲皆十五度外乃循本率遂於交分限其多少其五古曆加時朔望同術胄玄積候知日食所在隨方改變傍正高下每處不同交有淺深遲速亦異約時立差皆會天象其六古曆交分即為食數去交十四度者食一分去交十三度食二分去交十度食三分每近一度食益一分當交即食既其應少反多應多反少自古諸曆未悉其原胄玄積候知當交之中月掩日不能畢盡其食反少去交五六時月在日內掩日便盡故食乃既自此已後更遠者其食又少交之前後在冬至皆爾若近夏至其率又差所立食分最為詳密其七古曆二分晝夜皆等胄玄積候知其有差春秋二分晝多夜漏半刻皆由日行遲疾盈縮使其然也凡此胄玄獨得於心論者服其精密大業中卒官許智藏許智藏高陽人也祖道幼嘗以母疾遂覽醫方因而究極世號名醫誡其諸子曰為人子者嘗膳視藥不知方術豈謂孝乎由是世相傳授仕梁官至員外散騎侍郎父景武陵王咨議參軍智藏少以醫術自達仕陳為散騎侍郎及陳滅高祖以為員外散騎侍郎使詣揚州會秦孝王俊有疾上馳召之俊夜中夢其亡妃崔氏泣曰本來相迎如聞許智藏將至其人若到當必相苦為之奈何明夜俊又夢崔氏曰妾得計矣當入靈府中以避之及智藏至為俊診脉曰疾已入心郎當發不可救也果如言俊數日而薨上奇其妙賚物百段煬帝即位智藏時致仕于家帝每有所苦輒令中使就詢訪或以輿迎入殿扶登御牀智藏為方奏之用無不效年八十卒于家宗人許澄亦以醫術顯父奭仕梁太常丞中軍長史隨柳仲禮入長安與姚僧垣齊名拜上儀同三司澄有學識傳父業尤盡其妙歷尚藥典御諫議大夫封賀川縣伯父子俱以藝術名重於周隋二代史失事故附見云萬寶常王令言萬寶常不知何許人也父大通從梁將王琳歸于齊後復謀還江南事泄伏誅由是寶常被配為樂戶因而妙達鍾律遍工八音造玉磬以獻于齊又嘗與人方食論及聲調時無樂器寶常因取前食器及雜物以箸扣之品其高下宮商畢備諧於絲竹大為時人所賞然歷周洎隋俱不得調開皇初沛國公鄭譯等定樂初為黃鍾調寶常雖為伶人譯等每召與議然言多不用後譯樂成奏之上召寶常問其可不寶常曰此亡國之音豈陛下之所宜聞上不悅寶常因極言樂聲哀怨淫放非雅正之音請以水尺為律以調樂器上從之寶常奉詔遂造諸樂器其聲率下鄭譯調二律並撰樂譜六十四卷具論八音旋相為宮之法改絃移柱之變為八十四調一百四十四律變化終於一千八百聲時人以周禮有旋宮之義自漢魏已來知音者皆不能通見寶常特創其事皆哂之至是試令為之應手成曲無所凝滯見者莫不嗟異於是損益樂器不可勝紀其聲雅淡不為時人所好太常善聲者多排毀之又太子洗馬蘇夔以鍾律自命尤忌寶常夔父威方用事凡言樂者皆附之而短寶常數詣公卿怨望蘇威因詰寶常所為何所傳受有一沙門謂寶常曰上雅好符瑞有言徵祥者上皆悅之先生當言就胡僧受學云是佛家菩薩所傳音律則上必悅先生所為可以行矣寶常然之遂如其言以答威威怒曰胡僧所傳乃是四夷之樂非中國所宜行也其事竟寢寶常嘗聽太常所奏樂泫然而泣人問其故寶常曰樂聲淫厲而哀天下不久相殺將盡時四海全盛聞其言者皆謂為不然大業之末其言卒驗寶常貧無子其妻因其臥疾遂竊其資物而逃寶常飢餒無人贍遺竟餓而死將死也取其所著書而焚之曰何用此為見者於火中探得數卷見行於世時論哀之開皇之世有鄭譯何妥盧賁蘇夔蕭吉並討論墳籍撰著樂書皆為當世所用至於天然識樂不及寶常遠矣安馬駒曹妙達王長通郭令樂等能造曲為一時之妙又習鄭聲而寶常所為皆歸於雅此輩雖公議不附寶常然皆心服謂以為神時有樂人王令言亦妙達音律大業末煬帝將幸江都令言之子嘗從於戶外彈胡琵琶作翻調安公子曲令言時臥室中聞之大驚蹶然而起曰變變急呼其子曰此曲興自早晚其子對曰頃來有之令言遂歔欷流涕謂其子曰汝慎無從行帝必不返子問其故令言曰此曲宮聲往而不反宮者君也吾所以知之帝竟被殺於江都史臣曰陰陽卜祝之事聖人之教在焉雖不可以專行亦不可得而廢也人能弘道則博利時俗行非其義則咎悔及身故昔之君子所以戒乎妄作今韋來之骨法氣色庾張之推步盈虛雖落下高堂許負朱建不能尚也伯醜龜策近知鬼神之情耿詢渾儀不差辰象之度寶常聲律動應宮商之和雖不足遠擬古人皆一時之妙也許氏之運針石世載可稱蕭吉之言陰陽近於誣誕矣

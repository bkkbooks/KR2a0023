body:
  text: 隋書卷二十一志第十六天文下十輝周禮祲氏掌十輝之法以觀妖祥辨吉凶一曰祲謂陰陽五色之氣祲淫相侵或曰抱珥背璚之屬如虹而短是也二曰象謂雲如氣成形象雲如赤烏夾日以飛之類是也三曰鐫日旁氣刺日形如童子所佩之鐫也四曰監謂雲氣臨在日上也五曰暗謂日月蝕或日光暗也六曰瞢謂瞢瞢不光明也七曰彌謂白虹彌天而貫日也八曰序謂氣若山而在日上或曰冠珥背璚重疊次序在于日旁也九曰隮謂暈氣也或曰虹也詩所謂朝隮于西者也十曰想謂氣五色有形想也青飢赤兵白喪黑憂黃熟或曰想思也赤氣為人獸之形可思而知其吉凶自周已降術士間出今採其著者而言之日君乘土而王其政太平則日五色又曰或黑或青或黃師破又曰遊氣蔽天日月失色皆是風雨之候也若天氣清靜無諸遊氣日月不明乃為失色或天氣下降地氣未升厚則日紫薄則日赤若於夜則月白皆將雨也或天氣未降地氣上升厚則日黃薄則日白若於夜則月赤將旱且風亦為日月暈之候雨少而多陰或天氣已降地氣又升上下未交則日青若於夜則月緑色將寒候也或天地氣雖交而未密則日黑若於夜則月青將雨不雨變為雺霧暈背虹霓又曰陰日月俱無光晝不見日夜不見星皆有雲鄣之兩敵相當陰相圖議也日曚曚光士卒內亂日薄赤見日中烏將軍出旌旗舉此不祥必有敗亡又曰數日俱出若鬬天下兵大戰日鬬下有拔城日戴者形如直狀其上微起在日上為戴戴者德也國有喜也一云立日上為戴青赤氣抱在日上小者為冠國有喜事青赤氣小而交於日下為纓青赤氣小而圓一二在日下左右者為紐青赤氣如小半暈狀在日上為負負者得地為喜又曰青赤氣長而斜倚日傍為戟青赤氣圓而小在日左右為珥黃白者有喜又曰有軍日有一珥為喜在日西西軍戰勝在日東東軍戰勝南北亦如之無軍而珥為拜將又日旁如半環向日為抱青赤氣如月初生背日者為背又曰背氣青赤而曲外向為叛象分為反城璚者如帶璚在日四方青赤氣長而立日旁為直日旁有一直敵在一旁欲自立從直所擊者勝日旁有二直三抱欲自立者不成順抱擊者勝殺將氣形三抱在日四方為提青赤氣橫在日上下為格氣如半暈在日下為承承者臣承君也又曰日下有黃氣三重若抱名曰承福人主有吉喜且得地青白氣如履在日下者為履日旁抱五重戰順抱者勝日一抱一背為破走抱者順氣也背者逆氣也兩軍相當順抱擊逆者勝故曰破走日抱且兩珥一虹貫抱至日順虹擊者勝日重抱內有璚順抱擊者勝亦曰軍內有欲反者日重抱左右二珥有白虹貫抱順抱擊勝得二將有三虹得三將日抱黃白潤澤內赤外青天子有喜有和親來降者軍不戰敵降軍罷色青將喜赤將兵爭白將有喪黑將死日重抱且背順抱擊者勝得地若有罷師日重抱抱內外有璚兩珥順抱擊者勝破軍軍中不和不相信日旁有氣圓而周匝內赤而外青名為暈日暈者軍營之象周環匝日無厚薄敵與軍勢齊等若無軍在外天子失御民多叛日暈有五色有喜不得五色有憂凡占兩軍相當必謹審日月暈氣知其所起留止遠近應與不應疾遲大小厚薄長短抱背為多少有無實虛久亟密疏澤枯相應等者勢等近勝遠疾勝遲大勝小厚勝薄長勝短抱勝背多勝少有勝無實勝虛久勝亟密勝疏澤勝枯重背大破重抱為和親抱多親者益多背為不和分離相去背於內者離於內背於外者離於外也凡占分離相去赤內青外以和相去青內赤外以惡相去日暈明久內赤外青外人勝內青外赤內人勝內黃外青黑內人勝外黃內青黑外人勝外白內青外人勝內白外青內人勝內黃外青外人勝內青外黃內人勝日暈周匝東北偏厚厚為軍福在東北戰勝西南戰敗日暈黃白不鬬兵未解青黑和解分地色黃土功動人不安日色黑有水陰國盛日暈七日無風雨兵大作不可起衆大敗不及日蝕日暈而明天下有兵兵罷無兵兵起不戰日暈始起前滅而後成者後成面勝日暈有兵在外者主人不勝日暈內赤外青羣臣親外外赤內青羣臣親內其身身外其心日有朝夕暈是謂失地主人必敗日暈而珥主有謀軍在外外軍有悔日暈抱珥上將軍易日暈而珥如井幹者國亡有大兵交日暈上西將軍易兩敵相當日暈兩珥平等俱起而色同軍勢等色厚潤澤者賀喜日暈有直珥為破軍貫至日為殺將日暈員且戴國有喜戰從戴所擊者勝得地日暈而珥背左右如大車輞者兵起其國亡城兵滿野而城復歸日暈暈內有珥一抱所謂圍城者在內內人則勝日暈有重抱後有背戰順抱者勝得地有軍日暈有一抱抱為順貫暈內在日西西軍勝有軍日暈有一背背為逆在日西東軍勝餘方放此日暈而背兵起其分失城日暈有背背為逆有降叛者有反城在日東東有叛餘方放此日暈背氣在暈內此為不和分離相去其色青外赤內節臣受王命有所之日暈上下有兩背無兵兵起有兵兵入日暈四背在暈內名曰不和有內亂日暈而四背如大車輞者四提設其國衆在外有反臣日暈四提必有大將出亡者日暈有四背璚其背端盡出暈者反從內起日暈而兩珥在外有聚雲在內與外不出三日城圍出戰日暈有背珥直而有虹貫之者順虹擊之大勝得地日暈有白虹貫暈至日從虹所指戰勝破軍殺將日暈有虹貫暈不至日戰從貫所擊之勝得小將日暈有一虹貫暈內順虹擊者勝殺將日暈二白虹貫暈有戰客勝日重暈有四五白虹氣從內出外以此圍城主人勝城不拔又日重暈攻城圍邑不拔日暈二重其外清內濁不散軍會聚日暈三重有拔城日交暈無厚薄交爭力勢均厚者勝日交暈人主左右有爭者兵在外戰日在暈上軍罷交暈貫日天下有破軍死將日交暈而爭者先衰不勝即兩敵相向交暈至日月順以戰勝殺將一法日在上者勝日有交者赤青如暈狀或如合背或正直交者偏交也兩氣相交也或相貫穿或相向或相背也交主內亂軍內不和日交暈如連環為兩軍兵起君爭地日有三暈軍分為三日方暈而上下聚二背將敗人亡日暈若井垣若車輪二國皆兵亡又曰有軍日暈不匝半暈在東東軍勝在西西軍勝南北亦如之日暈如車輪半軍在外者罷日半暈東向者西夷羌胡來入國半暈西向者東夷人欲反入國半暈北向者南夷人欲反入國半暈南向者北夷人欲反入國又曰軍在外月暈師上其將戰必勝月暈黃色將軍益秩祿得位月暈有兩珥白虹貫之天下大戰月暈而珥兵從珥攻擊者利月暈有霓雲乘之以戰從霓所往者大勝月暈虹霓直指暈至月者破軍殺將雜氣天子氣內赤外黃正四方所發之處當有王者若天子欲有遊往處其地亦先發此氣或如城門隱隱在氣霧中帶殺氣森森然或如華蓋在氣霧中或有五色多在晨昏見或如千石倉在霧中帶殺氣或如高樓在霧氣中或如山鎮蒼帝起青雲扶日赤帝起赤雲扶日黃帝起黃雲扶日白帝起白雲扶日黑帝起黑雲扶日或日氣象青衣人無手在日西天子之氣也敵上氣如龍馬或雜色鬱鬱衝天者此帝王之氣不可擊若在吾軍戰必大勝凡天子之氣皆多上達於天以王相日見凡猛將之氣如龍兩軍相當若氣發其上則其將猛鋭或如虎在殺氣中猛將欲行動亦先發此氣若無行動亦有暴兵起或如火煙之狀或白如粉沸或如火光之狀夜照人或白而赤氣繞之或如山林竹木或紫黑如門上樓或上黑下赤狀似黑旌或如張弩或如埃塵頭鋭而卑本大而高兩軍相當敵軍上氣如囷倉正白見日逾明或青白如膏將勇大戰氣發漸漸如雲變作此形將有深謀凡氣上與天連軍中有貞將或云賢將凡軍勝氣如堤如坂前後磨地此軍士衆強盛不可擊軍上氣如火光將軍勇士卒猛好擊戰不可擊軍上氣如山堤山上若林木將士驍勇軍上氣如埃塵粉沸其色黃白旌旗無風而揚揮揮指敵此軍必勝敵上有白氣粉沸如樓繞以赤氣者兵鋭營上氣黃白色重厚潤澤者勿與戰兩敵相當有氣如人持斧向敵戰必大勝兩敵相當上有氣如蛇舉首向敵者戰勝敵上氣如一匹帛者此雍軍之氣不可攻望敵上氣如覆舟雲如牽牛有白氣出似旌幟在軍上有雲如鬬雞赤白相隨在氣中或發黃氣皆將士精勇不可擊軍營上有赤黃氣上達於天亦不可攻凡軍營上五色氣上與天連此天應之軍不可擊其氣上小下大其軍日增益士卒軍上氣如堤以覆其軍上前赤後白此勝氣若覆吾軍急往擊之大勝天氣鋭黃白團團而潤澤者敵將勇猛且士卒能強戰不可擊雲如日月而赤氣繞之如日月暈狀有光者所見之地大勝不可攻凡雲氣有獸居上者勝軍上有氣如塵埃前下後高者將士精鋭敵上氣如乳武豹伏者難攻軍上有氣者其軍難攻軍上雲如華蓋者勿往與戰雲如旌旗如蜂向人者勿與戰兩軍相當敵上有雲如飛鳥徘徊其上或來而高者兵精鋭不可擊軍上雲如馬頭低尾仰勿與戰軍上雲如狗形勿與戰望四方有氣如赤鳥在烏氣中如烏人在赤氣中如赤杵在烏氣中如人十十五五或如旌旗在烏氣中有赤氣在前者敵人精悍不可當敵上有雲如山不可説有雲如引素如陳前鋭或一或四黑色有陰謀赤色飢青色兵有反黃色急去凡氣上黃下白名曰善氣所臨之軍欲求和退若氣出北方求退向北其衆死散向東則不可信終能為害向南將死敵上氣囚廢枯散或如馬肝色如死灰色或類偃蓋或類偃魚皆為將敗軍上氣乍見乍不見如霧起此衰氣可擊上大下小士卒日減凡軍營上十日無氣發則軍必勝而有赤白氣乍出即滅外聲欲戰其實欲退散黑氣如壞山墮軍上者名曰營頭之氣其軍必敗軍上氣昏發連夜夜照人則軍士散亂軍上氣半而絶一敗再絶再敗三絶三敗在東發白氣者災深軍上氣中有黑雲如牛形或如豬形者此是瓦解之氣軍必敗敵上氣如粉如塵者勃勃如煙或五色雜亂或東西南北不定者其軍欲敗軍上氣如羣羊羣豬在氣中此衰氣擊之必勝軍上有赤氣炎降於天則將死士衆亂赤光從天流下入軍軍亂將死彼軍上有蒼氣須臾散去擊之必勝在我軍上須自堅守軍有黑氣如牛形或如馬形從氣霧中下漸漸入軍名曰天狗下食血則軍破軍上氣或如羣鳥亂飛或如懸衣如人相隨或紛紛如轉蓬或如揚灰或雲如卷席如匹布亂穰者皆為敗徵氣乍見乍沒乍聚乍散如霧之始起為敗氣氣如繫牛如人臥如敗車如雙蛇如飛鳥如決堤垣如壞屋如人相指如人無頭如驚鹿相逐如兩雞相同皆為敗氣凡降人氣如人十十五五皆叉手低頭又云如人叉手相向白氣如羣鳥趣入屯營連結百餘里不絶而能徘徊須臾不見者當有他國來降氣如黑山以黃為緣者欲降服敵上氣青而高漸黑者將欲死散軍上氣如燔生草之煙前雖鋭後必退黑氣臨營或聚或散如鳥將宿敵人畏我心意不定終必逃背逼之大勝凡白氣從城中南北出者不可攻城不可屠城中有黑雲如星名曰軍精急解圍去有突兵出客敗城上白氣如旌旗或青雲臨城有喜慶黃雲臨城有大喜慶青色從中南北出者城不可攻或氣如青色如牛頭觸人者城不可屠城中氣出東方其色黃此太一城白氣從中出青氣從城北入反向還者軍不得入攻城圍邑過旬雷雨者為城有輔疾去之勿攻城上氣如煙火主人欲出戰其氣無極者不可攻城上氣如雙蛇者難攻赤氣如杵形從城中向外者內兵突出主人戰勝城上有雲分為兩彗狀攻不可得赤氣在城上黃氣四面繞之城中大將死城降城上赤氣如飛鳥如敗車及無雲氣士卒必散城營中有赤黑氣如貍皮斑及赤者並亡城上氣上赤而下白色或城中氣聚如樓出見於外城皆可屠
年五月丙辰月犯心占曰有亂臣不出三年有亡國其四年交州刺史李凱舉兵反七月丙子太白犯軒轅大星四年六月壬戌歲星晝見占曰歲色黃潤立竿影見大熟是歲大穰米斛三十又曰星與日爭光武且弱文且強自此後帝崇尚文儒躬自講説終於太清不修武備八月庚子老人星見占曰老人星見人主壽昌自此後每年以秋分後見於參南至春分而伏武帝壽考之象云七年九月己亥月犯東井占曰有水災其年京師大水十年九月丙申天西北隆隆有聲赤氣下至地占曰天狗也所往之鄉有流血其君失地其年十二月馬仙琕大敗魏軍斬馘十餘萬剋復朐山城十二月壬戌朔日食在牛四度十三年二月丙午太白失行在天關占曰津梁不通又兵起其年填星守天江占曰有江河塞有決溢有土功其年大發軍衆造浮山堰以堨淮水至十四年填星移去天江而堰壞奔流決溢十四年十月辛未太白犯南斗十七年閏八月戊辰月行掩昴普通元年春正月丙子日有食之占曰日食陰侵陽陽不克陰也為大水其年七月江淮海溢九月乙亥有星晨見東方光爛如火占曰國皇見有內難有急兵反叛其三年義州刺史文僧朗以州叛四年十一月癸未朔日有食之太白晝見六年三月丙午歲星入南斗庚申月食五月己酉太白晝見六月癸未太白經天九月壬子太白犯右執法七年正月癸卯太白歲星在牛相犯占曰其國君凶易政明年三月改元大赦大通元年八月甲申月掩填星閏月癸酉又掩之占曰有大喪天下無主國易政其後中大通元年九月癸巳上又幸同泰寺捨身王公以一億萬錢奉贖十月己酉還宮大赦改元中大通三年太子薨皆天下無主易政及大喪之應中大通元年閏月壬戌熒惑犯鬼積尸占曰有大喪有大兵破軍殺將其二年蕭玩帥衆援巴州為魏梁州軍所敗玩被殺四年七月甲辰星隕如雨占曰星隕陽失其位災害之象萌也又曰星隕如雨人民叛下有專討又曰大人憂其後侯景狡亂帝以憂崩人衆奔散皆其應也五年正月己酉長星見六年四月丁卯熒惑在南斗占曰熒惑出入留舍南斗中有賊臣謀反天下易政更元其年十二月北梁州刺史蘭欽舉兵反後年改為大同元年大同三年三月乙丑歲星掩建星占曰有反臣其年會稽山賊起其七年交州刺史李賁舉兵反五年十月辛丑彗出南斗長一尺餘東南指漸長一丈餘十一月乙卯至婁滅占曰天下有謀王者其八年正月安成民劉敬躬挾左道以反黨與數萬其九年李賁僭稱皇帝於交州太清二年五月兩月見占曰其國亂必見於亡國三年正月壬午熒惑守心占曰王者惡之乙酉太白晝見占曰不出三年有大喪天下革政更王冖出蟲國弱小國冖出蟲三月丙子熒惑又守心占曰大人易政主去其宮又曰人飢亡海內哭天下大潰是年帝為侯景所幽崩七月九江大飢人相食十四五九月戊午月在斗掩歲星占曰天下亡君其後侯景篡殺簡文帝大寶元年正月丙寅月晝光見占曰月晝光有隱謀國雄逃又云月晝明姦邪並作擅君之朝其後侯景篡殺皆國亂亡君大喪更政之應也元帝承聖三年九月甲午月犯心中星占曰有反臣王者惡之有亡國其後三年帝為周軍所俘執陳氏取國梁氏以亡陳武帝永定三年九月辛卯朔月入南斗占曰月入南斗大人憂一曰太子殃後二年帝崩太子昌在周為質文帝立後昌還國為侯安都遣盜迎殺之三年五月丙辰朔日有食之占曰日食君傷又曰日食帝德消六月庚子填星鉞與太白並占太白與填合為疾為內兵文帝天嘉元年五月辛亥熒惑犯右執法占曰大臣有憂執法者誅後四年司空侯安都賜死九月癸丑彗星長四尺見芒指西南占曰彗星見則敵國兵起得本者勝其年周將獨孤盛領衆趣巴湘侯瑱襲破之二年五月己酉歲星守南斗六月丙戌熒惑犯東井七月乙丑熒惑入鬼中戊辰熒惑犯斧質十月熒惑行在太微右掖門內三年閏二月己丑熒惑逆行犯上相甲子太白犯五車填星七月太白犯輿鬼八月癸卯月犯南斗丙午月犯牽牛庚申太白入太微十一月丁丑月犯畢左股辛巳熒惑犯歲星戊子月犯角庚寅月入氐四年六月癸丑太白犯右執法七月戊子熒惑犯填星八月甲午熒惑犯軒轅大星丁未太白犯房九月戊寅熒惑入太微犯右執法癸未太白入南斗占曰太白入斗天下大亂將相謀反國易政又曰君死不死則廢又曰天下受爵祿其後安成王為太傅廢少帝而自立改官受爵之應也辛卯熒惑犯左執法十一月辛酉熒惑犯右執法甲戌月犯畢左股五年正月甲子月犯畢大星奎丁卯月犯星四月庚子太白歲星合在奎金在南木在北相去二尺許壬寅月入氐又犯熒惑太白歲星又合在婁相去一尺許癸卯月犯房上星五月庚午熒惑逆行二十一日犯氐東南西南星占曰月有賊臣又曰人主無出廊廟間有伏兵又曰君死有赦後二年少帝廢之應也六月丙申月犯亢七月戊寅月犯畢大星閏十月庚申月犯牽牛丙子又犯左執法十一月乙未月食畢大星六年正月己亥太白犯熒惑相去二寸占曰其野有兵喪改立侯王三月丁卯日入後衆星未見有流星白色大如斗從太微間南行尾長尺餘占曰有兵與喪四月丁巳月犯軒轅占曰女主有憂五月丁亥太白犯軒轅占曰女主失勢又曰四方禍起其後年少帝廢廢後慈訓太后崩六月己未月犯氐辛酉有彗長可丈餘占曰陰謀姦宄起一曰宮中火起後安成王録尚書都督中外諸軍事廢少帝而自立陰謀之應八月戊辰月掩畢大星丙子月與太白並光芒相著在太微西蕃南三尺所九月辛巳熒惑犯左執法癸未太白犯右執法辛卯犯左執法乙巳月犯上相太白犯熒惑其夜月又犯太白占曰其國內外有兵喪改立侯王明年帝崩又少帝廢之應也七年二月庚午日無光烏見占曰王者惡之其日庚午吳楚之分野四月甲子日有交暈白虹貫之是月癸酉帝崩廢帝天康元年五月庚辰月犯軒轅女御大星占曰女主憂後年慈訓太后崩癸木月犯左執法光大元年正月甲寅月犯軒轅大星占曰女主當之八月戊寅月食哭星占曰有喪泣事明年太后崩臨海王薨哭泣之應也壬午鎮星辰星合於軫九月戊午辰星太白相犯占曰改立侯王己未月犯歲星占曰國亡君十二月辛巳月又犯歲星辛卯月犯建星占曰大人惡之二年正月戊申月掩歲星占曰國亡君五月乙未月犯太白六月丙寅太白犯右執法壬子客星見氐東八月庚寅月犯太微九月庚戌太白逆行與鎮星合在角占曰為白衣之會又曰所合之國為亡地為疾兵戊午太白晝見占曰太白晝見國更政易王十一月丙午歲星守右執法甲申月犯太微東南星戊子太白入氐十二月甲寅慈訓太后廢帝為臨海王太建二年四月薨皆其應也宣帝太建七年四月丙戌有星孛于大角占曰人主亡五月庚辰熒惑犯右執法壬子又犯右執法十年二月癸亥日上有背占曰其野失地有叛兵甲子吳明徹軍敗於呂梁將卒並為周軍所虜來年淮南之地盡沒于周十月癸卯月食熒惑占曰國敗君亡大兵起破軍殺將來年三月吳明徹敗於呂梁十三年帝崩敗國亡君之應也十一年四月己丑歲星太白辰星合于東井十二年二月壬寅白虹見西方占曰有喪其後十三年帝崩十月戊午月犯牽牛吳越之野占曰其國亡君有憂後年帝崩辛酉歲星犯執法十二月癸酉辰星在太白上甲戌辰星太白交相掩占曰大兵在野大戰辛巳慧星見西南占曰有兵喪明年帝崩始興王叔陵作亂後主至德元年正月壬戌蓬星見占曰必有亡國亂臣後帝於太皇寺捨身作奴以祈冥助不恤國政為施文慶等所惑以至國亡魏普泰元年十月歲星熒惑填星太白聚於觜參色甚明大占曰當有王者興其月齊高祖起於信都至中興二年春而破爾朱兆遂開霸業魏武定四年九月丁未高祖圍玉壁城有星墜於營衆驢皆鳴占曰破軍殺將高祖不豫五年正月丙午崩齊文宣帝天保元年十二月甲申熒惑犯房北頭第一星及鉤鈐占曰大臣有反者其二年二月壬辰太尉彭樂謀反誅八年二月己亥歲星守少微經六十三日占曰五官亂五月癸卯歲星犯太微上將占曰大將憂大臣死其十年五月誅諸元宗室四十餘家乾明元年誅楊遵彥等皆五官亂大將憂大臣死之應也八年七月甲辰月掩心星占曰人主惡之十年十月帝崩九年二月熒惑犯鬼質占曰斧質用有大喪三月甲午熒惑犯軒轅占曰女主惡之其十年五月誅魏氏宗室十月帝崩斧質用有大喪之應也十年六月庚子填星犯井鉞與太白並占曰子為玄枵齊之分野君有戮死者大臣誅斧鉞用其明年二月乙巳太師常山王誅尚書令楊遵彥右僕射燕子獻領軍可朱渾天和侍中宋欽道等八月壬午廢少帝為濟南王廢帝乾明元年三月甲午熒惑入軒轅占曰女主凶後太寧二年四月太后崩肅宗皇建二年四月丙子日有食之子為玄枵齊之分野七月乙丑熒惑入鬼中戊辰犯鬼質占曰有大喪十一月帝以暴疾崩武成帝河清元年七月乙亥太白犯輿鬼占曰有兵謀誅大臣斧質用其年十月壬申冀州刺史平秦王高歸彥反段孝先討擒斬之於都市又其二年殺太原王紹德皆斧質用之應也八月甲寅月掩畢占曰其國君死大臣有誅者有邊兵大戰破軍殺將其十月平秦王歸彥以反誅其三年周師與突厥入並州大戰城西伏尸流血百餘里皆其應也四年正月己亥太白犯熒惑相去二寸在奎甲辰太白熒惑歲星合在婁占曰甲為齊三星若合是謂驚立絶行其分有兵喪改立侯王國易政三月戊子彗星見占曰除舊布新有易王至四月傳位於太子改元後主天統元年六月壬戌彗星見於文昌長數寸入文昌犯上將然後經紫微宮西垣入危漸長一丈餘指室壁後百餘日在虛危滅占曰有大喪有亡國易政其四年十二月太上皇崩三年五月戊寅甲夜西北有赤氣竟天夜中始滅十月丙午天西北頻有赤氣占曰有大兵大戰後周武帝總衆來伐大戰有大兵之應也四年六月彗星見東井占曰大亂國易政七月孛星見房心白如粉絮大如斗東行八月入天市漸長四丈犯瓠瓜歷虛危入室犯離宮九月入奎至婁而滅孛者孛亂之氣也占曰兵喪並起國大亂易政大臣誅其後太上皇崩至武平二年七月領軍庫狄伏連治書侍御史王子宜受琅邪王儼旨矯詔誅録尚書淮南王和士開於南臺伏連等即日伏誅右僕射馮子琮賜死此國亂之應也五年二月戊辰歲星逆行掩太微上將占曰天下大驚四輔有誅者五月甲午熒惑犯鬼積尸甲齊也占曰大臣誅兵大起斧質用有大喪至武平二年九月誅琅邪王儼三年五月誅右丞相咸陽王斛律明月四年七月誅蘭陵王長恭皆懿親名將也四年十月又誅崔季舒等此斧質用之應也武平三年八月癸未填星歲星太白合於氐宋之分野占曰其國內外有兵喪改立侯王其四年十月陳將吳明徹寇彭城右僕射崔季舒國子祭酒張雕黃門裴澤郭遵尚書左丞封孝琰等諫車駕不宜北幸並州帝怒並誅之內外兵喪之應也九月庚申月在婁食既至旦不復占曰女主凶其三年八月廢斛律皇后立穆后四年又廢胡后為庶人十一月乙亥天狗下西北占曰其下有大戰流血後周武帝攻晉州進兵平並州大戰流血三年十二月辛丑日食歲星占曰有亡國至七年而齊亡四年五月癸巳熒惑犯右執法占曰大將死執法者誅若有罪其年誅右丞相斛律明月明年誅蘭陵王長恭後年誅右僕射崔季舒皆大將死執法誅之應也周閔帝元年五月癸卯太白犯軒轅占曰太白行軒轅中大臣出令又曰皇后失勢辛亥熒惑犯東井北端第二星占曰其國亂又曰大旱其年九月冢宰護逼帝遜位幽於舊邸月餘殺崩司會李植軍司馬孫及宮伯乙弗鳳等被誅害其冬大旱皆大臣出令大臣死旱之應也明帝二年三月甲午熒惑入軒轅占曰王者惡之女主凶其月王后獨孤氏崩六月庚子填星犯井鉞與太白並占曰傷成於鉞君有戮死者其年太師宇文護進食帝遇毒崩武帝保定元年九月乙巳客星見於翼十月甲戌日有食之戊寅熒惑犯太微上將合為一二年閏正月癸巳太白入昴二月壬寅熒惑犯太微上相三月壬午熒惑犯左執法七月乙亥太白犯輿鬼九月戊辰日有食之既十一月壬午熒惑犯歲星於危南三年三月乙丑朔日有食之九月甲子熒惑犯太微上將占曰上將誅死十月壬辰熒惑犯左執法四年二月庚寅朔日有食之甲午熒惑犯房右驂三月己未熒惑又犯房右驂占曰上相誅車馳人走天下兵起其年十月冢宰晉公護率軍伐齊十二月柱國庸公王雄力戰死之遂班師兵起將死之應也八月丁亥朔日有蝕之五年正月辛卯白虹貫日占曰為兵喪甲辰太白熒惑歲星合於婁六月庚申彗星出三台入文昌犯上將後經紫宮西垣入危漸長一丈餘指室壁後百餘日稍短長二尺五寸在虛危滅齊之分野七月辛巳朔日有食之天和元年正月己卯日有食之十月乙卯太白晝見經天二年正月癸酉朔日有食之五月己丑歲星與熒惑合在井宿相去五尺井為秦分占曰其國有兵為飢旱大臣匿謀下有反者若亡地閏六月丁酉歲星太白合在柳相去一尺七寸柳為周分占曰為內兵又曰主人凶憂失城是歲陳湘州刺史華皎率衆來附遣衛公直將兵援之因而南伐九月衛公直與陳將淳于量戰于沌口王師失利元定韋世沖以步騎數千先度遂沒陳七月庚戌太白犯軒轅大星相去七寸占曰女主失勢大臣當之又曰西方禍起其十一月癸丑太保許公宇文貴薨大臣當之驗也十月辛卯有黑氣一大如杯在日中甲午又加一經六日乃滅占曰臣有蔽主之明者十一月戊戌朔日有食之庚子熒惑犯鉤鈐去之六寸占曰王者有憂又曰車騎驚三公謀三年三月己未太白犯井北轅第一星占曰將軍惡之其七月壬寅隋公楊忠薨四月辛巳太白入輿鬼犯積尸占曰大臣誅又曰亂臣在內有屠城六月甲戌彗見東井長一丈上白下赤而鋭漸東行至七月癸卯在鬼北八寸所乃滅占曰為兵國政崩壞又曰將軍死大臣誅七月己未客星見房心白如粉絮大如斗漸大東行八月入天市長如匹所復東行犯河鼓右將癸未犯瓠瓜又入室犯離宮九月壬寅入奎稍小壬戌至婁北一尺所滅凡六十九日占曰兵起若有喪白衣會為飢旱國易政又曰兵犯外城大臣誅四年二月戊辰歲星逆行掩太微上將占曰天下大驚國不安四輔有誅必有兵革天下大赦庚午有流星大如斗出左攝提流至天津滅有聲如雷五月癸巳熒惑犯輿鬼甲午犯積尸占曰午秦也大臣有誅兵大起後三年太師大冢宰晉國公宇文護以不臣誅皆其應也五年正月乙巳月在氐暈有白虹長丈所貫之而有兩珥連接規北斗第四星占曰兵大起大戰將軍死於野是冬齊將斛律明月寇邊於汾北築城自華谷至於龍門其明年正月詔齊公憲率師禦之三月己酉憲自龍門度河攻拔其新築五城兵起大戰之應也六年二月己丑夜有蒼雲廣三丈經天自戌加辰四月戊寅朔日有蝕之己卯熒惑逆行犯輿鬼占曰有兵喪大臣誅兵大起其月又率師取齊宜陽等九城六月齊將攻陷汾州六月庚辰熒惑太白合在張宿相去一尺占曰主人兵不勝所合國有殃建德元年三月丙辰熒惑太白合壁占曰其分有兵喪不可舉事用兵必受其殃又曰改立侯王有德者興無德者亡其月誅晉公護護子談公會莒公至崇業公靜等大赦癸亥詔以齊公憲為大冢宰是其驗也七月丙午辰與太白合於井相去七寸占曰其下之國必有重德致天下後四年上帥師平齊致天下之應也九月己酉月犯心中星相去一寸占曰亂臣在傍不出五年下有亡國後周武伐齊平之有亡國之應也二年二月辛亥白虹貫日占曰臣謀君不出三年又曰近臣為亂後年七月衛王直在京師舉兵反癸亥熒惑掩鬼西北星占曰大賊在大人之側又曰大臣有誅四月己亥太白掩西北星壬寅又掩東北星占曰國有憂大臣誅六月丙辰月犯心中後二星占曰亂臣在傍不出三年有亡國又曰人主惡之九月癸酉太白犯左執法占曰大臣有憂執法者誅若有罪十一月壬子太白掩填星在尾占曰填星為女主尾為後宮明年皇太后崩三年二月戊午客星大如桃青白色出五車東南三尺所漸東行稍長二尺所至四月壬辰入文昌丁未入北斗魁中後出魁漸小凡見九十三日占曰天下兵起車騎滿野人主有憂又曰天下有亂兵大起臣謀主其七月乙酉衛王直在京師舉兵反討擒之廢為庶人至十月始州民王鞅擁衆反討平之四月乙卯星孛於紫宮垣外大如拳赤白指五帝座漸東南行稍長一丈五尺五月甲子至上台北滅占曰天下易政無德者亡後二年武帝率六軍滅齊十一月丙子歲星與太白相犯光芒相及在危占曰其野兵人主凶失其城邑危齊之分野後二年宇文神舉攻拔陸渾等五城十二月庚寅月犯歲星在危相去二寸占曰其邦流亡不出三年辛卯月行在營室食太白占曰其國以兵亡將軍戰死營室衛也地在齊境後齊亡入周四年三月甲子月犯軒轅大星占曰女主有憂又五官有亂五年十月庚戌熒惑犯太微西蕃上將星占曰天下不安上將誅若有罪其止六年二月皇太子巡撫西土仍討吐谷渾八月至伏俟城而旋吐谷渾寇邊天下不安之應也六月庚午熒惑入鬼占曰有喪旱其七月京師旱十月戊午歲星犯大陵又己未庚申月連暈規昴畢五車及參占曰兵起爭地又曰王自將兵又曰天下大赦癸亥帝率衆攻晉州是日虹見晉州城上首向南尾入紫宮長十餘丈庚午克之丁卯夜白虹見長十餘丈頭在南尾入紫宮中占曰其下兵戰流血又曰若無兵必有大喪至六年正月平齊與齊軍大戰十一月稽胡反齊王討平之六年四月先此熒惑入太微宮二百日犯東蕃上相西蕃上將句已往還至此月甲子出端門占曰為大臣代主又曰臣不臣有反者又曰必有大喪後宣武繼崩高祖以大運代起十月癸卯月食熒惑在斗占曰國敗其君亡兵大起破軍殺將斗為吳越之星陳之分野十一月陳將吳明徹侵呂梁徐州總管梁士彥出軍與戰不利明年三月郯公王軌討擒陳將吳明徹俘斬三萬餘人十一月甲辰晡時日中有黑子大如杯占曰君有過而臣不諫人主惡之十二月癸丑流星大如月西流有聲蛇行屈曲光照地占曰兵大起下有戰場戊辰平旦有流星大如三斗器色赤出紫宮凝著天乃北下占曰人主去其宮殿是月營州刺史高寶寧據州反其明年五月帝總戎北伐後年武帝崩宣政元年正月丙子月食昴占曰有白衣之會又曰胸奴侵邊其月突厥寇幽州殺略吏人五月帝總戎北伐六月帝疾甚還京次雲陽而崩六月壬午癸丑木火金三星合在井占曰其國霸又曰其國外內有兵喪改立侯王是月幽州人盧昌期據范陽反改立王侯兵喪之驗也七年辛丑月犯心前星占曰太子惡之若失位後靜帝立為天子不終之徵也丙辰熒惑太白合在七星相去二尺八寸所占曰君憂又曰其國有兵改立王侯有德興無德亡後年改置四輔官傳位太子改立王侯之應也己未太白犯軒轅大星占曰女主凶後二年宣帝崩楊后令其父隋公為大丞相總軍國事隋氏受命廢后為樂平公主餘四后悉廢為比丘尼八月庚辰太白入太微占曰為天下驚又曰近臣起兵大臣相殺國有憂其後趙陳等五王為執政所誅大臣相殺之應也九月丁酉熒惑入太微西掖門庚申犯左執法相去三寸占曰天下不安大臣有憂又曰執法者誅若有罪是月汾州稽胡反討平之十一月突厥寇邊圍酒泉殺略吏人明年二月殺柱國郯公王軌皆其應也十二月癸未熒惑入氐守犯之三十日占曰天子失其宮又曰賊臣在內下有反者又曰國君有繫飢死若毒死者靜帝禪位隋高祖幽殺之宣帝大成元年正月丙午癸丑日皆有背占曰臣為逆有反叛邊將去之又曰卿大夫欲為主其後隋公作霸尉迥王謙司馬消難各舉兵反大象元年四月戊子太白歲星辰星合在井占曰是謂驚立是謂絶行其國內外有兵喪改立王公又曰其國可霸修德者冖出蟲無德受殃其五月趙陳越代滕五王並入國後二年隋王受命宇文氏宗族相繼誅滅六月丁卯有流星一大如雞子出氐中西北流有尾迹長一丈所入月中即滅占曰不出三年人主有憂又曰有亡國靜帝幽閉之應也己丑有流星一大如斗色青有光明照地出營室抵壁入濁七月壬辰熒惑掩房北頭第一星占曰亡君之誡又曰將軍為亂王者惡之大臣有反者天子憂其十二月帝親御驛馬日行三百里四皇后及文武侍衛數百人並乘馹以從房為天駟熒惑主亂此宣帝亂道德馳騁車騎將亡之誡八月辛巳熒惑犯南斗第五星占曰且有反臣道路不通破軍殺將尉迥王謙等起兵敗亡之徵也九月己酉太白入南斗魁中占曰天下有大亂將相謀反國易政又曰君死不死則疾又曰天下爵祿皆高祖受命羣臣分爵之徵也十月壬戌歲星犯軒轅大星占曰女主憂若失勢周自宣政元年熒惑太白從歲星聚東井大象元年四月太白歲星辰星又聚井十月歲星守軒轅其年又守翼東井秦分翼楚分漢東為楚地軒轅后族隋以后族興於秦地之象而周之后妃失勢之徵也乙酉熒惑在虛與填星合占曰兵大起將軍為亂大人惡之是月相州段德舉謀反伏誅其明年三月嵵公宇文亮舉兵反擒殺之二年四月乙丑有星大如斗出天流入紫宮抵鉤陳乃滅占曰有大喪兵大起將軍戮又曰臣犯上主有憂其五月帝崩隋公執國政大喪臣犯主之應趙王越王以謀執政被誅又荊豫襄三州諸蠻反尉迥王謙司馬消難各舉兵畔不從執政終以敗亡皆大兵起將軍戮之應也五月甲辰有流星一大如三斗器出太微端門流入翼色青白光明照地聲若風吹幡旗占曰有立王若徙王又曰國失君其月己酉帝崩劉昉矯制以隋公受遺詔輔政終受天命立王徙王失君之應也七月壬子歲星太白合於張有流星大如斗出五車東北流光明燭地九月甲申熒惑歲星合于翼靜帝大定元年正月乙酉歲星逆行守右執法熒惑掩房北第一星占曰房為明堂布政之宮無德者失之二月甲子隋王稱尊號高祖文皇帝開皇元年三月甲申太白晝見占曰太白經天晝見為臣冖出蟲為革政四月壬午歲星晝見占曰大臣冖出蟲有逆謀王者不安其後劉昉等謀反伏誅十一月己巳有流星聲如隤牆光燭地占曰流星有光有聲名曰天保所墜國安有喜其九年平陳天下一統五年八月戊申有流星數百四散而下占曰小星四面流行者庶人流移之象也其九年平陳江南士人悉播遷入京師八年二月庚子填星入東井占曰填星所居有德利以稱兵其年大舉伐陳克之十月甲子有星孛于牽牛占曰臣殺君天下合謀又曰內不有大亂則外有大兵牛吳越之星陳之分野後年陳氏滅九年正月己巳白虹夾日占曰白虹銜日臣有背主又曰人主無德者亡是月滅陳十四年十一月癸未有彗星孛于虛危及奎婁齊魯之分野其後魯公虞慶則伏法齊公高熲除名十九年十二月乙未星隕於渤海占曰陽失其位災害之萌也又曰大人憂二十年十月太白晝見占曰大臣冖出蟲為革政為易王右僕射楊素熒惑高祖及獻后勸廢嫡立庶其月乙丑廢皇太子勇為庶人明年改元皆陽失位及革政易王之驗也仁壽四年六月庚午有星入于月中占曰有大喪有大兵有亡國有破軍殺將七月乙未日青無光八日乃復占曰主勢奪又曰日無光有死王甲辰上疾甚丁未宮車晏駕漢王諒反楊素討平之皆兵喪亡國死王之應煬帝大業元年六月甲子熒惑入太微占曰熒惑為賊為亂入宮宮中不安三年三月辛亥長星見西方竟天干歷奎婁角亢而沒至九月辛未轉見南方亦竟天又干角亢頻掃太微帝座干犯列宿唯不及參井經歲乃滅占曰去穢布新天所以去無道建有德見久者災深星大者事大行遲者期遠兵大起國大亂而亡餘殃為水旱飢饉土功疾疫其後築長城討吐谷渾及高麗兵戎歲駕略無寧息水旱飢饉疾疫土功相仍而有羣盜並起邑落空虛九年五月禮部尚書楊玄感於黎陽舉兵反丁未熒惑逆行入南斗色赤如血如三斗器光芒震耀長七八尺於斗中句巳而行占曰有反臣道路不通國大亂兵大起斗吳越分野玄感父封於越後徙封楚地又次之天意若曰使熒惑句巳之除其分野至七月宇文述討平之其兄弟悉梟首車裂斬其黨與數萬人其年朱燮管崇亦於吳郡擁衆反此後羣盜屯聚剽略郡縣尸橫草野道路不通齎詔勑使人皆步涉夜行不敢遵路十一年六月有星孛于文昌東南長五六寸色黑而鋭夜動搖西北行數日至文昌去宮四五寸不入却行而滅占曰為急兵其八月突厥圍帝於雁門從兵悉馮城禦寇矢及帝前七月熒惑守羽林占曰衛兵反十二月戊寅大流星如斛墜賊盧明月營破其衝輣壓殺十餘人占曰奔星所墜破軍殺將其年王充擊盧明月城破之十二年五月丙戌朔日有食之既占曰日食既人主亡陰侵陽下伐上其後宇文化及等行殺逆癸巳大流星隕于吳郡為石占曰有亡國有死王有大戰破軍殺將其後大軍破逆賊劉元進于吳郡斬之八月壬子有大流星如斗出王良閣道聲如隤牆癸丑大流星如甕出羽林九月戊午有枉矢二出北斗魁委曲蛇形注於南斗占曰主以兵去天之所伐亦曰以亂代亂執矢者不正後二年化及殺帝僭號王充亦於東都殺恭帝篡號鄭皆殺逆無道以亂代亂之應也十三年五月辛亥大流星如甕墜於江都占曰其下有大兵戰流血破軍殺將六月有星孛于太微五帝座色黃赤長三四尺所數日而滅占曰有亡國有殺君明年三月宇文化及等殺帝也十一月辛酉熒惑犯太微日光四散如流血占曰賊入宮主以急兵見伐又曰臣逆君明年三月化及等殺帝諸王及幸臣並被戮

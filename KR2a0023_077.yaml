body:
  text: 隋書卷七十七列傳第四十二隱逸自肇有書契綿歷百王雖時有盛衰未嘗無隱逸之士故易稱遁世無悶又曰不事王侯詩云皎皎白駒在彼空谷禮云儒有上不臣天子下不事王侯語曰舉逸民天下之人歸心焉雖出處殊途語默異用各言其志皆君子之道也洪崖兆其始箕山扇其風七人作乎周年四皓光乎漢日魏晉以降其流逾廣其大者則輕天下細萬物其小者則安苦節甘賤貧或與世同塵隨波瀾以俱逝或違時矯俗望江湖而獨往狎玩魚鳥左右琴書拾遺粒而織落毛飲石泉而蔭松柏放情宇宙之外自足懷抱之中然皆欣欣於獨善鮮汲汲於兼濟而受命哲王守文令主莫不束帛交馳蒲輪結轍奔走巖谷唯恐不逮者何哉以其道雖未弘志不可奪縱無舟楫之功終有賢貞之操足以立懦夫之志息貪競之風與夫苟得之徒不可同年共日所謂無用以為用無為而無不為者也故其人列其行以備隱逸篇云李士謙李士謙字子約趙郡平棘人也髫喪父事母以孝聞母曾嘔吐疑為中毒因跪而嘗之伯父魏岐州刺史瑒深所嗟尚每稱曰此兒吾家之顏子也年十二魏廣平王贊辟開府參軍事後丁母憂居喪骨立有姊適宋氏不勝哀而死士謙服闋捨宅為伽藍脫身而出詣學請業研精不倦遂博覽羣籍兼善天文術數齊吏部尚書辛術召署員外郎趙郡王叡舉德行皆稱疾不就和士開亦重其名將諷朝廷擢為國子祭酒士謙知而固辭得免隋有天下畢志不仕自以少孤未嘗飲酒食肉口無殺害之言至於親賓來萃輒陳樽覔對之危坐終日不倦李氏宗黨豪盛每至春秋二社必高會極歡無不醉諠亂嘗集士謙所盛饌盈前而先為設黍謂羣從曰孔子稱黍為五穀之長荀卿亦云食先黍稷古人所尚容可違乎少長肅然不敢弛惰退而相謂曰既見君子方覺吾徒之不德也士謙聞而自責曰何乃為人所疎頓至於此家富於財躬處節儉每以振施為務州里有喪事不辦者士謙輒奔走赴之隨乏供濟有兄弟分財不均至相鬩訟士謙聞而出財補其少者令與多者相埒兄弟愧懼更相推讓卒為善士有牛犯其田者士謙牽置涼處飼之過於本主望見盜刈其禾黍者默而避之其家僮嘗執盜粟者士謙慰諭之曰窮困所致義無相責遽令放之其奴嘗與鄉人董震因醉角力震扼其喉斃於手下震惶懼請罪士謙謂之曰卿本無殺心何為相謝然可遠去無為吏之所拘性寬厚皆此類也其後出粟數千石以貸鄉人值年穀不登債家無以償皆來致謝士謙曰吾家餘粟本圖振贍豈求利哉於是悉召債家為設酒食對之燔契曰債了矣幸勿為念也各令罷去明年大熟債家爭來償謙謙拒之一無所受他年又大饑多有死者士謙罄竭家資為之糜粥賴以全活者將萬計收埋骸骨所見無遺至春又出糧種分給貧乏趙郡農民德之撫其子孫曰此乃李參軍遺惠也或謂士謙曰子多陰德士謙曰所謂陰德者何猶耳鳴己獨聞之人無知者今吾所作吾子皆知何陰德之有士謙善談玄理嘗有一客在坐不信佛家應報之義以為外典無聞焉士謙喻之曰積善餘慶積惡餘殃高門待封掃墓望喪豈非休咎之應邪佛經云輪轉五道無復窮已此則賈誼所言千變萬化未始有極忽然為人之謂也佛道未東而賢者已知其然矣至若鯀為黃熊杜宇為鶗褒君為龍牛哀為獸君子為鵠小人為猿彭生為豕如意為犬黃母為黿宣武為鼈鄧艾為牛徐伯為魚鈴下為烏書生為蛇羊祜前身李氏之子此非佛家變受異形之謂邪客曰邢子才云豈有松柏後身化為樗櫟僕以為然士謙曰此不類之談也變化皆由心而作木豈有心乎客又問三教優劣士謙曰佛日也道月也儒五星也客亦不能難而止士謙平生時為詠懷詩輒毀棄其本不以示人又嘗論刑罰遺文不具其略曰帝王制法沿革不同自可損益無為頓改今之贓重者死是酷而不懲也語曰人不畏死不可以死恐之愚謂此罪宜從肉刑刖其一趾再犯者斷其右腕流刑刖去右手三指又犯者下其腕小盜宜黥又犯則落其所用三指又不悛下其腕無不止也無賴之人竄之邊裔職為亂階適所以召戎矣非求治之道也博奕淫遊盜之萌也禁而不止黥之則可有識者頗以為得治體開皇八年終於家時年六十六趙郡士女聞之莫不流涕曰我曹不死而令李參軍死乎會葬者萬餘人鄉人李景伯等以士謙道著丘園條其行狀詣尚書省請先生之諡事寢不行遂相與樹碑於墓其妻范陽盧氏亦有婦德及夫終後所有賻贈一無所受謂州里父老曰參軍平生好施今雖殞歿安可奪其志哉於是散粟五百石以賑窮乏崔廓子賾崔廓字士玄博陵安平人也父子元齊燕州司馬廓少孤貧而母賤由是不為邦族所齒初為里佐屢逢屈辱於是感激逃入山中遂博覽書籍多所通涉山東學者皆宗之既還鄉里不應辟命與趙郡李士謙為忘言之友每相往來時稱崔李及士謙死廓哭之慟為之作傳輸之秘府士謙妻盧氏寡居每有家事輒令人諮廓取定廓嘗著論言刑名之理其義甚精文多不載大業中終于家時年八十有子曰賾賾字祖濬七歲能屬文容貌短小有口才開皇初秦孝王薦之射策高第詔與諸儒定禮樂授校書郎尋轉協律郎太常卿蘇威雅重之母憂去職性至孝水漿不入口者五日徵為河南豫章二王侍讀每更日來往二王之第及河南為晉王轉記室參軍自此去豫章王重之不已遺賾書曰昔漢氏西京梁王建國平臺東苑慕義如林馬卿辭武騎之官枚乘罷弘農之守每覽史傳嘗切怪之何乃脫略官榮棲遲藩邸以今望古方知雅志彼二子者豈徒然哉足下博聞強記鉤深致遠視漢臣之三篋似涉蒙山對梁相之五車若吞雲夢吾兄欽賢重士敬愛忘疲先築郭隗之宮常置穆生之醴今者重開土宇更誓山河地方七百牢籠曲阜城兼七十包舉臨淄大啟南陽方開東閤想得奉飛蓋曳長裾藉玳筵躡珠履歌山桂之偃蹇賦池竹之檀欒其崇貴也如彼其風流也如此幸甚幸甚何樂如之高視上京有懷德祖才謝天人多慚子建書不盡意寧俟繁辭賾答曰一昨伏奉教書榮貺非心靈自失若乃理高象繫管輅思而不解事富山海郭璞注而未詳至於五色相宣八音繁會鳳鳴不足喻龍章莫之比吳札之論周頌詎盡揄揚郢客之奏陽春誰堪赴節伏惟令王殿下禀潤天潢承輝日觀雅道貴於東平文藝高於北海漢則馬遷蕭望晉則裴楷張華雞樹騰聲鵷池播美望我清塵悠然路絕祖濬燕南贅客河朔惰遊本無意於希顏豈有心於慕藺未嘗聚螢映雪懸頭刺股讀論唯取一篇披莊不過盈尺復況桑榆漸暮藜藿屢空舉燭無成穿楊盡棄但以燕求馬首薛養雞鳴謬齒鴻儀虛班驥皁挾太山而超北海比報德而非難堙崐崘以為池匹酬恩而反易忽屬周桐錫瑞唐水承家門有將相樹宜桃李真龍將下誰好有名濫吹先逃何須別聽但慈旨抑揚損上益下江海所以稱王丘陵為之不逮曹植儻預聞高論則不隕令名楊修若切在下風亦詎虧淳德無任荷戴之至謹奉啟以聞豫章得書賚米五十石幷衣服錢帛時晉邸文翰多成其手王入東宮除太子齋帥俄遷舍人及元德太子薨以疾歸于家後徵授起居舍人大業四年從駕汾陽宮次河陽鎮藍田令王曇於藍田山得一玉人長三尺四寸著大領衣冠幘奏之詔問羣臣莫有識者賾答曰謹按漢文已前未有冠幘即是文帝以來所制作也臣見魏大司農盧元明撰嵩高山廟記云有神人以玉為形像長數寸或出或隱出則令世延長伏惟陛下應天順民定鼎嵩洛岳神自見臣敢稱慶因再拜百官畢賀天子大悅賜縑二百匹從駕登太行山詔問賾曰何處有羊腸坂賾對曰臣按漢書地理志上黨壺關縣有羊腸坂帝曰不是又答曰臣按皇甫士安撰地書云太原北九十里有羊腸坂帝曰是也因謂牛弘曰崔祖濬所謂問一知二五年受詔與諸儒撰區宇圖志二百五十卷奏之帝不善之更令虞世基許善心衍為六百卷以父憂去職尋起令視事遼東之役授鷹揚長史置遼東郡縣名皆賾之議也奉詔作東征記九年除越王長史于時山東盜賊蜂起帝令撫慰高陽襄國歸首者八百餘人十二年從駕江都宇文化及之弒帝也引為著作郎稱疾不起在路發疾卒於彭城時年六十九賾與洛陽元善河東柳太原王劭吳興姚察琅邪諸葛潁信都劉焯河間劉炫相善每因休假清談竟日所著詞賦碑誌十餘萬言撰洽聞志七卷八代四科志三十卷未及施行江都傾覆咸為煨燼徐則徐則東海郯人也幼沈靜寡嗜欲受業於周弘正善三玄精於議論聲擅都邑則歎曰名者實之賓吾其為賓乎遂懷棲隱之操杖策入縉雲山後學數百人苦請教授則謝而遣之不娶妻常服巾褐陳太建時應召來憩於至真觀朞月又辭入天台山因絕穀養性所資唯松水而已雖隆冬沍寒不服綿絮太傅徐陵為之刊山立頌初在縉雲山太極真人徐君降之曰汝年出八十當為王者師然後得道也晉王廣鎮揚州知其名手書召之曰夫道得衆妙法體自然包涵二儀混成萬物人能弘道道不虛行先生履德養空宗玄齊物深明義味曉達法門悅性沖玄怡神虛白餐松餌朮棲息煙霞望赤城而待風雲遊玉堂而駕龍鳳雖復藏名台岳猶且騰實江淮藉甚嘉猷有勞寤寐欽承素道久積虛襟側席幽人夢想巖穴霜風已冷海氣將寒偃息茂林道體休悆昔商山四皓輕舉漢庭淮南八公來儀藩邸古今雖異山谷不殊市朝之隱前賢已說導凡述聖非先生而誰故遣使人往彼延請想無勞束帶賁然來思不待蒲輪去彼空谷希能屈己竚望披雲則謂門人曰吾今年八十一王來召我徐君之旨信而有徵於是遂詣揚州晉王將請受道法則辭以時日不便其後夕中命侍者取香火如平常朝禮之儀至于五更而死支體柔弱如生停留數旬顏色無變晉王下書曰天台真隱東海徐先生虛確居宗沖玄成德齊物處外檢行安身草褐蒲衣餐松餌朮棲隱靈岳五十餘年卓矣仙才飄然勝氣千尋萬頃莫測其涯寡人欽承道風久餐德素頻遣使乎遠此延屈冀得虔受上法式建良緣至止甫爾未淹旬日厭塵羽化反真靈府身體柔軟顏色不變經方所謂屍解地仙者哉誠復師禮未申而心許有在雖忘怛化猶愴于懷喪事所資隨須供給霓裳羽蓋既且騰雲空椁餘衣詎藉墳壟但杖舄猶存示同俗法宜遣使人送還天台定葬是時自江都至於天台在道多見則徒步云得放還至其舊居取經書道法分遺弟子仍令淨掃一房曰若有客至宜延之於此然後跨石梁而去不知所之須臾屍柩至方知其靈化時年八十二晉王聞而益異之賵物千段遣畫工圖其狀貌令柳為之讚曰可道非道常道無名上德不德至德無盈玄風扇矣而有先生夙鍊金液怡神玉清石髓方軟雲丹欲成言追葛稚將侶茅嬴我王遙屬爰感靈誠柱下暫啟河上精留符告信化杖飛聲永思靈迹曷用攄情時披素繪如臨赤城時有建安宋玉泉會稽孔道茂丹陽王遠知等亦行辟穀以松水自給皆為煬帝所重張文詡張文詡河東人也父琚開皇中為洹水令以清正聞有書數千卷教訓子姪皆以明經自達文詡博覽文籍特精三禮其周易詩書及春秋三傳並皆通習每好鄭玄注解以為通博其諸儒異說亦皆詳究焉高祖引致天下名儒碩學之士其房暉遠張仲讓孔籠之徒並延之於博士之位文詡時遊太學暉遠等莫不推伏之學內翕然咸共宗仰其門生多詣文詡請質凝滯文詡輒博引證據辨說無窮唯其所擇治書侍御史皇甫誕一時朝彥執弟子之禮適至南臺遽飾所乘馬就學邀屈文詡每牽馬步進意在不因人以自致也右僕射蘇威聞其名而召之與語大悅勸令從官文詡意不在仕固辭焉仁壽末學廢文詡策杖而歸灌園為業州郡頻舉皆不應命事母以孝聞每以德化人鄉黨頗移風俗嘗有人夜中竊刈其麥者見而避之盜因感悟棄麥而謝文詡慰諭之自誓不言固令持去經數年盜者向鄉人說之始為遠近所悉鄰家築牆心有不直文詡因毀舊堵以應之文詡嘗有腰疾會醫者自言善禁文詡令禁之遂為刃所傷至於頓伏牀枕醫者叩頭請罪文詡遽遣之因為其隱謂妻子曰吾昨風眩落坑所致其掩人之短皆此類也州縣以其貧素將加振賉輒辭不受每閑居無事從容長歎曰老冉冉而將至恐修名之不立以如意擊几皆有處所時人方之閔子騫原憲焉終於家年四十鄉人為立碑頌號曰張先生史臣曰古之所謂隱逸者非伏其身而不見也非閉其言而不出也非藏其智而不發也蓋以恬淡為心不皦不昧安時處順與物無私者也士謙等忘懷纓冕畢志丘園隱不違親貞不絕俗不教而勸虛往實歸愛之如父母懷之如親戚非有自然之純德其孰能至於斯乎然士謙聞譽不喜文詡見傷無慍徐則志在冥不可親疎莫能貴賤皆抱樸之士矣崔廓感於屈辱遂以肥遁見稱祖濬文籍之美足以克隆先構父子雖動靜殊方其於成名一也美哉

body:
  text: 隋書卷六十五列傳第三十周羅周羅字公布九江尋陽人也父法皓仕梁冠軍將軍始興太守通直散騎常侍南康內史臨蒸縣侯羅年十五善騎射好鷹狗任俠放蕩收聚亡命陰習兵書從祖景彥誡之曰吾世恭謹汝獨放縱難以保家若不喪身必將滅吾族羅終不改陳宣帝時以軍功授開遠將軍句容令後從大都督吳明徹與齊師戰於江陽為流矢中其左目齊師圍明徹於宿預也諸軍相顧莫有鬬心羅躍馬突進莫不披靡太僕卿蕭摩訶因而副之斬獲不可勝計進師徐州與周將梁士彥戰於彭城摩訶臨陳墮馬羅進救拔摩訶於重圍之內勇冠三軍明徹之敗也羅全衆而歸拜光遠將軍鍾離太守十一年授使持節都督霍州諸軍事平山賊十二洞除右軍將軍始安縣伯邑四百戶總管檢校揚州內外諸軍事賜金銀三千兩盡散之將士分賞驍雄陳宣帝深歎美之出為晉陵太守進爵為侯增封一千戶除太僕卿增封並前一千六百戶尋除雄信將軍使持節都督豫章十郡諸軍事豫章內史獄訟庭決不關吏手民懷其惠立碑頌德焉至德中除持節都督南川諸軍事江州司馬吳世興密奏羅甚得人心擁衆嶺表意在難測陳主惑焉蕭摩訶魯廣達等保明之外有知者或勸其反羅拒絶之軍還除太子左衛率信任逾重時參宴席陳主曰周左率武將詩每前成文士何為後也都官尚書孔範對曰周羅執筆製詩還如上馬入陳不在人後自是益見親禮出督湘州諸軍事還拜散騎常侍晉王廣之伐陳也都督巴峽緣江諸軍事以拒秦王俊軍不得渡相持踰月遇丹陽陷陳主被擒上江猶不下晉王廣遣陳主手書命之羅與諸將大臨三日放兵士散然後乃降高祖慰諭之許以富貴羅垂泣而對曰臣荷陳氏厚遇本朝淪亡無節可紀陛下所賜獲全為幸富貴榮祿非臣所望高祖甚器之賀若弼謂之曰聞公郢漢捉兵即知揚州可得王師利涉果如所量羅答曰若得與公周旋勝負未可知也其年秋拜上儀同三司鼓吹羽儀送之于宅先是陳裨將羊翔歸降于我使為鄉導位至上開府班在羅上韓擒於朝堂戲之曰不知機變立在羊翔之下能無愧乎羅答曰昔在江南久承令問謂公天下節士今日所言殊匪誠臣之論擒有愧色其年冬除豳州刺史俄轉涇州刺史母憂去職未期復起授豳州刺史並有能名十八年起遼東之役徵為水軍總管自東萊泛海趣平壤城遭風船多飄沒無功而還十九年突厥達頭可汗犯塞從楊素擊之虜衆甚盛羅白素曰賊陳未整請擊之素許焉與輕勇二十騎直衝虜陳從申至酉短兵屢接大破之進位大將軍仁壽元年為東宮右虞候率賜爵義寧郡公食邑一千五百戶俄轉右衛率煬帝即位授右武候大將軍漢王諒反詔副楊素討平之進授上大將軍其年冬帝幸洛陽陳主卒羅請一臨哭帝許之縗絰送至墓所葬還釋服而後入朝帝甚嘉尚世論稱其有禮時諒餘黨據晉絳等三州未下詔羅行絳晉呂三州諸軍事進兵圍之為流矢所中卒于師時年六十四送柩還京行數里無故輿馬自止策之不動有飄風旋繞焉絳州長史郭雅稽顙呪曰公恨小寇未平邪尋即除殄無為戀恨於是風靜馬行見者莫不悲歎其年秋七月子仲隱夢見羅曰我明日當戰其靈坐所有弓箭刀劍無故自動若人帶持之狀絳州城陷是其日也贈柱國右翊衛大將軍諡曰壯贈物千段子仲安官至上開府周法尚周法尚字德邁汝南安成人也祖靈起梁直閣將軍義陽太守廬桂二州刺史父炅定州刺史平北將軍法尚少果徑有風概好讀兵書年十八為陳始興王中兵參軍尋加伏波將軍其父卒後監定州事督父本兵數有戰功遷使持節貞毅將軍散騎常侍領齊昌郡事封山陰縣侯邑五千戶以其兄武昌縣公法僧代為定州刺史法尚與長沙王叔堅不相能叔堅言其將反陳宣帝執禁法僧發兵欲取法尚其下將吏皆勸之歸北法尚猶豫未決長史殷文則曰樂毅所以辭燕良由不獲已事勢如此請早裁之法尚遂歸于周宣帝甚優寵之拜開府順州刺史封歸義縣公邑千戶賜良馬五匹女妓五人綵物五百段加以金帶陳將樊猛濟江討之法尚遣部曲督韓明詐為背己奔于陳偽告猛曰法尚部兵不願降北人皆竊議盡欲叛還若得軍來必無鬬者自當於陳倒戈耳猛以為然引師急進法尚乃陽為畏懼自保於江曲猛陳兵挑戰法尚先伏輕舸於浦中又伏精鋭於古村之北自張旗幟迎流拒之戰數合偽退登岸投古村猛捨舟逐之法尚又疾走行數里與村北軍合復前擊猛猛退走赴船既而浦中伏舸取其舟楫建周旗幟猛於是大敗僅以身免虜八千人高祖為丞相司馬消難作亂陰遣上開府段珣率兵陽為助守因欲奪其城法尚覺其詐閉門不納珣遂圍之于時倉卒兵散在外因率吏士五百人守拒二十日外無救援自度力不能支遂拔所領棄城遁走消難虜其母弟及家纍三百人歸于陳高祖受禪拜巴州刺史破三於鐵山復從柱國王誼擊走陳寇遷衡州總管四州諸軍事改封譙郡公邑二千戶後上幸洛陽召之及引見賜金鈿酒鍾一雙綵五百段良馬十五匹奴婢三百口給鼓吹一部法尚固辭上曰公有大功於國特給鼓吹者欲令公鄉人知朕之寵公也固與之歲餘轉黃州總管上降密詔使經略江南伺候動靜及伐陳之役以行軍總管隸秦孝王率舟師三萬出于樊口陳城州刺史熊門超出師拒戰擊破之擒超於陳轉鄂州刺史尋遷永州總管安集嶺南賜縑五百段良馬五匹仍給黃州兵三千五百人為帳內陳桂州刺史錢季卿南康內史柳璿西衡州刺史鄧皓陽山太守毛爽等前後詣法尚降陳定州刺史呂子廓據山洞反法尚引兵踰嶺子廓兵衆日散與千餘人走保巖嶮其左右斬之而降賜綵五百段奴婢五十口並銀甕寶帶良馬十匹十年尋轉桂州總管仍為嶺南安撫大使後數年入朝以本官宿衛賜綵三百段米五百石絹五百匹未幾桂州人李光仕舉兵作亂令法尚與上柱國王世積討之法尚馳往桂州發嶺南兵世積出嶽州徵嶺北軍俱會于尹州光仕來逆戰擊走之世積所部多遇瘴不能進頓于衡州法尚獨討之光仕帥徑兵保白石洞法尚捕得其弟光略光度大獲家口其黨有來降附輒以妻子還之居旬日降者數千人法尚遣兵列陳以當光仕親率奇兵蔽林設伏兩陳始交法尚馳擊其柵柵中人皆走散光仕大潰追斬之賜奴婢百五十口黃金百五十兩銀百五十斤仁壽中遂州獠叛復以行軍總管討平之巂州烏蠻反攻陷州城詔令法尚便道擊之軍將至賊棄州城散走山谷間法尚捕不能得於是遣使慰諭假以官號偽班師日行二十里軍再舍潛遣人覘之知其首領盡歸柵聚飲相賀法尚選步騎數千人襲擊破之獲其渠帥數千人虜男女萬餘口賜奴婢百口物三百段蜀馬二十匹軍還檢校潞州事煬帝嗣位轉雲州刺史後三歲轉定襄太守進位金紫光祿大夫時帝幸榆林法尚朝于行宮內史令元壽言於帝曰漢武出塞旍旗千里今御營之外請分為二十四軍日別遣一軍發相去三十里旗幟相望鉦鼓相聞首尾連注千里不絶此亦出師之盛者也法尚曰不然兵亘千里動間山川卒有不虞四分五裂腹心有事首尾未知道阻且長難以相救雖是故事此乃取敗之道也帝不懌曰卿意以為如何法尚曰結為方陳四面外距六宮及百官家口並住其間若有變起當頭分抗內引奇兵出外奮擊車為璧壘重設鉤陳此與據城理亦何異若戰而捷抽騎追奔或戰不利屯營自守臣謂牢固萬全之策也帝曰善因拜左武衛將軍賜良馬一匹絹三百匹明年黔安夷向思多反殺將軍鹿願圍太守蕭造法尚與將軍李景分路討之法尚擊思多于清江破之斬首三千級還從討吐谷渾法尚別出松州道逐捕亡散至于青海賜奴婢一百口物二百段馬七十匹出為敦煌太守尋領會寧太守遼東之役以舟師指朝鮮道會楊玄感反與將軍宇文述來護兒等破之以功進右光祿大夫賜物九百段時有齊郡人王薄孟讓等舉兵為盜衆十餘萬保長白山頻戰每挫其鋭賜奴婢百口明年復臨滄海在軍疾甚謂長史崔君肅曰吾再臨滄海未能利涉時不我與將辭人世立志不果命也如何言畢而終時年五十九贈武衛大將軍諡曰僖有子六人長子紹基靈壽令少子紹範最知名李景李景字道興天水休官人也父超周應戎二州刺史景容貌奇偉膂力過人美鬚髯驍勇善射平齊之役頗有力焉授儀同三司以平尉迥進位開府賜爵平寇縣公邑千五百戶開皇九年以行軍總管從王世積伐陳陷陳有功進位上開府賜奴婢六十口物千五百段及高智慧等作亂江南復以行軍總管從楊素擊之別平倉嶺還授鄜州刺史十七年遼東之役為馬軍總管及還配事漢王高祖奇其壯武使袒而觀之曰卿相表當位極人臣尋從史萬歲擊突厥於大斤山別路邀賊大破之後與上明公楊紀送義成公主於突厥至安遇突厥來寇時代州總管韓洪為虜所敗景率所領數百人援之力戰三日殺虜甚衆賜物三千段授韓州刺史以事王故不之官仁壽中檢校代州總管漢王諒作亂並州景發兵拒之諒遣劉嵩襲景戰於城東升樓射之無不應弦而倒選壯士擊之斬獲略盡諒復遣嵐州刺史喬鍾葵率徑勇三萬攻之景戰士不過數千加以城池不固為賊衝擊崩毀相繼景且戰且築士卒皆殊死鬬屢挫賊鋒司馬馮孝慈司法參軍呂玉並驍勇善戰儀同三司侯莫陳乂多謀畫工拒守之術景知將士可用其後推誠於此三人無所關預唯在閣持重時出撫循而已月餘朔州總管楊義臣以兵來援合擊大破之先是景府內井中甃上生花如蓮並有龍見時變為鐵馬甲士又有神人長數丈見於城下其迹長四尺五寸景問巫對曰此是不祥之物來食人血耳景大怒推出之旬日而兵至死者數萬焉景尋被徵入京進位柱國拜右武衛大將軍賜縑九千匹女樂一部加以珍物景智略非所長而忠直為時所許帝甚信之擊叛蠻向思多破之賜奴婢八十口明年擊吐谷渾於青海破之進位光祿大夫賜奴婢六十口縑二千匹五年車駕西巡至天水景獻食於帝帝曰公主人也賜坐齊王暕之上至隴川宮帝將大獵景與左武衛大將軍郭衍俱有難言為人所奏帝大怒令左右螥之竟以坐免歲餘復位與宇文述等參掌選舉明年攻高麗武厲城破之賜爵苑丘侯物一千段八年出渾彌道九年復出遼東及旋師以景為殿高麗追兵大至景擊走之賚物三千段進爵滑國公楊玄感之反也朝臣子弟多預焉而景獨無關涉帝曰公誠直天然我之梁棟也賜以美女帝每呼李大將軍而不名其見重如此十二年帝令景營遼東戰具於北平賜御馬一匹名師子會幽州賊楊仲緒率衆萬餘人來攻北平景督兵擊破之斬仲緒于時盜賊蜂起道路隔絶景遂召募以備不虞武賁郎將羅藝與景有隙遂誣景將反帝遣其子慰諭之曰縱人言公窺天闕據京師吾無疑也後為高開道所圍獨守孤城外無聲援歲餘士卒患腳腫而死者十將六七景撫循之一無離叛遼東軍資多在其所粟帛山積既逢離亂景無所私焉及帝崩於江都遼西太守鄧皓率兵救之遂歸柳城後將還幽州在道遇賊見害契丹靺鞨素感其恩聞之莫不流涕幽燕人士于今傷惜之有子世謨慕容三藏慕容三藏燕人也父紹宗齊尚書左僕射東南道大行臺三藏幼聰敏多武略頗有父風仕齊釋褐太尉府參軍事尋遷備身都督武平初襲爵燕郡公邑八百戶其年敗周師於孝水又破陳師於壽陽轉武衛將軍又敗周師於河陽授武衛大將軍又轉右衛將軍別封范陽縣公食邑千戶周師入鄴也齊後主失守東遁委三藏等留守鄴宮齊之王公以下皆降三藏猶率麾下抗拒周師及齊平武帝引見恩禮甚厚詔曰三藏父子誠節著聞宜加榮秩授開府儀同大將軍其年稽胡叛令三藏討平之開皇元年授吳州刺史九年奉詔持節涼州道黜陟大使其年嶺南酋長王仲宣反圍廣州詔令柱國襄陽公韋洸為行軍總管三藏為副至廣州與賊交戰洸為流矢所中卒詔令三藏檢校廣州道行軍事十年賊衆四面攻圍三藏固守月餘城中糧少矢盡三藏以為不可持久遂自率驍鋭夜出突圍擊之賊衆敗散廣州獲全以功授大將軍賜奴婢百口加以金銀雜物十二年授廓州刺史州極西界與吐谷渾鄰接姦宄犯法者皆遷配彼州流人多有逃逸及三藏至招納綏撫百姓愛悅繈負日至吏民歌頌之高祖聞其能屢有勞問其年當州畜産繁孳獲醍醐奉獻賚物百段十三年州界連雲山響稱萬年者三詔頒郡國仍遣使醮於山所其日景雲浮於上雉間兔馴壇側使還具以聞上大悅十五年授疊州總管黨項羌時有翻叛三藏隨便討平之部內夷夏咸得安輯仁壽元年改封河內縣男大業元年授和州刺史三年轉任淮南郡太守所在有惠政其年改授金紫光祿大夫大業七年卒三藏從子遐為澶水丞漢王反抗節不從以誠節聞薛世雄薛世雄字世英本河東汾陰人也其先寓居關中父回字道弘仕周官至涇州刺史開皇初封舞陰郡公領漕渠監以年老致事終於家世雄為兒童時與羣輩遊戲輒畫地為城郭令諸兒為攻守之勢有不從令者世雄輒撻之諸兒畏憚莫不齊整其父見而奇之謂人曰此兒當興吾家矣年十七從周武帝平齊以功拜帥都督開皇時數有戰功纍遷儀同三司右親衛車騎將軍煬帝嗣位番禺夷獠相聚為亂詔世雄討平之遷右監門郎將從帝征吐谷渾進位通議大夫世雄性廉謹凡所行軍破敵之處秋毫無犯帝由是嘉之帝嘗從容謂羣臣曰我欲舉好人未知諸君識不羣臣咸曰臣等何能測聖心帝曰我欲舉者薛世雄羣臣皆稱善帝復曰世雄廉正節概有古人之風於是超拜右翊衛將軍歲餘以世雄為玉門道行軍大將與突厥啓民可汗連兵擊伊吾師次玉門啓民可汗背約兵不至世雄孤軍度磧伊吾初謂隋軍不能至皆不設備及聞世雄兵已度磧大懼請降詣軍門上牛酒世雄遂於漢舊伊吾城東築城號新伊吾留銀青光祿大夫王威以甲卒千餘人戍之而還天子大悅進位正議大夫賜物二千段遼東之役以世雄為沃沮道軍將與宇文述同敗績於平壤還次白石山為賊所圍百餘重四面矢下如雨世雄以羸師為方陳選徑騎二百先犯之賊稍却因而縱擊遂破之而還所亡失多竟坐免明年帝復征遼東拜右候衛將軍兵指踏頓道軍至烏骨城會楊玄感作亂班師帝至柳城以世雄為東北道大使行燕郡太守鎮懷遠于時突厥頗為寇盜緣邊諸郡多苦之詔世雄發十二郡士馬巡塞而還十年復從帝至遼東遷左禦衛大將軍仍領涿郡留守未幾李密逼東都中原騷動詔世雄率幽薊精兵將擊之軍次河間營於郡城南河間諸縣並集兵依世雄大軍為營欲討竇建德建德將家口遁自選精鋭數百夜來襲之先犯河間兵潰奔世雄營時遇氛霧晦冥莫相辨識軍不得成列皆騰柵而走於是大敗世雄與左右數十騎遁入河間城慚恚發病歸於涿郡未幾而卒時年六十三有子萬述萬淑萬鈞萬徹並以驍武知名王仁恭王仁恭字元實天水上邽人也祖建周鳳州刺史父猛鄯州刺史仁恭少剛毅修謹工騎射弱冠州補主簿秦孝王引為記室轉長道令遷車騎將軍從楊素擊突厥於靈武以功拜上開府賜物三千段以驃騎將軍典蜀王軍事山獠作亂蜀王命仁恭討破之賜奴婢三百口及蜀王以罪廢官屬多罹其患上以仁恭素質直置而不問煬帝嗣位漢王諒舉兵反從楊素擊平之以功進位大將軍拜呂州刺史賜帛四千匹女妓十人歲餘轉衛州刺史尋改為汲郡太守有能名徵入朝帝呼上殿勞勉之賜雜綵六百段良馬二匹遷信都太守汲郡吏民扣馬號哭於道數日不得出境其得人情如此遼東之役以仁恭為軍將及帝班師仁恭為殿遇賊擊走之進授左光祿大夫賜絹六千段馬四十匹明年復以軍將指扶餘道帝謂之曰往者諸軍多不利公獨以一軍破賊古人云敗軍之將不可以言勇諸將其可任乎今委公為前軍當副所望也賜良馬十匹黃金百兩仁恭遂進軍至新城賊數萬背城結陳仁恭率徑騎一千擊破之賊嬰城拒守仁恭四面攻圍帝聞而大悅遣舍人詣軍勞問賜以珍物進授光祿大夫賜絹五千匹會楊玄感作亂其兄子武賁郎將仲伯預焉仁恭由是坐免尋而突厥屢為寇患帝以仁恭宿將頻有戰功詔復本官領馬邑太守其年始畢可汗率騎數萬來寇馬邑復令二特勤將兵南過時郡兵不滿三千仁恭簡精鋭逆擊之其二特勤衆亦潰仁恭縱兵乘之獲數千級並斬二特勤帝大悅賜縑三千匹其後突厥復入定襄仁恭率兵四千掩擊斬千餘級大獲六畜而歸于時天下大亂百姓飢餒道路隔絶仁恭頗改舊節受納貨賄又不敢輒開倉廩賑恤百姓其麾下校尉劉武周與仁恭侍婢姦通恐事泄將為亂每宣言郡中曰父老妻子凍餒填委溝壑而王府君閉倉不救百姓是何理也以此激怒衆吏民頗怨之其後仁恭正坐廳事武周率其徒數十人大呼而入因害之時年六十武周於是開倉賑給郡內皆從之自稱天子署置百官轉攻傍郡權武權武字武弄天水人也祖超魏秦州刺史父襲慶周開府從武元皇帝與齊師戰于並州被圍百餘重襲慶力戰矢盡短兵接戰殺傷甚衆刀矟皆折脫胄擲地向賊大罵曰何不來斫頭也賊遂殺之武以忠臣子起家拜開府襲爵齊郡公邑千二百戶武少果徑勇力絶人能重甲上馬嘗倒投於井未及泉復躍而出其拳捷如此從王謙破齊服龍等五城增邑八百戶平齊之役攻陷卲州別下六城以功增邑三百戶宣帝時拜徑捷左旅上大夫進位上開府高祖為丞相引置左右及受禪增邑五百戶後六歲拜淅州刺史伐陳之役以行軍總管從晉王出六合還拜豫州刺史在職數年以創業之舊進位大將軍檢校潭州總管其年桂州人李世賢作亂武以行軍總管與武候大將軍虞慶則擊平之慶則以罪誅功竟不録復還于州多造金帶遺嶺南酋領其人復答以寶物武皆納之由是致富後武晚生一子與親客宴集酒酣遂擅赦所部內獄囚武常以南越邊遠治從其俗務適便宜不依律令而每言當今法急官不可為上令有司案其事皆驗上大怒命斬之武於獄中上書言其父為武元皇帝戰死於馬前以此求哀由是除名為民仁壽中復拜大將軍封邑如舊未幾授太子右衛率煬帝即位拜右武衛大將軍坐事免授桂州刺史俄轉始安太守久之徵拜右屯衛大將軍尋坐事除名卒于家有子弘吐萬緒吐萬緒字長緒代郡鮮卑人也父通周郢州刺史緒少有武略在周起家撫軍將軍襲爵元壽縣公數從征伐纍遷大將軍少司武高祖受禪拜襄州總管進封穀城郡公邑二千五百戶尋轉青州總管頗有治名歲餘突厥寇邊朝廷以緒有威略徙為朔州總管甚為北夷所憚其後高祖潛有吞陳之志轉徐州總管令修戰具及大舉濟江以緒領行軍總管與西河公紇豆陵洪景屯兵江北及陳平拜夏州總管晉王廣之在藩也頗見親遇及為太子引為左虞候率煬帝嗣位漢王諒時鎮並州帝恐其為變拜緒晉絳二州刺史馳傳之官緒未出關諒已遣兵據蒲坂斷河橋緒不得進詔緒率兵從楊素擊破之拜左武候將軍大業初轉光祿卿賀若弼之遇讒也引緒為證緒明其無罪由是免官歲餘守東平太守未幾帝幸江都路經其境迎謁道傍帝命升龍舟緒因頓首陳謝往事帝大悅拜金紫光祿大夫太守如故遼東之役請為先鋒帝嘉之拜左屯衛大將軍率馬步數萬指蓋馬道及班師留鎮懷遠進位左光祿大夫時劉元進作亂江南以兵攻潤州帝徵緒討之緒率衆至楊子津元進自茅浦將渡江緒勒兵擊走緒因濟江背水為柵明旦元進來攻又大挫之賊解潤州圍而去緒進屯曲阿元進復結柵拒緒挑之元進出戰陳未整緒以騎突之賊衆遂潰赴江水而死者數萬元進挺身夜遁歸保其壘偽署僕射朱燮管崇等屯於毗陵連營百餘里緒乘勢進擊復破之賊退保黃山緒進軍圍之賊窮蹙請降元進朱燮僅以身免於陳斬管崇及其將軍陸顗等五千餘人收其子女三萬餘口送江都宮進解會稽圍元進復據建安帝令進討之緒以士卒疲敝請息甲待至來春帝不悅密令求緒罪失有司奏緒怯懦違詔於是除名為民配防建安尋有詔徵詣行在所緒鬱鬱不得志還至永嘉發疾而卒董純董純字德厚隴西成紀人也祖和魏太子左衛率父升周柱國純少有膂力便弓馬在周仕歷司御上士典馭下大夫封固始縣男邑二百戶從武帝平齊以功拜儀同進爵大興縣侯增邑通前八百戶高祖受禪進爵漢曲縣公纍遷驃騎將軍後以軍功進位上開府開皇末以勞舊擢拜左衛將軍尋改封順政縣公漢王諒作亂並州以純為行軍總管河北道安撫副使從楊素擊平之以功拜柱國進爵為郡公增邑二千戶轉左備身將軍賜女妓十人縑綵五千匹數年轉左驍衛將軍彭城留守齊王暕之得罪也純坐與交通帝庭譴之曰汝階緣宿衛以至大官何乃附傍吾兒欲相離間也純曰臣本微賤下才過蒙奬擢先帝察臣小心寵踰涯分陛下重加收採位至將軍欲竭餘年報國恩耳比數詣齊王者徒以先帝先后往在仁壽宮置元德太子及齊王於膝上謂臣曰汝好看此二兒勿忘吾言也臣奉詔之後每於休暇出入未嘗不詣王所臣誠不敢忘先帝之言于時陛下亦侍先帝之側帝改容曰誠有斯旨於是捨之後數日出為汶山太守歲餘突厥寇邊朝廷以純宿將轉為榆林太守虜有至境純輒擊却之會彭城賊帥張大彪宗世模等衆至數萬保懸薄山寇掠徐兗帝令純討之純初閉營不與戰賊屢挑之不出賊以純為怯不設備縱兵大掠純選精鋭擊之合戰於昌慮大破之斬首萬餘級築為京觀賊魏騏驎衆萬餘人據單父純進擊又破之及帝重征遼東復以純為彭城留守東海賊彭孝才衆數千掠懷仁縣轉入沂水保五不及山純以精兵擊之擒孝才於陳車裂之餘黨各散時百姓思亂盜賊日益純雖頻戰克捷所在蜂起有人譖純怯懦不能平賊帝大怒遣使鎖純詣東都有司見帝怒甚遂希旨致純死罪竟伏誅趙才趙才字孝才張掖酒泉人也祖隗魏銀青光祿大夫樂浪太守父壽周順政太守才少驍武便弓馬性粗悍無威儀周世為輿正上士高祖受禪屢以軍功遷上儀同三司配事晉王及王為太子拜右虞候率煬帝即位轉左備身驃騎後遷右驍衛將軍帝以才藩邸舊臣漸見親待才亦恪勤匪懈所在有聲歲餘轉右候衛將軍從征吐谷渾以為行軍總管率衛尉卿劉權兵部侍郎明雅等出合河道與賊相遇擊破之以功進位金紫光祿大夫及遼東之役再出碣石道還授左候衛將軍俄遷右候衛大將軍時帝每有巡幸才為斥候肅遏姦非無所回避在塗遇公卿妻子有違禁者才輒醜言大罵多所援及時人雖患其不遜然才守正無如之何十年駕幸汾陽宮以才留守東都十二年帝在洛陽將幸江都才見四海土崩恐為社稷之患自以荷恩深重無容坐看亡敗於是入諫曰今百姓疲勞府藏空竭盜賊蜂起禁令不行願陛下還京師安兆庶臣雖愚蔽敢以死請帝大怒以才屬吏旬日帝意頗解乃令出之帝遂幸江都待遇踰昵時江都糧盡將士離心內史侍郎虞世基祕書監袁充等多勸帝幸丹陽帝廷議其事才極陳入京之策世基盛言渡江之便帝默然無言才與世基相忿而出宇文化及弒逆之際才時在苑北化及遣驍果席德方矯詔追之才聞詔而出德方命其徒執之以詣化及化及謂才曰今日之事祗得如此幸勿為懷才默然不對化及忿才無言將殺之三日乃釋以本官從事鬱鬱不得志才嘗對化及宴飲請勸其同謀逆者一十八人楊士覽等酒化及許之才執杯曰十八人止可一度作勿復餘處更為諸人默然不對行至聊城遇疾俄而化及為竇建德所破才復見虜心彌不平數日而卒時年七十三仁壽大業間有蘭興浴賀蘭蕃俱為武候將軍剛嚴正直不避強禦咸以稱職知名史臣曰羅法尚李景世雄慕容三藏並以驍武之姿當有事之日致茲富貴自取之也仁恭初在汲郡以清能顯達後居馬邑以貪吝敗亡鮮克有終惜矣吐萬緒董純各以立效當年取斯高秩緒請息兵見責純遭譖毀被誅大業之季盜可盡乎淫刑暴逞能不及焉趙才雖人而無儀志在強直固拒世基之議可謂不苟同矣權武素無行檢不拘刑憲終取黜辱宜哉

body:
  text: 隋書卷四十七列傳第十二韋世康弟洸藝沖從父弟壽韋世康京兆杜陵人也世為關右著姓祖旭魏南幽州刺史父敻隱居不仕魏周二代十徵不出號為逍遙公世康幼而沉敏有器度年十歲州辟主簿在魏弱冠為直寢封漢安縣公尚周文帝女襄樂公主授儀同三司後仕周自典祠下大夫歷沔硤二州刺史從武帝平齊授司州總管長史于時東夏初定百姓未安世康綏撫之士民胥悅歲餘入為民部中大夫進位上開府轉司會中大夫尉迥之作亂也高祖憂之謂世康曰汾絳舊是周齊分界因此亂階恐生搖動今以委公善為吾守因授絳州刺史以雅望鎮之闔境清肅世康性恬素好古不以得喪干懷在州嘗慨然有止足之志與子弟書曰吾生因緒餘夙霑纓辨驅馳不已四紀於茲亟登袞命頻涖方嶽志除三惑心慎四知以不貪而為寶處膏脂而莫潤如斯之事頗為時悉今耄雖未及壯年已謝霜早梧楸風先蒲柳眼暗更劇不見細書足疾彌增非可趨走祿豈須多防滿則退年不待暮有疾便辭況娘春秋已高溫清宜奉晨昏有闕罪在我躬今世穆世文並從戎役吾與世沖復嬰遠任陟岵瞻望此情彌切桓山之悲倍深常戀意欲上聞乞遵養禮未訪汝等故遣此及興言遠慕感咽難勝諸弟報以事恐難遂於是乃止在任數年有惠政奏課連最擢為禮部尚書世康寡嗜欲不慕貴勢未嘗以位望矜物聞人之善若己有之亦不顯人過咎以求名譽尋進爵上庸郡公加邑至二千五百戶其年轉吏部尚書餘官如故四年丁母憂去職未期起令視事世康固請乞終私制上不許世康之在吏部選用平允請托不行開皇七年將事江南議重方鎮拜襄州刺史坐事免未幾授安州總管尋遷為信州總管十三年入朝復拜吏部尚書前後十餘年間多所進拔朝廷稱為廉平嘗因休暇謂子弟曰吾聞功遂身退古人常道今年將耳順志在懸車汝輩以為云何子福嗣答曰大人澡身浴德名立官成盈滿之誡先哲所重欲追蹤二疏伏奉尊命後因侍宴世康再拜陳讓曰臣無尺寸之功位亞台鉉今伏馬齒臷不益明時恐先朝露無以塞責願乞骸骨退避賢能上曰朕夙夜庶幾求賢若渴冀與公共治天下以致太平今之所請深乖本望縱令筋骨衰謝猶屈公臥治一隅於是出拜荊州總管時天下唯置四大總管並揚益三州並親王臨統唯荊州委於世康時論以為美世康為政簡靜百姓愛悅合境無訟十七年卒于州時年六十七上聞而痛惜之贈賻甚厚贈大將軍諡曰文世康性孝友初以諸弟位並隆貴獨季弟世約宦途不達共推父時田宅盡以與之世多其義長子福子官至司隸別駕次子福嗣仕至內史舍人後以罪黜楊玄感之作亂也以兵逼東都福嗣從衛玄戰於城北軍敗為玄感所擒令作文檄辭甚不遜尋背玄感還東都帝銜之不已車裂於高陽少子福奬通事舍人在東都與玄感戰沒洸字世穆性剛毅有器幹少便弓馬仕周釋褐直寢上士數從征伐纍遷開府賜爵衛國縣公邑千二百戶高祖為丞相從季父孝寬擊尉迥於相州以功拜柱國進封襄陽郡公邑二千戶時突厥寇邊皇太子屯咸陽令洸統兵出原州道與虜相遇擊破之尋拜江陵總管未幾以母疾徵還俄拜安州總管伐陳之役領行軍總管及陳平拜江州總管率步騎二萬略定九江陳豫章太守徐璒據郡持兩端洸遣開府呂昂長史馮世基以兵相繼而進既至城下璒偽降其夜率所部二千人襲擊昂昂與世基合擊大破之擒璒於陳高梁女子洗氏率衆迎洸遂進圖嶺南上遺洸書曰公鴻勳大業名高望重率將戎旅撫慰彼方風行電掃咸應稽服若使干戈不用兆庶獲安方副朕懷是公之力至廣州説陳渝州都督王猛下之嶺表皆定上聞而大悅許以便宜從事洸所綏集二十四州拜廣州總管歲餘番禺夷王仲宣聚衆為亂以兵圍洸洸勒兵拒之中流矢而卒贈上柱國賜綿絹萬段諡曰敬子協嗣協字欽仁好學有雅量起家著作佐郎後轉祕書郎開皇中其父在廣州有功上令協齎詔書勞問未至而父卒上以其父身死王事拜協柱國後歷定息秦三州刺史皆有能名卒官藝字世文少受業國子周武帝時數以軍功致位上儀同賜爵修武縣侯邑八百戶授左旅下大夫出為魏郡太守及高祖為丞相尉迥陰圖不軌朝廷微知之遣藝季父孝寬馳往代迥孝寬將至鄴因詐病止傳舍從迥求藥以察其變迥遣藝迎孝寬孝寬問迥所為藝黨於迥不以實答孝寬怒將斬之藝懼乃言迥反狀孝寬於是將藝西遁每至亭驛輒盡驅傳馬而去復謂驛司曰蜀公將至宜速具酒食迥尋遣騎追孝寬追人至驛輒逢盛饌又無馬遂遲留不進孝寬與藝由是得免高祖以孝寬故弗問藝之罪加授上開府即從孝寬擊迥及破尉惇平相州皆有力焉以功進位上大將軍改封武威縣公邑千戶以修武縣侯別封一子高祖受禪進封魏興郡公歲餘拜齊州刺史為政清簡士庶懷惠在職數年遷營州總管藝容貌瓌偉每夷狄參謁必整儀衛盛服以見之獨坐滿一榻番人畏懼莫敢仰視而大治産業與北夷貿易家資巨萬頗為清論所譏開皇十五年卒官時年五十八諡曰懷沖字世沖少以名家子在周釋褐衛公府禮曹參軍後從大將軍元定渡江伐陳為陳人所虜周武帝以幣贖而還之帝復令沖以馬千匹使於陳以贖開府賀拔華等五十人及元定之柩而還沖有辭辨奉使稱旨纍遷少御伯下大夫加上儀同于時稽胡屢為寇亂沖自請安集之因拜汾州刺史高祖踐阼徵為兼散騎常侍進位開府賜爵安固縣侯歲餘發南汾州胡千餘人北築長城在塗皆亡上呼沖問計沖曰夷狄之性易為反覆皆由牧宰不稱之所致也臣請以理綏靜可不勞兵而定上然之因命沖綏懷叛者月餘皆至並赴長城上下書勞勉之尋拜石州刺史甚得諸胡歡心以母憂去職俄而起為南寧州總管持節撫慰復遣柱國王長述以兵繼進沖上表固讓詔曰西南夷裔屢有生梗每相殘賊朕甚愍之已命戎徒清撫邊服以開府器幹堪濟識略英遠軍旅事重故以相任知在艱疚日月未多金革奪情蓋有通式宜自抑割即膺往旨沖既至南寧渠帥爨震及西爨首領皆詣府參謁上大悅下詔褒揚之其兄子伯仁隨沖在府掠人之妻士卒縱暴邊人失望上聞而大怒令蜀王秀治其事益州長史元巖性方正案沖無所寬貸沖竟坐免其弟太子洗馬世約譖巖於皇太子上謂太子曰古人有沽酒酸而不售者為噬犬耳今何用世約乎適纍汝也世約遂除名後數載今沖檢校括州事時東陽賊帥陶子定吳州賊帥羅慧方並聚衆為亂攻圍婺州永康烏程諸縣沖率兵擊破之改封義豐縣侯檢校泉州事尋拜營州總管沖容貌都雅寬厚得衆心懷撫靺鞨契丹皆能致其死力奚霫畏懼朝貢相續高麗嘗入寇沖率兵擊走之仁壽中高祖為豫章王暕納沖女為妃徵拜民部尚書未幾卒時年六十六少子挺最知名壽字世齡父孝寬周上柱國鄖國公壽在周以貴公子早有令譽為右侍上士遷千牛備身趙王為雍州牧引為主簿尋遷少御伯武帝親征高氏拜京兆尹委以後事以父軍功賜爵永安縣侯邑八百戶高祖為丞相以其父平尉迥拜壽儀同三司進封滑國公邑五千戶俄以父喪去職高祖受禪起令視事尋遷毛二州刺史頗有治名開皇十年以疾徵還卒于家時年四十二諡曰定仁壽中高祖為晉王昭納其女為妃以其子保巒嗣壽弟霽位至太常少卿安邑縣伯津位至內史侍郎判民部尚書事世康從父弟操字元節剛簡有風概仕周致位上開府光州刺史高祖為丞相以平尉迥功進位柱國封平桑郡公歷青荊二州總管卒官諡曰靜柳機子述機弟旦肅從弟雄亮從子謇之族兄昂昂子調柳機字匡時河東解人也父慶魏尚書左僕射機偉儀容有器局頗涉經史年十九周武帝時為魯公引為記室及帝嗣位自宣納上士纍遷少納言太子宮尹封平齊縣公從帝平齊拜開府轉司宗中大夫宣帝時遷御正上大夫機見帝失德屢諫不聽恐禍及己託於鄭譯陰求出外於是拜華州刺史及高祖作相徵還京師時周代舊臣皆勸禪讓機獨義形於色無所陳請俄拜衛州刺史及踐阼進爵建安郡公邑二千四百戶徵為納言機性寬簡有雅望然當近侍無所損益又好飲酒不親細務在職數年復出為華州刺史奉詔每月朝見尋轉冀州刺史後徵入朝以其子述尚蘭陵公主禮遇益隆初機在周與族人文城公昂俱歷顯要及此機昂並為外職楊素時為納言方用事因上賜宴素戲機曰二柳俱摧孤楊獨聳坐者歡笑機竟無言未幾還州前後作牧俱稱寬惠後數年以疾徵還京師卒於家時年五十六贈大將軍青州刺史諡曰簡子述嗣柳述字業隆性明敏有幹略頗涉文藝少以父蔭為太子親衛後以尚主之故拜開府儀同三司內史侍郎上於諸壻中特所寵敬歲餘判兵部尚書事丁父艱去職未幾起攝給事黃門侍郎事襲爵建安郡公仁壽中判吏部尚書事述雖職務修理為當時所稱然不達大體暴於馭下又怙寵驕豪無所降屈楊素時稱貴幸朝臣莫不讋憚述每陵侮之數於上前面折素短判事有不合素意素或令述改之輒謂將命者曰語僕射道尚書不肯素由是銜之俄而楊素亦被疏忌不知省務述任寄踰重拜兵部尚書參掌機密述自以無功可紀過叨匪服抗表陳讓上許之令攝兵部尚書事上於仁壽宮寢疾述與楊素黃門侍郎元巖等侍疾宮中時皇太子無禮於陳貴人上知而大怒因令述召房陵王述與元巖出外作勑書楊素聞之與皇太子協謀便矯詔執述巖二人持以屬吏及煬帝嗣位述竟坐除名與公主離絶徙述于龍川郡公主請與述同徙帝不聽事見列女傳述在龍川數年復徙寧越遇瘴癘而死時年三十九旦字匡德工騎射頗涉書籍起家周左侍上士纍遷兵部下大夫頃之益州總管王謙起逆拜為行軍長史從梁睿討平之以功授儀同三司開皇元年加授開府封新城縣男遷授掌設驃騎歷羅淅魯三州刺史並有能名大業初拜龍川太守民居山洞好相攻擊旦為開設學校大變其風帝聞而善之下詔褒美四年徵為太常少卿攝判黃門侍郎事卒官年六十一子燮官至河內掾肅字匡仁少聰敏間於占對起家周齊王文學武帝見而異之召拜宣納上士高祖作相引為賓曹參軍開皇初授太子洗馬陳使謝泉來聘以才學見稱詔肅宴接時論稱其華辨轉太子內舍人遷太子僕太子廢坐除名為民大業中帝與段達語及庶人罪惡之狀達云柳肅在宮大見疏斥帝問其故答曰學士劉臻嘗進章仇太翼於宮中為巫蠱事肅知而諫曰殿下帝之冢子位當儲二誡在不孝無患見疑劉臻書生鼓搖唇舌適足以相誑誤願殿下勿納之庶人不懌他日謂臻曰汝何故漏泄使柳肅知之令面折我自是後言皆不用帝曰肅橫除名非其罪也召守禮部侍郎轉工部侍郎大見親任每行幸遼東常委之於涿郡留守十一年卒時年六十二雄亮字信誠父檜仕周華陽太守遇黃衆寶作亂攻陷華陽檜為賊所害雄亮時年十四哀毀過禮陰有復讎之志武帝時衆寶率其所部歸於長安帝待之甚厚雄亮手斬衆寶於城中請罪闕下帝特原之尋治梁州總管記室遷湖城令纍遷內史中大夫賜爵汝陽縣子司馬消難作亂江北高祖令雄亮聘于陳以結鄰好及還會高祖受禪拜尚書考功侍郎尋遷給事黃門侍郎尚書省凡有奏事雄亮多所駁正深為公卿所憚俄以本官檢校太子左庶子進爵為伯秦王俊之鎮隴右也出為秦州總管府司馬領山南道行臺左丞卒官年五十一有子贊謇之字公正父蔡年周順州刺史謇之身長七尺五寸儀容甚偉風神爽亮進止可觀為童兒時周齊王憲嘗遇謇之於塗異而與語大奇之因奏入國子以明經擢第拜宗師中士尋轉守廟下士武帝嘗有事太廟謇之讀祝文音韻清雅觀者屬目帝善之擢為宣納上士及高祖作相引為田曹參軍仍咨典籤事開皇初拜通事舍人尋遷內史舍人歷兵部司勳二曹侍郎朝廷以謇之有雅望善談謔又飲酒至石不亂由是每梁陳使至輒令謇之接對後遷光祿少卿出入十餘年每參掌敷奏會吐谷渾來降朝廷以宗女光化公主妻之以謇之兼散騎常侍送公主於西域俄而突厥啓民可汗求結和親復令謇之送義成公主於突厥謇之前後奉使得二國所贈馬千餘匹雜物稱是皆散之宗族家無餘財仁壽中出為肅州刺史尋轉息州刺史俱有惠政後二歲以母憂去職煬帝踐阼復拜光祿少卿大業初啓民可汗自以內附遂畜牧於定襄馬邑間帝使謇之諭令出塞及還奏事稱旨拜黃門侍郎時元德太子初薨朝野注望皆以齊王當立帝方重王府之選大業三年車駕還京師拜為齊王長史帝法服臨軒備儀衛命齊王立於西朝堂之前北面遣吏部尚書牛弘內史令楊約左衛大將軍宇文述等從殿廷引謇之詣齊王所西面立牛弘宣勑謂齊王曰我昔階緣恩寵啓封晉陽出藩之初時年十二先帝立我於西朝堂乃令高熲虞慶則元旻等從內送王子相於我于時誡我曰以汝幼沖未更世事今令子相作輔於汝事無大小皆可委之無得昵近小人疏遠子相若從我言者有益於社稷成立汝名行如不用此言唯國及身敗無日矣吾受勑之後奉以周旋不敢失墜微子相之力吾無今日矣若與謇之從事一如子相也又勑謇之曰今以卿作輔於齊善思匡救之理副朕所望若齊王德業修備富貴自當鍾卿一門若有不善罪亦相及時齊王正擅寵左右放縱喬令則之徒深見昵狎謇之雖知其罪失不能匡正及王得罪謇之竟坐除名帝幸遼東召謇之檢校燕郡事及帝班師至燕郡坐供頓不給配戍嶺南卒於洭口時年六十子威明昂字千里父敏有高名好禮篤學治家如官仕周歷職清顯開皇初為太子太保昂有器識幹局過人周武帝時為大內史賜爵文城郡公致位開府當塗用事百僚皆出其下宣帝嗣位稍被疏遠然不離本職及高祖為丞相深自結納高祖大悅之以為大宗伯昂受拜之日遂得偏風不能視事高祖受禪昂疾愈加上開府拜潞州刺史昂見天下無事可以勸學行禮因上表曰臣聞帝王受命建學制禮故能移既往之風成惟新之俗自魏道將謝分割九區關右山東久為戰國各逞權詐俱殉干戈賦役繁重刑政嚴急蓋救焚拯溺無暇從容非朝野之願以至於此晚世因循遂成希慕俗化澆敝流宕忘反自非天然上哲挺生於時則儒雅之道經禮之制衣冠民庶莫肯用心世事所以未清軌物由茲而壞伏惟陛下稟靈上帝受命昊天合三陽之期膺千祀之運往者周室頽毀區宇沸騰聖策風行神謀電發端坐廊廟蕩滌萬方俯順幽明君臨四海擇萬古之典無善不為改百王之弊無惡不盡至若因情緣義為其節文故以三百三千事高前代然下土黎獻尚未盡行臣謬蒙奬策從政藩部人庶軌儀實見多闕儒風以墜禮教猶微是知百姓之心未能頓變仰惟深思遠慮情念下民漸被以儉使至於道臣恐業淹事緩動延年世若行禮勸學道教相催必當靡然向風不遠而就家知禮節人識義方比屋可封輒謂非遠上覽而善之因下詔曰建國重道莫先於學尊主庇民莫先於禮自魏氏不競周齊抗衡分四海之民鬬二邦之力遞為強弱多歷年所務權詐而薄儒雅重干戈而輕俎豆民不見德唯爭是聞朝野以機巧為師文吏用深刻為法風澆俗弊化之然也雖復建立庠序兼啓黌孰業非時貴道亦不行其間服膺儒術蓋有之矣彼衆我寡未能移俗然其維持名教奬飾彝倫微相弘益賴斯而已王者承天休咎隨化有禮則祥瑞必降無禮則妖孽興起人稟五常性靈不一有禮則陰陽合德無禮則禽獸其心治國立身非禮不可朕受命於天財成萬物去華夷之亂求風化之宜戒奢崇儉率先百辟輕徭薄賦冀以寬弘而積習生常未能懲革閭閻士庶吉凶之禮動悉乖方不依制度執憲之職似塞耳而無聞蒞民之官猶蔽目而不察宣揚朝化其若是乎古人之學且耕且養今者民丁非役之日農畝時候之餘若敦以學業勸以經禮自可家慕大道人希至德豈止知禮節識廉恥父慈子孝兄恭弟順者乎始自京師爰及州郡宜祗朕意勸學行禮自是天下州縣皆置博士習禮焉昂在州甚有惠政數年卒官子調起家祕書郎尋轉侍御史左僕射楊素嘗於朝堂見調因獨言曰柳條通體弱獨搖不須風調斂板正色曰調信無取者公不當以為侍御史調信有可取不應發此言公當具瞻之秋樞機何可輕發素甚奇之煬帝嗣位纍遷尚書左司郎時王綱不振朝士多贓貨唯調清素守常為時所美然於幹用非其所長史臣曰韋氏自居京兆代有人物世康昆季餘慶所鍾或入處禮闈或出總方嶽朱輪接軫旟斾成陰在周暨隋勳庸並茂盛矣建安風韻間雅望重當時述恃寵驕人終致傾敗旦屢有惠政肅每存誠讜雄亮名節自立忠正見稱謇之神情開爽頗為疏放文城歷仕二朝咸見推重獻書高祖遂興學校言能弘道其利博哉

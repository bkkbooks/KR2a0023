body:
  text: 隋書卷六十七列傳第三十二虞世基虞世基字茂世會稽餘姚人也父荔陳太子中庶子世基幼沉靜喜慍不形於色博學有高才兼善草隸陳中書令孔奐見而歎曰南金之貴屬在斯人少傅徐陵聞其名召之世基不往後因公會陵一見而奇之顧謂朝士曰當今潘陸也因以弟女妻焉仕陳釋褐建安王法曹參軍事歷祠部殿中二曹郎太子中舍人遷中庶子散騎常侍尚書左丞陳主嘗於莫府山校獵令世基作講武賦於坐奏之曰夫玩居常者未可論匡濟之功應變通者然後見帝王之略何則化有文質進讓殊風世或澆淳解張纍務雖復順紀合符之后望雲就日之君且修戰於版泉亦治兵於丹浦是知文德武功蓋因時而並用經邦創制固與俗而推移所以樹鴻名垂大訓拱揖百靈包舉六合其唯聖人乎鶉火之歲皇上御宇之四年也萬物交泰九有乂安俗躋仁壽民資日用然而足食足兵猶載懷於履薄可久可大尚懍乎於御朽至如昆吾遠賮肅慎奇賝史不絶書府無虛月貝胄雍弧之用犀渠闕鞏之殷鑄名劍於尚方積雕戈於武庫熊羆百萬貔豹千羣利盡五材威加四海爰於農隙有事春搜舍爵策勳觀使臣之以禮沮勸賞罰乃示民以知禁盛矣哉信百王之不易千載之一時也昔上林從幸相如於是頌德長楊校獵子雲退而為賦雖則體物緣情不同年而語矣英聲茂實蓋可得而言焉其辭曰惟則天以稽古統資始於羣分膺録圖而出震樹司牧以為君既濟寬而濟猛亦乃武而乃文北怨勞乎殷履南伐盛於唐勛彼周干與夏戚粵可得而前聞我大陳之創業乃撥亂而為武戡定艱難平一區宇從喋喋之樂推爰蒼蒼而再補故纍仁以積德諒重規而襲矩惟皇帝之休烈體徇齊之睿哲敷九疇而咸奄四海而有截既搜揚於帝難又文思之安安幽明請吏俊乂在官御璇璣而七政辨朝玉帛而萬國歡昧旦丕顯未明思治道藏往而知來功參天而兩地運聖人之上德盡生民之能事於是禮暢樂和刑清政肅西暨析支東漸蟠木罄圖諜而效祉漏川泉而禔福在靈貺而必臻亦何思而不服雖至治之隆平猶戒國而強兵選羽林於六郡詔蹶張於五營兼折衝而餘勇咸重義而輕生遂乃因農隙以教民在春搜而習戰命司馬以示法帥掌固而清甸導旬始以前驅伏鉤陳而後殿抗鳥旌於析羽飾魚文於被練爾乃革軒按轡玉虬齊鞅屯左矩以啓行擊右鍾而傳響交雲罕之掩映紛劍騎而來往指攝提於斗極洞閶闔之弘敝跨玄武而東臨款黃山而北上隱圓闕之迢遰屆方澤之塏爽于斯時也青春晚候朝陽明岫日月光華煙雲吐秀澄波瀾於江海靜氛埃於宇宙乘輿乃御太一之玉堂授軍令於紫房蘊龍韜之妙算誓武旅於戎場鋭金顏於庸蜀躪鐵騎於漁陽彀神弩而持滿彏天弧而並張曳虹旗之正正振夔鼓之鏜鏜八陳肅而成列六軍儼以相望拒飛梯於縈帶聳樓車於武岡或掉鞅而直指乍交綏而弗傷裁應變而蛇擊俄蹈厲以鷹揚中小枝於戟刃徹蹲札於甲裳聊七縱於孟獲乃兩擒於卞莊始軒軒而鶴舉遂離離以雁行振川谷而橫八表蕩海嶽而耀三光諒窈冥之不測羌進退而難常亦有投石扛鼎超乘挾輈衝冠聳劍鐵楯銅頭熊渠殪兕武勇操牛雖任鄙與賁育故無得而為仇九攻既決三略已周鳴鐲振響風卷電收於是勇爵班金奏設登元凱而陪位命方邵而就列三獻式序八音未闋舞干戚而有豫聽鼓鞞而載悅俾挾纊與投醪咸忘軀而殉節方席卷而橫行見王師之有征登燕山而戮封豕臨瀚海而斬長鯨望雲亭而載蹕禮升中而告成實皇王之神武信蕩蕩而難名者也陳主嘉之賜馬一匹及陳滅歸國為通直郎直內史省貧無産業每傭書養親怏怏不平嘗為五言詩以見意情理悽切世以為工作者莫不吟詠未幾拜內史舍人煬帝即位顧遇彌隆祕書監河東柳顧言博學有才罕所推謝至是與世基相見歎曰海內當共推此一人非吾儕所及也俄遷內史侍郎以母憂去職哀毀骨立有詔起令視事拜見之日殆不能起帝令左右扶之哀其羸瘠詔令進肉世基食輒悲哽不能下帝使謂之曰方相委任當為國惜身前後敦勸者數矣帝重其才親禮逾厚專典機密與納言蘇威左翊衛大將軍宇文述黃門侍郎裴矩御史大夫裴蘊等參掌朝政于時天下多事四方表奏日有百數帝方凝重事不庭決入閣之後始召世基口授節度世基至省方為勑書日且百紙無所遺謬其精審如是遼東之役進位金紫光祿大夫後從幸雁門帝為突厥所圍戰士多敗世基勸帝重為賞格親自撫循又下詔停遼東之事帝從之師乃復振及圍解勳格不行又下伐遼之詔由是言其詐衆朝野離心帝幸江都次鞏縣世基以盜賊日盛請發兵屯洛口倉以備不虞帝不從但答云卿是書生定猶恇怯于時天下大亂世基知帝不可諫止又以高熲張衡等相繼誅戮懼禍及己雖居近侍唯諾取容不敢忤意盜賊日甚郡縣多沒世基知帝惡數聞之後有告敗者乃抑損表狀不以實聞是後外間有變帝弗之知也嘗遣太僕楊義臣捕盜於河北降賊數十萬列狀上聞帝歎曰我初不聞賊頓如此義臣降賊何多也世基對曰鼠竊雖多未足為慮義臣剋之擁兵不少久在閫外此最非宜帝曰卿言是也遽追義臣放其兵散又越王侗遣太常丞元善達間行賊中詣江都奏事稱李密有衆百萬圍逼京都賊據洛口倉城內無食若陛下速還烏合必散不然者東都決沒因歔欷鳴咽帝為之改容世基見帝色憂進曰越王年小此輩誑之若如所言善達何緣來至帝乃勃然怒曰善達小人敢廷辱我因使經賊中向東陽催運善達遂為羣盜所殺此後外人杜口莫敢以賊聞奏世基貌沉審言多合意是以特見親愛朝臣無與為比其繼室孫氏性驕淫世基惑之恣其奢靡雕飾器服無復素士之風孫復攜前夫子夏侯儼入世基舍而頑鄙無賴為其聚斂鬻官賣獄賄賂公行其門如市金寶盈積其弟世南素國士而清貧不立未曾有所贍由是為論者所譏朝野咸共疾怨宇文化及殺逆也世基乃見害焉長子肅好學多才藝時人稱有家風弱冠早沒肅弟熙大業末為符璽郎次子柔晦並宣義郎化及將亂之夕宗人虞伋知而告熙曰事勢以然吾將濟卿南渡且得免禍同死何益熙謂伋曰棄父背君求生何地感尊之懷自此訣矣及難作兄弟競請先死行刑人於是先世基殺之裴蘊裴蘊河東聞喜人也祖之平梁衛將軍父忌陳都官尚書與吳明徹同沒于周賜爵江夏郡公在隋十餘年而卒蘊性明辨有吏幹在陳仕歷直閣將軍興寧令蘊以其父在北陰奉表於高祖請為內應及陳平上悉閲江南衣冠之士次至蘊上以為夙有向化之心超授儀同左僕射高熲不悟上旨進諫曰裴蘊無功於國寵踰倫輩臣未見其可上又加蘊上儀同熲復進諫上曰可加開府熲乃不敢復言即日拜開府儀同三司禮賜優洽歷洋直棣三州刺史俱有能名大業初考績連最煬帝聞其善政徵為太常少卿初高祖不好聲技遣牛弘定樂非正聲清商及九部四之色皆罷遣從民至是蘊揣知帝意奏括天下周齊梁陳樂家子弟皆為樂戶其六品已下至于民庶有善音樂及倡優百戲者皆直太常是後異技淫聲咸萃樂府皆置博士弟子遞相教傳增益樂人至三萬餘帝大悅遷民部侍郎于時猶承高祖和平之後禁網疏闊戶口多漏或年及成丁猶詐為小未至於老已免租賦蘊歷為刺史素知其情因是條奏皆令貌閲若一人不實則官司解職鄉正里長皆遠流配又許民相告若糾得一丁者令被糾之家代輸賦役是歲大業五年也諸郡計帳進丁二十四萬三千新附口六十四萬一千五百帝臨朝覽狀謂百官曰前代無好人致此罔冒今進民戶口皆從實者全由裴蘊一人用心古語云得賢而治驗之信矣由是漸見親委拜京兆贊治發擲纖毫吏民懾憚未幾擢授御史大夫與裴矩虞世基參掌機密蘊善候伺人主微意若欲罪者則曲法順情鍛成其罪所欲宥者則附從輕典因而釋之是後大小之獄皆以付蘊憲部大埋莫敢與奪必稟承進止然後決斷蘊亦機辨所論法理言若懸河或重或輕皆由其口剖析明敏時人不能致詰楊玄感之反也帝遣蘊推其黨與謂蘊曰玄感一呼而從者十萬益知天下人不欲多多即相聚為盜耳不盡加誅則後無以勸蘊由是乃峻法治之所戮者數萬人皆籍沒其家帝大稱善賜奴婢十五口司隸大夫薛道衡以忤意獲譴蘊知帝惡之乃奏曰道衡負才恃舊有無君之心見詔書每下便腹非私議推惡於國妄造禍端論其罪名似如隱昧源其情意深為悖逆帝曰然我少時與此人相隨行役輕我童稚共高熲賀若弼等外擅威權自知罪當誣及我即位懷不自安賴天下無事未得反耳公論其逆妙體本心於是誅道衡又帝問蘇威以討遼之策威不願帝復行且欲令帝知天下多賊乃詭答曰今者之役不願發兵但詔赦羣盜自可得數十萬遣關內奴賊及山東歷山飛張金稱等頭別為一軍出遼西道諸河南賊王薄孟讓等十餘頭並給舟楫浮滄海道必喜於免罪競務立功一歲之間可滅高麗矣帝不懌曰我去尚猶未克鼠竊安能濟乎威出後蘊奏曰此大不遜天下何處有許多賊帝悟曰老革多姦將賊脅我欲搭其口但隱忍之誠極難耐蘊知上意遣張行本奏威罪惡帝付蘊推鞫之乃處其死帝曰未忍便殺遂父子及孫三世並除名蘊又欲重己權勢令虞世基奏罷司隸刺史以下官屬增置御史百餘人於是引致姦黠共為朋黨郡縣有不附者陰中之于時軍國多務凡是興師動衆京都留守及與諸蕃互市皆令御史監之賓客附隸遍於郡國侵擾百姓帝弗之知也以渡遼之役進位銀青光祿大夫及司馬德戡將為亂江陽長張惠紹夜馳告之蘊共惠紹謀欲矯詔發郭下兵民盡取榮公來護兒節度收在外逆黨宇文化及等仍發羽林殿腳遣范富婁等入自西苑取梁公蕭巨及燕王處分扣門援帝謀議已定遣報虞世基世基疑反者不實抑其計須臾難作蘊嘆曰謀及播郎竟誤人事遂見害子愔為尚輦直長亦同日死裴矩裴矩字弘大河東聞喜人也祖他魏都官尚書父訥之齊太子舍人矩繈褓而孤及長好學頗愛文藻有智數世父讓之謂矩曰觀汝神識足成才士欲求官達當資幹世之務矩始留情世事齊北平王貞為司州牧辟為兵曹從事轉高平王文學及齊亡不得調高祖為定州總管召補記室甚親敬之以母憂去職高祖作相遣使者馳召之參相府記室事及受禪遷給事郎奏舍人事伐陳之役領元帥記室既破丹陽晉王廣令矩與高熲收陳圖籍明年奉詔巡撫嶺南未行而高智慧汪文進等相聚作亂吳越道閉上難遣矩行矩請速進上許之行至南康得兵數千人時俚帥王仲宣逼廣州遣其所部將周師舉圍東衡州矩與大將軍鹿願赴之賊立九柵屯大庾嶺共為聲援矩進擊破之賊懼釋東衡州據原長嶺又擊破之遂斬師舉進軍自南海援廣州仲宣懼而潰散矩所綏集者二十餘州又承制署其渠帥為刺史縣令及還報上大悅命升殿勞苦之顧謂高熲楊素曰韋洸將二萬兵不能早度嶺朕每患其兵少裴矩以三千敝卒徑至南康有臣若此朕亦何憂以功拜開府賜爵聞喜縣公賚物二千段除民部侍郎尋遷內史侍郎時突厥強盛都藍可汗妻大義公主即宇文氏之女也由是數為邊患後因公主與從胡私通長孫晟先發其事矩請出使説都藍顯戮宇文氏上從之竟如其言公主見殺後都藍與突利可汗搆難屢犯亭鄣詔太平公史萬歲為行軍總管出定襄道以矩為行軍長史破達頭可汗於塞外萬歲被誅功竟不録上以啓民可汗初附令矩撫慰之還為尚書左丞其年文獻皇后崩太常舊無儀注矩與牛弘據齊禮參定之轉吏部侍郎名為稱職煬帝即位營建東都矩職修府省九旬而就時西域諸蕃多至張掖與中國交市帝令矩掌其事矩知帝方勤遠略諸商胡至者矩誘令言其國俗山川險易撰西域圖記三卷入朝奏之其序曰臣聞禹定九州導河不踰積石秦兼六國設防止及臨洮故知西胡雜種僻居遐裔禮教之所不及書典之所罕傳自漢氏興基開拓河右始稱名號者有三十六國其後分立乃五十五王仍置校尉都護以存招撫然叛服不屢經征戰後漢之世頻廢此官雖大宛以來略知戶數而諸國山川未有名目至如姓氏風土服章物産全無纂録世所弗聞復以春秋遞謝年代久遠兼並誅討互有興亡或地是故邦改從今號或人非舊類因襲昔名兼復部民交錯封疆移改戎秋音殊事難窮驗于闐之北蔥嶺以東考于前史三十餘國其後更相屠滅僅有十存自餘淪沒掃地俱盡空有丘墟不可記識皇上膺天育物無隔華夷率土黔黎莫不慕化風行所及日入以來職貢皆通無遠不至臣既因撫納監知關市尋討書傳訪採胡人或有所疑即詳衆口依其本國服飾儀形王及庶人各顯容止即丹青模寫為西域圖記共成三卷合四十四國仍別造地圖窮其要害從西頃以去北海之南縱橫所亘將二萬里諒由富商大賈周遊經涉故諸國之事罔不遍知復有幽荒遠地卒訪難曉不可憑虛是以致闕而二漢相踵西域為傳戶民數十即稱國王徒有名號乃乖其實今者所編皆餘千戶利盡西海多産珍異其山居之屬非有國名及部落小者多亦不載發自敦煌至于西海凡為三道各有襟帶北道從伊吾經蒲類海鐵勒部突厥可汗庭度北流河水至拂菻國達于西海其中道從高昌焉耆龜茲疏勒度蔥嶺又經鏺汗蘇對沙那國康國曹國何國大小安國穆國至波斯達于西海其南道從鄯善于闐朱俱波喝槃陀度蔥嶺又經護密吐火羅挹怛忛延漕國至北婆羅門達于西海其三道諸國亦各自有路南北交通其東女國南婆羅門國等並隨其所往諸處得達故知伊吾高昌鄯善並西域之門戶也總湊敦煌是其咽喉之地以國家威德將士驍雄泛濛汜而揚旌越昆崙而躍馬易如反掌何往不至但突厥吐渾分領羌胡之國為其擁遏故朝貢不通今並因商人密送誠款引領翹首願為臣妾聖情含養澤及普天服而撫之務存安輯故皇華遣使弗動兵車諸蕃既從渾厥可滅混一戎夏其在茲乎不有所記無以表威化之遠也帝大悅賜物五百段每日引矩至御坐親問西方之事矩盛言胡中多諸寶物吐谷渾易可並吞帝由是甘心將通西域四夷經略咸以委之轉民部侍郎未視事遷黃門侍郎帝復令矩往張掖引致西蕃至者十餘國大業三年帝有事於嶽咸來助祭帝將巡河右復令矩往敦煌矩遣使説高昌王麴伯雅及伊吾吐屯設等啖以厚利導使入朝及帝西巡次燕支山高昌王伊吾設等及西蕃胡二十七國謁於道左皆令佩金玉被錦罽焚香奏樂歌喧譟復令武威張掖士女盛飾縱觀騎乘填咽周亘數十里以示中國之盛帝見而大悅竟破吐谷渾拓地數千里並遣兵戍之每歲委輸巨億萬計諸蕃懾懼朝貢相續帝謂矩有綏懷之略進位銀青光祿大夫其冬帝至東都矩以蠻夷朝貢者多諷帝令都下大戲徵四方奇技異藝陳於端門街衣錦綺珥金翠者以十數萬又勒百官及民士女列坐棚閣而縱觀焉皆被服鮮麗終月乃罷又令三市店肆皆設帷帳盛列酒食遣掌蕃率蠻夷與民貿易所至之處悉令邀延就坐醉飽而散蠻夷嗟歎謂中國為神仙帝稱其至誠顧謂宇文述牛弘曰裴矩大識朕意凡所陳奏皆朕之成算未發之頃矩輒以聞自非奉國用心孰能若是帝遣將軍薛世雄城伊吾令矩共往經略矩諷諭西域諸國曰天子為蕃人交易懸遠所以城伊吾耳咸以為然不復來競及還賜錢四十萬矩又白狀令反間射匱潛攻處羅語在西突厥傳後處羅為射匱所迫竟隨使者入朝帝大悅賜矩以貂裘及西域珍器從帝巡于塞北幸啓民帳時高麗遣使先通于突厥啓民不敢隱引之見帝矩因奏狀曰高麗之地本孤竹國也周代以之封于箕子漢世分為三郡晉氏亦統遼東今乃不臣別為外域故先帝疾焉欲征之久矣但以楊諒不肖師出無功當陛下之時安得不事使此冠帶之境仍為蠻貊之鄉乎今其使者朝於突厥親見啓民合國從化必懼皇靈之遠暢慮後伏之先亡脅令入朝當可致也帝曰如何矩曰請面詔其使放還本國遣語其王今速朝覲不然者當率突厥即日誅之帝納焉高元不用命始建征遼之策王師臨遼以本官領武賁郎將明年復從至遼東兵部侍郎斛斯政亡入高麗帝令矩兼掌兵事以前後渡遼之役進位右光祿大夫于時皇綱不振人皆變節左翊衛大將軍宇文述內史侍郎虞世基等用事文武多以賄聞唯矩守常無贓穢之響以是為世所稱還至涿郡帝以楊玄感初平令矩安集隴右因之會寧存問曷薩那部落遣闕達度設寇吐谷渾頻有虜獲部落致富還而奏狀帝大賞之後從師至懷遠鎮詔護北蕃軍事矩以始畢可汗部衆漸盛獻策分其勢將以宗女嫁其弟叱吉設拜為南面可汗叱吉不敢受始畢聞而漸怨矩又言於帝曰突厥本淳易可離間但由其內多有羣胡盡皆桀黠教導之耳臣聞史蜀胡悉尤多姦計幸於始畢請誘殺之帝曰善矩因遣人告胡悉曰天子大出珍物今在馬邑欲共蕃內多作交關若前來者即得好物胡悉貪而信之不告始畢率其部落盡驅六畜星馳爭進冀先互市矩伏兵馬邑下誘而斬之詔報始畢曰史蜀胡悉忽領部落走來至此云背可汗請我容納突厥既是我臣彼有背叛我當共殺今已斬之故令往報始畢亦知其狀由是不朝十一年帝北巡狩始畢率騎數十萬圍帝於雁門詔令矩與虞世基每宿朝堂以待顧問及圍解從至東都屬射匱可汗遣其猶子率西蕃諸胡朝貢詔矩宴接之尋從幸江都宮時四方盜賊蜂起郡縣上奏者不可勝計矩言之帝怒遣矩詣京師接候蕃客以疾不行及義兵入關帝令虞世基就宅問矩方略矩曰太原有變京畿不靜遙為處分恐失事機唯願鑾輿早還方可平定矩復起視事俄而驍衛大將軍屈突通敗問至矩以聞帝失色矩素勤謹未嘗忤物又見天下方亂恐為身禍其待遇人多過其所望故雖至厮役皆得其歡心時從駕驍果數有逃散帝憂之以問矩矩答曰方今車駕留此已經二年驍果之徒盡無家口人無匹合則不能久安臣請聽兵士於此納室帝大喜曰公定多智此奇計也因令矩檢校為將士等娶妻矩召江都境內寡婦及未嫁女皆集宮監又召將帥及兵等恣其所取因聽自首先有姦通婦女及尼女冠等並即配之由是驍果等悅咸相謂曰裴公之惠也宇文化及之亂矩晨起將朝至坊門遇逆黨數人控矩馬詣孟景所賊皆曰不關裴黃門既而化及從百餘騎至矩迎拜化及慰諭之令矩參定儀注推秦王子浩為帝以矩為侍內隨化及至河北及僭帝位以矩為尚書右僕射加光祿大夫封蔡國公為河北道安撫大使及宇文氏敗為竇建德所獲以矩隋代舊臣遇之甚厚復以為吏部尚書尋轉尚書右僕射專掌選事建德起自羣盜未有節文矩為制定朝儀旬月之間憲章頗備擬於王者建德大悅每咨訪焉及建德渡河討孟海公矩與曹旦等於洺州留守建德敗於武牢羣帥未知所屬曹旦長史李公淹大唐使人魏徵等説旦及齊善行令歸順旦等從之乃令矩與徵公淹領旦及八璽舉山東之地歸于大唐授左庶子轉詹事民部尚書史臣曰世基初以雅淡著名兼以文華見重亡國羇旅特蒙任遇參機衡之職預帷幄之謀國危未嘗思安君昏不能納諫方更鬻官賣獄黷貨無厭顛隕厥身亦其所也裴蘊素懷姦險巧於附會作威作福唯利是視滅亡之禍其可免乎裴矩學涉經史頗有幹局至於恪勤匪懈夙夜在公求諸古人殆未之有與聞政事多歷歲年雖處危亂之中未虧廉謹之節美矣然承望風旨與時消息使高昌入朝伊吾獻地聚糧且末師出玉門關右騷然頗亦矩之由也
